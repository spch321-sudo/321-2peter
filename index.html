妄行的人」（2:18）。換句話說，彼得在這裡最嚴厲的話，是對著誤導人的人說的，同時也在保護被誤導的人。2:21「倒不如不曉得為妙」講的是明明曉得義路、卻故意背棄的人，不是正在掙扎、為自己的跌倒傷痛的人。"]],"con":[],"say":"本講義的立場：沿用希伯來書立場二。本卷補兩點：①1:10 的「堅定不移」是在已有的恩典上活出來的確認，起點仍是 1:3「神的神能已將一切……賜給我們」，「永不失腳」是給殷勤者的應許；②2:20–22 三讀並陳，落點是上下文——這段描述的是假師傅與跟隨他們的人（2:17–19），不是在掙扎中跌倒、仍然想回頭的弟兄姊妹。跌倒的人要同時聽見 1:9「舊日的罪已經得了潔淨」與 3:9「乃願人人都悔改」：主還在等。本講義絕不對任何個人說「你已經沒救了」。","care":"一個會因為害怕自己是那條「轉過來吃」的狗而流淚、失眠的人，正是心還沒有剛硬的人。牧者要記得：寫 2:22 的彼得，自己也曾「轉過去」——三次不認主；但主早就說過「你回頭以後，要堅固你的弟兄」（路 22:32）。回頭有兩種：狗回到嘔吐物，彼得回到主面前。所以講這段時，不要用它嚇唬軟弱的人，也不要輕描淡寫；要把跌倒的人帶回 1:9 與 3:9，陪他禱告、陪他走回群體。檢驗標準只有一個：一位剛跌倒、很想回頭的弟兄聽完，是更想回來，還是更絕望？"},{"id":"ISS00_6","t":"彼得後書與猶大書誰抄誰？","r":"2:1–3:3","ch":[1,2,3],"why":"六、為甚麼這是個問題：把彼得後書 2:1–3:3 和猶大書 4–18 節並排讀，會發現約十九處相似——假師傅偷偷混進來、犯罪的天使、所多瑪與蛾摩拉、毀謗尊位、天使不敢用毀謗的話、像沒有靈性的畜類、巴蘭、無水的雲（井）、墨黑的幽暗、末世好譏誚的人。兩封信顯然有文字上的關係。也有不同：猶大書提到天使長米迦勒與摩西的屍首（猶 9），也引了以諾的預言（猶 14–15）；彼得後書沒有這兩處，卻多了挪亞與羅得兩個被保守的人。問題是：誰在先？這會不會影響彼得後書的權威？","pos":[["猶大書在先（今天多數學者）","","理由：猶大書較短而緊湊，彼得後書像是擴充與調整；彼得後書沒有直接引用以諾一書與摩西屍首的傳說，可能是有意略去讀者不熟或易生誤會的材料；一般認為較長的文本擴充較短的文本，比把較長的刪成較短的更自然。持此說的學者，有的仍主張彼得是作者（彼得可以採用猶大的材料），也有的以此支持託名說。"],["彼得後書在先","","理由：彼後 2:1 說「將來在你們中間也必有假師傅」、3:3 說「在末世必有好譏誚的人」，都用未來式；猶大書則說這些人已經偷著進來了（猶 4），並提醒讀者「要記念我們主耶穌基督之使徒從前所說的話」（猶 17），像是在回顧使徒先前的預言。較早期的一些註釋家持此說。"],["共用一個早期教會的教導材料","","理由：兩封信相似的是主題與例證的次序，但用字相同的地方並不算多；可能兩位作者都使用了早期教會對付假師傅時口傳或成文的一套教導。這個說法解釋了為甚麼兩封信既相似又各有取捨，但這份共同材料沒有留存下來，只能推論。"]],"con":[],"say":"本講義的立場：三說並陳，不裁判。不論誰在先，聖經作者使用其他材料並不減損默示——路加也是先把各樣事從起頭詳細考察過，才寫成福音書（路 1:1–4）。兩封信的分工是：彼得後書講「長進中的分辨」，猶大書講「為真道竭力爭辯」；〔猶〕互見先標經文出處，將來猶大書講義製作時再分工。","care":"對多數會眾來說，知道兩封信很像，反而是一個鼓勵：早期教會不是各說各話，而是兩位主的僕人面對同樣的危險，說出了同樣的警告。這就像兩位牧者在不同地方看見同樣的狼，喊出同樣的話。讀經小組遇到這個題目，不必為「誰抄誰」爭到面紅耳赤；可以把兩段並排讀，看彼得多了甚麼——他多了挪亞與羅得，也多了 2:9「主知道搭救敬虔的人」。彼得講審判，是為了叫敬虔的人安心。另外，也要提醒小組：這個問題與信心的根基無關；不論誰在先，兩封信都在新約裡，兩位作者都把讀者帶回同一位主——「主知道搭救」（彼後 2:9），「那能保守你們不失腳……的我們的救主獨一的神」（猶 24–25）。把力氣放在聽見警告、照自己、彼此堅固，比放在考證先後更能讓人長進。"},{"id":"ISS00_7","t":"彼得後書寫於何時何地？","r":"1:13–15；3:1","ch":[1,2,3],"why":"七、為甚麼這是個問題：信裡沒有直接說寫於何地、何時。我們只知道三件事：作者知道自己「脫離這帳棚的時候快到了」（1:14）；這是寫給同一群讀者的「第二封信」（3:1）；保羅的信已經在各教會流傳（3:15–16）。年代的判斷，和作者問題綁在一起：主張彼得是作者的，必須把寫作放在彼得殉道之前；主張託名的，則多半放在第一世紀末到第二世紀上半。","pos":[["約主後 64–68 年，寫於羅馬，彼得殉道前（本講義採用）","","早期教會的傳統說，彼得在尼祿皇帝逼迫基督徒期間於羅馬殉道，一般推定在主後 64 至 68 年之間。1:14 說主已指示他離世的時候快到了，正對應約 21:18–19；3:1 的「第二封信」若指彼得前書，而彼得前書寄自「巴比倫」（彼前 5:13，多數解經家認為指羅馬），那麼本書也很可能寫於羅馬，時間在彼得前書之後不久、彼得殉道之前。"],["託名說的晚期年代（約主後 80 年至二世紀上半）","","持託名說的學者，理由包括：3:4「列祖睡了」被讀為第一代基督徒已經過世；3:16「他一切的信」似乎預設保羅書信已經被收集；全卷對「主為甚麼還沒來」的關注，被認為反映第一代之後的處境。具體年代各家不同，大約從主後 80 年到二世紀上半都有人主張。"],["對晚期年代理由的回應","","「列祖」在新約最自然指舊約的先祖（來 1:1；徒 3:13），不一定指第一代信徒；保羅在世時就叫教會彼此傳閱他的信（西 4:16），六十年代各教會擁有幾封保羅書信並不奇怪；而「主為甚麼還沒來」的問題，在帖撒羅尼迦前後書（主後五十年代初）就已經出現。這些理由都不足以把年代推到彼得死後。"],["3:1「第二封信」指哪一封","","多數解經家認為指彼得前書，因為兩封信都以提醒、激發讀者為目的；也有學者指出彼得前書的讀者在小亞細亞五個地區（彼前 1:1），彼得後書沒有寫明收信人，所以「第一封信」也可能是一封已經失傳的信。本講義採最自然的讀法：指彼得前書，並在互見中把兩卷連起來讀——前書教人在火裡站穩，後書教人在霧裡看清。"]],"con":[],"say":"本講義的立場：約主後 64–68 年，寫於羅馬，彼得殉道之前不久；託名說的晚期年代並陳。年代無法精確到某一年，講台上不必強調數字，只需要讓會眾知道：這是一位老人臨終前寫的信，寫在尼祿逼迫的陰影下，寫給他放心不下的羊群。","care":"年代這個題目，真正要帶給會眾的不是數字，是畫面：一個知道自己快要被處死的老人，沒有寫自己的回憶錄，也沒有為自己辯護，而是寫信「提醒你們，激發你們」（1:13），最後一句是「願榮耀歸給他」（3:18）。這對每一個面對年老、疾病或人生最後一段路的弟兄姊妹，都是一個榜樣：帳棚要拆了，但還可以為主的羊多說幾句話。牧者可以問會眾：如果你知道時候不多，你最想提醒你所愛的人哪三件事？今天就可以說出口，不必等到帳棚要拆的那一天。"},{"id":"ISS00_8","t":"彼得後書怎樣成為正典？","r":"1:1；3:15–16","ch":[1,2,3],"why":"八、為甚麼這是個問題：彼得前書在早期教會一致被接受，彼得後書卻不是。它在現存二世紀的教父著作中幾乎沒有被明確引用；三世紀的俄利根提到它有人存疑；四世紀初的優西比烏把它列為「有爭議的書卷」。一位認真的信徒會問：既然古人都有疑問，為甚麼今天它在我們的聖經裡？教會是隨便決定的嗎？","pos":[["早期的存疑（本講義誠實交代）","","根據優西比烏《教會史》的記載，俄利根說彼得留下一封公認的書信，「或許還有第二封，但這一封是有疑問的」。優西比烏本人也說，人們傳下來的彼得後書不算公認的書卷，但因為對許多人有益，就與其他經書一同受到重視；他在整理各書卷時，把雅各書、猶大書、彼得後書、約翰二書與三書列為「有爭議」（antilegomena）、但為多數人所知的書卷。耶柔米也提到，許多人因為文體不同而懷疑它。敘利亞教會較早期的譯本起初也沒有收入這封信。"],["逐漸被普遍接受","","四世紀時，主後 367 年亞他那修第 39 封節期書信列出新約二十七卷，彼得後書在其中；北非的希波會議（393 年）與迦太基會議（397 年）也承認同樣的書目。現存最早包含彼得後書的抄本之一是蒲草紙抄本 P72（約三至四世紀），與彼得前書、猶大書抄在一起。此後東西方教會普遍接受它。"],["懷疑者的讀法","","有學者認為，正典化過程本身就說明這封信可疑：如果真是彼得寫的，為甚麼不像彼得前書那樣很早就被公認？它被接受，主要是因為內容正統、對教會有益。"],["福音派的讀法","","早期的存疑正說明教會不是照單全收，而是謹慎地分辨；一封短信流傳較慢、較少被引用，並不奇怪（猶大書、約翰二三書也是如此）。教會不是「製造」正典，而是在長期的使用與分辨中「承認」那些本來就帶有使徒權柄的書卷。"]],"con":[],"say":"本講義的立場：誠實交代彼得後書是早期教會「有爭議的書卷」之一——俄利根提到有疑，優西比烏列為有爭議；也交代它最後被普遍接受——亞他那修 367 年第 39 封節期書信、迦太基會議 397 年。爭議不等於否定，謹慎正是教會分辨的證據。彼得在 3:16 把保羅的信與「別的經書」並列，本身就見證了新約正典在使徒時代已經開始成形。講台不必細述正典史，但教導課程與小組應該讓會眾知道這段歷史，免得他們日後從懷疑者口中第一次聽見。","care":"一位弟兄若在網上第一次讀到「彼得後書差點沒進聖經」，可能會覺得被騙了：怎麼教會從來沒告訴我？所以本講義選擇自己先說。誠實不會傷害信心，隱瞞才會。可以這樣陪他想：古人那麼認真地問、問了那麼久，正好說明今天手上的聖經不是隨便拼湊的；而且這三百年間，彼得後書一直在被許多教會閱讀、得造就。我們接受它，不是因為權威命令我們接受，是因為歷代的聖徒在這封信裡一再聽見主的聲音。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:12–21；3:17–18","ch":[1,2,3],"why":"九、為甚麼這是個問題：讀完前面八條，會眾會發現彼得後書幾乎每一處都有爭議——作者、年代、正典、與猶大書的關係、1:4 的意思、3:10 的異文、2:20–22 的背道。有人因此覺得「連專家都說不清楚，我還能信甚麼」；也有人反過來，覺得承認有爭議就是軟弱，乾脆一概不聽。這一條要回答：這些爭議應該放在信心的哪個位置？又該怎樣陪伴因此動搖的人？","pos":[["爭議動搖根基","","有人認為：只要作者或正典有疑問，整封信的權威就打折扣，甚至整本聖經都不可靠。這個看法把每一個學術問題都當成地基，結果是任何一個新論點都可能讓人的信心崩塌。"],["拒絕面對爭議","","有人認為：信心不需要知道這些，講台也不該提，以免絆倒人。出發點是保護會眾，但會眾遲早會在別處讀到；被保護得太好的人，一碰到問題反而更容易動搖。"],["分層面對（本講義採用）","","把問題分成兩層：一層是信心的根基——主耶穌基督是誰、他為我們成就了甚麼、他必再來；這些不因學術爭議而改變，彼得在 1:16 說這「並不是隨從乖巧捏造的虛言」。另一層是書房裡的功課——作者、年代、異文、文學關係；可以誠實研究、各家並陳，承認有些問題今天沒有定論。"],["爭議是長進的機會","","彼得後書本身就是一封在爭議中寫成的信：有人說「主要降臨的應許在哪裡呢」（3:4），有人強解保羅的信（3:16）。彼得沒有叫讀者停止思想，而是叫他們記念先知的話與使徒的命令（3:2），在認識主上長進（1:8；3:18）。照這個方向，爭議不是信心的敵人，而是逼我們回到經文、回到群體、回到主面前的機會；問得越誠實，根扎得越深。"]],"con":[],"say":"本講義的立場：爭議應該被誠實面對，但不應該動搖信心的根基。彼得後書本身就給了方法：信心建立在親眼見證的主（1:16–18）與聖靈感動的話（1:19–21）上，「如同燈照在暗處」；面對難明白的地方，不強解，在群體中、照上下文、謙卑地讀（3:16）；最後的方向不是更會辯論，而是「在我們主救主耶穌基督的恩典和知識上有長進」（3:18）。本講義在每一條議題上都先並陳各家、再說自己站在哪裡，正是為了示範這種讀法：不怕問題，也不讓問題取代主。","care":"牧者要分辨眼前的人是哪一種：一種是好奇、願意多知道的人，可以陪他讀各家立場；另一種是正在信心危機裡的人，他需要的常常不是更多資料，而是有人陪他禱告、陪他讀福音書，重新看見主。兩種人都不要被嘲笑。彼得自己知道疑惑的滋味——他在水面上往下沉的時候，主「趕緊伸手拉住他」（太 14:31）。爭議不可怕；可怕的是因為爭議離開了群體、離開了主。讓會眾知道：可以帶著問題來教會，教會不是只有答案的地方，也是一起長進的地方。小組長若被問倒了，誠實說「我不知道，我們一起查」，比勉強給答案更能堅固人。"},{"id":"ISS01_1","t":"1:1「我們的神和救主耶穌基督」——新約直稱耶穌為神嗎？","r":"1:1","ch":[1],"why":"一、彼得後書第一節就寫：「寫信給那因我們的神和救主耶穌基督之義，與我們同得一樣寶貴信心的人。」這句話可以讀成一位——「我們的神，也是救主，就是耶穌基督」；也可以讀成兩位——「我們的神（父）和救主耶穌基督（子）」。這不只是文法問題：如果是一位，這節就和約 1:1、20:28、多 2:13 並列，成為新約直接稱耶穌為「神」的經文之一。常有慕道友或剛信主的人問：「聖經哪裡說耶穌是神？耶穌自己不是說父比他大嗎？」這節經文正是答案的一部分。","pos":[["一位（Granville Sharp 規則）","","原文 τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ 是一個冠詞統管兩個單數、非專有名詞的位格稱號，中間以 καί 連接；照十八世紀英國學者 Granville Sharp 歸納的規則，這樣的句型指同一位。多數福音派註釋與新近譯本（如 NIV、ESV）採此讀法，譯作「我們的神和救主耶穌基督」並理解為同一位。最有力的旁證在本卷自己：1:11、2:20、3:18 都用同一個句型「我們主救主耶穌基督」，從來沒有人把那三處讀成兩位。"],["兩位（父與子）","","「我們的神」指父，「救主耶穌基督」指子。理由：緊接著的 1:2 就把「神」和「我們主耶穌」分開來講；西乃抄本等少數抄本在 1:1 作「主」（κυρίου）而不是「神」；KJV 譯作「God and our Saviour Jesus Christ」，可讀成兩位。歷史上神體一位論（Unitarian）傳統也採這個讀法，以避開基督神性的結論。部分持守三一信仰的學者也認為這一節的文法不足以單獨作決定，寧可謹慎。"],["回應與分辨","","1:2 的句型不同：「神和我們主耶穌」中的「耶穌」是專有名詞，不在同一個冠詞之下，所以 1:2 分開兩位，並不推翻 1:1 合為一位。兩節並排，正好顯出三一真理的兩面：子與父有分別（1:2），子又真是神（1:1）。抄本作「主」的是少數，校勘本多採「神」。再看全卷的走向：彼得以「我們的神和救主耶穌基督」開頭（1:1），以「願榮耀歸給他，從今直到永遠」結束（3:18）——那一句頌讚是直接歸給「我們主救主耶穌基督」的。一封信的頭尾都把只屬於神的稱呼與榮耀歸給耶穌，這比任何單一的文法規則都更有分量。"]],"con":[],"say":"本講義的立場：一位。1:1 直稱耶穌為「我們的神和救主」，是新約直稱耶穌為神的經文之一（與約 1:1；20:28；多 2:13 同列）。但講台不在文法上停留太久：Granville Sharp 規則留在書房，帶到講台的是一句話——寫這封信的老漁夫，最後一封信的第一句，就稱那位在海邊叫他名字的耶穌為「我們的神」。1:1 合為一位、1:2 分為兩位，正是三一神「有分別，不分割」的見證。","care":"對慕道友，這節經文不是拿來辯倒他的武器，而是邀請他看見：最早跟隨耶穌、和他一起吃飯捕魚三年的人，最後稱他為神。對信主多年的人，這節提醒我們，信心的對象不是一套道理，而是一位「神和救主」：他有神的權柄，也有救主的溫柔。若有弟兄被別人質問「聖經沒說耶穌是神」而動搖，牧者不必要求他立刻背出希臘文規則，可以陪他讀約 20:28 多馬的那一句「我的主！我的神！」，再讀這一節。也要提醒：與否認基督神性的朋友談話，態度要溫柔謙卑，不是要贏，是要他遇見主。"},{"id":"ISS01_2","t":"1:4「與神的性情有分」——人會不會成為神？","r":"1:4","ch":[1],"why":"二、「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。」這是全卷神學最高的一句，完整的四讀並陳與三條界線已寫在全卷立場組 ISS00_2。本條只處理第 1 章講台上最常遇到的兩個實際問題：會眾聽到「與神的性情有分」，會不會以為人可以修成神？講員怕講偏，會不會乾脆跳過不講？","pos":[["成神論（東正教）","","人藉恩典有分於神的「能力」（energies），不是神的「本質」（essence）；人越來越像神，但永遠是受造者。東正教的成神論並不是說人變成另一位神。本講義尊重這個傳統，準確陳述，不嘲諷。"],["與基督聯合（改革宗、路德宗）","","藉聖靈與基督聯合，有分於他的生命；加爾文說這裡的「性情」是指品質，不是本體。"],["完全的愛（衛斯理傳統）與道德的相似（許多福音派註釋）","","前者看重今生被聖靈充滿到以完全的愛愛神愛人；後者強調有分的是神的聖潔、良善、愛等道德品格，不涉本體。兩者都以下文 1:5–7 那張以愛作結的清單為證。"],["須要辨別的偏差","","某些新興宗教與部分成功神學講員把這節講成「人可以修煉成神」「你就是小神」，這不是上述任何一個主流傳統的意思，四個讀法都不支持；四種讀法的共同點是：沒有一家主流傳統說受造者會成為另一位神。分歧在「有分」的深度與講法，不在要不要守住創造者與受造者的分別。"],["須要辨別的另一個偏差：跳過不講","","另一邊的錯誤比較安靜：講員因為怕被誤會成神祕主義或新興宗教，就把 1:4 輕輕帶過，只講 1:5–7 的「要加上」。結果八個台階失去了根，成了靠意志往上爬的道德課程，會眾聽到的只剩下「你要更努力」。彼得的次序正好相反：先是「又寶貴又極大的應許」，先是「得與神的性情有分」，然後才是「正因這緣故，你們要分外地殷勤」。"]],"con":[],"say":"本講義的立場：採「在基督裡與基督聯合，有分於神的生命與品格」，完整論證見 ISS00_2。第 1 章講台上守住三條界線：創造者與受造者的分別永遠存在；有分是恩典不是修煉（主詞是神，「他已將……應許賜給我們」）；有分的內容就寫在下文——脫離敗壞，加上德行，一直到愛眾人的心。講台不可跳過這一節，因為跳過 1:4，1:5–7 就失去了根。","care":"這節經文對兩種人最要緊。一種是覺得自己一無是處、信主多年仍改變不了的人：神不只赦免他，還要把自己的生命與品格分給他；他的長進不是靠意志撐出來的，是從神的生命裡長出來的。另一種是追求屬靈經歷、想高人一等的人：真正有分於神性情的人，看起來不是更神祕，是更節制、更忍耐、更會愛人。若有會友被「人可以成神」的說法吸引，牧者不要嘲笑他，要問他：你渴慕的是神自己，還是更大的自己？然後帶他讀 1:5–7，看神的性情落在人身上，長出來的是甚麼樣子。"},{"id":"ISS01_3","t":"1:5–7 八個台階有先後次序嗎？","r":"1:5–7","ch":[1],"why":"三、「有了信心，又要加上德行；有了德行，又要加上知識……有了愛弟兄的心，又要加上愛眾人的心。」八項排成一串，很容易被讀成一道樓梯：先把德行做完，才能開始學知識；節制還沒過關，就不配談忍耐。這樣讀，很多人會卡在第二級，一輩子不敢往上看；也有人反過來把它當作成聖的考核表，拿來量別人到了第幾級。還有人注意到這八項和 321 改變觀念的八大步驟同為八項，便想把兩者對在一起。這張清單到底是先後的步驟，還是一串一起長的品格？","pos":[["階梯讀法","","一項完成，才進入下一項，像爬樓梯；次序本身就是靈命成長的路線圖。一些靈修傳統與通俗講道採這個讀法，好處是具體、容易記，但容易把成聖變成關卡制，也與「加上」是慷慨供應的意思不太相合。"],["彼此包含讀法","","介系詞是 ἐν（在……裡面），不是「在……上面」：德行是在信心裡面供應出來的，知識是在德行裡面供應出來的。像一棵樹，枝子從枝幹裡長出來，同時在長，不是八道先後的門。許多註釋家注意到這個結構。"],["修辭連鎖讀法（sorites，連珠法）","","這是古典修辭常見的層遞句型，羅 5:3–5「患難生忍耐，忍耐生老練，老練生盼望」也是這種寫法。起點與終點是刻意安排的，中間的次序有修辭成分，不必一項一項排先後。當時的哲學家也有類似的美德清單，彼得借用了世人熟悉的形式，卻以信心開頭、以愛結尾，裝進福音的內容。"],["首尾讀法（本講義綜合）","","不論中間怎樣排，首尾都不可移動：信心在最前面，因為一切從神分給的信心開始（1:1）；愛在最後面，因為神的性情最完整的樣子就是愛；而且最後兩級都是「愛人」——先愛弟兄，再愛眾人。知識只在第二級，說明認識主若停在腦子裡，長不出節制與忍耐。這個讀法吸收了「彼此包含」與「修辭連鎖」兩說的長處。"]],"con":[],"say":"本講義的立場：起點與終點是確定的，中間是互相扶持的品格，不是八道先後的關卡。起點是信心——是神分給我們的（1:1「同得一樣寶貴信心」）；終點是愛——是神性情最完整的樣子；而整張清單掛在 1:5 開頭的「正因這緣故」上，回指 1:3–4 神已經賜下的一切。這八項是品格的果子；它和 321 改變觀念的八大步驟雖然都是八項，卻是兩回事，不可把這段經文講成那八步的插圖。","care":"這個議題最實際的影響，是一個人怎樣看待自己的軟弱。用階梯讀法的人，常常在某一級跌倒後就覺得「我連節制都沒過，後面都免談了」；彼此包含的讀法告訴他：你可以一邊學節制，一邊學愛人，愛人的操練本身就會幫助你節制。牧者也要提醒，這張清單是拿來照自己的，不是拿來量別人的；小組裡不要互相評分「你在第幾級」。最好的用法是每次只挑一項，求主在你信心裡慷慨地供應它——那一位已經供應你一切的主，會在你裡面供應下一項。"},{"id":"ISS01_4","t":"1:9「忘了他舊日的罪已經得了潔淨」——得救的人會忘記得救嗎？","r":"1:8–9","ch":[1],"why":"四、「人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨。」這節經文讓不少人不安：這個人「舊日的罪已經得了潔淨」，看來是信過主的；可是他「眼瞎」，又「忘了」。一個真正得救的人，會不會忘記自己得救？這是不是說他已經失去了救恩？還是說他從來沒有真正得救？會眾裡那些信主多年、卻越來越冷淡的人，最常問的正是這個問題。","pos":[["實際上的遺忘（許多福音派註釋）","","「忘了」不是記憶喪失，也不是失去救恩，是生活上不再活在恩典裡：知道自己被赦免，卻不再因此感恩、不再因此改變。λήθην λαβών 是「取了遺忘」的慣用語，μυωπάζων 帶著「自己瞇眼」的意思——這種瞎有一半是選擇。藥方在下文：「常常提醒」（1:12）。"],["外表的潔淨（加爾文傳統的一種讀法）","","「得了潔淨」可能指受洗、加入教會的外在潔淨，這個人在外表上屬於群體，但從未真正重生；所以他長不出品格，最後顯出本相。持此讀法的人常把本節與 2:20–22 連起來讀。"],["可能走向離棄（阿米念傳統）","","真信徒若長期忘記恩典、不結果子，可能一步一步走向離棄真道；本節是嚴肅的警告，叫人不可停在原地。持此讀法的人強調 1:10「更加殷勤」的迫切。"],["上下文的線索","","1:9 與 1:12 之間有一條清楚的線：病是「忘了」，藥是「提醒」；1:12 又說收信人「在你們已有的真道上堅固」，彼得是把他們當作真信徒來提醒的。全卷的「記念」線從這裡開始（1:12、13、15；3:1、2、5、8），到 3:5 成了假師傅的「故意忘記」，3:8 又說「不可忘記」。可見彼得最關心的，是讓會忘記的人被提醒回來，而不是替誰宣判。"]],"con":[],"say":"本講義的立場：最自然的讀法是實際上的遺忘——一個被潔淨過的人，忘了恩典，眼睛只盯著近處，所以長不出 1:5–7 的品格。這節經文的目的是診斷與喚醒，不是宣判；藥方就在下一段：「我卻要將這些事常常提醒你們」（1:12）。得救確據與背道的整體立場，見 ISS00_5。","care":"這節經文是給自己的眼科檢查，不是給別人的診斷書。一位冷淡多年的弟兄若問：「我是不是根本沒有得救？」牧者不要急著替他下結論，先陪他「想起來」：你第一次知道自己被赦免是甚麼時候？那時你是怎樣的？主怎樣把你洗淨？彼得自己也是被一次「想起」叫回來的——「彼得便想起主對他所說的話」（路 22:61），而那是因為主先轉過身來看他。所以治療不是更用力地自責，是重新看見主。對一個正在自責、睡不著的人，也要說清楚：會為自己的冷淡難過，本身就說明你還沒有全瞎，主還在叫你。小組也可以一起做這個功課：每個月有一次聚會，不談新的主題，只輪流說「主赦免了我甚麼」。這不是重複，是 1:12 的「常常提醒」；被提醒的人，眼睛會重新看得遠，看見 1:11 那永遠的國。"},{"id":"ISS01_5","t":"1:10「使你們所蒙的恩召和揀選堅定不移」——揀選要靠我們堅定嗎？","r":"1:10–11","ch":[1],"why":"五、「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳。」揀選不是神的事嗎？如果要靠我們「使它堅定」，是不是說神的揀選可以被我們弄丟？反過來，如果揀選本來就不會動搖，為甚麼還要殷勤？這節經文站在加爾文與阿米念兩大傳統的交界上，也直接碰到每一個信徒心裡的問題：我怎麼知道我是真的得救了？","pos":[["確據讀法（改革宗多採）","","神的揀選本身不會動搖；「使之堅定」是讓蒙召在信徒自己的經歷與見證中變得確實。品格是揀選的證據，不是揀選的原因。動詞 ποιεῖσθαι 是關身語態，「為你們自己」使之堅定——對象是你們的確據，不是在神那邊補上甚麼。"],["參與讀法（阿米念傳統多採）","","人的回應真實地參與在神的保守之中；不殷勤，蒙召就可能落空。「永不失腳」是給「若行這幾樣」的人的應許，條件是真實的。部分抄本在此加上「藉著你們的善行」，顯示早期就有人這樣理解，但多數校勘本視為後加的解說。"],["契約讀法","","βέβαιος 在當時的契約文件上指「確實有效的保證」。神的呼召像一份已經成交的約，信徒的生命是讓這份約在世人眼前、也在自己心裡「看得見」的確認書。這個讀法可以和前兩種讀法並存。"],["上下文的平衡","","1:10 夾在兩個「神的供應」中間：前面是 1:3「神的神能已將一切……賜給我們」，後面是 1:11「必叫你們豐豐富富地得以進入」——1:5 那個「加上」的字在 1:11 以被動式再出現：你在這裡慷慨供應，神在那裡慷慨供應。殷勤是被包在恩典裡面的，不是恩典之外的另一條路。"]],"con":[],"say":"本講義的立場：源頭在神，確據在生命。呼召與揀選起於「那用自己榮耀和美德召我們的主」（1:3）；1:5–7 的品格不是買門票，是讓蒙召的人自己看見、也讓人看見這呼召是真的。「永不失腳」用的是希臘文最重的否定 οὐ μή，是應許，不是威脅；而 1:11「豐豐富富地得以進入」的「進入」，原文是被動式——進國的門最後是主親手打開的。得救確據與背道的整體立場，沿用希伯來書立場二，見 ISS00_5。","care":"這節經文對兩種人說不同的話。對一個怕自己不夠好、天天懷疑是否得救的人，它說：你的確據不是靠你撐出來的，源頭在神；你今天會為長進掙扎，正是神在你裡面作工的記號。對一個覺得「反正得救了，怎麼活都可以」的人，它說：真正蒙召的人會殷勤，因為恩典不叫人閒懶。牧者要特別留意前一種人：不要用這節加重他們的焦慮。寫「永不失腳」的人，曾經在水面上往下沉，「耶穌趕緊伸手拉住他」（太 14:31）——確據最後落在那隻手上。小組裡若有人說「我不確定自己是否得救」，不要只叫他「更有信心」；可以陪他一起讀 1:3–11，指出三件事：神已經給了（1:3），你可以開始加上（1:5），門是主打開的（1:11）。然後問他：這一週你想在哪一項上，和我們一起操練？"},{"id":"ISS01_6","t":"1:16「乖巧捏造的虛言」——福音書是神話嗎？","r":"1:16–18","ch":[1],"why":"六、「我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。」第一世紀的人聽過許多神祇化身降臨的故事；今天的人也常說：「耶穌的故事很美，可是那是神話，是後來的信徒編出來的。」大學課堂、網路影片、朋友的閒談裡都有這個聲音。彼得在臨終的信裡特別否認「捏造的虛言」，可見這個指控在使徒時代就有了。福音書記載的是歷史，還是一種宗教神話？","pos":[["解神話化（Bultmann 等）","","二十世紀德國學者布特曼主張，新約是用古代神話式的世界觀寫成的：天堂在上、陰間在下、神蹟與天使介入人間；現代人要除去這層神話外殼，才能聽見其中「呼召人作存在抉擇」的信息。按這個看法，登山變像、復活等記載不必當作歷史事件。"],["宗教史學派","","十九至二十世紀初的一些學者把基督教放在希臘羅馬神祕宗教的脈絡中比較，認為「死而復生的神」「神子降臨」等主題是從周圍的宗教借來的，福音書是信仰群體的神話化創作。後來的研究指出許多所謂相似其實很表面，而且年代多半晚於新約。"],["目擊見證與古代傳記（許多近代學者）","","福音書在文學類型上屬於古代傳記（bios），作者關心的是一個真實人物的言行；英國學者 Richard Bauckham 等人強調福音傳統建立在目擊者的見證上，並且是在目擊者仍然在世時流傳的（這使我們想起林前 15:6 保羅說復活的主顯給五百多弟兄看，「其中一大半到如今還在」）。彼後 1:16 用的 ἐπόπται（親眼目睹的人）、1:18「我們……親自聽見」，正是這種見證的語言。"],["回應：彼得自己的字","","ἐπόπται 在當時的神祕宗教裡，指入門儀式最高一級、被引進內室看見祕密的人；彼得把這個字搶過來用：我們不是入了甚麼祕密的門，是站在山上、用眼睛看見的人。神話在「很久很久以前」發生，沒有人可以查證；彼得卻說出時間、地點與在場的人，而且收信的人之中可能還有人可以去問。這正是神話與見證的分別。"]],"con":[],"say":"本講義的立場：福音書是建立在目擊見證上的歷史記載，不是神話。彼得說得很直接：我們沒有編（σεσοφισμένοις μύθοις 的反面），我們是在場的人——看見了威榮，聽見了聲音，而且是「我們」，三個見證人。基督教是一個站在見證上的信仰，不是站在感覺上的信仰。同時也承認：歷史的證據能叫人看見信心是合理的，卻不能代替聖靈在人心裡的光照（1:19、21）。","care":"一位大學生或年輕的上班族，若在課堂或網路上第一次聽到「福音書是神話」，常常會很慌，又不敢在教會裡問，怕被說成不屬靈。牧者要讓這樣的問題可以被問出來，並且陪他看見：這個指控兩千年前就有了，使徒正面回應過。不需要每個人都成為護教學者，但每個人都可以說「我所信的是有人在場看見的事」。這也提醒我們作見證時不必誇大，不必把自己的故事講得比實際更精彩；照實說主在你身上做過的事，就夠了。"},{"id":"ISS01_7","t":"1:19「更確的預言」——聖經比屬靈經歷更可靠嗎？","r":"1:16–19","ch":[1],"why":"七、彼得剛講完他一生最高的經歷——在聖山上親眼見過主的威榮、親耳聽見天上的聲音——緊接著說：「我們並有先知更確的預言，如同燈照在暗處。」「更確」是比甚麼更確？如果是說聖經比登山變像更可靠，那麼一切屬靈經歷是不是都不足信？如果是說經歷使預言更確，那麼今天的人是不是也要有經歷，聖經才算確實？這個問題直接碰到教會裡兩種常見的張力：一種看重經歷，一種看重真理。","pos":[["比經歷更確","","先知的話比登山變像的經歷更可靠：經歷會過去、會被誤解，聖經長存。古代與宗教改革時期不少註釋採此讀法，用來提醒信徒不要以經歷為準則。"],["經歷使預言更確","","βεβαιότερον 在述語位置，可譯作「我們有先知之言，（如今）更加確定了」：登山變像證實了舊約對彌賽亞榮耀的預言。ESV（more fully confirmed）、NIV（completely reliable）採此方向。上下文「並且我們有」是把見證與聖經連在一起，不是拿兩者比高低。"],["絕對比較級","","比較級在這裡只表示「非常確實」，不與任何東西比較；重點是先知的話值得信靠。"],["燈與晨星的次序","","不論採哪一種讀法，1:19 本身的畫面都很清楚：燈照在 αὐχμηρῷ τόπῳ——又乾又髒的地方，那就是第 2 章假師傅、第 3 章譏誚者所在的世界；燈不是太陽，只照腳前一步；「直等到天發亮，晨星在你們心裡出現」，燈才放下。這個次序本身就說明：今天的經歷與今天的聖經都還是天亮以前的光，真正的全光是主自己。"]],"con":[],"say":"本講義的立場：經歷證實了預言，預言解釋了經歷。彼得不是要拿經歷和聖經比高低，而是說：我們在山上看見的，正好叫先知的話更確定了；你們沒上過山，但你們手裡有這更確的話。所以這節不能用來貶低一切屬靈經歷，更不能用來把經歷放在聖經之上。燈是天亮以前的光——經歷要被燈照亮、被燈檢驗；天亮了，晨星出現，燈才放下。","care":"看重經歷的弟兄姊妹，聽這節經文時要被尊重：彼得自己就是有經歷的人，主在禱告與敬拜中真實的同在不必被嘲笑。看重真理的弟兄姊妹，也要被提醒：彼得沒有說經歷不重要，他是說經歷最後要把人帶回神的話。華人教會常在這裡分成兩邊：一邊說「你們只有頭腦，沒有生命」，一邊說「你們只有感覺，沒有真理」。1:16–19 把兩邊放在同一段經文裡：同一個彼得，上過山，也捧著燈。牧者面對一位說「神親自告訴我……」的會友，不必一開口就否定，可以陪他把那份感動放在燈下照一照：它與經文一致嗎？它叫你更愛主、更愛人嗎？面對一位從來沒有特別經歷、因此覺得自己信心較低的人，可以告訴他：你手裡的那盞燈，和使徒的一樣確實。"},{"id":"ISS01_8","t":"1:20「沒有可隨私意解說的」——平信徒可以自己讀經嗎？","r":"1:20–21","ch":[1],"why":"八、「第一要緊的，該知道經上所有的預言沒有可隨私意解說的」。這節經文常被引用來勸人不要自己讀經：「你沒有讀過神學，會讀錯；聽講台就好。」也有人反過來，把每一個人的讀法都當作同等有效。到底「私意」是指誰的意思——寫經文的先知，還是讀經文的人？這個問題的完整立場已寫在全卷立場組 ISS00_3；本條處理第 1 章經文本身的讀法，以及它在會眾讀經生活中的實際影響。","pos":[["來源讀法","","先知沒有憑自己去「解開」所見的異象；預言不是出於先知自己的解釋。理由是 1:21 以「因為」接續，說明的正是預言的來源：「預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。」ἐπίλυσις（解開）新約只用這一次，γίνεται 講的是預言怎樣產生。許多福音派註釋採此讀法。"],["讀者讀法","","讀者不可憑個人意思解經，需要教會群體或教導權威的引導。天主教傳統常引此節說明教會訓導的角色；部分新教註釋也採此讀法，強調個人主義的讀經容易偏差。"],["聖靈讀法","","預言出於聖靈，所以讀者也需要同一位聖靈光照才能明白；這個讀法把來源與讀法連起來。"],["宗教改革的提醒","","宗教改革把聖經交回會眾手中，譯成百姓的語言，主張聖經的基本信息是清楚的，凡人都可以讀懂得救之道；同時也承認有「難明白的」地方（3:16），需要教會的教導與彼此的幫助。這不是「人人自己說了算」，而是聖經在上、群體同讀、教導者服事。"]],"con":[],"say":"本講義的立場：主要講預言的來源，完整立場見 ISS00_3。1:21 的「因為」把 1:20 解釋清楚：經文不是先知自己想出來、自己解開的。這節不是禁止會眾自己讀經，也不是說只有牧師才能解經。由來源推出讀法：既然經文不是出於人意，讀的人也不可照私意扭曲它（3:16「強解」）；讀經的保護不是把聖經鎖起來，是在群體中讀、照上下文讀、謙卑地讀——像庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11）。","care":"華人教會裡有不少弟兄姊妹，心裡其實很想讀經，卻怕讀錯、怕被說「私意解經」，於是只聽講台、只讀靈修小冊。這節經文若被誤用，就會把他們推得更遠。牧者要做的正好相反：鼓勵每個人打開聖經，同時給他們三個保護——一起讀（小組、讀經伙伴）、照上下文讀（先問這段在說甚麼，再問對我說甚麼）、謙卑地讀（看不懂就問，不急著下結論）。也要提醒講台上的人：會眾能讀出講員沒看見的東西，不是威脅，是聖靈在群體中作工。教會可以為會眾預備簡單的讀經工具：一份讀經進度、一套三個問題的查經法、一個可以發問的小組。讓每一位弟兄姊妹都知道，打開聖經不是越權，是領受；讀錯了可以被修正，不讀才是真正的損失。"},{"id":"ISS01_9","t":"1:21「被聖靈感動」——聖經是怎樣默示的？","r":"1:20–21","ch":[1],"why":"九、「因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。」這節經文與提後 3:16「聖經都是神所默示的」並列，是新約講默示最重要的兩處。可是問題接著來了：如果是聖靈說的，為甚麼保羅、彼得、約翰的文筆都不一樣？先知是像錄音機一樣被動地記下來，還是用自己的話寫？如果有人的成分，會不會有錯？會眾常常不會這樣問出口，但這決定了他打開聖經時，是在讀神的話，還是在讀古人的宗教心得。","pos":[["機械口述說","","聖靈逐字口述，先知只是記錄的工具，像書記抄寫。這個看法要保護聖經每一個字都出於神，但很難解釋各卷書明顯不同的文風、用字、性情與研究過程（例如路 1:1–4 路加說他是「詳細考察」之後才寫的）。今天很少有學者真正持這個看法，卻常被誤以為是保守派的立場。"],["有機的完全默示（Warfield、Bavinck 等）","","聖靈使用作者的整個人——性情、經歷、語言、研究——使他們所寫的正是神要說的話，而且是完全的、可信的。φερόμενοι（被帶著）這個字，這使我們想起徒 27:15 保羅的船「任風颳去」用的同一個字：帆是人的，風是神的。人沒有失去自己，主詞仍然是「人……說出」；但推動與方向來自神。"],["思想默示或部分默示","","有人主張只有思想被默示，字句是人自己選的；也有人主張只有關乎救恩的部分被默示，歷史與科學細節可能有誤。這些看法想給人的成分更大的空間，但與 1:21「說出神的話來」及主耶穌對經文的態度不太相合。"],["新正統的讀法（巴特等）","","聖經是人對神啟示的見證，當聖靈藉著它向人說話時，它「成為」神的話。這個看法強調聖經的動態與相遇，但容易使聖經本身的權威依賴於讀者的經歷。"]],"con":[],"say":"本講義的立場：有機的完全默示。聖靈使用先知的整個人，使他們所說的正是「神的話」；所以聖經有人的聲音、人的文風，也完全是神的話，值得完全信靠。1:21 的焦點是來源：預言「從來沒有出於人意」。也因為同一位聖靈當初帶著先知說話，今天也帶著讀經的人明白——聖靈是我的引導，聖經是我的準則，兩者從同一個方向來。","care":"這個議題影響的是一個人怎樣捧著聖經。若他以為聖經只是古人的宗教心得，讀到難處就會自己刪改；若他以為聖經是從天上掉下來、與人無關的書，就會忽略歷史背景，把經文斷章取義。有機默示讓人兩樣都看見：這是一封真實的人寫給真實處境的信，也是神今天對我說的話。牧者可以鼓勵會眾讀經時先問「當時的讀者聽見甚麼」，再問「神今天對我說甚麼」；遇到看不懂、甚至覺得矛盾的地方，不必驚慌，也不必硬解，可以帶到小組一起查考，或先放在禱告裡。信靠聖經，不是因為我們已經解決了每一個問題，而是因為我們認識那位說話的神。"},{"id":"ISS02_1","t":"2:1 今天誰是假師傅？","r":"2:1–3；2:10–19","ch":[2],"why":"一、2:1 說：「從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認，自取速速的滅亡。」今天網路上有大量「揭露假師傅」的影片與文章，常常直接點出某位牧者、某個教會或某種神學。會友讀完第 2 章，最自然的問題是：那今天誰是假師傅？我可以、也應該把名字說出來嗎？反過來，如果甚麼都不說，會不會等於縱容錯謬？","pos":[["歷史讀法：彼得針對的是一世紀的具體群體","","許多註釋家強調，彼得描寫的是讀者身邊一群具體的教師：他們否認主再來與審判（3:4），以「自由」為名放縱情慾（2:19），又在愛筵中取利（2:13）。這個讀法提醒我們不要把古代的描寫隨手貼在今天的人身上；它的長處是尊重處境，弱點是若只停在歷史，經文就不再對今天說話。"],["名單式分辨：把今天符合描述的人點出來","","部分護教事工與網路頻道認為，既然聖經點出假師傅，今天也應該公開點名，好保護信徒。他們的關切是真實的——確實有人受害。但這個做法常常把次要教義的分歧升級為「假師傅」，又讓沒有受過訓練的人在不完整的資訊下作判決，結果製造了更多的分裂與傷害。"],["記號式分辨（本講義採用，見 ISS00_3）","","彼得給的是五個記號，都是果子：對基督——不承認買他們的主（2:1）；對金錢——貪心、捏造言語取利（2:3、14–15）；對身體——隨肉身放縱情慾（2:10、14、18）；對權柄——膽大任性、輕慢（2:10）；對自由——應許人自由，自己卻作奴僕（2:19）。這使我們想起主的話：「憑著他們的果子，就可以認出他們來。」（太 7:16）記號是給每個信徒用來分辨、也用來照自己的。"],["分層分辨：先分清錯誤的層級","","不少牧者提醒：教會裡的分歧至少有三層。第一層是否認基督與福音核心的錯謬，2:1「不承認買他們的主」屬於這一層；第二層是生活與金錢的敗壞，2:3、2:14 屬於這一層；第三層是聖徒之間對洗禮、聖靈恩賜、末世次序等次要問題的不同理解。把第三層的分歧當作 2:1 的「假師傅」，本身就違背了 2:1 的嚴肅。"]],"con":[],"say":"本講義的立場：講台教記號，不給名單（回指 ISS00_3）。本條補兩點：①分清層級——2:1 的「假師傅」指否認主、敗壞生活、把人當貨的教師，不是與我們在次要問題上看法不同的弟兄；②處理有程序——遇到身邊真實的錯謬或侵害，照主的次序先私下指出（太 18:15–17），對長老的控告「非有兩三個見證就不要收」（提前 5:19），經查證屬實的，在教會的程序中公開處理（提前 5:20）；不在網路上獵巫，也不因怕衝突而包庇。分辨的第一步，永遠是把五個記號先照在自己身上。","care":"這個議題最容易傷害兩種人。一種是受過屬靈傷害的人：他們需要聽見，教會不會用「不要論斷」叫他們閉嘴，他們的經歷值得被認真對待、被照程序處理。另一種是愛上「揭露」的人：一個人若每天看別人的錯，自己的心會慢慢變硬、變冷，最後只剩懷疑，忘記了 2:9「主知道搭救敬虔的人」。牧者要陪前者找到安全的出口，也要溫柔地提醒後者：彼得寫第 2 章，是一個被主拉回來的人在呼喊，不是一個檢察官在起訴。分辨的目的是自己不墜落（3:17），也把迷路的人找回來，不是證明自己站在對的一邊。"},{"id":"ISS02_2","t":"2:1「連買他們的主」——基督為不信的人死了嗎？","r":"2:1；參 3:9","ch":[2,3],"why":"二、2:1 說假師傅「連買他們的主他們也不承認」。「買」ἀγοράσαντα 是奴隸市場付價的字，「主」δεσπότης 是有產權的主人。如果主「買」了這些最後「自取速速的滅亡」的人，那基督是不是也為最後沉淪的人死了？這一節因此成為「有限救贖」與「普遍救贖」之爭中常被引用的經文；一位認真讀經的弟兄若同時聽到兩邊的講法，會問：到底哪一邊才合聖經？","pos":[["普遍救贖（阿米念、衛斯理傳統，也有部分路德宗）","","這一派認為本節最直接的讀法就是：基督確實為這些假師傅付了價，他們卻否認這位主，所以沉淪。這與約一 2:2「他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪」、提前 2:6「捨自己作萬人的贖價」相合；3:9「不願有一人沉淪」也指向同一個方向。救贖之功是真實地為眾人預備的，卻可以被人拒絕。"],["有限救贖之一：照他們自己的認信說話","","許多改革宗註釋家認為，彼得是照假師傅自己的宣稱、也照群體眼中的樣子說話：他們口稱被主買贖、在教會中有位分，卻否認這位主。就像說「他們從我們中間出去，卻不是屬我們的」（約一 2:19）——在外表上屬於，在實際上不屬於。主為「羊」捨命（約 10:11），這一節不足以推翻這個框架。"],["有限救贖之二：盟約之主的語言","","另一些改革宗學者指出，δεσπότης 在新約多指父神或作為主權者的主，而申 32:6 稱神是「將你買來」以色列全體的那一位——那是盟約群體被神擁有的語言，不是講每一個人蒙揀選的救贖。彼得把假先知（以色列中）與假師傅（教會中）並列，正是在用這個盟約框架：他們屬於被買的群體，卻背叛了群體的主。"],["足夠於眾人、有效於信者（亞目拉督派與部分溫和改革宗）","","這一派試圖兼顧兩邊：基督的死在價值上足夠所有人，福音可以真誠地向所有人傳；在神的旨意與效果上，只在信的人身上生效。按這個讀法，2:1 的「買」指前者，假師傅是拒絕了一份真實為他們預備的贖價。"]],"con":[],"say":"本講義的立場：這一節兩派都讀得通，不宜單憑它在講台上裁決救贖的範圍（見 blk 2:1 的「最好的理解」）。彼得在這裡要量的不是救贖的範圍，而是罪的深度——他們否認的是一位已經付了價的主人。各派都同意三件事：基督的死是真實的付價；假師傅在群體裡面，口稱屬主；人若否認主，自取滅亡。講台的落點不是「他們是不是被買的」，而是「我是不是活得像被買來的人」：「因為你們是重價買來的。所以，要在你們的身子上榮耀神。」（林前 6:20）","care":"救贖範圍的爭論，最好在書房和查經班裡慢慢談，不要變成教會裡互相貼標籤的戰場；兩邊都有敬虔愛主、為福音擺上一生的人。牧者若遇到一位因為這個問題而不安的弟兄——他可能擔心「主到底有沒有為我死」——要把他帶到 3:9 與約 6:37「到我這裡來的，我總不丟棄他」：不論哪一派，都同意來到主面前的人不會被拒絕。爭論可以留著，但一個人此刻就可以回應那位付了價的主。"},{"id":"ISS02_3","t":"2:3「貪心……取利」——傳道人的錢、成功神學與教會財務該怎樣看？","r":"2:3；2:13–15","ch":[2],"why":"三、2:3 說：「他們因有貪心，要用捏造的言語在你們身上取利。」2:14–15 又說他們「心中習慣了貪婪」，隨從「貪愛不義之工價」的巴蘭。華人教會裡，錢的話題常常兩極：一邊有人把傳道人領薪水、教會募款都看成可疑；另一邊有講台宣講「奉獻多少就得回多少倍」的興盛福音，或是財務長年不公開。會友會問：傳道人到底可不可以靠事奉生活？成功神學是不是 2:3 講的那種貪心？教會的錢應該怎樣管？","pos":[["興盛福音（成功神學）的主張","","持這種講法的人引用約三 2「我願你凡事興盛，身體健壯」、申 8:18「得貨財的力量是他給你的」、瑪 3:10 試試神是否傾福，認為信心與奉獻會帶來今生的財富與健康，貧窮與疾病多半是信心不足。他們的長處是提醒神是慷慨的父、關心人的生活；但把屬靈與物質直接換算，常常使奉獻變成交易，使受苦的信徒背上「信心不夠」的重擔。"],["傳道人受供養合乎聖經","","保羅說：「主也是這樣命定，叫傳福音的靠著福音養生。」（林前 9:14）又說「那善於管理教會的長老，當以為配受加倍的敬奉」（提前 5:17）。按這個立場，把傳道人合理的薪資、教會正當的募款都看成貪心，是不公平的，也會讓忠心的同工在經濟上長期受苦。"],["自養與帶職：放棄權利以免福音受阻","","保羅雖然有權利受供養，卻常常親手作工（徒 18:3；20:33–34），說「免得基督的福音被阻隔」（林前 9:12）。許多華人帶職事奉者以此為榜樣。這個立場不否定受供養的正當，只是提醒：在某些處境裡，放下權利本身就是見證。"],["制度透明：問題不只在個人的心，也在管理的方式","","保羅經手耶路撒冷的捐款時，刻意與眾教會選派的弟兄同行，說：「我們留心行光明的事，不但在主面前，就是在人面前也是這樣。」（林後 8:21）按這個立場，對抗 2:3 最好的方法不是揣測誰的心貪，而是讓教會的財務公開、有人監督、可以被查問。"]],"con":[],"say":"本講義的立場：不點名任何人；傳道人受供養合乎聖經，不是貪心。2:3 的記號有三個要素連在一起：動機是貪心（πλεονεξία，想要更多）；方法是「捏造的言語」（πλαστοῖς λόγοις，照聽眾想要的形狀捏出來的話）；對象是「在你們身上取利」——把人當貨。所以分辨的問題不是「他有沒有錢」，而是「他的話是不是為了錢而捏的」：講台是否用應許換奉獻、用恐懼換奉獻、把祝福標上價錢——「以敬虔為得利的門路」（提前 6:5）。本講義主張，教會對 2:3 最好的回應，是自己的財務透明：預算公開、帳目可查、經手不止一人、領袖主動說明。","care":"錢的傷害很深，而且常常說不出口：有人為了「種子奉獻」借了錢，有人奉獻後沒有得到應許的回報，就以為神不愛他。牧者要先讓這樣的人知道：神沒有把祝福標上價錢，你的不順不是信心不夠的懲罰。同時也要提醒全教會不要因此對所有傳道人都起疑心——忠心的同工也需要被供養、被信任。領袖自己最好的見證，不是在講台上說「我不愛錢」，而是讓會眾隨時看得到錢怎樣進、怎樣出。"},{"id":"ISS02_4","t":"2:4「犯了罪的天使」與「地獄」——創世記 6 章的神的兒子們是天使嗎？","r":"2:4；參 創 6:1–4；猶 6–7、14–15","ch":[2],"why":"四、2:4 說：「就是天使犯了罪，神也沒有寬容，曾把他們丟在地獄，交在黑暗坑中，等候審判。」這節有三個問題連在一起：①天使犯了甚麼罪？是不是創 6:2「神的兒子們看見人的女子美貌，就隨意挑選，娶來為妻」？②和合本「丟在地獄」原文是 ταρταρώσας（新約僅此一次），借用了希臘神話中最深的囚禁之處——聖經怎麼可以用神話的字？③猶 14–15 明引以諾一書，彼得的背景也與以諾一書相近——那以諾一書算不算聖經？另外，2:4 有異文：σειραῖς（鎖鍊）與 σιροῖς（坑），和合本「黑暗坑中」跟後一讀。","pos":[["天使說：創 6 的「神的兒子們」是墮落的天使","","第二聖殿時期的猶太文獻（以諾一書 6–21 章、禧年書）與多數二世紀教父（如游斯丁、愛任紐、特土良）都這樣讀。支持的經文理由是：約伯記中「神的眾子」指天使（伯 1:6）；猶 6–7 把不守本位的天使與所多瑪「也照他們一味地行淫」相連；彼得的次序天使、洪水、所多瑪，正是創 6、6–8、19 的次序。許多新近的福音派與批判學者都認為彼得與猶大書是在這個背景裡說話。"],["塞特後裔說：「神的兒子們」是敬虔的塞特後裔","","三世紀已有猶流·亞非利加努提出，經屈梭多模、奧古斯丁成為主流，到加爾文與許多改革宗註釋，認為天使不能與人婚配（太 22:30「人也不娶也不嫁，乃像天上的使者一樣」），創 6 是敬虔的塞特一脈與不敬虔的該隱一脈通婚而敗壞。持此說的人認為 2:4 指的是天使原初的墮落，不必與創 6 連結。"],["君王說：「神的兒子們」是古代自稱神子的統治者","","部分古代猶太解經（如某些他爾根與拉比註釋）與一些近代學者認為，古代近東的君王常自稱神的兒子，創 6 描寫的是強權者任意多娶、壓迫人的暴力。這個讀法解釋了創 6:4「上古英武有名的人」，但較難與彼後 2:4、猶 6 的天使相連。"],["原初墮落說：2:4 只指撒但與隨從他的天使起初的背叛","","有些註釋家認為彼得只是說「連天使犯罪都受審判」，不特指創 6；天使何時、怎樣犯罪，聖經沒有詳述，不必勉強連結。這個讀法謹慎，但較難解釋 2:4–6 與創 6–19 的次序吻合。"]],"con":[],"say":"本講義的立場：四說並陳；彼得的次序最自然是借用讀者熟悉的創 6 章背景，但他只借背景，不展開天使學的細節，他要說的只有一句——神沒有寬容。關於以諾一書：猶大書引用它、彼得的背景與它相近，都不等於把它列入正典；正如保羅在雅典引用希臘詩人（徒 17:28）、在提多書引用克里特詩人（多 1:12），引用一句真話不代表整本書是神的話；以諾一書從未被教會普遍承認為正典，本講義不把它當正典使用。關於 ταρταρώσας：彼得借讀者熟悉的字講一個真實的拘禁，用這個字不等於接受那套神話；和合本譯作「地獄」，但它既不是主耶穌常說的「地獄」γέεννα，也不是「陰間」ᾅδης，經文沒有提供空間結構，講台不畫陰間地圖。異文 σειραῖς／σιροῖς 意思相近，都是拘禁與幽暗，不影響任何教義。","care":"這節經文周圍有許多引人好奇的問題，有些弟兄姊妹會因此花很多時間在網路上追「巨人族」「墮落天使」的影片，越看越怕，或越看越覺得自己掌握了別人不知道的奧祕。牧者要溫柔地把他們帶回彼得的重點：這個長句的終點是 2:9「主知道搭救敬虔的人」。認真看待審判的人，正好最能安心把審判交給神。好奇的問題可以在書房裡謹慎研究，但不要讓它取代主本身；若有人因為這類內容長期恐懼、失眠，要陪他禱告，必要時協助他尋求專業的幫助。"},{"id":"ISS02_5","t":"2:7「義人羅得」——創世記 19 章的羅得是義人嗎？","r":"2:6–9；參 創 13:10–13；19:1–38","ch":[2],"why":"五、彼得一連三次稱羅得為「義人」：「只搭救了那常為惡人淫行憂傷的義人羅得。因為那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。」（2:7–8）可是熟悉創世記的人都知道：羅得看見平原滋潤就選了所多瑪（創 13:10–13），在城門口坐上位子（創 19:1），危急時提議把女兒交出去（創 19:8），天使催促時「遲延不走」（創 19:16），最後在山洞裡醉倒（創 19:30–36）。這樣的人怎麼能稱為義人？","pos":[["相對的義：比起所多瑪人，他是義的","","這一派指出，羅得在城門口接待陌生人、不讓客人受辱（創 19:1–3），在一座敗壞的城裡，他是唯一還照著亞伯拉罕家的規矩待客的人。他的義是與周圍相比的義。長處是貼近創世記的敘事；弱點是容易把「義」變成「比別人好一點」。"],["被算為義：羅得蒙救是出於恩典與代求","","創世記清楚說，羅得蒙救是因為「耶和華憐恤羅得」，天使「就拉著他的手」（創 19:16），而且「神記念亞伯拉罕」（創 19:29）。許多改革宗與福音派註釋家強調：羅得的義是被算為義的義，與亞伯拉罕「信神，這就算為他的義」同一條路。"],["承接猶太傳統的稱呼","","第二聖殿時期的猶太文獻（如所羅門智訓 10:6）已稱羅得為「義人」，彼得沿用了讀者熟悉的稱呼。一些較批判的學者認為彼得在這裡把羅得理想化了；但這個立場較難解釋彼得為甚麼在 2:8 特別給出一個非常具體、而且不誇大的定義。"],["彼得自己的定義：還會傷痛的心","","彼得在 2:8 自己說明他稱羅得為義的原因：「他的義心就天天傷痛。」ἐβασάνιζεν 是未完成式，天天如此——在一座把罪當日常的城裡，他還沒有麻木。這個讀法不否認羅得的軟弱，而是指出：義不是完美，是一顆沒有被所多瑪磨平的心。"]],"con":[],"say":"本講義的立場：四個角度可以合在一起讀，落點在彼得自己的定義——義不是完美，是一顆還會傷痛的心；而羅得蒙救的主詞是神，那是恩典。講台不把羅得美化成榜樣，好像住在所多瑪也沒關係；也不嘲笑他，好像「這種人也算義人」。羅得的一生同時說出兩件事：住錯地方是有代價的——他失去了財產、妻子（「你們要回想羅得的妻子」路 17:32）和女兒們的清白；但主仍然把一個住錯了地方、還會傷痛的人拉了出來。這正是 2:9 的意思：「主知道搭救敬虔的人脫離試探。」","care":"很多信徒活在自己的「所多瑪」裡：一個充滿謊言的職場、一個每天都在試探的螢幕、一個看不到出路的家庭。他們有時羞愧地想：我還住在這裡，我還算是基督徒嗎？羅得的故事給他們兩個安慰與一個提醒。安慰是：你還會痛，就表示你的義心還在；主知道怎樣把你拉出來。提醒是：不要把「還會痛」當作留下來的理由，看久了不痛才是真正的危險。牧者要陪伴這樣的人一起禱告、一起想出具體的一步，而不是丟給他一句「你應該離開」。"},{"id":"ISS02_6","t":"2:10「輕慢主治的」——可以批評教會領袖嗎？","r":"2:10–11；參 彼前 5:1–3","ch":[2],"why":"六、2:10 說：「那些隨肉身、縱污穢的情慾、輕慢主治之人的，更是如此。他們膽大任性，毀謗在尊位的，還不知懼怕。」在某些教會裡，這節經文被用來回應會友的質疑：「你批評牧師，就是輕慢主治的」「毀謗在尊位的，是假師傅的記號」。一位看見領袖真實問題、卻被這樣回應的弟兄會問：聖經真的禁止我們對教會領袖提出任何批評嗎？","pos":[["「主治的」指主的主權（多數新近註釋）","","κυριότητος 是單數抽象名詞，字根就是「主」κύριος；緊接著 2:1「不承認買他們的主」，最自然的意思是：他們輕慢的是主自己的權柄。猶 8 的平行經文說「輕慢主治的」，也是同一個方向。按這個讀法，本節根本不是在講人間的權威。"],["「主治的」與「在尊位的」指天上的權勢","","弗 1:21、西 1:16 的 κυριότης 是天使的等級之一；2:10 的「在尊位的」δόξας 原文是「榮耀者」，2:11 立刻說「就是天使……還不用毀謗的話在主面前告他們」，可見「在尊位的」最自然指天上的榮耀者（可能是墮落的天使），對照猶 8–9 天使長米迦勒不敢罪責魔鬼。按這個讀法，本節講的是假師傅隨口毀謗他們不懂的屬靈世界。"],["「在尊位的」指人間的領袖（部分傳統讀法）","","有些講道與部分較早的註釋把「在尊位的」讀為教會或社會的領袖，常與撒上 26:9「誰伸手害耶和華的受膏者而無罪呢」連在一起，用來勸人尊重領袖。這個讀法提醒我們不可隨意毀謗人；但若用來禁止一切質疑，就與上下文衝突了。"],["「毀謗」與「質疑」的區分（許多牧養學者的提醒）","","βλασφημοῦντες 是惡意地詆毀、說壞話，不是提出問題。新約一面要求尊重領袖（來 13:17），一面要求查驗、責備有罪的長老（提前 5:19–20），也稱讚庇哩亞人天天考查保羅所講的「這道是與不是」（徒 17:11）。按這個立場，教會需要的不是禁止質疑，而是一條安全、公開、照程序的質疑管道。"]],"con":[],"say":"本講義的立場：「主治的」最自然指主的主權，「在尊位的」最自然指天上的榮耀者；這不是一節替人間權威護航的經文。更關鍵的是：第 2 章被定罪的，正是「師傅」——有講台、有跟從者、在上位的人（2:1–3）。所以 2:10 不能拿來堵住對領袖的正當質疑（紅線二）。本條沿用彼得前書講義的立場五：彼得給長老的命令是「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。分辨正當質疑與毀謗，看三件事：內容是否屬實、動機是否出於愛、方法是否照程序（太 18:15–17；提前 5:19–20）。保羅曾在安提阿當面抵擋彼得（加 2:11），彼得後來仍稱他為「我們所親愛的兄弟」（3:15）——被正當糾正的領袖，最好的回應是謙卑，不是引用 2:10。","care":"這個議題連著許多人的屬靈傷害。有人因為提出問題被冠上「悖逆」「輕慢主治」，從此不敢再開口，甚至離開教會、懷疑信仰。牧者要讓這樣的人知道：照真理、在愛中、按程序提出的質疑不是罪，他們的聲音值得被聽見；若有侵害，教會應該協助他們尋求公正的處理與專業的幫助。同時也要提醒每個人，2:10 仍然有一面是對我們說的：「膽大任性」αὐθάδεις 是以自己為樂、隨己意——批評別人時，先問自己是在追求真理，還是在取悅自己的怒氣？領袖與會眾都把審判交給主（2:11），才能一起站在真理裡。"},{"id":"ISS02_7","t":"2:11 天使不用毀謗的話——基督徒可以「斥責魔鬼」嗎？","r":"2:10–12；參 猶 8–10；雅 4:7","ch":[2],"why":"七、2:11 說：「就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們。」猶 9 的平行經文更具體：「天使長米迦勒為摩西的屍首與魔鬼爭辯的時候，尚且不敢用毀謗的話罪責他，只說：『主責備你吧！』」許多教會的禱告會裡常聽到「我奉主名捆綁你、斥責你」的禱告。有人因此問：連天使長都不敢罪責魔鬼，我們可以嗎？這是不是在 2:10–12 說的「毀謗所不曉得的事」？","pos":[["奉主名的屬靈權柄（靈恩與第三波傳統）","","這個傳統指出，主差遣門徒時賜他們「權柄可以踐踏蛇和蠍子，又勝過仇敵一切的能力」（路 10:19），保羅也奉主名命令污鬼離開（徒 16:18）。信徒在基督裡有權柄抵擋魔鬼，這是福音的得勝。他們提醒，若因為 2:11 而對屬靈爭戰退縮，就忽略了新約的另一面。"],["謹慎的讀法：把審判交給主","","這一派強調 2:11 與猶 9 的模式：連天使長都不自己宣判，只說「主責備你吧」。屬靈爭戰的方式是順服神、抵擋魔鬼（雅 4:7）、穿戴神所賜的全副軍裝（弗 6:11），而不是與邪靈對話、嘲弄、喊話，或花許多時間研究邪靈的名字與等級。"],["經文對象的讀法：2:11 講的是假師傅的狂妄，不是禱告的方式","","也有註釋家指出，2:10–12 的重點不在教導信徒怎樣禱告，而在揭露假師傅：他們自以為有屬靈知識，「毀謗所不曉得的事」（2:12），對屬靈世界輕率、狂妄。照這個讀法，本節的應用是謙卑與敬畏，不是直接禁止某一種禱告用語。"],["「戰略層次屬靈爭戰」的主張與疑慮","","二十世紀後期有一種做法，主張找出管轄某地區的邪靈名字，在當地上空「宣告、捆綁」，以打開福音的門。支持者引用但 10:13 的「波斯國的魔君」。許多福音派學者則提醒：但以理在那裡是禁食禱告，交戰的是天使，不是人去向邪靈喊話；新約也沒有教導信徒去辨認邪靈的地域名字。2:11–12 的謹慎，正好適用在這裡。"]],"con":[],"say":"本講義的立場：可與以弗所書講義的立場四（屬靈爭戰）對照閱讀。2:11 教的是謙卑：連力量權能更大的天使，都把審判交給主（παρὰ κυρίῳ，在主面前）。所以：奉主名抵擋魔鬼是合乎聖經的（雅 4:7；徒 16:18），但焦點在主，不在魔鬼；不嘲弄、不毀謗、不與邪靈對話、不對屬靈世界作超出聖經的猜測。禱告時說「主責備你」「奉主耶穌的名，你離開」，與在講台上長篇喊話、把魔鬼當作表演對象，是兩回事。2:12 的警告值得每個熱心的人記住：「他們毀謗所不曉得的事」——屬靈的狂妄，本身就是有己。","care":"這個議題在華人教會常常把人分成兩群：一群覺得另一群「太靈恩、太誇張」，另一群覺得這一群「沒有信心、沒有能力」。牧者要幫助兩群人都回到 2:11 的中心：我們的安全不在禱告的音量或用語，而在那位「知道搭救敬虔的人」的主（2:9）。對正在受驚嚇、覺得被邪惡攪擾的人，不要先跟他爭論禱告的用語，要先陪他、為他禱告，讓他知道主比一切更大；若有長期的恐懼、失眠或其他身心的困擾，也要協助他尋求醫療與專業的幫助，那不是不屬靈。"},{"id":"ISS02_8","t":"2:15–16 驢說人話——怎樣讀聖經裡的神蹟？","r":"2:15–16；參 民 22:21–35","ch":[2],"why":"八、2:16 說：「那不能說話的驢以人言攔阻先知的狂妄。」這件事出自民 22 章：巴蘭騎驢去見摩押王，驢三次避開持刀的使者，巴蘭三次打驢，「耶和華叫驢開口」（民 22:28）。現代讀者讀到驢說人話，常常會笑，或覺得這像童話。一位讀過一些聖經批判學的大學生會問：彼得真的相信驢說了人話嗎？聖經裡的神蹟應該怎樣讀？如果這是寓言，那其他神蹟呢？","pos":[["歷史中的神蹟（傳統與福音派的讀法）","","民數記把這件事放在歷史敘事裡，彼得也把它與天使、洪水、所多瑪等事件並列，當作真實發生的事。民 22:28 的主詞是「耶和華」——不是驢有了說話的能力，是創造萬物的神暫時藉驢說話。若承認神是創造主、承認基督從死裡復活，一頭驢說話並不比這些更難。"],["異象或內在經驗","","有些解經家（包括少數古代猶太註釋）認為巴蘭是在異象或內在經驗中「聽見」驢說話，就像先知在異象中看見、聽見。這個讀法仍然承認神超自然的介入，只是對發生的方式有不同理解。"],["傳說或寓言（歷史批判學的讀法）","","部分學者認為巴蘭的故事是古代流傳的民間故事，用幽默的方式諷刺一個外邦術士，不必當作歷史事件。他們的關切是文學體裁；但這個讀法若一路推下去，往往也會把新約的神蹟，甚至復活，一起歸為傳說，這就與彼得在 1:16「並不是隨從乖巧捏造的虛言」的立場正面衝突。"],["寓意的讀法","","古代與中世紀有些講道把驢寓意化，例如驢代表謙卑的會眾、使者代表基督等。這種讀法有屬靈的感動，但容易把作者沒有說的意思放進經文。"]],"con":[],"say":"本講義的立場：照民數記與彼得的記載，把它當作真實的神蹟來讀，主詞是神；同時承認經文用了諷刺的筆法。彼得的重點不在驢，而在對比：自以為有屬靈知識的人「好像沒有靈性、生來就是畜類」（2:12），不能說話的畜類卻用人言說出了理性的話——被錢沖昏頭的先知，比一頭驢還不清醒。讀聖經神蹟的原則是：先問體裁與作者的意思，再承認神是創造主、能在他的世界裡行事；神蹟的可信，最後繫在基督的復活上（林前 15:17）。彼得自己說，他所傳的「並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」（1:16）。","care":"對正在面對知識挑戰的年輕人，不要用「不要問那麼多，信就對了」把問題壓下去；他們需要看見，基督徒可以誠實地面對問題，又不失去信心。可以陪他們從最核心的地方開始：基督的復活是不是真的？若是，其他神蹟就有了根基。同時也別讓這段經文只剩趣味：巴蘭三次打驢，不知道驢救了他的命。今天神的「驢」可能是一位你看不起的人、一個一再受阻的計畫——被攔住的時候，先別急著打驢，先問：我是不是正往「不義的工價」那裡走？小組裡若有人帶著真誠的疑問來，牧者可以推薦好的入門書，或約他單獨談，讓問題在信任的關係裡被慢慢處理，而不是在公開的場合裡被嘲笑或被打發。"},{"id":"ISS02_9","t":"2:20–22 後來的景況比先前更不好——信徒會失去救恩嗎？","r":"2:20–22；參 1:9–10；3:9、17","ch":[1,2,3],"why":"九、2:20–22 說：「倘若他們因認識主救主耶穌基督，得以脫離世上的污穢，後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了。他們曉得義路，竟背棄了傳給他們的聖命，倒不如不曉得為妙。」接著是兩句俗語：狗轉過來吃所吐的，豬洗淨了又回到泥裡滾。「認識」ἐπίγνωσις 在本卷 1:2–3、1:8 都是得救的認識，這使經文更沉重：一個真正認識過主的人，會不會失去救恩？一位跌倒的弟兄讀到這裡，會問：我是不是就是那條狗？本條回指 ISS00_5，只補本章經文的細節。","pos":[["真信徒可以失落救恩（阿米念傳統）","","這一派指出，「因認識主救主耶穌基督」用的是本卷描寫得救的同一個字，「得以脫離世上的污穢」與 1:4「脫離世上從情慾來的敗壞」用的是同一個動詞 ἀποφεύγω；這些描寫看起來是真實的得救經歷。後來「被纏住、制伏」，就失去了原有的地位。這個讀法嚴肅看待經文的用字。"],["他們從未真正重生（加爾文傳統）","","這一派指出 2:22 的比喻正是重點：狗轉回所吐的，因為牠本來就是狗；豬洗淨了還是豬。他們有過外面的洗淨、知識與群體生活，卻沒有新的本性。這與約一 2:19「他們從我們中間出去，卻不是屬我們的」相合，也與 1:10「就永不失腳」的應許一致。"],["警告是神保守信徒的工具（許多福音派）","","這一派認為，警告本身是真實的，神正是藉著這樣真實的警告，保守屬他的人不至「從自己堅固的地步上墜落」（3:17）。警告不是用來測量別人，而是用來叫自己警醒；應許與警告同時是真的。"],["上下文的落點（本講義採用，見 ISS00_5）","","2:20 以 γάρ 接續 2:19 的「他們」——應許人自由、自己卻作敗壞奴僕的假師傅，以及完全跟從他們轉背的人；他們引誘的對象是「那些剛才脫離妄行的人」（2:18）。所以這段最嚴厲的話是對著誤導人的人說的，同時在保護被誤導的人。"]],"con":[],"say":"本講義的立場：沿用 ISS00_5（希伯來書立場二）。三讀並陳，落點在上下文：2:20–22 描述的是假師傅與跟從他們轉背的人，不是在掙扎中跌倒、仍然想回頭的弟兄姊妹（紅線五）。本條補三點：①「倒不如不曉得為妙」說的是光照與責任成正比——「多給誰，就向誰多取」（路 12:48），不是說認識主是危險的事；②這段經文對自己是警醒，對別人不是判決——本講義絕不對任何個人說「你已經沒救了」；③回頭有兩種：2:22 的「轉過來」ἐπιστρέψας，與主對彼得說「你回頭以後，要堅固你的弟兄」（路 22:32）用的是同一個分詞——狗回到所吐的，彼得回到主面前。跌倒的人要同時聽見 1:9「舊日的罪已經得了潔淨」與 3:9「乃願人人都悔改」：主還在等。","care":"一個會因為害怕自己是那條狗而流淚、失眠的人，正是心還沒有剛硬的人；真正的危險，是已經不在乎的人。牧者講這段時，要先問一個問題：坐在下面的是誰？若是一位剛跌倒、很想回來的弟兄，就把他帶回 1:9 與 3:9，告訴他寫這段話的彼得自己也曾「轉過去」，主卻把他等了回來。也要提醒全教會，「狗」和「豬」是彼得描寫假師傅本性的比喻，不是讓我們給跌倒的人取的綽號。陪跌倒的人禱告、陪他走回群體，比任何神學的辯論都更接近這段經文的心意。"},{"id":"ISS03_1","t":"3:4「應許在哪裡呢？」——兩千年了，主還會來嗎？","r":"3:3–4；3:8–10","ch":[3],"why":"一、3:4「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣。」這是譏誚的人的話，可是今天它常常不是從譏誚的人口中說出來，而是從等了很久的信徒心裡冒出來。新約一再說主「快」來、結局「近了」（彼前 4:7；啟 22:20），兩千年過去了，主還沒有來。有人因此認為早期教會根本是預期落空，後來才改口；也有人反過來，每隔幾年就宣告一次「這次真的快了」。一位認真的弟兄會問：主還會來嗎？如果會，為甚麼這麼久？","pos":[["「再臨延遲」危機說（部分近代學者）","","一些近代學者主張：第一代基督徒預期主在他們有生之年回來，主沒有回來，教會陷入信仰危機；彼得後書第 3 章就是第二代教會為了化解這個危機而寫的辯護。持此說的人多半把 3:4「列祖」讀成已經過世的第一代信徒，並以此支持本書晚出、託名的看法（見 ISS00_1、ISS00_7）。這個讀法提醒我們：「延遲」的問題在新約裡確實存在，教會沒有迴避它。"],["近與不知何時並存（多數福音派，本講義採用）","","新約從一開始就同時說兩件事：主必快來，而且那日子沒有人知道（太 24:36；帖前 5:1–2）。「快」主要說的是確定性與隨時性，而不是一個近在眼前的日期；主自己的比喻裡也有「主人來得遲」（太 24:48；25:5、19）。所以延遲不是後來才發現的意外，而是主早就預備門徒面對的處境。彼得的回答有三步：神的時間不是人的鐘錶（3:8）；神的慢是寬容，不是耽延（3:9）；那日子必像賊來到（3:10）。"],["過去應驗說（全然過去派）","","少數人主張主的再來已經在主後 70 年耶路撒冷被毀時以審判的方式應驗了，所以不必再等。部分過去派只把部分預言（如橄欖山講論的一部分）放在主後 70 年，仍然相信將來的再來；但極端的版本與本章直接衝突：3:13 的新天新地、有義居在其中，顯然還沒有來到，而 3:10 的主的日子是對全地的審判與顯露。"]],"con":[],"say":"本講義的立場：主一定會親自回來；沿用帖撒羅尼迦前書立場二，不定時間表、隨時預備（見 ISS00_4）。延遲不是教會的難堪，而是神的寬容：從人的觀點看叫「耽延」，從神的觀點看叫「寬容」（3:9）。彼得給等候的人的第一個武器不是論證，而是記得——記得神的話創造過、審判過，現在還托住這個世界（3:5–7）；記得主看一日如千年（3:8）。譏誚的人「故意忘記」，信徒「不可忘記」。","care":"「應許在哪裡呢？」最痛的版本，不是關於末日，而是關於自己：等了十年的家人還沒信主，等了很久的醫治還沒來，禱告了很多次的事還沒有答案。牧者不要急著責備這份累，彼得也沒有責備；他只是把它翻過來：主的慢是愛的等。陪伴這樣的人，可以和他一起讀 3:9，然後說：寫這句話的人，自己就是被主等回來的——三次不認主，主沒有放棄他。也要提醒會眾：不要因為有人一次又一次宣告「主某年必來」而落空，就連真正的應許也一起丟掉。錯的是那些時間表，不是主的應許。等候的人最需要的不是一個日期，而是一個同行的群體：在等的日子裡一起聚會、一起禱告、一起去找還沒回家的人。"},{"id":"ISS03_2","t":"3:5–7 天地從水而出、存留給火——與創造論和科學怎樣對話？","r":"3:5–7","ch":[3],"why":"二、3:5–7「從太古憑神的命有了天，並從水而出、藉水而成的地」，「當時的世界被水淹沒就消滅了」，「現在的天地還是憑著那命存留……用火焚燒」。這幾節連到創世記第 1 章的創造與第 6–8 章的洪水。華人教會裡，創造論是一個容易起爭執的題目：有人認為只有六日、約一萬年內的年輕地球才是忠於聖經；有人接受宇宙與地球有很長的年歲；也有人接受生物演化是神創造的方法。於是有人想用這三節經文去支持自己的立場，或裁判別人的立場。問題是：彼得在這裡要講的是甚麼？教會該怎樣在這個題目上與科學對話？","pos":[["年輕地球創造論","","主張創世記第 1 章的「日」是一般的日子，地球與宇宙約有數千年到一萬年的歷史；挪亞的洪水是全球性的，許多地層與化石由洪水形成。持此說的人常引 3:5–6 支持全球洪水，認為彼得把洪水當作與創造同等真實的歷史事件。他們的出發點是要高舉聖經的權威與歷史性。"],["古老地球創造論","","接受宇宙與地球有很長的年歲，同時相信神直接創造；在解釋創世記時有「日－年說」（每一日代表一段長時期）、「間隔說」（創 1:1 與 1:2 之間有一段時間）、「漸進創造說」等。對 3:5–6，持此說的人多半同意洪水是真實的歷史審判，但對它的範圍是全球還是當時人類所居之地看法不一。他們的出發點是相信神的話與神的作為（受造界）不會互相矛盾。"],["文學架構說與有神導演化／演化創造論","","文學架構說認為創世記第 1 章的六日是神學性的文學架構（前三日造領域、後三日充滿領域），重點在誰創造與為何創造，不在時間長短。演化創造論則接受生物演化是神持續護理與創造的方法，同時堅持神是創造主、人有神的形像、人墮落犯罪。持這些看法的福音派學者都強調：聖經不是用來回答現代科學問題的教科書，但它所說的關於神、人與世界的真理是確實的。"],["彼得的論證本身","","不論採哪一種創造觀，彼得在 3:5–7 的論證都一樣：譏誚的人說「萬物與起初創造的時候仍是一樣」，彼得指出世界並不是靠自己的穩定存在——它憑神的話而有，也曾因神的話而被審判，現在也憑著那話存留。δι᾽ ὧν（藉著這些）把水與神的話放在一起：同樣的水，在同一個話底下，可以是創造的材料，也可以是審判的工具。彼得的焦點是 λόγος——神的話，不是地質年代。"]],"con":[],"say":"本講義的立場：講台不以 3:5–7 裁判年輕地球或古老地球，也不在講台上裁判其他創造觀；本講義並陳各家，並請會眾留意三點共識：①天地是神憑他的話創造的，不是偶然（來 11:3）；②洪水是神真實的審判，也是神保守義人的見證（3:6；2:5）；③現在的世界憑神的話存留，不是證明神不會來，正是證明神的話還在托住它。與科學對話時，福音派信徒可以抱持謙卑：神的話與神的作為出自同一位神，暫時看起來不合的地方，常常是我們對經文或對自然的理解還不夠。","care":"這個題目最常傷人的地方，不是答案，而是態度。有年輕人在大學讀理工，因為在教會聽到「接受古老地球就是不信聖經」而離開；也有長輩因為在小組被笑「還相信六日創造」而再也不開口。兩種都是不必要的絆倒。牧者要讓會眾知道：在這個題目上，敬虔愛主、高舉聖經的弟兄姊妹有不同的看法；我們可以熱烈討論，但不要把它變成信仰的分界線。對正在科學與信仰之間掙扎的學生，可以陪他讀 3:5–7，指出彼得真正在乎的是：世界的穩定不是神缺席的證明。他可以繼續認真地研究受造界，因為那正是在研究神的作為；而他的信心可以建立在那位憑話創造、也憑話托住萬有的主身上。"},{"id":"ISS03_3","t":"3:8「一日如千年」——可以用來算末日或算創造的日子嗎？","r":"3:8；詩 90:4","ch":[3],"why":"三、3:8「主看一日如千年，千年如一日。」這大概是全卷最常被拿來做數學的一節。有人用它來排列世界歷史的時間表、推論主再來的年份；也有人用它來說明創世記的「日」可以是一千年，藉此調和創造與科學。兩種用法方向相反，卻有一個共同點：都把這節經文當作一條換算公式。問題是：彼得引用詩篇第 90 篇，到底要說甚麼？這節經文可以拿來算日子嗎？","pos":[["世界週說（本講義不採）","","早期作品《巴拿巴書》15:4 等把創造的六日比作六段一千年的世界歷史，第七段一千年是安息（常與千禧年連在一起）。歷代都有人沿著這條路計算世界的年歲與主再來的時間；但這種換算不是本節的意思，歷史上每一次照這樣定出的日子都落空了。本講義不用 3:8 算末日。"],["用 3:8 說明創造日的長度（本講義不採作為證據）","","有些古老地球的支持者引用 3:8，說創世記的一日可以是很長的時期。創造日的長度本身是可以討論的題目（見 ISS03_2），但 3:8 的上下文講的是主再來的「慢」，不是創造日；用它作創造日長度的證據，同樣是把比喻當成公式。本講義不用 3:8 算創造的日子。"],["神超越時間（多數解經家，本講義採用）","","摩西在詩 90:4 說：「在你看來，千年如已過的昨日，又如夜間的一更。」那是說人生短暫、神永恆。彼得引用時多加了一個方向：「一日如千年」。兩個方向都說，正是為了取消換算——如果一日可以像千年，千年也可以像一日，就沒有人能拿這節經文去定任何年份。ὡς 是「如」，是比喻，不是等號。重點是：神不被時間拖慢，也不被時間催促；他不會因為等了很久就忘記應許。"],["神的忍耐與效率","","有解經家指出兩個方向各有一個安慰：「千年如一日」——對我們漫長的等候，在主看來並不長，他沒有遺忘；「一日如千年」——主可以在一日之內成就人以為要千年的事，他不需要很多時間。這兩個安慰都把人帶到 3:9：主的慢不是無能，是寬容。"]],"con":[],"say":"本講義的立場：3:8 不是換算公式，是一次換位。兩個方向都說，正是取消換算；本講義不用它算末日，也不用它算創造日（紅線三；見 ISS00_4）。彼得不給我們一支新的鐘錶，他把我們帶到「主那裡」（παρὰ κυρίῳ）看時間——從人的觀點換到神的觀點，從暫時的觀點換到永恆的觀點。下一節立刻說明從那裡看見的是甚麼：不是耽延，乃是寬容；而 3:10 又說那日子要像賊來到，賊不預告時間。","care":"華人教會裡，不少弟兄姊妹曾經被末日時間表傷過：有人為了某一年辭職、賣房，日子過了，主沒有來，信心也跟著垮了；也有人因此對一切講末世的信息都起了戒心，連主再來的盼望都不敢提。牧者要對這兩種人都有耐心。對前一種人，要說：錯的是那張表，不是主的應許；彼得早就說了，這節經文本身就拒絕被當成尺。對後一種人，要說：不算日子，不等於不盼望；主一定會來，像賊一樣，所以每一天都是預備的日子。把會眾從「算」帶到「等」，從「等」帶到「活」：「你們為人該當怎樣聖潔，怎樣敬虔」（3:11）。"},{"id":"ISS03_4","t":"3:9「不願有一人沉淪」——那為甚麼不是人人得救？","r":"3:9；3:7、15","ch":[3],"why":"四、3:9「其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。」如果神不願有一人沉淪，為甚麼還有人沉淪？神的心意會落空嗎？這節經文常被放到揀選的辯論裡：一邊用它證明神的救恩向所有人敞開、人可以拒絕；另一邊指出「向你們」的上下文，認為它說的是神的選民。也有人更進一步，用它主張人人終必得救。一位為家人信主禱告多年的姊妹讀到這裡，會問：神既然不願意他沉淪，為甚麼他到現在還不信？","pos":[["普世救恩的心意（阿米念／衛斯理傳統）","","βούλομαι 表達神真實的心意：他願意每一個人都悔改得救（又見提前 2:4「他願意萬人得救，明白真道」；結 33:11「我斷不喜悅惡人死亡，惟喜悅惡人轉離所行的道而活」）。神賜人真實回應的能力（先在恩典），人可以接受，也可以拒絕；所以不是人人得救，原因在人的拒絕，不在神不願意。主為耶路撒冷哀哭「只是你們不願意」（太 23:37）也被引為佐證。"],["限於選民的讀法（改革宗一派，如歐文）","","本節說「寬容你們」（εἰς ὑμᾶς），對象是收信的信徒；「不願有一人」「人人」最自然地限於「你們」之中——神延遲審判，是為了把他所有的子民都召齊，一個也不失落（約 6:39）。持此說的人強調救恩完全出於神主權的恩典（弗 1:4），神的旨意不會落空。"],["兩種旨意的讀法（改革宗另一派）","","分辨神「所喜悅的心意」與「主權的定旨」：神真實地不喜悅惡人死亡，他的邀請是真誠的；同時，他在主權中揀選、施恩。這兩者如何協調，聖經沒有完全說明，「隱祕的事是屬耶和華我們神的」（申 29:29）。持此說的人既保留 3:9 的溫度，也保留揀選的教義。"],["普救論（本講義不採）","","主張人人終必得救，或在審判之後終必得救。這與同一段經文直接衝突：3:7 明說「不敬虔之人受審判遭沉淪」，ἀπώλεια（沉淪）與 3:9 的 ἀπόλλυμι 同一字族。彼得說神不願意，不是說這件事不會發生；正因為審判是真的，神的寬容才顯得寶貴。"]],"con":[],"say":"本講義的立場：揀選與普世救恩的心意，各家並陳，本講義不在此裁判系統。不論採哪一說，3:9 至少說出三件事：①神的心意是真實的——他不願有人沉淪，他的邀請不是表演；②救恩完全出於神的恩典，人不能誇口；③這節經文在上下文裡的工作，不是裁決揀選的系統，而是解釋「為甚麼主還沒來」：因為神在等人悔改。不要用系統冷卻這節經文的溫度，也不要用這節經文取消 3:7 的審判。3:15 說「以我們主長久忍耐為得救的因由」——主多等一天，就多一個人可以回頭。","care":"這節經文最寶貴的用途，是給等候的人力氣，不是給辯論的人彈藥。對為家人禱告多年的弟兄姊妹，可以說：神比你更不願意他沉淪；你在等，神也在等，而且神等得比你更久。還沒有答案，不是神不在乎，正是他還在寬容。也要提醒：「寬容」不是讓人繼續拖延的理由——保羅說「他的恩慈是領你悔改」（羅 2:4）。對自己還沒有回應的人，這節經文是邀請：主的慢，是為了你。小組若在揀選問題上起了爭執，帶領的人可以把大家帶回這一句：不論我們怎樣理解揀選，寫這節經文的彼得，自己就是被主寬容等回來的人；我們都是。若有人因為親人沒有信主就過世而被這節刺痛，不要對他講道理，先陪他難過；我們不替神斷定任何亡者的去處，審判全地的主豈不行公義嗎（創 18:25）？把他交在那位不願有一人沉淪的主手裡。"},{"id":"ISS03_5","t":"3:10「燒盡了」還是「顯露出來」——異文怎樣影響理解？","r":"3:10","ch":[3],"why":"五、3:10 最後一句，和合本作「地和其上的物都要燒盡了」。可是若打開較新的中英文譯本或希臘文校勘本，會看到「都要被顯露」「必被發現」，甚至「不被發現」。同一節經文，為甚麼會有幾種完全不同的讀法？這是新約裡最難的異文之一，也是全卷最重要的一處。一位弟兄在查經時發現自己的聖經和別人的不一樣，很容易慌：到底哪一個才是神的話？這會不會影響我們對末日與受造界的理解？","pos":[["κατακαήσεται「必燒盡」（和合本、欽定本所依）","","見證有亞歷山大抄本（A）、048 及拜占庭多數抄本，是 Textus Receptus 與多數本的讀法；和合本「燒盡了」、KJV「shall be burned up」都照這一讀。優點：意思清楚，與 3:7、3:12 的火一致。缺點：見證多屬較晚的抄本；正因為清楚，很可能是抄寫者把難句改得容易明白。"],["εὑρεθήσεται「必被發現／被顯露」（SBLGNT、WH 等）","","見證有西乃抄本（א）、梵蒂岡抄本（B）、K、P、1739 等最早、最好的抄本，又是「較難的讀法」（lectio difficilior）——其他各讀都容易解釋成從它改出來的。SBLGNT 與 Westcott–Hort 採此讀，許多新近中英文譯本也跟從。意思有三種解：(a) 地和其上的工都要攤開在神的審判面前，無所隱藏；(b) 讀作問句：「地……還會被找到嗎？」；(c) 經過火煉之後被找著、存留下來。"],["οὐχ εὑρεθήσεται「必不被發現」（NA28／UBS5，ECM）","","見證主要是部分撒希地科普特文與敘利亞文譯本，希臘文抄本幾乎沒有直接支持。ECM（大型校勘本）的編者認為加上否定詞的讀法最能解釋其他各讀的來源，因此 NA28 採用；意思接近「不復存在」。"],["其他讀法","","C 抄本作 ἀφανισθήσονται（必消失）；最早的蒲草紙抄本 𝔓72 作 εὑρεθήσεται λυόμενα（必被發現已經解散）；Ψ 與部分拉丁文武加大譯本略去這一句。另有學者提出各種推測校勘。這些讀法顯示：古代的抄寫者也覺得這一句難，努力想把它說清楚。"]],"con":[],"say":"本講義的立場：完整並陳各讀；在 blk 採 SBLGNT 的 εὑρεθήσεται，取 (a)「在神的審判面前被顯露」——這與林前 3:13「各人的工程必然顯露……有火發現」一致，也與四節之後 3:14「安然見主」（原文「被他找到」）同一個動詞，前後呼應。講台用和合本「燒盡了」時，不說「和合本譯錯了」：和合本忠實地翻譯了它所依據的抄本，這是抄本的異文，不是翻譯的錯誤。最重要的是：不論哪一讀，都不是「神要丟棄他所造的世界」；審判的焦點是「地和其上所作的工」要在神面前交賬，結局是 3:13 的新天新地。","care":"第一次知道聖經有異文的人，常常會有被騙的感覺。牧者要先說清楚：新約的抄本數量與年代，遠遠勝過任何古代文獻；絕大多數異文是拼字、字序的小差別，沒有一處影響基督教的核心信仰。3:10 是少數真正難的地方，學者把它攤在桌上公開討論，正說明教會不隱瞞。對會眾，可以把這兩讀都變成生命的提醒：「燒盡了」提醒我們，地上的一切都會過去，不要把心放在會被燒掉的東西上；「被顯露」提醒我們，那一日我們所作的一切都要攤開在主面前。兩讀合起來問的是同一個問題：那一天，主找到你的時候，你是甚麼樣的人？"},{"id":"ISS03_6","t":"3:10–13 地球會被毀滅嗎？基督徒要關心環境嗎？","r":"3:10–13；3:6","ch":[3],"why":"六、3:10–12 有天「大有響聲廢去」、有形質的「被烈火銷化」、地「燒盡了」。有人由此推論：既然地球最後要被燒掉，基督徒就不必花力氣照顧環境，重要的只是傳福音、救靈魂。另一方面，也有人把環境議題變成講台上的政治立場，要求會眾支持某一派的政策。這兩種做法都牽動華人教會的實際生活。這一條沿用 ISS00_4，只補第 3 章逐節的那一筆：地球會被毀滅嗎？基督徒要不要關心受造界？","pos":[["毀滅後另造","","主張舊天地將被完全消滅，神另造一個全新的天地；根據是 3:10 若讀「燒盡」、3:12 的「銷化」「鎔化」，以及啟 21:1「先前的天地已經過去了」。持此說的福音派信徒大多仍然認為應當照顧受造界——因為神在創造時就把管理的責任交給人（創 1:28；2:15），而不是因為受造界會存留。但也有人從此說推出「地球反正要燒，不必照顧」，這是錯誤的推論，不是此說本身必然的結論。"],["煉淨更新","","主張神要煉淨、更新這個受造界，而不是丟棄它。理由：3:13「新」καινός 多指品質上的新；3:6 的洪水類比——「當時的世界」消滅了，地卻沒有消失，挪亞走出方舟踏上的是同一塊被洗過的地；羅 8:21「受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀」；徒 3:21「萬物復興的時候」；啟 21:5「看哪，我將一切都更新了」。若 3:10 讀「被顯露」，更支持審判是鑒察與煉淨，不是取消受造界。"],["管家職分的共識","","不論採哪一說，許多福音派傳統都同意：「地和其中所充滿的……都屬耶和華」（詩 24:1）；人是管家，不是主人。照顧受造界是愛神（尊重他的作品）與愛鄰舍（不讓別人承受我們浪費的後果）的一部分，也是 3:11「你們為人該當怎樣聖潔，怎樣敬虔」在日常生活裡的落實——怎樣用錢、用資源、對待土地與動物。"],["政治動員的危險","","另一端的危險是把環境議題變成講台上的政治陣營標籤：支持某一政策才算屬靈，反對就是不愛神。這會使教會分裂，也把福音窄化成一種政治立場。具體的政策（能源、稅制、產業）牽涉許多專業判斷，敬虔的基督徒可以有不同看法。"]],"con":[],"say":"本講義的立場：沿用 ISS00_4。本章補三點：①本講義傾向更新的讀法，並陳另造的讀法；但無論採哪一說，都推不出「地球反正要燒，現在不必照顧」——這不是經文的推論（紅線六）；②3:13 的落點是「有義居在其中」，不是毀滅；盼望新天新地的人，今天就讓義在生活裡先住下來，包括對待神所造的世界；③講台講管家的原則，不把照顧受造界變成政治動員，不替會眾決定具體政策的立場。","care":"這個題目在小組裡常常變成兩種尷尬：一種是有人說「反正要燒掉」，順手把垃圾亂丟、把資源浪費當成小事；另一種是有人把環保變成衡量別人屬靈的尺。牧者可以把焦點拉回 3:11：永恆的觀點不是叫人離開世界，而是叫人在世界裡活得不一樣。具體的操練可以很小：不浪費食物、愛惜用品、帶孩子認識神所造的花草、關心因環境破壞而受苦的窮人。也要提醒：照顧受造界不能取代傳福音；傳福音也不能成為糟蹋受造界的理由。兩件事都是在等候主來的日子裡，把義先活出來。"},{"id":"ISS03_7","t":"3:12「切切仰望」——人可以加速主的再來嗎？","r":"3:11–12；3:9","ch":[3],"why":"七、3:12「切切仰望神的日子來到」，「切切仰望」原文 σπεύδοντας，許多現代譯本譯作「催促」「加速」。如果人可以加速主的再來，那麼甚麼可以加速它？有人說是宣教，福音傳遍天下末期就來到；有人說是教會的聖潔與合一；也有人把它和中東局勢、某些宗教或政治工程連在一起，主張人可以「製造」主再來的條件，甚至據此推算日期，卻沒有先問這是不是經文的意思。問題是：彼得說的「催促」是甚麼意思？人真的能左右神的時間嗎？","pos":[["熱切渴慕（和合本「切切仰望」、KJV hasting unto）","","σπεύδω 可作「熱切追求、急切盼望」，與前面的 προσδοκῶντας（等候、仰望）連用，描寫信徒內心殷切的期盼。優點：避免讓人誤以為人能左右神的時間；缺點：σπεύδω 帶直接受詞時，通常的意思是「使某事加快」。"],["催促、加速（ESV、NRSV 等，多數現代解經家）","","按文法較自然的讀法是「催促那日子」。彼得自己在聖殿廊下說過：「你們當悔改歸正，使你們的罪得以塗抹，這樣，那安舒的日子就必從主面前來到」（徒 3:19–20）；猶太傳統也有「以色列若悔改，彌賽亞就來」的說法。上下文定了催促的方法：3:9 神在等人悔改，3:11 信徒該當聖潔敬虔。換句話說，悔改、聖潔、傳福音，就是參與神等候的心意。"],["宣教完成論","","引太 24:14「這天國的福音要傳遍天下，對萬民作見證，然後末期才來到」，主張完成大使命就能促成主再來，因而以此激勵宣教。宣教的熱情是對的，與 3:9 也相合；但若把它變成「再傳完多少族群就到了」的倒數，就又回到了計算——那日子仍然只有父知道（太 24:36；徒 1:7）。"],["製造條件論（本講義不採）","","主張人可以透過某種宗教、政治或軍事工程（例如推動特定的地緣政治事件）去「促成」預言應驗、逼近主再來。這不是 3:12 的意思：彼得沒有叫人去安排世界局勢，他叫人「為人該當怎樣聖潔，怎樣敬虔」；而 3:10「主的日子要像賊來到」仍然管著 3:12。"]],"con":[],"say":"本講義的立場：原文較支持「催促」，但上下文定了催促的方法——悔改、聖潔、敬虔、傳福音；這是參與神的心意，不是掌握神的時間表。本講義不用 3:12 推算日期，也不教人以任何政治、軍事或宗教工程「製造」主再來的條件（紅線三；見 ISS00_4）。等候不是坐在月台上看錶，是活出那日子的樣子：我們催促那日子的方法不是算它，是活它。","care":"「加速主再來」這句話可以點燃人，也可以燒傷人。被點燃的人，會更殷勤地傳福音、更認真地追求聖潔，這是好的。被燒傷的人，會覺得主還沒來是自己不夠努力，背上一個永遠完成不了的擔子；或者被捲進某種時事解經的熱潮，把每一則新聞都當成倒數。牧者要把兩件事同時說清楚：我們真的能參與——主在等人悔改，你今天傳的福音、你今天的悔改，都是主所看重的；但時間不在我們手裡——那一日像賊來到，我們不必、也不能替主排日程。這樣，等候的人既有動力，也有安息。"},{"id":"ISS03_8","t":"3:15–16 保羅的信是「經書」——新約正典怎樣形成？","r":"3:15–16","ch":[3],"why":"八、3:16 說保羅「一切的信」被人強解，「如強解別的經書一樣」。「別的經書」（τὰς λοιπὰς γραφάς）意味著保羅的信已經被放在「經書」之列——這是新約內部第一次把使徒書信與舊約聖經並列。這引出幾個問題：保羅的信在使徒時代就被看作聖經了嗎？新約二十七卷是怎樣被收集、被承認的？是教會決定了正典，還是教會承認了正典？本條補 ISS00_8（彼得後書本身怎樣成為正典），只處理 3:15–16 所引出的整體正典形成問題。","pos":[["使徒時代已視使徒書信為經書（多數福音派）","","γραφή 在新約一貫指聖經，λοιπάς（其餘的）把保羅書信放進同一類；保羅也要求教會公開宣讀並彼此傳閱他的信（帖前 5:27；西 4:16），提前 5:18 更把路加福音的話（路 10:7）與申命記並列為「經上說」。可見使徒的著作從一開始就帶著主的權柄被教會領受，正典的核心在使徒時代已經成形。"],["託名說的讀法","","有學者認為「保羅一切的信」預設保羅書信已經被收集成冊，因此本書應寫於第一世紀末以後（見 ISS00_1、ISS00_7）。回應：彼得只說他所知道的「一切的信」，不必是完整的書信集；保羅書信在他生前就已在各教會流傳互讀。"],["教會決定正典（部分羅馬天主教的表述）","","強調正典的界定是教會權柄的行動：經過大公會議（如迦太基會議 397 年、後來的天特會議）才正式確定書目，因此聖經的權威與教會的權威不可分。當代天主教神學也承認，教會不是在聖經之上，而是服事神的話；但在詮釋上仍強調教會訓導的角色。"],["教會承認正典（宗教改革傳統）","","教會不是「製造」正典，而是在長期的使用與分辨中「承認」那些本來就帶有使徒權柄的書卷，就像孩子認出母親的聲音，不是孩子使母親成為母親。早期教會分辨的準則大致有三：使徒性（出於使徒或與使徒密切相關）、正統性（與使徒所傳的福音一致）、普遍性（被各地教會長期公認使用）。"]],"con":[],"say":"本講義的立場：3:16 見證了新約正典在使徒時代已經開始成形——使徒的書信從一開始就被當作帶著主權柄的話領受；四世紀的會議是承認，不是發明。彼得把保羅的信稱為「經書」，同時稱保羅為「我們所親愛的兄弟」（3:15）：權柄與謙卑放在同一句裡。這不是兩位使徒的角力，是兩個被同一位主寬容的人，站在同一個福音上（紅線七）。彼得後書本身的正典歷史，見 ISS00_8。","care":"一位在大學裡第一次聽說「新約是四世紀開會投票決定的」的年輕人，可能會覺得聖經只是教會政治的產物。牧者可以陪他看 3:15–16：在任何會議之前，使徒彼得就已經把保羅的信放在經書之列；正典的歷史不是一場投票，而是一段長達幾百年、各地教會不斷在聖經裡聽見主聲音的歷史。也要讓會眾看見 3:15 的溫度：被公開糾正過的彼得，沒有因為那件事就貶低保羅的信，反而承認它有神所賜的智慧。這對今天的教會是很實際的功課——我們對待曾經批評過我們的弟兄，是否也能說「我們所親愛的兄弟」？"},{"id":"ISS03_9","t":"3:16「難明白的」——讀到看不懂的經文怎麼辦？","r":"3:16；1:20–21","ch":[3],"why":"九、3:16「信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪。」連使徒彼得都承認保羅的信有些難懂。這句話常被用在兩個相反的方向：有人說，既然難懂又可能「自取沉淪」，平信徒就不要自己亂讀，交給專家；也有人說，我有聖靈，我怎麼讀都對，不需要任何人教。一位剛開始讀羅馬書、讀到頭痛的弟兄會問：讀到看不懂的經文，我該怎麼辦？我是不是不該自己讀？本條補 ISS00_3，處理 3:16 讀經實務的那一筆。","pos":[["交給教導權威（強調教會訓導的傳統）","","認為聖經的正確解釋屬於教會的教導職分，個人的解釋要服在教會的教導之下，以免各人照己意解經造成分裂與異端。今天的羅馬天主教也鼓勵信徒讀經，但強調在教會的傳統與訓導中讀。華人教會裡，也有一些地方在實際上不鼓勵會眾自己讀較難的書卷，怕他們讀偏。這個立場的出發點是保護，但若推到極端，就成了主張平信徒不可自己讀經——這不是 3:16 的意思。"],["個人直接解經（極端個人主義）","","認為每個信徒都有聖靈，個人讀經所得的領受就是神的意思，不需要參考歷代教會的理解或群體的分辨。出發點是看重個人與神的關係，但容易把「我覺得」當成「神說」，正落入 3:16 所說的「強解」：把經文綁起來，拉到自己要的長度。"],["聖經的清晰性（宗教改革傳統）","","主張聖經中關乎得救所必須知道、相信、遵守的事，在聖經某處都已清楚說明，無論有學問或沒有學問的人，只要適當地使用一般方法，都能充分明白（參威斯敏斯德信條 1.7）。這不是說每一處都一樣清楚——彼得自己就說「有些難明白的」——而是說難的地方可以用清楚的地方來解釋，聖經是自己最好的解釋者。"],["群體中的謙卑讀經（本講義採用）","","3:16 出問題的不是「讀的人」，是兩種人：ἀμαθεῖς（不肯受教、沒有學習的）與 ἀστήρικτοι（不堅固的）。解藥因此不是「不要讀」，而是：受教——在群體中讀，聽歷代教會與教導者怎樣理解；堅固——照上下文讀，用清楚的經文解釋難的經文；謙卑——承認自己的不懂，暫時放下，不強解。這正是庇哩亞人的樣子：「甘心領受這道，天天考查聖經」（徒 17:11）。"]],"con":[],"say":"本講義的立場：3:16 不是禁止會眾自己讀經的理由，更不是主張聖經只屬於少數專家（紅線八；見 ISS00_3）。讀到難明白的經文，可以照四步：①先讀上下文，問作者在這一段要解決甚麼問題；②用清楚的經文解釋難的經文；③帶到小組或請教牧者、查考可靠的註釋，在群體中讀；④仍然不懂的，就誠實地放著，不強解，先順服已經明白的部分。彼得在同一處的命令不是「別讀」，而是「在我們主救主耶穌基督的恩典和知識上有長進」（3:18）。","care":"很多弟兄姊妹不讀經，不是不想讀，是怕讀錯、怕讀不懂。牧者要先把這個怕拿掉：連彼得都說保羅難懂，你讀不懂一點也不奇怪。讀不懂不是罪，強解才是危險；而強解的人，常常是不肯讓別人看他怎麼讀的人。所以最好的保護是一個彼此讀經的群體：小組長被問倒時可以說「我不知道，我們一起查」；教導的人也要願意被會眾用經文檢驗。對剛起步的人，可以建議從福音書與詩篇開始，配合講義慢慢讀到保羅書信；讀到卡住的地方，記下來帶到小組。讀經的目的不是贏得辯論，而是在認識主上長進。"}],"terrain":{"points":[[1,88,0,"1:3 神的神能已將一切關乎生命和虔敬的事賜給我們","top"],[1,28,0,"1:9 就是眼瞎，只看見近處的","bot"],[1,44,0,"1:14 我脫離這帳棚的時候快到了",null],[1,94,0,"1:17–19 這是我的愛子……晨星在你們心裡出現","top"],[2,16,0,"2:1 連買他們的主他們也不承認","bot"],[2,58,0,"2:5 只保護了傳義道的挪亞一家八口",null],[2,82,0,"2:9 主知道搭救敬虔的人脫離試探","top"],[2,6,0,"2:22 狗所吐的，牠轉過來又吃","bot"],[3,22,0,"3:4 主要降臨的應許在哪裡呢？","bot"],[3,86,0,"3:9 不願有一人沉淪，乃願人人都悔改",null],[3,95,0,"3:13 盼望新天新地，有義居在其中","top"],[3,98,0,"3:18 在恩典和知識上有長進。願榮耀歸給他","top"]]},"tracks":[{"gk":"ἐπίγνωσις","tr":"epignōsis","gl":"認識、知識（連同 γνῶσις、ἐπιγινώσκω、γινώσκω）","code":"G1922","root":"ἐπί（向著）＋ γινώσκω（知道）","stops":[["1:2","因你們認識神和我們主耶穌——認識是恩惠平安加給人的管道",""],["1:3","皆因我們認識那……召我們的主——一切賜下，都經過「認識他」","top"],["1:5–6","有了德行，又要加上知識——知識放在台階中間，不是頂點",""],["1:8","在認識我們的主耶穌基督上不至於閒懶不結果子——認識要結果子",""],["1:16","將……大能和他降臨的事告訴（γνωρίζω）你們——認識來自見證",""],["1:20","第一要緊的，該知道——聖經的來源",""],["2:20","因認識主救主耶穌基督，得以脫離世上的污穢——認識叫人脫離",""],["2:21","他們曉得義路，竟背棄了——知道了卻轉背：認識不等於長進","bot"],["3:3","第一要緊的，該知道在末世必有好譏誚的人——預先知道，才站得住",""],["3:17","你們既然預先知道這事，就當防備",""],["3:18","在……恩典和知識上有長進——知識與恩典並列，認識主是一生的長進","top"]],"ins":"全卷以「認識」開頭（1:2），以「知識」收尾（3:18）。中間最痛的一站是 2:21：曉得義路的人轉背了——知道不等於認識。彼得給的答案不是多知道一點，而是把知識放回恩典旁邊：在恩典和知識上有長進。"},{"gk":"ὑπομιμνῄσκω","tr":"hypomimnēskō","gl":"提醒、記念（連同 ὑπόμνησις、μνήμη、μιμνῄσκομαι）↔ 忘記（λήθη、λανθάνω）","code":"G5279","root":"ὑπό（在下）＋ μιμνῄσκω（記得）","stops":[["1:9","忘了他舊日的罪已經得了潔淨——全卷第一筆是「忘記」","bot"],["1:12","我卻要將這些事常常提醒你們——知道了還要被提醒",""],["1:13","趁我還在這帳棚的時候提醒你們，激發你們",""],["1:15","使你們在我去世以後時常記念這些事——遺言就是留給人記得的","top"],["3:1","這兩封都是提醒你們，激發你們誠實的心",""],["3:2","叫你們記念聖先知預先所說的話和主救主的命令",""],["3:5","他們故意忘記——譏誚出於選擇性的遺忘","bot"],["3:8","有一件事你們不可忘記：主看一日如千年——要記得的是神不受時間限制","top"]],"ins":"彼得後書是一封「怕你忘記」的信。從 1:9 忘記自己被潔淨，到 3:5 故意忘記神的話，遺忘是信仰的失血；而臨終的使徒用盡最後的力氣只做一件事：提醒。信仰長進的一半，是記得。"},{"gk":"δικαιοσύνη","tr":"dikaiosynē","gl":"義（連同 δίκαιος 義人）↔ 不義（ἄδικος、ἀδικία）","code":"G1343","root":"δίκη（公正、判決）","stops":[["1:1","因我們的神和救主耶穌基督之義——義先是基督給的","top"],["1:13","我以為應當（δίκαιον）——該做的事",""],["2:5","傳義道的挪亞——在不敬虔的世代傳義",""],["2:7","義人羅得——義不是完美",""],["2:8","他的義心就天天傷痛——義是還會傷痛的心",""],["2:9","把不義的人留在刑罰之下",""],["2:13","行的不義，就得了不義的工價","bot"],["2:15","巴蘭……貪愛不義之工價","bot"],["2:21","他們曉得義路，竟背棄了",""],["3:13","新天新地，有義居在其中——義不再寄居，而是安家","top"]],"ins":"義在第一節是一份禮物（基督之義），在第二章是一顆會傷痛的心（羅得），在第三章最後是一位要搬進來長住的主人（有義居在其中）。現在的世界裡，義是寄居的少數；將來，義是主人。"},{"gk":"φθορά","tr":"phthora","gl":"敗壞（連同 ἀπώλεια 滅亡、ἀπόλλυμι 沉淪）↔ 救主、得救（σωτήρ、σωτηρία）","code":"G5356","root":"φθείρω（毀壞、腐爛）","stops":[["1:1","我們的神和救主耶穌基督——以「救主」開始","top"],["1:4","脫離世上從情慾來的敗壞——神要救我們脫離的東西",""],["2:1","自取速速的滅亡","bot"],["2:3","他們的滅亡也必速速來到",""],["2:12","正在敗壞人的時候，自己必遭遇敗壞",""],["2:19","應許人得以自由，自己卻作敗壞的奴僕——假自由就是 1:4 的敗壞","bot"],["3:7","不敬虔之人受審判遭沉淪的日子",""],["3:9","不願有一人沉淪——同一個字，神說他不願意","top"],["3:15","以我們主長久忍耐為得救的因由",""],["3:16","強解……就自取沉淪",""],["3:18","我們主救主耶穌基督——以「救主」結束","top"]],"ins":"全卷被「救主」框起來（1:1；3:18），中間是一條往下的敗壞之路。轉折在 3:9：所有走向沉淪的字，到這裡碰到神的心意——「不願有一人沉淪」。假師傅應許的自由，正是神要救我們脫離的敗壞。"},{"gk":"στηρίζω","tr":"stērizō","gl":"堅固（連同 στηριγμός、ἀστήρικτος）＋ 殷勤（σπουδή、σπουδάζω）＋ 堅定（βέβαιος）","code":"G4741","root":"στῆριγξ（支柱）","stops":[["1:5","你們要分外地殷勤——回應神已賜下的一切",""],["1:10","應當更加殷勤，使……恩召和揀選堅定不移","top"],["1:12","在你們已有的真道上堅固——主給彼得的功課（路 22:32）","top"],["1:15","我要盡心竭力（σπουδάσω）",""],["1:19","更確（βεβαιότερον）的預言",""],["2:14","引誘那心不堅固的人","bot"],["3:14","就當殷勤，使自己沒有玷污……安然見主",""],["3:16","無學問、不堅固的人強解","bot"],["3:17","就從自己堅固的地步上墜落——被堅固的人，自己也要防備",""]],"ins":"「你回頭以後，要堅固你的弟兄」（路 22:32）——主交給彼得的這個字，框住了他最後一封信：開頭說你們已經堅固（1:12），結尾說不要從堅固的地步上墜落（3:17）。中間兩次「不堅固」，正是假師傅下手的地方。"}],"lesson":{"1":{"n":1,"t":"晨星在你們心裡出現——帳棚、台階、晨星","open":"一個人收拾行李、拆帳棚的晚上——彼得知道自己快走了，最想說的是甚麼？","secs":[{"h":"一、帳棚快拆了——一個人最後想說的話","ps":["弟兄姊妹平安。請你和我一起想像一個晚上。一個老人坐在一盞小油燈旁邊，慢慢地收拾行李。東西不多：一件外衣，幾卷抄好的經文，一封還沒寫完的信。他知道，過不了多久，就有人要來把他束上，帶他到不願意去的地方。他像一個旅人在拆帳棚：先把繩子鬆開，再把橛子拔起來，最後把那塊用了一輩子的布摺好。這個晚上，他只剩下一件事要做——把最想說的話寫下來。這個人就是使徒彼得。今天我們要一起讀他臨終那封信的第一章。我先問大家一個問題：如果你知道自己的帳棚快要拆了，你最想對你所愛的人說甚麼？","彼得自己告訴我們他的處境。1:13–14：「我以為應當趁我還在這帳棚的時候提醒你們，激發你們；因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的。」「正如我們主耶穌基督所指示我的」，指的是三十多年前加利利海邊那個早晨。主告訴他，年老的時候別人要把他束上，帶他到不願意去的地方；約翰還補了一句，這話是指著彼得要怎樣死，榮耀神（約 21:18–19）。三十多年來，彼得一直知道自己會怎樣死。現在，那一天近了。","「帳棚」這個字，彼得一生忘不了。在登山變像的山上，他看見主的榮光，脫口而出：「主啊，我們在這裡真好！你若願意，我就在這裡搭三座棚，一座為你，一座為摩西，一座為以利亞。」（太 17:4）那一天他想把榮耀留在山上，關進帳棚裡。幾十年後，他稱自己的身體為帳棚，而這帳棚快要拆了。1:15 他說「我去世以後」，「去世」原文是 ἔξοδος，就是「出埃及」的那個字。路加記載，那天在山上，摩西和以利亞與主談論的，正是他「去世」的事（路 9:31），用的也是這個字。年輕的彼得想把榮耀留在帳棚裡；年老的彼得知道，帳棚是要拆的，榮耀是要等的。死亡不是結束，是一次出埃及。","可是請留意，這封信的主角不是彼得。他開頭寫「西門彼得」，用的是主在海邊叫他的那個本名；先寫「僕人」，後寫「使徒」。他提起山上的榮光，卻一個字也沒提自己那天說錯的話。他提起主的指示，不是要我們佩服他多勇敢地面對死亡，而是要我們看見：主早就把結局告訴他，又陪他走了三十年。一個曾經三次不認主的人，被主叫回來、被主堅固，現在要用最後的力氣去堅固別人。不是彼得多偉大，是主多恆久忍耐。","那麼他最想說的是甚麼？整封信三章，可以濃縮成三件事：要長進、要分辨、要等候。第一章講的是長進。今天我們用三個詞走這一章：帳棚、台階、晨星。帳棚提醒我們人生是暫時的；台階告訴我們在暫時的人生裡要怎樣長；晨星告訴我們，在天亮以前，我們靠甚麼走路。"]},{"h":"二、神已將一切賜給我們——長進的起點","ps":["一個臨終的人寫遺言，照常理應該是一連串叮嚀：要這樣，不要那樣。可是彼得在第一句叮嚀之前，先寫了一句直述句。1:3：「神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。」「已將……賜給」原文是完成式：不是將要給，不是看你表現再給，是已經給了，而且現在還在你手上。給了多少？一切。範圍是「關乎生命和虔敬的事」——裡面的生命，向神的生活。","這一切怎麼送到我們手上？「皆因我們認識」那召我們的主。神不是寄一個包裹給我們就走了；他把自己給了我們，一切都在認識他裡面。很多基督徒把信仰活成一種缺乏：我還差一次聚會、一次特會、一次經歷，才算夠。彼得說，你缺的不是更多的供應，是更深地認識那一位已經供應一切的主。","接著是全章、甚至全卷神學最高的一句。1:4：「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。」「極大」原文是最高級，新約只有這裡用這個形式；一個說話直率的漁夫，到這裡找不到更大的字了。「有分」原文 κοινωνός，彼得很熟——多年前在革尼撒勒湖邊，雅各和約翰是「西門的夥伴」（路 5:10），同一個字。那時有分的是一條船、一網魚；如今主說，你要有分的，是我的生命。","這一句要誠實地畫線，因為它很容易講偏，也很容易被跳過。歷代教會有幾種讀法：東正教講「成神論」，他們小心分開神的「本質」與神的「能力」，說人藉恩典有分於神的能力，卻永遠是受造者；改革宗講與基督聯合；衛斯理傳統講完全的愛；許多福音派註釋講道德的相似。本講義採的是：在基督裡與基督聯合，有分於神的生命與品格。三條界線要記住：第一，創造者與受造者的分別永遠存在，人不會變成另一位神，也不與神的本質混同；第二，有分是恩典，不是修煉，是「他已將又寶貴又極大的應許賜給我們」；第三，有分的內容彼得自己寫在下文——脫離敗壞，然後是德行、知識、節制、忍耐、虔敬、愛弟兄、愛眾人。","所以次序絕對不能顛倒：先是神的完成式，才有我們的命令式。長進不是爬上去見神，是神已經下來把一切賜給我們，我們才在其中長大。"]},{"h":"三、原文亮光：慷慨供應、瞇著眼睛、帶光的星","ps":["這一章有好幾個新約只出現一次的字。今天我們只拿三個字來看，每一個字都要在半分鐘之內變成生命。","第一個字是 ἐπιχορηγέω，1:5 的「加上」。古希臘城邦辦戲劇節，要有一個人出錢供應合唱團的服裝、訓練與演出，這個人叫 χορηγός。那是一份榮譽，大家比的是誰供應得大方。彼得說：在你的信心裡，大方地供應出德行來。不是勉強湊數，是慷慨。更美的是，同一個字在 1:11 又出現，換成被動式：「必叫你們豐豐富富地得以進入」——「得以進入」就是「被供應進入」。你在這裡大方地供應德行；神在那裡更大方地供應你進國的門。先有神的大方，才有我們的大方。","第二個字是 μυωπάζω，1:9 的「只看見近處的」。新約只用這一次，英文 myopia，近視，就從這裡來。字根是「瞇眼」。不是天生看不見，是自己把眼睛瞇起來，只盯著眼前那一點。眼前的那一點是甚麼？這個月的帳單、孩子的成績、別人的一句話。看不見的遠處是甚麼？1:11「永遠的國」。病根寫在下半句：「忘了他舊日的罪已經得了潔淨」。這個人忘記的不是規條，是恩典。一個忘了自己被赦免多少的人，就長不出忍耐和愛。治這種近視的方法很溫柔：不是更用力，是想起來。","第三個字是 φωσφόρος，1:19 的「晨星」，字面是「帶光的」，新約也只有這一次。1:19 說：「我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。」「暗處」原文是又乾又髒的地方——就是我們所住的世界。燈不是太陽，它不會把全世界照亮，只照亮你腳前的一步；可是天亮以前，燈就是你最可靠的光。天亮，是主再來的那個早晨；晨星，是他自己——主說：「我是明亮的晨星。」（啟 22:16）那時燈可以放下，因為光本人來了；而在那以前，同一位主已經在信他的人心裡點起亮光。","三個字放在一起，就是這一課：神先大方，所以我們大方地長；別瞇著眼只看近處；在燈下留意，直到晨星出現。"]},{"h":"四、八個台階，走到愛眾人","ps":["現在來看那八個台階。1:5–7：「正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識；有了知識，又要加上節制；有了節制，又要加上忍耐；有了忍耐，又要加上虔敬；有了虔敬，又要加上愛弟兄的心；有了愛弟兄的心，又要加上愛眾人的心。」","先看開頭四個字：「正因這緣故」。因為神已經給了一切，所以你們要分外殷勤。恩典不叫人閒懶，恩典叫人起身。再看介系詞：原文不是「在信心上面」，是「在信心裡面」。德行從信心裡長出來，知識從德行裡長出來——像一棵樹，不是一道樓梯。所以這不是八道關卡，要你一關一關打怪升級。起點與終點是確定的：起點是信心，那是神分給你的（1:1）；終點是愛，那是神的性情最完整的樣子。中間是互相扶持的品格。","請注意，知識只在第二級。認識主若停在腦子裡，就長不出節制與忍耐。最後兩級都是愛人：先愛弟兄，再愛眾人。品格的頂點不是一個人多屬靈，是他多能愛。1:8 說，這些若在你們裡面，而且不斷增多，認識主就不至於閒懶不結果子。","講到這裡，熟悉321的弟兄姊妹可能會想到「改變觀念八大步驟」：資訊、啟示、信服、實踐、檢討、修正、反覆、繁殖。同樣是八項，但我要明說：兩者是兩回事。彼得的八項是品格的果子，321的八步是觀念改變的過程。不可以說彼得也有八大步驟，也不要把經文當成321的插圖。先讓經文講完自己的話。","1:10–11 給這一段一個應許：「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳。這樣，必叫你們豐豐富富地得以進入我們主救主耶穌基督永遠的國。」「堅定不移」是當時契約上「確實有效」的字：源頭在神，確據在生命。寫「永不失腳」的人，曾經在水面上往下沉，「耶穌趕緊伸手拉住他」（太 14:31）。他知道失腳是甚麼滋味，也知道是誰把他拉起來。今天你的信心裡最缺哪一項的供應？別急著一次補齊八項；在信心裡大方地供應一項，那一位已經供應你一切的主，會在你裡面供應下一項。"]},{"h":"五、幾個必須認得的偏差","ps":["第一個偏差，是把 1:4 講成人成神。有人說「與神的性情有分」，就是人可以修到跟神一樣。這不是彼得的意思。創造者與受造者的分別永遠存在；連東正教講成神論，也小心分開神的本質與能力。321說「無己不是沒有，乃是進入無限」，在這一節只能說成：進入與無限之神的相交，基督在我裡面活著（加 2:20），不是人變成無限。界線守住了，這句話才是福音，不是自我膨脹。","第二個偏差，是因為怕講錯，就乾脆跳過 1:4。有些講台讀到這一節就快快帶過。可是彼得用了他找得到最大的字來寫它，我們沒有權利省略。跳過 1:4，信仰就只剩下規條和努力；講明 1:4，我們才知道，神給我們的不只是一套道德，是他自己的生命。不要因為有人講過頭，就連真理也不敢講。","第三個偏差，是把長進當成靠自己爬。把 1:5–7 抽出來，掛在牆上當作晉級表，每天量自己爬到第幾級。這樣讀，會讓人要不驕傲、要不絕望。彼得在清單前面放了「正因這緣故」——先有神已經給的一切，才有我們的殷勤。長進是在恩典裡長大，不是靠自己的力氣爬上天。","第四個偏差，是把屬靈經歷放在聖經之上，或者反過來貶低經歷。有人說「我有異象、有感動，比聖經更直接」；也有人說「經歷都靠不住，只要教義」。彼得兩邊都不站。他有過山上的經歷，而且很珍惜；但他說「我們並有先知更確的預言」——經歷證實了聖經，聖經解釋了經歷。經歷要放在聖經的燈下檢驗，不可拿來取代那盞燈，也不必因此看輕神在你身上真實做過的事。","第五個偏差，是用 1:20 禁止自己讀經。有人說：「經上所有的預言沒有可隨私意解說的，所以你不要自己讀，會讀錯。」可是 1:21 用「因為」接下去，說明的是預言的來源：不是先知自己想出來的，是人被聖靈感動，說出神的話來。這節不是叫信徒別碰聖經。讀經的保護不是把聖經鎖起來，是在群體中讀、照上下文讀、謙卑地讀。"]},{"h":"六、兩個華人處境的真實問題","ps":["第一個問題：信主多年，卻越來越「近視」，眼裡只有升學和房貸，怎麼辦？很多華人家庭的弟兄姊妹，不是不愛主，是太忙。孩子要補習、要考試；房貸要繳三十年；父母年紀大了要照顧。日子一久，眼睛就只看見近處的。彼得沒有說這些事不重要，他是說：不要忘了你舊日的罪已經得了潔淨，不要忘了前面有永遠的國。做法可以很小：每天早上先用五分鐘讀一段經文，再打開手機看行程；每週一次和家人說一件主怎樣看顧你們的事。眼睛常常往遠處看一眼，近處的事反而擺得對。不是不顧帳單，是在帳單之上，還有一位主。","第二個問題：家裡的長輩說「讀經交給牧師就好，你自己讀會讀偏」，該怎麼回應？這句話常常出於好意，長輩見過有人斷章取義、走偏了路。我們先要尊重這份擔心。但 1:20 不是禁止讀經的經文；1:19 反而說「你們在這預言上留意……才是好的」——留意的是「你們」，每一個信徒。可以溫柔地回應：「您說得對，我不要憑私意讀。所以我跟小組一起讀，照上下文讀，不明白的就請教牧者。」牧者的責任是幫助會眾讀，不是代替會眾讀。燈是給每一個人拿在手上的。"]},{"h":"七、活出321——在燈下一步一步長","ps":["先說三個基礎。耶穌是我的榜樣：彼得在山上看見的，是父說「這是我的愛子，我所喜悅的」那一位；1:3 說他用自己的「美德」召我們，而 1:5 的「德行」正是同一個字——他身上有的，他召我們加上。聖經是我的準則：1:19 說，天亮以前，先知的話是照在暗處的燈；準則不是棍子，是燈。聖靈是我的引導：1:21 說人是「被聖靈感動」說出神的話，原文像帆船被風推著走；那一位帶著先知說話的聖靈，今天也帶著我們讀，帶著我們長。","再說兩個核心。讓耶穌作王：1:11 說那國是「我們主救主耶穌基督永遠的國」，連進國的門也是他親手打開的；1:1 更直稱他為「我們的神和救主耶穌基督」。讓耶穌得著一切的榮耀：彼得寫帳棚、寫聖山，卻沒有寫自己的功勞；他記得的不是自己說了甚麼，而是父對子說的那一句。這封信的最後一句，就是「願榮耀歸給他」。","最後是一個目的。建立屬神的體系：一個帳棚快拆的人，最後的殷勤是「使你們在我去世以後時常記念這些事」。他不是在建立自己的名聲，是在一代一代人的心裡建立對主的記念。這就是920：臨終的人還在激發他的「2」。八個台階的終點是愛眾人，屬神的體系就是這樣，從一個人的品格，長到一群人的彼此相愛。"]},{"h":"八、四種心，同一盞燈","ps":["驕傲型的心說：「這些我都知道了。」彼得卻說：「你們雖然曉得這些事……我卻要將這些事常常提醒你們。」知道不等於長進；肯被提醒，就是謙卑的開始。","恐懼型的心說：「我怕自己有一天會跌倒、會失落。」彼得說：「你們若行這幾樣，就永不失腳。」寫這句話的人曾經往下沉，是主伸手拉住他。你的確據不在你抓得多緊，在他拉得多牢。","羞恥型的心說：「我過去那麼糟，怎麼配談長進？」1:9 說，不長進的病根是「忘了他舊日的罪已經得了潔淨」。不是忘了自己多糟，是忘了已經被洗淨。彼得在信的開頭寫上主在海邊叫他的本名——那個被接回來的名字，也是你的。","受傷型的心說：「我在教會被人用聖經壓過，被當成次等的信徒。」1:1 說你和使徒「同得一樣寶貴信心」，教會裡沒有二等信徒。燈是用來照路的，不是用來打人的；願主親自醫治那些被燈砸傷的人。"]},{"h":"九、這一週，你可以做的幾件事","ps":["第一，每天早上先用五分鐘讀彼得後書第一章的一小段，讀完問一句：主今天已經賜給我甚麼？然後才打開手機。第二，從 1:5–7 選一項你最缺的品格，寫在一張卡片上，這一週在一件具體的事上大方地供應它。第三，做一次「眼科檢查」：寫下這一週最佔據你心思的一件近處的事，再把 1:11「永遠的國」寫在它旁邊。第四，找一位你的「2」，傳一段 1:19 給他，告訴他你為甚麼需要這盞燈。第五，這一週和小組或家人一起讀一段聖經，照上下文讀，彼此問：「這段經文原來在說甚麼？」","請大家一起說出四句話。我宣告：神的神能已將一切關乎生命和虔敬的事賜給我，我不再活在缺乏裡。我宣告：我在信心裡大方地供應，靠主的恩典一步一步長到愛眾人。我宣告：我不瞇著眼只看近處，我記得我舊日的罪已經得了潔淨。我宣告：天亮以前，主的話是我腳前的燈，直到晨星在我心裡出現。"]},{"h":"十、結語","ps":["讓我們回到那個收拾行李的晚上。油燈快要燒盡，老彼得把信摺好。他不知道這封信會被讀上兩千年；他只知道，帳棚要拆了，主要他堅固弟兄。他留給我們的不是自己的故事，而是三句話：神已經給了一切，所以要加上；天還沒亮，所以要留意那盞燈；晨星一定會出現，所以不要放下。","弟兄姊妹，這一課的焦點不在彼得，也不在我們爬到了第幾級，而在那一位用自己榮耀和美德召我們的主。帳棚會拆，台階會走得慢，但晨星一定出現。讓我們一起禱告。","親愛的天父，謝謝你藉你的神能，已將一切關乎生命和虔敬的事賜給我們。求你醫治我們的近視，叫我們想起自己已經被潔淨；求你幫助我們在信心裡大方地供應，一步一步長到愛眾人；求你叫我們在暗處留意你的話，直等到天發亮，晨星在我們心裡出現。願榮耀歸給主耶穌，從今直到永遠。我們這樣禱告，是奉主耶穌基督的名禱告，阿們。"]},{"h":"十一、小組討論分享：三個化","ps":["接下來進入小組，用三個化把今天這盞燈拿在手上。"]}],"deep":[{"sec":0,"q":"彼得後書真的是彼得寫的嗎？為甚麼有人懷疑？","a":"早期教會接受這卷書比較慢，俄利根、優西比烏都提到有人存疑；它的希臘文風和彼得前書很不一樣，第二章又和猶大書大段相似，所以近代不少學者主張是彼得的門徒託他的名寫成。支持彼得是作者的一方則指出：信中自稱西門彼得，親眼見過登山變像，提到主預告他的死；文風的差異，可能與經手的人不同有關——彼得前書提到託西拉轉交（彼前 5:12），西拉或許也參與執筆，這一封則沒有提到。本講義採使徒彼得為作者，同時並陳託名說，不迴避早期教會的討論。對信心來說，這卷書歷代被教會承認在正典裡；不論學者怎樣討論作者，我們信靠的不是寫信人的名聲，而是信中所見證的那一位主。"},{"sec":1,"q":"「與神的性情有分」會不會讓人以為自己可以修成神？","a":"會，所以要講清楚，但不要因此不講。彼得用的「性情」不是哲學上講本體的那個字，而且他自己馬上定義了內容：脫離世上的敗壞，加上德行、知識、節制、忍耐、虔敬、愛弟兄、愛眾人。換句話說，神的性情落在人身上，長出來的是品格，不是神的權柄。東正教講成神論，也特意分開神的本質與能力，正是為了不讓人以為受造者會與神混同。所以可以記三句話：分別永存——你永遠是被造的，他永遠是神；有分是恩典——是他把應許賜給你，不是你修出來的；內容是愛——越有分於他，越能愛人。一個人若因為這節經文變得高傲，就說明他還沒有真正有分，因為神的性情最像的樣子，是十字架上的捨己。"},{"sec":2,"q":"「更確的預言」是不是說屬靈經歷都不可靠？","a":"不是。彼得自己有過一生最強烈的屬靈經歷：在山上看見主的榮光，聽見天上的聲音。他沒有看輕這經歷，反而用它作見證。他說「我們並有先知更確的預言」，意思是：山上的經歷，正好叫舊約的預言更確定了；而你們沒有上過那座山，卻同樣手裡有這更確的話。經歷證實聖經，聖經解釋經歷。實際的分辨很簡單：你的感動、夢境、經歷，放在聖經的上下文裡，是幫助你更愛主、更像主，還是讓你越來越以自己為中心？前者可以感恩，後者要回到燈下重新檢驗。經歷是會過去的閃光，聖經是天亮以前一直在手裡的燈。如果你從來沒有特別的經歷，也不必羨慕別人；收信的人也沒有上過那座山，彼得卻說他們的信心和使徒一樣寶貴。"},{"sec":3,"q":"八個台階一定要一級一級照次序爬完嗎？","a":"不必這樣讀。原文的介系詞是「在……裡面」，德行是在信心裡供應出來的，知識是在德行裡供應出來的，所以它比較像一棵樹同時長出許多枝子，而不是一道要先踩穩第一級才能踩第二級的樓梯。古代修辭常用這種一層接一層的句型，起點與終點是刻意安排的：起點是神分給你的信心，終點是愛。中間的品格彼此扶持，節制幫助忍耐，忍耐成全愛弟兄。實際上，你可能在忍耐上很弱，在愛弟兄上卻已經長了一些；這很正常。這週只要選一項，在一件具體的事上大方地供應它，就是在長進。也不要拿這張清單去量別人，說某人還停在第幾級；它是給我們照自己的鏡子，不是給我們評分別人的尺。"},{"sec":3,"q":"1:10 說要使恩召和揀選堅定，難道揀選要靠我自己撐住？","a":"這是全章最容易讓人不安的一節。各家讀法不同：改革宗多說，揀選本身不會動搖，「使之堅定」是讓它在你的生命和見證中變得確實；阿米念傳統則強調人的回應真實地參與在保守之中。從字來看，「堅定不移」是當時契約上「確實有效」的用語，動詞又是「為你們自己」的語態，對象是你的確據，不是在神那邊補上甚麼。所以本講義的理解是：源頭在神，確據在生命。品格不是買門票，是讓蒙召的人自己看見、也讓別人看見：這呼召是真的。緊接著的應許是「就永不失腳」，用的是希臘文最強的否定。寫這話的人曾經跌得很重，是主拉住了他。"},{"sec":4,"q":"1:20 說沒有可隨私意解說的，那我自己讀經會不會讀錯？","a":"有可能讀錯，但答案不是不讀，而是好好讀。1:20 的重點是預言的來源：先知沒有照自己的意思去解開他看見的，因為 1:21 說預言是人被聖靈感動說出來的。既然經文不是出於人意，讀的人也不可以照私意扭曲它，第三章就警告有人「強解」。保護有三個：第一，在群體中讀，跟小組、跟牧者一起讀，不是一個人關起門來發明新意思；第二，照上下文讀，先問這段在原來的信裡說甚麼，再問今天怎樣應用；第三，謙卑地讀，讀不懂的地方先放著，求聖靈光照，也請教別人。這樣讀，你會讀得越來越準。"},{"sec":6,"q":"1:1「我們的神和救主耶穌基督」是指一位還是兩位？","a":"原文是一個冠詞統管「神」和「救主」兩個名詞，中間用「和」連起來；按照這種希臘文句型，兩個稱號通常指同一位，就是「我們的神，也是救主，就是耶穌基督」。也有人讀成兩位：神指父，救主指子，理由是緊接的 1:2 就把神與主耶穌分開，少數抄本這裡也作「主」。但本卷自己提供了最好的證據：1:11、2:20、3:18 都用同一句型說「我們主救主耶穌基督」，沒有人把那三處讀成兩位。所以本講義讀作一位：這是新約直稱耶穌為神的經文之一。這對生活很實際——讓耶穌作王，不是請一位好老師坐上寶座，而是承認他本來就是神。"},{"sec":8,"q":"我想提醒一位弟兄姊妹，卻怕人家嫌我囉嗦，該怎麼開口？","a":"彼得也重複，而且說得很坦白：「你們雖然曉得這些事……我卻要將這些事常常提醒你們。」愛人的人不怕重複，但提醒的方式要溫柔。第一，先分享自己，不先指出對方：「這週這節經文提醒了我……」，對方比較容易聽。第二，提醒恩典，不只提醒責任：彼得先說神已經給了一切，才說要加上。第三，短而具體：傳一節經文，加一句你的禱告，不要寫長篇。第四，持續而不催逼：一週一次，比一次說十句有用。最後，記得提醒你的「2」之前，先求主提醒你自己。如果對方一時聽不進去，也不必灰心；彼得說他要「常常」提醒，有些種子要過很久才發芽，而叫它生長的是神。"}],"hua":[{"h":"第一化：內化（約20分鐘）","aim":"※ 目的：把今天的經文放進心裡，說得出第一章帳棚、台階、晨星三個畫面。","note":"※ 帶領提醒：先讓每個人說，不急著糾正；每人約一分鐘，安靜的組員可以只說一句。第四題若有人提到已經離世或關係破裂的人，溫柔接住，不追問細節。","qs":[{"n":1,"lv":"★","q":"帳棚、台階、晨星，哪一個詞最打動你？用一句話說出原因。"},{"n":2,"lv":"★★","q":"1:3 說神「已將一切」賜給我們。說一件你其實已經有、卻一直覺得不夠的事。"},{"n":3,"lv":"★★","q":"1:5–7 的八項品格裡，你最缺的是哪一項？最近在甚麼場合最明顯？"},{"n":4,"lv":"★★★","q":"如果你知道自己的帳棚下個月就要拆了，你最想對哪一個人說哪一句話？說出他的名字。"}]},{"h":"第二化：消化（約35分鐘·主軸）","aim":"※ 目的：從看見自己走到走一步，讓 1:9 的近視被 1:19 的燈照到。","note":"※ 帶領提醒：若分享觸及過去的傷害或長期的無望感，不追問細節、不要求當場原諒任何人；會後單獨關心，必要時協助尋求專業協助。","qs":[{"n":5,"lv":"★★","q":"【看】看見自己：這一週最佔據你眼睛的「近處」是甚麼？升學、房貸、工作，還是一個人？"},{"n":6,"lv":"★★","q":"【聽】聽神說話：一起讀 1:9 與 1:11，主藉這兩節對你說的是哪一句？"},{"n":7,"lv":"★★★","q":"【想】想通關卡：是甚麼讓你「忘了他舊日的罪已經得了潔淨」？是忙碌、羞恥，還是覺得自己不夠好？"},{"n":8,"lv":"★★","q":"【講】說出口：轉向身邊一位組員說：「主已經潔淨了我，這週我要……」"},{"n":9,"lv":"★★★","q":"【行】走一步：這週哪一天、甚麼時間、在哪一件具體的事上，你要供應一項品格？當場說出來。"}]},{"h":"第三化：轉化（約25分鐘）","aim":"※ 目的：把燈傳出去，由內而外改變關係與事工。","note":"※ 帶領提醒：鼓勵當場說出名字與時間；一時想不出對象的，不要勉強，請他會後與帶領者再談。","qs":[{"n":10,"lv":"★★","q":"1:12 彼得說「常常提醒」。誰曾經一再提醒你、堅固你？這週你要怎樣謝謝他？"},{"n":11,"lv":"★★★","q":"920 操練：找出你的那一個「2」，這週向他分享 1:19 的燈與晨星。當場說出他的名字，和你哪一天聯絡他。"},{"n":12,"lv":"★★","q":"這週你要和誰一起照上下文讀一段聖經？訂好時間與地點。"},{"n":13,"lv":"★★","q":"1:7 的終點是愛眾人。說出一位教會外、不太好愛的人，和這週你可以為他做的一件小事。"},{"n":14,"lv":"★★★","q":"【必做】用三句話把這一課講給一位教會外的朋友聽：神已經給了一切；所以我在愛裡長；天亮以前我靠他的話走路。說出這位朋友的名字。"}]},{"h":"收尾（5分鐘）","ps":["全組一起讀 1:19，帶領者為每一位的「2」和這週要走的一步禱告。散會前彼此提醒：天還沒亮，燈在手裡，晨星一定出現。"]}]},"2":{"n":2,"t":"主知道搭救——乾井、羅得、回頭","open":"一口在旱季裡被人指路去打水、走到跟前卻是乾的井：渴的人最受傷；從乾井轉向 2:9「主知道搭救」。","secs":[{"h":"一、乾井會從裡面冒出來（2:1–3）","ps":["弟兄姊妹平安。請你想像一個畫面：旱季，村子裡的水缸都見底了，一位母親背著空桶，聽人指點說：「山後面那口井有水，大家都去那裡打。」她走了兩個鐘頭的山路，到了井邊，探頭一看，井底是乾裂的石頭。最受傷的是誰？不是不渴的人，是最渴的人。她把最後的力氣都花在那條路上了。彼得後書第 2 章，就是一位老牧人為口渴的羊寫的一章。他說：「這些人是無水的井。」（2:17）今天我們不是來找誰是乾井，是來學怎樣認出水、怎樣回到活水的源頭。","彼得一開口就說：「將來在你們中間也必有假師傅。」危險不是從城外攻進來，是「在你們中間」長出來。「私自引進」的意思，是在真道旁邊悄悄夾帶；所以假師傅很少自稱是假的，他們說很多對的話，只在最要緊的地方換掉一樣東西。換掉的是甚麼？「連買他們的主他們也不承認。」那個「主」是在市場上付了價、有產權的主人。基督用自己的血把我們買回來，他們卻用生活說：我不屬於誰。","這裡有一個字要停下來。「不承認」原文 ἀρνέομαι，正是大祭司院子裡彼得三次不認主的那個字。寫這句話的人，自己不承認過主。他和假師傅的分別，不是他從來沒有跌倒，而是主轉過身來看他，他出去痛哭，後來在海邊被主接了回來。所以這一章不是一位完美的人居高臨下地定罪，是一個被拉回來的人，看見別人正往懸崖走時的大聲呼喊。我們讀這一章，也要用同樣的口氣讀——先照自己，再分辨別人。這一章最難的功課，是怎樣講假師傅，而自己不變成法利賽人。","2:2 還有一句常被跳過的話：「將有許多人隨從他們邪淫的行為，便叫真道因他們被毀謗。」假師傅的危險，在於他們常常很成功，跟的人很多。結果受傷的不只是跟從的人，還有「真道」本身。外面的人分不出誰真誰假，只看見一群自稱跟從耶穌的人放縱、貪財，罵的就是這條路。所以分辨不只是為了保護自己，也是為了保護主的名。一間教會最好的見證，不是說別人錯，是自己在金錢和生活上經得起看。","2:3 用三個詞說出乾井的動機和方法：「貪心」、「捏造的言語」、「取利」。「捏造」是陶匠捏泥的字，照聽眾想聽的形狀捏；「取利」是做買賣。最刺眼的是受詞：「在你們身上」。在這種講道裡，羊不是被牧養，是被當成貨。但彼得接著說：「他們的刑罰，自古以來並不遲延；他們的滅亡也必速速來到。」原文是審判沒有閒著、沒有打盹。看見乾井風生水起，不要以為神睡著了。這也是第 3 章「主不是耽延」的伏筆：神一直醒著，只是他在等。"]},{"h":"二、三個審判，兩個搭救（2:4–9）","ps":["2:4 到 2:9 在原文是一個很長的句子，開頭是「若」，結尾才說「那麼」。若神沒有寬容犯罪的天使；若神沒有寬容上古的世代，卻保護了傳義道的挪亞一家八口；若神傾覆所多瑪、蛾摩拉，卻搭救了義人羅得——那麼，「主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子」。三個審判裡，藏著兩個搭救。這一長句的終點不是火，是一隻伸出來的手。這就是全章、甚至全卷的樞紐。","先看第一個例子：連天使都沒有被放過。天使比人更有能力、更靠近神，但離開本位，就被交在黑暗中等候審判。彼得這樣開頭，是回應讀者心裡的疑問：假師傅那麼有恩賜、有魅力、有影響力，神會管嗎？他說，比他們更有能力的，神都沒有放過。審判不看身分、不看恩賜、不看人數。至於天使怎樣犯罪、地獄在哪裡，這些可以在書房裡謹慎研究，彼得沒有展開，我們也不必把今天變成天使學講座。","挪亞是「傳義道的」，原文是傳令官。一個世代沒有人回應他，用今天的數字看，他是很失敗的傳道人；但神親自看守他。羅得更叫人皺眉：他選了所多瑪，危急時遲延不走，天使要拉著他的手才出城。彼得怎麼一連三次稱他「義人」？答案在 2:8：「他的義心就天天傷痛。」他沒有能力改變那座城，也沒有勇氣離開，但他的心還沒有麻木。義不是完美，是一顆還會痛的心。而且他蒙救不是因為他夠好，「搭救」的主詞是神。","「主知道」是懂得怎樣。他拉挪亞用一條船，拉羅得用兩位天使的手；方法不同，但他都懂。「脫離試探」是從試煉裡面拉出來，不是保證你不進洪水。老彼得寫「主知道」，一定想起加利利海邊那一句：「主啊，你是無所不知的；你知道我愛你。」（約 21:17）一個自己靠不住的人，被一位知道的主拉回來。所以第 2 章所有嚴厲的話，都掛在 2:9 上：彼得講審判，是為了叫敬虔的人安心，不是叫他們害怕；更不是叫我們替神去清理門戶。","今天也有人住在所多瑪中間——在螢幕裡、在辦公室裡、在飯局上。危險不在於看見，而在於看久了不痛。還會痛，就還有義心。你若因為身邊不義的人很得勢而疲倦，2:9 不是叫你去算誰會受罰，是叫你把眼睛從他們身上移回主身上：審判是主的事，搭救也是主的事，我們的本位是敬虔。"]},{"h":"三、原文亮光：任性、下餌、無水的井","ps":["第一個字，2:10「任性」αὐθάδεις。這個字由「自己」和「取悅」組成，是以取悅自己為生活準繩的人。保羅說監督必須「不任性」，用的就是這個字——最危險的任性，常常出現在有講台的人身上。這就是 321 說的「有己」：自己要作主作王。彼得對照說，天使力量權能更大，也不用毀謗的話在主面前告人；假師傅弱得多，卻隨口宣判他們不懂的事。驕傲就是離開本位，抓住只屬於神的審判權。","第二個字，2:14「引誘」δελεάζω，是下餌的字。漁夫出身的彼得一眼就認得出來。主當年對他說：「我要叫你們得人如得魚一樣。」現在他看見另一種得人：用餌釣人。餌下給誰？「那心不堅固的人」。那一夜主對他說：「你回頭以後，要堅固你的弟兄。」假師傅專找沒有被堅固的人。所以門訓、陪伴、在真道上扎根，不是教會的額外節目，是保護羊群的籬笆。","在第二個字和第三個詞中間，彼得講了一個很幽默的故事：巴蘭騎著驢去赴那份「不義的工價」，路上三次被耶和華的使者攔住；先知看不見，驢看見了。他打了驢三次，直到「那不能說話的驢以人言攔阻先知的狂妄」。被錢沖昏頭的人，比一頭驢還不清醒。神今天的「驢」，可能是一句你看不起的人說的話、一個一再受阻的計畫。被攔住的時候，先別急著打驢，先問：我是不是正往不義的工價那裡走？","第三個詞，2:17「無水的井」πηγαὶ ἄνυδροι。在乾旱的山地，泉源就是命。耶利米說：「我的百姓做了兩件惡事，就是離棄我這活水的泉源，為自己鑿出池子，是破裂不能存水的池子。」乾井佔住了源頭的位置，人來要水，它給不出水。面對乾井，出路不是去找一口更大、更有名的井，而是回到那一位：「人若喝我所賜的水就永遠不渴。」（約 4:14）也要問自己：我帶給身邊的人的，是水，還是霧？"]},{"h":"四、假自由與兩種回頭（2:19–22）","ps":["乾井最有吸引力的一句話是：「你自由了。」2:19 說：「他們應許人得以自由，自己卻作敗壞的奴僕，因為人被誰制伏就是誰的奴僕。」「制伏」是打敗仗；古代戰敗的人就成了戰勝者的奴隸。他們以為自己戰勝了規條，其實是被情慾打敗。全卷只有兩種僕人：彼得在 1:1 自稱「耶穌基督僕人」，另一種是敗壞的奴僕；沒有第三種「誰都不作主人」的人。自己作主的人，最後被別的東西作主。自由不是沒有主人，是有一位好主人。","再看 2:18 他們找的對象：「那些剛才脫離妄行的人」。剛信主、剛離開舊生活、還沒站穩的人，最容易被一句「你已經自由了，不必那麼拘謹」打動；用的餌，正是他們剛剛逃出來的那個東西。這叫我們看見教會對初信者的責任：不是給他們一堆規條，而是有人陪他們走頭一年，讓他們在真道上扎根，知道真自由是在基督裡越來越不被情慾捆綁。","接著是全章最沉重的三節：「末後的景況就比先前更不好了」，狗轉過來吃所吐的，豬洗淨了又回泥裡去滾。外面洗過了，本性沒有變。歷代教會對這幾節有三種讀法：有人說真信徒可能失落，有人說這些人從未真正重生，也有人說警告本身就是神保守信徒的工具。不論你站在哪一種，有一件事要看清楚：上下文 2:17–19 講的是假師傅和跟隨他們、又去引誘別人的人，不是一位跌倒了、心裡很痛、很想回來的弟兄姊妹。","彼得在這裡埋了一個只有他懂的字。狗「轉過來」，原文和主對他說「你回頭以後」是同一個字。同一個動作，兩個方向：一個轉回嘔吐物，一個轉回主面前。如果你今天害怕自己就是 2:20 說的那種人，你會害怕，本身就說明你的心還沒有麻木。請聽 1:9：「忘了他舊日的罪已經得了潔淨」——你的罪是被潔淨過的。請聽 3:9：「不願有一人沉淪，乃願人人都悔改」——主還在等。今天就回頭，像彼得那樣回到主面前。"]},{"h":"五、幾個必須認得的偏差","ps":["第一個偏差，是把這一章變成獵巫：在講台、小組或群組裡點名今天某位牧者、某間教會、某個宗派或某個平台的講員是假師傅。彼得給的是記號，不是名單——對基督、對金錢、對身體、對權柄、對自由五個記號，都是果子，不是口才，也不是宗派標籤。講台教會眾分辨，不替會眾判決。","第二個偏差，是用 2:10「輕慢主治的」、「毀謗在尊位的」堵住對教會領袖的正當質疑，說「你批評牧師就是輕慢主治的」。這不是經文的意思：這一章被定罪的正是「師傅」，是有講台的人；彼得給長老的命令是「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。照真理、在愛中、按程序提出的問題，不是毀謗。","第三個偏差，是用 2:20–22 恐嚇跌倒、掙扎的信徒，對他說「你就是那條狗」。這是誤用。這幾節的對象是假師傅和跟隨的人；跌倒而想回來的人，要聽的是 1:9 的潔淨和 3:9 的寬容。我們沒有權柄對任何一個人宣判結局，那是主的事。","第四個偏差，是只看別人，不照自己。讀完這一章，很會指出誰貪心、誰任性，卻從不問：我有沒有在真道旁邊夾帶自己的東西？我愛聽某種講道，是因為它真，還是因為它照我想要的形狀捏？分辨先從自己的心開始。","第五個偏差，是把「分辨」變成不再信任任何人：被乾井騙過一次，就說所有的井都是乾的，從此不進教會、不聽講道、不讓任何人陪伴。這樣做看似謹慎，其實是把自己留在旱地。彼得的出路不是不喝水，是回到活水的泉源，並且在一個彼此堅固的群體裡喝。"]},{"h":"六、兩個華人處境的真實問題","ps":["第一個問題：群組裡有人轉來一段影片，標題寫著「某某原來是假先知」，要不要再轉出去？先停三秒，問四件事。這段影片在教我認記號，還是在給我名單？它照著真理、有事實、有程序，還是剪接加上情緒？我轉出去，是為了保護人，還是為了證明自己比較屬靈？我有沒有先為這個人禱告？多數時候，最合聖經的做法是不轉；若真有教會內的錯謬或侵害，就照程序、向該負責的人、在愛中公開透明地處理，而不是在網路上定罪。","第二個問題：一位你敬重的長輩熱心地介紹你去聽一位講員，說只要奉獻某個數目，神就保證加倍回報；或拉你投資一個「教會弟兄合辦、保證賺錢」的項目。拒絕他，好像不尊重長輩。這時候用 2:3 的記號照一照：有沒有貪心？有沒有捏造的言語？有沒有把人當作取利的對象？你可以溫和地說：「謝謝您想到我，這件事我需要先和家人、和教會的長執一起禱告。」尊重長輩，不等於把錢和判斷交出去。若已經受了損失，不要因為羞愧一個人扛，教會願意陪你，必要時也該尋求專業或法律的協助。"]},{"h":"七、活出321——在乾井的時代，回到活水","ps":["耶穌是我的榜樣。彼得被主轉過身來看了一眼，就回頭了；主沒有放棄跌倒的他。我們分辨錯謬時，也要帶著主看彼得的那種眼光，不是審判官的眼光。主在 2:9 怎樣懂得搭救，我們也學習怎樣把人拉回來，而不是把人推下去。","聖經是我的準則。準則是燈（1:19），不是棍子。我們用五個記號先照自己，再在群體中、照上下文、謙卑地分辨，不憑傳聞，不憑情緒。1:20 不是叫我們不敢讀經，是叫我們在神的話面前謙卑地一起讀。","聖靈是我的引導。乾井用餌引誘不堅固的人；聖靈引導我們回到活水，叫我們在真道上被堅固。用心靠聖靈，不要用腦靠自己；聖靈會在我們心裡敲警鐘，也會在我們心裡帶來安慰。","讓耶穌作王。2:19 說，人被誰制伏就是誰的奴僕。不讓耶穌作王，就會被貪心、情慾或自己的意思作王；讓他作王，才是真自由。舊人有己要自己作主，新人無己讓耶穌在裡面活。","讓耶穌得著一切的榮耀。2:9 說，搭救是主的事。被救出來的人沒有可誇的，羅得不能誇，彼得也不能誇，榮耀全歸給那位知道搭救的主。我們在分辨的事上也不搶功勞，不需要成為「揭發假師傅的人」。","建立屬神的體系。屬神的體系不是靠揭發別人建立的，是靠彼此堅固：財務透明、講台不賣應許、陪伴剛脫離妄行的人，讓每一位不堅固的人都有人看顧。先生命，再關係，後事工；人比事重要。"]},{"h":"八、四種心，同一位知道搭救的主","ps":["驕傲型的心，讀這一章最容易興奮，因為可以指出別人的錯。主對你說：先照你自己。任性的根就是有己；放下審判的權柄，回到本位，讓神作神。謙卑戰勝驕傲：你最需要的不是更準確的眼光，而是一顆會為別人流淚的心。","恐懼型的心，讀完會想：我被騙過，以後誰都不敢信了。主對你說：我知道搭救。你不必靠懷疑一切來保護自己，回到活水，在群體裡被堅固，就是最好的保護。分辨不是關上門，是學會開對的門。","羞恥型的心，讀到狗和豬就低下頭，覺得說的就是自己。主對你說：你的罪已經得了潔淨，我不願有一人沉淪。你會痛，表示你的心還活著，今天就回頭。狗回到所吐的，你可以像彼得一樣回到主面前。","受傷型的心，曾被某位在講台上的人傷害、被利用，甚至被騙了錢。主對你說：我看見了，我的審判沒有打盹。你可以把傷說出來、把公道交給主，也可以在安全的地方尋求幫助；你的傷不是信心不足。主沒有站在傷害你的人那一邊，他是那位「知道搭救」的主。"]},{"h":"九、這一週，你可以做的幾件事","ps":["第一，用五個記號照自己：對基督、對金錢、對身體、對權柄、對自由，各問一句，寫下最刺你的那一個，並且為它禱告悔改。第二，這一週不轉傳任何「某某是假師傅」的訊息，收到時改為替那人和轉傳的人禱告。第三，背誦 2:9，在你覺得被不義包圍的時候說出來。第四，檢查你這週聽的講道和讀的文章，用「這是水還是霧」問一次。並且找出你身邊一位剛信主或還不堅固的人，約他喝一杯茶，問他最近讀了甚麼。第五，若你曾被傷害或被騙，選一位你信任的同伴或牧者，這週說出一句話就好。","我宣告：主知道搭救敬虔的人，我的出路在他手裡。","我宣告：耶穌用重價買了我，我不屬於自己，我屬於他。","我宣告：我不再被任何東西制伏，讓耶穌作王才是我的自由。","我宣告：我舊日的罪已經得了潔淨，我今天回到主面前。"]},{"h":"十、結語","ps":["弟兄姊妹，回到那位背著空桶的母親。她在乾井邊最需要的，不是有人告訴她「這口井是假的」，而是有人牽著她的手，帶她到真正有水的地方。這也是彼得寫第 2 章的心：他不是在寫一份黑名單，他是在說，那口乾井救不了你，但主知道搭救。","今天我們看見三件事：乾井會從裡面冒出來，所以先照自己；主知道搭救，所以不必害怕，也不必替神清理門戶；假自由會把人帶回敗壞，但回頭的路一直開著，像彼得那樣回到主面前。","所以這一課的焦點，不在假師傅身上，也不在我們有多會分辨，焦點在耶穌——那位用重價買了我們、轉過身來看跌倒的彼得、知道怎樣把挪亞和羅得拉出來的主。他還在等：「不願有一人沉淪，乃願人人都悔改。」","我們一起禱告：主耶穌，謝謝你用重價買了我們。求你先光照我們的心，叫我們不帶著自己的東西夾帶在你的真道裡。在乾井很多的時代，求你保守我們不被餌引誘，也不因為受過傷就不再喝水。為那些跌倒、正在害怕的弟兄姊妹，求你叫他們聽見你說「回來吧」。主啊，你知道搭救敬虔的人，我們把審判交給你，把自己交給你。奉主耶穌基督的名禱告，阿們。"]},{"h":"十一、小組討論分享：三個化","ps":["接下來一小時，我們不找誰是乾井，而是一起回到活水：先讓經文進來，再照見自己，最後走出一步。"]}],"deep":[{"sec":0,"q":"彼得自己不認過主，他有甚麼資格寫這一章？","a":"正因為他不認過主，這一章才不是法利賽人的定罪。彼得在 2:1 用的「不承認」，就是他在院子裡用過的那個字。他知道一個人怎樣一步一步從「我總不能不認你」走到「我不認得那個人」。所以他的嚴厲裡有眼淚。他和假師傅的分別，不是他比較強，而是他在跌倒之後讓主轉過身來看他，他出去痛哭，然後回頭。今天我們也一樣：講這一章最有資格的人，不是自認從沒錯過的人，而是知道自己也會跌倒、也被主拉回來的人。帶著這個身分來讀，我們的分辨會變得清楚，也會變得溫柔。不妨在讀這一章之前先禱告：「主啊，先照我。」這樣讀出來的分辨，會帶著憐憫，而不是帶著優越感。"},{"sec":1,"q":"羅得做了那麼多糊塗事，為甚麼聖經還稱他是義人？","a":"因為「義」在這裡不是指他的表現完美，而是指他的心還沒有和那座城站在同一邊。2:8 說他「看見聽見他們不法的事，他的義心就天天傷痛」，那個「天天」是持續的，每一天都被刺痛。這不是在稱讚他的選擇，創世記清楚記下了他的軟弱。但神看重一顆還會痛的心。更重要的是，他蒙搭救的原因不是他夠好，而是神記念了亞伯拉罕，天使拉著他的手出城。這給今天許多住在「所多瑪」中間、覺得自己軟弱的信徒一個安慰：還會痛，就還有義心；你不是靠自己逃出來的，是主拉你出來。若你已經不太會痛了，也不必絕望，可以求主把那份痛還給你；這本身就是回頭的開始。"},{"sec":1,"q":"2:9 說主知道搭救，為甚麼我禱告了，處境還是沒有改變？","a":"「脫離試探」原文是從試煉裡面拉出來，不是保證你不進去。挪亞仍然在方舟裡漂了很久，羅得仍然在所多瑪住了多年。主的搭救有他的時間和方法：有時是改變處境，有時是在處境裡保守你的心不麻木，有時是先把你從某一段關係或某一種依賴中拉出來。「主知道」的意思是他懂得怎樣，不是他照我們的時間表行事。這一週可以做的是：把你被困的那件事具體寫下來，每天用 2:9 為它禱告一次，同時找一位同伴陪你。等候的時候，不是一個人等。也可以回頭看看：過去有哪些時候，主是用你沒有想到的方法把你拉出來的？記下來，那就是下一次等候時的見證。"},{"sec":2,"q":"「任性」和有主見、有勇氣有甚麼分別？","a":"有主見是在真理上站穩，任性是以取悅自己為最高準則。分辨的方法是看這個「主見」最後服從誰。彼得的勇氣是在公會前說「順從神，不順從人，是應當的」，那是向神順服；假師傅的膽大是「毀謗在尊位的，還不知懼怕」，那是誰都不服。一個簡單的檢驗：當聖經或屬靈同伴指出我的錯時，我能不能停下來、聽完、承認？能，就是有主見；不能，就要小心任性。保羅要求監督「不任性」，提醒我們越在前面的人越要問這個問題。在家裡、在職場、在服事上，都可以試著讓一位同伴有權對你說真話，這是對付任性最實際的方法。"},{"sec":3,"q":"我曾經信主後又離開很久，2:20–22 是不是在說我已經回不來了？","a":"不是。這幾節的上下文，是假師傅和跟隨他們、還拿著「自由」去引誘剛脫離妄行之人的人；他們曉得義路，卻主動背棄，並且帶別人一起走。而你今天會為這件事不安，正說明你的心還沒有麻木。請聽彼得在同一封信裡的兩句話：1:9 說你「舊日的罪已經得了潔淨」，3:9 說主「不願有一人沉淪，乃願人人都悔改」。寫這三節的人自己跌得很重，主在海邊等他回來。今天可以做的一步是：找一位信任的弟兄姊妹或牧者，告訴他「我想回來」。教會不是要審問你離開的原因，而是要歡迎你回家；就像主在海邊為彼得預備了炭火和魚，先讓他吃飽，再和他談。"},{"sec":4,"q":"如果教會真的有領袖出問題，我該怎麼辦才不算毀謗？","a":"毀謗和正當的提問，分別在內容、動機和途徑。內容：是事實，還是猜測與傳聞？動機：是為了保護羊群、幫助他回轉，還是為了出氣、證明自己對？途徑：有沒有先私下、按著教會的程序，向該負責的人提出（太 18:15–17），並且尊重調查的過程？若涉及金錢不當、權力控制或任何形式的侵害，就不只是個人看法的問題，應該向教會的監督機制提出，必要時尋求外部專業或法律協助。這樣做不是輕慢主治的，正是對 2:3 和彼前 5:3 的順服。同時記得：在事實查清楚以前，不在網路上公開定罪，也不在小組裡傳講細節，保護當事人，也保護受傷的人。"},{"sec":5,"q":"被騙過錢之後，覺得很丟臉，不敢讓教會知道，怎麼辦？","a":"被騙不等於愚笨，更不等於信心不好。彼得說假師傅「用捏造的言語在你們身上取利」，被下餌的常常是最真誠、最想信任人的人。羞愧會讓人把事情藏起來，結果是一個人背著損失，也讓同樣的手法繼續傷害別人。可以做的有三步：先告訴一位你信任、口緊的人；再請教會的牧者或長執陪你理清狀況；若有金錢或法律上的損失，盡早尋求專業或法律的協助，保留相關的紀錄。主說他的審判沒有打盹，你可以把公道交給他，也可以在地上走正當的途徑。教會也要學習：聽見這樣的事，第一個反應不是責備當事人「怎麼這麼不小心」，而是陪他、保護他。"},{"sec":6,"q":"怎樣分辨自己聽的講道是活水，還是乾井？","a":"可以用五個記號問，但要先問果子，不先問口才。第一，對基督：這篇講道最後把我帶到耶穌面前，還是帶到講員面前？第二，對金錢：它要的是我的心，還是我的錢？第三，對身體：它叫我更聖潔，還是叫我覺得放縱沒關係？第四，對權柄：講的人能不能被問、被糾正？第五，對自由：它叫我更自由地順服主，還是叫我「不再需要誰」？還要加一條：喝完之後，我是更愛主、更愛人，還是更佩服講員？這些問題不是拿來審判別人，是拿來保護自己，也幫助你知道該在哪裡扎根。若你發現自己長期喝的是霧，不必一走了之，可以先找你信任的同伴一起禱告、一起讀經，再決定下一步。"}],"hua":[{"h":"第一化：內化（約20分鐘）","aim":"※ 目的：讓 2:1–9 先進到心裡，看見「從裡面起來的危險」與「主知道搭救」；先讓經文說話，再談自己。","note":"※ 帶領提醒：本課不談任何具體人名、教會名或宗派名；若有人提出，溫和地帶回「記號，不是名單」。","qs":[{"n":1,"lv":"★","q":"請一位朗讀 2:1–3，另一位朗讀 2:4–9。你最先注意到哪一個詞？為甚麼？"},{"n":2,"lv":"★★","q":"三個審判裡藏著兩個搭救，是哪兩個？挪亞和羅得被搭救的方法各是甚麼？"},{"n":3,"lv":"★★★","q":"羅得「義心天天傷痛」。這一週，有哪一件你看習慣了、已經不太痛的事？用一句話說出來。"}]},{"h":"第二化：消化（約35分鐘·主軸）","aim":"※ 目的：用看、聽、想、講、行五步，讓 2:9 與 2:19 落到自己身上。","note":"※ 帶領提醒：若有人說到被屬靈虐待、被利用或被騙錢，只安靜聆聽，不追問細節，不要求他原諒，不在小組裡評論那個人；會後單獨關心，必要時協助他尋求專業輔導或法律協助。","qs":[{"n":4,"lv":"★★","q":"【看】看見自己：五個記號——對基督、金錢、身體、權柄、自由——哪一個最照到你？"},{"n":5,"lv":"★","q":"【聽】聽神說話：一起慢慢讀 2:9 兩次。主在這一句裡，對你今天的處境說了甚麼？"},{"n":6,"lv":"★★★","q":"【想】想通關卡：哪一件事你說「我可以控制」，其實已經在控制你？2:19 怎樣拆穿它？"},{"n":7,"lv":"★★","q":"【講】說出口：用「主知道搭救我脫離……」造一句禱告，現在對組員說出來。"},{"n":8,"lv":"★★","q":"【行】走一步：本週哪一天、在甚麼地方，你要做一件讓耶穌作王的具體小事？"}]},{"h":"第三化：轉化（約25分鐘）","aim":"※ 目的：從分辨別人轉為堅固別人，讓改變流向關係與使命。","note":"※ 帶領提醒：第 11 題可能觸及長期的傷或對教會的失望，不追問、不辯解，只說「謝謝你願意說」；不追問細節、不要求原諒，會後單獨關心，必要時協助尋求專業輔導或法律協助。920 那一題請每人當場說出名字。","qs":[{"n":9,"lv":"★★","q":"下一次群組裡出現「某某是假先知」的影片，你要怎麼回應？現在練習寫一句回覆。"},{"n":10,"lv":"★★","q":"920 操練：找出你的那一個「2」——一位還不堅固的人，當場說出他的名字，本週何時向他分享 2:9？"},{"n":11,"lv":"★★★","q":"你曾因受傷而不敢再信任任何人嗎？若願意，說出一步你可以重新喝活水的方法。"},{"n":12,"lv":"★","q":"這一週，你要為哪一位跌倒的人禱告，求主叫他回頭？說出名字或稱呼。"},{"n":13,"lv":"★★","q":"你的教會或小組，可以怎樣更透明、更會陪伴剛信主的人？提一個具體做法。"},{"n":14,"lv":"★★★","q":"【必做】用三句話把這一課講給一位教會外的朋友聽：乾井會騙人，主知道搭救，回頭就有活水。說出朋友的名字和時間。"}]},{"h":"收尾（5分鐘）","ps":["請全組一起讀 2:9，再讀 3:9。帶領者為每一位禱告，特別記念今天說出傷痛或害怕的弟兄姊妹；最後一同宣告：主知道搭救，我們回到他面前。"]}]},"3":{"n":3,"t":"不是耽延，乃是寬容——記得、等候、長進","open":"畫面開場：深夜機場接機口，一班延誤的航班——一直看錶的人、轉身走掉的人、趁著等的時間打電話和人和好的人；彼得要教會做第三種人。","secs":[{"h":"一、應許在哪裡呢——故意忘記與兩封提醒的信（3:1–7）","ps":["弟兄姊妹平安。請你先在心裡看一個畫面：晚上十點，機場的接機口。電子看板上，你要接的那一班飛機，後面那一欄從「準時」跳成了「延誤」；再過半小時，又跳成「抵達時間未定」。接機口的人開始不一樣了。有一個人每兩分鐘看一次錶，嘴裡念著：「到底在哪裡？」有一個人看了看看板，搖搖頭，把手上寫著名字的牌子塞進垃圾桶，轉身走了：「我看是不會來了。」還有一個人，找了個角落坐下，拿出手機，撥了一通他拖了好幾年沒有打的電話，打給一個跟他鬧翻的弟兄，說：「我在機場等人，忽然想到你。對不起，那件事是我不對。」","同一班延誤的航班，三種等的人。今天這一課，彼得後書第三章，就是寫給接機口的人的。教會已經等了很久。彼得前書說「萬物的結局近了」（彼前 4:7），可是一年一年過去，第一代信主的人一個一個睡了，主還沒有來。於是有人開始看錶，有人開始轉身。彼得要教我們做第三種人。","先聽他怎麼開口：「親愛的弟兄啊，我現在寫給你們的是第二封信。這兩封都是提醒你們，激發你們誠實的心」（3:1）。這是一個知道自己快要離開帳棚的老人（1:14），他要給的不是新的資訊，而是叫人記得——「叫你們記念聖先知預先所說的話和主救主的命令」（3:2）。這一章的第一個動詞，是記得。","然後他說，末世必有好譏誚的人，他們說：「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣。」（3:4）這正是接機口那個轉身走的人的邏輯：從來沒有變過，所以永遠不會變。彼得怎麼回答？「他們故意忘記」（3:5）。原文的意思是：他們願意讓這件事溜走。不是不知道，是不想記得。忘記甚麼？忘記世界從來不是靠自己穩定的。天和地是「憑神的命」有的；挪亞的時候，「當時的世界被水淹沒就消滅了」（3:6）；「但現在的天地還是憑著那命存留」（3:7）。所謂「萬物仍是一樣」，從來不是事實。神說話，世界就成；神說話，洪水就來。","弟兄姊妹，譏誚很少從頭腦開始。彼得說，他們是「隨從自己的私慾」（3:3）。一個人如果希望主不要來，最省事的辦法，就是說服自己主不會來——因為主若來，我就得交賬。所以，信心的一半是記得。今天你心裡若也冒出一句「到底在哪裡」，先不要害怕自己不屬靈，先問一句：我讓甚麼溜走了？"]},{"h":"二、一日如千年——不是公式，是換位（3:8–10）","ps":["第三章最常被拿去用的一節，是 3:8：「親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日。」請留意，他又叫了一聲「親愛的」。講到最容易引人焦慮的題目，彼得先叫一聲親愛的。","這一節常常被當成公式。有人說創造的六日代表六千年的歷史，有人拿它來推算主再來的日子，這些都不是這節經文的意思。彼得引的是詩篇 90:4：「在你看來，千年如已過的昨日。」詩篇只講一個方向；彼得加上另一個方向：一日如千年，千年如一日。兩個方向都說，等號就不能成立；如果一日等於一千年，一千年又等於一日，這就不是算術了。所以這節經文不是遞給你一把換算的尺，而是把尺收走。它叫我們換一個位置：「主看」——站到主那裡看時間。","從主那裡看，時間是甚麼？3:9：「主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。」「寬容」原文是 μακροθυμεῖ，由「長」和「怒氣」兩個字組成，意思是把怒氣拉得很長。彼得前書講挪亞的日子「神容忍等待」，用的是同一個字族（彼前 3:20）。前書講的是挪亞的日子，後書講的是我們的日子。主的慢，不是遲到，是愛的等。","彼得最有資格寫這一節。他曾經三次不認主，主沒有在那一夜放棄他；主在提比哩亞海邊等他，生了炭火，問了他三次：「你愛我嗎？」三十多年後，這個被主等過的人寫下：「其實不是耽延，乃是寬容你們。」他寫的不是理論，是自己的故事。你今天還能坐在這裡，也是因為主等過你。","可是 3:10 緊接著說：「但主的日子要像賊來到一樣。」寬容不是取消。賊來之前不會發通告。這一句同時擋住兩種錯：擋住「主不會來」的譏誚，也擋住「我知道主哪一天來」的聰明。主耶穌親口說過：「那日子、那時辰，沒有人知道」（太 24:36）。所以，等候的時間不是焦慮的時間，是悔改的時間，是傳福音的時間。接機口那個打電話的人，做的正是這件事。"]},{"h":"三、原文亮光：催促、顯露、更新","ps":["這一章有三個原文字，每一個都會改變你等候的姿勢。","第一個字，σπεύδοντας（3:12）。和合本譯作「切切仰望」，原文更常見的意思是「催促、使它加快」。彼得在聖殿的廊下講過：「你們當悔改歸正，使你們的罪得以塗抹，這樣，那安舒的日子就必從主面前來到。」（徒 3:19–20）神讓他的子民參與他的心意。可是請看上下文怎樣定下「催促」的方法：3:9 的悔改，3:11 的聖潔和敬虔。這不是叫人推算或「加速」日期，也不是用甚麼工程替主排時間表；3:10 的「像賊」仍然管著 3:12。我們能做的催促，是活得像一個盼望他來的人，並且傳福音，讓更多人悔改。","第二個字，εὑρεθήσεται（3:10 末句）。和合本照多數抄本譯作「燒盡了」；最早、最好的抄本作 εὑρεθήσεται，意思是「必被發現、必被顯露」；也有編者採「不被發現」的讀法。不論哪一讀，都不是神把他所造的丟掉。照「顯露」來讀，那一日，地和其上一切的工都要攤開在神面前，這使我們想起林前 3:13：「各人的工程必然顯露。」更動人的是，四節之後 3:14 的「安然見主」，原文正是同一個動詞：「被他找到」。那一日找我們的，不是批評我們的人，也不是我們自己的良心，是主自己。","第三個字，καινός（3:13）。「盼望新天新地」的「新」，不是時間上的新，是品質上的新——更新，而不只是另換一個。挪亞的洪水使「當時的世界」消滅，地卻沒有消失；火的審判也是對罪的了結，不是神放棄他的作品。這使我們想起羅馬書 8:21：「但受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀。」新天新地最美的一句是：「有義居在其中。」「居」是長住。今天的義像寄居的客旅，在這世界常被擠到角落；那一日，義要安家。","三個字連起來，就是等候的三個姿勢：催促，是用悔改和聖潔參與神的心意；顯露，是知道一切都要攤在主面前，所以今天就活在光中；更新，是知道神不會丟棄他所愛的世界，所以今天就好好看守它。"]},{"h":"四、怎樣等候——聖潔、敬虔、親愛的兄弟、防備、長進（3:11–18）","ps":["講完主的日子，彼得問的不是「哪一天」，而是「你們是怎樣的人」：「這一切既都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔」（3:11）。末世的問題，最後落在你今天怎樣做人。永恆的觀點不是叫人離開世界，是叫人在世界裡活得不一樣。","第一，聖潔、敬虔。「為人」在原文是複數，是一件一件具體的行為。等候不是坐在接機口發呆，而是在等的時候怎樣說話、怎樣用錢、怎樣待家人。3:14：「親愛的弟兄啊，你們既盼望這些事，就當殷勤，使自己沒有玷污，無可指摘，安然見主。」「沒有玷污、無可指摘」這一對字，彼得前書用來形容基督——「無瑕疵、無玷污的羔羊」（彼前 1:19）。我們能安然見主，靠的是羔羊的潔淨，不是自己的成績單。","第二，親愛的兄弟保羅。3:15：「並且以我們主長久忍耐為得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。」你記得保羅曾在安提阿當面抵擋彼得嗎？「因他有可責之處，我就當面抵擋他。」（加 2:11）那一次的責備寫進了加拉太書，讀遍所有教會。多年以後，彼得在臨終的信裡，稱這個人為「我們所親愛的兄弟」，還說他有神所賜的智慧。這不是兩位使徒的角力，而是兩個被同一份恩典改變的人。等候主來的人，不再記賬——不是假裝沒受傷，也不是不設界線，而是把公道交給主。","第三，防備。3:16 說保羅的信「有些難明白的，那無學問、不堅固的人強解」。「強解」原文 στρεβλόω，本來是把人綁上刑架硬拉——把經文拉到自己要的長度。請注意，彼得沒有說「難明白，所以你們不要讀」。出問題的不是讀的人，是強解的人；「無學問」原文的意思是不肯受教。所以 3:17：「你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。」「堅固」，是主在被賣那一夜交給彼得的字：「你回頭以後，要堅固你的弟兄。」（路 22:32）他用這個字做了一生的功課，一直做到最後一封信的最後一段。","第四，長進，然後榮耀。最後一節：「你們卻要在我們主救主耶穌基督的恩典和知識上有長進。願榮耀歸給他，從今直到永遠。阿們！」（3:18）次序很清楚：先防備墜落，再在恩典上長，最後把榮耀歸給他。彼得前書的結尾是在恩上站立得住，彼得後書的結尾是在恩上長進——站得住的人，還要長。照教會的傳統，一個快要殉道的老人，留給教會的最後一口氣，不是自己的成就，是「願榮耀歸給他」。"]},{"h":"五、幾個必須認得的偏差","ps":["第一個偏差，是用 3:8 算日子。有人把「一日如千年」當作換算表，拿來定創造的年代，或排出主再來的年份。這不是經文的用意：彼得兩個方向都說，正是要取消換算；主耶穌也說：「父憑著自己的權柄所定的時候、日期，不是你們可以知道的。」（徒 1:7）算對了不叫信心，算錯了卻會絆倒人。","第二個偏差，是用 3:12 推算日期或「加速」日期，好像人可以用某種條件、某個工程、某種國際局勢把主催來。σπεύδω 的方法，上下文已經定了：悔改、聖潔、敬虔。我們參與的是神的心意，不是掌握神的時間表；3:10「像賊」一句，仍然管著每一個想替主排日程的人。","第三個偏差，是說「地球反正要燒，所以不必照顧受造界」。無論 3:10 讀「燒盡」還是「顯露」，3:13 都說新天新地是更新；起初神把人安置在園子裡，「使他修理看守」（創 2:15），這個託付沒有被收回。照顧受造界是管家的本分，不是某一派的政治口號；我們不把它變成政治動員，也不拿末日當浪費的藉口。","第四個偏差，是因延遲而冷淡，或因末日而恐慌。前一種人像接機口轉身走的人，心想反正還早，慢慢再說；後一種人一看新聞就心驚膽戰，囤貨、失眠、不敢計畫將來。3:9 對前者說：寬容是給你悔改的時間，不是給你拖延的空間；3:10 說像賊，你不知道還有多少時間。對後者，3:14 說「安然見主」——果效是忍耐，不是恐慌。","第五個偏差，是用 3:16 說「難懂的經文不要自己讀」，甚至說只有牧師才能解經，這是錯的。彼得說的「難明白」，原文是難懂，不是不可懂；出問題的是不肯受教、站不穩的人去「強解」。保護讀經的方法不是不讀，而是在群體中讀、照上下文讀、帶著謙卑讀。彼得這封信本身，就是寫給全體會眾讀的。"]},{"h":"六、兩個華人處境的真實問題","ps":["第一個問題：家族群組或教會群組裡，有人轉來一段影片，說根據某些經文和天象，主再來的年月日已經揭曉，請大家趕快轉傳。怎麼辦？第一，不轉傳；第二，也不在群組裡嘲笑轉傳的人——他多半是出於愛主，或出於害怕。私下回他一句：「主說那日子沒有人知道（太 24:36），彼得說主的日子像賊來到（3:10）；我們一起把等的時間用在悔改和愛人上。」過去幾十年，公開宣布過的日期一個一個過去，每一次都有人賣了房子、辭了工作，也有人從此不再信主。分辨不是去揭發誰，是不讓恐慌代替信心。","第二個問題：飯桌上兩代人吵起來。長輩說：「這個世界將來都要燒掉，管環境是不屬靈的事。」年輕的孩子卻因為氣候新聞焦慮得睡不著，覺得未來沒有希望，不想結婚、不敢計畫。3:13 對兩代人都說話。對長輩說：神要更新的是他所造的，照顧它是管家的本分。對年輕人說：世界的結局不是在人的手裡崩潰，而是在神的手裡更新，「有義居在其中」。我們照顧受造界，不是因為怕世界完蛋，是因為這世界屬於那位要來的主。如果孩子的焦慮已經長期影響睡眠和生活，除了陪他禱告，也要陪他去尋求專業協助。"]},{"h":"七、活出321——在等候中讓耶穌得著一切的榮耀","ps":["經文講完了，321 在這裡接上。三個基礎。第一，耶穌是我的榜樣。3:9 的寬容，就是主在海邊等彼得的那份寬容。我等候還沒信主的家人時，學他的忍耐：不催逼，也不放棄；別人等我改變的時候，我也記得主曾怎樣等我。第二，聖經是我的準則。3:2 叫我記念先知和使徒的話，3:16 提醒我不要強解。我的末日觀不從群組影片來，也不從新聞標題來，而是從聖經來，而且在群體中、照上下文、謙卑地讀。第三，聖靈是我的引導。3:18 的長進不是咬牙苦撐，是聖靈在恩典裡使人長；用心靠聖靈，不要用腦靠自己去算日子。","兩個核心。讓耶穌作王：3:13「有義居在其中」，新天新地是王公義掌權的地方；今天就讓他在我的時間表上作王——日子由他定，我只管忠心；我的錢、我的計畫、我對待受造界的方式，也都交給他作王。讓耶穌得著一切的榮耀：3:18「願榮耀歸給他」，彼得一生最後一句話不是講自己，是把榮耀歸給主。一個人等候得對不對，看他最後把榮耀歸給誰就知道了。","一個目的：建立屬神的體系。3:15「我們所親愛的兄弟保羅」——糾正人的和被糾正的，在同一個身體裡彼此相稱為親愛的。無己才能合一，合一才能一同等候。這就是改變觀點：從暫時到永恆，從地上到天上，從人的眼光到神的眼光。"]},{"h":"八、四種心，在等候中被主找到","ps":["驕傲型的心，想要掌握時間表：不是算日子，就是譏誚。驕傲是離開本位抓住權力，想代替神決定時間。3:8 叫你回到本位：「主看」，不是我看。謙卑是放下權力回到本位：讓神作神，讓人作人；日子交給神，忠心留給自己。","恐懼型的心，一聽末日就慌，一看新聞就怕。3:9 說主不願有一人沉淪；3:14 說安然見主。站在羔羊的潔淨裡，見主是平安，不是驚嚇。把焦點從新聞移回主身上，你的心就能安靜下來，繼續過今天該過的日子。","羞恥型的心，覺得自己太髒，最好主不要來。3:14 說「被他找到」，找你的那一位，就是在海邊生了炭火等過彼得的主；他的寬容，正是為你留的門。他等你，不是為了羞辱你，是為了接你回家。","受傷型的心，等得太久了：禱告多年沒有答案，或親人沒等到信主就走了。主不輕看你的眼淚；3:9 告訴你，主的心從來不是冷的。至於已經離世的親人，我們不替神下判斷，把他交在那位「審判全地的主」手裡，他必行公義（創 18:25）。這份傷，會後可以找一位同工單獨談。"]},{"h":"九、這一週，你可以做的幾件事","ps":["第一，每天早上讀一遍 3:9，把一位還沒信主的人的名字放進去，為他禱告一分鐘。第二，用「等的時間」打一通和好的電話，像接機口那個人一樣，說一句「那件事是我不對」。第三，做一件照顧受造界的小事：不浪費一餐飯、隨手關燈、把垃圾分好，不為口號，只為管家的本分。第四，群組裡再收到末日日期的訊息，不轉傳，私下回一句 3:10「像賊來到」。第五，每晚睡前寫下一件今天在恩典和知識上長進的事，然後說一句：「願榮耀歸給他。」","這五件事都很小，但每一件都是在接機口打出去的一通電話：不是看錶，不是轉身，而是用等的時間去愛。請大家一起宣告。我宣告：主不是耽延，乃是寬容，他不願有一人沉淪。我宣告：日子由主定，我不算日子，我只管忠心等候。我宣告：我照他的應許，盼望新天新地，有義居在其中。我宣告：我要在主耶穌基督的恩典和知識上有長進，願榮耀歸給他，從今直到永遠。"]},{"h":"十、結語","ps":["彼得後書最後一段，給了等候的人一個次序：先防備，免得從堅固的地步上墜落；再長進，在主耶穌基督的恩典和知識上一天一天長；最後，把一切都收在一句話裡——願榮耀歸給他。","回到機場的接機口。看板上的字也許還寫著「延誤」，但彼得告訴我們，那不是延誤，是寬容；那班飛機一定會到，而且會在你沒有預料的時候到。你不必一直看錶，更不要轉身走掉；你可以像那個坐在角落的人，用等的時間去和好、去愛人、去傳福音。","所以今天我們的焦點，不在那一天是哪一天，不在世界會怎樣結束，也不在自己夠不夠好；焦點在那位長久忍耐、一定會來的主耶穌基督。當他來的時候，願他找到我們正在等他。","我們禱告：親愛的天父，謝謝你不是耽延，乃是寬容；謝謝你等過彼得，也等過我們。求你赦免我們有時候故意忘記，有時候想替你算日子，有時候因為等得太久而冷淡。求聖靈堅固我們，叫我們防備錯謬，在主耶穌基督的恩典和知識上有長進，用等候的時間去和好、去愛人、去傳福音。願榮耀歸給你，從今直到永遠。這樣禱告，是奉主耶穌基督的名禱告，阿們。"]},{"h":"十一、小組討論分享：三個化","ps":["接下來一個小時，我們一起把這一課內化、消化、轉化，讓它從頭腦走進生活。"]}],"deep":[{"sec":0,"q":"我心裡有時也會冒出「主到底在哪裡」，這是不是表示我已經成了譏誚的人？","a":"不是。譏誚的人和疑惑的人不一樣。彼得形容譏誚的人是「隨從自己的私慾」，而且「故意忘記」——他們希望主不要來，所以選擇不記得。一個在苦難裡問「主啊，還要等多久」的人，其實是在向主說話，詩篇裡滿是這樣的禱告（詩 13:1）。問題不在有沒有疑問，而在疑問把你帶到哪裡：帶你遠離主，還是帶你回到經文和主面前。當這句話冒出來，照 3:1–2 去做：把先知和使徒的話再讀一次，把神在你生命中做過的事一件一件記起來。信心的一半是記得；另一半，是帶著還沒解開的問題，繼續跟隨主。"},{"sec":1,"q":"既然主「不願有一人沉淪」，為甚麼還有人沉淪？神的心意落空了嗎？","a":"這是教會歷代認真討論的題目。阿米念與衛斯理傳統認為這是神普遍的救恩心意，人可以拒絕；改革宗有人把「人人」限在「你們」之中，也有人分辨神的心意與定旨，指出神真實地不喜悅惡人死亡（結 33:11）。不論站在哪一派，有兩件事都不能丟：第一，神的心意是真實的，不是外交辭令；第二，3:7 的審判也是真實的，不能用 3:9 取消。這一節的工作不是裁決揀選的系統，而是回答「為甚麼還沒來」：因為神在等人悔改。不要用系統冷卻這節經文的溫度，倒要讓它推你去為一個人禱告。小組裡若有不同看法，可以彼此尊重，同心為未信的人代禱。"},{"sec":1,"q":"主既然這樣寬容，那我是不是可以等以後再悔改、再認真？","a":"寬容是給你悔改的時間，不是給你拖延的空間。羅馬書 2:4 說：「還是你藐視他豐富的恩慈、寬容、忍耐，不曉得他的恩慈是領你悔改呢？」同一個 3:9，緊接著就是 3:10：「主的日子要像賊來到一樣。」你不知道還有多少時間，也不知道自己的心會不會因為一拖再拖而變硬。主等你，不是因為你的事不重要，而是因為你太重要。把「以後」換成「今天」：今天就向主承認那件事，今天就打那一通電話。主的寬容最好的回應，是不再浪費它。彼得自己就是在主的寬容裡回頭的人。"},{"sec":2,"q":"如果 3:12 真的可以譯作「催促」，那我們努力傳福音，是不是能決定主再來的日子？","a":"不能，也不需要。σπεύδω 確實可以譯作催促，彼得自己在使徒行傳 3:19–20 也把悔改和「安舒的日子」連在一起；主耶穌也說「這天國的福音要傳遍天下……然後末期才來到」（太 24:14）。可是同一位主說「那日子、那時辰，沒有人知道」，彼得在 3:10 也說「像賊來到」。這兩組經文放在一起，意思是：我們真實地參與神的心意，卻不掌握神的時間表。傳福音的動機不是要把主催來好結束自己的苦，而是因為主不願有一人沉淪。我們負責忠心，日子由他定。這樣，傳福音就不會變成焦慮的工程，而是愛的回應。"},{"sec":2,"q":"我的和合本寫「燒盡了」，原文抄本卻有「被顯露」，那我手上的聖經是不是錯了？","a":"不必慌張。和合本照的是當時通行的多數抄本，那是歷代教會真實讀過的經文；學者根據西乃、梵蒂岡等較早的抄本，認為 εὑρεθήσεται 較可能是原貌。抄本的差異在新約裡是少數，而且沒有一處動搖基督信仰的核心。就這一節來說，兩種讀法其實指向同一件事：那一日，地上一切都要攤在神面前，罪要被了結，神所造的不是被丟棄，而是要被更新（3:13）。你可以安心讀手上的和合本，同時知道原文多了一層亮光：那一日，一切都要被主看見，我們也要「被他找到」（3:14）。遇到這類問題，可以向帶領者請教，也可以對照幾本中文譯本一起讀。"},{"sec":3,"q":"彼得說保羅的信有些難明白，那我讀不懂的經文該怎麼辦？是不是乾脆不要讀？","a":"不是。彼得把這封信寫給全會眾，他自己就期待每一個人讀。他警告的是「無學問、不堅固的人強解」，也就是不肯受教、又要把經文扭到自己要的方向的人。讀不懂時有三個保護：第一，在群體中讀——帶到小組，請教長輩和牧者，彼此印證；第二，照上下文讀——先看前後文在講甚麼，不要單抽一句；第三，謙卑地讀——容許自己暫時不懂，先順服已經讀懂的部分。難懂的經文不是禁區，而是邀請你慢下來、和弟兄姊妹一起讀。讀不懂的地方先記下來，帶著禱告慢慢求明白，聖靈會在合適的時候開你的眼睛。"},{"sec":4,"q":"教會講照顧受造界，會不會變成社會福音，或者被帶去政治立場？","a":"這是合理的擔心。照顧受造界的根據不在任何政治立場，而在創造：神把人放在園子裡「使他修理看守」（創 2:15），人是管家，不是主人。彼得後書 3:13 說新天新地是更新，羅馬書 8:21 說受造之物要得享神兒女自由的榮耀，所以我們今天怎樣對待神所造的，是信仰的一部分。界線也要清楚：福音的中心是基督為罪人死而復活，照顧受造界是福音的果子，不是福音的替代；教會不為政黨背書，弟兄姊妹在具體政策上可以有不同看法。從小事做起：不浪費、不污染、帶著感恩使用。這不是為了證明自己進步，而是向造物主表達敬畏。"},{"sec":7,"q":"我的親人沒有信主就過世了，讀到「不願有一人沉淪」，我心裡很痛，該怎麼面對？","a":"先說一句：你的痛是真的，主不輕看。我們不替神斷定任何一位離世之人的去處，因為我們不知道他最後的日子裡，神怎樣向他說話；我們只知道那位審判的主是公義的，也是慈愛的。亞伯拉罕說：「審判全地的主豈不行公義嗎？」（創 18:25）可以把親人交在這位主手裡，不需要在自責或猜測裡反覆折磨自己。3:9 也告訴你，神的心從來不是冷的，他和你一樣不願意人沉淪。若這份哀傷已經很久，影響睡眠、工作或生活，請讓牧者或同工陪你，必要時一起尋求專業的哀傷輔導。"}],"hua":[{"h":"第一化：內化（約20分鐘）","aim":"※ 目的：先讓經文本身說話，把彼得後書第三章的骨架讀進心裡：記得、寬容、等候、長進、榮耀。","note":"※ 帶領提醒：請一位組員先朗讀 3:1–18。這一化只問經文說了甚麼，不急著應用；有人想討論末日年份，溫和地帶回 3:8–10 的兩個方向和「像賊」。","qs":[{"n":1,"lv":"★","q":"這一章「親愛的弟兄啊」出現了幾次？分別在哪幾節、哪幾個轉折點？"},{"n":2,"lv":"★","q":"譏誚的人說「應許在哪裡呢」，彼得說他們「故意忘記」了甚麼？用一句話說出來。"},{"n":3,"lv":"★★","q":"3:8 為甚麼要兩個方向都說「一日如千年，千年如一日」？這怎樣使換算不能成立？"},{"n":4,"lv":"★★★","q":"3:17–18 的次序是防備、長進、榮耀。為甚麼不能顛倒？這三步裡，哪一步是你現在最缺的？"}]},{"h":"第二化：消化（約35分鐘·主軸）","aim":"※ 目的：把經文對準自己的等候——看見自己是哪一種等的人，聽見主「寬容」的聲音，想通卡住的地方，說出口，走一步。","note":"※ 帶領提醒：第 7 題可能觸及親人未信主就過世、長期禱告沒有答案或長期無望感。不追問細節，不斷定亡者去處，不要求任何人原諒或釋懷；讓分享的人說到他願意說的地方就好，會後單獨關心，必要時協助他尋求專業協助。","qs":[{"n":5,"lv":"★★","q":"【看】看見自己：接機口三種人——一直看錶的、轉身走掉的、趁著等去和好的。這半年的你最像哪一種？說一個具體的時刻。"},{"n":6,"lv":"★","q":"【聽】聽神說話：把 3:9 讀出來，把「你們」換成你自己的名字。哪一個詞最打中你？"},{"n":7,"lv":"★★★","q":"【想】想通關卡：你心裡有沒有一件「主怎麼還不……」的事？3:9 的「寬容」怎樣改變你看這一段等待？"},{"n":8,"lv":"★★","q":"【講】說出口：算日子、恐慌、冷淡、不管受造界、不敢讀經——你要放下哪一個？用一句話向組員說出來。"},{"n":9,"lv":"★★★","q":"【行】走一步：這一週你要用「等的時間」做哪一件事？打給誰、和誰和好、為誰禱告？說出名字和時間。"}]},{"h":"第三化：轉化（約25分鐘）","aim":"※ 目的：讓這一課走出小組，進到群組、餐桌、辦公室，和一位還不認識主的朋友身邊。","note":"※ 帶領提醒：第 12 題觸及被人糾正或受傷的關係，不要求原諒，不追問細節；若涉及傷害或安全，先顧安全，會後單獨關心，必要時協助尋求專業協助。第 13、14 題請每人當場說出名字和時間，組長記下，下週回顧。","qs":[{"n":10,"lv":"★★","q":"群組裡若收到「主再來年月日」的訊息，你會私下怎樣回？把你要說的那一句寫下來，唸給組員聽。"},{"n":11,"lv":"★","q":"這一週，在家裡或辦公室，你可以做哪一件照顧受造界的小事？說出地點和時間。"},{"n":12,"lv":"★★★","q":"彼得稱糾正過他的人「親愛的兄弟」。有沒有一個你一直記他賬的人？這一週你可以為他做哪一件小事？"},{"n":13,"lv":"★★★","q":"920 操練：找出你的那一個「2」——一位還沒信主或正在冷淡的人，本週向他分享 3:9「不是耽延，乃是寬容」。當場說出他的名字和時間。"},{"n":14,"lv":"★★★","q":"【必做】用三句話把這一課講給一位教會外的朋友聽：主為甚麼還沒來、等的人怎樣活、你為甚麼盼望。說出這位朋友的名字。"}]},{"h":"收尾（5分鐘）","ps":["請組長邀請兩位組員各用一句話說出這一課最帶走的一句經文，然後全組一起站起來，同聲讀 3:18：「你們卻要在我們主救主耶穌基督的恩典和知識上有長進。願榮耀歸給他，從今直到永遠。阿們！」最後彼此代禱，特別記念第 13 題說出名字的那些人。"]}]}},"extras":[{"t":"為甚麼讀彼得後書","html":"<p><strong>一、因為這是一個人的遺言<\/strong><\/p>\n<blockquote>\n<p>「我以為應當趁我還在這帳棚的時候提醒你們，激發你們；因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的。」（彼後 1:13–14）<\/p>\n<\/blockquote>\n<p>彼得前書寫給在火裡的人；<strong>彼得後書是一封臨終的信<\/strong>。「正如我們主耶穌基督所指示我的」——指的是加利利海邊那一天，主對他說：「你年老的時候，要伸出手來，別人要把你束上，帶你到不願意去的地方。」（約 21:18）<strong>三十多年來，彼得一直知道自己會怎樣死；現在，那一天近了。<\/strong><\/p>\n<p>一個人臨終要說的話，一定是他認為最重要的話。<strong>彼得最後想說的是三件事：要長進（第 1 章）、要分辨（第 2 章）、要等候（第 3 章）。<\/strong> 而全卷最後一句話，不是叮嚀，是讚美：<\/p>\n<blockquote>\n<p>「你們卻要在我們主救主耶穌基督的恩典和知識上有長進。願榮耀歸給他，從今直到永遠。阿們！」（彼後 3:18）<\/p>\n<\/blockquote>\n<p><strong>一個照教會傳統快要殉道的老人，最後一口氣是「願榮耀歸給他」<\/strong>——321「讓耶穌得著一切的榮耀」，在新約裡沒有比這更真實的見證。<\/p>\n<p><strong>二、因為他曾經想在山上搭帳棚<\/strong><\/p>\n<p>「帳棚」這個字，彼得一生忘不了。在登山變像的山上，他看見主的榮光，脫口而出：<\/p>\n<blockquote>\n<p>「主啊，我們在這裡真好！你若願意，我就在這裡搭三座棚，一座為你，一座為摩西，一座為以利亞。」（太 17:4）<\/p>\n<\/blockquote>\n<p><strong>那一天他想留在山上，把榮耀關進帳棚裡。<\/strong> 幾十年後，他稱自己的身體為「帳棚」（σκήνωμα，1:13–14），<strong>而這帳棚快要拆了<\/strong>。他寫到那一座山：<\/p>\n<blockquote>\n<p>「我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。」（1:16） 「我們同他在聖山的時候，親自聽見這聲音從天上出來。」（1:18）<\/p>\n<\/blockquote>\n<p>1:15「我去世以後」的「去世」原文 <strong>ἔξοδος<\/strong>——<strong>出埃及的那個字<\/strong>；路加記載登山變像時，摩西、以利亞與主談論的正是他「去世」（ἔξοδον，路 9:31）的事。<strong>彼得在山上聽見主談論他的「出埃及」，自己卻只想搭帳棚；如今他用同一個字談自己的離世——死亡不是結束，是一次出埃及。<\/strong> 321 說「從暫時觀點改變成永恆
