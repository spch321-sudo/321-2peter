S00_2。第 1 章讲台上守住三条界线：创造者与受造者的分别永远存在；有分是恩典不是修炼（主词是神，「他已将……应许赐给我们」）；有分的内容就写在下文——脱离败坏，加上德行，一直到爱众人的心。讲台不可跳过这一节，因为跳过 1:4，1:5–7 就失去了根。","care":"这节经文对两种人最要紧。一种是觉得自己一无是处、信主多年仍改变不了的人：神不只赦免他，还要把自己的生命与品格分给他；他的长进不是靠意志撑出来的，是从神的生命里长出来的。另一种是追求属灵经历、想高人一等的人：真正有分于神性情的人，看起来不是更神秘，是更节制、更忍耐、更会爱人。若有会友被「人可以成神」的说法吸引，牧者不要嘲笑他，要问他：你渴慕的是神自己，还是更大的自己？然后带他读 1:5–7，看神的性情落在人身上，长出来的是什么样子。"},{"id":"ISS01_3","t":"1:5–7 八个台阶有先后次序吗？","r":"1:5–7","ch":[1],"why":"三、「有了信心，又要加上德行；有了德行，又要加上知识……有了爱弟兄的心，又要加上爱众人的心。」八项排成一串，很容易被读成一道楼梯：先把德行做完，才能开始学知识；节制还没过关，就不配谈忍耐。这样读，很多人会卡在第二级，一辈子不敢往上看；也有人反过来把它当作成圣的考核表，拿来量别人到了第几级。还有人注意到这八项和 321 改变观念的八大步骤同为八项，便想把两者对在一起。这张清单到底是先后的步骤，还是一串一起长的品格？","pos":[["阶梯读法","","一项完成，才进入下一项，像爬楼梯；次序本身就是灵命成长的路线图。一些灵修传统与通俗讲道采这个读法，好处是具体、容易记，但容易把成圣变成关卡制，也与「加上」是慷慨供应的意思不太相合。"],["彼此包含读法","","介系词是 ἐν（在……里面），不是「在……上面」：德行是在信心里面供应出来的，知识是在德行里面供应出来的。像一棵树，枝子从枝干里长出来，同时在长，不是八道先后的门。许多注释家注意到这个结构。"],["修辞连锁读法（sorites，连珠法）","","这是古典修辞常见的层递句型，罗 5:3–5「患难生忍耐，忍耐生老练，老练生盼望」也是这种写法。起点与终点是刻意安排的，中间的次序有修辞成分，不必一项一项排先后。当时的哲学家也有类似的美德清单，彼得借用了世人熟悉的形式，却以信心开头、以爱结尾，装进福音的内容。"],["首尾读法（本讲义综合）","","不论中间怎样排，首尾都不可移动：信心在最前面，因为一切从神分给的信心开始（1:1）；爱在最后面，因为神的性情最完整的样子就是爱；而且最后两级都是「爱人」——先爱弟兄，再爱众人。知识只在第二级，说明认识主若停在脑子里，长不出节制与忍耐。这个读法吸收了「彼此包含」与「修辞连锁」两说的长处。"]],"con":[],"say":"本讲义的立场：起点与终点是确定的，中间是互相扶持的品格，不是八道先后的关卡。起点是信心——是神分给我们的（1:1「同得一样宝贵信心」）；终点是爱——是神性情最完整的样子；而整张清单挂在 1:5 开头的「正因这缘故」上，回指 1:3–4 神已经赐下的一切。这八项是品格的果子；它和 321 改变观念的八大步骤虽然都是八项，却是两回事，不可把这段经文讲成那八步的插图。","care":"这个议题最实际的影响，是一个人怎样看待自己的软弱。用阶梯读法的人，常常在某一级跌倒后就觉得「我连节制都没过，后面都免谈了」；彼此包含的读法告诉他：你可以一边学节制，一边学爱人，爱人的操练本身就会帮助你节制。牧者也要提醒，这张清单是拿来照自己的，不是拿来量别人的；小组里不要互相评分「你在第几级」。最好的用法是每次只挑一项，求主在你信心里慷慨地供应它——那一位已经供应你一切的主，会在你里面供应下一项。"},{"id":"ISS01_4","t":"1:9「忘了他旧日的罪已经得了洁净」——得救的人会忘记得救吗？","r":"1:8–9","ch":[1],"why":"四、「人若没有这几样，就是眼瞎，只看见近处的，忘了他旧日的罪已经得了洁净。」这节经文让不少人不安：这个人「旧日的罪已经得了洁净」，看来是信过主的；可是他「眼瞎」，又「忘了」。一个真正得救的人，会不会忘记自己得救？这是不是说他已经失去了救恩？还是说他从来没有真正得救？会众里那些信主多年、却越来越冷淡的人，最常问的正是这个问题。","pos":[["实际上的遗忘（许多福音派注释）","","「忘了」不是记忆丧失，也不是失去救恩，是生活上不再活在恩典里：知道自己被赦免，却不再因此感恩、不再因此改变。λήθην λαβών 是「取了遗忘」的惯用语，μυωπάζων 带着「自己眯眼」的意思——这种瞎有一半是选择。药方在下文：「常常提醒」（1:12）。"],["外表的洁净（加尔文传统的一种读法）","","「得了洁净」可能指受洗、加入教会的外在洁净，这个人在外表上属于群体，但从未真正重生；所以他长不出品格，最后显出本相。持此读法的人常把本节与 2:20–22 连起来读。"],["可能走向离弃（阿米念传统）","","真信徒若长期忘记恩典、不结果子，可能一步一步走向离弃真道；本节是严肃的警告，叫人不可停在原地。持此读法的人强调 1:10「更加殷勤」的迫切。"],["上下文的线索","","1:9 与 1:12 之间有一条清楚的线：病是「忘了」，药是「提醒」；1:12 又说收信人「在你们已有的真道上坚固」，彼得是把他们当作真信徒来提醒的。全卷的「记念」线从这里开始（1:12、13、15；3:1、2、5、8），到 3:5 成了假师傅的「故意忘记」，3:8 又说「不可忘记」。可见彼得最关心的，是让会忘记的人被提醒回来，而不是替谁宣判。"]],"con":[],"say":"本讲义的立场：最自然的读法是实际上的遗忘——一个被洁净过的人，忘了恩典，眼睛只盯着近处，所以长不出 1:5–7 的品格。这节经文的目的是诊断与唤醒，不是宣判；药方就在下一段：「我却要将这些事常常提醒你们」（1:12）。得救确据与背道的整体立场，见 ISS00_5。","care":"这节经文是给自己的眼科检查，不是给别人的诊断书。一位冷淡多年的弟兄若问：「我是不是根本没有得救？」牧者不要急着替他下结论，先陪他「想起来」：你第一次知道自己被赦免是什么时候？那时你是怎样的？主怎样把你洗净？彼得自己也是被一次「想起」叫回来的——「彼得便想起主对他所说的话」（路 22:61），而那是因为主先转过身来看他。所以治疗不是更用力地自责，是重新看见主。对一个正在自责、睡不着的人，也要说清楚：会为自己的冷淡难过，本身就说明你还没有全瞎，主还在叫你。小组也可以一起做这个功课：每个月有一次聚会，不谈新的主题，只轮流说「主赦免了我什么」。这不是重复，是 1:12 的「常常提醒」；被提醒的人，眼睛会重新看得远，看见 1:11 那永远的国。"},{"id":"ISS01_5","t":"1:10「使你们所蒙的恩召和拣选坚定不移」——拣选要靠我们坚定吗？","r":"1:10–11","ch":[1],"why":"五、「所以弟兄们，应当更加殷勤，使你们所蒙的恩召和拣选坚定不移。你们若行这几样，就永不失脚。」拣选不是神的事吗？如果要靠我们「使它坚定」，是不是说神的拣选可以被我们弄丢？反过来，如果拣选本来就不会动摇，为什么还要殷勤？这节经文站在加尔文与阿米念两大传统的交界上，也直接碰到每一个信徒心里的问题：我怎么知道我是真的得救了？","pos":[["确据读法（改革宗多采）","","神的拣选本身不会动摇；「使之坚定」是让蒙召在信徒自己的经历与见证中变得确实。品格是拣选的证据，不是拣选的原因。动词 ποιεῖσθαι 是关身语态，「为你们自己」使之坚定——对象是你们的确据，不是在神那边补上什么。"],["参与读法（阿米念传统多采）","","人的回应真实地参与在神的保守之中；不殷勤，蒙召就可能落空。「永不失脚」是给「若行这几样」的人的应许，条件是真实的。部分抄本在此加上「借着你们的善行」，显示早期就有人这样理解，但多数校勘本视为后加的解说。"],["契约读法","","βέβαιος 在当时的契约文件上指「确实有效的保证」。神的呼召像一份已经成交的约，信徒的生命是让这份约在世人眼前、也在自己心里「看得见」的确认书。这个读法可以和前两种读法并存。"],["上下文的平衡","","1:10 夹在两个「神的供应」中间：前面是 1:3「神的神能已将一切……赐给我们」，后面是 1:11「必叫你们丰丰富富地得以进入」——1:5 那个「加上」的字在 1:11 以被动式再出现：你在这里慷慨供应，神在那里慷慨供应。殷勤是被包在恩典里面的，不是恩典之外的另一条路。"]],"con":[],"say":"本讲义的立场：源头在神，确据在生命。呼召与拣选起于「那用自己荣耀和美德召我们的主」（1:3）；1:5–7 的品格不是买门票，是让蒙召的人自己看见、也让人看见这呼召是真的。「永不失脚」用的是希腊文最重的否定 οὐ μή，是应许，不是威胁；而 1:11「丰丰富富地得以进入」的「进入」，原文是被动式——进国的门最后是主亲手打开的。得救确据与背道的整体立场，沿用希伯来书立场二，见 ISS00_5。","care":"这节经文对两种人说不同的话。对一个怕自己不够好、天天怀疑是否得救的人，它说：你的确据不是靠你撑出来的，源头在神；你今天会为长进挣扎，正是神在你里面作工的记号。对一个觉得「反正得救了，怎么活都可以」的人，它说：真正蒙召的人会殷勤，因为恩典不叫人闲懒。牧者要特别留意前一种人：不要用这节加重他们的焦虑。写「永不失脚」的人，曾经在水面上往下沉，「耶稣赶紧伸手拉住他」（太 14:31）——确据最后落在那只手上。小组里若有人说「我不确定自己是否得救」，不要只叫他「更有信心」；可以陪他一起读 1:3–11，指出三件事：神已经给了（1:3），你可以开始加上（1:5），门是主打开的（1:11）。然后问他：这一周你想在哪一项上，和我们一起操练？"},{"id":"ISS01_6","t":"1:16「乖巧捏造的虚言」——福音书是神话吗？","r":"1:16–18","ch":[1],"why":"六、「我们从前将我们主耶稣基督的大能和他降临的事告诉你们，并不是随从乖巧捏造的虚言，乃是亲眼见过他的威荣。」第一世纪的人听过许多神祇化身降临的故事；今天的人也常说：「耶稣的故事很美，可是那是神话，是后来的信徒编出来的。」大学课堂、网络视频、朋友的闲谈里都有这个声音。彼得在临终的信里特别否认「捏造的虚言」，可见这个指控在使徒时代就有了。福音书记载的是历史，还是一种宗教神话？","pos":[["解神话化（Bultmann 等）","","二十世纪德国学者布特曼主张，新约是用古代神话式的世界观写成的：天堂在上、阴间在下、神迹与天使介入人间；现代人要除去这层神话外壳，才能听见其中「呼召人作存在抉择」的信息。按这个看法，登山变像、复活等记载不必当作历史事件。"],["宗教史学派","","十九至二十世纪初的一些学者把基督教放在希腊罗马神秘宗教的脉络中比较，认为「死而复生的神」「神子降临」等主题是从周围的宗教借来的，福音书是信仰群体的神话化创作。后来的研究指出许多所谓相似其实很表面，而且年代多半晚于新约。"],["目击见证与古代传记（许多近代学者）","","福音书在文学类型上属于古代传记（bios），作者关心的是一个真实人物的言行；英国学者 Richard Bauckham 等人强调福音传统建立在目击者的见证上，并且是在目击者仍然在世时流传的（这使我们想起林前 15:6 保罗说复活的主显给五百多弟兄看，「其中一大半到如今还在」）。彼后 1:16 用的 ἐπόπται（亲眼目睹的人）、1:18「我们……亲自听见」，正是这种见证的语言。"],["回应：彼得自己的字","","ἐπόπται 在当时的神秘宗教里，指入门仪式最高一级、被引进内室看见秘密的人；彼得把这个字抢过来用：我们不是入了什么秘密的门，是站在山上、用眼睛看见的人。神话在「很久很久以前」发生，没有人可以查证；彼得却说出时间、地点与在场的人，而且收信的人之中可能还有人可以去问。这正是神话与见证的分别。"]],"con":[],"say":"本讲义的立场：福音书是建立在目击见证上的历史记载，不是神话。彼得说得很直接：我们没有编（σεσοφισμένοις μύθοις 的反面），我们是在场的人——看见了威荣，听见了声音，而且是「我们」，三个见证人。基督教是一个站在见证上的信仰，不是站在感觉上的信仰。同时也承认：历史的证据能叫人看见信心是合理的，却不能代替圣灵在人心里的光照（1:19、21）。","care":"一位大学生或年轻的上班族，若在课堂或网络上第一次听到「福音书是神话」，常常会很慌，又不敢在教会里问，怕被说成不属灵。牧者要让这样的问题可以被问出来，并且陪他看见：这个指控两千年前就有了，使徒正面回应过。不需要每个人都成为护教学者，但每个人都可以说「我所信的是有人在场看见的事」。这也提醒我们作见证时不必夸大，不必把自己的故事讲得比实际更精彩；照实说主在你身上做过的事，就够了。"},{"id":"ISS01_7","t":"1:19「更确的预言」——圣经比属灵经历更可靠吗？","r":"1:16–19","ch":[1],"why":"七、彼得刚讲完他一生最高的经历——在圣山上亲眼见过主的威荣、亲耳听见天上的声音——紧接着说：「我们并有先知更确的预言，如同灯照在暗处。」「更确」是比什么更确？如果是说圣经比登山变像更可靠，那么一切属灵经历是不是都不足信？如果是说经历使预言更确，那么今天的人是不是也要有经历，圣经才算确实？这个问题直接碰到教会里两种常见的张力：一种看重经历，一种看重真理。","pos":[["比经历更确","","先知的话比登山变像的经历更可靠：经历会过去、会被误解，圣经长存。古代与宗教改革时期不少注释采此读法，用来提醒信徒不要以经历为准则。"],["经历使预言更确","","βεβαιότερον 在述语位置，可译作「我们有先知之言，（如今）更加确定了」：登山变像证实了旧约对弥赛亚荣耀的预言。ESV（more fully confirmed）、NIV（completely reliable）采此方向。上下文「并且我们有」是把见证与圣经连在一起，不是拿两者比高低。"],["绝对比较级","","比较级在这里只表示「非常确实」，不与任何东西比较；重点是先知的话值得信靠。"],["灯与晨星的次序","","不论采哪一种读法，1:19 本身的画面都很清楚：灯照在 αὐχμηρῷ τόπῳ——又干又脏的地方，那就是第 2 章假师傅、第 3 章讥诮者所在的世界；灯不是太阳，只照脚前一步；「直等到天发亮，晨星在你们心里出现」，灯才放下。这个次序本身就说明：今天的经历与今天的圣经都还是天亮以前的光，真正的全光是主自己。"]],"con":[],"say":"本讲义的立场：经历证实了预言，预言解释了经历。彼得不是要拿经历和圣经比高低，而是说：我们在山上看见的，正好叫先知的话更确定了；你们没上过山，但你们手里有这更确的话。所以这节不能用来贬低一切属灵经历，更不能用来把经历放在圣经之上。灯是天亮以前的光——经历要被灯照亮、被灯检验；天亮了，晨星出现，灯才放下。","care":"看重经历的弟兄姐妹，听这节经文时要被尊重：彼得自己就是有经历的人，主在祷告与敬拜中真实的同在不必被嘲笑。看重真理的弟兄姐妹，也要被提醒：彼得没有说经历不重要，他是说经历最后要把人带回神的话。华人教会常在这里分成两边：一边说「你们只有头脑，没有生命」，一边说「你们只有感觉，没有真理」。1:16–19 把两边放在同一段经文里：同一个彼得，上过山，也捧着灯。牧者面对一位说「神亲自告诉我……」的会友，不必一开口就否定，可以陪他把那份感动放在灯下照一照：它与经文一致吗？它叫你更爱主、更爱人吗？面对一位从来没有特别经历、因此觉得自己信心较低的人，可以告诉他：你手里的那盏灯，和使徒的一样确实。"},{"id":"ISS01_8","t":"1:20「没有可随私意解说的」——平信徒可以自己读经吗？","r":"1:20–21","ch":[1],"why":"八、「第一要紧的，该知道经上所有的预言没有可随私意解说的」。这节经文常被引用来劝人不要自己读经：「你没有读过神学，会读错；听讲台就好。」也有人反过来，把每一个人的读法都当作同等有效。到底「私意」是指谁的意思——写经文的先知，还是读经文的人？这个问题的完整立场已写在全卷立场组 ISS00_3；本条处理第 1 章经文本身的读法，以及它在会众读经生活中的实际影响。","pos":[["来源读法","","先知没有凭自己去「解开」所见的异象；预言不是出于先知自己的解释。理由是 1:21 以「因为」接续，说明的正是预言的来源：「预言从来没有出于人意的，乃是人被圣灵感动，说出神的话来。」ἐπίλυσις（解开）新约只用这一次，γίνεται 讲的是预言怎样产生。许多福音派注释采此读法。"],["读者读法","","读者不可凭个人意思解经，需要教会群体或教导权威的引导。天主教传统常引此节说明教会训导的角色；部分新教注释也采此读法，强调个人主义的读经容易偏差。"],["圣灵读法","","预言出于圣灵，所以读者也需要同一位圣灵光照才能明白；这个读法把来源与读法连起来。"],["宗教改革的提醒","","宗教改革把圣经交回会众手中，译成百姓的语言，主张圣经的基本信息是清楚的，凡人都可以读懂得救之道；同时也承认有「难明白的」地方（3:16），需要教会的教导与彼此的帮助。这不是「人人自己说了算」，而是圣经在上、群体同读、教导者服事。"]],"con":[],"say":"本讲义的立场：主要讲预言的来源，完整立场见 ISS00_3。1:21 的「因为」把 1:20 解释清楚：经文不是先知自己想出来、自己解开的。这节不是禁止会众自己读经，也不是说只有牧师才能解经。由来源推出读法：既然经文不是出于人意，读的人也不可照私意扭曲它（3:16「强解」）；读经的保护不是把圣经锁起来，是在群体中读、照上下文读、谦卑地读——像庇哩亚人「天天考查圣经，要晓得这道是与不是」（徒 17:11）。","care":"华人教会里有不少弟兄姐妹，心里其实很想读经，却怕读错、怕被说「私意解经」，于是只听讲台、只读灵修小册。这节经文若被误用，就会把他们推得更远。牧者要做的正好相反：鼓励每个人打开圣经，同时给他们三个保护——一起读（小组、读经伙伴）、照上下文读（先问这段在说什么，再问对我说什么）、谦卑地读（看不懂就问，不急着下结论）。也要提醒讲台上的人：会众能读出讲员没看见的东西，不是威胁，是圣灵在群体中作工。教会可以为会众预备简单的读经工具：一份读经进度、一套三个问题的查经法、一个可以发问的小组。让每一位弟兄姐妹都知道，打开圣经不是越权，是领受；读错了可以被修正，不读才是真正的损失。"},{"id":"ISS01_9","t":"1:21「被圣灵感动」——圣经是怎样默示的？","r":"1:20–21","ch":[1],"why":"九、「因为预言从来没有出于人意的，乃是人被圣灵感动，说出神的话来。」这节经文与提后 3:16「圣经都是神所默示的」并列，是新约讲默示最重要的两处。可是问题接着来了：如果是圣灵说的，为什么保罗、彼得、约翰的文笔都不一样？先知是像录音机一样被动地记下来，还是用自己的话写？如果有人的成分，会不会有错？会众常常不会这样问出口，但这决定了他打开圣经时，是在读神的话，还是在读古人的宗教心得。","pos":[["机械口述说","","圣灵逐字口述，先知只是记录的工具，像书记抄写。这个看法要保护圣经每一个字都出于神，但很难解释各卷书明显不同的文风、用字、性情与研究过程（例如路 1:1–4 路加说他是「详细考察」之后才写的）。今天很少有学者真正持这个看法，却常被误以为是保守派的立场。"],["有机的完全默示（Warfield、Bavinck 等）","","圣灵使用作者的整个人——性情、经历、语言、研究——使他们所写的正是神要说的话，而且是完全的、可信的。φερόμενοι（被带着）这个字，这使我们想起徒 27:15 保罗的船「任风刮去」用的同一个字：帆是人的，风是神的。人没有失去自己，主词仍然是「人……说出」；但推动与方向来自神。"],["思想默示或部分默示","","有人主张只有思想被默示，字句是人自己选的；也有人主张只有关乎救恩的部分被默示，历史与科学细节可能有误。这些看法想给人的成分更大的空间，但与 1:21「说出神的话来」及主耶稣对经文的态度不太相合。"],["新正统的读法（巴特等）","","圣经是人对神启示的见证，当圣灵借着它向人说话时，它「成为」神的话。这个看法强调圣经的动态与相遇，但容易使圣经本身的权威依赖于读者的经历。"]],"con":[],"say":"本讲义的立场：有机的完全默示。圣灵使用先知的整个人，使他们所说的正是「神的话」；所以圣经有人的声音、人的文风，也完全是神的话，值得完全信靠。1:21 的焦点是来源：预言「从来没有出于人意」。也因为同一位圣灵当初带着先知说话，今天也带着读经的人明白——圣灵是我的引导，圣经是我的准则，两者从同一个方向来。","care":"这个议题影响的是一个人怎样捧着圣经。若他以为圣经只是古人的宗教心得，读到难处就会自己删改；若他以为圣经是从天上掉下来、与人无关的书，就会忽略历史背景，把经文断章取义。有机默示让人两样都看见：这是一封真实的人写给真实处境的信，也是神今天对我说的话。牧者可以鼓励会众读经时先问「当时的读者听见什么」，再问「神今天对我说什么」；遇到看不懂、甚至觉得矛盾的地方，不必惊慌，也不必硬解，可以带到小组一起查考，或先放在祷告里。信靠圣经，不是因为我们已经解决了每一个问题，而是因为我们认识那位说话的神。"},{"id":"ISS02_1","t":"2:1 今天谁是假师傅？","r":"2:1–3；2:10–19","ch":[2],"why":"一、2:1 说：「从前在百姓中有假先知起来，将来在你们中间也必有假师傅，私自引进陷害人的异端，连买他们的主他们也不承认，自取速速的灭亡。」今天网络上有大量「揭露假师傅」的视频与文章，常常直接点出某位牧者、某个教会或某种神学。会友读完第 2 章，最自然的问题是：那今天谁是假师傅？我可以、也应该把名字说出来吗？反过来，如果什么都不说，会不会等于纵容错谬？","pos":[["历史读法：彼得针对的是一世纪的具体群体","","许多注释家强调，彼得描写的是读者身边一群具体的教师：他们否认主再来与审判（3:4），以「自由」为名放纵情欲（2:19），又在爱筵中取利（2:13）。这个读法提醒我们不要把古代的描写随手贴在今天的人身上；它的长处是尊重处境，弱点是若只停在历史，经文就不再对今天说话。"],["名单式分辨：把今天符合描述的人点出来","","部分护教事工与网络频道认为，既然圣经点出假师傅，今天也应该公开点名，好保护信徒。他们的关切是真实的——确实有人受害。但这个做法常常把次要教义的分歧升级为「假师傅」，又让没有受过训练的人在不完整的信息下作判决，结果制造了更多的分裂与伤害。"],["记号式分辨（本讲义采用，见 ISS00_3）","","彼得给的是五个记号，都是果子：对基督——不承认买他们的主（2:1）；对金钱——贪心、捏造言语取利（2:3、14–15）；对身体——随肉身放纵情欲（2:10、14、18）；对权柄——胆大任性、轻慢（2:10）；对自由——应许人自由，自己却作奴仆（2:19）。这使我们想起主的话：「凭着他们的果子，就可以认出他们来。」（太 7:16）记号是给每个信徒用来分辨、也用来照自己的。"],["分层分辨：先分清错误的层级","","不少牧者提醒：教会里的分歧至少有三层。第一层是否认基督与福音核心的错谬，2:1「不承认买他们的主」属于这一层；第二层是生活与金钱的败坏，2:3、2:14 属于这一层；第三层是圣徒之间对洗礼、圣灵恩赐、末世次序等次要问题的不同理解。把第三层的分歧当作 2:1 的「假师傅」，本身就违背了 2:1 的严肃。"]],"con":[],"say":"本讲义的立场：讲台教记号，不给名单（回指 ISS00_3）。本条补两点：①分清层级——2:1 的「假师傅」指否认主、败坏生活、把人当货的教师，不是与我们在次要问题上看法不同的弟兄；②处理有程序——遇到身边真实的错谬或侵害，照主的次序先私下指出（太 18:15–17），对长老的控告「非有两三个见证就不要收」（提前 5:19），经查证属实的，在教会的程序中公开处理（提前 5:20）；不在网络上猎巫，也不因怕冲突而包庇。分辨的第一步，永远是把五个记号先照在自己身上。","care":"这个议题最容易伤害两种人。一种是受过属灵伤害的人：他们需要听见，教会不会用「不要论断」叫他们闭嘴，他们的经历值得被认真对待、被照程序处理。另一种是爱上「揭露」的人：一个人若每天看别人的错，自己的心会慢慢变硬、变冷，最后只剩怀疑，忘记了 2:9「主知道搭救敬虔的人」。牧者要陪前者找到安全的出口，也要温柔地提醒后者：彼得写第 2 章，是一个被主拉回来的人在呼喊，不是一个检察官在起诉。分辨的目的是自己不坠落（3:17），也把迷路的人找回来，不是证明自己站在对的一边。"},{"id":"ISS02_2","t":"2:1「连买他们的主」——基督为不信的人死了吗？","r":"2:1；参 3:9","ch":[2,3],"why":"二、2:1 说假师傅「连买他们的主他们也不承认」。「买」ἀγοράσαντα 是奴隶市场付价的字，「主」δεσπότης 是有产权的主人。如果主「买」了这些最后「自取速速的灭亡」的人，那基督是不是也为最后沉沦的人死了？这一节因此成为「有限救赎」与「普遍救赎」之争中常被引用的经文；一位认真读经的弟兄若同时听到两边的讲法，会问：到底哪一边才合圣经？","pos":[["普遍救赎（阿米念、卫斯理传统，也有部分路德宗）","","这一派认为本节最直接的读法就是：基督确实为这些假师傅付了价，他们却否认这位主，所以沉沦。这与约一 2:2「他为我们的罪作了挽回祭，不是单为我们的罪，也是为普天下人的罪」、提前 2:6「舍自己作万人的赎价」相合；3:9「不愿有一人沉沦」也指向同一个方向。救赎之功是真实地为众人预备的，却可以被人拒绝。"],["有限救赎之一：照他们自己的认信说话","","许多改革宗注释家认为，彼得是照假师傅自己的宣称、也照群体眼中的样子说话：他们口称被主买赎、在教会中有位分，却否认这位主。就像说「他们从我们中间出去，却不是属我们的」（约一 2:19）——在外表上属于，在实际上不属于。主为「羊」舍命（约 10:11），这一节不足以推翻这个框架。"],["有限救赎之二：盟约之主的语言","","另一些改革宗学者指出，δεσπότης 在新约多指父神或作为主权者的主，而申 32:6 称神是「将你买来」以色列全体的那一位——那是盟约群体被神拥有的语言，不是讲每一个人蒙拣选的救赎。彼得把假先知（以色列中）与假师傅（教会中）并列，正是在用这个盟约框架：他们属于被买的群体，却背叛了群体的主。"],["足够于众人、有效于信者（亚目拉督派与部分温和改革宗）","","这一派试图兼顾两边：基督的死在价值上足够所有人，福音可以真诚地向所有人传；在神的旨意与效果上，只在信的人身上生效。按这个读法，2:1 的「买」指前者，假师傅是拒绝了一份真实为他们预备的赎价。"]],"con":[],"say":"本讲义的立场：这一节两派都读得通，不宜单凭它在讲台上裁决救赎的范围（见 blk 2:1 的「最好的理解」）。彼得在这里要量的不是救赎的范围，而是罪的深度——他们否认的是一位已经付了价的主人。各派都同意三件事：基督的死是真实的付价；假师傅在群体里面，口称属主；人若否认主，自取灭亡。讲台的落点不是「他们是不是被买的」，而是「我是不是活得像被买来的人」：「因为你们是重价买来的。所以，要在你们的身子上荣耀神。」（林前 6:20）","care":"救赎范围的争论，最好在书房和查经班里慢慢谈，不要变成教会里互相贴标签的战场；两边都有敬虔爱主、为福音摆上一生的人。牧者若遇到一位因为这个问题而不安的弟兄——他可能担心「主到底有没有为我死」——要把他带到 3:9 与约 6:37「到我这里来的，我总不丢弃他」：不论哪一派，都同意来到主面前的人不会被拒绝。争论可以留着，但一个人此刻就可以回应那位付了价的主。"},{"id":"ISS02_3","t":"2:3「贪心……取利」——传道人的钱、成功神学与教会财务该怎样看？","r":"2:3；2:13–15","ch":[2],"why":"三、2:3 说：「他们因有贪心，要用捏造的言语在你们身上取利。」2:14–15 又说他们「心中习惯了贪婪」，随从「贪爱不义之工价」的巴兰。华人教会里，钱的话题常常两极：一边有人把传道人领薪水、教会募款都看成可疑；另一边有讲台宣讲「奉献多少就得回多少倍」的兴盛福音，或是财务长年不公开。会友会问：传道人到底可不可以靠事奉生活？成功神学是不是 2:3 讲的那种贪心？教会的钱应该怎样管？","pos":[["兴盛福音（成功神学）的主张","","持这种讲法的人引用约三 2「我愿你凡事兴盛，身体健壮」、申 8:18「得货财的力量是他给你的」、玛 3:10 试试神是否倾福，认为信心与奉献会带来今生的财富与健康，贫穷与疾病多半是信心不足。他们的长处是提醒神是慷慨的父、关心人的生活；但把属灵与物质直接换算，常常使奉献变成交易，使受苦的信徒背上「信心不够」的重担。"],["传道人受供养合乎圣经","","保罗说：「主也是这样命定，叫传福音的靠着福音养生。」（林前 9:14）又说「那善于管理教会的长老，当以为配受加倍的敬奉」（提前 5:17）。按这个立场，把传道人合理的薪资、教会正当的募款都看成贪心，是不公平的，也会让忠心的同工在经济上长期受苦。"],["自养与带职：放弃权利以免福音受阻","","保罗虽然有权利受供养，却常常亲手作工（徒 18:3；20:33–34），说「免得基督的福音被阻隔」（林前 9:12）。许多华人带职事奉者以此为榜样。这个立场不否定受供养的正当，只是提醒：在某些处境里，放下权利本身就是见证。"],["制度透明：问题不只在个人的心，也在管理的方式","","保罗经手耶路撒冷的捐款时，刻意与众教会选派的弟兄同行，说：「我们留心行光明的事，不但在主面前，就是在人面前也是这样。」（林后 8:21）按这个立场，对抗 2:3 最好的方法不是揣测谁的心贪，而是让教会的财务公开、有人监督、可以被查问。"]],"con":[],"say":"本讲义的立场：不点名任何人；传道人受供养合乎圣经，不是贪心。2:3 的记号有三个要素连在一起：动机是贪心（πλεονεξία，想要更多）；方法是「捏造的言语」（πλαστοῖς λόγοις，照听众想要的形状捏出来的话）；对象是「在你们身上取利」——把人当货。所以分辨的问题不是「他有没有钱」，而是「他的话是不是为了钱而捏的」：讲台是否用应许换奉献、用恐惧换奉献、把祝福标上价钱——「以敬虔为得利的门路」（提前 6:5）。本讲义主张，教会对 2:3 最好的回应，是自己的财务透明：预算公开、帐目可查、经手不止一人、领袖主动说明。","care":"钱的伤害很深，而且常常说不出口：有人为了「种子奉献」借了钱，有人奉献后没有得到应许的回报，就以为神不爱他。牧者要先让这样的人知道：神没有把祝福标上价钱，你的不顺不是信心不够的惩罚。同时也要提醒全教会不要因此对所有传道人都起疑心——忠心的同工也需要被供养、被信任。领袖自己最好的见证，不是在讲台上说「我不爱钱」，而是让会众随时看得到钱怎样进、怎样出。"},{"id":"ISS02_4","t":"2:4「犯了罪的天使」与「地狱」——创世记 6 章的神的儿子们是天使吗？","r":"2:4；参 创 6:1–4；犹 6–7、14–15","ch":[2],"why":"四、2:4 说：「就是天使犯了罪，神也没有宽容，曾把他们丢在地狱，交在黑暗坑中，等候审判。」这节有三个问题连在一起：①天使犯了什么罪？是不是创 6:2「神的儿子们看见人的女子美貌，就随意挑选，娶来为妻」？②和合本「丢在地狱」原文是 ταρταρώσας（新约仅此一次），借用了希腊神话中最深的囚禁之处——圣经怎么可以用神话的字？③犹 14–15 明引以诺一书，彼得的背景也与以诺一书相近——那以诺一书算不算圣经？另外，2:4 有异文：σειραῖς（锁炼）与 σιροῖς（坑），和合本「黑暗坑中」跟后一读。","pos":[["天使说：创 6 的「神的儿子们」是堕落的天使","","第二圣殿时期的犹太文献（以诺一书 6–21 章、禧年书）与多数二世纪教父（如游斯丁、爱任纽、特土良）都这样读。支持的经文理由是：约伯记中「神的众子」指天使（伯 1:6）；犹 6–7 把不守本位的天使与所多玛「也照他们一味地行淫」相连；彼得的次序天使、洪水、所多玛，正是创 6、6–8、19 的次序。许多新近的福音派与批判学者都认为彼得与犹大书是在这个背景里说话。"],["塞特后裔说：「神的儿子们」是敬虔的塞特后裔","","三世纪已有犹流·亚非利加努提出，经屈梭多模、奥古斯丁成为主流，到加尔文与许多改革宗注释，认为天使不能与人婚配（太 22:30「人也不娶也不嫁，乃像天上的使者一样」），创 6 是敬虔的塞特一脉与不敬虔的该隐一脉通婚而败坏。持此说的人认为 2:4 指的是天使原初的堕落，不必与创 6 连结。"],["君王说：「神的儿子们」是古代自称神子的统治者","","部分古代犹太解经（如某些他尔根与拉比注释）与一些近代学者认为，古代近东的君王常自称神的儿子，创 6 描写的是强权者任意多娶、压迫人的暴力。这个读法解释了创 6:4「上古英武有名的人」，但较难与彼后 2:4、犹 6 的天使相连。"],["原初堕落说：2:4 只指撒但与随从他的天使起初的背叛","","有些注释家认为彼得只是说「连天使犯罪都受审判」，不特指创 6；天使何时、怎样犯罪，圣经没有详述，不必勉强连结。这个读法谨慎，但较难解释 2:4–6 与创 6–19 的次序吻合。"]],"con":[],"say":"本讲义的立场：四说并陈；彼得的次序最自然是借用读者熟悉的创 6 章背景，但他只借背景，不展开天使学的细节，他要说的只有一句——神没有宽容。关于以诺一书：犹大书引用它、彼得的背景与它相近，都不等于把它列入正典；正如保罗在雅典引用希腊诗人（徒 17:28）、在提多书引用克里特诗人（多 1:12），引用一句真话不代表整本书是神的话；以诺一书从未被教会普遍承认为正典，本讲义不把它当正典使用。关于 ταρταρώσας：彼得借读者熟悉的字讲一个真实的拘禁，用这个字不等于接受那套神话；和合本译作「地狱」，但它既不是主耶稣常说的「地狱」γέεννα，也不是「阴间」ᾅδης，经文没有提供空间结构，讲台不画阴间地图。异文 σειραῖς／σιροῖς 意思相近，都是拘禁与幽暗，不影响任何教义。","care":"这节经文周围有许多引人好奇的问题，有些弟兄姐妹会因此花很多时间在网络上追「巨人族」「堕落天使」的视频，越看越怕，或越看越觉得自己掌握了别人不知道的奥秘。牧者要温柔地把他们带回彼得的重点：这个长句的终点是 2:9「主知道搭救敬虔的人」。认真看待审判的人，正好最能安心把审判交给神。好奇的问题可以在书房里谨慎研究，但不要让它取代主本身；若有人因为这类内容长期恐惧、失眠，要陪他祷告，必要时协助他寻求专业的帮助。"},{"id":"ISS02_5","t":"2:7「义人罗得」——创世记 19 章的罗得是义人吗？","r":"2:6–9；参 创 13:10–13；19:1–38","ch":[2],"why":"五、彼得一连三次称罗得为「义人」：「只搭救了那常为恶人淫行忧伤的义人罗得。因为那义人住在他们中间，看见听见他们不法的事，他的义心就天天伤痛。」（2:7–8）可是熟悉创世记的人都知道：罗得看见平原滋润就选了所多玛（创 13:10–13），在城门口坐上位子（创 19:1），危急时提议把女儿交出去（创 19:8），天使催促时「迟延不走」（创 19:16），最后在山洞里醉倒（创 19:30–36）。这样的人怎么能称为义人？","pos":[["相对的义：比起所多玛人，他是义的","","这一派指出，罗得在城门口接待陌生人、不让客人受辱（创 19:1–3），在一座败坏的城里，他是唯一还照着亚伯拉罕家的规矩待客的人。他的义是与周围相比的义。长处是贴近创世记的叙事；弱点是容易把「义」变成「比别人好一点」。"],["被算为义：罗得蒙救是出于恩典与代求","","创世记清楚说，罗得蒙救是因为「耶和华怜恤罗得」，天使「就拉着他的手」（创 19:16），而且「神记念亚伯拉罕」（创 19:29）。许多改革宗与福音派注释家强调：罗得的义是被算为义的义，与亚伯拉罕「信神，这就算为他的义」同一条路。"],["承接犹太传统的称呼","","第二圣殿时期的犹太文献（如所罗门智训 10:6）已称罗得为「义人」，彼得沿用了读者熟悉的称呼。一些较批判的学者认为彼得在这里把罗得理想化了；但这个立场较难解释彼得为什么在 2:8 特别给出一个非常具体、而且不夸大的定义。"],["彼得自己的定义：还会伤痛的心","","彼得在 2:8 自己说明他称罗得为义的原因：「他的义心就天天伤痛。」ἐβασάνιζεν 是未完成式，天天如此——在一座把罪当日常的城里，他还没有麻木。这个读法不否认罗得的软弱，而是指出：义不是完美，是一颗没有被所多玛磨平的心。"]],"con":[],"say":"本讲义的立场：四个角度可以合在一起读，落点在彼得自己的定义——义不是完美，是一颗还会伤痛的心；而罗得蒙救的主词是神，那是恩典。讲台不把罗得美化成榜样，好像住在所多玛也没关系；也不嘲笑他，好像「这种人也算义人」。罗得的一生同时说出两件事：住错地方是有代价的——他失去了财产、妻子（「你们要回想罗得的妻子」路 17:32）和女儿们的清白；但主仍然把一个住错了地方、还会伤痛的人拉了出来。这正是 2:9 的意思：「主知道搭救敬虔的人脱离试探。」","care":"很多信徒活在自己的「所多玛」里：一个充满谎言的职场、一个每天都在试探的荧幕、一个看不到出路的家庭。他们有时羞愧地想：我还住在这里，我还算是基督徒吗？罗得的故事给他们两个安慰与一个提醒。安慰是：你还会痛，就表示你的义心还在；主知道怎样把你拉出来。提醒是：不要把「还会痛」当作留下来的理由，看久了不痛才是真正的危险。牧者要陪伴这样的人一起祷告、一起想出具体的一步，而不是丢给他一句「你应该离开」。"},{"id":"ISS02_6","t":"2:10「轻慢主治的」——可以批评教会领袖吗？","r":"2:10–11；参 彼前 5:1–3","ch":[2],"why":"六、2:10 说：「那些随肉身、纵污秽的情欲、轻慢主治之人的，更是如此。他们胆大任性，毁谤在尊位的，还不知惧怕。」在某些教会里，这节经文被用来回应会友的质疑：「你批评牧师，就是轻慢主治的」「毁谤在尊位的，是假师傅的记号」。一位看见领袖真实问题、却被这样回应的弟兄会问：圣经真的禁止我们对教会领袖提出任何批评吗？","pos":[["「主治的」指主的主权（多数新近注释）","","κυριότητος 是单数抽象名词，字根就是「主」κύριος；紧接着 2:1「不承认买他们的主」，最自然的意思是：他们轻慢的是主自己的权柄。犹 8 的平行经文说「轻慢主治的」，也是同一个方向。按这个读法，本节根本不是在讲人间的权威。"],["「主治的」与「在尊位的」指天上的权势","","弗 1:21、西 1:16 的 κυριότης 是天使的等级之一；2:10 的「在尊位的」δόξας 原文是「荣耀者」，2:11 立刻说「就是天使……还不用毁谤的话在主面前告他们」，可见「在尊位的」最自然指天上的荣耀者（可能是堕落的天使），对照犹 8–9 天使长米迦勒不敢罪责魔鬼。按这个读法，本节讲的是假师傅随口毁谤他们不懂的属灵世界。"],["「在尊位的」指人间的领袖（部分传统读法）","","有些讲道与部分较早的注释把「在尊位的」读为教会或社会的领袖，常与撒上 26:9「谁伸手害耶和华的受膏者而无罪呢」连在一起，用来劝人尊重领袖。这个读法提醒我们不可随意毁谤人；但若用来禁止一切质疑，就与上下文冲突了。"],["「毁谤」与「质疑」的区分（许多牧养学者的提醒）","","βλασφημοῦντες 是恶意地诋毁、说坏话，不是提出问题。新约一面要求尊重领袖（来 13:17），一面要求查验、责备有罪的长老（提前 5:19–20），也称赞庇哩亚人天天考查保罗所讲的「这道是与不是」（徒 17:11）。按这个立场，教会需要的不是禁止质疑，而是一条安全、公开、照程序的质疑管道。"]],"con":[],"say":"本讲义的立场：「主治的」最自然指主的主权，「在尊位的」最自然指天上的荣耀者；这不是一节替人间权威护航的经文。更关键的是：第 2 章被定罪的，正是「师傅」——有讲台、有跟从者、在上位的人（2:1–3）。所以 2:10 不能拿来堵住对领袖的正当质疑（红线二）。本条沿用彼得前书讲义的立场五：彼得给长老的命令是「也不是辖制所托付你们的，乃是作群羊的榜样」（彼前 5:3）。分辨正当质疑与毁谤，看三件事：内容是否属实、动机是否出于爱、方法是否照程序（太 18:15–17；提前 5:19–20）。保罗曾在安提阿当面抵挡彼得（加 2:11），彼得后来仍称他为「我们所亲爱的兄弟」（3:15）——被正当纠正的领袖，最好的回应是谦卑，不是引用 2:10。","care":"这个议题连着许多人的属灵伤害。有人因为提出问题被冠上「悖逆」「轻慢主治」，从此不敢再开口，甚至离开教会、怀疑信仰。牧者要让这样的人知道：照真理、在爱中、按程序提出的质疑不是罪，他们的声音值得被听见；若有侵害，教会应该协助他们寻求公正的处理与专业的帮助。同时也要提醒每个人，2:10 仍然有一面是对我们说的：「胆大任性」αὐθάδεις 是以自己为乐、随己意——批评别人时，先问自己是在追求真理，还是在取悦自己的怒气？领袖与会众都把审判交给主（2:11），才能一起站在真理里。"},{"id":"ISS02_7","t":"2:11 天使不用毁谤的话——基督徒可以「斥责魔鬼」吗？","r":"2:10–12；参 犹 8–10；雅 4:7","ch":[2],"why":"七、2:11 说：「就是天使，虽然力量权能更大，还不用毁谤的话在主面前告他们。」犹 9 的平行经文更具体：「天使长米迦勒为摩西的尸首与魔鬼争辩的时候，尚且不敢用毁谤的话罪责他，只说：『主责备你吧！』」许多教会的祷告会里常听到「我奉主名捆绑你、斥责你」的祷告。有人因此问：连天使长都不敢罪责魔鬼，我们可以吗？这是不是在 2:10–12 说的「毁谤所不晓得的事」？","pos":[["奉主名的属灵权柄（灵恩与第三波传统）","","这个传统指出，主差遣门徒时赐他们「权柄可以践踏蛇和蝎子，又胜过仇敌一切的能力」（路 10:19），保罗也奉主名命令污鬼离开（徒 16:18）。信徒在基督里有权柄抵挡魔鬼，这是福音的得胜。他们提醒，若因为 2:11 而对属灵争战退缩，就忽略了新约的另一面。"],["谨慎的读法：把审判交给主","","这一派强调 2:11 与犹 9 的模式：连天使长都不自己宣判，只说「主责备你吧」。属灵争战的方式是顺服神、抵挡魔鬼（雅 4:7）、穿戴神所赐的全副军装（弗 6:11），而不是与邪灵对话、嘲弄、喊话，或花许多时间研究邪灵的名字与等级。"],["经文对象的读法：2:11 讲的是假师傅的狂妄，不是祷告的方式","","也有注释家指出，2:10–12 的重点不在教导信徒怎样祷告，而在揭露假师傅：他们自以为有属灵知识，「毁谤所不晓得的事」（2:12），对属灵世界轻率、狂妄。照这个读法，本节的应用是谦卑与敬畏，不是直接禁止某一种祷告用语。"],["「战略层次属灵争战」的主张与疑虑","","二十世纪后期有一种做法，主张找出管辖某地区的邪灵名字，在当地上空「宣告、捆绑」，以打开福音的门。支持者引用但 10:13 的「波斯国的魔君」。许多福音派学者则提醒：但以理在那里是禁食祷告，交战的是天使，不是人去向邪灵喊话；新约也没有教导信徒去辨认邪灵的地域名字。2:11–12 的谨慎，正好适用在这里。"]],"con":[],"say":"本讲义的立场：可与以弗所书讲义的立场四（属灵争战）对照阅读。2:11 教的是谦卑：连力量权能更大的天使，都把审判交给主（παρὰ κυρίῳ，在主面前）。所以：奉主名抵挡魔鬼是合乎圣经的（雅 4:7；徒 16:18），但焦点在主，不在魔鬼；不嘲弄、不毁谤、不与邪灵对话、不对属灵世界作超出圣经的猜测。祷告时说「主责备你」「奉主耶稣的名，你离开」，与在讲台上长篇喊话、把魔鬼当作表演对象，是两回事。2:12 的警告值得每个热心的人记住：「他们毁谤所不晓得的事」——属灵的狂妄，本身就是有己。","care":"这个议题在华人教会常常把人分成两群：一群觉得另一群「太灵恩、太夸张」，另一群觉得这一群「没有信心、没有能力」。牧者要帮助两群人都回到 2:11 的中心：我们的安全不在祷告的音量或用语，而在那位「知道搭救敬虔的人」的主（2:9）。对正在受惊吓、觉得被邪恶搅扰的人，不要先跟他争论祷告的用语，要先陪他、为他祷告，让他知道主比一切更大；若有长期的恐惧、失眠或其他身心的困扰，也要协助他寻求医疗与专业的帮助，那不是不属灵。"},{"id":"ISS02_8","t":"2:15–16 驴说人话——怎样读圣经里的神迹？","r":"2:15–16；参 民 22:21–35","ch":[2],"why":"八、2:16 说：「那不能说话的驴以人言拦阻先知的狂妄。」这件事出自民 22 章：巴兰骑驴去见摩押王，驴三次避开持刀的使者，巴兰三次打驴，「耶和华叫驴开口」（民 22:28）。现代读者读到驴说人话，常常会笑，或觉得这像童话。一位读过一些圣经批判学的大学生会问：彼得真的相信驴说了人话吗？圣经里的神迹应该怎样读？如果这是寓言，那其他神迹呢？","pos":[["历史中的神迹（传统与福音派的读法）","","民数记把这件事放在历史叙事里，彼得也把它与天使、洪水、所多玛等事件并列，当作真实发生的事。民 22:28 的主词是「耶和华」——不是驴有了说话的能力，是创造万物的神暂时借驴说话。若承认神是创造主、承认基督从死里复活，一头驴说话并不比这些更难。"],["异象或内在经验","","有些解经家（包括少数古代犹太注释）认为巴兰是在异象或内在经验中「听见」驴说话，就像先知在异象中看见、听见。这个读法仍然承认神超自然的介入，只是对发生的方式有不同理解。"],["传说或寓言（历史批判学的读法）","","部分学者认为巴兰的故事是古代流传的民间故事，用幽默的方式讽刺一个外邦术士，不必当作历史事件。他们的关切是文学体裁；但这个读法若一路推下去，往往也会把新约的神迹，甚至复活，一起归为传说，这就与彼得在 1:16「并不是随从乖巧捏造的虚言」的立场正面冲突。"],["寓意的读法","","古代与中世纪有些讲道把驴寓意化，例如驴代表谦卑的会众、使者代表基督等。这种读法有属灵的感动，但容易把作者没有说的意思放进经文。"]],"con":[],"say":"本讲义的立场：照民数记与彼得的记载，把它当作真实的神迹来读，主词是神；同时承认经文用了讽刺的笔法。彼得的重点不在驴，而在对比：自以为有属灵知识的人「好像没有灵性、生来就是畜类」（2:12），不能说话的畜类却用人言说出了理性的话——被钱冲昏头的先知，比一头驴还不清醒。读圣经神迹的原则是：先问体裁与作者的意思，再承认神是创造主、能在他的世界里行事；神迹的可信，最后系在基督的复活上（林前 15:17）。彼得自己说，他所传的「并不是随从乖巧捏造的虚言，乃是亲眼见过他的威荣」（1:16）。","care":"对正在面对知识挑战的年轻人，不要用「不要问那么多，信就对了」把问题压下去；他们需要看见，基督徒可以诚实地面对问题，又不失去信心。可以陪他们从最核心的地方开始：基督的复活是不是真的？若是，其他神迹就有了根基。同时也别让这段经文只剩趣味：巴兰三次打驴，不知道驴救了他的命。今天神的「驴」可能是一位你看不起的人、一个一再受阻的计划——被拦住的时候，先别急着打驴，先问：我是不是正往「不义的工价」那里走？小组里若有人带着真诚的疑问来，牧者可以推荐好的入门书，或约他单独谈，让问题在信任的关系里被慢慢处理，而不是在公开的场合里被嘲笑或被打发。"},{"id":"ISS02_9","t":"2:20–22 后来的景况比先前更不好——信徒会失去救恩吗？","r":"2:20–22；参 1:9–10；3:9、17","ch":[1,2,3],"why":"九、2:20–22 说：「倘若他们因认识主救主耶稣基督，得以脱离世上的污秽，后来又在其中被缠住、制伏，他们末后的景况就比先前更不好了。他们晓得义路，竟背弃了传给他们的圣命，倒不如不晓得为妙。」接着是两句俗语：狗转过来吃所吐的，猪洗净了又回到泥里滚。「认识」ἐπίγνωσις 在本卷 1:2–3、1:8 都是得救的认识，这使经文更沉重：一个真正认识过主的人，会不会失去救恩？一位跌倒的弟兄读到这里，会问：我是不是就是那条狗？本条回指 ISS00_5，只补本章经文的细节。","pos":[["真信徒可以失落救恩（阿米念传统）","","这一派指出，「因认识主救主耶稣基督」用的是本卷描写得救的同一个字，「得以脱离世上的污秽」与 1:4「脱离世上从情欲来的败坏」用的是同一个动词 ἀποφεύγω；这些描写看起来是真实的得救经历。后来「被缠住、制伏」，就失去了原有的地位。这个读法严肃看待经文的用字。"],["他们从未真正重生（加尔文传统）","","这一派指出 2:22 的比喻正是重点：狗转回所吐的，因为牠本来就是狗；猪洗净了还是猪。他们有过外面的洗净、知识与群体生活，却没有新的本性。这与约一 2:19「他们从我们中间出去，却不是属我们的」相合，也与 1:10「就永不失脚」的应许一致。"],["警告是神保守信徒的工具（许多福音派）","","这一派认为，警告本身是真实的，神正是借着这样真实的警告，保守属他的人不至「从自己坚固的地步上坠落」（3:17）。警告不是用来测量别人，而是用来叫自己警醒；应许与警告同时是真的。"],["上下文的落点（本讲义采用，见 ISS00_5）","","2:20 以 γάρ 接续 2:19 的「他们」——应许人自由、自己却作败坏奴仆的假师傅，以及完全跟从他们转背的人；他们引诱的对象是「那些刚才脱离妄行的人」（2:18）。所以这段最严厉的话是对着误导人的人说的，同时在保护被误导的人。"]],"con":[],"say":"本讲义的立场：沿用 ISS00_5（希伯来书立场二）。三读并陈，落点在上下文：2:20–22 描述的是假师傅与跟从他们转背的人，不是在挣扎中跌倒、仍然想回头的弟兄姐妹（红线五）。本条补三点：①「倒不如不晓得为妙」说的是光照与责任成正比——「多给谁，就向谁多取」（路 12:48），不是说认识主是危险的事；②这段经文对自己是警醒，对别人不是判决——本讲义绝不对任何个人说「你已经没救了」；③回头有两种：2:22 的「转过来」ἐπιστρέψας，与主对彼得说「你回头以后，要坚固你的弟兄」（路 22:32）用的是同一个分词——狗回到所吐的，彼得回到主面前。跌倒的人要同时听见 1:9「旧日的罪已经得了洁净」与 3:9「乃愿人人都悔改」：主还在等。","care":"一个会因为害怕自己是那条狗而流泪、失眠的人，正是心还没有刚硬的人；真正的危险，是已经不在乎的人。牧者讲这段时，要先问一个问题：坐在下面的是谁？若是一位刚跌倒、很想回来的弟兄，就把他带回 1:9 与 3:9，告诉他写这段话的彼得自己也曾「转过去」，主却把他等了回来。也要提醒全教会，「狗」和「猪」是彼得描写假师傅本性的比喻，不是让我们给跌倒的人取的绰号。陪跌倒的人祷告、陪他走回群体，比任何神学的辩论都更接近这段经文的心意。"},{"id":"ISS03_1","t":"3:4「应许在哪里呢？」——两千年了，主还会来吗？","r":"3:3–4；3:8–10","ch":[3],"why":"一、3:4「主要降临的应许在哪里呢？因为从列祖睡了以来，万物与起初创造的时候仍是一样。」这是讥诮的人的话，可是今天它常常不是从讥诮的人口中说出来，而是从等了很久的信徒心里冒出来。新约一再说主「快」来、结局「近了」（彼前 4:7；启 22:20），两千年过去了，主还没有来。有人因此认为早期教会根本是预期落空，后来才改口；也有人反过来，每隔几年就宣告一次「这次真的快了」。一位认真的弟兄会问：主还会来吗？如果会，为什么这么久？","pos":[["「再临延迟」危机说（部分近代学者）","","一些近代学者主张：第一代基督徒预期主在他们有生之年回来，主没有回来，教会陷入信仰危机；彼得后书第 3 章就是第二代教会为了化解这个危机而写的辩护。持此说的人多半把 3:4「列祖」读成已经过世的第一代信徒，并以此支持本书晚出、托名的看法（见 ISS00_1、ISS00_7）。这个读法提醒我们：「延迟」的问题在新约里确实存在，教会没有回避它。"],["近与不知何时并存（多数福音派，本讲义采用）","","新约从一开始就同时说两件事：主必快来，而且那日子没有人知道（太 24:36；帖前 5:1–2）。「快」主要说的是确定性与随时性，而不是一个近在眼前的日期；主自己的比喻里也有「主人来得迟」（太 24:48；25:5、19）。所以延迟不是后来才发现的意外，而是主早就预备门徒面对的处境。彼得的回答有三步：神的时间不是人的钟表（3:8）；神的慢是宽容，不是耽延（3:9）；那日子必像贼来到（3:10）。"],["过去应验说（全然过去派）","","少数人主张主的再来已经在主后 70 年耶路撒冷被毁时以审判的方式应验了，所以不必再等。部分过去派只把部分预言（如橄榄山讲论的一部分）放在主后 70 年，仍然相信将来的再来；但极端的版本与本章直接冲突：3:13 的新天新地、有义居在其中，显然还没有来到，而 3:10 的主的日子是对全地的审判与显露。"]],"con":[],"say":"本讲义的立场：主一定会亲自回来；沿用帖撒罗尼迦前书立场二，不定时间表、随时预备（见 ISS00_4）。延迟不是教会的难堪，而是神的宽容：从人的观点看叫「耽延」，从神的观点看叫「宽容」（3:9）。彼得给等候的人的第一个武器不是论证，而是记得——记得神的话创造过、审判过，现在还托住这个世界（3:5–7）；记得主看一日如千年（3:8）。讥诮的人「故意忘记」，信徒「不可忘记」。","care":"「应许在哪里呢？」最痛的版本，不是关于末日，而是关于自己：等了十年的家人还没信主，等了很久的医治还没来，祷告了很多次的事还没有答案。牧者不要急着责备这份累，彼得也没有责备；他只是把它翻过来：主的慢是爱的等。陪伴这样的人，可以和他一起读 3:9，然后说：写这句话的人，自己就是被主等回来的——三次不认主，主没有放弃他。也要提醒会众：不要因为有人一次又一次宣告「主某年必来」而落空，就连真正的应许也一起丢掉。错的是那些时间表，不是主的应许。等候的人最需要的不是一个日期，而是一个同行的群体：在等的日子里一起聚会、一起祷告、一起去找还没回家的人。"},{"id":"ISS03_2","t":"3:5–7 天地从水而出、存留给火——与创造论和科学怎样对话？","r":"3:5–7","ch":[3],"why":"二、3:5–7「从太古凭神的命有了天，并从水而出、借水而成的地」，「当时的世界被水淹没就消灭了」，「现在的天地还是凭着那命存留……用火焚烧」。这几节连到创世记第 1 章的创造与第 6–8 章的洪水。华人教会里，创造论是一个容易起争执的题目：有人认为只有六日、约一万年内的年轻地球才是忠于圣经；有人接受宇宙与地球有很长的年岁；也有人接受生物演化是神创造的方法。于是有人想用这三节经文去支持自己的立场，或裁判别人的立场。问题是：彼得在这里要讲的是什么？教会该怎样在这个题目上与科学对话？","pos":[["年轻地球创造论","","主张创世记第 1 章的「日」是一般的日子，地球与宇宙约有数千年到一万年的历史；挪亚的洪水是全球性的，许多地层与化石由洪水形成。持此说的人常引 3:5–6 支持全球洪水，认为彼得把洪水当作与创造同等真实的历史事件。他们的出发点是要高举圣经的权威与历史性。"],["古老地球创造论","","接受宇宙与地球有很长的年岁，同时相信神直接创造；在解释创世记时有「日－年说」（每一日代表一段长时期）、「间隔说」（创 1:1 与 1:2 之间有一段时间）、「渐进创造说」等。对 3:5–6，持此说的人多半同意洪水是真实的历史审判，但对它的范围是全球还是当时人类所居之地看法不一。他们的出发点是相信神的话与神的作为（受造界）不会互相矛盾。"],["文学架构说与有神导演化／演化创造论","","文学架构说认为创世记第 1 章的六日是神学性的文学架构（前三日造领域、后三日充满领域），重点在谁创造与为何创造，不在时间长短。演化创造论则接受生物演化是神持续护理与创造的方法，同时坚持神是创造主、人有神的形像、人堕落犯罪。持这些看法的福音派学者都强调：圣经不是用来回答现代科学问题的教科书，但它所说的关于神、人与世界的真理是确实的。"],["彼得的论证本身","","不论采哪一种创造观，彼得在 3:5–7 的论证都一样：讥诮的人说「万物与起初创造的时候仍是一样」，彼得指出世界并不是靠自己的稳定存在——它凭神的话而有，也曾因神的话而被审判，现在也凭着那话存留。δι᾽ ὧν（借着这些）把水与神的话放在一起：同样的水，在同一个话底下，可以是创造的材料，也可以是审判的工具。彼得的焦点是 λόγος——神的话，不是地质年代。"]],"con":[],"say":"本讲义的立场：讲台不以 3:5–7 裁判年轻地球或古老地球，也不在讲台上裁判其他创造观；本讲义并陈各家，并请会众留意三点共识：①天地是神凭他的话创造的，不是偶然（来 11:3）；②洪水是神真实的审判，也是神保守义人的见证（3:6；2:5）；③现在的世界凭神的话存留，不是证明神不会来，正是证明神的话还在托住它。与科学对话时，福音派信徒可以抱持谦卑：神的话与神的作为出自同一位神，暂时看起来不合的地方，常常是我们对经文或对自然的理解还不够。","care":"这个题目最常伤人的地方，不是答案，而是态度。有年轻人在大学读理工，因为在教会听到「接受古老地球就是不信圣经」而离开；也有长辈因为在小组被笑「还相信六日创造」而再也不开口。两种都是不必要的绊倒。牧者要让会众知道：在这个题目上，敬虔爱主、高举圣经的弟兄姐妹有不同的看法；我们可以热烈讨论，但不要把它变成信仰的分界线。对正在科学与信仰之间挣扎的学生，可以陪他读 3:5–7，指出彼得真正在乎的是：世界的稳定不是神缺席的证明。他可以继续认真地研究受造界，因为那正是在研究神的作为；而他的信心可以建立在那位凭话创造、也凭话托住万有的主身上。"},{"id":"ISS03_3","t":"3:8「一日如千年」——可以用来算末日或算创造的日子吗？","r":"3:8；诗 90:4","ch":[3],"why":"三、3:8「主看一日如千年，千年如一日。」这大概是全卷最常被拿来做数学的一节。有人用它来排列世界历史的时间表、推论主再来的年份；也有人用它来说明创世记的「日」可以是一千年，借此调和创造与科学。两种用法方向相反，却有一个共同点：都把这节经文当作一条换算公式。问题是：彼得引用诗篇第 90 篇，到底要说什么？这节经文可以拿来算日子吗？","pos":[["世界周说（本讲义不采）","","早期作品《巴拿巴书》15:4 等把创造的六日比作六段一千年的世界历史，第七段一千年是安息（常与千禧年连在一起）。历代都有人沿着这条路计算世界的年岁与主再来的时间；但这种换算不是本节的意思，历史上每一次照这样定出的日子都落空了。本讲义不用 3:8 算末日。"],["用 3:8 说明创造日的长度（本讲义不采作为证据）","","有些古老地球的支持者引用 3:8，说创世记的一日可以是很长的时期。创造日的长度本身是可以讨论的题目（见 ISS03_2），但 3:8 的上下文讲的是主再来的「慢」，不是创造日；用它作创造日长度的证据，同样是把比喻当成公式。本讲义不用 3:8 算创造的日子。"],["神超越时间（多数解经家，本讲义采用）","","摩西在诗 90:4 说：「在你看来，千年如已过的昨日，又如夜间的一更。」那是说人生短暂、神永恒。彼得引用时多加了一个方向：「一日如千年」。两个方向都说，正是为了取消换算——如果一日可以像千年，千年也可以像一日，就没有人能拿这节经文去定任何年份。ὡς 是「如」，是比喻，不是等号。重点是：神不被时间拖慢，也不被时间催促；他不会因为等了很久就忘记应许。"],["神的忍耐与效率","","有解经家指出两个方向各有一个安慰：「千年如一日」——对我们漫长的等候，在主看来并不长，他没有遗忘；「一日如千年」——主可以在一日之内成就人以为要千年的事，他不需要很多时间。这两个安慰都把人带到 3:9：主的慢不是无能，是宽容。"]],"con":[],"say":"本讲义的立场：3:8 不是换算公式，是一次换位。两个方向都说，正是取消换算；本讲义不用它算末日，也不用它算创造日（红线三；见 ISS00_4）。彼得不给我们一支新的钟表，他把我们带到「主那里」（παρὰ κυρίῳ）看时间——从人的观点换到神的观点，从暂时的观点换到永恒的观点。下一节立刻说明从那里看见的是什么：不是耽延，乃是宽容；而 3:10 又说那日子要像贼来到，贼不预告时间。","care":"华人教会里，不少弟兄姐妹曾经被末日时间表伤过：有人为了某一年辞职、卖房，日子过了，主没有来，信心也跟着垮了；也有人因此对一切讲末世的信息都起了戒心，连主再来的盼望都不敢提。牧者要对这两种人都有耐心。对前一种人，要说：错的是那张表，不是主的应许；彼得早就说了，这节经文本身就拒绝被当成尺。对后一种人，要说：不算日子，不等于不盼望；主一定会来，像贼一样，所以每一天都是预备的日子。把会众从「算」带到「等」，从「等」带到「活」：「你们为人该当怎样圣洁，怎样敬虔」（3:11）。"},{"id":"ISS03_4","t":"3:9「不愿有一人沉沦」——那为什么不是人人得救？","r":"3:9；3:7、15","ch":[3],"why":"四、3:9「其实不是耽延，乃是宽容你们，不愿有一人沉沦，乃愿人人都悔改。」如果神不愿有一人沉沦，为什么还有人沉沦？神的心意会落空吗？这节经文常被放到拣选的辩论里：一边用它证明神的救恩向所有人敞开、人可以拒绝；另一边指出「向你们」的上下文，认为它说的是神的选民。也有人更进一步，用它主张人人终必得救。一位为家人信主祷告多年的姐妹读到这里，会问：神既然不愿意他沉沦，为什么他到现在还不信？","pos":[["普世救恩的心意（阿米念／卫斯理传统）","","βούλομαι 表达神真实的心意：他愿意每一个人都悔改得救（又见提前 2:4「他愿意万人得救，明白真道」；结 33:11「我断不喜悦恶人死亡，惟喜悦恶人转离所行的道而活」）。神赐人真实回应的能力（先在恩典），人可以接受，也可以拒绝；所以不是人人得救，原因在人的拒绝，不在神不愿意。主为耶路撒冷哀哭「只是你们不愿意」（太 23:37）也被引为佐证。"],["限于选民的读法（改革宗一派，如欧文）","","本节说「宽容你们」（εἰς ὑμᾶς），对象是收信的信徒；「不愿有一人」「人人」最自然地限于「你们」之中——神延迟审判，是为了把他所有的子民都召齐，一个也不失落（约 6:39）。持此说的人强调救恩完全出于神主权的恩典（弗 1:4），神的旨意不会落空。"],["两种旨意的读法（改革宗另一派）","","分辨神「所喜悦的心意」与「主权的定旨」：神真实地不喜悦恶人死亡，他的邀请是真诚的；同时，他在主权中拣选、施恩。这两者如何协调，圣经没有完全说明，「隐秘的事是属耶和华我们神的」（申 29:29）。持此说的人既保留 3:9 的温度，也保留拣选的教义。"],["普救论（本讲义不采）","","主张人人终必得救，或在审判之后终必得救。这与同一段经文直接冲突：3:7 明说「不敬虔之人受审判遭沉沦」，ἀπώλεια（沉沦）与 3:9 的 ἀπόλλυμι 同一字族。彼得说神不愿意，不是说这件事不会发生；正因为审判是真的，神的宽容才显得宝贵。"]],"con":[],"say":"本讲义的立场：拣选与普世救恩的心意，各家并陈，本讲义不在此裁判系统。不论采哪一说，3:9 至少说出三件事：①神的心意是真实的——他不愿有人沉沦，他的邀请不是表演；②救恩完全出于神的恩典，人不能夸口；③这节经文在上下文里的工作，不是裁决拣选的系统，而是解释「为什么主还没来」：因为神在等人悔改。不要用系统冷却这节经文的温度，也不要用这节经文取消 3:7 的审判。3:15 说「以我们主长久忍耐为得救的因由」——主多等一天，就多一个人可以回头。","care":"这节经文最宝贵的用途，是给等候的人力气，不是给辩论的人弹药。对为家人祷告多年的弟兄姐妹，可以说：神比你更不愿意他沉沦；你在等，神也在等，而且神等得比你更久。还没有答案，不是神不在乎，正是他还在宽容。也要提醒：「宽容」不是让人继续拖延的理由——保罗说「他的恩慈是领你悔改」（罗 2:4）。对自己还没有回应的人，这节经文是邀请：主的慢，是为了你。小组若在拣选问题上起了争执，带领的人可以把大家带回这一句：不论我们怎样理解拣选，写这节经文的彼得，自己就是被主宽容等回来的人；我们都是。若有人因为亲人没有信主就过世而被这节刺痛，不要对他讲道理，先陪他难过；我们不替神断定任何亡者的去处，审判全地的主岂不行公义吗（创 18:25）？把他交在那位不愿有一人沉沦的主手里。"},{"id":"ISS03_5","t":"3:10「烧尽了」还是「显露出来」——异文怎样影响理解？","r":"3:10","ch":[3],"why":"五、3:10 最后一句，和合本作「地和其上的物都要烧尽了」。可是若打开较新的中英文译本或希腊文校勘本，会看到「都要被显露」「必被发现」，甚至「不被发现」。同一节经文，为什么会有几种完全不同的读法？这是新约里最难的异文之一，也是全卷最重要的一处。一位弟兄在查经时发现自己的圣经和别人的不一样，很容易慌：到底哪一个才是神的话？这会不会影响我们对末日与受造界的理解？","pos":[["κατακαήσεται「必烧尽」（和合本、钦定本所依）","","见证有亚历山大抄本（A）、048 及拜占庭多数抄本，是 Textus Receptus 与多数本的读法；和合本「烧尽了」、KJV「shall be burned up」都照这一读。优点：意思清楚，与 3:7、3:12 的火一致。缺点：见证多属较晚的抄本；正因为清楚，很可能是抄写者把难句改得容易明白。"],["εὑρεθήσεται「必被发现／被显露」（SBLGNT、WH 等）","","见证有西乃抄本（א）、梵蒂冈抄本（B）、K、P、1739 等最早、最好的抄本，又是「较难的读法」（lectio difficilior）——其他各读都容易解释成从它改出来的。SBLGNT 与 Westcott–Hort 采此读，许多新近中英文译本也跟从。意思有三种解：(a) 地和其上的工都要摊开在神的审判面前，无所隐藏；(b) 读作问句：「地……还会被找到吗？」；(c) 经过火炼之后被找着、存留下来。"],["οὐχ εὑρεθήσεται「必不被发现」（NA28／UBS5，ECM）","","见证主要是部分撒希地科普特文与叙利亚文译本，希腊文抄本几乎没有直接支持。ECM（大型校勘本）的编者认为加上否定词的读法最能解释其他各读的来源，因此 NA28 采用；意思接近「不复存在」。"],["其他读法","","C 抄本作 ἀφανισθήσονται（必消失）；最早的蒲草纸抄本 𝔓72 作 εὑρεθήσεται λυόμενα（必被发现已经解散）；Ψ 与部分拉丁文武加大译本略去这一句。另有学者提出各种推测校勘。这些读法显示：古代的抄写者也觉得这一句难，努力想把它说清楚。"]],"con":[],"say":"本讲义的立场：完整并陈各读；在 blk 采 SBLGNT 的 εὑρεθήσεται，取 (a)「在神的审判面前被显露」——这与林前 3:13「各人的工程必然显露……有火发现」一致，也与四节之后 3:14「安然见主」（原文「被他找到」）同一个动词，前后呼应。讲台用和合本「烧尽了」时，不说「和合本译错了」：和合本忠实地翻译了它所依据的抄本，这是抄本的异文，不是翻译的错误。最重要的是：不论哪一读，都不是「神要丢弃他所造的世界」；审判的焦点是「地和其上所作的工」要在神面前交账，结局是 3:13 的新天新地。","care":"第一次知道圣经有异文的人，常常会有被骗的感觉。牧者要先说清楚：新约的抄本数量与年代，远远胜过任何古代文献；绝大多数异文是拼字、字序的小差别，没有一处影响基督教的核心信仰。3:10 是少数真正难的地方，学者把它摊在桌上公开讨论，正说明教会不隐瞒。对会众，可以把这两读都变成生命的提醒：「烧尽了」提醒我们，地上的一切都会过去，不要把心放在会被烧掉的东西上；「被显露」提醒我们，那一日我们所作的一切都要摊开在主面前。两读合起来问的是同一个问题：那一天，主找到你的时候，你是什么样的人？"},{"id":"ISS03_6","t":"3:10–13 地球会被毁灭吗？基督徒要关心环境吗？","r":"3:10–13；3:6","ch":[3],"why":"六、3:10–12 有天「大有响声废去」、有形质的「被烈火销化」、地「烧尽了」。有人由此推论：既然地球最后要被烧掉，基督徒就不必花力气照顾环境，重要的只是传福音、救灵魂。另一方面，也有人把环境议题变成讲台上的政治立场，要求会众支持某一派的政策。这两种做法都牵动华人教会的实际生活。这一条沿用 ISS00_4，只补第 3 章逐节的那一笔：地球会被毁灭吗？基督徒要不要关心受造界？","pos":[["毁灭后另造","","主张旧天地将被完全消灭，神另造一个全新的天地；根据是 3:10 若读「烧尽」、3:12 的「销化」「镕化」，以及启 21:1「先前的天地已经过去了」。持此说的福音派信徒大多仍然认为应当照顾受造界——因为神在创造时就把管理的责任交给人（创 1:28；2:15），而不是因为受造界会存留。但也有人从此说推出「地球反正要烧，不必照顾」，这是错误的推论，不是此说本身必然的结论。"],["炼净更新","","主张神要炼净、更新这个受造界，而不是丢弃它。理由：3:13「新」καινός 多指品质上的新；3:6 的洪水类比——「当时的世界」消灭了，地却没有消失，挪亚走出方舟踏上的是同一块被洗过的地；罗 8:21「受造之物仍然指望脱离败坏的辖制，得享神儿女自由的荣耀」；徒 3:21「万物复兴的时候」；启 21:5「看哪，我将一切都更新了」。若 3:10 读「被显露」，更支持审判是鉴察与炼净，不是取消受造界。"],["管家职分的共识","","不论采哪一说，许多福音派传统都同意：「地和其中所充满的……都属耶和华」（诗 24:1）；人是管家，不是主人。照顾受造界是爱神（尊重他的作品）与爱邻舍（不让别人承受我们浪费的后果）的一部分，也是 3:11「你们为人该当怎样圣洁，怎样敬虔」在日常生活里的落实——怎样用钱、用资源、对待土地与动物。"],["政治动员的危险","","另一端的危险是把环境议题变成讲台上的政治阵营标签：支持某一政策才算属灵，反对就是不爱神。这会使教会分裂，也把福音窄化成一种政治立场。具体的政策（能源、税制、产业）牵涉许多专业判断，敬虔的基督徒可以有不同看法。"]],"con":[],"say":"本讲义的立场：沿用 ISS00_4。本章补三点：①本讲义倾向更新的读法，并陈另造的读法；但无论采哪一说，都推不出「地球反正要烧，现在不必照顾」——这不是经文的推论（红线六）；②3:13 的落点是「有义居在其中」，不是毁灭；盼望新天新地的人，今天就让义在生活里先住下来，包括对待神所造的世界；③讲台讲管家的原则，不把照顾受造界变成政治动员，不替会众决定具体政策的立场。","care":"这个题目在小组里常常变成两种尴尬：一种是有人说「反正要烧掉」，顺手把垃圾乱丢、把资源浪费当成小事；另一种是有人把环保变成衡量别人属灵的尺。牧者可以把焦点拉回 3:11：永恒的观点不是叫人离开世界，而是叫人在世界里活得不一样。具体的操练可以很小：不浪费食物、爱惜用品、带孩子认识神所造的花草、关心因环境破坏而受苦的穷人。也要提醒：照顾受造界不能取代传福音；传福音也不能成为糟蹋受造界的理由。两件事都是在等候主来的日子里，把义先活出来。"},{"id":"ISS03_7","t":"3:12「切切仰望」——人可以加速主的再来吗？","r":"3:11–12；3:9","ch":[3],"why":"七、3:12「切切仰望神的日子来到」，「切切仰望」原文 σπεύδοντας，许多现代译本译作「催促」「加速」。如果人可以加速主的再来，那么什么可以加速它？有人说是宣教，福音传遍天下末期就来到；有人说是教会的圣洁与合一；也有人把它和中东局势、某些宗教或政治工程连在一起，主张人可以「制造」主再来的条件，甚至据此推算日期，却没有先问这是不是经文的意思。问题是：彼得说的「催促」是什么意思？人真的能左右神的时间吗？","pos":[["热切渴慕（和合本「切切仰望」、KJV hasting unto）","","σπεύδω 可作「热切追求、急切盼望」，与前面的 προσδοκῶντας（等候、仰望）连用，描写信徒内心殷切的期盼。优点：避免让人误以为人能左右神的时间；缺点：σπεύδω 带直接受词时，通常的意思是「使某事加快」。"],["催促、加速（ESV、NRSV 等，多数现代解经家）","","按文法较自然的读法是「催促那日子」。彼得自己在圣殿廊下说过：「你们当悔改归正，使你们的罪得以涂抹，这样，那安舒的日子就必从主面前来到」（徒 3:19–20）；犹太传统也有「以色列若悔改，弥赛亚就来」的说法。上下文定了催促的方法：3:9 神在等人悔改，3:11 信徒该当圣洁敬虔。换句话说，悔改、圣洁、传福音，就是参与神等候的心意。"],["宣教完成论","","引太 24:14「这天国的福音要传遍天下，对万民作见证，然后末期才来到」，主张完成大使命就能促成主再来，因而以此激励宣教。宣教的热情是对的，与 3:9 也相合；但若把它变成「再传完多少族群就到了」的倒数，就又回到了计算——那日子仍然只有父知道（太 24:36；徒 1:7）。"],["制造条件论（本讲义不采）","","主张人可以透过某种宗教、政治或军事工程（例如推动特定的地缘政治事件）去「促成」预言应验、逼近主再来。这不是 3:12 的意思：彼得没有叫人去安排世界局势，他叫人「为人该当怎样圣洁，怎样敬虔」；而 3:10「主的日子要像贼来到」仍然管着 3:12。"]],"con":[],"say":"本讲义的立场：原文较支持「催促」，但上下文定了催促的方法——悔改、圣洁、敬虔、传福音；这是参与神的心意，不是掌握神的时间表。本讲义不用 3:12 推算日期，也不教人以任何政治、军事或宗教工程「制造」主再来的条件（红线三；见 ISS00_4）。等候不是坐在月台上看表，是活出那日子的样子：我们催促那日子的方法不是算它，是活它。","care":"「加速主再来」这句话可以点燃人，也可以烧伤人。被点燃的人，会更殷勤地传福音、更认真地追求圣洁，这是好的。被烧伤的人，会觉得主还没来是自己不够努力，背上一个永远完成不了的担子；或者被卷进某种时事解经的热潮，把每一则新闻都当成倒数。牧者要把两件事同时说清楚：我们真的能参与——主在等人悔改，你今天传的福音、你今天的悔改，都是主所看重的；但时间不在我们手里——那一日像贼来到，我们不必、也不能替主排日程。这样，等候的人既有动力，也有安息。"},{"id":"ISS03_8","t":"3:15–16 保罗的信是「经书」——新约正典怎样形成？","r":"3:15–16","ch":[3],"why":"八、3:16 说保罗「一切的信」被人强解，「如强解别的经书一样」。「别的经书」（τὰς λοιπὰς γραφάς）意味着保罗的信已经被放在「经书」之列——这是新约内部第一次把使徒书信与旧约圣经并列。这引出几个问题：保罗的信在使徒时代就被看作圣经了吗？新约二十七卷是怎样被收集、被承认的？是教会决定了正典，还是教会承认了正典？本条补 ISS00_8（彼得后书本身怎样成为正典），只处理 3:15–16 所引出的整体正典形成问题。","pos":[["使徒时代已视使徒书信为经书（多数福音派）","","γραφή 在新约一贯指圣经，λοιπάς（其余的）把保罗书信放进同一类；保罗也要求教会公开宣读并彼此传阅他的信（帖前 5:27；西 4:16），提前 5:18 更把路加福音的话（路 10:7）与申命记并列为「经上说」。可见使徒的著作从一开始就带着主的权柄被教会领受，正典的核心在使徒时代已经成形。"],["托名说的读法","","有学者认为「保罗一切的信」预设保罗书信已经被收集成册，因此本书应写于第一世纪末以后（见 ISS00_1、ISS00_7）。回应：彼得只说他所知道的「一切的信」，不必是完整的书信集；保罗书信在他生前就已在各教会流传互读。"],["教会决定正典（部分罗马天主教的表述）","","强调正典的界定是教会权柄的行动：经过大公会议（如迦太基会议 397 年、后来的天特会议）才正式确定书目，因此圣经的权威与教会的权威不可分。当代天主教神学也承认，教会不是在圣经之上，而是服事神的话；但在诠释上仍强调教会训导的角色。"],["教会承认正典（宗教改革传统）","","教会不是「制造」正典，而是在长期的使用与分辨中「承认」那些本来就带有使徒权柄的书卷，就像孩子认出母亲的声音，不是孩子使母亲成为母亲。早期教会分辨的准则大致有三：使徒性（出于使徒或与使徒密切相关）、正统性（与使徒所传的福音一致）、普遍性（被各地教会长期公认使用）。"]],"con":[],"say":"本讲义的立场：3:16 见证了新约正典在使徒时代已经开始成形——使徒的书信从一开始就被当作带着主权柄的话领受；四世纪的会议是承认，不是发明。彼得把保罗的信称为「经书」，同时称保罗为「我们所亲爱的兄弟」（3:15）：权柄与谦卑放在同一句里。这不是两位使徒的角力，是两个被同一位主宽容的人，站在同一个福音上（红线七）。彼得后书本身的正典历史，见 ISS00_8。","care":"一位在大学里第一次听说「新约是四世纪开会投票决定的」的年轻人，可能会觉得圣经只是教会政治的产物。牧者可以陪他看 3:15–16：在任何会议之前，使徒彼得就已经把保罗的信放在经书之列；正典的历史不是一场投票，而是一段长达几百年、各地教会不断在圣经里听见主声音的历史。也要让会众看见 3:15 的温度：被公开纠正过的彼得，没有因为那件事就贬低保罗的信，反而承认它有神所赐的智慧。这对今天的教会是很实际的功课——我们对待曾经批评过我们的弟兄，是否也能说「我们所亲爱的兄弟」？"},{"id":"ISS03_9","t":"3:16「难明白的」——读到看不懂的经文怎么办？","r":"3:16；1:20–21","ch":[3],"why":"九、3:16「信中有些难明白的，那无学问、不坚固的人强解，如强解别的经书一样，就自取沉沦。」连使徒彼得都承认保罗的信有些难懂。这句话常被用在两个相反的方向：有人说，既然难懂又可能「自取沉沦」，平信徒就不要自己乱读，交给专家；也有人说，我有圣灵，我怎么读都对，不需要任何人教。一位刚开始读罗马书、读到头痛的弟兄会问：读到看不懂的经文，我该怎么办？我是不是不该自己读？本条补 ISS00_3，处理 3:16 读经实务的那一笔。","pos":[["交给教导权威（强调教会训导的传统）","","认为圣经的正确解释属于教会的教导职分，个人的解释要服在教会的教导之下，以免各人照己意解经造成分裂与异端。今天的罗马天主教也鼓励信徒读经，但强调在教会的传统与训导中读。华人教会里，也有一些地方在实际上不鼓励会众自己读较难的书卷，怕他们读偏。这个立场的出发点是保护，但若推到极端，就成了主张平信徒不可自己读经——这不是 3:16 的意思。"],["个人直接解经（极端个人主义）","","认为每个信徒都有圣灵，个人读经所得的领受就是神的意思，不需要参考历代教会的理解或群体的分辨。出发点是看重个人与神的关系，但容易把「我觉得」当成「神说」，正落入 3:16 所说的「强解」：把经文绑起来，拉到自己要的长度。"],["圣经的清晰性（宗教改革传统）","","主张圣经中关乎得救所必须知道、相信、遵守的事，在圣经某处都已清楚说明，无论有学问或没有学问的人，只要适当地使用一般方法，都能充分明白（参威斯敏斯德信条 1.7）。这不是说每一处都一样清楚——彼得自己就说「有些难明白的」——而是说难的地方可以用清楚的地方来解释，圣经是自己最好的解释者。"],["群体中的谦卑读经（本讲义采用）","","3:16 出问题的不是「读的人」，是两种人：ἀμαθεῖς（不肯受教、没有学习的）与 ἀστήρικτοι（不坚固的）。解药因此不是「不要读」，而是：受教——在群体中读，听历代教会与教导者怎样理解；坚固——照上下文读，用清楚的经文解释难的经文；谦卑——承认自己的不懂，暂时放下，不强解。这正是庇哩亚人的样子：「甘心领受这道，天天考查圣经」（徒 17:11）。"]],"con":[],"say":"本讲义的立场：3:16 不是禁止会众自己读经的理由，更不是主张圣经只属于少数专家（红线八；见 ISS00_3）。读到难明白的经文，可以照四步：①先读上下文，问作者在这一段要解决什么问题；②用清楚的经文解释难的经文；③带到小组或请教牧者、查考可靠的注释，在群体中读；④仍然不懂的，就诚实地放着，不强解，先顺服已经明白的部分。彼得在同一处的命令不是「别读」，而是「在我们主救主耶稣基督的恩典和知识上有长进」（3:18）。","care":"很多弟兄姐妹不读经，不是不想读，是怕读错、怕读不懂。牧者要先把这个怕拿掉：连彼得都说保罗难懂，你读不懂一点也不奇怪。读不懂不是罪，强解才是危险；而强解的人，常常是不肯让别人看他怎么读的人。所以最好的保护是一个彼此读经的群体：小组长被问倒时可以说「我不知道，我们一起查」；教导的人也要愿意被会众用经文检验。对刚起步的人，可以建议从福音书与诗篇开始，配合讲义慢慢读到保罗书信；读到卡住的地方，记下来带到小组。读经的目的不是赢得辩论，而是在认识主上长进。"}],"terrain":{"points":[[1,88,0,"1:3 神的神能已将一切关乎生命和虔敬的事赐给我们","top"],[1,28,0,"1:9 就是眼瞎，只看见近处的","bot"],[1,44,0,"1:14 我脱离这帐棚的时候快到了",null],[1,94,0,"1:17–19 这是我的爱子……晨星在你们心里出现","top"],[2,16,0,"2:1 连买他们的主他们也不承认","bot"],[2,58,0,"2:5 只保护了传义道的挪亚一家八口",null],[2,82,0,"2:9 主知道搭救敬虔的人脱离试探","top"],[2,6,0,"2:22 狗所吐的，牠转过来又吃","bot"],[3,22,0,"3:4 主要降临的应许在哪里呢？","bot"],[3,86,0,"3:9 不愿有一人沉沦，乃愿人人都悔改",null],[3,95,0,"3:13 盼望新天新地，有义居在其中","top"],[3,98,0,"3:18 在恩典和知识上有长进。愿荣耀归给他","top"]]},"tracks":[{"gk":"ἐπίγνωσις","tr":"epignōsis","gl":"认识、知识（连同 γνῶσις、ἐπιγινώσκω、γινώσκω）","code":"G1922","root":"ἐπί（向着）＋ γινώσκω（知道）","stops":[["1:2","因你们认识神和我们主耶稣——认识是恩惠平安加给人的管道",""],["1:3","皆因我们认识那……召我们的主——一切赐下，都经过「认识他」","top"],["1:5–6","有了德行，又要加上知识——知识放在台阶中间，不是顶点",""],["1:8","在认识我们的主耶稣基督上不至于闲懒不结果子——认识要结果子",""],["1:16","将……大能和他降临的事告诉（γνωρίζω）你们——认识来自见证",""],["1:20","第一要紧的，该知道——圣经的来源",""],["2:20","因认识主救主耶稣基督，得以脱离世上的污秽——认识叫人脱离",""],["2:21","他们晓得义路，竟背弃了——知道了却转背：认识不等于长进","bot"],["3:3","第一要紧的，该知道在末世必有好讥诮的人——预先知道，才站得住",""],["3:17","你们既然预先知道这事，就当防备",""],["3:18","在……恩典和知识上有长进——知识与恩典并列，认识主是一生的长进","top"]],"ins":"全卷以「认识」开头（1:2），以「知识」收尾（3:18）。中间最痛的一站是 2:21：晓得义路的人转背了——知道不等于认识。彼得给的答案不是多知道一点，而是把知识放回恩典旁边：在恩典和知识上有长进。"},{"gk":"ὑπομιμνῄσκω","tr":"hypomimnēskō","gl":"提醒、记念（连同 ὑπόμνησις、μνήμη、μιμνῄσκομαι）↔ 忘记（λήθη、λανθάνω）","code":"G5279","root":"ὑπό（在下）＋ μιμνῄσκω（记得）","stops":[["1:9","忘了他旧日的罪已经得了洁净——全卷第一笔是「忘记」","bot"],["1:12","我却要将这些事常常提醒你们——知道了还要被提醒",""],["1:13","趁我还在这帐棚的时候提醒你们，激发你们",""],["1:15","使你们在我去世以后时常记念这些事——遗言就是留给人记得的","top"],["3:1","这两封都是提醒你们，激发你们诚实的心",""],["3:2","叫你们记念圣先知预先所说的话和主救主的命令",""],["3:5","他们故意忘记——讥诮出于选择性的遗忘","bot"],["3:8","有一件事你们不可忘记：主看一日如千年——要记得的是神不受时间限制","top"]],"ins":"彼得后书是一封「怕你忘记」的信。从 1:9 忘记自己被洁净，到 3:5 故意忘记神的话，遗忘是信仰的失血；而临终的使徒用尽最后的力气只做一件事：提醒。信仰长进的一半，是记得。"},{"gk":"δικαιοσύνη","tr":"dikaiosynē","gl":"义（连同 δίκαιος 义人）↔ 不义（ἄδικος、ἀδικία）","code":"G1343","root":"δίκη（公正、判决）","stops":[["1:1","因我们的神和救主耶稣基督之义——义先是基督给的","top"],["1:13","我以为应当（δίκαιον）——该做的事",""],["2:5","传义道的挪亚——在不敬虔的世代传义",""],["2:7","义人罗得——义不是完美",""],["2:8","他的义心就天天伤痛——义是还会伤痛的心",""],["2:9","把不义的人留在刑罚之下",""],["2:13","行的不义，就得了不义的工价","bot"],["2:15","巴兰……贪爱不义之工价","bot"],["2:21","他们晓得义路，竟背弃了",""],["3:13","新天新地，有义居在其中——义不再寄居，而是安家","top"]],"ins":"义在第一节是一份礼物（基督之义），在第二章是一颗会伤痛的心（罗得），在第三章最后是一位要搬进来长住的主人（有义居在其中）。现在的世界里，义是寄居的少数；将来，义是主人。"},{"gk":"φθορά","tr":"phthora","gl":"败坏（连同 ἀπώλεια 灭亡、ἀπόλλυμι 沉沦）↔ 救主、得救（σωτήρ、σωτηρία）","code":"G5356","root":"φθείρω（毁坏、腐烂）","stops":[["1:1","我们的神和救主耶稣基督——以「救主」开始","top"],["1:4","脱离世上从情欲来的败坏——神要救我们脱离的东西",""],["2:1","自取速速的灭亡","bot"],["2:3","他们的灭亡也必速速来到",""],["2:12","正在败坏人的时候，自己必遭遇败坏",""],["2:19","应许人得以自由，自己却作败坏的奴仆——假自由就是 1:4 的败坏","bot"],["3:7","不敬虔之人受审判遭沉沦的日子",""],["3:9","不愿有一人沉沦——同一个字，神说他不愿意","top"],["3:15","以我们主长久忍耐为得救的因由",""],["3:16","强解……就自取沉沦",""],["3:18","我们主救主耶稣基督——以「救主」结束","top"]],"ins":"全卷被「救主」框起来（1:1；3:18），中间是一条往下的败坏之路。转折在 3:9：所有走向沉沦的字，到这里碰到神的心意——「不愿有一人沉沦」。假师傅应许的自由，正是神要救我们脱离的败坏。"},{"gk":"στηρίζω","tr":"stērizō","gl":"坚固（连同 στηριγμός、ἀστήρικτος）＋ 殷勤（σπουδή、σπουδάζω）＋ 坚定（βέβαιος）","code":"G4741","root":"στῆριγξ（支柱）","stops":[["1:5","你们要分外地殷勤——回应神已赐下的一切",""],["1:10","应当更加殷勤，使……恩召和拣选坚定不移","top"],["1:12","在你们已有的真道上坚固——主给彼得的功课（路 22:32）","top"],["1:15","我要尽心竭力（σπουδάσω）",""],["1:19","更确（βεβαιότερον）的预言",""],["2:14","引诱那心不坚固的人","bot"],["3:14","就当殷勤，使自己没有玷污……安然见主",""],["3:16","无学问、不坚固的人强解","bot"],["3:17","就从自己坚固的地步上坠落——被坚固的人，自己也要防备",""]],"ins":"「你回头以后，要坚固你的弟兄」（路 22:32）——主交给彼得的这个字，框住了他最后一封信：开头说你们已经坚固（1:12），结尾说不要从坚固的地步上坠落（3:17）。中间两次「不坚固」，正是假师傅下手的地方。"}],"lesson":{"1":{"n":1,"t":"晨星在你们心里出现——帐棚、台阶、晨星","open":"一个人收拾行李、拆帐棚的晚上——彼得知道自己快走了，最想说的是什么？","secs":[{"h":"一、帐棚快拆了——一个人最后想说的话","ps":["弟兄姐妹平安。请你和我一起想像一个晚上。一个老人坐在一盏小油灯旁边，慢慢地收拾行李。东西不多：一件外衣，几卷抄好的经文，一封还没写完的信。他知道，过不了多久，就有人要来把他束上，带他到不愿意去的地方。他像一个旅人在拆帐棚：先把绳子松开，再把橛子拔起来，最后把那块用了一辈子的布折好。这个晚上，他只剩下一件事要做——把最想说的话写下来。这个人就是使徒彼得。今天我们要一起读他临终那封信的第一章。我先问大家一个问题：如果你知道自己的帐棚快要拆了，你最想对你所爱的人说什么？","彼得自己告诉我们他的处境。1:13–14：「我以为应当趁我还在这帐棚的时候提醒你们，激发你们；因为知道我脱离这帐棚的时候快到了，正如我们主耶稣基督所指示我的。」「正如我们主耶稣基督所指示我的」，指的是三十多年前加利利海边那个早晨。主告诉他，年老的时候别人要把他束上，带他到不愿意去的地方；约翰还补了一句，这话是指着彼得要怎样死，荣耀神（约 21:18–19）。三十多年来，彼得一直知道自己会怎样死。现在，那一天近了。","「帐棚」这个字，彼得一生忘不了。在登山变像的山上，他看见主的荣光，脱口而出：「主啊，我们在这里真好！你若愿意，我就在这里搭三座棚，一座为你，一座为摩西，一座为以利亚。」（太 17:4）那一天他想把荣耀留在山上，关进帐棚里。几十年后，他称自己的身体为帐棚，而这帐棚快要拆了。1:15 他说「我去世以后」，「去世」原文是 ἔξοδος，就是「出埃及」的那个字。路加记载，那天在山上，摩西和以利亚与主谈论的，正是他「去世」的事（路 9:31），用的也是这个字。年轻的彼得想把荣耀留在帐棚里；年老的彼得知道，帐棚是要拆的，荣耀是要等的。死亡不是结束，是一次出埃及。","可是请留意，这封信的主角不是彼得。他开头写「西门彼得」，用的是主在海边叫他的那个本名；先写「仆人」，后写「使徒」。他提起山上的荣光，却一个字也没提自己那天说错的话。他提起主的指示，不是要我们佩服他多勇敢地面对死亡，而是要我们看见：主早就把结局告诉他，又陪他走了三十年。一个曾经三次不认主的人，被主叫回来、被主坚固，现在要用最后的力气去坚固别人。不是彼得多伟大，是主多恒久忍耐。","那么他最想说的是什么？整封信三章，可以浓缩成三件事：要长进、要分辨、要等候。第一章讲的是长进。今天我们用三个词走这一章：帐棚、台阶、晨星。帐棚提醒我们人生是暂时的；台阶告诉我们在暂时的人生里要怎样长；晨星告诉我们，在天亮以前，我们靠什么走路。"]},{"h":"二、神已将一切赐给我们——长进的起点","ps":["一个临终的人写遗言，照常理应该是一连串叮咛：要这样，不要那样。可是彼得在第一句叮咛之前，先写了一句直述句。1:3：「神的神能已将一切关乎生命和虔敬的事赐给我们，皆因我们认识那用自己荣耀和美德召我们的主。」「已将……赐给」原文是完成式：不是将要给，不是看你表现再给，是已经给了，而且现在还在你手上。给了多少？一切。范围是「关乎生命和虔敬的事」——里面的生命，向神的生活。","这一切怎么送到我们手上？「皆因我们认识」那召我们的主。神不是寄一个包裹给我们就走了；他把自己给了我们，一切都在认识他里面。很多基督徒把信仰活成一种缺乏：我还差一次聚会、一次特会、一次经历，才算够。彼得说，你缺的不是更多的供应，是更深地认识那一位已经供应一切的主。","接着是全章、甚至全卷神学最高的一句。1:4：「因此，他已将又宝贵又极大的应许赐给我们，叫我们既脱离世上从情欲来的败坏，就得与神的性情有分。」「极大」原文是最高级，新约只有这里用这个形式；一个说话直率的渔夫，到这里找不到更大的字了。「有分」原文 κοινωνός，彼得很熟——多年前在革尼撒勒湖边，雅各和约翰是「西门的伙伴」（路 5:10），同一个字。那时有分的是一条船、一网鱼；如今主说，你要有分的，是我的生命。","这一句要诚实地画线，因为它很容易讲偏，也很容易被跳过。历代教会有几种读法：东正教讲「成神论」，他们小心分开神的「本质」与神的「能力」，说人借恩典有分于神的能力，却永远是受造者；改革宗讲与基督联合；卫斯理传统讲完全的爱；许多福音派注释讲道德的相似。本讲义采的是：在基督里与基督联合，有分于神的生命与品格。三条界线要记住：第一，创造者与受造者的分别永远存在，人不会变成另一位神，也不与神的本质混同；第二，有分是恩典，不是修炼，是「他已将又宝贵又极大的应许赐给我们」；第三，有分的内容彼得自己写在下文——脱离败坏，然后是德行、知识、节制、忍耐、虔敬、爱弟兄、爱众人。","所以次序绝对不能颠倒：先是神的完成式，才有我们的命令式。长进不是爬上去见神，是神已经下来把一切赐给我们，我们才在其中长大。"]},{"h":"三、原文亮光：慷慨供应、眯着眼睛、带光的星","ps":["这一章有好几个新约只出现一次的字。今天我们只拿三个字来看，每一个字都要在半分钟之内变成生命。","第一个字是 ἐπιχορηγέω，1:5 的「加上」。古希腊城邦办戏剧节，要有一个人出钱供应合唱团的服装、训练与演出，这个人叫 χορηγός。那是一份荣誉，大家比的是谁供应得大方。彼得说：在你的信心里，大方地供应出德行来。不是勉强凑数，是慷慨。更美的是，同一个字在 1:11 又出现，换成被动式：「必叫你们丰丰富富地得以进入」——「得以进入」就是「被供应进入」。你在这里大方地供应德行；神在那里更大方地供应你进国的门。先有神的大方，才有我们的大方。","第二个字是 μυωπάζω，1:9 的「只看见近处的」。新约只用这一次，英文 myopia，近视，就从这里来。字根是「眯眼」。不是天生看不见，是自己把眼睛眯起来，只盯着眼前那一点。眼前的那一点是什么？这个月的帐单、孩子的成绩、别人的一句话。看不见的远处是什么？1:11「永远的国」。病根写在下半句：「忘了他旧日的罪已经得了洁净」。这个人忘记的不是规条，是恩典。一个忘了自己被赦免多少的人，就长不出忍耐和爱。治这种近视的方法很温柔：不是更用力，是想起来。","第三个字是 φωσφόρος，1:19 的「晨星」，字面是「带光的」，新约也只有这一次。1:19 说：「我们并有先知更确的预言，如同灯照在暗处。你们在这预言上留意，直等到天发亮，晨星在你们心里出现的时候，才是好的。」「暗处」原文是又干又脏的地方——就是我们所住的世界。灯不是太阳，它不会把全世界照亮，只照亮你脚前的一步；可是天亮以前，灯就是你最可靠的光。天亮，是主再来的那个早晨；晨星，是他自己——主说：「我是明亮的晨星。」（启 22:16）那时灯可以放下，因为光本人来了；而在那以前，同一位主已经在信他的人心里点起亮光。","三个字放在一起，就是这一课：神先大方，所以我们大方地长；别眯着眼只看近处；在灯下留意，直到晨星出现。"]},{"h":"四、八个台阶，走到爱众人","ps":["现在来看那八个台阶。1:5–7：「正因这缘故，你们要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知识；有了知识，又要加上节制；有了节制，又要加上忍耐；有了忍耐，又要加上虔敬；有了虔敬，又要加上爱弟兄的心；有了爱弟兄的心，又要加上爱众人的心。」","先看开头四个字：「正因这缘故」。因为神已经给了一切，所以你们要分外殷勤。恩典不叫人闲懒，恩典叫人起身。再看介系词：原文不是「在信心上面」，是「在信心里面」。德行从信心里长出来，知识从德行里长出来——像一棵树，不是一道楼梯。所以这不是八道关卡，要你一关一关打怪升级。起点与终点是确定的：起点是信心，那是神分给你的（1:1）；终点是爱，那是神的性情最完整的样子。中间是互相扶持的品格。","请注意，知识只在第二级。认识主若停在脑子里，就长不出节制与忍耐。最后两级都是爱人：先爱弟兄，再爱众人。品格的顶点不是一个人多属灵，是他多能爱。1:8 说，这些若在你们里面，而且不断增多，认识主就不至于闲懒不结果子。","讲到这里，熟悉321的弟兄姐妹可能会想到「改变观念八大步骤」：信息、启示、信服、实践、检讨、修正、反覆、繁殖。同样是八项，但我要明说：两者是两回事。彼得的八项是品格的果子，321的八步是观念改变的过程。不可以说彼得也有八大步骤，也不要把经文当成321的插图。先让经文讲完自己的话。","1:10–11 给这一段一个应许：「所以弟兄们，应当更加殷勤，使你们所蒙的恩召和拣选坚定不移。你们若行这几样，就永不失脚。这样，必叫你们丰丰富富地得以进入我们主救主耶稣基督永远的国。」「坚定不移」是当时契约上「确实有效」的字：源头在神，确据在生命。写「永不失脚」的人，曾经在水面上往下沉，「耶稣赶紧伸手拉住他」（太 14:31）。他知道失脚是什么滋味，也知道是谁把他拉起来。今天你的信心里最缺哪一项的供应？别急着一次补齐八项；在信心里大方地供应一项，那一位已经供应你一切的主，会在你里面供应下一项。"]},{"h":"五、几个必须认得的偏差","ps":["第一个偏差，是把 1:4 讲成人成神。有人说「与神的性情有分」，就是人可以修到跟神一样。这不是彼得的意思。创造者与受造者的分别永远存在；连东正教讲成神论，也小心分开神的本质与能力。321说「无己不是没有，乃是进入无限」，在这一节只能说成：进入与无限之神的相交，基督在我里面活着（加 2:20），不是人变成无限。界线守住了，这句话才是福音，不是自我膨胀。","第二个偏差，是因为怕讲错，就干脆跳过 1:4。有些讲台读到这一节就快快带过。可是彼得用了他找得到最大的字来写它，我们没有权利省略。跳过 1:4，信仰就只剩下规条和努力；讲明 1:4，我们才知道，神给我们的不只是一套道德，是他自己的生命。不要因为有人讲过头，就连真理也不敢讲。","第三个偏差，是把长进当成靠自己爬。把 1:5–7 抽出来，挂在墙上当作晋级表，每天量自己爬到第几级。这样读，会让人要不骄傲、要不绝望。彼得在清单前面放了「正因这缘故」——先有神已经给的一切，才有我们的殷勤。长进是在恩典里长大，不是靠自己的力气爬上天。","第四个偏差，是把属灵经历放在圣经之上，或者反过来贬低经历。有人说「我有异象、有感动，比圣经更直接」；也有人说「经历都靠不住，只要教义」。彼得两边都不站。他有过山上的经历，而且很珍惜；但他说「我们并有先知更确的预言」——经历证实了圣经，圣经解释了经历。经历要放在圣经的灯下检验，不可拿来取代那盏灯，也不必因此看轻神在你身上真实做过的事。","第五个偏差，是用 1:20 禁止自己读经。有人说：「经上所有的预言没有可随私意解说的，所以你不要自己读，会读错。」可是 1:21 用「因为」接下去，说明的是预言的来源：不是先知自己想出来的，是人被圣灵感动，说出神的话来。这节不是叫信徒别碰圣经。读经的保护不是把圣经锁起来，是在群体中读、照上下文读、谦卑地读。"]},{"h":"六、两个华人处境的真实问题","ps":["第一个问题：信主多年，却越来越「近视」，眼里只有升学和房贷，怎么办？很多华人家庭的弟兄姐妹，不是不爱主，是太忙。孩子要补习、要考试；房贷要缴三十年；父母年纪大了要照顾。日子一久，眼睛就只看见近处的。彼得没有说这些事不重要，他是说：不要忘了你旧日的罪已经得了洁净，不要忘了前面有永远的国。做法可以很小：每天早上先用五分钟读一段经文，再打开手机看行程；每周一次和家人说一件主怎样看顾你们的事。眼睛常常往远处看一眼，近处的事反而摆得对。不是不顾帐单，是在帐单之上，还有一位主。","第二个问题：家里的长辈说「读经交给牧师就好，你自己读会读偏」，该怎么回应？这句话常常出于好意，长辈见过有人断章取义、走偏了路。我们先要尊重这份担心。但 1:20 不是禁止读经的经文；1:19 反而说「你们在这预言上留意……才是好的」——留意的是「你们」，每一个信徒。可以温柔地回应：「您说得对，我不要凭私意读。所以我跟小组一起读，照上下文读，不明白的就请教牧者。」牧者的责任是帮助会众读，不是代替会众读。灯是给每一个人拿在手上的。"]},{"h":"七、活出321——在灯下一步一步长","ps":["先说三个基础。耶稣是我的榜样：彼得在山上看见的，是父说「这是我的爱子，我所喜悦的」那一位；1:3 说他用自己的「美德」召我们，而 1:5 的「德行」正是同一个字——他身上有的，他召我们加上。圣经是我的准则：1:19 说，天亮以前，先知的话是照在暗处的灯；准则不是棍子，是灯。圣灵是我的引导：1:21 说人是「被圣灵感动」说出神的话，原文像帆船被风推着走；那一位带着先知说话的圣灵，今天也带着我们读，带着我们长。","再说两个核心。让耶稣作王：1:11 说那国是「我们主救主耶稣基督永远的国」，连进国的门也是他亲手打开的；1:1 更直称他为「我们的神和救主耶稣基督」。让耶稣得着一切的荣耀：彼得写帐棚、写圣山，却没有写自己的功劳；他记得的不是自己说了什么，而是父对子说的那一句。这封信的最后一句，就是「愿荣耀归给他」。","最后是一个目的。建立属神的体系：一个帐棚快拆的人，最后的殷勤是「使你们在我去世以后时常记念这些事」。他不是在建立自己的名声，是在一代一代人的心里建立对主的记念。这就是920：临终的人还在激发他的「2」。八个台阶的终点是爱众人，属神的体系就是这样，从一个人的品格，长到一群人的彼此相爱。"]},{"h":"八、四种心，同一盏灯","ps":["骄傲型的心说：「这些我都知道了。」彼得却说：「你们虽然晓得这些事……我却要将这些事常常提醒你们。」知道不等于长进；肯被提醒，就是谦卑的开始。","恐惧型的心说：「我怕自己有一天会跌倒、会失落。」彼得说：「你们若行这几样，就永不失脚。」写这句话的人曾经往下沉，是主伸手拉住他。你的确据不在你抓得多紧，在他拉得多牢。","羞耻型的心说：「我过去那么糟，怎么配谈长进？」1:9 说，不长进的病根是「忘了他旧日的罪已经得了洁净」。不是忘了自己多糟，是忘了已经被洗净。彼得在信的开头写上主在海边叫他的本名——那个被接回来的名字，也是你的。","受伤型的心说：「我在教会被人用圣经压过，被当成次等的信徒。」1:1 说你和使徒「同得一样宝贵信心」，教会里没有二等信徒。灯是用来照路的，不是用来打人的；愿主亲自医治那些被灯砸伤的人。"]},{"h":"九、这一周，你可以做的几件事","ps":["第一，每天早上先用五分钟读彼得后书第一章的一小段，读完问一句：主今天已经赐给我什么？然后才打开手机。第二，从 1:5–7 选一项你最缺的品格，写在一张卡片上，这一周在一件具体的事上大方地供应它。第三，做一次「眼科检查」：写下这一周最占据你心思的一件近处的事，再把 1:11「永远的国」写在它旁边。第四，找一位你的「2」，传一段 1:19 给他，告诉他你为什么需要这盏灯。第五，这一周和小组或家人一起读一段圣经，照上下文读，彼此问：「这段经文原来在说什么？」","请大家一起说出四句话。我宣告：神的神能已将一切关乎生命和虔敬的事赐给我，我不再活在缺乏里。我宣告：我在信心里大方地供应，靠主的恩典一步一步长到爱众人。我宣告：我不眯着眼只看近处，我记得我旧日的罪已经得了洁净。我宣告：天亮以前，主的话是我脚前的灯，直到晨星在我心里出现。"]},{"h":"十、结语","ps":["让我们回到那个收拾行李的晚上。油灯快要烧尽，老彼得把信折好。他不知道这封信会被读上两千年；他只知道，帐棚要拆了，主要他坚固弟兄。他留给我们的不是自己的故事，而是三句话：神已经给了一切，所以要加上；天还没亮，所以要留意那盏灯；晨星一定会出现，所以不要放下。","弟兄姐妹，这一课的焦点不在彼得，也不在我们爬到了第几级，而在那一位用自己荣耀和美德召我们的主。帐棚会拆，台阶会走得慢，但晨星一定出现。让我们一起祷告。","亲爱的天父，谢谢你借你的神能，已将一切关乎生命和虔敬的事赐给我们。求你医治我们的近视，叫我们想起自己已经被洁净；求你帮助我们在信心里大方地供应，一步一步长到爱众人；求你叫我们在暗处留意你的话，直等到天发亮，晨星在我们心里出现。愿荣耀归给主耶稣，从今直到永远。我们这样祷告，是奉主耶稣基督的名祷告，阿们。"]},{"h":"十一、小组讨论分享：三个化","ps":["接下来进入小组，用三个化把今天这盏灯拿在手上。"]}],"deep":[{"sec":0,"q":"彼得后书真的是彼得写的吗？为什么有人怀疑？","a":"早期教会接受这卷书比较慢，俄利根、优西比乌都提到有人存疑；它的希腊文风和彼得前书很不一样，第二章又和犹大书大段相似，所以近代不少学者主张是彼得的门徒托他的名写成。支持彼得是作者的一方则指出：信中自称西门彼得，亲眼见过登山变像，提到主预告他的死；文风的差异，可能与经手的人不同有关——彼得前书提到托西拉转交（彼前 5:12），西拉或许也参与执笔，这一封则没有提到。本讲义采使徒彼得为作者，同时并陈托名说，不回避早期教会的讨论。对信心来说，这卷书历代被教会承认在正典里；不论学者怎样讨论作者，我们信靠的不是写信人的名声，而是信中所见证的那一位主。"},{"sec":1,"q":"「与神的性情有分」会不会让人以为自己可以修成神？","a":"会，所以要讲清楚，但不要因此不讲。彼得用的「性情」不是哲学上讲本体的那个字，而且他自己马上定义了内容：脱离世上的败坏，加上德行、知识、节制、忍耐、虔敬、爱弟兄、爱众人。换句话说，神的性情落在人身上，长出来的是品格，不是神的权柄。东正教讲成神论，也特意分开神的本质与能力，正是为了不让人以为受造者会与神混同。所以可以记三句话：分别永存——你永远是被造的，他永远是神；有分是恩典——是他把应许赐给你，不是你修出来的；内容是爱——越有分于他，越能爱人。一个人若因为这节经文变得高傲，就说明他还没有真正有分，因为神的性情最像的样子，是十字架上的舍己。"},{"sec":2,"q":"「更确的预言」是不是说属灵经历都不可靠？","a":"不是。彼得自己有过一生最强烈的属灵经历：在山上看见主的荣光，听见天上的声音。他没有看轻这经历，反而用它作见证。他说「我们并有先知更确的预言」，意思是：山上的经历，正好叫旧约的预言更确定了；而你们没有上过那座山，却同样手里有这更确的话。经历证实圣经，圣经解释经历。实际的分辨很简单：你的感动、梦境、经历，放在圣经的上下文里，是帮助你更爱主、更像主，还是让你越来越以自己为中心？前者可以感恩，后者要回到灯下重新检验。经历是会过去的闪光，圣经是天亮以前一直在手里的灯。如果你从来没有特别的经历，也不必羡慕别人；收信的人也没有上过那座山，彼得却说他们的信心和使徒一样宝贵。"},{"sec":3,"q":"八个台阶一定要一级一级照次序爬完吗？","a":"不必这样读。原文的介系词是「在……里面」，德行是在信心里供应出来的，知识是在德行里供应出来的，所以它比较像一棵树同时长出许多枝子，而不是一道要先踩稳第一级才能踩第二级的楼梯。古代修辞常用这种一层接一层的句型，起点与终点是刻意安排的：起点是神分给你的信心，终点是爱。中间的品格彼此扶持，节制帮助忍耐，忍耐成全爱弟兄。实际上，你可能在忍耐上很弱，在爱弟兄上却已经长了一些；这很正常。这周只要选一项，在一件具体的事上大方地供应它，就是在长进。也不要拿这张清单去量别人，说某人还停在第几级；它是给我们照自己的镜子，不是给我们评分别人的尺。"},{"sec":3,"q":"1:10 说要使恩召和拣选坚定，难道拣选要靠我自己撑住？","a":"这是全章最容易让人不安的一节。各家读法不同：改革宗多说，拣选本身不会动摇，「使之坚定」是让它在你的生命和见证中变得确实；阿米念传统则强调人的回应真实地参与在保守之中。从字来看，「坚定不移」是当时契约上「确实有效」的用语，动词又是「为你们自己」的语态，对象是你的确据，不是在神那边补上什么。所以本讲义的理解是：源头在神，确据在生命。品格不是买门票，是让蒙召的人自己看见、也让别人看见：这呼召是真的。紧接着的应许是「就永不失脚」，用的是希腊文最强的否定。写这话的人曾经跌得很重，是主拉住了他。"},{"sec":4,"q":"1:20 说没有可随私意解说的，那我自己读经会不会读错？","a":"有可能读错，但答案不是不读，而是好好读。1:20 的重点是预言的来源：先知没有照自己的意思去解开他看见的，因为 1:21 说预言是人被圣灵感动说出来的。既然经文不是出于人意，读的人也不可以照私意扭曲它，第三章就警告有人「强解」。保护有三个：第一，在群体中读，跟小组、跟牧者一起读，不是一个人关起门来发明新意思；第二，照上下文读，先问这段在原来的信里说什么，再问今天怎样应用；第三，谦卑地读，读不懂的地方先放着，求圣灵光照，也请教别人。这样读，你会读得越来越准。"},{"sec":6,"q":"1:1「我们的神和救主耶稣基督」是指一位还是两位？","a":"原文是一个冠词统管「神」和「救主」两个名词，中间用「和」连起来；按照这种希腊文句型，两个称号通常指同一位，就是「我们的神，也是救主，就是耶稣基督」。也有人读成两位：神指父，救主指子，理由是紧接的 1:2 就把神与主耶稣分开，少数抄本这里也作「主」。但本卷自己提供了最好的证据：1:11、2:20、3:18 都用同一句型说「我们主救主耶稣基督」，没有人把那三处读成两位。所以本讲义读作一位：这是新约直称耶稣为神的经文之一。这对生活很实际——让耶稣作王，不是请一位好老师坐上宝座，而是承认他本来就是神。"},{"sec":8,"q":"我想提醒一位弟兄姐妹，却怕人家嫌我啰嗦，该怎么开口？","a":"彼得也重复，而且说得很坦白：「你们虽然晓得这些事……我却要将这些事常常提醒你们。」爱人的人不怕重复，但提醒的方式要温柔。第一，先分享自己，不先指出对方：「这周这节经文提醒了我……」，对方比较容易听。第二，提醒恩典，不只提醒责任：彼得先说神已经给了一切，才说要加上。第三，短而具体：传一节经文，加一句你的祷告，不要写长篇。第四，持续而不催逼：一周一次，比一次说十句有用。最后，记得提醒你的「2」之前，先求主提醒你自己。如果对方一时听不进去，也不必灰心；彼得说他要「常常」提醒，有些种子要过很久才发芽，而叫它生长的是神。"}],"hua":[{"h":"第一化：内化（约20分钟）","aim":"※ 目的：把今天的经文放进心里，说得出第一章帐棚、台阶、晨星三个画面。","note":"※ 带领提醒：先让每个人说，不急着纠正；每人约一分钟，安静的组员可以只说一句。第四题若有人提到已经离世或关系破裂的人，温柔接住，不追问细节。","qs":[{"n":1,"lv":"★","q":"帐棚、台阶、晨星，哪一个词最打动你？用一句话说出原因。"},{"n":2,"lv":"★★","q":"1:3 说神「已将一切」赐给我们。说一件你其实已经有、却一直觉得不够的事。"},{"n":3,"lv":"★★","q":"1:5–7 的八项品格里，你最缺的是哪一项？最近在什么场合最明显？"},{"n":4,"lv":"★★★","q":"如果你知道自己的帐棚下个月就要拆了，你最想对哪一个人说哪一句话？说出他的名字。"}]},{"h":"第二化：消化（约35分钟·主轴）","aim":"※ 目的：从看见自己走到走一步，让 1:9 的近视被 1:19 的灯照到。","note":"※ 带领提醒：若分享触及过去的伤害或长期的无望感，不追问细节、不要求当场原谅任何人；会后单独关心，必要时协助寻求专业协助。","qs":[{"n":5,"lv":"★★","q":"【看】看见自己：这一周最占据你眼睛的「近处」是什么？升学、房贷、工作，还是一个人？"},{"n":6,"lv":"★★","q":"【听】听神说话：一起读 1:9 与 1:11，主借这两节对你说的是哪一句？"},{"n":7,"lv":"★★★","q":"【想】想通关卡：是什么让你「忘了他旧日的罪已经得了洁净」？是忙碌、羞耻，还是觉得自己不够好？"},{"n":8,"lv":"★★","q":"【讲】说出口：转向身边一位组员说：「主已经洁净了我，这周我要……」"},{"n":9,"lv":"★★★","q":"【行】走一步：这周哪一天、什么时间、在哪一件具体的事上，你要供应一项品格？当场说出来。"}]},{"h":"第三化：转化（约25分钟）","aim":"※ 目的：把灯传出去，由内而外改变关系与事工。","note":"※ 带领提醒：鼓励当场说出名字与时间；一时想不出对象的，不要勉强，请他会后与带领者再谈。","qs":[{"n":10,"lv":"★★","q":"1:12 彼得说「常常提醒」。谁曾经一再提醒你、坚固你？这周你要怎样谢谢他？"},{"n":11,"lv":"★★★","q":"920 操练：找出你的那一个「2」，这周向他分享 1:19 的灯与晨星。当场说出他的名字，和你哪一天联络他。"},{"n":12,"lv":"★★","q":"这周你要和谁一起照上下文读一段圣经？订好时间与地点。"},{"n":13,"lv":"★★","q":"1:7 的终点是爱众人。说出一位教会外、不太好爱的人，和这周你可以为他做的一件小事。"},{"n":14,"lv":"★★★","q":"【必做】用三句话把这一课讲给一位教会外的朋友听：神已经给了一切；所以我在爱里长；天亮以前我靠他的话走路。说出这位朋友的名字。"}]},{"h":"收尾（5分钟）","ps":["全组一起读 1:19，带领者为每一位的「2」和这周要走的一步祷告。散会前彼此提醒：天还没亮，灯在手里，晨星一定出现。"]}]},"2":{"n":2,"t":"主知道搭救——干井、罗得、回头","open":"一口在旱季里被人指路去打水、走到跟前却是干的井：渴的人最受伤；从干井转向 2:9「主知道搭救」。","secs":[{"h":"一、干井会从里面冒出来（2:1–3）","ps":["弟兄姐妹平安。请你想像一个画面：旱季，村子里的水缸都见底了，一位母亲背着空桶，听人指点说：「山后面那口井有水，大家都去那里打。」她走了两个钟头的山路，到了井边，探头一看，井底是干裂的石头。最受伤的是谁？不是不渴的人，是最渴的人。她把最后的力气都花在那条路上了。彼得后书第 2 章，就是一位老牧人为口渴的羊写的一章。他说：「这些人是无水的井。」（2:17）今天我们不是来找谁是干井，是来学怎样认出水、怎样回到活水的源头。","彼得一开口就说：「将来在你们中间也必有假师傅。」危险不是从城外攻进来，是「在你们中间」长出来。「私自引进」的意思，是在真道旁边悄悄夹带；所以假师傅很少自称是假的，他们说很多对的话，只在最要紧的地方换掉一样东西。换掉的是什么？「连买他们的主他们也不承认。」那个「主」是在市场上付了价、有产权的主人。基督用自己的血把我们买回来，他们却用生活说：我不属于谁。","这里有一个字要停下来。「不承认」原文 ἀρνέομαι，正是大祭司院子里彼得三次不认主的那个字。写这句话的人，自己不承认过主。他和假师傅的分别，不是他从来没有跌倒，而是主转过身来看他，他出去痛哭，后来在海边被主接了回来。所以这一章不是一位完美的人居高临下地定罪，是一个被拉回来的人，看见别人正往悬崖走时的大声呼喊。我们读这一章，也要用同样的口气读——先照自己，再分辨别人。这一章最难的功课，是怎样讲假师傅，而自己不变成法利赛人。","2:2 还有一句常被跳过的话：「将有许多人随从他们邪淫的行为，便叫真道因他们被毁谤。」假师傅的危险，在于他们常常很成功，跟的人很多。结果受伤的不只是跟从的人，还有「真道」本身。外面的人分不出谁真谁假，只看见一群自称跟从耶稣的人放纵、贪财，骂的就是这条路。所以分辨不只是为了保护自己，也是为了保护主的名。一间教会最好的见证，不是说别人错，是自己在金钱和生活上经得起看。","2:3 用三个词说出干井的动机和方法：「贪心」、「捏造的言语」、「取利」。「捏造」是陶匠捏泥的字，照听众想听的形状捏；「取利」是做买卖。最刺眼的是受词：「在你们身上」。在这种讲道里，羊不是被牧养，是被当成货。但彼得接着说：「他们的刑罚，自古以来并不迟延；他们的灭亡也必速速来到。」原文是审判没有闲着、没有打盹。看见干井风生水起，不要以为神睡着了。这也是第 3 章「主不是耽延」的伏笔：神一直醒着，只是他在等。"]},{"h":"二、三个审判，两个搭救（2:4–9）","ps":["2:4 到 2:9 在原文是一个很长的句子，开头是「若」，结尾才说「那么」。若神没有宽容犯罪的天使；若神没有宽容上古的世代，却保护了传义道的挪亚一家八口；若神倾覆所多玛、蛾摩拉，却搭救了义人罗得——那么，「主知道搭救敬虔的人脱离试探，把不义的人留在刑罚之下，等候审判的日子」。三个审判里，藏着两个搭救。这一长句的终点不是火，是一只伸出来的手。这就是全章、甚至全卷的枢纽。","先看第一个例子：连天使都没有被放过。天使比人更有能力、更靠近神，但离开本位，就被交在黑暗中等候审判。彼得这样开头，是回应读者心里的疑问：假师傅那么有恩赐、有魅力、有影响力，神会管吗？他说，比他们更有能力的，神都没有放过。审判不看身分、不看恩赐、不看人数。至于天使怎样犯罪、地狱在哪里，这些可以在书房里谨慎研究，彼得没有展开，我们也不必把今天变成天使学讲座。","挪亚是「传义道的」，原文是传令官。一个世代没有人回应他，用今天的数字看，他是很失败的传道人；但神亲自看守他。罗得更叫人皱眉：他选了所多玛，危急时迟延不走，天使要拉着他的手才出城。彼得怎么一连三次称他「义人」？答案在 2:8：「他的义心就天天伤痛。」他没有能力改变那座城，也没有勇气离开，但他的心还没有麻木。义不是完美，是一颗还会痛的心。而且他蒙救不是因为他够好，「搭救」的主词是神。","「主知道」是懂得怎样。他拉挪亚用一条船，拉罗得用两位天使的手；方法不同，但他都懂。「脱离试探」是从试炼里面拉出来，不是保证你不进洪水。老彼得写「主知道」，一定想起加利利海边那一句：「主啊，你是无所不知的；你知道我爱你。」（约 21:17）一个自己靠不住的人，被一位知道的主拉回来。所以第 2 章所有严厉的话，都挂在 2:9 上：彼得讲审判，是为了叫敬虔的人安心，不是叫他们害怕；更不是叫我们替神去清理门户。","今天也有人住在所多玛中间——在荧幕里、在办公室里、在饭局上。危险不在于看见，而在于看久了不痛。还会痛，就还有义心。你若因为身边不义的人很得势而疲倦，2:9 不是叫你去算谁会受罚，是叫你把眼睛从他们身上移回主身上：审判是主的事，搭救也是主的事，我们的本位是敬虔。"]},{"h":"三、原文亮光：任性、下饵、无水的井","ps":["第一个字，2:10「任性」αὐθάδεις。这个字由「自己」和「取悦」组成，是以取悦自己为生活准绳的人。保罗说监督必须「不任性」，用的就是这个字——最危险的任性，常常出现在有讲台的人身上。这就是 321 说的「有己」：自己要作主作王。彼得对照说，天使力量权能更大，也不用毁谤的话在主面前告人；假师傅弱得多，却随口宣判他们不懂的事。骄傲就是离开本位，抓住只属于神的审判权。","第二个字，2:14「引诱」δελεάζω，是下饵的字。渔夫出身的彼得一眼就认得出来。主当年对他说：「我要叫你们得人如得鱼一样。」现在他看见另一种得人：用饵钓人。饵下给谁？「那心不坚固的人」。那一夜主对他说：「你回头以后，要坚固你的弟兄。」假师傅专找没有被坚固的人。所以门训、陪伴、在真道上扎根，不是教会的额外节目，是保护羊群的篱笆。","在第二个字和第三个词中间，彼得讲了一个很幽默的故事：巴兰骑着驴去赴那份「不义的工价」，路上三次被耶和华的使者拦住；先知看不见，驴看见了。他打了驴三次，直到「那不能说话的驴以人言拦阻先知的狂妄」。被钱冲昏头的人，比一头驴还不清醒。神今天的「驴」，可能是一句你看不起的人说的话、一个一再受阻的计划。被拦住的时候，先别急着打驴，先问：我是不是正往不义的工价那里走？","第三个词，2:17「无水的井」πηγαὶ ἄνυδροι。在干旱的山地，泉源就是命。耶利米说：「我的百姓做了两件恶事，就是离弃我这活水的泉源，为自己凿出池子，是破裂不能存水的池子。」干井占住了源头的位置，人来要水，它给不出水。面对干井，出路不是去找一口更大、更有名的井，而是回到那一位：「人若喝我所赐的水就永远不渴。」（约 4:14）也要问自己：我带给身边的人的，是水，还是雾？"]},{"h":"四、假自由与两种回头（2:19–22）","ps":["干井最有吸引力的一句话是：「你自由了。」2:19 说：「他们应许人得以自由，自己却作败坏的奴仆，因为人被谁制伏就是谁的奴仆。」「制伏」是打败仗；古代战败的人就成了战胜者的奴隶。他们以为自己战胜了规条，其实是被情欲打败。全卷只有两种仆人：彼得在 1:1 自称「耶稣基督仆人」，另一种是败坏的奴仆；没有第三种「谁都不作主人」的人。自己作主的人，最后被别的东西作主。自由不是没有主人，是有一位好主人。","再看 2:18 他们找的对象：「那些刚才脱离妄行的人」。刚信主、刚离开旧生活、还没站稳的人，最容易被一句「你已经自由了，不必那么拘谨」打动；用的饵，正是他们刚刚逃出来的那个东西。这叫我们看见教会对初信者的责任：不是给他们一堆规条，而是有人陪他们走头一年，让他们在真道上扎根，知道真自由是在基督里越来越不被情欲捆绑。","接着是全章最沉重的三节：「末后的景况就比先前更不好了」，狗转过来吃所吐的，猪洗净了又回泥里去滚。外面洗过了，本性没有变。历代教会对这几节有三种读法：有人说真信徒可能失落，有人说这些人从未真正重生，也有人说警告本身就是神保守信徒的工具。不论你站在哪一种，有一件事要看清楚：上下文 2:17–19 讲的是假师傅和跟随他们、又去引诱别人的人，不是一位跌倒了、心里很痛、很想回来的弟兄姐妹。","彼得在这里埋了一个只有他懂的字。狗「转过来」，原文和主对他说「你回头以后」是同一个字。同一个动作，两个方向：一个转回呕吐物，一个转回主面前。如果你今天害怕自己就是 2:20 说的那种人，你会害怕，本身就说明你的心还没有麻木。请听 1:9：「忘了他旧日的罪已经得了洁净」——你的罪是被洁净过的。请听 3:9：「不愿有一人沉沦，乃愿人人都悔改」——主还在等。今天就回头，像彼得那样回到主面前。"]},{"h":"五、几个必须认得的偏差","ps":["第一个偏差，是把这一章变成猎巫：在讲台、小组或群组里点名今天某位牧者、某间教会、某个宗派或某个平台的讲员是假师傅。彼得给的是记号，不是名单——对基督、对金钱、对身体、对权柄、对自由五个记号，都是果子，不是口才，也不是宗派标签。讲台教会众分辨，不替会众判决。","第二个偏差，是用 2:10「轻慢主治的」、「毁谤在尊位的」堵住对教会领袖的正当质疑，说「你批评牧师就是轻慢主治的」。这不是经文的意思：这一章被定罪的正是「师傅」，是有讲台的人；彼得给长老的命令是「也不是辖制所托付你们的，乃是作群羊的榜样」（彼前 5:3）。照真理、在爱中、按程序提出的问题，不是毁谤。","第三个偏差，是用 2:20–22 恐吓跌倒、挣扎的信徒，对他说「你就是那条狗」。这是误用。这几节的对象是假师傅和跟随的人；跌倒而想回来的人，要听的是 1:9 的洁净和 3:9 的宽容。我们没有权柄对任何一个人宣判结局，那是主的事。","第四个偏差，是只看别人，不照自己。读完这一章，很会指出谁贪心、谁任性，却从不问：我有没有在真道旁边夹带自己的东西？我爱听某种讲道，是因为它真，还是因为它照我想要的形状捏？分辨先从自己的心开始。","第五个偏差，是把「分辨」变成不再信任任何人：被干井骗过一次，就说所有的井都是干的，从此不进教会、不听讲道、不让任何人陪伴。这样做看似谨慎，其实是把自己留在旱地。彼得的出路不是不喝水，是回到活水的泉源，并且在一个彼此坚固的群体里喝。"]},{"h":"六、两个华人处境的真实问题","ps":["第一个问题：群组里有人转来一段视频，标题写着「某某原来是假先知」，要不要再转出去？先停三秒，问四件事。这段视频在教我认记号，还是在给我名单？它照着真理、有事实、有程序，还是剪接加上情绪？我转出去，是为了保护人，还是为了证明自己比较属灵？我有没有先为这个人祷告？多数时候，最合圣经的做法是不转；若真有教会内的错谬或侵害，就照程序、向该负责的人、在爱中公开透明地处理，而不是在网络上定罪。","第二个问题：一位你敬重的长辈热心地介绍你去听一位讲员，说只要奉献某个数目，神就保证加倍回报；或拉你投资一个「教会弟兄合办、保证赚钱」的项目。拒绝他，好像不尊重长辈。这时候用 2:3 的记号照一照：有没有贪心？有没有捏造的言语？有没有把人当作取利的对象？你可以温和地说：「谢谢您想到我，这件事我需要先和家人、和教会的长执一起祷告。」尊重长辈，不等于把钱和判断交出去。若已经受了损失，不要因为羞愧一个人扛，教会愿意陪你，必要时也该寻求专业或法律的协助。"]},{"h":"七、活出321——在干井的时代，回到活水","ps":["耶稣是我的榜样。彼得被主转过身来看了一眼，就回头了；主没有放弃跌倒的他。我们分辨错谬时，也要带着主看彼得的那种眼光，不是审判官的眼光。主在 2:9 怎样懂得搭救，我们也学习怎样把人拉回来，而不是把人推下去。","圣经是我的准则。准则是灯（1:19），不是棍子。我们用五个记号先照自己，再在群体中、照上下文、谦卑地分辨，不凭传闻，不凭情绪。1:20 不是叫我们不敢读经，是叫我们在神的话面前谦卑地一起读。","圣灵是我的引导。干井用饵引诱不坚固的人；圣灵引导我们回到活水，叫我们在真道上被坚固。用心靠圣灵，不要用脑靠自己；圣灵会在我们心里敲警钟，也会在我们心里带来安慰。","让耶稣作王。2:19 说，人被谁制伏就是谁的奴仆。不让耶稣作王，就会被贪心、情欲或自己的意思作王；让他作王，才是真自由。旧人有己要自己作主，新人无己让耶稣在里面活。","让耶稣得着一切的荣耀。2:9 说，搭救是主的事。被救出来的人没有可夸的，罗得不能夸，彼得也不能夸，荣耀全归给那位知道搭救的主。我们在分辨的事上也不抢功劳，不需要成为「揭发假师傅的人」。","建立属神的体系。属神的体系不是靠揭发别人建立的，是靠彼此坚固：财务透明、讲台不卖应许、陪伴刚脱离妄行的人，让每一位不坚固的人都有人看顾。先生命，再关系，后事工；人比事重要。"]},{"h":"八、四种心，同一位知道搭救的主","ps":["骄傲型的心，读这一章最容易兴奋，因为可以指出别人的错。主对你说：先照你自己。任性的根就是有己；放下审判的权柄，回到本位，让神作神。谦卑战胜骄傲：你最需要的不是更准确的眼光，而是一颗会为别人流泪的心。","恐惧型的心，读完会想：我被骗过，以后谁都不敢信了。主对你说：我知道搭救。你不必靠怀疑一切来保护自己，回到活水，在群体里被坚固，就是最好的保护。分辨不是关上门，是学会开对的门。","羞耻型的心，读到狗和猪就低下头，觉得说的就是自己。主对你说：你的罪已经得了洁净，我不愿有一人沉沦。你会痛，表示你的心还活着，今天就回头。狗回到所吐的，你可以像彼得一样回到主面前。","受伤型的心，曾被某位在讲台上的人伤害、被利用，甚至被骗了钱。主对你说：我看见了，我的审判没有打盹。你可以把伤说出来、把公道交给主，也可以在安全的地方寻求帮助；你的伤不是信心不足。主没有站在伤害你的人那一边，他是那位「知道搭救」的主。"]},{"h":"九、这一周，你可以做的几件事","ps":["第一，用五个记号照自己：对基督、对金钱、对身体、对权柄、对自由，各问一句，写下最刺你的那一个，并且为它祷告悔改。第二，这一周不转传任何「某某是假师傅」的讯息，收到时改为替那人和转传的人祷告。第三，背诵 2:9，在你觉得被不义包围的时候说出来。第四，检查你这周听的讲道和读的文章，用「这是水还是雾」问一次。并且找出你身边一位刚信主或还不坚固的人，约他喝一杯茶，问他最近读了什么。第五，若你曾被伤害或被骗，选一位你信任的同伴或牧者，这周说出一句话就好。","我宣告：主知道搭救敬虔的人，我的出路在他手里。","我宣告：耶稣用重价买了我，我不属于自己，我属于他。","我宣告：我不再被任何东西制伏，让耶稣作王才是我的自由。","我宣告：我旧日的罪已经得了洁净，我今天回到主面前。"]},{"h":"十、结语","ps":["弟兄姐妹，回到那位背着空桶的母亲。她在干井边最需要的，不是有人告诉她「这口井是假的」，而是有人牵着她的手，带她到真正有水的地方。这也是彼得写第 2 章的心：他不是在写一份黑名单，他是在说，那口干井救不了你，但主知道搭救。","今天我们看见三件事：干井会从里面冒出来，所以先照自己；主知道搭救，所以不必害怕，也不必替神清理门户；假自由会把人带回败坏，但回头的路一直开着，像彼得那样回到主面前。","所以这一课的焦点，不在假师傅身上，也不在我们有多会分辨，焦点在耶稣——那位用重价买了我们、转过身来看跌倒的彼得、知道怎样把挪亚和罗得拉出来的主。他还在等：「不愿有一人沉沦，乃愿人人都悔改。」","我们一起祷告：主耶稣，谢谢你用重价买了我们。求你先光照我们的心，叫我们不带着自己的东西夹带在你的真道里。在干井很多的时代，求你保守我们不被饵引诱，也不因为受过伤就不再喝水。为那些跌倒、正在害怕的弟兄姐妹，求你叫他们听见你说「回来吧」。主啊，你知道搭救敬虔的人，我们把审判交给你，把自己交给你。奉主耶稣基督的名祷告，阿们。"]},{"h":"十一、小组讨论分享：三个化","ps":["接下来一小时，我们不找谁是干井，而是一起回到活水：先让经文进来，再照见自己，最后走出一步。"]}],"deep":[{"sec":0,"q":"彼得自己不认过主，他有什么资格写这一章？","a":"正因为他不认过主，这一章才不是法利赛人的定罪。彼得在 2:1 用的「不承认」，就是他在院子里用过的那个字。他知道一个人怎样一步一步从「我总不能不认你」走到「我不认得那个人」。所以他的严厉里有眼泪。他和假师傅的分别，不是他比较强，而是他在跌倒之后让主转过身来看他，他出去痛哭，然后回头。今天我们也一样：讲这一章最有资格的人，不是自认从没错过的人，而是知道自己也会跌倒、也被主拉回来的人。带着这个身分来读，我们的分辨会变得清楚，也会变得温柔。不妨在读这一章之前先祷告：「主啊，先照我。」这样读出来的分辨，会带着怜悯，而不是带着优越感。"},{"sec":1,"q":"罗得做了那么多糊涂事，为什么圣经还称他是义人？","a":"因为「义」在这里不是指他的表现完美，而是指他的心还没有和那座城站在同一边。2:8 说他「看见听见他们不法的事，他的义心就天天伤痛」，那个「天天」是持续的，每一天都被刺痛。这不是在称赞他的选择，创世记清楚记下了他的软弱。但神看重一颗还会痛的心。更重要的是，他蒙搭救的原因不是他够好，而是神记念了亚伯拉罕，天使拉着他的手出城。这给今天许多住在「所多玛」中间、觉得自己软弱的信徒一个安慰：还会痛，就还有义心；你不是靠自己逃出来的，是主拉你出来。若你已经不太会痛了，也不必绝望，可以求主把那份痛还给你；这本身就是回头的开始。"},{"sec":1,"q":"2:9 说主知道搭救，为什么我祷告了，处境还是没有改变？","a":"「脱离试探」原文是从试炼里面拉出来，不是保证你不进去。挪亚仍然在方舟里漂了很久，罗得仍然在所多玛住了多年。主的搭救有他的时间和方法：有时是改变处境，有时是在处境里保守你的心不麻木，有时是先把你从某一段关系或某一种依赖中拉出来。「主知道」的意思是他懂得怎样，不是他照我们的时间表行事。这一周可以做的是：把你被困的那件事具体写下来，每天用 2:9 为它祷告一次，同时找一位同伴陪你。等候的时候，不是一个人等。也可以回头看看：过去有哪些时候，主是用你没有想到的方法把你拉出来的？记下来，那就是下一次等候时的见证。"},{"sec":2,"q":"「任性」和有主见、有勇气有什么分别？","a":"有主见是在真理上站稳，任性是以取悦自己为最高准则。分辨的方法是看这个「主见」最后服从谁。彼得的勇气是在公会前说「顺从神，不顺从人，是应当的」，那是向神顺服；假师傅的胆大是「毁谤在尊位的，还不知惧怕」，那是谁都不服。一个简单的检验：当圣经或属灵同伴指出我的错时，我能不能停下来、听完、承认？能，就是有主见；不能，就要小心任性。保罗要求监督「不任性」，提醒我们越在前面的人越要问这个问题。在家里、在职场、在服事上，都可以试着让一位同伴有权对你说真话，这是对付任性最实际的方法。"},{"sec":3,"q":"我曾经信主后又离开很久，2:20–22 是不是在说我已经回不来了？","a":"不是。这几节的上下文，是假师傅和跟随他们、还拿着「自由」去引诱刚脱离妄行之人的人；他们晓得义路，却主动背弃，并且带别人一起走。而你今天会为这件事不安，正说明你的心还没有麻木。请听彼得在同一封信里的两句话：1:9 说你「旧日的罪已经得了洁净」，3:9 说主「不愿有一人沉沦，乃愿人人都悔改」。写这三节的人自己跌得很重，主在海边等他回来。今天可以做的一步是：找一位信任的弟兄姐妹或牧者，告诉他「我想回来」。教会不是要审问你离开的原因，而是要欢迎你回家；就像主在海边为彼得预备了炭火和鱼，先让他吃饱，再和他谈。"},{"sec":4,"q":"如果教会真的有领袖出问题，我该怎么办才不算毁谤？","a":"毁谤和正当的提问，分别在内容、动机和途径。内容：是事实，还是猜测与传闻？动机：是为了保护羊群、帮助他回转，还是为了出气、证明自己对？途径：有没有先私下、按着教会的程序，向该负责的人提出（太 18:15–17），并且尊重调查的过程？若涉及金钱不当、权力控制或任何形式的侵害，就不只是个人看法的问题，应该向教会的监督机制提出，必要时寻求外部专业或法律协助。这样做不是轻慢主治的，正是对 2:3 和彼前 5:3 的顺服。同时记得：在事实查清楚以前，不在网络上公开定罪，也不在小组里传讲细节，保护当事人，也保护受伤的人。"},{"sec":5,"q":"被骗过钱之后，觉得很丢脸，不敢让教会知道，怎么办？","a":"被骗不等于愚笨，更不等于信心不好。彼得说假师傅「用捏造的言语在你们身上取利」，被下饵的常常是最真诚、最想信任人的人。羞愧会让人把事情藏起来，结果是一个人背着损失，也让同样的手法继续伤害别人。可以做的有三步：先告诉一位你信任、口紧的人；再请教会的牧者或长执陪你理清状况；若有金钱或法律上的损失，尽早寻求专业或法律的协助，保留相关的纪录。主说他的审判没有打盹，你可以把公道交给他，也可以在地上走正当的途径。教会也要学习：听见这样的事，第一个反应不是责备当事人「怎么这么不小心」，而是陪他、保护他。"},{"sec":6,"q":"怎样分辨自己听的讲道是活水，还是干井？","a":"可以用五个记号问，但要先问果子，不先问口才。第一，对基督：这篇讲道最后把我带到耶稣面前，还是带到讲员面前？第二，对金钱：它要的是我的心，还是我的钱？第三，对身体：它叫我更圣洁，还是叫我觉得放纵没关系？第四，对权柄：讲的人能不能被问、被纠正？第五，对自由：它叫我更自由地顺服主，还是叫我「不再需要谁」？还要加一条：喝完之后，我是更爱主、更爱人，还是更佩服讲员？这些问题不是拿来审判别人，是拿来保护自己，也帮助你知道该在哪里扎根。若你发现自己长期喝的是雾，不必一走了之，可以先找你信任的同伴一起祷告、一起读经，再决定下一步。"}],"hua":[{"h":"第一化：内化（约20分钟）","aim":"※ 目的：让 2:1–9 先进到心里，看见「从里面起来的危险」与「主知道搭救」；先让经文说话，再谈自己。","note":"※ 带领提醒：本课不谈任何具体人名、教会名或宗派名；若有人提出，温和地带回「记号，不是名单」。","qs":[{"n":1,"lv":"★","q":"请一位朗读 2:1–3，另一位朗读 2:4–9。你最先注意到哪一个词？为什么？"},{"n":2,"lv":"★★","q":"三个审判里藏着两个搭救，是哪两个？挪亚和罗得被搭救的方法各是什么？"},{"n":3,"lv":"★★★","q":"罗得「义心天天伤痛」。这一周，有哪一件你看习惯了、已经不太痛的事？用一句话说出来。"}]},{"h":"第二化：消化（约35分钟·主轴）","aim":"※ 目的：用看、听、想、讲、行五步，让 2:9 与 2:19 落到自己身上。","note":"※ 带领提醒：若有人说到被属灵虐待、被利用或被骗钱，只安静聆听，不追问细节，不要求他原谅，不在小组里评论那个人；会后单独关心，必要时协助他寻求专业辅导或法律协助。","qs":[{"n":4,"lv":"★★","q":"【看】看见自己：五个记号——对基督、金钱、身体、权柄、自由——哪一个最照到你？"},{"n":5,"lv":"★","q":"【听】听神说话：一起慢慢读 2:9 两次。主在这一句里，对你今天的处境说了什么？"},{"n":6,"lv":"★★★","q":"【想】想通关卡：哪一件事你说「我可以控制」，其实已经在控制你？2:19 怎样拆穿它？"},{"n":7,"lv":"★★","q":"【讲】说出口：用「主知道搭救我脱离……」造一句祷告，现在对组员说出来。"},{"n":8,"lv":"★★","q":"【行】走一步：本周哪一天、在什么地方，你要做一件让耶稣作王的具体小事？"}]},{"h":"第三化：转化（约25分钟）","aim":"※ 目的：从分辨别人转为坚固别人，让改变流向关系与使命。","note":"※ 带领提醒：第 11 题可能触及长期的伤或对教会的失望，不追问、不辩解，只说「谢谢你愿意说」；不追问细节、不要求原谅，会后单独关心，必要时协助寻求专业辅导或法律协助。920 那一题请每人当场说出名字。","qs":[{"n":9,"lv":"★★","q":"下一次群组里出现「某某是假先知」的视频，你要怎么回应？现在练习写一句回覆。"},{"n":10,"lv":"★★","q":"920 操练：找出你的那一个「2」——一位还不坚固的人，当场说出他的名字，本周何时向他分享 2:9？"},{"n":11,"lv":"★★★","q":"你曾因受伤而不敢再信任任何人吗？若愿意，说出一步你可以重新喝活水的方法。"},{"n":12,"lv":"★","q":"这一周，你要为哪一位跌倒的人祷告，求主叫他回头？说出名字或称呼。"},{"n":13,"lv":"★★","q":"你的教会或小组，可以怎样更透明、更会陪伴刚信主的人？提一个具体做法。"},{"n":14,"lv":"★★★","q":"【必做】用三句话把这一课讲给一位教会外的朋友听：干井会骗人，主知道搭救，回头就有活水。说出朋友的名字和时间。"}]},{"h":"收尾（5分钟）","ps":["请全组一起读 2:9，再读 3:9。带领者为每一位祷告，特别记念今天说出伤痛或害怕的弟兄姐妹；最后一同宣告：主知道搭救，我们回到他面前。"]}]},"3":{"n":3,"t":"不是耽延，乃是宽容——记得、等候、长进","open":"画面开场：深夜机场接机口，一班延误的航班——一直看表的人、转身走掉的人、趁着等的时间打电话和人和好的人；彼得要教会做第三种人。","secs":[{"h":"一、应许在哪里呢——故意忘记与两封提醒的信（3:1–7）","ps":["弟兄姐妹平安。请你先在心里看一个画面：晚上十点，机场的接机口。电子看板上，你要接的那一班飞机，后面那一栏从「准时」跳成了「延误」；再过半小时，又跳成「抵达时间未定」。接机口的人开始不一样了。有一个人每两分钟看一次表，嘴里念着：「到底在哪里？」有一个人看了看看板，摇摇头，把手上写著名字的牌子塞进垃圾桶，转身走了：「我看是不会来了。」还有一个人，找了个角落坐下，拿出手机，拨了一通他拖了好几年没有打的电话，打给一个跟他闹翻的弟兄，说：「我在机场等人，忽然想到你。对不起，那件事是我不对。」","同一班延误的航班，三种等的人。今天这一课，彼得后书第三章，就是写给接机口的人的。教会已经等了很久。彼得前书说「万物的结局近了」（彼前 4:7），可是一年一年过去，第一代信主的人一个一个睡了，主还没有来。于是有人开始看表，有人开始转身。彼得要教我们做第三种人。","先听他怎么开口：「亲爱的弟兄啊，我现在写给你们的是第二封信。这两封都是提醒你们，激发你们诚实的心」（3:1）。这是一个知道自己快要离开帐棚的老人（1:14），他要给的不是新的信息，而是叫人记得——「叫你们记念圣先知预先所说的话和主救主的命令」（3:2）。这一章的第一个动词，是记得。","然后他说，末世必有好讥诮的人，他们说：「主要降临的应许在哪里呢？因为从列祖睡了以来，万物与起初创造的时候仍是一样。」（3:4）这正是接机口那个转身走的人的逻辑：从来没有变过，所以永远不会变。彼得怎么回答？「他们故意忘记」（3:5）。原文的意思是：他们愿意让这件事溜走。不是不知道，是不想记得。忘记什么？忘记世界从来不是靠自己稳定的。天和地是「凭神的命」有的；挪亚的时候，「当时的世界被水淹没就消灭了」（3:6）；「但现在的天地还是凭着那命存留」（3:7）。所谓「万物仍是一样」，从来不是事实。神说话，世界就成；神说话，洪水就来。","弟兄姐妹，讥诮很少从头脑开始。彼得说，他们是「随从自己的私欲」（3:3）。一个人如果希望主不要来，最省事的办法，就是说服自己主不会来——因为主若来，我就得交账。所以，信心的一半是记得。今天你心里若也冒出一句「到底在哪里」，先不要害怕自己不属灵，先问一句：我让什么溜走了？"]},{"h":"二、一日如千年——不是公式，是换位（3:8–10）","ps":["第三章最常被拿去用的一节，是 3:8：「亲爱的弟兄啊，有一件事你们不可忘记，就是主看一日如千年，千年如一日。」请留意，他又叫了一声「亲爱的」。讲到最容易引人焦虑的题目，彼得先叫一声亲爱的。","这一节常常被当成公式。有人说创造的六日代表六千年的历史，有人拿它来推算主再来的日子，这些都不是这节经文的意思。彼得引的是诗篇 90:4：「在你看来，千年如已过的昨日。」诗篇只讲一个方向；彼得加上另一个方向：一日如千年，千年如一日。两个方向都说，等号就不能成立；如果一日等于一千年，一千年又等于一日，这就不是算术了。所以这节经文不是递给你一把换算的尺，而是把尺收走。它叫我们换一个位置：「主看」——站到主那里看时间。","从主那里看，时间是什么？3:9：「主所应许的尚未成就，有人以为他是耽延，其实不是耽延，乃是宽容你们，不愿有一人沉沦，乃愿人人都悔改。」「宽容」原文是 μακροθυμεῖ，由「长」和「怒气」两个字组成，意思是把怒气拉得很长。彼得前书讲挪亚的日子「神容忍等待」，用的是同一个字族（彼前 3:20）。前书讲的是挪亚的日子，后书讲的是我们的日子。主的慢，不是迟到，是爱的等。","彼得最有资格写这一节。他曾经三次不认主，主没有在那一夜放弃他；主在提比哩亚海边等他，生了炭火，问了他三次：「你爱我吗？」三十多年后，这个被主等过的人写下：「其实不是耽延，乃是宽容你们。」他写的不是理论，是自己的故事。你今天还能坐在这里，也是因为主等过你。","可是 3:10 紧接着说：「但主的日子要像贼来到一样。」宽容不是取消。贼来之前不会发通告。这一句同时挡住两种错：挡住「主不会来」的讥诮，也挡住「我知道主哪一天来」的聪明。主耶稣亲口说过：「那日子、那时辰，没有人知道」（太 24:36）。所以，等候的时间不是焦虑的时间，是悔改的时间，是传福音的时间。接机口那个打电话的人，做的正是这件事。"]},{"h":"三、原文亮光：催促、显露、更新","ps":["这一章有三个原文字，每一个都会改变你等候的姿势。","第一个字，σπεύδοντας（3:12）。和合本译作「切切仰望」，原文更常见的意思是「催促、使它加快」。彼得在圣殿的廊下讲过：「你们当悔改归正，使你们的罪得以涂抹，这样，那安舒的日子就必从主面前来到。」（徒 3:19–20）神让他的子民参与他的心意。可是请看上下文怎样定下「催促」的方法：3:9 的悔改，3:11 的圣洁和敬虔。这不是叫人推算或「加速」日期，也不是用什么工程替主排时间表；3:10 的「像贼」仍然管着 3:12。我们能做的催促，是活得像一个盼望他来的人，并且传福音，让更多人悔改。","第二个字，εὑρεθήσεται（3:10 末句）。和合本照多数抄本译作「烧尽了」；最早、最好的抄本作 εὑρεθήσεται，意思是「必被发现、必被显露」；也有编者采「不被发现」的读法。不论哪一读，都不是神把他所造的丢掉。照「显露」来读，那一日，地和其上一切的工都要摊开在神面前，这使我们想起林前 3:13：「各人的工程必然显露。」更动人的是，四节之后 3:14 的「安然见主」，原文正是同一个动词：「被他找到」。那一日找我们的，不是批评我们的人，也不是我们自己的良心，是主自己。","第三个字，καινός（3:13）。「盼望新天新地」的「新」，不是时间上的新，是品质上的新——更新，而不只是另换一个。挪亚的洪水使「当时的世界」消灭，地却没有消失；火的审判也是对罪的了结，不是神放弃他的作品。这使我们想起罗马书 8:21：「但受造之物仍然指望脱离败坏的辖制，得享神儿女自由的荣耀。」新天新地最美的一句是：「有义居在其中。」「居」是长住。今天的义像寄居的客旅，在这世界常被挤到角落；那一日，义要安家。","三个字连起来，就是等候的三个姿势：催促，是用悔改和圣洁参与神的心意；显露，是知道一切都要摊在主面前，所以今天就活在光中；更新，是知道神不会丢弃他所爱的世界，所以今天就好好看守它。"]},{"h":"四、怎样等候——圣洁、敬虔、亲爱的兄弟、防备、长进（3:11–18）","ps":["讲完主的日子，彼得问的不是「哪一天」，而是「你们是怎样的人」：「这一切既都要如此销化，你们为人该当怎样圣洁，怎样敬虔」（3:11）。末世的问题，最后落在你今天怎样做人。永恒的观点不是叫人离开世界，是叫人在世界里活得不一样。","第一，圣洁、敬虔。「为人」在原文是复数，是一件一件具体的行为。等候不是坐在接机口发呆，而是在等的时候怎样说话、怎样用钱、怎样待家人。3:14：「亲爱的弟兄啊，你们既盼望这些事，就当殷勤，使自己没有玷污，无可指摘，安然见主。」「没有玷污、无可指摘」这一对字，彼得前书用来形容基督——「无瑕疵、无玷污的羔羊」（彼前 1:19）。我们能安然见主，靠的是羔羊的洁净，不是自己的成绩单。","第二，亲爱的兄弟保罗。3:15：「并且以我们主长久忍耐为得救的因由，就如我们所亲爱的兄弟保罗，照着所赐给他的智慧写了信给你们。」你记得保罗曾在安提阿当面抵挡彼得吗？「因他有可责之处，我就当面抵挡他。」（加 2:11）那一次的责备写进了加拉太书，读遍所有教会。多年以后，彼得在临终的信里，称这个人为「我们所亲爱的兄弟」，还说他有神所赐的智慧。这不是两位使徒的角力，而是两个被同一份恩典改变的人。等候主来的人，不再记账——不是假装没受伤，也不是不设界线，而是把公道交给主。","第三，防备。3:16 说保罗的信「有些难明白的，那无学问、不坚固的人强解」。「强解」原文 στρεβλόω，本来是把人绑上刑架硬拉——把经文拉到自己要的长度。请注意，彼得没有说「难明白，所以你们不要读」。出问题的不是读的人，是强解的人；「无学问」原文的意思是不肯受教。所以 3:17：「你们既然预先知道这事，就当防备，恐怕被恶人的错谬诱惑，就从自己坚固的地步上坠落。」「坚固」，是主在被卖那一夜交给彼得的字：「你回头以后，要坚固你的弟兄。」（路 22:32）他用这个字做了一生的功课，一直做到最后一封信的最后一段。","第四，长进，然后荣耀。最后一节：「你们却要在我们主救主耶稣基督的恩典和知识上有长进。愿荣耀归给他，从今直到永远。阿们！」（3:18）次序很清楚：先防备坠落，再在恩典上长，最后把荣耀归给他。彼得前书的结尾是在恩上站立得住，彼得后书的结尾是在恩上长进——站得住的人，还要长。照教会的传统，一个快要殉道的老人，留给教会的最后一口气，不是自己的成就，是「愿荣耀归给他」。"]},{"h":"五、几个必须认得的偏差","ps":["第一个偏差，是用 3:8 算日子。有人把「一日如千年」当作换算表，拿来定创造的年代，或排出主再来的年份。这不是经文的用意：彼得两个方向都说，正是要取消换算；主耶稣也说：「父凭着自己的权柄所定的时候、日期，不是你们可以知道的。」（徒 1:7）算对了不叫信心，算错了却会绊倒人。","第二个偏差，是用 3:12 推算日期或「加速」日期，好像人可以用某种条件、某个工程、某种国际局势把主催来。σπεύδω 的方法，上下文已经定了：悔改、圣洁、敬虔。我们参与的是神的心意，不是掌握神的时间表；3:10「像贼」一句，仍然管着每一个想替主排日程的人。","第三个偏差，是说「地球反正要烧，所以不必照顾受造界」。无论 3:10 读「烧尽」还是「显露」，3:13 都说新天新地是更新；起初神把人安置在园子里，「使他修理看守」（创 2:15），这个托付没有被收回。照顾受造界是管家的本分，不是某一派的政治口号；我们不把它变成政治动员，也不拿末日当浪费的借口。","第四个偏差，是因延迟而冷淡，或因末日而恐慌。前一种人像接机口转身走的人，心想反正还早，慢慢再说；后一种人一看新闻就心惊胆战，囤货、失眠、不敢计划将来。3:9 对前者说：宽容是给你悔改的时间，不是给你拖延的空间；3:10 说像贼，你不知道还有多少时间。对后者，3:14 说「安然见主」——果效是忍耐，不是恐慌。","第五个偏差，是用 3:16 说「难懂的经文不要自己读」，甚至说只有牧师才能解经，这是错的。彼得说的「难明白」，原文是难懂，不是不可懂；出问题的是不肯受教、站不稳的人去「强解」。保护读经的方法不是不读，而是在群体中读、照上下文读、带着谦卑读。彼得这封信本身，就是写给全体会众读的。"]},{"h":"六、两个华人处境的真实问题","ps":["第一个问题：家族群组或教会群组里，有人转来一段视频，说根据某些经文和天象，主再来的年月日已经揭晓，请大家赶快转传。怎么办？第一，不转传；第二，也不在群组里嘲笑转传的人——他多半是出于爱主，或出于害怕。私下回他一句：「主说那日子没有人知道（太 24:36），彼得说主的日子像贼来到（3:10）；我们一起把等的时间用在悔改和爱人上。」过去几十年，公开宣布过的日期一个一个过去，每一次都有人卖了房子、辞了工作，也有人从此不再信主。分辨不是去揭发谁，是不让恐慌代替信心。","第二个问题：饭桌上两代人吵起来。长辈说：「这个世界将来都要烧掉，管环境是不属灵的事。」年轻的孩子却因为气候新闻焦虑得睡不着，觉得未来没有希望，不想结婚、不敢计划。3:13 对两代人都说话。对长辈说：神要更新的是他所造的，照顾它是管家的本分。对年轻人说：世界的结局不是在人的手里崩溃，而是在神的手里更新，「有义居在其中」。我们照顾受造界，不是因为怕世界完蛋，是因为这世界属于那位要来的主。如果孩子的焦虑已经长期影响睡眠和生活，除了陪他祷告，也要陪他去寻求专业协助。"]},{"h":"七、活出321——在等候中让耶稣得着一切的荣耀","ps":["经文讲完了，321 在这里接上。三个基础。第一，耶稣是我的榜样。3:9 的宽容，就是主在海边等彼得的那份宽容。我等候还没信主的家人时，学他的忍耐：不催逼，也不放弃；别人等我改变的时候，我也记得主曾怎样等我。第二，圣经是我的准则。3:2 叫我记念先知和使徒的话，3:16 提醒我不要强解。我的末日观不从群组视频来，也不从新闻标题来，而是从圣经来，而且在群体中、照上下文、谦卑地读。第三，圣灵是我的引导。3:18 的长进不是咬牙苦撑，是圣灵在恩典里使人长；用心靠圣灵，不要用脑靠自己去算日子。","两个核心。让耶稣作王：3:13「有义居在其中」，新天新地是王公义掌权的地方；今天就让他在我的时间表上作王——日子由他定，我只管忠心；我的钱、我的计划、我对待受造界的方式，也都交给他作王。让耶稣得着一切的荣耀：3:18「愿荣耀归给他」，彼得一生最后一句话不是讲自己，是把荣耀归给主。一个人等候得对不对，看他最后把荣耀归给谁就知道了。","一个目的：建立属神的体系。3:15「我们所亲爱的兄弟保罗」——纠正人的和被纠正的，在同一个身体里彼此相称为亲爱的。无己才能合一，合一才能一同等候。这就是改变观点：从暂时到永恒，从地上到天上，从人的眼光到神的眼光。"]},{"h":"八、四种心，在等候中被主找到","ps":["骄傲型的心，想要掌握时间表：不是算日子，就是讥诮。骄傲是离开本位抓住权力，想代替神决定时间。3:8 叫你回到本位：「主看」，不是我看。谦卑是放下权力回到本位：让神作神，让人作人；日子交给神，忠心留给自己。","恐惧型的心，一听末日就慌，一看新闻就怕。3:9 说主不愿有一人沉沦；3:14 说安然见主。站在羔羊的洁净里，见主是平安，不是惊吓。把焦点从新闻移回主身上，你的心就能安静下来，继续过今天该过的日子。","羞耻型的心，觉得自己太脏，最好主不要来。3:14 说「被他找到」，找你的那一位，就是在海边生了炭火等过彼得的主；他的宽容，正是为你留的门。他等你，不是为了羞辱你，是为了接你回家。","受伤型的心，等得太久了：祷告多年没有答案，或亲人没等到信主就走了。主不轻看你的眼泪；3:9 告诉你，主的心从来不是冷的。至于已经离世的亲人，我们不替神下判断，把他交在那位「审判全地的主」手里，他必行公义（创 18:25）。这份伤，会后可以找一位同工单独谈。"]},{"h":"九、这一周，你可以做的几件事","ps":["第一，每天早上读一遍 3:9，把一位还没信主的人的名字放进去，为他祷告一分钟。第二，用「等的时间」打一通和好的电话，像接机口那个人一样，说一句「那件事是我不对」。第三，做一件照顾受造界的小事：不浪费一餐饭、随手关灯、把垃圾分好，不为口号，只为管家的本分。第四，群组里再收到末日日期的讯息，不转传，私下回一句 3:10「像贼来到」。第五，每晚睡前写下一件今天在恩典和知识上长进的事，然后说一句：「愿荣耀归给他。」","这五件事都很小，但每一件都是在接机口打出去的一通电话：不是看表，不是转身，而是用等的时间去爱。请大家一起宣告。我宣告：主不是耽延，乃是宽容，他不愿有一人沉沦。我宣告：日子由主定，我不算日子，我只管忠心等候。我宣告：我照他的应许，盼望新天新地，有义居在其中。我宣告：我要在主耶稣基督的恩典和知识上有长进，愿荣耀归给他，从今直到永远。"]},{"h":"十、结语","ps":["彼得后书最后一段，给了等候的人一个次序：先防备，免得从坚固的地步上坠落；再长进，在主耶稣基督的恩典和知识上一天一天长；最后，把一切都收在一句话里——愿荣耀归给他。","回到机场的接机口。看板上的字也许还写着「延误」，但彼得告诉我们，那不是延误，是宽容；那班飞机一定会到，而且会在你没有预料的时候到。你不必一直看表，更不要转身走掉；你可以像那个坐在角落的人，用等的时间去和好、去爱人、去传福音。","所以今天我们的焦点，不在那一天是哪一天，不在世界会怎样结束，也不在自己够不够好；焦点在那位长久忍耐、一定会来的主耶稣基督。当他来的时候，愿他找到我们正在等他。","我们祷告：亲爱的天父，谢谢你不是耽延，乃是宽容；谢谢你等过彼得，也等过我们。求你赦免我们有时候故意忘记，有时候想替你算日子，有时候因为等得太久而冷淡。求圣灵坚固我们，叫我们防备错谬，在主耶稣基督的恩典和知识上有长进，用等候的时间去和好、去爱人、去传福音。愿荣耀归给你，从今直到永远。这样祷告，是奉主耶稣基督的名祷告，阿们。"]},{"h":"十一、小组讨论分享：三个化","ps":["接下来一个小时，我们一起把这一课内化、消化、转化，让它从头脑走进生活。"]}],"deep":[{"sec":0,"q":"我心里有时也会冒出「主到底在哪里」，这是不是表示我已经成了讥诮的人？","a":"不是。讥诮的人和疑惑的人不一样。彼得形容讥诮的人是「随从自己的私欲」，而且「故意忘记」——他们希望主不要来，所以选择不记得。一个在苦难里问「主啊，还要等多久」的人，其实是在向主说话，诗篇里满是这样的祷告（诗 13:1）。问题不在有没有疑问，而在疑问把你带到哪里：带你远离主，还是带你回到经文和主面前。当这句话冒出来，照 3:1–2 去做：把先知和使徒的话再读一次，把神在你生命中做过的事一件一件记起来。信心的一半是记得；另一半，是带着还没解开的问题，继续跟随主。"},{"sec":1,"q":"既然主「不愿有一人沉沦」，为什么还有人沉沦？神的心意落空了吗？","a":"这是教会历代认真讨论的题目。阿米念与卫斯理传统认为这是神普遍的救恩心意，人可以拒绝；改革宗有人把「人人」限在「你们」之中，也有人分辨神的心意与定旨，指出神真实地不喜悦恶人死亡（结 33:11）。不论站在哪一派，有两件事都不能丢：第一，神的心意是真实的，不是外交辞令；第二，3:7 的审判也是真实的，不能用 3:9 取消。这一节的工作不是裁决拣选的系统，而是回答「为什么还没来」：因为神在等人悔改。不要用系统冷却这节经文的温度，倒要让它推你去为一个人祷告。小组里若有不同看法，可以彼此尊重，同心为未信的人代祷。"},{"sec":1,"q":"主既然这样宽容，那我是不是可以等以后再悔改、再认真？","a":"宽容是给你悔改的时间，不是给你拖延的空间。罗马书 2:4 说：「还是你藐视他丰富的恩慈、宽容、忍耐，不晓得他的恩慈是领你悔改呢？」同一个 3:9，紧接着就是 3:10：「主的日子要像贼来到一样。」你不知道还有多少时间，也不知道自己的心会不会因为一拖再拖而变硬。主等你，不是因为你的事不重要，而是因为你太重要。把「以后」换成「今天」：今天就向主承认那件事，今天就打那一通电话。主的宽容最好的回应，是不再浪费它。彼得自己就是在主的宽容里回头的人。"},{"sec":2,"q":"如果 3:12 真的可以译作「催促」，那我们努力传福音，是不是能决定主再来的日子？","a":"不能，也不需要。σπεύδω 确实可以译作催促，彼得自己在使徒行传 3:19–20 也把悔改和「安舒的日子」连在一起；主耶稣也说「这天国的福音要传遍天下……然后末期才来到」（太 24:14）。可是同一位主说「那日子、那时辰，没有人知道」，彼得在 3:10 也说「像贼来到」。这两组经文放在一起，意思是：我们真实地参与神的心意，却不掌握神的时间表。传福音的动机不是要把主催来好结束自己的苦，而是因为主不愿有一人沉沦。我们负责忠心，日子由他定。这样，传福音就不会变成焦虑的工程，而是爱的回应。"},{"sec":2,"q":"我的和合本写「烧尽了」，原文抄本却有「被显露」，那我手上的圣经是不是错了？","a":"不必慌张。和合本照的是当时通行的多数抄本，那是历代教会真实读过的经文；学者根据西乃、梵蒂冈等较早的抄本，认为 εὑρεθήσεται 较可能是原貌。抄本的差异在新约里是少数，而且没有一处动摇基督信仰的核心。就这一节来说，两种读法其实指向同一件事：那一日，地上一切都要摊在神面前，罪要被了结，神所造的不是被丢弃，而是要被更新（3:13）。你可以安心读手上的和合本，同时知道原文多了一层亮光：那一日，一切都要被主看见，我们也要「被他找到」（3:14）。遇到这类问题，可以向带领者请教，也可以对照几本中文译本一起读。"},{"sec":3,"q":"彼得说保罗的信有些难明白，那我读不懂的经文该怎么办？是不是干脆不要读？","a":"不是。彼得把这封信写给全会众，他自己就期待每一个人读。他警告的是「无学问、不坚固的人强解」，也就是不肯受教、又要把经文扭到自己要的方向的人。读不懂时有三个保护：第一，在群体中读——带到小组，请教长辈和牧者，彼此印证；第二，照上下文读——先看前后文在讲什么，不要单抽一句；第三，谦卑地读——容许自己暂时不懂，先顺服已经读懂的部分。难懂的经文不是禁区，而是邀请你慢下来、和弟兄姐妹一起读。读不懂的地方先记下来，带着祷告慢慢求明白，圣灵会在合适的时候开你的眼睛。"},{"sec":4,"q":"教会讲照顾受造界，会不会变成社会福音，或者被带去政治立场？","a":"这是合理的担心。照顾受造界的根据不在任何政治立场，而在创造：神把人放在园子里「使他修理看守」（创 2:15），人是管家，不是主人。彼得后书 3:13 说新天新地是更新，罗马书 8:21 说受造之物要得享神儿女自由的荣耀，所以我们今天怎样对待神所造的，是信仰的一部分。界线也要清楚：福音的中心是基督为罪人死而复活，照顾受造界是福音的果子，不是福音的替代；教会不为政党背书，弟兄姐妹在具体政策上可以有不同看法。从小事做起：不浪费、不污染、带着感恩使用。这不是为了证明自己进步，而是向造物主表达敬畏。"},{"sec":7,"q":"我的亲人没有信主就过世了，读到「不愿有一人沉沦」，我心里很痛，该怎么面对？","a":"先说一句：你的痛是真的，主不轻看。我们不替神断定任何一位离世之人的去处，因为我们不知道他最后的日子里，神怎样向他说话；我们只知道那位审判的主是公义的，也是慈爱的。亚伯拉罕说：「审判全地的主岂不行公义吗？」（创 18:25）可以把亲人交在这位主手里，不需要在自责或猜测里反覆折磨自己。3:9 也告诉你，神的心从来不是冷的，他和你一样不愿意人沉沦。若这份哀伤已经很久，影响睡眠、工作或生活，请让牧者或同工陪你，必要时一起寻求专业的哀伤辅导。"}],"hua":[{"h":"第一化：内化（约20分钟）","aim":"※ 目的：先让经文本身说话，把彼得后书第三章的骨架读进心里：记得、宽容、等候、长进、荣耀。","note":"※ 带领提醒：请一位组员先朗读 3:1–18。这一化只问经文说了什么，不急着应用；有人想讨论末日年份，温和地带回 3:8–10 的两个方向和「像贼」。","qs":[{"n":1,"lv":"★","q":"这一章「亲爱的弟兄啊」出现了几次？分别在哪几节、哪几个转折点？"},{"n":2,"lv":"★","q":"讥诮的人说「应许在哪里呢」，彼得说他们「故意忘记」了什么？用一句话说出来。"},{"n":3,"lv":"★★","q":"3:8 为什么要两个方向都说「一日如千年，千年如一日」？这怎样使换算不能成立？"},{"n":4,"lv":"★★★","q":"3:17–18 的次序是防备、长进、荣耀。为什么不能颠倒？这三步里，哪一步是你现在最缺的？"}]},{"h":"第二化：消化（约35分钟·主轴）","aim":"※ 目的：把经文对准自己的等候——看见自己是哪一种等的人，听见主「宽容」的声音，想通卡住的地方，说出口，走一步。","note":"※ 带领提醒：第 7 题可能触及亲人未信主就过世、长期祷告没有答案或长期无望感。不追问细节，不断定亡者去处，不要求任何人原谅或释怀；让分享的人说到他愿意说的地方就好，会后单独关心，必要时协助他寻求专业协助。","qs":[{"n":5,"lv":"★★","q":"【看】看见自己：接机口三种人——一直看表的、转身走掉的、趁着等去和好的。这半年的你最像哪一种？说一个具体的时刻。"},{"n":6,"lv":"★","q":"【听】听神说话：把 3:9 读出来，把「你们」换成你自己的名字。哪一个词最打中你？"},{"n":7,"lv":"★★★","q":"【想】想通关卡：你心里有没有一件「主怎么还不……」的事？3:9 的「宽容」怎样改变你看这一段等待？"},{"n":8,"lv":"★★","q":"【讲】说出口：算日子、恐慌、冷淡、不管受造界、不敢读经——你要放下哪一个？用一句话向组员说出来。"},{"n":9,"lv":"★★★","q":"【行】走一步：这一周你要用「等的时间」做哪一件事？打给谁、和谁和好、为谁祷告？说出名字和时间。"}]},{"h":"第三化：转化（约25分钟）","aim":"※ 目的：让这一课走出小组，进到群组、餐桌、办公室，和一位还不认识主的朋友身边。","note":"※ 带领提醒：第 12 题触及被人纠正或受伤的关系，不要求原谅，不追问细节；若涉及伤害或安全，先顾安全，会后单独关心，必要时协助寻求专业协助。第 13、14 题请每人当场说出名字和时间，组长记下，下周回顾。","qs":[{"n":10,"lv":"★★","q":"群组里若收到「主再来年月日」的讯息，你会私下怎样回？把你要说的那一句写下来，念给组员听。"},{"n":11,"lv":"★","q":"这一周，在家里或办公室，你可以做哪一件照顾受造界的小事？说出地点和时间。"},{"n":12,"lv":"★★★","q":"彼得称纠正过他的人「亲爱的兄弟」。有没有一个你一直记他账的人？这一周你可以为他做哪一件小事？"},{"n":13,"lv":"★★★","q":"920 操练：找出你的那一个「2」——一位还没信主或正在冷淡的人，本周向他分享 3:9「不是耽延，乃是宽容」。当场说出他的名字和时间。"},{"n":14,"lv":"★★★","q":"【必做】用三句话把这一课讲给一位教会外的朋友听：主为什么还没来、等的人怎样活、你为什么盼望。说出这位朋友的名字。"}]},{"h":"收尾（5分钟）","ps":["请组长邀请两位组员各用一句话说出这一课最带走的一句经文，然后全组一起站起来，同声读 3:18：「你们却要在我们主救主耶稣基督的恩典和知识上有长进。愿荣耀归给他，从今直到永远。阿们！」最后彼此代祷，特别记念第 13 题说出名字的那些人。"]}]}},"extras":[{"t":"为什么读彼得后书","html":"<p><strong>一、因为这是一个人的遗言<\/strong><\/p>\n<blockquote>\n<p>「我以为应当趁我还在这帐棚的时候提醒你们，激发你们；因为知道我脱离这帐棚的时候快到了，正如我们主耶稣基督所指示我的。」（彼后 1:13–14）<\/p>\n<\/blockquote>\n<p>彼得前书写给在火里的人；<strong>彼得后书是一封临终的信<\/strong>。「正如我们主耶稣基督所指示我的」——指的是加利利海边那一天，主对他说：「你年老的时候，要伸出手来，别人要把你束上，带你到不愿意去的地方。」（约 21:18）<strong>三十多年来，彼得一直知道自己会怎样死；现在，那一天近了。<\/strong><\/p>\n<p>一个人临终要说的话，一定是他认为最重要的话。<strong>彼得最后想说的是三件事：要长进（第 1 章）、要分辨（第 2 章）、要等候（第 3 章）。<\/strong> 而全卷最后一句话，不是叮咛，是赞美：<\/p>\n<blockquote>\n<p>「你们却要在我们主救主耶稣基督的恩典和知识上有长进。愿荣耀归给他，从今直到永远。阿们！」（彼后 3:18）<\/p>\n<\/blockquote>\n<p><strong>一个照教会传统快要殉道的老人，最后一口气是「愿荣耀归给他」<\/strong>——321「让耶稣得着一切的荣耀」，在新约里没有比这更真实的见证。<\/p>\n<p><strong>二、因为他曾经想在山上搭帐棚<\/strong><\/p>\n<p>「帐棚」这个字，彼得一生忘不了。在登山变像的山上，他看见主的荣光，脱口而出：<\/p>\n<blockquote>\n<p>「主啊，我们在这里真好！你若愿意，我就在这里搭三座棚，一座为你，一座为摩西，一座为以利亚。」（太 17:4）<\/p>\n<\/blockquote>\n<p><strong>那一天他想留在山上，把荣耀关进帐棚里。<\/strong> 几十年后，他称自己的身体为「帐棚」（σκήνωμα，1:13–14），<strong>而这帐棚快要拆了<\/strong>。他写到那一座山：<\/p>\n<blockquote>\n<p>「我们从前将我们主耶稣基督的大能和他降临的事告诉你们，并不是随从乖巧捏造的虚言，乃是亲眼见过他的威荣。」（1:16） 「我们同他在圣山的时候，亲自听见这声音从天上出来。」（1:18）<\/p>\n<\/blockquote>\n<p>1:15「我去世以后」的「去世」原文 <strong>ἔξοδος<\/strong>——<strong>出埃及的那个字<\/strong>；路加记载登山变像时，摩西、以利亚与主谈论的正是他「去世」（ἔξοδον，路 9:31）的事。<strong>彼得在山上听见主谈论他的「出埃及」，自己却只想搭帐棚；如今他用同一个字谈自己的离世——死亡不是结束，是一次出埃及。<\/strong> 321 说「从暂时观点改变成永恒观点」：<strong>年轻的彼得想把荣耀留在帐棚里；年老的彼得知道，帐棚是要拆的，荣耀是要等的。<\/strong><\/p>\n<p><strong>三、因为他知道「不承认主」是什么意思<\/strong><\/p>\n<blockquote>\n<p>「将来在你们中间也必有假师傅，私自引进陷害人的异端，连买他们的主他们也不承认。」（2:1）<\/p>\n<\/blockquote>\n<p>「不承认」原文 <strong>ἀρνούμενοι<\/strong>——<strong>正是彼得在大祭司院子里三次不认主的那个字<\/strong>（太 26:70、72；路 22:57）。<strong>写这句话的人，自己不承认过主。<\/strong> 他和假师傅的分别不是「他从来没有否认过」，而是：<strong>他哭了，他回头了，他被主接回来了<\/strong>（路 22:61–62；约 21:15–17）。<\/p>\n<p>所以第 2 章那一连串严厉的话，不是一个完美的人居高临下的定罪，<strong>是一个曾经站在悬崖边、被主拉回来的人，看见别人正往下走时的大声呼喊。<\/strong> 321 说「谦卑战胜骄傲」——<strong>彼得后书第 2 章最难的功课，是怎样讲假师傅而自己不变成法利赛人。<\/strong><\/p>\n<p><strong>四、因为这卷书把「长进」排成一张清单<\/strong><\/p>\n<blockquote>\n<p>「正因这缘故，你们要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知识；有了知识，又要加上节制；有了节制，又要加上忍耐；有了忍耐，又要加上虔敬；有了虔敬，又要加上爱弟兄的心；有了爱弟兄的心，又要加上爱众人的心。」（1:5–7）<\/p>\n<\/blockquote>\n<p><strong>从信心开始，到爱结束，中间八个台阶。<\/strong> 「加上」原文 <strong>ἐπιχορηγήσατε<\/strong>——古希腊城邦里，富人出资供应合唱团演出的那个字：<strong>不是勉强凑数，是慷慨地供应<\/strong>。<\/p>\n<p>而这张清单前面有两节，次序绝对不可颠倒：<\/p>\n<blockquote>\n<p>「神的神能已将一切关乎生命和虔敬的事赐给我们……因此，他已将又宝贵又极大的应许赐给我们，叫我们……得与神的性情有分。」（1:3–4）<\/p>\n<\/blockquote>\n<p><strong>先是「神已将一切赐给」，然后才是「你们要分外地殷勤」。<\/strong> 321 说「先生命，再关系，后事工」；<strong>彼得后书说：先有神给的生命，才有我们加上的台阶。<\/strong> 长进不是爬上去见神，是神已经下来给了一切，我们才在其中长大。<\/p>\n<p>（铁律五在这里最危险：1:5–7 的八个台阶与 321「改变观念的八大步骤」同为八项，<strong>绝不可讲成「彼得也有八大步骤」<\/strong>。两者是两回事：彼得的八项是<strong>品格的果子<\/strong>，321 的八步是<strong>观念改变的过程<\/strong>。讲台只能说：两者都从神的恩典开始，都以繁殖／爱众人结束——「这使我们想起」，不是「这就是」。见 8.1。）<\/p>\n<p><strong>五、因为他称保罗为「我们所亲爱的兄弟」<\/strong><\/p>\n<blockquote>\n<p>「就如我们所亲爱的兄弟保罗，照着所赐给他的智慧写了信给你们。」（3:15）<\/p>\n<\/blockquote>\n<p>保罗曾在安提阿<strong>当面抵挡彼得<\/strong>，因为他「有可责之处」（加 2:11）——那一次的责备，写进了加拉太书，读遍所有教会。<strong>一个被公开纠正过的使徒，在临终的信里称纠正他的人为「我们所亲爱的兄弟」，而且承认他的信是「经书」<\/strong>（3:16）。<\/p>\n<p>321 说「无己才能合一」「谦卑带动谦卑，达到双赢」——<strong>新约里没有比 3:15 更安静、也更动人的一个例证。<\/strong> 彼得没有替自己辩护，没有提那一次的事；他只说：保罗有神所赐的智慧，他的信有些难明白，<strong>但那不是保罗的问题，是「无学问、不坚固的人」强解的问题<\/strong>。<\/p>\n<p><strong>六、因为「坚固」是彼得一生的字<\/strong><\/p>\n<p>主被卖那一夜：「你回头以后，要坚固你的弟兄。」（路 22:32，στήρισον） 彼得前书最后：「必要亲自……坚固你们。」（彼前 5:10，στηρίξει） <strong>彼得后书开头：「并且在你们已有的真道上坚固。」<\/strong>（1:12，ἐστηριγμένους） <strong>彼得后书结尾：「免得……就从自己坚固的地步上坠落。」<\/strong>（3:17，στηριγμοῦ）<\/p>\n<p><strong>彼得后书被「坚固」这个字框起来。<\/strong> 中间是两种「不坚固」的人：「勾引那心不坚固的人」（2:14，ἀστηρίκτους）、「无学问、不坚固的人强解」（3:16，ἀστήρικτοι）。<strong>主给彼得的那份功课，他做到了最后一封信的最后一段。<\/strong> 这是 321「920」最长的一条线：一个被主坚固的人，用一生坚固他的弟兄。<\/p>"},{"t":"星・井・天：全卷结构","html":"<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>篇<\/th>\n<th>章<\/th>\n<th>字<\/th>\n<th>主题<\/th>\n<th>出处<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>一<\/td>\n<td>1<\/td>\n<td><strong>星<\/strong><\/td>\n<td>长进与确据：同得宝贵的信心、神能赐下一切、与神的性情有分、八个台阶、眼瞎与健忘、蒙召拣选坚定、永不失脚、帐棚将拆、亲眼见过威荣、圣山上的声音、更确的预言、灯照暗处、晨星出现、圣灵感动<\/td>\n<td>「晨星在你们心里出现」（1:19）<\/td>\n<\/tr>\n<tr>\n<td>二<\/td>\n<td>2<\/td>\n<td><strong>井<\/strong><\/td>\n<td>分辨与审判：假先知与假师傅、不承认买他们的主、贪心捏造、天使挪亚所多玛、义人罗得、主知道搭救、胆大任性、没有灵性的畜类、巴兰与驴、无水的井、狂风催逼的雾气、应许自由却作奴仆、后来的景况比先前更不好、狗与猪<\/td>\n<td>「这些人是无水的井」（2:17）<\/td>\n<\/tr>\n<tr>\n<td>三<\/td>\n<td>3<\/td>\n<td><strong>天<\/strong><\/td>\n<td>等候与长进：提醒、好讥诮的人、应许在哪里、水与火、一日如千年、不是耽延乃是宽容、像贼来到、该当怎样圣洁、切切仰望、新天新地、安然见主、亲爱的兄弟保罗、防备坠落、在恩典和知识上有长进、愿荣耀归给他<\/td>\n<td>「盼望新天新地」（3:13）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>三个字是三种光景<\/strong>：<strong>星<\/strong>——里面的光（真道照进心里）；<strong>井<\/strong>——外面的干（假的源头给不出水）；<strong>天<\/strong>——前面的家（义居在其中的新天新地）。<strong>一个人从心里有晨星，才认得出哪一口井是干的，才不会被干井困住，一路走到新天新地。<\/strong><\/p>"},{"t":"全卷主轴：在恩典和知识上有长进","html":"<p>前几卷的主轴：雅各书是「一面镜子」，彼得前书是「一串脚印」；<strong>彼得后书的主轴是一棵正在长的树——根在神已赐下的一切（1:3），长在提醒与真道里（1:12），抵挡假教训的风（第 2 章），等候收成的日子（第 3 章），最后一句是「有长进」（3:18）。<\/strong><\/p>\n<p>|—:|—|—| | 1 | <strong>1:3–4<\/strong> | 「神的神能已将一切……赐给我们」——起点：一切都已经给了 | | 2 | <strong>1:5–8<\/strong> | 「你们要分外地殷勤……加上」——回应：在已有的上面长 | | 3 | <strong>1:16–19<\/strong> | 「亲眼见过他的威荣……如同灯照在暗处」——根据：不是捏造，是见证与圣经 | | 4 | <strong>2:1<\/strong> | 「连买他们的主他们也不承认」——危险：从里面来 | | 5 | <strong>2:9<\/strong> | 「主知道搭救敬虔的人」——<strong>全卷枢纽<\/strong>：审判再重，搭救更确定 | | 6 | <strong>2:19<\/strong> | 「人被谁制伏就是谁的奴仆」——假自由的真相 | | 7 | <strong>3:9<\/strong> | 「不是耽延，乃是宽容……不愿有一人沉沦」——等候的意义 | | 8 | <strong>3:13<\/strong> | 「盼望新天新地，有义居在其中」——终点的样子 | | 9 | <strong>3:17–18<\/strong> | 「免得……坠落。你们却要……有长进。愿荣耀归给他」——收束 |<\/p>\n<p><strong>枢纽为什么是 2:9？<\/strong> 2:4–8 是三个审判的例子（犯罪的天使、挪亚时代、所多玛），<strong>每一个审判里都藏着一个被保守的人<\/strong>（挪亚「传义道的」2:5；罗得「义人」2:7）；2:9 把它讲出来：<strong>「主知道搭救敬虔的人脱离试探，把不义的人留在刑罚之下。」<\/strong> 第 2 章所有严厉的话，都挂在这一节上：<strong>彼得讲审判，是为了叫敬虔的人安心，不是为了叫他们害怕。<\/strong> 第 1 章的「永不失脚」（1:10）与第 3 章的「安然见主」（3:14）也都系在这一节。<\/p>"},{"t":"真的知识与假的自由","html":"<p>雅各书用「从上头来的与从下面来的」，彼得前书用「能坏的与不能坏的」；<strong>彼得后书用「认识主」与「被制伏」：<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th><\/th>\n<th>认识主（ἐπίγνωσις）的人<\/th>\n<th>假师傅与跟随的人<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>源头<\/td>\n<td>「皆因我们认识那……召我们的主」（1:3）<\/td>\n<td>「私自引进陷害人的异端」（2:1）<\/td>\n<\/tr>\n<tr>\n<td>对主<\/td>\n<td>「我们主救主耶稣基督」（1:11；3:18）<\/td>\n<td>「连买他们的主他们也不承认」（2:1）<\/td>\n<\/tr>\n<tr>\n<td>话语<\/td>\n<td>「并不是随从乖巧捏造的虚言」（1:16）<\/td>\n<td>「用捏造的言语在你们身上取利」（2:3）<\/td>\n<\/tr>\n<tr>\n<td>眼睛<\/td>\n<td>「亲眼见过他的威荣」（1:16）<\/td>\n<td>「满眼是淫色」（2:14）；「就是眼瞎，只看见近处的」（1:9）<\/td>\n<\/tr>\n<tr>\n<td>记忆<\/td>\n<td>「我却要将这些事常常提醒你们」（1:12）<\/td>\n<td>「他们故意忘记」（3:5）<\/td>\n<\/tr>\n<tr>\n<td>自由<\/td>\n<td>「得与神的性情有分」（1:4）——脱离败坏<\/td>\n<td>「应许人得以自由，自己却作败坏的奴仆」（2:19）<\/td>\n<\/tr>\n<tr>\n<td>道路<\/td>\n<td>「义路」（2:21）<\/td>\n<td>「离弃正路」（2:15）；「随从巴兰的路」（2:15）<\/td>\n<\/tr>\n<tr>\n<td>结局<\/td>\n<td>「丰丰富富地得以进入……永远的国」（1:11）<\/td>\n<td>「自取速速的灭亡」（2:1）<\/td>\n<\/tr>\n<tr>\n<td>脚步<\/td>\n<td>「就永不失脚」（1:10）<\/td>\n<td>「从自己坚固的地步上坠落」（3:17）是要防备的<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>φθορά（败坏）的一条线<\/strong>：1:4「脱离世上从情欲来的败坏」→ 2:12「必在他们的败坏中灭亡」→ 2:19「作败坏的奴仆」。<strong>假师傅应许的「自由」，正是 1:4 神要救我们脱离的那个东西。<\/strong> 321「旧人有己以自己为中心，自己要作主作王」——<strong>2:10「胆大任性」（αὐθάδεις，自以为是、随己意）就是「有己」的希腊字；2:19 说出它的结局：自己作主的人，最后被别的东西作主。<\/strong><\/p>"},{"t":"321 原型对照表","html":"<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>321 结构<\/th>\n<th>彼得后书原型<\/th>\n<th>经文<\/th>\n<th>重点<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>基础一・耶稣是我的榜样<\/strong><\/td>\n<td>「亲眼见过他的威荣……『这是我的爱子，我所喜悦的』」<\/td>\n<td><strong>1:16–17<\/strong><\/td>\n<td>榜样先是被父喜悦的那一位：<strong>我们效法的不是一套规条，是一个被看见的人<\/strong><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「那用自己荣耀和美德召我们的主」<\/td>\n<td><strong>1:3<\/strong><\/td>\n<td>「美德」ἀρετή 与 1:5「德行」<strong>同一个字<\/strong>——他有的，他召我们加上<\/td>\n<\/tr>\n<tr>\n<td><strong>基础二・圣经是我的准则<\/strong><\/td>\n<td>「我们并有先知更确的预言，如同灯照在暗处」<\/td>\n<td><strong>1:19<\/strong><\/td>\n<td><strong>全卷的 321 基础二<\/strong>：天亮以前，灯就是准则<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「经上所有的预言没有可随私意解说的」<\/td>\n<td><strong>1:20<\/strong><\/td>\n<td>准则不随私意（立场三；红线八：也不是「只有牧师能解」）<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「保罗……的信……强解，就自取沉沦」<\/td>\n<td><strong>3:16<\/strong><\/td>\n<td>新约第一次把使徒书信称为「经书」<\/td>\n<\/tr>\n<tr>\n<td><strong>基础三・圣灵是我的引导<\/strong><\/td>\n<td>「乃是人被圣灵感动，说出神的话来」<\/td>\n<td><strong>1:21<\/strong><\/td>\n<td>「感动」φερόμενοι——<strong>像帆船被风推着走<\/strong>（这使我们想起徒 27:15、17 同一个字）<\/td>\n<\/tr>\n<tr>\n<td><strong>核心一・让耶稣作王<\/strong><\/td>\n<td>「丰丰富富地得以进入我们主救主耶稣基督永远的国」<\/td>\n<td><strong>1:11<\/strong><\/td>\n<td>国是他的，<strong>而且是「永远的」<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>核心二・让耶稣得一切荣耀<\/strong><\/td>\n<td>「愿荣耀归给他，从今直到永远。阿们！」<\/td>\n<td><strong>3:18<\/strong><\/td>\n<td><strong>全卷最后一句；新约少数直接归给基督的颂赞之一<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>目的・建立属神的体系<\/strong><\/td>\n<td>「盼望新天新地，有义居在其中」<\/td>\n<td><strong>3:13<\/strong><\/td>\n<td>属神体系的终局：<strong>一个「义」安家的地方<\/strong>——「居」κατοικεῖ，住下来不走<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「切切仰望神的日子来到」<\/td>\n<td><strong>3:12<\/strong><\/td>\n<td>「切切仰望」σπεύδοντας 也可译「催促、加速」——<strong>等候不是坐着，是参与<\/strong>（321「迈进末后的大复兴，迎接主耶稣再来」；但绝不算日子，红线三）<\/td>\n<\/tr>\n<tr>\n<td><strong>问题的根源・有己与骄傲<\/strong><\/td>
