<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#FAF6EC;color:#2B2A28;font-family:"PingFang TC","PingFang SC","Noto Sans CJK TC","Noto Sans CJK SC","Microsoft JhengHei","Microsoft YaHei",sans-serif;line-height:1.75;word-wrap:break-word;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
.serif,.v,.mv-t,.poem,.serm p,.serm blockquote{font-family:"Songti TC","Songti SC","Noto Serif CJK TC","Noto Serif CJK SC","PMingLiU","SimSun",serif}
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:#051434;background:linear-gradient(135deg,#0E2C64,#051434);color:#F3E7CC;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;border-bottom:2px solid #E2B86A}
#top img{width:30px;height:30px;border-radius:7px;margin-right:10px;flex:0 0 30px}
#top .tt{flex:1;min-width:0}
#top .t1{font-size:.95rem;font-weight:700;color:#E2B86A;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .t2{font-size:.72rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{max-width:720px;margin:0 auto;padding:62px 14px 92px;padding-top:calc(62px + env(safe-area-inset-top));padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#051434;display:flex;border-top:1px solid #E2B86A;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:#B9C3D9;padding:7px 0 6px;font-size:.7rem;line-height:1.2}
#nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:#E2B86A}
h1,h2,h3,h4{line-height:1.4;margin:.6em 0 .4em}
h2{font-size:1.2rem;color:#0E2C64}
h3{font-size:1.05rem;color:#0E2C64}
p{margin:.45em 0}
.card{background:#FFFDF7;border:1px solid #E8DFC9;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(5,20,52,.05)}
.lab{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:#8A6A2A;background:#F6ECD6;border-radius:6px;padding:1px 8px;margin-bottom:4px}
.mute{color:#6E6A60;font-size:.85rem}
.faint{color:#7D786B;font-size:.85rem;background:#F3EEE1;border-left:3px solid #D9CBA8;padding:6px 10px;border-radius:0 8px 8px 0;margin:6px 0}
.hero{background:#0E2C64;background:linear-gradient(160deg,#0E2C64 0%,#051434 100%);color:#F3E7CC;border-radius:16px;padding:20px 16px 18px;margin:6px 0 14px;text-align:center;position:relative;overflow:hidden}
.hero img{width:64px;height:64px;border-radius:14px;border:1px solid rgba(226,184,106,.6)}
.hero h1{color:#E2B86A;font-size:1.3rem;margin:.5em 0 .2em;letter-spacing:.05em}
.hero .sub{font-size:.8rem;opacity:.85}
.arcs{display:flex;margin:0 -4px}
.arc{flex:1;cursor:pointer;margin:0 4px;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.arc .big{font-size:1.9rem;color:#0E2C64;font-weight:700;line-height:1.2}
.arc .big span{color:#E2B86A}
.arc .c{font-size:.72rem;color:#8A6A2A;font-weight:700}
.arc .tl{font-size:.78rem;line-height:1.45;margin-top:4px}
.arc .pg{height:4px;background:#EFE6D1;border-radius:2px;margin-top:6px;overflow:hidden}
.arc .pg i{display:block;height:100%;background:#E2B86A}
.btn{display:inline-block;background:#0E2C64;color:#F3E7CC;border:0;border-radius:10px;padding:8px 14px;font-size:.9rem;margin:4px 4px 4px 0}
.btn.gold{background:#E2B86A;color:#051434;font-weight:700}
.btn.ghost{background:transparent;color:#0E2C64;border:1px solid #0E2C64}
.btn.sm{padding:4px 10px;font-size:.8rem}
.wide{display:block;width:100%;text-align:center}
.chips{margin:4px 0 8px}
.chip{display:inline-block;border:1px solid #CDBF9C;background:#FFFDF7;color:#0E2C64;border-radius:999px;padding:3px 12px;margin:3px 4px 3px 0;font-size:.85rem}
.chip.on{background:#0E2C64;color:#E2B86A;border-color:#0E2C64}
.subs{display:flex;flex-wrap:wrap;margin:6px -3px 10px}
.subs button{flex:0 0 25%;max-width:25%;padding:3px;background:none;border:0}
.subs button span{display:block;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:9px;padding:6px 0;font-size:.85rem;color:#0E2C64}
.subs button.on span{background:#0E2C64;color:#E2B86A;border-color:#0E2C64;font-weight:700}
.subs button.lsn span{background:#F6ECD6;border-color:#E2B86A;color:#6B4E14}
.chhead{border-left:4px solid #E2B86A;padding:2px 0 2px 10px;margin:8px 0}
.chhead .k{font-size:.8rem;color:#8A6A2A;font-weight:700}
.chhead .t{font-size:1.1rem;font-weight:700;color:#0E2C64;line-height:1.45}
.v{margin:.35em 0;font-size:1.05rem;line-height:1.9}
.v sup{color:#B08433;font-weight:700;font-size:.68em;margin-right:3px;font-family:sans-serif}
.grkbox{background:#F4EFE2;border-radius:10px;padding:6px 12px;margin:6px 0 12px;font-size:.95rem}
.grkbox .lab{background:#E9DDBF}
.rich blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid #E2B86A;background:#FBF5E6;border-radius:0 8px 8px 0}
.rich blockquote p{margin:.2em 0}
[lang=grc],.grk{font-family:"Gentium Plus","Noto Serif","Times New Roman",serif}
.rich table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;border-collapse:collapse;font-size:.82rem;margin:6px 0;line-height:1.5}
.rich th,.rich td{border:1px solid #E1D6BD;padding:4px 6px;vertical-align:top;min-width:4.5em}
.rich th{background:#0E2C64;color:#F3E7CC;font-weight:600;white-space:nowrap}
.rich ul,.rich ol{padding-left:1.3em;margin:.3em 0}
.rich strong{color:#0E2C64}
.blk h3{margin:0 0 4px}
.star{color:#C9962E;letter-spacing:1px}
.sec{border-top:1px dashed #E1D6BD;margin-top:8px;padding-top:4px}
.utxt{font-size:.92rem;color:#3F3C35;background:#FBF8F0;padding:4px 10px;border-radius:8px}
.notebtn{background:none;border:1px solid #CDBF9C;color:#8A6A2A;border-radius:999px;font-size:.75rem;padding:2px 10px;margin:6px 0 0}
.notebtn.has{background:#E2B86A;color:#051434;border-color:#E2B86A}
.notebox{display:none;margin-top:6px}
.notebox.on{display:block}
textarea,input[type=search],input[type=text]{width:100%;font:inherit;font-size:.95rem;border:1px solid #CDBF9C;border-radius:10px;padding:8px 10px;background:#FFFDF7;color:#2B2A28}
textarea{min-height:5.5em;resize:vertical}
.serm h3{text-align:center;color:#0E2C64;margin-top:1.2em}
.serm h3.first{font-size:1.2rem}
.serm p{margin:.25em 0;font-size:1.02rem}
.serm blockquote{margin:.6em 0;padding:6px 12px;background:#FBF5E6;border-left:3px solid #E2B86A;border-radius:0 8px 8px 0;color:#3B2F15}
.tts{display:flex;flex-wrap:wrap;align-items:center;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:10px;padding:6px 8px;margin:8px 0}
.tts .btn{margin:2px 6px 2px 0}
.tts .st{font-size:.78rem;color:#6E6A60}
.poem{white-space:pre-line;line-height:1.95;font-size:1rem}
.mv{background:#0E2C64;color:#F3E7CC;border-radius:12px;padding:14px;margin:10px 0}

.mv .cover{background:#1A3A78;color:#9FB0D3;border-radius:8px;padding:12px;text-align:center}
.ol{padding-left:0;list-style:none;margin:6px 0}

.tools .item small{color:#6E6A60}
.back{background:none;border:0;color:#0E2C64;padding:4px 0;font-size:.9rem}
.tog{display:block;width:100%;text-align:left;background:none;border:0;padding:0}

.grphd{margin:16px 0 4px;font-weight:700;color:#8A6A2A;border-bottom:2px solid #E2B86A;padding-bottom:2px}
.deep{background:#F6ECD6;border-radius:10px;margin:8px 0;padding:0}
.deep .q{padding:8px 12px;font-weight:700;color:#6B4E14;font-size:.92rem}
.deep .a{display:none;padding:0 12px 10px;font-size:.92rem}
.deep.open .a{display:block}
.hua h3{background:#0E2C64;color:#E2B86A;border-radius:8px;padding:6px 10px}
.qn{display:flex;margin:6px 0}
.qn b{flex:0 0 2em;color:#0E2C64}
.qn .lv{color:#C9962E;font-size:.8rem;margin-right:4px;white-space:nowrap}
.stop{position:relative;padding:0 0 10px 22px;margin:0}
.stop:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:#E1D6BD}
.stop:after{content:"";position:absolute;left:1px;top:7px;width:8px;height:8px;border-radius:50%;background:#FFFDF7;border:2px solid #0E2C64}
.stop.top:after{background:#E2B86A;border-color:#B08433;width:10px;height:10px;left:0;top:6px}
.stop.bot:after{background:#9B3B2E;border-color:#9B3B2E}
.big-gk{font-size:1.5rem;color:#0E2C64}
.sres{display:block;width:100%;text-align:left;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.88rem}
.sres b{color:#8A6A2A;font-size:.76rem;display:block}
mark{background:#F5DC9E;color:inherit;padding:0 1px}
.flash{-webkit-animation:fl 1.6s;animation:fl 1.6s}
@-webkit-keyframes fl{0%{background:#F5DC9E}100%{background:transparent}}
@keyframes fl{0%{background:#F5DC9E}100%{background:transparent}}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EFE6D1}
.row .l{flex:1;min-width:0;padding-right:8px}
.sw{width:50px;height:28px;border-radius:14px;background:#CFC6B1;border:0;position:relative;flex:0 0 50px}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;-webkit-transition:left .15s;transition:left .15s}
.sw.on{background:#0E2C64}
.sw.on:after{left:25px;background:#E2B86A}
input[type=range]{width:100%}
#modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,20,52,.86);z-index:50;display:none;padding:20px;overflow:auto}
#modal.on{display:block}
#modal .box{max-width:420px;margin:12vh auto 0;background:#FAF6EC;border-radius:16px;padding:20px 16px;text-align:center}
#modal .box .btn{display:block;width:100%;margin:10px 0;padding:12px}
.svgwrap{background:#FFFDF7;border:1px solid #E8DFC9;border-radius:12px;padding:6px}
.svgwrap svg{display:block;width:100%;height:auto}
.tpl{display:flex;align-items:flex-start;padding:6px 4px;border-bottom:1px solid #EFE6D1;font-size:.88rem;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.tpl.on{background:#F6ECD6}
.tpl .n{flex:0 0 24px;height:24px;border-radius:50%;background:#0E2C64;color:#E2B86A;text-align:center;line-height:24px;font-size:.72rem;margin-right:8px}
.tpl .n.top{background:#E2B86A;color:#051434}
.tpl .n.bot{background:#9B3B2E;color:#fff}
.truth{border-left:3px solid #E2B86A;padding-left:10px;margin:10px 0}
.foot{text-align:center;font-size:.72rem;color:#9A9384;margin:20px 0 0}
/* 深色模式 */
body.dark{background:#0A1430;color:#E7E0CE}
body.dark h2,body.dark h3,body.dark .rich strong,body.dark .chhead .t,body.dark .arc .big,body.dark .tools .item b,body.dark .iss .hd,body.dark .qn b,body.dark .back,body.dark .big-gk,body.dark .serm h3{color:#E2B86A}
body.dark .card,body.dark .arc,body.dark .tts,body.dark .tools .item,body.dark .sres,body.dark .svgwrap,body.dark .subs button span,body.dark .chip{background:#12224A;border-color:#2A3E6E;color:#E7E0CE}
body.dark .chip.on,body.dark .subs button.on span{background:#E2B86A;color:#051434;border-color:#E2B86A}
body.dark .subs button.lsn span{background:#2A2A1E;color:#E2B86A;border-color:#8A6A2A}
body.dark .mute,body.dark .tools .item small,body.dark .tts .st{color:#A9A28F}
body.dark .faint{background:#152650;color:#B7B09D;border-left-color:#5A6A90}
body.dark .lab{background:#2A3456;color:#E2B86A}
body.dark .rich blockquote,body.dark .serm blockquote,body.dark .grkbox,body.dark .utxt,body.dark .iss .pos{background:#16285A;color:#E7E0CE}
body.dark .rich th{background:#051434}
body.dark .rich th,body.dark .rich td{border-color:#2A3E6E}
body.dark .deep{background:#1E2A44}
body.dark .deep .q{color:#E2B86A}
body.dark textarea,body.dark input[type=search],body.dark input[type=text]{background:#0F1C40;color:#E7E0CE;border-color:#2A3E6E}
body.dark .btn.ghost{color:#E2B86A;border-color:#E2B86A}
body.dark .row,body.dark .check,body.dark .tpl{border-color:#24365F}
body.dark .tpl.on{background:#1E2A44}
body.dark .stop:after{background:#0A1430;border-color:#E2B86A}
body.dark .stop.top:after{background:#E2B86A}
body.dark .stop.bot:after{background:#C46A5C;border-color:#C46A5C}
body.dark .safe .s1{color:#E89A8C}
body.dark .safe .s3{color:#8FC9A9}
body.dark #modal .box{background:#12224A}
body.dark .v{color:#EDE6D4}
body.dark .notebtn{color:#E2B86A;border-color:#8A6A2A}
body.dark .notebtn.has{color:#051434}
body.dark .chhead .k,body.dark .grphd,body.dark .trk .h{color:#E2B86A}
body.dark mark{background:#8A6A2A;color:#fff}
body.dark .utxt,body.dark .check.done span{color:#C9C2AE}
body.dark .t-band{fill:#12224A}
body.dark .t-band2{fill:#0F1C40}
body.dark .t-txt{fill:#E7E0CE}
body.dark .t-axis{stroke:#2A3E6E}
</style>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"直等到天发亮，晨星在你们心里出现","sub":"赐下、加上、照亮","lv":"A","arc":"星","sec":[["1:1--2","问安——同得一样宝贵的信心，因认识主而多多加给的恩惠平安"],["1:3--4","神能已赐下一切——又宝贵又极大的应许，与神的性情有分"],["1:5--11","八个台阶——从信心加到爱众人，永不失脚，丰丰富富进入永远的国"],["1:12--15","帐棚快拆了——临终的提醒、激发与记念"],["1:16--18","不是捏造的虚言——圣山上亲眼见过的威荣、亲耳听见的声音"],["1:19--21","灯照在暗处——更确的预言、晨星与圣灵的感动"]],"serm":{"pts":[["一切都已经给了","1:3--4","长进不是爬上去见神，是神已经下来把一切赐给我们。"],["所以要加上","1:5--11","恩典不叫人闲懒，恩典叫人分外殷勤；台阶的终点是爱人。"],["灯与晨星","1:12--21","天亮以前，神的话是照在暗处的灯；我们留意它，直到晨星在心里出现。"]]},"q":"许多基督徒把信仰活成一种「还差一点」：再多一次聚会、再多一次特别的经历、再多读一本书，才算够属灵；也有人反过来想：反正已经得救了，长不长进没有什么分别。一位快要殉道的老使徒，在临终的信里两种都不接受。他先说：「神的神能已将一切关乎生命和虔敬的事赐给我们」——你不缺；接着说：「正因这缘故，你们要分外地殷勤」——你要长，而且要长到爱众人；最后说：天亮以前，神的话「如同灯照在暗处」，留意它，「直等到天发亮，晨星在你们心里出现」。长进不是爬上去见神，是神已经下来把一切赐给我们，我们才在其中长大。","truth":"神的神能已将一切赐给我们，所以我们要在信心里一层一层加上，直到爱众人；天亮以前留意那照在暗处的灯，直等到晨星在心里出现。","mv":{"t":"神的神能已将一切关乎生命和虔敬的事赐给我们，皆因我们认识那用自己荣耀和美德召我们的主。","r":"彼后1:3--3"},"card":["一位知道帐棚快拆的老使徒，先宣告神的神能已将一切关乎生命和虔敬的事赐给我们，叫我们脱离败坏、与神的性情有分；因此要在信心里加上德行，一直加到爱众人，使蒙召坚定、永不失脚。他提醒我们：所信的不是捏造的虚言，是圣山上亲眼见过的威荣；天亮以前，要留意那照在暗处的灯。","δεδωρημένης——「已将……赐给」是完成式；ἐπιχορηγήσατε——「加上」是慷慨的供应。先有神的完成式，才有人的命令式。","神已将一切赐给我们（完成式，至今仍在手中）；旧日的罪已经得了洁净（1:9）；你在信心里慷慨供应，神必将进入永远之国的入口，丰丰富富地供应给你（1:11，将来式被动）。","无己，是承认一切都是领受的。与神的性情有分，是进入与无限之神的相交，不是人变成无限；帐棚要拆，名字要被忘记，被记念的应当是那一位。","「一切我都已经给了你。天亮以前，留意我的话；那晨星就是我。」","这一周每天早上读彼后 1:3–11，从八项里挑出你最缺的一项，求主在你信心里供应它，并且向一个具体的人活出来。","最终整合：一个老人提笔，\n他知道帐棚快拆了。\n\n他想起那一座山——\n荣光、云彩、天上来的声音：\n「这是我的爱子，我所喜悦的。」\n那一天他只想搭三座棚，\n把光留在山上。\n\n如今他知道，\n光是留不住的，\n光是要等的。\n是主陪他等了三十年。\n\n所以他把一盏灯交给我们：\n先知更确的预言，\n照在又干又暗的地方。\n它不是太阳，\n只照亮脚前一步；\n可是天亮以前，\n这就够了。\n\n留意它。\n在信心里加上德行，\n一层一层，\n一直加到爱众人。\n\n直等到天发亮，\n晨星在你们心里出现——\n那时灯可以放下，\n因为光本人来了。"],"self":"眼瞎的定义：只看见近处的，忘了自己旧日的罪已经得了洁净——忘记恩典的人，长不出爱。","t321":{"k":"「这是我的爱子，我所喜悦的」（1:17）。：\\ > 我们效法的不是一套规条，是圣山上那一位被父喜悦的儿子。 > > 而且他「用自己荣耀和美德召我们」（1:3）——「美德」ἀρετή 与 1:5「德行」是同一个字。\\ > 他身上有的，他召我们在信心里加上；榜样不是站在远处叫我们爬，是走在前面、把自己的样子分给我们。","g":"「直等到天发亮，晨星在你们心里出现」（1:19）。：\\ > 让耶稣作王，就是让光照进「心里」，不是只在脑子里多一条知识。 > > 天亮以前，我交出的是自己的灯、自己的闪光、自己的私意，只留意他的话。\\ > 国也是他的：「我们主救主耶稣基督永远的国」（1:11）——进那国的门，是他亲手丰丰富富打开的。","p":"「有了爱弟兄的心，又要加上爱众人的心」（1:7）。：\\ > 八个台阶的终点不是一个人多属灵，是他多能爱人。 > > 属神的体系不是先盖组织，是从神赐下的生命长出来：先生命（1:3–4 神已赐下一切），再关系（1:7 爱弟兄、爱众人），后事工（1:8 不至于闲懒不结果子）。\\ > 次序颠倒，事工就成了没有根的忙碌。"},"grp":["【一、破冰】你曾经在什么时候觉得「我还差一点才够属灵」？那一点，你当时以为是什么？","【二、扎心】1:9 说没有这几样的人「只看见近处的，忘了他旧日的罪已经得了洁净」。这一个月，你眼睛最常盯着的「近处」是什么？你上一次为自己被赦免而感恩，是什么时候？","【三、福音】1:3 说神「已将一切」赐给我们，用的是完成式。如果这是真的，你最近一直在向神「要」的那一样，会不会其实是要你更深地认识那一位已经给了一切的主？","【四、行动】从 1:5–7 八项（德行、知识、节制、忍耐、虔敬、爱弟兄的心、爱众人的心）里，选出你最缺的一项。这一周，你要向谁、在什么场合，具体地活出这一项？","【五、代祷】1:19 说要留意那照在暗处的灯。请组员两两一组，为对方正在经历的那一段「暗处」祷告，求主的话成为他脚前的灯，直到天发亮。"],"prac":{"main":"这一周，每天早上读彼后 1:3–11，在信心里慷慨地加上一项","items":["对神：每天早上先读 1:3，用一句话感谢神已将一切关乎生命和虔敬的事赐给你，再开始一天的祷告。","对自己：做一次 1:9 的眼科检查——写下一件主赦免你的事，想起你被洁净的那一天。","对人：选一位教会外、不好爱的人，这一周为他做一件具体的事，操练「爱众人的心」。","对生活：每天睡前留意一节经文（1:19），把它写在手机桌布或便条上，让灯照在你明天的路上。","对使命：像彼得「常常提醒」一样，找出你的那一个「2」，把这周读到的一句话传给他，激发他。"]},"safe":["① 错误讲法：把 1:4「与神的性情有分」讲成人可以成为神，或修炼到与神同等。\n这不是彼得的意思；创造者与受造者的分别永远存在，有分是恩典，不是修炼（另见 ISS00_2）。\n检验标准：有没有明说人不会变成神、不与神的本质混同？有没有讲到有分的内容就是 1:5–7 的品格？","② 错误讲法：因为怕讲错，就把 1:4 跳过不讲，只讲 1:5–7 的「要加上」。\n跳过 1:4，八个台阶就失去了根，成了人的努力；1:4 是全卷最大的安慰：神要把自己的生命与品格分给我们。\n检验标准：1:4 在讲章里有没有被正面讲出来？会众听完，是更敬拜神，还是只多了一张待办清单？","③ 错误讲法：说「彼得也有八大步骤」，把 1:5–7 讲成 321 改变观念八大步骤的插图。\n两者是两回事：彼得的八项是品格的果子，321 的八步是观念改变的过程；最多只能说「这使我们想起」，而且要明说不是同一件事。\n检验标准：讲章里 1:5–7 有没有先照经文讲完？有没有出现「这就是」「正是」把两者相连？","④ 错误讲法：用 1:20「没有可随私意解说的」告诉会众不要自己读经，或说只有牧师才能解经。\n这是误用；1:20 讲的是预言的来源，1:21 的「因为」说明了这一点（另见 ISS00_3）。\n检验标准：有没有讲出读经的保护——在群体中读、照上下文读、谦卑地读？会众听完，是更想打开圣经，还是更不敢读？","⑤ 错误讲法：用 1:19「更确的预言」贬低一切属灵经历，说经历都不可靠、不必理会。\n彼得自己的见证就是一次经历（1:16–18）；这节的重点是经历证实了预言，不是拿经历和圣经比高低。\n检验标准：曾经在祷告或敬拜中真实遇见主的弟兄姐妹，听完是被尊重，还是被嘲笑？","⑥ 错误讲法：反过来用 1:16–18 抬高属灵经历，说「我也上过山、看过异象，所以要听我的」。\n彼得的经历把人指向「先知更确的预言」，不是指向他自己；经历要被圣经检验，不是圣经要被经历补充。\n检验标准：讲章里最后被高举的，是那盏灯和那晨星，还是讲员的经历？","⑦ 错误讲法：把彼得讲成英雄——临终从容、见过异象、一生坚固，好像全章的主角是他。\n每一处〔背景〕都要落在主身上：是主在海边重新叫他的名字，是主预告又陪他走了三十年，是主先为他祈求。\n检验标准：会众读完，是更佩服彼得，还是更爱那位恒久忍耐的主？","⑧ 错误讲法：跳过书信的处境，直接把每一节变成今天的励志格言。\n书信三问：受书人遇到什么（假师傅将要从里面起来、主再来被讥诮）？彼得从福音推出什么原则（神已赐下一切，所以要加上、要留意那灯）？今天这原则落在哪里（在信息混乱与属灵速成的时代，回到神的话上长进）？\n检验标准：三问有没有都答到？今天的应用是不是从第二问推出来的，不是另外加上去的？","⑨ 错误讲法：把 1:5–7 讲成得救的门票——八项都做到，神才接纳你。\n1:5 开头是「正因这缘故」，回指 1:3–4 神已经赐下的一切；台阶是从恩典长出来的，不是用来买恩典的。\n检验标准：讲章里神已赐下的一切（1:3–4），有没有讲在「你们要分外地殷勤」之前？","⑩ 错误讲法：用 1:10「使你们所蒙的恩召和拣选坚定不移」叫会众担心自己随时会被除名。\n源头在神，确据在生命；「坚定」是在已有的恩典上活出来的确认，「永不失脚」是应许，不是威胁（另见 ISS00_5）。\n检验标准：一位信心软弱的弟兄听完，是更有把握地殷勤，还是更焦虑地怀疑？","⑪ 错误讲法：用 1:9「就是眼瞎」去指着别人说「你看不清楚、你属灵近视」。\n这节是给自己的眼科检查，不是给别人的诊断书；病根是忘了恩典，药是「常常提醒」（1:12）。\n检验标准：讲员自己有没有先站在这节经文底下？","⑫ 错误讲法：把 1:3「一切关乎生命和虔敬的事」讲成神应许一切物质的丰富与成功。\n范围是「生命和虔敬」，管道是「认识那……召我们的主」；这不是成功神学的支票。\n检验标准：讲章里的「一切」，是指向更认识主，还是指向更多拥有？","⑬ 错误讲法：拿 1:1 的 Granville Sharp 规则或 1:19 的比较级在讲台上炫学，讲了半天文法却没有转成生命。\n原文的用处是叫人看见耶稣是「我们的神和救主」、看见那盏灯；三十秒内转不成生命的，留在书房。\n检验标准：每一处原文之后，会众有没有听见一句可以带回家的话？","⑭ 错误讲法：把 1:19「晨星在你们心里出现」讲成追求个人的新启示、新真理，好像灯不够用，要等更高的光。\n1:12 说的是「已有的真道」；晨星主要指主再来的那个早晨，今天留意灯光的人，是在预尝那光，不是另找一盏灯。\n检验标准：讲章有没有把人带回手中的圣经？有没有暗示某些人拥有别人没有的「新真理」？"]},{"n":2,"t":"这些人是无水的井，是狂风催逼的雾气","sub":"干井、搭救、回头","lv":"A","arc":"井","sec":[["2:1--3","假师傅的来路——从里面起来、不承认买他们的主、贪心取利"],["2:4--9","三个审判，两个搭救——天使、挪亚、所多玛与义人罗得；主知道搭救敬虔的人"],["2:10--16","任性与巴兰的路——轻慢、毁谤、引诱，一头驴拦阻先知的狂妄"],["2:17--19","无水的井——应许人自由，自己却作败坏的奴仆"],["2:20--22","回头的两种方向——狗回到所吐的，人回到主面前"]],"serm":{"pts":[["干井会从里面冒出来","2:1--3","危险不只在外面；先照自己，再分辨别人。"],["主知道搭救","2:4--10","审判再重，搭救更确定；讲审判是为了叫敬虔的人安心。"],["假自由与真回头","2:10--22","自己作主的人，最后被别的东西作主；只有回到主面前，才是真自由。"]]},"q":"你可能也问过：讲台上那么多声音，我怎么知道哪一个是真的？更痛的是，有些伤害正是从教会里面来的——一个你信任过的讲员，一笔说不清的奉献，一句「你批评我就是轻慢主治的」。彼得说得很直：「将来在你们中间也必有假师傅。」干井会从里面冒出来。但他接着用三个审判的例子，说出全章最要紧的一句：「主知道搭救敬虔的人。」审判再重，搭救更确定；彼得讲审判，是为了叫敬虔的人安心，不是叫他们害怕，更不是叫他们去怀疑每一个人。","truth":"干井会从里面冒出来，审判也一个不漏；但三个审判里藏着两次搭救——审判再重，搭救更确定：主知道搭救敬虔的人。","mv":{"t":"主知道搭救敬虔的人脱离试探，把不义的人留在刑罚之下，等候审判的日子。","r":"彼后2:9--9"},"card":["彼得预告假师傅会从教会里面起来：不承认买他们的主、贪心取利、放纵情欲、轻慢主治、应许人自由自己却作奴仆。他用天使、洪水、所多玛三个审判证明神必审判，又在其中指出挪亚与罗得两次搭救，说出全章枢纽：主知道搭救敬虔的人。最后他警告：回头有两种——狗回到所吐的，人回到主面前。","οἶδεν κύριος ῥύεσθαι——主不只是知道，他懂得怎样搭救；审判在条件子句里，搭救在主句里。","假师傅否认的，是一位付了价的主人（ἀγοράσαντα，过去式：价已经付了）；我们得救，也不是因为我们够好，是那拉着罗得的手、把我们从试探中拉出来的主。","有己就是 2:10 的「任性」——以自己为乐、自己作主；结局是 2:19 被别的东西作主。无己是回到本位：搭救是主的事，审判也是主的事，我只管敬虔。","「我知道怎样把你拉出来。你不必替我清理门户，只要跟着我。」","这一周，把 2:1–19 的五个记号（对基督、金钱、身体、权柄、自由）拿来先照自己，每天照一个，写下一句向主的回应。","最终整合：一个老人写下「不承认」三个字，\n手停了一下。\n他记得院子里的火，\n记得鸡叫，\n记得那一位转过身来看他。\n\n他写天使被拘禁，\n写洪水淹没上古的世代，\n写两座城烧成了灰。\n\n可是每一场审判里，\n都有一只伸出来的手——\n一条船上的八个人，\n一个被拉着手领出城外的罗得。\n\n于是他写下全章最长那句话的落点：\n「主知道搭救敬虔的人。」\n\n不是因为彼得很坚强，\n是因为那一夜主说过：\n「你回头以后，要坚固你的弟兄。」\n\n干井会干，雾气会散，\n审判一直醒着；\n但比审判更确定的，\n是那只没有放手的手。\n\n这就是无己：\n不替神宣判，不替神清理，\n回到本位，让神作神——\n他审判，他搭救，\n我们只管跟着他走。"],"self":"有己的定义：胆大任性（αὐθάδεις）——以自己为乐、随己意，自己作主，最后被别的东西作主（2:19）。","t321":{"k":"写「连买他们的主他们也不承认」（2:1）的人，自己不承认过主。> 「主转过身来看彼得……他就出去痛哭。」（路 22:61–62）\\ > 耶稣的榜样不在彼得身上，在那一位转过身来的主身上：他看见跌倒的人，没有转身离开，而是等他回来，还把「坚固你的弟兄」交给他。\\ > 所以我讲第 2 章，不是站在高处定别人的罪，是用被等回来的身分，向正往下走的人呼喊。","g":"假师傅「连买他们的主他们也不承认」（2:1）；我们是「让买我们的主作王」。> 付了价的主人（δεσπότης）有产权——我的时间、钱财、身体、口舌，都不是我自己的（林前 6:20）。\\ > 让耶稣作王的反面不是无神论，是「任性」（2:10）：口称主，生活里自己作主。\\ > 本周要交出的权力：替神宣判别人的权力，和「我可以控制」的那一件事。","p":"属神的体系不是没有领袖，是有属神记号的领袖。> 第 2 章被定罪的正是「师傅」——有讲台、有跟从者的人；所以属神体系的领袖要带着相反的记号：\\ > 对主，承认付了价的主人；对群羊，「不是辖制……乃是作群羊的榜样」（彼前 5:3）；对金钱，财务透明，「不但在主面前，就是在人面前」（林后 8:21）；对质疑，照程序、在爱中回应，不拿 2:10 堵口。\\ > 一口有水的井，不是最有名的井，是自己也在喝活水的井。"},"grp":["【一、破冰】你曾经在什么时候「被一个说法吸引」，后来才发现不是那么回事？（可以是广告、投资、或一句很动听的话，只说场景即可。）","【二、扎心】2:1–19 给了五个记号：对基督、对金钱、对身体、对权柄、对自由。先不看别人——这五个记号里，哪一个最照得到你自己？","【三、福音】2:4–9 三个审判里藏着两次搭救；罗得是被天使拉着手领出城的。你生命中有没有一次，是主「拉着你的手」把你从试探里带出来的？","【四、行动】2:19 说「人被谁制伏就是谁的奴仆」。说出一件你常说「我可以控制」、其实已经在控制你的事，这一周你要怎样把它交给主？","【五、代祷】为组里一位正在挣扎、或刚刚跌倒的人祷告（不必说出细节）：「主，你知道怎样搭救他；求你拉着他的手，带他回到你面前。」"],"prac":{"main":"这一周，用五个记号先照自己，再为一位「心不坚固」的人站在他身边","items":["对神：每天早上读一次 2:9，向主说：「主，你知道怎样搭救我；今天我不替你审判任何人。」","对自己：用五个记号（对基督、金钱、身体、权柄、自由）每天照一个，写下一句向主承认的话。","对人：找一位初信或刚离开旧生活的人（2:18「刚才脱离妄行的人」），本周约他吃一顿饭，陪他读一段经文。","对生活：找出一件你说「我可以控制」的事（荧幕、消费、饮食、情绪），本周为它设一条具体的界线，并告诉一位属灵同伴。","对使命：若你有服事或带领的位置，本周主动向同工或长执说明一笔你经手的帐目或一个决定；若没有，就为你教会的领袖祷告，求主保守他们不作干井。"]},"safe":["① 错误讲法：在讲台上点名今天某位牧师、某个教会、某个宗派或网络传道人是「2:1 的假师傅」\n彼得给的是辨认的记号，不是一张名单；讲台教会众分辨果子，不替会众判决（红线一）。\n检验标准：不同教会背景的人听完，是更会照自己、更会分辨果子，还是更想转贴「某某是假师傅」？","② 错误讲法：用 2:10「轻慢主治的」「毁谤在尊位的」堵住会友对领袖的正当质疑——「你批评牧师就是轻慢主治的」\n「主治的」最自然指主的权柄；第 2 章被定罪的正是「师傅」，彼得给长老的命令是「不是辖制」（彼前 5:3）（红线二）。\n检验标准：有没有讲到被定罪的是在上位的人？有没有回指彼前 5:3？","③ 错误讲法：用 2:20–22「狗转过来吃」恐吓跌倒、挣扎的信徒，或对某个人说他已经回不了头\n上下文是假师傅与跟从他们转背的人；跌倒而想回头的人要同时听见 1:9「已经得了洁净」与 3:9「乃愿人人都悔改」（红线五）。\n检验标准：一位刚跌倒、很想回头的弟兄听完，是更想回来，还是更绝望？","④ 错误讲法：讲完全章只剩怀疑与警告，没有讲到 2:9「主知道搭救敬虔的人」\n2:4–10 是一个长句，三个审判都是条件子句，主句是搭救；第 2 章的篇名是「井」，落点却是 2:9。\n检验标准：会众走出去时，记得的是「谁可能是假的」，还是「主知道搭救我」？","⑤ 错误讲法：把罗得美化成敬虔的榜样，或反过来把他当笑话、嘲笑他「这种人也算义人」\n创 19 的罗得选了所多玛、迟延不走、后来醉酒；彼得称他义人，定义在 2:8「义心天天伤痛」，而他蒙救的主词是神。\n检验标准：有没有讲到「义不是完美，是还会伤痛的心」，以及搭救是恩典？","⑥ 错误讲法：把以诺一书当成正典，用它来补充天使犯罪的细节，或说「彼得既然用了，以诺一书就是神的话」\n彼得与犹大借用读者熟悉的背景，就像保罗引用希腊诗人（徒 17:28）；借用不等于列入正典，彼得也没有展开细节。\n检验标准：讲台上关于堕落天使的内容，有没有超出圣经本文？","⑦ 错误讲法：把 2:4「丢在地狱，交在黑暗坑中」讲成一幅阴间地图——地狱分几层、天使关在哪一层\nταρταρώσας 新约仅此一次，彼得借字讲一个真实的拘禁，不提供空间结构；他要说的只有一句：神没有宽容。\n检验标准：会众带走的是对神公义的敬畏，还是对阴间构造的好奇？","⑧ 错误讲法：讲第 2 章时把自己放在审判台上，讲得好像讲员与会众都是「真的」，问题都在外面的人\n写「不承认」的彼得自己不承认过主；危险「在你们中间」，分辨先从自己开始。\n检验标准：讲员有没有在讲台上先承认：这五个记号也照得到我？","⑨ 错误讲法：用 2:1「连买他们的主」在讲台上裁决有限救赎或普遍救赎，并说另一派不合圣经\n这一节两派都读得通，不宜单凭它定案；彼得要量的是罪的深度：他们否认的是一位付了价的主人。\n检验标准：不同神学传统的弟兄姐妹听完，是被定罪，还是一起被提醒「我是被买来的」？","⑩ 错误讲法：把 2:3「贪心取利」讲成「传道人领薪水就是贪心」，或反过来完全回避钱的话题\n传福音的靠福音养生是主所命定的（林前 9:14）；2:3 的记号是用捏造的话「在你们身上取利」——把人当货。最好的回应是财务透明。\n检验标准：有没有讲到教会自己的财务透明，而不是只批评别的教会？","⑪ 错误讲法：把 2:11 讲成「基督徒不可以抵挡魔鬼」，或反过来鼓励与邪灵对话、嘲弄、喊话\n2:11 教的是谦卑：连天使都把审判交给主；雅 4:7「务要抵挡魔鬼」仍然有效，但焦点在主，不在魔鬼。\n检验标准：会众的眼睛最后停在魔鬼身上，还是主身上？","⑫ 错误讲法：把巴兰的驴讲成笑话就结束，或寓意化成「驴代表某某」\n彼得照民数记接受这件神迹，重点是讽刺：自以为属灵的人不如一头驴清醒；神在人走向灭亡的路上一再拦阻。\n检验标准：会众笑完之后，有没有问自己：我正往「不义的工价」那里走吗？","⑬ 错误讲法：用 2:19「被谁制伏就是谁的奴仆」把自由讲成一套新的规条，叫人靠守规矩得自由\n假自由是放纵，但真自由不是律法主义；真自由是 1:4「脱离败坏」、有一位好主人（约 8:36）。\n检验标准：会众听到的是「多守几条规矩」，还是「让耶稣作王才是自由」？","⑭ 错误讲法：把第 2 章当成一份脱离处境的「假师傅辨认手册」，一条一条套在今天的人身上\n书信三问：受书人遇到什么——从教会里面起来、否认审判、放纵又取利的教师；彼得从福音推出什么原则——主是付了价的主人，他知道搭救，也必审判；今天这原则落在哪里——先照自己，守住被买来的身分，陪伴心不坚固的人。\n检验标准：三问有没有依次答完，而且第三问落在会众自己的生活，而不是别人的名字？"]},{"n":3,"t":"我们照他的应许，盼望新天新地，有义居在其中","sub":"记得、宽容、长进","lv":"A","arc":"天","sec":[["3:1--2","两封都是提醒——记念先知的话与主救主的命令"],["3:3--7","应许在哪里呢——讥诮的人故意忘记的事"],["3:8--10","一日如千年——不是耽延，乃是宽容；主的日子像贼来到"],["3:11--14","该当怎样为人——圣洁、敬虔、切切仰望、安然见主"],["3:15--18","亲爱的兄弟保罗、防备坠落、在恩典和知识上有长进"]],"serm":{"pts":[["应许在哪里呢","3:1--7","讥诮的人不是不知道，是故意忘记；信心的一半是记得。"],["不是耽延，乃是宽容","3:8--10","主的慢是爱的等；等候的时间是悔改与传福音的时间。"],["等候的人怎样活","3:11--18","盼望新天新地的人，今天就活得不一样；最后一句是：愿荣耀归给他。"]]},"q":"「都两千年了，还在等？」这句话不只出现在讥诮的人口中，也悄悄藏在许多等得很累的信徒心里：等家人信主，等祷告蒙应允，等主回来，等到开始怀疑应许是不是落空了。彼得在遗言的最后一章回答：主看一日如千年，千年如一日；他不是耽延，乃是宽容，不愿有一人沉沦。所以等候的人不必推算日子，也不必焦虑；要防备坠落，在恩典和知识上长进，盼望一个有义居在其中的新天新地，并且把荣耀归给他。","truth":"主的慢不是耽延，是爱的宽容；等候新天新地的人，先防备坠落，再在主的恩典和知识上长进，最后把一切荣耀归给他。","mv":{"t":"主所应许的尚未成就，有人以为他是耽延，其实不是耽延，乃是宽容你们，不愿有一人沉沦，乃愿人人都悔改。","r":"彼后3:9--9"},"card":["彼得用遗言的最后一章提醒教会：讥诮的人问「应许在哪里呢」，是故意忘记神的话创造过、审判过、也正托住这世界；主看一日如千年，不是耽延，乃是宽容，等人悔改；主的日子必像贼来到，一切都要在他面前显露。所以盼望新天新地的人要圣洁敬虔、安然见主；防备坠落，在恩典和知识上长进，把荣耀归给他。","「不是耽延，乃是宽容」——μακροθυμεῖ，把怒气拉长。主的慢，是爱的等；他不愿有一人沉沦。","以主长久忍耐为得救的因由（3:15）：主多等一天，就多一个人可以回头。那日我们被他找到时的「没有玷污」，是从无瑕疵、无玷污的羔羊来的（彼前 1:19）。","被保罗当面抵挡过的彼得，在遗言里称他「我们所亲爱的兄弟」。无己的人不替自己辩护，只认同一位主、同一个福音——无己才能合一。","「我不是迟延；我在等你，也在等你还没回家的那一位。」","写下一位你为他等了很久、还没信主的人的名字；这一周每天为他祷告一次，并且主动问候他一次。","最终整合：一个老人在尼禄的阴影下写信，\n知道帐棚快要拆了。\n外面有人在笑：「应许在哪里呢？」\n\n他想起海边的炭火，\n想起三次的问话，\n想起主等了他多久。\n于是他写：不是耽延，乃是宽容。\n\n他也想起安提阿的那一顿饭，\n自己怎样在一顿饭之间退去（加 2:12）。\n于是他写：要防备，\n免得从自己坚固的地步上坠落。\n\n可是防备，不是站着不动。\n站得住的人，还要长——\n在我们主救主耶稣基督的恩典和知识上，有长进。\n\n然后他放下笔。\n最后一句不是叮咛，是赞美：\n「愿荣耀归给他，从今直到永远。阿们！」\n\n新天新地还没有来，\n义却已经在一些人心里住下。\n等候的人，今天就把荣耀归给他。"],"self":"焦虑的定义：用自己的钟表衡量神的信实，把主的宽容误认成主的缺席。","t321":{"k":"「以我们主长久忍耐为得救的因由」（3:15）。：\\ > 彼得写「宽容」，因为他自己是被宽容等回来的——三次不认主，主在海边预备了炭火和鱼，三次问他「你爱我吗」。\\ > 主怎样等我们，我们就怎样等人：等还没回头的家人，等跌倒了还想回来的弟兄。> > 效法主的忍耐，不是催别人快一点，是像主一样把怒气拉长。","g":"「愿荣耀归给他，从今直到永远。阿们！」（3:18）。：\\ > 这是新约少数直接把荣耀归给基督的颂赞之一；全卷以「我们的神和救主耶稣基督」（1:1）开头，以敬拜基督结束。\\ > 让耶稣作王，在这一章是交出两样东西：交出时间表——日子在他手里，不在我们的换算里；交出荣耀——一个快要殉道的老人，最后一口气不提自己，只说「归给他」。","p":"「盼望新天新地，有义居在其中」（3:13）。：\\ > 属神体系的终局，是一个「义」安家的地方——κατοικεῖ，住下来不走。\\ > 而这个体系今天就从「我们所亲爱的兄弟保罗」（3:15）开始：曾经冲突的两位使徒，站在同一个福音上。这是 235 的「2」——属灵同伴。无己才能合一，合一的人才建得起属神的体系。> > 盼望新天新地的人，今天就让义先在家里、教会里、对待神所造世界的方式里住下来。"},"grp":["【一、破冰】你这一生等过最久的一件事是什么？等的时候，你最常对自己说的一句话是什么？","【二、扎心】3:9 说「有人以为他是耽延」。你心里有没有一件事，你其实已经把它当成「神耽延了」？如果换成神的观点，把它读成「宽容」，这件事会有什么不同？","【三、福音】彼得写「不愿有一人沉沦」，他自己就是被主宽容等回来的人。请分享：主曾经在哪一件事上等过你？你是怎样被等回来的？","【四、行动】3:17–18 的次序是先防备坠落，再在恩典上长进，最后把荣耀归给他。这三件事里，你这一季最弱的是哪一件？这一周你要做的一个具体动作是什么（时间、地点、对象）？","【五、代祷】请每人说出一位你为他等了很久、还没信主或已经离开教会的人的名字（只说名字，不必说细节），全组一起为他祷告：「主啊，求你的宽容临到他。」"],"prac":{"main":"这一周，把一件「神耽延了」的事，改写成「神在宽容」的祷告","items":["对神：这一周，把一件你觉得「神耽延了」的事写下来，每天用 3:9 改写成一句祷告：「主啊，你不是耽延，你在等。」","对自己：读 3:17，找出一个最容易把你「一同带走」的错谬或习惯，写下你防备它的一个具体做法","对人：找一位你为他等了很久、还没信主或离开教会的人，这一周主动问候他一次，不急着劝，只表达关心","对生活：从 3:11「该当怎样圣洁，怎样敬虔」出发，检查一件日常的事——花钱、用时间、对待神所造的世界——作一个小调整","对使命：在小组或家里读 3:18，然后一起说一次：「愿荣耀归给他，从今直到永远。阿们！」"]},"safe":["① 错误讲法：用 3:8「一日如千年」换算末日或创造日（例如说创造六日之后六千年主必再来）\n这是错误的用法：彼得两个方向都说——「一日如千年，千年如一日」——正是为了取消换算；ὡς 是比喻，不是等号。\n检验标准：有没有讲到 3:8 两个方向都说？有没有讲到 3:10「像贼来到」？","② 错误讲法：用 3:12「切切仰望」推算日期，或说人可以用某种宗教、政治工程「加速」主再来\n这不是 3:12 的意思：原文较支持「催促」，但方法是 3:9 的悔改与 3:11 的圣洁敬虔，是参与神的心意，不是掌握神的时间表。\n检验标准：讲完之后，会众想做的是悔改、圣洁、传福音，还是去研究时事表、计算年份？","③ 错误讲法：说「地球反正要烧掉，照顾受造界没有意义」\n这是误用 3:10–12（红线六）：洪水「消灭」了当时的世界，地却仍在（3:6）；3:13 的「新」καινός 是更新；3:11「该当怎样圣洁」是今天的生活。\n检验标准：有没有讲到 3:13「新天新地，有义居在其中」？听完的人对神所造的世界更珍惜，还是更随便？","④ 错误讲法：把 3:10–13 讲成某一个环保政策或政党的背书，在讲台上作政治动员\n照顾受造界是管家的本分，不是政治阵营的标签（红线六的另一面）；讲台讲原则，不替会众投票。\n检验标准：不同政治立场的弟兄姐妹听完，是一起更敬畏造物主，还是彼此更对立？","⑤ 错误讲法：把 3:15–16 读成彼得与保罗的角力，或借此贬低保罗「难懂」、贬低彼得「没学问」\n这不是两位使徒的较量（红线七）：加 2:11 的事件可以讲，但落点是 3:15「我们所亲爱的兄弟」——被纠正过的人称纠正他的人为兄弟。\n检验标准：有没有讲到 3:15「亲爱的兄弟」？会众听完是更想和好，还是更想选边？","⑥ 错误讲法：用 3:16「难明白的」劝会众别自己读保罗书信，说只有牧师能解经\n这是误用（红线八）：出问题的是「无学问、不坚固的人强解」，不是读的人；保护读经的方法是在群体中、照上下文、谦卑地读。\n检验标准：有没有给出一个会众今天就能用的读经方法？听完的人是更想读经，还是更不敢读？","⑦ 错误讲法：说「和合本 3:10 译错了」或「某某译本是错的」\n3:10 是抄本的异文问题，不是翻译的对错：和合本「烧尽了」跟从 κατακαήσεται 的抄本，SBLGNT 作 εὑρεθήσεται「被显露」，NA28 作 οὐχ εὑρεθήσεται；并陈，两读都不是神丢弃受造界。\n检验标准：会众听完是更信任手上的圣经、也更明白抄本的历史，还是开始怀疑圣经？","⑧ 错误讲法：只讲天被火烧、有形质的销化，不讲新天新地\n3:10–12 的火不是结尾；彼得的句子停在 3:13「盼望新天新地，有义居在其中」，κατοικεῖ 是住下来不走。\n检验标准：讲完之后，会众心里留下的是火的画面，还是家的画面？","⑨ 错误讲法：把等候讲成焦虑的倒数，或讲成消极地坐着等、什么都不做\n3:9 的等候是悔改与传福音的时间；3:11–14 的等候是圣洁、敬虔、殷勤；果效是忍耐，不是恐慌，也不是闲懒。\n检验标准：会众走出去，是更害怕、更冷淡，还是更平安、更殷勤？","⑩ 错误讲法：用 3:9「不愿有一人沉沦」宣讲人人终必得救，取消 3:7 的审判\n同一段经文说「不敬虔之人受审判遭沉沦」（3:7）；3:9 解释的是神为什么还在等，不是说审判不会来。\n检验标准：有没有同时讲神的宽容与 3:10「主的日子要像贼来到」？","⑪ 错误讲法：在讲台上用 3:9 裁判拣选的神学系统，或用系统把这节经文的温度冷却掉\nβούλομαι 说的是神真实的心意；各家对拣选与普世救恩的理解并陈（见 ISS03_4），讲台讲的是：神在等人悔改。\n检验标准：一位为家人信主祷告多年的姐妹听完，是更有盼望地祷告，还是更困惑？","⑫ 错误讲法：用 3:5–7 在讲台上裁判年轻地球或古老地球\n彼得引创世记的叙事，目的在神学：神的话创造、审判、托住世界；不是在提供一套科学宇宙论（见 ISS03_2）。\n检验标准：持不同创造观的弟兄姐妹听完，是一起敬拜造物主，还是觉得自己被排除在外？","⑬ 错误讲法：把 3:3「好讥诮的人」当成末日倒数的记号表，看到有人讥诮就说主快来了\n「末世」是从五旬节到主再来的整段时期（徒 2:17；来 1:2）；讥诮的人是每一个世代都会面对的处境，彼得要的是「预先知道」，不是倒数计时。\n检验标准：有没有把时事对号入座？","⑭ 错误讲法：把 3:17–18 的次序颠倒，或只讲「防备」不讲「长进」与「荣耀」\n只讲防备，教会会变成一群守城门、互相怀疑的人；彼得的次序是先防备坠落，再在恩典上长进，最后把荣耀归给他。\n检验标准：讲章的最后一句，是警告，还是「愿荣耀归给他」？","⑮ 错误讲法：把彼得的遗言讲成「彼得多伟大、多感人」\n〔背景〕的落点在主身上：写「宽容」的人自己是被宽容等回来的；最后一句是「愿荣耀归给他」，不是归给彼得。\n检验标准：会众记得的是彼得，还是「愿荣耀归给他」的那一位？","⑯ 错误讲法：跳过书信三问，直接把 3:3–13 套到今天的新闻上\n先问受书人遇到什么（讥诮的人说主不会来、假师傅把恩典扭成放纵）；再问彼得从福音推出什么原则（主的慢是宽容，盼望的人活得圣洁）；最后才问今天这原则落在哪里（等候中的悔改、传福音与长进）。\n检验标准：三问有没有依次走完，还是直接跳到第三问？"]}],"txt":{"1":["作耶稣基督仆人和使徒的西门彼得，写信给那因我们的神和救主耶稣基督之义，与我们同得一样宝贵信心的人。","愿恩惠、平安，因你们认识神和我们主耶稣，多多地加给你们。","神的神能已将一切关乎生命和虔敬的事赐给我们，皆因我们认识那用自己荣耀和美德召我们的主。","因此，他已将又宝贵又极大的应许赐给我们，叫我们既脱离世上从情欲来的败坏，就得与神的性情有分。","正因这缘故，你们要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知识；","有了知识，又要加上节制；有了节制，又要加上忍耐；有了忍耐，又要加上虔敬；","有了虔敬，又要加上爱弟兄的心；有了爱弟兄的心，又要加上爱众人的心。","你们若充充足足地有这几样，就必使你们在认识我们的主耶稣基督上不至于闲懒不结果子了。","人若没有这几样，就是眼瞎，只看见近处的，忘了他旧日的罪已经得了洁净。","所以弟兄们，应当更加殷勤，使你们所蒙的恩召和拣选坚定不移。你们若行这几样，就永不失脚。","这样，必叫你们丰丰富富地得以进入我们主救主耶稣基督永远的国。","你们虽然晓得这些事，并且在你们已有的真道上坚固，我却要将这些事常常提醒你们。","我以为应当趁我还在这帐棚的时候提醒你们，激发你们；","因为知道我脱离这帐棚的时候快到了，正如我们主耶稣基督所指示我的。","并且我要尽心竭力，使你们在我去世以后时常记念这些事。","我们从前将我们主耶稣基督的大能和他降临的事告诉你们，并不是随从乖巧捏造的虚言，乃是亲眼见过他的威荣。","他从父神得尊贵荣耀的时候，从极大荣光之中有声音出来，向他说：「这是我的爱子，我所喜悦的。」","我们同他在圣山的时候，亲自听见这声音从天上出来。","我们并有先知更确的预言，如同灯照在暗处。你们在这预言上留意，直等到天发亮，晨星在你们心里出现的时候，才是好的。","第一要紧的，该知道经上所有的预言没有可随私意解说的；","因为预言从来没有出于人意的，乃是人被圣灵感动，说出神的话来。"],"2":["从前在百姓中有假先知起来，将来在你们中间也必有假师傅，私自引进陷害人的异端，连买他们的主他们也不承认，自取速速的灭亡。","将有许多人随从他们邪淫的行为，便叫真道因他们被毁谤。","他们因有贪心，要用捏造的言语在你们身上取利。他们的刑罚，自古以来并不迟延；他们的灭亡也必速速来到。","就是天使犯了罪，神也没有宽容，曾把他们丢在地狱，交在黑暗坑中，等候审判。","神也没有宽容上古的世代，曾叫洪水临到那不敬虔的世代，却保护了传义道的挪亚一家八口。","又判定所多玛、蛾摩拉，将二城倾覆，焚烧成灰，作为后世不敬虔人的鉴戒；","只搭救了那常为恶人淫行忧伤的义人罗得。","因为那义人住在他们中间，看见听见他们不法的事，他的义心就天天伤痛。","主知道搭救敬虔的人脱离试探，把不义的人留在刑罚之下，等候审判的日子；","那些随肉身、纵污秽的情欲、轻慢主治之人的，更是如此。他们胆大任性，毁谤在尊位的，还不知惧怕。","就是天使，虽然力量权能更大，还不用毁谤的话在主面前告他们。","但这些人好像没有灵性、生来就是畜类，以备捉拿宰杀的。他们毁谤所不晓得的事，正在败坏人的时候，自己必遭遇败坏。","行的不义，就得了不义的工价。这些人喜爱白昼宴乐，他们已被玷污，又有瑕疵，正与你们一同坐席，就以行诡诈为快乐。","他们满眼是淫色，止不住犯罪，引诱那心不坚固的人，心中习惯了贪婪，正是被咒诅的种类。","他们离弃正路，就走差了，随从比珥之子巴兰的路。巴兰就是那贪爱不义之工价的先知，","他却为自己的过犯受了责备；那不能说话的驴以人言拦阻先知的狂妄。","这些人是无水的井，是狂风催逼的雾气，有墨黑的幽暗为他们存留。","他们说虚妄矜夸的大话，用肉身的情欲和邪淫的事引诱那些刚才脱离妄行的人。","他们应许人得以自由，自己却作败坏的奴仆，因为人被谁制伏就是谁的奴仆。","倘若他们因认识主救主耶稣基督，得以脱离世上的污秽，后来又在其中被缠住、制伏，他们末后的景况就比先前更不好了。","他们晓得义路，竟背弃了传给他们的圣命，倒不如不晓得为妙。","俗语说得真不错：狗所吐的，牠转过来又吃；猪洗净了又回到泥里去滚；这话在他们身上正合式。"],"3":["亲爱的弟兄啊，我现在写给你们的是第二封信。这两封都是提醒你们，激发你们诚实的心，","叫你们记念圣先知预先所说的话和主救主的命令，就是使徒所传给你们的。","第一要紧的，该知道在末世必有好讥诮的人随从自己的私欲出来讥诮说：","「主要降临的应许在哪里呢？因为从列祖睡了以来，万物与起初创造的时候仍是一样。」","他们故意忘记：从太古凭神的命有了天，并从水而出、借水而成的地。","故此，当时的世界被水淹没就消灭了。","但现在的天地还是凭着那命存留，直留到不敬虔之人受审判遭沉沦的日子，用火焚烧。","亲爱的弟兄啊，有一件事你们不可忘记，就是主看一日如千年，千年如一日。","主所应许的尚未成就，有人以为他是耽延，其实不是耽延，乃是宽容你们，不愿有一人沉沦，乃愿人人都悔改。","但主的日子要像贼来到一样。那日，天必大有响声废去，有形质的都要被烈火销化，地和其上的物都要烧尽了。","这一切既都要如此销化，你们为人该当怎样圣洁，怎样敬虔，","切切仰望神的日子来到。在那日，天被火烧就销化了，有形质的都要被烈火镕化。","但我们照他的应许，盼望新天新地，有义居在其中。","亲爱的弟兄啊，你们既盼望这些事，就当殷勤，使自己没有玷污，无可指摘，安然见主。","并且以我们主长久忍耐为得救的因由，就如我们所亲爱的兄弟保罗，照着所赐给他的智慧写了信给你们。","他一切的信上也都是讲论这事。信中有些难明白的，那无学问、不坚固的人强解，如强解别的经书一样，就自取沉沦。","亲爱的弟兄啊，你们既然预先知道这事，就当防备，恐怕被恶人的错谬诱惑，就从自己坚固的地步上坠落。","你们却要在我们主救主耶稣基督的恩典和知识上有长进。愿荣耀归给他，从今直到永远。阿们！"]},"blk":{"1":[{"a":1,"z":2,"star":1,"grk":"<blockquote lang=\"grc\"><p>Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.<\/p><\/blockquote>","lit":"<blockquote><p>「西缅彼得，耶稣基督的奴仆和使徒，写给那些在我们的神和救主耶稣基督的义里，与我们分得了同等尊贵之信心的人：愿恩典与平安，在对神和我们主耶稣的认识里，多多地加给你们。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>西门<\/td><td>Συμεών<\/td><td>Symeōn<\/td><td>G4826<\/td><td>—<\/td><td>西缅（希伯来名的希腊拼法）<\/td><td>新约只有徒 15:14 与此处这样称彼得：最后一封信，他用了主在海边叫他的本名<\/td><\/tr><tr><td>一样宝贵<\/td><td>ἰσότιμος<\/td><td>isotimos<\/td><td>G2472<\/td><td>ἴσος（相等）＋ τιμή（尊贵）<\/td><td>同等尊荣、同等权利<\/td><td>新约仅此一次。城邦「同等公民权」的字——教会里没有二等信徒<\/td><\/tr><tr><td>同得<\/td><td>λαγχάνω<\/td><td>lanchanō<\/td><td>G2975<\/td><td>λάχος（签、份）<\/td><td>抽签得着、蒙分配<\/td><td>信心是分给你的份，不是赚来的（路 1:9；徒 1:17 同字）<\/td><\/tr><tr><td>义<\/td><td>δικαιοσύνη<\/td><td>dikaiosynē<\/td><td>G1343<\/td><td>δίκη（公正）<\/td><td>义、公正<\/td><td>神不偏待人的公义；所以远方没见过主的人，分到的信心和使徒一样<\/td><\/tr><tr><td>救主<\/td><td>σωτήρ<\/td><td>sōtēr<\/td><td>G4990<\/td><td>σῴζω（拯救）<\/td><td>救主<\/td><td>全卷以「救主」开始（1:1），以「救主」结束（3:18）<\/td><\/tr><tr><td>认识<\/td><td>ἐπίγνωσις<\/td><td>epignōsis<\/td><td>G1922<\/td><td>ἐπί（向着）＋ γνῶσις（知识）<\/td><td>确切的、亲身的认识<\/td><td>★本章解经钥匙：恩惠平安是在「认识他」里面加增的<\/td><\/tr><tr><td>多多地加给<\/td><td>πληθύνω<\/td><td>plēthynō<\/td><td>G4129<\/td><td>πλῆθος（众多）<\/td><td>使增多<\/td><td>祈愿语气 πληθυνθείη，核心问安语与彼前 1:2 相同<\/td><\/tr><\/table>","gram":"<p><strong>① 「我们的神和救主耶稣基督」是一位还是两位？<\/strong><\/p><ul><li><strong>一位（Granville Sharp 规则）<\/strong>：τοῦ θεοῦ ἡμῶν καὶ σωτῆρος 是一个冠词统管两个单数、非专有名词的位格名词，中间用 καί 连接——两个称号指同一位：「我们的神，也是救主，就是耶稣基督」。多数福音派注释与新近译本（如 NIV、ESV）采此读法。<\/li><li><strong>两位<\/strong>：「我们的神」指父，「救主耶稣基督」指子。理由：紧接着的 1:2 就把「神」和「我们主耶稣」分开；西乃抄本等少数抄本 1:1 作 κυρίου（主）而不是 θεοῦ。KJV 译作「God and our Saviour」，采此读法。<\/li><\/ul><p>决定性的证据在本卷自己：1:11、2:20、3:18 都用同一句型 τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ（我们主救主耶稣基督），从来没有人把那三处读成两位。1:2 的句型不同：Ἰησοῦ 是专有名词，不在同一个冠词下。<\/p><blockquote><p><strong>最好的理解：<\/strong><strong>一位。<\/strong>1:1 直称耶稣为「我们的神」，是新约直称耶稣为神的经文之一（这与约 1:1；20:28；多 2:13 同列）。1:1 把神与救主合在一位身上，1:2 又把父与子分开——两节并排，正是三一真理的两面：有分别，不分割。<\/p><\/blockquote><p><strong>② Συμεών 还是 Σίμων？<\/strong><\/p><p>P72 与梵蒂冈抄本作 Σίμων；西乃抄本、亚历山大抄本作 Συμεών，SBLGNT 与 NA28 采后者（待以实档核对）。较难、较少见的 Συμεών 比较可能是原文——抄写的人容易把罕见拼法改成常见拼法，不容易反过来改。<\/p><p><strong>③ λαχοῦσιν<\/strong>：不定过去式分词，「已经分得了」。信心在这里是被动领受的份，不是自己的成就。<\/p>","exp":"<p><strong>一封临终的信，第一个字是他的本名。<\/strong><\/p><p>彼得前书开头只写「彼得」。这一封写「西门彼得」，而且用希伯来拼法 Συμεών。新约除了这里，只有一次这样称呼他：耶路撒冷会议上，雅各说「方才西门述说神当初怎样眷顾外邦人」（徒 15:14）。<\/p><p>三十多年前在加利利海边，主三次问他：「约翰的儿子西门，你爱我比这些更深吗？」（约 21:15）主叫回他的本名，就在那个早晨，把他从三次不认主的羞愧里接了回来。临终提笔，他先写下的，是那个被主叫过、也被主接回来的名字。<\/p><p>然后他写「奴仆」在前，「使徒」在后。先是属于主的人，然后才是被差的人。<\/p><p>收信的人没见过主，没上过圣山。彼得却说，你们的信心和我们的「一样宝贵」。ἰσότιμος 是城邦里「同等公民权」的字。λαχοῦσιν 是抽签分得的份。<strong>信心的价值不在拿的人，在给的那一位<\/strong>——是「在我们的神和救主耶稣基督的义里」分到的。使徒和渔村里的一个寡妇，捧着的是同一份恩典。<\/p><p>1:2 接着说，恩惠平安是「因你们认识神和我们主耶稣」多多地加给。ἐπίγνωσις 在全卷第一次出现，就和恩典绑在一起。恩典不是在认识主之外另外掉下来的礼物；越认识他，恩典越多。<\/p><p>今天坐在会众席上的人，没有一个是二等信徒。你没见过山上的荣光，但你手里的信心，和写信的使徒一样重。要长进，不是去求一份更高级的信心，是更深地认识那一位把信心分给你的主。<\/p><p>〔背景〕约 21:15–17；徒 15:14——不是彼得配得一个名字，是主在海边重新叫了他。〔彼前〕彼得前书讲义第 1 章（彼前 1:2 同一句问安）。<\/p>"},{"a":3,"z":3,"star":3,"grk":"<blockquote lang=\"grc\"><p>Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ἰδίᾳ δόξῃ καὶ ἀρετῇ,<\/p><\/blockquote>","lit":"<blockquote><p>「因为他神圣的能力，已经把一切关乎生命和敬虔的事赐给了我们，是借着认识那一位——用他自己的荣耀和美德呼召了我们的。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>神（能）<\/td><td>θεῖος<\/td><td>theios<\/td><td>G2304<\/td><td>θεός（神）<\/td><td>属神的、神圣的<\/td><td>1:3、4 连用两次；保罗在雅典也用这个字（徒 17:29）——向希腊世界说话的字<\/td><\/tr><tr><td>能<\/td><td>δύναμις<\/td><td>dynamis<\/td><td>G1411<\/td><td>δύναμαι（能够）<\/td><td>能力<\/td><td>1:16 同字：彼得在山上见过的「大能」，就是把一切赐下的能力<\/td><\/tr><tr><td>赐给<\/td><td>δωρέομαι<\/td><td>dōreomai<\/td><td>G1433<\/td><td>δῶρον（礼物）<\/td><td>白白赠送<\/td><td>完成式分词 δεδωρημένης：已经给了，而且现在还在你手上<\/td><\/tr><tr><td>虔敬<\/td><td>εὐσέβεια<\/td><td>eusebeia<\/td><td>G2150<\/td><td>εὖ（好）＋ σέβομαι（敬畏）<\/td><td>敬虔、敬畏神的生活<\/td><td>全卷四次（1:3、6、7；3:11）：生命是根，敬虔是向神的姿态<\/td><\/tr><tr><td>召<\/td><td>καλέω<\/td><td>kaleō<\/td><td>G2564<\/td><td>—<\/td><td>呼召<\/td><td>不定过去式分词：呼召已经发生；主动的是他<\/td><\/tr><tr><td>美德<\/td><td>ἀρετή<\/td><td>aretē<\/td><td>G703<\/td><td>—<\/td><td>卓越、美德、大能的作为<\/td><td>与 1:5「德行」同一个字：他所有的，他召我们加上<\/td><\/tr><tr><td>认识<\/td><td>ἐπίγνωσις<\/td><td>epignōsis<\/td><td>G1922<\/td><td>ἐπί（向着）＋ γνῶσις（知识）<\/td><td>确切的认识<\/td><td>διά 带所有格：一切赐下，都「借着」认识他传到我们身上<\/td><\/tr><\/table>","gram":"<p><strong>① Ὡς 把 1:3–4 接到哪里？<\/strong><\/p><ul><li><strong>接上文<\/strong>：1:3 说明 1:2 的恩惠平安「怎样」多多加给——因为神能已经赐下一切。<\/li><li><strong>接下文<\/strong>：1:3–4 是一个长的前置子句，主要动词要等到 1:5 的「你们要……加上」（ἐπιχορηγήσατε）；1:5 开头的「正因这缘故」（αὐτὸ τοῦτο）就是回指 1:3–4。多数注释采此读法。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>两头都接，但重心往下。<strong>1:3（完成式分词）与 1:4（完成式直述语气）都陈明「已经赐下」，1:5 才是命令语气的「要加上」。<\/strong>彼得的文法本身就是神学：先有神的完成式，才有人的命令式。<\/p><\/blockquote><p><strong>② 「召我们的」是父还是基督？<\/strong><\/p><ul><li><strong>父神<\/strong>：新约多处说「神召」我们（彼前 5:10；帖前 2:12）。<\/li><li><strong>基督<\/strong>：最近的先行词是 1:2 的「我们主耶稣」；而「自己的荣耀」正是 1:16–17 彼得在山上亲眼见过的、基督从父领受的荣耀。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>主要指基督，但不必把父与子切开。和合本译作「召我们的主」，方向正确。<\/p><\/blockquote><p><strong>③ ἰδίᾳ δόξῃ καὶ ἀρετῇ<\/strong>：间接格，多数解作「借着」（工具）他自己的荣耀和美德；也可读作「召我们进入／归于」他的荣耀。TR 作 διὰ δόξης καὶ ἀρετῆς（借着荣耀和美德），意思相近。<strong>ἰδίᾳ（自己的）是重点<\/strong>：呼召我们的资源全在他那边。<\/p>","exp":"<p><strong>彼得还没有叫人做任何一件事，先说：一切都已经给了。<\/strong><\/p><p>这是一个快要殉道的人写给教会的遗言。照常理，遗言该是一连串的叮咛。可是彼得的第一句是直述语气，不是命令语气。<\/p><p>δεδωρημένης 是完成式。不是「将要给」，不是「看你表现再给」，是「已经给了，现在还在你手上」。给了多少？πάντα——一切。范围是「关乎生命和虔敬的事」：里面的生命，向神的生活。<\/p><p>这一切是怎么送到我们手上的？διὰ τῆς ἐπιγνώσεως——借着认识他。<strong>神没有把一个包裹寄给我们就走了。他把自己给了我们，一切都在认识他里面。<\/strong><\/p><p>还有一个字要停下来看：ἀρετή，美德。两节之后，1:5 的「德行」用的是同一个字。召我们的主有这美德；他召我们，然后叫我们在信心上加上同样的美德。我们要长出来的，本来就是他身上的样子。<\/p><p>很多基督徒把信仰活成一种缺乏：我还差一点什么，再多一次聚会、再多一次经历，才够。彼得说，你缺的不是更多的供应，是更深地认识那一位已经供应一切的主。次序不能颠倒：先是神的完成式，才有我们的命令式。这正是「先生命，再关系，后事工」的根。<\/p><p>〔背景〕路 9:32「看见耶稣的荣光」——用自己荣耀召我们的主，彼得在山上亲眼见过那荣耀；不是彼得看得多，是主肯显给他看。<\/p>"},{"a":4,"z":4,"star":2,"grk":"<blockquote lang=\"grc\"><p>δι’ ὧν τὰ τίμια καὶ μέγιστα ἡμῖν ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.<\/p><\/blockquote>","lit":"<blockquote><p>「借着这些（他的荣耀和美德），他已经把那些宝贵而极大的应许赐给了我们，为要叫你们借着这些（应许），成为有分于神性情的人——你们已经逃脱了世上那在情欲里的败坏。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>应许<\/td><td>ἐπάγγελμα<\/td><td>epangelma<\/td><td>G1862<\/td><td>ἐπί ＋ ἀγγέλλω（宣告）<\/td><td>所应许的事（内容）<\/td><td>新约只在彼后 1:4 与 3:13；两处都指向将来——第二处就是新天新地<\/td><\/tr><tr><td>宝贵<\/td><td>τίμιος<\/td><td>timios<\/td><td>G5093<\/td><td>τιμή（价值）<\/td><td>贵重的<\/td><td>与彼前 1:19「基督的宝血」同一个字<\/td><\/tr><tr><td>极大<\/td><td>μέγιστος<\/td><td>megistos<\/td><td>G3176<\/td><td>μέγας（大）的最高级<\/td><td>极大的<\/td><td>最高级形式新约仅此一次：彼得找不到更大的字了<\/td><\/tr><tr><td>有分<\/td><td>κοινωνός<\/td><td>koinōnos<\/td><td>G2844<\/td><td>κοινός（共同的）<\/td><td>同伴、合伙人、有分的人<\/td><td>路 5:10 雅各、约翰是「西门的伙伴」——同一个字；渔夫一生第一份「有分」是在船上<\/td><\/tr><tr><td>性情<\/td><td>φύσις<\/td><td>physis<\/td><td>G5449<\/td><td>φύω（生长）<\/td><td>本性、天性<\/td><td>不是哲学上的「本质」（οὐσία）一字；与下半句「败坏」对照：神的性情对世上的败坏<\/td><\/tr><tr><td>脱离<\/td><td>ἀποφεύγω<\/td><td>apopheugō<\/td><td>G668<\/td><td>ἀπό（离）＋ φεύγω（逃）<\/td><td>逃脱<\/td><td>不定过去式分词；2:18、20 同字——假师傅专找「刚刚脱离」的人下手<\/td><\/tr><tr><td>败坏<\/td><td>φθορά<\/td><td>phthora<\/td><td>G5356<\/td><td>φθείρω（腐烂）<\/td><td>朽坏、败坏<\/td><td>全卷「败坏」线的起点；2:19 假自由的人「作败坏的奴仆」<\/td><\/tr><\/table>","gram":"<p><strong>① θείας κοινωνοὶ φύσεως——四种读法<\/strong><\/p><ul><li><strong>成神论（theosis）<\/strong>：东正教传统。人借恩典有分于神的「能力」（ἐνέργειαι，energies），而不是神的「本质」（οὐσία，essence）；人越来越像神，却永远是受造者。亚他那修说「神成为人，好叫我们得以成神」，在东正教神学里的意思是借恩典有分，不是多出另一位神；十四世纪帕拉马（Gregory Palamas）把「本质／能力」之分讲得最清楚。<\/li><li><strong>与基督联合<\/strong>：改革宗、路德宗。借圣灵与基督联合，有分于他的生命；成圣是被更新成神的形像（西 3:10）。加尔文注释此节说：这里的「性情」指品质，不是本体。<\/li><li><strong>完全的爱<\/strong>：卫斯理传统。有分于神的圣洁与爱，今生就可以被爱充满、脱离故意犯罪的权势。<\/li><li><strong>道德的相似<\/strong>：许多福音派注释。有分于神的道德品格（圣洁、良善），不涉本体。<\/li><\/ul><p>四种读法的共同点比想像中多：<strong>没有一家主流传统说受造者会成为另一位神。<\/strong>分歧在「有分」的深度与讲法，不在要不要守住创造者与受造者的分别。<\/p><blockquote><p><strong>最好的理解：<\/strong>在基督里与基督联合，有分于神的生命与品格（圣洁、爱）。三条界线：一、<strong>创造者与受造者的分别永远存在<\/strong>——这不是说人会变成神，也不是与神的本质混同；二、<strong>有分是恩典，不是修炼<\/strong>——主词是神，「他已将……应许赐给我们」；三、<strong>有分的内容写在上下文<\/strong>：脱离败坏（1:4 下），加上德行……爱众人（1:5–7）。<\/p><\/blockquote><p><strong>② 时间：已经还是将来？<\/strong>ἀποφυγόντες 是不定过去式分词（已经逃脱），γένησθε 是目的子句。应许（ἐπαγγέλματα）在 3:13 指向新天新地。最自然的读法是「已然未然」：今天已经开始有分，那日才完全。<\/p><p><strong>③ 借字装新酒<\/strong>：「神的性情」是当时斯多亚哲学与希腊宗教熟悉的说法。彼得借用世界听得懂的字，装进福音的内容——而且立刻用「脱离败坏」与 1:5–7 的品格把它定义，不让它漂向神秘主义。<\/p>","exp":"<p><strong>全卷神学最高的一句，也是最容易讲偏的一句。所以不能跳过，也不能讲过头。<\/strong><\/p><p>1:3 说一切都给了。1:4 说，给的方式是「应许」——又宝贵，又极大。μέγιστα 是最高级，新约只有这里用这个形式。一个说话一向直率的渔夫，到这里找不到更大的字了。<\/p><p>应许的目的：「叫你们……得与神的性情有分」。κοινωνός 这个字，彼得很熟。多年前在革尼撒勒湖边，雅各和约翰是「西门的伙伴」（路 5:10）——同一个字。那时有分的是一条船、一网鱼。如今主说：你要有分的，是我的生命。<\/p><p>可是这里要诚实地画线。<strong>有分不是变成。<\/strong>船上的伙伴分享同一条船，却没有变成船主。创造者与受造者的分别永远存在；人有分于神的圣洁与爱，却不会成为另一位神，也不与神的本质混同。东正教讲成神论，也小心地分开神的「本质」与「能力」，正是为了守住这条线。<\/p><p>那么「有分」的内容是什么？彼得自己定义了。往后看半句：「脱离世上从情欲来的败坏」。再往后看三节：德行、知识、节制、忍耐、虔敬、爱弟兄、爱众人。<strong>神的性情，落在人身上，长出来的就是品格。<\/strong><\/p><p>还要记得 2:19。假师傅「应许人得以自由，自己却作败坏的奴仆」——他们应许的自由，正是 1:4 神要救我们脱离的那个东西。<\/p><p>321 说「无己不是没有，乃是进入无限」。在这一节，只能这样说：无己的人进入与无限之神的相交，基督在他里面活（加 2:20）；不是人变成无限。界线守住了，这句话才是福音，而不是自我膨胀。<\/p><p>〔背景〕路 5:10——主先叫渔夫作他的伙伴，后来才叫他作使徒；有分，从来是主先伸手。<\/p>"},{"a":5,"z":7,"star":2,"grk":"<blockquote lang=\"grc\"><p>καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν, ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν, ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην.<\/p><\/blockquote>","lit":"<blockquote><p>「正为这个缘故，你们也要带进全部的殷勤，在你们的信心里供应德行，在德行里供应知识，在知识里供应节制，在节制里供应忍耐，在忍耐里供应敬虔，在敬虔里供应弟兄相爱，在弟兄相爱里供应爱。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>殷勤<\/td><td>σπουδή<\/td><td>spoudē<\/td><td>G4710<\/td><td>σπεύδω（赶紧）<\/td><td>热切、尽力<\/td><td>「全部的殷勤」；同字根在 1:10、15；3:12、14 一再出现——恩典叫人起身，不叫人躺下<\/td><\/tr><tr><td>加上<\/td><td>ἐπιχορηγέω<\/td><td>epichorēgeō<\/td><td>G2023<\/td><td>ἐπί ＋ χορηγέω（χορός 合唱团 ＋ ἡγέομαι 带领）<\/td><td>慷慨供应、出资承担<\/td><td>古城邦富人出资供应合唱团演出的字：不是勉强凑数，是大方地供应<\/td><\/tr><tr><td>德行<\/td><td>ἀρετή<\/td><td>aretē<\/td><td>G703<\/td><td>—<\/td><td>卓越、美德<\/td><td>与 1:3 主的「美德」同一个字：他所有的，我们加上<\/td><\/tr><tr><td>知识<\/td><td>γνῶσις<\/td><td>gnōsis<\/td><td>G1108<\/td><td>γινώσκω（知道）<\/td><td>知识、明白<\/td><td>放在台阶第二级，不是顶点；认识要往下长成节制<\/td><\/tr><tr><td>节制<\/td><td>ἐγκράτεια<\/td><td>enkrateia<\/td><td>G1466<\/td><td>ἐν ＋ κράτος（力量、掌控）<\/td><td>自制<\/td><td>里面有掌控力——对照 2:10、19 被私欲制伏的人<\/td><\/tr><tr><td>忍耐<\/td><td>ὑπομονή<\/td><td>hypomonē<\/td><td>G5281<\/td><td>ὑπό（在下）＋ μένω（留住）<\/td><td>在重压下站住<\/td><td>不是被动地等，是在担子底下不走开<\/td><\/tr><tr><td>爱弟兄的心<\/td><td>φιλαδελφία<\/td><td>philadelphia<\/td><td>G5360<\/td><td>φίλος（朋友）＋ ἀδελφός（弟兄）<\/td><td>弟兄相爱<\/td><td>教会家人之间的爱（彼前 1:22 同字）<\/td><\/tr><tr><td>爱众人的心<\/td><td>ἀγάπη<\/td><td>agapē<\/td><td>G26<\/td><td>—<\/td><td>舍己的爱<\/td><td>台阶的终点；原文只有「爱」，和合本加「众人」点出它越出教会的围墙<\/td><\/tr><\/table>","gram":"<p><strong>① 八项有先后次序吗？<\/strong><\/p><ul><li><strong>阶梯读法<\/strong>：一项完成才进下一项，像爬楼梯。<\/li><li><strong>彼此包含读法<\/strong>：介系词是 ἐν（在……里面），不是 ἐπί（在……上面）——每一项是在前一项「里面」供应出来的，像一棵树的枝子从枝干长出来，同时在长。<\/li><li><strong>修辞连锁（sorites，连珠法）<\/strong>：古典修辞常见的层递句型（这使我们想起罗 5:3–5 也是这种句型）；起点与终点是刻意的，中间的次序有修辞成分，不必一项一项地排先后。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>起点与终点是确定的，中间是互相扶持的品格，不是八道先后的关卡。<\/strong>起点是信心——神分给的（1:1）；终点是爱——神的性情最完整的样子（1:4）。ἐν 的结构说明：德行不是离开信心另起炉灶，是在信心里长出来的；爱也不是离开节制与忍耐的情绪。<\/p><\/blockquote><p><strong>② ἐπιχορηγήσατε<\/strong>：不定过去式命令语气，「去供应吧」。这个字在 1:11 以被动式再出现（ἐπιχορηγηθήσεται，「必……供应给你们」）：<strong>你在这里慷慨供应，神在那里慷慨供应。<\/strong><\/p><p><strong>③ παρεισενέγκαντες<\/strong>（παρά＋εἰς＋φέρω，新约仅此一次）：「从旁带进来」。神已经把一切带进来了（1:3），你们也要把全部的殷勤带进来——与神的工作并肩。<\/p><p><strong>④ 提醒<\/strong>：这八项是品格的果子，不是一套观念改变的流程；与 321 改变观念的八大步骤同为八项，但两者是两回事，不可把这段经文讲成那八步的插图。<\/p>","exp":"<p><strong>「正因这缘故」——因为神已经给了一切，所以你们要分外殷勤。<\/strong><\/p><p>很多人读这三节，只看见一张清单。彼得却先放了一个「因此」。1:3–4 是神的完成式，1:5 才是人的命令式。<strong>长进不是爬上去见神，是神已经下来，我们才在其中长大。<\/strong><\/p><p>「加上」原文 ἐπιχορηγήσατε，是一个有画面的字。古希腊城邦办戏剧节，要有人出钱供应合唱团的服装、训练、演出，这个人叫 χορηγός。那是一份荣誉，大家比的是谁供应得更大方。彼得用这个字说：在你的信心里，大方地供应出德行来。不是勉强凑数，是慷慨。<\/p><p>介系词也要看。不是「在信心上面」，是 ἐν——「在信心里面」。德行从信心里长出来，知识从德行里长出来。像一棵树，不是一道楼梯。<\/p><p>起点是信心，那是神分给你的（1:1）。终点是爱。中间有知识，但知识只在第二级；认识主若停在脑子里，就长不出节制与忍耐。最后两级都是爱人：先爱弟兄，再爱众人。品格的顶点不是一个人多属灵，是他多能爱。<\/p><p>这一段经文最该拿来照自己，不该拿来量别人。今天你的信心里，最缺哪一项的供应？是节制，还是忍耐？是爱弟兄，还是爱那一位教会外、不好爱的人？别急着一次补齐八项。在信心里，大方地供应一项——那一位已经供应你一切的主，会在你里面供应下一项。<\/p>"},{"a":8,"z":9,"star":1,"grk":"<blockquote lang=\"grc\"><p>ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν· ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτιῶν.<\/p><\/blockquote>","lit":"<blockquote><p>「因为这些若在你们里面存在、而且不断增多，就使你们在认识我们主耶稣基督这件事上，不成为闲懒的，也不成为不结果子的。因为谁若没有这些，他就是瞎眼的、眯着眼只看近处，取了遗忘——忘了他从前的罪已经得了洁净。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>充充足足<\/td><td>πλεονάζω<\/td><td>pleonazō<\/td><td>G4121<\/td><td>πλέον（更多）<\/td><td>增多、满溢<\/td><td>现在式分词：不是一次拥有，是持续在增多<\/td><\/tr><tr><td>闲懒<\/td><td>ἀργός<\/td><td>argos<\/td><td>G692<\/td><td>ἀ（否定）＋ ἔργον（工作）<\/td><td>不作工的、闲置的<\/td><td>像一块放着不耕的田；雅 2:20 多数校勘本作 ἀργή（无用的），和合本跟 TR 译「死的」<\/td><\/tr><tr><td>不结果子<\/td><td>ἄκαρπος<\/td><td>akarpos<\/td><td>G175<\/td><td>ἀ（否定）＋ καρπός（果子）<\/td><td>没有果子<\/td><td>认识主本该结果子；问题不在认识太少，在认识没有长出东西<\/td><\/tr><tr><td>眼瞎<\/td><td>τυφλός<\/td><td>typhlos<\/td><td>G5185<\/td><td>—<\/td><td>瞎眼的<\/td><td>属灵的瞎，不是肉眼的瞎<\/td><\/tr><tr><td>只看见近处的<\/td><td>μυωπάζω<\/td><td>myōpazō<\/td><td>G3467<\/td><td>μύω（闭眼）＋ ὤψ（眼）<\/td><td>眯眼、近视<\/td><td>新约仅此一次。英文 myopia 的字源；带「自己把眼眯起来」的意味<\/td><\/tr><tr><td>忘了<\/td><td>λήθη<\/td><td>lēthē<\/td><td>G3024<\/td><td>λανθάνω（遗漏、忘记）<\/td><td>遗忘<\/td><td>新约仅此一次。λήθην λαβών「取了遗忘」——全卷「记念」线的第一笔是「忘记」<\/td><\/tr><tr><td>洁净<\/td><td>καθαρισμός<\/td><td>katharismos<\/td><td>G2512<\/td><td>καθαρός（洁净的）<\/td><td>洁净、洗净<\/td><td>已经发生的洁净；忘了的不是规条，是恩典<\/td><\/tr><\/table>","gram":"<p><strong>① τυφλός ἐστιν μυωπάζων——瞎了，怎么还会近视？<\/strong><\/p><ul><li><strong>程度读法<\/strong>：近视到一个地步，等于瞎了——「瞎到只看见近处」。<\/li><li><strong>原因读法<\/strong>：μυωπάζω 有「眯眼、闭眼」的意思；人自己把眼睛眯起来不看远处的光，久了就瞎了。<\/li><li><strong>修饰读法<\/strong>：分词修饰「瞎」，说明是哪一种瞎——不是全然看不见，是看不见远处（1:11 永远的国）。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>这不是医学描述，是属灵的近视。<\/strong>只看见眼前，看不见永远的国（1:11）与主的再来（1:16）；而 μυωπάζω 带着自己眯眼的成分——这种瞎，有一半是选择。下半句说明病根：忘记了。<\/p><\/blockquote><p><strong>② λήθην λαβών<\/strong>：惯用语「取了遗忘」，即忘记。不定过去式分词，说明「瞎」的原因。全卷的「记念」线（1:12、13、15；3:1、2、5、8）由这里起步，3:5 是「故意忘记」，3:8 是「不可忘记」。<\/p><p><strong>③ 条件分词<\/strong>：ὑπάρχοντα καὶ πλεονάζοντα 是现在式分词，作条件：「若存在并且增多」。双重否定 οὐκ ἀργοὺς οὐδὲ ἀκάρπους 是曲言法（litotes），意思是「必定活泼、必定结果子」。<\/p><p>异文：τῶν πάλαι αὐτοῦ ἁμαρτιῶν 有抄本作 ἁμαρτημάτων（罪行），意思不变（待以实档核对）。<\/p>","exp":"<p><strong>彼得说，不长进的人有两个病：看不远，记不住。<\/strong><\/p><p>1:8 先说正面：这些品格若在你们里面，而且不断增多，认识主就不会闲着，不会光开花不结果。ἀργός 是「不作工」——像一块田放着不耕。<strong>认识主本身不是终点，认识主是一块要结果子的田。<\/strong><\/p><p>1:9 说反面。没有这些的人，是 τυφλός，瞎眼；而且是 μυωπάζων——新约只用这一次的字，英文 myopia（近视）就从这里来。字根是「眯眼」。不是天生看不见，是自己把眼眯起来，只盯着眼前的那一点。<\/p><p>眼前的那一点是什么？今天的帐单，这个月的业绩，别人的一句话。看不见的远处是什么？1:11 那「永远的国」。<\/p><p>病根在下半句：「忘了他旧日的罪已经得了洁净」。λήθη，遗忘，新约也只用这一次。这个人忘记的不是规条，是恩典。他忘了自己曾经多脏，忘了主怎样把他洗净。一个忘了自己被赦免多少的人，就不会长出忍耐与爱——因为他不再觉得自己欠了什么。<\/p><p>这节经文不是用来指着别人说「你瞎了」。它是给我们自己的眼科检查。治疗的方法也很温柔：不是更用力，是想起来。想起你被洁净的那一天，远处的国就重新清楚了。<\/p><p>〔背景〕路 22:61「彼得便想起主对他所说的话」——把彼得从跌倒里叫回来的，正是一次「想起来」；不是彼得记性好，是主转过身来看他。<\/p>"},{"a":10,"z":11,"star":2,"grk":"<blockquote lang=\"grc\"><p>διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε. οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.<\/p><\/blockquote>","lit":"<blockquote><p>「所以，弟兄们，更要殷勤，使你们的蒙召和拣选成为坚固确实的；因为你们行这些事，就在任何时候都绝不会跌倒。因为这样，进入我们主和救主耶稣基督永远之国的入口，必要丰丰富富地供应给你们。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>殷勤<\/td><td>σπουδάζω<\/td><td>spoudazō<\/td><td>G4704<\/td><td>σπουδή（热切）<\/td><td>竭力、赶紧去做<\/td><td>回应 1:5 的「殷勤」；不定过去式命令语气<\/td><\/tr><tr><td>坚定不移<\/td><td>βέβαιος<\/td><td>bebaios<\/td><td>G949<\/td><td>βαίνω（行走、踏步）<\/td><td>踏得稳的、确实的<\/td><td>蒲草纸契约上「有效的保证」的法律用语；1:19「更确」同字<\/td><\/tr><tr><td>恩召<\/td><td>κλῆσις<\/td><td>klēsis<\/td><td>G2821<\/td><td>καλέω（呼召）<\/td><td>呼召<\/td><td>回指 1:3「召我们的主」：呼召的起点在他<\/td><\/tr><tr><td>拣选<\/td><td>ἐκλογή<\/td><td>eklogē<\/td><td>G1589<\/td><td>ἐκ（出）＋ λέγω（挑选）<\/td><td>拣选<\/td><td>与「恩召」共用一个冠词：同一件恩典的两面<\/td><\/tr><tr><td>失脚<\/td><td>πταίω<\/td><td>ptaiō<\/td><td>G4417<\/td><td>—<\/td><td>绊跌、跌倒<\/td><td>雅 3:2「在许多事上都有过失」同字；指行路绊倒，不是一跌就永远失落<\/td><\/tr><tr><td>丰丰富富<\/td><td>πλουσίως<\/td><td>plousiōs<\/td><td>G4146<\/td><td>πλοῦτος（财富）<\/td><td>富足地、慷慨地<\/td><td>不是勉强挤进门，是被盛大迎接<\/td><\/tr><tr><td>得以进入<\/td><td>ἐπιχορηγέω<\/td><td>epichorēgeō<\/td><td>G2023<\/td><td>ἐπί ＋ χορηγέω<\/td><td>慷慨供应<\/td><td>1:5 主动式「你们要供应」，1:11 被动式「必供应给你们」：神是那位更大方的供应者<\/td><\/tr><tr><td>进入<\/td><td>εἴσοδος<\/td><td>eisodos<\/td><td>G1529<\/td><td>εἰς（进）＋ ὁδός（路）<\/td><td>入口、进入<\/td><td>对照 1:15 彼得的 ἔξοδος（出去）：出了帐棚，就是进了国<\/td><\/tr><\/table>","gram":"<p><strong>① 拣选要靠我们「坚定」吗？<\/strong><\/p><ul><li><strong>确据读法<\/strong>（改革宗多采）：神的拣选本身不会动摇；「使之坚定」是让蒙召在信徒自己的经历与见证中变得确实——品格是拣选的证据，不是拣选的原因。<\/li><li><strong>参与读法<\/strong>（阿米念传统多采）：人的回应真实地参与在保守之中；不殷勤，蒙召就可能落空。<\/li><li><strong>契约读法<\/strong>：βέβαιος 在当时的契约上指「有效的保证」；信徒的生命成了神呼召的「确认书」。<\/li><\/ul><p>文法线索：ποιεῖσθαι 是关身语态，「为你们自己」使之坚定——对象是你们的确据，不是在神那边补上什么。部分抄本（如西乃、亚历山大抄本）在此加上「借着你们的善行」（διὰ τῶν καλῶν ὑμῶν ἔργων），多数校勘本视为后加的解说。<\/p><blockquote><p><strong>最好的理解：<\/strong><strong>源头在神，确据在生命。<\/strong>呼召与拣选起于「召我们的主」（1:3）；1:5–7 的品格不是买门票，是让蒙召的人自己看见、也让人看见：这呼召是真的。这与 1:3 的「已将一切赐给」互相成全，而不是互相抵消。（另见 ISS00_5）<\/p><\/blockquote><p><strong>② οὐ μὴ πταίσητέ ποτε<\/strong>：οὐ μή 加不定过去式假设语气，是希腊文最强的否定，再加 ποτε（任何时候）。πταίω 是行路绊跌（雅 2:10；3:2），讲的是在路上不至跌倒，不是「从此不会有软弱」。<\/p><p><strong>③ 主动与被动<\/strong>：1:5 ἐπιχορηγήσατε（你们要供应）→ 1:11 ἐπιχορηγηθήσεται（必供应给你们，属神的被动式）。同一个字，一来一往。<\/p>","exp":"<p><strong>你在这里供应德行，神在那里供应入口——同一个字，主动在前，被动在后。<\/strong><\/p><p>1:10 是全卷最容易让人不安的一节：「使你们所蒙的恩召和拣选坚定不移」。难道拣选要靠我撑住？<\/p><p>看字。βέβαιος 是当时契约上的用语：一份买卖成交了，要有一份「确实有效」的保证书。神的呼召是那份交易；我们的品格，是让这份交易在世人眼前、也在自己心里「看得见」的确认。动词 ποιεῖσθαι 用关身语态——为你们自己。<strong>源头在神，确据在生命。<\/strong><\/p><p>然后是应许：「就永不失脚」。οὐ μή 是希腊文最重的否定。写这句话的人，曾经在加利利的水面上往下沉，曾经在大祭司的院子里跌得很重。他知道失脚是什么滋味，也知道是谁把他拉起来。πταίω 是走路绊倒，不是说软弱的人从此出局。<\/p><p>1:11 的「进入」，原文又是 1:5 那个合唱团供应者的字，这次是被动式。你在信心里大方供应德行；神在将来大方供应你进国的入口。πλουσίως，丰丰富富——不是从门缝里挤进去，是被盛大地迎进去。<\/p><p>国是「我们主救主耶稣基督」的，而且是「永远的」。让耶稣作王，不是只在今天的生活里让他坐上宝座；那国的门，最后也是他亲手打开的。<\/p><p>〔背景〕太 14:30–31——他「将要沉下去」，「耶稣赶紧伸手拉住他」；写「永不失脚」的人，是被主拉住过的人。<\/p>"},{"a":12,"z":13,"star":1,"grk":"<blockquote lang=\"grc\"><p>Διὸ μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ. δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,<\/p><\/blockquote>","lit":"<blockquote><p>「所以我总要时常提醒你们这些事，虽然你们已经知道，也已经在临到你们的真理上被坚固了。我认为这是应当的：只要我还在这个帐棚里，就要用提醒来唤醒你们。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>提醒<\/td><td>ὑπομιμνῄσκω<\/td><td>hypomimnēskō<\/td><td>G5279<\/td><td>ὑπό（在下）＋ μιμνῄσκω（记得）<\/td><td>使人想起<\/td><td>不是教新的，是把已知的再放到眼前；与 1:9「忘了」正面相对<\/td><\/tr><tr><td>坚固<\/td><td>στηρίζω<\/td><td>stērizō<\/td><td>G4741<\/td><td>—<\/td><td>使站稳、坚立<\/td><td>完成式被动分词 ἐστηριγμένους：已经被坚固了。路 22:32「坚固你的弟兄」；彼前 5:10「必要……坚固你们」<\/td><\/tr><tr><td>已有的<\/td><td>πάρειμι<\/td><td>pareimi<\/td><td>G3918<\/td><td>παρά（在旁）＋ εἰμί（是）<\/td><td>在场、已来到<\/td><td>「临到你们的」真理：不是新出的真理，是已经来到你们中间的福音<\/td><\/tr><tr><td>应当<\/td><td>δίκαιος<\/td><td>dikaios<\/td><td>G1342<\/td><td>δίκη（公正）<\/td><td>合宜的、公义的<\/td><td>提醒是一件「对的事」：爱人的人有责任重复<\/td><\/tr><tr><td>帐棚<\/td><td>σκήνωμα<\/td><td>skēnōma<\/td><td>G4638<\/td><td>σκηνή（帐棚）<\/td><td>帐棚、居所<\/td><td>指身体：暂时的、要拆的；这使我们想起太 17:4 他想在山上搭的棚<\/td><\/tr><tr><td>激发<\/td><td>διεγείρω<\/td><td>diegeirō<\/td><td>G1326<\/td><td>διά（彻底）＋ ἐγείρω（叫醒）<\/td><td>唤醒、激动<\/td><td>门徒在风浪中「叫醒」主用同一个字根（路 8:24）；3:1 再用<\/td><\/tr><tr><td>提醒<\/td><td>ὑπόμνησις<\/td><td>hypomnēsis<\/td><td>G5280<\/td><td>ὑπό ＋ μιμνῄσκω<\/td><td>提醒（名词）<\/td><td>3:1「这两封都是提醒你们」同字<\/td><\/tr><\/table>","gram":"<p><strong>① μελλήσω<\/strong>：μέλλω 的将来式，新约罕见，意思是「我总要／我会一直预备」。TR 作 οὐκ ἀμελήσω（我不会疏忽），意思相近。两读都表达一个临终者的决心。<\/p><p><strong>② ἐν τῇ παρούσῃ ἀληθείᾳ 是什么真理？<\/strong><\/p><ul><li><strong>「已经临到你们的真理」<\/strong>：πάρειμι 指「在场、已来到」；这使我们想起西 1:5–6「福音传到你们那里」也用同字。真理是已经交付的福音。<\/li><li><strong>「当前的真理」<\/strong>：把它读成「某个时代特有、新近才启示的真理」。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>「已经临到你们、你们已经拥有的真理」。上下文说「你们虽然晓得」——彼得提醒的不是新东西，正是他们已经知道的；所以这节不支持任何「新的、只有某些人才知道的真理」。<\/p><\/blockquote><p><strong>③ καίπερ 让步<\/strong>：「虽然你们已经知道、已经站稳」——提醒不是因为对方差，是因为人会忘（1:9）。<\/p>","exp":"<p><strong>「你们已经知道，也已经站稳了——所以我还要提醒。」<\/strong><\/p><p>这是遗言的开头。一个知道自己快死的人，最想说的是什么？彼得说，不是新东西，是你们已经知道的那些。<\/p><p>我们常以为长进就是学新的。彼得却说，长进有一半是记得。1:9 那个眯眼的人，病在「忘了」；1:12 的药，就叫「提醒」。<\/p><p>「坚固」这个字，是彼得一生的字。主被卖那一夜对他说：「你回头以后，要坚固你的弟兄。」（路 22:32）他在第一封信的末了写：神「必要亲自……坚固你们」（彼前 5:10）。现在他说，你们已经「在真道上坚固」——ἐστηριγμένους，完成式被动：是被坚固的，而且到今天还站着。<strong>主给他的那份功课，他做到了最后一封信。<\/strong><\/p><p>1:13 他称自己的身体为「帐棚」。一个住帐棚的人知道，帐棚是暂时的。只要帐棚还没拆，他就要做一件事：διεγείρειν，把你们彻底叫醒。<\/p><p>今天的教会很怕重复。讲台想要新的题目，小组想要新的教材。可是爱人的人不怕重复。临终的使徒没有说新的，他只是把你已经知道的，再一次放到你眼前。你身边那一位，或许不缺新知识，缺的是一个肯一再提醒他的人——920 的「2」，常常就是这样被坚固的。<\/p><p>〔背景〕路 22:31–32——不是彼得多会坚固人，是主先为他祈求，叫他不至于失了信心。〔彼前〕彼得前书讲义第 5 章（彼前 5:10 坚固）。<\/p>"},{"a":14,"z":15,"star":1,"grk":"<blockquote lang=\"grc\"><p>εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι· σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.<\/p><\/blockquote>","lit":"<blockquote><p>「因为我知道，脱下我这帐棚的时候快到了，正如我们的主耶稣基督向我指明的。我也要尽力，使你们在我出去（我的「出埃及」）以后，随时都能记念这些事。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>快<\/td><td>ταχινός<\/td><td>tachinos<\/td><td>G5031<\/td><td>ταχύς（快）<\/td><td>快的、迫近的、突然的<\/td><td>2:1「速速的灭亡」同字；这里指日子近了<\/td><\/tr><tr><td>脱离<\/td><td>ἀπόθεσις<\/td><td>apothesis<\/td><td>G595<\/td><td>ἀπό（离）＋ τίθημι（放）<\/td><td>放下、脱下（如脱衣）<\/td><td>彼前 3:21「除掉肉体的污秽」同字；帐棚像衣服一样脱下<\/td><\/tr><tr><td>指示<\/td><td>δηλόω<\/td><td>dēloō<\/td><td>G1213<\/td><td>δῆλος（明显的）<\/td><td>指明、说清楚<\/td><td>不定过去式：主曾经在某一刻清楚告诉他（约 21:18–19）<\/td><\/tr><tr><td>时常<\/td><td>ἑκάστοτε<\/td><td>hekastote<\/td><td>G1539<\/td><td>ἕκαστος（每一个）<\/td><td>每一次、随时<\/td><td>新约仅此一次：他要的是随时随地都想得起来<\/td><\/tr><tr><td>去世<\/td><td>ἔξοδος<\/td><td>exodos<\/td><td>G1841<\/td><td>ἐκ（出）＋ ὁδός（路）<\/td><td>出去、出路、离世<\/td><td>七十士译本出埃及记的书名用字；路 9:31 山上谈论主的「去世」就是这个字<\/td><\/tr><tr><td>记念<\/td><td>μνήμη<\/td><td>mnēmē<\/td><td>G3420<\/td><td>μιμνῄσκω（记得）<\/td><td>记忆、记念<\/td><td>新约仅此一次。遗言就是留给人记得的<\/td><\/tr><tr><td>尽心竭力<\/td><td>σπουδάζω<\/td><td>spoudazō<\/td><td>G4704<\/td><td>σπουδή（热切）<\/td><td>竭力<\/td><td>将来式：他要殷勤的，是别人在他死后还能记得<\/td><\/tr><\/table>","gram":"<p><strong>① ταχινή 是「快到了」还是「会很突然」？<\/strong><\/p><ul><li><strong>迫近<\/strong>：彼得已经年老，又在尼禄逼迫的阴影下，知道日子近了。<\/li><li><strong>突然<\/strong>：死亡会以暴力、突然的方式临到（照约 21:18–19 的预告）。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>以「迫近」为主，「突然」为辅。两者都指向同一件事：主预告的那一天到了。<\/p><\/blockquote><p><strong>② 「主所指示我的」指什么？<\/strong>最自然的背景是约 21:18–19。后世《彼得行传》有「主啊，你往哪里去？」（Quo vadis）的传说，可作教会历史的背景知识，但不能作经文的根据。<\/p><p><strong>③ 1:15「使你们……时常记念」指什么？<\/strong><\/p><ul><li><strong>这封信本身<\/strong>：写下来，就是为了死后还能被读。<\/li><li><strong>马可福音<\/strong>：二世纪帕皮亚（Papias）说马可记下了彼得所传的；此说只能作背景，不能从本节证明。<\/li><li><strong>持续的教导<\/strong>：他要确保有人继续提醒。<\/li><\/ul><p>至少包括这封信。<strong>④ 混合的比喻<\/strong>：帐棚「脱下」（像衣服）、「出去」（像出埃及）——两个画面都说死亡是一次迁移，不是消失。<\/p>","exp":"<p><strong>老彼得谈自己的死，用了两个字：脱下帐棚，出埃及。<\/strong><\/p><p>「正如我们主耶稣基督所指示我的。」那是加利利海边的一个早晨。主对他说：「……但年老了，就要伸出手来，别人要把你束上，带你到不愿意去的地方。」约翰接着解释：「耶稣说这话是指着彼得要怎样死，荣耀神。」（约 21:18–19）三十多年来，彼得一直知道自己会怎样死。现在，那一天近了。<\/p><p>他说死亡是 ἀπόθεσις——脱下，像脱一件衣服。帐棚拆了，住帐棚的人没有消失。<\/p><p>1:15 他用了另一个字：ἔξοδος。这是「出埃及」的那个字。在登山变像的山上，摩西、以利亚与主谈论的，正是他「去世」的事——路加用的就是 ἔξοδος（路 9:31）。那一天，彼得在旁边听见主谈论他自己的出埃及，自己却只想搭三座棚，把荣耀留在山上。<\/p><p><strong>年轻的彼得想把荣耀关进帐棚里；年老的彼得知道，帐棚是要拆的，荣耀是要等的。<\/strong>死亡不是结束，是一次出埃及——从为奴之地，走向应许之地。<\/p><p>一个面对死亡的人，最后的「殷勤」用在哪里？不是保住自己的名声，是让别人在他走了以后，还记得主的话。<\/p><p>这是从暂时的观点，转到永恒的观点。我们每个人都住在帐棚里。问题不是帐棚什么时候拆，是拆了以后，别人记得的是你，还是你所指向的那一位。<\/p><p>〔背景〕太 17:4；路 9:31；约 21:18–19——不是彼得多勇敢地面对死亡，是主早就把结局告诉他，又陪他走了三十年。〔彼前〕彼得前书讲义第 3 章（彼前 3:21 ἀπόθεσις「除掉」）。<\/p>"},{"a":16,"z":16,"star":2,"grk":"<blockquote lang=\"grc\"><p>Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.<\/p><\/blockquote>","lit":"<blockquote><p>「因为我们把我们主耶稣基督的大能和来临告诉你们，并不是跟从了巧妙编造的神话，而是成了亲眼目睹他威荣的见证人。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>乖巧<\/td><td>σοφίζω<\/td><td>sophizō<\/td><td>G4679<\/td><td>σοφός（聪明的）<\/td><td>使聪明；精心编造<\/td><td>完成式被动分词 σεσοφισμένοις：经过精心设计的<\/td><\/tr><tr><td>捏造的虚言<\/td><td>μῦθος<\/td><td>mythos<\/td><td>G3454<\/td><td>—<\/td><td>故事、神话<\/td><td>新约另见于教牧书信（提前 1:4；4:7；提后 4:4；多 1:14），一律是负面的<\/td><\/tr><tr><td>随从<\/td><td>ἐξακολουθέω<\/td><td>exakoloutheō<\/td><td>G1811<\/td><td>ἐκ ＋ ἀκολουθέω（跟随）<\/td><td>跟从<\/td><td>2:2「随从他们邪淫的」、2:15 同字：跟从什么，就成为什么<\/td><\/tr><tr><td>大能<\/td><td>δύναμις<\/td><td>dynamis<\/td><td>G1411<\/td><td>δύναμαι（能够）<\/td><td>能力<\/td><td>与 1:3「神能」同字<\/td><\/tr><tr><td>降临<\/td><td>παρουσία<\/td><td>parousia<\/td><td>G3952<\/td><td>παρά（在旁）＋ οὐσία（存在）<\/td><td>来临、驾临<\/td><td>王驾临的字；3:4 讥诮的人问「主要降临的应许在哪里呢」，3:12 同字<\/td><\/tr><tr><td>亲眼见过的<\/td><td>ἐπόπτης<\/td><td>epoptēs<\/td><td>G2030<\/td><td>ἐπί（在上）＋ ὁράω（看）<\/td><td>目睹者、观察者<\/td><td>新约仅此一次。神秘宗教称最高级「入门者」的字；彼得说：我们不是入了什么门，是在场的人<\/td><\/tr><tr><td>威荣<\/td><td>μεγαλειότης<\/td><td>megaleiotēs<\/td><td>G3168<\/td><td>μέγας（大）<\/td><td>威严、宏伟<\/td><td>路 9:43 登山变像下山后众人「诧异神的大能（威荣）」——同一个字<\/td><\/tr><\/table>","gram":"<p><strong>① 「大能和他降临的事」指哪一次来临？<\/strong><\/p><ul><li><strong>第二次再来<\/strong>：παρουσία 在本卷另两次（3:4、12）都指主再来；登山变像是再来的预演。这使我们想起太 16:28 主说有人「在没尝死味以前必看见人子降临在他的国里」，紧接着就是 17:1 的登山变像。<\/li><li><strong>第一次来临<\/strong>：指道成肉身、主在地上的整个事工。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>指主的再来；登山变像是那日荣耀的预先显现。<\/strong>δύναμιν καὶ παρουσίαν 共用一个冠词，可视为重言法（hendiadys）：「大有能力的来临」。这也解释了为什么第 3 章的讥诮者要攻击的正是「他降临的应许」。<\/p><\/blockquote><p><strong>② σεσοφισμένοις μύθοις<\/strong>：可能是回应对手的指控——「使徒传的再来只是神话」；也可能是与希腊罗马诸神「降临人间」的神话划清界线。两者都使彼得的重点更清楚：我们传的是在场目睹的事。<\/p><p><strong>③ ἐγνωρίσαμεν<\/strong>：复数「我们」——彼得、雅各、约翰三个见证人（申 19:15「凭两三个人的口作见证」的原则）。<\/p>","exp":"<p><strong>彼得的福音不是一个好故事，是一件他在场的事。<\/strong><\/p><p>第一世纪的人听过很多「神降临」的故事。希腊的神会化身为人，在人间走动，然后回到奥林帕斯山。这些叫 μῦθοι，神话。编得很巧，讲得很美，大家也知道那只是故事。<\/p><p>彼得说：我们告诉你们主耶稣的大能和他的降临，不是这一类。σεσοφισμένοις，经过精心设计的——我们没有编。<\/p><p>那是什么？ἐπόπται，亲眼目睹的人。这个字新约只出现一次。在当时的神秘宗教里，它指入门仪式最高一级的人——被引进内室，看见秘密的人。<strong>彼得把这个字抢过来：我们不是入了什么秘密的门，我们是站在山上，用自己的眼睛看见的人。<\/strong><\/p><p>看见什么？μεγαλειότης，威荣。路加记载登山变像之后，主下山医好一个被鬼附的孩子，众人「都诧异神的大能」（路 9:43）——用的就是这个字。那份威严是神的，不是见证人的。<\/p><p>今天的人也说：信仰不过是一个安慰人的故事。我们的回答不是讲一个更动人的故事，而是指向那些在场的人、那座山、那个声音。基督教是一个历史的信仰，它站在见证上，不站在感觉上。<\/p><p>所以，传福音的人也不必编。你不必把见证讲得比实际更精彩。照你所看见的说——说主在你身上真实做过的事，就够了。<\/p><p>〔背景〕太 16:28–17:2；路 9:43——威荣是主的；彼得只是刚好被带上山的那一个。<\/p>"},{"a":17,"z":18,"star":2,"grk":"<blockquote lang=\"grc\"><p>λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν, εἰς ὃν ἐγὼ εὐδόκησα— καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ἁγίῳ ὄρει.<\/p><\/blockquote>","lit":"<blockquote><p>「因为他从父神领受了尊贵和荣耀，那时有这样的声音，从那威严的荣耀中被带到他那里：『这是我的儿子，我所爱的，我喜悦他。』——这声音，我们与他同在圣山上的时候，亲耳听见从天上被带下来。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>尊贵<\/td><td>τιμή<\/td><td>timē<\/td><td>G5092<\/td><td>—<\/td><td>尊荣、价值<\/td><td>父给子的尊荣——不是人加给他的<\/td><\/tr><tr><td>荣耀<\/td><td>δόξα<\/td><td>doxa<\/td><td>G1391<\/td><td>δοκέω（显得）<\/td><td>荣耀、光辉<\/td><td>同一节出现两次：子「得荣耀」，声音出自「极大荣光」<\/td><\/tr><tr><td>出来<\/td><td>φέρω<\/td><td>pherō<\/td><td>G5342<\/td><td>—<\/td><td>带、运送、推动<\/td><td>ἐνεχθείσης（1:17）、ἐνεχθεῖσαν（1:18）、ἠνέχθη、φερόμενοι（1:21）：同一个字四次，声音被「带」下来，预言也被「带」出来<\/td><\/tr><tr><td>极大荣光<\/td><td>μεγαλοπρεπής<\/td><td>megaloprepēs<\/td><td>G3169<\/td><td>μέγας（大）＋ πρέπω（相称）<\/td><td>威严的、宏伟的<\/td><td>新约仅此一次。「威严的荣耀」是对神的敬称，避免直呼其名<\/td><\/tr><tr><td>爱子<\/td><td>ἀγαπητός<\/td><td>agapētos<\/td><td>G27<\/td><td>ἀγαπάω（爱）<\/td><td>所爱的、独爱的<\/td><td>这使我们想起创 22:2 以撒「你独生的儿子，你所爱的」<\/td><\/tr><tr><td>喜悦<\/td><td>εὐδοκέω<\/td><td>eudokeō<\/td><td>G2106<\/td><td>εὖ（好）＋ δοκέω（认为）<\/td><td>喜悦、满意<\/td><td>不定过去式：父对子的喜悦，是一个定了的宣告<\/td><\/tr><tr><td>圣山<\/td><td>ὄρος<\/td><td>oros<\/td><td>G3735<\/td><td>—<\/td><td>山<\/td><td>与 ἅγιος（G40，圣）连用；山不具名，圣是因为神在那里说话<\/td><\/tr><\/table>","gram":"<p><strong>① 没有主要动词的句子<\/strong>：1:17 以分词 λαβών（他领受了）开头，句子却没有完成，中间插进天父的话，1:18 换成「我们听见」——文法上的破格（anacoluthon）。一个老人回忆一生最重要的一刻，句子断了，正是口述的样子。<\/p><p><strong>② 为什么没有「你们要听他」？<\/strong><\/p><ul><li>对观福音三卷都有「你们要听他」（太 17:5；可 9:7；路 9:35）；彼得这里没有。<\/li><li><strong>独立见证说<\/strong>：措辞与三卷福音书都不完全相同，显示这是一个独立的记忆，不是抄写福音书。<\/li><li><strong>重点选择说<\/strong>：彼得要证明的是子的尊贵与再来的确实，所以只引父对子的宣告。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>两者并存：措辞的差异反而是亲身见证的痕迹；彼得只留下他要用来证明 1:16 的那一句。而「你们要听他」的意思，他在 1:19–21 用另一种方式讲了：要留意先知的话。<\/p><\/blockquote><p><strong>③ 「圣山」<\/strong>：彼得没说是哪一座山（他泊山或黑门山都是后世的推测）。这使我们想起诗 2:6–7——神在「我的圣山」立了他的王，并说「你是我的儿子」；天父在山上的宣告，正是那一篇诗的回声。<\/p>","exp":"<p><strong>那一天在山上，彼得说了一大段话；三十年后，他只记得天父说的那一句。<\/strong><\/p><p>福音书记下那天彼得说的话：「夫子，我们在这里真好！可以搭三座棚……」路加接着加了一句：「他却不知道所说的是什么。」（路 9:33）<\/p><p>三十年过去了。彼得在信里完全没有提自己说了什么。他只记得一个声音：「这是我的爱子，我所喜悦的。」<\/p><p><strong>一个人老了以后，会忘记自己曾经说过多少话，却不会忘记神说过的那一句。<\/strong><\/p><p>1:17 的文法也透露了这一点。他用 λαβών（他领受了）开头，句子却没有写完——中间插进天父的话，接着就跳到「我们听见」。像一个老人在讲一件太重要的事，讲到一半，声音停住了。<\/p><p>还有一个字要记住：φέρω，带。声音「被带」到他那里（1:17），我们听见它从天上「被带」下来（1:18）。到了 1:21，同一个字又出现两次：预言不是凭人意「带出来」的，先知是被圣灵「带着」说话的。<strong>山上的声音与经上的预言，是从同一个方向来的。<\/strong><\/p><p>耶稣是我的榜样——但榜样首先不是一套规条，是一位被父喜悦的儿子。我们效法他之前，先听见父怎样称呼他。而那一位爱子，正是叫我们也被称为神儿女的那一位。<\/p><p>〔背景〕太 17:1–8；可 9:2–8；路 9:28–36——新约福音书以外唯一的登山变像记载；彼得记得的不是自己，是父对子的那一句话。<\/p>"},{"a":19,"z":19,"star":3,"grk":"<blockquote lang=\"grc\"><p>καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·<\/p><\/blockquote>","lit":"<blockquote><p>「并且我们有那更加确实的先知之言；你们留心它，如同留心一盏在幽暗污浊之处发光的灯，是很好的，直到天色透亮、晨星在你们心里升起。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>更确<\/td><td>βέβαιος<\/td><td>bebaios<\/td><td>G949<\/td><td>βαίνω（踏步）<\/td><td>稳固的、确实的<\/td><td>比较级 βεβαιότερον；与 1:10「坚定不移」同字<\/td><\/tr><tr><td>先知的<\/td><td>προφητικός<\/td><td>prophētikos<\/td><td>G4397<\/td><td>προφήτης（先知）<\/td><td>属先知的<\/td><td>「先知之言」指旧约预言整体（1:20「经上所有的预言」）<\/td><\/tr><tr><td>留意<\/td><td>προσέχω<\/td><td>prosechō<\/td><td>G4337<\/td><td>πρός（向）＋ ἔχω（持）<\/td><td>专心注意、紧紧看着<\/td><td>现在式分词：持续地留意，不是偶尔看一眼<\/td><\/tr><tr><td>灯<\/td><td>λύχνος<\/td><td>lychnos<\/td><td>G3088<\/td><td>—<\/td><td>油灯<\/td><td>这使我们想起诗 119:105「你的话是我脚前的灯」<\/td><\/tr><tr><td>暗处<\/td><td>αὐχμηρός<\/td><td>auchmēros<\/td><td>G850<\/td><td>αὐχμός（干旱）<\/td><td>干枯的、污浊的、幽暗的<\/td><td>新约仅此一次。不只是暗，是又干又脏的地方——我们所住的世界<\/td><\/tr><tr><td>发亮<\/td><td>διαυγάζω<\/td><td>diaugazō<\/td><td>G1306<\/td><td>διά（透）＋ αὐγή（光）<\/td><td>透出光来、破晓<\/td><td>新约仅此一次。天光穿透黑暗的那一刻<\/td><\/tr><tr><td>晨星<\/td><td>φωσφόρος<\/td><td>phōsphoros<\/td><td>G5459<\/td><td>φῶς（光）＋ φέρω（带）<\/td><td>带光者、晨星<\/td><td>新约仅此一次。字根又是 φέρω：带来光的那一位；这使我们想起启 22:16「我是明亮的晨星」<\/td><\/tr><tr><td>出现<\/td><td>ἀνατέλλω<\/td><td>anatellō<\/td><td>G393<\/td><td>ἀνά（上）＋ τέλλω<\/td><td>升起<\/td><td>日月星辰升起的字；七十士译本民 24:17「有星要出于雅各」同字<\/td><\/tr><\/table>","gram":"<p><strong>① 「更确的预言」——比什么更确？<\/strong><\/p><ul><li><strong>比经历更确<\/strong>：先知的话比登山变像的经历更可靠——经历会过去，圣经长存。古代与宗教改革时期不少注释采此读法。<\/li><li><strong>经历使预言更确<\/strong>：βεβαιότερον 放在冠词之前，是述语位置——「我们有先知之言，（如今）更加确定了」。登山变像证实了旧约对弥赛亚荣耀的预言。ESV「more fully confirmed」、NIV「completely reliable」采此方向。<\/li><li><strong>绝对比较级（elative）<\/strong>：只是「非常确实」，不与任何东西比。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>经历证实了预言，预言解释了经历。<\/strong>上下文是 1:16–18 的山上见证，接着说「并且我们有」——彼得不是要拿经历和圣经比高低，而是说：我们在山上看见的，正好叫先知的话更确定；你们没上过山，但你们手里有这更确的话。所以这节不能用来贬低经历，更不能用来把经历放在圣经之上。<\/p><\/blockquote><p><strong>② 「在你们心里」接在哪里？晨星是什么？<\/strong><\/p><ul><li><strong>主的再来<\/strong>：「天发亮」指主的日子（3:10、12）；晨星是基督（这使我们想起民 24:17；启 22:16）。<\/li><li><strong>内在的光照<\/strong>：「在你们心里」使人读成今天心里的开窍、确信。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>主要指主的再来，而「在你们心里」说明那日的光不只照在外面，也要完全照进心里；今天留意灯光的人，已经在预尝那个早晨。灯是天亮以前的光——天亮了，灯才放下。<\/p><\/blockquote>","exp":"<p><strong>山上的荣光过去了，灯还在手里。<\/strong><\/p><p>1:16–18 是彼得一生最高的一刻：亲眼看见，亲耳听见。可是收信的人没有上过那座山。今天的我们也没有。那怎么办？<\/p><p>彼得说：「我们并有先知更确的预言。」βεβαιότερον 是比较级。山上的经历，正好叫先知的话更确定了——旧约说弥赛亚要得荣耀，三个门徒亲眼看见了。<strong>经历证实了圣经；但你们不必等到有同样的经历，因为那更确的话已经在你们手里。<\/strong><\/p><p>那话像什么？λύχνος，一盏灯。它照在 αὐχμηρῷ τόπῳ——新约只用这一次的字，意思不只是「暗」，是又干又脏的地方。那就是我们所住的世界：第 2 章的假师傅、第 3 章的讥诮者，都在这个地方。<\/p><p>灯不是太阳。它不会把整个世界照亮，只照亮你脚前的一步。可是在天亮以前，灯就是你唯一可靠的光。<\/p><p>「直等到天发亮，晨星在你们心里出现。」φωσφόρος，带光的那一位，新约也只用这一次。天亮，是主再来的那个早晨；晨星，是他自己。那时灯可以放下了，因为光本人来了。<\/p><p>所以「你们在这预言上留意……才是好的」。προσέχοντες 是现在式：一直看着，不是偶尔看一眼。<\/p><p>这正是「圣经是我的准则」最好的画面。准则不是棍子，是灯。天还没亮的时候，不要丢下手中的灯，去追逐一阵闪光；留意它，一步一步走，直到晨星在你心里升起。<\/p><p>〔旧约〕民数记讲义第 24 章（民 24:17「有星要出于雅各」——这使我们想起）。〔彼前〕彼得前书讲义第 1 章（彼前 1:10–12 众先知寻求考察）。<\/p>"},{"a":20,"z":21,"star":2,"grk":"<blockquote lang=\"grc\"><p>τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται· οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη προφητεία ποτέ, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ἀπὸ θεοῦ ἄνθρωποι.<\/p><\/blockquote>","lit":"<blockquote><p>「首先要知道这一件事：经上所有的预言，都不是出于（先知）自己的解开；因为预言从来不是凭人的意思带出来的，乃是人被圣灵带着，从神那里说了话。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>预言<\/td><td>προφητεία<\/td><td>prophēteia<\/td><td>G4394<\/td><td>πρό（在前）＋ φημί（说）<\/td><td>预言、先知的话<\/td><td>不只是预告未来，是替神说话<\/td><\/tr><tr><td>经上<\/td><td>γραφή<\/td><td>graphē<\/td><td>G1124<\/td><td>γράφω（写）<\/td><td>经文、圣经<\/td><td>指已写成的旧约圣经；3:16 保罗的信也被列在「别的经书」里<\/td><\/tr><tr><td>私意<\/td><td>ἴδιος<\/td><td>idios<\/td><td>G2398<\/td><td>—<\/td><td>自己的、私人的<\/td><td>1:3「自己的荣耀」同字；这里是先知「自己的」<\/td><\/tr><tr><td>解说<\/td><td>ἐπίλυσις<\/td><td>epilysis<\/td><td>G1955<\/td><td>ἐπί ＋ λύω（解开）<\/td><td>解开、解释<\/td><td>新约仅此一次。动词 ἐπιλύω 见可 4:34（讲解）；指把异象或谜「解开」<\/td><\/tr><tr><td>人意<\/td><td>θέλημα<\/td><td>thelēma<\/td><td>G2307<\/td><td>θέλω（愿意）<\/td><td>意愿、意志<\/td><td>预言的源头不在人想不想说<\/td><\/tr><tr><td>感动<\/td><td>φέρω<\/td><td>pherō<\/td><td>G5342<\/td><td>—<\/td><td>带、推动<\/td><td>φερόμενοι 现在式被动分词：被带着走；这使我们想起徒 27:15、17 船被风刮去的同一个字<\/td><\/tr><tr><td>圣灵<\/td><td>πνεῦμα<\/td><td>pneuma<\/td><td>G4151<\/td><td>πνέω（吹）<\/td><td>灵、风、气息<\/td><td>与 φέρω 并用，画面更清楚：风与帆<\/td><\/tr><tr><td>说出<\/td><td>λαλέω<\/td><td>laleō<\/td><td>G2980<\/td><td>—<\/td><td>说话<\/td><td>主词是「人」：人真实地说，神真实地带<\/td><\/tr><\/table>","gram":"<p><strong>① 「没有可随私意解说的」——讲的是预言的来源，还是读者的解释？<\/strong><\/p><ul><li><strong>来源读法<\/strong>：先知没有凭自己去「解开」所见的异象或环境；预言不是出于先知自己的解释。理由：1:21 以 γάρ（因为）接续，说明的正是来源——「预言从来没有出于人意的」；γίνεται（产生、出现）讲的是预言怎样产生。<\/li><li><strong>读者读法<\/strong>：读者不可凭个人意思解经，需要群体或教会的权威。天主教传统常引此节；部分新教注释也采此读法。<\/li><li><strong>圣灵读法<\/strong>：预言出于圣灵，所以读者也需要同一位圣灵光照才能明白。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>主要讲预言的来源。<\/strong>1:21 的「因为」把 1:20 解释清楚：预言不是先知自己想出来、自己解开的，是圣灵带着人说出神的话。这节不是禁止信徒自己读经，也不是说只有牧师才能解经。但由来源推出读法：既然经文不是出于人意，读的人也不可「强解」（3:16）——读经的保护是在群体中读、照上下文读、谦卑地读。（另见 ISS00_3）<\/p><\/blockquote><p><strong>② φερόμενοι 与 ἠνέχθη<\/strong>：被动语态，同一个 φέρω。人没有失去自己——「人……说出」，主词是人；但推动的力量从神来。这使我们想起徒 27:15、17：保罗的船「任风刮去」，用的就是这个字。这不是机械口述，也不是人的灵感；像帆船，帆是人的，风是神的。<\/p><p><strong>③ 异文<\/strong>：ἀπὸ θεοῦ ἄνθρωποι（人从神那里说话）有抄本作 ἅγιοι θεοῦ ἄνθρωποι（神的圣人说话；TR，KJV「holy men of God」）。和合本「说出神的话来」接近前者。两读都不改变圣灵是源头的重点。<\/p>","exp":"<p><strong>圣经不是先知自己想出来的，所以也不是读的人可以随意改写的——但这不是叫人不敢读经。<\/strong><\/p><p>1:20 是全卷最常被误用的经文之一。有人拿它说：「你不要自己读经，会读错。」可是看原文，彼得讲的首先不是读的人，而是写的人。<\/p><p>ἐπίλυσις 新约只用这一次，意思是「解开」——把一个异象、一个谜解开。彼得说，经上的预言不是先知自己解开的。先知看见了，但说出来的意思不是他自己推想出来的。<\/p><p>证据就在下一节的「因为」。「预言从来没有出于人意的，乃是人被圣灵感动，说出神的话来。」<strong>1:20 讲来源，1:21 说明来源。<\/strong><\/p><p>「感动」原文 φερόμενοι，是 1:17–18 那个「带」的字。保罗坐船去罗马，遇上大风，「船被风抓住，敌不住风，我们就任风刮去」——这使我们想起徒 27:15 同一个字。先知像一艘帆船：帆是他的，声音、用字、性情都是他的；风是圣灵的，方向是神的。<\/p><p>那读经的人呢？既然经文不是出于人意，我们也不可以照私意去扭曲它（3:16「强解」）。保护不是把圣经锁起来，是三件事：在群体中读，照上下文读，谦卑地读。<\/p><p>圣灵是我的引导。那一位当初带着先知说话的圣灵，今天也带着读经的人明白。打开你的圣经吧。不是凭私意，而是跟弟兄姐妹一起，在同一位圣灵的风里读。<\/p><p>〔彼前〕彼得前书讲义第 1 章（彼前 1:10–12：众先知「详细地寻求考察」，在他们心里的是基督的灵）。<\/p>"}],"2":[{"a":1,"z":1,"star":2,"grk":"<blockquote lang=\"grc\"><p>Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·<\/p><\/blockquote>","lit":"<blockquote><p>「然而从前在百姓中也有假先知起来，照样，在你们中间也将有假教师；他们要从旁偷偷带进导致灭亡的派系主张，甚至否认那买了他们的主人，给自己招来迅速的灭亡。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>假师傅<\/td><td>ψευδοδιδάσκαλοι<\/td><td>pseudodidaskaloi<\/td><td>G5572<\/td><td>ψευδής＋διδάσκαλος<\/td><td>假的教师<\/td><td>新约仅此一次；他们的身分是「教」的人，问题出在所教的内容<\/td><\/tr><tr><td>私自引进<\/td><td>παρεισάξουσιν<\/td><td>pareisaxousin<\/td><td>G3919<\/td><td>παρά＋εἰς＋ἄγω<\/td><td>从旁带进<\/td><td>新约仅此一次；不是公开唱反调，是夹带<\/td><\/tr><tr><td>异端<\/td><td>αἱρέσεις<\/td><td>haireseis<\/td><td>G139<\/td><td>αἱρέομαι（选择）<\/td><td>选择、派别<\/td><td>还不是后来的教义术语；是自己挑选、造成分裂的主张<\/td><\/tr><tr><td>买<\/td><td>ἀγοράσαντα<\/td><td>agorasanta<\/td><td>G59<\/td><td>ἀγορά（市场）<\/td><td>在市场上买下<\/td><td>奴隶市场的字：主人已经付了价<\/td><\/tr><tr><td>主<\/td><td>δεσπότην<\/td><td>despotēn<\/td><td>G1203<\/td><td>—<\/td><td>主人、主宰<\/td><td>不是一般的 κύριος，是对奴仆有产权的主人<\/td><\/tr><tr><td>不承认<\/td><td>ἀρνούμενοι<\/td><td>arnoumenoi<\/td><td>G720<\/td><td>—<\/td><td>否认、不认<\/td><td>彼得在院子里三次不认主的字（路 22:57）<\/td><\/tr><tr><td>速速的<\/td><td>ταχινήν<\/td><td>tachinēn<\/td><td>G5031<\/td><td>ταχύς<\/td><td>迅速的<\/td><td>1:14「快到了」同一个字<\/td><\/tr><\/table>","gram":"<p><strong>① τὸν ἀγοράσαντα αὐτοὺς δεσπότην——基督为谁付了价？<\/strong><\/p><ul><li><strong>普遍救赎<\/strong>（阿米念、卫斯理传统与部分路德宗）：基督确实为所有人、连后来沉沦的假师傅也付了价；可见救赎之功可以被人拒绝。<\/li><li><strong>有限救赎<\/strong>（多数改革宗）：「买」是照他们自己的认信、在群体眼中的说法；或借用申 32:6 神「将你买来」以色列全体的盟约语言，不是讲个人蒙拣选的救赎。<\/li><li><strong>足够于众人、有效于信者<\/strong>（亚目拉督派等折衷读法）：基督的死足够所有人，只在信的人身上生效。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得在这里不是要裁决救赎的范围，而是要量出罪的深度——他们否认的，是一位付了价的主人。这一节两派都读得通，不宜单凭它定案；两派都同意的是：假师傅在群体里面，口称属主。<\/strong><\/p><\/blockquote><p><strong>② αἱρέσεις 是「异端」还是「派别」？<\/strong><\/p><ul><li>在林前 11:19、加 5:20 它指结党、派别；到二世纪才成为「异端」的专门术语。<\/li><li>这里加上 ἀπωλείας（灭亡的），已经不是中性的「意见不同」，而是把人带向灭亡的主张。<\/li><\/ul><blockquote><p><strong>最好的理解：自己挑选、造成分裂、终局是灭亡的教训；「异端」的后期意思在这里正在成形。<\/strong><\/p><\/blockquote><p><strong>③ 时态<\/strong>：本节用未来式（ἔσονται、παρεισάξουσιν），是遗言体的预言；但从 2:10 起彼得多半改用现在式描述他们——预言已经在读者眼前应验。<\/p>","exp":"<p><strong>写「不承认」这三个字的人，自己曾经三次不承认主。<\/strong><\/p><p>彼得从以色列的历史说起：「从前在百姓中有假先知起来」；接着把话转向读者：「将来在你们中间也必有假师傅」。两个词要停下来看。「在你们中间」——危险不是从外面攻城，是从里面长出来。「私自引进」παρεισάξουσιν——不是公开举旗反对，是在真道旁边夹带，像把一件东西悄悄塞进行李。所以假师傅很少自称假师傅；他们讲许多对的话，只在要紧的地方换掉一样东西。<\/p><p>换掉的是什么？「连买他们的主他们也不承认。」δεσπότης 是奴隶市场上付了价、有产权的主人；ἀγοράζω 就是在市场上买下。基督用自己的血付了价（彼前 1:18–19），他们却说：我不属于谁。否认不一定是口里说「没有耶稣」，更常是用生活说「他不是我的主人」——2:10「轻慢主治的」、2:19「应许人得以自由」，都是同一个否认的延伸。<\/p><p>而 ἀρνούμενοι 正是大祭司院子里的那个字。彼得和假师傅的分别，不在于他从来没有否认过，而在于主转过身来看他，他出去痛哭，后来在海边被主接了回来。所以这一章不是完美的人居高临下的定罪，是一个被拉回来的人，看见别人正往下走时的大声呼喊。<\/p><p>落到今天：这一节教的是<strong>记号<\/strong>，不是<strong>名单<\/strong>。讲台不点名今天任何牧者、教会或宗派；分辨先从自己开始——我有没有在真道旁边夹带自己的东西？我口称的主，是不是我生活中真正付了价、有产权的主人？<\/p><p>〔背景〕三次不认主（路 22:54–62；约 21:15–17）。〔彼前〕彼得前书讲义第 1 章（1:18–19 重价赎回）。〔犹〕犹 4（犹大书讲义尚未制作）。<\/p>"},{"a":2,"z":3,"star":1,"grk":"<blockquote lang=\"grc\"><p>καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται· καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ νυστάζει.<\/p><\/blockquote>","lit":"<blockquote><p>「并且许多人要紧跟他们的种种放荡，真理的道路因他们要被毁谤；他们又在贪婪中，用捏塑出来的话拿你们做买卖。对他们的判决自古以来并没有闲着，他们的灭亡也没有打盹。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>随从<\/td><td>ἐξακολουθήσουσιν<\/td><td>exakolouthēsousin<\/td><td>G1811<\/td><td>ἐκ＋ἀκολουθέω<\/td><td>紧跟到底<\/td><td>「跟从」本是门徒的字，在这里跟错了人<\/td><\/tr><tr><td>邪淫的行为<\/td><td>ἀσελγείαις<\/td><td>aselgeiais<\/td><td>G766<\/td><td>—<\/td><td>放荡、不知羞耻<\/td><td>复数：一种接一种的放纵<\/td><\/tr><tr><td>被毁谤<\/td><td>βλασφημηθήσεται<\/td><td>blasphēmēthēsetai<\/td><td>G987<\/td><td>—<\/td><td>被毁谤<\/td><td>外人看见的是门徒的生活，骂的却是「道」<\/td><\/tr><tr><td>贪心<\/td><td>πλεονεξίᾳ<\/td><td>pleonexia<\/td><td>G4124<\/td><td>πλέον＋ἔχω<\/td><td>想要更多<\/td><td>本章第一次；2:14 再出现<\/td><\/tr><tr><td>捏造的<\/td><td>πλαστοῖς<\/td><td>plastois<\/td><td>G4112<\/td><td>πλάσσω（捏塑）<\/td><td>捏塑出来的<\/td><td>新约仅此一次；照听众想要的形状捏<\/td><\/tr><tr><td>取利<\/td><td>ἐμπορεύσονται<\/td><td>emporeusontai<\/td><td>G1710<\/td><td>ἐν＋πορεύομαι<\/td><td>经商、做买卖<\/td><td>受词是「你们」：人成了货品<\/td><\/tr><tr><td>迟延<\/td><td>ἀργεῖ<\/td><td>argei<\/td><td>G691<\/td><td>ἀ＋ἔργον<\/td><td>闲着、不做工<\/td><td>新约仅此一次；审判并没有放假<\/td><\/tr><tr><td>（不）打盹<\/td><td>νυστάζει<\/td><td>nystazei<\/td><td>G3573<\/td><td>—<\/td><td>打瞌睡<\/td><td>太 25:5 童女「打盹」同字；灭亡没有睡着<\/td><\/tr><\/table>","gram":"<p><strong>① ἡ ὁδὸς τῆς ἀληθείας——「真道」指什么？<\/strong><\/p><ul><li><strong>指整个基督信仰<\/strong>：初代教会称自己为「这道」（徒 9:2；19:9）。<\/li><li><strong>指真理的教训<\/strong>：与假教训相对的正确内容。<\/li><\/ul><blockquote><p><strong>最好的理解：「道路」是一种走出来的生活，不只是一套说法；所以外人毁谤它，是因为看见了跟从假师傅的人怎样生活。教义的错，最后会在行为上被看见。<\/strong><\/p><\/blockquote><p><strong>② 异文<\/strong>：TR 作 ἀπωλείαις（害人的道路），SBLGNT 与多数新近校勘本作 ἀσελγείαις（放荡）；和合本「邪淫的行为」跟后者。<\/p><p><strong>③ ὑμᾶς ἐμπορεύσονται<\/strong>：直接受词是「你们」——不是「借你们赚钱」而已，是「拿你们当货」。<\/p><p><strong>④ 两个拟人<\/strong>：οὐκ ἀργεῖ、οὐ νυστάζει——审判没有闲着、灭亡没有打盹。这两个否定句预先回答 3:4 的讥诮：看起来没有动静，不等于神睡着了。<\/p>","exp":"<p><strong>假教训最先毁掉的，往往不是教义书，是「道」在外人眼中的名声。<\/strong><\/p><p>「将有许多人随从他们」——假师傅的危险，在于他们常常很成功。ἐξακολουθέω 本来是门徒跟从主的字，加上 ἐκ 是紧跟到底。人跟着跑，因为放纵有市场。结果「真道因他们被毁谤」。「真道」原文是「真理的道路」；外人分不出谁真谁假，只看见一群自称跟从耶稣的人放纵、贪财，骂的就是这条路。<\/p><p>2:3 用三个字画出动机、方法与目的。动机是 πλεονεξία——想要更多；方法是 πλαστοῖς λόγοις——捏塑出来的话，像陶匠捏泥，照听众想要的形状捏；目的是 ἐμπορεύσονται——做买卖。最刺眼的是受词：「你们」。在这种讲道里，会众不是要牧养的羊，是货。这正好和 1:16 对照：使徒说，我们传的「并不是随从乖巧捏造的虚言，乃是亲眼见过他的威荣」。真见证不需要捏。<\/p><p>接着彼得写了两个很有画面的否定句：审判「并不迟延」，原文是「没有闲着」；灭亡「也必速速来到」，原文是「没有打盹」。读者看见假师傅风生水起，以为神在睡觉；彼得说：审判一直醒着。这是第三章「主不是耽延」的伏笔。<\/p><p>落到今天：对 2:3 最好的回应，不是在网络上点名，而是教会自己的财务透明、讲台不卖应许。也要回头问自己：我爱听某一种讲道，是因为它是真的，还是因为它照我想要的形状捏？<\/p><p>〔犹〕犹 4、11、16（犹大书讲义尚未制作）。<\/p>"},{"a":4,"z":4,"star":1,"grk":"<blockquote lang=\"grc\"><p>Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,<\/p><\/blockquote>","lit":"<blockquote><p>「因为神若没有放过犯了罪的天使，反而把他们丢进塔耳塔罗斯，交在幽暗的锁炼（或：幽暗的坑）中，被看守着等候审判；」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>犯了罪<\/td><td>ἁμαρτησάντων<\/td><td>hamartēsantōn<\/td><td>G264<\/td><td>—<\/td><td>犯罪<\/td><td>不定过去式：一件已经发生的事<\/td><\/tr><tr><td>宽容<\/td><td>ἐφείσατο<\/td><td>epheisato<\/td><td>G5339<\/td><td>φείδομαι<\/td><td>顾惜、放过<\/td><td>2:4、2:5 两次「没有放过」<\/td><\/tr><tr><td>丢在地狱<\/td><td>ταρταρώσας<\/td><td>tartarōsas<\/td><td>G5020<\/td><td>Τάρταρος<\/td><td>丢入塔耳塔罗斯<\/td><td>新约仅此一次；希腊人口中最深的拘禁之处<\/td><\/tr><tr><td>（锁炼）／和合本：坑<\/td><td>σειραῖς<\/td><td>seirais<\/td><td>G4577<\/td><td>—<\/td><td>锁炼、绳索<\/td><td>异文作 σιροῖς（坑）；和合本「坑」跟后者<\/td><\/tr><tr><td>黑暗<\/td><td>ζόφου<\/td><td>zophou<\/td><td>G2217<\/td><td>—<\/td><td>阴沉的幽暗<\/td><td>2:17 给假师傅存留的也是这幽暗<\/td><\/tr><tr><td>等候<\/td><td>τηρουμένους<\/td><td>tēroumenous<\/td><td>G5083<\/td><td>—<\/td><td>看守、保留<\/td><td>现在分词：仍在被看守；2:9 同字<\/td><\/tr><\/table>","gram":"<p><strong>① 异文 σειραῖς／σιροῖς<\/strong><\/p><ul><li><strong>σειραῖς（锁炼）<\/strong>：SBLGNT、NA28 与拜占庭传统；与犹 6「用锁炼把他们永远拘留」相合。<\/li><li><strong>σιροῖς／σειροῖς（坑、地窖）<\/strong>：几份最古老的大楷抄本；和合本「交在黑暗坑中」照这一读。<\/li><\/ul><blockquote><p><strong>最好的理解：两读意思相近——拘禁、幽暗、等候审判；本讲义原文照 SBLGNT，经文照和合本，不影响任何教义。<\/strong><\/p><\/blockquote><p><strong>② 犯罪的天使是谁？<\/strong><\/p><ul><li><strong>创 6:1–4 的读法<\/strong>：「神的儿子们」是天使，与人的女子交合。这是第二圣殿时期犹太文献（以诺一书 6–21 章等）与多数早期教父的读法，犹 6 也在这背景里。<\/li><li><strong>原初的堕落<\/strong>：指撒但与随从他的天使起初的背叛，不特指创 6 章。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得的次序——天使、洪水、所多玛——正是创 6、6–8、19 的次序，最自然是借用读者熟悉的创 6 章背景；但他只借用背景，不把以诺一书当正典，也不提供天使学的细节。他要说的只有一句：神没有宽容。<\/strong><\/p><\/blockquote><p><strong>③ ταρταρόω<\/strong>：希腊神话中囚禁泰坦的最深处。彼得借读者熟悉的字讲一个真实的拘禁，正如保罗在雅典引用希腊诗人（徒 17:28）；用这个字不等于接受那套神话。<\/p>","exp":"<p><strong>彼得举的第一个审判例子是：连天使都没有被放过。<\/strong><\/p><p>先看句子的形状。2:4 以「若」（Εἰ γὰρ）开头，这个条件句一路延伸，经过挪亚、所多玛、罗得，直到 2:9 才说出「那么」。所以读这一节不要停在这里——它是一句话的第一口气，不是结论。<\/p><p>天使是比人更有能力、更靠近神的受造者。犹大书说他们是「不守本位、离开自己住处的天使」。离开本位、想要不属于自己的位置——这是一切背叛的形状。彼得用了一个新约只出现这一次的字 ταρταρώσας：丢入最深的拘禁之处。他们现在被「看守着」（τηρουμένους），等候审判；判决还没有最后执行，但没有一个逃得掉。<\/p><p>彼得这样开头，是要回应读者心里的疑问：假师傅那么有能力、那么有魅力，神会管吗？他说：比他们更有能力的天使，神都没有放过。审判不看身分、不看恩赐、不看影响力。<\/p><p>这节经文周围有许多好奇的问题——天使怎样犯罪、塔耳塔罗斯在哪里、以诺一书说了什么。这些可以在书房里谨慎研究，但彼得没有展开，我们也不必把讲台变成天使学讲座。他要我们带走的是：审判是真实的，而且公正。<\/p><p>落到今天：读到这里不必害怕。这个「若」的长句，终点是 2:9 的「主知道搭救」。认真看待审判的人，正好最能安心把审判交给神——不必自己去替神清理门户，只要守住自己的本位。<\/p><p>〔旧约〕创世记讲义第 6 章（创 6:1–4）。〔犹〕犹 6（犹大书讲义尚未制作）。<\/p>"},{"a":5,"z":5,"star":1,"grk":"<blockquote lang=\"grc\"><p>καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,<\/p><\/blockquote>","lit":"<blockquote><p>「又没有放过古时的世界，却看守保护了挪亚——八人中的一位、义的传令官——那时他使洪水临到不敬虔之人的世界；」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>上古的世代<\/td><td>ἀρχαίου κόσμου<\/td><td>archaiou kosmou<\/td><td>G744<\/td><td>ἀρχή<\/td><td>古时的世界<\/td><td>3:6「当时的世界」被水淹没<\/td><\/tr><tr><td>一家八口<\/td><td>ὄγδοον<\/td><td>ogdoon<\/td><td>G3590<\/td><td>ὀκτώ<\/td><td>第八个<\/td><td>希腊惯用语：「第八个挪亚」＝挪亚连同另外七人<\/td><\/tr><tr><td>传……的<\/td><td>κήρυκα<\/td><td>kēryka<\/td><td>G2783<\/td><td>κηρύσσω<\/td><td>传令官<\/td><td>替王宣告命令的人：挪亚替神喊话<\/td><\/tr><tr><td>义道<\/td><td>δικαιοσύνης<\/td><td>dikaiosynēs<\/td><td>G1343<\/td><td>δίκη<\/td><td>义<\/td><td>在不敬虔的世代传义<\/td><\/tr><tr><td>保护<\/td><td>ἐφύλαξεν<\/td><td>ephylaxen<\/td><td>G5442<\/td><td>—<\/td><td>看守、保护<\/td><td>与 2:4 τηρέω 对照：同是「看守」，一边等审判，一边得保护<\/td><\/tr><tr><td>洪水<\/td><td>κατακλυσμόν<\/td><td>kataklysmon<\/td><td>G2627<\/td><td>κατά＋κλύζω<\/td><td>淹没一切的大水<\/td><td>太 24:38–39 主用同字讲他的再来<\/td><\/tr><\/table>","gram":"<p><strong>① 挪亚「传义道」——创世记并没有记载他讲道<\/strong><\/p><ul><li><strong>口头的宣讲<\/strong>：犹太传统（约瑟夫《犹太古史》）与早期教会（革利免一书 7:6）都说挪亚曾劝那世代悔改。<\/li><li><strong>生命的宣讲<\/strong>：他造方舟、他的义行本身就是宣告；来 11:7 说他因此「定了那世代的罪」。<\/li><\/ul><blockquote><p><strong>最好的理解：两者不冲突。一个百年造船的人，不可能不被问「你在做什么」；他的回答与他的木槌，是同一篇讲道。<\/strong><\/p><\/blockquote><p><strong>② ὄγδοον Νῶε<\/strong>：古希腊的惯用说法，「某人是第八个」＝他和另外七个人在一起。和合本意译为「一家八口」，与彼前 3:20「只有八个人」相合。<\/p><p><strong>③ 句型 οὐκ ἐφείσατο… ἀλλά… ἐφύλαξεν<\/strong>：本章第一次出现「没有宽容……却保护」的对称。审判之中有保护，这个句型在 2:7 与 2:9 再出现两次。<\/p>","exp":"<p><strong>在整个世界的审判里，神看守着一条船上的八个人。<\/strong><\/p><p>第二个例子是洪水。「上古的世代」整体被审判，规模比天使更大。但这一次句子多了一个转折：「却保护了传义道的挪亚一家八口」。从这里开始，第 2 章的审判例子都带着一个被保守的人——这正是彼得要一路走到 2:9 的路线。<\/p><p>挪亚被称为 κῆρυξ，「传令官」。古代城邦的传令官站在广场上，替王宣告命令；他的话不是自己的意见。挪亚在一个不敬虔的世代，替神宣告义。结果呢？圣经没有记载任何一个家族以外的人回应。如果用今天的数字标准，他是一位很失败的传道人；但神称他为义的传令官，并且亲自看守他。<\/p><p>同一位挪亚，彼得在前一封信也写过：「神容忍等待的时候……只有八个人」（彼前 3:20）。那一封信讲神的忍耐与洗礼的对应；这一封讲审判中的保守。两封信一起看：神的忍耐在洪水前等了很久，神的保护在洪水中没有失手。<\/p><p>落到今天：在一个不敬虔的世代里忠心，可能长期看不见果效。挪亚的价值不是用听众人数量的，是用「神看守了他」来量的。我们也不是被叫去确保结果，是被叫去忠心传义；保护与结果，是主的事。<\/p><p>〔旧约〕创世记讲义第 6–8 章。〔彼前〕彼得前书讲义第 3 章（3:20 挪亚八口）。<\/p>"},{"a":6,"z":8,"star":2,"grk":"<blockquote lang=\"grc\"><p>καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ἀσεβέσιν τεθεικώς, καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο· βλέμματι γὰρ καὶ ἀκοῇ ὁ δίκαιος ἐγκ
