…καὶ ἀκοῇ（blemmati … kai akoē）「眼所見、耳所聞」放在句首：痛是從眼睛和耳朵進來的。和合本「他的義心就天天傷痛」譯得準：痛，是因為他還在乎。<\/p>","exp":"<p>〔舊約〕創 18:16--19:29（創世記講義第 18--19 章）<\/p><p>〔猶〕猶 7--7（猶大書講義尚未製作）<\/p><p>「又判定所多瑪、蛾摩拉，將二城傾覆，焚燒成灰，作為後世不敬虔人的鑑戒；只搭救了那常為惡人淫行憂傷的義人羅得。」（2:6--7）第三個例子，兩座城燒成灰，那堆灰像立在路邊的樣本，給後來經過的人看。但同一句話裡，神「只搭救了」羅得。<\/p><p>熟悉創世記的人讀到這裡會皺眉：羅得？他看見平原滋潤就挑了所多瑪，危急時提議把女兒交出去，天使催他時還「遲延不走」（創 19:16），後來在山洞裡醉倒。彼得怎麼一連三次稱他為「義人」（議題頁 ISS02_5）？<\/p><p>答案在 2:8：「他的義心就天天傷痛。」羅得每天看見、聽見，每天心裡被刺一下。他沒有能力改變那座城，也沒有勇氣早早離開，但他的心還沒有麻木。在一座把罪當日常的城裡，他是還會痛的人。而他蒙救不是因為他夠好：創世記說天使拉著他的手領出城外，神記念了亞伯拉罕（創 19:29）。「搭救」的主詞是神，這就是恩典。講台不必把羅得美化成榜樣，也不該嘲笑他；他是住錯了地方、卻仍被主拉出來的人。<\/p><p>今天許多人也住在所多瑪中間：在螢幕裡，在辦公室裡，在飯局上。危險不在看見，在看久了不再痛。還會痛，就還有義心；若已經不痛了，可以求主把那份痛還給我們。<\/p>"},{"a":9,"z":9,"star":3,"grk":"<p lang=\"grc\">οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,<\/p>","lit":"<p>主懂得怎樣把敬虔的人從試煉中拉出來，也懂得怎樣把不義的人看守在懲罰之下，直到審判的日子；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οἶδεν κύριος<\/td><td>oiden kyrios<\/td><td>主知道<\/td><td>接不定詞：懂得怎樣，而且會做<\/td><\/tr><tr><td>εὐσεβεῖς<\/td><td>eusebeis<\/td><td>敬虔的人<\/td><td>1:3、1:6--7、3:11「虔敬」同一家族<\/td><\/tr><tr><td>ἐκ πειρασμοῦ ῥύεσθαι<\/td><td>ek peirasmou rhyesthai<\/td><td>從試煉中拉出來<\/td><td>全章鑰匙：2:7 的實例變成原則<\/td><\/tr><tr><td>κολαζομένους τηρεῖν<\/td><td>kolazomenous tērein<\/td><td>看守著受懲罰的<\/td><td>2:4、2:17 同一個「看守」<\/td><\/tr><tr><td>εἰς ἡμέραν κρίσεως<\/td><td>eis hēmeran kriseōs<\/td><td>直到審判的日子<\/td><td>3:7 再出現<\/td><\/tr><\/table>","gram":"<p><strong>2:4--10a 的長句在這裡落地。<\/strong>前句是三個「若」：若神沒有寬容天使（2:4），若神沒有寬容上古的世代卻保護了挪亞（2:5），若神傾覆所多瑪卻搭救了羅得（2:6--8）；希臘文沒有寫出「那麼」，2:9 就是結論句。審判放在條件子句裡，搭救放在主要子句裡，而且搭救排在前面。這是全卷的樞紐：彼得講審判，是為了叫敬虔的人安心。<\/p><p>οἶδεν（oiden） 接不定詞 ῥύεσθαι（rhyesthai），不只是「知道」，是「懂得怎樣、會做」，太 7:11「你們雖然不好，尚且知道拿好東西給兒女」是同一個結構。ἐκ πειρασμοῦ（ek peirasmou） 是「從試煉之中」，不是保證不進入試煉。πειρασμός（peirasmos） 包括誘惑，也包括壓力與困境，彼前 1:6 的「試煉」是同一個字。<\/p><p>κολαζομένους（kolazomenous） 是現在分詞，有兩種讀法：一說不義的人現在已在懲罰中被看守，直到審判之日；一說現在分詞帶未來意義，他們被保留到審判之日受罰，和合本「留在刑罰之下，等候審判的日子」較近後者。文法上兩讀都可能，本講義不據此建立死後的時間表，只看彼得要說的：兩種看守都在主手裡，沒有一件事從他手中滑掉。<\/p>","exp":"<p>〔背景〕路 22:31--32；約 21:15--17（路加福音講義第 22 章；約翰福音講義第 21 章）<\/p><p>〔彼前〕彼前 5:10--10（彼得前書講義第 5 章）<\/p><p>「主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子」（2:9）。全章最重的三個審判，原來都是為了說出這一句。讀者被假師傅包圍：他們很成功，跟從的人很多（2:2），審判看起來在睡覺（2:3）。彼得於是從 2:4 寫了一個很長的句子：若神沒有寬容天使，若神保護了挪亞，若神搭救了羅得，那麼，主知道。三個審判裡藏著兩次搭救，這一長句的終點不是火，是一隻伸出來的手。<\/p><p>「知道」在這裡是懂得怎樣。主不只知道你的處境，他懂得怎樣把你拉出來。他拉挪亞用一條船，拉羅得用天使的手；方法不同，他都懂。「脫離試探」是從裡面拉出來，不是保證你不進洪水；正如保羅說：「在受試探的時候，總要給你們開一條出路，叫你們能忍受得住。」（林前 10:13）<\/p><p>老彼得寫「主知道」，不能不想起加利利海邊。三次不認主以後，他對復活的主說：「主啊，你是無所不知的；你知道我愛你。」（約 21:17）在那以前，主已經對他說：「但我已經為你祈求，叫你不至於失了信心。」（路 22:32）一個自己靠不住的人，被一位「知道」的主拉了回來。這一節不是彼得多堅強的見證，是主多恆久忍耐的見證。<\/p><p>這就決定了第 2 章怎樣讀：審判的經文不是拿來嚇人的，是拿來叫敬虔的人安心的。若你今天被困在不義的人得勢的地方，這一節不是叫你去猜誰會受罰，是叫你把眼睛從他們身上移回主身上。321 說謙卑是讓神作神：他審判，他搭救，我們的本位是敬虔。<\/p>"},{"a":10,"z":11,"star":2,"grk":"<p lang=\"grc\">μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταὶ αὐθάδεις, δόξας οὐ τρέμουσιν βλασφημοῦντες,<\/p><p lang=\"grc\">ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ αὐτῶν παρὰ κυρίῳ βλάσφημον κρίσιν.<\/p>","lit":"<p>尤其是那些隨從肉體、在污穢的情慾中行事、藐視主權的人。他們膽大、任性，毀謗那些尊榮者也不戰兢；<\/p><p>其實天使雖然力量權能更大，也不在主面前用毀謗的判語控告他們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>κυριότητος καταφρονοῦντας<\/td><td>kyriotētos kataphronountas<\/td><td>藐視主權的<\/td><td>單數抽象名詞：主的權柄<\/td><\/tr><tr><td>Τολμηταὶ αὐθάδεις<\/td><td>Tolmētai authadeis<\/td><td>膽大的、任性的<\/td><td>αὐθάδης：自己＋取悅<\/td><\/tr><tr><td>δόξας οὐ τρέμουσιν<\/td><td>doxas ou tremousin<\/td><td>對尊榮者不戰兢<\/td><td>最自然指天上的尊榮者<\/td><\/tr><tr><td>ἰσχύϊ καὶ δυνάμει μείζονες<\/td><td>ischyi kai dynamei meizones<\/td><td>力量權能更大<\/td><td>天使大，卻不越位<\/td><\/tr><tr><td>παρὰ κυρίῳ βλάσφημον κρίσιν<\/td><td>para kyriō blasphēmon krisin<\/td><td>在主面前毀謗的判語<\/td><td>把審判留給主<\/td><\/tr><\/table>","gram":"<p><strong>κυριότητος（kyriotētos） 最自然指主的權柄。<\/strong>κυριότης（kyriotēs） 在弗 1:21、西 1:16 是天上權勢的一個等級，也有人讀成人間的權柄；但這裡是單數、抽象名詞，和 κύριος（kyrios） 同字根，又緊接在 2:1「連買他們的主他們也不承認」之後。本講義取「主的主權」：輕慢主治，就是把主踩在腳下。這不是一節替人間權威護航的經文。<\/p><p>δόξας（doxas） 字面是「榮耀們」，和合本譯「在尊位的」。有人讀成教會或社會的領袖；但 2:11 的 κατ’ αὐτῶν（kat’ autōn）「控告他們」最自然回指 δόξας（doxas），猶 8--9 的平行經文又講天使長與魔鬼爭辯，所以多數解經家讀成天上的尊榮者，可能包括墮落的天使，本講義取這一讀。αὐθάδης（authadēs） 由 αὐτός（autos）「自己」與 ἁνδάνω（handanō）「取悅」組成，是以取悅自己為準繩的人，多 1:7 要求監督「不任性」，正是這個字。2:11 句末的 παρὰ κυρίῳ（para kyriō），抄本有「在主面前」「從主而來」與省略三種寫法，和合本作「在主面前」。<\/p>","exp":"<p>〔猶〕猶 8--10（猶大書講義尚未製作）<\/p><p>〔彼前〕彼前 5:3--3（彼得前書講義第 5 章）<\/p><p>「那些隨肉身、縱污穢的情慾、輕慢主治之人的，更是如此。他們膽大任性，毀謗在尊位的，也不知懼怕。」（2:10）2:9 說「不義的人」，2:10 把他們具體化成兩件事：隨從肉身的污穢情慾，輕慢主的權柄。接著是一幅畫像：膽大，任性。「任性」的原文是以取悅自己為準繩，這就是「有己」的希臘字。最危險的任性，常常出現在有講台的人身上。<\/p><p>2:11 立刻對照：「就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們。」猶大書記載米迦勒與魔鬼爭辯時，也只說「主責備你吧」（猶 9）。天使比假師傅強得多，卻把審判留給主；假師傅比天使弱得多，卻隨口宣判他們不懂的屬靈世界。這就是驕傲：離開本位，抓住只屬於神的審判權。<\/p><p>這兩節常被誤用成「你質疑牧師，就是輕慢主治的」。這不是經文的意思。第一，「主治的」最自然指主的權柄；第二，第 2 章被定罪的正是「師傅」，是有講台、有跟從者、在上位的人。彼得給長老的命令是：「也不是轄制所託付你們的，乃是作群羊的榜樣。」（彼前 5:3）照真理、在愛中、按次序提出的質疑，不是毀謗（議題頁 ISS02_6）；拒絕一切質疑的領袖，倒要先用 2:10 照照自己。<\/p><p>任性也先照自己：我在哪裡只取悅自己？我在哪裡急著替神宣判別人？天使把審判交給主，我們也可以把那句想定人罪的話，交回主的手裡。<\/p>"},{"a":12,"z":14,"star":1,"grk":"<p lang=\"grc\">Οὗτοι δέ, ὡς ἄλογα ζῷα γεγεννημένα φυσικὰ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται,<\/p><p lang=\"grc\">ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν,<\/p><p lang=\"grc\">ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα·<\/p>","lit":"<p>但這些人像沒有理性的動物，生來本是為了被捉拿、被毀滅的；他們毀謗自己所不知道的事，也必在那敗壞中被毀滅，<\/p><p>為不義的工價受不義的虧損。他們以白晝的享樂為快樂，是斑點和瑕疵，在自己的詭詐中宴樂，與你們一同坐席；<\/p><p>他們的眼睛充滿淫婦，不停止犯罪，引誘不堅固的心靈，心裡操練了貪婪，是咒詛的兒女。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἄλογα ζῷα<\/td><td>aloga zōa<\/td><td>沒有理性的動物<\/td><td>ἄλογος：沒有 λόγος<\/td><\/tr><tr><td>ἀδικούμενοι μισθὸν ἀδικίας<\/td><td>adikoumenoi misthon adikias<\/td><td>為不義的工價受不義<\/td><td>同字根的文字遊戲<\/td><\/tr><tr><td>ἐν ταῖς ἀπάταις αὐτῶν<\/td><td>en tais apatais autōn<\/td><td>在他們的詭詐中<\/td><td>異文 ἀγάπαις「愛筵」<\/td><\/tr><tr><td>δελεάζοντες ψυχὰς ἀστηρίκτους<\/td><td>deleazontes psychas astēriktous<\/td><td>對不堅固的心靈下餌<\/td><td>漁夫的字；對照路 22:32「堅固」<\/td><\/tr><tr><td>καρδίαν γεγυμνασμένην πλεονεξίας<\/td><td>kardian gegymnasmenēn pleonexias<\/td><td>操練過貪婪的心<\/td><td>完成式：已經練成<\/td><\/tr><tr><td>κατάρας τέκνα<\/td><td>kataras tekna<\/td><td>咒詛的兒女<\/td><td>希伯來式說法：屬於咒詛的人<\/td><\/tr><\/table>","gram":"<p><strong>2:13 的異文，兩個字在大楷抄本裡長得很像。<\/strong>SBLGNT 與多數抄本作 ἐν ταῖς ἀπάταις αὐτῶν（en tais apatais autōn）「在他們的詭詐中」，和合本「以行詭詐為快樂」照這一讀；另有一些古抄本作 ἀγάπαις（agapais）「愛筵」，與猶 12 的「愛席」相合。大楷寫作 ΑΠΑΤΑΙΣ 與 ΑΓΑΠΑΙΣ，不是只差一個字母：第二個字母一個是 Π、一個是 Γ，第四個字母一個是 Τ、一個是 Π；字母數一樣，輪廓相近，抄寫的人一眼看錯，或受猶大書影響改寫，都有可能。本講義從 SBLGNT 取「詭詐」，但場景確實是愛筵：συνευωχούμενοι ὑμῖν（syneuōchoumenoi hymin）「與你們一同坐席」。他們在愛的筵席上行詭詐，諷刺就在這兩個字之間。<\/p><p>2:12 的 ἐν τῇ φθορᾷ αὐτῶν（en tē phthora autōn） 可以回指動物，「像那些動物被毀滅一樣，他們也要被毀滅」；也可以指他們自己的敗壞，和合本「正在敗壞人的時候，自己必遭遇敗壞」偏向後者。兩讀落點相同：活在敗壞裡的人，最後被敗壞吞掉。φθορά（phthora） 這條線從 1:4 來，到 2:19 收緊。<\/p>","exp":"<p>〔背景〕太 4:18--20；路 22:31--32（馬太福音講義第 4 章；路加福音講義第 22 章）<\/p><p>〔猶〕猶 10--12（猶大書講義尚未製作）<\/p><p>「但這些人好像沒有靈性，生來就是畜類，以備捉拿宰殺的。」（2:12）接下來三節是一連串快速的畫像：畜類，白晝宴樂，玷污與瑕疵，滿眼淫色，止不住犯罪，被咒詛的種類。最叫人不安的是一個細節：「正與你們一同坐席」（2:13）。他們不在教會外面，就坐在教會的愛筵桌邊。<\/p><p>「好像沒有靈性」，原文是沒有理性。他們自以為有高深的屬靈知識，「毀謗所不曉得的事」，其實像動物一樣順著本能活。下一段，一頭真正的畜類反而要說出人話。<\/p><p>「引誘那心不堅固的人」（2:14），「引誘」是下餌的字。彼得與安得烈當年在加利利海撒網，主對他們說：「來跟從我，我要叫你們得人如得魚一樣。」（太 4:19）現在老彼得看見另一種得人：用餌釣人。餌下給誰？沒有扎穩的人。那一夜主對彼得說：「你回頭以後，要堅固你的弟兄。」（路 22:32）假師傅專找沒有被堅固的人下手，所以門訓與陪伴不是教會額外的節目，是保護。<\/p><p>「心中習慣了貪婪」，「習慣」原文是操練，體育館的那個字，而且是完成式。貪婪不是一時失手，是天天練出來的心；敬虔也是練出來的（提前 4:7）。這段不是叫我們去找誰是下餌的人，是問兩件事：我的心這些年在操練甚麼？我身邊有沒有一位還沒扎穩的人，需要我去陪他？那就是 920 裡我的那個「2」。<\/p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">καταλείποντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ Βοσόρ, ὃς μισθὸν ἀδικίας ἠγάπησεν,<\/p><p lang=\"grc\">ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.<\/p>","lit":"<p>他們撇下正直的路，就走迷了，緊跟波索珥（就是比珥）之子巴蘭的路；這巴蘭貪愛不義的工價，<\/p><p>卻為自己的違法受了責備：那不出聲的牲口用人的聲音說話，攔阻了先知的瘋狂。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>καταλείποντες εὐθεῖαν ὁδὸν<\/td><td>kataleipontes eutheian hodon<\/td><td>撇下正直的路<\/td><td>不是掉了，是撇下<\/td><\/tr><tr><td>τοῦ Βαλαὰμ τοῦ Βοσόρ<\/td><td>tou Balaam tou Bosor<\/td><td>波索珥的巴蘭<\/td><td>民 22:5 作 Βεώρ；和合本譯「比珥」<\/td><\/tr><tr><td>μισθὸν ἀδικίας ἠγάπησεν<\/td><td>misthon adikias ēgapēsen<\/td><td>貪愛不義的工價<\/td><td>呼應 2:13 同一片語<\/td><\/tr><tr><td>ὑποζύγιον ἄφωνον<\/td><td>hypozygion aphōnon<\/td><td>不出聲的負軛牲口<\/td><td>民 22:28 的驢<\/td><\/tr><tr><td>παραφρονίαν<\/td><td>paraphronian<\/td><td>失去理智、瘋狂<\/td><td>新約僅此一次<\/td><\/tr><\/table>","gram":"<p><strong>Βοσόρ（Bosor） 與 Βεώρ（Beōr） 是同一個人的父親。<\/strong>民 22:5 希伯來文作 בְּעוֹר（Be‘or），七十士譯本作 Βεώρ（Beōr），和合本譯「比珥」；SBLGNT 在這裡作 Βοσόρ（Bosor），少數抄本作 Βεώρ（Beōr），也有抄本把兩者混成 Βεωρσόρ（Beōrsor），可見抄寫的人也在兩種拼法之間猶豫。解釋有幾種：一說是某種口音把喉音讀成了 σ（s）；一說是文字遊戲，與希伯來文 בָּשָׂר（basar）「肉體」諧音，正好呼應 2:10「隨肉身」，但這只是推測。指的是同一個人，和合本照民數記譯作「比珥」是合宜的，不必在拼法上建立任何教義。<\/p><p>καταλείποντες（kataleipontes） 是現在分詞，NA28 作不定過去式 καταλιπόντες（katalipontes），意思都是撇下：正路不是不小心掉的，是自己放下的。2:16 是一連串對比：ὑποζύγιον ἄφωνον（hypozygion aphōnon）「不出聲的牲口」對 ἐν ἀνθρώπου φωνῇ（en anthrōpou phōnē）「用人的聲音」；最後一個字 παραφρονίαν（paraphronian） 是「失去理智」，正呼應 2:12 的 ἄλογα（aloga）。<\/p>","exp":"<p>〔舊約〕民 22:21--35；民 31:16--16（民數記講義第 22 章、第 31 章）<\/p><p>〔猶〕猶 11--11（猶大書講義尚未製作）<\/p><p>「他們離棄正路，就走差了，隨從比珥之子巴蘭的路。巴蘭就是那貪愛不義之工價的先知」（2:15）。彼得從畫像轉到一個舊約人物。摩押王巴勒用重金請巴蘭來咒詛以色列；巴蘭口裡說只照神的話說，心裡卻一直放不下那份酬報。民數記後來記載，以色列人在毘珥的事上得罪耶和華，是出於巴蘭的計謀（民 31:16）；啟示錄也說他「曾教導巴勒將絆腳石放在以色列人面前」（啟 2:14）。愛錢，加上引人犯罪，正好是 2:14 的兩個記號。<\/p><p>接著是全章最幽默的一筆：「那不能說話的驢以人言攔阻先知的狂妄」（2:16）。巴蘭騎驢去赴那份工價，路上耶和華的使者三次擋路；先知看不見，驢看見了。他打了驢三次，直到驢開口（議題頁 ISS02_8）。2:12 說假師傅「好像沒有靈性，生來就是畜類」，這裡卻是一頭畜類說出了清醒的話。被錢沖昏頭的人，比一頭驢還不清醒。<\/p><p>這一段沒有讓巴蘭有好結局，卻讓我們看見神在人走向滅亡的路上一次又一次攔阻：用使者，用驢，用一扇關上的門。<\/p><p>神今天的「驢」，可能是一位你看不起的人說的一句話，一個一再受阻的計畫，一份一直談不成的利益。巴蘭三次打驢，不知道驢救了他的命。被攔住的時候，先別急著打驢，先問：我是不是正往「不義的工價」那裡走？<\/p>"},{"a":17,"z":17,"star":2,"grk":"<p lang=\"grc\">Οὗτοί εἰσιν πηγαὶ ἄνυδροι καὶ ὁμίχλαι ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ σκότους τετήρηται.<\/p>","lit":"<p>這些人是沒有水的泉源，是被暴風驅趕的霧氣；那黑暗的幽暗已經為他們存留了。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πηγαὶ ἄνυδροι<\/td><td>pēgai anydroi<\/td><td>沒有水的泉源<\/td><td>和合本「無水的井」；本章章題<\/td><\/tr><tr><td>ὁμίχλαι<\/td><td>homichlai<\/td><td>霧氣<\/td><td>TR 作 νεφέλαι「雲彩」<\/td><\/tr><tr><td>ὑπὸ λαίλαπος ἐλαυνόμεναι<\/td><td>hypo lailapos elaunomenai<\/td><td>被暴風驅趕的<\/td><td>可 4:37 海上的「暴風」<\/td><\/tr><tr><td>ὁ ζόφος τοῦ σκότους<\/td><td>ho zophos tou skotous<\/td><td>黑暗的幽暗<\/td><td>2:4 天使的「幽暗」<\/td><\/tr><tr><td>τετήρηται<\/td><td>tetērētai<\/td><td>已經被存留<\/td><td>完成式；2:4、2:9 同一個「看守」<\/td><\/tr><\/table>","gram":"<p><strong>πηγή（pēgē） 通常是泉，不是井。<\/strong>它指自然湧出的源頭，約 4:14「泉源」同字；人挖的井在約 4:11 是 φρέαρ（phrear）。和合本譯「無水的井」，保留了乾涸與失望的畫面，講台可以沿用；但原文更刺人：本該是源頭的地方，沒有水。ἄνυδροι（anydroi） 是否定字首 ἀ-（a-） 加 ὕδωρ（hydōr）「水」。兩個比喻的動作也不一樣：泉是靜的，應許了卻沒有；霧是被趕著走的，ἐλαυνόμεναι（elaunomenai） 是現在被動分詞，看似要下雨，卻被吹散。<\/p><p>異文：TR 作 νεφέλαι（nephelai）「雲彩」，並在句末加 εἰς αἰῶνα（eis aiōna）「直到永遠」；SBLGNT 作 ὁμίχλαι（homichlai），沒有「直到永遠」。猶 12--13 正有「沒有雨的雲彩」與「永遠存留」，TR 的讀法很可能受了猶大書的影響。和合本「霧氣」「存留」跟 SBLGNT 一讀。τετήρηται（tetērētai） 是完成式被動：那幽暗已經存好了，與 2:4 的 τηρουμένους（tēroumenous）、2:9 的 τηρεῖν（tērein） 是同一個動詞。<\/p>","exp":"<p>〔背景〕可 4:35--41（馬可福音講義尚未製作）<\/p><p>〔猶〕猶 12--13（猶大書講義尚未製作）<\/p><p>「這些人是無水的井，是狂風催逼的霧氣，有墨黑的幽暗為他們存留。」（2:17）這是本章的章題。在乾旱的山地，泉源就是命；旅人照著記憶走了一整天，到了泉邊只見乾裂的石頭。這比本來沒有泉更殘酷。神曾藉耶利米說：「我的百姓做了兩件惡事，就是離棄我這活水的泉源，為自己鑿出池子，是破裂不能存水的池子。」（耶 2:13）假師傅佔了源頭的位置，人來找他們要水，他們給不出水。<\/p><p>第二個比喻是霧。早晨有霧，看起來要下雨了，太陽一出、風一吹，就散了。「狂風」這個字，彼得很熟悉：那一夜加利利海上起了暴風，船幾乎滿了水，主起來斥責風，風就止住了。被暴風催逼著跑的霧，沒有那位能叫風平靜的主。這也預告了 2:19：他們應許人自由，自己卻是被風趕著走的。<\/p><p>「有墨黑的幽暗為他們存留」，是已經存好了。乾井的結局不必由誰去揭發，主早已看守著。<\/p><p>但「井」是本章的篇名，不是本章的終點；篇名指出問題，2:9 給出盼望。面對乾井，出路不是找一口更大、更有名的井，是回到那一位：「人若喝我所賜的水就永遠不渴。我所賜的水要在他裡頭成為泉源，直湧到永生。」（約 4:14）也問自己：我帶給身邊的人的，是水，還是霧？<\/p>"},{"a":18,"z":19,"star":3,"grk":"<p lang=\"grc\">ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ὀλίγως ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους,<\/p><p lang=\"grc\">ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ δεδούλωται.<\/p>","lit":"<p>因為他們說出誇大而虛空的話，用肉體的情慾、用種種放蕩下餌，引誘那些才剛逃離活在迷誤中之人的人；<\/p><p>應許他們自由，自己卻是敗壞的奴僕；因為人被誰打敗，就給誰作了奴僕。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὑπέρογκα ματαιότητος<\/td><td>hyperonka mataiotētos<\/td><td>腫大的虛空話<\/td><td>聲音很大，裡面是空的<\/td><\/tr><tr><td>τοὺς ὀλίγως ἀποφεύγοντας<\/td><td>tous oligōs apopheugontas<\/td><td>才剛逃脫的人<\/td><td>初信、還沒站穩的人<\/td><\/tr><tr><td>ἐλευθερίαν……ἐπαγγελλόμενοι<\/td><td>eleutherian … epangellomenoi<\/td><td>應許自由<\/td><td>與 1:4 真的應許對照<\/td><\/tr><tr><td>δοῦλοι……τῆς φθορᾶς<\/td><td>douloi … tēs phthoras<\/td><td>敗壞的奴僕<\/td><td>1:1 彼得自稱 δοῦλος<\/td><\/tr><tr><td>ᾧ……ἥττηται, τούτῳ δεδούλωται<\/td><td>hō … hēttētai, toutō dedoulōtai<\/td><td>被誰打敗，就給誰為奴<\/td><td>戰場的語言；兩個完成式<\/td><\/tr><\/table>","gram":"<p><strong>2:19 的格言用的是戰場的語言。<\/strong>ᾧ γάρ τις ἥττηται, τούτῳ δεδούλωται（hō gar tis hēttētai, toutō dedoulōtai）：ἡττάομαι（hēttaomai） 是打敗仗，古代戰敗的人成為戰勝者的奴隸。兩個動詞都是完成式，說的不是一次失手，是一個持續的狀態：被打敗了，就一直是奴隸。ᾧ（hō） 可以是陽性「被誰」，也可以是中性「被甚麼」；和合本譯「被誰」，原文兩樣都包括：人、情慾、錢，都可以作主人。2:20 的 ἡττῶνται（hēttōntai） 會再用一次。<\/p><p>2:18 的對象是 τοὺς ὀλίγως ἀποφεύγοντας（tous oligōs apopheugontas），ὀλίγως（oligōs）「才剛、稍微」新約只此一次；TR 作 ὄντως（ontōs）「真正地」，又把現在分詞改成不定過去式 ἀποφυγόντας（apophygontas），和合本「剛才脫離」跟 SBLGNT 一讀。最要緊的是兩組字根的對照：ἐπαγγελλόμενοι（epangellomenoi）「應許」與 1:4 的 ἐπαγγέλματα（epangelmata） 同字根，φθορᾶς（phthoras） 與 1:4 的「敗壞」是同一個字。神的應許叫人脫離敗壞，假師傅的應許把人帶回敗壞。<\/p>","exp":"<p>〔彼前〕彼前 2:16--16（彼得前書講義第 2 章）<\/p><p>〔猶〕猶 16--16（猶大書講義尚未製作）<\/p><p>「他們說虛妄矜誇的大話，用肉身的情慾和邪淫的事引誘那些剛才脫離妄行的人。」（2:18）方法是話說得很大、很響，「矜誇」原文是腫起來的，裡面卻是空的。對象是剛剛逃出來、還沒站穩的人。用的餌，正是他們剛剛逃出來的那個東西。<\/p><p>「他們應許人得以自由，自己卻作敗壞的奴僕，因為人被誰制伏就是誰的奴僕。」（2:19）「你自由了」是最有吸引力的一句話，彼得用一句格言就拆穿它。他們以為自己戰勝了規條，其實是被情慾打敗了。主耶穌早就說過：「所有犯罪的就是罪的奴僕」；「所以天父的兒子若叫你們自由，你們就真自由了。」（約 8:34、36）彼得在前一封信也說：「你們雖是自由的，卻不可藉著自由遮蓋惡毒，總要作神的僕人。」（彼前 2:16）<\/p><p>彼得在 1:1 自稱「耶穌基督僕人」，用的就是「奴僕」這個字。全卷只有兩種奴僕：作基督的僕人，或作敗壞的奴僕，沒有第三種「誰的僕人都不作」。1:4 神的應許叫我們「脫離世上從情慾來的敗壞」，2:19 假師傅的應許把人帶回同一個敗壞；真應許與假應許，用的是同一組字。<\/p><p>2:10 的「任性」在這裡看見了結局：舊人有己，要自己作主作王，最後被別的東西作了主。問自己：哪一件事我說「我可以控制」，其實已經在控制我？自由不是沒有主人，是有一位好主人；讓耶穌作王，才是自由。<\/p>"},{"a":20,"z":22,"star":2,"grk":"<p lang=\"grc\">εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ, τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων.<\/p><p lang=\"grc\">κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς.<\/p><p lang=\"grc\">συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς κυλισμὸν βορβόρου.<\/p>","lit":"<p>因為他們若藉著認識主和救主耶穌基督，逃脫了世界的污穢，後來又被這些纏住、打敗，他們末後的光景就比起初的更壞了。<\/p><p>因為他們不認識義的道路，倒比認識了以後又從傳給他們的聖命轉回去更好。<\/p><p>那句真實的俗語在他們身上應驗了：狗轉回到自己所吐的；又，豬洗淨了，又到泥中打滾。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου<\/td><td>apophygontes ta miasmata tou kosmou<\/td><td>逃脫了世界的污穢<\/td><td>1:4 ἀποφυγόντες 同一個分詞<\/td><\/tr><tr><td>ἐν ἐπιγνώσει<\/td><td>en epignōsei<\/td><td>在認識裡<\/td><td>全卷關鍵字：1:2、1:3、1:8<\/td><\/tr><tr><td>ἐμπλακέντες ἡττῶνται<\/td><td>emplakentes hēttōntai<\/td><td>被纏住、被打敗<\/td><td>2:19「制伏」同字<\/td><\/tr><tr><td>ὑποστρέψαι ἐκ τῆς……ἁγίας ἐντολῆς<\/td><td>hypostrepsai ek tēs … hagias entolēs<\/td><td>從聖命轉回去<\/td><td>轉離傳給他們的<\/td><\/tr><tr><td>Κύων ἐπιστρέψας<\/td><td>Kyōn epistrepsas<\/td><td>狗轉回來<\/td><td>路 22:32 ἐπιστρέψας 同一個分詞<\/td><\/tr><\/table>","gram":"<p><strong>2:20 的「他們」接著 2:19 的假師傅。<\/strong>γάρ（gar） 把這一節接到 2:19 的 αὐτοί（autoi）：應許人自由、自己卻作奴僕的人，也包括完全跟從他們、同樣轉背的人。ἀποφυγόντες（apophygontes） 與 1:4「脫離世上從情慾來的敗壞」的 ἀποφυγόντες（apophygontes） 是同一個分詞。這些人失去救恩了嗎？阿米念傳統認為真信徒可以失落救恩；加爾文傳統認為他們從未真正重生，2:22 的比喻正是說本性沒有改變；許多福音派讀者則說，警告本身是神保守信徒的工具（3:17）。本講義三讀並陳，落點放在上下文：這裡描寫的是假師傅與跟從他們轉背的人，不是在掙扎中跌倒、仍然想回頭的弟兄姊妹（議題頁 ISS02_9）。<\/p><p>兩個「回轉」的字值得並排看。2:21 是 ὑποστρέψαι（hypostrepsai），從聖命轉回去；2:22 是 ἐπιστρέψας（epistrepsas），狗轉回所吐的。路 22:32 主對彼得說的「你回頭以後」，原文正是 ἐπιστρέψας（epistrepsas）：同一個分詞，兩個方向。第一句俗語出自箴 26:11；第二句「豬洗了又滾」是當時流傳的俗語，不在舊約裡。<\/p>","exp":"<p>〔背景〕路 22:31--34；路 22:54--62（路加福音講義第 22 章）<\/p><p>〔猶〕猶 22--23（猶大書講義尚未製作）<\/p><p>「倘若他們因認識主－救主耶穌基督，得以脫離世上的污穢，後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了。」（2:20）這是全章最沉重的三節。「末後的景況比先前更不好」幾乎就是主耶穌的話（太 12:45）：屋子打掃乾淨了卻空著，污鬼帶著七個更惡的回來。認識過義路又轉背，比從未聽過更糟，因為他們不只是迷路，是拿著地圖往反方向走，還帶別人一起走（2:18）。兩句俗語說出原因：外面洗過了，本性沒有變。<\/p><p>但要看清楚這段話在講誰。上下文 2:17--19 講的是假師傅與跟從他們的人：曉得義路，卻拿著「自由」去引誘剛逃出來的人。這段話不是寫給一位跌倒了、心裡很痛、很想回來的弟兄姊妹。<\/p><p>彼得在這裡埋了一個他最懂的字。狗「轉過來」，正是主在那一夜對他說的字：「你回頭以後，要堅固你的弟兄。」（路 22:32）一個轉回所吐的，一個轉回主面前。寫這段話的人自己跌得很重；他不是站在懸崖上俯視別人，是從谷底被主拉上來的人。<\/p><p>如果你正在掙扎，害怕自己就是 2:20 說的那種人，你會為此害怕，就說明你的心還沒有麻木。請聽 1:9：你「舊日的罪已經得了潔淨」；請聽 3:9：主「不願有一人沉淪，乃願人人都悔改」。主還在等。這三節不是拿來對任何人宣判的，是叫我們今天就回轉：不是像狗那樣轉回舊路，是像彼得那樣轉回主面前。<\/p>"}],"3":[{"a":1,"z":2,"star":1,"grk":"<p lang=\"grc\">Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν,<\/p><p lang=\"grc\">μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,<\/p>","lit":"<p>親愛的，這已經是我寫給你們的第二封信了；在這兩封信裡，我用提醒來喚醒你們純淨的心思，<\/p><p>叫你們記得聖先知預先說過的話，以及你們的使徒所傳的、主和救主的命令。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀγαπητοί<\/td><td>agapētoi<\/td><td>蒙愛的人<\/td><td>第 3 章用了四次（3:1、8、14、17），第 2 章一次也沒有<\/td><\/tr><tr><td>δευτέραν … ἐπιστολήν<\/td><td>deuteran … epistolēn<\/td><td>第二封信<\/td><td>最自然指彼得前書<\/td><\/tr><tr><td>διεγείρω … ἐν ὑπομνήσει<\/td><td>diegeirō … en hypomnēsei<\/td><td>用提醒搖醒<\/td><td>1:13 同一對字：臨終還在做同一件事<\/td><\/tr><tr><td>τὴν εἰλικρινῆ διάνοιαν<\/td><td>tēn eilikrinē dianoian<\/td><td>純淨的心思<\/td><td>沒有摻雜、卻可能正在打盹的頭腦<\/td><\/tr><tr><td>μνησθῆναι<\/td><td>mnēsthēnai<\/td><td>去記得<\/td><td>不定詞說出提醒的目的<\/td><\/tr><tr><td>τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος<\/td><td>tēs tōn apostolōn hymōn entolēs tou kyriou kai sōtēros<\/td><td>你們的使徒的、主和救主的命令<\/td><td>源頭是主，傳遞者是使徒<\/td><\/tr><\/table>","gram":"<p><strong>3:1 的 ἐν αἷς（en hais） 是複數，把兩封信綁在一起。<\/strong>Ταύτην ἤδη … δευτέραν（Tautēn ēdē … deuteran），「這已經是第二封」，最自然指彼得前書。有人主張是一封失傳的信，理由是前書講受苦、不像在提醒主再來；但前書其實處處提到末後（彼前 1:5、13；4:7；5:4），本講義採彼得前書。和合本「這兩封都是提醒你們」譯得準確。<\/p><p>διεγείρω（diegeirō） 是把睡著的人搖醒，與 ἐν ὑπομνήσει（en hypomnēsei） 一起，在 1:13 已經出現過一次。被搖醒的是 διάνοια（dianoia），思想、理解力；εἰλικρινῆ（eilikrinē） 是純淨、沒有摻雜。3:2 的不定詞 μνησθῆναι（mnēsthēnai） 說出目的：提醒，是為了記得。<\/p><p>句尾是一串屬格：τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος（tēs tōn apostolōn hymōn entolēs tou kyriou kai sōtēros）。命令的源頭是「主和救主」，傳遞者是「你們的使徒」。先知與使徒並列，是同一位主在兩個時代說話。<\/p>","exp":"<p>〔背景〕路 22:32--32（路加講義第 22 章）<\/p><p>〔彼前〕彼前 1:10--12（彼得前書講義第 1 章）<\/p><p>「親愛的弟兄啊，我現在寫給你們的是第二封信。這兩封都是提醒你們，激發你們誠實的心」（3:1）。第 3 章是彼得遺言的最後一段。他沒有說「我要告訴你們新的東西」，他說的還是提醒。1:12 說「常常提醒」，1:13 說「趁我還在這帳棚的時候提醒你們，激發你們」，到了最後一章，仍是同一件事。<\/p><p>「激發」是把人搖醒的字。彼得要搖醒的不是情緒，是思想；「誠實的心」是沒有摻雜的心思，還沒有被私慾攪混，卻可能正在打盹。信仰最常見的危險，不是不知道，是忘了。這一章後面要面對的譏誚，起點正是「故意忘記」（3:5）。<\/p><p>他要人記得兩樣：「聖先知預先所說的話和主救主的命令，就是使徒所傳給你們的」（3:2）。這不是兩個互相競爭的權威，是同一位主在兩個時代說話：先知預先說，使徒傳出去。這接回 1:21，先知的話是「人被聖靈感動，說出神的話來」。<\/p><p>今天很少人公開否認信仰，多半只是讓它慢慢褪色。所以讀經、聚會、在群組裡轉一節經文給軟弱的弟兄，都不是重複，是搖醒。寫這封信的人，曾經被主吩咐「你回頭以後，要堅固你的弟兄」（路 22:32）；提醒不是彼得的個性，是主交給他的功課。<\/p>"},{"a":3,"z":4,"star":2,"grk":"<p lang=\"grc\">τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ἐσχάτων τῶν ἡμερῶν ἐν ἐμπαιγμονῇ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι<\/p><p lang=\"grc\">καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.<\/p>","lit":"<p>首先要知道這件事：在末後的日子，必有譏誚的人帶著譏誚而來，照著他們自己的私慾而行，<\/p><p>並且說：他來臨的應許在哪裡呢？因為自從列祖睡了以來，萬物都這樣持續，從創造的起頭就是如此。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τοῦτο πρῶτον γινώσκοντες<\/td><td>touto prōton ginōskontes<\/td><td>首先知道這件事<\/td><td>與 1:20 一字不差的開頭<\/td><\/tr><tr><td>ἐπ’ ἐσχάτων τῶν ἡμερῶν<\/td><td>ep' eschatōn tōn hēmerōn<\/td><td>在末後的日子<\/td><td>從五旬節開始的一整段時期（徒 2:17）<\/td><\/tr><tr><td>ἐν ἐμπαιγμονῇ ἐμπαῖκται<\/td><td>en empaigmonē empaiktai<\/td><td>在譏誚中的譏誚者<\/td><td>同根疊用；ἐμπαιγμονή 新約僅此一次<\/td><\/tr><tr><td>Ποῦ ἐστιν ἡ ἐπαγγελία<\/td><td>Pou estin hē epangelia<\/td><td>應許在哪裡<\/td><td>用一個問題代替一個論證<\/td><\/tr><tr><td>τῆς παρουσίας αὐτοῦ<\/td><td>tēs parousias autou<\/td><td>他的來臨<\/td><td>1:16 同字：彼得親眼見過的威榮<\/td><\/tr><tr><td>πάντα οὕτως διαμένει<\/td><td>panta houtōs diamenei<\/td><td>萬物都這樣持續<\/td><td>現在式：一直如此，所以將來也如此<\/td><\/tr><\/table>","gram":"<p><strong>3:3 用 τοῦτο πρῶτον γινώσκοντες（touto prōton ginōskontes） 開頭，和 1:20 一字不差。<\/strong>前一次要知道的是預言的來源，這一次要知道的是：會有人笑。ἐν ἐμπαιγμονῇ ἐμπαῖκται（en empaigmonē empaiktai） 是同根疊用，「在譏誚中的譏誚者」：他們不只說了一句譏誚的話，整個人就活在譏誚裡。κατὰ τὰς ἰδίας ἐπιθυμίας（kata tas idias epithymias） 把根挖出來：懷疑的源頭在私慾，不在學問。<\/p><p>οἱ πατέρες（hoi pateres） 有兩讀：一、舊約列祖，新約這個詞幾乎都這樣用（徒 3:13；羅 9:5；來 1:1），又與後半句的 ἀπ’ ἀρχῆς κτίσεως（ap' archēs ktiseōs） 連成一條長線；二、第一代已經離世的信徒，因為 ἐκοιμήθησαν（ekoimēthēsan）「睡了」多用於信徒的死。本講義較傾向第一讀，兩讀都不改變譏誚的邏輯：διαμένει（diamenei） 是現在式，「一直維持」，過去沒有變，所以將來也不會變。3:5--7 就是拆這個邏輯。<\/p><p>ἐπ’ ἐσχάτων τῶν ἡμερῶν（ep' eschatōn tōn hēmerōn） 是一段時期，不是倒數的訊號；彼得在五旬節就說末後的日子已經開始（徒 2:17）。<\/p>","exp":"<p>〔猶〕猶 18--18（猶大書講義尚未製作）<\/p><p>〔彼前〕彼前 4:7--7（彼得前書講義第 4 章）<\/p><p>「第一要緊的，該知道在末世必有好譏誚的人隨從自己的私慾出來譏誚說」（3:3）。彼得不是要信徒驚訝，是要他們「預先知道」（3:17），聽見笑聲的時候不至於腿軟。前書說「萬物的結局近了」（彼前 4:7）；這一章要回答的，正是「近」為甚麼過了這麼久。<\/p><p>「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣。」（3:4）這句話的力量不在論證，在語氣。它用一個問題代替一個論證；舊約裡，這是仇敵對受苦的人說的話：「你的神在哪裡呢？」（詩 42:3）背後還有一套世界觀：過去沒有變，所以將來也不會變。<\/p><p>彼得把根挖出來：他們「隨從自己的私慾」。主若真要回來，我的生活就得向他交帳；所以最好他不來。很多時候，懷疑不是頭腦先出了問題，是生活先不想被打擾。<\/p><p>這句話今天換了衣服：「都兩千年了，還在等？」說的人可能是同事，可能是家裡的長輩，也可能是半夜睡不著的我們自己。回應譏誚的第一步不是吵贏，是記得：「降臨」這個字，彼得在 1:16 已經用過，那「乃是親眼見過他的威榮」。被譏誚的應許，背後站著一位被親眼看見過的主。這個問題議題頁另有討論（ISS03_1）。<\/p>"},{"a":5,"z":7,"star":2,"grk":"<p lang=\"grc\">λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ,<\/p><p lang=\"grc\">δι’ ὧν ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο·<\/p><p lang=\"grc\">οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρί, τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.<\/p>","lit":"<p>因為他們故意讓這件事從眼前溜走：諸天自古就有，地也是從水而出、藉著水而成立，都是憑著神的話；<\/p><p>藉著這些，當時的世界被水淹沒，就滅亡了。<\/p><p>但現在的天和地，憑著同一個話被積存起來，留給火，被看守著，直到不敬虔之人受審判、遭滅亡的日子。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>λανθάνει … θέλοντας<\/td><td>lanthanei … thelontas<\/td><td>故意讓它溜走<\/td><td>不是不知道，是不想記得；3:8 反過來用<\/td><\/tr><tr><td>ἐξ ὕδατος καὶ δι’ ὕδατος<\/td><td>ex hydatos kai di' hydatos<\/td><td>從水而出、藉水而成<\/td><td>創 1:2、6--9 的畫面<\/td><\/tr><tr><td>τῷ τοῦ θεοῦ λόγῳ<\/td><td>tō tou theou logō<\/td><td>憑神的話<\/td><td>創造、淹沒、存留，同一個話<\/td><\/tr><tr><td>ὕδατι κατακλυσθεὶς ἀπώλετο<\/td><td>hydati kataklystheis apōleto<\/td><td>被水淹沒就滅亡了<\/td><td>2:5 的洪水；地並沒有消失<\/td><\/tr><tr><td>τεθησαυρισμένοι εἰσὶν πυρί<\/td><td>tethēsaurismenoi eisin pyri<\/td><td>被積存起來留給火<\/td><td>完成式：放進庫裡，至今仍在<\/td><\/tr><tr><td>τηρούμενοι εἰς ἡμέραν κρίσεως<\/td><td>tēroumenoi eis hēmeran kriseōs<\/td><td>被看守到審判的日子<\/td><td>2:4、9 同一個動詞<\/td><\/tr><\/table>","gram":"<p><strong>3:5 的 λανθάνει … θέλοντας（lanthanei … thelontas） 說出譏誚的病根：不是資訊不足，是選擇性的遺忘。<\/strong>λανθάνω（lanthanō） 是「從眼前溜走」，θέλοντας（thelontas） 是「願意」：這件事溜走，是他們自己要它溜走。另有一讀把 θέλω（thelō） 解作「堅稱」：「他們堅持這一點時，卻忽略了……」。本講義照和合本取「故意」；兩讀殊途同歸，所以 3:8 的解藥是 μὴ λανθανέτω（mē lanthanetō），「不可忘記」。<\/p><p>ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα（ex hydatos kai di' hydatos synestōsa） 是創世記第 1 章的畫面：旱地從水中露出來（創 1:9）。彼得引的是敘事，目的在神學，不是一套物理宇宙論。3:6 的 δι’ ὧν（di' hōn） 是複數，「藉著這些」，最自然指水與神的話：同樣的水，在同一個話底下，可以是創造的材料，也可以是審判的工具。<\/p><p>3:7 的 τεθησαυρισμένοι（tethēsaurismenoi） 是完成式被動，放進寶庫、至今仍在；τηρούμενοι（tēroumenoi） 是 2:4、9 那個「看守、留下」。ἀπώλετο（apōleto） 說當時的世界「滅亡」，地卻沒有消失：審判是了結罪，不是取消受造界。<\/p>","exp":"<p>〔舊約〕創 7:11--24（創世記講義第 7 章）<\/p><p>〔彼前〕彼前 3:20--20（彼得前書講義第 3 章）<\/p><p>「他們故意忘記，從太古，憑神的命有了天，並從水而出、藉水而成的地。」（3:5）譏誚的人說萬物仍是一樣；彼得說：你們忘了兩件事，創造與洪水。天地本來沒有，是「憑神的命」有的；同樣的水，在挪亞的日子成了審判，「當時的世界被水淹沒就消滅了」（3:6）。世界被打斷過，而且打斷它的，正是那說話的神。<\/p><p>這段的主角不是水，也不是火，是神的話。創造憑這話，淹沒憑這話，「但現在的天地還是憑著那命存留」（3:7）。世界今天的穩定，不是證明神不會來，正是證明神的話還在托住它。譏誚的人把神的忍耐誤認成神的缺席。<\/p><p>「存留」是放進庫房的字，又加上「直留到」，被看守著。第 2 章彼得用同一個「看守」講神把不義的人留到審判（2:9），也在同一段講神「保護了傳義道的挪亞一家八口」（2:5）。神看守審判，也看守他的人。<\/p><p>還要留意：洪水消滅了「當時的世界」，地卻沒有消失，挪亞走出方舟，踏上的是同一塊被洗過的地。所以 3:7 的火，焦點是「不敬虔之人受審判遭沉淪」，不是神對他所造的世界失去興趣。那火還在庫裡，因為門還開著（3:9）。創造論與科學怎樣對話，議題頁另論（ISS03_2）。<\/p>"},{"a":8,"z":8,"star":2,"grk":"<p lang=\"grc\">Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.<\/p>","lit":"<p>但親愛的，這一件事不要讓它從你們眼前溜走：在主那裡，一日如同一千年，一千年如同一日。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἓν δὲ τοῦτο<\/td><td>Hen de touto<\/td><td>但這一件事<\/td><td>放在句首：千頭萬緒，只要記得這一件<\/td><\/tr><tr><td>μὴ λανθανέτω ὑμᾶς<\/td><td>mē lanthanetō hymas<\/td><td>不要讓它從你們溜走<\/td><td>與 3:5「故意忘記」一反一正<\/td><\/tr><tr><td>παρὰ κυρίῳ<\/td><td>para kyriō<\/td><td>在主那裡<\/td><td>觀點是主的，不是我們的<\/td><\/tr><tr><td>ὡς χίλια ἔτη<\/td><td>hōs chilia etē<\/td><td>如同一千年<\/td><td>ὡς 是比喻，不是等號<\/td><\/tr><tr><td>χίλια ἔτη ὡς ἡμέρα μία<\/td><td>chilia etē hōs hēmera mia<\/td><td>一千年如同一日<\/td><td>倒過來再說一次，取消換算<\/td><\/tr><\/table>","gram":"<p><strong>3:8 引用詩 90:4，又加上一個方向。<\/strong>七十士譯本詩 89:4 作 χίλια ἔτη ἐν ὀφθαλμοῖς σου ὡς ἡ ἡμέρα ἡ ἐχθές（chilia etē en ophthalmois sou hōs hē hēmera hē echthes），「千年在你眼中如昨日」，只有一個方向。彼得先說 μία ἡμέρα … ὡς χίλια ἔτη（mia hēmera … hōs chilia etē），再倒過來說 χίλια ἔτη ὡς ἡμέρα μία（chilia etē hōs hēmera mia），首尾對稱，成一個交錯句式。<\/p><p>關鍵在 ὡς（hōs）：「如同」，是比喻，不是等號。兩個方向並列，正好互相抵銷，取消一切換算。早期的《巴拿巴書》把創造六日套成六千年的世界歷史，後世也有人拿這節去定主再來的年份或創造日的長度；本講義不採這種讀法（議題頁 ISS03_3）。παρὰ κυρίῳ（para kyriō） 才是重心：不是換一支鐘錶，是換一個位置，站到主的旁邊看時間。μὴ λανθανέτω（mē lanthanetō） 是第三人稱命令，與 3:5 的 λανθάνει（lanthanei） 一反一正。<\/p>","exp":"<p>〔舊約〕詩 90:4--4<\/p><p>「親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日。」（3:8）譏誚的人「故意忘記」（3:5），彼得說：親愛的，有一件事你們「不可忘記」。同一個字，一反一正。他們忘記神做過的事；信徒要記得神是怎樣的一位。<\/p><p>這句話來自摩西的禱告：「在你看來，千年如已過的昨日，又如夜間的一更。」（詩 90:4）摩西說的是人生短暫、神永恆。彼得多加了一個方向：「一日如千年」。兩個方向都說，正是為了取消換算。若一日可以像千年，千年也可以像一日，就沒有人能拿這節經文去定主哪一年來，或創造用了多少年。這節經文本身就拒絕被當成尺。<\/p><p>它要說的是：時間不是神的主人。對我們，一千年長得看不見盡頭；主卻不會因為等了很久就忘記應許。反過來，一日在主手中可以像千年那樣厚重，他可以在一日之間成就人以為要等一輩子的事。神不被時間拖慢，也不被時間催促。<\/p><p>一位照顧失智母親多年的姊妹說，最難熬的不是累，是不知道還要多久。這節經文沒有告訴她還要多久，卻把她帶到「主那裡」，從那裡看時間：多等的每一天，主都在場，也都記得。321 說的改變觀點就是這樣：從人的觀點換到神的觀點，不是換算，是換位。<\/p>"},{"a":9,"z":9,"star":3,"grk":"<p lang=\"grc\">οὐ βραδύνει κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.<\/p>","lit":"<p>主並沒有在他的應許上遲延，像有些人所看為的遲延；乃是向你們恆久忍耐，不願任何人滅亡，乃願所有的人都走到悔改裡去。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>οὐ βραδύνει κύριος τῆς ἐπαγγελίας<\/td><td>ou bradynei kyrios tēs epangelias<\/td><td>主在應許上不遲延<\/td><td>否定詞放在最前面<\/td><\/tr><tr><td>βραδύτητα ἡγοῦνται<\/td><td>bradytēta hēgountai<\/td><td>看作遲延<\/td><td>βραδύτης 新約僅此一次；3:15 同一個動詞<\/td><\/tr><tr><td>μακροθυμεῖ εἰς ὑμᾶς<\/td><td>makrothymei eis hymas<\/td><td>向你們恆久忍耐<\/td><td>把怒氣拉長；彼前 3:20 同字族<\/td><\/tr><tr><td>μὴ βουλόμενός τινας ἀπολέσθαι<\/td><td>mē boulomenos tinas apolesthai<\/td><td>不願任何人滅亡<\/td><td>3:6--7 審判的字，神說他不願意<\/td><\/tr><tr><td>πάντας εἰς μετάνοιαν χωρῆσαι<\/td><td>pantas eis metanoian chōrēsai<\/td><td>所有人都走進悔改<\/td><td>悔改像一個地方，神等人走進去<\/td><\/tr><\/table>","gram":"<p><strong>3:9 把否定詞 οὐ（ou） 放在最前面：主不遲延。<\/strong>βραδύνει（bradynei） 帶屬格 τῆς ἐπαγγελίας（tēs epangelias），「在應許的事上」不慢。ὥς τινες βραδύτητα ἡγοῦνται（hōs tines bradytēta hēgountai） 的 ἡγέομαι（hēgeomai） 是「看作」，3:15 再出現一次：有人把這段時間看作遲延，彼得要讀者把它看作得救。差別不在時間，在看的人。<\/p><p>ἀλλὰ μακροθυμεῖ εἰς ὑμᾶς（alla makrothymei eis hymas）：μακροθυμέω（makrothymeō） 由「長」和「怒氣」組成，不是沒有怒氣，是把發作的時間拉長。部分抄本作 δι’ ὑμᾶς（di' hymas），「為你們的緣故」，意思相近。<\/p><p>μὴ βουλόμενος（mē boulomenos） 說的是神真實的心意。這節與揀選的關係有幾種讀法：衛斯理傳統讀為神普遍的救恩心意；改革宗一派把「任何人」「人人」限在「你們」之中；另一派分辨神的心意與定旨（結 33:11）。普救論與 3:7 直接衝突，不能這樣讀。本講義不在這節裁決揀選的系統：它的工作是回答「為甚麼還沒來」（議題頁 ISS03_4）。<\/p>","exp":"<p>〔背景〕約 21:15--17（約翰福音講義第 21 章）<\/p><p>〔彼前〕彼前 3:20--20（彼得前書講義第 3 章）<\/p><p>「主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。」（3:9）同一件事，主還沒有來，人的觀點叫它「耽延」，神的觀點叫它「寬容」。「有人以為他是耽延」，不只是譏誚的人的想法，也是許多等得很累的信徒心裡的話。彼得沒有責備這份累，他把它翻過來。<\/p><p>「寬容」這個字，彼得前書用過：「神容忍等待的時候」（彼前 3:20）。方舟造了很多年，那不是神忘了審判，是神在等人進來。現在彼得說：我們的日子也是這樣。為甚麼等？「不願有一人沉淪」。「沉淪」正是 3:6--7「消滅」「沉淪」的那個字族：審判的字，神說他不願意。他的慢不是軟弱，是愛的等。<\/p><p>寫下這句話的人，自己就是被等回來的。他三次不認主，主在海邊預備了炭火和魚，三次問他「你愛我嗎」（約 21:15--17）。寫「寬容」的人，是被寬容等回來的；焦點不在彼得，在那位肯等的主。<\/p><p>所以等候的時間不是焦慮的時間，是悔改與傳福音的時間。那個還沒回頭的家人、那個跌倒了還想回來的弟兄，甚至我們自己心裡那一塊還沒交出來的地方，主的慢，就是為了這些。但也不要把寬容當成可以繼續拖延的理由，保羅說「他的恩慈是領你悔改」（羅 2:4）。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<p lang=\"grc\">Ἥξει δὲ ἡμέρα κυρίου ὡς κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται.<\/p>","lit":"<p>但主的日子要像賊一樣來到；在那日，諸天要轟然一聲過去，天體（或作：元素）要被烈火焚燒而解散，地和其上所作的一切都要被顯露出來。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Ἥξει δὲ ἡμέρα κυρίου ὡς κλέπτης<\/td><td>Hēxei de hēmera kyriou hōs kleptēs<\/td><td>主的日子必像賊來到<\/td><td>動詞放在句首，回答「在哪裡呢」<\/td><\/tr><tr><td>ῥοιζηδὸν παρελεύσονται<\/td><td>rhoizēdon pareleusontai<\/td><td>轟然一聲過去<\/td><td>ῥοιζηδόν 新約僅此一次<\/td><\/tr><tr><td>στοιχεῖα δὲ καυσούμενα λυθήσεται<\/td><td>stoicheia de kausoumena lythēsetai<\/td><td>元素被焚燒而解散<\/td><td>天體或物質元素，兩讀並陳<\/td><\/tr><tr><td>τὰ ἐν αὐτῇ ἔργα<\/td><td>ta en autē erga<\/td><td>其上所作的工<\/td><td>人的作為，不只是物件<\/td><\/tr><tr><td>εὑρεθήσεται<\/td><td>heurethēsetai<\/td><td>必被發現、被顯露<\/td><td>SBLGNT；和合本依 κατακαήσεται「燒盡」<\/td><\/tr><tr><td>οὐχ εὑρεθήσεται<\/td><td>ouch heurethēsetai<\/td><td>必不被發現<\/td><td>NA28 的讀法<\/td><\/tr><\/table>","gram":"<p><strong>3:10 最後一個動詞有異文，是全卷最重要的一處。<\/strong>拜占庭多數抄本作 κατακαήσεται（katakaēsetai），「必燒盡」，和合本照這一讀；最早最好的西乃抄本與梵諦岡抄本作 εὑρεθήσεται（heurethēsetai），「必被發現、被顯露」，SBLGNT 採這一讀；NA28 依據少數古譯本作 οὐχ εὑρεθήσεται（ouch heurethēsetai），「必不被發現」；另有抄本作「必消失」，也有略去這一句的。<\/p><p>「燒盡」意思最清楚，與 3:7、12 的火一致，但正因為清楚，很可能是抄寫的人為了把難句說明白而改的。「被顯露」是較難的讀法，其他各讀都容易解釋成從它改出來的；意思是地和其上的工都要攤開在神的審判面前，無所隱藏，與林前 3:13 一致，也與 3:14 的 εὑρεθῆναι（heurethēnai）「被他找到」同一個動詞。「不被發現」則說舊的秩序不再存留。本講義採 SBLGNT 的「被顯露」，講台用和合本「燒盡了」時要說明原文有異文。幾種讀法的落點都不是神丟棄受造界：「燒盡」講審判之火的徹底，「顯露」講它的鑒察，終點都在 3:13 的新天新地。<\/p><p>στοιχεῖα（stoicheia） 夾在「天」與「地」之間，最可能指天體（賽 34:4），也可解為物質元素；和合本「有形質的」兼容兩者。<\/p>","exp":"<p>〔背景〕太 24:42--44（馬太講義第 24 章）<\/p><p>「但主的日子要像賊來到一樣。」（3:10）句子第一個字是「必要來到」。譏誚的人問「在哪裡呢」，彼得把動詞放在最前面回答：會來。然後他用主自己的比喻：像賊（太 24:43）。賊不預告時間。確定會來，又不知道何時來，這正是等候的人的兩隻腳：不懷疑，也不要推算日子。<\/p><p>接著是三幅畫面：「那日，天必大有響聲廢去，有形質的都要被烈火銷化，地和其上的物都要燒盡了。」（3:10）「大有響聲」在新約只出現這一次，是箭飛過、火燒起來那種呼嘯聲。這是先知式的語言，重點在震撼與確定，不是一份物理學的程序表。<\/p><p>最後一句有異文。和合本「燒盡了」強調審判的徹底；較早的抄本作「被顯露」，強調審判的鑒察：那一日，地上一切所作的，都要攤開在神面前。這使我們想起保羅說：「各人的工程必然顯露，因為那日子要將它表明出來，有火發現」（林前 3:13）。四節之後（3:14），彼得用同一個動詞說「安然見主」，原文就是「被他找到」。<\/p><p>所以這節經文問我們的，不是地球哪一天燒掉，而是那一天我被找到的時候，是甚麼樣子。兩種讀法都不是說神要丟棄他所造的世界，也不是說今天怎樣對待受造界都無所謂；火是審判與煉淨，3:13 的終點是新天新地。被顯露的，正是我們今天怎樣生活、怎樣待人、怎樣管理神所交託的一切（議題頁 ISS03_5、ISS03_6）。<\/p>"},{"a":11,"z":13,"star":3,"grk":"<p lang=\"grc\">Τούτων οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις,<\/p><p lang=\"grc\">προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται.<\/p><p lang=\"grc\">καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.<\/p>","lit":"<p>這一切既然都要這樣解散，你們應當是何等樣的人，活在聖潔的種種行為和敬虔之中，<\/p><p>等候並催促神的日子來臨；因那日，諸天被火焚燒就要解散，元素被烈火焚燒就要熔化。<\/p><p>但我們照他的應許，等候新的諸天和新的地，有義住在其中。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ποταποὺς δεῖ ὑπάρχειν ὑμᾶς<\/td><td>potapous dei hyparchein hymas<\/td><td>你們應當是何等樣的人<\/td><td>末世論落成一個生活的問題<\/td><\/tr><tr><td>ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις<\/td><td>en hagiais anastrophais kai eusebeiais<\/td><td>在聖潔的行為和敬虔中<\/td><td>兩個複數：一件一件具體的事<\/td><\/tr><tr><td>προσδοκῶντας καὶ σπεύδοντας<\/td><td>prosdokōntas kai speudontas<\/td><td>等候並催促<\/td><td>σπεύδω 兩讀並陳；方法是悔改與聖潔<\/td><\/tr><tr><td>καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν<\/td><td>kainous de ouranous kai gēn kainēn<\/td><td>新的諸天和新的地<\/td><td>καινός：品質上的新<\/td><\/tr><tr><td>δικαιοσύνη κατοικεῖ<\/td><td>dikaiosynē katoikei<\/td><td>義住在其中<\/td><td>長住，不再寄居<\/td><\/tr><\/table>","gram":"<p><strong>3:11 用獨立屬格 Τούτων οὕτως πάντων λυομένων（Toutōn houtōs pantōn lyomenōn） 接住 3:10，然後問：ποταποὺς δεῖ ὑπάρχειν ὑμᾶς（potapous dei hyparchein hymas），你們該是何等樣的人？<\/strong>λυομένων（lyomenōn） 是現在式分詞，「正要被解散」。ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις（hagiais anastrophais kai eusebeiais） 兩個都是複數：聖潔與敬虔不是一種氣質，是一件一件的行為。<\/p><p>3:12 的 σπεύδοντας（speudontas） 有兩讀：一、「熱切渴慕」，和合本「切切仰望」；二、「催促、加速」，σπεύδω（speudō） 帶直接受詞通常是使某事加快，彼得在聖殿也說悔改歸正，「那安舒的日子就必從主面前來到」（徒 3:19--20）。本講義認為原文較支持「催促」，但方法由上下文決定：3:9 的悔改、3:11 的聖潔。這是參與神的心意，不是掌握神的時間表，更不是叫人推算日子；3:10「像賊」仍然管著 3:12。<\/p><p>3:13 的 καινούς（kainous） 是品質上的新，與時間上的新 νέος（neos） 有別。κατοικεῖ（katoikei） 是長住，對照彼前 2:11 的「寄居」：義在那裡安家。<\/p>","exp":"<p>〔舊約〕賽 65:17--17<\/p><p>〔彼前〕彼前 2:11--11（彼得前書講義第 2 章）<\/p><p>「這一切既然都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔」（3:11）。彼得講完天地銷化，沒有接著畫一張時間表，而是問一個問題：你們是何等樣的人？末世論在新約裡從來不是好奇心的題目，是生活的題目。「聖潔」「敬虔」在原文都是複數：怎樣說話、怎樣花錢、怎樣對待家人、怎樣對待神所造的世界。<\/p><p>「切切仰望神的日子來到」（3:12）。等候不是坐在月台上看錶，是參與。我們催促那日子的方法，不是算它，是活它：悔改、聖潔，把福音傳給還沒有回頭的人（3:9）。這不是說人能用甚麼工程替主再來「製造條件」（議題頁 ISS03_7）。<\/p><p>然後是全章的題目：「但我們照他的應許，盼望新天新地，有義居在其中。」（3:13）這應許出自以賽亞：「看哪！我造新天新地」（賽 65:17）。「新」是品質上的新；保羅說受造之物要「得享神兒女自由的榮耀」（羅 8:21）。終點不是毀滅，是更新。<\/p><p>最美的是最後一個字：「居」，住下來不走。在這個世界，義常常只是寄居的少數，被擠到角落；在新天新地，義是主人，安家長住。前書稱信徒是「客旅，是寄居的」（彼前 2:11）；那一天，連義都不再寄居。今天活出聖潔的人，是在一個義還在寄居的世界裡，先過著將來那個世界的生活。321 說「建立屬神的體系」，終局就在這裡。<\/p>"},{"a":14,"z":14,"star":2,"grk":"<p lang=\"grc\">Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,<\/p>","lit":"<p>所以，親愛的，你們既然等候這些事，就當竭力，使自己沒有玷污、無可指摘地在平安中被他找到。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Διό, ἀγαπητοί<\/td><td>Dio, agapētoi<\/td><td>所以，親愛的<\/td><td>本章第三次「親愛的」<\/td><\/tr><tr><td>ταῦτα προσδοκῶντες<\/td><td>tauta prosdokōntes<\/td><td>等候這些事<\/td><td>3:12--14 連續第三次「等候」<\/td><\/tr><tr><td>σπουδάσατε<\/td><td>spoudasate<\/td><td>你們要竭力<\/td><td>1:5、10 同字<\/td><\/tr><tr><td>ἄσπιλοι καὶ ἀμώμητοι<\/td><td>aspiloi kai amōmētoi<\/td><td>沒有玷污、無可指摘<\/td><td>與 2:13 對寫；彼前 1:19 的羔羊<\/td><\/tr><tr><td>αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ<\/td><td>autō heurethēnai en eirēnē<\/td><td>在平安中被他找到<\/td><td>3:10 同一個動詞<\/td><\/tr><\/table>","gram":"<p><strong>3:14 的 εὑρεθῆναι（heurethēnai） 與 3:10 的 εὑρεθήσεται（heurethēsetai） 是同一個動詞。<\/strong>3:10 說地和其上的工要被顯露，這裡說到我們：要在平安中被他找到。αὐτῷ（autō） 可讀為施事與格「被他找到」，也可讀為「在他面前」被找到，意思相近；那一日找我們的，是主自己。<\/p><p>ἄσπιλοι καὶ ἀμώμητοι（aspiloi kai amōmētoi） 刻意與 2:13 對寫：假師傅是 σπίλοι καὶ μῶμοι（spiloi kai mōmoi），「已被玷污，又有瑕疵」；信徒加上否定字首 ἀ-（a-）。彼前 1:19 稱基督為 ἀμνοῦ ἀμώμου καὶ ἀσπίλου（amnou amōmou kai aspilou），同一對字：潔淨的源頭是羔羊。σπουδάσατε（spoudasate） 是不定過去式命令，1:5、10 的「殷勤」；ἐν εἰρήνῃ（en eirēnē） 接回 1:2 的平安。<\/p>","exp":"<p>〔彼前〕彼前 1:19--19（彼得前書講義第 1 章）<\/p><p>「親愛的弟兄啊，你們既盼望這些事，就當殷勤，使自己沒有玷污，無可指摘，安然見主」（3:14）「安然見主」原文是「在平安中被他找到」。3:10 說地和其上的工都要被顯露、被找到，這裡用同一個動詞說到我們。等候的終點，不是驚慌地被抓到，是平安地被找到。<\/p><p>「沒有玷污，無可指摘」是一對字，故意和 2:13 對著寫：假師傅「已被玷污，又有瑕疵」，信徒卻是沒有玷污、沒有瑕疵。分辨假師傅的最後一步，不是更會挑別人的瑕疵，是自己殷勤地求潔淨。<\/p><p>但這不是叫人靠自己變得無瑕。彼得前書說我們被贖，「乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血」（彼前 1:19），同一對字。真正無玷污的是羔羊；我們被找到時的潔淨，是從他來的。「殷勤」是 1:10 那個字：不是為了賺得恩典，是在神已賜下的一切裡用力（1:3）。<\/p><p>所以「安然」不是自信，是和好。全卷第二節說「願恩惠、平安……多多地加給你們」（1:2），快到最後一頁，同一個平安在見主的那一刻等著。若一想到主來就只有害怕，問題可能不是你太敬虔，是還沒有把自己完全交在羔羊的血底下。被他找到的人，是早已被他尋回的人。<\/p>"},{"a":15,"z":16,"star":2,"grk":"<p lang=\"grc\">καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν ἔγραψεν ὑμῖν,<\/p><p lang=\"grc\">ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.<\/p>","lit":"<p>並且要把我們主的恆久忍耐看作得救，正如我們所親愛的弟兄保羅，照著所賜給他的智慧寫信給你們；<\/p><p>他在一切的信中也都講論這些事；信中有些難以明白的，那些未受教、不堅固的人加以扭曲，就像扭曲其餘的經書一樣，以致自己滅亡。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὴν … μακροθυμίαν σωτηρίαν ἡγεῖσθε<\/td><td>tēn … makrothymian sōtērian hēgeisthe<\/td><td>把忍耐看作得救<\/td><td>3:9 的名詞與動詞再出現<\/td><\/tr><tr><td>ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος<\/td><td>ho agapētos hēmōn adelphos Paulos<\/td><td>我們所親愛的弟兄保羅<\/td><td>被當面抵擋過的人這樣稱呼對方<\/td><\/tr><tr><td>δυσνόητά τινα<\/td><td>dysnoēta tina<\/td><td>有些難明白的<\/td><td>新約僅此一次；難懂，不是不可懂<\/td><\/tr><tr><td>οἱ ἀμαθεῖς καὶ ἀστήρικτοι<\/td><td>hoi amatheis kai astēriktoi<\/td><td>未受教、不堅固的人<\/td><td>ἀστήρικτος 見 2:14<\/td><\/tr><tr><td>στρεβλοῦσιν<\/td><td>streblousin<\/td><td>扭曲<\/td><td>字根是拉肢的刑架；新約僅此一次<\/td><\/tr><tr><td>τὰς λοιπὰς γραφάς<\/td><td>tas loipas graphas<\/td><td>其餘的經書<\/td><td>保羅書信與「經書」並列<\/td><\/tr><\/table>","gram":"<p><strong>3:15 的 ἡγεῖσθε（hēgeisthe） 回應 3:9 的 ἡγοῦνται（hēgountai）。<\/strong>有人把這段時間「看作」遲延；你們要把主的 μακροθυμία（makrothymia） 看作 σωτηρία（sōtēria），得救。全章的鑰匙第二次出現。<\/p><p>ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος（ho agapētos hēmōn adelphos Paulos） 用的正是彼得叫讀者的那個 ἀγαπητός（agapētos）。保羅「寫了信給你們」指哪一封，有羅馬書、寫給小亞細亞的書信等說法，無法確定；ἐν πάσαις ἐπιστολαῖς（en pasais epistolais） 表示重點不在哪一封，在保羅全部書信一致的見證。<\/p><p>δυσνόητα（dysnoēta） 是「難以理解」，不是「不能理解」。出問題的是 οἱ ἀμαθεῖς καὶ ἀστήρικτοι（hoi amatheis kai astēriktoi）：ἀμαθής（amathēs） 是未受教、不肯學，不是沒有學歷；στρεβλόω（strebloō） 是把人綁上刑架拉扯。ὡς καὶ τὰς λοιπὰς γραφάς（hōs kai tas loipas graphas） 的 λοιπάς（loipas）「其餘的」，把保羅書信放進 γραφαί（graphai） 之列；新約中 γραφή（graphē） 一貫指聖經。<\/p>","exp":"<p>〔背景〕加 2:11--14（加拉太書講義第 2 章）<\/p><p>「並且要以我主長久忍耐為得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。」（3:15）同一段時間，有人看作耽延，彼得要你們看作得救：主多等一天，就多一個人可以回頭。<\/p><p>接著他請出一位證人：保羅。多年前在安提阿，保羅寫道：「後來，磯法到了安提阿；因他有可責之處，我就當面抵擋他。」（加 2:11）那件事寫進了加拉太書，各教會都讀得到。彼得在遺言裡沒有替自己辯護，也沒有提那一次；他只說保羅是「我們所親愛的兄弟」，有「所賜給他的智慧」。這不是兩位使徒的角力，是兩個被同一位主寬容的人，站在同一個福音上。無己的人才說得出「親愛的兄弟」，無己才能合一。<\/p><p>然後是很誠實的一句：「信中有些難明白的」（3:16）。連使徒都承認保羅不好懂，這對每一個讀羅馬書讀到頭痛的人都是安慰。但問題不在「難」，在「強解」：把經文綁起來，拉到自己要的長度。<\/p><p>所以這節經文不是叫會眾別讀難的經文，也不是說聖經只屬於少數專家。它給的保護是：在群體中讀、照上下文讀、謙卑地讀，讀不懂時願意被教，那正是「無學問」的反面（議題頁 ISS03_8、ISS03_9）。彼得把保羅的信和「別的經書」並列；我們手上的新約，有一部分是被一位曾經被它糾正的使徒親口認可的。<\/p>"},{"a":17,"z":18,"star":3,"grk":"<p lang=\"grc\">ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ,<\/p><p lang=\"grc\">αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ἀμήν.<\/p>","lit":"<p>所以你們，親愛的，既然預先知道，就要自己防備，免得被不法之人的迷惑一同帶走，從自己穩固的立足點上墜落；<\/p><p>你們卻要在我們主和救主耶穌基督的恩典和知識上長進。願榮耀歸給他，從現在直到永世的那一日。阿們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>προγινώσκοντες φυλάσσεσθε<\/td><td>proginōskontes phylassesthe<\/td><td>預先知道，就要防備<\/td><td>中間語態：看守自己<\/td><\/tr><tr><td>τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες<\/td><td>tē tōn athesmōn planē synapachthentes<\/td><td>被不法之人的迷惑一同帶走<\/td><td>加 2:13 同一個動詞<\/td><\/tr><tr><td>ἐκπέσητε τοῦ ἰδίου στηριγμοῦ<\/td><td>ekpesēte tou idiou stērigmou<\/td><td>從自己穩固的地步墜落<\/td><td>στηριγμός 新約僅此一次，字根是「堅固」<\/td><\/tr><tr><td>αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει<\/td><td>auxanete de en chariti kai gnōsei<\/td><td>卻要在恩典和知識上長進<\/td><td>現在式命令：持續地長<\/td><\/tr><tr><td>αὐτῷ ἡ δόξα<\/td><td>autō hē doxa<\/td><td>榮耀歸給他<\/td><td>頌讚直接歸給基督<\/td><\/tr><tr><td>εἰς ἡμέραν αἰῶνος<\/td><td>eis hēmeran aiōnos<\/td><td>直到永世的那一日<\/td><td>新約僅此一處這樣說<\/td><\/tr><\/table>","gram":"<p><strong>3:17--18 一個防備、一個長進，用 δέ（de） 連起來：不墜落的方法不是站著不動，是長。<\/strong>φυλάσσεσθε（phylassesthe） 是現在式中間語態命令，看守自己；προγινώσκοντες（proginōskontes） 接回 3:3「第一要緊的，該知道」。συναπαχθέντες（synapachthentes） 是「一同被帶走」，新約另一處重要的出現在加 2:13，主詞是巴拿巴，「連巴拿巴也隨夥裝假」；而帶頭「退去」的，是彼得自己（加 2:12）。στηριγμοῦ（stērigmou） 新約只此一次，字根 στηρίζω（stērizō） 正是路 22:32「堅固你的弟兄」。<\/p><p>τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ（tou kyriou hēmōn kai sōtēros Iēsou Christou） 一個屬格管兩個面向：恩典是主所賜的，知識是對主的認識；全卷以 ἐπίγνωσις（epignōsis） 開頭（1:2），以 γνῶσις（gnōsis） 收尾。αὐτῷ ἡ δόξα（autō hē doxa） 最近的先行詞是耶穌基督，與 1:1「我們的神和救主耶穌基督」首尾相扣。句末 ἀμήν（amēn） 有抄本略去，不改變意思；和合本有「阿們」。<\/p>","exp":"<p>〔背景〕路 22:31--32（路加講義第 22 章）<\/p><p>〔彼前〕彼前 5:12--12（彼得前書講義第 5 章）<\/p><p>「親愛的弟兄啊，你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。」（3:17）全卷的收束，次序不可顛倒：先防備，再長進，最後把榮耀歸給主。<\/p><p>「誘惑」原文是「一同被帶走」。這個字在新約另一處出現在安提阿：「其餘的猶太人也都隨著他裝假，甚至連巴拿巴也隨夥裝假。」（加 2:13）那一次，帶頭「退去與外邦人隔開了」的，正是彼得自己（加 2:12）。他知道一個堅固的人怎樣在一頓飯之間被帶偏，所以他寫：要防備。「堅固的地步」的字根，是主在那一夜對他說的話：「你回頭以後，要堅固你的弟兄。」（路 22:32）<\/p><p>「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進。」（3:18）前書最後說「你們務要在這恩上站立得住」（彼前 5:12），後書最後說在恩上長。彼得前書教我們在火裡站得住，彼得後書教我們在霧裡看得清；站得住的人，還要長。長在恩典裡，那是主賜的；長在知識裡，就是更認識他。<\/p><p>然後是最後一口氣：「願榮耀歸給他，從今直到永遠。阿們！」（3:18）照教會的傳統，一個快要殉道的老人，最後寫下的不是自己，是他。讀完這卷書，我們記得的不該是彼得多偉大，而是主多恆久忍耐。321 說讓耶穌得著一切的榮耀，在這裡不是口號，是一個人一生的最後一句話。<\/p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《直等到天發亮，晨星在你們心裡出現》"],["p","弟兄姊妹平安，今天我們開始讀一卷新的書信，彼得後書第一章。"],["p","請你和我一起，再回到加利利海邊。"],["q","那天早上，炭火還在燒，魚和餅剛剛吃完。"],["p","主問了彼得三次「你愛我嗎」，也三次把自己的羊交給他。"],["p","然後，主說了一句彼得一輩子忘不了的話。"],["q","「我實實在在地告訴你，你年少的時候，自己束上帶子，隨意往來；但年老的時候，你要伸出手來，別人要把你束上，帶你到不願意去的地方。」（約 21:18）"],["p","年少的時候，自己束上帶子。那天早上，他就是自己束上外衣，跳進海裡的。"],["p","年老了，別人要把你束上。主在一頓早飯以後，把他的結局告訴了他。"],["p","約翰在福音書裡，加了一句說明。"],["q","「耶穌說這話是指著彼得要怎樣死，榮耀神。」（約 21:19）"],["p","請你留意主接著說的話。主沒有說：所以你要小心。主說的是："],["q","「你跟從我吧！」（約 21:19）"],["p","彼得一轉身，看見約翰跟在後面，就問了一個我們也常常問的問題。"],["q","「主啊，這人將來如何？」（約 21:21）"],["p","我知道我會怎樣死了，那他呢？"],["p","主的回答很短。"],["q","「我若要他等到我來的時候，與你何干？你跟從我吧！」（約 21:22）"],["p","同一個早上，主說了兩次：你跟從我吧。"],["p","弟兄姊妹，三十多年過去了。那個跳進海裡的漁夫，老了。"],["p","頭髮白了，手也沒有從前有力。羅馬城裡逼迫的風聲，一天比一天緊。"],["p","他知道，海邊那一句話快要應驗了。於是他提起筆來，寫他最後的一封信。"],["q","「因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的。」（1:14）"],["p","「所指示我的」，就是海邊那一天。三十年來，他一直知道自己會怎樣死。"],["p","一個人知道自己快走了，會寫甚麼？"],["p","一定是他心裡最要緊的那幾句話。"],["p","你看他的第一行。"],["q","「作耶穌基督僕人和使徒的西門‧彼得」（1:1）"],["p","「西門」，原文 Συμεών，用這個拼法稱呼彼得，新約只有兩處。"],["p","那是他的本名。主在海邊三次叫他的，就是這個名字：約翰的兒子西門，你愛我嗎？"],["p","臨終提筆，他先寫下那個被主叫回來的名字。而且僕人在前，使徒在後。"],["p","他寫信給誰？給「與我們同得一樣寶貴信心的人」。"],["p","「一樣寶貴」，原文是城邦裡同等公民權的字。使徒的信心和你的信心，一樣貴重。"],["p","「同得」，是抽籤分到的意思。信心不是賺來的，是分給你的。"],["p","所以我要先說清楚：今天我們不是來佩服彼得的。"],["p","這封信不是一個偉人的回憶錄。"],["p","是一個被主接回來的人，最後一次指著主說：你們看他。"],["p","這一章有三個詞：賜，加，照。我們走三步：一切都已經給了，所以要加上，燈與晨星。"],["q","第一步：一切都已經給了。"],["q","「神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。」（1:3）"],["p","請你記得，這是一封遺言。照常理，遺言是一連串的叮嚀：你要這樣，你不要那樣。"],["p","可是彼得的第一句話不是命令。他還沒叫你做任何一件事，就先說：已經給了。"],["p","「賜給」這個字，原文是完成式。不是將來才給，也不是看你表現再給。"],["p","是已經給了，而且到今天還在你手上。"],["p","給了多少？關乎生命和虔敬的，一切。"],["q","你缺的，真的是更多的供應嗎？"],["p","很多弟兄姊妹，把信仰活成了一種缺乏。總覺得自己還差一點甚麼。"],["p","再多一次特會，再多一次被按手，我才夠屬靈。"],["p","彼得說：你不缺。你缺的，是更深地認識那一位已經給了你的主。"],["p","一切是怎樣送到我們手上的？皆因我們認識那召我們的主。"],["p","神不是寄一個包裹給我們就走了。他把自己給了我們，一切都在認識他裡面。"],["p","再看「美德」這兩個字。原文 ἀρετή，兩節以後的「德行」，就是同一個字。"],["p","他身上有的，他召我們也長出來。我們要長成的，本來就是他的樣子。"],["p","然後，彼得寫下全卷最高的一句話。"],["q","「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。」（1:4）"],["p","「極大」，原文是最高級。一個老漁夫，找不到更大的字了。"],["p","「與神的性情有分」，這一句很容易講偏。所以也有人乾脆跳過，一句也不講。"],["p","今天我們不跳過，也不把它講過頭。"],["p","「有分」這個字，原文 κοινωνός，彼得很熟。"],["p","當年在革尼撒勒湖邊，雅各和約翰是西門的夥伴。路加用的，就是這個字。"],["p","那時候，他們有分的是一條船、一網魚。如今主說：你要有分的，是我的生命。"],["p","可是在這裡，我們要誠實地畫一條線。"],["q","有分，不等於變成。夥伴，不等於船主。"],["p","創造主與受造的人，中間的分別永遠存在。"],["p","我們藉著聖靈與基督聯合，有分於神的生命和聖潔的品格。"],["p","不是人變成神，也不是與神的本質混在一起。"],["p","那麼有分的內容是甚麼？彼得自己寫出來了。"],["p","往前看，是脫離世上從情慾來的敗壞。往後看，是德行、知識、節制，一直到愛。"],["p","神的性情落在人身上，長出來的不是神通，是品格。"],["p","而且你看，這是「應許」，是「賜給」。有分是恩典，不是修煉，更不是爭取來的。"],["q","長進不是爬上去見神，是神已經下來，把一切賜給我們。"],["p","那麼，已經得著一切的人，是不是就可以躺下來了？"],["q","第二步：所以要加上。"],["q","「正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識；」（1:5）"],["p","正因這緣故。因為神已經給了一切，所以你要分外地殷勤。"],["p","恩典不叫人閒懶，恩典叫人起身。"],["p","這個次序不能顛倒。先有神的完成式，才有我們的命令式。"],["p","「加上」這個字，原文 ἐπιχορηγήσατε，裡面有一個畫面。"],["p","古希臘的城邦每年辦戲劇節，要有人出錢，供應一整個合唱團。"],["p","服裝、排練、演出，都由他供應。那是一份榮譽，比的是誰更大方。"],["p","彼得用這個字說：在你的信心裡，大方地供應出德行來。"],["p","不是勉強湊數，是甘心樂意地給出去。"],["p","請你再留意一個小字：原文不是「在信心上面」，是「在信心裡面」。"],["p","德行從信心裡長出來，知識從德行裡長出來。"],["q","這不是一道要爬的樓梯，是一棵慢慢長大的樹。"],["q","「有了知識，又要加上節制；有了節制，又要加上忍耐；有了忍耐，又要加上虔敬；」（1:6）"],["q","「有了虔敬，又要加上愛弟兄的心；有了愛弟兄的心，又要加上愛眾人的心。」（1:7）"],["p","你看起點和終點。起點是信心，是神親手分給你的。終點是愛。"],["p","知識只在第二級。認識主若停在腦子裡，就長不出節制，也長不出忍耐。"],["p","最後兩級都是愛人。先愛弟兄，再愛眾人。"],["q","品格的頂點，不是一個人多屬靈，是他多能愛。"],["p","我也要說清楚：這不是一張照表操課的步驟表，不是做完第一項，才准做第二項。"],["p","這是一棵樹，從神所給的信心裡，一樣一樣結出果子來。"],["p","彼得接著說，長和不長，差在哪裡。"],["q","「人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨。」（1:9）"],["p","「只看見近處的」，原文是一個瞇起眼睛的字。"],["p","英文的「近視」，就是從這個字來的。"],["p","不是天生看不見，是自己把眼睛瞇起來，只盯著眼前那一點。"],["p","眼前那一點是甚麼？這個月的帳單，同事的一個臉色，家人說的一句重話。"],["p","可是病根在下半句：忘了。忘了他舊日的罪，已經得了潔淨。"],["p","他忘記的不是規條，是恩典。"],["p","一個忘了自己被赦免多少的人，長不出忍耐，也長不出愛。"],["p","這一節不是拿來指著別人說：你瞎了。這是給我們每一個人的一次眼科檢查。"],["p","治療的方法也很溫柔。不是更用力，是想起來。"],["p","彼得最知道這一點。那一夜在大祭司的院子裡，雞叫了。"],["q","「主轉過身來看彼得，彼得便想起主對他所說的話」（路 22:61）"],["p","把他從跌倒裡叫回來的，是主的那一眼，和一次想起來。"],["q","「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳。」（1:10）"],["p","永不失腳。寫這句話的人，曾經在加利利的水面上，一步一步往下沉。"],["q","「耶穌趕緊伸手拉住他」（太 14:31）"],["p","所以這一句，不是一個強人的保證。是一個被主拉住過的人，作的見證。"],["p","不失腳，不是因為你的腳力好，是因為那隻手沒有放開。"],["q","「這樣，必叫你們豐豐富富地得以進入我們主－救主耶穌基督永遠的國。」（1:11）"],["p","「得以進入」，原文又是那個供應的字。只是這一次，供應的是神。"],["p","你在信心裡大方地供應德行，神在那一天大方地供應你進國的門。"],["p","不是從門縫裡擠進去，是被盛大地迎接進去。"],["p","那國的主人，是我們主救主耶穌基督。"],["p","可是路還很長，天還沒有亮。在天亮以前，我們手裡拿著甚麼？"],["q","第三步：燈與晨星。"],["q","「我以為應當趁我還在這帳棚的時候提醒你們，激發你們；」（1:13）"],["p","「提醒」，不是教新的東西，是把你已經知道的，再放到你眼前。"],["p","正好對著第九節的「忘了」。人會忘，所以主差人來提醒。"],["p","「帳棚」這兩個字，彼得一輩子忘不了。"],["p","那一天在山上，主在他們面前變了形像，臉面明亮如日頭。"],["p","摩西和以利亞也顯現，同主說話。彼得看呆了，脫口而出："],["q","「主啊，我們在這裡真好！你若願意，我就在這裡搭三座棚，一座為你，一座為摩西，一座為以利亞。」（太 17:4）"],["p","他想把榮耀留在山上，關進帳棚裡。"],["p","可是路加記下來，那天山上真正在談的是甚麼。"],["q","「談論耶穌去世的事，就是他在耶路撒冷將要成的事。」（路 9:31）"],["p","「去世」，原文 ἔξοδος，就是「出埃及」的那個字。"],["p","主在談自己要在耶路撒冷成就的出埃及，彼得卻在盤算帳棚要怎麼搭。"],["p","三十年後，老彼得這樣寫："],["q","「並且，我要盡心竭力，使你們在我去世以後時常記念這些事。」（1:15）"],["p","「我去世以後」，他用了同一個字：出埃及。"],["p","年輕的彼得，想把榮耀關進帳棚。年老的彼得，終於明白了。"],["q","帳棚是要拆的，榮耀是要等的。"],["p","因為主先走過了那一次出埃及。他在耶路撒冷死了，又復活了。"],["p","所以對跟隨他的人，死亡不是結束，是跟著主走的一次出埃及。"],["p","一個快要離世的人，最後的殷勤用在哪裡？"],["p","不是保住自己的名聲。是叫別人在他走了以後，還記得主的話。"],["p","然後，他的筆回到了那座山。"],["q","「我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。」（1:16）"],["p","那個時代，有很多神明下凡的故事，編得很巧，講得很美。"],["p","彼得說：我們沒有編。我們是在場的人。"],["p","有意思的是，那天在山上，彼得說了一大段話。馬可記了一句："],["q","「彼得不知道說甚麼才好」（可 9:6）"],["p","三十年後，他一句也沒有提自己說過的話。他只記得一個從天上來的聲音。"],["q","「這是我的愛子，我所喜悅的。」（1:17）"],["q","「我們同他在聖山的時候，親自聽見這聲音從天上出來。」（1:18）"],["p","人老了，會忘記自己說過多少話，卻忘不了神說過的那一句。"],["p","那座山為甚麼叫「聖山」？不是因為那塊石頭，是因為主在那裡。"],["p","焦點從來不是彼得看見了多少，是那一位被父喜悅的愛子。"],["p","可是你會說：我沒有上過那座山。我沒有親眼看見，也沒有親耳聽見。"],["p","彼得早就想到你了。他接著寫："],["q","「我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。」（1:19）"],["p","「更確」，和第十節的「堅定不移」是同一個字：踏得穩的。"],["p","山上的經歷，叫先知的話更加確定。"],["p","你不必等到有一樣的經歷才相信，因為那更確的話已經在你手裡。"],["p","它像甚麼？像一盞燈。"],["p","「暗處」這個字，不只是暗，是又乾又髒的地方。那就是我們今天住的世界。"],["p","燈不是太陽。它不會把整個世界照亮，它只照亮你腳前的那一步。"],["p","可是在天亮以前，燈就是你最可靠的光。"],["q","天還沒有亮，你手裡拿的是甚麼？"],["p","有人放下手裡的燈，去追一陣閃光。"],["p","一個新奇的說法，一次驚人的經歷，一個叫人心跳的人。"],["p","彼得說：要留意這一盞燈。原文是一直看著，不是偶爾看一眼。"],["p","直等到天發亮。天亮，是主再來的那個早晨。"],["p","晨星，是天亮以前、帶著光先升起來的那顆星。"],["q","「我是明亮的晨星。」（啟 22:16）"],["p","那一天，燈可以放下了，因為光的本身來了。"],["p","請你留意，晨星是出現在「心裡」。不是腦子裡多了一條知識，是心裡迎見了一位主。"],["p","最後，彼得說這盞燈是從哪裡來的。"],["q","「第一要緊的，該知道經上所有的預言沒有可隨私意解說的；」（1:20）"],["q","「因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。」（1:21）"],["p","「感動」，原文是「被帶著」。"],["p","保羅坐的船遇上狂風，路加寫：船被風抓住，就任風颳去。用的就是這個字。"],["p","先知像一艘帆船。帆是他的，聲音、用字、性情，都是他自己的。"],["p","風卻是聖靈的，方向是神的。"],["p","所以第二十節說的，是預言從哪裡來。請看第二十一節開頭那兩個字：因為。"],["p","那不是叫你不敢自己讀經，也不是要把聖經鎖起來，交給少數人。"],["p","讀經的保護是三件事：在弟兄姊妹中間讀，照上下文讀，存謙卑的心讀。"],["p","當初帶著先知說話的那一位聖靈，今天也帶著每一個讀經的人明白。"],["p","弟兄姊妹，我們回到加利利海邊。"],["q","炭火還在燒。主說：你跟從我吧。"],["p","彼得問：主啊，這人將來如何？主說：與你何干？你跟從我吧。"],["p","三十年後，彼得終於懂了。"],["p","他沒有在信裡拿自己和別人比，也沒有替自己辯護一句。"],["p","他只是把眼睛定在主身上。"],["p","看那位用神能，把一切賜給我們的主。"],["p","看那位在水面上，伸手拉住他的主。"],["p","看那位在聖山上，被父喜悅的愛子。"],["p","看那位要在天亮的時候，像晨星一樣出現的主。"],["p","先有神已經賜下的生命，才有我們在信心裡的殷勤。這個次序，請你不要倒過來。"],["p","也許今天，你覺得自己還差很多，一級也爬不上去。"],["p","請你記得：一切都已經給了。"],["p","這個禮拜，不必一次補齊八樣。"],["p","在你的信心裡，大方地供應一樣就好。"],["p","也許是忍耐，也許是去愛一位你不太容易愛的人。"],["p","也許你正走在一段很暗的路上。病房，失業，家裡的一句重話。"],["p","天還沒有亮，可是燈在你手裡。每天早上打開聖經，就是在暗處點起一盞燈。"],["p","不追閃光。只讓它照亮你腳前的下一步。"],["p","主在海邊等過彼得，又陪他走了三十年。他也在等你。"],["q","直等到天發亮，晨星在你們心裡出現。"],["p","你跟從我吧。這是主在海邊對彼得說的話，也是今天他對你說的話。"],["p","我們一起低頭禱告。"]]},"2":{"min":18,"blocks":[["h","《這些人是無水的井，是狂風催逼的霧氣》"],["p","弟兄姊妹平安，今天我們一起讀彼得後書第二章。"],["p","開始以前，我想先問你一個問題。"],["q","你怎麼知道你聽的講道是真的？"],["p","我不是問誰是假的。我是問你：你憑甚麼分辨？"],["p","而且這個問題，包括今天這一篇，也包括站在這裡講話的我。"],["p","是因為我口才好嗎？是因為我引了很多經文嗎？"],["p","是因為我會講幾個希臘字嗎？還是因為來聽的人很多？"],["p","這些都不是答案。口才可以練，經文可以斷章取義。"],["p","希臘字可以拿來唬人。人多，也不代表方向是對的。"],["p","請你想像一個畫面。"],["q","乾旱的山路，正午。你走了一整天，嘴唇已經裂開。"],["p","你記得前面有一口井，就照著記憶走過去。"],["p","到了井邊，往下一看，只有乾裂的石頭。"],["p","這比本來就沒有井更難受。因為你一整天的盼望，都放在那裡。"],["p","彼得說，有一種講道，就是這樣。"],["q","「這些人是無水的井，是狂風催逼的霧氣，有墨黑的幽暗為他們存留。」（2:17）"],["p","這是彼得最後的一封信。"],["p","臨終的人，只講最要緊的話。他卻用了整整一章，講這一口乾井。"],["p","這一章有三個詞：井，救，回。"],["p","我們走三步：乾井會從裡面冒出來，主知道搭救，假自由與真回頭。"],["q","第一步：乾井會從裡面冒出來。"],["q","「從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認，自取速速地滅亡。」（2:1）"],["p","請你聽那四個字：在你們中間。"],["p","彼得前書講的危險，是從外面來的。"],["p","彼得後書講的危險，是從裡面長出來的。"],["p","「私自引進」，原文的意思是夾帶，像把一樣東西悄悄塞進行李裡。"],["p","所以假師傅從來不掛「假師傅」的招牌。"],["p","他們講許多對的話，只在最要緊的地方，換掉一樣東西。"],["p","換掉的是甚麼？就是那買他們的主。"],["p","「主」這個字，是奴隸市場上付了價錢的主人。"],["p","主用自己的血把我們買回來，他們卻說：我不屬於任何人。"],["p","他們不一定口裡說沒有耶穌。更常是用生活說：他不是我的主人。"],["p","然後請你聽那個動詞：不承認。"],["p","原文是 ἀρνέομαι。這個字，彼得比誰都熟悉。"],["q","大祭司的院子，深夜。一堆炭火。一個使女盯著他看。"],["q","「彼得在眾人面前卻不承認」（太 26:70）"],["p","一次，兩次，三次。他用的，就是這一個字。"],["q","寫這句話的人，自己不承認過主。"],["p","那麼他和假師傅的分別在哪裡？不是他從來沒有否認過。"],["q","「主轉過身來看彼得」（路 22:61）"],["p","是主轉過身來看了他一眼。是他出去痛哭。是他在海邊被主接了回來。"],["p","所以這一章那些很重的話，不是一個完美的人居高臨下的定罪。"],["p","是一個曾經站在懸崖邊的人，被主一把拉回來，看見別人正往下走，在後面大聲地喊。"],["p","聽懂這一點，就知道這一章要怎樣讀：不是先指著別人，是先照自己。"],["q","「將有許多人隨從他們邪淫的行為，便叫真道因他們的緣故被毀謗。」（2:2）"],["p","「真道」，原文是真理的道路。道路是走出來的，不只是說出來的。"],["p","外人毀謗這條路，是因為看見了跟隨的人怎樣生活。"],["q","「他們因有貪心，要用捏造的言語在你們身上取利。」（2:3）"],["p","「捏造」這個字，像陶匠照著客人想要的形狀捏泥。"],["p","「取利」這個字，是做買賣。買賣的對象是誰？經文說：是你們。"],["q","在這種講道裡，會眾不是羊，會眾是貨。"],["p","所以我要先問我自己：我講道，是照真理講，還是照掌聲捏？"],["p","我也要問你：你特別喜歡某一種講道，是因為它是真的，"],["p","還是因為它剛好捏成了你想要的形狀？"],["p","彼得在這一章，給了我們五個記號。"],["p","對基督：還承不承認那買他的主？對金錢：是不是貪心取利？"],["p","對身體：是不是放縱肉身的情慾？對權柄：是不是膽大任性？"],["p","對自由：是不是應許人自由，自己卻作奴僕？"],["p","五個記號，沒有一個是口才，也沒有一個是宗派的標籤。全都是果子。"],["q","「憑著他們的果子，就可以認出他們來。」（太 7:16）"],["p","所以弟兄姊妹，我在講台上不給你一張名單。"],["p","我不會點名今天任何一位牧者，也不會點名任何教會、宗派、網路平台。"],["p","講台教的是記號，不是名單。手裡拿著名單的人，最容易忘記照自己。"],["p","講到這裡，你心裡也許發冷：乾井從裡面冒出來，我們還靠得住誰？"],["p","彼得接下來，深深吸了一口氣。"],["q","第二步：主知道搭救。"],["q","「就是天使犯了罪，神也沒有寬容」（2:4）"],["p","天使，洪水，所多瑪。很多人讀到這裡就害怕。"],["p","可是請你看這個句子的形狀。從第四節開始，原文是一個很長的「若」字句。"],["p","若神沒有寬容犯罪的天使，若神沒有寬容上古的世代，若神傾覆了所多瑪——"],["p","這一口長長的氣，要到第九節才吐出來。"],["p","所以不要停在火裡面。要一直讀到那一隻伸出來的手。"],["p","三個審判裡面，藏著兩次搭救。"],["q","「卻保護了傳義道的挪亞一家八口。」（2:5）"],["p","「傳義道的」，原文是傳令官，就是替王站在廣場上宣告命令的人。"],["p","挪亞在一個不敬虔的世代替神喊話，聖經沒有記載家族以外有誰回應。"],["p","用今天的標準，他是一個很失敗的傳道人。"],["p","可是神親自保護了他一家八口。"],["p","他的價值，不是用聽眾人數來量的，是用神看守了他來量的。"],["p","第二次搭救，是羅得。熟悉創世記的人，讀到這裡一定會皺眉。"],["p","他看見平原滋潤，就選了所多瑪。天使催他快走，他還遲延。"],["q","「但羅得遲延不走。」（創 19:16）"],["p","彼得怎麼會稱他為義人，而且一連三次？答案在第八節。"],["q","「因為那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。」（2:8）"],["p","「傷痛」這個字，原文本來是試金石，後來變成用刑的字。"],["p","羅得每天看見，每天心裡被刺一下。天天如此。"],["p","他沒有能力改變那座城，也沒有勇氣自己離開。可是他的心，還沒有麻木。"],["q","義不是完美。義是一顆還會傷痛的心。"],["p","今天很多人，也住在所多瑪中間。在螢幕裡，在辦公室，在飯局上。"],["p","危險不在於看見。危險在於，看久了，就不再痛了。"],["p","弟兄姊妹，你還會痛嗎？還會痛，就表示還有義心。"],["p","如果已經不痛了，我們一起求主，把那份痛再還給我們。"],["p","而且羅得蒙搭救，不是因為他夠好。是天使拉著他的手，把他領到城外。"],["p","搭救的主詞是神。這就是恩典。"],["p","現在，那一口長氣終於吐出來了。"],["q","「主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子」（2:9）"],["p","這一節，是彼得後書全卷的樞紐。"],["p","「知道」這個字，後面接一個動詞，意思是懂得怎樣去做。"],["p","主不只是知道你的處境。他懂得怎樣把你從裡面拉出來。"],["p","他拉挪亞，用一隻方舟。他拉羅得，用天使的一雙手。"],["p","方法完全不一樣。可是他都懂。"],["p","「脫離試探」，原文是從試煉裡面救出來。"],["p","不是保證你永遠不進洪水，是你身在其中的時候，他把你拉出來。"],["p","這個「脫離」，就是主禱文裡那一個字。"],["q","「救我們脫離凶惡」（太 6:13）"],["p","老彼得寫下「主知道」這三個字的時候，不可能不想起加利利海邊那個早晨。"],["p","三次不認主以後，他對復活的主說："],["q","「主啊，你是無所不知的；你知道我愛你。」（約 21:17）"],["p","一個連自己都靠不住的人，被一位甚麼都知道的主拉了回來。"],["p","所以這一節，不是彼得多堅強的見證。是主多恆久忍耐的見證。"],["p","這也告訴我們，第二章為甚麼要講審判。"],["q","講審判，是為了叫敬虔的人安心，不是為了叫敬虔的人害怕。"],["p","你是不是被困在一個不義的人很得勢的地方？"],["p","這一節不是叫你去算誰會受罰。是叫你把眼睛從他們身上，移回主身上。"],["p","審判是主的事，搭救也是主的事。我們的本位，就是敬虔。"],["p","可是彼得話鋒一轉，又回到那些人身上。這一次，他要拆穿他們口中的自由。"],["q","第三步：假自由與真回頭。"],["q","「他們膽大任性，毀謗在尊位的，也不知懼怕。」（2:10）"],["p","「任性」，原文是 αὐθάδεις，由「自己」和「取悅」兩個字合成。"],["p","意思是，以取悅自己作為生活的準繩。用我們熟悉的話說，就是有己。"],["p","保羅說，作監督的必須不任性，用的正是這個字。"],["p","所以最危險的任性，常常出現在有講台的人身上。"],["p","前一句「輕慢主治的」，常常被人這樣用："],["p","你質疑牧師，就是輕慢主治的。"],["p","弟兄姊妹，這不是這一節經文的意思。"],["p","「主治的」，原文最自然的讀法，是主自己的主權。輕慢主治，就是不要主作主。"],["p","請你再看一次，這一章被定罪的是誰？是師傅，是有講台、有跟隨者的人。"],["p","彼得在前一封信裡，給長老的命令是："],["q","「也不是轄制所託付你們的，乃是作群羊的榜樣。」（彼前 5:3）"],["p","照著真理、在愛中、按著次序提出的質疑，那不是毀謗。"],["p","一個不肯接受任何質疑的領袖，倒要先拿這一節照一照自己。也包括我。"],["q","「就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們。」（2:11）"],["p","天使比他們強得多，卻把審判留給主。"],["p","他們比天使弱得多，卻隨口宣判別人。"],["q","驕傲，就是離開本位，抓住只屬於神的權柄。"],["p","接著，彼得講到一個先知，和一頭驢。"],["q","「他們離棄正路，就走差了，隨從比珥之子巴蘭的路。巴蘭就是那貪愛不義之工價的先知」（2:15）"],["p","摩押王用重金請巴蘭來咒詛以色列。"],["p","巴蘭口裡說：我只照神的話說。心裡卻一直放不下那一份工價。"],["p","他騎著驢出發。耶和華的使者攔在路上，先知看不見，驢卻看見了。"],["p","先知氣得打了驢三次。然後，那頭驢開口說話了。"],["q","「那不能說話的驢以人言攔阻先知的狂妄。」（2:16）"],["p","這是全章最幽默的一筆。"],["p","前面才說這些人好像沒有靈性的畜類。這裡，卻是一頭畜類說出了人話。"],["p","一個被錢沖昏了頭的先知，比他騎的驢還不清醒。"],["p","弟兄姊妹，神今天也有他的驢。"],["p","可能是你看不起的人說的一句話。可能是一個一再受阻的計畫。"],["p","可能是一扇怎麼推都推不開的門。"],["p","巴蘭打了驢三次，卻不知道，是驢救了他的命。"],["q","下一次你被攔住的時候，先別急著打驢。"],["p","先問自己：我是不是正往不義的工價那裡走？"],["p","然後就是本章的篇名：無水的井，狂風催逼的霧氣。"],["p","井佔了源頭的位置。人來要水，它卻給不出水。"],["p","夏天早晨的霧，看起來好像要下雨。太陽一出來，風一吹，就散了。"],["p","「狂風」這個字，彼得也非常熟悉。"],["p","那一夜加利利海上起了暴風，福音書用的就是這個字。"],["p","可是那一夜，船上有一位主，起來斥責風和海。"],["p","被狂風催逼的霧，身邊沒有這一位主。"],["p","它們自稱自由，其實是被風趕著跑。"],["q","「他們應許人得以自由，自己卻作敗壞的奴僕，因為人被誰制伏就是誰的奴僕。」（2:19）"],["p","「制伏」，原文是打敗仗。古代打敗仗的人，就成了勝利者的奴隸。"],["p","他們以為自己勝過了規條，其實是被自己的情慾打敗了。"],["p","這就是有己最後的結局。"],["q","要自己作主的人，最後總被別的東西作主。"],["p","被錢作主，被情慾作主，被別人的掌聲作主。"],["p","我要問你一個很實際的問題。"],["p","哪一件事，你說「我可以控制」，其實它已經在控制你？"],["p","是手機嗎？是酒嗎？是一段關係嗎？還是一種停不下來的比較？"],["q","「所以天父的兒子若叫你們自由，你們就真自由了。」（約 8:36）"],["p","自由，不是沒有主人。自由，是有一位好主人。"],["p","彼得在這封信的第一節，怎樣介紹自己？"],["q","「作耶穌基督僕人和使徒的西門‧彼得」（1:1）"],["p","整卷書裡只有兩種僕人：作基督的僕人，或作敗壞的奴僕。沒有第三種誰都不服的人。"],["p","然後，彼得說了全章最難聽的一句話。"],["q","「俗語說得真不錯：狗所吐的，牠轉過來又吃；豬洗淨了又回到泥裡去滾；這話在他們身上正合式。」（2:22）"],["p","很多人讀到這裡，心就涼了半截：我也跌倒過，我是不是那一隻狗？"],["p","請你看清楚這段話是在講誰。它的上下文，是假師傅和跟隨他們轉背的人。"],["p","他們明明曉得義路，卻拿著自由，去引誘剛逃出來的人。"],["p","這段話，不是寫給一位跌倒了、心裡很痛、很想回家的弟兄姊妹。"],["p","「轉過來」這個字，彼得一輩子都忘不了。"],["p","因為被賣的那一夜以前，主曾經對他說："],["q","「你回頭以後，要堅固你的弟兄。」（路 22:32）"],["p","這裡的「回頭」，和狗的「轉過來」，是同一個字。"],["p","同一個字，兩個方向。"],["q","狗轉過來，回到牠所吐的。彼得轉過來，回到主的面前。"],["p","弟兄姊妹，我們回到開頭那個問題。"],["q","你怎麼知道你聽的講道是真的？"],["p","不是看它講得多響亮。那些虛妄矜誇的大話，是腫起來的，裡面是空的。"],["p","請你用這幾個問題來分辨：它叫你更承認那買你的主，還是叫你覺得自己不屬於任何人？"],["p","它叫你放下貪心，還是點燃貪心？它叫你更甘心順服，還是更任性地作主？"],["q","真的講道，把你帶回主的面前。假的講道，把你帶回你自己。"],["p","今天這一篇，也請你照樣檢驗。"],["p","分辨的果效，是更穩、更溫柔，不是更多疑。"],["p","如果聽完這一章，你只想上網去找誰是假師傅，那你就把這一章讀反了。"],["p","因為乾井最先冒出來的地方，可能正是我自己的心。"],["p","出路只有一條：謙卑戰勝驕傲。放下抓在手裡的權柄，回到本位。"],["p","讓神作神，也讓人作人。審判交給主，搭救也交給主。"],["p","如果你今天心裡很害怕，怕自己就是那一隻回頭的狗，"],["p","你會為這件事害怕，本身就說明，你的心還沒有麻木。"],["p","請聽彼得在第一章怎麼說："],["q","「人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨。」（1:9）"],["p","你舊日的罪，是被潔淨過的。千萬不要忘記。"],["p","再聽彼得在第三章怎麼說："],["q","「其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。」（3:9）"],["p","主還在等。他曾經在海邊等過彼得，今天，他也在等你。"],["p","不要像狗那樣，轉回舊路。要像彼得那樣，轉回主的面前。"],["p","乾井給不出水。可是有一位，在井旁這樣說："],["q","「人若喝我所賜的水就永遠不渴。我所賜的水要在他裡頭成為泉源，直湧到永生。」（約 4:14）"],["p","你不需要找一口更有名的井。你需要的，是回到活水的源頭。"],["p","讀完這一章，請你不要更佩服彼得。"],["p","請你更愛那一位，沒有放棄彼得、也沒有放棄你的主耶穌。"],["p","這個禮拜，請你做兩件小事。"],["p","第一件：拿彼得的五個記號，先照自己。不是照別人，是照自己。"],["p","寫下一件「我說我能控制、其實它在控制我」的事，帶到主面前。"],["p","第二件：如果你身邊有一位跌倒、不敢回來的弟兄姊妹，"],["p","不要拿第二章去嚇他。把 1:9 和 3:9 讀給他聽。"],["p","然後告訴他：主知道。主知道搭救敬虔的人。"],["p","我們一起低頭禱告。"]]},"3":{"min":18,"blocks":[["h","《我們照他的應許，盼望新天新地，有義居在其中》"],["p","弟兄姊妹平安，今天我們一起讀彼得後書最後一章，彼得後書第三章。"],["p","我想從一個數字開始。一千年。"],["p","一千年前，是北宋。那時候的人，我們連一個名字都叫不出來。"],["p","一千年，長到一個家族可以換三十幾代人。"],["p","彼得寫這封信，到今天，已經將近兩千年了。"],["q","兩個一千年。"],["p","這兩千年裡，一代一代的信徒唱著：主必再來。"],["p","又一代一代地，在等候中睡了。"],["p","所以有一個問題，在教會裡從來沒有停過。"],["q","「主要降臨的應許在哪裡呢？」（3:4）"],["p","有時候，是外面的人笑著問的。"],["p","同事在午飯桌上說：你們等了兩千年，還在等啊？"],["p","有時候，是我們自己半夜在心裡問的。"],["p","有人為一個孩子禱告了十年，那孩子還在外面。"],["p","有人為一場病禱告，最後等到的是一場告別式。"],["p","主啊，你說你要來。你在哪裡呢？"],["p","這個問題，誰沒有在心裡問過？"],["p","請你不要覺得羞恥。彼得早就知道我們會問。"],["q","羅馬，主後六十幾年。一個老人提起筆來，寫他最後一封信。"],["p","他在第一章說，他知道自己脫離這帳棚的時候快到了。"],["p","主在加利利海邊早就告訴過他：你年老的時候，別人要把你束上。"],["p","三十多年過去了。那一天，近了。"],["p","一個人最後要說的話，一定是他覺得最要緊的話。"],["p","這位老人留給教會的最後一個題目，是等。"],["p","他沒有留下一張末世的時間表。"],["p","這一章有三個詞：記得，寬容，長進。"],["p","我們走三步：應許在哪裡呢，不是耽延乃是寬容，等候的人怎樣活。"],["q","第一步：應許在哪裡呢？"],["q","「親愛的弟兄啊，我現在寫給你們的是第二封信。這兩封都是提醒你們，激發你們誠實的心」（3:1）"],["p","又是提醒。第一章他已經一再地提醒。"],["p","一個快要離世的使徒，沒有新東西要教了。他只怕一件事：怕我們忘記。"],["p","「激發」這個字，第一章也用過，意思是把睡著的人搖醒。"],["p","信仰最大的危險，常常不是不知道。"],["p","是知道了，然後慢慢睡著了。"],["q","「叫你們記念聖先知預先所說的話和主救主的命令，就是使徒所傳給你們的。」（3:2）"],["p","先知的話，使徒的話，兩根柱子。"],["p","等候的人靠的不是感覺，是神的話。"],["p","接著彼得說，第一要緊的，是知道一件事。"],["q","「第一要緊的，該知道在末世必有好譏誚的人隨從自己的私慾出來譏誚說：」（3:3）"],["q","「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣。」（3:4）"],["p","彼得預先說，是要我們聽見笑聲的時候，腳不會軟。"],["p","「末世」在這裡不是倒數的訊號。從五旬節到主再來，都是末世。"],["p","所以不要把每一個譏笑信仰的人，都當成末日快到的記號。"],["p","請你留意這些人的特點：隨從自己的私慾。"],["p","懷疑的根，常常不在頭腦，在生活裡。"],["p","主若真的要回來，我的日子就要向他交帳。"],["p","所以對有些人來說，最好他永遠不要來。"],["p","他們的理由，聽起來還很有道理。"],["p","太陽每天照樣升起，季節照樣輪轉。"],["p","過去從來沒有變過，將來也不會變。"],["p","彼得沒有跟他們長篇辯論。他只說了一句話。"],["q","「他們故意忘記，從太古，憑神的命有了天，並從水而出、藉水而成的地。」（3:5）"],["p","「故意忘記」，不是不知道，是不想記得。"],["p","原文的意思是：這件事從他們眼前溜走，是他們自己要它溜走。"],["p","萬物仍是一樣嗎？不是的。這個世界本來沒有，是憑神的話有的。"],["q","「故此，當時的世界被水淹沒就消滅了。」（3:6）"],["p","挪亞的日子，世界變過。同一個話，同樣的水。"],["p","「消滅」不是不存在。地還在，被審判的是當時的世界。"],["q","「但現在的天地還是憑著那命存留，直留到不敬虔之人受審判遭沉淪的日子，用火焚燒。」（3:7）"],["p","「存留」，是把東西放進寶庫，有人日夜看守著。"],["p","世界照常運轉，不是證明神不會來。"],["q","正好證明，神的話到今天還托著它。"],["p","譏誚的人，把神的忍耐，錯當成神的缺席。"],["p","這裡藏著一個很深的功課：信心的一半，是記得。"],["p","以色列人在曠野抱怨，是因為忘了紅海。"],["p","我們在等候裡灰心，常常也是因為忘了。"],["p","那一次你以為過不去的關，後來是怎麼過來的？"],["p","那一夜你哭著禱告，後來神怎樣回應你？"],["q","不要讓今天的沉默，抹掉昨天的恩典。"],["p","記得神做過的，你就等得住神還沒做的。"],["p","譏誚的人故意忘記。可是彼得轉過身來，對他所愛的人說了另一句話。"],["q","第二步：不是耽延，乃是寬容。"],["q","「親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日。」（3:8）"],["p","「不可忘記」，和第五節「故意忘記」，原文是同一個字。"],["q","他們故意忘記。你們卻不可忘記。"],["p","這一節的話，出自摩西的禱告。"],["q","「在你看來，千年如已過的昨日，又如夜間的一更。」（詩 90:4）"],["p","摩西只說了一個方向：千年像一日。"],["p","彼得多加了一個方向：一日也像千年。"],["p","為甚麼兩個方向都說？"],["q","正是為了取消換算。"],["p","原文那個「如」字是比喻，不是等號。這一節不是說一日等於一千年。"],["p","千年可以像一日，一日也可以像千年。那就誰也沒有辦法拿它來算。"],["p","不能拿它算主哪一年回來，也不能拿它算創造用了幾年。"],["p","歷史上有人拿這一節去算年份，一次又一次落空。彼得從來不是這個意思。"],["p","那它要說甚麼？要我們換一個位置看時間，站到「主那裡」去看。"],["p","時間不是神的主人，神才是時間的主人。"],["p","他不會因為等久了，就忘了自己的應許。"],["q","這叫換位，不叫換算。"],["p","那麼，神為甚麼到今天還沒有來？請看全章最溫柔的一節。"],["q","「主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。」（3:9）"],["p","同一件事：主還沒有來。"],["p","人的眼睛叫它耽延。神的心叫它寬容。"],["p","「寬容」，原文 μακροθυμεῖ，字面是把怒氣拉得很長。"],["p","不是沒有審判，第七節的審判還在。是把審判的時間往後推。"],["p","為甚麼往後推？因為還有人在門外。"],["p","彼得前書第三章說，挪亞預備方舟的時候，神也是這樣容忍等待。"],["p","神等待的那些年，方舟的門一直開著。"],["q","今天，那一扇門也還開著。"],["p","主的慢，不是軟弱。主的慢，是愛的等。"],["p","寫下「寬容」這兩個字的人，自己就是被主等回來的。"],["q","大祭司的院子，天快亮了。炭火旁邊，彼得第三次說：我不認得那個人。"],["p","雞叫了。主轉過身來，看了彼得一眼。"],["p","後來在加利利海邊，主預備了炭火和魚，等他上岸。"],["q","「約翰的兒子西門，你愛我嗎？」（約 21:16）"],["p","主問了三次。主沒有放棄他。"],["p","所以彼得寫「不願有一人沉淪」，不是在寫一段漂亮的神學。"],["p","他是在寫自己的一生。"],["p","那你呢？你今天能坐在這裡，是不是也是主等了很多年，才等回來的？"],["p","那個你還在為他流淚禱告的人，主也在等他，而且比你更有耐心。"],["p","所以等候的時間，不是焦慮的時間。"],["q","是悔改的時間，是傳福音的時間。"],["p","可是彼得馬上加了一句，免得我們把寬容當成拖延。"],["q","「但主的日子要像賊來到一樣。」（3:10）"],["p","這一句在原文，第一個字就是「要來」。"],["p","譏誚的人問：在哪裡呢？彼得先回答：會來。"],["p","而且像賊一樣來。賊從來不預告時間。"],["p","確定會來，又不知道是哪一天。這是等候的人站穩的兩隻腳。"],["p","不要懷疑，也不要推算日子。"],["q","「那日，天必大有響聲廢去，有形質的都要被烈火銷化，地和其上的物都要燒盡了。」（3:10）"],["p","最後一句，和合本譯作「燒盡了」。"],["p","可是最古老的幾份抄本，這裡是另一個字：被顯露。"],["p","地和其上所作的，都要被顯露出來，攤開在神面前。"],["p","兩種讀法，學者各有理由，講義裡兩種都陳列。"],["p","可是請你聽清楚：兩種讀法，都不是說神要丟掉他所造的世界。"],["p","所以不能從這一節推出：地球反正要燒，不必照顧。"],["p","這一節的重點是：在神面前，一切都要被顯明。"],["p","做過的、藏過的，那一天都要攤開。"],["p","這不是為了嚇唬我們，是叫我們今天就活在光中，不必躲藏。"],["p","一切都要被顯明。那麼，我們今天怎樣活？"],["q","第三步：等候的人怎樣活。"],["q","「這一切既然都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔，」（3:11）"],["p","講完天地銷化，你以為彼得會畫一張時間表。"],["p","他沒有。他只問了一個問題：你們為人，該當是怎樣的人？"],["p","末世在聖經裡，從來不是滿足好奇的題目。是今天怎麼過的題目。"],["p","「聖潔」「敬虔」，原文都是複數。"],["p","不是飄在空中的屬靈氣質，是一件一件看得見的事。"],["p","怎樣說話，怎樣花錢，怎樣對待家人、同事，和神所造的世界。"],["p","有人說：反正都要過去了，何必在乎？"],["p","彼得的邏輯剛好相反。正因為一切都要被顯明，今天怎樣活才那麼要緊。"],["q","「切切仰望神的日子來到。」（3:12）"],["p","「切切仰望」，原文 σπεύδοντας，裡面有「催促」的意思。"],["p","彼得在聖殿的廊下講過：當悔改歸正，那安舒的日子就必從主面前來到。"],["p","我們能催促主的日子嗎？不是用算的，是用活的。"],["p","回到第九節：主等，是因為要人悔改。"],["p","所以催促那日子的方法，是自己先悔改，再把福音傳給主還在等的那個人。"],["p","這不是推算日子，也不是說人可以製造主再來的條件。"],["p","第十節那個「賊」字，仍然管著第十二節。"],["p","然後，就是這一章的章題。"],["q","「但我們照他的應許，盼望新天新地，有義居在其中。」（3:13）"],["p","「照他的應許」。譏誚的人問應許在哪裡，彼得說：就在這裡。"],["p","「新」，原文 καινός，是品質上的新。"],["p","不是把舊的丟進垃圾桶再換一個，是把被罪敗壞的，從裡到外更新。"],["p","就像洪水之後，當時的世界「消滅」了，地卻還在。"],["p","那個世界最美的地方，不是金街，不是寶石。"],["q","是這一句：有義居在其中。"],["p","「居」，是住下來。義不再是匆匆的過客，是永遠的住戶。"],["p","不再有欺壓，不再有謊言，不再有好人吃虧、無處申訴的眼淚。"],["p","你今天為公義心痛過嗎？那一份心痛，就是盼望在你裡面的形狀。"],["p","神既然要更新他所造的，我們今天就不輕看它。"],["p","好好照顧一片土地、一個家、一間公司，都是朝那個方向先走一小步。"],["p","這不是要把教會變成政治動員，是在神的世界裡作忠心的管家。"],["q","「親愛的弟兄啊，你們既盼望這些事，就當殷勤，使自己沒有玷污，無可指摘，安然見主。」（3:14）"],["p","「安然見主」，原文是：在平安中被他找到。"],["p","等候的終點，不是驚慌失措地被抓到，是在平安裡被主親自找到。"],["p","「沒有玷污，無可指摘」，彼得前書用同一對字講那無瑕疵、無玷污的羔羊。"],["p","我們的乾淨，不是自己修出來的，是羔羊的血洗出來的。"],["p","接著，彼得說了一句很安靜、很動人的話。"],["q","「並且要以我主長久忍耐為得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。」（3:15）"],["p","「我們所親愛的兄弟保羅」，請你停在這幾個字上。"],["q","安提阿，一張飯桌。從耶路撒冷來了幾個人，彼得悄悄退了席。"],["q","「後來，磯法到了安提阿；因他有可責之處，我就當面抵擋他。」（加 2:11）"],["p","當面抵擋，而且寫進了加拉太書。每一間教會讀那封信，都讀到這一段。"],["p","被人這樣公開糾正過，多年以後，你會怎樣稱呼那個人？"],["p","彼得在遺言裡，沒有替自己辯護一句，也沒有提起安提阿。"],["p","他只說：我們所親愛的兄弟。"],["p","這不是兩位使徒在較勁。保羅沒有比彼得大，彼得也沒有比保羅小。"],["p","是兩個被同一位主寬容的人，站在同一個福音上。"],["p","不記帳，不是假裝沒受過傷。是把公道交給主，然後記得誰幫過我。"],["p","讀到這裡，我們才認出 321 常說的一句話：無己才能合一。"],["p","彼得接著又很誠實地說了一句。"],["q","「信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪。」（3:16）"],["p","連使徒彼得都說，保羅的信不好懂。讀羅馬書讀到頭痛的人，可以安心了。"],["p","可是請注意，彼得說問題不在難，在強解：把經文扭成自己想要的樣子。"],["q","難明白，不是不讀的理由。"],["p","這也不是說只有牧師能解，別人別碰。"],["p","是說要謙卑地讀，照上下文讀，在弟兄姊妹當中一起讀、一起問。"],["p","最後，彼得用兩節經文，把一生收了起來。請你留意次序。"],["q","「親愛的弟兄啊，你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。」（3:17）"],["p","第一，是防備。"],["p","「誘惑」，原文是被人一同帶走。"],["p","安提阿那一次，連巴拿巴也被一同帶走了。加拉太書用的就是這個字。"],["p","「堅固的地步」，和主那一夜對彼得說的話，是同一個字根。"],["q","「你回頭以後，要堅固你的弟兄。」（路 22:32）"],["p","一個被主堅固過的人，用一生堅固他的弟兄，一直做到最後一封信的最後一段。"],["p","可是防備還不是全部。不墜落的方法，不是站在原地不動。"],["q","「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進。」（3:18）"],["p","第二，是長進。一棵樹不長，就會倒。"],["p","在恩典上長，是越來越知道自己是被白白愛的。"],["p","在知識上長，是越來越認識那一位主。這卷書第一句問安，就落在認識主上。"],["p","彼得前書的最後說：在這恩上站立得住。彼得後書的最後說：在恩典上有長進。"],["q","站得住的人，還要長。"],["p","然後是第三，也是他一生最後的一句話。"],["q","「願榮耀歸給他，從今直到永遠。阿們！」（3:18）"],["p","「他」，就是前一句的主救主耶穌基督。全卷以基督開頭，以敬拜基督結束。"],["p","照教會的傳統，寫完這封信不久，彼得就在羅馬為主殉道。"],["p","一個快要殉道的老人，最後一口氣不是叮嚀，是讚美。"],["p","他沒有說：記得我。他說：願榮耀歸給他。"],["p","讓耶穌得著一切的榮耀，在新約裡沒有比這更真實的見證。"],["p","弟兄姊妹，我們回到開始的那個數字。"],["q","一千年。兩個一千年。應許在哪裡呢？"],["p","彼得沒有給我們一個日期。他給了我們三樣東西。"],["p","記得：神的話造了天地，也托著天地。記得他做過的，就等得住。"],["p","寬容：主的慢，是愛的等。那扇門，今天還開著。"],["p","長進：先防備，再長進，最後把榮耀歸給他。"],["p","我們等候主，不是坐在月台上看錶，也不是被每一條新聞牽著走。"],["p","是在主還在寬容的日子裡，悔改，聖潔，傳福音，彼此堅固。"],["p","可是不要只佩服彼得。"],["p","他否認過，他退席過，他在炭火旁邊哭過。"],["p","他寫得出這一章，只因為主一直在等他。"],["p","所以，下一次再有人問你：應許在哪裡呢？"],["p","你可以平平靜靜地回答。"],["p","應許在他的話裡，在他還開著的那扇門裡。"],["p","也在一個被他等回來的人身上。"],["q","「但我們照他的應許，盼望新天新地，有義居在其中。」（3:13）"],["p","我們一起低頭禱告。"]]}},"issues":[{"id":"ISS00_1","t":"作者、正典與猶大書——彼得後書真是使徒彼得寫的嗎？早期教會為甚麼對它有爭議？","r":"1:1；1:14--18；3:1--2；3:15--16","ch":[],"why":"一、作者是使徒彼得；託名說的理由與回應並陳；早期教會的爭議誠實交代；與猶大書的關係三說並陳，不裁判——本講義的全卷立場之一（本卷新立）。在新約二十七卷裡，彼得後書是作者問題爭議最大的一卷：今天許多學者主張託名，早期教會也確實有人存疑，第二章又與猶大書大段相似。一位弟兄在網上第一次讀到「彼得後書是偽作」，很自然會問：連作者都有爭議，這封信還能信嗎？這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>信的第一句是：「作耶穌基督僕人和使徒的西門‧彼得寫信給那因我們的神和救主耶穌基督之義、與我們同得一樣寶貴信心的人」（1:1）。「西門」原文作 Συμεών，是希伯來名字的拼法，新約裡除了這裡，只有雅各在耶路撒冷會議上這樣稱呼彼得（徒 15:14）。作者說他知道「我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的」（1:14），說「我們同他在聖山的時候，親自聽見這聲音從天上出來」（1:18），又說「我現在寫給你們的是第二封信」（3:1），還稱保羅為「我們所親愛的兄弟」（3:15）。<\/p><p>可是這封信的文筆與彼得前書差別不小；早期教會對它有過疑問；2:1–3:3 又與猶大書 4–18 節大段相似。<strong>經文問的是：寫信的人是不是使徒彼得？早期教會為甚麼猶豫？它和猶大書是甚麼關係？這些事會不會動搖這封信的權威？<\/strong><\/p>"],["使徒彼得說（彼得本人寫成，或經同工協助）","","<p>歷代教會的主流看法，也是許多福音派註釋家的看法。理由都來自經文本身：1:1 的自稱，而且用的是罕見的 Συμεών，冒名的人不太會挑這樣的拼法；1:14 對應主在加利利海邊對彼得的預告——「但年老的時候，你要伸出手來，別人要把你束上，帶你到不願意去的地方」（約 21:18）；1:16–18 以第一人稱見證登山變像；3:1 的「第二封信」最自然指彼得前書。<\/p><p><strong>難處：<\/strong>這派要面對文筆的差異——彼得後書的希臘文比彼得前書更講究、罕用字更多。常見的回應是：彼得前書明說「託我所看為忠心的兄弟西拉」（彼前 5:12），本書沒有提這個人，兩封信經手的人可能不同；而且一封講外面的苦難、一封講裡面的錯謬，用字本來就會不同。這是合理的推論，卻只能說「可能」。<\/p>"],["託名說（彼得死後，門生借他的名寫成）","","<p>今天許多學者持這個看法，理由主要有四：①希臘文風格與彼得前書差很多；②3:4「從列祖睡了以來」與 3:16「他一切的信」，像第一代使徒過世以後的口吻；③早期教會對它有爭議；④「遺言」是當時託名作品常見的文體，作者借臨終的口吻提醒後人，讀者也明白那是託名。持這說的學者多半不否認這封信的屬靈價值，只是認為作者是彼得的門生。這派的優點是認真處理文字與歷史的證據。<\/p><p><strong>難處：<\/strong>四點各有回應：①同上，經手的人可能不同；②「列祖」在新約最自然指舊約的先祖（徒 3:13；來 1:1），保羅在世時就叫教會彼此傳閱他的信（西 4:16）；③爭議屬實，但爭議不等於否定；④真正臨終的人也會寫遺言。更根本的難處是：一封再三警告「捏造的言語」（2:3）、強調「並不是隨從乖巧捏造的虛言」（1:16）的信，若本身是借名，早期教會在長期分辨之後不會接受它。<\/p>"],["早期存疑說（古人既有疑問，可見不是彼得寫的）","","<p>這是懷疑者常有的推論：彼得前書很早就被眾教會公認，彼得後書卻不是。三世紀的俄利根提到有人懷疑它；四世紀初的優西比烏把它列在「有爭議的書卷」裡，與雅各書、猶大書、約翰二書、約翰三書同列；耶柔米也記載許多人因為文體不同而存疑。這派的優點是誠實：它提醒教會，這段歷史是真的，不可以假裝沒有。<\/p><p><strong>難處：<\/strong>爭議是分辨的證據，不是否定的證據。古人問得很認真，問了很久，最後東西方教會都接受了它；一封三章的短信流傳較慢、較少被引用，並不奇怪，猶大書與約翰二書、三書也一樣。教會不是照單全收，正因如此，它最後被接受才更有分量（詳見 ISS00_8）。<\/p>"],["與猶大書的關係：三說並陳","","<p>把 2:1–3:3 和猶大書 4–18 節並排讀，會看見許多相同的主題，次序也大致相同：偷著引進異端、犯罪的天使、所多瑪與蛾摩拉、毀謗尊位、天使不敢用毀謗的話、像沒有靈性的畜類、巴蘭、無水的井（猶大書作「沒有雨的雲彩」）、墨黑的幽暗、末世好譏誚的人。三種說法：①猶大書在先，彼得用了猶大的材料（今天多數學者）；②彼得後書在先，猶大書引用它——彼後 2:1、3:3 用未來式「必有」，猶大書卻說這些人已經偷著進來了（猶 4）；③兩封信共用早期教會一份對付假師傅的教導材料。<\/p><p><strong>難處：<\/strong>三說都只能推論。主張猶大書在先的，要解釋彼得為甚麼略去米迦勒與摩西屍首（猶 9）和以諾的預言（猶 14–15）；主張彼得在先的，要解釋較短的猶大書為甚麼又加上這些；共同材料說則沒有任何留存的文件可以查考。詳見 ISS00_6。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：作者是使徒彼得；託名說的理由與回應並陳，不嘲諷持這個看法的學者；早期教會「有爭議的書卷」這段歷史誠實交代，不迴避；與猶大書的關係三說並陳，不裁判。<\/strong>理由是：信的自稱（1:1）、主的預告（1:14）、親身見證的登山變像（1:16–18）、「第二封信」（3:1），以及早期教會在長期分辨之後的接受。文筆差異可以用經手的人不同與題材不同解釋，但本講義承認這是推論。<\/p><p>與猶大書的分工是：<strong>彼得後書講「長進中的分辨」，猶大書講「為真道竭力地爭辯」<\/strong>；〔猶〕互見先標經文出處，將來猶大書講義製作時再分工。不論誰在先，聖經作者使用其他材料並不減損默示——路加也是「從起頭都詳細考察了」才寫成福音書（路 1:3）。<\/p><p><strong>講台只講一句：寫這封信的人，就是在登山變像那天想搭三座棚、後來三次不認主、又在海邊被主重新接回來的那一位；如今他說「我脫離這帳棚的時候快到了」（1:14）。<\/strong>講他的一生很動人，每一處卻都要落在主身上——不是彼得變好了，是主沒有放棄他。<\/p>"],["【四】這件事該不該影響你的信心","","<p>作者是誰、正典怎樣形成、誰抄誰，這些學術上的討論不該動搖你的信心——這個問題古人就問過，教會不是不知道，是想了很久之後才確認它。不論學者怎麼判斷，這封信所見證的主沒有改變：「並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」（1:16）。<\/p><p>但有一件事該問：<strong>我讀完這封信，是更佩服彼得，還是更愛彼得的主？<\/strong>這封遺言的最後一句，不是彼得為自己留下的話，是「願榮耀歸給他，從今直到永遠」（3:18）。他要我們記住的不是他的名字，是那位叫他在恩典和知識上長進的主。<\/p>"]],"con":[],"say":"本講義的全卷立場：作者是使徒彼得（1:1；1:14–18；3:1）；託名說的四個理由與回應並陳；早期教會「有爭議的書卷」這段歷史誠實交代，爭議不等於否定；與猶大書的關係三說並陳，不裁判。講台只講一句：寫信的人，就是那個在山上想搭棚、後來跌倒又被主接回來的人。","care":"席上會有在網路或讀書會上第一次聽到「彼得後書是偽作」而慌了的年輕人，也有一聽到學者有爭論就不安的長輩。牧者先告訴他兩件事：這個問題古人就問過，教會是認真分辨之後才接受它的；這封信所見證的主沒有改變。不要說「懷疑作者的都是不信派」，也不要把懷疑的人當成不屬靈；不在講台上逐條辯論，也不把信心建立在證明作者身分上。陪他讀完全卷，讓他自己看見信裡那位恆久忍耐的主。"},{"id":"ISS00_2","t":"與神的性情有分——1:4 是甚麼意思？這是說人可以修成神嗎？","r":"1:3--11；彼前 1:15--16；加 2:20","ch":[],"why":"二、採「在基督裡與基督聯合，有分於神的生命與品格」，四讀並陳；三條界線；「無己進入無限」是進入與無限之神的相交——本講義的全卷立場之二（本卷新立）。1:4 是全卷神學最高、也最容易講偏的一句：一邊有某些新興宗教與部分成功神學講員，把它講成人可以修煉到像神一樣；另一邊有講台因為怕講錯，乾脆跳過不提。兩種做法都對不起這節經文，這一題必須在開卷講定。","pos":[["【一】經文問的是甚麼","","<p>「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分」（1:4）。原文 θείας κοινωνοὶ φύσεως，直譯是「神的本性的有分者」；「有分」（κοινωνός）是同伴、合夥人，彼得在前書用同一個字說自己「同享後來所要顯現之榮耀」（彼前 5:1）。這節經文前面接著 1:3「神的神能已將一切關乎生命和虔敬的事賜給我們」，後面接著 1:5–7 一張從信心到愛眾人的心的清單。<\/p><p>於是會眾會問：人可以分享神的本性嗎？這是不是說人會變得和神一樣？有人說「我們都是小神」，這有聖經根據嗎？如果不是，這節經文到底應許了我們甚麼？<strong>經文問的是：「有分」有分到甚麼程度？起點在哪裡？有分的人活出來是甚麼樣子？<\/strong><\/p>"],["成神論（theosis；東正教）","","<p>東正教從亞他那修「神成為人，好叫我們得以成神」這句話一路發展，到十四世紀的帕拉馬系統化地區分神的「本質」與神的「能力」：人永遠不能有分於神的本質，創造者與受造者的分別永遠存在；人是藉著恩典有分於神的「能力」——神的生命、光與聖潔，越來越像神。準確地說，東正教的成神論不是說人變成另一位神，而是受造的人藉恩典與神相交，被神的生命充滿。這派的優點是認真對待 1:4 的高度，不把它削成一句道德勸勉。<\/p><p><strong>難處：<\/strong>「本質」與「能力」的區分是後來的神學用語，經文本身沒有這樣分；「成神」一詞在華人語境裡，極易被誤聽成修煉成仙、天人合一。本講義尊重這個傳統，不嘲諷，但講台上不用「成神」這個詞。<\/p>"],["與基督聯合說（改革宗、路德宗）","","<p>藉著聖靈與基督聯合，就有分於基督的生命；成聖是被更新成神的形像。加爾文註釋這一節時指出，這裡的「性情」不是指神的本質，乃是指品質——神要使我們的品格與他相似。這個讀法把 1:4 放在「在基督裡」的框架中：我們有分的不是神性本身，而是在聯合裡得著的新生命，正如保羅說「現在活著的不再是我，乃是基督在我裡面活著」（加 2:20）。這派的優點是把有分牢牢繫在基督身上，起點是恩典。<\/p><p><strong>難處：<\/strong>彼得後書本身沒有用「在基督裡」這個保羅常用的詞，這個讀法是借保羅的框架來讀彼得；而且若講得太快，容易把「有分」只剩下地位上的宣告，忘了 1:5–7 那一串要「分外地殷勤」加上去的品格。<\/p>"],["完全的愛說（衛斯理傳統）","","<p>有分於神的聖潔與愛；衛斯理強調在今生可以被聖靈充滿到一個地步，心裡以完全的愛愛神愛人。他所說的「基督徒的完全」不是無過失，而是愛的完全。這個讀法看重 1:5–7 那張以「愛眾人的心」作結的清單：有分於神的性情，終點就是像神那樣去愛。這派的優點是把 1:4 落在生活裡，而且盼望很高——神真的能改變一個人。<\/p><p><strong>難處：<\/strong>「完全」一詞容易被誤聽成無罪，叫認真的人在跌倒時加倍自責，也叫人以為有一個可以抵達、從此不必再長進的屬靈高點；可是全卷最後一句仍然是「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進」（3:18）。<\/p>"],["道德相似說（許多福音派註釋）","","<p>有分於神的道德品格——聖潔、良善、愛——不是本體上的有分。理由是下文：1:4 下半立刻說「脫離世上從情慾來的敗壞」，接著列出德行、知識、節制、忍耐、虔敬、愛弟兄的心、愛眾人的心（1:5–7）；彼得關心的是生命的樣子，不是形而上的本體。前書他也說「那召你們的既是聖潔，你們在一切所行的事上也要聖潔」（彼前 1:15）。這派的優點是穩，不容易講偏。<\/p><p><strong>難處：<\/strong>若只講道德相似，1:4 會變成「要學神的好榜樣」——好像靠自己努力就能做到；可是 1:3–4 一連說了兩次「賜給我們」，有分是神給的，不是人學來的。道德相似說需要和聯合說一起讀，才不會從恩典滑到修身。<\/p>"],["「小神」說（某些新興宗教與部分成功神學講員；本講義不採）","","<p>某些新興宗教把 1:4 讀成人可以修煉到與神同等的地步——這不是經文的意思；部分成功神學講員則說，信徒既有分於神的性情，就和神是同一類，可以像神一樣用話語創造財富與健康。並不是所有談信心與祝福的講員都這樣講，但這種講法在網路上流傳很廣。它抓住的經文影子是真的：1:4 的應許確實「又寶貴又極大」。<\/p><p><strong>難處：<\/strong>這說把恩典變成了能力，把敬拜變成了操控。經文說的是神「賜給」（1:3–4），不是人取得；有分的內容是脫離敗壞與 1:5–7 的品格，不是財富與權勢。撒但最早的引誘就是「你們便如神能知道善惡」（創 3:5）；人想與神同等，正是驕傲的根，不是謙卑的路。本講義不採。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：採「在基督裡與基督聯合，有分於神的生命與品格（聖潔、愛）」，並陳四讀，不嘲諷成神論，也不採「小神」說。<\/strong>明說三條界線：<\/p><p>①<strong>創造者與受造者的分別永遠存在<\/strong>——這節經文不是說人會成為神，也不是說人與神同等或與神的本質混同；有分像月亮反照日光，不是月亮變成太陽。②<strong>有分是恩典，不是修煉<\/strong>——「他已將又寶貴又極大的應許賜給我們」（1:4），起點是 1:3「神的神能已將一切關乎生命和虔敬的事賜給我們」；我們先領受，然後才「分外地殷勤」（1:5）。③<strong>有分的內容就寫在下文<\/strong>：脫離敗壞（1:4），加上德行、知識、節制、忍耐、虔敬、愛弟兄的心、愛眾人的心（1:5–7）。真正有分於神性情的人，看起來不是更神祕、更有能力，而是更節制、更忍耐、更會愛人。<\/p><p>321 說「無己不是沒有，乃是進入無限」，在本卷只能這樣說：<strong>無己的人進入與無限之神的相交，基督在他裡面活（加 2:20）；不是人變成無限。<\/strong>1:5–7 的八個台階也不是 321 的八大步驟——一個是品格的果子，一個是觀念改變的過程，兩者是兩回事。<\/p>"],["【四】這件事該不該影響你的信心","","<p>成神論、聯合說、完全的愛、道德相似之爭，不該動搖你的信心；四派都同意神是神、人是人，也都同意有分是從神來的恩典。<\/p><p>但有一件事該問：<strong>聽完 1:4，我是更想敬拜神，還是更想抬高自己？<\/strong>這節經文對一個覺得自己一無是處的人，是極大的安慰——神不只赦免他，還要把自己的生命與品格分給他；對一個想靠屬靈經歷高人一等的人，它卻是一面鏡子。寫這句話的人，曾經說「主啊，我就是同你下監，同你受死，也是甘心」（路 22:33），後來卻三次不認主；他知道自己裡面沒有甚麼可誇的，所以他說的是「賜給我們」。<\/p>"]],"con":[],"say":"本講義的全卷立場：1:4 採「在基督裡與基督聯合，有分於神的生命與品格」，四讀並陳。三條界線：創造者與受造者的分別永遠存在，這節經文不是說人會成為神；有分是恩典，不是修煉；有分的內容就是 1:5–7 的品格。「無己進入無限」是進入與無限之神的相交，不是人變成無限。","care":"席上會有覺得自己一無是處、不配被神愛的人，也有追求屬靈經歷、想高人一等的人，還有從新興宗教或某些網路講員那裡聽過「我們都是小神」的人。對第一種人，讓他聽見 1:4 是神親自賜下的應許；對第二種人，指給他看 1:5–7 的節制、忍耐與愛；對第三種人，溫和地帶他回到創造者與受造者的分別。不要因為怕被誤會就跳過 1:4，也不要把它講成修煉的祕訣；不嘲笑東正教或任何宗派的讀法。"},{"id":"ISS00_3","t":"分辨假教訓——怎樣分辨假教訓？聖經可以自己讀嗎？","r":"1:19--21；2:1--3；2:10--19；3:16--17","ch":[],"why":"三、講台教記號，不給名單；五個記號先照自己；1:20 的「私意」指預言的來源，不禁止會眾讀經；讀經的保護是在群體中、照上下文、謙卑地讀；教會財務要透明——本講義的全卷立場之三（本卷新立）。「在你們中間也必有假師傅」（2:1）——彼得前書的危險在外面，彼得後書的危險在裡面。第二章最容易被拿來給今天的人貼標籤，1:20 與 3:16 也常被拿來說「你們自己不要亂讀聖經」。這一題必須講定。","pos":[["【一】經文問的是甚麼","","<p>彼得說：「從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認，自取速速地滅亡」（2:1）。這句話的重心是「在你們中間」——危險不是從教會外面來的，是從裡面來的；假師傅坐在席上，「正與你們一同坐席」（2:13）。<\/p><p>同時，彼得說「經上所有的預言沒有可隨私意解說的」（1:20），又說保羅的信「有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪」（3:16）。於是會眾會問：今天誰是假師傅？我怎麼知道我的教會、我聽的講道是真的？我自己讀經，會不會就是「私意解說」、就是「強解」？<strong>經文問的是：彼得給的是名單還是記號？誰可以讀經？讀經的保護在哪裡？<\/strong><\/p>"],["名單式分辨（替今天的人對號入座）","","<p>把第二章當成一張通緝令：點名某位牧者、某個宗派、某個網路傳道人是假師傅，然後轉貼、截圖、貼標籤。這在網路上很普遍，出發點常是熱心護教，也確實有人因此避開了錯謬。它抓住的經文是真的：彼得的話很重，「他們的滅亡也必速速來到」（2:3）。<\/p><p><strong>難處：<\/strong>彼得在第二章一個當代的名字也沒有點，只點了舊約的巴蘭（2:15）；他給的是可以辨認的樣子，不是可以轉貼的名單。名單式分辨的結果，是會眾更會懷疑別人，卻不更會分辨果子；更危險的是，它讓人以為假師傅都在「別的地方」，忘了彼得說的是「在你們中間」。本講義不採。<\/p>"],["記號式分辨（五個果子）","","<p>彼得給的是五個記號：<strong>對基督<\/strong>——「連買他們的主他們也不承認」（2:1）；<strong>對金錢<\/strong>——「因有貪心，要用捏造的言語在你們身上取利」（2:3），「心中習慣了貪婪」（2:14）；<strong>對身體<\/strong>——「隨肉身、縱污穢的情慾」（2:10）；<strong>對權柄<\/strong>——「膽大任性，毀謗在尊位的」（2:10）；<strong>對自由<\/strong>——「應許人得以自由，自己卻作敗壞的奴僕」（2:19）。五個都是果子，不是口才，也不是宗派標籤；這使我們想起主自己的話：「憑著他們的果子，就可以認出他們來」（太 7:16）。<\/p><p><strong>難處：<\/strong>記號需要時間才看得出來；有口才、有恩賜的人，果子常常要很久才顯露。記號也可能被拿來照別人、不照自己。所以記號式分辨必須加上兩件事：耐心，和先照自己。<\/p>"],["1:20 讀者解釋說（個人不可自己解釋，要由教會權威解釋）","","<p>有些譯本與傳統把 1:20 讀成：個人不可以照自己的意思解釋預言，要由教會的權威來解釋。這個讀法的關懷是真的——防止各說各話，防止每個人照自己的喜好讀出自己想要的東西；3:16 也確實警告「強解」的危險。<\/p><p><strong>難處：<\/strong>1:21 用「因為」接上：「因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來」——這句說的是預言從哪裡來，不是讀者怎樣讀。若把 1:20 讀成讀經的禁令，就很容易推成「只有牧師能解經」「信徒不要自己讀經」；這不是彼得的意思。庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11），是被稱讚的。<\/p>"],["1:20 預言來源說（許多福音派註釋）","","<p>1:20 的「私意解說」，指的是預言不是先知自己對異象的解釋，1:21 的「因為」正說明了這一點——預言的來源不是人意，是聖靈。這樣讀，1:19–21 是一整段：「我們並有先知更確的預言，如同燈照在暗處」（1:19），這燈之所以可靠，是因為它從神來。這段經文講的是聖經的來源與權威，正好是信徒可以放心讀它的理由。<\/p><p><strong>難處：<\/strong>原文「私意解說」（ἰδίας ἐπιλύσεως）可以兩解，這派也承認文法上不能完全排除讀者解釋的意思；而且即使預言來自聖靈，讀的人仍然會讀錯——3:16 的「強解」就是例子。所以來源說需要配上讀經的方法，不能只說「聖經是神的話，你自己讀就好」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：①講台教記號，不給名單——不點名今天任何牧者、教會、宗派、網路傳道人為假師傅；②分辨從自己開始，五個記號先照自己；③1:20 的「私意」指預言的來源（1:21 的「因為」），不是禁止會眾讀經；④遇到教會內真正的錯謬或侵害，照著程序、在愛中、公開透明地處理，不在網路上獵巫。<\/strong><\/p><p><strong>讀經的保護<\/strong>是「強解」的反面：在群體中讀（不一個人關起門來發明新解）、照上下文讀（不抽出一句當口號）、謙卑地讀（承認「有些難明白的」，不急著下結論）。這是「聖經是我的準則」的意思——準則是燈（1:19），不是棍子。<\/p><p><strong>2:10 不可拿來堵住對領袖的正當質疑<\/strong>：第二章被定罪的正是「師傅」，是在上位的人；彼得前書早已說長老「也不是轄制所託付你們的」（彼前 5:3；回指彼前 ISS00_5）。對 2:3 最好的回應，是教會財務透明，像保羅說的：「我們留心行光明的事，不但在主面前，就在人面前也是這樣」（林後 8:21）。分辨的目的是自己不墜落（3:17），也把迷路的人找回來，不是證明自己是對的。<\/p>"],["【四】這件事該不該影響你的信心","","<p>1:20 的兩種讀法、2:10「主治的」是指主的權柄還是天上的權勢，這些討論不該動搖你的信心；各派都同意，聖經是神的話，信徒可以讀、也應該讀；也都同意講台的責任是教會眾分辨，不是替會眾判決。<\/p><p>但有一件事該問：<strong>我是更會照自己，還是更會懷疑別人？<\/strong>寫第二章的彼得，自己曾發咒起誓地說「我不認得那個人」（太 26:74）；他和假師傅的分別，不是他從來沒有跌倒，是他哭了、回頭了、被主接回來了。五個記號，先拿來照自己：我對主、對錢、對身體、對權柄、對自由，結出的是甚麼果子？分辨的第一面鏡子，永遠是拿來照自己的。<\/p>"]],"con":[],"say":"本講義的全卷立場：講台教記號，不給名單——不點名今天任何牧者、教會、宗派、網路傳道人；彼得的五個記號（對基督、金錢、身體、權柄、自由）先照自己。1:20 的「私意」指預言的來源，不是禁止會眾讀經；讀經的保護是在群體中、照上下文、謙卑地讀。2:10 不堵住正當質疑；教會財務要透明。","care":"席上會有被前一間教會的領袖騙過錢、傷過心的人，也有熱衷在網路上轉貼「某某是假師傅」的人，還有因為聽過「你們自己不要亂讀聖經」而不敢打開聖經的長輩。對第一種人，先承認那個傷是真的，必要時協助他尋求法律與專業協助；對第二種人，溫和地把他帶回五個記號、先照自己；對第三種人，陪他讀 1:19–21，告訴他這燈是給他的。不要用「假師傅」一詞壓制提出問題的會友，也不要用 2:10 堵住對領袖的正當質疑。"},{"id":"ISS00_4","t":"主的日子、新天新地與受造界——主為甚麼還沒有來？地球最後會怎樣？","r":"3:3--13；帖前 5:1--11；羅 8:19--22","ch":[],"why":"四、沿用帖撒羅尼迦前書立場二（帖前 ISS00_2）——主必親自回來，日子沒有人知道，不算日子、隨時預備；本卷補 3:8–13：3:8 不是公式，3:9 的慢是愛的等，3:10 兩讀並陳，3:13 的新是更新。「主要降臨的應許在哪裡呢？」（3:4）是兩千年來每一代信徒心裡都問過的話。這一段最常被拿去做兩件錯事：用 3:8 換算日子，用 3:10–12 說地球反正要燒、不必照顧受造界。必須在開卷講定，免得等候的人只剩下恐慌。","pos":[["【一】經文問的是甚麼","","<p>彼得引用譏誚的人的話：「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣」（3:4）。他的回答有四步：「主看一日如千年，千年如一日」（3:8）；「其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改」（3:9）；「但主的日子要像賊來到一樣」（3:10）；「但我們照他的應許，盼望新天新地，有義居在其中」（3:13）。<\/p><p>3:10 還有一個異文的問題：和合本「地和其上的物都要燒盡了」跟隨 κατακαήσεται（燒盡）的讀法；SBLGNT 與多數新近校勘本作 εὑρεθήσεται（必被顯露、被發現）。於是會眾會問：主為甚麼還沒有來？可以照 3:8 算出還有多久嗎？地球最後會被燒掉嗎？那我們還需要照顧這個世界嗎？<strong>經文問的是：等候的時間是甚麼？主的日子會對受造界做甚麼？盼望新天新地的人，今天該怎樣活？<\/strong><\/p>"],["沿用帖撒羅尼迦前書立場二（主必再來，不算日子）","","<p>帖撒羅尼迦前書講義已經講定：主一定會親自回來；日子沒有人知道，也不必知道——「但那日子，那時辰，沒有人知道」（太 24:36），「主的日子來到，好像夜間的賊一樣」（帖前 5:2）；這段教導的用途是安慰與預備，不是恐嚇。被提的時間與千禧年各派並陳，每一派都承認對方是弟兄；不定時間表，不把時事對號入座。彼後 3:10 用的正是同一個「賊」的比喻，可見彼得與保羅傳的是同一個盼望。<\/p><p><strong>難處：<\/strong>這個立場常被批評「太保守」，好像甚麼都不說。但「不算日子」不是不談末世，而是把末世談在經文說的地方：主必來、像賊來、要預備；經文沒有說的時間表，我們也不說。<\/p>"],["3:8 換算說（本講義不採）","","<p>有人用 3:8 算末日，說一日就是一千年，人類歷史滿了六千年主必再來——這不是本節的意思；也有人用同一節算創造，說創世記的一日就是一千年。這兩種用法都想讓經文給出一個數字，好讓等候有個期限。它們抓住的經文影子是真的：彼得確實引了詩篇——「在你看來，千年如已過的昨日」（詩 90:4）。<\/p><p><strong>難處：<\/strong>彼得兩個方向都說——「一日如千年，千年如一日」——正是為了取消換算：神不受時間限制，人的長短在他面前不是同一把尺。詩 90:4 的意思是神超越時間，不是給一個比例；而且 3:10 緊接著說主的日子「要像賊來到一樣」，賊是不能算的。本講義不採這種換算：不用 3:8 推算末日的日子，也不用它推算創造日。<\/p>"],["3:10 的異文（燒盡、顯露或不被發現）","","<p>和合本「地和其上的物都要燒盡了」跟隨 κατακαήσεται 的讀法；SBLGNT 與多數新近校勘本作 εὑρεθήσεται（必被顯露、被發現），意思是在神面前一切都要被顯明——這使我們想起「各人的工程必然顯露」（林前 3:13）；NA28 作 οὐχ εὑρεθήσεται（不被發現）。三種讀法都有學者支持；和合本的讀法有抄本根據，不是錯譯。<\/p><p><strong>難處：<\/strong>「顯露」的讀法較難懂，有些抄寫者可能因此改成較容易明白的「燒盡」；但哪一讀是原文，學者至今沒有一致的結論，講台上不必在這裡爭。重要的是：三種讀法沒有一種是在說神要丟棄他所造的世界——燒盡指向潔淨，顯露指向審判，都是為了 3:13 的「有義居在其中」。<\/p>"],["3:13 的「新」（另造說與更新說）","","<p>另造說強調舊天地完全消滅，神另造一個全新的天地：「先前的天地已經過去了」（啟 21:1）。更新說則指出，彼得用的「新」（καινός）多指品質上的新，不是另一個物件；3:6 說挪亞時代的世界「被水淹沒就消滅了」，地卻沒有消失，而是被洗淨；保羅也說「受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀」（羅 8:21）。<\/p><p><strong>難處：<\/strong>另造說若講過頭，會叫人以為這個世界是用完就丟的，照顧受造界沒有意義；更新說若講過頭，會叫人以為人類可以靠自己把地球建成新天新地，忘了那是神的作為，要等「他的應許」（3:13）。兩派都要記住：新天新地是神成就的，聖潔的生活是我們今天的回應。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用帖撒羅尼迦前書立場二——主必親自回來，不算日子，隨時預備。本卷補四點：<\/strong><\/p><p>①<strong>3:8 不是公式<\/strong>：兩個方向都說，正是取消換算；不用它算末日，也不用它算創造日，講台也不以 3:5–7 裁判年輕地球或古老地球。②<strong>3:9 的焦點是寬容<\/strong>：主的「慢」是愛的「等」——「不願有一人沉淪，乃願人人都悔改」；等候的時間是悔改與傳福音的時間，不是焦慮的時間。③<strong>3:10 兩讀並陳<\/strong>：和合本「燒盡了」與「必被顯露」，兩讀都不是神丟棄受造界。④<strong>3:13 的「新」是更新<\/strong>，落點是「有義居在其中」。<\/p><p>3:12「切切仰望神的日子來到」的「切切」（σπεύδοντας），原文也可以譯作「催促」——但這不是推算或加速日期，而是用聖潔與傳福音參與神的心意。321 的落點是「從暫時觀點改變成永恆觀點」：<strong>「你們為人該當怎樣聖潔，怎樣敬虔」（3:11）——永恆的觀點不是叫人離開世界，是叫人在世界裡活得不一樣<\/strong>，包括怎樣用錢、用資源、對待鄰舍與神所造的萬物。照顧受造界是管家的本分，講台也不把它變成政治動員。<\/p>"],["【四】這件事該不該影響你的信心","","<p>被提在災前或災後、千禧年怎樣理解、3:10 哪一讀是原文、地球的年齡，這些討論不該動搖你的信心；各派都同意主必再來，也都同意等候的人要「殷勤，使自己沒有玷污，無可指摘，安然見主」（3:14）。<\/p><p>但有一件事該問：<strong>我等候主的樣子，是更恐慌，還是更忍耐？<\/strong>「應許在哪裡呢？」誰沒有在心裡問過——等家人信主、等病得醫、等主回來。彼得的回答不是一張時間表，是一顆心：「不願有一人沉淪」（3:9）。寫這句話的人，自己就是被主寬容等回來的；而那位等他的主，也在等你所愛的人。等候不是空等，是一面聖潔、一面為人禱告的等。<\/p>"]],"con":[],"say":"本講義的全卷立場：沿用帖撒羅尼迦前書立場二——主必親自回來，不算日子，隨時預備。本卷補四點：3:8 兩個方向都說，正是取消換算；3:9 主的慢是愛的等；3:10「燒盡」與「顯露」兩讀並陳，都不是神丟棄受造界；3:13 的新是更新，有義居在其中。永恆的觀點叫人在世界裡活得不一樣。","care":"席上會有被末世預言嚇得夜不能眠的人，有熱衷把新聞與預言對號入座的人，也有等家人信主、等病得醫等得很累的人。對害怕的人，帶他讀 3:9 與 3:13；對熱衷的人，溫和地帶他回到「像賊來到」；對疲倦的人，承認等候是真的累，陪他禱告。不要說「照 3:8 算，主快來了」，也不要說「地球反正要燒，環保沒有意義」；不在講台上裁判地球年齡，也不把照顧受造界變成政治口號。果效是忍耐，不是恐慌。"},{"id":"ISS00_5","t":"得救的確據與背道——得救有確據嗎？背道的人還能回來嗎？","r":"1:9--11；2:18--22；3:9；3:17--18","ch":[],"why":"五、沿用希伯來書立場二（來 ISS00_2）——警告是真的，對象是故意持續棄絕基督的人，作者的結論是確據與安慰；本卷補 1:10「堅定不移」與 2:20–22。1:10 說「你們若行這幾樣，就永不失腳」，2:20–22 卻說有人「末後的景況就比先前更不好了」，還用狗與豬作比喻。一位剛跌倒的弟兄讀到這裡，會問：我是不是就是那條狗？揀選要靠我自己堅定嗎？這一題必須在開卷講定，免得警告變成恐嚇，也免得安慰變成放縱。","pos":[["【一】經文問的是甚麼","","<p>彼得在第一章說：「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳」（1:10）。前一節他說，人若沒有這幾樣，就是「忘了他舊日的罪已經得了潔淨」（1:9）。到了第二章，他說：「倘若他們因認識主－救主耶穌基督，得以脫離世上的污穢，後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了」（2:20），又引俗語說「狗所吐的，牠轉過來又吃；豬洗淨了又回到泥裡去滾」（2:22）。<\/p><p>於是會眾會問：揀選要靠我自己堅定嗎？我跌倒過，是不是已經「失腳」了？2:20 的人「認識」了主，那他們原本是真信徒嗎？我是不是就是那條狗？<strong>經文問的是：確據從哪裡來？2:20–22 說的是誰？跌倒的人還能回來嗎？<\/strong><\/p>"],["沿用希伯來書立場二","","<p>希伯來書講義已經講定：不替各教會在「救恩會不會失落」上定案，兩邊都有敬虔愛主的人；但各派都必須同意三個落點——警告是真的，不可講成無關痛癢；警告的對象是故意、持續地棄絕基督的人，不是軟弱跌倒又想回來的人；作者自己的結論是確據與安慰：「親愛的弟兄們，我們雖是這樣說，卻深信你們的行為強過這些，而且近乎得救」（來 6:9）。<\/p><p><strong>難處：<\/strong>不定案容易被人聽成「你自己決定」；所以這個立場必須把三個落點講得一樣清楚。對想放縱的人，警告是真的；對正在害怕的人，安慰也是真的。兩句話都要說，不能只說一句。<\/p>"],["1:10「堅定不移」（主觀確據說與客觀證明說）","","<p>「堅定不移」（βεβαίαν）是當時商業與法律的用語，指確認、使生效，像一份契約經過確認。一派讀為：殷勤的生活使蒙召在我們自己的經歷裡得到確認，是主觀的確據；另一派讀為：殷勤的生活在人面前證明蒙召是真的，是客觀的證明。兩派都同意：揀選的源頭是神，「神的神能已將一切關乎生命和虔敬的事賜給我們」（1:3），我們的殷勤是在已有的恩典上活出來，不是去換來恩典。<\/p><p><strong>難處：<\/strong>若把 1:10 讀成「要靠我的殷勤保住揀選」，人就會落入不斷檢查自己夠不夠的焦慮；若只講揀選不講殷勤，又會掏空彼得「應當更加殷勤」的命令。「永不失腳」是給殷勤者的應許，不是給懶惰者的保險，也不是給跌倒者的恐嚇。<\/p>"],["2:20–22 三讀","","<p>①<strong>真信徒可以失落救恩<\/strong>（阿米念傳統）：2:20 說他們「因認識主－救主耶穌基督，得以脫離世上的污穢」，看起來是真實的經歷；②<strong>這些人從未真正重生<\/strong>（加爾文傳統）：2:22 的比喻正是說本性沒有改變——狗回頭還是狗，豬洗淨了還是豬，外面改了，裡面沒有；③<strong>警告本身是神保守信徒的工具<\/strong>（許多福音派）：神藉著真實的警告，叫屬他的人「就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落」（3:17）——警告本身就是保護。<\/p><p><strong>難處：<\/strong>第一讀要解釋 1:3 的「一切……賜給我們」與 1:10「永不失腳」的應許；第二讀要解釋「認識」（ἐπίγνωσις）在全卷都是正面的字；第三讀若講得太快，會讓警告失去重量。三讀都有敬虔的人持守，本講義並陳。<\/p>"],["上下文說（2:20–22 說的是假師傅與跟隨他們的人）","","<p>不論採哪一讀，2:20 的「他們」在文法上接續 2:17–19 的「這些人」——「無水的井」，「說虛妄矜誇的大話」，「應許人得以自由，自己卻作敗壞的奴僕」的假師傅；被他們引誘的，是「那些剛才脫離妄行的人」（2:18）。彼得在這裡最重的話，是對著誤導人的人說的，同時也在保護被誤導的人。2:21「倒不如不曉得為妙」講的是「曉得義路，竟背棄了傳給他們的聖命」的人，不是正在掙扎、為自己的跌倒傷痛的人。<\/p><p><strong>難處：<\/strong>上下文說不能把 2:20–22 完全推給別人——跟隨假師傅的人也在其中，每一個讀的人都要聽見警告；它的作用是決定落點，不是取消警告。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：沿用希伯來書立場二。本卷補兩點：<\/strong><\/p><p>①<strong>1:10 的「堅定不移」<\/strong>是在已有的恩典上活出來的確認：起點是 1:3「神的神能已將一切關乎生命和虔敬的事賜給我們」，「永不失腳」是給殷勤者的應許；確據不在我殷勤得夠不夠，在那位召我的主——但真正被他召的人，會在殷勤裡越來越認得他。②<strong>2:20–22 三讀並陳，落點是上下文<\/strong>：這段描述的是假師傅與跟隨他們、明明曉得義路卻故意背棄的人（2:17–21），不是在掙扎中跌倒、仍然想回頭的弟兄姊妹。<\/p><p><strong>跌倒的人要同時聽見兩句話<\/strong>：1:9「舊日的罪已經得了潔淨」與 3:9「不願有一人沉淪，乃願人人都悔改」——主還在等。回頭有兩種：狗回到牠所吐的，彼得回到主面前。主早就對他說過：「你回頭以後，要堅固你的弟兄」（路 22:32）。本講義絕不對任何個人說「你已經沒救了」；只要一個人還在為自己的跌倒傷痛，他的心就還沒有剛硬。<\/p>"],["【四】這件事該不該影響你的信心","","<p>阿米念傳統與加爾文傳統在「救恩會不會失落」上的爭論，不該動搖你的信心；兩邊都有敬虔愛主的人，兩邊也都同意：真正信靠基督的人，要在恩典裡長進；故意棄絕基督的人，要聽見警告。<\/p><p>但有一件事該問：<strong>我現在是轉向主，還是轉離主？<\/strong>如果你正在害怕自己是那條狗，你的害怕本身就說明你還想回家。彼得自己也轉過去過——三次不認主；但「主轉過身來看彼得」（路 22:61），他就出去痛哭，後來又被主接回來。這封信最後一句是「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進」（3:18）——跌倒的人，不是被寫在信外的人。<\/p>"]],"con":[],"say":"本講義的全卷立場：沿用希伯來書立場二——警告是真的，對象是故意持續棄絕基督的人，結論是確據與安慰。本卷補兩點：1:10「堅定不移」是在已有的恩典上活出來的確認；2:20–22 三讀並陳，落點是上下文的假師傅與跟隨的人，不是掙扎中想回頭的人。跌倒的人同時聽見 1:9 與 3:9：主還在等。","care":"席上會有剛跌倒、因為害怕自己是那條「轉過來又吃」的狗而失眠流淚的人，也有拿「一次得救，永遠得救」當藉口放縱自己的人，還有一位孩子離開了教會、天天為他擔心的母親。對第一種人，帶他讀 1:9 與 3:9，陪他禱告、陪他走回群體；對第二種人，讓他聽見 2:21 的警告是真的；對那位母親，告訴她主還在等。不要說「你已經沒救了」，不要用 2:22 嚇唬軟弱的人，也不要把警告講得無關痛癢。"},{"id":"ISS00_6","t":"彼得後書與猶大書誰抄誰？","r":"2:1--3:3；猶 4--18","ch":[],"why":"六、三說並陳，不裁判；不論誰在先，聖經作者使用其他材料並不減損默示；兩卷的分工是長進中的分辨與為真道竭力地爭辯；彼得多出來的一筆是 2:9「主知道搭救」。把彼得後書 2:1–3:3 和猶大書 4–18 節並排讀，會發現許多相同的主題，次序也大致相同，兩封信顯然有文字上的關係。讀經小組的人發現了，常會問：是不是有一位抄了另一位？這會不會影響彼得後書的權威？","pos":[["【一】經文問的是甚麼","","<p>兩段經文相同的地方很多：偷著引進異端或偷著進來的人（2:1；猶 4）；犯罪的天使被拘留等候審判（2:4；猶 6）；所多瑪、蛾摩拉（2:6；猶 7）；隨肉身、輕慢主治、毀謗在尊位的（2:10；猶 8）；天使不敢用毀謗的話（2:11；猶 9）；像沒有靈性的畜類（2:12；猶 10）；巴蘭的路（2:15；猶 11）；無水的井與沒有雨的雲彩（2:17；猶 12）；墨黑的幽暗（2:17；猶 13）；末世好譏誚的人隨從自己的私慾（3:3；猶 18）。<\/p><p>也有不同：猶大書提到天使長米迦勒為摩西的屍首與魔鬼爭辯（猶 9），又引了以諾的預言（猶 14–15）；彼得後書沒有這兩處，卻多了被保護的挪亞一家八口（2:5）與被搭救的羅得（2:7），以及全卷樞紐的一句：「主知道搭救敬虔的人脫離試探」（2:9）。<strong>經文問的是：誰在先？為甚麼有相同、也有不同？這會不會影響彼得後書的權威？<\/strong><\/p>"],["猶大書在先說（今天多數學者）","","<p>理由有三：猶大書較短、較緊湊，彼得後書像是擴充與調整；彼得後書沒有直接引用以諾的預言與摩西屍首的傳說，可能是有意略去讀者不熟或容易引起誤會的材料；一般而言，把較短的文本擴充成較長的，比把較長的刪成較短的更自然。持這說的學者，有的仍然主張彼得是作者——彼得可以採用猶大的材料；也有的以此支持託名說。<\/p><p><strong>難處：<\/strong>「較短的在先」只是一個常見的傾向，不是定律；而且彼得後書若真在擴充猶大書，為甚麼保留了 2:11 那句天使「還不用毀謗的話」，卻刪掉了它所指的米迦勒的事例，讓句子變得比較難懂？這說也必須承認，兩段相同的字句其實不算多，多的是主題與次序。<\/p>"],["彼得後書在先說","","<p>理由是時態：彼後 2:1
