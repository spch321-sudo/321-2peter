 說「將來在你們中間也必有假師傅」，3:3 說「在末世必有好譏誚的人」，都用未來式，像是預告；猶大書卻說「因為有些人偷著進來」（猶 4），已經發生了；猶大書又說「親愛的弟兄啊，你們要記念我們主耶穌基督之使徒從前所說的話」（猶 17），接著說的正是末世必有好譏誚的人——很像在回顧使徒先前的預言。較早期的一些註釋家持這說。<\/p><p><strong>難處：<\/strong>彼得後書在第二章中段就改用現在式描寫假師傅（2:10–19），可見未來式不一定是預告，也可能是遺言體的筆法；猶 17 說的是「使徒」（複數），不一定專指彼得後書。這說能解釋時態，卻不容易解釋猶大書為甚麼要加上以諾與米迦勒。<\/p>"],["共用材料說","","<p>認為兩封信相似的是主題與例證的次序，用字相同的地方並不算多；可能兩位作者都使用了早期教會對付假師傅時口傳或成文的一套教導，各自照讀者的需要取捨。這說的優點是同時解釋了「相似」與「各有取捨」：猶大的讀者熟悉以諾的傳統，所以他引了；彼得的讀者需要知道神會搭救敬虔的人，所以他加了挪亞與羅得。<\/p><p><strong>難處：<\/strong>這份共同材料沒有任何留存，只能推論；用一份看不見的文件來解釋兩份看得見的文件，學者也承認這是最難證明的一說。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：三說並陳，不裁判。<\/strong>理由是：三說都有一定的根據，也都只能推論；而這個問題不影響兩封信的權威，也不改變經文的意思。<\/p><p>不論誰在先，<strong>聖經作者使用其他材料並不減損默示<\/strong>：路加是「從起頭都詳細考察了」（路 1:3）才寫成福音書；保羅在亞略巴古也引用過希臘詩人的話（徒 17:28）。默示不是說作者不用任何材料，是說「人被聖靈感動，說出神的話來」（1:21）。<\/p><p>兩卷的分工是：<strong>彼得後書講「長進中的分辨」，猶大書講「為從前一次交付聖徒的真道竭力地爭辯」（猶 3）。<\/strong>彼得多出來的那一筆特別值得講：<strong>「主知道搭救敬虔的人脫離試探」（2:9）——彼得講審判，是為了叫敬虔的人安心。<\/strong>本講義的〔猶〕互見先標經文出處，將來猶大書講義製作時再分工。<\/p>"],["【四】這件事該不該影響你的信心","","<p>誰抄誰的問題，不該動搖你的信心；這是一個文學上的問題，不是信仰上的問題。不論誰在先，兩封信都在新約裡，兩位作者都把讀者帶回同一位主——彼得說「主知道搭救」（2:9），猶大在信末把讀者交給那位能保守他們不失腳的神（猶 24）。<\/p><p>但有一件事該問：<strong>我讀這兩段，是更想考證誰在先，還是更聽見了警告、更照見了自己？<\/strong>兩位主的僕人在不同的地方看見同樣的狼，喊出同樣的話；這不是抄襲的醜聞，是早期教會同心的見證。把力氣放在聽見警告、照自己、彼此堅固，比放在考證先後更能讓人長進。<\/p>"]],"con":[],"say":"本講義的全卷立場：彼得後書與猶大書的關係三說並陳——猶大書在先、彼得後書在先、共用早期教會的教導材料，不裁判。不論誰在先，聖經作者使用其他材料並不減損默示。兩卷的分工是：彼得後書講長進中的分辨，猶大書講為真道竭力地爭辯；彼得多出來的一筆是 2:9「主知道搭救」。","care":"讀經小組若有人發現兩段很像而起疑，不必為「誰抄誰」爭到面紅耳赤；可以把兩段並排讀，看彼得多了甚麼——他多了挪亞與羅得，也多了 2:9。席上會有聽到「抄襲」二字就以為聖經不可靠的年輕人，也有覺得研究這些就是不屬靈的長輩。不要說「研究這些就是不信」，也不要把文學問題講成信仰危機；讓會眾看見，兩位主的僕人面對同樣的危險，說出了同樣的警告。"},{"id":"ISS00_7","t":"彼得後書寫於何時何地？","r":"1:12--15；3:1--2；3:15--16；約 21:18--19","ch":[],"why":"七、約主後 64–68 年，彼得殉道之前不久，很可能寫於羅馬；託名說的晚期年代並陳；3:1「第二封信」最自然指彼得前書。信裡沒有直接說寫於何時何地，只說作者「脫離這帳棚的時候快到了」（1:14）、這是「第二封信」（3:1）、保羅的信已在各教會流傳（3:16）。年代的判斷和作者問題綁在一起，會眾讀議題頁時常會一併問起；把它講清楚，也讓人看見這是一封臨終的信。","pos":[["【一】經文問的是甚麼","","<p>這封信沒有像彼得前書那樣在信末說出所在的城市（彼前 5:13），也沒有寫明收信人在哪裡。我們從經文只知道三件事：作者知道自己「脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的」（1:14）；這是寫給同一群讀者的「第二封信」（3:1）；保羅「一切的信上也都是講論這事」（3:16），可見保羅的書信已經在各教會流傳。<\/p><p>1:14 指向主在加利利海邊對彼得的預告：「但年老的時候，你要伸出手來，別人要把你束上，帶你到不願意去的地方」（約 21:18），約翰接著說「耶穌說這話是指著彼得要怎樣死，榮耀神」（約 21:19）。<strong>經文問的是：這封信寫在彼得一生的哪一個時候？在哪裡寫的？「第二封信」的第一封是哪一封？<\/strong><\/p>"],["早期年代說（約主後 64–68 年，羅馬）","","<p>早期教會的傳統說，彼得在尼祿皇帝逼迫基督徒期間於羅馬殉道，一般推定在主後 64 至 68 年之間。1:14 說離世的時候快到了；3:1 的「第二封信」若指彼得前書，而彼得前書寄自「巴比倫」，多數解經家認為指羅馬（回指彼前 ISS00_7），那麼本書也很可能寫於羅馬，時間在彼得前書之後不久、殉道之前。這說與信的自稱、與彼得前書的關係都相合。<\/p><p><strong>難處：<\/strong>信中沒有任何一個可以確定日期的事件；彼得殉道的地點與年份來自教會傳統，不是新約明文；「羅馬」也是從彼得前書推過來的。這說的每一步都合理，但都是推論，所以只能說「約」與「很可能」。<\/p>"],["晚期年代說（約主後 80 年至二世紀上半）","","<p>持託名說的學者，多半把年代放得較晚，理由包括：3:4「從列祖睡了以來」被讀為第一代基督徒已經過世；3:16「他一切的信」似乎預設保羅書信已經被收集成冊，甚至與「別的經書」並列；全卷對「主為甚麼還沒有來」的關注，被認為反映第一代之後的處境。具體年代各家不同，大約從主後 80 年到二世紀上半都有人主張。<\/p><p><strong>難處：<\/strong>「列祖」在新約最自然指舊約的先祖（徒 3:13；來 1:1）；保羅在世時就叫教會彼此傳閱他的信（西 4:16），六十年代各教會擁有幾封保羅書信並不奇怪；而「主為甚麼還沒有來」的問題，在主後五十年代初的帖撒羅尼迦書信裡就已經出現（帖前 4:13–18；帖後 2:1–2）。這些理由都不足以把年代推到彼得死後。<\/p>"],["3:1「第二封信」（指彼得前書，或一封失傳的信）","","<p>多數解經家認為「第二封信」指彼得前書：兩封信都以提醒、激發讀者為目的——「這兩封都是提醒你們，激發你們誠實的心」（3:1）。也有學者指出，彼得前書寫給小亞細亞五個地區的信徒（彼前 1:1），內容主要是受苦，與 3:2 所說「聖先知預先所說的話和主救主的命令」不完全相合，所以「第一封信」也可能是一封已經失傳的信。<\/p><p><strong>難處：<\/strong>失傳信說無法驗證；而彼得前書確實講到先知「早已詳細地尋求考察」（彼前 1:10），也一再提醒讀者記念傳給他們的福音（彼前 1:12、25），與 3:2 並不衝突。若是指彼得前書，收信人也就是那五個地區的信徒。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：約主後 64–68 年，彼得殉道之前不久，很可能寫於羅馬；託名說的晚期年代並陳，不嘲諷。3:1「第二封信」採最自然的讀法：指彼得前書，收信人很可能就是小亞細亞五個地區的信徒。<\/strong>年代無法精確到某一年，講台上不必強調數字。<\/p><p>本講義把兩卷連起來讀：<strong>前書教人在火裡站穩，後書教人在霧裡看清。<\/strong>前書的危險在外面——毀謗、冤屈、火煉的試驗；後書的危險在裡面——「在你們中間也必有假師傅」（2:1）。同一位牧人，在同一群羊身上看見了兩種危險，在離世以前一一提醒。<\/p><p>講台只需要讓會眾看見一個畫面：<strong>一個知道自己快要離世的老人，沒有寫回憶錄，也沒有為自己辯護，而是寫信「提醒你們，激發你們」（1:13），最後一句是「願榮耀歸給他」（3:18）。<\/strong><\/p>"],["【四】這件事該不該影響你的信心","","<p>寫在哪一年、哪一座城，不該動搖你的信心；這些細節不改變信的內容，也不改變那位「所指示我的」主（1:14）。主在加利利海邊預告彼得的死，彼得在信裡平靜地說「快到了」——那個曾經因為怕死而不認主的人，如今不再怕了。<\/p><p>但有一件事該問：<strong>如果我知道時候不多，我最想提醒我所愛的人甚麼？<\/strong>彼得說「我卻要將這些事常常提醒你們」（1:12），又要「使你們在我去世以後時常記念這些事」（1:15）。帳棚要拆了，他還在為主的羊多說幾句話。今天就可以說出口，不必等到帳棚要拆的那一天。<\/p>"]],"con":[],"say":"本講義的全卷立場：彼得後書約寫於主後 64–68 年，彼得殉道之前不久，很可能寫於羅馬；託名說的晚期年代並陳。3:1「第二封信」指彼得前書，收信人很可能就是小亞細亞五個地區的信徒。前書教人在火裡站穩，後書教人在霧裡看清；這是一位老人臨終前寫給羊群的信。","care":"席上會有年老、病重、知道自己日子不多的弟兄姊妹，也有陪伴父母走最後一段路的兒女。講年代時，帶給會眾的不是數字，是畫面：彼得在帳棚要拆的時候，還在提醒、還在堅固弟兄。不要把殉道講成悲壯的傳奇，也不要用「主快來了」代替陪伴；陪那位病重的人想一想，他最想對所愛的人說的三句話是甚麼，可以今天就說。必要時協助家屬尋求安寧照顧與專業協助。"},{"id":"ISS00_8","t":"彼得後書怎樣成為正典？","r":"1:1；1:19--21；3:2；3:15--16","ch":[],"why":"八、誠實交代彼得後書是早期教會「有爭議的書卷」之一，也交代它最後被東西方教會普遍接受；爭議不等於否定，謹慎正是分辨的證據；教會不是製造正典，是承認正典。彼得前書在早期教會一致被接受，彼得後書卻不是。一位弟兄若在網上第一次讀到「彼得後書差點沒進聖經」，可能會覺得被騙了：怎麼教會從來沒告訴我？所以本講義選擇自己先說。","pos":[["【一】經文問的是甚麼","","<p>彼得後書自己對「經書」有一個重要的說法：作者要讀者「記念聖先知預先所說的話和主救主的命令，就是使徒所傳給你們的」（3:2），又把保羅的信和「別的經書」並列——「那無學問、不堅固的人強解，如強解別的經書一樣」（3:16）。在使徒的時代，先知的話與使徒的教導已經被放在一起看待。<\/p><p>可是這封信自己進入正典的路，卻比彼得前書長得多。現存二世紀的教父著作中，很少有明確引用它的地方；三世紀與四世紀初，都有人對它存疑。<strong>經文問的是：既然古人都有疑問，為甚麼今天它在我們的聖經裡？教會是隨便決定的嗎？這段歷史會不會動搖它的權威？<\/strong><\/p>"],["早期存疑的記載（誠實交代）","","<p>根據優西比烏《教會史》的記載，三世紀的俄利根說彼得留下一封公認的書信，或許還有第二封，但這一封是有疑問的。優西比烏本人也說，傳下來的彼得後書不算公認的書卷，但因為對許多人有益，就與其他經書一同受到重視；他在整理各書卷時，把雅各書、猶大書、彼得後書、約翰二書與三書列為「有爭議的」、但為多數人所知的書卷。四世紀末的耶柔米也提到，許多人因為它與前書文體不同而懷疑它；敘利亞教會較早的譯本起初也沒有收入這封信。<\/p><p><strong>難處：<\/strong>這些記載是真的，但它們記下的是「有人疑問」，不是「教會否定」；優西比烏同時記下它對許多人有益、被許多人閱讀。只引前半句、不引後半句，就不是誠實的交代。<\/p>"],["逐漸被普遍接受","","<p>四世紀時，亞他那修在主後 367 年的第 39 封節期書信中列出新約二十七卷，彼得後書在其中；北非的希波會議（393 年）與迦太基會議（397 年）也承認同樣的書目。現存最早包含彼得後書的抄本之一，是蒲草紙抄本 P72（約三至四世紀），它與彼得前書、猶大書抄在一起，可見當時已有教會把它當作經書使用。此後東西方教會普遍接受它。<\/p><p><strong>難處：<\/strong>會議的書目是承認已經普遍使用的書卷，不是從無到有的決定；若把正典講成「某次會議投票通過」，會讓人以為聖經是人決定的。這段歷史要講得準確：會議是確認，不是創造。<\/p>"],["懷疑者的讀法（正典化的過程說明它可疑）","","<p>有學者認為，正典化的過程本身就說明這封信可疑：如果真是彼得寫的，為甚麼不像彼得前書那樣很早就被公認？它被接受，主要是因為內容正統、對教會有益，而不是因為確知出自使徒。這派的優點是逼教會面對這段歷史，不能用「傳統就是這樣」一筆帶過。<\/p><p><strong>難處：<\/strong>一封三章的短信流傳較慢、較少被引用，並不奇怪——猶大書、約翰二書與三書也是如此；存疑的理由多半是文體，不是內容。更重要的是，若早期教會只要內容正統、有益就收入，當時許多正統而有益的作品都會進入正典，但它們沒有；可見教會在乎的是使徒的權柄，而且分辨得很嚴。<\/p>"],["福音派的讀法（教會承認，不是製造）","","<p>早期的存疑正說明教會不是照單全收，而是謹慎地分辨：考慮它是否出自使徒或使徒的圈子、是否與眾教會所領受的信仰一致、是否被眾教會長期使用。教會不是「製造」正典，而是在長期的使用與分辨中「承認」那些本來就帶有使徒權柄的書卷；這使我們想起主說的：「我的羊聽我的聲音」（約 10:27）。<\/p><p><strong>難處：<\/strong>這個讀法是信心的判斷，不能單靠歷史證明到底；懷疑者會說這是循環論證。福音派要誠實承認：我們接受它，有歷史的理由，也有信心的理由，兩者都要講，不必假裝只有其中一種。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：誠實交代彼得後書是早期教會「有爭議的書卷」之一——俄利根提到有人存疑，優西比烏列為有爭議；也交代它最後被普遍接受——亞他那修 367 年的節期書信、迦太基會議 397 年。爭議不等於否定，謹慎正是教會分辨的證據；教會不是製造正典，是承認正典。<\/strong><\/p><p>彼得在 3:16 把保羅的信與「別的經書」並列，本身就見證了新約正典在使徒時代已經開始成形；1:21 又說預言是「人被聖靈感動，說出神的話來」——正典的權威不是來自會議，是來自說話的神。<\/p><p>講台不必細述正典史，但教導課程與小組應該讓會眾知道這段歷史，<strong>免得他們日後從懷疑者口中第一次聽見。誠實不會傷害信心，隱瞞才會。<\/strong><\/p>"],["【四】這件事該不該影響你的信心","","<p>彼得後書進入正典的路比較長，這件事不該動搖你的信心；古人那麼認真地問、問了那麼久，正好說明今天手上的聖經不是隨便拼湊的。這幾百年間，彼得後書一直在被許多教會閱讀，許多人在其中得造就。<\/p><p>但有一件事該問：<strong>我信這本聖經，是因為有人命令我信，還是因為我在其中聽見了主的聲音？<\/strong>彼得說，先知的話「如同燈照在暗處」（1:19）；燈是不是真的燈，最後不是靠辯論證明的，是它在暗處照亮了你腳前的路。歷代聖徒在這封信裡一再聽見主的聲音，你也可以。<\/p>"]],"con":[],"say":"本講義的全卷立場：誠實交代彼得後書是早期教會「有爭議的書卷」之一——俄利根提到有人存疑，優西比烏列為有爭議；也交代它最後被普遍接受——亞他那修 367 年節期書信、迦太基會議 397 年。爭議不等於否定，謹慎正是分辨的證據；教會不是製造正典，是承認正典。","care":"席上會有在網上第一次讀到「彼得後書差點沒進聖經」、覺得被教會騙了的年輕人，也有一聽到正典有爭議就害怕整本聖經會垮掉的長輩。對前者，先承認他的感受，告訴他這段歷史本來就該讓他知道；對後者，讓他看見教會分辨得多麼謹慎。不要說「這些是學者的事，你不必知道」，也不要把正典講成某次會議投票決定的；小組長被問倒了，誠實說「我不知道，我們一起查」。"},{"id":"ISS00_9","t":"這些爭議該不該影響一個人的信心？","r":"1:12--21；3:15--18","ch":[],"why":"九、派別之爭不該影響信心；但「我是在恩典和知識上長進，還是在懷疑與算計裡退後」該——在恩典和知識上有長進。彼得後書只有三章，卻碰到新約作者爭議最大的一卷、正典路最長的一卷、與猶大書的關係、1:4 的神學高度、3:10 的異文、2:20–22 的背道。一位認真讀完議題頁的信徒，很可能會問：這麼多不確定，我還能確定甚麼？這一題要把全卷的爭議放回正確的位置。","pos":[["【一】經文問的是甚麼","","<p>彼得後書本身就是一封在爭議中寫成的信：有人「用捏造的言語」取利（2:3），有人譏誚說「主要降臨的應許在哪裡呢？」（3:4），有人強解保羅的信（3:16）。彼得沒有叫讀者停止思想；他承認保羅的信中「有些難明白的」（3:16），又叫讀者「記念聖先知預先所說的話和主救主的命令」（3:2）。<\/p><p>同時，彼得在信的開頭與結尾放了兩件不會改變的事：開頭是「神的神能已將一切關乎生命和虔敬的事賜給我們」（1:3），結尾是「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進」（3:18）。中間他說，他們所傳的「並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」（1:16）。<strong>經文問的是：面對這卷書裡的種種爭議，一個信徒該怎樣自處？問問題是不是不信？有沒有甚麼是不會因爭議而動搖的？<\/strong><\/p>"],["爭議動搖根基說","","<p>懷疑者常有的推論：連作者都有爭議，正典的路走了幾百年，3:10 的原文到底是哪一個字學者都說不準——可見聖經不過是人的作品，不值得全然信靠。這派的優點是誠實，它不假裝問題不存在，也逼著教會不能只用「信就對了」回答。<\/p><p><strong>難處：<\/strong>這些爭議幾乎全部發生在「怎樣理解」與「怎樣流傳」的層次，不在「耶穌是誰、他作成了甚麼、他必再來」的層次。主張彼得是作者的，和主張託名的學者，都同意這封信見證的是登山變像的主；3:10 的三種讀法，都說主的日子必要來到。爭議多，表示這卷書被認真讀了兩千年，不表示它不可信。<\/p>"],["不准問說（只要信，不要問）","","<p>教會裡常見的反應：這些爭議會絆倒人，最好不要在教會裡講，信徒只要單純地信就好。這派的優點是保護軟弱的信徒不被過多的資訊淹沒，也提醒我們信心不是靠學問得來的——主說「那沒有看見就信的有福了」（約 20:29）。<\/p><p><strong>難處：<\/strong>彼得前書要信徒「常作準備」回答各人（彼前 3:15），庇哩亞人也被稱讚「天天考查聖經」（徒 17:11）。不准問的信心最脆弱——一旦有一天在別處聽見這些問題，就會以為教會一直在隱瞞甚麼。把提問的人看成不屬靈，也正是彼前 5:3 那種轄制的開始；彼得後書第二章被定罪的，是「師傅」，不是提問的人。<\/p>"],["分層看待說（根基與枝節）","","<p>主張要分清楚哪些是根基、哪些是枝節：在根基上站穩的人，可以帶著謙卑與好奇去面對枝節上的爭議。保羅說「但要凡事察驗；善美的要持守」（帖前 5:21）。這派的優點是既不迴避問題，也不讓問題動搖根基。<\/p><p><strong>難處：<\/strong>甚麼是根基、甚麼是枝節，本身有時也有爭議；有些人會把自己宗派的立場都放進根基裡，有些人則把重要的事都推到枝節去。所以分層需要謙卑，也需要回到經文本身與歷代教會共同的信仰告白，不是由某一位講員說了算。彼得後書自己也這樣分層：1:16–21 是根基，3:16「有些難明白的」是需要謙卑的地方。<\/p>"],["長進說（爭議是長進的機會）","","<p>認為彼得後書本身就示範了怎樣面對爭議：不強解，在群體中讀，回到先知的話與使徒的命令（3:2），並且在恩典和知識上有長進（3:18）。照這個方向，爭議不是信心的敵人，而是逼我們回到經文、回到群體、回到主面前的機會；問得越誠實，根扎得越深。彼得自己就走在這樣的長進裡：從想在山上搭棚的人，到臨終時寫下「有長進」的人。<\/p><p><strong>難處：<\/strong>長進說若講得太輕鬆，會叫正在信心危機裡的人覺得自己的痛被當成一個學習機會；有些人需要的不是更多資料，而是有人陪他禱告。長進是方向，不是要求每一個疑惑的人立刻「從中學習」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義的立場：分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案；把爭議當成在恩典和知識上長進的機會。<\/strong>全卷的爭議，本講義都已經在 ISS00_1–8 交代：作者、正典與猶大書（ISS00_1）、與神的性情有分（ISS00_2）、分辨假教訓與讀經（ISS00_3）、主的日子與受造界（ISS00_4）、得救確據與背道（ISS00_5）、與猶大書的先後（ISS00_6）、年代與地點（ISS00_7）、正典（ISS00_8）。每一題都列出各家的理由與難處，因為只給結論不給過程，是剝奪讀者思考的權利。<\/p><p>但有幾件事，全卷沒有任何一個爭議動搖過：<strong>神「已將一切關乎生命和虔敬的事賜給我們」（1:3）；那位在聖山上被父稱為「這是我的愛子，我所喜悅的」（1:17）的主，使徒「親眼見過他的威榮」（1:16）；「主的日子要像賊來到一樣」（3:10）；他「不願有一人沉淪，乃願人人都悔改」（3:9）；我們「照他的應許，盼望新天新地，有義居在其中」（3:13）。<\/strong>這是彼得後書的根基，也是本講義全卷的根基。<\/p>"],["【四】這件事該不該影響你的信心","","<p>派別之爭不該影響你的信心。問問題不是不信；在問題面前轉身離開，才是彼得擔心的——「恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落」（3:17）。彼得自己也是一個問過很多問題、說過很多錯話的人；他在水面上往下沉的時候，主「趕緊伸手拉住他」（太 14:31）。<\/p><p>但有一件事該影響你：<strong>我是在恩典和知識上長進，還是在懷疑與算計裡退後？<\/strong>這封信不是寫給一群把所有問題都答完的人，是寫給一群在暗處需要燈的人。彼得最後沒有說「你們要把一切弄明白」，他說的是「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進」，然後把一切榮耀歸給那一位：「願榮耀歸給他，從今直到永遠」（3:18）。<\/p>"]],"con":[],"say":"本講義的全卷立場：彼得後書的爭議都發生在「怎樣理解」與「怎樣流傳」的層次，本講義分層看待——在根基上站穩，在枝節上並陳、謙卑、不定案。神已將一切賜給我們，使徒親眼見過主的威榮，主必像賊一樣來到，他不願有一人沉淪；這些沒有一個爭議動搖過。問題是長進的機會。","care":"席上會有正在信仰危機裡、問題多到不敢說出口的人，也有一聽到「學者有爭論」就不安的長輩，還有曾經被人用 1:20 或 2:10 堵過嘴、因此連聖經也不敢讀的人。對第一種人，不要說「你就是信心不夠」，也不要用一堆答案堵住他，先陪他；對第二種人，指給他看 1:3 與 1:16；對第三種人，讓他知道傷他的是人錯用了經文，不是那盞照在暗處的燈（1:19）。疑惑若伴隨長期失眠或無望感，會後單獨關心，必要時協助尋求專業協助。"},{"id":"ISS01_1","t":"1:1「我們的神和救主耶穌基督」——新約直稱耶穌為神嗎？","r":"1:1--2；1:11；3:18；約 20:28","ch":[1],"why":"彼得後書第一節就把「神」和「救主」兩個稱號放在耶穌基督一個人身上。這句話可以讀成一位，也可以讀成兩位：「我們的神（父）」和「救主耶穌基督（子）」。這不只是文法問題：常有慕道友或剛信主的人問「聖經哪裡說耶穌是神？」，也有人在網路上讀到「耶穌從來沒有被稱為神」而動搖。這一節正是答案的一部分。","pos":[["【一】經文問的是甚麼","","<p>「寫信給那因我們的神和救主耶穌基督之義、與我們同得一樣寶貴信心的人」（1:1）。原文 τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ，一個冠詞統管「神」與「救主」兩個稱號。可是緊接著 1:2 又說「因你們認識神和我們主耶穌」，看起來又是分開的兩位。問題是：1:1 的「神」與「救主」，是同一位耶穌基督，還是父與子兩位？新約有沒有直接稱耶穌為神？<\/p>"],["一位說：「神」與「救主」都是耶穌基督","","<p>一個冠詞統管兩個單數、非專有名詞的位格稱號，中間以 καί 連接，照 Granville Sharp 歸納的規則，指的是同一位。多數福音派註釋與新近譯本採此讀法。最有力的旁證在本卷自己：1:11、2:20、3:18 都用同一個句型「我們主－救主耶穌基督」，從來沒有人把那三處讀成兩位。<\/p><p><strong>難處：<\/strong>文法規則有例外，單靠一條規則不足以定案；1:2 緊接著又把神與主分開，讀者需要解釋兩節為甚麼不同。<\/p>"],["兩位說：「我們的神」指父，「救主耶穌基督」指子","","<p>這一說的理由是：1:2 明明把「神」和「我們主耶穌」分開；少數抄本在 1:1 作「主」而不是「神」；一些古譯本也可讀成兩位。部分持守三一信仰的學者也認為，這一節的文法不足以單獨作決定，寧可謹慎。<\/p><p><strong>難處：<\/strong>1:2 的「耶穌」是專有名詞，不在同一個冠詞之下，句型本來就不同；作「主」的抄本是少數，校勘本多採「神」。若讀成兩位，就很難解釋本卷另外三處同一句型為甚麼都是一位。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採一位：1:1 直稱耶穌為「我們的神和救主」，與約 1:1、20:28 同列為新約直稱耶穌為神的經文；兩位說的理由並陳。<\/strong><\/p><p>1:1 合為一位，1:2 分為兩位，正好見證三一神的兩面：子與父有分別，子又真是神。彼得後書在這裡多出來的一筆是：這封信以「我們的神和救主」開頭，以「願榮耀歸給他」（3:18）結束——頭尾都把只屬於神的稱呼與榮耀歸給耶穌。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該動搖你，反而該叫你更安穩。不論文法爭論怎樣，新約多處見證耶穌是神：多馬在復活的主面前說「我的主！我的神！」（約 20:28）。<\/p><p>寫這一節的，是和耶穌一起吃飯、打魚三年、又三次不認他的那個人；他最後一封信的第一句，稱那位在海邊叫他名字的耶穌為「我們的神」。爭議與信心的全卷立場見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：1:1 讀為一位，直稱耶穌為「我們的神和救主」；兩位說並陳。講台不在文法上停留太久，只說一句：寫這封信的老漁夫，最後一封信的第一句，就稱耶穌為神。全卷立場見 ISS00_9。","care":"會眾席上可能有正在慕道、被朋友一句話問倒的人，也有在網路上讀到「耶穌從來沒有被稱為神」而暗自動搖的年輕人。不要把這一節當成辯倒人的武器，也不要要求他先背熟希臘文規則。陪他讀約 20:28，再讀這一節；告訴他：最早跟隨耶穌的人，最後稱他為神。和不信的朋友談這一題，要溫柔謙卑，目的不是贏，是讓他遇見主。"},{"id":"ISS01_2","t":"1:4「得與神的性情有分」——人會不會成為神？","r":"1:3--7；加 2:20","ch":[1],"why":"這是全卷神學最高的一句，也是最容易被講偏的一句。完整的四讀並陳與三條界線寫在全卷立場 ISS00_2；本條只處理第 1 章講台上最常遇到的兩個實際問題：會眾聽到「與神的性情有分」，會不會以為人可以修成神？講員怕講偏，會不會乾脆跳過不講？","pos":[["【一】經文問的是甚麼","","<p>「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分」（1:4）。「有分」κοινωνοί（koinōnoi）是同伙、合夥的人；「性情」φύσις（physis）可指本性，也可指品質。主詞是神，起點是 1:3「神的神能已將一切……賜給我們」，下一節緊接著說「正因這緣故」。問題是：有分的是甚麼？有分到甚麼程度？<\/p>"],["成神論：東正教傳統的「本質／能力」之分","","<p>東正教講「成神」（theosis），意思是人藉恩典有分於神的能力（energies），不是有分於神的本質（essence）；人越來越像神，卻永遠是受造者。這一說把 1:4 讀得最深，提醒我們救恩不只是赦罪，是被帶進與神的相交。它不是說人變成另一位神，不可嘲諷。<\/p><p><strong>難處：<\/strong>「成神」這個詞在華人處境裡很容易被聽成修煉成仙；「本質／能力」的分別若沒有講清楚，會眾只記得字面。<\/p>"],["聯合說：在基督裡與基督聯合，有分於他的生命","","<p>改革宗與路德宗傳統讀為藉聖靈與基督聯合，有分於他的生命；成聖是被更新成神的形像。加爾文註釋此節，說這裡的「性情」指品質，不是本體。這一說把有分放在基督身上，正合 1:3 的「認識那……召我們的主」。<\/p><p><strong>難處：<\/strong>若只講地位上的聯合，容易把 1:4 講得太平，好像只是法律上的身分，聽不見彼得那份「又寶貴又極大」的驚奇。<\/p>"],["品格說：衛斯理的完全的愛與許多福音派的道德相似","","<p>衛斯理傳統看重今生被聖靈充滿，以完全的愛愛神愛人；許多福音派註釋則說，有分的是神的聖潔、良善、愛等道德品格，不涉本體。兩者都以下文 1:5--7 那串以愛作結的清單為證：神的性情落在人身上，長出來的就是這些。<\/p><p><strong>難處：<\/strong>若只講品格，容易把 1:4 變成一堂道德課，好像有分只是「學好」，失去了與神相交的深度。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採「在基督裡與基督聯合，有分於神的生命與品格」，四讀並陳，守住三條界線。<\/strong><\/p><p>第一，創造者與受造者的分別永遠存在，這節經文不是說人與神同等；第二，有分是恩典，不是修煉，主詞是「他已將……應許賜給我們」；第三，有分的內容就寫在下文：脫離敗壞，加上德行，一直到愛眾人的心。講台不可因為怕講偏就跳過這一節。<\/p>"],["【四】這件事該不該影響你的信心","","<p>該叫你更敬拜，也更有盼望。四種讀法沒有一家主流傳統說受造者會成為另一位神；分歧在有分的深度，不在要不要守住界線。<\/p><p>如果你信主多年仍改變不了，請你看這一節：神不只赦免你，還要把自己的生命與品格分給你；你的長進不是靠意志撐出來的。全卷立場見 ISS00_2。<\/p>"]],"con":[],"say":"本講義的立場：有分是在基督裡與基督聯合，有分於神的生命與品格；創造者與受造者的分別永遠存在，有分是恩典不是修煉，有分的內容就是 1:5--7。講台不可跳過 1:4。全卷立場見 ISS00_2。","care":"這一節對兩種人最要緊。一種是覺得自己一無是處、信主多年改變不了的人：神要把自己的生命分給他。另一種是追求屬靈經歷、想高人一等的人：真正有分於神性情的人，看起來不是更神祕，是更節制、更忍耐、更會愛人。若有弟兄姊妹被「你就是小神」的說法吸引，不要嘲笑他，先問他：你渴慕的是神自己，還是一個更大的自己？"},{"id":"ISS01_3","t":"1:5--7「有了信心，又要加上德行」——八個台階有先後次序嗎？","r":"1:5--8；羅 5:3--5；加 5:22--23","ch":[1],"why":"八項排成一串，很容易被讀成一道樓梯：先把德行做完，才能開始學知識。這樣讀，有人卡在第二級一輩子不敢往上看，有人拿它當考核表量別人。也有人注意到這八項和 321 改變觀念的八大步驟同為八項，想把兩者對在一起。這到底是先後的步驟，還是一起長的品格？","pos":[["【一】經文問的是甚麼","","<p>「正因這緣故，你們要分外地殷勤；有了信心，又要加上德行」（1:5）。每一項的原文都是「在……裡面」：在信心裡供應德行，在德行裡供應知識，一直到在愛弟兄的心裡供應愛眾人的心。「加上」ἐπιχορηγήσατε（epichorēgēsate）是慷慨供應的字。問題是：這是一級一級的關卡，還是彼此包含、一起長的品格？<\/p>"],["階梯說：一項完成，才進入下一項","","<p>這一說把八項讀成靈命成長的路線圖：先有德行的根基，才談得上知識；先學會節制，才可能忍耐。一些靈修傳統與通俗講道採此讀法，好處是具體、容易記，也提醒人成長有次序，不能跳級。<\/p><p><strong>難處：<\/strong>原文是「在……裡面」，不是「在……上面」；把八項讀成關卡，會讓在某一項跌倒的人覺得後面都免談，也容易變成拿來量別人的考核表。<\/p>"],["包含說：每一項在前一項裡面長出來","","<p>介系詞 ἐν 說明：德行不是離開信心另起爐灶，是在信心裡長出來的；愛也不是離開節制與忍耐的一種情緒。像一棵樹，枝子從枝幹裡長出來，同時在長。許多註釋家注意到這個結構，它也和聖靈所結的果子是一整串的方向相合。<\/p><p><strong>難處：<\/strong>若只講彼此包含，容易把次序講成沒有意義，忽略彼得刻意把信心放在開頭、把愛放在最後。<\/p>"],["連鎖說：古典修辭的層遞句型","","<p>這是當時常見的連珠法，羅 5:3--5 患難生忍耐、忍耐生老練，也是這種寫法。起點與終點是刻意安排的，中間的次序帶著修辭成分。彼得借用了世人熟悉的美德清單形式，卻以信心開頭、以愛結尾，裝進福音的內容。<\/p><p><strong>難處：<\/strong>若只說是修辭，容易把清單講得太輕，好像只是文學手法，聽不見「分外地殷勤」的迫切。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採：起點與終點是確定的，中間是彼此扶持的品格，不是八道先後的關卡。<\/strong><\/p><p>起點是信心，是神分給的（1:1）；終點是愛，而且最後兩級都是愛人。整串清單掛在「正因這緣故」上，回指 1:3--4 神已賜下的一切。這八項是品格的果子，和 321 改變觀念的八大步驟是兩回事，不可把這段經文講成那八步的插圖。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你灰心。不論採哪一說，各家都同意：台階是從恩典長出來的，不是用來買恩典的；這張清單是照自己的，不是量別人的。<\/p><p>如果你在某一項上屢屢跌倒，你可以同時學著愛人；愛人的操練本身就會幫助你節制。每次只挑一項，求那位已經供應你一切的主，在你信心裡供應下一項。爭議與信心見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：起點是信心，終點是愛，中間是彼此扶持的品格，不是八道關卡；整串清單掛在 1:3--4 神已賜下的一切上。這八項不是 321 八大步驟的插圖，兩者是兩回事。","care":"小組裡不要互相評分「你在第幾級」，也不要讓在某一項跌倒的人覺得自己出局了。對完美主義的弟兄姊妹，提醒他：1:5 開頭是「正因這緣故」，你不是從零開始爬；對覺得反正得救、不必長進的人，提醒他：恩典叫人分外殷勤。最好的用法是每次只挑一項，寫下一個具體的人，在他面前慢慢活出來。"},{"id":"ISS01_4","t":"1:9「忘了他舊日的罪已經得了潔淨」——得救的人會忘記得救嗎？","r":"1:8--9；1:12--13；3:1--2；路 22:61","ch":[1],"why":"這個人看來是信過主的，因為他舊日的罪「已經得了潔淨」；可是他「眼瞎」，又「忘了」。一個真正得救的人，會不會忘記自己得救？這是失去了救恩，還是從來沒有得救？會眾裡信主多年、卻越來越冷淡的人，最常在夜裡問的正是這個問題。","pos":[["【一】經文問的是甚麼","","<p>「人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨」（1:9）。「只看見近處的」μυωπάζων（myōpazōn）帶著瞇眼、自己不看遠處的意思；「忘了」λήθην λαβών 是「取了遺忘」的慣用語。下一段彼得說「我卻要將這些事常常提醒你們」（1:12）。問題是：這個「忘了」，說的是哪一種人、哪一種遺忘？是失去了救恩，還是失去了眼光？<\/p>"],["實際遺忘說：不再活在恩典裡，不是失去救恩","","<p>許多福音派註釋認為，「忘了」不是記憶喪失，也不是失去救恩，是生活上不再活在恩典裡：知道自己被赦免，卻不再因此感恩、不再因此改變。病是忘記，藥是提醒；這一說和 1:12「你們……在已有的真道上堅固」的語氣相合。<\/p><p><strong>難處：<\/strong>若講得太輕，容易讓長期冷淡的人以為「反正只是忘了，沒有關係」，聽不見這一節的嚴肅。<\/p>"],["外表潔淨說：只有外在的潔淨，從未真正重生","","<p>加爾文傳統的一種讀法認為，「得了潔淨」可能指受洗、加入教會的外在潔淨；這個人外表上屬於群體，卻從未重生，所以長不出品格，最後顯出本相。持此讀法的人常把本節和 2:20--22 連起來讀。<\/p><p><strong>難處：<\/strong>經文說罪「已經得了潔淨」，語氣是真實的；而且這樣讀很容易被拿來替別人宣判「你本來就不是真的」，這對掙扎中的人是很重的話。<\/p>"],["可能離棄說：長期忘記，可能一步一步離開","","<p>衛斯理與亞米念傳統認為，真信徒若長期忘記恩典、不結果子，可能一步一步走向離棄真道；本節是嚴肅的警告，叫人不可停在原地，所以 1:10 接著說「應當更加殷勤」。<\/p><p><strong>難處：<\/strong>若把這一節講成隨時會掉的威脅，容易讓敏感的人每次冷淡就懷疑自己已經失落，忽略了下文的藥方是「提醒」，不是「宣判」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採實際遺忘說：一個被潔淨過的人，忘了恩典，眼睛只盯著近處，所以長不出 1:5--7 的品格。這節經文的目的是診斷與喚醒，不是宣判。<\/strong><\/p><p>彼得後書在這裡多出來的一筆是：全卷的「記念」線由這裡起步（1:12、13、15；3:1、2），到 3:5 成了假師傅的「故意忘記」。彼得最關心的，是讓會忘記的人被提醒回來。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該叫你絕望。如果你正為自己的冷淡難過，這份難過本身就說明你還沒有全瞎，主還在叫你。<\/p><p>彼得自己也是被一次「想起」叫回來的：主轉過身來看他，他便想起主的話（路 22:61）。治療不是更用力地自責，是重新看見那位先轉過身來的主。得救確據與背道的全卷立場見 ISS00_5。<\/p>"]],"con":[],"say":"本講義的立場：1:9 讀為實際上的遺忘——被潔淨過的人忘了恩典，眼睛只看近處；這節是診斷與喚醒，不是宣判，藥方是 1:12 的「常常提醒」。全卷立場見 ISS00_5。","care":"一位冷淡多年的弟兄若問「我是不是根本沒有得救」，不要急著替他下結論，先陪他想起來：你第一次知道自己被赦免是甚麼時候？主怎樣把你洗淨？小組也可以一起做這個功課：每個月有一次聚會，不談新主題，只輪流說「主赦免了我甚麼」。這不是重複，是 1:12 的常常提醒；被提醒的人，眼睛會重新看得遠。"},{"id":"ISS01_5","t":"1:10「使你們所蒙的恩召和揀選堅定不移」——揀選要靠我們堅定嗎？","r":"1:10--11；1:3；太 14:30--31","ch":[1],"why":"揀選不是神的事嗎？如果要靠我們「使它堅定」，是不是說神的揀選可以被我們弄丟？反過來，如果揀選本來就不會動搖，為甚麼還要殷勤？這節站在改革宗與亞米念兩大傳統的交界上，也直接碰到每一個信徒心裡的問題：我怎麼知道自己真的得救了？","pos":[["【一】經文問的是甚麼","","<p>「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳」（1:10）。「堅定」βεβαίαν（bebaian）在當時的契約上指有效的保證；「使」是關身語態，帶著「為你們自己」的意思；「永不失腳」用的是希臘文最強的否定 οὐ μή。問題是：人的殷勤，是在神那邊補上甚麼，還是在自己這邊確認甚麼？<\/p>"],["確據說：品格是揀選的證據，不是揀選的原因","","<p>改革宗多採此讀法：神的揀選本身不會動搖；「使之堅定」是讓蒙召在信徒自己的經歷與見證中變得確實。關身語態說明對象是你們的確據，不是在神那邊補上甚麼。這一說給人極大的安穩：源頭在神。<\/p><p><strong>難處：<\/strong>若講得太快，容易讓人把「永不失腳」前面的「你們若行這幾樣」略過，好像殷勤只是可有可無的裝飾。<\/p>"],["參與說：人的回應真實地參與在神的保守之中","","<p>亞米念傳統多採此讀法：「若行這幾樣」是真實的條件，不殷勤，蒙召就可能落空。部分抄本在此加上「藉著你們的善行」，顯示早期就有人這樣理解，雖然多數校勘本視為後加的解說。這一說認真看待命令，提醒人不可輕看恩典。<\/p><p><strong>難處：<\/strong>若把確據完全放在人的表現上，容易讓敏感的人天天量自己夠不夠，忘了 1:3 神已經把一切賜給我們。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採：源頭在神，確據在生命；兩說並陳，講台不裁判。<\/strong><\/p><p>1:10 夾在兩個神的供應中間：前面是 1:3「神的神能已將一切……賜給我們」，後面是 1:11「必叫你們豐豐富富地得以進入」，而 1:11 原文用的正是 1:5「加上」那個字，主詞換成神。殷勤是被包在恩典裡面的，不是恩典之外的另一條路；「永不失腳」是應許，不是威脅。<\/p>"],["【四】這件事該不該影響你的信心","","<p>該叫你安穩，也叫你認真。寫「永不失腳」的人，曾經在水面上往下沉，是耶穌趕緊伸手拉住他（太 14:31）；確據最後落在那隻手上。<\/p><p>你今天會為長進掙扎、會怕自己不夠殷勤，這本身正是神在你裡面作工的記號；不殷勤的人，不會為殷勤掙扎。得救確據的全卷立場見 ISS00_5；爭議與信心見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：源頭在神，確據在生命；1:5--7 的品格不是買門票，是讓蒙召的人自己看見，也讓人看見這呼召是真的。「永不失腳」是應許，不是威脅。全卷立場見 ISS00_5。","care":"對一個天天懷疑自己是否得救的人，不要只叫他「更有信心」；陪他讀 1:3--11，指出三件事：神已經給了（1:3），你可以開始加上（1:5），門是主打開的（1:11）。對一個覺得「反正得救了，怎麼活都可以」的人，要溫柔而清楚地說：真正蒙召的人會殷勤，因為恩典不叫人閒懶。然後問他：這一週，你想在哪一項上和我們一起操練？"},{"id":"ISS01_6","t":"1:16「並不是隨從乖巧捏造的虛言」——福音書是神話嗎？","r":"1:16--18；太 17:1--8；路 1:1--4；林前 15:6","ch":[1],"why":"第一世紀的人聽過許多神祇化身降臨人間的故事；今天的人也常說：「耶穌的故事很美，可是那是後來的信徒編出來的。」大學課堂、網路影片、朋友的閒談裡都有這個聲音。彼得在臨終的信裡特別否認「捏造的虛言」，可見這個指控在使徒時代就有了。福音書記的是歷史，還是宗教神話？","pos":[["【一】經文問的是甚麼","","<p>「我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」（1:16）。「捏造的虛言」原文是精心編造的 μῦθοι（mythoi，神話）；「親眼見過」ἐπόπται（epoptai）原指入了神祕宗教最高一級、看見祕密的人。問題是：使徒傳的，是在場目睹的事，還是信仰群體後來的創作？<\/p>"],["解神話說：新約是用神話的世界觀寫成的","","<p>二十世紀一些學者主張，新約用古代神話式的世界觀寫成：天在上、陰間在下、神蹟與天使介入人間；現代人要除去這層外殼，才能聽見其中呼召人作抉擇的信息。登山變像、復活都不必當作歷史事件。<\/p><p><strong>難處：<\/strong>彼得說的正好相反：他說出時間、地點與在場的「我們」，而且明明否認自己在講神話。一旦除去事件，剩下的信息也失去了根據。<\/p>"],["借用說：福音書借用了周圍宗教的主題","","<p>十九至二十世紀初的宗教史學派，把基督教放在希臘羅馬神祕宗教的脈絡中比較，認為「神子降臨」「死而復生」等主題是從周圍宗教借來的，福音書是群體的神話化創作。<\/p><p><strong>難處：<\/strong>後來的研究指出，許多所謂相似其實很表面，而且資料的年代多半晚於新約；彼得把神祕宗教的字搶過來用，正是要劃清界線：我們不是入了甚麼祕密的門，是站在山上的人。<\/p>"],["見證說：福音書是建立在目擊者見證上的古代傳記","","<p>許多近代學者指出，福音書在文學類型上屬於古代傳記，關心一個真實人物的言行；福音傳統是在目擊者仍然在世時流傳的。保羅說復活的主顯給五百多弟兄看，其中多半還在（林前 15:6）。彼得的「我們……親自聽見」（1:18），正是見證的語言。<\/p><p><strong>難處：<\/strong>歷史證據能叫人看見信心是合理的，卻不能代替聖靈在人心裡的光照；這一說若講成「證據夠多就會信」，就低估了 1:19--21。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採見證說：福音書是建立在目擊見證上的歷史記載，不是神話。<\/strong><\/p><p>神話發生在「很久很久以前」，沒有人能查證；彼得卻說出山、聲音和三個在場的人，而且收信人之中可能還有人可以去問。彼得後書在這裡多出來的一筆是：見證之後，彼得立刻把人帶到「先知更確的預言」（1:19）——信心站在見證上，也站在聖靈感動的話上。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該叫你慌。這個指控兩千年前就有了，使徒正面回應過；你不必成為護教學者，但你可以說「我所信的，是有人在場看見的事」。<\/p><p>同時記得，最後叫人信的不是辯論贏了，是那盞燈照進心裡；見證叫人願意聽，聖靈叫人真的看見。爭議與信心的全卷立場見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：福音書是建立在目擊見證上的歷史記載，不是神話；彼得說的是「我們親眼見過、親自聽見」。歷史證據叫信心合理，卻不能代替聖靈的光照。全卷立場見 ISS00_9。","care":"一位大學生第一次在課堂上聽到「福音書是神話」，常常很慌，又不敢在教會裡問，怕被說成不屬靈。要讓這樣的問題可以被問出來，陪他讀 1:16--18，也陪他找一兩本好的入門書。也提醒我們自己：作見證不必誇大，不必把故事講得比實際更精彩；照實說主在你身上做過的事，就夠了。"},{"id":"ISS01_7","t":"1:19「我們並有先知更確的預言」——聖經比屬靈經歷更可靠嗎？","r":"1:16--21；徒 17:11；約壹 4:1","ch":[1],"why":"彼得剛講完一生最高的經歷：在聖山上親眼見過主的威榮、親耳聽見天上的聲音，緊接著說「我們並有先知更確的預言」。「更確」是比甚麼更確？如果是聖經比經歷可靠，一切屬靈經歷都不足信嗎？如果是經歷使預言更確，今天的人是不是也要有經歷，聖經才算確實？這一題碰到教會裡看重經歷與看重真理的兩種張力。","pos":[["【一】經文問的是甚麼","","<p>「我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的」（1:19）。「更確」βεβαιότερον（bebaioteron）是比較級，放在述語的位置；「暗處」原文是又乾又髒的地方。問題是：這個比較級，是拿聖經和經歷比高低，還是說經歷使預言更加確定？<\/p>"],["比較說：先知的話比山上的經歷更可靠","","<p>古代與宗教改革時期不少註釋讀為：先知的話比登山變像的經歷更可靠。經歷會過去、會被誤解，聖經長存；所以信徒不要以經歷為準則。這一說保護了聖經的權威，也提醒人不要追逐經歷。<\/p><p><strong>難處：<\/strong>彼得剛用那次經歷作見證（1:16--18），若緊接著貶低它，語氣不順；這一說也容易被拿來嘲笑一切真實的屬靈經歷。<\/p>"],["證實說：登山變像使先知的話更加確定","","<p>比較級放在述語位置，可讀為「我們有先知之言，如今更加確定了」：山上的榮光證實了舊約對彌賽亞榮耀的預言。上下文「並且我們有」是把見證與聖經連在一起，不是拿兩者比高低。一些新近譯本採此方向。<\/p><p><strong>難處：<\/strong>若講成「先知的話要靠經歷才確定」，會讓沒有特殊經歷的人以為自己手中的聖經次一等。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採證實說：經歷證實了預言，預言解釋了經歷。<\/strong><\/p><p>彼得的意思是：我們在山上看見的，叫先知的話更確定；你們沒上過山，但你們手裡有這更確的話。所以這一節不能用來貶低一切屬靈經歷，更不能把經歷放在聖經之上。燈是天亮以前的光，經歷要被燈照亮、被燈檢驗；天亮了，晨星出現，燈才放下。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你覺得自己次一等。一位從來沒有特別經歷的弟兄姊妹，手裡的那盞燈和使徒的一樣確實。<\/p><p>一位在禱告中真實遇見主的人，也不必被嘲笑；只要把那份感動放在燈下照一照：它與經文一致嗎？它照上下文嗎？它叫你更愛主、更愛人嗎？分辨的全卷立場見 ISS00_3。<\/p>"]],"con":[],"say":"本講義的立場：經歷證實了預言，預言解釋了經歷；這一節不貶低經歷，也不把經歷放在聖經之上。天亮以前，那盞燈就是準則。全卷立場見 ISS00_3。","care":"華人教會常在這裡分成兩邊：一邊說「你們只有頭腦，沒有生命」，一邊說「你們只有感覺，沒有真理」。1:16--19 把兩邊放在同一段經文裡：同一個彼得，上過山，也捧著燈。面對一位說「神親自告訴我」的弟兄姊妹，不必一開口就否定，陪他把感動放在燈下；面對一位從來沒有特別經歷的人，告訴他：你手裡的燈夠用。"},{"id":"ISS01_8","t":"1:20「經上所有的預言沒有可隨私意解說的」——平信徒可以自己讀經嗎？","r":"1:20--21；3:16；徒 17:11","ch":[1],"why":"這節經文常被引用來勸人不要自己讀經：「你沒有讀過神學，會讀偏，聽講台就好。」也有人反過來，把每一個人的讀法都當作同樣有效。「私意」到底是誰的意思——寫經文的先知，還是讀經文的人？完整立場寫在全卷立場 ISS00_3；本條處理經文本身的讀法，與它在會眾讀經生活中的影響。","pos":[["【一】經文問的是甚麼","","<p>「第一要緊的，該知道經上所有的預言沒有可隨私意解說的；因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來」（1:20--21）。「解說」ἐπίλυσις（epilysis）新約只用這一次，有「解開」的意思；這一句的動詞 γίνεται（ginetai）講的是預言怎樣產生。問題是：這一節管的是預言的來源，還是讀者的讀法？<\/p>"],["來源說：預言不是先知自己想出來、自己解開的","","<p>許多福音派註釋採此讀法：先知沒有憑自己去解開所見的異象，預言不是出於先知自己的解釋。最有力的理由是 1:21 以「因為」接續，說明的正是來源：「預言從來沒有出於人意的」。這一節要保護的，是聖經出於神。<\/p><p><strong>難處：<\/strong>若只講來源，容易讓人以為怎麼讀都可以；可是彼得在 3:16 也警告有人「強解」，讀法不是無所謂的。<\/p>"],["讀者說：讀者不可憑個人意思解經","","<p>天主教傳統常引此節說明教會訓導的角色；部分新教註釋也採此讀法，強調個人主義的讀經容易偏差，需要教會群體或教導者的引導。這一說看見了讀經的危險，也看重群體。<\/p><p><strong>難處：<\/strong>這一說若被推到極端，就成了把聖經從會眾手中拿走；而且它很難解釋 1:21 的「因為」，那一句說的明明是預言怎樣產生。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採來源說：1:20 講的是預言的來源，不是禁止會眾讀經，也不是說只有牧師才能解經。<\/strong><\/p><p>由來源推出讀法：既然經文不是出於人意，讀的人也不可照私意扭曲它（3:16）。讀經的保護不是把聖經鎖起來，是在群體中讀、照上下文讀、謙卑地讀，像庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你不敢打開聖經，反而該叫你更想讀。宗教改革把聖經譯成百姓的語言，交回會眾手中；得救之道是清楚的，凡人都可以讀懂，難明白的地方就帶到群體裡一起查考。<\/p><p>讀錯了可以在群體裡被修正，不讀才是真正的損失；你打開聖經，不是越權，是領受。全卷立場見 ISS00_3。<\/p>"]],"con":[],"say":"本講義的立場：1:20 講預言的來源，不是禁止會眾自己讀經；讀經的保護是在群體中讀、照上下文讀、謙卑地讀。全卷立場見 ISS00_3。","care":"有不少弟兄姊妹心裡很想讀經，卻怕讀錯、怕被說「私意解經」，於是只聽講台、只讀靈修小冊。這一節若被誤用，就把他們推得更遠。教會可以為會眾預備簡單的工具：一份讀經進度、三個查經問題、一個可以發問的小組。也提醒講台上的人：會眾讀出講員沒看見的東西，不是威脅，是聖靈在群體中作工。"},{"id":"ISS01_9","t":"1:21「乃是人被聖靈感動，說出神的話來」——聖經是怎樣默示的？","r":"1:20--21；提後 3:16；路 1:1--4；徒 27:15","ch":[1],"why":"這節經文與「聖經都是神所默示的」（提後 3:16）並列，是新約講默示最重要的兩處。可是問題接著來了：如果是聖靈說的，為甚麼保羅、彼得、約翰的文筆都不一樣？先知是像錄音機一樣被動地記下，還是用自己的話寫？這決定一個人打開聖經時，是在讀神的話，還是在讀古人的宗教心得。","pos":[["【一】經文問的是甚麼","","<p>「因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來」（1:21）。「感動」φερόμενοι（pheromenoi）是被動分詞，意思是被帶著、被推著走；同一節前半「出於」ἠνέχθη 也是同一個字根。主詞仍然是「人……說出」，人並沒有消失，說出來的卻是「神的話」。問題是：聖靈與人的關係是怎樣的？人的成分在哪裡？<\/p>"],["口述說：聖靈逐字口述，先知只是記錄的工具","","<p>這一說要保護聖經每一個字都出於神，像書記照著主人的口述抄寫。它看重 1:21「說出神的話來」，不讓人的成分削弱聖經的權威。<\/p><p><strong>難處：<\/strong>它很難解釋各卷書明顯不同的文風、用字與性情；路加也說自己是先把各樣事詳細考察過才寫（路 1:1--4）。今天很少學者真正持這一說，卻常被誤以為是保守派的立場。<\/p>"],["有機默示說：聖靈使用作者的整個人","","<p>這一說認為，聖靈使用作者的性情、經歷、語言與研究，使他們所寫的正是神要說的話，完全而可信。「被帶著」這個字，這使我們想起保羅的船「任風颳去」（徒 27:15）用的同一個字：帆是人的，風是神的。人沒有失去自己，推動與方向卻來自神。<\/p><p><strong>難處：<\/strong>這一說要同時說「完全是人寫的」與「完全是神的話」，講得不清楚時，會被聽成只是一半一半。<\/p>"],["部分默示說：只有思想或救恩的部分被默示","","<p>有人主張只有思想被默示，字句是人自己選的；也有人主張只有關乎救恩的部分被默示，其他細節可能有誤。這一說想給人的成分更大的空間，也想回應讀經時遇到的難處。<\/p><p><strong>難處：<\/strong>它與 1:21「說出神的話來」不太相合，也與主耶穌對舊約經文的態度不合；而且由誰來決定哪一部分被默示，最後又回到「私意」。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採有機的完全默示：聖靈使用先知的整個人，使他們所說的正是神的話。<\/strong><\/p><p>所以聖經有人的聲音、人的文風，也完全是神的話，值得完全信靠。1:21 的焦點是來源：預言「從來沒有出於人意」。也因為同一位聖靈當初帶著先知說話，今天也帶著讀經的人明白；聖靈的引導與聖經的準則，從同一個方向來。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該叫你不安。信靠聖經，不是因為我們已經解決了每一個難題，是因為我們認識那位說話的神。<\/p><p>遇到看不懂、甚至覺得矛盾的地方，不必驚慌，也不必硬解，可以帶到小組一起查考，或先放在禱告裡，等主在合適的時候開你的眼睛。聖經與讀經的全卷立場見 ISS00_3；爭議與信心見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：有機的完全默示——聖靈使用先知的整個人，使他們說出的正是神的話；聖經有人的聲音，也完全是神的話，值得完全信靠。全卷立場見 ISS00_3。","care":"若一個人以為聖經只是古人的心得，讀到難處就會自己刪改；若以為聖經是從天上掉下來、與人無關的書，就會忽略背景、斷章取義。陪會眾讀經時先問「當時的讀者聽見甚麼」，再問「神今天對我說甚麼」。對被質疑「聖經有錯」而動搖的年輕人，不必急著給所有答案，先陪他回到這一節：人說出的，是神的話。"},{"id":"ISS02_1","t":"2:1「將來在你們中間也必有假師傅」——今天誰是假師傅？可以點名嗎？","r":"2:1--3；2:10--19；太 7:15--20；提前 5:19--20","ch":[2],"why":"網路上有許多「揭露假師傅」的影片與文章，常常直接點出某位牧者、某個教會或某種神學。會友讀完第 2 章，最自然的問題是：那今天誰是假師傅？我可以、也應該把名字說出來嗎？反過來，甚麼都不說，會不會等於縱容錯謬？這一題牽動教會怎樣面對錯謬與侵害，也牽動每一個人在群組裡轉貼甚麼。","pos":[["【一】經文問的是甚麼","","<p>「將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認」（2:1）。彼得接著描寫他們的樣子：貪心取利（2:3）、隨肉身放縱、膽大任性（2:10）、應許人自由自己卻作奴僕（2:19）。問題是：這段描寫是給教會一份名單，還是一組記號？今天的人可以拿它對號入座到哪一步？<\/p>"],["歷史說：彼得指的是一世紀一群具體的教師","","<p>許多註釋家強調，彼得描寫的是讀者身邊一群具體的人：他們否認主再來與審判（3:4），以自由為名放縱，又在愛筵中取利（2:13）。這一說尊重處境，提醒我們不要把古代的描寫隨手貼在今天的人身上。<\/p><p><strong>難處：<\/strong>若只停在歷史，經文就不再對今天說話；彼得自己說「將來」，是寫給以後的教會，也寫給我們。<\/p>"],["點名說：既然聖經點出假師傅，今天也該公開點名","","<p>部分護教事工與網路頻道認為，公開點名才能保護信徒；他們的關切是真實的——確實有人受害、有人被騙、有人傾家蕩產。<\/p><p><strong>難處：<\/strong>這個做法常把次要教義的分歧升級成「假師傅」，又讓沒有查證的人在不完整的資訊下作判決；結果製造更多分裂，也讓真正的受害者淹沒在口水裡。<\/p>"],["記號說：彼得給的是記號，用來分辨，也用來照自己","","<p>彼得給五個記號，都是果子：對基督、對錢、對身體、對權柄、對自由。這使人想起主的話：「憑著他們的果子，就可以認出他們來」（太 7:16）。記號也分層級：否認主與福音核心，和次要問題上的不同看法，不在同一層。<\/p><p><strong>難處：<\/strong>記號需要時間與群體來分辨，不像名單那樣快；遇到真實的侵害，光談記號不夠，還要有處理的程序。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採記號說：講台教記號，不給名單；不點名今天任何牧者、教會、宗派或網路傳道人為假師傅。<\/strong><\/p><p>遇到身邊真實的錯謬或侵害，照主的次序先私下指出（太 18:15--17），控告長老「非有兩三個見證就不要收」（提前 5:19），查證屬實的在教會程序中處理；不在網路上獵巫，也不因怕衝突而包庇。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你懷疑每一個講台。各說都同意：錯謬是真的，分辨是必要的，審判在主手裡（2:9）。<\/p><p>對你今天最重要的，是先把五個記號照在自己身上，再陪身邊心不堅固的人站穩；把名字交給程序，把審判交給主。分辨假教訓的全卷立場見 ISS00_3。<\/p>"]],"con":[],"say":"本講義的立場：講台教記號，不給名單；分清層級，處理有程序。2:1 的假師傅指否認主、敗壞生活、把人當貨的教師，不是在次要問題上與我們看法不同的弟兄。全卷立場見 ISS00_3。","care":"會眾席上可能有受過屬靈傷害的人，他們需要聽見教會不會用「不要論斷」叫他們閉嘴，他們的經歷值得被認真對待、照程序處理。也可能有愛上「揭露」的人，每天看別人的錯，心慢慢變硬。國度321空中團契散在各國，群組裡一則轉貼很快就傳遍；陪前者找到安全的出口，也溫柔提醒後者：彼得寫第 2 章，是一個被主拉回來的人在呼喊，不是檢察官在起訴。"},{"id":"ISS02_2","t":"2:1「連買他們的主他們也不承認」——基督為最後沉淪的人死了嗎？","r":"2:1；3:9；約 6:37；約一 2:2、19","ch":[2],"why":"「買」原文是奴隸市場付價的字，「主」是有產權的主人。如果主「買」了這些最後「自取速速地滅亡」的人，基督是不是也為最後沉淪的人死了？這一節因此常在有限救贖與普遍救贖之爭中被引用。一位同時聽到兩邊講法的弟兄會問：哪一邊才合聖經？更私人的問題是：主有沒有為我死？","pos":[["【一】經文問的是甚麼","","<p>「連買他們的主他們也不承認，自取速速地滅亡」（2:1）。ἀγοράσαντα（agorasanta）是過去分詞，價已經付了；δεσπότης（despotēs）是有產權的主人。問題是：彼得說這些假師傅被「買」，是在宣告救贖的範圍，還是用另一種語言說話？這一節能不能單獨決定基督為誰而死？兩派的解經家都很認真地處理過這一節。<\/p>"],["普遍救贖說：基督確實為所有人付了價，包括後來否認他的人","","<p>阿米念與衛斯理傳統，也有部分路德宗，認為本節最直接的讀法就是：主為這些人付了價，他們卻否認他，所以沉淪。這與「他為我們的罪作了挽回祭，不是單為我們的罪，也是為普天下人的罪」（約一 2:2）、3:9「不願有一人沉淪」相合。<\/p><p><strong>難處：<\/strong>若主已為每一個人付了全部的價，為甚麼仍有人沉淪？這一說要另外解釋救贖的果效怎樣臨到個人。<\/p>"],["有限救贖說：彼得照他們自己的認信說話","","<p>許多改革宗註釋家認為，彼得是照假師傅自己的宣稱、也照群體眼中的樣子說話：他們口稱被主買贖，在教會中有位分，卻否認這位主，就像「他們從我們中間出去，卻不是屬我們的」（約一 2:19）。也有學者指出，摩西之歌稱神買了以色列全體，這是盟約群體的語言。<\/p><p><strong>難處：<\/strong>經文字面說主「買」了他們，若讀成「他們自稱被買」，需要在文字之外補上一層意思。<\/p>"],["足夠有效說：基督的死足夠於眾人，有效於信的人","","<p>亞目拉督派與部分溫和改革宗試圖兼顧兩邊：基督的死在價值上足夠所有人，福音可以真誠地向所有人傳；在神的旨意與果效上，臨到信的人。照這個讀法，2:1 的假師傅是拒絕了一份真實為他們預備的贖價。<\/p><p><strong>難處：<\/strong>兩邊都有人認為這一說只是換了說法，沒有真正回答「神的旨意到底為誰」的問題。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採並陳：這一節兩派都讀得通，不宜單憑它在講台上裁決救贖的範圍。<\/strong><\/p><p>彼得在這裡要量的不是救贖的範圍，是罪的深度：他們否認的是一位已經付了價的主人。各派都同意三件事：基督的死是真實的付價；假師傅在群體裡面、口稱屬主；人否認主，就自取滅亡。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。不論哪一派，都同意主耶穌親口說的：「到我這裡來的，我總不丟棄他」（約 6:37）。<\/p><p>對你今天最重要的，不是先弄清救贖的範圍，而是回應那位為你付了價的主：「因為你們是重價買來的」（林前 6:20）。爭議與信心的全卷立場見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：2:1 兩派都讀得通，講台不單憑它裁決救贖範圍；彼得量的是罪的深度——他們否認的是付了價的主人。落點是：我是不是活得像被買來的人。全卷立場見 ISS00_9。","care":"救贖範圍的爭論，適合在書房和查經班裡慢慢談，不要變成互相貼標籤的戰場；兩邊都有敬虔愛主、為福音擺上一生的人。若有弟兄姊妹因為這個問題而不安，擔心「主到底有沒有為我死」，把他帶到約 6:37 和 3:9：來到主面前的人，主總不丟棄。爭論可以留著，一個人此刻就可以回應那位付了價的主。"},{"id":"ISS02_3","t":"2:3「要用捏造的言語在你們身上取利」——傳道人的錢、興盛福音與教會財務該怎樣看？","r":"2:3；2:13--15；林前 9:12--14；林後 8:20--21","ch":[2],"why":"華人教會裡，錢的話題常常兩極：一邊有人把傳道人領薪水、教會募款都看成可疑；另一邊有講台宣講「奉獻多少就得回多少倍」，或財務長年不公開。會友讀到 2:3 與 2:14「心中習慣了貪婪」，會問：傳道人可不可以靠事奉生活？甚麼樣的講法才是 2:3 說的取利？教會的錢應該怎樣管？","pos":[["【一】經文問的是甚麼","","<p>「他們因有貪心，要用捏造的言語在你們身上取利」（2:3）。貪心 πλεονεξία（pleonexia）是想要更多；捏造的 πλαστοῖς（plastois）是照聽眾想要的形狀捏出來的。問題是：2:3 定罪的是「有錢」，還是一種特定的作法？今天的教會怎樣才不會成為 2:3 說的那種地方？這一節要人分辨的，是話語和錢之間的關係。<\/p>"],["興盛福音說：信心與奉獻會帶來今生的財富與健康","","<p>持這種講法的人引用約翰三書的祝福與瑪拉基書「試試我」的應許，認為神樂意祝福人的生活，奉獻是打開祝福的鑰匙。長處是提醒神是慷慨的父，關心人的日常。<\/p><p><strong>難處：<\/strong>把屬靈與物質直接換算，奉獻就變成交易；受苦、貧窮的信徒被說成信心不夠，背上不屬於他們的重擔，這正接近「以敬虔為得利的門路」（提前 6:5）。<\/p>"],["供養說：傳道人受供養合乎聖經","","<p>保羅說：「主也是這樣命定，叫傳福音的靠著福音養生」（林前 9:14）。照這一說，把傳道人合理的薪資、教會正當的募款都看成貪心，是不公平的，也會讓忠心的同工長期在經濟上受苦。<\/p><p><strong>難處：<\/strong>這一說若只用來回應批評，容易忽略保羅自己常放下這個權利，親手作工，免得基督的福音被阻隔（林前 9:12）。<\/p>"],["透明說：問題不只在人心，也在管理的方式","","<p>保羅經手耶路撒冷的捐款時，刻意與眾教會選派的弟兄同行，說「我們留心行光明的事，不但在主面前，就在人面前也是這樣」（林後 8:21）。照這一說，對抗 2:3 最好的方法，不是揣測誰的心貪，而是讓帳目公開、有人監督、可以查問。<\/p><p><strong>難處：<\/strong>制度再好，也攔不住一顆貪心；透明是保護，不能取代領袖自己的敬虔。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採供養說與透明說並行：傳道人受供養合乎聖經；2:3 的記號是用捏造的話把人當貨。<\/strong><\/p><p>分辨的問題不是「他有沒有錢」，而是「他的話是不是為了錢而捏的」：用應許換奉獻、用恐懼換奉獻、把祝福標上價錢。本講義不點名任何人，只主張教會先讓自己的帳公開、經手不止一人。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你對所有傳道人起疑心。神沒有把祝福標上價錢，你奉獻後的不順，也不是信心不夠的懲罰。<\/p><p>對你今天最重要的，是存感恩的心甘心奉獻，也溫柔地問清楚錢怎樣進、怎樣出；問清楚不是不信任，是一起行光明的事。分辨假教訓的全卷立場見 ISS00_3。<\/p>"]],"con":[],"say":"本講義的立場：傳道人受供養合乎聖經，不是貪心；2:3 的記號是用捏造的話在人身上取利。本講義不點名任何人，主張教會自己先財務透明。全卷立場見 ISS00_3。","care":"錢的傷害很深，又常說不出口：有人為了「種子奉獻」借了錢，有人奉獻後沒有得到應許的回報，就以為神不愛他。先讓這樣的人知道，他的羞愧可以在小組裡被接住，他的損失可以照正當管道處理。也提醒全團契不要因此對所有同工起疑；忠心的同工需要被供養、被信任。領袖最好的見證，不是說「我不愛錢」，是讓弟兄姊妹隨時看得到帳。"},{"id":"ISS02_4","t":"2:4「就是天使犯了罪」——創世記 6 章的神的兒子們是天使嗎？以諾一書算聖經嗎？","r":"2:4--5；創 6:1--4；猶 6、14--15；伯 1:6","ch":[2],"why":"2:4 一口氣帶出三個問題：天使犯了甚麼罪，是不是創世記 6 章「神的兒子們」與人的女子結合？和合本「丟在地獄」原文是新約只出現一次的字，借自希臘人講最深囚牢的說法，聖經怎麼會用它？猶大書明引以諾一書，彼得的背景也相近，那以諾一書算不算聖經？網路上「巨人族」的影片，常從這一節開始。","pos":[["【一】經文問的是甚麼","","<p>「就是天使犯了罪，神也沒有寬容，曾把他們丟在地獄，交在黑暗坑中，等候審判」（2:4）。ταρταρώσας（tartarōsas）新約僅此一次；「坑」有異文 σιροῖς（坑）與 σειραῖς（鎖鍊），意思相近，都是拘禁與幽暗。彼得的次序天使、洪水、所多瑪，正好是創世記 6、7--8、19 章的次序。問題是：彼得講的是哪一次天使犯罪？他借用的背景有多少權威？<\/p>"],["天使說：創世記 6 章的神的兒子們是墮落的天使","","<p>第二聖殿時期的猶太文獻（以諾一書、禧年書）與多數二世紀教父都這樣讀。理由是：約伯記的「神的眾子」指天使（伯 1:6）；猶大書把不守本位的天使與所多瑪的淫行相連；彼得的次序也吻合創世記。許多新近學者認為彼得與猶大是在這個背景裡說話。<\/p><p><strong>難處：<\/strong>主說復活的人「乃像天上的使者一樣」，不娶也不嫁（太 22:30）；天使怎樣與人結合，經文沒有說明。<\/p>"],["塞特後裔說：神的兒子們是敬虔的塞特一脈","","<p>三世紀的猶流·亞非利加努已經提出這個讀法，後經屈梭多模、奧古斯丁成為主流，加爾文與許多改革宗註釋也採用：創世記 6 章是敬虔的塞特一脈與不敬虔的該隱一脈通婚而敗壞。照這一說，2:4 指天使原初的墮落，不必與創世記 6 章連結。<\/p><p><strong>難處：<\/strong>這一說較難解釋為甚麼彼得的次序正好緊扣創世記 6--19 章，也較難對應猶大書的平行經文。<\/p>"],["原初墮落說：2:4 只說天使起初的背叛","","<p>有些註釋家認為，彼得只是說「連天使犯罪都受審判」，不特指創世記 6 章；天使何時、怎樣犯罪，聖經沒有詳述，不必勉強連結。這個讀法謹慎，也最少依賴聖經以外的文獻。<\/p><p><strong>難處：<\/strong>它較難解釋 2:4--6 與創世記敘事的緊密對應，也沒有回答彼得為甚麼選了這三個例子。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採並陳，傾向彼得借用讀者熟悉的創世記 6 章背景；但他只借背景，不展開天使學的細節。<\/strong><\/p><p>借用不等於列入正典：保羅在雅典也引用希臘詩人（徒 17:28）；以諾一書從未被教會普遍承認為正典，本講義不把它當正典使用。ταρταρώσας 是借字講一個真實的拘禁，經文不提供空間結構，講台不畫陰間地圖。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：天使犯罪是真的，神的審判是真的，連最有能力的受造物也逃不過；爭的只是犯罪的時間與方式。<\/p><p>這個長句的終點是 2:9「主知道搭救敬虔的人」。好奇的問題可以在書房裡謹慎研究，但不要讓它取代主本身。作者、正典與猶大書的全卷立場見 ISS00_1 與 ISS00_6。<\/p>"]],"con":[],"say":"本講義的立場：三說並陳；彼得借讀者熟悉的背景，只為說一句——神沒有寬容。以諾一書不是正典，「丟在地獄」不是一幅陰間地圖，講台不超出經文。全卷立場見 ISS00_1。","care":"這節經文周圍有許多引人好奇的題目，有些弟兄姊妹會在網路上追「巨人族」「墮落天使」的影片，越看越怕，或越看越覺得自己掌握了別人不知道的奧祕。溫柔地把他們帶回彼得的重點：認真看待審判的人，正好最能安心把審判交給神。若有人因為這類內容長期恐懼、失眠，要陪他禱告，必要時協助他尋求專業的幫助，那不是不屬靈。"},{"id":"ISS02_5","t":"2:7「義人羅得」——創世記 19 章的羅得，怎麼算是義人？","r":"2:6--9；創 13:10--13；19:1--38；路 17:32","ch":[2],"why":"彼得一連三次稱羅得為義人（2:7--8）。可是熟悉創世記的人都知道：羅得看見平原滋潤就選了所多瑪，在城門口坐上位子，危急時提議把女兒交出去，天使催促時「遲延不走」，最後在山洞裡醉倒。這樣的人怎麼能稱為義人？這一題也關係到許多住在自己的「所多瑪」裡、懷疑自己還算不算基督徒的人。","pos":[["【一】經文問的是甚麼","","<p>「只搭救了那常為惡人淫行憂傷的義人羅得。（因為那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。）」（2:7--8）。ἐβασάνιζεν（ebasanizen）是未完成式，天天如此。問題是：彼得稱羅得為義，根據是甚麼？是比較出來的，是被算為義的，還是另有定義？這關係到我們怎樣看一個軟弱的人。<\/p>"],["相對說：比起所多瑪人，他是義的","","<p>這一說指出，羅得在城門口接待陌生人，不讓客人受辱（創 19:1--3）；在一座敗壞的城裡，他是唯一還照著亞伯拉罕家規矩待客的人。他的義，是與周圍相比的義。<\/p><p><strong>難處：<\/strong>這一說容易把「義」變成「比別人好一點」，也難以處理羅得提議交出女兒那一幕的嚴重。<\/p>"],["恩典說：羅得蒙救出於神的憐恤與亞伯拉罕的代求","","<p>創世記說得很清楚：羅得被領出來，是因為「耶和華憐恤羅得」（創 19:16），也因為神記念亞伯拉罕（創 19:29）。許多改革宗與福音派註釋家強調，羅得的義是被算為義的義，與亞伯拉罕因信稱義走同一條路。<\/p><p><strong>難處：<\/strong>這一說說明了蒙救的根據，卻沒有說明彼得為甚麼特別用 2:8 描寫羅得內心的傷痛。<\/p>"],["傷痛說：彼得自己給了定義——還會傷痛的心","","<p>彼得在 2:8 說明他稱羅得為義的原因：「他的義心就天天傷痛。」在一座把罪當日常的城裡，他還沒有麻木。這一說不否認羅得的軟弱，只指出：義不是完美，是一顆沒有被所多瑪磨平的心。<\/p><p><strong>難處：<\/strong>若只講傷痛，容易讓人把「心裡還會痛」當成留在罪惡環境的理由，忘了羅得付出的代價。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採傷痛說，並與恩典說合讀：義不是完美，是一顆還會傷痛的心；羅得蒙救的主詞是神。<\/strong><\/p><p>講台不把羅得美化成榜樣，也不嘲笑他。他的一生同時說出兩件事：住錯地方有代價——主說「你們要回想羅得的妻子」（路 17:32）；可是主仍然把一個住錯地方、還會傷痛的人拉了出來。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：羅得的蒙救是神的作為，不是羅得的功勞；他的軟弱沒有被掩蓋，神的憐恤也沒有被收回。<\/p><p>如果你正住在自己的「所多瑪」裡，還會為它痛，就表示你的心還醒著；主知道怎樣把你拉出來（2:9）。只是不要把「還會痛」當成留下來的理由。得救確據的全卷立場見 ISS00_5。<\/p>"]],"con":[],"say":"本講義的立場：義不是完美，是一顆還會傷痛的心；羅得蒙救的主詞是神。講台不美化羅得，也不嘲笑他；住錯地方有代價，主仍然搭救。全卷立場見 ISS00_5。","care":"很多弟兄姊妹活在自己的「所多瑪」裡：一個充滿謊言的職場、一個每天都在試探的螢幕、一個看不到出路的家。他們羞愧地想：我還住在這裡，還算是基督徒嗎？羅得給他們一個安慰、一個提醒：你還會痛，主知道怎樣把你拉出來；但看久了不痛，才是真正的危險。陪他們一起禱告、一起想出具體的一步，而不是丟給他們一句「你應該離開」。"},{"id":"ISS02_6","t":"2:10「輕慢主治」——可以質疑教會領袖嗎？","r":"2:10--12；彼前 5:3；猶 8--9；提前 5:19--20","ch":[2],"why":"在某些教會裡，2:10 被用來回應會友的質疑：「你批評牧師，就是輕慢主治的」「毀謗在尊位的，是假師傅的記號」。一位看見領袖真實問題、卻被這樣回應的弟兄會問：聖經真的禁止我們對教會領袖提出任何質疑嗎？這一題連著許多人的屬靈傷害，也連著教會有沒有安全的問責管道。","pos":[["【一】經文問的是甚麼","","<p>「那些隨肉身、縱污穢的情慾、輕慢主治之人的，更是如此。他們膽大任性，毀謗在尊位的，也不知懼怕」（2:10）。「主治的」κυριότητος（kyriotētos）字根是「主」；「在尊位的」δόξας（doxas）原文是「榮耀者」。問題是：這兩個詞指的是主、天上的權勢，還是人間的領袖？答案決定這一節能不能拿來回應會友的質疑。<\/p>"],["主權說：「主治的」指主自己的權柄","","<p>多數新近註釋認為，κυριότητος 是單數抽象名詞，緊接著 2:1「不承認買他們的主」，最自然的意思是：他們輕慢的是主自己的主權。猶大書 8 節的平行經文也朝同一個方向。<\/p><p><strong>難處：<\/strong>這一說解釋了「主治的」，但「在尊位的」是複數，需要另外說明指的是誰。<\/p>"],["天上權勢說：「在尊位的」指天上的榮耀者","","<p>2:11 立刻說「就是天使……還不用毀謗的話在主面前告他們」，可見「在尊位的」最自然指天上的榮耀者，可能是墮落的天使；對照猶大書天使長米迦勒只說「主責備你吧！」（猶 9）。照這一說，本節講的是假師傅隨口毀謗他們不懂的屬靈世界。<\/p><p><strong>難處：<\/strong>為甚麼毀謗墮落的天使也算罪，需要細心說明：重點是狂妄，不是替邪靈說話。<\/p>"],["人間領袖說：「在尊位的」指教會或社會的領袖","","<p>有些講道與較早的註釋把「在尊位的」讀成人間的領袖，常與大衛不肯伸手害耶和華受膏者的故事連在一起，勸人尊重領袖。這一說提醒我們不可隨意詆毀人，新約也要人敬重帶領的人（來 13:17）。<\/p><p><strong>難處：<\/strong>若用來禁止一切質疑，就與上下文衝突：第 2 章被定罪的，正是「師傅」——在上位的人。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採主權說與天上權勢說：2:10 不是一節替人間權威護航的經文，不能拿來堵住對領袖的正當質疑。<\/strong><\/p><p>沿用彼得前書講義的立場：彼得給長老的命令是「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。分辨質疑與毀謗看三件事：內容是否屬實、動機是否出於愛、方法是否照程序（提前 5:19--20）。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該讓你不敢開口，也不該讓你隨口詆毀。庇哩亞人天天考查聖經，「要曉得這道是與不是」（徒 17:11），是被稱讚的。<\/p><p>2:10 仍有一面是對我們說的：「膽大任性」是以自己為樂。質疑之前，先問自己是在追求真理，還是在取悅怒氣。分辨假教訓的全卷立場見 ISS00_3。<\/p>"]],"con":[],"say":"本講義的立場：「主治的」最自然指主的權柄，「在尊位的」指天上的榮耀者；第 2 章被定罪的正是師傅。2:10 不能堵住正當質疑，回指彼前 5:3「不是轄制」。全卷立場見 ISS00_3。","care":"有人因為提出問題，被冠上「悖逆」「輕慢主治」，從此不敢再開口，甚至離開教會、懷疑信仰。讓這樣的人知道：照真理、在愛中、按程序提出的質疑不是罪，他的聲音值得被聽見；若有侵害，協助他尋求公正的處理與專業的幫助。也為領袖禱告：被正當糾正時，最好的回應是謙卑，不是引用 2:10。保羅曾當面抵擋彼得（加 2:11），彼得後來仍稱他「我們所親愛的兄弟」（3:15）。"},{"id":"ISS02_7","t":"2:11「還不用毀謗的話在主面前告他們」——基督徒可以「斥責魔鬼」嗎？","r":"2:10--12；猶 8--10；雅 4:7；路 10:19","ch":[2],"why":"猶大書的平行經文更具體：天使長米迦勒與魔鬼爭辯時，不敢用毀謗的話罪責他，只說「主責備你吧！」許多教會的禱告會裡，常聽到「我奉主名捆綁你、斥責你」。有人因此問：連天使長都不敢罪責魔鬼，我們可以嗎？這是不是 2:12 說的「毀謗所不曉得的事」？這一題常把華人教會分成兩群。","pos":[["【一】經文問的是甚麼","","<p>「就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們」（2:11）。「在主面前」原文 παρὰ κυρίῳ（para kyriō），審判留在主那裡。接著 2:12 說：「他們毀謗所不曉得的事。」問題是：這一節是在教導信徒怎樣禱告，還是在揭露假師傅的狂妄？它對今天的屬靈爭戰說了甚麼？<\/p>"],["權柄說：信徒奉主名有抵擋魔鬼的權柄","","<p>靈恩與第三波傳統指出，主差遣門徒時說，已經給他們「權柄可以踐踏蛇和蠍子」（路 10:19），保羅也奉耶穌基督的名吩咐污鬼出來（徒 16:18）。他們提醒：若因為 2:11 而對屬靈爭戰退縮，就忽略了新約的另一面。<\/p><p><strong>難處：<\/strong>這一說在實踐上容易把焦點從主移到魔鬼身上，禱告變成長篇喊話，甚至去研究邪靈的名字與等級。<\/p>"],["謹慎說：把審判交給主，順服神、抵擋魔鬼","","<p>這一說強調 2:11 與猶大書 9 節的模式：連天使長都不自己宣判，只說「主責備你吧！」屬靈爭戰的方式是順服神，「務要抵擋魔鬼」（雅 4:7），穿戴神所賜的全副軍裝，而不是與邪靈對話、嘲弄、喊話。<\/p><p><strong>難處：<\/strong>這一說若講過頭，會讓正受攪擾的人以為不可以奉主名禱告，反而更害怕、更孤單。<\/p>"],["對象說：2:11 揭露的是假師傅的狂妄，不是規定禱告用語","","<p>也有註釋家指出，2:10--12 的重點不在教導信徒怎樣禱告，而在揭露假師傅：他們自以為有屬靈知識，對屬靈世界輕率、狂妄。照這一說，本節的應用是謙卑與敬畏，不是直接禁止某一種禱告用語。<\/p><p><strong>難處：<\/strong>這一說說明了上下文，卻沒有直接回答今天禱告會裡常見的問題，還需要配合新約別處的教導。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採謹慎說，並以對象說校正：2:11 教的是謙卑，連力量更大的天使都把審判交給主。<\/strong><\/p><p>奉主名抵擋魔鬼合乎聖經，但焦點在主，不在魔鬼；不嘲弄、不毀謗、不與邪靈對話、不對屬靈世界作超出聖經的猜測。禱告時說「奉主耶穌的名，你離開」，和把魔鬼當表演對象，是兩回事。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。各說都同意：主比一切權勢更大，魔鬼要被抵擋，最後的審判在主手裡；爭的是方式與焦點。<\/p><p>你的安全不在禱告的音量或用語，而在那位「知道搭救敬虔的人」的主（2:9）。屬靈的狂妄本身就是有己。爭議與信心的全卷立場見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：2:11 教的是謙卑；奉主名抵擋魔鬼合乎聖經，但焦點在主，不在魔鬼，不嘲弄、不與邪靈對話、不超出聖經猜測。全卷立場見 ISS00_9。","care":"這一題常把人分成兩群：一群覺得另一群太誇張，另一群覺得這一群沒有能力。幫助兩邊都回到 2:9 與 2:11 的中心：主是搭救者，也是審判者。對正在受驚嚇、覺得被邪惡攪擾的人，不要先跟他爭論禱告用語，先陪他、為他禱告，讓他知道主比一切更大；若有長期的恐懼、失眠或其他身心困擾，也協助他尋求醫療與專業幫助，那不是不屬靈。"},{"id":"ISS02_8","t":"2:16「那不能說話的驢以人言攔阻先知的狂妄」——怎樣讀聖經裡的神蹟？","r":"2:15--16；民 22:21--35；1:16","ch":[2],"why":"這件事出自民數記 22 章：巴蘭騎驢去見摩押王，驢三次避開持刀的使者，巴蘭三次打驢，最後「耶和華叫驢開口」（民 22:28）。現代讀者讀到驢說人話，常常會笑，或覺得像童話。一位讀過一些聖經批判學的大學生會問：彼得真的相信驢說了人話嗎？如果這是寓言，其他神蹟呢？","pos":[["【一】經文問的是甚麼","","<p>「巴蘭就是那貪愛不義之工價的先知，他卻為自己的過犯受了責備；那不能說話的驢以人言攔阻先知的狂妄」（2:15--16）。SBLGNT 作 Βοσόρ，和合本照民數記作「比珥」，指的是同一個人。問題是：彼得把這件事當作歷史、異象，還是寓言？讀聖經的神蹟，該先問甚麼？<\/p>"],["歷史說：這是真實發生的神蹟","","<p>民數記把這件事放在歷史敘事裡，彼得也把它與天使、洪水、所多瑪並列。民 22:28 的主詞是耶和華：不是驢有了說話的能力，是創造萬物的神暫時藉驢說話。若承認神是創造主、承認基督從死裡復活，一頭驢說話並不更難。<\/p><p><strong>難處：<\/strong>這一說需要誠實面對現代讀者的疑問，不能只用「信就對了」打發，也要說明經文確實用了諷刺的筆法。<\/p>"],["異象說：巴蘭在異象或內在經驗中聽見","","<p>有些解經家，包括少數古代猶太註釋，認為巴蘭是在異象中「聽見」驢說話，就像先知在異象中看見、聽見。這一說仍然承認神超自然的介入，只是對發生的方式有不同理解。<\/p><p><strong>難處：<\/strong>民數記的敘事沒有任何異象的標記，驢的話也被巴蘭當面回答；讀成異象，需要在經文之外加上框架。<\/p>"],["寓言說：這是諷刺外邦術士的民間故事","","<p>部分歷史批判學者認為，巴蘭的故事是古代流傳的故事，用幽默的方式諷刺一個外邦術士，不必當作歷史事件。他們的關切是文學體裁，提醒我們留意作者的筆法。<\/p><p><strong>難處：<\/strong>這一說若一路推下去，往往連新約的神蹟、甚至復活也歸為傳說，與彼得「並不是隨從乖巧捏造的虛言」（1:16）的立場正面衝突。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採歷史說：照民數記與彼得的記載，把它當作真實的神蹟來讀，主詞是神；同時承認經文用了諷刺的筆法。<\/strong><\/p><p>彼得的重點不在驢，而在對比：自以為有屬靈知識的人「好像沒有靈性，生來就是畜類」（2:12），不能說話的畜類卻說出清醒的話——被錢沖昏頭的先知，比一頭驢還不清醒。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。讀神蹟的次序是：先問體裁與作者的意思，再承認神是創造主、能在他的世界裡行事；神蹟的可信，最後繫在基督的復活上。<\/p><p>也別讓這段只剩趣味：巴蘭三次打驢，不知道驢救了他的命；神今天的「驢」，可能是一個一再受阻的計畫。被攔住時，先問自己正往哪裡走。爭議與信心的全卷立場見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：照民數記與彼得的記載，驢說話是真實的神蹟，主詞是神；經文同時用了諷刺：被錢沖昏頭的先知，不如一頭驢清醒。全卷立場見 ISS00_9。","care":"對正在面對知識挑戰的年輕人，不要用「不要問那麼多」把問題壓下去；他們需要看見，基督徒可以誠實地面對問題，又不失去信心。可以陪他們從最核心的地方開始：基督的復活是不是真的？若有人帶著真誠的疑問來，約他單獨談，推薦好的入門書，讓問題在信任的關係裡慢慢被處理，而不是在群組裡被嘲笑或被打發。"},{"id":"ISS02_9","t":"2:20「他們末後的景況就比先前更不好了」——信徒會失去救恩嗎？跌倒的人還能回來嗎？","r":"2:17--22；1:9--10；3:9、17；約一 2:19","ch":[2],"why":"2:20--22 用了本卷描寫得救的同一個字「認識」，又接著兩句俗語：狗轉過來吃所吐的，豬洗淨了又回到泥裡滾。這使經文更沉重：一個真正認識過主的人，會不會失去救恩？一位跌倒的弟兄讀到這裡，會問：我是不是就是那條狗？本條回指 ISS00_5，只補本章經文的細節。","pos":[["【一】經文問的是甚麼","","<p>「倘若他們因認識主－救主耶穌基督，得以脫離世上的污穢，後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了」（2:20）。「認識」ἐπίγνωσις（epignōsis）在 1:2--3、1:8 都是得救的認識，這使問題更尖銳。問題是：2:20 的「他們」是誰？這段話是在描寫真信徒失落，還是另有所指？這一題不只是神學，也是牧養。<\/p>"],["可失落說：真信徒可能失去救恩","","<p>阿米念傳統指出，2:20 用的是本卷描寫得救的同一個字，「脫離」與 1:4「脫離世上從情慾來的敗壞」是同一個動詞；這些描寫看起來是真實的得救經歷，後來被纏住、制伏，就失去了原有的地位。這一說嚴肅看待經文的用字。<\/p><p><strong>難處：<\/strong>它較難與 1:10「就永不失腳」的應許並讀，也容易叫敏感的良心長期活在不安裡。<\/p>"],["從未重生說：他們有過外面的洗淨，卻沒有新的本性","","<p>加爾文傳統指出 2:22 的比喻正是重點：狗回到所吐的，因為牠本來是狗；豬洗淨了還是豬。他們有知識、有群體生活，卻沒有新生命。這與「他們從我們中間出去，卻不是屬我們的」（約一 2:19）相合。<\/p><p><strong>難處：<\/strong>這一說若被誤用，會讓人去猜測別人「是不是從來沒有得救」，或讓人反覆懷疑自己的重生。<\/p>"],["保守工具說：警告是神保守信徒的方法","","<p>許多福音派認為，警告本身是真實的，神正是藉著這樣真實的警告，保守屬他的人不至「從自己堅固的地步上墜落」（3:17）。警告不是用來測量別人，而是用來叫自己警醒；應許與警告同時為真。<\/p><p><strong>難處：<\/strong>這一說沒有直接回答「真的會不會失落」，對想要確定答案的人來說，像是把問題放回張力裡。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義三讀並陳，落點在上下文：2:20 的「他們」接續 2:17--19，是應許人自由、自己卻作奴僕的假師傅，和完全跟從他們轉背的人。<\/strong><\/p><p>這段話不是用來恐嚇在掙扎中跌倒、仍然想回頭的弟兄姊妹，本講義也絕不對任何人宣判「你已經沒救了」。2:22 的「轉過來」，和主對彼得說「你回頭以後」是同一個字：回頭有兩種方向。<\/p>"],["【四】這件事該不該影響你的信心","","<p>一個會因為怕自己是那條狗而流淚的人，正是心還沒有剛硬的人。主耶穌說：「到我這裡來的，我總不丟棄他」（約 6:37）。<\/p><p>彼得自己就是被主等回來的人。跌倒的人要同時聽見 1:9「舊日的罪已經得了潔淨」與 3:9「乃願人人都悔改」：主還在等。得救確據與背道的全卷立場見 ISS00_5。<\/p>"]],"con":[],"say":"本講義的立場：三讀並陳；2:20--22 描寫的是假師傅與跟從他們轉背的人，不是掙扎中想回頭的人。對自己是警醒，對別人不是判決。全卷立場見 ISS00_5。","care":"講這段經文之前，先問：坐在下面的是誰？若是一位剛跌倒、很想回來的弟兄，就把他帶回 1:9 與 3:9，告訴他寫這段話的彼得自己也曾跌倒，主卻把他等了回來。也提醒全團契，「狗」和「豬」是彼得描寫假師傅本性的比喻，不是給跌倒的人取的綽號。陪他禱告，陪他走回小組，比任何神學辯論都更接近這段經文的心意。"},{"id":"ISS03_1","t":"3:4「主要降臨的應許在哪裡呢」——兩千年了，主還會來嗎？","r":"3:3--4；3:8--10；太 24:36","ch":[3],"why":"3:4 是譏誚的人的話，可是今天它常常不是從譏誚的人口中說出來，而是從等了很久的信徒心裡冒出來。新約一再說結局近了，兩千年過去，主還沒有來。有人因此說早期教會預期落空；也有人每隔幾年就宣告一次「這次真的快了」。一位認真的弟兄會問：主還會來嗎？為甚麼這麼久？","pos":[["【一】經文問的是甚麼","","<p>譏誚的人說：「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣」（3:4）。他們的邏輯是：從來沒有變，所以將來也不會變。彼得的回答有三步：神的話創造過、審判過（3:5–7）；主看時間和我們不同（3:8）；主的慢是寬容（3:9）。問題是：「延遲」是教會的難堪，還是主早就告訴門徒的處境？<\/p>"],["延遲危機說：第一代教會預期落空，後來才改口","","<p>部分近代學者主張，第一代基督徒預期主在他們有生之年回來，主沒有來，教會陷入危機；彼得後書第 3 章就是後來的教會為了化解這個危機而寫的。持此說的人常把「列祖」讀成已經過世的第一代信徒。這一說提醒我們：延遲的問題在新約裡確實存在，教會沒有迴避它。<\/p><p><strong>難處：<\/strong>主自己的比喻裡早就有「主人來得遲」、新郎遲延的情節；延遲不是後來才發現的意外。而且這一說常連帶主張本書託名晚出，與本講義採使徒彼得為作者的立場不同（見 ISS00_1、ISS00_7）。<\/p>"],["迫近與不知何時並存說：主必快來，日子沒有人知道","","<p>新約從一開始就同時說兩件事：主必再來，而且那日子連天上的使者也不知道，惟獨父知道（太 24:36）。「快」主要說的是確定與隨時，不是一個近在眼前的日期。所以每一代都活在「可能就是今天」之中，也都不必知道是哪一天。這一說與彼得 3:8–10 的三步最相合。<\/p><p><strong>難處：<\/strong>若只強調「隨時」，容易被講成焦慮的倒數；若只強調「不知何時」，又容易滑成實際上不再等候。兩面要一起講，缺一面都會走偏。<\/p>"],["過去派：主的日子已在主後 70 年應驗","","<p>全然過去派主張，主的再來、復活與審判都已在主後 70 年耶路撒冷被毀時以審判的方式應驗，所以不必再等（本講義不採）。部分過去派只把橄欖山講論等部分預言放在主後 70 年，仍然相信主將來親自再來，這在福音派中可以並存討論。<\/p><p><strong>難處：<\/strong>全然過去派與本章直接衝突：3:13 的新天新地、有義居在其中，顯然還沒有來到；3:10 的主的日子是對全地的顯露，不是一城的毀滅。部分過去派則要小心，不把本章的再來也一併算進主後 70 年。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採迫近與不知何時並存說：主一定會親自回來；不定時間表，隨時預備。<\/strong><\/p><p>延遲不是教會的難堪，是神的寬容：從人的位置看叫「耽延」，從主那裡看叫「寬容」（3:9）。彼得給等候的人的第一個武器不是論證，是記得：譏誚的人「故意忘記」（3:5），信徒「不可忘記」（3:8）。全然過去派本講義不採；部分過去派可以並陳。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。主還沒有來，不是應許落空，是主還在等人回家；寫這句話的彼得，自己就是被主等回來的人。<\/p><p>錯的是一次又一次落空的時間表，不是主的應許。你不必因為有人定錯了日子，就連真正的盼望也一起丟掉。全卷立場見 ISS00_4。<\/p>"]],"con":[],"say":"本講義的立場：主一定會親自回來；新約同時說主必快來與日子沒有人知道。延遲是主的寬容，不是應許落空；全然過去派本講義不採，部分過去派可以並陳。全卷立場見 ISS00_4。","care":"「應許在哪裡呢」最痛的版本，常常不是關於末日，是關於自己：等了十年的家人還沒信主，等了很久的醫治還沒來。不要急著責備這份累，彼得也沒有責備；陪他一起讀 3:9，告訴他寫這句話的人自己就是被等回來的。也要提醒散在各國的弟兄姊妹：被末日時間表傷過的人，錯的是那張表，不是主；等候最需要的不是一個日期，是一個一起禱告、一起去找還沒回家的人的群體。"},{"id":"ISS03_2","t":"3:5--7「從水而出、藉水而成的地」——與創造論和科學怎樣對話？","r":"3:5--7；創 1:1--10；來 11:3","ch":[3],"why":"3:5–7 連到創世記第 1 章的創造與第 6–8 章的洪水。華人教會裡，創造論很容易起爭執：有人認為只有年輕地球才忠於聖經，有人接受宇宙與地球有很長的年歲，也有人接受演化是神創造的方法。於是有人想用這三節經文支持自己，或裁判別人。問題是：彼得在這裡要講的到底是甚麼？","pos":[["【一】經文問的是甚麼","","<p>譏誚的人說「萬物與起初創造的時候仍是一樣」（3:4），彼得回答：「他們故意忘記，從太古，憑神的命有了天，並從水而出、藉水而成的地」（3:5）。世界並不是靠自己的穩定存在：它憑神的話而有，也曾因神的話被水審判，「現在的天地還是憑著那命存留」（3:7）。問題是：這三節是在回答地球的年齡，還是在回答誰托住世界？<\/p>"],["年輕地球說：創造的日是一般的日子，洪水是全球性的","","<p>主張創世記第 1 章的「日」是一般的日子，地球與宇宙約有數千年到一萬年的歷史；挪亞的洪水遍及全地，許多地層由洪水形成。持此說的人常引 3:5–6，指出彼得把洪水當作與創造同樣真實的歷史。出發點是高舉聖經的權威與歷史性。<\/p><p><strong>難處：<\/strong>3:5–7 本身沒有說地球幾歲，也沒有討論地層；用它作年輕地球的證據，是讓經文回答它沒有問的問題。而且若把這一說當成「信不信聖經」的分界線，會把許多同樣高舉聖經的弟兄姊妹推到門外。<\/p>"],["古老地球說：宇宙年歲很長，神直接創造","","<p>接受宇宙與地球有很長的年歲，同時相信神直接創造；解釋創世記時有日年說、間隔說、漸進創造說等。對 3:5–6，多半同意洪水是真實的歷史審判，對範圍是全地還是當時人類所居之地看法不一。出發點是神的話與神的作為不會互相矛盾。<\/p><p><strong>難處：<\/strong>有些人用 3:8「一日如千年」替長年歲作證，這同樣是把比喻當公式（見 ISS03_3）；而且若把科學的結論當成解經的主人，也可能讓經文失去自己說話的空間。<\/p>"],["文學架構說與演化創造說：六日是神學架構，重點在誰創造","","<p>文學架構說認為六日是神學性的架構：前三日造領域，後三日充滿領域，重點在誰創造、為何創造。演化創造說接受生物演化是神護理與創造的方法，同時堅持神是創造主、人有神的形像、人真實墮落。兩者都強調聖經不是現代科學的教科書。<\/p><p><strong>難處：<\/strong>這兩說要說明亞當與墮落的歷史性怎樣安放，這是福音派內部仍在討論、也必須認真面對的問題；若處理得太輕，會碰到福音的核心。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義不在講台上裁判年輕地球或古老地球，也不裁判其他創造觀；各說並陳。<\/strong><\/p><p>不論採哪一說，彼得的論證都一樣：世界的穩定不是神缺席的證明，正是神的話還在托住它。同樣的水，在同一個話底下，可以是創造的材料，也可以是審判的工具。共識有三：天地是藉神的話造成的（來 11:3）；洪水是神真實的審判；現在的世界憑神的話存留。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。敬虔愛主、高舉聖經的弟兄姊妹在這一題上看法不同；這不是信仰的分界線。<\/p><p>你可以認真研究受造界，那正是在研究神的作為；你的信心建立在那位憑話創造、也憑話托住萬有的主身上。爭議與信心的全卷立場見 ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：3:5–7 的焦點是神的話創造、審判、托住世界，不是地球的年齡；講台不以這三節裁判年輕地球或古老地球，各說並陳，守住三點共識。","care":"這個題目最常傷人的不是答案，是態度。有讀理工的年輕人因為聽到「接受古老地球就是不信聖經」而離開；也有長輩因為在小組被笑「還相信六日」而不再開口。兩種都是不必要的絆倒。陪正在科學與信仰之間掙扎的學生讀 3:5–7，讓他看見彼得在乎的是誰托住世界；小組可以熱烈討論，但不要把它變成誰屬靈、誰不屬靈的尺。"},{"id":"ISS03_3","t":"3:8「主看一日如千年」——可以用來算末日或算創造的日子嗎？","r":"3:8；詩 90:4；徒 1:7","ch":[3],"why":"3:8 大概是全卷最常被拿來做數學的一節。有人用它排列世界歷史、推論主再來的年份；也有人用它說創世記的一日可以是一千年，藉此調和創造與科學。兩種用法方向相反，卻有一個共同點：都把這節經文當作換算公式。問題是：彼得引詩篇第 90 篇，到底要說甚麼？","pos":[["【一】經文問的是甚麼","","<p>「親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日」（3:8）。摩西在詩 90:4 說：「在你看來，千年如已過的昨日，又如夜間的一更。」詩篇只說一個方向，彼得加上另一個方向。「如」原文 ὡς，是比喻。問題是：兩個方向都說，是要給人一把尺，還是要把尺拿走？<\/p>"],["世界週說：六日對應六個千年，第七個千年是安息","","<p>早期作品如《巴拿巴書》把創造的六日比作六段一千年的世界歷史，第七段是安息，常與千禧年連在一起。歷代都有人沿著這條路計算世界的年歲與主再來的時間。這一說的出發點，是想在歷史裡看見神的次序（本講義不採）。<\/p><p><strong>難處：<\/strong>3:8 兩個方向都說，正是為了取消換算；而且歷史上每一次照這樣定出的日子都落空了，留下許多辭職、賣房、信心受傷的人。3:10「像賊來到」也明說不預告時間。<\/p>"],["創造日長度說：創世記的一日可以是一千年或更長","","<p>有些古老地球的支持者引 3:8，說創世記的一日可以是很長的時期。創造日的長度本身是可以討論的題目，福音派內部也有不同看法（見 ISS03_2）。<\/p><p><strong>難處：<\/strong>3:8 的上下文講的是主再來的「慢」，不是創造日；用它作創造日長度的證據，同樣是把比喻當公式。創造日要從創世記本身討論，不能借這一節定案。<\/p>"],["換位說：從主那裡看時間，他不被時間拖慢，也不被時間催促","","<p>多數解經家的讀法：「主看」原文是「在主那裡」。彼得不給我們一支新的鐘錶，他把我們帶到主那裡看時間。千年如一日——漫長的等候在主看來並不長，他沒有遺忘；一日如千年——主可以在一日之內成就人以為要千年的事。兩面都把人帶到 3:9：主的慢不是無能，是寬容。<\/p><p><strong>難處：<\/strong>若只講「神超越時間」，可能變成抽象的哲學，好像等候的苦不算甚麼；所以必須緊接著講 3:9 的寬容，讓等候的人知道主在等的是人。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採換位說：3:8 不是換算公式，是一次換位；本講義不用它算末日，也不用它算創造日。<\/strong><\/p><p>兩個方向都說，正是取消換算。主耶穌說那時候、日期不是門徒可以知道的（徒 1:7），彼得的這一節與主的話同一個方向。從人的位置換到主的位置，從暫時換到永恆；換過來以後看見的，不是一張表，是一顆寬容的心。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你不需要知道主哪一天來，才能好好等候；你需要知道的是，他不會忘記。<\/p><p>如果你曾被末日時間表傷過，那是人的錯，不是主的錯；不算日子，不等於不盼望。主一定會來，像賊一樣，所以每一天都可以是預備的日子。全卷立場見 ISS00_4。<\/p>"]],"con":[],"say":"本講義的立場：3:8 不是換算公式，兩個方向都說正是取消換算；本講義不用它推算末日的日子，也不用它定創造日的長度。它把我們帶到主那裡看時間。","care":"華人教會裡，不少弟兄姊妹被末日時間表傷過：有人為了某一年辭職、賣房，日子過了，信心也跟著垮了；也有人從此對一切講末世的信息起了戒心，連主再來都不敢提。對前一種人，要說錯的是那張表，不是主的應許；對後一種人，要說不算日子不等於不盼望。把會眾從「算」帶到「等」，再從「等」帶到「活」：「你們為人該當怎樣聖潔，怎樣敬虔」（3:11）。"},{"id":"ISS03_4","t":"3:9「不願有一人沉淪」——那為甚麼不是人人得救？","r":"3:9；3:7、15；提前 2:4；創 18:25","ch":[3],"why":"如果神不願有一人沉淪，為甚麼還有人沉淪？這節經文常被放進揀選的辯論：一邊用它證明救恩向所有人敞開，一邊指出「寬容你們」的上下文；也有人用它主張人人終必得救。一位為家人信主禱告多年的姊妹讀到這裡，會問：神既然不願意他沉淪，為甚麼他到現在還不信？","pos":[["【一】經文問的是甚麼","","<p>「其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改」（3:9）。「不願」原文 βούλομαι，是心意、意願；同一段又說「不敬虔之人受審判遭沉淪」（3:7）。問題是：神不願意的事，為甚麼還會發生？這節經文在上下文裡，是要裁決揀選的系統，還是要解釋主為甚麼還沒來？<\/p>"],["普世救恩心意說：神願萬人得救，人可以拒絕","","<p>阿米念與衛斯理傳統的讀法：3:9 說出神真實的心意，與「他願意萬人得救，明白真道」（提前 2:4）、「我斷不喜悅惡人死亡，惟喜悅惡人轉離所行的道而活」（結 33:11）一致。神以先在的恩典使人能回應，人可以接受，也可以拒絕；不是人人得救，原因在人的拒絕。<\/p><p><strong>難處：<\/strong>若講得過頭，容易讓救恩看起來最後取決於人的決定，淡化了救恩完全出於神的恩典；也要說明神的心意與人的拒絕怎樣同時成立。<\/p>"],["選民說：「寬容你們」的「你們」是神的子民","","<p>改革宗一派（如歐文）的讀法：本節說「寬容你們」，對象是收信的信徒；「不願有一人」「人人」最自然地限於「你們」之中——神延遲審判，是要把他所有的子民都召齊，一個也不失落。這一說守住救恩完全出於神主權的恩典，神的旨意不會落空。<\/p><p><strong>難處：<\/strong>這一讀若處理不好，會讓 3:9 的溫度變冷，好像神的寬容只向少數人；而且同卷 2:1 說假師傅「不承認買他們的主」，彼得的語言常比系統更寬。<\/p>"],["兩種旨意說：神真實地不喜悅人沉淪，也在主權中揀選","","<p>改革宗另一派分辨神「所喜悅的心意」與「主權的定旨」：神真誠地邀請每一個人，不喜悅任何人沉淪；同時他在主權中揀選、施恩。兩者如何協調，聖經沒有完全說明，隱祕的事屬於神。這一說同時保留 3:9 的溫度與揀選的教義。<\/p><p><strong>難處：<\/strong>有人覺得這是把矛盾藏起來；它要求我們承認自己理解的極限，不把聖經沒有說完的事說完。<\/p>"],["普救論：人人終必得救","","<p>主張神的愛最後必勝過一切，人人終必得救，或在審判之後終必得救（本講義不採）。<\/p><p><strong>難處：<\/strong>這與同一段經文直接衝突：3:7 明說「不敬虔之人受審判遭沉淪」，沉淪與 3:9 的「沉淪」同一字族。彼得說神不願意，不是說這件事不會發生；正因為審判是真的，神的寬容才顯得寶貴。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義將揀選與普世救恩的讀法並陳，不在講台上裁判系統；普救論本講義不採。<\/strong><\/p><p>不論採哪一說，3:9 至少說出三件事：神不願有人沉淪，這心意是真實的；救恩完全出於恩典；這節經文的工作是解釋主為甚麼還沒來——他在等人悔改。不要用系統冷卻這節經文的溫度，也不要用它取消 3:7 的審判。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。神比你更不願意你的家人沉淪；你在等，神也在等，而且他等得比你更久。<\/p><p>不論你在揀選上採哪一種理解，寫這節經文的彼得自己就是被主寬容等回來的人，我們也是；你的禱告沒有白費，它正落在主自己的心意裡。全卷立場見 ISS00_5、ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：揀選與普世救恩各家並陳，講台不裁判系統；3:9 說出神真實不願人沉淪的心意，解釋主為甚麼還在等；普救論不採，也不用 3:9 取消審判。","care":"這節經文最寶貴的用途，是給等候的人力氣，不是給辯論的人彈藥。對為家人禱告多年的弟兄姊妹，可以說：還沒有答案，不是神不在乎，是他還在寬容。若有人的親人沒有信主就過世，被這一節刺痛，不要對他講道理，先陪他難過；我們不替神斷定任何亡者的去處，「審判全地的主豈不行公義嗎」（創 18:25）？把那位親人，也把這份痛，交在不願有一人沉淪的主手裡。"},{"id":"ISS03_5","t":"3:10「地和其上的物都要燒盡了」——「燒盡」還是「顯露」，異文怎樣影響理解？","r":"3:10；3:14；林前 3:13","ch":[3],"why":"和合本作「地和其上的物都要燒盡了」，可是較新的譯本或希臘文校勘本，會看到「都要被顯露」，甚至「不被發現」。這是新約最難的異文之一。一位弟兄查經時發現自己的聖經和別人的不一樣，很容易慌：到底哪一個才是神的話？這會不會影響我們對末日與受造界的理解？","pos":[["【一】經文問的是甚麼","","<p>3:10 最後一個動詞，古代抄本有好幾種寫法。這不是翻譯的問題，是抄本的問題：譯者先要決定原文是哪一個字，才能翻譯。問題是：各種讀法的見證是甚麼？本講義採哪一讀？最要緊的是，不論採哪一讀，這一節要我們明白的是甚麼？<\/p>"],["κατακαήσεται「必燒盡」：和合本、欽定本所依","","<p>見證有亞歷山大抄本（A）、048 及拜占庭多數抄本，是公認經文與多數本的讀法；和合本「燒盡了」、欽定本都照這一讀。意思清楚，與 3:7、3:12 的火一致。和合本忠實地翻譯了它所依據的抄本。<\/p><p><strong>難處：<\/strong>見證多屬較晚的抄本；正因為意思清楚，很可能是抄寫者把難句改得容易明白。<\/p>"],["εὑρεθήσεται「必被發現／被顯露」：SBLGNT 所採","","<p>見證有西乃抄本（א）、梵蒂岡抄本（B）、K、P、1739 等最早、最好的抄本，又是較難的讀法——其他各讀都容易解釋成從它改出來的。SBLGNT 與韋斯科特－霍特本採此讀。意思有三解：在神的審判面前被攤開、無所隱藏；讀作問句「還會被找到嗎」；經過火煉之後被找著、存留下來。<\/p><p><strong>難處：<\/strong>句子本身很難，三種解法都有人主張；而且直接接在「燒盡」的畫面後面，乍讀不容易明白。<\/p>"],["οὐχ εὑρεθήσεται「必不被發現」：NA28 所採","","<p>加上否定詞的讀法，見證主要是部分撒希地科普特文與敘利亞文譯本。大型校勘本（ECM）的編者認為它最能解釋其他各讀的來源，NA28 與 UBS5 因此採用；意思接近「不復存在」。<\/p><p><strong>難處：<\/strong>希臘文抄本幾乎沒有直接支持，主要靠早期譯本；許多學者認為證據不足。<\/p>"],["其他讀法：消失、已經解散、略去","","<p>C 抄本作 ἀφανισθήσονται（必消失）；最早的蒲草紙抄本 𝔓72 作 εὑρεθήσεται λυόμενα（必被發現已經解散）；Ψ 與部分拉丁文武加大譯本略去這一句。另有學者提出各種推測校勘。這些讀法顯示，古代抄寫者也覺得這一句難，努力想把它說清楚。<\/p><p><strong>難處：<\/strong>這些讀法見證零散，各自只有一兩個支持，很難成為原文；但它們正好幫助我們看見原文最早的樣子大概很難懂。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義完整並陳各讀，解經採 SBLGNT 的 εὑρεθήσεται，取「在神的審判面前被顯露」。<\/strong><\/p><p>這與「各人的工程必然顯露」（林前 3:13）一致，也與四節之後 3:14「安然見主」（原文「被他找到」）同一個動詞。講台用和合本「燒盡了」時，不說和合本譯錯了：這是抄本的異文，不是翻譯的錯誤。兩讀都不是神丟棄受造界，落點都在 3:13。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。新約抄本的數量與年代遠勝任何古代文獻，絕大多數異文是拼字、字序的小差別，沒有一處動搖基督教的核心信仰。<\/p><p>3:10 是少數真正難的地方，學者把它攤在桌上公開討論，正說明教會不隱瞞。全卷立場見 ISS00_4、ISS00_9。<\/p>"]],"con":[],"say":"本講義的立場：3:10 各讀完整並陳，解經採「被顯露」；講台用和合本「燒盡了」時，不說任何譯本錯了，這是抄本異文，不是翻譯錯誤。兩讀都不是神丟棄受造界。","care":"第一次知道聖經有異文的人，常有被騙的感覺。牧者要先說清楚：異文是公開的，不是祕密；我們手上的聖經可以信靠。然後把兩讀都變成生命的提醒：「燒盡」提醒我們，不要把心放在會被燒掉的東西上；「顯露」提醒我們，那一日我們所作的一切都要攤開在主面前。兩讀合起來問同一個問題：那一天主找到你的時候，你是甚麼樣的人？"},{"id":"ISS03_6","t":"3:10--13「盼望新天新地」——地球會被毀滅嗎？基督徒要關心環境嗎？","r":"3:10--13；3:6；羅 8:21；詩 24:1","ch":[3],"why":"3:10–12 有天大有響聲廢去、有形質的被烈火銷化。有人由此推論：地球最後要被燒掉，基督徒不必花力氣照顧環境，只要救靈魂；也有人把環境議題變成講台上的政治立場。全卷立場見 ISS00_4，這一條只補第 3 章逐節的一筆：地球會被毀滅嗎？基督徒要不要關心受造界？","pos":[["【一】經文問的是甚麼","","<p>彼得說「天必大有響聲廢去，有形質的都要被烈火銷化」（3:10），又說「這一切既然都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔」（3:11），最後說「我們照他的應許，盼望新天新地，有義居在其中」（3:13）。問題是：火之後是另起爐灶，還是煉淨更新？不論哪一種，今天的人該怎樣對待神所造的世界？<\/p>"],["毀滅另造說：舊天地完全消失，神另造新的","","<p>根據 3:10 若讀「燒盡」、3:12 的「銷化」「鎔化」，主張舊天地將被完全消滅，神另造一個全新的天地。持此說的福音派信徒大多仍然認為應當照顧受造界——因為神在創造時就把管理的責任交給人，不是因為受造界會存留。<\/p><p><strong>難處：<\/strong>有人從此說推出不必照顧受造界，這是錯誤的推論，不是此說本身必然的結論；而且此說較難解釋 3:6 的洪水類比：當時的世界消滅了，地卻還在。<\/p>"],["煉淨更新說：神要煉淨、更新這個受造界","","<p>3:13 的「新」原文 καινός，多指品質上的新；洪水使「當時的世界」消滅，挪亞走出方舟踏上的是同一塊被洗過的地。受造之物也指望脫離敗壞，得享神兒女自由的榮耀（羅 8:21）；「看哪，我將一切都更新了」（啟 21:5）。若 3:10 讀「被顯露」，更支持審判是鑒察與煉淨。<\/p><p><strong>難處：<\/strong>3:10–12 的語言確實非常激烈，「廢去」「銷化」不能被輕輕帶過；更新說要承認火是真的，審判是徹底的。<\/p>"],["政治動員說：照顧環境就是支持某一套政策","","<p>另一端的做法，是把照顧受造界直接等同支持某一個政策或政黨：支持才算屬靈，反對就是不愛神。出發點常是對受苦者與受造界真實的關心。<\/p><p><strong>難處：<\/strong>具體的能源、產業、稅制政策牽涉許多專業判斷，敬虔的基督徒可以有不同看法；講台替會眾決定政策立場，會使教會分裂，也把福音窄化成一種政治立場。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義傾向煉淨更新說，並陳毀滅另造說；不論採哪一說，都推不出地球反正要燒、所以不必照顧——這不是經文的推論。<\/strong><\/p><p>3:13 的落點是「有義居在其中」，不是毀滅。「地和其中所充滿的……都屬耶和華」（詩 24:1），人是管家不是主人；照顧受造界是 3:11 聖潔敬虔的日常落實。講台講管家的原則，不把它變成政治動員。全卷立場見 ISS00_4。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。永恆的觀點不是叫人離開世界，是叫人在世界裡活得不一樣。<\/p><p>照顧受造界不能取代傳福音，傳福音也不能成為糟蹋受造界的理由；兩件事都是在等候主來的日子裡，把義先活出來。全卷立場見 ISS00_4。<\/p>"]],"con":[],"say":"本講義的立場：傾向煉淨更新，並陳毀滅另造；不論哪一說，都不推出不必照顧受造界，也不把環境議題變成政治動員。全卷立場見 ISS00_4。","care":"這個題目在小組裡常變成兩種尷尬：有人說反正都要燒，順手把資源浪費當小事；有人把環保變成衡量別人屬靈的尺。帶領的人可以把焦點拉回 3:11，讓操練落在很小的地方：不浪費食物、愛惜用品、帶孩子認識神所造的花草、關心因環境破壞而受苦的窮人。散在各國的弟兄姊妹處境不同、政策立場也不同，可以在同一位造物主面前彼此尊重。"},{"id":"ISS03_7","t":"3:12「切切仰望神的日子來到」——人可以加速主的再來嗎？","r":"3:11--12；3:9；徒 3:19--20","ch":[3],"why":"「切切仰望」原文 σπεύδοντας，許多現代譯本譯作「催促」或「加速」。如果人可以加速主的再來，甚麼可以加速它？有人說是宣教，有人說是教會的聖潔，也有人把它和中東局勢、某些宗教或政治工程連在一起，甚至據此排出年份。問題是：彼得說的「催促」是甚麼意思？人真的能左右神的時間嗎？","pos":[["【一】經文問的是甚麼","","<p>「這一切既然都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔，切切仰望神的日子來到」（3:11–12）。σπεύδω 可以是「熱切追求」，帶直接受詞時通常是「使某事加快」。彼得自己在聖殿廊下也說過，人悔改歸正，那安舒的日子就從主面前來到（徒 3:19–20）。問題是：如果是催促，催促的方法是甚麼？<\/p>"],["熱切渴慕說：和合本「切切仰望」","","<p>σπεύδω 與前面的「仰望」連用，描寫信徒內心殷切的期盼。和合本與欽定本都取這個方向。這一讀最大的好處，是避免讓人誤以為人能左右神的時間。<\/p><p><strong>難處：<\/strong>按文法，σπεύδω 帶直接受詞時，通常的意思是「使某事加快」；只讀成內心的渴慕，可能少了經文原有的那一份參與感。<\/p>"],["催促說：悔改、聖潔與傳福音，是參與神等候的心意","","<p>多數現代解經家讀作「催促那日子」。上下文定了催促的方法：3:9 神在等人悔改，3:11 信徒該當聖潔敬虔。換句話說，悔改、聖潔、傳福音，就是參與神的心意；宣教的熱情也與此相合。<\/p><p><strong>難處：<\/strong>若被講成「再傳完多少族群主就來了」的倒數，就又回到了計算；那日子仍然只有父知道。參與不等於掌控。<\/p>"],["製造條件說：人可以用工程促成預言應驗","","<p>主張人可以透過某種宗教、政治或軍事工程，例如推動特定的地緣政治事件，去促成預言應驗、逼近主再來（本講義不採）。<\/p><p><strong>難處：<\/strong>這不是 3:12 的意思：彼得沒有叫人去安排世界局勢，他叫人「為人該當怎樣聖潔，怎樣敬虔」；而 3:10「主的日子要像賊來到」仍然管著 3:12。這種做法還可能讓人以神的名傷害別的民族。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採催促說：原文較支持「催促」，但上下文定了方法——悔改、聖潔、敬虔、傳福音。<\/strong><\/p><p>這是參與神的心意，不是掌握神的時間表。本講義不用 3:12 推算日期，也不教人以任何政治、軍事或宗教工程製造主再來的條件（紅線三）。我們催促那日子的方法不是算它，是活出它。全卷立場見 ISS00_4。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。你今天的悔改、今天傳的福音，都是主所看重的；但時間不在你手裡，你也不必替主排日程。<\/p><p>主還沒有來，不是因為你不夠努力，也不是因為哪一國還沒有發生甚麼事；等候的人既有動力，也有安息。全卷立場見 ISS00_4。<\/p>"]],"con":[],"say":"本講義的立場：3:12 較支持「催促」，方法是悔改、聖潔、敬虔、傳福音；這是參與，不是掌控。不用這一節推算日期，也不教人以任何工程製造主再來的條件。","care":"「加速主再來」這句話可以點燃人，也可以燒傷人。被點燃的人，會更殷勤地傳福音、追求聖潔；被燒傷的人，會覺得主還沒來是自己不夠努力，背上一個永遠完成不了的擔子，或被捲進時事解經的熱潮。牧者要把兩件事同時說清楚：我們真的能參與；但時間不在我們手裡。散在各國的弟兄姊妹，也不必因為別處的戰事新聞而恐慌。"},{"id":"ISS03_8","t":"3:15--16「如強解別的經書一樣」——保羅的信是經書嗎？新約正典怎樣形成？","r":"3:15--16；帖前 5:27；西 4:16","ch":[3],"why":"3:16 說保羅的信被人強解，「如強解別的經書一樣」。這是新約內部第一次把使徒書信與舊約聖經並列。這引出幾個問題：保羅的信在使徒時代就被看作聖經了嗎？新約二十七卷是怎樣被收集、被承認的？是教會決定了正典，還是教會承認了正典？本書本身的正典歷史見 ISS00_8。","pos":[["【一】經文問的是甚麼","","<p>「就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們」（3:15）；「信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣」（3:16）。「別的經書」原文 τὰς λοιπὰς γραφάς，「其餘的」把保羅的信放進「經書」之列。問題是：正典是從甚麼時候開始成形的？誰給了它權柄？<\/p>"],["使徒時代成形說：使徒的書信從一開始就帶著主的權柄","","<p>多數福音派的讀法：γραφή 在新約一貫指聖經；保羅要求教會公開宣讀並彼此傳閱他的信（帖前 5:27；西 4:16），提摩太前書也把主的話與申命記並列為「經上說」。可見使徒的著作從一開始就被教會領受為主的話，正典的核心在使徒時代已經成形。<\/p><p><strong>難處：<\/strong>完整的二十七卷書目要到幾百年後才在各地確定，邊緣書卷（包括彼得後書本身）曾有爭議；說「核心」成形，不等於每一卷在當時都已被普遍承認。<\/p>"],["晚出說：「一切的信」預設保羅書信已成集","","<p>部分學者認為「他一切的信」預設保羅書信已經被收集成冊，因此本書應寫於第一世紀末以後，是託名之作（見 ISS00_1、ISS00_7）。這一說提醒我們認真看待書信流傳的歷史。<\/p><p><strong>難處：<\/strong>彼得只說他所知道的「一切的信」，不必是完整的書信集；保羅書信在他生前就已在各教會流傳互讀，這一句不必推出晚出。<\/p>"],["教會決定說：正典由教會的權柄界定","","<p>強調正典的界定是教會權柄的行動：經過大公會議才正式確定書目，因此聖經的權威與教會的權威不可分。當代天主教神學也說教會不在聖經之上，而是服事神的話，但在詮釋上仍強調教會訓導的角色。<\/p><p><strong>難處：<\/strong>若正典的權柄來自教會的決定，教會就站在聖經之上；可是 3:16 顯示，在任何會議之前，使徒的書信已經被當作經書。<\/p>"],["教會承認說：教會認出本來就帶著使徒權柄的書卷","","<p>宗教改革傳統的讀法：教會不是製造正典，而是在長期使用與分辨中承認那些本來就有使徒權柄的書卷，就像孩子認出母親的聲音，不是孩子使母親成為母親。分辨的準則大致有三：使徒性、與使徒福音一致、被各地教會長期公認使用。<\/p><p><strong>難處：<\/strong>「承認」需要時間，過程中有爭議、有地區差異；這一說要誠實面對這段歷史，不把它講得太簡單。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採教會承認說：3:16 見證新約正典在使徒時代已經開始成形；四世紀的會議是承認，不是發明。<\/strong><\/p><p>彼得把保羅的信稱為經書，同時稱保羅為「我們所親愛的兄弟」：權柄與謙卑放在同一句裡。這不是兩位使徒的角力，是兩個被同一位主寬容的人站在同一個福音上（紅線七）。本書本身的正典歷史見 ISS00_8。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。正典的歷史不是一場投票，是一段各地教會不斷在這些書裡聽見主聲音的歷史。<\/p><p>被公開糾正過的彼得，沒有因此貶低保羅的信，反而承認它有神所賜的智慧；我們手上的新約，有一部分是被一位曾經被它糾正的使徒親口認可的。全卷立場見 ISS00_1。<\/p>"]],"con":[],"say":"本講義的立場：3:16 見證使徒書信從一開始就被當作經書領受；教會承認正典，不是發明正典。彼得稱保羅為親愛的兄弟，權柄與謙卑同在。正典歷史見 ISS00_8。","care":"一位在大學第一次聽說「新約是四世紀開會投票決定的」的年輕人，可能覺得聖經只是教會政治的產物。可以陪他看 3:15–16：在任何會議之前，使徒彼得已經把保羅的信放在經書之列。也讓會眾看見 3:15 的溫度：我們對待曾經批評過我們的弟兄姊妹，是否也能說「我們所親愛的兄弟」？這對散在各國、常在網路上彼此爭論的弟兄姊妹，是很實際的功課。"},{"id":"ISS03_9","t":"3:16「信中有些難明白的」——讀到看不懂的經文怎麼辦？","r":"3:16--18；1:20--21；徒 17:11","ch":[3],"why":"連使徒彼得都承認保羅的信有些難懂。這句話常被用在兩個相反的方向：有人說，既然難懂又會「自取沉淪」，平信徒就交給專家；也有人說，我有聖靈，我怎麼讀都對。一位讀羅馬書讀到頭痛的弟兄會問：讀到看不懂的經文，我該怎麼辦？我是不是不該自己讀？全卷立場見 ISS00_3。","pos":[["【一】經文問的是甚麼","","<p>「信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪」（3:16）。「強解」原文 στρεβλοῦσιν，原是把人綁上刑架拉扯的字；「無學問」是不肯受教，「不堅固」是站不穩。問題是：出問題的是「讀的人」，還是「強解的人」？保護讀經的方法，是不讓人讀，還是教人怎樣讀？<\/p>"],["交給教導權威說：個人的解釋要服在教會的教導之下","","<p>認為聖經的正確解釋屬於教會的教導職分，以免各人照己意解經，造成分裂與異端。華人教會裡，也有一些地方實際上不鼓勵會眾自己讀較難的書卷，怕他們讀偏。這一說的出發點是保護。<\/p><p><strong>難處：<\/strong>推到極端，就成了「只有牧師能解」，這不是 3:16 的意思；彼得的命令是「在……知識上有長進」（3:18），不是停止讀經。而且把解經權收在少數人手裡，正是假師傅最容易得逞的環境。<\/p>"],["個人直接解經說：我有聖靈，我讀到的就是神的意思","","<p>認為每個信徒都有聖靈，個人讀經所得的領受就是神的意思，不需要參考歷代教會的理解或群體的分辨。出發點是看重個人與神的關係。<\/p><p><strong>難處：<\/strong>容易把「我覺得」當成「神說」，正落入 3:16 的「強解」：把經文綁起來，拉到自己要的長度。1:20 也提醒，預言不是出於人意；讀經的人需要被經文改正，而不是改正經文。<\/p>"],["群體中謙卑讀經說：受教、堅固、謙卑地讀","","<p>宗教改革傳統主張聖經的清晰性：關乎得救的事，在聖經某處都已說得清楚，難的地方可以用清楚的地方解釋。3:16 的解藥因此不是「不要讀」，是受教——在群體中讀；堅固——照上下文讀；謙卑——承認不懂，不強解。這正是庇哩亞人「甘心領受這道，天天考查聖經」（徒 17:11）的樣子。<\/p><p><strong>難處：<\/strong>群體讀經也可能變成人云亦云；群體本身也要被經文檢驗，教導的人要願意被會眾用經文提問。<\/p>"],["【三】本講義站在哪裡","","<p><strong>本講義採群體中謙卑讀經說：3:16 絕不是禁止會眾自己讀經的理由，更不是說聖經只屬於少數專家（紅線八）。<\/strong><\/p><p>讀到難明白的經文，可以照四步：先讀上下文，問作者在這一段要解決甚麼問題；用清楚的經文解釋難的經文；帶到小組或請教牧者、查考可靠的註釋；仍然不懂的，就誠實地放著，先順服已經明白的部分。全卷立場見 ISS00_3。<\/p>"],["【四】這件事該不該影響你的信心","","<p>不該。連彼得都說保羅難懂，你讀不懂一點也不奇怪；讀不懂不是罪，強解才是危險。<\/p><p>讀不懂的地方，就是你可以帶到群體裡、和弟兄姊妹一起長進的地方。彼得在同一處給的命令不是「別讀」，而是「要在我們主－救主耶穌基督的恩典和知識上有長進」（3:18）。全卷立場見 ISS00_3。<\/p>"]],"con":[],"say":"本講義的立場：3:16 不是禁止會眾自己讀經的理由；出問題的是強解的人，不是讀的人。保護讀經的方法是在群體中、照上下文、謙卑地讀。","care":"很多弟兄姊妹不讀經，不是不想讀，是怕讀錯、怕讀不懂。牧者要先把這個怕拿掉。最好的保護是一個彼此讀經的群體：小組長被問倒時可以說「我不知道，我們一起查」，教導的人也願意被會眾用經文檢驗。對剛起步的人，可以建議從福音書與詩篇開始，配合講義慢慢讀到保羅書信；散在各國、時差不同的組員，可以把卡住的經文留在群組裡，下一次一起查。"}],"terrain":{"points":[[0.619,88,3,"神的神能已將一切關乎生命和虔敬的事賜給我們","top"],[0.905,28,9,"就是眼瞎，只看見近處的","bot"],[1.143,44,14,"我脫離這帳棚的時候快到了",null],[1.381,94,19,"晨星在你們心裡出現","top"],[1.523,16,1,"連買他們的主他們也不承認","bot"],[1.705,58,5,"卻保護了傳義道的挪亞一家八口",null],[1.886,82,9,"主知道搭救敬虔的人脫離試探","top"],[2.477,6,22,"狗所吐的，牠轉過來又吃","bot"],[2.694,22,4,"主要降臨的應許在哪裡呢？","bot"],[2.972,86,9,"不願有一人沉淪，乃願人人都悔改",null],[3.194,95,13,"盼望新天新地，有義居在其中","top"],[3.472,98,18,"在我們主－救主耶穌基督的恩典和知識上有長進。願榮耀歸給他","top"]]},"tracks":[{"gk":"ἐπίγνωσις／γνῶσις","tr":"epignōsis / gnōsis","gl":"認識、知識、知道","code":"G1922","root":"ἐπίγνωσις——認識（ἐπί「向著」＋γινώσκω「知道」：向著一位的知道）；γνῶσις——知識；γινώσκω——知道。本卷多次出現；彼得前書把這個字預留給本卷，全卷以「認識」開頭、以「知識」收尾","stops":[["1:2","因你們認識神和我們主耶穌","top"],["1:3","皆因我們認識那用自己榮耀和美德召我們的主",""],["1:5","有了德行，又要加上知識",""],["1:6","有了知識，又要加上節制",""],["1:8","就必使你們在認識我們的主耶穌基督上不至於閒懶不結果子了",""],["1:16","將我們主耶穌基督的大能和他降臨的事告訴你們",""],["1:20","第一要緊的，該知道經上所有的預言沒有可隨私意解說的",""],["2:20","倘若他們因認識主－救主耶穌基督，得以脫離世上的污穢",""],["2:21","他們曉得義路，竟背棄了傳給他們的聖命，倒不如不曉得為妙","bot"],["3:3","第一要緊的，該知道在末世必有好譏誚的人",""],["3:17","你們既然預先知道這事，就當防備",""],["3:18","你們卻要在我們主－救主耶穌基督的恩典和知識上有長進","top"]],"ins":"這是全卷的主追蹤，有頭有尾。第一站，認識是恩典的管道：「因你們認識神和我們主耶穌」（1:2），恩惠、平安是這樣多多加給人的。1:3 說一切關乎生命和虔敬的事都已賜下，「皆因我們認識那用自己榮耀和美德召我們的主」——認識的是一位，不是一套資料。1:5–6 是第一個翻轉：知識被放進八個台階的中間，「有了德行，又要加上知識」，緊接著是節制——知識不是頂點，是要往下長成品格的。1:8 認識要結果子，不可「閒懶不結果子」。1:16 彼得告訴人的不是虛言，是親眼見過的；1:20「第一要緊的，該知道」，知道的是聖經從哪裡來。2:20–21 是全卷最痛的一站：有人「因認識主－救主耶穌基督，得以脫離世上的污穢」，後來卻「曉得義路，竟背棄了」——知道了，不等於認識了。3:3 再一次「該知道」，預先知道才站得住；3:17「既然預先知道這事，就當防備」。終點在最後一節：「在我們主－救主耶穌基督的恩典和知識上有長進」（3:18）——知識被放回恩典旁邊。認識主不是一次拿到的資訊，是一生向著他長進的關係。"},{"gk":"ὑπομιμνῄσκω／μνήμη ↔ λήθη","tr":"hypomimnēskō / mnēmē ↔ lēthē","gl":"提醒、記念 ↔ 忘記","code":"G5279","root":"ὑπομιμνῄσκω——提醒（ὑπό「在下」＋μιμνῄσκω「記得」：從底下把事情提上來）；μνήμη——記念；λήθη——忘記（新約只此一次，1:9）。彼得前書預留給本卷；3:1 把兩封信都算成提醒","stops":[["1:9","忘了他舊日的罪已經得了潔淨","bot"],["1:12","我卻要將這些事常常提醒你們","top"],["1:13","趁我還在這帳棚的時候提醒你們，激發你們",""],["1:15","使你們在我去世以後時常記念這些事","top"],["3:1","這兩封都是提醒你們，激發你們誠實的心",""],["3:2","叫你們記念聖先知預先所說的話和主救主的命令",""],["3:5","他們故意忘記","bot"],["3:8","有一件事你們不可忘記，就是主看一日如千年，千年如一日","top"]],"ins":"彼得後書是一封怕你忘記的信，而且全卷第一筆就是「忘記」：人若沒有那幾樣，就是眼瞎，「忘了他舊日的罪已經得了潔淨」（1:9）——忘記的不是教義，是自己怎樣被洗淨。所以 1:12 彼得說，你們雖然曉得，也在真道上堅固，「我卻要將這些事常常提醒你們」——知道了，還要被提醒。1:13 是他的理由：趁還在這帳棚裡，提醒你們，激發你們。1:15 是第一個翻轉：提醒變成了遺言，「使你們在我去世以後時常記念這些事」——一個快要離開的人，留下的不是財產，是記得。第 2 章沒有這個字，滿章卻是忘了主的人。3:1 回到這個字：「這兩封都是提醒你們」——連彼得前書也算進去，兩封信都是為了提醒。3:2 要記念的是先知的話和主的命令。3:5 是反面的頂點：譏誚的人「故意忘記」——不是不知道，是選擇不記得神曾用命令造天地，也曾用水審判。終點在 3:8：「有一件事你們不可忘記」——要記得的是主不受我們的時間限制，他的等候不是遺忘。我們會忘記，他不會。信仰長進的一半，是肯被提醒、肯記得。"},{"gk":"δικαιοσύνη／δίκαιος ↔ ἀδικία","tr":"dikaiosynē / dikaios ↔ adikia","gl":"義、義人、應當 ↔ 不義","code":"G1343","root":"δικαιοσύνη——義；δίκαιος——義人、應當的；ἀδικία——不義。全卷多次出現。彼得前書說「義的代替不義的」（彼前 3:18），本卷把義從起初的禮物一路帶到新天新地","stops":[["1:1","因我們的神和救主耶穌基督之義","top"],["1:13","我以為應當趁我還在這帳棚的時候提醒你們",""],["2:5","卻保護了傳義道的挪亞一家八口",""],["2:7","只搭救了那常為惡人淫行憂傷的義人羅得",""],["2:8","他的義心就天天傷痛","top"],["2:9","把不義的人留在刑罰之下",""],["2:13","行的不義，就得了不義的工價","bot"],["2:15","巴蘭就是那貪愛不義之工價的先知","bot"],["2:21","他們曉得義路，竟背棄了",""],["3:13","盼望新天新地，有義居在其中","top"]],"ins":"義在這卷書裡先是一份禮物。第一站，信心是「因我們的神和救主耶穌基督之義」（1:1）同得的——一樣寶貴，不是自己掙的。1:13 同一個字根輕輕出現：「我以為應當」——對的事，彼得趁著還活著去做。第 2 章，義成了審判裡被保守的記號：洪水之中，神「卻保護了傳義道的挪亞一家八口」（2:5）；所多瑪傾覆，「只搭救了那常為惡人淫行憂傷的義人羅得」（2:7）。2:8 是第一個翻轉：羅得並不完美，但「他的義心就天天傷痛」——義不只是行為的成績，是一顆對罪還會痛的心。2:9 是全卷樞紐，義與不義在這裡分開：主搭救敬虔的人，「把不義的人留在刑罰之下」。接著不義有了價錢：「行的不義，就得了不義的工價」（2:13），巴蘭「貪愛不義之工價」（2:15）——不義看起來是賺，其實是在領工錢。2:21 最可惜：曉得義路，竟背棄了。終點在 3:13：「盼望新天新地，有義居在其中」——「居」是安家。今天，義人像羅得一樣是住在別人中間的少數；那一天，義是主人，我們是被接回家的人。"},{"gk":"φθορά／ἀπώλεια ↔ σωτήρ","tr":"phthora / apōleia ↔ sōtēr","gl":"敗壞、滅亡、沉淪 ↔ 救主、得救","code":"G5356","root":"φθορά——敗壞、腐爛（φθείρω「毀壞」）；ἀπώλεια——滅亡、沉淪；σωτήρ——救主，全卷多次稱「主－救主」。彼得前書立了「能壞的與不能壞的」，本卷追這條往下的路與兩頭的救主","stops":[["1:1","我們的神和救主耶穌基督","top"],["1:4","叫我們既脫離世上從情慾來的敗壞",""],["2:1","私自引進陷害人的異端……自取速速地滅亡","bot"],["2:3","他們的滅亡也必速速來到",""],["2:12","正在敗壞人的時候，自己必遭遇敗壞",""],["2:19","他們應許人得以自由，自己卻作敗壞的奴僕","bot"],["2:20","倘若他們因認識主－救主耶穌基督，得以脫離世上的污穢",""],["3:6","當時的世界被水淹沒就消滅了",""],["3:7","直留到不敬虔之人受審判遭沉淪的日子",""],["3:9","不願有一人沉淪，乃願人人都悔改","top"],["3:15","要以我主長久忍耐為得救的因由",""],["3:16","就自取沉淪","bot"],["3:18","你們卻要在我們主－救主耶穌基督的恩典和知識上有長進","top"]],"ins":"全卷被「救主」框起來。第一站，「我們的神和救主耶穌基督」（1:1）；1:4 說他要救我們脫離的是甚麼：「世上從情慾來的敗壞」——敗壞是從裡面爛起來的。第 2 章這條往下的路越走越快：假師傅「私自引進陷害人的異端」，結果「自取速速地滅亡」（2:1）；「他們的滅亡也必速速來到」（2:3）；2:12「正在敗壞人的時候，自己必遭遇敗壞」——敗壞別人的，自己先被敗壞。2:19 是第一個翻轉：他們「應許人得以自由，自己卻作敗壞的奴僕」——假自由正是 1:4 要脫離的那個敗壞。2:20 救主的名字在谷底再出現一次，那本是脫離污穢的出口。第 3 章，譏誚的人忘了當時的世界「被水淹沒就消滅了」（3:6），也忘了現在的天地存留到「不敬虔之人受審判遭沉淪的日子」（3:7）。3:9 是第二個翻轉，也是這條字線的心臟：同一個「沉淪」，神說他不願意——「不願有一人沉淪，乃願人人都悔改」。所以 3:15 要「要以我主長久忍耐為得救的因由」；3:16 強解經書的人卻「自取沉淪」——沉淪是自取的，不是神要的。最後一站回到起點：「我們主－救主耶穌基督的恩典」（3:18）。敗壞會往下拉，救主卻在路的兩頭等著。"},{"gk":"στηρίζω／ἀστήρικτος ＋ σπουδή","tr":"stērizō / astēriktos + spoudē","gl":"堅固、不堅固 ＋ 殷勤、盡心竭力","code":"G4741","root":"στηρίζω——堅固（撐住、站穩）；ἀστήρικτος——不堅固；σπουδή、σπουδάζω——殷勤、盡心竭力。主交給彼得的字（路 22:32），彼得前書收在「堅固你們」（彼前 5:10），本卷首尾都用它","stops":[["1:5","你們要分外地殷勤",""],["1:10","應當更加殷勤，使你們所蒙的恩召和揀選堅定不移","top"],["1:12","並且在你們已有的真道上堅固","top"],["1:15","並且，我要盡心竭力",""],["1:19","我們並有先知更確的預言",""],["2:14","引誘那心不堅固的人","bot"],["3:12","切切仰望神的日子來到",""],["3:14","就當殷勤，使自己沒有玷污，無可指摘，安然見主",""],["3:16","那無學問、不堅固的人強解","bot"],["3:17","就從自己堅固的地步上墜落","top"]],"ins":"這是彼得一生的字。主在那一夜對他說：「你回頭以後，要堅固你的弟兄」（路 22:32）；彼得前書末了說神「必要親自……堅固你們」（彼前 5:10）。在這卷書裡，堅固與殷勤是一對：神已經賜下一切，人的回應是殷勤。第一站，「你們要分外地殷勤」（1:5），在信心上一層一層加上。1:10 殷勤有方向：「使你們所蒙的恩召和揀選堅定不移」——不是用殷勤換來揀選，是叫揀選在生命裡看得見。1:12 是彼得對讀者的肯定：你們「在你們已有的真道上堅固」——這正是主交給他的那件事。1:15 他自己也殷勤：「我要盡心竭力」。1:19 堅固有根據：「先知更確的預言」，不是感覺。第 2 章是反面：假師傅「引誘那心不堅固的人」（2:14）——下手的地方正是不堅固的心。3:12「切切仰望」是殷勤向著那日；3:14「就當殷勤，使自己沒有玷污，無可指摘，安然見主」。3:16 不堅固第二次出現，這次是強解聖經的人。終點在 3:17：「就從自己堅固的地步上墜落」——被堅固的人，自己也要防備。堅固不是一次站穩，是一直殷勤地站在恩典裡。"}],"lesson":{"1":{"no":1,"vol":"《321彼得後書講義》第一課·彼得後書第一章","title":"晨星在你們心裡出現——帳棚、台階、晨星","chars":5168,"min":60,"deep":8,"dchars":1902,"tchars":1516,"blocks":[["h","一、病床邊的一本舊聖經"],["p","弟兄姊妹平安。凌晨三點，台中一間安寧病房，只開著床頭一盞小燈。八十二歲的陳伯伯戴著氧氣面罩，呼吸很淺。床邊坐著他的兒子家豪，四十五歲，在新加坡做工程師，接到電話就搭最早的班機趕回來。他手上的手機一直在震：專案群組、客戶的訊息、太太傳來孩子補習費的帳單。陳伯伯忽然醒了，指一指床邊的櫃子。家豪拉開抽屜，拿出一本封皮磨破的聖經，書籤夾在彼得後書第一章。"],["p","那一頁的空白處，有爸爸用原子筆寫的一行字，筆畫已經抖了：家豪，趁我還在這帳棚的時候，提醒你。陳伯伯拿下面罩，慢慢說了一句：我沒有甚麼留給你，就這幾句話，你要常常讀。說完又睡了。家豪坐在燈下，心裡很難受。他信主三十年了，這幾年連聖經都很少打開。他問自己一句話：我是不是早就停下來，不長了？"],["p","「長進」這兩個字，我們常常聽，也常常怕。一聽到長進，就想到一張成績單：讀了幾章、禱告多久、聚會出席幾次。於是信仰活成兩種樣子。一種是永遠覺得還差一點，再多一次特會、再多一個經歷，才算夠屬靈；另一種是乾脆放下，反正已經得救了，長不長進沒有甚麼分別。"],["p","彼得後書第一章講的，是另一種長進。照書信三問，先問第一問：收信的人遇到甚麼？他們和家豪很像。信主有一段日子了，這些事他們都「曉得」（1:12）；可是前面有假師傅要從教會裡面起來（2:1），也有人要譏誚主再來的應許（3:4）。寫信的人自己，正坐在一盞燈下。「因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的。」（1:14）三十多年前在加利利海邊，主對他說：「年老的時候，你要伸出手來，別人要把你束上，帶你到不願意去的地方。」（約 21:18）他立刻轉頭問：「主啊，這人將來如何？」（約 21:21）三十年後，那一句話要應驗了。一個知道自己快走的人，最想說的是甚麼？這一課走三步：帳棚、台階、晨星。"],["d",["彼得後書真的是彼得寫的嗎？我聽說有學者懷疑，這會不會動搖這卷書的權威？","這個問題可以誠實地談。早期教會接受這卷書比較慢，俄利根、優西比烏都提到有人存疑；它的希臘文風和彼得前書很不一樣，第二章又和猶大書大段相似，所以近代不少學者主張，是彼得的門徒託他的名寫成。支持彼得是作者的一方指出：信中自稱西門彼得，說自己在聖山上親眼見過主的威榮，也提到主預告他的死；文風的差異，可能與執筆的人不同有關，彼得前書就提到是託西拉寫的（彼前 5:12）。本講義採使徒彼得為作者，同時並陳託名說，全卷立場見 ISS00_1。歷代教會把這卷書收在正典裡；我們信靠的不是寫信人的名聲，是信中所見證的那一位主。"]],["h","二、一切都已經給了：與神的性情有分"],["p","先看信封上的署名：「作耶穌基督僕人和使徒的西門‧彼得寫信給那因我們的神和救主耶穌基督之義、與我們同得一樣寶貴信心的人。」（1:1）他寫的是「西門」，主在海邊三次問他「約翰的兒子西門，你愛我嗎」，叫的就是這個本名。「一樣寶貴」原文 ἰσότιμον（isotimon），新約只出現這一次，是城邦裡「同等公民權」的字。從沒見過主的人，分到的信心和見過主的使徒一樣寶貴；教會裡沒有二等信徒。"],["p","接著，彼得在第一句叮嚀之前，先寫了一句直述句：「神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。」（1:3）「已將……賜給」原文 δεδωρημένης（dedōrēmenēs）是完成式：不是將要給，不是看你表現再給，是已經給了，而且現在還在你手上。給了多少？一切。怎麼送到我們手上？「皆因我們認識」那召我們的主。家豪覺得自己缺了很多；彼得說，你缺的不是更多的供應，是更深地認識那一位已經供應一切的主。"],["p","然後是全卷最高的一句：「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。」（1:4）「極大」原文是最高級，一個說話直率的漁夫，到這裡找不到更大的字了。「有分」原文 κοινωνοί（koinōnoi），彼得很熟。多年前在革尼撒勒湖邊，雅各和約翰是西門的夥伴（路 5:10），同一個字。那時有分的是一條船、一網魚；如今主說，你要有分的，是我的生命。"],["p","這一句要誠實地畫線，因為它很容易講偏，也很容易被跳過。歷代教會有幾種讀法：東正教講成神論，他們小心分開神的本質與神的能力，說人藉恩典有分於神的能力，卻永遠是受造者；改革宗講與基督聯合；衛斯理傳統講完全的愛；許多福音派註釋講道德的相似。本講義採的是：在基督裡與基督聯合，有分於神的生命與品格。三條界線要記住。第一，創造者與受造者的分別永遠存在，人不會變成另一位神，也不與神的本質混同。第二，有分是恩典，不是修煉，是他「已將」應許賜給我們。第三，有分的內容彼得自己寫在下文：脫離敗壞，然後是德行、知識、節制，一直到愛眾人。所以次序不能顛倒：先是神的完成式，才有我們的命令式。"],["d",["「與神的性情有分」，會不會讓人以為自己可以修成神？","會，所以要講清楚，可是不要因此不講。彼得自己馬上定義了有分的內容：脫離世上的敗壞，加上德行、知識、節制、忍耐、虔敬、愛弟兄、愛眾人。神的性情落在人身上，長出來的是品格，不是神的權柄，也不是神的本質。連東正教講成神論，也特意分開神的本質與能力，正是為了不讓人以為受造者會與神混同。可以記三句話：分別永存，你永遠是被造的，他永遠是神；有分是恩典，是他把應許賜給你，不是你修出來的；內容是愛，越有分於他，越能愛人。一個人若因為這節經文變得高傲，就說明他還沒有真正有分，因為神的性情最清楚的樣子，是十字架上的捨己。全卷立場見 ISS00_2。"]],["h","三、原文亮光：供應、瞇眼、踏穩"],["p","然後彼得才說：「正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識；有了知識，又要加上節制；有了節制，又要加上忍耐；有了忍耐，又要加上虔敬；有了虔敬，又要加上愛弟兄的心；有了愛弟兄的心，又要加上愛眾人的心。」（1:5--7）這段台階有三個原文字撐著，每一個都能在三十秒之內落到那間病房裡。"],["p","第一個原文字：ἐπιχορηγήσατε（epichorēgēsate），「加上」。古希臘城邦辦戲劇節，有富人出錢供應合唱團的一切，比的是誰供應得大方。所以「加上」不是勉強湊數，是慷慨地供應。再看介系詞：原文不是「在信心上面」，是「在信心裡面」，德行從信心裡長出來，知識從德行裡長出來，像一棵樹，不像一道要打怪升級的樓梯。起點是信心，那是神分給你的；終點是愛眾人。更美的是，同一個字在 1:11 又出現，換成被動：「必叫你們豐豐富富地得以進入」，就是被供應進入。你在這裡大方地供應一項品格，神在那裡更大方地供應你進國的門。"],["p","第二個原文字：μυωπάζων（myōpazōn），1:9 的「只看見近處的」，新約只有這一次，英文的近視 myopia 就從這裡來。字根是瞇眼：不是天生看不見，是自己把眼睛瞇起來，只盯著眼前那一點。家豪的那一點，是一直在震的手機。病根寫在下半句：「忘了他舊日的罪已經得了潔淨」（1:9）。這個人忘記的不是規條，是恩典。治這種近視的方法很溫柔，不是更用力，是想起來。"],["p","第三個原文字：βεβαίαν（bebaian），1:10 的「堅定不移」。「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳。」（1:10）這個字的字根是踏步，意思是踩得穩的；在當時的契約上，是「確實有效」的保證。源頭在神，確據在生命：品格不是買門票，是讓蒙召的人自己看見，這呼召是真的。寫「永不失腳」的人，曾經在加利利的水面上往下沉，「耶穌趕緊伸手拉住他」（太 14:31）。"],["p","熟悉 321 的弟兄姊妹，讀到這八項，也許會想起改變觀念的八大步驟。我要明說，同樣是八項，卻是兩回事：彼得的八項是品格的果子，321 的八步是觀念改變的過程，不可以說彼得也有八大步驟。先讓經文講完它自己的話。"],["d",["1:5--7 的八個台階，一定要一級一級照次序爬完嗎？","不必這樣讀。原文的介系詞是「在……裡面」，德行是在信心裡供應出來的，知識是在德行裡供應出來的，所以它比較像一棵樹同時長出許多枝子，不是一道要先踩穩第一級才能踩第二級的樓梯。古代修辭常用這種一層接一層的句型，起點與終點是刻意安排的：起點是神分給你的信心，終點是愛。中間的品格彼此扶持，節制幫助忍耐，忍耐成全愛弟兄。你可能在忍耐上很弱，在愛弟兄上卻已經長了一些，這很正常。這一週只要選一項，在一件具體的事上大方地供應它，就是在長進。也不要拿這張清單去量別人，說某人還停在第幾級；它是給我們照自己的鏡子，不是評分別人的尺。"]],["d",["1:10 說要使恩召和揀選堅定不移，難道揀選要靠我自己撐住？","這是全章最容易讓人不安的一節。各家讀法不同：改革宗多說，揀選本身不會動搖，「使之堅定」是讓它在你的生命和見證中變得確實；阿米念傳統則強調，人的回應真實地參與在保守之中。從字來看，「堅定不移」是當時契約上確實有效的用語，動詞又是「為你們自己」的語態，對象是你的確據，不是在神那邊補上甚麼。所以本講義的理解是：源頭在神，確據在生命。緊接著的應許是「就永不失腳」，用的是希臘文最強的否定。寫這句話的人曾經跌得很重，是主拉住了他。如果你正為這件事焦慮，請先回到 1:3：神已經把一切賜給你了。得救確據的全卷立場見 ISS00_5。"]],["h","四、帳棚要拆，燈在手上"],["p","台階講完，彼得說：「你們雖然曉得這些事，並且在你們已有的真道上堅固，我卻要將這些事常常提醒你們。」（1:12）「堅固」這個字，是彼得一生的功課。主被賣那一夜對他說：「你回頭以後，要堅固你的弟兄。」（路 22:32）一個曾經三次不認主的人，被主叫回來、被主堅固，現在要用最後的力氣堅固別人。"],["p","接著是帳棚。在登山變像的山上，他看見主的榮光，脫口而出：「主啊，我們在這裡真好！你若願意，我就在這裡搭三座棚，一座為你，一座為摩西，一座為以利亞。」（太 17:4）幾十年後，他稱自己的身體為帳棚，這帳棚快要拆了。1:15 說「我去世以後」，「去世」原文 ἔξοδον（exodon），就是出埃及的那個字。那天在山上，摩西和以利亞與主談論的，正是「耶穌去世的事」（路 9:31），用的也是這個字。年輕的彼得想把榮耀留在帳棚裡；年老的彼得知道，帳棚是要拆的，榮耀是要等的。死亡不是結束，是一次出埃及。"],["p","他回想那座山：「我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。」（1:16）他記得天上來的聲音：「這是我的愛子，我所喜悅的。」（1:17）請留意，他寫到那一天，一個字也沒有提自己說錯的話。他記得的，是父對子說的那一句。"],["p","然後是這一章的章題：「我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。」（1:19）「更確」和 1:10 的「堅定不移」是同一個字：山上的經歷，叫先知的話更確定了。「暗處」原文是又乾又髒的地方，就是我們住的世界。燈不是太陽，它只照亮腳前一步；可是天亮以前，燈就是最可靠的光。「晨星」原文 φωσφόρος（phōsphoros），帶光的。天發亮，是主再來的那個早晨；這使我們想起主說：「我是明亮的晨星。」（啟 22:16）那時燈可以放下，因為光本人來了。"],["p","最後兩節常被誤用：「第一要緊的，該知道經上所有的預言沒有可隨私意解說的；因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。」（1:20--21）請看 1:21 開頭的「因為」，它說明的是預言的來源：不是先知自己想出來、自己解開的。「感動」原文是被帶著走，像帆船被風推著。這兩節不是叫信徒別碰聖經；彼得剛剛才說「你們在這預言上留意」，留意的是每一個「你們」。"],["d",["1:19 說「先知更確的預言」，是不是表示屬靈經歷都不可靠？","不是。彼得自己有過一生最強烈的屬靈經歷：在聖山上看見主的榮光，聽見天上的聲音。他沒有看輕這經歷，反而拿它作見證。他說「我們並有先知更確的預言」，意思是山上的經歷正好叫舊約的預言更確定了。經歷證實聖經，聖經解釋經歷。實際的分辨可以這樣問：你的感動、夢境、經歷，放在聖經的上下文裡，是幫助你更愛主、更像主，還是讓你越來越以自己為中心？前者可以感恩，後者要回到燈下重新檢驗。也不要拿別人的經歷壓自己；收信的人沒有上過那座山，彼得卻說他們的信心和使徒一樣寶貴。如果你從來沒有特別的經歷，你手裡照樣有這盞燈。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把 1:4 講成人成神：說與神的性情有分，就是人可以修到跟神一樣。這不是彼得的意思。創造者與受造者的分別永遠存在；連東正教講成神論，也小心分開神的本質與能力。321 說「無己不是沒有，乃是進入無限」，在這一節只能說成：進入與無限之神的相交，基督在我裡面活著，不是人變成無限。"],["p","第二個偏差，是因為怕講錯，就乾脆跳過 1:4，快快帶過。彼得用了他找得到最大的字來寫它，我們沒有權利省略。跳過 1:4，八個台階就失去了根，信仰只剩下規條和努力；講明 1:4，人才知道神給我們的不只是一套道德，是他自己的生命。不要因為有人講過頭，就連真理也不敢講。"],["p","第三個偏差，是把長進當成靠自己爬：把 1:5--7 抽出來掛在牆上當晉級表，每天量自己爬到第幾級。這樣讀，人要不驕傲，要不絕望。彼得在清單前面放了「正因這緣故」，先有神已經給的一切，才有我們的殷勤。長進是在恩典裡長大，不是靠自己的力氣爬上天。"],["p","第四個偏差，是在經歷與聖經之間比高低：有人說我有異象、有感動，比聖經更直接；也有人反過來說，經歷都靠不住，誰有經歷就是不穩重。彼得兩邊都不站。他有過山上的經歷；可是他把人指向「先知更確的預言」。經歷要放在燈下檢驗，不可取代那盞燈，也不必因此看輕神在你身上真實做過的事。"],["p","第五個偏差，是用 1:20 禁止會眾自己讀經，說經上的預言沒有可隨私意解說的，所以你不要自己讀，交給講台就好。這是誤用。1:21 用「因為」接下去，說明的是預言的來源；1:19 反而叫每一個人「留意」。讀經的保護不是把聖經鎖起來，是在群體中讀、照上下文讀、謙卑地讀。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：信主多年，卻越來越近視，眼裡只有升學、房貸和下一份合約，怎麼辦？很多華人弟兄姊妹不是不愛主，是太忙。孩子要補習，房貸要繳三十年，父母年紀大了，自己還在異鄉打拚。日子一久，眼睛就瞇起來了。彼得沒有說這些事不重要，他說不要忘了舊日的罪已經得了潔淨，不要忘了前面有永遠的國。做法可以很小：早上先讀一小段經文，再打開手機。眼睛常常往遠處看一眼，近處的事反而擺得對。"],["p","第二個問題：家裡的長輩說，讀經交給牧師就好，你自己讀會讀偏。這句話常常出於好意，我們先要尊重這份擔心。可是 1:20 不是禁止讀經的經文。可以溫柔地回應：您說得對，我不要憑私意讀，所以我跟小組一起讀，照上下文讀，不明白的就請教牧者。牧者的責任是幫助會眾讀，不是代替會眾讀；燈是給每一個人拿在手上的。"],["d",["1:20 說沒有可隨私意解說的，那我自己讀經，會不會讀錯？","有可能讀錯，可是答案不是不讀，是好好讀。1:20 的重點是預言的來源：先知沒有照自己的意思去解開他看見的，因為 1:21 說預言是人被聖靈感動說出來的。既然經文不是出於人意，讀的人也不可以照私意扭曲它，第三章就警告有人「強解」。保護有三個。第一，在群體中讀，跟小組、跟牧者一起讀，不是一個人關起門來發明新意思。第二，照上下文讀，先問這段在原來的信裡說甚麼，再問今天怎樣應用。第三，謙卑地讀，讀不懂的先放著，求聖靈光照，也請教別人。這樣讀，你會讀得越來越準。讀經與解經的全卷立場見 ISS00_3。"]],["h","七、活出321——在燈下一步一步長"],["p","經文講完了，321 才在末端認出它。這一章照出的有己，是一個瞇著眼的人：只盯著近處，忘了自己被潔淨，又想靠自己的力氣爬上去。"],["p","耶穌是我的榜樣：1:3 說他「用自己榮耀和美德召我們」，「美德」和 1:5 的「德行」是同一個字。他身上有的，他召我們在信心裡加上；榜樣不是站在遠處叫我們爬，是走在前面，把自己的樣子分給我們。"],["p","聖經是我的準則：1:19 說，天亮以前，先知的話是照在暗處的燈。準則不是一根打人的棍子，是一盞照路的燈；經歷要在它底下檢驗，私意要在它面前放下。"],["p","聖靈是我的引導：1:21 說人是「被聖靈感動」說出神的話，像帆船被風推著走。那一位帶著先知說話的聖靈，今天也帶著我們讀，帶著我們在信心裡一項一項長出來。"],["p","讓耶穌作王：1:1 直稱他為「我們的神和救主耶穌基督」，1:11 說那國是他「永遠的國」。讓他作王，就是把手機、帳單和行程表從寶座上請下來，每天先讀他的話，再看別人的訊息。"],["p","讓耶穌得著一切的榮耀：彼得寫帳棚、寫聖山，卻沒有寫自己的功勞；他記得的不是自己說了甚麼，是父對子說的那一句。這封信的最後一句，就是「願榮耀歸給他」（3:18）。"],["p","建立屬神的體系：一個帳棚快拆的人，最後的殷勤是「使你們在我去世以後時常記念這些事」（1:15）。他是在一代一代人的心裡建立對主的記念。先有神賜下的生命，再有愛弟兄、愛眾人的關係，然後才有不至於閒懶不結果子的事工。"],["h","八、四種心，誰在燈下瞇著眼"],["p","驕傲型的心說：這些我都知道了。彼得卻說：「你們雖然曉得這些事……我卻要將這些事常常提醒你們。」（1:12）知道不等於長進；肯被提醒，就是謙卑的開始。"],["p","恐懼型的心，怕自己有一天會跌倒，怕長不上去，也怕帳棚拆的那一天。1:10 說「你們若行這幾樣，就永不失腳」，寫這句話的人曾經往下沉，是主伸手拉住他。你的確據不在你抓得多緊，在他拉得多牢。"],["p","羞恥型的心想：我過去那麼糟，這幾年又荒廢了，怎麼配談長進？1:9 說不長進的病根，是「忘了他舊日的罪已經得了潔淨」。不是忘了自己多糟，是忘了已經被洗淨。彼得在信的開頭寫上「西門」，那個被主在海邊叫回來的名字，也是你的。"],["p","受傷型的心，也許曾在教會被人用聖經壓過，被說成屬靈程度不夠，被當成次等的信徒。1:1 說你和使徒「同得一樣寶貴信心」，教會裡沒有二等信徒。燈是用來照路的，不是用來打人的。若那些傷到今天還影響你的睡眠和信任，請讓一位信得過的牧者陪你，必要時尋求專業的協助。"],["d",["我的父母正在病床上，帳棚快拆了，我該怎樣陪他、跟他說甚麼？","先陪，再說。彼得臨終最在乎的是「提醒」和「記念」，你也可以這樣做。第一，把握清醒的時候，問他想見誰、想說甚麼，替他把話傳到。第二，若父母已經信主，讀他熟悉的經文給他聽，像 1:3 和 1:11，告訴他：你要豐豐富富地進入主的國。第三，若父母還沒有信主，不要在病床邊用壓力逼他表態；握著他的手，說謝謝、說對不起、說我愛你，然後簡單地告訴他：耶穌愛你，你可以把自己交給他，並且為他禱告。第四，照顧你自己：輪班、吃飯、睡覺，讓教會的弟兄姊妹陪你。人的去處在公義又滿有憐憫的神手裡；你的責任是愛，不是替神下判斷。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上在打開手機以前，先讀 1:3--11 的一小段，讀完對主說一句：主，你今天已經賜給我的，是甚麼？"],["p","第二，做一次眼科檢查：寫下這一週最佔據你眼睛的一件近處的事，在旁邊寫上 1:9 的那一句「舊日的罪已經得了潔淨」，再寫上 1:11「永遠的國」。"],["p","第三，從 1:5--7 選一項你最缺的品格，寫在一張卡片上，這一週在一件具體的事上、對一個具體的人，大方地供應它。"],["p","第四，打一通電話或傳一則訊息，謝謝一位曾經一再提醒你、堅固你的人；如果他已經不在了，就把他提醒你的那句話寫下來，傳給下一個人。"],["p","第五，這一週和小組或家人一起讀一段聖經，照上下文讀，彼此問一句：這段經文原來在說甚麼？"],["p","然後我們一起開口說出四句話。"],["p","我宣告：神的神能已將一切關乎生命和虔敬的事賜給我，我不再活在缺乏裡。"],["p","我宣告：我舊日的罪已經得了潔淨，我不瞇著眼只看近處，我要望見永遠的國。"],["p","我宣告：我在信心裡大方地供應，靠主的恩典一步一步長，長到愛眾人。"],["p","我宣告：天亮以前，主的話是我腳前的燈；我要留意它，直等到晨星在我心裡出現。"],["d",["我想提醒一位弟兄姊妹，又怕人家嫌我囉嗦，該怎麼開口？","彼得也重複，而且說得很坦白：「你們雖然曉得這些事……我卻要將這些事常常提醒你們。」愛人的人不怕重複，可是提醒的方式要溫柔。第一，先分享自己，不先指出對方：這一週這節經文提醒了我甚麼，對方比較容易聽。第二，提醒恩典，不只提醒責任：彼得先說神已經給了一切，才說要加上。第三，短而具體：傳一節經文，加一句你的禱告，不寫長篇。第四，持續而不催逼：一週一次，比一次說十句有用。提醒你的「2」以前，先求主提醒你自己。對方一時聽不進去，也不必灰心，有些種子要很久才發芽，叫它生長的是神。"]],["h","十、結語"],["p","我們回到那間病房。那個星期六的清晨，陳伯伯安息了。家豪帶著那本舊聖經回到新加坡。他給自己定了一個很小的規矩：每天早上在打開手機以前，先讀爸爸畫過線的一小段。有一天清晨五點多，他走去地鐵站，東邊的天還是暗的，只有一顆很亮的星掛在那裡。他停下來，想起那一頁的 1:19。那天晚上，他在爸爸那一行字的下面，寫了第二行：爸，我記得。過了幾天，他又寫了第三行，寫給他十四歲的兒子。"],["p","可是這一課的焦點，不在家豪變得多好，也不在彼得多了不起。焦點在那一位：他用神能把一切關乎生命和虔敬的事賜給我們，在海邊把一個失腳的漁夫叫回來，又陪他走了三十年。天亮以前，他的話是我們腳前的燈；天亮的時候，他自己就是那顆晨星。你不必更佩服誰，只要更愛這一位。"],["p","我們一起低頭禱告。天父，謝謝你藉你的神能，已將一切關乎生命和虔敬的事賜給我們，叫我們與你的性情有分。求你醫治我們的近視，叫我們想起自己舊日的罪已經得了潔淨。我們當中有正在病床邊陪伴家人的人，有覺得自己停下來不長了的人；求你在我們的信心裡供應德行，一步一步帶我們長到愛眾人。天亮以前，求你叫我們留意你的話，直等到天發亮，晨星在我們心裡出現。願榮耀歸給主耶穌，從今直到永遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰讀得多、誰爬得高，是讓每一個人說出自己瞇著眼盯住的那一點，也說出這一週要在信心裡大方供應的一件事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是帳棚、台階、晨星。席上可能有正在陪伴臨終家人、剛剛經歷喪親的人，也可能有信主多年卻覺得自己停滯、對自己很失望的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：神已將一切賜給我們，長進是在恩典裡長大，不是靠自己爬；與神的性情有分，是有分於神的生命與品格，人永遠是受造者；天亮以前，神的話是照在暗處的燈，每一個人都可以拿在手上。"],["n","1. ★ 開場那一行字：趁我還在這帳棚的時候，提醒你。如果你知道自己的帳棚快拆了，你最想提醒誰哪一句話？"],["n","2. ★★★ 1:3 說神「已將」一切賜給我們，1:5 才說「你們要分外地殷勤」。請用一句話說：這個次序如果顛倒過來，信仰會變成甚麼樣子？"],["n","3. ★★ 1:4「與神的性情有分」有三條界線。請挑一條，用自己的話說出來，並說它為甚麼重要。"],["n","4. ★★ 你聽過「自己讀經會讀錯」這一類的話嗎？讀完 1:19--21，你會怎樣溫柔地回答？"],["m","帶領提醒：1:4 只講本講義的三條界線，不在組裡比較宗派，也不嘲笑任何傳統；有人問作者或揀選的問題，一句指向議題頁就好，不在組裡辯論。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：說出自己瞇著眼盯住的那一點，想起自己被潔淨的那一天，並說出這一週要在信心裡供應的一項品格。"],["t","【看】看見自己"],["n","5. ★★★ 這一個月，你的眼睛最常盯著的近處是甚麼：帳單、孩子的成績、工作群組，還是一個人？是在哪一天、甚麼場合最明顯？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 1:3--9 兩遍。第二遍讀完，說出一個詞：已將、應許、有分、加上、潔淨，哪一個詞對你剛才說的那一點說話？為甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你的長進卡在哪裡：覺得自己永遠差一點、覺得已經太晚了、覺得從前太糟不配，還是忙到忘了自己被潔淨？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「神已將一切賜給我，我舊日的罪已經得了潔淨。」右手邊的人只回一句「你和使徒同得一樣寶貴的信心」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 從 1:5--7 選一項你最缺的品格，寫下這一週星期幾、對誰、在哪一件具體的事上，你要大方地供應它。"],["m","帶領提醒：不把 1:5--7 當晉級表評比誰停在第幾級，也不用 1:9 的「眼瞎」指著任何人。這一化可能碰到喪親的哀傷、陪伴臨終家人的疲憊、長期的屬靈乾枯或無望感；不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，不替任何已過世的人下判斷，會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一段晨讀、一位要感謝的人、一位要提醒的人、一位要講給他聽的朋友。"],["n","10. ★★ 1:12 彼得說「常常提醒」。誰曾經一再提醒你、堅固你？這一週哪一天、用電話還是訊息，你要謝謝他？"],["n","11. ★ 這一週每天早上幾點、在哪裡，你要在打開手機以前先讀 1:3--11 的一小段？讀完要對主說的那一句話是甚麼？"],["n","12. ★★ 這一週你要和誰一起照上下文讀一段聖經？說出時間、地點和那一段經文。"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，神放在你身邊、你要提醒和堅固的那一個人。當場說出他的名字，說出這一週哪一天你要把 1:19 傳給他，告訴他天亮以前你靠甚麼走路。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，神已經把一切關乎生命的事白白給了我們，不是等我們夠好才給。第二句，所以我在信心裡一步一步長，長到能愛身邊的每一個人。第三句，世界很暗的時候，神的話是我腳前的燈，直到耶穌再來，像晨星出現。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多讀經」這類答案；正在陪伴臨終家人或剛經歷喪親的組員，不要求他這一週再多做甚麼，請組員輪流陪他。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要在信心裡供應的那一項品格是甚麼，對誰。可以只說「一個人」，不必說名字。"],["p","然後彼此代禱，為三種人指名禱告：一位正在陪伴臨終家人或剛經歷喪親的人，求主安慰他；一位覺得自己停下來不長了的人，求主叫他想起自己已經被潔淨；一位在異鄉忙碌打拚的人，求主叫他每天先看見那盞燈。"],["p","最後由組長慢慢讀一遍：「你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。」（1:19）"]]},"2":{"no":2,"vol":"《321彼得後書講義》第二課·彼得後書第二章","title":"主知道搭救——乾井、羅得、回頭","chars":5233,"min":60,"deep":8,"dchars":1960,"tchars":1537,"blocks":[["h","一、旱季裡的一口乾井"],["p","弟兄姊妹平安。秀蓮姊小時候住在山裡。有一年旱季，村裡的水缸都見了底，她跟著母親，一人背一個空桶去打水。有人指路說：「山後面那口井還有水，大家都去那裡。」母女倆走了兩個鐘頭的山路，到了井邊，母親探頭往下看，很久沒有說話。井底是乾裂的石頭。最失望的不是不渴的人，是最渴、又把最後一點力氣都花在那條路上的人。"],["p","五十年後，秀蓮姊在小組裡說起另一口井。幾年前她先生剛過世，她跟著一位很會講的老師，聽得流淚，也照著他的話奉獻了一大筆錢，說是信心的種子，神會加倍還給她。後來那位老師不見了，錢也不見了。她沒有離開主，卻再也不敢走進任何一個聚會。她說：「我不是不渴，我是怕再走到一口乾井。」"],["p","彼得後書第二章，就是一位老牧人寫給口渴的羊的一章。「這些人是無水的井，是狂風催逼的霧氣」（2:17）。可是請先聽清楚：我們不是來找今天誰是乾井，不點名任何人、教會、宗派、平台；我們是來認記號，先照自己，再一起回到活水的源頭。這一課用三個詞走完第二章：乾井、羅得、回頭。乾井會從裡面冒出來；像羅得那樣軟弱的人，主知道搭救；跌倒的人，回頭的路一直開著。"],["p","彼得一開口就說：「從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認」（2:1）。危險不是從城外攻進來，是「在你們中間」長出來。「私自引進」是在真道旁邊悄悄夾帶：他們說很多對的話，只在最要緊的地方換掉一樣東西：那位「買他們的主」。「主」原文 δεσπότης（despotēs），是付了價、有產權的主人；他們口裡稱主，生活卻在說：我不屬於誰。"],["p","「不承認」原文 ἀρνούμενοι（arnoumenoi），正是彼得在大祭司院子裡三次不認主的那個字。寫這句話的人，自己不承認過主。他和假師傅的分別，不是他從來沒有跌倒，是主轉過身來看他，他出去痛哭，後來在海邊被主接了回來。所以這一章不是一個完美的人居高臨下地定罪，是一個被拉回來的人，看見別人往懸崖走時的呼喊。我們也要用同樣的口氣讀：先照自己，再分辨。"],["p","接著兩節說出乾井的果子。「將有許多人隨從他們邪淫的行為，便叫真道因他們的緣故被毀謗。」（2:2）乾井常常很熱鬧，外人分不出真假，罵的就是這條路。「他們因有貪心，要用捏造的言語在你們身上取利。」（2:3）「捏造」是陶匠捏泥，照聽的人想要的形狀捏；「取利」是做買賣，受詞是「你們」，羊被當成了貨。可是彼得說：「他們的刑罰，自古以來並不遲延」（2:3），原文是審判沒有閒著、沒有打盹。所以教會最好的回應，不是說別人錯，是自己的帳目和生活經得起看。"],["d",["這一章講假師傅，今天到底誰是假師傅？講台可不可以直接告訴我們名字？","這一課不給名字，因為彼得也沒有給。他寫這一章時，讀者身邊一定有具體的人，他卻只給記號：對基督，不承認買他們的主；對金錢，貪心取利；對身體，放縱情慾；對權柄，膽大任性；對自由，應許人自由，自己卻作奴僕。五個記號都是果子，不是口才，也不是宗派標籤。講台的責任是教會眾分辨，不是替會眾判決；一旦講台開始點名，聽的人學會的就不是分辨，是跟著喊。還有一個次序：五個記號先照自己，再看別人。若真的遇到教會內的錯謬或侵害，就照程序、向該負責的人、在愛中公開透明地處理，不在網路上定罪。全卷立場見 ISS00_3。"]],["h","二、三個審判，兩個搭救"],["p","從 2:4 起，原文是一個很長的句子，開頭三個「若」，結尾才說「那麼」。若神沒有寬容犯罪的天使；若神沒有寬容上古的世代，卻保護了挪亞一家八口；若神傾覆所多瑪、蛾摩拉，卻搭救了義人羅得。三個審判，中間藏著兩個搭救。彼得這樣排，是在回答讀者心裡的問題：那些人那麼有恩賜、那麼多人跟，神會管嗎？比他們更有能力的天使，神都沒有寬容；審判不看恩賜，也不看人數。至於天使怎樣犯罪，彼得沒有展開，我們也不必把今天講成天使學。"],["p","「神也沒有寬容上古的世代，曾叫洪水臨到那不敬虔的世代，卻保護了傳義道的挪亞一家八口。」（2:5）「傳義道的」原文是傳令官。一整個世代沒有人回應他，用今天的數字看，他是很失敗的傳道人；可是「保護」原文是看守。忠心挖真井、身邊卻沒有人潮的同工，請記得：神看守的不是人數，是人。"],["p","再來是羅得。創世記裡的羅得並不光彩：他自己選了所多瑪，危急的時候還遲延不走，是天使「拉著他的手」才把他領出城。彼得卻稱他是「那常為惡人淫行憂傷的義人羅得」（2:7）。為甚麼？下一節就是答案：「因為那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。」（2:8）他沒有能力改變那座城，也沒有勇氣早一點離開，可是他的心沒有被那座城磨平。義在這裡不是完美，是一顆還會痛的心。"],["p","「傷痛」原文是折磨。今天也有人住在所多瑪中間：在螢幕裡，在飯局上，在辦公室的玩笑裡。危險不在看見，在看久了不痛。而且請留意，羅得蒙救，主詞不是羅得，是神；他不是自己走出來的，是被一隻手拉出來的。這就是第二個詞：羅得。軟弱、遲疑、選錯過路，卻還會痛的人，主沒有放手。"],["d",["羅得做了那麼多糊塗事，選了所多瑪，又遲延不走，為甚麼彼得還稱他是義人？","因為「義」在這裡不是指他的表現完美，是指他的心沒有和那座城站在同一邊。彼得自己下了定義：「他的義心就天天傷痛」，那個「天天」是持續的，每一天都被刺痛。這不是在稱讚他的選擇，創世記清清楚楚記下了他的軟弱，彼得也沒有否認。更要緊的是，他蒙搭救不是因為他夠好，是神記念亞伯拉罕，天使拉著他的手出城，那是恩典。這給今天許多住在所多瑪中間、覺得自己很軟弱的信徒一個安慰：還會痛，就還有義心；你不是靠自己逃出來的，是主拉你出來。若你發現自己已經不太會痛了，也不必絕望，可以求主把那份痛還給你，這本身就是回頭的開始。"]],["h","三、原文亮光：知道、任性、乾井"],["p","從 2:9 到 2:17，有三個原文，剛好是全章的樞紐、病根和結果。"],["p","第一個是 οἶδεν κύριος ῥύεσθαι（oiden kyrios rhyesthai），「主知道搭救」。那個長句在這裡落地：「主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子」（2:9）。審判在條件子句裡，搭救在主要子句裡，而且搭救排在前面。「知道」接上動詞，意思是懂得怎樣、會做：他拉挪亞用一條船，拉羅得用天使的手，方法不同，他都懂。「脫離試探」是從試煉裡面拉出來，不是保證不進洪水。寫「主知道」的人，大概想起海邊自己說過的話：「主啊，你是無所不知的；你知道我愛你。」（約 21:17）彼得講審判，是要叫敬虔的人安心，不是叫他們害怕，更不是叫我們替神清理門戶。"],["p","第二個是 αὐθάδεις（authadeis），2:10「膽大任性」，由「自己」和「喜歡」組成，是以取悅自己為準則的人。保羅說監督必須「不任性」（多 1:7），正是這個字；最危險的任性，常常出現在有講台的人身上。和它連在一起的是「輕慢主治的」，「主治的」原文 κυριότητος（kyriotētos），單數、抽象，最自然是指主的主權，緊接著 2:1 那位買他們的主。所以這不是一節替人間權威護航的經文：這一章被定罪的正是「師傅」。彼得給長老的命令是：「也不是轄制所託付你們的，乃是作群羊的榜樣。」（彼前 5:3）照真理、在愛中、按程序提出的問題，不是毀謗。"],["p","第二和第三個字中間，有一個近乎幽默的故事。巴蘭「貪愛不義之工價」（2:15），騎著驢去赴那份工錢；先知看不見攔路的使者，驢卻看見了，「那不能說話的驢以人言攔阻先知的狂妄」（2:16）。被錢沖昏頭的人，比一頭驢還不清醒。2:14 又說他們「引誘那心不堅固的人」，「引誘」原文是下餌。漁夫出身的彼得認得這個字：餌專下給沒有被堅固的人。所以門訓和陪伴不是教會的額外節目，是羊圈的籬笆。"],["p","第三個是 πηγαὶ ἄνυδροι（pēgai anydroi），「無水的井」（2:17）。πηγή 本來是泉源，自己湧出水來的地方。乾井的問題，是佔了源頭的位置：人來要水，它給不出水。耶利米早就說過，神的百姓「離棄我這活水的泉源，為自己鑿出池子，是破裂不能存水的池子」（耶 2:13）。面對乾井，出路不是去找一口更大、更有名的井，是回到那一位：「人若喝我所賜的水就永遠不渴。」（約 4:14）也請問自己一句：我帶給身邊的人的，是水，還是霧？"],["d",["2:9 說主知道搭救，為甚麼我禱告了很久，處境還是沒有改變？","「脫離試探」原文是從試煉裡面拉出來，不是保證你不進去。挪亞仍然在方舟裡漂了很久，羅得也在所多瑪住了多年。主的搭救有他的時間和方法：有時是改變處境；有時是在處境裡保守你的心不麻木；有時是先把你從某一段關係、某一種依賴裡拉出來。「主知道」的意思，是他懂得怎樣，不是他照我們的時間表行事。這一週可以做兩件事：把你被困的那件事具體寫下來，每天用 2:9 為它禱告一次；同時找一位同伴陪你，等候的時候，不是一個人等。也可以回頭看看，過去有哪一次，主是用你沒有想到的方法把你拉出來的？寫下來，那就是下一次等候時的見證。"]],["d",["如果教會真的有領袖出了問題，我提出來，會不會就是 2:10 說的「毀謗在尊位的」？","不會，只要分清楚三件事。內容：是查得到的事實，還是猜測與傳聞？動機：是為了保護羊群、幫助他回轉，還是為了出氣、證明自己對？途徑：有沒有先私下、按著教會的程序，向該負責的人提出，並且尊重查證的過程？2:10 的「主治的」最自然是指主的主權，被定罪的正是有講台的「師傅」；彼得給長老的命令是「不是轄制」（彼前 5:3），所以這一節不能拿來堵住正當的質疑。若涉及金錢不當、權力控制或任何侵害，就不只是個人看法，應該向教會的監督機制提出，必要時尋求外部專業或法律協助。在事實查清楚以前，不在網路上公開定罪，也不在小組裡傳細節。全卷立場見 ISS00_3。"]],["h","四、假自由與兩種回頭"],["p","乾井最動聽的一句話是：你自由了。「他們說虛妄矜誇的大話，用肉身的情慾和邪淫的事引誘那些剛才脫離妄行的人。」（2:18）餌下給剛信主、剛離開舊生活、還沒站穩的人，用的餌，正是他們剛逃出來的那樣東西。「他們應許人得以自由，自己卻作敗壞的奴僕，因為人被誰制伏就是誰的奴僕。」（2:19）「制伏」是打了敗仗，古代戰敗的人就成了戰勝者的奴隸。他們以為打敗了規條，其實是被情慾打敗。彼得在 1:1 自稱「耶穌基督僕人」；全卷只有兩種僕人，沒有一種人是誰都不服的。自由不是沒有主人，是有一位好主人。"],["p","接著是全章最重的三節：「倘若他們因認識主－救主耶穌基督，得以脫離世上的污穢，後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了。」（2:20）最後是兩句俗語：「狗所吐的，牠轉過來又吃；豬洗淨了又回到泥裡去滾」（2:22）。歷代對這幾節有三種讀法：一說真信徒可能失落；一說這些人從來沒有重生，外面洗過，本性沒變；一說警告本身就是神保守他的人不墜落的工具。三種讀法都同意：警告是真的，出路是回到主面前。"],["p","可是請看清楚上下文。2:20 的「他們」，接的是 2:17--19 的「這些人」：應許人自由、自己作奴僕、又拿自由去引誘初信者的人。這幾節不是寫給一位跌倒了、心裡很痛、很想回來的弟兄姊妹。本講義不用這幾節對任何一個人宣判結局，那是主的事。"],["p","彼得還在這裡埋了一個只有他懂的字。狗「轉過來」原文 ἐπιστρέψας（epistrepsas），和主在那一夜對他說的話是同一個字：「你回頭以後，要堅固你的弟兄。」（路 22:32）同一個動作，兩個方向：一個轉回所吐的，一個轉回主面前。如果你今天怕自己就是 2:20 說的那種人，你會怕，正說明你的心還沒有麻木。請聽同一封信的兩句話：「忘了他舊日的罪已經得了潔淨」（1:9），你的罪是被潔淨過的；「不願有一人沉淪，乃願人人都悔改」（3:9），主還在等。這就是第三個詞：回頭。"],["d",["我信主以後離開教會很多年，過了一段很亂的日子，2:20--22 是不是在說我已經回不來了？","不是。這幾節的上下文，是假師傅和跟從他們、還拿著「自由」去引誘剛脫離妄行之人的人；他們曉得義路，卻主動背棄，又帶別人一起走。你今天會為這件事不安，正說明你的心還沒有麻木。請聽彼得在同一封信裡的兩句話：1:9 說你「舊日的罪已經得了潔淨」，3:9 說主「不願有一人沉淪，乃願人人都悔改」。寫這三節的人自己跌得很重，主在海邊等他回來，先為他預備了炭火和魚，讓他吃飽，再和他談。今天可以做的一步，是找一位信得過的弟兄姊妹或牧者，對他說一句：「我想回來。」教會不是要審問你離開的原因，是要歡迎你回家。全卷立場見 ISS00_5。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把這一章變成獵巫：在講台、小組或群組裡點名今天某位牧者、某間教會、某個宗派或某個平台的講員是假師傅。彼得給的是記號，不是名單；講台教會眾分辨，不替會眾判決。"],["p","第二個偏差，是用 2:10「輕慢主治的」「毀謗在尊位的」堵住對教會領袖的正當質疑，說你批評牧師就是輕慢主治的，這不是經文的意思。這一章被定罪的正是有講台的「師傅」，彼得給長老的命令是「不是轄制」（彼前 5:3）。"],["p","第三個偏差，是用 2:20--22 恐嚇跌倒、掙扎的信徒，對他說你就是那條狗，這是誤用。這幾節的對象是假師傅和跟從他們的人；想回來的人要聽的是 1:9 的潔淨和 3:9 的寬容，我們沒有權柄對任何人宣判結局。"],["p","第四個偏差，是只看別人，不照自己。讀完這一章很會指出誰貪心、誰任性，卻從來不問：我有沒有在真道旁邊夾帶自己的東西？我愛聽某一種講道，是因為它真，還是因為它照我想要的形狀捏？"],["p","第五個偏差，是把分辨變成不再信任任何人：被乾井騙過一次，就說所有的井都是乾的，從此不進教會、不聽講道、不讓任何人陪伴。這看似謹慎，其實是把自己留在旱地；彼得的出路不是不喝水，是回到活水的泉源，在一個彼此堅固的群體裡喝。"],["h","六、兩個華人處境的真實問題"],["p","第一個問題：群組裡的「揭發」影片。家族群組或教會群組裡，有人轉來一段影片，標題寫著某某原來是假先知，下面一排長輩按讚，問你要不要再轉出去。先停三秒，問四件事：這段影片在教我認記號，還是在給我名單？它有查得到的事實、走過正當的程序，還是剪接加上情緒？我轉出去，是為了保護人，還是為了證明自己比較屬靈？我有沒有先為這個人禱告？多數時候，最合聖經的做法是不轉。若真有教會內的錯謬或侵害，就照程序、向該負責的人、在愛中公開透明地處理，不在網路上定罪。"],["p","第二個問題：不好意思拒絕的長輩。一位你敬重的長輩熱心介紹你去聽一位講員，說只
