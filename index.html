<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:17px;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:#FAF6EC;color:#2B2A28;font-family:"PingFang TC","PingFang SC","Noto Sans CJK TC","Noto Sans CJK SC","Microsoft JhengHei","Microsoft YaHei",sans-serif;line-height:1.75;word-wrap:break-word;overflow-wrap:break-word}
button{font:inherit;color:inherit;cursor:pointer}
.serif,.v,.mv-t,.poem,.serm p,.serm blockquote{font-family:"Songti TC","Songti SC","Noto Serif CJK TC","Noto Serif CJK SC","PMingLiU","SimSun",serif}
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:#051434;background:linear-gradient(135deg,#0E2C64,#051434);color:#F3E7CC;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;border-bottom:2px solid #E2B86A}
#top img{width:30px;height:30px;border-radius:7px;margin-right:10px;flex:0 0 30px}
#top .tt{flex:1;min-width:0}
#top .t1{font-size:.95rem;font-weight:700;color:#E2B86A;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top .t2{font-size:.72rem;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#main{max-width:720px;margin:0 auto;padding:62px 14px 92px;padding-top:calc(62px + env(safe-area-inset-top));padding-bottom:calc(92px + env(safe-area-inset-bottom))}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#051434;display:flex;border-top:1px solid #E2B86A;padding-bottom:env(safe-area-inset-bottom)}
#nav button{flex:1;background:none;border:0;color:#B9C3D9;padding:7px 0 6px;font-size:.7rem;line-height:1.2}
#nav button svg{display:block;margin:0 auto 2px;width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#nav button.on{color:#E2B86A}
h1,h2,h3,h4{line-height:1.4;margin:.6em 0 .4em}
h2{font-size:1.2rem;color:#0E2C64}
h3{font-size:1.05rem;color:#0E2C64}
p{margin:.45em 0}
.card{background:#FFFDF7;border:1px solid #E8DFC9;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 2px rgba(5,20,52,.05)}
.lab{display:inline-block;font-size:.72rem;font-weight:700;letter-spacing:.06em;color:#8A6A2A;background:#F6ECD6;border-radius:6px;padding:1px 8px;margin-bottom:4px}
.mute{color:#6E6A60;font-size:.85rem}
.faint{color:#7D786B;font-size:.85rem;background:#F3EEE1;border-left:3px solid #D9CBA8;padding:6px 10px;border-radius:0 8px 8px 0;margin:6px 0}
.hero{background:#0E2C64;background:linear-gradient(160deg,#0E2C64 0%,#051434 100%);color:#F3E7CC;border-radius:16px;padding:20px 16px 18px;margin:6px 0 14px;text-align:center;position:relative;overflow:hidden}
.hero img{width:64px;height:64px;border-radius:14px;border:1px solid rgba(226,184,106,.6)}
.hero h1{color:#E2B86A;font-size:1.3rem;margin:.5em 0 .2em;letter-spacing:.05em}
.hero .sub{font-size:.8rem;opacity:.85}
.arcs{display:flex;margin:0 -4px}
.arc{flex:1;cursor:pointer;margin:0 4px;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:12px;padding:10px 8px;text-align:center;min-width:0}
.arc .big{font-size:1.9rem;color:#0E2C64;font-weight:700;line-height:1.2}
.arc .big span{color:#E2B86A}
.arc .c{font-size:.72rem;color:#8A6A2A;font-weight:700}
.arc .tl{font-size:.78rem;line-height:1.45;margin-top:4px}
.arc .pg{height:4px;background:#EFE6D1;border-radius:2px;margin-top:6px;overflow:hidden}
.arc .pg i{display:block;height:100%;background:#E2B86A}
.btn{display:inline-block;background:#0E2C64;color:#F3E7CC;border:0;border-radius:10px;padding:8px 14px;font-size:.9rem;margin:4px 4px 4px 0}
.btn.gold{background:#E2B86A;color:#051434;font-weight:700}
.btn.ghost{background:transparent;color:#0E2C64;border:1px solid #0E2C64}
.btn.sm{padding:4px 10px;font-size:.8rem}
.wide{display:block;width:100%;text-align:center}
.chips{margin:4px 0 8px}
.chip{display:inline-block;border:1px solid #CDBF9C;background:#FFFDF7;color:#0E2C64;border-radius:999px;padding:3px 12px;margin:3px 4px 3px 0;font-size:.85rem}
.chip.on{background:#0E2C64;color:#E2B86A;border-color:#0E2C64}
.subs{display:flex;flex-wrap:wrap;margin:6px -3px 10px}
.subs button{flex:0 0 25%;max-width:25%;padding:3px;background:none;border:0}
.subs button span{display:block;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:9px;padding:6px 0;font-size:.85rem;color:#0E2C64}
.subs button.on span{background:#0E2C64;color:#E2B86A;border-color:#0E2C64;font-weight:700}
.subs button.lsn span{background:#F6ECD6;border-color:#E2B86A;color:#6B4E14}
.chhead{border-left:4px solid #E2B86A;padding:2px 0 2px 10px;margin:8px 0}
.chhead .k{font-size:.8rem;color:#8A6A2A;font-weight:700}
.chhead .t{font-size:1.1rem;font-weight:700;color:#0E2C64;line-height:1.45}
.v{margin:.35em 0;font-size:1.05rem;line-height:1.9}
.v sup{color:#B08433;font-weight:700;font-size:.68em;margin-right:3px;font-family:sans-serif}
.grkbox{background:#F4EFE2;border-radius:10px;padding:6px 12px;margin:6px 0 12px;font-size:.95rem}
.grkbox .lab{background:#E9DDBF}
.rich blockquote{margin:6px 0;padding:6px 12px;border-left:3px solid #E2B86A;background:#FBF5E6;border-radius:0 8px 8px 0}
.rich blockquote p{margin:.2em 0}
[lang=grc],.grk{font-family:"Gentium Plus","Noto Serif","Times New Roman",serif}
.rich table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%;border-collapse:collapse;font-size:.82rem;margin:6px 0;line-height:1.5}
.rich th,.rich td{border:1px solid #E1D6BD;padding:4px 6px;vertical-align:top;min-width:4.5em}
.rich th{background:#0E2C64;color:#F3E7CC;font-weight:600;white-space:nowrap}
.rich ul,.rich ol{padding-left:1.3em;margin:.3em 0}
.rich strong{color:#0E2C64}
.blk h3{margin:0 0 4px}
.star{color:#C9962E;letter-spacing:1px}
.sec{border-top:1px dashed #E1D6BD;margin-top:8px;padding-top:4px}
.utxt{font-size:.92rem;color:#3F3C35;background:#FBF8F0;padding:4px 10px;border-radius:8px}
.notebtn{background:none;border:1px solid #CDBF9C;color:#8A6A2A;border-radius:999px;font-size:.75rem;padding:2px 10px;margin:6px 0 0}
.notebtn.has{background:#E2B86A;color:#051434;border-color:#E2B86A}
.notebox{display:none;margin-top:6px}
.notebox.on{display:block}
textarea,input[type=search],input[type=text]{width:100%;font:inherit;font-size:.95rem;border:1px solid #CDBF9C;border-radius:10px;padding:8px 10px;background:#FFFDF7;color:#2B2A28}
textarea{min-height:5.5em;resize:vertical}
.serm h3{text-align:center;color:#0E2C64;margin-top:1.2em}
.serm h3.first{font-size:1.2rem}
.serm p{margin:.25em 0;font-size:1.02rem}
.serm blockquote{margin:.6em 0;padding:6px 12px;background:#FBF5E6;border-left:3px solid #E2B86A;border-radius:0 8px 8px 0;color:#3B2F15}
.tts{display:flex;flex-wrap:wrap;align-items:center;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:10px;padding:6px 8px;margin:8px 0}
.tts .btn{margin:2px 6px 2px 0}
.tts .st{font-size:.78rem;color:#6E6A60}
.poem{white-space:pre-line;line-height:1.95;font-size:1rem}
.mv{background:#0E2C64;color:#F3E7CC;border-radius:12px;padding:14px;margin:10px 0}

.mv .cover{background:#1A3A78;color:#9FB0D3;border-radius:8px;padding:12px;text-align:center}
.ol{padding-left:0;list-style:none;margin:6px 0}

.tools .item small{color:#6E6A60}
.back{background:none;border:0;color:#0E2C64;padding:4px 0;font-size:.9rem}
.tog{display:block;width:100%;text-align:left;background:none;border:0;padding:0}

.grphd{margin:16px 0 4px;font-weight:700;color:#8A6A2A;border-bottom:2px solid #E2B86A;padding-bottom:2px}
.deep{background:#F6ECD6;border-radius:10px;margin:8px 0;padding:0}
.deep .q{padding:8px 12px;font-weight:700;color:#6B4E14;font-size:.92rem}
.deep .a{display:none;padding:0 12px 10px;font-size:.92rem}
.deep.open .a{display:block}
.hua h3{background:#0E2C64;color:#E2B86A;border-radius:8px;padding:6px 10px}
.qn{display:flex;margin:6px 0}
.qn b{flex:0 0 2em;color:#0E2C64}
.qn .lv{color:#C9962E;font-size:.8rem;margin-right:4px;white-space:nowrap}
.stop{position:relative;padding:0 0 10px 22px;margin:0}
.stop:before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:#E1D6BD}
.stop:after{content:"";position:absolute;left:1px;top:7px;width:8px;height:8px;border-radius:50%;background:#FFFDF7;border:2px solid #0E2C64}
.stop.top:after{background:#E2B86A;border-color:#B08433;width:10px;height:10px;left:0;top:6px}
.stop.bot:after{background:#9B3B2E;border-color:#9B3B2E}
.big-gk{font-size:1.5rem;color:#0E2C64}
.sres{display:block;width:100%;text-align:left;background:#FFFDF7;border:1px solid #E8DFC9;border-radius:10px;padding:8px 10px;margin:6px 0;font-size:.88rem}
.sres b{color:#8A6A2A;font-size:.76rem;display:block}
mark{background:#F5DC9E;color:inherit;padding:0 1px}
.flash{-webkit-animation:fl 1.6s;animation:fl 1.6s}
@-webkit-keyframes fl{0%{background:#F5DC9E}100%{background:transparent}}
@keyframes fl{0%{background:#F5DC9E}100%{background:transparent}}
.row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #EFE6D1}
.row .l{flex:1;min-width:0;padding-right:8px}
.sw{width:50px;height:28px;border-radius:14px;background:#CFC6B1;border:0;position:relative;flex:0 0 50px}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;-webkit-transition:left .15s;transition:left .15s}
.sw.on{background:#0E2C64}
.sw.on:after{left:25px;background:#E2B86A}
input[type=range]{width:100%}
#modal{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(5,20,52,.86);z-index:50;display:none;padding:20px;overflow:auto}
#modal.on{display:block}
#modal .box{max-width:420px;margin:12vh auto 0;background:#FAF6EC;border-radius:16px;padding:20px 16px;text-align:center}
#modal .box .btn{display:block;width:100%;margin:10px 0;padding:12px}
.svgwrap{background:#FFFDF7;border:1px solid #E8DFC9;border-radius:12px;padding:6px}
.svgwrap svg{display:block;width:100%;height:auto}
.tpl{display:flex;align-items:flex-start;padding:6px 4px;border-bottom:1px solid #EFE6D1;font-size:.88rem;width:100%;text-align:left;background:none;border-left:0;border-right:0;border-top:0}
.tpl.on{background:#F6ECD6}
.tpl .n{flex:0 0 24px;height:24px;border-radius:50%;background:#0E2C64;color:#E2B86A;text-align:center;line-height:24px;font-size:.72rem;margin-right:8px}
.tpl .n.top{background:#E2B86A;color:#051434}
.tpl .n.bot{background:#9B3B2E;color:#fff}
.truth{border-left:3px solid #E2B86A;padding-left:10px;margin:10px 0}
.foot{text-align:center;font-size:.72rem;color:#9A9384;margin:20px 0 0}
/* 深色模式 */
body.dark{background:#0A1430;color:#E7E0CE}
body.dark h2,body.dark h3,body.dark .rich strong,body.dark .chhead .t,body.dark .arc .big,body.dark .tools .item b,body.dark .iss .hd,body.dark .qn b,body.dark .back,body.dark .big-gk,body.dark .serm h3{color:#E2B86A}
body.dark .card,body.dark .arc,body.dark .tts,body.dark .tools .item,body.dark .sres,body.dark .svgwrap,body.dark .subs button span,body.dark .chip{background:#12224A;border-color:#2A3E6E;color:#E7E0CE}
body.dark .chip.on,body.dark .subs button.on span{background:#E2B86A;color:#051434;border-color:#E2B86A}
body.dark .subs button.lsn span{background:#2A2A1E;color:#E2B86A;border-color:#8A6A2A}
body.dark .mute,body.dark .tools .item small,body.dark .tts .st{color:#A9A28F}
body.dark .faint{background:#152650;color:#B7B09D;border-left-color:#5A6A90}
body.dark .lab{background:#2A3456;color:#E2B86A}
body.dark .rich blockquote,body.dark .serm blockquote,body.dark .grkbox,body.dark .utxt,body.dark .iss .pos{background:#16285A;color:#E7E0CE}
body.dark .rich th{background:#051434}
body.dark .rich th,body.dark .rich td{border-color:#2A3E6E}
body.dark .deep{background:#1E2A44}
body.dark .deep .q{color:#E2B86A}
body.dark textarea,body.dark input[type=search],body.dark input[type=text]{background:#0F1C40;color:#E7E0CE;border-color:#2A3E6E}
body.dark .btn.ghost{color:#E2B86A;border-color:#E2B86A}
body.dark .row,body.dark .check,body.dark .tpl{border-color:#24365F}
body.dark .tpl.on{background:#1E2A44}
body.dark .stop:after{background:#0A1430;border-color:#E2B86A}
body.dark .stop.top:after{background:#E2B86A}
body.dark .stop.bot:after{background:#C46A5C;border-color:#C46A5C}
body.dark .safe .s1{color:#E89A8C}
body.dark .safe .s3{color:#8FC9A9}
body.dark #modal .box{background:#12224A}
body.dark .v{color:#EDE6D4}
body.dark .notebtn{color:#E2B86A;border-color:#8A6A2A}
body.dark .notebtn.has{color:#051434}
body.dark .chhead .k,body.dark .grphd,body.dark .trk .h{color:#E2B86A}
body.dark mark{background:#8A6A2A;color:#fff}
body.dark .utxt,body.dark .check.done span{color:#C9C2AE}
body.dark .t-band{fill:#12224A}
body.dark .t-band2{fill:#0F1C40}
body.dark .t-txt{fill:#E7E0CE}
body.dark .t-axis{stroke:#2A3E6E}
</style>

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"直等到天發亮，晨星在你們心裡出現","sub":"賜下、加上、照亮","lv":"A","arc":"星","sec":[["1:1--2","問安——同得一樣寶貴的信心，因認識主而多多加給的恩惠平安"],["1:3--4","神能已賜下一切——又寶貴又極大的應許，與神的性情有分"],["1:5--11","八個台階——從信心加到愛眾人，永不失腳，豐豐富富進入永遠的國"],["1:12--15","帳棚快拆了——臨終的提醒、激發與記念"],["1:16--18","不是捏造的虛言——聖山上親眼見過的威榮、親耳聽見的聲音"],["1:19--21","燈照在暗處——更確的預言、晨星與聖靈的感動"]],"serm":{"pts":[["一切都已經給了","1:3--4","長進不是爬上去見神，是神已經下來把一切賜給我們。"],["所以要加上","1:5--11","恩典不叫人閒懶，恩典叫人分外殷勤；台階的終點是愛人。"],["燈與晨星","1:12--21","天亮以前，神的話是照在暗處的燈；我們留意它，直到晨星在心裡出現。"]]},"q":"許多基督徒把信仰活成一種「還差一點」：再多一次聚會、再多一次特別的經歷、再多讀一本書，才算夠屬靈；也有人反過來想：反正已經得救了，長不長進沒有甚麼分別。一位快要殉道的老使徒，在臨終的信裡兩種都不接受。他先說：「神的神能已將一切關乎生命和虔敬的事賜給我們」——你不缺；接著說：「正因這緣故，你們要分外地殷勤」——你要長，而且要長到愛眾人；最後說：天亮以前，神的話「如同燈照在暗處」，留意它，「直等到天發亮，晨星在你們心裡出現」。長進不是爬上去見神，是神已經下來把一切賜給我們，我們才在其中長大。","truth":"神的神能已將一切賜給我們，所以我們要在信心裡一層一層加上，直到愛眾人；天亮以前留意那照在暗處的燈，直等到晨星在心裡出現。","mv":{"t":"神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。","r":"彼後1:3--3"},"card":["一位知道帳棚快拆的老使徒，先宣告神的神能已將一切關乎生命和虔敬的事賜給我們，叫我們脫離敗壞、與神的性情有分；因此要在信心裡加上德行，一直加到愛眾人，使蒙召堅定、永不失腳。他提醒我們：所信的不是捏造的虛言，是聖山上親眼見過的威榮；天亮以前，要留意那照在暗處的燈。","δεδωρημένης——「已將……賜給」是完成式；ἐπιχορηγήσατε——「加上」是慷慨的供應。先有神的完成式，才有人的命令式。","神已將一切賜給我們（完成式，至今仍在手中）；舊日的罪已經得了潔淨（1:9）；你在信心裡慷慨供應，神必將進入永遠之國的入口，豐豐富富地供應給你（1:11，將來式被動）。","無己，是承認一切都是領受的。與神的性情有分，是進入與無限之神的相交，不是人變成無限；帳棚要拆，名字要被忘記，被記念的應當是那一位。","「一切我都已經給了你。天亮以前，留意我的話；那晨星就是我。」","這一週每天早上讀彼後 1:3–11，從八項裡挑出你最缺的一項，求主在你信心裡供應它，並且向一個具體的人活出來。","最終整合：一個老人提筆，\n他知道帳棚快拆了。\n\n他想起那一座山——\n榮光、雲彩、天上來的聲音：\n「這是我的愛子，我所喜悅的。」\n那一天他只想搭三座棚，\n把光留在山上。\n\n如今他知道，\n光是留不住的，\n光是要等的。\n是主陪他等了三十年。\n\n所以他把一盞燈交給我們：\n先知更確的預言，\n照在又乾又暗的地方。\n它不是太陽，\n只照亮腳前一步；\n可是天亮以前，\n這就夠了。\n\n留意它。\n在信心裡加上德行，\n一層一層，\n一直加到愛眾人。\n\n直等到天發亮，\n晨星在你們心裡出現——\n那時燈可以放下，\n因為光本人來了。"],"self":"眼瞎的定義：只看見近處的，忘了自己舊日的罪已經得了潔淨——忘記恩典的人，長不出愛。","t321":{"k":"「這是我的愛子，我所喜悅的」（1:17）。：\\ > 我們效法的不是一套規條，是聖山上那一位被父喜悅的兒子。 > > 而且他「用自己榮耀和美德召我們」（1:3）——「美德」ἀρετή 與 1:5「德行」是同一個字。\\ > 他身上有的，他召我們在信心裡加上；榜樣不是站在遠處叫我們爬，是走在前面、把自己的樣子分給我們。","g":"「直等到天發亮，晨星在你們心裡出現」（1:19）。：\\ > 讓耶穌作王，就是讓光照進「心裡」，不是只在腦子裡多一條知識。 > > 天亮以前，我交出的是自己的燈、自己的閃光、自己的私意，只留意他的話。\\ > 國也是他的：「我們主救主耶穌基督永遠的國」（1:11）——進那國的門，是他親手豐豐富富打開的。","p":"「有了愛弟兄的心，又要加上愛眾人的心」（1:7）。：\\ > 八個台階的終點不是一個人多屬靈，是他多能愛人。 > > 屬神的體系不是先蓋組織，是從神賜下的生命長出來：先生命（1:3–4 神已賜下一切），再關係（1:7 愛弟兄、愛眾人），後事工（1:8 不至於閒懶不結果子）。\\ > 次序顛倒，事工就成了沒有根的忙碌。"},"grp":["【一、破冰】你曾經在甚麼時候覺得「我還差一點才夠屬靈」？那一點，你當時以為是甚麼？","【二、扎心】1:9 說沒有這幾樣的人「只看見近處的，忘了他舊日的罪已經得了潔淨」。這一個月，你眼睛最常盯著的「近處」是甚麼？你上一次為自己被赦免而感恩，是甚麼時候？","【三、福音】1:3 說神「已將一切」賜給我們，用的是完成式。如果這是真的，你最近一直在向神「要」的那一樣，會不會其實是要你更深地認識那一位已經給了一切的主？","【四、行動】從 1:5–7 八項（德行、知識、節制、忍耐、虔敬、愛弟兄的心、愛眾人的心）裡，選出你最缺的一項。這一週，你要向誰、在甚麼場合，具體地活出這一項？","【五、代禱】1:19 說要留意那照在暗處的燈。請組員兩兩一組，為對方正在經歷的那一段「暗處」禱告，求主的話成為他腳前的燈，直到天發亮。"],"prac":{"main":"這一週，每天早上讀彼後 1:3–11，在信心裡慷慨地加上一項","items":["對神：每天早上先讀 1:3，用一句話感謝神已將一切關乎生命和虔敬的事賜給你，再開始一天的禱告。","對自己：做一次 1:9 的眼科檢查——寫下一件主赦免你的事，想起你被潔淨的那一天。","對人：選一位教會外、不好愛的人，這一週為他做一件具體的事，操練「愛眾人的心」。","對生活：每天睡前留意一節經文（1:19），把它寫在手機桌布或便條上，讓燈照在你明天的路上。","對使命：像彼得「常常提醒」一樣，找出你的那一個「2」，把這週讀到的一句話傳給他，激發他。"]},"safe":["① 錯誤講法：把 1:4「與神的性情有分」講成人可以成為神，或修煉到與神同等。\n這不是彼得的意思；創造者與受造者的分別永遠存在，有分是恩典，不是修煉（另見 ISS00_2）。\n檢驗標準：有沒有明說人不會變成神、不與神的本質混同？有沒有講到有分的內容就是 1:5–7 的品格？","② 錯誤講法：因為怕講錯，就把 1:4 跳過不講，只講 1:5–7 的「要加上」。\n跳過 1:4，八個台階就失去了根，成了人的努力；1:4 是全卷最大的安慰：神要把自己的生命與品格分給我們。\n檢驗標準：1:4 在講章裡有沒有被正面講出來？會眾聽完，是更敬拜神，還是只多了一張待辦清單？","③ 錯誤講法：說「彼得也有八大步驟」，把 1:5–7 講成 321 改變觀念八大步驟的插圖。\n兩者是兩回事：彼得的八項是品格的果子，321 的八步是觀念改變的過程；最多只能說「這使我們想起」，而且要明說不是同一件事。\n檢驗標準：講章裡 1:5–7 有沒有先照經文講完？有沒有出現「這就是」「正是」把兩者相連？","④ 錯誤講法：用 1:20「沒有可隨私意解說的」告訴會眾不要自己讀經，或說只有牧師才能解經。\n這是誤用；1:20 講的是預言的來源，1:21 的「因為」說明了這一點（另見 ISS00_3）。\n檢驗標準：有沒有講出讀經的保護——在群體中讀、照上下文讀、謙卑地讀？會眾聽完，是更想打開聖經，還是更不敢讀？","⑤ 錯誤講法：用 1:19「更確的預言」貶低一切屬靈經歷，說經歷都不可靠、不必理會。\n彼得自己的見證就是一次經歷（1:16–18）；這節的重點是經歷證實了預言，不是拿經歷和聖經比高低。\n檢驗標準：曾經在禱告或敬拜中真實遇見主的弟兄姊妹，聽完是被尊重，還是被嘲笑？","⑥ 錯誤講法：反過來用 1:16–18 抬高屬靈經歷，說「我也上過山、看過異象，所以要聽我的」。\n彼得的經歷把人指向「先知更確的預言」，不是指向他自己；經歷要被聖經檢驗，不是聖經要被經歷補充。\n檢驗標準：講章裡最後被高舉的，是那盞燈和那晨星，還是講員的經歷？","⑦ 錯誤講法：把彼得講成英雄——臨終從容、見過異象、一生堅固，好像全章的主角是他。\n每一處〔背景〕都要落在主身上：是主在海邊重新叫他的名字，是主預告又陪他走了三十年，是主先為他祈求。\n檢驗標準：會眾讀完，是更佩服彼得，還是更愛那位恆久忍耐的主？","⑧ 錯誤講法：跳過書信的處境，直接把每一節變成今天的勵志格言。\n書信三問：受書人遇到甚麼（假師傅將要從裡面起來、主再來被譏誚）？彼得從福音推出甚麼原則（神已賜下一切，所以要加上、要留意那燈）？今天這原則落在哪裡（在資訊混亂與屬靈速成的時代，回到神的話上長進）？\n檢驗標準：三問有沒有都答到？今天的應用是不是從第二問推出來的，不是另外加上去的？","⑨ 錯誤講法：把 1:5–7 講成得救的門票——八項都做到，神才接納你。\n1:5 開頭是「正因這緣故」，回指 1:3–4 神已經賜下的一切；台階是從恩典長出來的，不是用來買恩典的。\n檢驗標準：講章裡神已賜下的一切（1:3–4），有沒有講在「你們要分外地殷勤」之前？","⑩ 錯誤講法：用 1:10「使你們所蒙的恩召和揀選堅定不移」叫會眾擔心自己隨時會被除名。\n源頭在神，確據在生命；「堅定」是在已有的恩典上活出來的確認，「永不失腳」是應許，不是威脅（另見 ISS00_5）。\n檢驗標準：一位信心軟弱的弟兄聽完，是更有把握地殷勤，還是更焦慮地懷疑？","⑪ 錯誤講法：用 1:9「就是眼瞎」去指著別人說「你看不清楚、你屬靈近視」。\n這節是給自己的眼科檢查，不是給別人的診斷書；病根是忘了恩典，藥是「常常提醒」（1:12）。\n檢驗標準：講員自己有沒有先站在這節經文底下？","⑫ 錯誤講法：把 1:3「一切關乎生命和虔敬的事」講成神應許一切物質的豐富與成功。\n範圍是「生命和虔敬」，管道是「認識那……召我們的主」；這不是成功神學的支票。\n檢驗標準：講章裡的「一切」，是指向更認識主，還是指向更多擁有？","⑬ 錯誤講法：拿 1:1 的 Granville Sharp 規則或 1:19 的比較級在講台上炫學，講了半天文法卻沒有轉成生命。\n原文的用處是叫人看見耶穌是「我們的神和救主」、看見那盞燈；三十秒內轉不成生命的，留在書房。\n檢驗標準：每一處原文之後，會眾有沒有聽見一句可以帶回家的話？","⑭ 錯誤講法：把 1:19「晨星在你們心裡出現」講成追求個人的新啟示、新真理，好像燈不夠用，要等更高的光。\n1:12 說的是「已有的真道」；晨星主要指主再來的那個早晨，今天留意燈光的人，是在預嘗那光，不是另找一盞燈。\n檢驗標準：講章有沒有把人帶回手中的聖經？有沒有暗示某些人擁有別人沒有的「新真理」？"]},{"n":2,"t":"這些人是無水的井，是狂風催逼的霧氣","sub":"乾井、搭救、回頭","lv":"A","arc":"井","sec":[["2:1--3","假師傅的來路——從裡面起來、不承認買他們的主、貪心取利"],["2:4--9","三個審判，兩個搭救——天使、挪亞、所多瑪與義人羅得；主知道搭救敬虔的人"],["2:10--16","任性與巴蘭的路——輕慢、毀謗、引誘，一頭驢攔阻先知的狂妄"],["2:17--19","無水的井——應許人自由，自己卻作敗壞的奴僕"],["2:20--22","回頭的兩種方向——狗回到所吐的，人回到主面前"]],"serm":{"pts":[["乾井會從裡面冒出來","2:1--3","危險不只在外面；先照自己，再分辨別人。"],["主知道搭救","2:4--10","審判再重，搭救更確定；講審判是為了叫敬虔的人安心。"],["假自由與真回頭","2:10--22","自己作主的人，最後被別的東西作主；只有回到主面前，才是真自由。"]]},"q":"你可能也問過：講台上那麼多聲音，我怎麼知道哪一個是真的？更痛的是，有些傷害正是從教會裡面來的——一個你信任過的講員，一筆說不清的奉獻，一句「你批評我就是輕慢主治的」。彼得說得很直：「將來在你們中間也必有假師傅。」乾井會從裡面冒出來。但他接著用三個審判的例子，說出全章最要緊的一句：「主知道搭救敬虔的人。」審判再重，搭救更確定；彼得講審判，是為了叫敬虔的人安心，不是叫他們害怕，更不是叫他們去懷疑每一個人。","truth":"乾井會從裡面冒出來，審判也一個不漏；但三個審判裡藏著兩次搭救——審判再重，搭救更確定：主知道搭救敬虔的人。","mv":{"t":"主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子。","r":"彼後2:9--9"},"card":["彼得預告假師傅會從教會裡面起來：不承認買他們的主、貪心取利、放縱情慾、輕慢主治、應許人自由自己卻作奴僕。他用天使、洪水、所多瑪三個審判證明神必審判，又在其中指出挪亞與羅得兩次搭救，說出全章樞紐：主知道搭救敬虔的人。最後他警告：回頭有兩種——狗回到所吐的，人回到主面前。","οἶδεν κύριος ῥύεσθαι——主不只是知道，他懂得怎樣搭救；審判在條件子句裡，搭救在主句裡。","假師傅否認的，是一位付了價的主人（ἀγοράσαντα，過去式：價已經付了）；我們得救，也不是因為我們夠好，是那拉著羅得的手、把我們從試探中拉出來的主。","有己就是 2:10 的「任性」——以自己為樂、自己作主；結局是 2:19 被別的東西作主。無己是回到本位：搭救是主的事，審判也是主的事，我只管敬虔。","「我知道怎樣把你拉出來。你不必替我清理門戶，只要跟著我。」","這一週，把 2:1–19 的五個記號（對基督、金錢、身體、權柄、自由）拿來先照自己，每天照一個，寫下一句向主的回應。","最終整合：一個老人寫下「不承認」三個字，\n手停了一下。\n他記得院子裡的火，\n記得雞叫，\n記得那一位轉過身來看他。\n\n他寫天使被拘禁，\n寫洪水淹沒上古的世代，\n寫兩座城燒成了灰。\n\n可是每一場審判裡，\n都有一隻伸出來的手——\n一條船上的八個人，\n一個被拉著手領出城外的羅得。\n\n於是他寫下全章最長那句話的落點：\n「主知道搭救敬虔的人。」\n\n不是因為彼得很堅強，\n是因為那一夜主說過：\n「你回頭以後，要堅固你的弟兄。」\n\n乾井會乾，霧氣會散，\n審判一直醒著；\n但比審判更確定的，\n是那隻沒有放手的手。\n\n這就是無己：\n不替神宣判，不替神清理，\n回到本位，讓神作神——\n他審判，他搭救，\n我們只管跟著他走。"],"self":"有己的定義：膽大任性（αὐθάδεις）——以自己為樂、隨己意，自己作主，最後被別的東西作主（2:19）。","t321":{"k":"寫「連買他們的主他們也不承認」（2:1）的人，自己不承認過主。> 「主轉過身來看彼得……他就出去痛哭。」（路 22:61–62）\\ > 耶穌的榜樣不在彼得身上，在那一位轉過身來的主身上：他看見跌倒的人，沒有轉身離開，而是等他回來，還把「堅固你的弟兄」交給他。\\ > 所以我講第 2 章，不是站在高處定別人的罪，是用被等回來的身分，向正往下走的人呼喊。","g":"假師傅「連買他們的主他們也不承認」（2:1）；我們是「讓買我們的主作王」。> 付了價的主人（δεσπότης）有產權——我的時間、錢財、身體、口舌，都不是我自己的（林前 6:20）。\\ > 讓耶穌作王的反面不是無神論，是「任性」（2:10）：口稱主，生活裡自己作主。\\ > 本週要交出的權力：替神宣判別人的權力，和「我可以控制」的那一件事。","p":"屬神的體系不是沒有領袖，是有屬神記號的領袖。> 第 2 章被定罪的正是「師傅」——有講台、有跟從者的人；所以屬神體系的領袖要帶著相反的記號：\\ > 對主，承認付了價的主人；對群羊，「不是轄制……乃是作群羊的榜樣」（彼前 5:3）；對金錢，財務透明，「不但在主面前，就是在人面前」（林後 8:21）；對質疑，照程序、在愛中回應，不拿 2:10 堵口。\\ > 一口有水的井，不是最有名的井，是自己也在喝活水的井。"},"grp":["【一、破冰】你曾經在甚麼時候「被一個說法吸引」，後來才發現不是那麼回事？（可以是廣告、投資、或一句很動聽的話，只說場景即可。）","【二、扎心】2:1–19 給了五個記號：對基督、對金錢、對身體、對權柄、對自由。先不看別人——這五個記號裡，哪一個最照得到你自己？","【三、福音】2:4–9 三個審判裡藏著兩次搭救；羅得是被天使拉著手領出城的。你生命中有沒有一次，是主「拉著你的手」把你從試探裡帶出來的？","【四、行動】2:19 說「人被誰制伏就是誰的奴僕」。說出一件你常說「我可以控制」、其實已經在控制你的事，這一週你要怎樣把它交給主？","【五、代禱】為組裡一位正在掙扎、或剛剛跌倒的人禱告（不必說出細節）：「主，你知道怎樣搭救他；求你拉著他的手，帶他回到你面前。」"],"prac":{"main":"這一週，用五個記號先照自己，再為一位「心不堅固」的人站在他身邊","items":["對神：每天早上讀一次 2:9，向主說：「主，你知道怎樣搭救我；今天我不替你審判任何人。」","對自己：用五個記號（對基督、金錢、身體、權柄、自由）每天照一個，寫下一句向主承認的話。","對人：找一位初信或剛離開舊生活的人（2:18「剛才脫離妄行的人」），本週約他吃一頓飯，陪他讀一段經文。","對生活：找出一件你說「我可以控制」的事（螢幕、消費、飲食、情緒），本週為它設一條具體的界線，並告訴一位屬靈同伴。","對使命：若你有服事或帶領的位置，本週主動向同工或長執說明一筆你經手的帳目或一個決定；若沒有，就為你教會的領袖禱告，求主保守他們不作乾井。"]},"safe":["① 錯誤講法：在講台上點名今天某位牧師、某個教會、某個宗派或網路傳道人是「2:1 的假師傅」\n彼得給的是辨認的記號，不是一張名單；講台教會眾分辨果子，不替會眾判決（紅線一）。\n檢驗標準：不同教會背景的人聽完，是更會照自己、更會分辨果子，還是更想轉貼「某某是假師傅」？","② 錯誤講法：用 2:10「輕慢主治的」「毀謗在尊位的」堵住會友對領袖的正當質疑——「你批評牧師就是輕慢主治的」\n「主治的」最自然指主的權柄；第 2 章被定罪的正是「師傅」，彼得給長老的命令是「不是轄制」（彼前 5:3）（紅線二）。\n檢驗標準：有沒有講到被定罪的是在上位的人？有沒有回指彼前 5:3？","③ 錯誤講法：用 2:20–22「狗轉過來吃」恐嚇跌倒、掙扎的信徒，或對某個人說他已經回不了頭\n上下文是假師傅與跟從他們轉背的人；跌倒而想回頭的人要同時聽見 1:9「已經得了潔淨」與 3:9「乃願人人都悔改」（紅線五）。\n檢驗標準：一位剛跌倒、很想回頭的弟兄聽完，是更想回來，還是更絕望？","④ 錯誤講法：講完全章只剩懷疑與警告，沒有講到 2:9「主知道搭救敬虔的人」\n2:4–10 是一個長句，三個審判都是條件子句，主句是搭救；第 2 章的篇名是「井」，落點卻是 2:9。\n檢驗標準：會眾走出去時，記得的是「誰可能是假的」，還是「主知道搭救我」？","⑤ 錯誤講法：把羅得美化成敬虔的榜樣，或反過來把他當笑話、嘲笑他「這種人也算義人」\n創 19 的羅得選了所多瑪、遲延不走、後來醉酒；彼得稱他義人，定義在 2:8「義心天天傷痛」，而他蒙救的主詞是神。\n檢驗標準：有沒有講到「義不是完美，是還會傷痛的心」，以及搭救是恩典？","⑥ 錯誤講法：把以諾一書當成正典，用它來補充天使犯罪的細節，或說「彼得既然用了，以諾一書就是神的話」\n彼得與猶大借用讀者熟悉的背景，就像保羅引用希臘詩人（徒 17:28）；借用不等於列入正典，彼得也沒有展開細節。\n檢驗標準：講台上關於墮落天使的內容，有沒有超出聖經本文？","⑦ 錯誤講法：把 2:4「丟在地獄，交在黑暗坑中」講成一幅陰間地圖——地獄分幾層、天使關在哪一層\nταρταρώσας 新約僅此一次，彼得借字講一個真實的拘禁，不提供空間結構；他要說的只有一句：神沒有寬容。\n檢驗標準：會眾帶走的是對神公義的敬畏，還是對陰間構造的好奇？","⑧ 錯誤講法：講第 2 章時把自己放在審判台上，講得好像講員與會眾都是「真的」，問題都在外面的人\n寫「不承認」的彼得自己不承認過主；危險「在你們中間」，分辨先從自己開始。\n檢驗標準：講員有沒有在講台上先承認：這五個記號也照得到我？","⑨ 錯誤講法：用 2:1「連買他們的主」在講台上裁決有限救贖或普遍救贖，並說另一派不合聖經\n這一節兩派都讀得通，不宜單憑它定案；彼得要量的是罪的深度：他們否認的是一位付了價的主人。\n檢驗標準：不同神學傳統的弟兄姊妹聽完，是被定罪，還是一起被提醒「我是被買來的」？","⑩ 錯誤講法：把 2:3「貪心取利」講成「傳道人領薪水就是貪心」，或反過來完全迴避錢的話題\n傳福音的靠福音養生是主所命定的（林前 9:14）；2:3 的記號是用捏造的話「在你們身上取利」——把人當貨。最好的回應是財務透明。\n檢驗標準：有沒有講到教會自己的財務透明，而不是只批評別的教會？","⑪ 錯誤講法：把 2:11 講成「基督徒不可以抵擋魔鬼」，或反過來鼓勵與邪靈對話、嘲弄、喊話\n2:11 教的是謙卑：連天使都把審判交給主；雅 4:7「務要抵擋魔鬼」仍然有效，但焦點在主，不在魔鬼。\n檢驗標準：會眾的眼睛最後停在魔鬼身上，還是主身上？","⑫ 錯誤講法：把巴蘭的驢講成笑話就結束，或寓意化成「驢代表某某」\n彼得照民數記接受這件神蹟，重點是諷刺：自以為屬靈的人不如一頭驢清醒；神在人走向滅亡的路上一再攔阻。\n檢驗標準：會眾笑完之後，有沒有問自己：我正往「不義的工價」那裡走嗎？","⑬ 錯誤講法：用 2:19「被誰制伏就是誰的奴僕」把自由講成一套新的規條，叫人靠守規矩得自由\n假自由是放縱，但真自由不是律法主義；真自由是 1:4「脫離敗壞」、有一位好主人（約 8:36）。\n檢驗標準：會眾聽到的是「多守幾條規矩」，還是「讓耶穌作王才是自由」？","⑭ 錯誤講法：把第 2 章當成一份脫離處境的「假師傅辨認手冊」，一條一條套在今天的人身上\n書信三問：受書人遇到甚麼——從教會裡面起來、否認審判、放縱又取利的教師；彼得從福音推出甚麼原則——主是付了價的主人，他知道搭救，也必審判；今天這原則落在哪裡——先照自己，守住被買來的身分，陪伴心不堅固的人。\n檢驗標準：三問有沒有依次答完，而且第三問落在會眾自己的生活，而不是別人的名字？"]},{"n":3,"t":"我們照他的應許，盼望新天新地，有義居在其中","sub":"記得、寬容、長進","lv":"A","arc":"天","sec":[["3:1--2","兩封都是提醒——記念先知的話與主救主的命令"],["3:3--7","應許在哪裡呢——譏誚的人故意忘記的事"],["3:8--10","一日如千年——不是耽延，乃是寬容；主的日子像賊來到"],["3:11--14","該當怎樣為人——聖潔、敬虔、切切仰望、安然見主"],["3:15--18","親愛的兄弟保羅、防備墜落、在恩典和知識上有長進"]],"serm":{"pts":[["應許在哪裡呢","3:1--7","譏誚的人不是不知道，是故意忘記；信心的一半是記得。"],["不是耽延，乃是寬容","3:8--10","主的慢是愛的等；等候的時間是悔改與傳福音的時間。"],["等候的人怎樣活","3:11--18","盼望新天新地的人，今天就活得不一樣；最後一句是：願榮耀歸給他。"]]},"q":"「都兩千年了，還在等？」這句話不只出現在譏誚的人口中，也悄悄藏在許多等得很累的信徒心裡：等家人信主，等禱告蒙應允，等主回來，等到開始懷疑應許是不是落空了。彼得在遺言的最後一章回答：主看一日如千年，千年如一日；他不是耽延，乃是寬容，不願有一人沉淪。所以等候的人不必推算日子，也不必焦慮；要防備墜落，在恩典和知識上長進，盼望一個有義居在其中的新天新地，並且把榮耀歸給他。","truth":"主的慢不是耽延，是愛的寬容；等候新天新地的人，先防備墜落，再在主的恩典和知識上長進，最後把一切榮耀歸給他。","mv":{"t":"主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。","r":"彼後3:9--9"},"card":["彼得用遺言的最後一章提醒教會：譏誚的人問「應許在哪裡呢」，是故意忘記神的話創造過、審判過、也正托住這世界；主看一日如千年，不是耽延，乃是寬容，等人悔改；主的日子必像賊來到，一切都要在他面前顯露。所以盼望新天新地的人要聖潔敬虔、安然見主；防備墜落，在恩典和知識上長進，把榮耀歸給他。","「不是耽延，乃是寬容」——μακροθυμεῖ，把怒氣拉長。主的慢，是愛的等；他不願有一人沉淪。","以主長久忍耐為得救的因由（3:15）：主多等一天，就多一個人可以回頭。那日我們被他找到時的「沒有玷污」，是從無瑕疵、無玷污的羔羊來的（彼前 1:19）。","被保羅當面抵擋過的彼得，在遺言裡稱他「我們所親愛的兄弟」。無己的人不替自己辯護，只認同一位主、同一個福音——無己才能合一。","「我不是遲延；我在等你，也在等你還沒回家的那一位。」","寫下一位你為他等了很久、還沒信主的人的名字；這一週每天為他禱告一次，並且主動問候他一次。","最終整合：一個老人在尼祿的陰影下寫信，\n知道帳棚快要拆了。\n外面有人在笑：「應許在哪裡呢？」\n\n他想起海邊的炭火，\n想起三次的問話，\n想起主等了他多久。\n於是他寫：不是耽延，乃是寬容。\n\n他也想起安提阿的那一頓飯，\n自己怎樣在一頓飯之間退去（加 2:12）。\n於是他寫：要防備，\n免得從自己堅固的地步上墜落。\n\n可是防備，不是站著不動。\n站得住的人，還要長——\n在我們主救主耶穌基督的恩典和知識上，有長進。\n\n然後他放下筆。\n最後一句不是叮嚀，是讚美：\n「願榮耀歸給他，從今直到永遠。阿們！」\n\n新天新地還沒有來，\n義卻已經在一些人心裡住下。\n等候的人，今天就把榮耀歸給他。"],"self":"焦慮的定義：用自己的鐘錶衡量神的信實，把主的寬容誤認成主的缺席。","t321":{"k":"「以我們主長久忍耐為得救的因由」（3:15）。：\\ > 彼得寫「寬容」，因為他自己是被寬容等回來的——三次不認主，主在海邊預備了炭火和魚，三次問他「你愛我嗎」。\\ > 主怎樣等我們，我們就怎樣等人：等還沒回頭的家人，等跌倒了還想回來的弟兄。> > 效法主的忍耐，不是催別人快一點，是像主一樣把怒氣拉長。","g":"「願榮耀歸給他，從今直到永遠。阿們！」（3:18）。：\\ > 這是新約少數直接把榮耀歸給基督的頌讚之一；全卷以「我們的神和救主耶穌基督」（1:1）開頭，以敬拜基督結束。\\ > 讓耶穌作王，在這一章是交出兩樣東西：交出時間表——日子在他手裡，不在我們的換算裡；交出榮耀——一個快要殉道的老人，最後一口氣不提自己，只說「歸給他」。","p":"「盼望新天新地，有義居在其中」（3:13）。：\\ > 屬神體系的終局，是一個「義」安家的地方——κατοικεῖ，住下來不走。\\ > 而這個體系今天就從「我們所親愛的兄弟保羅」（3:15）開始：曾經衝突的兩位使徒，站在同一個福音上。這是 235 的「2」——屬靈同伴。無己才能合一，合一的人才建得起屬神的體系。> > 盼望新天新地的人，今天就讓義先在家裡、教會裡、對待神所造世界的方式裡住下來。"},"grp":["【一、破冰】你這一生等過最久的一件事是甚麼？等的時候，你最常對自己說的一句話是甚麼？","【二、扎心】3:9 說「有人以為他是耽延」。你心裡有沒有一件事，你其實已經把它當成「神耽延了」？如果換成神的觀點，把它讀成「寬容」，這件事會有甚麼不同？","【三、福音】彼得寫「不願有一人沉淪」，他自己就是被主寬容等回來的人。請分享：主曾經在哪一件事上等過你？你是怎樣被等回來的？","【四、行動】3:17–18 的次序是先防備墜落，再在恩典上長進，最後把榮耀歸給他。這三件事裡，你這一季最弱的是哪一件？這一週你要做的一個具體動作是甚麼（時間、地點、對象）？","【五、代禱】請每人說出一位你為他等了很久、還沒信主或已經離開教會的人的名字（只說名字，不必說細節），全組一起為他禱告：「主啊，求你的寬容臨到他。」"],"prac":{"main":"這一週，把一件「神耽延了」的事，改寫成「神在寬容」的禱告","items":["對神：這一週，把一件你覺得「神耽延了」的事寫下來，每天用 3:9 改寫成一句禱告：「主啊，你不是耽延，你在等。」","對自己：讀 3:17，找出一個最容易把你「一同帶走」的錯謬或習慣，寫下你防備它的一個具體做法","對人：找一位你為他等了很久、還沒信主或離開教會的人，這一週主動問候他一次，不急著勸，只表達關心","對生活：從 3:11「該當怎樣聖潔，怎樣敬虔」出發，檢查一件日常的事——花錢、用時間、對待神所造的世界——作一個小調整","對使命：在小組或家裡讀 3:18，然後一起說一次：「願榮耀歸給他，從今直到永遠。阿們！」"]},"safe":["① 錯誤講法：用 3:8「一日如千年」換算末日或創造日（例如說創造六日之後六千年主必再來）\n這是錯誤的用法：彼得兩個方向都說——「一日如千年，千年如一日」——正是為了取消換算；ὡς 是比喻，不是等號。\n檢驗標準：有沒有講到 3:8 兩個方向都說？有沒有講到 3:10「像賊來到」？","② 錯誤講法：用 3:12「切切仰望」推算日期，或說人可以用某種宗教、政治工程「加速」主再來\n這不是 3:12 的意思：原文較支持「催促」，但方法是 3:9 的悔改與 3:11 的聖潔敬虔，是參與神的心意，不是掌握神的時間表。\n檢驗標準：講完之後，會眾想做的是悔改、聖潔、傳福音，還是去研究時事表、計算年份？","③ 錯誤講法：說「地球反正要燒掉，照顧受造界沒有意義」\n這是誤用 3:10–12（紅線六）：洪水「消滅」了當時的世界，地卻仍在（3:6）；3:13 的「新」καινός 是更新；3:11「該當怎樣聖潔」是今天的生活。\n檢驗標準：有沒有講到 3:13「新天新地，有義居在其中」？聽完的人對神所造的世界更珍惜，還是更隨便？","④ 錯誤講法：把 3:10–13 講成某一個環保政策或政黨的背書，在講台上作政治動員\n照顧受造界是管家的本分，不是政治陣營的標籤（紅線六的另一面）；講台講原則，不替會眾投票。\n檢驗標準：不同政治立場的弟兄姊妹聽完，是一起更敬畏造物主，還是彼此更對立？","⑤ 錯誤講法：把 3:15–16 讀成彼得與保羅的角力，或藉此貶低保羅「難懂」、貶低彼得「沒學問」\n這不是兩位使徒的較量（紅線七）：加 2:11 的事件可以講，但落點是 3:15「我們所親愛的兄弟」——被糾正過的人稱糾正他的人為兄弟。\n檢驗標準：有沒有講到 3:15「親愛的兄弟」？會眾聽完是更想和好，還是更想選邊？","⑥ 錯誤講法：用 3:16「難明白的」勸會眾別自己讀保羅書信，說只有牧師能解經\n這是誤用（紅線八）：出問題的是「無學問、不堅固的人強解」，不是讀的人；保護讀經的方法是在群體中、照上下文、謙卑地讀。\n檢驗標準：有沒有給出一個會眾今天就能用的讀經方法？聽完的人是更想讀經，還是更不敢讀？","⑦ 錯誤講法：說「和合本 3:10 譯錯了」或「某某譯本是錯的」\n3:10 是抄本的異文問題，不是翻譯的對錯：和合本「燒盡了」跟從 κατακαήσεται 的抄本，SBLGNT 作 εὑρεθήσεται「被顯露」，NA28 作 οὐχ εὑρεθήσεται；並陳，兩讀都不是神丟棄受造界。\n檢驗標準：會眾聽完是更信任手上的聖經、也更明白抄本的歷史，還是開始懷疑聖經？","⑧ 錯誤講法：只講天被火燒、有形質的銷化，不講新天新地\n3:10–12 的火不是結尾；彼得的句子停在 3:13「盼望新天新地，有義居在其中」，κατοικεῖ 是住下來不走。\n檢驗標準：講完之後，會眾心裡留下的是火的畫面，還是家的畫面？","⑨ 錯誤講法：把等候講成焦慮的倒數，或講成消極地坐著等、甚麼都不做\n3:9 的等候是悔改與傳福音的時間；3:11–14 的等候是聖潔、敬虔、殷勤；果效是忍耐，不是恐慌，也不是閒懶。\n檢驗標準：會眾走出去，是更害怕、更冷淡，還是更平安、更殷勤？","⑩ 錯誤講法：用 3:9「不願有一人沉淪」宣講人人終必得救，取消 3:7 的審判\n同一段經文說「不敬虔之人受審判遭沉淪」（3:7）；3:9 解釋的是神為甚麼還在等，不是說審判不會來。\n檢驗標準：有沒有同時講神的寬容與 3:10「主的日子要像賊來到」？","⑪ 錯誤講法：在講台上用 3:9 裁判揀選的神學系統，或用系統把這節經文的溫度冷卻掉\nβούλομαι 說的是神真實的心意；各家對揀選與普世救恩的理解並陳（見 ISS03_4），講台講的是：神在等人悔改。\n檢驗標準：一位為家人信主禱告多年的姊妹聽完，是更有盼望地禱告，還是更困惑？","⑫ 錯誤講法：用 3:5–7 在講台上裁判年輕地球或古老地球\n彼得引創世記的敘事，目的在神學：神的話創造、審判、托住世界；不是在提供一套科學宇宙論（見 ISS03_2）。\n檢驗標準：持不同創造觀的弟兄姊妹聽完，是一起敬拜造物主，還是覺得自己被排除在外？","⑬ 錯誤講法：把 3:3「好譏誚的人」當成末日倒數的記號表，看到有人譏誚就說主快來了\n「末世」是從五旬節到主再來的整段時期（徒 2:17；來 1:2）；譏誚的人是每一個世代都會面對的處境，彼得要的是「預先知道」，不是倒數計時。\n檢驗標準：有沒有把時事對號入座？","⑭ 錯誤講法：把 3:17–18 的次序顛倒，或只講「防備」不講「長進」與「榮耀」\n只講防備，教會會變成一群守城門、互相懷疑的人；彼得的次序是先防備墜落，再在恩典上長進，最後把榮耀歸給他。\n檢驗標準：講章的最後一句，是警告，還是「願榮耀歸給他」？","⑮ 錯誤講法：把彼得的遺言講成「彼得多偉大、多感人」\n〔背景〕的落點在主身上：寫「寬容」的人自己是被寬容等回來的；最後一句是「願榮耀歸給他」，不是歸給彼得。\n檢驗標準：會眾記得的是彼得，還是「願榮耀歸給他」的那一位？","⑯ 錯誤講法：跳過書信三問，直接把 3:3–13 套到今天的新聞上\n先問受書人遇到甚麼（譏誚的人說主不會來、假師傅把恩典扭成放縱）；再問彼得從福音推出甚麼原則（主的慢是寬容，盼望的人活得聖潔）；最後才問今天這原則落在哪裡（等候中的悔改、傳福音與長進）。\n檢驗標準：三問有沒有依次走完，還是直接跳到第三問？"]}],"txt":{"1":["作耶穌基督僕人和使徒的西門彼得，寫信給那因我們的神和救主耶穌基督之義，與我們同得一樣寶貴信心的人。","願恩惠、平安，因你們認識神和我們主耶穌，多多地加給你們。","神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。","因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。","正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識；","有了知識，又要加上節制；有了節制，又要加上忍耐；有了忍耐，又要加上虔敬；","有了虔敬，又要加上愛弟兄的心；有了愛弟兄的心，又要加上愛眾人的心。","你們若充充足足地有這幾樣，就必使你們在認識我們的主耶穌基督上不至於閒懶不結果子了。","人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨。","所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳。","這樣，必叫你們豐豐富富地得以進入我們主救主耶穌基督永遠的國。","你們雖然曉得這些事，並且在你們已有的真道上堅固，我卻要將這些事常常提醒你們。","我以為應當趁我還在這帳棚的時候提醒你們，激發你們；","因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的。","並且我要盡心竭力，使你們在我去世以後時常記念這些事。","我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。","他從父神得尊貴榮耀的時候，從極大榮光之中有聲音出來，向他說：「這是我的愛子，我所喜悅的。」","我們同他在聖山的時候，親自聽見這聲音從天上出來。","我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。","第一要緊的，該知道經上所有的預言沒有可隨私意解說的；","因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。"],"2":["從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認，自取速速的滅亡。","將有許多人隨從他們邪淫的行為，便叫真道因他們被毀謗。","他們因有貪心，要用捏造的言語在你們身上取利。他們的刑罰，自古以來並不遲延；他們的滅亡也必速速來到。","就是天使犯了罪，神也沒有寬容，曾把他們丟在地獄，交在黑暗坑中，等候審判。","神也沒有寬容上古的世代，曾叫洪水臨到那不敬虔的世代，卻保護了傳義道的挪亞一家八口。","又判定所多瑪、蛾摩拉，將二城傾覆，焚燒成灰，作為後世不敬虔人的鑒戒；","只搭救了那常為惡人淫行憂傷的義人羅得。","因為那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。","主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子；","那些隨肉身、縱污穢的情慾、輕慢主治之人的，更是如此。他們膽大任性，毀謗在尊位的，還不知懼怕。","就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們。","但這些人好像沒有靈性、生來就是畜類，以備捉拿宰殺的。他們毀謗所不曉得的事，正在敗壞人的時候，自己必遭遇敗壞。","行的不義，就得了不義的工價。這些人喜愛白晝宴樂，他們已被玷污，又有瑕疵，正與你們一同坐席，就以行詭詐為快樂。","他們滿眼是淫色，止不住犯罪，引誘那心不堅固的人，心中習慣了貪婪，正是被咒詛的種類。","他們離棄正路，就走差了，隨從比珥之子巴蘭的路。巴蘭就是那貪愛不義之工價的先知，","他卻為自己的過犯受了責備；那不能說話的驢以人言攔阻先知的狂妄。","這些人是無水的井，是狂風催逼的霧氣，有墨黑的幽暗為他們存留。","他們說虛妄矜誇的大話，用肉身的情慾和邪淫的事引誘那些剛才脫離妄行的人。","他們應許人得以自由，自己卻作敗壞的奴僕，因為人被誰制伏就是誰的奴僕。","倘若他們因認識主救主耶穌基督，得以脫離世上的污穢，後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了。","他們曉得義路，竟背棄了傳給他們的聖命，倒不如不曉得為妙。","俗語說得真不錯：狗所吐的，牠轉過來又吃；豬洗淨了又回到泥裡去滾；這話在他們身上正合式。"],"3":["親愛的弟兄啊，我現在寫給你們的是第二封信。這兩封都是提醒你們，激發你們誠實的心，","叫你們記念聖先知預先所說的話和主救主的命令，就是使徒所傳給你們的。","第一要緊的，該知道在末世必有好譏誚的人隨從自己的私慾出來譏誚說：","「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣。」","他們故意忘記：從太古憑神的命有了天，並從水而出、藉水而成的地。","故此，當時的世界被水淹沒就消滅了。","但現在的天地還是憑著那命存留，直留到不敬虔之人受審判遭沉淪的日子，用火焚燒。","親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日。","主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。","但主的日子要像賊來到一樣。那日，天必大有響聲廢去，有形質的都要被烈火銷化，地和其上的物都要燒盡了。","這一切既都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔，","切切仰望神的日子來到。在那日，天被火燒就銷化了，有形質的都要被烈火鎔化。","但我們照他的應許，盼望新天新地，有義居在其中。","親愛的弟兄啊，你們既盼望這些事，就當殷勤，使自己沒有玷污，無可指摘，安然見主。","並且以我們主長久忍耐為得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。","他一切的信上也都是講論這事。信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪。","親愛的弟兄啊，你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。","你們卻要在我們主救主耶穌基督的恩典和知識上有長進。願榮耀歸給他，從今直到永遠。阿們！"]},"blk":{"1":[{"a":1,"z":2,"star":1,"grk":"<blockquote lang=\"grc\"><p>Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ· χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.<\/p><\/blockquote>","lit":"<blockquote><p>「西緬彼得，耶穌基督的奴僕和使徒，寫給那些在我們的神和救主耶穌基督的義裡，與我們分得了同等尊貴之信心的人：願恩典與平安，在對神和我們主耶穌的認識裡，多多地加給你們。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>西門<\/td><td>Συμεών<\/td><td>Symeōn<\/td><td>G4826<\/td><td>—<\/td><td>西緬（希伯來名的希臘拼法）<\/td><td>新約只有徒 15:14 與此處這樣稱彼得：最後一封信，他用了主在海邊叫他的本名<\/td><\/tr><tr><td>一樣寶貴<\/td><td>ἰσότιμος<\/td><td>isotimos<\/td><td>G2472<\/td><td>ἴσος（相等）＋ τιμή（尊貴）<\/td><td>同等尊榮、同等權利<\/td><td>新約僅此一次。城邦「同等公民權」的字——教會裡沒有二等信徒<\/td><\/tr><tr><td>同得<\/td><td>λαγχάνω<\/td><td>lanchanō<\/td><td>G2975<\/td><td>λάχος（籤、份）<\/td><td>抽籤得著、蒙分配<\/td><td>信心是分給你的份，不是賺來的（路 1:9；徒 1:17 同字）<\/td><\/tr><tr><td>義<\/td><td>δικαιοσύνη<\/td><td>dikaiosynē<\/td><td>G1343<\/td><td>δίκη（公正）<\/td><td>義、公正<\/td><td>神不偏待人的公義；所以遠方沒見過主的人，分到的信心和使徒一樣<\/td><\/tr><tr><td>救主<\/td><td>σωτήρ<\/td><td>sōtēr<\/td><td>G4990<\/td><td>σῴζω（拯救）<\/td><td>救主<\/td><td>全卷以「救主」開始（1:1），以「救主」結束（3:18）<\/td><\/tr><tr><td>認識<\/td><td>ἐπίγνωσις<\/td><td>epignōsis<\/td><td>G1922<\/td><td>ἐπί（向著）＋ γνῶσις（知識）<\/td><td>確切的、親身的認識<\/td><td>★本章解經鑰匙：恩惠平安是在「認識他」裡面加增的<\/td><\/tr><tr><td>多多地加給<\/td><td>πληθύνω<\/td><td>plēthynō<\/td><td>G4129<\/td><td>πλῆθος（眾多）<\/td><td>使增多<\/td><td>祈願語氣 πληθυνθείη，核心問安語與彼前 1:2 相同<\/td><\/tr><\/table>","gram":"<p><strong>① 「我們的神和救主耶穌基督」是一位還是兩位？<\/strong><\/p><ul><li><strong>一位（Granville Sharp 規則）<\/strong>：τοῦ θεοῦ ἡμῶν καὶ σωτῆρος 是一個冠詞統管兩個單數、非專有名詞的位格名詞，中間用 καί 連接——兩個稱號指同一位：「我們的神，也是救主，就是耶穌基督」。多數福音派註釋與新近譯本（如 NIV、ESV）採此讀法。<\/li><li><strong>兩位<\/strong>：「我們的神」指父，「救主耶穌基督」指子。理由：緊接著的 1:2 就把「神」和「我們主耶穌」分開；西乃抄本等少數抄本 1:1 作 κυρίου（主）而不是 θεοῦ。KJV 譯作「God and our Saviour」，採此讀法。<\/li><\/ul><p>決定性的證據在本卷自己：1:11、2:20、3:18 都用同一句型 τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ（我們主救主耶穌基督），從來沒有人把那三處讀成兩位。1:2 的句型不同：Ἰησοῦ 是專有名詞，不在同一個冠詞下。<\/p><blockquote><p><strong>最好的理解：<\/strong><strong>一位。<\/strong>1:1 直稱耶穌為「我們的神」，是新約直稱耶穌為神的經文之一（這與約 1:1；20:28；多 2:13 同列）。1:1 把神與救主合在一位身上，1:2 又把父與子分開——兩節並排，正是三一真理的兩面：有分別，不分割。<\/p><\/blockquote><p><strong>② Συμεών 還是 Σίμων？<\/strong><\/p><p>P72 與梵蒂岡抄本作 Σίμων；西乃抄本、亞歷山大抄本作 Συμεών，SBLGNT 與 NA28 採後者（待以實檔核對）。較難、較少見的 Συμεών 比較可能是原文——抄寫的人容易把罕見拼法改成常見拼法，不容易反過來改。<\/p><p><strong>③ λαχοῦσιν<\/strong>：不定過去式分詞，「已經分得了」。信心在這裡是被動領受的份，不是自己的成就。<\/p>","exp":"<p><strong>一封臨終的信，第一個字是他的本名。<\/strong><\/p><p>彼得前書開頭只寫「彼得」。這一封寫「西門彼得」，而且用希伯來拼法 Συμεών。新約除了這裡，只有一次這樣稱呼他：耶路撒冷會議上，雅各說「方才西門述說神當初怎樣眷顧外邦人」（徒 15:14）。<\/p><p>三十多年前在加利利海邊，主三次問他：「約翰的兒子西門，你愛我比這些更深嗎？」（約 21:15）主叫回他的本名，就在那個早晨，把他從三次不認主的羞愧裡接了回來。臨終提筆，他先寫下的，是那個被主叫過、也被主接回來的名字。<\/p><p>然後他寫「奴僕」在前，「使徒」在後。先是屬於主的人，然後才是被差的人。<\/p><p>收信的人沒見過主，沒上過聖山。彼得卻說，你們的信心和我們的「一樣寶貴」。ἰσότιμος 是城邦裡「同等公民權」的字。λαχοῦσιν 是抽籤分得的份。<strong>信心的價值不在拿的人，在給的那一位<\/strong>——是「在我們的神和救主耶穌基督的義裡」分到的。使徒和漁村裡的一個寡婦，捧著的是同一份恩典。<\/p><p>1:2 接著說，恩惠平安是「因你們認識神和我們主耶穌」多多地加給。ἐπίγνωσις 在全卷第一次出現，就和恩典綁在一起。恩典不是在認識主之外另外掉下來的禮物；越認識他，恩典越多。<\/p><p>今天坐在會眾席上的人，沒有一個是二等信徒。你沒見過山上的榮光，但你手裡的信心，和寫信的使徒一樣重。要長進，不是去求一份更高級的信心，是更深地認識那一位把信心分給你的主。<\/p><p>〔背景〕約 21:15–17；徒 15:14——不是彼得配得一個名字，是主在海邊重新叫了他。〔彼前〕彼得前書講義第 1 章（彼前 1:2 同一句問安）。<\/p>"},{"a":3,"z":3,"star":3,"grk":"<blockquote lang=\"grc\"><p>Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ἰδίᾳ δόξῃ καὶ ἀρετῇ,<\/p><\/blockquote>","lit":"<blockquote><p>「因為他神聖的能力，已經把一切關乎生命和敬虔的事賜給了我們，是藉著認識那一位——用他自己的榮耀和美德呼召了我們的。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>神（能）<\/td><td>θεῖος<\/td><td>theios<\/td><td>G2304<\/td><td>θεός（神）<\/td><td>屬神的、神聖的<\/td><td>1:3、4 連用兩次；保羅在雅典也用這個字（徒 17:29）——向希臘世界說話的字<\/td><\/tr><tr><td>能<\/td><td>δύναμις<\/td><td>dynamis<\/td><td>G1411<\/td><td>δύναμαι（能夠）<\/td><td>能力<\/td><td>1:16 同字：彼得在山上見過的「大能」，就是把一切賜下的能力<\/td><\/tr><tr><td>賜給<\/td><td>δωρέομαι<\/td><td>dōreomai<\/td><td>G1433<\/td><td>δῶρον（禮物）<\/td><td>白白贈送<\/td><td>完成式分詞 δεδωρημένης：已經給了，而且現在還在你手上<\/td><\/tr><tr><td>虔敬<\/td><td>εὐσέβεια<\/td><td>eusebeia<\/td><td>G2150<\/td><td>εὖ（好）＋ σέβομαι（敬畏）<\/td><td>敬虔、敬畏神的生活<\/td><td>全卷四次（1:3、6、7；3:11）：生命是根，敬虔是向神的姿態<\/td><\/tr><tr><td>召<\/td><td>καλέω<\/td><td>kaleō<\/td><td>G2564<\/td><td>—<\/td><td>呼召<\/td><td>不定過去式分詞：呼召已經發生；主動的是他<\/td><\/tr><tr><td>美德<\/td><td>ἀρετή<\/td><td>aretē<\/td><td>G703<\/td><td>—<\/td><td>卓越、美德、大能的作為<\/td><td>與 1:5「德行」同一個字：他所有的，他召我們加上<\/td><\/tr><tr><td>認識<\/td><td>ἐπίγνωσις<\/td><td>epignōsis<\/td><td>G1922<\/td><td>ἐπί（向著）＋ γνῶσις（知識）<\/td><td>確切的認識<\/td><td>διά 帶所有格：一切賜下，都「藉著」認識他傳到我們身上<\/td><\/tr><\/table>","gram":"<p><strong>① Ὡς 把 1:3–4 接到哪裡？<\/strong><\/p><ul><li><strong>接上文<\/strong>：1:3 說明 1:2 的恩惠平安「怎樣」多多加給——因為神能已經賜下一切。<\/li><li><strong>接下文<\/strong>：1:3–4 是一個長的前置子句，主要動詞要等到 1:5 的「你們要……加上」（ἐπιχορηγήσατε）；1:5 開頭的「正因這緣故」（αὐτὸ τοῦτο）就是回指 1:3–4。多數註釋採此讀法。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>兩頭都接，但重心往下。<strong>1:3（完成式分詞）與 1:4（完成式直述語氣）都陳明「已經賜下」，1:5 才是命令語氣的「要加上」。<\/strong>彼得的文法本身就是神學：先有神的完成式，才有人的命令式。<\/p><\/blockquote><p><strong>② 「召我們的」是父還是基督？<\/strong><\/p><ul><li><strong>父神<\/strong>：新約多處說「神召」我們（彼前 5:10；帖前 2:12）。<\/li><li><strong>基督<\/strong>：最近的先行詞是 1:2 的「我們主耶穌」；而「自己的榮耀」正是 1:16–17 彼得在山上親眼見過的、基督從父領受的榮耀。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>主要指基督，但不必把父與子切開。和合本譯作「召我們的主」，方向正確。<\/p><\/blockquote><p><strong>③ ἰδίᾳ δόξῃ καὶ ἀρετῇ<\/strong>：間接格，多數解作「藉著」（工具）他自己的榮耀和美德；也可讀作「召我們進入／歸於」他的榮耀。TR 作 διὰ δόξης καὶ ἀρετῆς（藉著榮耀和美德），意思相近。<strong>ἰδίᾳ（自己的）是重點<\/strong>：呼召我們的資源全在他那邊。<\/p>","exp":"<p><strong>彼得還沒有叫人做任何一件事，先說：一切都已經給了。<\/strong><\/p><p>這是一個快要殉道的人寫給教會的遺言。照常理，遺言該是一連串的叮嚀。可是彼得的第一句是直述語氣，不是命令語氣。<\/p><p>δεδωρημένης 是完成式。不是「將要給」，不是「看你表現再給」，是「已經給了，現在還在你手上」。給了多少？πάντα——一切。範圍是「關乎生命和虔敬的事」：裡面的生命，向神的生活。<\/p><p>這一切是怎麼送到我們手上的？διὰ τῆς ἐπιγνώσεως——藉著認識他。<strong>神沒有把一個包裹寄給我們就走了。他把自己給了我們，一切都在認識他裡面。<\/strong><\/p><p>還有一個字要停下來看：ἀρετή，美德。兩節之後，1:5 的「德行」用的是同一個字。召我們的主有這美德；他召我們，然後叫我們在信心上加上同樣的美德。我們要長出來的，本來就是他身上的樣子。<\/p><p>很多基督徒把信仰活成一種缺乏：我還差一點甚麼，再多一次聚會、再多一次經歷，才夠。彼得說，你缺的不是更多的供應，是更深地認識那一位已經供應一切的主。次序不能顛倒：先是神的完成式，才有我們的命令式。這正是「先生命，再關係，後事工」的根。<\/p><p>〔背景〕路 9:32「看見耶穌的榮光」——用自己榮耀召我們的主，彼得在山上親眼見過那榮耀；不是彼得看得多，是主肯顯給他看。<\/p>"},{"a":4,"z":4,"star":2,"grk":"<blockquote lang=\"grc\"><p>δι’ ὧν τὰ τίμια καὶ μέγιστα ἡμῖν ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.<\/p><\/blockquote>","lit":"<blockquote><p>「藉著這些（他的榮耀和美德），他已經把那些寶貴而極大的應許賜給了我們，為要叫你們藉著這些（應許），成為有分於神性情的人——你們已經逃脫了世上那在情慾裡的敗壞。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>應許<\/td><td>ἐπάγγελμα<\/td><td>epangelma<\/td><td>G1862<\/td><td>ἐπί ＋ ἀγγέλλω（宣告）<\/td><td>所應許的事（內容）<\/td><td>新約只在彼後 1:4 與 3:13；兩處都指向將來——第二處就是新天新地<\/td><\/tr><tr><td>寶貴<\/td><td>τίμιος<\/td><td>timios<\/td><td>G5093<\/td><td>τιμή（價值）<\/td><td>貴重的<\/td><td>與彼前 1:19「基督的寶血」同一個字<\/td><\/tr><tr><td>極大<\/td><td>μέγιστος<\/td><td>megistos<\/td><td>G3176<\/td><td>μέγας（大）的最高級<\/td><td>極大的<\/td><td>最高級形式新約僅此一次：彼得找不到更大的字了<\/td><\/tr><tr><td>有分<\/td><td>κοινωνός<\/td><td>koinōnos<\/td><td>G2844<\/td><td>κοινός（共同的）<\/td><td>同伴、合夥人、有分的人<\/td><td>路 5:10 雅各、約翰是「西門的夥伴」——同一個字；漁夫一生第一份「有分」是在船上<\/td><\/tr><tr><td>性情<\/td><td>φύσις<\/td><td>physis<\/td><td>G5449<\/td><td>φύω（生長）<\/td><td>本性、天性<\/td><td>不是哲學上的「本質」（οὐσία）一字；與下半句「敗壞」對照：神的性情對世上的敗壞<\/td><\/tr><tr><td>脫離<\/td><td>ἀποφεύγω<\/td><td>apopheugō<\/td><td>G668<\/td><td>ἀπό（離）＋ φεύγω（逃）<\/td><td>逃脫<\/td><td>不定過去式分詞；2:18、20 同字——假師傅專找「剛剛脫離」的人下手<\/td><\/tr><tr><td>敗壞<\/td><td>φθορά<\/td><td>phthora<\/td><td>G5356<\/td><td>φθείρω（腐爛）<\/td><td>朽壞、敗壞<\/td><td>全卷「敗壞」線的起點；2:19 假自由的人「作敗壞的奴僕」<\/td><\/tr><\/table>","gram":"<p><strong>① θείας κοινωνοὶ φύσεως——四種讀法<\/strong><\/p><ul><li><strong>成神論（theosis）<\/strong>：東正教傳統。人藉恩典有分於神的「能力」（ἐνέργειαι，energies），而不是神的「本質」（οὐσία，essence）；人越來越像神，卻永遠是受造者。亞他那修說「神成為人，好叫我們得以成神」，在東正教神學裡的意思是藉恩典有分，不是多出另一位神；十四世紀帕拉馬（Gregory Palamas）把「本質／能力」之分講得最清楚。<\/li><li><strong>與基督聯合<\/strong>：改革宗、路德宗。藉聖靈與基督聯合，有分於他的生命；成聖是被更新成神的形像（西 3:10）。加爾文註釋此節說：這裡的「性情」指品質，不是本體。<\/li><li><strong>完全的愛<\/strong>：衛斯理傳統。有分於神的聖潔與愛，今生就可以被愛充滿、脫離故意犯罪的權勢。<\/li><li><strong>道德的相似<\/strong>：許多福音派註釋。有分於神的道德品格（聖潔、良善），不涉本體。<\/li><\/ul><p>四種讀法的共同點比想像中多：<strong>沒有一家主流傳統說受造者會成為另一位神。<\/strong>分歧在「有分」的深度與講法，不在要不要守住創造者與受造者的分別。<\/p><blockquote><p><strong>最好的理解：<\/strong>在基督裡與基督聯合，有分於神的生命與品格（聖潔、愛）。三條界線：一、<strong>創造者與受造者的分別永遠存在<\/strong>——這不是說人會變成神，也不是與神的本質混同；二、<strong>有分是恩典，不是修煉<\/strong>——主詞是神，「他已將……應許賜給我們」；三、<strong>有分的內容寫在上下文<\/strong>：脫離敗壞（1:4 下），加上德行……愛眾人（1:5–7）。<\/p><\/blockquote><p><strong>② 時間：已經還是將來？<\/strong>ἀποφυγόντες 是不定過去式分詞（已經逃脫），γένησθε 是目的子句。應許（ἐπαγγέλματα）在 3:13 指向新天新地。最自然的讀法是「已然未然」：今天已經開始有分，那日才完全。<\/p><p><strong>③ 借字裝新酒<\/strong>：「神的性情」是當時斯多亞哲學與希臘宗教熟悉的說法。彼得借用世界聽得懂的字，裝進福音的內容——而且立刻用「脫離敗壞」與 1:5–7 的品格把它定義，不讓它漂向神祕主義。<\/p>","exp":"<p><strong>全卷神學最高的一句，也是最容易講偏的一句。所以不能跳過，也不能講過頭。<\/strong><\/p><p>1:3 說一切都給了。1:4 說，給的方式是「應許」——又寶貴，又極大。μέγιστα 是最高級，新約只有這裡用這個形式。一個說話一向直率的漁夫，到這裡找不到更大的字了。<\/p><p>應許的目的：「叫你們……得與神的性情有分」。κοινωνός 這個字，彼得很熟。多年前在革尼撒勒湖邊，雅各和約翰是「西門的夥伴」（路 5:10）——同一個字。那時有分的是一條船、一網魚。如今主說：你要有分的，是我的生命。<\/p><p>可是這裡要誠實地畫線。<strong>有分不是變成。<\/strong>船上的夥伴分享同一條船，卻沒有變成船主。創造者與受造者的分別永遠存在；人有分於神的聖潔與愛，卻不會成為另一位神，也不與神的本質混同。東正教講成神論，也小心地分開神的「本質」與「能力」，正是為了守住這條線。<\/p><p>那麼「有分」的內容是甚麼？彼得自己定義了。往後看半句：「脫離世上從情慾來的敗壞」。再往後看三節：德行、知識、節制、忍耐、虔敬、愛弟兄、愛眾人。<strong>神的性情，落在人身上，長出來的就是品格。<\/strong><\/p><p>還要記得 2:19。假師傅「應許人得以自由，自己卻作敗壞的奴僕」——他們應許的自由，正是 1:4 神要救我們脫離的那個東西。<\/p><p>321 說「無己不是沒有，乃是進入無限」。在這一節，只能這樣說：無己的人進入與無限之神的相交，基督在他裡面活（加 2:20）；不是人變成無限。界線守住了，這句話才是福音，而不是自我膨脹。<\/p><p>〔背景〕路 5:10——主先叫漁夫作他的夥伴，後來才叫他作使徒；有分，從來是主先伸手。<\/p>"},{"a":5,"z":7,"star":2,"grk":"<blockquote lang=\"grc\"><p>καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν, ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν, ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην.<\/p><\/blockquote>","lit":"<blockquote><p>「正為這個緣故，你們也要帶進全部的殷勤，在你們的信心裡供應德行，在德行裡供應知識，在知識裡供應節制，在節制裡供應忍耐，在忍耐裡供應敬虔，在敬虔裡供應弟兄相愛，在弟兄相愛裡供應愛。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>殷勤<\/td><td>σπουδή<\/td><td>spoudē<\/td><td>G4710<\/td><td>σπεύδω（趕緊）<\/td><td>熱切、盡力<\/td><td>「全部的殷勤」；同字根在 1:10、15；3:12、14 一再出現——恩典叫人起身，不叫人躺下<\/td><\/tr><tr><td>加上<\/td><td>ἐπιχορηγέω<\/td><td>epichorēgeō<\/td><td>G2023<\/td><td>ἐπί ＋ χορηγέω（χορός 合唱團 ＋ ἡγέομαι 帶領）<\/td><td>慷慨供應、出資承擔<\/td><td>古城邦富人出資供應合唱團演出的字：不是勉強湊數，是大方地供應<\/td><\/tr><tr><td>德行<\/td><td>ἀρετή<\/td><td>aretē<\/td><td>G703<\/td><td>—<\/td><td>卓越、美德<\/td><td>與 1:3 主的「美德」同一個字：他所有的，我們加上<\/td><\/tr><tr><td>知識<\/td><td>γνῶσις<\/td><td>gnōsis<\/td><td>G1108<\/td><td>γινώσκω（知道）<\/td><td>知識、明白<\/td><td>放在台階第二級，不是頂點；認識要往下長成節制<\/td><\/tr><tr><td>節制<\/td><td>ἐγκράτεια<\/td><td>enkrateia<\/td><td>G1466<\/td><td>ἐν ＋ κράτος（力量、掌控）<\/td><td>自制<\/td><td>裡面有掌控力——對照 2:10、19 被私慾制伏的人<\/td><\/tr><tr><td>忍耐<\/td><td>ὑπομονή<\/td><td>hypomonē<\/td><td>G5281<\/td><td>ὑπό（在下）＋ μένω（留住）<\/td><td>在重壓下站住<\/td><td>不是被動地等，是在擔子底下不走開<\/td><\/tr><tr><td>愛弟兄的心<\/td><td>φιλαδελφία<\/td><td>philadelphia<\/td><td>G5360<\/td><td>φίλος（朋友）＋ ἀδελφός（弟兄）<\/td><td>弟兄相愛<\/td><td>教會家人之間的愛（彼前 1:22 同字）<\/td><\/tr><tr><td>愛眾人的心<\/td><td>ἀγάπη<\/td><td>agapē<\/td><td>G26<\/td><td>—<\/td><td>捨己的愛<\/td><td>台階的終點；原文只有「愛」，和合本加「眾人」點出它越出教會的圍牆<\/td><\/tr><\/table>","gram":"<p><strong>① 八項有先後次序嗎？<\/strong><\/p><ul><li><strong>階梯讀法<\/strong>：一項完成才進下一項，像爬樓梯。<\/li><li><strong>彼此包含讀法<\/strong>：介系詞是 ἐν（在……裡面），不是 ἐπί（在……上面）——每一項是在前一項「裡面」供應出來的，像一棵樹的枝子從枝幹長出來，同時在長。<\/li><li><strong>修辭連鎖（sorites，連珠法）<\/strong>：古典修辭常見的層遞句型（這使我們想起羅 5:3–5 也是這種句型）；起點與終點是刻意的，中間的次序有修辭成分，不必一項一項地排先後。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>起點與終點是確定的，中間是互相扶持的品格，不是八道先後的關卡。<\/strong>起點是信心——神分給的（1:1）；終點是愛——神的性情最完整的樣子（1:4）。ἐν 的結構說明：德行不是離開信心另起爐灶，是在信心裡長出來的；愛也不是離開節制與忍耐的情緒。<\/p><\/blockquote><p><strong>② ἐπιχορηγήσατε<\/strong>：不定過去式命令語氣，「去供應吧」。這個字在 1:11 以被動式再出現（ἐπιχορηγηθήσεται，「必……供應給你們」）：<strong>你在這裡慷慨供應，神在那裡慷慨供應。<\/strong><\/p><p><strong>③ παρεισενέγκαντες<\/strong>（παρά＋εἰς＋φέρω，新約僅此一次）：「從旁帶進來」。神已經把一切帶進來了（1:3），你們也要把全部的殷勤帶進來——與神的工作並肩。<\/p><p><strong>④ 提醒<\/strong>：這八項是品格的果子，不是一套觀念改變的流程；與 321 改變觀念的八大步驟同為八項，但兩者是兩回事，不可把這段經文講成那八步的插圖。<\/p>","exp":"<p><strong>「正因這緣故」——因為神已經給了一切，所以你們要分外殷勤。<\/strong><\/p><p>很多人讀這三節，只看見一張清單。彼得卻先放了一個「因此」。1:3–4 是神的完成式，1:5 才是人的命令式。<strong>長進不是爬上去見神，是神已經下來，我們才在其中長大。<\/strong><\/p><p>「加上」原文 ἐπιχορηγήσατε，是一個有畫面的字。古希臘城邦辦戲劇節，要有人出錢供應合唱團的服裝、訓練、演出，這個人叫 χορηγός。那是一份榮譽，大家比的是誰供應得更大方。彼得用這個字說：在你的信心裡，大方地供應出德行來。不是勉強湊數，是慷慨。<\/p><p>介系詞也要看。不是「在信心上面」，是 ἐν——「在信心裡面」。德行從信心裡長出來，知識從德行裡長出來。像一棵樹，不是一道樓梯。<\/p><p>起點是信心，那是神分給你的（1:1）。終點是愛。中間有知識，但知識只在第二級；認識主若停在腦子裡，就長不出節制與忍耐。最後兩級都是愛人：先愛弟兄，再愛眾人。品格的頂點不是一個人多屬靈，是他多能愛。<\/p><p>這一段經文最該拿來照自己，不該拿來量別人。今天你的信心裡，最缺哪一項的供應？是節制，還是忍耐？是愛弟兄，還是愛那一位教會外、不好愛的人？別急著一次補齊八項。在信心裡，大方地供應一項——那一位已經供應你一切的主，會在你裡面供應下一項。<\/p>"},{"a":8,"z":9,"star":1,"grk":"<blockquote lang=\"grc\"><p>ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν· ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτιῶν.<\/p><\/blockquote>","lit":"<blockquote><p>「因為這些若在你們裡面存在、而且不斷增多，就使你們在認識我們主耶穌基督這件事上，不成為閒懶的，也不成為不結果子的。因為誰若沒有這些，他就是瞎眼的、瞇著眼只看近處，取了遺忘——忘了他從前的罪已經得了潔淨。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>充充足足<\/td><td>πλεονάζω<\/td><td>pleonazō<\/td><td>G4121<\/td><td>πλέον（更多）<\/td><td>增多、滿溢<\/td><td>現在式分詞：不是一次擁有，是持續在增多<\/td><\/tr><tr><td>閒懶<\/td><td>ἀργός<\/td><td>argos<\/td><td>G692<\/td><td>ἀ（否定）＋ ἔργον（工作）<\/td><td>不作工的、閒置的<\/td><td>像一塊放著不耕的田；雅 2:20 多數校勘本作 ἀργή（無用的），和合本跟 TR 譯「死的」<\/td><\/tr><tr><td>不結果子<\/td><td>ἄκαρπος<\/td><td>akarpos<\/td><td>G175<\/td><td>ἀ（否定）＋ καρπός（果子）<\/td><td>沒有果子<\/td><td>認識主本該結果子；問題不在認識太少，在認識沒有長出東西<\/td><\/tr><tr><td>眼瞎<\/td><td>τυφλός<\/td><td>typhlos<\/td><td>G5185<\/td><td>—<\/td><td>瞎眼的<\/td><td>屬靈的瞎，不是肉眼的瞎<\/td><\/tr><tr><td>只看見近處的<\/td><td>μυωπάζω<\/td><td>myōpazō<\/td><td>G3467<\/td><td>μύω（閉眼）＋ ὤψ（眼）<\/td><td>瞇眼、近視<\/td><td>新約僅此一次。英文 myopia 的字源；帶「自己把眼瞇起來」的意味<\/td><\/tr><tr><td>忘了<\/td><td>λήθη<\/td><td>lēthē<\/td><td>G3024<\/td><td>λανθάνω（遺漏、忘記）<\/td><td>遺忘<\/td><td>新約僅此一次。λήθην λαβών「取了遺忘」——全卷「記念」線的第一筆是「忘記」<\/td><\/tr><tr><td>潔淨<\/td><td>καθαρισμός<\/td><td>katharismos<\/td><td>G2512<\/td><td>καθαρός（潔淨的）<\/td><td>潔淨、洗淨<\/td><td>已經發生的潔淨；忘了的不是規條，是恩典<\/td><\/tr><\/table>","gram":"<p><strong>① τυφλός ἐστιν μυωπάζων——瞎了，怎麼還會近視？<\/strong><\/p><ul><li><strong>程度讀法<\/strong>：近視到一個地步，等於瞎了——「瞎到只看見近處」。<\/li><li><strong>原因讀法<\/strong>：μυωπάζω 有「瞇眼、閉眼」的意思；人自己把眼睛瞇起來不看遠處的光，久了就瞎了。<\/li><li><strong>修飾讀法<\/strong>：分詞修飾「瞎」，說明是哪一種瞎——不是全然看不見，是看不見遠處（1:11 永遠的國）。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>這不是醫學描述，是屬靈的近視。<\/strong>只看見眼前，看不見永遠的國（1:11）與主的再來（1:16）；而 μυωπάζω 帶著自己瞇眼的成分——這種瞎，有一半是選擇。下半句說明病根：忘記了。<\/p><\/blockquote><p><strong>② λήθην λαβών<\/strong>：慣用語「取了遺忘」，即忘記。不定過去式分詞，說明「瞎」的原因。全卷的「記念」線（1:12、13、15；3:1、2、5、8）由這裡起步，3:5 是「故意忘記」，3:8 是「不可忘記」。<\/p><p><strong>③ 條件分詞<\/strong>：ὑπάρχοντα καὶ πλεονάζοντα 是現在式分詞，作條件：「若存在並且增多」。雙重否定 οὐκ ἀργοὺς οὐδὲ ἀκάρπους 是曲言法（litotes），意思是「必定活潑、必定結果子」。<\/p><p>異文：τῶν πάλαι αὐτοῦ ἁμαρτιῶν 有抄本作 ἁμαρτημάτων（罪行），意思不變（待以實檔核對）。<\/p>","exp":"<p><strong>彼得說，不長進的人有兩個病：看不遠，記不住。<\/strong><\/p><p>1:8 先說正面：這些品格若在你們裡面，而且不斷增多，認識主就不會閒著，不會光開花不結果。ἀργός 是「不作工」——像一塊田放著不耕。<strong>認識主本身不是終點，認識主是一塊要結果子的田。<\/strong><\/p><p>1:9 說反面。沒有這些的人，是 τυφλός，瞎眼；而且是 μυωπάζων——新約只用這一次的字，英文 myopia（近視）就從這裡來。字根是「瞇眼」。不是天生看不見，是自己把眼瞇起來，只盯著眼前的那一點。<\/p><p>眼前的那一點是甚麼？今天的帳單，這個月的業績，別人的一句話。看不見的遠處是甚麼？1:11 那「永遠的國」。<\/p><p>病根在下半句：「忘了他舊日的罪已經得了潔淨」。λήθη，遺忘，新約也只用這一次。這個人忘記的不是規條，是恩典。他忘了自己曾經多髒，忘了主怎樣把他洗淨。一個忘了自己被赦免多少的人，就不會長出忍耐與愛——因為他不再覺得自己欠了甚麼。<\/p><p>這節經文不是用來指著別人說「你瞎了」。它是給我們自己的眼科檢查。治療的方法也很溫柔：不是更用力，是想起來。想起你被潔淨的那一天，遠處的國就重新清楚了。<\/p><p>〔背景〕路 22:61「彼得便想起主對他所說的話」——把彼得從跌倒裡叫回來的，正是一次「想起來」；不是彼得記性好，是主轉過身來看他。<\/p>"},{"a":10,"z":11,"star":2,"grk":"<blockquote lang=\"grc\"><p>διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε. οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.<\/p><\/blockquote>","lit":"<blockquote><p>「所以，弟兄們，更要殷勤，使你們的蒙召和揀選成為堅固確實的；因為你們行這些事，就在任何時候都絕不會跌倒。因為這樣，進入我們主和救主耶穌基督永遠之國的入口，必要豐豐富富地供應給你們。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>殷勤<\/td><td>σπουδάζω<\/td><td>spoudazō<\/td><td>G4704<\/td><td>σπουδή（熱切）<\/td><td>竭力、趕緊去做<\/td><td>回應 1:5 的「殷勤」；不定過去式命令語氣<\/td><\/tr><tr><td>堅定不移<\/td><td>βέβαιος<\/td><td>bebaios<\/td><td>G949<\/td><td>βαίνω（行走、踏步）<\/td><td>踏得穩的、確實的<\/td><td>蒲草紙契約上「有效的保證」的法律用語；1:19「更確」同字<\/td><\/tr><tr><td>恩召<\/td><td>κλῆσις<\/td><td>klēsis<\/td><td>G2821<\/td><td>καλέω（呼召）<\/td><td>呼召<\/td><td>回指 1:3「召我們的主」：呼召的起點在他<\/td><\/tr><tr><td>揀選<\/td><td>ἐκλογή<\/td><td>eklogē<\/td><td>G1589<\/td><td>ἐκ（出）＋ λέγω（挑選）<\/td><td>揀選<\/td><td>與「恩召」共用一個冠詞：同一件恩典的兩面<\/td><\/tr><tr><td>失腳<\/td><td>πταίω<\/td><td>ptaiō<\/td><td>G4417<\/td><td>—<\/td><td>絆跌、跌倒<\/td><td>雅 3:2「在許多事上都有過失」同字；指行路絆倒，不是一跌就永遠失落<\/td><\/tr><tr><td>豐豐富富<\/td><td>πλουσίως<\/td><td>plousiōs<\/td><td>G4146<\/td><td>πλοῦτος（財富）<\/td><td>富足地、慷慨地<\/td><td>不是勉強擠進門，是被盛大迎接<\/td><\/tr><tr><td>得以進入<\/td><td>ἐπιχορηγέω<\/td><td>epichorēgeō<\/td><td>G2023<\/td><td>ἐπί ＋ χορηγέω<\/td><td>慷慨供應<\/td><td>1:5 主動式「你們要供應」，1:11 被動式「必供應給你們」：神是那位更大方的供應者<\/td><\/tr><tr><td>進入<\/td><td>εἴσοδος<\/td><td>eisodos<\/td><td>G1529<\/td><td>εἰς（進）＋ ὁδός（路）<\/td><td>入口、進入<\/td><td>對照 1:15 彼得的 ἔξοδος（出去）：出了帳棚，就是進了國<\/td><\/tr><\/table>","gram":"<p><strong>① 揀選要靠我們「堅定」嗎？<\/strong><\/p><ul><li><strong>確據讀法<\/strong>（改革宗多採）：神的揀選本身不會動搖；「使之堅定」是讓蒙召在信徒自己的經歷與見證中變得確實——品格是揀選的證據，不是揀選的原因。<\/li><li><strong>參與讀法<\/strong>（阿米念傳統多採）：人的回應真實地參與在保守之中；不殷勤，蒙召就可能落空。<\/li><li><strong>契約讀法<\/strong>：βέβαιος 在當時的契約上指「有效的保證」；信徒的生命成了神呼召的「確認書」。<\/li><\/ul><p>文法線索：ποιεῖσθαι 是關身語態，「為你們自己」使之堅定——對象是你們的確據，不是在神那邊補上甚麼。部分抄本（如西乃、亞歷山大抄本）在此加上「藉著你們的善行」（διὰ τῶν καλῶν ὑμῶν ἔργων），多數校勘本視為後加的解說。<\/p><blockquote><p><strong>最好的理解：<\/strong><strong>源頭在神，確據在生命。<\/strong>呼召與揀選起於「召我們的主」（1:3）；1:5–7 的品格不是買門票，是讓蒙召的人自己看見、也讓人看見：這呼召是真的。這與 1:3 的「已將一切賜給」互相成全，而不是互相抵消。（另見 ISS00_5）<\/p><\/blockquote><p><strong>② οὐ μὴ πταίσητέ ποτε<\/strong>：οὐ μή 加不定過去式假設語氣，是希臘文最強的否定，再加 ποτε（任何時候）。πταίω 是行路絆跌（雅 2:10；3:2），講的是在路上不至跌倒，不是「從此不會有軟弱」。<\/p><p><strong>③ 主動與被動<\/strong>：1:5 ἐπιχορηγήσατε（你們要供應）→ 1:11 ἐπιχορηγηθήσεται（必供應給你們，屬神的被動式）。同一個字，一來一往。<\/p>","exp":"<p><strong>你在這裡供應德行，神在那裡供應入口——同一個字，主動在前，被動在後。<\/strong><\/p><p>1:10 是全卷最容易讓人不安的一節：「使你們所蒙的恩召和揀選堅定不移」。難道揀選要靠我撐住？<\/p><p>看字。βέβαιος 是當時契約上的用語：一份買賣成交了，要有一份「確實有效」的保證書。神的呼召是那份交易；我們的品格，是讓這份交易在世人眼前、也在自己心裡「看得見」的確認。動詞 ποιεῖσθαι 用關身語態——為你們自己。<strong>源頭在神，確據在生命。<\/strong><\/p><p>然後是應許：「就永不失腳」。οὐ μή 是希臘文最重的否定。寫這句話的人，曾經在加利利的水面上往下沉，曾經在大祭司的院子裡跌得很重。他知道失腳是甚麼滋味，也知道是誰把他拉起來。πταίω 是走路絆倒，不是說軟弱的人從此出局。<\/p><p>1:11 的「進入」，原文又是 1:5 那個合唱團供應者的字，這次是被動式。你在信心裡大方供應德行；神在將來大方供應你進國的入口。πλουσίως，豐豐富富——不是從門縫裡擠進去，是被盛大地迎進去。<\/p><p>國是「我們主救主耶穌基督」的，而且是「永遠的」。讓耶穌作王，不是只在今天的生活裡讓他坐上寶座；那國的門，最後也是他親手打開的。<\/p><p>〔背景〕太 14:30–31——他「將要沉下去」，「耶穌趕緊伸手拉住他」；寫「永不失腳」的人，是被主拉住過的人。<\/p>"},{"a":12,"z":13,"star":1,"grk":"<blockquote lang=\"grc\"><p>Διὸ μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ. δίκαιον δὲ ἡγοῦμαι, ἐφ’ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,<\/p><\/blockquote>","lit":"<blockquote><p>「所以我總要時常提醒你們這些事，雖然你們已經知道，也已經在臨到你們的真理上被堅固了。我認為這是應當的：只要我還在這個帳棚裡，就要用提醒來喚醒你們。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>提醒<\/td><td>ὑπομιμνῄσκω<\/td><td>hypomimnēskō<\/td><td>G5279<\/td><td>ὑπό（在下）＋ μιμνῄσκω（記得）<\/td><td>使人想起<\/td><td>不是教新的，是把已知的再放到眼前；與 1:9「忘了」正面相對<\/td><\/tr><tr><td>堅固<\/td><td>στηρίζω<\/td><td>stērizō<\/td><td>G4741<\/td><td>—<\/td><td>使站穩、堅立<\/td><td>完成式被動分詞 ἐστηριγμένους：已經被堅固了。路 22:32「堅固你的弟兄」；彼前 5:10「必要……堅固你們」<\/td><\/tr><tr><td>已有的<\/td><td>πάρειμι<\/td><td>pareimi<\/td><td>G3918<\/td><td>παρά（在旁）＋ εἰμί（是）<\/td><td>在場、已來到<\/td><td>「臨到你們的」真理：不是新出的真理，是已經來到你們中間的福音<\/td><\/tr><tr><td>應當<\/td><td>δίκαιος<\/td><td>dikaios<\/td><td>G1342<\/td><td>δίκη（公正）<\/td><td>合宜的、公義的<\/td><td>提醒是一件「對的事」：愛人的人有責任重複<\/td><\/tr><tr><td>帳棚<\/td><td>σκήνωμα<\/td><td>skēnōma<\/td><td>G4638<\/td><td>σκηνή（帳棚）<\/td><td>帳棚、居所<\/td><td>指身體：暫時的、要拆的；這使我們想起太 17:4 他想在山上搭的棚<\/td><\/tr><tr><td>激發<\/td><td>διεγείρω<\/td><td>diegeirō<\/td><td>G1326<\/td><td>διά（徹底）＋ ἐγείρω（叫醒）<\/td><td>喚醒、激動<\/td><td>門徒在風浪中「叫醒」主用同一個字根（路 8:24）；3:1 再用<\/td><\/tr><tr><td>提醒<\/td><td>ὑπόμνησις<\/td><td>hypomnēsis<\/td><td>G5280<\/td><td>ὑπό ＋ μιμνῄσκω<\/td><td>提醒（名詞）<\/td><td>3:1「這兩封都是提醒你們」同字<\/td><\/tr><\/table>","gram":"<p><strong>① μελλήσω<\/strong>：μέλλω 的將來式，新約罕見，意思是「我總要／我會一直預備」。TR 作 οὐκ ἀμελήσω（我不會疏忽），意思相近。兩讀都表達一個臨終者的決心。<\/p><p><strong>② ἐν τῇ παρούσῃ ἀληθείᾳ 是甚麼真理？<\/strong><\/p><ul><li><strong>「已經臨到你們的真理」<\/strong>：πάρειμι 指「在場、已來到」；這使我們想起西 1:5–6「福音傳到你們那裡」也用同字。真理是已經交付的福音。<\/li><li><strong>「當前的真理」<\/strong>：把它讀成「某個時代特有、新近才啟示的真理」。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>「已經臨到你們、你們已經擁有的真理」。上下文說「你們雖然曉得」——彼得提醒的不是新東西，正是他們已經知道的；所以這節不支持任何「新的、只有某些人才知道的真理」。<\/p><\/blockquote><p><strong>③ καίπερ 讓步<\/strong>：「雖然你們已經知道、已經站穩」——提醒不是因為對方差，是因為人會忘（1:9）。<\/p>","exp":"<p><strong>「你們已經知道，也已經站穩了——所以我還要提醒。」<\/strong><\/p><p>這是遺言的開頭。一個知道自己快死的人，最想說的是甚麼？彼得說，不是新東西，是你們已經知道的那些。<\/p><p>我們常以為長進就是學新的。彼得卻說，長進有一半是記得。1:9 那個瞇眼的人，病在「忘了」；1:12 的藥，就叫「提醒」。<\/p><p>「堅固」這個字，是彼得一生的字。主被賣那一夜對他說：「你回頭以後，要堅固你的弟兄。」（路 22:32）他在第一封信的末了寫：神「必要親自……堅固你們」（彼前 5:10）。現在他說，你們已經「在真道上堅固」——ἐστηριγμένους，完成式被動：是被堅固的，而且到今天還站著。<strong>主給他的那份功課，他做到了最後一封信。<\/strong><\/p><p>1:13 他稱自己的身體為「帳棚」。一個住帳棚的人知道，帳棚是暫時的。只要帳棚還沒拆，他就要做一件事：διεγείρειν，把你們徹底叫醒。<\/p><p>今天的教會很怕重複。講台想要新的題目，小組想要新的教材。可是愛人的人不怕重複。臨終的使徒沒有說新的，他只是把你已經知道的，再一次放到你眼前。你身邊那一位，或許不缺新知識，缺的是一個肯一再提醒他的人——920 的「2」，常常就是這樣被堅固的。<\/p><p>〔背景〕路 22:31–32——不是彼得多會堅固人，是主先為他祈求，叫他不至於失了信心。〔彼前〕彼得前書講義第 5 章（彼前 5:10 堅固）。<\/p>"},{"a":14,"z":15,"star":1,"grk":"<blockquote lang=\"grc\"><p>εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι· σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.<\/p><\/blockquote>","lit":"<blockquote><p>「因為我知道，脫下我這帳棚的時候快到了，正如我們的主耶穌基督向我指明的。我也要盡力，使你們在我出去（我的「出埃及」）以後，隨時都能記念這些事。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>快<\/td><td>ταχινός<\/td><td>tachinos<\/td><td>G5031<\/td><td>ταχύς（快）<\/td><td>快的、迫近的、突然的<\/td><td>2:1「速速的滅亡」同字；這裡指日子近了<\/td><\/tr><tr><td>脫離<\/td><td>ἀπόθεσις<\/td><td>apothesis<\/td><td>G595<\/td><td>ἀπό（離）＋ τίθημι（放）<\/td><td>放下、脫下（如脫衣）<\/td><td>彼前 3:21「除掉肉體的污穢」同字；帳棚像衣服一樣脫下<\/td><\/tr><tr><td>指示<\/td><td>δηλόω<\/td><td>dēloō<\/td><td>G1213<\/td><td>δῆλος（明顯的）<\/td><td>指明、說清楚<\/td><td>不定過去式：主曾經在某一刻清楚告訴他（約 21:18–19）<\/td><\/tr><tr><td>時常<\/td><td>ἑκάστοτε<\/td><td>hekastote<\/td><td>G1539<\/td><td>ἕκαστος（每一個）<\/td><td>每一次、隨時<\/td><td>新約僅此一次：他要的是隨時隨地都想得起來<\/td><\/tr><tr><td>去世<\/td><td>ἔξοδος<\/td><td>exodos<\/td><td>G1841<\/td><td>ἐκ（出）＋ ὁδός（路）<\/td><td>出去、出路、離世<\/td><td>七十士譯本出埃及記的書名用字；路 9:31 山上談論主的「去世」就是這個字<\/td><\/tr><tr><td>記念<\/td><td>μνήμη<\/td><td>mnēmē<\/td><td>G3420<\/td><td>μιμνῄσκω（記得）<\/td><td>記憶、記念<\/td><td>新約僅此一次。遺言就是留給人記得的<\/td><\/tr><tr><td>盡心竭力<\/td><td>σπουδάζω<\/td><td>spoudazō<\/td><td>G4704<\/td><td>σπουδή（熱切）<\/td><td>竭力<\/td><td>將來式：他要殷勤的，是別人在他死後還能記得<\/td><\/tr><\/table>","gram":"<p><strong>① ταχινή 是「快到了」還是「會很突然」？<\/strong><\/p><ul><li><strong>迫近<\/strong>：彼得已經年老，又在尼祿逼迫的陰影下，知道日子近了。<\/li><li><strong>突然<\/strong>：死亡會以暴力、突然的方式臨到（照約 21:18–19 的預告）。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>以「迫近」為主，「突然」為輔。兩者都指向同一件事：主預告的那一天到了。<\/p><\/blockquote><p><strong>② 「主所指示我的」指甚麼？<\/strong>最自然的背景是約 21:18–19。後世《彼得行傳》有「主啊，你往哪裡去？」（Quo vadis）的傳說，可作教會歷史的背景知識，但不能作經文的根據。<\/p><p><strong>③ 1:15「使你們……時常記念」指甚麼？<\/strong><\/p><ul><li><strong>這封信本身<\/strong>：寫下來，就是為了死後還能被讀。<\/li><li><strong>馬可福音<\/strong>：二世紀帕皮亞（Papias）說馬可記下了彼得所傳的；此說只能作背景，不能從本節證明。<\/li><li><strong>持續的教導<\/strong>：他要確保有人繼續提醒。<\/li><\/ul><p>至少包括這封信。<strong>④ 混合的比喻<\/strong>：帳棚「脫下」（像衣服）、「出去」（像出埃及）——兩個畫面都說死亡是一次遷移，不是消失。<\/p>","exp":"<p><strong>老彼得談自己的死，用了兩個字：脫下帳棚，出埃及。<\/strong><\/p><p>「正如我們主耶穌基督所指示我的。」那是加利利海邊的一個早晨。主對他說：「……但年老了，就要伸出手來，別人要把你束上，帶你到不願意去的地方。」約翰接著解釋：「耶穌說這話是指著彼得要怎樣死，榮耀神。」（約 21:18–19）三十多年來，彼得一直知道自己會怎樣死。現在，那一天近了。<\/p><p>他說死亡是 ἀπόθεσις——脫下，像脫一件衣服。帳棚拆了，住帳棚的人沒有消失。<\/p><p>1:15 他用了另一個字：ἔξοδος。這是「出埃及」的那個字。在登山變像的山上，摩西、以利亞與主談論的，正是他「去世」的事——路加用的就是 ἔξοδος（路 9:31）。那一天，彼得在旁邊聽見主談論他自己的出埃及，自己卻只想搭三座棚，把榮耀留在山上。<\/p><p><strong>年輕的彼得想把榮耀關進帳棚裡；年老的彼得知道，帳棚是要拆的，榮耀是要等的。<\/strong>死亡不是結束，是一次出埃及——從為奴之地，走向應許之地。<\/p><p>一個面對死亡的人，最後的「殷勤」用在哪裡？不是保住自己的名聲，是讓別人在他走了以後，還記得主的話。<\/p><p>這是從暫時的觀點，轉到永恆的觀點。我們每個人都住在帳棚裡。問題不是帳棚甚麼時候拆，是拆了以後，別人記得的是你，還是你所指向的那一位。<\/p><p>〔背景〕太 17:4；路 9:31；約 21:18–19——不是彼得多勇敢地面對死亡，是主早就把結局告訴他，又陪他走了三十年。〔彼前〕彼得前書講義第 3 章（彼前 3:21 ἀπόθεσις「除掉」）。<\/p>"},{"a":16,"z":16,"star":2,"grk":"<blockquote lang=\"grc\"><p>Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλ’ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.<\/p><\/blockquote>","lit":"<blockquote><p>「因為我們把我們主耶穌基督的大能和來臨告訴你們，並不是跟從了巧妙編造的神話，而是成了親眼目睹他威榮的見證人。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>乖巧<\/td><td>σοφίζω<\/td><td>sophizō<\/td><td>G4679<\/td><td>σοφός（聰明的）<\/td><td>使聰明；精心編造<\/td><td>完成式被動分詞 σεσοφισμένοις：經過精心設計的<\/td><\/tr><tr><td>捏造的虛言<\/td><td>μῦθος<\/td><td>mythos<\/td><td>G3454<\/td><td>—<\/td><td>故事、神話<\/td><td>新約另見於教牧書信（提前 1:4；4:7；提後 4:4；多 1:14），一律是負面的<\/td><\/tr><tr><td>隨從<\/td><td>ἐξακολουθέω<\/td><td>exakoloutheō<\/td><td>G1811<\/td><td>ἐκ ＋ ἀκολουθέω（跟隨）<\/td><td>跟從<\/td><td>2:2「隨從他們邪淫的」、2:15 同字：跟從甚麼，就成為甚麼<\/td><\/tr><tr><td>大能<\/td><td>δύναμις<\/td><td>dynamis<\/td><td>G1411<\/td><td>δύναμαι（能夠）<\/td><td>能力<\/td><td>與 1:3「神能」同字<\/td><\/tr><tr><td>降臨<\/td><td>παρουσία<\/td><td>parousia<\/td><td>G3952<\/td><td>παρά（在旁）＋ οὐσία（存在）<\/td><td>來臨、駕臨<\/td><td>王駕臨的字；3:4 譏誚的人問「主要降臨的應許在哪裡呢」，3:12 同字<\/td><\/tr><tr><td>親眼見過的<\/td><td>ἐπόπτης<\/td><td>epoptēs<\/td><td>G2030<\/td><td>ἐπί（在上）＋ ὁράω（看）<\/td><td>目睹者、觀察者<\/td><td>新約僅此一次。神祕宗教稱最高級「入門者」的字；彼得說：我們不是入了甚麼門，是在場的人<\/td><\/tr><tr><td>威榮<\/td><td>μεγαλειότης<\/td><td>megaleiotēs<\/td><td>G3168<\/td><td>μέγας（大）<\/td><td>威嚴、宏偉<\/td><td>路 9:43 登山變像下山後眾人「詫異神的大能（威榮）」——同一個字<\/td><\/tr><\/table>","gram":"<p><strong>① 「大能和他降臨的事」指哪一次來臨？<\/strong><\/p><ul><li><strong>第二次再來<\/strong>：παρουσία 在本卷另兩次（3:4、12）都指主再來；登山變像是再來的預演。這使我們想起太 16:28 主說有人「在沒嘗死味以前必看見人子降臨在他的國裡」，緊接著就是 17:1 的登山變像。<\/li><li><strong>第一次來臨<\/strong>：指道成肉身、主在地上的整個事工。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>指主的再來；登山變像是那日榮耀的預先顯現。<\/strong>δύναμιν καὶ παρουσίαν 共用一個冠詞，可視為重言法（hendiadys）：「大有能力的來臨」。這也解釋了為甚麼第 3 章的譏誚者要攻擊的正是「他降臨的應許」。<\/p><\/blockquote><p><strong>② σεσοφισμένοις μύθοις<\/strong>：可能是回應對手的指控——「使徒傳的再來只是神話」；也可能是與希臘羅馬諸神「降臨人間」的神話劃清界線。兩者都使彼得的重點更清楚：我們傳的是在場目睹的事。<\/p><p><strong>③ ἐγνωρίσαμεν<\/strong>：複數「我們」——彼得、雅各、約翰三個見證人（申 19:15「憑兩三個人的口作見證」的原則）。<\/p>","exp":"<p><strong>彼得的福音不是一個好故事，是一件他在場的事。<\/strong><\/p><p>第一世紀的人聽過很多「神降臨」的故事。希臘的神會化身為人，在人間走動，然後回到奧林帕斯山。這些叫 μῦθοι，神話。編得很巧，講得很美，大家也知道那只是故事。<\/p><p>彼得說：我們告訴你們主耶穌的大能和他的降臨，不是這一類。σεσοφισμένοις，經過精心設計的——我們沒有編。<\/p><p>那是甚麼？ἐπόπται，親眼目睹的人。這個字新約只出現一次。在當時的神祕宗教裡，它指入門儀式最高一級的人——被引進內室，看見祕密的人。<strong>彼得把這個字搶過來：我們不是入了甚麼祕密的門，我們是站在山上，用自己的眼睛看見的人。<\/strong><\/p><p>看見甚麼？μεγαλειότης，威榮。路加記載登山變像之後，主下山醫好一個被鬼附的孩子，眾人「都詫異神的大能」（路 9:43）——用的就是這個字。那份威嚴是神的，不是見證人的。<\/p><p>今天的人也說：信仰不過是一個安慰人的故事。我們的回答不是講一個更動人的故事，而是指向那些在場的人、那座山、那個聲音。基督教是一個歷史的信仰，它站在見證上，不站在感覺上。<\/p><p>所以，傳福音的人也不必編。你不必把見證講得比實際更精彩。照你所看見的說——說主在你身上真實做過的事，就夠了。<\/p><p>〔背景〕太 16:28–17:2；路 9:43——威榮是主的；彼得只是剛好被帶上山的那一個。<\/p>"},{"a":17,"z":18,"star":2,"grk":"<blockquote lang=\"grc\"><p>λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν, εἰς ὃν ἐγὼ εὐδόκησα— καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ἁγίῳ ὄρει.<\/p><\/blockquote>","lit":"<blockquote><p>「因為他從父神領受了尊貴和榮耀，那時有這樣的聲音，從那威嚴的榮耀中被帶到他那裡：『這是我的兒子，我所愛的，我喜悅他。』——這聲音，我們與他同在聖山上的時候，親耳聽見從天上被帶下來。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>尊貴<\/td><td>τιμή<\/td><td>timē<\/td><td>G5092<\/td><td>—<\/td><td>尊榮、價值<\/td><td>父給子的尊榮——不是人加給他的<\/td><\/tr><tr><td>榮耀<\/td><td>δόξα<\/td><td>doxa<\/td><td>G1391<\/td><td>δοκέω（顯得）<\/td><td>榮耀、光輝<\/td><td>同一節出現兩次：子「得榮耀」，聲音出自「極大榮光」<\/td><\/tr><tr><td>出來<\/td><td>φέρω<\/td><td>pherō<\/td><td>G5342<\/td><td>—<\/td><td>帶、運送、推動<\/td><td>ἐνεχθείσης（1:17）、ἐνεχθεῖσαν（1:18）、ἠνέχθη、φερόμενοι（1:21）：同一個字四次，聲音被「帶」下來，預言也被「帶」出來<\/td><\/tr><tr><td>極大榮光<\/td><td>μεγαλοπρεπής<\/td><td>megaloprepēs<\/td><td>G3169<\/td><td>μέγας（大）＋ πρέπω（相稱）<\/td><td>威嚴的、宏偉的<\/td><td>新約僅此一次。「威嚴的榮耀」是對神的敬稱，避免直呼其名<\/td><\/tr><tr><td>愛子<\/td><td>ἀγαπητός<\/td><td>agapētos<\/td><td>G27<\/td><td>ἀγαπάω（愛）<\/td><td>所愛的、獨愛的<\/td><td>這使我們想起創 22:2 以撒「你獨生的兒子，你所愛的」<\/td><\/tr><tr><td>喜悅<\/td><td>εὐδοκέω<\/td><td>eudokeō<\/td><td>G2106<\/td><td>εὖ（好）＋ δοκέω（認為）<\/td><td>喜悅、滿意<\/td><td>不定過去式：父對子的喜悅，是一個定了的宣告<\/td><\/tr><tr><td>聖山<\/td><td>ὄρος<\/td><td>oros<\/td><td>G3735<\/td><td>—<\/td><td>山<\/td><td>與 ἅγιος（G40，聖）連用；山不具名，聖是因為神在那裡說話<\/td><\/tr><\/table>","gram":"<p><strong>① 沒有主要動詞的句子<\/strong>：1:17 以分詞 λαβών（他領受了）開頭，句子卻沒有完成，中間插進天父的話，1:18 換成「我們聽見」——文法上的破格（anacoluthon）。一個老人回憶一生最重要的一刻，句子斷了，正是口述的樣子。<\/p><p><strong>② 為甚麼沒有「你們要聽他」？<\/strong><\/p><ul><li>對觀福音三卷都有「你們要聽他」（太 17:5；可 9:7；路 9:35）；彼得這裡沒有。<\/li><li><strong>獨立見證說<\/strong>：措辭與三卷福音書都不完全相同，顯示這是一個獨立的記憶，不是抄寫福音書。<\/li><li><strong>重點選擇說<\/strong>：彼得要證明的是子的尊貴與再來的確實，所以只引父對子的宣告。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>兩者並存：措辭的差異反而是親身見證的痕跡；彼得只留下他要用來證明 1:16 的那一句。而「你們要聽他」的意思，他在 1:19–21 用另一種方式講了：要留意先知的話。<\/p><\/blockquote><p><strong>③ 「聖山」<\/strong>：彼得沒說是哪一座山（他泊山或黑門山都是後世的推測）。這使我們想起詩 2:6–7——神在「我的聖山」立了他的王，並說「你是我的兒子」；天父在山上的宣告，正是那一篇詩的回聲。<\/p>","exp":"<p><strong>那一天在山上，彼得說了一大段話；三十年後，他只記得天父說的那一句。<\/strong><\/p><p>福音書記下那天彼得說的話：「夫子，我們在這裡真好！可以搭三座棚……」路加接著加了一句：「他卻不知道所說的是甚麼。」（路 9:33）<\/p><p>三十年過去了。彼得在信裡完全沒有提自己說了甚麼。他只記得一個聲音：「這是我的愛子，我所喜悅的。」<\/p><p><strong>一個人老了以後，會忘記自己曾經說過多少話，卻不會忘記神說過的那一句。<\/strong><\/p><p>1:17 的文法也透露了這一點。他用 λαβών（他領受了）開頭，句子卻沒有寫完——中間插進天父的話，接著就跳到「我們聽見」。像一個老人在講一件太重要的事，講到一半，聲音停住了。<\/p><p>還有一個字要記住：φέρω，帶。聲音「被帶」到他那裡（1:17），我們聽見它從天上「被帶」下來（1:18）。到了 1:21，同一個字又出現兩次：預言不是憑人意「帶出來」的，先知是被聖靈「帶著」說話的。<strong>山上的聲音與經上的預言，是從同一個方向來的。<\/strong><\/p><p>耶穌是我的榜樣——但榜樣首先不是一套規條，是一位被父喜悅的兒子。我們效法他之前，先聽見父怎樣稱呼他。而那一位愛子，正是叫我們也被稱為神兒女的那一位。<\/p><p>〔背景〕太 17:1–8；可 9:2–8；路 9:28–36——新約福音書以外唯一的登山變像記載；彼得記得的不是自己，是父對子的那一句話。<\/p>"},{"a":19,"z":19,"star":3,"grk":"<blockquote lang=\"grc\"><p>καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·<\/p><\/blockquote>","lit":"<blockquote><p>「並且我們有那更加確實的先知之言；你們留心它，如同留心一盞在幽暗污濁之處發光的燈，是很好的，直到天色透亮、晨星在你們心裡升起。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>更確<\/td><td>βέβαιος<\/td><td>bebaios<\/td><td>G949<\/td><td>βαίνω（踏步）<\/td><td>穩固的、確實的<\/td><td>比較級 βεβαιότερον；與 1:10「堅定不移」同字<\/td><\/tr><tr><td>先知的<\/td><td>προφητικός<\/td><td>prophētikos<\/td><td>G4397<\/td><td>προφήτης（先知）<\/td><td>屬先知的<\/td><td>「先知之言」指舊約預言整體（1:20「經上所有的預言」）<\/td><\/tr><tr><td>留意<\/td><td>προσέχω<\/td><td>prosechō<\/td><td>G4337<\/td><td>πρός（向）＋ ἔχω（持）<\/td><td>專心注意、緊緊看著<\/td><td>現在式分詞：持續地留意，不是偶爾看一眼<\/td><\/tr><tr><td>燈<\/td><td>λύχνος<\/td><td>lychnos<\/td><td>G3088<\/td><td>—<\/td><td>油燈<\/td><td>這使我們想起詩 119:105「你的話是我腳前的燈」<\/td><\/tr><tr><td>暗處<\/td><td>αὐχμηρός<\/td><td>auchmēros<\/td><td>G850<\/td><td>αὐχμός（乾旱）<\/td><td>乾枯的、污濁的、幽暗的<\/td><td>新約僅此一次。不只是暗，是又乾又髒的地方——我們所住的世界<\/td><\/tr><tr><td>發亮<\/td><td>διαυγάζω<\/td><td>diaugazō<\/td><td>G1306<\/td><td>διά（透）＋ αὐγή（光）<\/td><td>透出光來、破曉<\/td><td>新約僅此一次。天光穿透黑暗的那一刻<\/td><\/tr><tr><td>晨星<\/td><td>φωσφόρος<\/td><td>phōsphoros<\/td><td>G5459<\/td><td>φῶς（光）＋ φέρω（帶）<\/td><td>帶光者、晨星<\/td><td>新約僅此一次。字根又是 φέρω：帶來光的那一位；這使我們想起啟 22:16「我是明亮的晨星」<\/td><\/tr><tr><td>出現<\/td><td>ἀνατέλλω<\/td><td>anatellō<\/td><td>G393<\/td><td>ἀνά（上）＋ τέλλω<\/td><td>升起<\/td><td>日月星辰升起的字；七十士譯本民 24:17「有星要出於雅各」同字<\/td><\/tr><\/table>","gram":"<p><strong>① 「更確的預言」——比甚麼更確？<\/strong><\/p><ul><li><strong>比經歷更確<\/strong>：先知的話比登山變像的經歷更可靠——經歷會過去，聖經長存。古代與宗教改革時期不少註釋採此讀法。<\/li><li><strong>經歷使預言更確<\/strong>：βεβαιότερον 放在冠詞之前，是述語位置——「我們有先知之言，（如今）更加確定了」。登山變像證實了舊約對彌賽亞榮耀的預言。ESV「more fully confirmed」、NIV「completely reliable」採此方向。<\/li><li><strong>絕對比較級（elative）<\/strong>：只是「非常確實」，不與任何東西比。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>經歷證實了預言，預言解釋了經歷。<\/strong>上下文是 1:16–18 的山上見證，接著說「並且我們有」——彼得不是要拿經歷和聖經比高低，而是說：我們在山上看見的，正好叫先知的話更確定；你們沒上過山，但你們手裡有這更確的話。所以這節不能用來貶低經歷，更不能用來把經歷放在聖經之上。<\/p><\/blockquote><p><strong>② 「在你們心裡」接在哪裡？晨星是甚麼？<\/strong><\/p><ul><li><strong>主的再來<\/strong>：「天發亮」指主的日子（3:10、12）；晨星是基督（這使我們想起民 24:17；啟 22:16）。<\/li><li><strong>內在的光照<\/strong>：「在你們心裡」使人讀成今天心裡的開竅、確信。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong>主要指主的再來，而「在你們心裡」說明那日的光不只照在外面，也要完全照進心裡；今天留意燈光的人，已經在預嘗那個早晨。燈是天亮以前的光——天亮了，燈才放下。<\/p><\/blockquote>","exp":"<p><strong>山上的榮光過去了，燈還在手裡。<\/strong><\/p><p>1:16–18 是彼得一生最高的一刻：親眼看見，親耳聽見。可是收信的人沒有上過那座山。今天的我們也沒有。那怎麼辦？<\/p><p>彼得說：「我們並有先知更確的預言。」βεβαιότερον 是比較級。山上的經歷，正好叫先知的話更確定了——舊約說彌賽亞要得榮耀，三個門徒親眼看見了。<strong>經歷證實了聖經；但你們不必等到有同樣的經歷，因為那更確的話已經在你們手裡。<\/strong><\/p><p>那話像甚麼？λύχνος，一盞燈。它照在 αὐχμηρῷ τόπῳ——新約只用這一次的字，意思不只是「暗」，是又乾又髒的地方。那就是我們所住的世界：第 2 章的假師傅、第 3 章的譏誚者，都在這個地方。<\/p><p>燈不是太陽。它不會把整個世界照亮，只照亮你腳前的一步。可是在天亮以前，燈就是你唯一可靠的光。<\/p><p>「直等到天發亮，晨星在你們心裡出現。」φωσφόρος，帶光的那一位，新約也只用這一次。天亮，是主再來的那個早晨；晨星，是他自己。那時燈可以放下了，因為光本人來了。<\/p><p>所以「你們在這預言上留意……才是好的」。προσέχοντες 是現在式：一直看著，不是偶爾看一眼。<\/p><p>這正是「聖經是我的準則」最好的畫面。準則不是棍子，是燈。天還沒亮的時候，不要丟下手中的燈，去追逐一陣閃光；留意它，一步一步走，直到晨星在你心裡升起。<\/p><p>〔舊約〕民數記講義第 24 章（民 24:17「有星要出於雅各」——這使我們想起）。〔彼前〕彼得前書講義第 1 章（彼前 1:10–12 眾先知尋求考察）。<\/p>"},{"a":20,"z":21,"star":2,"grk":"<blockquote lang=\"grc\"><p>τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται· οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη προφητεία ποτέ, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ἀπὸ θεοῦ ἄνθρωποι.<\/p><\/blockquote>","lit":"<blockquote><p>「首先要知道這一件事：經上所有的預言，都不是出於（先知）自己的解開；因為預言從來不是憑人的意思帶出來的，乃是人被聖靈帶著，從神那裡說了話。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>預言<\/td><td>προφητεία<\/td><td>prophēteia<\/td><td>G4394<\/td><td>πρό（在前）＋ φημί（說）<\/td><td>預言、先知的話<\/td><td>不只是預告未來，是替神說話<\/td><\/tr><tr><td>經上<\/td><td>γραφή<\/td><td>graphē<\/td><td>G1124<\/td><td>γράφω（寫）<\/td><td>經文、聖經<\/td><td>指已寫成的舊約聖經；3:16 保羅的信也被列在「別的經書」裡<\/td><\/tr><tr><td>私意<\/td><td>ἴδιος<\/td><td>idios<\/td><td>G2398<\/td><td>—<\/td><td>自己的、私人的<\/td><td>1:3「自己的榮耀」同字；這裡是先知「自己的」<\/td><\/tr><tr><td>解說<\/td><td>ἐπίλυσις<\/td><td>epilysis<\/td><td>G1955<\/td><td>ἐπί ＋ λύω（解開）<\/td><td>解開、解釋<\/td><td>新約僅此一次。動詞 ἐπιλύω 見可 4:34（講解）；指把異象或謎「解開」<\/td><\/tr><tr><td>人意<\/td><td>θέλημα<\/td><td>thelēma<\/td><td>G2307<\/td><td>θέλω（願意）<\/td><td>意願、意志<\/td><td>預言的源頭不在人想不想說<\/td><\/tr><tr><td>感動<\/td><td>φέρω<\/td><td>pherō<\/td><td>G5342<\/td><td>—<\/td><td>帶、推動<\/td><td>φερόμενοι 現在式被動分詞：被帶著走；這使我們想起徒 27:15、17 船被風颳去的同一個字<\/td><\/tr><tr><td>聖靈<\/td><td>πνεῦμα<\/td><td>pneuma<\/td><td>G4151<\/td><td>πνέω（吹）<\/td><td>靈、風、氣息<\/td><td>與 φέρω 並用，畫面更清楚：風與帆<\/td><\/tr><tr><td>說出<\/td><td>λαλέω<\/td><td>laleō<\/td><td>G2980<\/td><td>—<\/td><td>說話<\/td><td>主詞是「人」：人真實地說，神真實地帶<\/td><\/tr><\/table>","gram":"<p><strong>① 「沒有可隨私意解說的」——講的是預言的來源，還是讀者的解釋？<\/strong><\/p><ul><li><strong>來源讀法<\/strong>：先知沒有憑自己去「解開」所見的異象或環境；預言不是出於先知自己的解釋。理由：1:21 以 γάρ（因為）接續，說明的正是來源——「預言從來沒有出於人意的」；γίνεται（產生、出現）講的是預言怎樣產生。<\/li><li><strong>讀者讀法<\/strong>：讀者不可憑個人意思解經，需要群體或教會的權威。天主教傳統常引此節；部分新教註釋也採此讀法。<\/li><li><strong>聖靈讀法<\/strong>：預言出於聖靈，所以讀者也需要同一位聖靈光照才能明白。<\/li><\/ul><blockquote><p><strong>最好的理解：<\/strong><strong>主要講預言的來源。<\/strong>1:21 的「因為」把 1:20 解釋清楚：預言不是先知自己想出來、自己解開的，是聖靈帶著人說出神的話。這節不是禁止信徒自己讀經，也不是說只有牧師才能解經。但由來源推出讀法：既然經文不是出於人意，讀的人也不可「強解」（3:16）——讀經的保護是在群體中讀、照上下文讀、謙卑地讀。（另見 ISS00_3）<\/p><\/blockquote><p><strong>② φερόμενοι 與 ἠνέχθη<\/strong>：被動語態，同一個 φέρω。人沒有失去自己——「人……說出」，主詞是人；但推動的力量從神來。這使我們想起徒 27:15、17：保羅的船「任風颳去」，用的就是這個字。這不是機械口述，也不是人的靈感；像帆船，帆是人的，風是神的。<\/p><p><strong>③ 異文<\/strong>：ἀπὸ θεοῦ ἄνθρωποι（人從神那裡說話）有抄本作 ἅγιοι θεοῦ ἄνθρωποι（神的聖人說話；TR，KJV「holy men of God」）。和合本「說出神的話來」接近前者。兩讀都不改變聖靈是源頭的重點。<\/p>","exp":"<p><strong>聖經不是先知自己想出來的，所以也不是讀的人可以隨意改寫的——但這不是叫人不敢讀經。<\/strong><\/p><p>1:20 是全卷最常被誤用的經文之一。有人拿它說：「你不要自己讀經，會讀錯。」可是看原文，彼得講的首先不是讀的人，而是寫的人。<\/p><p>ἐπίλυσις 新約只用這一次，意思是「解開」——把一個異象、一個謎解開。彼得說，經上的預言不是先知自己解開的。先知看見了，但說出來的意思不是他自己推想出來的。<\/p><p>證據就在下一節的「因為」。「預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。」<strong>1:20 講來源，1:21 說明來源。<\/strong><\/p><p>「感動」原文 φερόμενοι，是 1:17–18 那個「帶」的字。保羅坐船去羅馬，遇上大風，「船被風抓住，敵不住風，我們就任風颳去」——這使我們想起徒 27:15 同一個字。先知像一艘帆船：帆是他的，聲音、用字、性情都是他的；風是聖靈的，方向是神的。<\/p><p>那讀經的人呢？既然經文不是出於人意，我們也不可以照私意去扭曲它（3:16「強解」）。保護不是把聖經鎖起來，是三件事：在群體中讀，照上下文讀，謙卑地讀。<\/p><p>聖靈是我的引導。那一位當初帶著先知說話的聖靈，今天也帶著讀經的人明白。打開你的聖經吧。不是憑私意，而是跟弟兄姊妹一起，在同一位聖靈的風裡讀。<\/p><p>〔彼前〕彼得前書講義第 1 章（彼前 1:10–12：眾先知「詳細地尋求考察」，在他們心裡的是基督的靈）。<\/p>"}],"2":[{"a":1,"z":1,"star":2,"grk":"<blockquote lang=\"grc\"><p>Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·<\/p><\/blockquote>","lit":"<blockquote><p>「然而從前在百姓中也有假先知起來，照樣，在你們中間也將有假教師；他們要從旁偷偷帶進導致滅亡的派系主張，甚至否認那買了他們的主人，給自己招來迅速的滅亡。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>假師傅<\/td><td>ψευδοδιδάσκαλοι<\/td><td>pseudodidaskaloi<\/td><td>G5572<\/td><td>ψευδής＋διδάσκαλος<\/td><td>假的教師<\/td><td>新約僅此一次；他們的身分是「教」的人，問題出在所教的內容<\/td><\/tr><tr><td>私自引進<\/td><td>παρεισάξουσιν<\/td><td>pareisaxousin<\/td><td>G3919<\/td><td>παρά＋εἰς＋ἄγω<\/td><td>從旁帶進<\/td><td>新約僅此一次；不是公開唱反調，是夾帶<\/td><\/tr><tr><td>異端<\/td><td>αἱρέσεις<\/td><td>haireseis<\/td><td>G139<\/td><td>αἱρέομαι（選擇）<\/td><td>選擇、派別<\/td><td>還不是後來的教義術語；是自己挑選、造成分裂的主張<\/td><\/tr><tr><td>買<\/td><td>ἀγοράσαντα<\/td><td>agorasanta<\/td><td>G59<\/td><td>ἀγορά（市場）<\/td><td>在市場上買下<\/td><td>奴隸市場的字：主人已經付了價<\/td><\/tr><tr><td>主<\/td><td>δεσπότην<\/td><td>despotēn<\/td><td>G1203<\/td><td>—<\/td><td>主人、主宰<\/td><td>不是一般的 κύριος，是對奴僕有產權的主人<\/td><\/tr><tr><td>不承認<\/td><td>ἀρνούμενοι<\/td><td>arnoumenoi<\/td><td>G720<\/td><td>—<\/td><td>否認、不認<\/td><td>彼得在院子裡三次不認主的字（路 22:57）<\/td><\/tr><tr><td>速速的<\/td><td>ταχινήν<\/td><td>tachinēn<\/td><td>G5031<\/td><td>ταχύς<\/td><td>迅速的<\/td><td>1:14「快到了」同一個字<\/td><\/tr><\/table>","gram":"<p><strong>① τὸν ἀγοράσαντα αὐτοὺς δεσπότην——基督為誰付了價？<\/strong><\/p><ul><li><strong>普遍救贖<\/strong>（阿米念、衛斯理傳統與部分路德宗）：基督確實為所有人、連後來沉淪的假師傅也付了價；可見救贖之功可以被人拒絕。<\/li><li><strong>有限救贖<\/strong>（多數改革宗）：「買」是照他們自己的認信、在群體眼中的說法；或借用申 32:6 神「將你買來」以色列全體的盟約語言，不是講個人蒙揀選的救贖。<\/li><li><strong>足夠於眾人、有效於信者<\/strong>（亞目拉督派等折衷讀法）：基督的死足夠所有人，只在信的人身上生效。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得在這裡不是要裁決救贖的範圍，而是要量出罪的深度——他們否認的，是一位付了價的主人。這一節兩派都讀得通，不宜單憑它定案；兩派都同意的是：假師傅在群體裡面，口稱屬主。<\/strong><\/p><\/blockquote><p><strong>② αἱρέσεις 是「異端」還是「派別」？<\/strong><\/p><ul><li>在林前 11:19、加 5:20 它指結黨、派別；到二世紀才成為「異端」的專門術語。<\/li><li>這裡加上 ἀπωλείας（滅亡的），已經不是中性的「意見不同」，而是把人帶向滅亡的主張。<\/li><\/ul><blockquote><p><strong>最好的理解：自己挑選、造成分裂、終局是滅亡的教訓；「異端」的後期意思在這裡正在成形。<\/strong><\/p><\/blockquote><p><strong>③ 時態<\/strong>：本節用未來式（ἔσονται、παρεισάξουσιν），是遺言體的預言；但從 2:10 起彼得多半改用現在式描述他們——預言已經在讀者眼前應驗。<\/p>","exp":"<p><strong>寫「不承認」這三個字的人，自己曾經三次不承認主。<\/strong><\/p><p>彼得從以色列的歷史說起：「從前在百姓中有假先知起來」；接著把話轉向讀者：「將來在你們中間也必有假師傅」。兩個詞要停下來看。「在你們中間」——危險不是從外面攻城，是從裡面長出來。「私自引進」παρεισάξουσιν——不是公開舉旗反對，是在真道旁邊夾帶，像把一件東西悄悄塞進行李。所以假師傅很少自稱假師傅；他們講許多對的話，只在要緊的地方換掉一樣東西。<\/p><p>換掉的是甚麼？「連買他們的主他們也不承認。」δεσπότης 是奴隸市場上付了價、有產權的主人；ἀγοράζω 就是在市場上買下。基督用自己的血付了價（彼前 1:18–19），他們卻說：我不屬於誰。否認不一定是口裡說「沒有耶穌」，更常是用生活說「他不是我的主人」——2:10「輕慢主治的」、2:19「應許人得以自由」，都是同一個否認的延伸。<\/p><p>而 ἀρνούμενοι 正是大祭司院子裡的那個字。彼得和假師傅的分別，不在於他從來沒有否認過，而在於主轉過身來看他，他出去痛哭，後來在海邊被主接了回來。所以這一章不是完美的人居高臨下的定罪，是一個被拉回來的人，看見別人正往下走時的大聲呼喊。<\/p><p>落到今天：這一節教的是<strong>記號<\/strong>，不是<strong>名單<\/strong>。講台不點名今天任何牧者、教會或宗派；分辨先從自己開始——我有沒有在真道旁邊夾帶自己的東西？我口稱的主，是不是我生活中真正付了價、有產權的主人？<\/p><p>〔背景〕三次不認主（路 22:54–62；約 21:15–17）。〔彼前〕彼得前書講義第 1 章（1:18–19 重價贖回）。〔猶〕猶 4（猶大書講義尚未製作）。<\/p>"},{"a":2,"z":3,"star":1,"grk":"<blockquote lang=\"grc\"><p>καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται· καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ νυστάζει.<\/p><\/blockquote>","lit":"<blockquote><p>「並且許多人要緊跟他們的種種放蕩，真理的道路因他們要被毀謗；他們又在貪婪中，用捏塑出來的話拿你們做買賣。對他們的判決自古以來並沒有閒著，他們的滅亡也沒有打盹。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>隨從<\/td><td>ἐξακολουθήσουσιν<\/td><td>exakolouthēsousin<\/td><td>G1811<\/td><td>ἐκ＋ἀκολουθέω<\/td><td>緊跟到底<\/td><td>「跟從」本是門徒的字，在這裡跟錯了人<\/td><\/tr><tr><td>邪淫的行為<\/td><td>ἀσελγείαις<\/td><td>aselgeiais<\/td><td>G766<\/td><td>—<\/td><td>放蕩、不知羞恥<\/td><td>複數：一種接一種的放縱<\/td><\/tr><tr><td>被毀謗<\/td><td>βλασφημηθήσεται<\/td><td>blasphēmēthēsetai<\/td><td>G987<\/td><td>—<\/td><td>被毀謗<\/td><td>外人看見的是門徒的生活，罵的卻是「道」<\/td><\/tr><tr><td>貪心<\/td><td>πλεονεξίᾳ<\/td><td>pleonexia<\/td><td>G4124<\/td><td>πλέον＋ἔχω<\/td><td>想要更多<\/td><td>本章第一次；2:14 再出現<\/td><\/tr><tr><td>捏造的<\/td><td>πλαστοῖς<\/td><td>plastois<\/td><td>G4112<\/td><td>πλάσσω（捏塑）<\/td><td>捏塑出來的<\/td><td>新約僅此一次；照聽眾想要的形狀捏<\/td><\/tr><tr><td>取利<\/td><td>ἐμπορεύσονται<\/td><td>emporeusontai<\/td><td>G1710<\/td><td>ἐν＋πορεύομαι<\/td><td>經商、做買賣<\/td><td>受詞是「你們」：人成了貨品<\/td><\/tr><tr><td>遲延<\/td><td>ἀργεῖ<\/td><td>argei<\/td><td>G691<\/td><td>ἀ＋ἔργον<\/td><td>閒著、不做工<\/td><td>新約僅此一次；審判並沒有放假<\/td><\/tr><tr><td>（不）打盹<\/td><td>νυστάζει<\/td><td>nystazei<\/td><td>G3573<\/td><td>—<\/td><td>打瞌睡<\/td><td>太 25:5 童女「打盹」同字；滅亡沒有睡著<\/td><\/tr><\/table>","gram":"<p><strong>① ἡ ὁδὸς τῆς ἀληθείας——「真道」指甚麼？<\/strong><\/p><ul><li><strong>指整個基督信仰<\/strong>：初代教會稱自己為「這道」（徒 9:2；19:9）。<\/li><li><strong>指真理的教訓<\/strong>：與假教訓相對的正確內容。<\/li><\/ul><blockquote><p><strong>最好的理解：「道路」是一種走出來的生活，不只是一套說法；所以外人毀謗它，是因為看見了跟從假師傅的人怎樣生活。教義的錯，最後會在行為上被看見。<\/strong><\/p><\/blockquote><p><strong>② 異文<\/strong>：TR 作 ἀπωλείαις（害人的道路），SBLGNT 與多數新近校勘本作 ἀσελγείαις（放蕩）；和合本「邪淫的行為」跟後者。<\/p><p><strong>③ ὑμᾶς ἐμπορεύσονται<\/strong>：直接受詞是「你們」——不是「藉你們賺錢」而已，是「拿你們當貨」。<\/p><p><strong>④ 兩個擬人<\/strong>：οὐκ ἀργεῖ、οὐ νυστάζει——審判沒有閒著、滅亡沒有打盹。這兩個否定句預先回答 3:4 的譏誚：看起來沒有動靜，不等於神睡著了。<\/p>","exp":"<p><strong>假教訓最先毀掉的，往往不是教義書，是「道」在外人眼中的名聲。<\/strong><\/p><p>「將有許多人隨從他們」——假師傅的危險，在於他們常常很成功。ἐξακολουθέω 本來是門徒跟從主的字，加上 ἐκ 是緊跟到底。人跟著跑，因為放縱有市場。結果「真道因他們被毀謗」。「真道」原文是「真理的道路」；外人分不出誰真誰假，只看見一群自稱跟從耶穌的人放縱、貪財，罵的就是這條路。<\/p><p>2:3 用三個字畫出動機、方法與目的。動機是 πλεονεξία——想要更多；方法是 πλαστοῖς λόγοις——捏塑出來的話，像陶匠捏泥，照聽眾想要的形狀捏；目的是 ἐμπορεύσονται——做買賣。最刺眼的是受詞：「你們」。在這種講道裡，會眾不是要牧養的羊，是貨。這正好和 1:16 對照：使徒說，我們傳的「並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」。真見證不需要捏。<\/p><p>接著彼得寫了兩個很有畫面的否定句：審判「並不遲延」，原文是「沒有閒著」；滅亡「也必速速來到」，原文是「沒有打盹」。讀者看見假師傅風生水起，以為神在睡覺；彼得說：審判一直醒著。這是第三章「主不是耽延」的伏筆。<\/p><p>落到今天：對 2:3 最好的回應，不是在網路上點名，而是教會自己的財務透明、講台不賣應許。也要回頭問自己：我愛聽某一種講道，是因為它是真的，還是因為它照我想要的形狀捏？<\/p><p>〔猶〕猶 4、11、16（猶大書講義尚未製作）。<\/p>"},{"a":4,"z":4,"star":1,"grk":"<blockquote lang=\"grc\"><p>Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,<\/p><\/blockquote>","lit":"<blockquote><p>「因為神若沒有放過犯了罪的天使，反而把他們丟進塔耳塔羅斯，交在幽暗的鎖鍊（或：幽暗的坑）中，被看守著等候審判；」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>犯了罪<\/td><td>ἁμαρτησάντων<\/td><td>hamartēsantōn<\/td><td>G264<\/td><td>—<\/td><td>犯罪<\/td><td>不定過去式：一件已經發生的事<\/td><\/tr><tr><td>寬容<\/td><td>ἐφείσατο<\/td><td>epheisato<\/td><td>G5339<\/td><td>φείδομαι<\/td><td>顧惜、放過<\/td><td>2:4、2:5 兩次「沒有放過」<\/td><\/tr><tr><td>丟在地獄<\/td><td>ταρταρώσας<\/td><td>tartarōsas<\/td><td>G5020<\/td><td>Τάρταρος<\/td><td>丟入塔耳塔羅斯<\/td><td>新約僅此一次；希臘人口中最深的拘禁之處<\/td><\/tr><tr><td>（鎖鍊）／和合本：坑<\/td><td>σειραῖς<\/td><td>seirais<\/td><td>G4577<\/td><td>—<\/td><td>鎖鍊、繩索<\/td><td>異文作 σιροῖς（坑）；和合本「坑」跟後者<\/td><\/tr><tr><td>黑暗<\/td><td>ζόφου<\/td><td>zophou<\/td><td>G2217<\/td><td>—<\/td><td>陰沉的幽暗<\/td><td>2:17 給假師傅存留的也是這幽暗<\/td><\/tr><tr><td>等候<\/td><td>τηρουμένους<\/td><td>tēroumenous<\/td><td>G5083<\/td><td>—<\/td><td>看守、保留<\/td><td>現在分詞：仍在被看守；2:9 同字<\/td><\/tr><\/table>","gram":"<p><strong>① 異文 σειραῖς／σιροῖς<\/strong><\/p><ul><li><strong>σειραῖς（鎖鍊）<\/strong>：SBLGNT、NA28 與拜占庭傳統；與猶 6「用鎖鍊把他們永遠拘留」相合。<\/li><li><strong>σιροῖς／σειροῖς（坑、地窖）<\/strong>：幾份最古老的大楷抄本；和合本「交在黑暗坑中」照這一讀。<\/li><\/ul><blockquote><p><strong>最好的理解：兩讀意思相近——拘禁、幽暗、等候審判；本講義原文照 SBLGNT，經文照和合本，不影響任何教義。<\/strong><\/p><\/blockquote><p><strong>② 犯罪的天使是誰？<\/strong><\/p><ul><li><strong>創 6:1–4 的讀法<\/strong>：「神的兒子們」是天使，與人的女子交合。這是第二聖殿時期猶太文獻（以諾一書 6–21 章等）與多數早期教父的讀法，猶 6 也在這背景裡。<\/li><li><strong>原初的墮落<\/strong>：指撒但與隨從他的天使起初的背叛，不特指創 6 章。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得的次序——天使、洪水、所多瑪——正是創 6、6–8、19 的次序，最自然是借用讀者熟悉的創 6 章背景；但他只借用背景，不把以諾一書當正典，也不提供天使學的細節。他要說的只有一句：神沒有寬容。<\/strong><\/p><\/blockquote><p><strong>③ ταρταρόω<\/strong>：希臘神話中囚禁泰坦的最深處。彼得借讀者熟悉的字講一個真實的拘禁，正如保羅在雅典引用希臘詩人（徒 17:28）；用這個字不等於接受那套神話。<\/p>","exp":"<p><strong>彼得舉的第一個審判例子是：連天使都沒有被放過。<\/strong><\/p><p>先看句子的形狀。2:4 以「若」（Εἰ γὰρ）開頭，這個條件句一路延伸，經過挪亞、所多瑪、羅得，直到 2:9 才說出「那麼」。所以讀這一節不要停在這裡——它是一句話的第一口氣，不是結論。<\/p><p>天使是比人更有能力、更靠近神的受造者。猶大書說他們是「不守本位、離開自己住處的天使」。離開本位、想要不屬於自己的位置——這是一切背叛的形狀。彼得用了一個新約只出現這一次的字 ταρταρώσας：丟入最深的拘禁之處。他們現在被「看守著」（τηρουμένους），等候審判；判決還沒有最後執行，但沒有一個逃得掉。<\/p><p>彼得這樣開頭，是要回應讀者心裡的疑問：假師傅那麼有能力、那麼有魅力，神會管嗎？他說：比他們更有能力的天使，神都沒有放過。審判不看身分、不看恩賜、不看影響力。<\/p><p>這節經文周圍有許多好奇的問題——天使怎樣犯罪、塔耳塔羅斯在哪裡、以諾一書說了甚麼。這些可以在書房裡謹慎研究，但彼得沒有展開，我們也不必把講台變成天使學講座。他要我們帶走的是：審判是真實的，而且公正。<\/p><p>落到今天：讀到這裡不必害怕。這個「若」的長句，終點是 2:9 的「主知道搭救」。認真看待審判的人，正好最能安心把審判交給神——不必自己去替神清理門戶，只要守住自己的本位。<\/p><p>〔舊約〕創世記講義第 6 章（創 6:1–4）。〔猶〕猶 6（猶大書講義尚未製作）。<\/p>"},{"a":5,"z":5,"star":1,"grk":"<blockquote lang=\"grc\"><p>καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,<\/p><\/blockquote>","lit":"<blockquote><p>「又沒有放過古時的世界，卻看守保護了挪亞——八人中的一位、義的傳令官——那時他使洪水臨到不敬虔之人的世界；」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>上古的世代<\/td><td>ἀρχαίου κόσμου<\/td><td>archaiou kosmou<\/td><td>G744<\/td><td>ἀρχή<\/td><td>古時的世界<\/td><td>3:6「當時的世界」被水淹沒<\/td><\/tr><tr><td>一家八口<\/td><td>ὄγδοον<\/td><td>ogdoon<\/td><td>G3590<\/td><td>ὀκτώ<\/td><td>第八個<\/td><td>希臘慣用語：「第八個挪亞」＝挪亞連同另外七人<\/td><\/tr><tr><td>傳……的<\/td><td>κήρυκα<\/td><td>kēryka<\/td><td>G2783<\/td><td>κηρύσσω<\/td><td>傳令官<\/td><td>替王宣告命令的人：挪亞替神喊話<\/td><\/tr><tr><td>義道<\/td><td>δικαιοσύνης<\/td><td>dikaiosynēs<\/td><td>G1343<\/td><td>δίκη<\/td><td>義<\/td><td>在不敬虔的世代傳義<\/td><\/tr><tr><td>保護<\/td><td>ἐφύλαξεν<\/td><td>ephylaxen<\/td><td>G5442<\/td><td>—<\/td><td>看守、保護<\/td><td>與 2:4 τηρέω 對照：同是「看守」，一邊等審判，一邊得保護<\/td><\/tr><tr><td>洪水<\/td><td>κατακλυσμόν<\/td><td>kataklysmon<\/td><td>G2627<\/td><td>κατά＋κλύζω<\/td><td>淹沒一切的大水<\/td><td>太 24:38–39 主用同字講他的再來<\/td><\/tr><\/table>","gram":"<p><strong>① 挪亞「傳義道」——創世記並沒有記載他講道<\/strong><\/p><ul><li><strong>口頭的宣講<\/strong>：猶太傳統（約瑟夫《猶太古史》）與早期教會（革利免一書 7:6）都說挪亞曾勸那世代悔改。<\/li><li><strong>生命的宣講<\/strong>：他造方舟、他的義行本身就是宣告；來 11:7 說他因此「定了那世代的罪」。<\/li><\/ul><blockquote><p><strong>最好的理解：兩者不衝突。一個百年造船的人，不可能不被問「你在做甚麼」；他的回答與他的木槌，是同一篇講道。<\/strong><\/p><\/blockquote><p><strong>② ὄγδοον Νῶε<\/strong>：古希臘的慣用說法，「某人是第八個」＝他和另外七個人在一起。和合本意譯為「一家八口」，與彼前 3:20「只有八個人」相合。<\/p><p><strong>③ 句型 οὐκ ἐφείσατο… ἀλλά… ἐφύλαξεν<\/strong>：本章第一次出現「沒有寬容……卻保護」的對稱。審判之中有保護，這個句型在 2:7 與 2:9 再出現兩次。<\/p>","exp":"<p><strong>在整個世界的審判裡，神看守著一條船上的八個人。<\/strong><\/p><p>第二個例子是洪水。「上古的世代」整體被審判，規模比天使更大。但這一次句子多了一個轉折：「卻保護了傳義道的挪亞一家八口」。從這裡開始，第 2 章的審判例子都帶著一個被保守的人——這正是彼得要一路走到 2:9 的路線。<\/p><p>挪亞被稱為 κῆρυξ，「傳令官」。古代城邦的傳令官站在廣場上，替王宣告命令；他的話不是自己的意見。挪亞在一個不敬虔的世代，替神宣告義。結果呢？聖經沒有記載任何一個家族以外的人回應。如果用今天的數字標準，他是一位很失敗的傳道人；但神稱他為義的傳令官，並且親自看守他。<\/p><p>同一位挪亞，彼得在前一封信也寫過：「神容忍等待的時候……只有八個人」（彼前 3:20）。那一封信講神的忍耐與洗禮的對應；這一封講審判中的保守。兩封信一起看：神的忍耐在洪水前等了很久，神的保護在洪水中沒有失手。<\/p><p>落到今天：在一個不敬虔的世代裡忠心，可能長期看不見果效。挪亞的價值不是用聽眾人數量的，是用「神看守了他」來量的。我們也不是被叫去確保結果，是被叫去忠心傳義；保護與結果，是主的事。<\/p><p>〔舊約〕創世記講義第 6–8 章。〔彼前〕彼得前書講義第 3 章（3:20 挪亞八口）。<\/p>"},{"a":6,"z":8,"star":2,"grk":"<blockquote lang=\"grc\"><p>καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ἀσεβέσιν τεθεικώς, καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο· βλέμματι γὰρ καὶ ἀκοῇ ὁ δίκαιος ἐγκ
