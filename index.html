<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=5">
<meta name="theme-color" content="#1F4D3D">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="321彼得後書講義">
<meta name="application-name" content="321彼得後書講義">
<meta name="description" content="321彼得後書講義：全書三章逐節原文解經、講章逐字稿與321生命應用。">
<title>321彼得後書講義</title>
<link rel="manifest" id="MF" href="./manifest.webmanifest">
<style>
:root{
  --ink:#12181B; --paper:#EEF0EB; --card:#FFFFFF; --line:#D6DAD2;
  --pine:#1F4D3D; --pine2:#2E6B55; --brass:#9C6B18; --clay:#8C3A2E; --dusk:#54636B;
  --fs:17px; --r:14px;
  --hl-gold:rgba(156,107,24,.32);
  --hl-green:#CFE6CC; --hl-blue:#CFDFF4; --hl-pink:#F7D3DC; --hl-purple:#E3D5F1;
  --hl-maroon:#EBD0D0; --hl-brown:#E9D9BF; --hl-charcoal:#DBDAD4;
  --hb-green:#5E9E63; --hb-blue:#5583C7; --hb-pink:#DB7A90; --hb-purple:#9377C0;
  --hb-maroon:#8C4A4E; --hb-brown:#8A6740; --hb-charcoal:#54534E;
  --hl-now:#FFE9A8;
  --sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC",serif;
  --mono:"SF Mono",ui-monospace,Menlo,monospace;
}
html[data-dark="1"]{
  --ink:#E8EDE9; --paper:#0E1412; --card:#161E1A; --line:#28332D;
  --pine:#7FBFA4; --pine2:#9BD3BA; --brass:#D6A250; --clay:#D98A78; --dusk:#93A29A;
  --hl-gold:rgba(214,162,80,.34);
  --hl-green:#22402A; --hl-blue:#1F3350; --hl-pink:#45222E; --hl-purple:#332A48;
  --hl-maroon:#3D2525; --hl-brown:#3B3020; --hl-charcoal:#34342F;
  --hb-green:#7BC28C; --hb-blue:#7FA0DE; --hb-pink:#E58FA0; --hb-purple:#A48AC9;
  --hb-maroon:#C08084; --hb-brown:#B99168; --hb-charcoal:#8E8D86;
  --hl-now:#4A3C16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--sans); font-size:var(--fs); line-height:1.85;
  padding-bottom:calc(66px + env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}

/* ── 頁首 ── */
header.top{
  position:sticky;top:0;z-index:40;background:var(--paper);
  border-bottom:1px solid var(--line);
  padding-top:env(safe-area-inset-top);
}
header .bar{display:flex;align-items:center;gap:8px;height:52px;max-width:720px;margin:0 auto;padding:0 12px}
header h1{font-family:var(--serif);font-size:17px;font-weight:700;margin:0;flex:1;letter-spacing:.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:40px;height:40px;border:0;background:transparent;color:var(--ink);
  font-size:17px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:0 0 auto;
}
.ico:active{background:var(--line)}
.ico.hide{display:none}
.ico.lang{font-family:var(--serif);font-size:16px;font-weight:700;letter-spacing:0}
.ico.lang.on{color:var(--pine)}

/* ── 分頁 ── */
nav.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
nav.tabs button{
  flex:1;border:0;background:transparent;color:var(--dusk);
  font-family:var(--sans);font-size:11px;padding:8px 0 7px;cursor:pointer;line-height:1.3;
}
nav.tabs button b{display:block;font-family:var(--serif);font-size:17px;font-weight:600;margin-bottom:1px}
nav.tabs button.on{color:var(--pine)}

/* ── 通用 ── */
.eyebrow{
  font-size:11px;letter-spacing:.22em;color:var(--dusk);
  margin:0 0 6px;text-transform:none;font-weight:600;
}
h2.big{font-family:var(--serif);font-size:25px;line-height:1.5;margin:0 0 14px;font-weight:700}
h3.sec{font-family:var(--serif);font-size:19px;margin:26px 0 10px;font-weight:700;color:var(--pine)}
.sect{padding:20px 0}
.card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:16px;margin:12px 0;
}
.muted{color:var(--dusk)}
.sm{font-size:calc(var(--fs) * .82)}
.xs{font-size:calc(var(--fs) * .74)}
.btn{
  display:inline-block;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer;
}
.btn.pri{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .btn.pri{color:#0E1412}
.btn:active{transform:translateY(1px)}
.bigbtn{
  display:block;width:100%;text-align:left;background:var(--pine);color:#fff;
  border:0;border-radius:var(--r);padding:16px 18px;cursor:pointer;font:inherit;
}
html[data-dark="1"] .bigbtn{color:#0E1412}
.bigbtn small{display:block;font-size:12px;opacity:.82;letter-spacing:.1em}
.bigbtn b{display:block;font-family:var(--serif);font-size:19px;margin:5px 0 0;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap}
.pill{
  border:1px solid var(--line);background:var(--card);color:var(--dusk);
  border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer;font:inherit;
}
.pill.on{background:var(--pine);border-color:var(--pine);color:#fff}
html[data-dark="1"] .pill.on{color:#0E1412}

/* ── 地形圖（招牌元素）── */
.terrain{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 10px 6px;margin:6px 0 0}
.terrain svg{display:block;width:100%;height:auto}
.tlab{font-family:var(--mono);font-size:8.5px;fill:var(--dusk)}
.tlab.hi{fill:var(--brass);font-weight:700}
.tpath{fill:none;stroke:var(--pine);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tdot{fill:var(--brass)}
.tdot.low{fill:var(--clay)}
.tnow{fill:none;stroke:var(--ink);stroke-width:1.5}

/* ── 章清單 ── */
.chrow{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:13px 14px;margin:8px 0;cursor:pointer;font:inherit;color:inherit;
}
.chn{
  font-family:var(--mono);font-size:12px;color:var(--dusk);
  min-width:26px;padding-top:3px;letter-spacing:-.04em
}
.chrow b{font-family:var(--serif);font-size:17px;display:block;line-height:1.45}
.chrow .s{font-size:13px;color:var(--dusk);display:block;margin-top:2px;line-height:1.6}
.chrow .done{color:var(--pine);font-size:12px}

/* ── 經文 ── */
.vs{
  display:flex;gap:9px;padding:7px 0 7px 10px;border-left:2px solid transparent;
  cursor:pointer;align-items:flex-start;
}
.vs:active{background:var(--card)}
.vs.has{border-left-color:var(--pine)}
.vs.star{border-left-color:var(--brass);border-left-width:3px}
.vs.warn{border-left-color:var(--clay);border-left-width:3px}
.vn{font-family:var(--mono);font-size:11.5px;color:var(--dusk);min-width:20px;padding-top:5px;text-align:right}
.vt{flex:1;line-height:1.95}
.vs .flag{font-size:11px;color:var(--clay);margin-left:4px}

/* ── 六層 ── */
.layer{border-top:1px solid var(--line);padding:12px 0}
.layer:first-child{border-top:0}
.lh{
  display:flex;align-items:center;gap:8px;cursor:pointer;font-size:12px;
  letter-spacing:.14em;color:var(--dusk);font-weight:600;user-select:none
}
.lh .n{font-family:var(--mono);color:var(--pine)}
.lh .caret{margin-left:auto;font-size:11px;opacity:.6}
.lb{margin-top:8px}
.lb.grk{font-family:var(--serif);font-size:16px;line-height:2.05;color:var(--pine)}
.lb.lit{font-family:var(--serif)}
.kw{
  display:inline-block;border:1px solid var(--line);border-radius:8px;
  padding:3px 9px;margin:3px 5px 3px 0;font-size:13px;cursor:pointer;background:var(--card)
}
.kw i{font-style:normal;font-family:var(--serif);color:var(--pine)}

/* ── 表 ── */
table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0}
th,td{border-bottom:1px solid var(--line);padding:7px 6px;text-align:left;vertical-align:top}
th{color:var(--dusk);font-weight:600;font-size:12.5px}

/* ── 軌跡 ── */
.track{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.track .gk{font-family:var(--serif);font-size:22px;color:var(--pine)}
.stops{margin:12px 0 4px;padding-left:0;list-style:none}
.stop{display:flex;gap:10px;align-items:baseline;padding:5px 0}
.stop .r{font-family:var(--mono);font-size:12px;min-width:44px;color:var(--dusk)}
.stop .d{width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dusk);margin-top:6px}
.stop.dark .d{background:var(--clay)} .stop.light .d{background:var(--brass)}
.insight{border-left:3px solid var(--brass);padding:8px 0 8px 12px;margin:10px 0 0;font-family:var(--serif);font-size:16px}

/* ── 爭議 ── */
.iss{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin:10px 0}
.pos{border:1px solid var(--line);border-radius:10px;padding:11px;margin:8px 0;font-size:14px}
.pos b{color:var(--pine)}
.consensus{background:rgba(156,107,24,.09);border-radius:10px;padding:11px;margin:10px 0;font-size:14px}
.say{border-left:3px solid var(--pine);padding-left:12px;margin:10px 0;font-family:var(--serif)}

/* ── 分級 ── */
.lv{display:inline-block;font-size:11px;padding:2px 7px;border-radius:6px;font-weight:700;margin-right:6px}
.lv.g{background:rgba(31,77,61,.13);color:var(--pine)}
.lv.y{background:rgba(156,107,24,.16);color:var(--brass)}
.lv.r{background:rgba(140,58,46,.14);color:var(--clay)}

/* ── 打卡 ── */
.chk{display:flex;gap:11px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.chk:last-child{border-bottom:0}
.box{
  width:21px;height:21px;border:1.5px solid var(--line);border-radius:6px;flex:0 0 auto;margin-top:3px;
  display:grid;place-items:center;font-size:13px;color:#fff
}
.chk.on .box{background:var(--pine);border-color:var(--pine)}
.chk.on .t{color:var(--dusk);text-decoration:line-through}
.chk .t{flex:1;font-size:15px;line-height:1.7}

/* ── 底部抽屜 ── */
.sheet{
  position:fixed;inset:0;z-index:90;background:rgba(10,16,14,.42);
  display:none;align-items:flex-end;
}
.sheet.on{display:flex}
.sheet .inner{
  background:var(--paper);width:100%;max-height:88vh;overflow:auto;
  border-radius:20px 20px 0 0;padding:8px 18px calc(28px + env(safe-area-inset-bottom));
  animation:up .22s ease;
}
@keyframes up{from{transform:translateY(24px);opacity:.5}}
.grab{width:38px;height:4px;border-radius:2px;background:var(--line);margin:6px auto 12px}
.sheet h4{font-family:var(--serif);font-size:20px;margin:4px 0 2px}

/* ── 其他 ── */
.toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%);
  background:var(--ink);color:var(--paper);padding:9px 16px;border-radius:999px;
  font-size:13.5px;z-index:120;opacity:0;transition:.2s;pointer-events:none;white-space:nowrap
}
.toast.on{opacity:1}
.note{
  width:100%;border:1px solid var(--line);border-radius:10px;background:var(--card);
  color:inherit;font:inherit;font-size:15px;padding:11px;min-height:88px;resize:vertical
}
.q{font-family:var(--serif);font-size:var(--fs);line-height:1.75;margin:0 0 4px}
.tip{font-size:calc(var(--fs) * .8);color:var(--dusk);background:rgba(31,77,61,.07);border-radius:9px;padding:9px 11px;margin-top:8px}
.blank i{font-style:normal;color:var(--clay);letter-spacing:.05em}

/* ── 教學講義逐字稿（長文閱讀）── */
.les p{font-family:var(--serif);font-size:var(--fs);line-height:1.95;margin:0 0 15px;text-align:justify}
.les h4{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.18);font-weight:700;color:var(--pine);
  margin:30px 0 12px;padding-top:14px;border-top:1px solid var(--line);scroll-margin-top:64px
}
.les h4:first-child{margin-top:6px;padding-top:0;border-top:0}
.les p.dec{color:var(--pine);font-weight:600;margin-bottom:9px}
/* 想更深：收起來的一問一答 */
.les details.deeper{
  border:1px solid var(--line);border-radius:12px;background:var(--card);
  padding:10px 13px;margin:0 0 16px
}
.les details.deeper summary{
  font-family:var(--serif);font-size:calc(var(--fs) * .92);line-height:1.65;color:var(--pine);
  font-weight:600;cursor:pointer;list-style:none
}
.les details.deeper summary::-webkit-details-marker{display:none}
.les details.deeper summary::before{content:"＋　";opacity:.6}
.les details.deeper[open] summary::before{content:"−　"}
.les details.deeper[open] summary{margin-bottom:8px}
.les .deeper-a p{font-size:calc(var(--fs) * .95);line-height:1.9;margin:0;color:var(--dusk)}
/* 三個化 */
.les p.t3s{
  font-family:var(--serif);font-size:calc(var(--fs) * 1.06);font-weight:700;color:var(--pine);
  margin:26px 0 10px
}
.les p.t3t{font-family:var(--serif);font-size:calc(var(--fs) * .95);font-weight:700;color:var(--brass);margin:16px 0 6px}
.les p.t3m{
  font-size:calc(var(--fs) * .85);line-height:1.8;color:var(--dusk);background:rgba(31,77,61,.07);
  border-radius:11px;padding:10px 13px;margin:0 0 13px;text-align:left
}
.les p.t3n{margin:0 0 12px}
.toc button{
  display:block;width:100%;text-align:left;border:0;background:transparent;color:inherit;
  font-family:var(--serif);font-size:16px;line-height:1.6;padding:7px 0;cursor:pointer;
  border-bottom:1px solid var(--line)
}
.toc button:last-child{border-bottom:0}
.toc button:active{color:var(--pine)}
.hr{height:1px;background:var(--line);margin:22px 0}
.center{text-align:center}
a{color:var(--pine)}
.foot{padding:26px 0 8px;font-size:12px;color:var(--dusk);line-height:1.9}

/* ── 全螢幕模式（講台／小組）── */
.full{position:fixed;inset:0;z-index:200;background:var(--paper);display:none;flex-direction:column}
.full.on{display:flex}
html[data-tele="1"]{--paper:#0C1210;--ink:#EDF2EE;--card:#141C18;--line:#26332C;--dusk:#8FA098;--pine:#7FBFA4;--brass:#D9A94F;--clay:#D98A78}
.fbar{display:flex;align-items:center;gap:10px;padding:calc(8px + env(safe-area-inset-top)) 14px 8px;border-bottom:1px solid var(--line)}
.fbar .clock{font-family:var(--mono);font-size:15px;color:var(--dusk);letter-spacing:-.02em}
.fbar .clock.over{color:var(--clay)}
.fbar b{font-family:var(--serif);font-size:15px;flex:1;text-align:center}
.fbody{flex:1;overflow:auto;padding:22px 20px 30px;-webkit-overflow-scrolling:touch}
.ffoot{display:flex;gap:8px;padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.rail{height:3px;background:var(--line)}
.rail i{display:block;height:3px;background:var(--brass);width:0;transition:width .3s}
/* 提詞機 */
.tele p{font-size:calc(var(--fs) * 1.45);line-height:2.05;margin:0 0 20px;font-weight:600}
.tele .qq{font-family:var(--serif);color:var(--brass);border-left:3px solid var(--brass);padding-left:14px}
.tele h5{font-family:var(--serif);color:var(--pine);font-size:calc(var(--fs) * 1.1);margin:34px 0 18px;letter-spacing:.04em}
.tele .pause{color:var(--dusk);font-family:var(--mono);font-size:13px;letter-spacing:.2em;margin:26px 0;text-align:center}
.tele .pause b{color:var(--brass)}
/* 小組 */
.live h5{font-family:var(--serif);font-size:15px;color:var(--pine);letter-spacing:.1em;margin:0 0 18px}
.live .qq{font-family:var(--serif);font-size:calc(var(--fs) * 1.5);line-height:1.85;margin:0 0 20px}
.live .tipbox{background:rgba(156,107,24,.12);border-radius:12px;padding:14px;font-size:15px;line-height:1.8}
/* 搜尋 */
.sbox{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--card);color:inherit;font:inherit;font-size:16px;padding:12px 14px}
mark{background:rgba(156,107,24,.3);color:inherit;padding:0 2px;border-radius:3px}

/* ── 品牌與啟動畫面 ── */
.brand{width:26px;height:26px;border-radius:7px;flex:0 0 auto;display:block}
.brand.hide{display:none}
#splash{
  position:fixed;inset:0;z-index:300;background:#12305E;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  transition:opacity .45s ease;
}
#splash.gone{opacity:0;pointer-events:none}
#splash img{width:132px;height:132px;border-radius:28px;box-shadow:0 12px 40px rgba(0,0,0,.4);margin-bottom:20px}
#splash h2{font-family:var(--serif);font-size:25px;margin:0;letter-spacing:.06em;font-weight:700}
#splash p{margin:4px 0 0;font-size:15px;opacity:.85;letter-spacing:.3em}
#splash small{margin-top:26px;font-size:11.5px;opacity:.55;letter-spacing:.16em}

/* ── 畫線與領受 ── */
.vs.hl .vt{background:linear-gradient(transparent 58%, rgba(156,107,24,.32) 58%)}
.mkw{margin:0 0 14px}
.mks{
  cursor:pointer;border-radius:5px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;box-decoration-break:clone;-webkit-box-decoration-break:clone
}
.mks:active{background:var(--line)}
.mks.hl{background:linear-gradient(transparent 60%, var(--hl-gold) 60%)}
.mks.hl[data-c="green"]{background:linear-gradient(transparent 60%, var(--hl-green) 60%)}
.mks.hl[data-c="blue"]{background:linear-gradient(transparent 60%, var(--hl-blue) 60%)}
.mks.hl[data-c="pink"]{background:linear-gradient(transparent 60%, var(--hl-pink) 60%)}
.mks.hl[data-c="purple"]{background:linear-gradient(transparent 60%, var(--hl-purple) 60%)}
.mks.hl[data-c="maroon"]{background:linear-gradient(transparent 60%, var(--hl-maroon) 60%)}
.mks.hl[data-c="brown"]{background:linear-gradient(transparent 60%, var(--hl-brown) 60%)}
.mks.hl[data-c="charcoal"]{background:linear-gradient(transparent 60%, var(--hl-charcoal) 60%)}
/* 正在朗讀的那一句 */
.spk-now{
  background:var(--hl-now)!important;border-radius:4px;
  box-shadow:0 0 0 3px var(--hl-now);transition:background .2s
}
.les h4 .spk-now,.les details.deeper.spk-now{box-shadow:none}
.les details.deeper.spk-now{background:var(--hl-now)!important}
.mkp{cursor:pointer;border-radius:5px;transition:background .12s}
.mkp.hl{background:linear-gradient(transparent 62%, var(--hl-gold) 62%)}
.mkp.hl[data-c="green"]{background:linear-gradient(transparent 62%, var(--hl-green) 62%)}
.mkp.hl[data-c="blue"]{background:linear-gradient(transparent 62%, var(--hl-blue) 62%)}
.mkp.hl[data-c="pink"]{background:linear-gradient(transparent 62%, var(--hl-pink) 62%)}
.mkp.hl[data-c="purple"]{background:linear-gradient(transparent 62%, var(--hl-purple) 62%)}
.mkp.hl[data-c="maroon"]{background:linear-gradient(transparent 62%, var(--hl-maroon) 62%)}
.mkp.hl[data-c="brown"]{background:linear-gradient(transparent 62%, var(--hl-brown) 62%)}
.mkp.hl[data-c="charcoal"]{background:linear-gradient(transparent 62%, var(--hl-charcoal) 62%)}
.mknote{display:block}
.mknote{
  border-left:3px solid var(--brass);background:rgba(156,107,24,.08);
  border-radius:0 10px 10px 0;padding:10px 12px;margin:8px 0 12px;font-size:calc(var(--fs) * .85);line-height:1.8
}
.mknote[data-c="green"]{border-left-color:var(--hb-green)}

window.__booted = false;
function bootReset(){
  try {
    if (window.caches) caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))).then(go);
    else go();
  } catch(e){ go(); }
  function go(){
    if (navigator.serviceWorker && navigator.serviceWorker.getRegistrations)
      navigator.serviceWorker.getRegistrations().then(rs => {
        Promise.all(rs.map(r => r.unregister())).then(() => location.reload(true));
      }).catch(() => location.reload(true));
    else location.reload(true);
  }
}

<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"直等到天發亮，晨星在你們心裡出現","sub":"賜下、加上、照亮","lv":"A","arc":"星","sec":[["1:1--2","與我們同得一樣寶貴信心的人：老漁夫的最後一封信"],["1:3--4","神的神能已將一切關乎生命和虔敬的事賜給我們：與神的性情有分"],["1:5--11","有了信心，又要加上德行：從信心一直加到愛眾人"],["1:12--15","我卻要將這些事常常提醒你們：帳棚快拆了"],["1:16--18","乃是親眼見過他的威榮：聖山上的聲音"],["1:19--21","如同燈照在暗處：直等到晨星出現"]],"serm":{"pts":[["一切都已經給了","1:3--4","「神的神能已將一切關乎生命和虔敬的事賜給我們」——長進不是爬上去見神，是神先下來，把自己的生命分給我們"],["所以要加上","1:5--11","「有了信心，又要加上德行」——恩典不叫人閒懶，反倒叫人分外殷勤；台階一層一層，最後落在愛眾人的心"],["燈與晨星","1:12--21","「如同燈照在暗處」——我們所信的不是捏造的虛言；天亮以前，神的話是腳前的燈，留意它，直等到晨星在心裡出現"]]},"q":"有沒有一陣子，你覺得自己的信仰總是「還差一點」？書架上一排買了沒讀完的屬靈書，手機裡存著好幾個「三天突破」的講座連結，群組裡有人說他在聚會中看見異象；你看完，關掉螢幕，心裡空空的。\n你心裡有兩個聲音：一個說「我一定還缺甚麼，要再去找一個更高的經歷」；另一個說「算了，反正已經得救，長不長進都一樣」。\n這一章要問的是：如果神已經把一切都給了你，你還要長嗎？天還沒有亮的時候，你手裡握著的那一點光，夠不夠你走到天亮？","truth":"神的神能已將一切關乎生命和虔敬的事賜給我們，叫我們脫離敗壞、與神的性情有分；所以彼得說：「有了信心，又要加上德行」（1:5），一層一層，一直加到愛眾人的心。\n我們所信的不是捏造的虛言，是親眼見過的威榮，是聖靈感動說出的神的話；天亮以前，它是照在暗處的燈，留意它，直等到晨星在心裡出現。","mv":{"t":"我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。","r":"彼後1:19"},"card":["這一章是全卷「星・井・天」的第一步：星。一位知道帳棚快拆的老使徒，最後一封信的第一句，用的是主在海邊叫他的那個本名：西門（1:1）。他先說神已將一切賜給我們（1:3），再說要在信心上加上德行（1:5），最後把一盞燈交到我們手裡（1:19）。全章拎起來就是三個詞——賜下、加上、照亮：神先賜下，我們才加上；天亮以前，他的話照亮腳前的路。","這一章從頭到尾，先動手的都是神。是神的義叫我們同得一樣寶貴的信心（1:1）；神的神能已將一切賜給我們，召我們的是那用自己榮耀和美德召人的主（1:3）；他把又寶貴又極大的應許賜給我們（1:4）；他要把永遠之國的門豐豐富富地開給我們（1:11）；主親自指示彼得帳棚將拆（1:14）；父從極大榮光中為愛子作見證（1:17）；聖靈感動人說出神的話（1:21）。人做的每一件事，都是回應。","1:3「已將……賜給」δεδωρημένης（dedōrēmenēs）是完成式：給了，而且到今天還在你手裡。1:5「加上」ἐπιχορηγήσατε（epichorēgēsate）原是富人出錢供應整台合唱的字，意思是慷慨地供應；這個字到 1:11 又出現一次，主詞換成神。這改變今天的讀法：你在這裡慷慨地加，神在那裡把國門豐豐富富地開給你；長進不是向神討一樣還沒有的東西，是在他已經給的裡面，慷慨地活出來。","這一章照出一個總覺得「還差一點」的我：再去一次特會、再找一個異象、再讀一本書，好像神給的還不夠。它也照出一個把恩典當作躺椅的我：反正已經得救，德行、節制、忍耐都可以慢慢來。還有一個眼睛只盯著近處的我（1:9）：帳單、考績、群組裡的回覆塞滿了視線，忘了自己舊日的罪已經被洗淨，也看不見那永遠的國。","「我們並有先知更確的預言，如同燈照在暗處」（1:19）。全章最該被記住的，是這一盞燈。它不是太陽，只照亮腳前一步；它照的「暗處」，原文是又乾又髒的地方，正是第 2 章假師傅、第 3 章譏誚者所在的世界。彼得在山上見過大光，卻沒有叫我們去找山，是把燈交到我們手裡：留意它，天亮以前這就夠了。等到晨星出現，燈才放下，因為光本人來了。","這一週挑一個早上，把 1:5--7 的八項抄在一張紙上：信心、德行、知識、節制、忍耐、虔敬、愛弟兄的心、愛眾人的心。圈出你最缺的一項，寫下一個具體的人和場合——也許是那位常在群組裡跟你唱反調的同事。然後每天早上讀 1:3 一次，先感謝神已經給了，再求他在你信心裡供應這一項；週末寫下你在那個人面前做了甚麼。","最終整合：凌晨四點，一艘漁船停在外海，引擎關了。\n阿海四十二歲，跑船的，信主八年。這一年，他父親過世，船東欠了三個月薪水；他在手機上看了很多「你缺的是一個新突破」的影片，越看越空。\n今晚輪到他值班。沒有訊號，甲板上一片黑。他戴上頭燈，從口袋裡摸出出海前小組長塞給他的一張便條。\n上面抄著一節：「我們並有先知更確的預言，如同燈照在暗處」（1:19）。\n他低頭看自己的頭燈。只照得到腳前一小塊甲板、一捆纜繩、一個水桶。照不到海，也照不到明天。\n可是他走了大半夜，沒有絆倒過一次。\n他想起小組長說過：彼得也是打魚的，也在海上熬過一整夜一無所得；天快亮的時候，主已經站在岸上等他。\n他往下讀：「你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的」（1:19）。\n東邊的海面上，升起一顆很亮的星。老船長在駕駛艙裡說：那一顆出來，天就快亮了。\n阿海沒有再去找甚麼新的光。他把便條折好，放回胸前的口袋。\n他知道，手裡這盞燈不是太陽；可是天亮以前，夠了。\n他也知道，那顆星不是又一個要去追的經歷，是那一位要來的主。\n有一天天會全亮，燈可以放下；他會親眼看見那一位，就是在岸上等過彼得、也等著他的主。"],"self":"這一章照出來的「有己」，是一個不肯從「已經給了」開始的人：總覺得神給的不夠，要自己再去找一個更高的經歷、一個新的啟示，好讓我比別人多一點；或者反過來，把恩典當作不必長進的理由，躺在「反正得救了」上面。\n有己也是一雙只看近處的眼睛（1:9）：只看見自己的帳單、名聲、群組裡的輸贏，忘了自己是被洗淨的人；而忘了恩典的人，再努力也長不出愛眾人的心。","t321":{"k":"耶穌是我的榜樣：彼得在聖山上看見的，是一位被父喜悅的兒子：「這是我的愛子，我所喜悅的」（1:17）。我們效法的不是一套規條，是一位被親眼看見的人。而且 1:3 說他「用自己榮耀和美德召我們」，「美德」與 1:5「德行」是同一個字 ἀρετή——他身上有的，他召我們在信心裡加上。榜樣不是站在山頂叫我們爬，是先從山上下來，走到十字架，又把自己的生命分給我們（1:4）。彼得當年想在山上搭三座棚，主卻帶他下山；榜樣的路，是從山上走回人群裡。","g":"讓耶穌作王：這一章要人讓出的位置，是「光從哪裡來」的那張椅子。有己的人想自己當光源：自己的經歷、自己的閃光、自己的私意解說（1:20）。1:19 說燈是先知的話，晨星是要來的主，我只是那個「留意」的人。1:11 也說那國是「我們主－救主耶穌基督永遠的國」，門是他豐豐富富打開的，不是我擠進去的。可以自己檢查：這一週，你最常拿甚麼來判斷對錯——自己的感覺、網路上的聲音，還是那盞燈？那個位置，現在是誰坐著？","p":"建立屬神的體系：八個台階的最後兩級都是愛人：「有了愛弟兄的心，又要加上愛眾人的心」（1:7）。屬神的體系不是先蓋組織，是從神已賜下的生命長出來：先生命（1:3--4），再關係（1:7），後事工（1:8 不至於閒懶不結果子）。第一，小組每月留一次聚會，不談新主題，只輪流說主赦免了我甚麼，這是 1:12 的常常提醒。第二，每個人有一位屬靈同伴（321 的 235 第二層），彼此問：這個月你在哪一項上長？第三，國度321空中團契散在各國，讓每個人手裡都有同一盞燈，身邊都有一群一起讀的人。"},"grp":["【一、破冰】你有沒有在天亮以前醒著的經驗——值夜班、守病床、趕早班車，或在海邊等日出？那時候你手裡握著甚麼光？天亮的那一刻，你記得自己在想甚麼嗎？","【二、扎心】經文說：「人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨」（1:9）。這一個月，塞滿你視線的「近處」是甚麼？你上一次為自己被赦免而感恩，是甚麼時候、在哪裡？","【三、福音】讀 1:3--4：神的神能「已將一切」賜給我們，又叫我們「與神的性情有分」。你比較常覺得自己「還缺一點」，還是「反正夠了不必長」？如果神已經先給了，你的長進會從「求他給」，變成甚麼？","【四、行動】從 1:5--7 的八項裡，說出你最缺的一項；再說出這一週你要在誰面前、哪一天、用甚麼具體的行動活出它。最後兩級是愛人，你可以想一位教會外的人。","【五、代禱】為三種人指名禱告：一位正在暗處、找不到方向的人，求主的話成為他腳前的燈；一位被各樣「新突破」「新啟示」弄得疲倦的人，求主帶他回到手中的聖經；一位信主多年卻漸漸冷淡的人，求主讓他重新想起自己被洗淨的那一天。"],"prac":{"main":"這一週，我從神已經賜下的一切開始，在信心上加上一項；天亮以前，我每天留意那盞照在暗處的燈。","items":["對神：每天早上讀 1:3--4 一次，先對神說：「你已經把一切關乎生命和虔敬的事賜給我了。」再讀 1:19，求他今天照亮你腳前的一步；晚上睡前用一句話告訴主，今天那盞燈照在你哪一件事上。","對自己：做一次 1:9 的眼科檢查。這七天每晚寫下今天最占據你視線的一件事，週末讀一遍；再寫下一件主赦免你的事，想起那是哪一年、在哪裡。問自己：我忘了甚麼，所以只看見近處？","對人：挑出八項裡你最缺的一項，選一位不好愛的人——同事、鄰居或親戚，這一週在星期五以前為他做一件具體的事，操練「愛眾人的心」（1:7）；做完不必宣告，為他禱告一句就好。","對生活：這一週把每天滑「屬靈短影片」的時間減半，換成讀本章的一段；遇到「新啟示」「新突破」的說法，先問三個問題：它和手中的聖經一致嗎？照上下文嗎？叫我更愛主、更愛人嗎？","對使命：像彼得「常常提醒」一樣（1:12），找出你的那一個「2」，把這週讀到的一節經文抄給他，附上一句你自己的話；也為一位還不認識主、正在暗處的朋友每天指名禱告，求晨星有一天在他心裡出現。"]},"safe":["① 用 1:4 對渴慕屬靈經歷的人說：「你可以一路修煉，修到自己也是一位神」；或說「你就是小神」，把「與神的性情有分」講成人與神的本質混同。","有分是進入與神的相交，不是人變成神，也不是與神同等；創造者與受造者的分別永遠存在。主詞是「他已將……應許賜給我們」（1:4），有分的內容就寫在 1:5--7（全卷立場見 ISS00_2；議題見 ISS01_2）。","檢驗標準：會眾聽完，是更敬拜那位把生命分給人的神，還是更想成為一個比別人高一級的屬靈人？","② 因為怕被說成神祕主義，對會眾說：「1:4 太深了，我們跳過，直接講 1:5--7 要加上甚麼。」","跳過 1:4，八個台階就失去了根，成了靠意志往上爬的道德課；彼得的次序是先有「又寶貴又極大的應許」，然後才是「正因這緣故」（1:5）。1:4 是全卷最大的安慰：神要把自己的生命與品格分給我們（議題見 ISS01_2）。","檢驗標準：1:4 在講章裡有沒有被正面講出來？會眾聽完，是更敬拜神，還是只多了一張待辦清單？","③ 先講 321 改變觀念八大步驟，再對會眾說：「彼得也有八大步驟，1:5--7 就是這八步。」把八個台階講成 321 的插圖。","兩者是兩回事：彼得的八項是在信心裡長出來的品格果子，321 的八步是觀念改變的過程；至多說一句「這使我們想起」，並且明說不是同一件事（鐵律五）。先讓經文講完，321 才在末端被認出（議題見 ISS01_3）。","檢驗標準：講完 1:5--7，會眾記得的是從信心長到愛眾人的那一串品格，還是一張八個步驟的流程表？","④ 用 1:20「沒有可隨私意解說的」對會眾說：「你沒讀過神學，自己讀會讀偏，聽講台就好」；或暗示只有按立的人才有資格解經。","1:21 的「因為」把 1:20 解釋清楚：講的是預言的來源，不是禁止會眾讀經。讀經的保護不是把聖經鎖起來，是在群體中讀、照上下文讀、謙卑地讀，像庇哩亞人天天考查聖經（全卷立場見 ISS00_3；議題見 ISS01_8）。","檢驗標準：一位很想讀經、又怕讀錯的姊妹聽完，是更敢打開聖經、帶著問題來小組，還是更不敢讀？","⑤ 把本章講成彼得的勵志故事：「彼得從三次不認主，變成臨終從容、見過異象的屬靈偉人，你也要像他一樣。」","每一處〔背景〕都要落在主身上：是主在海邊重新叫他「西門」，是主預告他的死又陪他走了三十多年（1:14），是主等候他回頭。不是彼得多偉大，是主多恆久忍耐（鐵律七；作者的全卷立場見 ISS00_1）。","檢驗標準：會眾聽完，是更佩服彼得，還是更愛那位在他跌倒之後還叫他名字的主？","⑥ 跳過書信的處境，把每一節直接變成今天的勵志格言：「1:5--7 就是成功人士的八個好習慣」；或反過來說「這是寫給一世紀教會的遺言，跟今天無關」。","書信三問要走完：處境是一位將要殉道的使徒，看見假師傅將從教會裡面起來；原則是神已賜下一切，所以要加上、要留意那盞燈；今天落在資訊混亂、屬靈速成的時代，回到神的話上長進（全卷立場見 ISS00_1）。","檢驗標準：三問有沒有都答到？今天的應用是從第二問推出來的，還是另外加上去的？","⑦ 把 1:5--7 講成得救的門票：「八項都做到，神才會接納你；哪一項沒過關，就別說自己得救了。」","1:5 開頭是「正因這緣故」，回指 1:3--4 神已經賜下的一切；台階是從恩典長出來的，不是拿來買恩典的。把次序倒過來，會叫敏感的人活在考核裡，也叫驕傲的人拿清單量別人。","檢驗標準：講章裡神已賜下的一切（1:3--4），有沒有講在「你們要分外地殷勤」之前？","⑧ 把八項講成八道關卡：「節制還沒過關，就不配談忍耐」；或在小組裡互相評分：「你大概卡在第三級。」","八項之間的介系詞是「在……裡面」：德行在信心裡長出來，愛也不是離開節制與忍耐的一種情緒；起點信心、終點愛是確定的，中間是彼此扶持的品格，不是先後的門（議題見 ISS01_3）。","檢驗標準：一位在某一項上屢屢跌倒的人聽完，是知道自己可以同時學著愛人，還是覺得後面的都免談了？","⑨ 用 1:9「就是眼瞎，只看見近處的」指著別人說：「你屬靈近視，看不清楚。」把這一節當成給別人的診斷書。","這節是給自己的眼科檢查：病根是「忘了」恩典，藥方是 1:12 的「常常提醒」；彼得把收信人當作在真道上堅固的人來提醒，不是替誰宣判（議題見 ISS01_4）。","檢驗標準：講員自己有沒有先站在這節經文底下？會眾聽完，是更想起自己被洗淨，還是更會看別人的毛病？","⑩ 用 1:10「使你們所蒙的恩召和揀選堅定不移」嚇會眾：「你不夠殷勤，神隨時會把你從名單上劃掉。」","源頭在神，確據在生命：呼召起於「那用自己榮耀和美德召我們的主」（1:3）；「永不失腳」用的是最強的否定，是應許，不是威脅；1:11 進國的門是主親手打開的（全卷立場見 ISS00_5；議題見 ISS01_5）。","檢驗標準：一位信心軟弱、常懷疑自己是否得救的弟兄聽完，是更有把握地殷勤，還是更焦慮地懷疑？","⑪ 用 1:3「一切關乎生命和虔敬的事」對人說：「神已經把一切都給你了，房子、車子、升遷，只要宣告就會出現。」","範圍是「生命和虔敬」，管道是「認識那……召我們的主」（1:3）；這不是一張物質的支票。下文說得清楚：神所賜的一切，長出來的是德行、節制、忍耐、愛眾人，不是更多擁有。","檢驗標準：講章裡的「一切」，是把人帶向更認識主，還是帶向更多擁有？","⑫ 用 1:19「更確的預言」對在禱告中真實遇見主的人說：「經歷都不可靠，你那次的感動不必理會。」","彼得自己的見證就是一次經歷（1:16--18）；這節的重點是經歷證實了預言，預言解釋了經歷，不是拿兩者比高低（議題見 ISS01_7）。","檢驗標準：曾經在敬拜中被主深深摸著的弟兄姊妹聽完，是覺得被尊重、也知道把經歷放在燈下照，還是覺得被嘲笑？","⑬ 反過來用 1:16--18 抬高自己：「我也上過山、看過異象，主親口告訴我，所以你們要聽我的。」","彼得的經歷把人指向「先知更確的預言」，不是指向他自己；經歷要被聖經檢驗，不是聖經要被經歷補充（全卷立場見 ISS00_3）。","檢驗標準：講章裡最後被高舉的，是那盞燈和那位要來的主，還是講員的經歷？","⑭ 把 1:19「晨星在你們心裡出現」講成追求新啟示：「聖經只是燈，我們要等一道更高的光、一個只有少數人知道的新真理。」","1:12 說的是「已有的真道」；晨星主要指主再來的那個早晨，今天留意燈光的人是在預嘗那光，不是另找一盞燈。暗示某些人擁有別人沒有的真理，正是第 2 章假師傅的記號（議題見 ISS01_7）。","檢驗標準：講章有沒有把人帶回手中的聖經？有沒有暗示某些人擁有別人沒有的「新真理」？","⑮ 拿 1:1 的 Granville Sharp 規則或 1:19 的比較級在講台上炫學，講了二十分鐘文法，卻沒有轉成生命。","原文的用處是叫人看見耶穌是「我們的神和救主」、看見那盞燈；三十秒內轉不成生命的，留在書房（鐵律一；議題見 ISS01_1）。","檢驗標準：每一處原文之後，會眾有沒有聽見一句可以帶回家的話？"]},{"n":2,"t":"這些人是無水的井，是狂風催逼的霧氣","sub":"乾井、搭救、回頭","lv":"A","arc":"井","sec":[["2:1--3","將來在你們中間也必有假師傅：乾井從裡面冒出來"],["2:4--9","主知道搭救敬虔的人：三個審判裡的兩次搭救"],["2:10--16","他們膽大任性：巴蘭的路與一頭開口的驢"],["2:17--19","這些人是無水的井：應許人自由，自己卻作奴僕"],["2:20--22","他們末後的景況就比先前更不好了：兩種回頭"]],"serm":{"pts":[["乾井從裡面冒出來","2:1--3","「將來在你們中間也必有假師傅」——危險不只在外面；他們否認的是一位付了價的主，分辨要先從照自己開始"],["主知道搭救","2:4--10","「主知道搭救敬虔的人脫離試探」——三個審判裡藏著兩次搭救；審判再重，搭救更確定，講審判是為了叫敬虔的人安心"],["假自由與真回頭","2:10--22","「人被誰制伏就是誰的奴僕」——自己作主的人，最後被別的東西作主；狗回到所吐的，被主等回來的人回到主面前"]]},"q":"深夜，你在手機上滑到一支影片：一位講員在台上說，只要這個月把「信心種子」奉獻出去，三個月內必有百倍的回報；留言區一片「阿們」。你想起一位朋友，正是為了這樣的應許借了錢。\n你心裡有兩個聲音：一個說「把他轉貼出去，讓大家都知道誰是假的」；另一個說「算了，不要論斷，誰都不要懷疑」。還有一個更小的聲音：那我呢？我是不是也被騙過？\n這一章要問的是：乾井從教會裡面冒出來的時候，我怎樣分辨而不獵巫？審判那麼重，一個住錯了地方、跌倒了的人，還有沒有一隻拉著他的手？","truth":"假師傅會從教會裡面起來，連買他們的主也不承認；神的審判一個也不漏——犯罪的天使、上古的世代、所多瑪。可是每一場審判裡都有一隻伸出來的手：「主知道搭救敬虔的人脫離試探」（2:9）。\n所以分辨的人不必害怕，也不必替神清理門戶；先用記號照自己，守住被買來的身分，跟著那位付了價、也懂得搭救的主走。","mv":{"t":"主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子。","r":"彼後2:9"},"card":["這一章是全卷「星・井・天」的第 2 步：第 1 章，晨星在心裡出現（1:19）；這一章，彼得把眼睛轉向一口一口乾了的井（2:17）。假師傅從裡面起來（2:1），三個審判一個比一個重（2:4--8），巴蘭的路一直走到驢開口（2:15--16），最後是狗回到所吐的（2:22）。全章拎起來就是一句話：井會乾，霧會散，可是谷底有一節把人撐住——主知道搭救敬虔的人（2:9）。","這一章最長的一句（2:4--10），主詞一直是神。天使犯了罪，「神也沒有寬容」（2:4）；神「保護了傳義道的挪亞一家八口」（2:5）；神判定所多瑪，卻「只搭救了」義人羅得（2:7）。三個「若」都掛在同一個主句上：「主知道搭救敬虔的人」（2:9）。假師傅最大的錯，也是對著這位主：他們否認的，是那位「買他們的主」（2:1）。審判是他的，搭救也是他的；這一章沒有把任何一支法槌交到我們手上。","2:9「主知道搭救」，原文 οἶδεν κύριος ῥύεσθαι（oiden kyrios rhyesthai）：「知道」後面接不定詞，意思是「懂得怎樣」——主不只是知道你在試探裡，他懂得怎樣把你拉出來。2:4--8 三個審判都放在「若」的條件子句裡，搭救才是主句。這改變今天的讀法：讀第 2 章，不是讀一份黑名單，是讀一封保證書；審判寫得越重，越顯出那雙搭救的手有多確定。","這一章照出兩個我。一個是愛揭露的我：每天轉貼「誰是假的」的影片，越看越覺得自己站在對的一邊，心卻越來越冷——2:10 的「膽大任性」，也可以穿上護教的外衣。另一個是不敢看的我：五個記號裡，對錢的那一個、對身體的那一個，其實也照得到我，只是我不願意停下來。這一章也照出一個常說「我可以控制」的人——正是 2:19 說的，被甚麼制伏，就作了它的奴僕。","「你回頭以後，要堅固你的弟兄」（路 22:32）。2:22 說狗「轉過來」吃所吐的，原文 ἐπιστρέψας（epistrepsas），和主在那一夜對彼得說的「回頭」是同一個字。全章最該記住的，就是兩種回頭：一種是回到所吐的，一種是回到主面前。寫這一章的人，自己不承認過主；主沒有放手，還把堅固弟兄的託付交給他。所以彼得寫審判，聲音裡沒有幸災樂禍，只有一個被等回來的人的急切。","這一週做一件事：把 2:1--19 的五個記號——對基督、對錢、對身體、對權柄、對自由——每天拿一個先照自己，寫下一句向主承認的話；星期五以前，約一位剛信主、或剛從舊生活出來的人（2:18「剛才脫離妄行的人」）吃一頓飯，陪他讀 2:9。這不是去調查誰是假的，是站到那個「心不堅固」的人身邊（2:14）。如果你手上有一件真實的錯謬或侵害，寫下事實，照程序找長執談，不要先上網發文。","最終整合：一棟組屋的樓梯間，晚上十點。\n美玲坐在第七層的台階上，手機螢幕亮著。五年來，她每個月把薪水的三分之一放進「信心種子」裡；最後一次，是向表姊借的八千塊。\n應許的百倍沒有來。昨天那個聚會的人對她說：沒有得著，是你的信心不夠。\n她不敢回家，也不敢跟小組說。她最怕聽見的一句話是：你怎麼會被騙那麼久？\n團契群組裡傳來今天的經文，第 2 章。她讀到羅得，讀到他遲延不走，讀到天使拉著他的手，把他領到城外。\n原來那個住錯地方很久的人，也被稱為義人，因為「他的義心就天天傷痛」（2:8）。\n她想起這五年，每一次奉獻完，心裡那一下說不出的痛。原來那不是信心不夠，是心還沒有麻木。\n再往下一節：「主知道搭救敬虔的人脫離試探」（2:9）。\n她看了很久。主詞不是她，不是那位講員，也不是要替她討回公道的網友。是主。\n她沒有把那個人的名字貼上網路。她打開小組長的對話框，打了一行字：我想跟你談一件事，有點丟臉。\n十分鐘後，對方回了：我現在就下樓找你。\n那一晚，兩個人在樓梯間一起禱告；第二天，她們把事實和日期寫下來，一起去找牧者。\n她不知道錢還回不回得來。她知道的是：那隻拉著羅得的手，也伸到第七層的樓梯間來了。"],"self":"這一章照出來的「有己」，是 2:10 的「膽大任性」：以自己為樂，凡事自己作主。它可以很張狂——輕慢權柄、說虛妄矜誇的大話；也可以很屬靈——拿著五個記號去量別人，替神宣判誰是乾井，好像審判台是自己的。\n有己最後的結局寫在 2:19：自己作主的人，終究被別的東西作主——被錢、被情慾、被要贏的心制伏。這一章的出路，是回到本位：審判是主的事，搭救也是主的事，我只管讓那位買我的主作王。","t321":{"k":"耶穌是我的榜樣：寫「連買他們的主他們也不承認」（2:1）的彼得，自己在大祭司的院子裡不承認過主；主轉過身來看他，他就出去痛哭（路 22:61--62）。耶穌面對要跌倒的門徒，沒有轉身離開，而是先為他祈求，又把「堅固你的弟兄」交給他（路 22:32）。面對假先知，耶穌也從不含糊：「憑著他們的果子，就可以認出他們來」（太 7:16）——他給的是果子，不是名單。所以他的榜樣有兩筆：對錯謬清楚，對跌倒的人等候。而且這位榜樣先是那位買我們的主：我能這樣分辨、這樣等人，是因為他先把我等了回來。","g":"讓耶穌作王：假師傅否認的，是那位「買他們的主」（2:1）——原文是奴隸市場上付了價、有產權的主人。讓耶穌作王的反面，不一定是無神論，常常是 2:10 的「任性」：口裡稱主，生活裡自己作主。這一章要人讓出兩個位置。第一個是審判官的位子：連力量權能更大的天使，都「不用毀謗的話在主面前告他們」（2:11），我也不必替神清理門戶。第二個是「我可以控制」的那一件事：螢幕、消費、情緒、一段關係。2:19 說，人被誰制伏就是誰的奴僕。可以自己檢查：這一週，真正在你生活裡發號施令的是誰？","p":"建立屬神的體系：第 2 章被定罪的，正是「師傅」——有講台、有跟從者的人（2:1）。所以屬神的體系不是沒有領袖，是領袖帶著相反的記號。第一，對主：承認那位付了價的主，領袖自己也站在被買來的人中間。第二，對群羊：「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）；會友照程序提出的質疑，不拿 2:10 堵口。第三，對錢：「不但在主面前，就在人面前也是這樣」（林後 8:21），帳目公開、經手不止一人。國度321空中團契散在各國，線上的群體更需要這三樣：看得見的帳、聽得見的問題、伸得出的手——陪那些「心不堅固的人」站穩（2:14）。"},"grp":["【一、破冰】你有沒有被一句很動聽的話吸引過，後來才發現不是那麼回事？可以是一則廣告、一個投資機會、一句推銷詞。只說場景，不必說名字。","【二、扎心】經文說：「人被誰制伏就是誰的奴僕」（2:19）。2:1--19 有五個記號：對基督、對錢、對身體、對權柄、對自由。先不看別人——哪一個最照得到你自己？有沒有一件你常說「我可以控制」、其實已經在控制你的事？","【三、福音】讀 2:7--9。創世記說羅得遲延不走，天使卻拉著他的手把他領出城外。你生命中有沒有一次，是主把你從一個你自己不想離開的地方拉出來？如果「主知道搭救」的主詞是主，不是你，這會怎樣改變你看自己的軟弱？","【四、行動】說出這一週你要站到誰的身邊：一位剛信主、或剛從舊生活出來的人（2:18）。也說出一件你要交給主的「我可以控制」，以及你要把這條界線告訴哪一位屬靈同伴。","【五、代禱】為三種人指名禱告：一位被不實的應許傷害、正在羞愧裡的人，求主拉著他的手；一位剛跌倒、很想回頭的人，求主讓他聽見「乃願人人都悔改」（3:9）；也為你教會與團契的領袖禱告，求主保守他們作有水的井。"],"prac":{"main":"這一週，我用五個記號先照自己，不替神宣判任何人；我站到一位心不堅固的人身邊，陪他聽見：主知道搭救。","items":["對神：每天早上慢慢讀 2:4--9，先不急著做筆記，數一數三個審判裡藏著的兩次搭救；然後對主說一句：「主，你知道怎樣搭救我；今天我不替你審判任何人。」","對自己：五個記號——對基督、對錢、對身體、對權柄、對自由——星期一到星期五，每天照一個，晚上睡前寫下一句向主承認的話。週末讀一遍，問自己：哪一個記號，正在悄悄地制伏我？","對人：這一週約一位剛信主、或剛從舊生活出來的人（2:18）吃一頓飯，先聽他說最近的掙扎，再陪他讀 2:9；如果他說自己跌倒了，先不要講 2:22，先告訴他 1:9「舊日的罪已經得了潔淨」。","對生活：找出一件你說「我可以控制」的事（螢幕、消費、飲食、網上投資），這一週為它定一條具體的界線，例如晚上十一點以後手機放在客廳；把這條界線告訴一位屬靈同伴，請他週末問你。","對使命：若你經手教會或團契的錢、或在帶領的位置上，這一週主動向同工說明一筆帳或一個決定；若沒有，就每天為你的牧者與領袖禱告一句，求主保守他們不作乾井，也保守你自己不作乾井。"]},"safe":["① 用 2:1 在講台上點名：今天某位牧師、某個教會、某個宗派或某位網路傳道人，就是彼得說的那種人。","彼得給的是五個記號（對基督、錢、身體、權柄、自由），不是一張名單；講台教會眾分辨果子，不替會眾判決，分辨也先從照自己開始（紅線一；議題見 ISS02_1；全卷立場見 ISS00_3）。","檢驗標準：不同教會背景的人聽完，是更會照自己、更會分辨果子，還是更想轉貼「某某是假師傅」？","② 用 2:10「輕慢主治」「毀謗在尊位的」堵住會友對領袖的正當質疑：「你批評牧師，就是輕慢主治的人。」","「主治的」最自然指主的權柄，「在尊位的」最自然指天上的榮耀者；而第 2 章被定罪的正是「師傅」——在上位的人。彼得給長老的命令是「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）（紅線二；議題見 ISS02_6）。","檢驗標準：一位照程序提出問題的弟兄姊妹聽完，是知道教會有安全的管道，還是更覺得開口就是悖逆？","③ 用 2:20--22「狗所吐的，牠轉過來又吃」恐嚇跌倒、掙扎的信徒，或對某一個人宣判：「你就是那條狗，回不了頭了。」","上下文是應許人自由、自己卻作奴僕的假師傅，和完全跟從他們轉背的人（2:17--19）；跌倒而想回頭的人，要同時聽見 1:9「舊日的罪已經得了潔淨」與 3:9「乃願人人都悔改」（紅線五；議題見 ISS02_9；全卷立場見 ISS00_5）。","檢驗標準：一位剛跌倒、很想回頭的弟兄聽完，是更想回到主面前，還是更絕望？","④ 講完第 2 章，只剩懷疑與警告，沒有講到 2:9「主知道搭救敬虔的人」。","2:4--10 是一個長句，三個審判都在條件子句裡，主句是搭救；篇名落在 2:17 的乾井，全章的樞紐卻是 2:9。彼得講審判，是為了叫敬虔的人安心，不是叫他們害怕（鐵律六）。","檢驗標準：會眾走出去時，記得的是「誰可能是假的」，還是「主知道怎樣搭救我」？","⑤ 把羅得美化成敬虔的榜樣，好像住在所多瑪也沒關係；或反過來嘲笑他：「這種人也算義人？」","創 19 的羅得選了所多瑪、遲延不走、後來醉倒；彼得稱他為義，定義在 2:8「他的義心就天天傷痛」，蒙救的主詞是神——「耶和華憐恤羅得」（創 19:16），天使拉著他的手（議題見 ISS02_5）。","檢驗標準：有沒有講到「義不是完美，是一顆還會傷痛的心」，也講到住錯地方的代價與搭救的恩典？","⑥ 把以諾一書當成正典，用它補充墮落天使的細節，或說「彼得既然借用了這個背景，以諾一書就是神的話」。","彼得與猶大借用讀者熟悉的背景，就像保羅在雅典引用希臘詩人（徒 17:28）；借用一句真話，不等於整本書列入正典，以諾一書也從未被教會普遍承認為正典（議題見 ISS02_4；全卷立場見 ISS00_1）。","檢驗標準：講台上關於墮落天使的內容，有沒有超出聖經本文？","⑦ 把 2:4「丟在地獄，交在黑暗坑中」講成一幅陰間地圖：地獄分幾層、天使關在哪一層、巨人族的靈魂去了哪裡。","「丟在地獄」原文 ταρταρώσας，新約只出現這一次；彼得借讀者熟悉的字講一個真實的拘禁，不提供空間結構，他要說的只有一句：神沒有寬容。異文「鎖鍊」與「坑」，也都只是拘禁與幽暗（議題見 ISS02_4）。","檢驗標準：會眾帶走的是對神公義的敬畏，還是對陰間構造的好奇？","⑧ 講第 2 章時把講員放在審判台上：好像台上台下都是「真的」，問題全在外面的人。","寫「不承認」的彼得，自己不承認過主；危險是「在你們中間」（2:1）。五個記號是給每個信徒先照自己的鏡子，講員也在其中；講第 2 章最難的功課，是講假師傅而自己不變成法利賽人。","檢驗標準：講員有沒有在講台上先承認：這五個記號，也照得到我？","⑨ 用 2:1「連買他們的主」在講台上裁決有限救贖或普遍救贖，並宣布另一派不合聖經。","這一節兩派都讀得通，不宜單憑它定案；彼得在這裡要量的不是救贖的範圍，是罪的深度：他們否認的是一位已經付了價的主人（議題見 ISS02_2）。","檢驗標準：不同神學傳統的弟兄姊妹聽完，是被定罪，還是一起被提醒「我是被重價買來的」？","⑩ 把 2:3「貪心……取利」講成「傳道人領薪水就是貪心」；或反過來完全迴避錢的話題，甚至用應許與恐懼換奉獻。","「叫傳福音的靠著福音養生」是主所命定的（林前 9:14）；2:3 的記號是用「捏造的言語」在人身上取利——把人當貨。對 2:3 最好的回應，是教會自己的財務透明，而不是揣測、點名別人的心（議題見 ISS02_3）。","檢驗標準：有沒有講到自己教會的帳怎樣公開，而不是只批評別的教會？","⑪ 把 2:11 講成「基督徒不可以抵擋魔鬼」；或反過來鼓勵與邪靈對話、嘲弄，在講台上長篇喊話。","2:11 教的是謙卑：連力量權能更大的天使，都把審判交給主；「務要抵擋魔鬼」（雅 4:7）仍然有效，但焦點在主，不在魔鬼（議題見 ISS02_7）。","檢驗標準：會眾的眼睛最後停在魔鬼身上，還是主身上？","⑫ 把巴蘭的驢講成笑話就結束，或寓意化成「驢代表某某人」；或為了顯得開明，說「驢說話只是古代的寓言」。","彼得照民數記接受這件神蹟——「耶和華叫驢開口」（民 22:28）；重點是諷刺：自以為屬靈的先知被錢沖昏了頭，還不如一頭驢清醒（議題見 ISS02_8）。","檢驗標準：會眾笑完之後，有沒有問自己：我正往「不義的工價」那裡走嗎？","⑬ 用 2:19「人被誰制伏就是誰的奴僕」把自由講成一套新的規條，叫人靠多守幾條規矩來得自由。","假自由是放縱，但真自由不是律法主義；真自由是脫離世上從情慾來的敗壞（1:4），被一位好主人買回來——「天父的兒子若叫你們自由，你們就真自由了」（約 8:36）。","檢驗標準：會眾聽到的是「再多守幾條規矩」，還是「讓那位買我的主作王，才是自由」？","⑭ 先講 321「謙卑戰勝驕傲」，再拿第 2 章的假師傅當反面插圖；或把全章講成彼得的勵志故事：「彼得從不認主變成揭露錯謬的人，你也要像他一樣努力。」","先讓經文講完：2:9 的主詞是主，不是彼得，也不是 321；無己在這一章的意思，是把審判與搭救都交還給主（鐵律五、鐵律七）。焦點放在彼得身上，會眾得到的是一位偶像和一份壓力。","檢驗標準：會眾聽完，是更佩服彼得，還是更愛那位沒有放棄彼得、也沒有放棄他的主？","⑮ 把第 2 章當成脫離處境的「假師傅辨認手冊」，一條一條套在今天的人身上；或反過來說「這是寫給一世紀的，跟今天無關」。","書信三問要走完：處境是一群從教會裡面起來、否認審判、放縱又取利的教師；原則是主是付了價的主人，他必審判，也知道搭救；今天的落點是先照自己、守住被買來的身分、陪伴心不堅固的人（全卷立場見 ISS00_3）。","檢驗標準：三問有沒有依次答完，而且第三問落在會眾自己的生活，而不是別人的名字？"]},{"n":3,"t":"我們照他的應許，盼望新天新地，有義居在其中","sub":"記得、寬容、長進","lv":"A","arc":"天","sec":[["3:1--2","激發你們誠實的心：兩封信都是提醒"],["3:3--7","主要降臨的應許在哪裡呢：譏誚的人故意忘記的事"],["3:8--10","其實不是耽延，乃是寬容你們：主的日子要像賊來到"],["3:11--14","你們為人該當怎樣聖潔，怎樣敬虔：盼望新天新地，安然見主"],["3:15--18","就當防備：在恩典和知識上有長進，願榮耀歸給他"]],"serm":{"pts":[["應許在哪裡呢","3:1--7","「他們故意忘記」——譏誚不是資訊不夠，是選擇遺忘；神的話創造過、審判過，今天也還托住這個世界"],["不是耽延，乃是寬容","3:8--10","「其實不是耽延，乃是寬容你們」——主不用我們的鐘錶；他的慢是愛的等，賊來以前的每一天都是回家的日子"],["等候的人怎樣活","3:11--18","「你們為人該當怎樣聖潔，怎樣敬虔」——盼望新天新地的人先防備墜落，再在恩典裡長進，最後把榮耀歸給他"]]},"q":"你有沒有等過一件事，等到不太敢再提：為一位家人禱告了十幾年，他還是說「別跟我講這些」；病床旁的禱告唸到會背了，檢查報告還是一樣；群組裡又有人轉傳一張「主某年必來」的表，你連點開都懶了。\n你嘴上說「神有他的時間」，心裡卻有另一個聲音：是不是根本不會有結果？是不是神忘了，或者他其實離我很遠？\n這一章要問的是：主還沒有來、禱告還沒有答案的這段日子，你把它讀成神的耽延，還是神的寬容？等候的人，這些日子要怎樣活？","truth":"主看日子，不用我們的鐘錶：「其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改」（3:9）——主還沒有來，是因為他還在等人回家。\n所以等候的人不算日子，也不坐著發慌：先防備，免得被錯謬一同帶走，從堅固的地步上墜落；再在主的恩典和知識上不斷長進；最後把一切的榮耀歸給他（3:17–18）。","mv":{"t":"親愛的弟兄啊，你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。你們卻要在我們主－救主耶穌基督的恩典和知識上有長進。願榮耀歸給他，從今直到永遠。阿們！","r":"彼後3:17--18"},"card":["這一章是全卷「星・井・天」的第三步：天。第 1 章晨星照進心裡，第 2 章認出了乾了的井，到這一章，眼睛抬起來，看見前面的家。全章五步：兩封信都是提醒；譏誚的人故意忘記；不是耽延，乃是寬容；該當怎樣聖潔敬虔；防備、長進、歸榮耀。一句話：等候的人不推算，也不放棄，他們在恩典裡長大，把榮耀歸給主。","這一章的主詞，是神的話和主的忍耐。神的話在太古造了天地，在洪水時審判了當時的世界，現在仍「憑著那命存留」托住天地（3:5–7）；世界還穩定，不是神缺席，是神的話還在。主看日子不受我們的鐘錶管轄；他的慢，原文是把怒氣拉長——不願有一人沉淪。可是寬容不是取消：主的日子要像賊來到，一切都要在他面前顯露（3:10）。","3:13「有義居在其中」，「居」原文 κατοικεῖ（katoikei），是長久住下、安家的意思；彼得前書稱信徒是「寄居的」（彼前 2:11）。今天在這個世界上，義常常像寄居的人：在辦公室要看臉色，在網路上被嘲笑，在家裡被說太死板。新天新地裡，義不再寄居，它是主人。這改變今天的讀法：盼望新天新地不是逃離世界，是先讓義在我們的家裡、生意上、群組裡住下來。","這一章照出兩種等錯了的樣子。一種是把等候變成倒數：轉傳末日時間表，盯著新聞對號入座，心裡越來越慌，好像主的日子要靠我們排出來。另一種是把等候變成放棄：嘴上不否認主會再來，生活卻已經照著「萬物仍是一樣」在安排，錢、時間、關係都只為這一生打算。兩種看起來相反，底下是同一件事——用自己的鐘錶衡量神的信實。","「並且要以我主長久忍耐為得救的因由」（3:15）。全章最該被記住的，就是這一個「以為」：3:9 說有人「以為」主是耽延，3:15 叫我們「以為」是得救，原文是同一個字。同一段等候的時間，差別不在時間長短，在怎樣看。主多等一天，就多一個人可以回頭；那個人可能是你的家人，也可能曾經就是你自己。","這一週做兩件事。第一，拿一張紙，寫下一件你心裡早已判定「神耽延了」的事，在旁邊抄上 3:9，把「寬容你們」的「你們」換成那位家人或你自己的名字，每天早上讀一次。第二，檢查你手機裡轉傳末日時間表或推測新聞的群組，該退出的就退出；把省下來的時間，用來讀一段經文，讀不懂的記下來，週末帶到小組問。","最終整合：清晨五點半，異鄉一間小公寓的廚房。\n阿芳姊六十八歲，是線上小組裡年紀最大的組員。兒子二十年沒有進教會，先生三年前走了。\n去年有一陣子，她每天在另一個群組裡看「末日倒數」：哪裡打仗、哪裡地震，都被排進一張表。她看得睡不著，跟著轉傳，差一點就跟那群人一起走了。\n是小組長打電話來，陪她把 3:8 讀完：「主看一日如千年，千年如一日」——兩個方向都說，沒有人算得出來。\n她退出了那個群組。那是她第一次明白甚麼叫「就當防備」（3:17）：不是防備別人，是看守自己，免得被一同帶走。\n可是防備之後，她沒有停在原地。她開始每天早上讀一段經文，讀不懂的記下來，週四帶到線上小組問。一年下來，她第一次把羅馬書讀完。\n今天早上，她讀到最後一節：「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進」（3:18）。\n她在筆記本上寫：我還在長。\n然後她為兒子禱告，像過去二十年的每一天。她不再問「還要多久」；她讀過 3:9 了，主不是耽延，是寬容，主在等的人裡面也有她的兒子。\n最後她念出那一句，聲音不大：\n「願榮耀歸給他，從今直到永遠。阿們！」\n新天新地還沒有來。可是在這間小廚房裡，義已經先住下了。\n榮耀不歸給一位很會等的老姊妹，歸給那一位一直在等她、也還在等她兒子的主。"],"self":"這一章照出來的「有己」，第一種是要掌握時間的我：想知道還要多久，想替神排日程，排不出來就焦慮，等不到就埋怨，把主的寬容誤認成主的缺席。\n第二種是要靠自己站穩的我：以為讀得多、懂得多就不會被帶走，看見別人跌倒，心裡暗暗覺得自己比較堅固。這一章不是叫我們更會等、更會守，而是把時間交還給主，在他的恩典裡長大，連自己的堅固也一起歸給他榮耀。","t321":{"k":"耶穌是我的榜樣：3:9 的寬容，彼得是先被寬容的那一個。他三次不認主，主沒有把他從名單上劃掉；復活以後在海邊生了炭火，三次問他「你愛我嗎」。主的忍耐不是不在乎，是一直等到他回來。耶穌自己也這樣面對父的時間：門徒問他復興國的日子，他說那時候、日期不是他們可以知道的，他把日子留在父的權柄裡，自己專心做父交給他的事。我們學的不是一個很會算的人，是一位把時間交給父、把怒氣拉長、一直等浪子回家的主。","g":"讓耶穌作王：這一章要人交出兩樣東西。第一是時間表——主的日子要像賊來到（3:10），賊不預告時間；不排倒數、不轉傳時間表，是承認日子在他手裡，不在我們的換算裡。第二是榮耀——全卷最後一句「願榮耀歸給他」（3:18），是新約少數直接把榮耀歸給基督的頌讚；一個快要殉道的老人，最後一口氣不提自己。讓耶穌作王，就是連自己的等候、堅固、長進都不拿來誇口。可以自己檢查：這一季我最想掌控的，是哪一個「還要多久」？","p":"建立屬神的體系：3:13 說新天新地「有義居在其中」，屬神體系的終局是一個義安家的地方；這體系今天就從 3:15「我們所親愛的兄弟保羅」開始——曾在安提阿當面衝突的兩位使徒，站在同一個福音上，這是 235 的 2，屬靈同伴。第一，小組要成為彼此防備的地方：誰被末日訊息或錯謬帶著走，有人打電話、陪他讀上下文。第二，教會要成為一起長進的地方：讀不懂的經文可以帶來問，帶領的人也敢說「我不知道，我們一起查」。第三，國度321空中團契散在各國的弟兄姊妹，可以為同一份還沒回家的名單同心禱告。"},"grp":["【一、破冰】你這一生等過最久的一件事是甚麼——一封信、一個孩子、一張錄取通知、一個人回家？等的時候，你最常對自己說的一句話是甚麼？","【二、扎心】3:9 說「有人以為他是耽延」。你心裡有沒有一件事，其實已經被你判定為「神耽延了」？說出來。如果把它換成「寬容」來讀，你對神的感覺、對那個人的態度，會有甚麼不同？","【三、福音】寫下「不是耽延，乃是寬容」的彼得，自己就是被主等回來的人：三次不認主，主在海邊為他生了炭火。主曾經在哪一件事上等過你？你是怎樣被等回來的？","【四、行動】3:17–18 的次序是先防備墜落，再在恩典和知識上長進，最後把榮耀歸給他。這三件事裡，你這一季最弱的是哪一件？說出這一週你要做的一個具體動作：甚麼時間、在哪裡、和誰。","【五、代禱】每人說出一位你為他等了很久、還沒信主或已經離開教會的人的名字，只說名字，不必說細節；全組一起為他禱告：「主啊，求你的寬容臨到他。」也為各國正在等候、等得很累的弟兄姊妹代求。"],"prac":{"main":"這一週，我把一件「神耽延了」的事交還給主：防備被錯謬帶走，在恩典裡長一步，把榮耀歸給他。","items":["對神：每天早上讀 3:9 一次，把你覺得「神耽延了」的那件事說出來，然後改寫成一句禱告：「主啊，你不是耽延，你在等。」每天晚上讀 3:18，用「願榮耀歸給他」結束這一天，不管今天的答案來了沒有。","對自己：讀 3:17，找出一個最容易把你「一同帶走」的東西——末日訊息的群組、某個網路講員、一種「大家都這樣」的習慣；寫下你防備它的一個具體做法，這一週星期三以前就做。","對人：找一位你為他等了很久、還沒信主或已經離開教會的人，這一週主動問候他一次：一通電話、一則訊息或一頓飯；不急著勸，只讓他知道你記得他。","對生活：從 3:11「該當怎樣聖潔，怎樣敬虔」出發，這一週檢查一件日常的事——怎樣花錢、用時間、對待神所造的世界；作一個具體的小調整，例如不浪費一餐食物、把一筆衝動的消費留給有需要的人。","對使命：這一週在小組或家裡一起讀 3:17–18，然後各人說出一位這個月要為他禱告、也要去問候的人；最後一起開口說一次：「願榮耀歸給他，從今直到永遠。阿們！」"]},"safe":["① 用 3:8「主看一日如千年」替末日排時間表：「創造六日對應世界歷史七個千年，現在已經到了最後幾年」，或說創造的一日就是一千年。","彼得兩個方向都說——一日如千年，千年如一日——正是為了取消換算；「如」是比喻，不是等號。用這一節排年份，不論算末日還是算創造日，都是誤用（紅線三；議題見 ISS03_3）。","檢驗標準：會眾聽完 3:8，是更安心地把時間交給主，還是回家打開計算機？","② 用 3:12「切切仰望神的日子來到」叫人研究時事表、推斷年份，或說人可以用某種政治、軍事或宗教工程「加速」主的再來。","原文較支持「催促」，但上下文定了催促的方法：3:9 的悔改、3:11 的聖潔敬虔；這是參與神的心意，不是掌握神的時間表，3:10「像賊」仍然管著 3:12（紅線三；議題見 ISS03_7）。","檢驗標準：講完之後，會眾想做的是悔改、聖潔、傳福音，還是去盯新聞、算年份？","③ 用 3:10–12 對會眾說：「地球最後反正燒掉，環保是世人的事，我們只管救靈魂。」","這不是經文的推論：洪水「消滅」了當時的世界，地卻仍在（3:6）；3:13 的「新」是更新；3:11 的聖潔敬虔是今天的生活，包括怎樣對待神所造的世界（紅線六；全卷立場見 ISS00_4）。","檢驗標準：聽完的人，對神所造的世界是更珍惜，還是更隨便？","④ 反過來，把 3:10–13 講成某一個環保政策或政黨的背書：「支持這個法案才是愛神，反對的人就是不敬虔。」","照顧受造界是管家的本分，不是政治陣營的標籤；講台講原則，不替會眾投票，具體政策讓有良心的弟兄姊妹各自分辨（紅線六的另一面；議題見 ISS03_6）。","檢驗標準：不同政治立場的弟兄姊妹聽完，是一起更敬畏造物主，還是彼此更對立？","⑤ 用 3:15–16 對會眾說：「連彼得都說保羅難懂，可見保羅太複雜」，或說「彼得是漁夫沒學問，所以讀不懂保羅」。","這不是兩位使徒的較量：彼得稱保羅「我們所親愛的兄弟」，承認他有「所賜給他的智慧」，又把他的信和「別的經書」並列。加 2:11 的事件可以講，落點是 3:15 的「親愛的兄弟」（紅線七；議題見 ISS03_8）。","檢驗標準：會眾聽完，是更尊重兩位使徒、更想和好，還是更想選邊？","⑥ 用 3:16「信中有些難明白的」勸會眾：「保羅書信太難，你們別自己讀，聽牧師講就好。」","出問題的是「無學問、不堅固的人強解」，不是讀的人；保護讀經的方法是在群體中、照上下文、謙卑地讀，讀不懂就帶來問，絕不是只有牧師能解（紅線八；全卷立場見 ISS00_3；議題見 ISS03_9）。","檢驗標準：聽完的人是更想讀經，還是更不敢讀？有沒有給他一個今天就能用的讀經方法？","⑦ 講 3:10 時對會眾說：「和合本這裡譯錯了」，或說「某某譯本是錯的，只有我手上這本才對」。","3:10 是抄本的異文，不是翻譯的對錯：和合本「燒盡了」忠實地跟從 κατακαήσεται 的抄本，SBLGNT 作「被顯露」，NA28 作「不被發現」；講台並陳，兩讀都不是神丟棄受造界（議題見 ISS03_5）。","檢驗標準：會眾聽完，是更信任手上的聖經、也更明白抄本的歷史，還是開始懷疑聖經？","⑧ 整篇只講天被火燒、有形質的被烈火鎔化，用火的畫面嚇人，卻不講 3:13 的新天新地。","3:10–12 的火不是結尾；彼得的句子停在「盼望新天新地，有義居在其中」，κατοικεῖ 是住下來不走。火是審判與顯露，家才是終點；果效是忍耐，不是恐慌（鐵律六）。","檢驗標準：講完之後，會眾心裡留下的是火的畫面，還是家的畫面？","⑨ 把等候講成焦慮的倒數：「每天都可能是最後一天，你準備好了沒有？」；或反過來講成消極的坐等：「反正主要來，工作、讀書、成家都不重要了。」","3:9 的等候是悔改與傳福音的時間；3:11–14 的等候是聖潔、敬虔、殷勤，「安然見主」。等候不是恐慌，也不是閒懶；彼得叫人在恩典和知識上長進，不是叫人停下生活（全卷立場見 ISS00_4）。","檢驗標準：會眾走出去，是更害怕、更冷淡，還是更平安、更殷勤？","⑩ 用 3:17 對會眾說：「連彼得都在安提阿被假弟兄一同帶走了」，把 3:17 的「誘惑」直接說成彼得當年的遭遇。","3:17 的 συναπαχθέντες（一同被帶走），在加 2:13 是同一個字，被帶走的主詞是巴拿巴；彼得是帶頭「退去」、與外邦人隔開的那一位（加 2:12）。照實講，彼得的警告反而更謙卑：他不是受害者，是曾經帶別人偏離的人（紅線七）。","檢驗標準：有沒有把加拉太書的經文照實講對？會眾聽完，是更看見主怎樣挽回彼得，還是只多了一個「彼得被騙」的故事？","⑪ 用 3:9「不願有一人沉淪」宣講人人終必得救：「神既然不願意，最後就沒有人會沉淪。」","同一段經文說「不敬虔之人受審判遭沉淪」（3:7）；3:9 解釋的是神為甚麼還在等，不是說審判不會來。正因為審判是真的，寬容才寶貴（議題見 ISS03_4）。","檢驗標準：有沒有同時講神的寬容與 3:10「主的日子要像賊來到」？","⑫ 用 3:9 在講台上裁判揀選的神學系統，或對一位親人未信主就過世的弟兄姊妹說：「你家人已經確定在地獄了。」","βούλομαι 說的是神真實的心意；揀選與普世救恩各家並陳，講台不在這裡判系統。我們也不替神斷定任何亡者的去處，審判全地的主必行公義（創 18:25；議題見 ISS03_4）。","檢驗標準：一位剛失去未信主父親的姊妹聽完，是被陪伴、被交在主手裡，還是被宣判、被推開？","⑬ 用 3:5–7 在講台上裁判創造論：「不信年輕地球就是不信聖經」，或反過來嘲笑相信六日創造的人「不懂科學」。","彼得引創世記的敘事，目的在神學：神的話創造、審判、托住世界；他不是在提供一套地質年代。敬虔愛主的弟兄姊妹在這一題上看法不同，講台不在這裡裁判（議題見 ISS03_2）。","檢驗標準：持不同創造觀的弟兄姊妹聽完，是一起敬拜造物主，還是覺得自己被排除在外？","⑭ 把 3:17–18 的次序顛倒或砍掉一半：只講「要防備」，整篇都是警告、懷疑與查假師傅，不講長進，也不講榮耀。","只講防備，教會會變成一群守城門、彼此懷疑的人；彼得的次序是先防備墜落，再在恩典和知識上長進，最後「願榮耀歸給他」。不墜落的方法不是站著不動，是長進（鐵律六）。","檢驗標準：講章的最後一句，是警告，還是「願榮耀歸給他」？","⑮ 把這一章講成彼得的英雄遺言：「看彼得臨死還這麼勇敢，我們也要像他一樣偉大。」","寫「不是耽延，乃是寬容」的人，自己就是被寬容等回來的；他最後一句不是歸給自己，是「願榮耀歸給他」，頌讚直接歸給耶穌基督（鐵律七）。","檢驗標準：會眾記得的是彼得，還是那位「願榮耀歸給他」的主？","⑯ 跳過書信三問，直接把 3:3–13 套到今天的新聞上：「譏誚的人就是今天某某名人，主的日子就快到了。」","先問受書人遇到甚麼：譏誚的人說主不會來，假師傅把恩典扭成放縱；再問彼得從福音推出甚麼原則：主的慢是寬容，盼望的人活得聖潔；最後才問今天落在哪裡：等候中的悔改、傳福音與長進。不點名，不對號入座（紅線一）。","檢驗標準：三問有沒有依次走完，還是直接跳到第三問？"]}],"txt":{"1":["作耶穌基督僕人和使徒的西門‧彼得寫信給那因我們的神和救主耶穌基督之義、與我們同得一樣寶貴信心的人。","願恩惠、平安，因你們認識神和我們主耶穌，多多地加給你們。","神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。","因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。","正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識；","有了知識，又要加上節制；有了節制，又要加上忍耐；有了忍耐，又要加上虔敬；","有了虔敬，又要加上愛弟兄的心；有了愛弟兄的心，又要加上愛眾人的心。","你們若充充足足地有這幾樣，就必使你們在認識我們的主耶穌基督上不至於閒懶不結果子了。","人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨。","所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳；","這樣，必叫你們豐豐富富地得以進入我們主－救主耶穌基督永遠的國。","你們雖然曉得這些事，並且在你們已有的真道上堅固，我卻要將這些事常常提醒你們。","我以為應當趁我還在這帳棚的時候提醒你們，激發你們；","因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的。","並且，我要盡心竭力，使你們在我去世以後時常記念這些事。","我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。","他從父神得尊貴榮耀的時候，從極大榮光之中有聲音出來，向他說：「這是我的愛子，我所喜悅的。」","我們同他在聖山的時候，親自聽見這聲音從天上出來。","我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。","第一要緊的，該知道經上所有的預言沒有可隨私意解說的；","因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。"],"2":["從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認，自取速速地滅亡。","將有許多人隨從他們邪淫的行為，便叫真道因他們的緣故被毀謗。","他們因有貪心，要用捏造的言語在你們身上取利。他們的刑罰，自古以來並不遲延；他們的滅亡也必速速來到。","就是天使犯了罪，神也沒有寬容，曾把他們丟在地獄，交在黑暗坑中，等候審判。","神也沒有寬容上古的世代，曾叫洪水臨到那不敬虔的世代，卻保護了傳義道的挪亞一家八口。","又判定所多瑪、蛾摩拉，將二城傾覆，焚燒成灰，作為後世不敬虔人的鑑戒；","只搭救了那常為惡人淫行憂傷的義人羅得。（","因為那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。）","主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子。","那些隨肉身、縱污穢的情慾、輕慢主治之人的，更是如此。他們膽大任性，毀謗在尊位的，也不知懼怕。","就是天使，雖然力量權能更大，還不用毀謗的話在主面前告他們。","但這些人好像沒有靈性，生來就是畜類，以備捉拿宰殺的。他們毀謗所不曉得的事，正在敗壞人的時候，自己必遭遇敗壞。","行的不義，就得了不義的工價。這些人喜愛白晝宴樂，他們已被玷污，又有瑕疵，正與你們一同坐席，就以自己的詭詐為快樂。","他們滿眼是淫色，止不住犯罪，引誘那心不堅固的人，心中習慣了貪婪，正是被咒詛的種類。","他們離棄正路，就走差了，隨從比珥之子巴蘭的路。巴蘭就是那貪愛不義之工價的先知，","他卻為自己的過犯受了責備；那不能說話的驢以人言攔阻先知的狂妄。","這些人是無水的井，是狂風催逼的霧氣，有墨黑的幽暗為他們存留。","他們說虛妄矜誇的大話，用肉身的情慾和邪淫的事引誘那些剛才脫離妄行的人。","他們應許人得以自由，自己卻作敗壞的奴僕，因為人被誰制伏就是誰的奴僕。","倘若他們因認識主－救主耶穌基督，得以脫離世上的污穢，後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了。","他們曉得義路，竟背棄了傳給他們的聖命，倒不如不曉得為妙。","俗語說得真不錯：狗所吐的，牠轉過來又吃；豬洗淨了又回到泥裡去滾；這話在他們身上正合式。"],"3":["親愛的弟兄啊，我現在寫給你們的是第二封信。這兩封都是提醒你們，激發你們誠實的心，","叫你們記念聖先知預先所說的話和主救主的命令，就是使徒所傳給你們的。","第一要緊的，該知道在末世必有好譏誚的人隨從自己的私慾出來譏誚說：","「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣。」","他們故意忘記，從太古，憑神的命有了天，並從水而出、藉水而成的地。","故此，當時的世界被水淹沒就消滅了。","但現在的天地還是憑著那命存留，直留到不敬虔之人受審判遭沉淪的日子，用火焚燒。","親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日。","主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。","但主的日子要像賊來到一樣。那日，天必大有響聲廢去，有形質的都要被烈火銷化，地和其上的物都要燒盡了。","這一切既然都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔，","切切仰望神的日子來到。在那日，天被火燒就銷化了，有形質的都要被烈火鎔化。","但我們照他的應許，盼望新天新地，有義居在其中。","親愛的弟兄啊，你們既盼望這些事，就當殷勤，使自己沒有玷污，無可指摘，安然見主；","並且要以我主長久忍耐為得救的因由，就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。","他一切的信上也都是講論這事。信中有些難明白的，那無學問、不堅固的人強解，如強解別的經書一樣，就自取沉淪。","親愛的弟兄啊，你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。","你們卻要在我們主－救主耶穌基督的恩典和知識上有長進。願榮耀歸給他，從今直到永遠。阿們！"]},"blk":{"1":[{"a":1,"z":2,"star":2,"grk":"<p lang=\"grc\">Συμεὼν Πέτρος δοῦλος καὶ ἀπόστολος Ἰησοῦ Χριστοῦ τοῖς ἰσότιμον ἡμῖν λαχοῦσιν πίστιν ἐν δικαιοσύνῃ τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ·<\/p><p lang=\"grc\">χάρις ὑμῖν καὶ εἰρήνη πληθυνθείη ἐν ἐπιγνώσει τοῦ θεοῦ καὶ Ἰησοῦ τοῦ κυρίου ἡμῶν.<\/p>","lit":"<p>西緬彼得，耶穌基督的奴僕和使徒，寫給那些在我們的神和救主耶穌基督的義裡，與我們分得了同等尊貴之信心的人：<\/p><p>願恩典與平安，在對神和我們主耶穌的認識裡，向你們被加多。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>Συμεὼν Πέτρος<\/td><td>Symeōn Petros<\/td><td>西緬彼得<\/td><td>希伯來拼法；新約另一次只在徒 15:14<\/td><\/tr><tr><td>δοῦλος καὶ ἀπόστολος<\/td><td>doulos kai apostolos<\/td><td>奴僕和使徒<\/td><td>先是屬主的人，後是被差的人<\/td><\/tr><tr><td>ἰσότιμον ἡμῖν λαχοῦσιν πίστιν<\/td><td>isotimon hēmin lachousin pistin<\/td><td>與我們分得同等尊貴之信心的<\/td><td>ἰσότιμον 新約僅此一次；信心是分到的份<\/td><\/tr><tr><td>τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ<\/td><td>tou theou hēmōn kai sōtēros Iēsou Christou<\/td><td>我們的神和救主耶穌基督<\/td><td>一個冠詞統管兩個稱號，同指耶穌<\/td><\/tr><tr><td>ἐν ἐπιγνώσει<\/td><td>en epignōsei<\/td><td>在認識裡<\/td><td>全卷第一次出現「認識」；恩典在這裡加多<\/td><\/tr><tr><td>πληθυνθείη<\/td><td>plēthyntheiē<\/td><td>願它被加多<\/td><td>祈願語氣，與彼前 1:2 同一句問安<\/td><\/tr><\/table>","gram":"<p><strong>τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ（tou theou hēmōn kai sōtēros Iēsou Christou）只有一個冠詞。<\/strong>一個冠詞統管兩個單數的稱號，中間用 καί（kai）連接，通常指同一位，文法書稱為 Granville Sharp 規則。照這個讀法，彼得是直稱耶穌為「我們的神和救主」，與多 2:13 同列。也有人讀成兩位：「我們的神」指父，「救主耶穌基督」指子，理由是緊接的 1:2 就把神與耶穌分開。可是本卷 1:11、2:20、3:18 用同一句型 τοῦ κυρίου ἡμῶν καὶ σωτῆρος（tou kyriou hēmōn kai sōtēros），沒有人把那三處讀成兩位；1:2 的 Ἰησοῦ（Iēsou）是專有名詞，不在這條規則之內。本講義讀成一位。<\/p><p>Συμεών（Symeōn）是希伯來名字的希臘拼法；有些古抄本作較常見的 Σίμων（Simōn），SBLGNT 取 Συμεών，少見的拼法比較不像是抄寫時改出來的。ἰσότιμον（isotimon）原是城邦裡「同等公民權」的字；λαχοῦσιν（lachousin）是不定過去式分詞，「抽籤分到的」：信心是分到手的份，不是掙來的。<\/p>","exp":"<p>〔背景〕約 21:15--17；徒 15:14--14（約翰福音講義第 21 章；使徒行傳講義第 15 章）<\/p><p>〔彼前〕彼前 1:1--2（彼得前書講義第 1 章）<\/p><p>「作耶穌基督僕人和使徒的西門‧彼得寫信給那因我們的神和救主耶穌基督之義、與我們同得一樣寶貴信心的人」（1:1）。第一封信他只寫「彼得」。這一封是臨終的信，他寫「西門‧彼得」，而且用了希伯來拼法。新約只有另一次這樣叫他，是耶路撒冷會議上雅各說：「方才西門述說神當初怎樣眷顧外邦人」（徒 15:14）。那是他的本名，也是主在加利利海邊三次問他「約翰的兒子西門，你愛我比這些更深嗎」（約 21:15）時叫的名字。<\/p><p>他先寫「僕人」，再寫「使徒」。先是屬於主的人，然後才是被差的人。一個被主從三次不認的羞愧裡接回來的人，不會先寫頭銜。<\/p><p>收信的人沒見過主，沒上過聖山，彼得卻說他們的信心和使徒「一樣寶貴」。<strong>信心的價值不在拿的人，在分給它的那一位。<\/strong>它是在「我們的神和救主耶穌基督之義」裡分到的：他不偏待人，所以漁村出身的使徒和遠方城裡的一個婢女，手裡捧著的是同一份。今天散在各國、每天在線上聚會的弟兄姊妹，沒有一個是二等信徒。<\/p><p>「願恩惠、平安，因你們認識神和我們主耶穌，多多地加給你們」（1:2）。問安和彼前 1:2 幾乎一樣，只多了「因你們認識」。恩典不是在認識主以外另外掉下來的禮物；越認識他，恩典越多。這一章是全卷「星・井・天」的第一步：還沒有任何命令，先告訴你手裡已經有甚麼。<\/p>"},{"a":3,"z":3,"star":3,"grk":"<p lang=\"grc\">Ὡς πάντα ἡμῖν τῆς θείας δυνάμεως αὐτοῦ τὰ πρὸς ζωὴν καὶ εὐσέβειαν δεδωρημένης διὰ τῆς ἐπιγνώσεως τοῦ καλέσαντος ἡμᾶς ἰδίᾳ δόξῃ καὶ ἀρετῇ,<\/p>","lit":"<p>既然他神聖的能力，已經把一切關乎生命和敬虔的事賜給了我們，是藉著認識那一位用自己的榮耀和美德呼召我們的，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τῆς θείας δυνάμεως αὐτοῦ<\/td><td>tēs theias dynameōs autou<\/td><td>他神聖的能力<\/td><td>一切供應的源頭；1:16 的「大能」同字<\/td><\/tr><tr><td>πάντα … δεδωρημένης<\/td><td>panta … dedōrēmenēs<\/td><td>已經把一切賜下<\/td><td>完成式分詞：給了，而且還在手上<\/td><\/tr><tr><td>τὰ πρὸς ζωὴν καὶ εὐσέβειαν<\/td><td>ta pros zōēn kai eusebeian<\/td><td>那關乎生命與敬虔的<\/td><td>裡面的生命，向神的生活<\/td><\/tr><tr><td>διὰ τῆς ἐπιγνώσεως<\/td><td>dia tēs epignōseōs<\/td><td>藉著認識<\/td><td>一切都是在認識他裡面送到的<\/td><\/tr><tr><td>ἰδίᾳ δόξῃ καὶ ἀρετῇ<\/td><td>idia doxē kai aretē<\/td><td>用他自己的榮耀和美德<\/td><td>ἀρετή 兩節後成了人要加上的「德行」<\/td><\/tr><\/table>","gram":"<p><strong>1:3 沒有命令語氣，只有一個完成式分詞 δεδωρημένης（dedōrēmenēs）。<\/strong>它與 τῆς θείας δυνάμεως（tēs theias dynameōs）組成獨立屬格，意思是「既然他神聖的能力已經賜下」。完成式說的是過去完成、今天仍然有效的事：給了，而且還在你手上。開頭的 Ὡς（Hōs）可以往上接，說明 1:2 的恩惠平安怎樣加多；也可以往下接，作 1:5 的前提。1:5 的 αὐτὸ τοῦτο（auto touto，正因這緣故）回指這兩節，所以本講義讀成往下接：神的完成式在前，人的命令式在後。<\/p><p>「召我們的」是父還是子，兩種讀法都有。新約常說神召人（彼前 5:10），但最近的先行詞是 1:2 的「我們主耶穌」，「自己的榮耀」又正是 1:17 子從父所得的榮耀，和合本譯作「召我們的主」。ἰδίᾳ δόξῃ καὶ ἀρετῇ（idia doxē kai aretē）是間接格，多數讀作工具：用他自己的。ἀρετῇ（aretē）兩節後再出現，就是 1:5 的「德行」。<\/p>","exp":"<p>〔背景〕路 9:28--32（路加福音講義第 9 章）<\/p><p>「神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主」（1:3）。一個快要殉道的人寫遺言，照常理第一句該是叮嚀。彼得的第一句卻是直述句：一切都已經給了。給了多少？「一切」。範圍是生命與虔敬：裡面活著的那一份，和向神活出來的那一份。<\/p><p>很多基督徒把信仰活成一種缺乏：我還差一點甚麼，再多一次特會、再多一次經歷，才夠。彼得說，你缺的不是更多的供應。<strong>神沒有寄一個包裹給你就走了；他把自己給了你，一切都在認識他裡面。<\/strong>「皆因我們認識」原文是「藉著認識」，恩典走的那條路，就是認識他。<\/p><p>召我們的主用的是「自己」的榮耀和美德。那榮耀，彼得在山上親眼見過：「彼得和他的同伴都打盹，既清醒了，就看見耶穌的榮光」（路 9:32）。呼召的資源全在他那邊，不在我們的條件裡。而「美德」這個字，兩節以後就是我們要加上的「德行」：我們要長出來的，本來就是他身上的樣子。<\/p><p>這是全章的地基。後面所有的「要分外地殷勤」，都站在這一節上。次序不能倒過來：先是神已經給了，才有我們去活。321 說先生命、再關係、後事工，根就在這裡：生命是他給的，不是我們爬出來的。<\/p>"},{"a":4,"z":4,"star":3,"grk":"<p lang=\"grc\">διʼ ὧν τὰ τίμια καὶ μέγιστα ἡμῖν ἐπαγγέλματα δεδώρηται, ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως, ἀποφυγόντες τῆς ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς.<\/p>","lit":"<p>藉著這些，他已經把那些寶貴而極大的應許賜給我們，好叫你們藉著這些，成為有分於神性情的人，既已逃脫了世上那在情慾裡的敗壞。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τὰ τίμια καὶ μέγιστα … ἐπαγγέλματα<\/td><td>ta timia kai megista … epangelmata<\/td><td>寶貴而極大的應許<\/td><td>μέγιστα 是最高級；ἐπάγγελμα 新約只在此與 3:13<\/td><\/tr><tr><td>δεδώρηται<\/td><td>dedōrētai<\/td><td>他已經賜下了<\/td><td>又是完成式，接回 1:3<\/td><\/tr><tr><td>θείας κοινωνοὶ φύσεως<\/td><td>theias koinōnoi physeōs<\/td><td>神性情的有分者<\/td><td>全卷最高、也最容易講偏的一句<\/td><\/tr><tr><td>ἀποφυγόντες<\/td><td>apophygontes<\/td><td>已經逃脫了<\/td><td>不定過去式分詞；2:18、20 同字<\/td><\/tr><tr><td>τῆς ἐν τῷ κόσμῳ ἐν ἐπιθυμίᾳ φθορᾶς<\/td><td>tēs en tō kosmō en epithymia phthoras<\/td><td>世上在情慾裡的敗壞<\/td><td>有分的反面；2:19 假師傅「作敗壞的奴僕」<\/td><\/tr><\/table>","gram":"<p><strong>θείας κοινωνοὶ φύσεως（theias koinōnoi physeōs）有四種主要讀法。<\/strong>東正教的成神論（theosis）說，人藉恩典有分於神的「能力」（energies），不是神的「本質」（essence）；亞他那修說神成為人，好叫人得以成神，在東正教神學裡是指藉恩典有分，從來不是多出另一位神。改革宗與路德宗讀成與基督聯合：藉聖靈與基督聯合，有分於他的生命，被更新成神的形像。衛斯理傳統讀成完全的愛：有分於神的聖潔與愛，今生就能被愛充滿。許多福音派註釋讀成道德的相似：有分於神的聖潔與良善，不涉本體。<\/p><p>四讀沒有一家說受造者會變成另一位神。本講義採「在基督裡與基督聯合，有分於神的生命與品格」，並守住三條界線（見下文）。φύσις（physis）是當時希臘哲學熟悉的字，彼得借來裝福音，隨即用「脫離敗壞」和 1:5–7 定義它。ἀποφυγόντες（apophygontes）是不定過去式：逃脫已經發生，有分從今天開始，到 3:13 的新天新地才完全。<\/p>","exp":"<p>「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分」（1:4）。這是全卷神學最高的一句，也是最容易講偏的一句。講過頭，人就自我膨脹；怕講錯而跳過，教會就少了一個極大的應許。所以不能跳過，也不能講過頭。<\/p><p>「有分」原文 κοινωνοί，彼得很熟這個字。多年前在革尼撒勒湖邊，雅各、約翰是西門的「夥伴」（路 5:10），用的是同一個字。那時有分的是一條船、一網魚；如今主說，你要有分的是我的生命。<\/p><p>可是線要畫清楚。<strong>船上的夥伴分享同一條船，卻沒有變成船主。<\/strong>第一，創造者與受造者的分別永遠存在，人不會變成神，也不與神的本質混同；東正教分開神的本質與能力，正是為了守住這條線。第二，有分是恩典，不是修煉：主詞是神，「他已將」應許賜給我們。第三，有分的內容就寫在上下文：往後半句是脫離敗壞，往後三節是德行、知識、節制、忍耐、虔敬、愛弟兄、愛眾人。神的性情落在人身上，長出來的就是品格。<\/p><p>第 2 章的假師傅「應許人得以自由，自己卻作敗壞的奴僕」（2:19），他們給的，正是 1:4 要救我們脫離的那個東西。四種讀法的詳細陳列在議題頁。321 說無己不是沒有，乃是進入無限；在這一節只能這樣說：無己的人進入與無限之神的相交，基督在他裡面活著（加 2:20），人並沒有變成無限。<\/p>"},{"a":5,"z":7,"star":2,"grk":"<p lang=\"grc\">καὶ αὐτὸ τοῦτο δὲ σπουδὴν πᾶσαν παρεισενέγκαντες ἐπιχορηγήσατε ἐν τῇ πίστει ὑμῶν τὴν ἀρετήν, ἐν δὲ τῇ ἀρετῇ τὴν γνῶσιν,<\/p><p lang=\"grc\">ἐν δὲ τῇ γνώσει τὴν ἐγκράτειαν, ἐν δὲ τῇ ἐγκρατείᾳ τὴν ὑπομονήν, ἐν δὲ τῇ ὑπομονῇ τὴν εὐσέβειαν,<\/p><p lang=\"grc\">ἐν δὲ τῇ εὐσεβείᾳ τὴν φιλαδελφίαν, ἐν δὲ τῇ φιλαδελφίᾳ τὴν ἀγάπην.<\/p>","lit":"<p>正為這個緣故，你們也要帶進全部的殷勤，在你們的信心裡供應德行，在德行裡供應知識，<\/p><p>在知識裡供應節制，在節制裡供應忍耐，在忍耐裡供應敬虔，<\/p><p>在敬虔裡供應弟兄相愛，在弟兄相愛裡供應愛。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>αὐτὸ τοῦτο<\/td><td>auto touto<\/td><td>正為這個<\/td><td>回指 1:3–4 神已經賜下的<\/td><\/tr><tr><td>σπουδὴν πᾶσαν παρεισενέγκαντες<\/td><td>spoudēn pasan pareisenenkantes<\/td><td>帶進全部的殷勤<\/td><td>παρεισφέρω 新約僅此一次<\/td><\/tr><tr><td>ἐπιχορηγήσατε<\/td><td>epichorēgēsate<\/td><td>要慷慨供應<\/td><td>原是出資供應合唱團的字<\/td><\/tr><tr><td>ἐν τῇ πίστει … τὴν ἀρετήν<\/td><td>en tē pistei … tēn aretēn<\/td><td>在信心裡供應德行<\/td><td>ἐν：從前一項裡面長出來<\/td><\/tr><tr><td>τὴν φιλαδελφίαν … τὴν ἀγάπην<\/td><td>tēn philadelphian … tēn agapēn<\/td><td>弟兄相愛……愛<\/td><td>終點是愛，越出教會的圍牆<\/td><\/tr><\/table>","gram":"<p><strong>主要動詞是不定過去式命令語氣 ἐπιχορηγήσατε（epichorēgēsate）。<\/strong>字根 χορηγός（chorēgos）是古希臘城邦出資供應合唱團的人，負擔服裝、訓練與演出，是一份榮譽，比的是誰供應得大方。到新約時代，這個字已經泛指慷慨供應（林後 9:10；加 3:5）。1:11 同一個字變成被動式 ἐπιχορηγηθήσεται（epichorēgēthēsetai）：你們在這裡供應，神在那裡供應。<\/p><p>七個「加上」都用介系詞 ἐν（en），「在……裡面」，不是 ἐπί（epi）「在……上面」。這是古典修辭常見的連鎖句（sorites），羅 5:3–5 也是這種句型。有人讀成一級一級的階梯，前一級完成才上下一級；有人讀成彼此包含，每一項在前一項裡長出來。本講義取後者：起點信心與終點愛是確定的，中間是互相扶持的品格，不是七道先後的關卡。<\/p>","exp":"<p>「正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識」（1:5）。很多人讀這三節只看見一張清單。彼得卻先放了「正因這緣故」：因為神已經把一切賜給了你（1:3–4）。<strong>長進不是爬上去見神，是神已經下來給了一切，我們才在其中長大。<\/strong><\/p><p>「加上」是一個有畫面的字。城邦辦戲劇節，有人出錢供應合唱團，大家看的是他出得多大方。彼得說：在你的信心裡，大方地供應德行。不是勉強湊數，是慷慨。介系詞也要留意，是「在信心裡面」：德行從信心裡長出來，知識從德行裡長出來，像一棵樹，不像一道樓梯。<\/p><p>起點是信心，那是神分給你的（1:1）。終點是愛。知識只在第二級；認識主若停在腦子裡，就長不出節制和忍耐。最後兩級都是愛人：先是「愛弟兄的心」，再是「愛眾人的心」。<strong>品格的頂點不是一個人多屬靈，是他多能愛。<\/strong><\/p><p>這段經文最該拿來照自己，不該拿來量別人。在家族群組裡被長輩酸了一句的人，缺的也許是節制；照顧失智父母十年的人，缺的也許不是忍耐，是有人愛他。別急著一次補齊八項，在信心裡大方地供應一項；那一位已經供應你一切的主，會在你裡面供應下一項。這八項是品格的果子，不是一套照表操課的步驟。<\/p>"},{"a":8,"z":9,"star":1,"grk":"<p lang=\"grc\">ταῦτα γὰρ ὑμῖν ὑπάρχοντα καὶ πλεονάζοντα οὐκ ἀργοὺς οὐδὲ ἀκάρπους καθίστησιν εἰς τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ ἐπίγνωσιν·<\/p><p lang=\"grc\">ᾧ γὰρ μὴ πάρεστιν ταῦτα, τυφλός ἐστιν μυωπάζων, λήθην λαβὼν τοῦ καθαρισμοῦ τῶν πάλαι αὐτοῦ ἁμαρτιῶν.<\/p>","lit":"<p>因為這些若在你們裡面存在，而且不斷增多，就使你們在認識我們主耶穌基督的事上，不成為閒懶的，也不成為不結果子的；<\/p><p>因為誰沒有這些，他就是瞎眼的，瞇著眼，取了遺忘，忘了他從前的罪已經得了潔淨。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ὑπάρχοντα καὶ πλεονάζοντα<\/td><td>hyparchonta kai pleonazonta<\/td><td>存在，而且不斷增多<\/td><td>現在式分詞：不是一次擁有<\/td><\/tr><tr><td>οὐκ ἀργοὺς οὐδὲ ἀκάρπους<\/td><td>ouk argous oude akarpous<\/td><td>不閒懶，也不無果<\/td><td>雙重否定，等於「必定結果」<\/td><\/tr><tr><td>τυφλός ἐστιν μυωπάζων<\/td><td>typhlos estin myōpazōn<\/td><td>是瞎眼的，瞇著眼<\/td><td>μυωπάζω 新約僅此一次<\/td><\/tr><tr><td>λήθην λαβὼν<\/td><td>lēthēn labōn<\/td><td>取了遺忘<\/td><td>λήθη 新約僅此一次；病根是忘記<\/td><\/tr><tr><td>τοῦ καθαρισμοῦ<\/td><td>tou katharismou<\/td><td>那潔淨<\/td><td>忘了的不是規條，是恩典<\/td><\/tr><\/table>","gram":"<p><strong>τυφλός ἐστιν μυωπάζων（typhlos estin myōpazōn）乍看矛盾：已經瞎了，怎麼還近視？<\/strong>μυωπάζω（myōpazō）的字根是「閉眼」，英文 myopia 由此而來。有人讀成程度：近視到一個地步，等於瞎了；有人讀成原因：自己把眼瞇起來不看遠處，久了就瞎了；也有人讀成限定：不是全瞎，是看不見遠處。本講義取限定讀法，又保留「自己瞇眼」的意味：看得見眼前，看不見 1:11 那永遠的國。<\/p><p>1:8 的 ὑπάρχοντα καὶ πλεονάζοντα（hyparchonta kai pleonazonta）是條件分詞，「若存在，而且不斷增多」。οὐκ ἀργοὺς οὐδὲ ἀκάρπους（ouk argous oude akarpous）是曲言法，用兩個否定說一個肯定：必定活潑、必定結果子。λήθην λαβὼν（lēthēn labōn）是慣用語，「取了遺忘」，就是忘記；全卷「記念」一線（1:12、13、15；3:1–2）從這個「忘」字起步。<\/p>","exp":"<p>〔背景〕路 22:61--62（路加福音講義第 22 章）<\/p><p>「你們若充充足足地有這幾樣，就必使你們在認識我們的主耶穌基督上不至於閒懶不結果子了」（1:8）。認識主不是終點，是一塊要結果子的田。「閒懶」原文是「不作工」，像一塊放著不耕的地。問題常常不在認識太少，而在認識沒有長出東西：聽了二十年道，脾氣還是一樣。<\/p><p>1:9 說反面。沒有這幾樣的人「就是眼瞎，只看見近處的」。不是天生看不見，是自己把眼瞇起來，只盯著眼前那一點：這個月的業績、群組裡的一句話、孩子的成績單。看不見的遠處，是 1:11 那「永遠的國」。<\/p><p>病根在下半句：「忘了他舊日的罪已經得了潔淨」。<strong>這個人忘的不是規條，是恩典。<\/strong>一個忘了自己被赦免多少的人，長不出忍耐，也長不出愛，因為他不再覺得自己欠了甚麼。<\/p><p>這節經文不是用來指著別人說「你瞎了」，是給自己的眼科檢查。治法也很溫柔：不是更用力，是想起來。那一夜在大祭司的院子裡，「主轉過身來看彼得，彼得便想起主對他所說的話」（路 22:61），他就出去痛哭。把彼得從跌倒裡叫回來的，正是一次想起來；不是彼得記性好，是主先轉過身來看他。<\/p>"},{"a":10,"z":11,"star":2,"grk":"<p lang=\"grc\">διὸ μᾶλλον, ἀδελφοί, σπουδάσατε βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι· ταῦτα γὰρ ποιοῦντες οὐ μὴ πταίσητέ ποτε.<\/p><p lang=\"grc\">οὕτως γὰρ πλουσίως ἐπιχορηγηθήσεται ὑμῖν ἡ εἴσοδος εἰς τὴν αἰώνιον βασιλείαν τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ.<\/p>","lit":"<p>所以，弟兄們，更要竭力使你們的蒙召和揀選成為確實的；因為你們行這些，就在任何時候都絕不會絆跌。<\/p><p>因為這樣，進入我們主和救主耶穌基督永遠之國的入口，必要豐富地供應給你們。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>σπουδάσατε<\/td><td>spoudasate<\/td><td>要竭力<\/td><td>回應 1:5 的「殷勤」<\/td><\/tr><tr><td>βεβαίαν … ποιεῖσθαι<\/td><td>bebaian … poieisthai<\/td><td>使之堅固確實<\/td><td>關身語態：為你們自己<\/td><\/tr><tr><td>τὴν κλῆσιν καὶ ἐκλογὴν<\/td><td>tēn klēsin kai eklogēn<\/td><td>那呼召與揀選<\/td><td>一個冠詞：同一件恩典的兩面<\/td><\/tr><tr><td>οὐ μὴ πταίσητέ ποτε<\/td><td>ou mē ptaisēte pote<\/td><td>任何時候都絕不絆跌<\/td><td>希臘文最強的否定<\/td><\/tr><tr><td>πλουσίως ἐπιχορηγηθήσεται<\/td><td>plousiōs epichorēgēthēsetai<\/td><td>必被豐富地供應<\/td><td>1:5 的字變成神的被動式<\/td><\/tr><tr><td>ἡ εἴσοδος<\/td><td>hē eisodos<\/td><td>那入口<\/td><td>對照 1:15 的 ἔξοδος<\/td><\/tr><\/table>","gram":"<p><strong>βεβαίαν ὑμῶν τὴν κλῆσιν καὶ ἐκλογὴν ποιεῖσθαι（bebaian hymōn tēn klēsin kai eklogēn poieisthai）用關身語態。<\/strong>βέβαιος（bebaios）在當時的契約裡指「有效的保證」。改革宗多讀成確據：揀選本身不動搖，品格讓蒙召的人自己看見、也讓人看見它是真的；阿米念傳統多讀成參與：人的回應真實地參與在保守之中；契約讀法則說，信徒的生命成了神呼召的確認書。有些抄本在此加上「藉著你們的善行」，多數校勘本視為後加的解說。本講義的讀法是：源頭在神，確據在生命。<\/p><p>οὐ μὴ πταίσητέ ποτε（ou mē ptaisēte pote）是 οὐ μή 加不定過去式假設語氣，再加 ποτε（pote），是最強的否定。πταίω（ptaiō）是走路絆跌，雅 3:2「在許多事上都有過失」同字，講的是在路上不至跌倒，不是說從此不會軟弱。1:11 的 ἐπιχορηγηθήσεται（epichorēgēthēsetai）是屬神的被動式。<\/p>","exp":"<p>〔背景〕太 14:28--31（馬太福音講義第 14 章）<\/p><p>「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳」（1:10）。這是全章最容易讓人不安的一節：難道揀選要靠我撐住？<\/p><p>看字就安心了。「堅定不移」是契約用語：買賣成交了，要有一份確實有效的保證書。神的呼召是那一筆交易；我們的品格，是讓這一筆交易在自己心裡、也在別人眼前看得見。動詞的語態是「為你們自己」，對象是你們的確據，不是在神那邊補上甚麼。<strong>源頭在神，確據在生命。<\/strong>得救確據與保守的各家讀法，議題頁另有陳列。<\/p><p>「就永不失腳」。寫這句話的人曾在加利利的水面上「將要沉下去」，「耶穌趕緊伸手拉住他」（太 14:30–31）。他知道失腳是甚麼滋味，也知道是誰把他拉起來。這個字是走路絆倒，不是說軟弱的人從此出局。<\/p><p>「這樣，必叫你們豐豐富富地得以進入我們主－救主耶穌基督永遠的國」（1:11）。「得以進入」原文又是 1:5 那個合唱團供應者的字，這次是被動式。你在信心裡大方供應德行，神在將來大方供應你進國的入口。不是從門縫裡擠進去，是被盛大地迎進去。那國是「我們主－救主耶穌基督」的；讓耶穌作王，到最後，連那國的門也是他親手打開的。<\/p>"},{"a":12,"z":13,"star":1,"grk":"<p lang=\"grc\">Διὸ μελλήσω ἀεὶ ὑμᾶς ὑπομιμνῄσκειν περὶ τούτων, καίπερ εἰδότας καὶ ἐστηριγμένους ἐν τῇ παρούσῃ ἀληθείᾳ.<\/p><p lang=\"grc\">δίκαιον δὲ ἡγοῦμαι, ἐφʼ ὅσον εἰμὶ ἐν τούτῳ τῷ σκηνώματι, διεγείρειν ὑμᾶς ἐν ὑπομνήσει,<\/p>","lit":"<p>所以我總要一直提醒你們這些事，雖然你們已經知道，也已經在臨到你們的真理裡被堅固了。<\/p><p>我認為是對的：只要我還在這個帳棚裡，就要用提醒來喚醒你們，<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>μελλήσω ἀεὶ … ὑπομιμνῄσκειν<\/td><td>mellēsō aei … hypomimnēskein<\/td><td>我總要一直提醒<\/td><td>不是教新的，是把已知的再放到眼前<\/td><\/tr><tr><td>καίπερ εἰδότας<\/td><td>kaiper eidotas<\/td><td>雖然你們已經知道<\/td><td>讓步：提醒不是因為對方差<\/td><\/tr><tr><td>ἐστηριγμένους<\/td><td>estērigmenous<\/td><td>已經被堅固的<\/td><td>路 22:32 那個「堅固」<\/td><\/tr><tr><td>ἐν τούτῳ τῷ σκηνώματι<\/td><td>en toutō tō skēnōmati<\/td><td>在這個帳棚裡<\/td><td>身體是暫時要拆的<\/td><\/tr><tr><td>διεγείρειν … ἐν ὑπομνήσει<\/td><td>diegeirein … en hypomnēsei<\/td><td>用提醒喚醒<\/td><td>3:1 同一句話再說一次<\/td><\/tr><\/table>","gram":"<p><strong>μελλήσω（mellēsō）是 μέλλω（mellō）的將來式，新約少見，意思接近「我總會、我一定要」。<\/strong>有些抄本作 οὐκ ἀμελήσω（ouk amelēsō，我不會疏忽），意思相近，兩讀都是一個臨終者的決心。ἀεί（aei）是「一直」，ὑπομιμνῄσκειν（hypomimnēskein）是現在式不定詞：提醒不是一次的事。<\/p><p>καίπερ εἰδότας καὶ ἐστηριγμένους（kaiper eidotas kai estērigmenous）是讓步分詞，「雖然你們已經知道，也已經被堅固」。ἐστηριγμένους（estērigmenous）是完成式被動分詞，與路 22:32 的 στήρισον（stērison）、彼前 5:10 的 στηρίξει（stērixei）同字根。ἐν τῇ παρούσῃ ἀληθείᾳ（en tē parousē alētheia）是「已經臨到你們的真理」，πάρειμι（pareimi）指在場、已經來到；上文說「你們雖然曉得」，所以這不是新出、只有少數人知道的真理。σκήνωμα（skēnōma）指身體，1:14 再用一次。<\/p>","exp":"<p>〔猶〕猶 5--5（猶大書講義尚未製作）<\/p><p>〔彼前〕彼前 5:10--10（彼得前書講義第 5 章）<\/p><p>「你們雖然曉得這些事，並且在你們已有的真道上堅固，我卻要將這些事常常提醒你們」（1:12）。這是遺言的開頭。一個知道自己快要走的人最想說的，不是新東西，是你們已經知道的那些。我們常以為長進就是學新的；彼得說，長進有一半是記得。1:9 那個瞇眼的人病在忘記，1:12 的藥就叫提醒。<\/p><p>「堅固」是彼得一生的字。主被賣那一夜對他說：「你回頭以後，要堅固你的弟兄。」（路 22:32）他在第一封信的末了寫，神「必要親自成全你們，堅固你們」（彼前 5:10）。現在他說，你們已經在真道上被堅固了。<strong>主交給他的那份功課，他一直做到最後一封信。<\/strong>不是彼得多會堅固人，是主先為他祈求，叫他不至於失了信心。<\/p><p>「我以為應當趁我還在這帳棚的時候提醒你們，激發你們」（1:13）。住帳棚的人知道帳棚是暫時的；只要還沒拆，他就要把你們叫醒。<\/p><p>今天的教會很怕重複，講台要新題目，小組要新教材。可是愛人的人不怕重複。你身邊那一位也許不缺新知識，缺的是一個肯一再提醒他的人。一個在異鄉讀書、半年沒進教會的孩子，常常是被一則每週準時出現的短訊叫回來的。<\/p>"},{"a":14,"z":15,"star":2,"grk":"<p lang=\"grc\">εἰδὼς ὅτι ταχινή ἐστιν ἡ ἀπόθεσις τοῦ σκηνώματός μου, καθὼς καὶ ὁ κύριος ἡμῶν Ἰησοῦς Χριστὸς ἐδήλωσέν μοι·<\/p><p lang=\"grc\">σπουδάσω δὲ καὶ ἑκάστοτε ἔχειν ὑμᾶς μετὰ τὴν ἐμὴν ἔξοδον τὴν τούτων μνήμην ποιεῖσθαι.<\/p>","lit":"<p>因為知道，脫下我這帳棚的時候迫近了，正如我們的主耶穌基督也曾向我指明的。<\/p><p>我也要竭力，使你們在我出去以後，隨時都能記念這些事。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ταχινή … ἡ ἀπόθεσις<\/td><td>tachinē … hē apothesis<\/td><td>那脫下是迫近的<\/td><td>ἀπόθεσις 像脫衣；彼前 3:21 同字<\/td><\/tr><tr><td>ἐδήλωσέν μοι<\/td><td>edēlōsen moi<\/td><td>曾向我指明<\/td><td>不定過去式：約 21:18–19 那一個早晨<\/td><\/tr><tr><td>ἑκάστοτε<\/td><td>hekastote<\/td><td>隨時、每一次<\/td><td>新約僅此一次<\/td><\/tr><tr><td>μετὰ τὴν ἐμὴν ἔξοδον<\/td><td>meta tēn emēn exodon<\/td><td>在我的出去以後<\/td><td>路 9:31 山上談論主「去世」的同一個字<\/td><\/tr><tr><td>τὴν τούτων μνήμην<\/td><td>tēn toutōn mnēmēn<\/td><td>對這些事的記念<\/td><td>μνήμη 新約僅此一次<\/td><\/tr><\/table>","gram":"<p><strong>彼得用兩個比喻談自己的死：ἀπόθεσις（apothesis）與 ἔξοδος（exodos）。<\/strong>ἀπόθεσις（apothesis）是「放下、脫下」，像脫一件衣服，彼前 3:21「除掉肉體的污穢」用的就是它；帳棚卻是用「脫」的，比喻混在一起，正是口語的樣子。ἔξοδος（exodos）是「出去」，七十士譯本出埃及記的書名就是這個字；路 9:31 山上的摩西、以利亞談論主的「去世」，也是 ἔξοδον（exodon）。<\/p><p>ταχινή（tachinē）可讀作「迫近的」，也可讀作「突然的」：彼得年事已高，又照約 21:18 知道自己會被人「束上」帶走。兩讀並不衝突，本講義以迫近為主。1:15 要人在他走後「時常記念」，至少指這封信本身；二世紀帕皮亞說馬可記下了彼得所傳的，可作背景，卻不能從本節證明。σπουδάσω（spoudasō）是將來式，全章第三次「殷勤」。<\/p>","exp":"<p>〔背景〕約 21:18--19；路 9:28--31（約翰福音講義第 21 章；路加福音講義第 9 章）<\/p><p>「因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的」（1:14）。那是加利利海邊的一個早晨，主對他說：「你年少的時候自己束上帶子，隨意往來；但年老的時候，你要伸出手來，別人要把你束上，帶你到不願意去的地方。」約翰接著解釋：「耶穌說這話是指著彼得要怎樣死，榮耀神。」（約 21:18–19）三十多年來，彼得一直知道自己會怎樣死。現在，那一天近了。<\/p><p>他說死亡是脫下帳棚。帳棚拆了，住帳棚的人沒有消失。1:15 他又用了「去世」這個字，原文就是「出埃及」。在登山變像的山上，摩西、以利亞「談論耶穌去世的事」（路 9:31），彼得就在旁邊，自己卻只想搭三座棚，把榮耀留在山上。<strong>年輕的彼得想把榮耀關進帳棚裡；年老的彼得知道，帳棚是要拆的，榮耀是要等的。<\/strong><\/p><p>一個面對死亡的人，最後的殷勤用在哪裡？「並且，我要盡心竭力，使你們在我去世以後時常記念這些事」（1:15）。不是保住自己的名聲，是讓人在他走後還記得主的話。<\/p><p>病房裡的長輩交代後事，交代的常是存摺和房子。彼得交代的是一封信。我們都住在帳棚裡，問題不是帳棚哪一天拆，是拆了以後，別人記得的是你，還是你一生指向的那一位。不是彼得多勇敢，是主早就把結局告訴他，又陪他走了三十年。<\/p>"},{"a":16,"z":16,"star":2,"grk":"<p lang=\"grc\">Οὐ γὰρ σεσοφισμένοις μύθοις ἐξακολουθήσαντες ἐγνωρίσαμεν ὑμῖν τὴν τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ δύναμιν καὶ παρουσίαν, ἀλλʼ ἐπόπται γενηθέντες τῆς ἐκείνου μεγαλειότητος.<\/p>","lit":"<p>因為我們使你們知道我們主耶穌基督的大能和來臨，並不是跟從了巧妙編造的神話，而是成了親眼目睹他威榮的人。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>σεσοφισμένοις μύθοις<\/td><td>sesophismenois mythois<\/td><td>被精心編造的神話<\/td><td>完成式被動分詞：設計過的故事<\/td><\/tr><tr><td>ἐγνωρίσαμεν ὑμῖν<\/td><td>egnōrisamen hymin<\/td><td>我們使你們知道了<\/td><td>複數「我們」：山上的三個見證人<\/td><\/tr><tr><td>δύναμιν καὶ παρουσίαν<\/td><td>dynamin kai parousian<\/td><td>大能和來臨<\/td><td>共用一個冠詞；3:4、12 同字指再來<\/td><\/tr><tr><td>ἐπόπται γενηθέντες<\/td><td>epoptai genēthentes<\/td><td>成了親眼目睹的人<\/td><td>ἐπόπτης 新約僅此一次<\/td><\/tr><tr><td>τῆς ἐκείνου μεγαλειότητος<\/td><td>tēs ekeinou megaleiotētos<\/td><td>那一位的威榮<\/td><td>路 9:43 眾人詫異神的「大能」同字<\/td><\/tr><\/table>","gram":"<p><strong>δύναμιν καὶ παρουσίαν（dynamin kai parousian）共用一個冠詞，可讀成重言法（hendiadys）：「大有能力的來臨」。<\/strong>這是哪一次來臨？有人說指第一次，即道成肉身與主在地上的事工；可是 παρουσία（parousia）在本卷另外兩次（3:4、12）都指主再來，而太 16:28 主說有人在沒嘗死味以前必看見人子降臨在他的國裡，緊接著就是登山變像。本講義讀作主的再來，登山變像是那日榮耀的預先顯現；這也說明為甚麼第 3 章的譏誚者要攻擊的，正是「主要降臨的應許」（3:4）。<\/p><p>σεσοφισμένοις μύθοις（sesophismenois mythois）可能是回應對手的指控：使徒講再來，只是編出來的神話。ἐπόπτης（epoptēs）在當時的神祕宗教裡指入門儀式最高一級、被引進內室看見祕密的人；彼得把這個字拿過來，意思反倒是「在場的目擊者」。<\/p>","exp":"<p>〔背景〕太 16:28--17:2（馬太福音講義第 16、17 章）<\/p><p>「我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」（1:16）。第一世紀的人聽過很多神降臨人間的故事，希臘的神化身為人，在人間走一圈又回到山上。故事編得巧，講得美，大家也知道那只是故事。<\/p><p>彼得說，我們傳的不是這一類。我們沒有編，我們是「親眼見過」的人。這個字在當時的神祕宗教裡，指被引進內室、看見祕密的那一級；<strong>彼得把它拿過來說：我們不是入了甚麼祕密的門，我們是站在山上，用自己眼睛看見的人。<\/strong>看見甚麼？「威榮」。那份威嚴是主的，不是見證人的；彼得只是剛好被帶上山的那一個。<\/p><p>今天也有人說，信仰不過是一個安慰人的故事。我們的回答不是講一個更動人的故事，而是指向那些在場的人、那座山、那個聲音。基督教是站在見證上的信仰，不是站在感覺上的。<\/p><p>這也給作見證的人一份自由。在公司茶水間被同事問起信仰，你不必把自己的經歷講得比實際更精彩，也不必編一個奇蹟。照你所看見的說，說主在你身上真實做過的事，就夠了。用「捏造的言語」取利，是第 2 章假師傅的工夫（2:3）；在場的見證不需要包裝。<\/p>"},{"a":17,"z":18,"star":2,"grk":"<p lang=\"grc\">λαβὼν γὰρ παρὰ θεοῦ πατρὸς τιμὴν καὶ δόξαν φωνῆς ἐνεχθείσης αὐτῷ τοιᾶσδε ὑπὸ τῆς μεγαλοπρεποῦς δόξης· Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν, εἰς ὃν ἐγὼ εὐδόκησα—<\/p><p lang=\"grc\">καὶ ταύτην τὴν φωνὴν ἡμεῖς ἠκούσαμεν ἐξ οὐρανοῦ ἐνεχθεῖσαν σὺν αὐτῷ ὄντες ἐν τῷ ἁγίῳ ὄρει.<\/p>","lit":"<p>因為他從父神領受了尊貴和榮耀，那時有這樣的聲音，從那威嚴的榮耀中被帶到他那裡：這是我的兒子，我所愛的，我喜悅他。<\/p><p>這聲音，我們與他同在聖山上的時候，親耳聽見從天上被帶下來。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>λαβὼν … τιμὴν καὶ δόξαν<\/td><td>labōn … timēn kai doxan<\/td><td>領受了尊貴和榮耀<\/td><td>句子以分詞起頭，沒有寫完<\/td><\/tr><tr><td>φωνῆς ἐνεχθείσης<\/td><td>phōnēs enechtheisēs<\/td><td>一個被帶來的聲音<\/td><td>φέρω 在本段第一次出現<\/td><\/tr><tr><td>ὑπὸ τῆς μεγαλοπρεποῦς δόξης<\/td><td>hypo tēs megaloprepous doxēs<\/td><td>從那威嚴的榮耀<\/td><td>μεγαλοπρεπής 新約僅此一次；不直呼神名<\/td><\/tr><tr><td>Ὁ υἱός μου ὁ ἀγαπητός μου<\/td><td>Ho huios mou ho agapētos mou<\/td><td>我的兒子，我所愛的<\/td><td>兩個「我的」<\/td><\/tr><tr><td>ἐν τῷ ἁγίῳ ὄρει<\/td><td>en tō hagiō orei<\/td><td>在那聖山上<\/td><td>山不具名；聖，是因為神在那裡說話<\/td><\/tr><\/table>","gram":"<p><strong>1:17 以分詞 λαβὼν（labōn，他領受了）起頭，句子卻沒有寫完。<\/strong>中間插進天父的話，1:18 換成「我們聽見」，文法上叫破格（anacoluthon）。一個老人講到一生最重要的一刻，句子斷了，正是口述的樣子。<\/p><p>天父的話和對觀福音不完全相同。SBLGNT 作 Ὁ υἱός μου ὁ ἀγαπητός μου οὗτός ἐστιν（Ho huios mou ho agapētos mou houtos estin），有兩個 μου（mou），而且沒有「你們要聽他」（太 17:5；可 9:7；路 9:35）。有人說這是獨立的記憶，不是抄福音書；有人說彼得只取他要證明 1:16 的那一句。兩說可以並存。φέρω（pherō）在本段出現兩次，ἐνεχθείσης（enechtheisēs）、ἐνεχθεῖσαν（enechtheisan），1:21 再出現兩次：聲音被帶下來，預言也是被帶出來的。<\/p>","exp":"<p>〔背景〕太 17:1--8；路 9:28--36（馬太福音講義第 17 章；路加福音講義第 9 章）<\/p><p>「他從父神得尊貴榮耀的時候，從極大榮光之中有聲音出來，向他說：「這是我的愛子，我所喜悅的。」」（1:17）福音書記下了那天彼得說的話：「主啊，我們在這裡真好！」他要搭三座棚。路加接著加了一句：「他卻不知道所說的是甚麼。」（路 9:33）<\/p><p>三十年過去，彼得在信裡完全沒有提自己說過甚麼，只記得一個聲音。<strong>一個人老了，會忘記自己說過多少話，卻忘不了神說過的那一句。<\/strong>他寫到這裡，句子斷了，插進天父的話，再接上「我們同他在聖山的時候，親自聽見這聲音從天上出來」（1:18）。像一個老人講到最要緊的地方，停了一下。<\/p><p>天父的宣告裡沒有一個字講門徒。尊貴榮耀是父給子的，不是彼得加給他的；那座山被稱為聖，也不是因為山高，是因為神在那裡說話。彼得記得的不是自己，是父對子的那一句。<\/p><p>耶穌是我的榜樣，可是榜樣首先不是一套規條，是一位被父喜悅的兒子。效法他以前，先聽見父怎樣稱呼他。今天晚上在病床邊、在加班後的捷運上打開聖經的人，也在聽同一個聲音：父喜悅這一位，也因這一位接納了你。<\/p>"},{"a":19,"z":19,"star":3,"grk":"<p lang=\"grc\">καὶ ἔχομεν βεβαιότερον τὸν προφητικὸν λόγον, ᾧ καλῶς ποιεῖτε προσέχοντες ὡς λύχνῳ φαίνοντι ἐν αὐχμηρῷ τόπῳ, ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ ἐν ταῖς καρδίαις ὑμῶν·<\/p>","lit":"<p>並且我們有那更加確實的先知之言；你們留心它，如同留心一盞在幽暗污濁之處發光的燈，是好的，直到白日透亮、晨星在你們心裡升起。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>βεβαιότερον τὸν προφητικὸν λόγον<\/td><td>bebaioteron ton prophētikon logon<\/td><td>更確的先知之言<\/td><td>比較級在冠詞前，述語位置<\/td><\/tr><tr><td>ὡς λύχνῳ φαίνοντι<\/td><td>hōs lychnō phainonti<\/td><td>如同發光的燈<\/td><td>只照腳前的一步<\/td><\/tr><tr><td>ἐν αὐχμηρῷ τόπῳ<\/td><td>en auchmērō topō<\/td><td>在乾枯幽暗之處<\/td><td>αὐχμηρός 新約僅此一次<\/td><\/tr><tr><td>ἕως οὗ ἡμέρα διαυγάσῃ<\/td><td>heōs hou hēmera diaugasē<\/td><td>直到白日透亮<\/td><td>主的日子；διαυγάζω 新約僅此一次<\/td><\/tr><tr><td>φωσφόρος ἀνατείλῃ<\/td><td>phōsphoros anateilē<\/td><td>帶光者升起<\/td><td>章題；φωσφόρος 新約僅此一次<\/td><\/tr><\/table>","gram":"<p><strong>βεβαιότερον（bebaioteron）是比較級，放在冠詞 τὸν（ton）前面，是述語位置。<\/strong>有三種讀法。一說先知的話比山上的經歷更可靠，經歷會過去，聖經長存；一說經歷使預言更確定：「我們有先知之言，如今更加確實了」，登山變像證實了舊約對彌賽亞榮耀的預言；也有人讀成絕對比較級，只是「非常確實」。上文剛講完山上的見證，接著說 καὶ ἔχομεν（kai echomen，並且我們有），本講義取第二讀：經歷證實了預言，預言解釋了經歷，兩者不是比高低。<\/p><p>ἕως οὗ ἡμέρα διαυγάσῃ καὶ φωσφόρος ἀνατείλῃ（heōs hou hēmera diaugasē kai phōsphoros anateilē）多數讀作主再來的那一日；φωσφόρος（phōsphoros）字面是「帶光者」，指基督。ἀνατέλλω（anatellō）是星辰升起的字，七十士譯本民 24:17「有星要出於雅各」同字。「在你們心裡」說明那日的光不只照在外面，也要照透人心；今天留意燈光的人，已經在預嘗那個早晨。<\/p>","exp":"<p>〔舊約〕民 24:17--17（民數記講義第 24 章）<\/p><p>「我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的」（1:19）。1:16–18 是彼得一生最高的一刻：親眼看見，親耳聽見。可是收信的人沒上過那座山，今天的我們也沒有。那怎麼辦？<\/p><p>彼得說：我們並有先知更確的預言。山上的經歷，叫先知的話更確定了；舊約說彌賽亞要得榮耀，三個門徒親眼看見了。<strong>你不必等到有同樣的經歷，因為那更確的話已經在你手裡。<\/strong><\/p><p>那話像一盞燈，照在「暗處」。原文不只是暗，是又乾又髒的地方，就是我們住的世界；第 2 章的假師傅、第 3 章好譏誚的人，都在這個地方。燈不是太陽，它不會把整個世界照亮，只照你腳前的一步；可是在天亮以前，它是唯一可靠的光。「留意」是一直看著，不是偶爾瞄一眼。<\/p><p>「直等到天發亮，晨星在你們心裡出現」。天亮是主再來的早晨，晨星是他自己，主說：「我是明亮的晨星。」（啟 22:16）那時燈可以放下了，因為光本人來了。<\/p><p>這是這一章的章題，也是全卷「星」的那一顆星。在異鄉的夜班之後、在醫院走廊的長椅上，不要丟下手中的燈去追一陣閃光。聖經是我的準則；準則不是棍子，是燈。<\/p>"},{"a":20,"z":21,"star":2,"grk":"<p lang=\"grc\">τοῦτο πρῶτον γινώσκοντες ὅτι πᾶσα προφητεία γραφῆς ἰδίας ἐπιλύσεως οὐ γίνεται·<\/p><p lang=\"grc\">οὐ γὰρ θελήματι ἀνθρώπου ἠνέχθη προφητεία ποτέ, ἀλλὰ ὑπὸ πνεύματος ἁγίου φερόμενοι ἐλάλησαν ἀπὸ θεοῦ ἄνθρωποι.<\/p>","lit":"<p>首先要知道這一件事：經上所有的預言，都不是出於自己的解開；<\/p><p>因為預言從來不是憑人的意思被帶出來的，乃是人被聖靈帶著，從神那裡說了話。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>πᾶσα προφητεία γραφῆς<\/td><td>pasa prophēteia graphēs<\/td><td>經上所有的預言<\/td><td>指已經寫成的經文<\/td><\/tr><tr><td>ἰδίας ἐπιλύσεως οὐ γίνεται<\/td><td>idias epilyseōs ou ginetai<\/td><td>不出於自己的解開<\/td><td>ἐπίλυσις 新約僅此一次<\/td><\/tr><tr><td>θελήματι ἀνθρώπου ἠνέχθη<\/td><td>thelēmati anthrōpou ēnechthē<\/td><td>憑人的意思被帶出<\/td><td>1:21 的「因為」說明 1:20<\/td><\/tr><tr><td>ὑπὸ πνεύματος ἁγίου φερόμενοι<\/td><td>hypo pneumatos hagiou pheromenoi<\/td><td>被聖靈帶著<\/td><td>徒 27:15、17 船被風颳去同字<\/td><\/tr><tr><td>ἐλάλησαν ἀπὸ θεοῦ ἄνθρωποι<\/td><td>elalēsan apo theou anthrōpoi<\/td><td>人從神那裡說了<\/td><td>主詞是人：人真實地說<\/td><\/tr><\/table>","gram":"<p><strong>ἰδίας ἐπιλύσεως οὐ γίνεται（idias epilyseōs ou ginetai）講的是預言的來源，還是讀者的解釋？<\/strong>一說是讀者：個人不可憑己意解經，需要教會的權威，天主教傳統常引此節；一說是來源：先知沒有憑自己去「解開」所見的異象，預言不是他自己推想出來的；也有人說兩者相連，既然出於聖靈，讀的人也需要同一位聖靈光照。1:21 以 γάρ（gar，因為）接續，說明的正是預言怎樣產生，γίνεται（ginetai）也是「產生、出現」。本講義取來源讀法：這節不是說只有牧師才能解經，也不是禁止信徒自己讀經。<\/p><p>ἠνέχθη（ēnechthē）與 φερόμενοι（pheromenoi）都是被動的 φέρω（pherō），主詞卻是 ἄνθρωποι（anthrōpoi）：人真實地說，推動的力量從神來，不是機械的口述。結尾有異文：SBLGNT 作 ἀπὸ θεοῦ（apo theou，從神那裡），有抄本作 ἅγιοι θεοῦ（hagioi theou，神的聖人），和合本「說出神的話來」近於前者。<\/p>","exp":"<p>〔彼前〕彼前 1:10--12（彼得前書講義第 1 章）<\/p><p>「第一要緊的，該知道經上所有的預言沒有可隨私意解說的」（1:20）。這是全卷最常被誤用的一節。有人拿它說：你不要自己讀經，會讀錯。可是看原文，彼得講的首先不是讀的人，是說話的先知：經上的預言不是先知自己「解開」的。他看見了，說出來的意思卻不是他自己推想的。<\/p><p>證據就在下一節的「因為」：「預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來」（1:21）。<strong>1:20 講來源，1:21 說明來源。<\/strong>「感動」原文是 1:17–18 那個「帶」的字。保羅坐船去羅馬遇上大風，「船被風抓住，敵不住風，我們就任風颳去」（徒 27:15），用的也是它。先知像一艘帆船：帆是他的，用字、性情、處境都是他的；風是聖靈的，方向是神的。<\/p><p>那讀經的人呢？既然經文不出於人意，讀的人也不可照私意扭曲它，第 3 章稱之為「強解」（3:16）。可是保護不是把聖經鎖起來，是三件事：在群體中讀，照上下文讀，謙卑地讀。彼得前書說，連眾先知也曾詳細尋求考察，在他們心裡的是基督的靈（彼前 1:10–11）。這一節怎樣讀才不被誤用，議題頁另有陳列。<\/p><p>那一位當初帶著先知說話的聖靈，今天也帶著讀經的人明白。聖靈是我的引導。打開你的聖經，不是一個人憑私意讀，是跟弟兄姊妹一起，在同一陣風裡讀。<\/p>"}],"2":[{"a":1,"z":1,"star":3,"grk":"<p lang=\"grc\">Ἐγένοντο δὲ καὶ ψευδοπροφῆται ἐν τῷ λαῷ, ὡς καὶ ἐν ὑμῖν ἔσονται ψευδοδιδάσκαλοι, οἵτινες παρεισάξουσιν αἱρέσεις ἀπωλείας, καὶ τὸν ἀγοράσαντα αὐτοὺς δεσπότην ἀρνούμενοι, ἐπάγοντες ἑαυτοῖς ταχινὴν ἀπώλειαν·<\/p>","lit":"<p>然而從前在百姓中也有假先知，照樣，在你們中間也將有假教師；他們要從旁偷偷帶進滅亡的派別，連買了他們的主人也否認，給自己招來迅速的滅亡。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ψευδοδιδάσκαλοι<\/td><td>pseudodidaskaloi<\/td><td>假的教師<\/td><td>新約僅此一次；與「假先知」成對<\/td><\/tr><tr><td>παρεισάξουσιν αἱρέσεις ἀπωλείας<\/td><td>pareisaxousin haireseis apōleias<\/td><td>要從旁帶進滅亡的派別<\/td><td>夾帶，不是公開唱反調<\/td><\/tr><tr><td>τὸν ἀγοράσαντα αὐτοὺς δεσπότην<\/td><td>ton agorasanta autous despotēn<\/td><td>那買了他們的主人<\/td><td>奴隸市場的字：付了價、有產權<\/td><\/tr><tr><td>ἀρνούμενοι<\/td><td>arnoumenoi<\/td><td>否認著<\/td><td>院子裡三次不認主的字（路 22:57）<\/td><\/tr><tr><td>ταχινὴν ἀπώλειαν<\/td><td>tachinēn apōleian<\/td><td>迅速的滅亡<\/td><td>1:14「快到了」同一個形容詞<\/td><\/tr><\/table>","gram":"<p><strong>2:1 用歷史作模子，用未來式說預言。<\/strong>Ἐγένοντο（Egenonto） 是不定過去式，回看以色列「從前」的假先知；ἔσονται（esontai） 與 παρεισάξουσιν（pareisaxousin） 轉成未來式，是遺言的口吻：我走了以後必有。到了 2:10 以後，彼得多半改用現在式描寫他們，預言已經在讀者眼前發生。ὡς καὶ（hōs kai）「照樣」把兩個時代並排。ψευδοδιδάσκαλοι（pseudodidaskaloi） 新約只出現這一次，他們冒充的是「教」的職分。<\/p><p>αἱρέσεις（haireseis） 出自 αἱρέομαι（haireomai）「選擇」，在林前 11:19、加 5:20 是「分門結黨」，到二世紀才成為「異端」的專門術語；這裡加上 ἀπωλείας（apōleias）「滅亡的」，已經不是中性的意見不同。τὸν ἀγοράσαντα αὐτοὺς δεσπότην（ton agorasanta autous despotēn） 是本節最重的片語：δεσπότης（despotēs） 是對奴僕有產權的主人，ἀγοράζω（agorazō） 是在市場上買下。基督為誰付了價，改革宗與衛斯理傳統讀法不同（議題頁 ISS02_2）；本講義不在這一節裁決救贖的範圍，只看彼得要量的是罪有多深：他們否認的，是一位付了價的主人。<\/p>","exp":"<p>〔背景〕路 22:54--62；約 21:15--17（路加福音講義第 22 章；約翰福音講義第 21 章）<\/p><p>〔猶〕猶 4--4（猶大書講義尚未製作）<\/p><p>「從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認，自取速速地滅亡。」（2:1）第 1 章結束在「先知更確的預言」（1:19）。真先知講完，彼得立刻說：有真的，就有假的。以色列的歷史裡有過，你們中間也必有。<\/p><p>「在你們中間」是第一個要停下來看的詞。危險不是從外面攻城，是從裡面長出來。「私自引進」是夾帶：不舉旗反對，只在真道旁邊塞進一樣東西。所以假師傅很少自稱是假的，他們講許多對的話，只在要緊的地方換掉主人。<\/p><p>換掉的是甚麼？「連買他們的主他們也不承認」。主用自己的血付了價（彼前 1:18--19），他們卻用嘴或用生活說：我不屬於誰。寫下「不承認」這個字的人，自己在大祭司的院子裡用過它三次。彼得與假師傅的分別，不在他從來沒有否認過，在於主轉過身來看他，他出去痛哭，後來在海邊被主一句一句問回來。所以這一章的嚴厲，是一個被拉回來的人看見別人往下走時的呼喊，不是完美的人居高臨下。<\/p><p>這一節教的是記號，不是名單。講台不替今天任何牧者、教會或宗派貼上「假師傅」的標籤；分辨先從自己開始：我口稱的主，是不是我生活裡真正付了價、有產權的那一位？謙卑戰勝驕傲，就是講假師傅的時候，自己不變成法利賽人。<\/p>"},{"a":2,"z":3,"star":1,"grk":"<p lang=\"grc\">καὶ πολλοὶ ἐξακολουθήσουσιν αὐτῶν ταῖς ἀσελγείαις, δι’ οὓς ἡ ὁδὸς τῆς ἀληθείας βλασφημηθήσεται·<\/p><p lang=\"grc\">καὶ ἐν πλεονεξίᾳ πλαστοῖς λόγοις ὑμᾶς ἐμπορεύσονται· οἷς τὸ κρίμα ἔκπαλαι οὐκ ἀργεῖ, καὶ ἡ ἀπώλεια αὐτῶν οὐ νυστάζει.<\/p>","lit":"<p>並且許多人要緊緊跟從他們的種種放蕩，真理的道路要因他們被毀謗；<\/p><p>他們又在貪婪中，用捏造的話拿你們做買賣。對他們的判決自古以來沒有閒著，他們的滅亡也沒有打盹。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἐξακολουθήσουσιν<\/td><td>exakolouthēsousin<\/td><td>要緊跟到底<\/td><td>門徒「跟從」的字，跟錯了人<\/td><\/tr><tr><td>ἡ ὁδὸς τῆς ἀληθείας<\/td><td>hē hodos tēs alētheias<\/td><td>真理的道路<\/td><td>本章「路」的第一站<\/td><\/tr><tr><td>πλαστοῖς λόγοις<\/td><td>plastois logois<\/td><td>捏塑出來的話<\/td><td>新約僅此一次；對照 1:16<\/td><\/tr><tr><td>ὑμᾶς ἐμπορεύσονται<\/td><td>hymas emporeusontai<\/td><td>拿你們做買賣<\/td><td>受詞是「你們」：人成了貨<\/td><\/tr><tr><td>οὐκ ἀργεῖ……οὐ νυστάζει<\/td><td>ouk argei … ou nystazei<\/td><td>沒有閒著……沒有打盹<\/td><td>擬人：審判一直醒著<\/td><\/tr><\/table>","gram":"<p><strong>2:3 的受詞是「你們」。<\/strong>ἐμπορεύσονται（emporeusontai） 是經商、做買賣，約 2:16 主說「不要將我父的殿當作買賣的地方」，用的是同字根的 ἐμπορίου（emporiou）。這裡它直接帶受詞 ὑμᾶς（hymas）：不只是藉你們賺錢，是把你們當成貨。方法是 πλαστοῖς λόγοις（plastois logois），πλαστός（plastos） 從 πλάσσω（plassō）「捏塑」來，是陶匠捏泥的字；動機是 ἐν πλεονεξίᾳ（en pleonexia），πλέον（pleon） 加 ἔχω（echō），「想要更多」。1:16 的「乖巧捏造的虛言」原文是 σεσοφισμένοις μύθοις（sesophismenois mythois），和合本兩處都用「捏造」，原文卻是兩個字：一個是編出來的故事，一個是照人要的形狀捏出來的話。<\/p><p>句末兩個否定句都是擬人。ἀργέω（argeō） 由否定字首 ἀ-（a-） 與 ἔργον（ergon）「工作」組成，是「閒著」；νυστάζω（nystazō） 是太 25:5 童女「打盹」的字。ἔκπαλαι（ekpalai）「自古以來」先把 2:4--8 的三個例子預告出來。2:2 的 ἀσελγείαις（aselgeiais）「放蕩」，TR 作 ἀπωλείαις（apōleiais），SBLGNT 與和合本都取「放蕩」。<\/p>","exp":"<p>〔猶〕猶 4--4；猶 11--11；猶 16--16（猶大書講義尚未製作）<\/p><p>「將有許多人隨從他們邪淫的行為，便叫真道因他們的緣故被毀謗。」（2:2）假師傅最危險的地方，常常是他們很成功。「隨從」本是門徒跟從主的字，前面加上一個字首，成了緊跟到底。人跟著跑，因為放縱有市場。結果是「真道」被毀謗。原文是「真理的道路」：外人分不出誰真誰假，只看見一群自稱跟從耶穌的人怎樣生活，罵的就是這條路。<\/p><p>「他們因有貪心，要用捏造的言語在你們身上取利。」（2:3）一句話裡有動機、方法、目的：想要更多，照聽眾要的形狀捏話，拿人做買賣。最刺眼的是「你們」：在這種講台下，會眾不是要牧養的羊，是貨架上的貨。這正好和 1:16 對照：使徒傳的「並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」。真見證不必捏。<\/p><p>讀者看見假師傅風生水起，難免以為神在睡覺。彼得說：「他們的刑罰，自古以來並不遲延；他們的滅亡也必速速來到。」原文的畫面更尖：審判沒有閒著，滅亡沒有打盹。這是第 3 章「主所應許的尚未成就，有人以為他是耽延，其實不是耽延」（3:9）的伏筆：看起來沒有動靜，不等於神不在。<\/p><p>落到今天，對 2:3 最要緊的回應不是在網路上點名，是教會自己財務透明、講台不賣應許（議題頁 ISS02_3）。也回頭問自己：我愛聽某一種講道，是因為它是真的，還是因為它照我想要的形狀捏？<\/p>"},{"a":4,"z":4,"star":2,"grk":"<p lang=\"grc\">Εἰ γὰρ ὁ θεὸς ἀγγέλων ἁμαρτησάντων οὐκ ἐφείσατο, ἀλλὰ σειραῖς ζόφου ταρταρώσας παρέδωκεν εἰς κρίσιν τηρουμένους,<\/p>","lit":"<p>因為神若沒有放過犯了罪的天使，反而把他們丟進塔耳塔羅斯，交在幽暗的鎖鍊裡，被看守著等候審判；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀγγέλων ἁμαρτησάντων<\/td><td>angelōn hamartēsantōn<\/td><td>犯了罪的天使<\/td><td>沒有冠詞，也沒有交代是哪一次<\/td><\/tr><tr><td>οὐκ ἐφείσατο<\/td><td>ouk epheisato<\/td><td>沒有放過<\/td><td>2:4、2:5 兩次<\/td><\/tr><tr><td>ταρταρώσας<\/td><td>tartarōsas<\/td><td>丟進塔耳塔羅斯<\/td><td>新約僅此一次<\/td><\/tr><tr><td>σειραῖς ζόφου<\/td><td>seirais zophou<\/td><td>幽暗的鎖鍊<\/td><td>異文 σιροῖς「坑」，和合本從之<\/td><\/tr><tr><td>εἰς κρίσιν τηρουμένους<\/td><td>eis krisin tēroumenous<\/td><td>被看守著等候審判<\/td><td>2:9 同一個「看守」<\/td><\/tr><\/table>","gram":"<p><strong>2:4 是一個長句的第一口氣。<\/strong>Εἰ γὰρ（Ei gar）「因為若」帶出的條件句，一路經過 2:5 的挪亞、2:6--8 的所多瑪與羅得，要到 2:9 才說出結論，所以 2:4 不能單獨讀。ταρταρώσας（tartarōsas） 是從 Τάρταρος（Tartaros） 造出來的動詞，新約只此一次；希臘人用它稱最深的拘禁之處。彼得借讀者熟悉的字講一個真實的拘禁，像保羅在雅典引希臘詩人（徒 17:28），借字不等於接受那套神話。<\/p><p>σειραῖς ζόφου（seirais zophou） 有異文。σειραῖς（seirais） 是陰性名詞 σειρά（seira）「鎖鍊、繩索」，NA28 與拜占庭抄本作此，和猶 6「用鎖鍊把他們永遠拘留」相合；幾份古大楷抄本作 σιροῖς（sirois） 或 σειροῖς（seirois），是陽性名詞 σιρός（siros）「坑、地窖」，WH 取這一讀，和合本「交在黑暗坑中」也照它。大楷寫作 ΣΕΙΡΑΙΣ 與 ΣΙΡΟΙΣ，相差兩處：ΕΙ 與 Ι 當時讀音相同，字尾的 Α 與 Ο 又只差一筆，抄寫時很容易互換，但它們是兩個不同的名詞。本講義原文欄作 σειραῖς（seirais），中文照和合本；兩讀都是拘禁、幽暗、等候審判，不影響任何教義。<\/p>","exp":"<p>〔舊約〕創 6:1--4（創世記講義第 6 章）<\/p><p>〔猶〕猶 6--6（猶大書講義尚未製作）<\/p><p>「就是天使犯了罪，神也沒有寬容，曾把他們丟在地獄，交在黑暗坑中，等候審判。」（2:4）2:3 說審判沒有打盹，2:4 立刻舉出第一個例子，而且從最高處舉起：連天使都沒有被放過。天使比人更有能力，也更靠近神。假師傅再有恩賜、再有影響力，也比不上天使；審判不看身分，不看恩賜，不看跟從的人有多少。<\/p><p>犯罪的天使是誰，彼得沒有說。他的次序是天使、洪水、所多瑪，正是創世記 6 章、6--8 章、19 章的次序；第二聖殿時期的猶太文獻，例如以諾一書，把創 6:1--4「神的兒子們」讀成天使，猶大書也在這個背景裡寫。彼得借用讀者熟悉的背景，卻沒有把以諾一書當成聖經，也沒有交代天使怎樣犯罪、塔耳塔羅斯在哪裡。這些可以在書房裡謹慎研究（議題頁 ISS02_4），講台不必變成天使學講座。<\/p><p>他要讀者帶走的是兩個字：「等候」。犯罪的天使現在被看守著，判決還沒有最後執行，但沒有一個逃得掉。這個「看守」的字在 2:9 會再出現，那時看守的是主，被搭救的是敬虔的人。<\/p><p>所以讀到這裡不必害怕。這個以「若」開頭的長句，終點不是坑，是 2:9 的「主知道搭救」。認真看待審判的人，正好最能安心把審判交給神：不必替神清理門戶，只要守住自己的本位。<\/p>"},{"a":5,"z":5,"star":1,"grk":"<p lang=\"grc\">καὶ ἀρχαίου κόσμου οὐκ ἐφείσατο, ἀλλὰ ὄγδοον Νῶε δικαιοσύνης κήρυκα ἐφύλαξεν, κατακλυσμὸν κόσμῳ ἀσεβῶν ἐπάξας,<\/p>","lit":"<p>又沒有放過古時的世界，卻保護了挪亞，就是八人中的一位、義的傳令官，那時他使洪水臨到不敬虔之人的世界；<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>ἀρχαίου κόσμου<\/td><td>archaiou kosmou<\/td><td>古時的世界<\/td><td>3:6「當時的世界」被水淹沒<\/td><\/tr><tr><td>ὄγδοον Νῶε<\/td><td>ogdoon Nōe<\/td><td>第八個挪亞<\/td><td>慣用語：挪亞連同另外七人<\/td><\/tr><tr><td>δικαιοσύνης κήρυκα<\/td><td>dikaiosynēs kēryka<\/td><td>義的傳令官<\/td><td>替王宣告命令的人<\/td><\/tr><tr><td>ἐφύλαξεν<\/td><td>ephylaxen<\/td><td>看守、保護了<\/td><td>與 2:4 被看守等審判對照<\/td><\/tr><tr><td>κατακλυσμὸν……ἐπάξας<\/td><td>kataklysmon … epaxas<\/td><td>使洪水臨到<\/td><td>太 24:39 主用同字講他的再來<\/td><\/tr><\/table>","gram":"<p><strong>本章第一次出現「沒有寬容……卻保護」。<\/strong>οὐκ ἐφείσατο（ouk epheisato）……ἀλλὰ（alla）……ἐφύλαξεν（ephylaxen） 是一組對照：審判臨到整個世界，保護臨到一條船。2:4 只有審判，2:5 開始在審判裡放進一個被保守的人，2:7 再放一個，2:9 把它說成原則。ἐπάξας（epaxas） 與 2:1 的 ἐπάγοντες（epagontes） 是同一個動詞 ἐπάγω（epagō）「帶來」：假師傅給自己帶來滅亡，神給不敬虔的世界帶來洪水。<\/p><p>ὄγδοον Νῶε（ogdoon Nōe） 字面是「第八個挪亞」，是古希臘的慣用說法：某人「是第八個」，意思是他和另外七個人在一起。和合本意譯「一家八口」，正與彼前 3:20「只有八個人」相合。κῆρυξ（kēryx） 是傳令官。創世記沒有記載挪亞講道，猶太傳統與早期教會都說他曾勸那世代悔改；來 11:7 說他預備方舟，「因此就定了那世代的罪」。本講義兩者並取：他的話與他的木槌，是同一篇講道。<\/p>","exp":"<p>〔舊約〕創 6:5--8:22（創世記講義第 6--8 章）<\/p><p>〔彼前〕彼前 3:20--20（彼得前書講義第 3 章）<\/p><p>「神也沒有寬容上古的世代，曾叫洪水臨到那不敬虔的世代，卻保護了傳義道的挪亞一家八口。」（2:5）第二個例子比第一個規模更大，整個世界都在審判之下。但句子多了一個轉折：「卻保護了」。從這裡開始，第 2 章的審判裡都藏著一個被保守的人，彼得正一步一步走向 2:9。<\/p><p>挪亞被稱為「傳義道的」，原文是傳令官。古代城邦的傳令官站在廣場上替王宣告，說的不是自己的意見。挪亞在一個不敬虔的世代替神宣告義，結果，聖經沒有記載家族以外有任何人回應。用今天的數字看，他是一位很失敗的傳道人；神卻稱他為義的傳令官，並且親自看守他。<\/p><p>同一個挪亞，彼得在前一封信也寫過：神容忍等待的時候，「只有八個人」（彼前 3:20）。那一封講神的忍耐與洗禮，這一封講審判中的保守。兩封放在一起看：神的忍耐在洪水前等了很久，神的保護在洪水中沒有失手。<\/p><p>在一個不敬虔的世代裡忠心，可能長久看不見果效。挪亞的價值不是用聽眾人數量的，是用「神看守了他」來量的。我們被呼召的是忠心傳義，保護與結果是主的事。<\/p>"},{"a":6,"z":8,"star":2,"grk":"<p lang=\"grc\">καὶ πόλεις Σοδόμων καὶ Γομόρρας τεφρώσας καταστροφῇ κατέκρινεν, ὑπόδειγμα μελλόντων ἀσεβέσιν τεθεικώς,<\/p><p lang=\"grc\">καὶ δίκαιον Λὼτ καταπονούμενον ὑπὸ τῆς τῶν ἀθέσμων ἐν ἀσελγείᾳ ἀναστροφῆς ἐρρύσατο·<\/p><p lang=\"grc\">βλέμματι γὰρ καὶ ἀκοῇ ὁ δίκαιος ἐγκατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν·<\/p>","lit":"<p>又把所多瑪和蛾摩拉的城燒成灰，用傾覆定了它們的罪，立作將來不敬虔之人的鑒戒；<\/p><p>又救出了義人羅得，他被那些無法無天之人放蕩的生活壓得疲憊不堪；<\/p><p>因為那義人住在他們中間，眼所見、耳所聞，日復一日因他們不法的行為，使自己義的心靈受折磨。<\/p>","key":"<table><tr><th>原文<\/th><th>音譯<\/th><th>字面<\/th><th>在這裡<\/th><\/tr><tr><td>τεφρώσας<\/td><td>tephrōsas<\/td><td>燒成灰<\/td><td>新約僅此一次<\/td><\/tr><tr><td>ὑπόδειγμα……τεθεικώς<\/td><td>hypodeigma … tetheikōs<\/td><td>立為樣本<\/td><td>完成式：至今仍立著<\/td><\/tr><tr><td>δίκαιον Λὼτ<\/td><td>dikaion Lōt<\/td><td>義人羅得<\/td><td>三節裡三次「義」<\/td><\/tr><tr><td>ἐρρύσατο<\/td><td>errysato<\/td><td>拉出來、救出了<\/td><td>2:9 ῥύεσθαι 同字<\/td><\/tr><tr><td>ψυχὴν δικαίαν……ἐβασάνιζεν<\/td><td>psychēn dikaian … ebasanizen<\/td><td>使義的心靈受折磨<\/td><td>未完成式：天天如此<\/td><\/tr><\/table>","gram":"<p><strong>2:7 的動詞把羅得接到 2:9。<\/strong>ἐρρύσατο（errysato） 是 ῥύομαι（rhyomai）「拉出來、救脫」的不定過去式，2:9 的 ῥύεσθαι（rhyesthai） 是同一個字：羅得是 2:9 原則的實例，原則是羅得故事的結論。2:6 的 τεφρώσας（tephrōsas）「燒成灰」新約只此一次；ὑπόδειγμα（hypodeigma） 是擺在眼前的樣本，配上完成式 τεθεικώς（tetheikōs），那堆灰至今還立在那裡給人看。2:6 句末 SBLGNT 作 ἀσεβέσιν（asebesin）「給不敬虔的人」，另有抄本作 ἀσεβεῖν（asebein）「將要行不敬虔的」，意思相近。<\/p><p>2:8 的 ἐβασάνιζεν（ebasanizen） 是未完成式，表示天天反覆；主詞是 ὁ δίκαιος（ho dikaios）「那義人」，受詞是 ψυχὴν δικαίαν（psychēn dikaian）「義的心靈」，字面是「他因不法的事折磨自己義的心靈」。βάσανος（basanos） 原是試金石，後來指刑具。βλέμματι…
