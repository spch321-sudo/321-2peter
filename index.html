ατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν·<\/p><\/blockquote>","lit":"<blockquote><p>「又把所多玛和蛾摩拉的城烧成灰，用倾覆定了它们的罪，立为将来不敬虔之人的鉴戒；又救出了义人罗得——他被那些无法无天之人放荡的生活磨得疲惫不堪；因为那义人住在他们中间，眼所见、耳所闻，日复一日因他们不法的行为，使自己义的灵魂受折磨。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>焚烧成灰<\/td><td>τεφρώσας<\/td><td>tephrōsas<\/td><td>G5077<\/td><td>τέφρα（灰）<\/td><td>化为灰烬<\/td><td>新约仅此一次<\/td><\/tr><tr><td>鉴戒<\/td><td>ὑπόδειγμα<\/td><td>hypodeigma<\/td><td>G5262<\/td><td>ὑπό＋δείκνυμι<\/td><td>样本、示范<\/td><td>摆在眼前的样本；完成式 τεθεικώς：至今仍立着<\/td><\/tr><tr><td>忧伤<\/td><td>καταπονούμενον<\/td><td>kataponoumenon<\/td><td>G2669<\/td><td>κατά＋πονέω<\/td><td>被压得疲惫<\/td><td>现在分词：长期被磨<\/td><\/tr><tr><td>恶人<\/td><td>ἀθέσμων<\/td><td>athesmōn<\/td><td>G113<\/td><td>ἀ＋θεσμός（规范）<\/td><td>无法无天的<\/td><td>2:7 与 3:17 两次，都指不守规范的人<\/td><\/tr><tr><td>搭救<\/td><td>ἐρρύσατο<\/td><td>errysato<\/td><td>G4506<\/td><td>—<\/td><td>拉出来、救出<\/td><td>与 2:9 ῥύεσθαι 同字：罗得是 2:9 的实例<\/td><\/tr><tr><td>住<\/td><td>ἐγκατοικῶν<\/td><td>enkatoikōn<\/td><td>G1460<\/td><td>ἐν＋κατά＋οἰκέω<\/td><td>住在里面<\/td><td>新约仅此一次；与 3:13「有义居在其中」对照<\/td><\/tr><tr><td>伤痛<\/td><td>ἐβασάνιζεν<\/td><td>ebasanizen<\/td><td>G928<\/td><td>βάσανος（试金石）<\/td><td>折磨、受苦<\/td><td>未完成式：天天如此<\/td><\/tr><\/table>","gram":"<p><strong>① 创世记 19 章的罗得，为什么被称为「义人」？<\/strong><\/p><ul><li><strong>相对的义<\/strong>：比起所多玛人，他接待客人、保护客人（创 19:1–3）。<\/li><li><strong>被算为义、因怜恤得救<\/strong>：他蒙救是因为亚伯拉罕代求、神记念亚伯拉罕（创 18:23–32；19:29），也因为他迟延时天使拉着他的手（创 19:16）。<\/li><li><strong>承接犹太传统<\/strong>：所罗门智训 10:6 已称罗得为「义人」，彼得沿用读者熟悉的称呼。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得自己在 2:8 下了定义：他的义心「天天伤痛」。创 19 章的罗得并不光彩——选了所多玛、提议把女儿交出去、迟延不走、后来醉酒——彼得没有否认这些。罗得的「义」不是完美，是一颗没有被所多玛磨平的心；而他蒙救的主词是神，那是恩典。<\/strong><\/p><\/blockquote><p><strong>② ἐβασάνιζεν 的语态<\/strong>：主动语态，主词是「那义人」，受词是「义的灵魂」，ἀνόμοις ἔργοις 是工具或原因——字面是「他因不法的事折磨自己义的灵魂」。和合本「他的义心就天天伤痛」把意思译得很准：痛来自他还在乎。<\/p><p><strong>③ 异文<\/strong>：2:6 SBLGNT 作 ἀσεβέσιν（给不敬虔的人），TR 作 ἀσεβεῖν（将来要行不敬虔的）；意思相近。<\/p>","exp":"<p><strong>义不是完美，是一颗还会伤痛的心。<\/strong><\/p><p>第三个例子是所多玛和蛾摩拉。两座城被烧成灰（τεφρώσας），立为「后世不敬虔人的鉴戒」——ὑπόδειγμα 是摆在眼前的样本，像店门口的样品，提醒所有经过的人。但同一句话里，神「只搭救了」罗得。<\/p><p>熟悉创世记的人会皱眉：罗得？他看见平原滋润就选了所多玛，在城门口坐上位子，危急时提议把女儿交出去，天使催他时「迟延不走」，最后在山洞里醉倒。彼得怎能称他为「义人」，而且一连三次？<\/p><p>彼得的答案在 2:8：「他的义心就天天伤痛。」ἐβασάνιζεν 是未完成式，天天如此；βάσανος 原是试金石，后来指刑具。罗得每天看见、听见，每天心里被刺一下。他没有能力改变那座城，也没有勇气离开，但他的心还没有麻木。在一座把罪当日常的城里，他是唯一还会痛的人。<\/p><p>而且他蒙救不是因为他够好。创世记说，他迟延时天使拉着他的手领出城外，神记念了亚伯拉罕。2:7「搭救」的主词是神——这就是恩典。讲台不必把罗得美化成榜样，也不该嘲笑他；他是住错了地方、却仍被主拉出来的人。<\/p><p>落到今天：许多人也住在所多玛中间——在荧幕里、在办公室里、在饭局上。危险不在于看见，而在于看久了不痛。还会痛，就还有义心；若已经不痛了，求主再把那份痛还给我们。<\/p><p>〔旧约〕创世记讲义第 19 章（创 18:16–19:29）。〔犹〕犹 7（犹大书讲义尚未制作）。<\/p>"},{"a":9,"z":9,"star":3,"grk":"<blockquote lang=\"grc\"><p>οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,<\/p><\/blockquote>","lit":"<blockquote><p>「那么，主懂得怎样把敬虔的人从试炼之中拉出来，也懂得怎样把不义的人看守在刑罚之下，直到审判的日子；」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>知道<\/td><td>οἶδεν<\/td><td>oiden<\/td><td>G1492<\/td><td>—<\/td><td>知道、懂得<\/td><td>加不定词＝「懂得怎样」：不只知道，而且会做<\/td><\/tr><tr><td>主<\/td><td>κύριος<\/td><td>kyrios<\/td><td>G2962<\/td><td>—<\/td><td>主<\/td><td>无冠词的称号；搭救的主动权在主，不在我们<\/td><\/tr><tr><td>敬虔的人<\/td><td>εὐσεβεῖς<\/td><td>eusebeis<\/td><td>G2152<\/td><td>εὖ＋σέβομαι<\/td><td>敬虔的<\/td><td>1:3、1:6–7、3:11「虔敬」家族<\/td><\/tr><tr><td>试探<\/td><td>πειρασμοῦ<\/td><td>peirasmou<\/td><td>G3986<\/td><td>πειράζω<\/td><td>试验、试探<\/td><td>不只是诱惑，也是压力与困境（挪亚的世代、罗得的城）<\/td><\/tr><tr><td>搭救<\/td><td>ῥύεσθαι<\/td><td>rhyesthai<\/td><td>G4506<\/td><td>—<\/td><td>拉出来、救脱<\/td><td>★全章解经钥匙：2:7 的实例化成原则；太 6:13「救我们脱离凶恶」同字<\/td><\/tr><tr><td>刑罚<\/td><td>κολαζομένους<\/td><td>kolazomenous<\/td><td>G2849<\/td><td>κόλασις<\/td><td>惩罚<\/td><td>现在被动分词（见语法）<\/td><\/tr><tr><td>留<\/td><td>τηρεῖν<\/td><td>tērein<\/td><td>G5083<\/td><td>—<\/td><td>看守、保留<\/td><td>2:4、2:17 同字：审判也在主的看守之中<\/td><\/tr><\/table>","gram":"<p><strong>① 全章最长的句子，在这里落地<\/strong><\/p><p>2:4–10a 是一个条件句：前句（protasis）是三个「若」——若神没有宽容天使（2:4）、没有宽容上古世代却保护挪亚（2:5）、倾覆所多玛却搭救罗得（2:6–8）；后句（apodosis）就是 2:9。<strong>审判在条件子句里，搭救在主要子句里<\/strong>，而且搭救排在前面。<\/p><p><strong>② οἶδεν ＋不定词<\/strong>：οἶδα 接不定词，意思是「懂得怎样、会做」（太 7:11「你们……尚且知道拿好东西给儿女」同一结构）。<\/p><p><strong>③ κολαζομένους 的时间<\/strong><\/p><ul><li><strong>现在已在刑罚中被看守<\/strong>：不义的人现在就在受罚，直到审判之日（多数新近英译）。<\/li><li><strong>被保留到审判之日受罚<\/strong>：现在分词带未来意义（和合本「留在刑罚之下，等候审判的日子」与许多译本）。<\/li><\/ul><blockquote><p><strong>最好的理解：文法上两读都可能；彼得的重点不是死后的时间表，而是两种看守都在主手里——他看守敬虔的人得救，也看守不义的人直到审判，没有一件事从他手中滑掉。<\/strong><\/p><\/blockquote><p><strong>④ ἐκ πειρασμοῦ<\/strong>：「从试炼之中」救出，而不是「保证不进入试炼」。挪亚在洪水中、罗得在城里，主把他们从里面拉出来。<\/p><blockquote><p><strong>最好的理解：2:9 是全卷枢纽：彼得讲审判，是为了叫敬虔的人安心，不是为了叫他们害怕。<\/strong><\/p><\/blockquote>","exp":"<p><strong>全章最重的三个审判，原来都是为了讲出这一句：「主知道搭救敬虔的人。」<\/strong><\/p><p>读者被假师傅包围。他们很成功，跟从的人很多（2:2），审判看起来在睡觉（2:3）。彼得于是从 2:4 起写了一个很长的句子：若神没有宽容天使，若神没有宽容上古的世代却保护了挪亚，若神倾覆所多玛却搭救了罗得——那么，主知道搭救敬虔的人。三个审判里藏着两次搭救；这一长句的终点不是火，是一只伸出来的手。<\/p><p>οἶδεν 加不定词，是「懂得怎样」。主不只是知道你的处境，他懂得怎样把你拉出来。他拉挪亚用一条船，拉罗得用两位天使拉着手；方法各不相同，但他都懂。ἐκ πειρασμοῦ 是「从试炼里面」——不是保证你不进洪水、不住在所多玛旁边，而是在里面的时候把你拉出来；正如「神是信实的……在受试探的时候，总要给你们开一条出路」（林前 10:13）。ῥύομαι 正是主祷文「救我们脱离凶恶」的那个字。<\/p><p>老彼得写「主知道」，不能不想起加利利海边。三次不认主之后，他对复活的主说：「主啊，你是无所不知的；你知道我爱你。」（约 21:17）一个自己靠不住的人，被一位「知道」的主拉了回来。所以这一节不是彼得多坚强的见证，是主多恒久忍耐的见证。<\/p><p>这就决定了第 2 章怎么读：审判的经文不是用来吓人的，是用来叫敬虔的人安心的。今天若你被困在不义的人很得势的地方，这一节不是叫你去算计谁会受罚，而是叫你把眼睛从他们身上移回主身上。搭救是主的事，审判也是主的事；我们的本位是敬虔。321 说谦卑是放下权力回到本位——让神作神：他审判，他搭救，我们只管跟着他走。<\/p><p>〔背景〕彼得的回头（路 22:31–32；约 21:15–17）。〔彼前〕彼得前书讲义第 5 章（5:10 必要亲自坚固你们）。<\/p>"},{"a":10,"z":11,"star":2,"grk":"<blockquote lang=\"grc\"><p>μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταὶ αὐθάδεις, δόξας οὐ τρέμουσιν βλασφημοῦντες, ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ αὐτῶν παρὰ κυρίῳ βλάσφημον κρίσιν.<\/p><\/blockquote>","lit":"<blockquote><p>「尤其是那些跟在肉体后面、在污秽的私欲中行走、又藐视主权的人。他们胆大妄为、自以为是，毁谤那些荣耀者也不战兢；然而天使虽然在力量和能力上更大，也不在主面前带着毁谤的判词控告他们。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>污秽<\/td><td>μιασμοῦ<\/td><td>miasmou<\/td><td>G3394<\/td><td>μιαίνω<\/td><td>玷污<\/td><td>新约仅此一次<\/td><\/tr><tr><td>主治的<\/td><td>κυριότητος<\/td><td>kyriotētos<\/td><td>G2963<\/td><td>κύριος<\/td><td>主权、统治<\/td><td>单数抽象名词（见语法）<\/td><\/tr><tr><td>轻慢<\/td><td>καταφρονοῦντας<\/td><td>kataphronountas<\/td><td>G2706<\/td><td>κατά＋φρονέω<\/td><td>看不起<\/td><td>往下看：把权柄踩在脚下<\/td><\/tr><tr><td>胆大<\/td><td>τολμηταί<\/td><td>tolmētai<\/td><td>G5113<\/td><td>τολμάω<\/td><td>胆大妄为的人<\/td><td>新约仅此一次<\/td><\/tr><tr><td>任性<\/td><td>αὐθάδεις<\/td><td>authadeis<\/td><td>G829<\/td><td>αὐτός＋ἁνδάνω（取悦）<\/td><td>自我取悦、刚愎<\/td><td>「有己」的希腊字；多 1:7 监督「不任性」同字<\/td><\/tr><tr><td>在尊位的<\/td><td>δόξας<\/td><td>doxas<\/td><td>G1391<\/td><td>—<\/td><td>荣耀、荣耀者<\/td><td>复数：天上的荣耀者（见语法）<\/td><\/tr><tr><td>毁谤的<\/td><td>βλάσφημον<\/td><td>blasphēmon<\/td><td>G989<\/td><td>—<\/td><td>毁谤的<\/td><td>天使不带「毁谤的判词」<\/td><\/tr><\/table>","gram":"<p><strong>① κυριότητος——「主治的」是谁的权柄？<\/strong><\/p><ul><li><strong>主（神或基督）的主权<\/strong>：单数抽象名词，呼应 2:1「连买他们的主他们也不承认」与 2:1 的 δεσπότης。<\/li><li><strong>天上的权势<\/strong>：弗 1:21、西 1:16 的 κυριότης 是天使的等级之一。<\/li><li><strong>人间的权柄<\/strong>：教会领袖或政府。<\/li><\/ul><blockquote><p><strong>最好的理解：主的主权。单数、抽象，又紧接着 2:1 的「主」；「轻慢主治的」就是把主踩在脚下。这不是一节替人间权威护航的经文。<\/strong><\/p><\/blockquote><p><strong>② δόξας——「在尊位的」是谁？<\/strong><\/p><ul><li><strong>天上的荣耀者（天使，可能是堕落的）<\/strong>：2:11 的「他们」最自然回指 δόξας；犹 8–9 的平行经文中，天使长米迦勒与魔鬼争辩时，不敢用毁谤的话罪责他。<\/li><li><strong>教会或社会的领袖<\/strong>：以「荣耀」形容有地位的人。<\/li><\/ul><blockquote><p><strong>最好的理解：天上的荣耀者。假师傅随口毁谤他们不懂的属灵世界（2:12），连天使都不敢这样做；天使把审判交给主（παρὰ κυρίῳ）。<\/strong><\/p><\/blockquote><p><strong>③ 谁被定罪？<\/strong>第 2 章被定罪的正是「师傅」——有讲台、有跟从者、在上位的人（2:1–3）。所以 2:10 不能拿来堵住对领袖的正当质疑；彼得给长老的命令是「不是辖制」（彼前 5:3）。<\/p><p><strong>④ 异文<\/strong>：2:11 末尾有 παρὰ κυρίῳ（在主面前）、παρὰ κυρίου（从主而来）与省略三种读法；和合本「在主面前」。<\/p>","exp":"<p><strong>「任性」这个字，就是「有己」的希腊文。<\/strong><\/p><p>2:10 把 2:9「不义的人」具体化成两件事：随从肉身的污秽情欲，轻慢主治的。接着彼得给了一幅画像：τολμηταὶ αὐθάδεις——胆大、任性。τολμητής 是胆大到不知分寸；αὐθάδης 由「自己」和「取悦」组成，是以取悦自己为生活准绳的人。保罗要求监督「不任性」（多 1:7）用的就是这个字：最危险的任性，常常出现在有讲台的人身上。<\/p><p>他们毁谤「在尊位的」——最自然的读法是天上的荣耀者。2:11 立刻对照：天使力量权能更大，也不在主面前用毁谤的话控告他们。犹大书记载米迦勒与魔鬼争辩时，也只说「主责备你吧」。天使比假师傅强得多，却把审判留给主；假师傅比天使弱得多，却随口宣判他们不懂的属灵世界。这就是骄傲：离开本位，抓住只属于神的审判权。<\/p><p>这两节常被误用成：「你质疑牧师，就是轻慢主治的。」这不是经文的意思。第一，「主治的」最自然指主的权柄；第二，这一章被定罪的正是「师傅」——有讲台、有跟从者的人。彼得给长老的命令是：「也不是辖制所托付你们的，乃是作群羊的榜样」（彼前 5:3）。照真理、在爱中、按程序提出的质疑，不是毁谤；拒绝一切质疑的领袖，倒要先用 2:10 照照自己。<\/p><p>落到今天：任性先照自己——我在哪里只取悦自己？我在哪里急着替神宣判别人？无己战胜撒但：天使把审判交给主，我们也可以把那句想定人罪的话，交回主手里。<\/p><p>〔犹〕犹 8–10（犹大书讲义尚未制作）。〔彼前〕彼得前书讲义第 5 章（5:3 不是辖制）。<\/p>"},{"a":12,"z":14,"star":1,"grk":"<blockquote lang=\"grc\"><p>Οὗτοι δέ, ὡς ἄλογα ζῷα γεγεννημένα φυσικὰ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται, ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν, ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα·<\/p><\/blockquote>","lit":"<blockquote><p>「但这些人像没有理性的动物，生来只凭本能，为了被捉、被宰；他们毁谤自己所不明白的事，也必在那样的败坏中一同败坏，受亏损作为不义的工价。他们以白昼的奢华为享乐；他们是污点和瑕疵，与你们一同宴饮时，以他们的诡诈（或：爱筵）为乐；眼睛满了淫妇，止不住犯罪；向不坚固的灵魂下饵；心被操练惯了贪婪；是被咒诅的儿女。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>没有灵性<\/td><td>ἄλογα<\/td><td>aloga<\/td><td>G249<\/td><td>ἀ＋λόγος<\/td><td>没有理性的<\/td><td>与 2:16 驴「以人言」说话成强烈对照<\/td><\/tr><tr><td>败坏<\/td><td>φθορᾷ<\/td><td>phthora<\/td><td>G5356<\/td><td>φθείρω<\/td><td>败坏、毁灭<\/td><td>1:4、2:19 同一条线<\/td><\/tr><tr><td>诡诈<\/td><td>ἀπάταις<\/td><td>apatais<\/td><td>G539<\/td><td>ἀπατάω<\/td><td>欺骗<\/td><td>异文 ἀγάπαις（爱筵）<\/td><\/tr><tr><td>一同坐席<\/td><td>συνευωχούμενοι<\/td><td>syneuōchoumenoi<\/td><td>G4910<\/td><td>σύν＋εὐωχέω<\/td><td>一起宴饮<\/td><td>他们就坐在教会的桌边<\/td><\/tr><tr><td>止不住<\/td><td>ἀκαταπαύστους<\/td><td>akatapaustous<\/td><td>G180<\/td><td>ἀ＋καταπαύω<\/td><td>停不下来的<\/td><td>新约仅此一次<\/td><\/tr><tr><td>引诱<\/td><td>δελεάζοντες<\/td><td>deleazontes<\/td><td>G1185<\/td><td>δέλεαρ（饵）<\/td><td>下饵<\/td><td>渔夫的字；雅 1:14 同字<\/td><\/tr><tr><td>心不坚固<\/td><td>ἀστηρίκτους<\/td><td>astēriktous<\/td><td>G793<\/td><td>ἀ＋στηρίζω<\/td><td>没有扎稳的<\/td><td>主交给彼得「坚固」（路 22:32）的反面<\/td><\/tr><tr><td>习惯了<\/td><td>γεγυμνασμένην<\/td><td>gegymnasmenēn<\/td><td>G1128<\/td><td>γυμνάζω<\/td><td>操练过的<\/td><td>完成式：心被训练成贪婪<\/td><\/tr><\/table>","gram":"<p><strong>① 异文 ἀπάταις／ἀγάπαις<\/strong><\/p><ul><li><strong>ἀπάταις（诡诈）<\/strong>：SBLGNT 与多数抄本；和合本「以行诡诈为快乐」。<\/li><li><strong>ἀγάπαις（爱筵）<\/strong>：部分古抄本，与犹 12「爱席」平行。<\/li><\/ul><blockquote><p><strong>最好的理解：原文作「诡诈」，但场景确实是爱筵——συνευωχούμενοι ὑμῖν「与你们一同坐席」。两个字在大楷抄本里写法极近（ΑΠΑΤΑΙΣ／ΑΓΑΠΑΙΣ），讽刺正在这里：他们在爱的筵席上行诡诈。<\/strong><\/p><\/blockquote><p><strong>② ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται——「他们的败坏」指谁？<\/strong><\/p><ul><li><strong>回指动物<\/strong>：「像那些动物被毁灭一样，他们也要被毁灭」（多数新近英译）。<\/li><li><strong>指他们自己的败坏<\/strong>：「在自己的败坏中被毁」；和合本「正在败坏人的时候，自己必遭遇败坏」偏向这一读。<\/li><\/ul><blockquote><p><strong>最好的理解：文法上回指动物最自然，但两读落点相同：活在败坏里的人，最后被败坏吞掉。<\/strong><\/p><\/blockquote><p><strong>③ 文字游戏<\/strong>：ἀδικούμενοι μισθὸν ἀδικίας——同一字根重复，「受不义之害，作为不义的工价」；TR 作 κομιούμενοι（将得到）。<\/p>","exp":"<p><strong>渔夫出身的彼得，一眼就认得出「下饵」。<\/strong><\/p><p>这三节是一连串快速的画像，一笔接一笔：像没有理性的畜类；白昼宴乐——放纵连夜里都不必等；污点和瑕疵；眼里满了淫色；停不下来的罪；被咒诅的种类。最令人不安的是一个细节：「正与你们一同坐席」。他们不在教会外面，就坐在教会的爱筵桌边。<\/p><p>δελεάζω 是下饵的字。彼得与安得烈当年在加利利海撒网，主对他们说：「我要叫你们得人如得鱼一样。」现在老彼得看见另一种「得人」：用饵钓人。饵下给谁？ψυχὰς ἀστηρίκτους——没有扎稳的人。那一夜主对彼得说：「你回头以后，要坚固你的弟兄。」（路 22:32）假师傅专找没有被坚固的人下手。这说明了教会为什么必须做「坚固人」的事：门训、陪伴、在真道上扎根，不是额外的节目，是保护。<\/p><p>γεγυμνασμένην 是完成式的「操练」——体育馆（gymnasium）的那个字。贪婪不是一时失手，是天天练出来的心；反过来，敬虔也是练出来的（提前 4:7「在敬虔上操练自己」）。至于 ἄλογα ζῷα：他们自以为有高深的属灵知识，毁谤所不晓得的事，其实像畜类一样顺着本能活——下一段，一头真正的畜类反而说出了人话。<\/p><p>落到今天：这段不是叫我们去找「谁是下饵的人」，而是问两件事。我的心这些年在操练什么？我身边有没有一位还没扎稳的人，需要我去陪他、坚固他——那就是 920 里我的那个「2」。<\/p><p>〔背景〕得人如得鱼（太 4:18–20）；要坚固你的弟兄（路 22:32）。〔犹〕犹 10、12（犹大书讲义尚未制作）。<\/p>"},{"a":15,"z":16,"star":1,"grk":"<blockquote lang=\"grc\"><p>καταλείποντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ Βοσόρ, ὃς μισθὸν ἀδικίας ἠγάπησεν, ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.<\/p><\/blockquote>","lit":"<blockquote><p>「他们撇下正直的路就走迷了，紧跟着波梭珥（和合本：比珥）之子巴兰的路——他爱了不义的工价，却因自己的违法受了揭穿：一头不会说话的负轭牲口，用人的声音发声，拦阻了先知的疯狂。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>离弃<\/td><td>καταλείποντες<\/td><td>kataleipontes<\/td><td>G2641<\/td><td>κατά＋λείπω<\/td><td>撇下<\/td><td>正路是被撇下的，不是不小心掉的<\/td><\/tr><tr><td>走差<\/td><td>ἐπλανήθησαν<\/td><td>eplanēthēsan<\/td><td>G4105<\/td><td>πλάνη<\/td><td>迷路、被带偏<\/td><td>3:17「恶人的错谬」同字根<\/td><\/tr><tr><td>比珥<\/td><td>Βοσόρ<\/td><td>Bosor<\/td><td>G1007<\/td><td>—<\/td><td>波梭珥<\/td><td>SBLGNT 作 Βοσόρ；民 22:5 七十士译本作 Βεώρ<\/td><\/tr><tr><td>工价<\/td><td>μισθόν<\/td><td>misthon<\/td><td>G3408<\/td><td>—<\/td><td>工钱、酬报<\/td><td>2:13、2:15 重复：不义的工价<\/td><\/tr><tr><td>责备<\/td><td>ἔλεγξιν<\/td><td>elenxin<\/td><td>G1649<\/td><td>ἐλέγχω<\/td><td>揭穿、责备<\/td><td>新约仅此一次<\/td><\/tr><tr><td>驴<\/td><td>ὑποζύγιον<\/td><td>hypozygion<\/td><td>G5268<\/td><td>ὑπό＋ζυγός<\/td><td>负轭的牲口<\/td><td>在轭下的牲口，反而比先知清醒<\/td><\/tr><tr><td>狂妄<\/td><td>παραφρονίαν<\/td><td>paraphronian<\/td><td>G3913<\/td><td>παρά＋φρήν<\/td><td>失去理智<\/td><td>新约仅此一次<\/td><\/tr><\/table>","gram":"<p><strong>① Βοσόρ 与 Βεώρ<\/strong><\/p><ul><li><strong>音变<\/strong>：有人认为反映某种口音（喉音转读），同一个名字的另一种拼法。<\/li><li><strong>文字游戏<\/strong>：有人推测 Βοσόρ 与希伯来文 בָּשָׂר（肉体）谐音——「肉体之子」，呼应 2:10「随肉身」。这只是推测。<\/li><li><strong>抄本混合<\/strong>：少数抄本作 Βεωρσόρ，可见抄写者也在两种拼法间犹豫。<\/li><\/ul><blockquote><p><strong>最好的理解：指的是同一个人——民 22:5「比珥的儿子巴兰」。和合本照民数记译作「比珥」是合宜的；不必在拼法上建立任何教义。<\/strong><\/p><\/blockquote><p><strong>② 驴说人话——怎样读？<\/strong><\/p><ul><li><strong>历史中的神迹<\/strong>：民数记与彼得都当真事记载。<\/li><li><strong>异象或内在经验<\/strong>：巴兰在异象中「听见」驴说话。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得照民数记的记载接受它；而他的重点是讽刺——自以为有属灵知识的人「好像没有灵性、生来就是畜类」（2:12），不会说话的畜类却用人言说出理性的话。<\/strong><\/p><\/blockquote><p><strong>③ 路的意象<\/strong>：ὁδός 在本章出现四次——「真道」（2:2）、「正路」与「巴兰的路」（2:15）、「义路」（2:21）。第 2 章是一张路线图。<\/p>","exp":"<p><strong>神可以用一头驴，拦住一个被钱冲昏头的先知。<\/strong><\/p><p>彼得从画像转到一个旧约人物：巴兰。摩押王巴勒用重金请他来咒诅以色列。巴兰口里说，只照神的话说；心里却一直放不下那份酬报。民数记后来记载，以色列人在毘珥的事上得罪耶和华，正是出于巴兰的计谋；启示录也说他「教导巴勒将绊脚石放在以色列人面前」。爱钱，加上引诱人犯淫乱——正好是 2:14 假师傅的两个记号。彼得说他们「离弃正路」——καταλείπω 是撇下，正路不是不小心掉的，是自己撇下的。<\/p><p>接着是全章最幽默的一笔：「那不能说话的驴以人言拦阻先知的狂妄。」巴兰骑着驴去赴那份工价，路上三次被耶和华的使者拦住；先知看不见，驴看见了。他打了驴三次，直到驴开口说话。彼得的对照很尖锐：2:12 说假师傅「好像没有灵性、生来就是畜类」，这里却是一头畜类说出了理性的话。被钱冲昏头的人，比一头驴还不清醒。<\/p><p>这一段没有让巴兰有好结局；但它让我们看见，神在人走向灭亡的路上，一次又一次地拦阻——用使者、用驴、用一扇关上的门。<\/p><p>落到今天：神今天的「驴」，可能是一位你看不起的人说的一句话、一个一再受阻的计划、一份一直谈不成的利益。巴兰三次打驴，不知道驴救了他的命。当你被拦住时，先别急着打驴，先问：我是不是正往「不义的工价」那里走？<\/p><p>〔旧约〕民数记讲义第 22–24 章（民 22:21–35；31:16）。〔犹〕犹 11（犹大书讲义尚未制作）。<\/p>"},{"a":17,"z":17,"star":2,"grk":"<blockquote lang=\"grc\"><p>Οὗτοί εἰσιν πηγαὶ ἄνυδροι καὶ ὁμίχλαι ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ σκότους τετήρηται.<\/p><\/blockquote>","lit":"<blockquote><p>「这些人是没有水的泉源，是被暴风驱赶的雾气；为他们存留的，是黑暗中的幽暗。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>井<\/td><td>πηγαί<\/td><td>pēgai<\/td><td>G4077<\/td><td>—<\/td><td>泉源、水泉<\/td><td>不是蓄水的池，是本该自己涌出水的泉<\/td><\/tr><tr><td>无水的<\/td><td>ἄνυδροι<\/td><td>anydroi<\/td><td>G504<\/td><td>ἀ＋ὕδωρ<\/td><td>没有水的<\/td><td>太 12:43「无水之地」同字<\/td><\/tr><tr><td>雾气<\/td><td>ὁμίχλαι<\/td><td>homichlai<\/td><td>G3658<\/td><td>—<\/td><td>薄雾<\/td><td>新约仅此一次；看似有雨，一吹就散<\/td><\/tr><tr><td>狂风<\/td><td>λαίλαπος<\/td><td>lailapos<\/td><td>G2978<\/td><td>—<\/td><td>暴风<\/td><td>可 4:37 加利利海上的「暴风」同字<\/td><\/tr><tr><td>催逼<\/td><td>ἐλαυνόμεναι<\/td><td>elaunomenai<\/td><td>G1643<\/td><td>—<\/td><td>被驱赶<\/td><td>被动：自称自由的人，其实被风赶着走<\/td><\/tr><tr><td>幽暗<\/td><td>ζόφος<\/td><td>zophos<\/td><td>G2217<\/td><td>—<\/td><td>阴沉的幽暗<\/td><td>2:4 拘禁天使的同一个字<\/td><\/tr><tr><td>存留<\/td><td>τετήρηται<\/td><td>tetērētai<\/td><td>G5083<\/td><td>—<\/td><td>保留、看守<\/td><td>完成式：已经存放好了<\/td><\/tr><\/table>","gram":"<p><strong>① 异文<\/strong>：TR 作 νεφέλαι（云彩），并在句末加 εἰς αἰῶνα（直到永远）；SBLGNT 作 ὁμίχλαι（雾气），无 εἰς αἰῶνα。和合本「雾气」「存留」跟 SBLGNT 一读。犹 12–13 用的是「没有雨的云彩」与「永远存留」，TR 的读法可能受犹大书影响。<\/p><p><strong>② πηγή 是「井」还是「泉」？<\/strong><\/p><ul><li><strong>井<\/strong>：和合本的译法，中文读者最直接的画面——一口挖下去却没有水的井。<\/li><li><strong>泉<\/strong>：πηγή 通常指自然涌出的泉源（约 4:14「泉源」同字），不是人挖的蓄水处。<\/li><\/ul><blockquote><p><strong>最好的理解：「无水的泉」——本该是源头的地方没有水。假师傅最大的问题，是占据了「源头」的位置：人来找他们要水，他们给不出水。和合本的「井」保留了干涸与失望的画面，讲台可沿用。<\/strong><\/p><\/blockquote><p><strong>③ 两个比喻的动词<\/strong>：泉是静的、雾是动的；一个应许了却没有，一个看似有却被吹散。两个都是「看起来有，其实没有」。<\/p>","exp":"<p><strong>口渴的人远远看见泉源，走到跟前却是干的——这比没有泉更残酷。<\/strong><\/p><p>这是本章的章题。在巴勒斯坦干旱的山地，泉源就是命；旅人照着记忆走了一整天，到了泉边却只见干裂的石头。神曾借耶利米说：「我的百姓做了两件恶事：就是离弃我这活水的泉源，为自己凿出池子，是破裂不能存水的池子。」假师傅就是这样的泉：他们占据了源头的位置，人来找他们要水，他们给不出水。<\/p><p>第二个比喻是雾。夏天的早晨有雾，看起来要下雨了，太阳一出、风一吹，就散了。λαῖλαψ 这个字，彼得很熟悉——那一夜在加利利海上起了暴风，船几乎满了水，主起来斥责风，风就止住了。被暴风催逼着跑的雾，没有一位能叫风平静的主。这也预告了 2:19：他们应许人自由，自己却是被风赶着走的。<\/p><p>「有墨黑的幽暗为他们存留」——τετήρηται 是完成式，已经存好了；与 2:4 天使的「幽暗」、2:9 主的「看守」用同一组字。干井的结局不是由谁去揭发，是主早已看守着。<\/p><p>但记得：「井」是本章的篇名，不是本章的终点。篇名指出问题，2:9 给出盼望。面对干井，出路不是去找一口更大、更有名的井，而是回到那一位：「人若喝我所赐的水就永远不渴。我所赐的水要在他里头成为泉源，直涌到永生。」（约 4:14）也问自己：我带给身边的人的，是水，还是雾？<\/p><p>〔背景〕加利利海上的暴风（可 4:35–41）。〔犹〕犹 12–13（犹大书讲义尚未制作）。<\/p>"},{"a":18,"z":19,"star":2,"grk":"<blockquote lang=\"grc\"><p>ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ὀλίγως ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους, ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ δεδούλωται.<\/p><\/blockquote>","lit":"<blockquote><p>「因为他们发出虚空而浮肿的大话，用肉体的私欲、用放荡，向那些刚刚逃离活在错谬中之人的人下饵；应许他们自由，自己却是败坏的奴隶——因为人被什么打败，就作了什么的奴隶。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>矜夸的大话<\/td><td>ὑπέρογκα<\/td><td>hyperonka<\/td><td>G5246<\/td><td>ὑπέρ＋ὄγκος（体积）<\/td><td>膨胀过度的<\/td><td>肿起来的话：很大，但是空<\/td><\/tr><tr><td>虚妄<\/td><td>ματαιότητος<\/td><td>mataiotētos<\/td><td>G3153<\/td><td>μάταιος<\/td><td>虚空<\/td><td>罗 8:20「虚空」同字<\/td><\/tr><tr><td>刚才<\/td><td>ὀλίγως<\/td><td>oligōs<\/td><td>G3641<\/td><td>ὀλίγος<\/td><td>才刚、稍稍<\/td><td>新约仅此一次；TR 作 ὄντως（确实）<\/td><\/tr><tr><td>自由<\/td><td>ἐλευθερίαν<\/td><td>eleutherian<\/td><td>G1657<\/td><td>ἐλεύθερος<\/td><td>自由<\/td><td>彼前 2:16 同字<\/td><\/tr><tr><td>应许<\/td><td>ἐπαγγελλόμενοι<\/td><td>epangellomenoi<\/td><td>G1861<\/td><td>ἐπί＋ἀγγέλλω<\/td><td>应许<\/td><td>1:4 神的「应许」同字根：假应许对真应许<\/td><\/tr><tr><td>奴仆<\/td><td>δοῦλοι<\/td><td>douloi<\/td><td>G1401<\/td><td>—<\/td><td>奴隶<\/td><td>1:1 彼得自称「耶稣基督仆人」同字<\/td><\/tr><tr><td>制伏<\/td><td>ἥττηται<\/td><td>hēttētai<\/td><td>G2274<\/td><td>ἥσσων（较弱的）<\/td><td>被打败<\/td><td>完成式：仗打输了，结果延续<\/td><\/tr><tr><td>作奴仆<\/td><td>δεδούλωται<\/td><td>dedoulōtai<\/td><td>G1402<\/td><td>δοῦλος<\/td><td>被奴役<\/td><td>完成式：成了奴隶，至今仍是<\/td><\/tr><\/table>","gram":"<p><strong>① 他们应许的「自由」是什么？<\/strong><\/p><ul><li><strong>道德上的放纵<\/strong>：在恩典之下什么都可以做——可能扭曲了保罗的自由教导（参 3:16「强解」；彼前 2:16「不可借着自由遮盖恶毒」）。<\/li><li><strong>免于审判的自由<\/strong>：主不会再来、没有审判（3:4），所以不必向谁交账。<\/li><li><strong>脱离「宗教束缚」<\/strong>：摆脱规条与群体的约束。<\/li><\/ul><blockquote><p><strong>最好的理解：前两者连在一起——否认审判（3:4）就拆掉了约束，放纵是它的果子。真正的自由在 1:4：「脱离世上从情欲来的败坏」；假师傅应许的「自由」，正是要把人带回那个败坏。<\/strong><\/p><\/blockquote><p><strong>② ᾧ γάρ τις ἥττηται, τούτῳ δεδούλωται<\/strong>：战争的语言——古代战败者成为战胜者的奴隶。两个完成式说出一个持续的状态。TR 作 τούτῳ καὶ δεδούλωται，意思相同。<\/p><p><strong>③ 受害者<\/strong>：τοὺς ὀλίγως ἀποφεύγοντας——「才刚逃出来」的人，是初信者或刚离开旧生活的人。和合本「刚才脱离妄行的人」跟 ὀλίγως 一读。<\/p>","exp":"<p><strong>自己作主的人，最后被别的东西作主。<\/strong><\/p><p>2:18 写出他们的方法：说的话很大、很响——ὑπέρογκα 是「肿起来的」——但里面是 ματαιότης，空的。对象呢？「那些刚才脱离妄行的人」——初信者、刚离开旧生活、还没站稳的人。用的饵，是他们刚刚逃出来的那个东西：肉身的情欲。<\/p><p>2:19 写出最有吸引力的那句话：「你自由了。」彼得只用一句格言就拆穿它：「人被谁制伏就是谁的奴仆。」ἡττάομαι 是打败仗；古代战败的人成为战胜者的奴隶。他们以为自己战胜了规条，其实是被情欲打败。主耶稣早就说过：「所有犯罪的就是罪的奴仆」；「天父的儿子若叫你们自由，你们就真自由了」（约 8:34、36）。<\/p><p>彼得在 1:1 自称「耶稣基督仆人」，用的正是 δοῦλος。全卷只有两种奴仆：作基督的仆人，或作败坏的奴仆；没有第三种「谁的仆人都不作」。φθορά 这条线也在这里收紧：1:4 神要救我们「脱离世上从情欲来的败坏」，2:19 假师傅却把人带回同一个败坏。假的应许与真的应许，用的是同一个字根。<\/p><p>落到今天：2:10 的「任性」，在 2:19 看见了结局——旧人有己，要自己作主作王，结果被别的东西作了主。问自己：哪一件事我说「我可以控制」，其实已经在控制我？自由不是没有主人，是有一位好主人。让耶稣作王，才是自由。<\/p><p>〔彼前〕彼得前书讲义第 2 章（2:16 作神的仆人）。〔犹〕犹 16（犹大书讲义尚未制作）。<\/p>"},{"a":20,"z":22,"star":2,"grk":"<blockquote lang=\"grc\"><p>εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ, τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων. κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς. συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς κυλισμὸν βορβόρου.<\/p><\/blockquote>","lit":"<blockquote><p>「因为他们若借着认识主和救主耶稣基督，已经逃离了世界的污秽，后来又被这些缠住而被打败，他们末后的光景就比起初更坏了。因为认识了义的道路，又从传给他们的圣洁命令转回去，倒不如从来没有认识过。那句真实的俗语在他们身上应验了：「狗转回到自己所吐的东西那里」，又：「母猪洗了澡，又到泥浆里打滚。」」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>污秽<\/td><td>μιάσματα<\/td><td>miasmata<\/td><td>G3393<\/td><td>μιαίνω<\/td><td>污染之物<\/td><td>新约仅此一次<\/td><\/tr><tr><td>认识<\/td><td>ἐπιγνώσει<\/td><td>epignōsei<\/td><td>G1922<\/td><td>ἐπί＋γινώσκω<\/td><td>认识<\/td><td>全卷主题字；在这里显出「知道不等于长进」<\/td><\/tr><tr><td>缠住<\/td><td>ἐμπλακέντες<\/td><td>emplakentes<\/td><td>G1707<\/td><td>ἐν＋πλέκω（编织）<\/td><td>被缠进去<\/td><td>像鱼被网缠住<\/td><\/tr><tr><td>更不好<\/td><td>χείρονα<\/td><td>cheirona<\/td><td>G5501<\/td><td>—<\/td><td>更坏的<\/td><td>太 12:45「末后的景况比先前更不好了」几乎同句<\/td><\/tr><tr><td>背弃<\/td><td>ὑποστρέψαι<\/td><td>hypostrepsai<\/td><td>G5290<\/td><td>ὑπό＋στρέφω<\/td><td>转回去<\/td><td>TR 作 ἐπιστρέψαι<\/td><\/tr><tr><td>转过来<\/td><td>ἐπιστρέψας<\/td><td>epistrepsas<\/td><td>G1994<\/td><td>ἐπί＋στρέφω<\/td><td>回转<\/td><td>与路 22:32「你回头以后」同一个分词<\/td><\/tr><tr><td>洗净<\/td><td>λουσαμένη<\/td><td>lousamenē<\/td><td>G3068<\/td><td>—<\/td><td>洗澡<\/td><td>中间语态：外面洗了，本性没变<\/td><\/tr><tr><td>滚<\/td><td>κυλισμόν<\/td><td>kylismon<\/td><td>G2946<\/td><td>κυλίω<\/td><td>打滚<\/td><td>新约仅此一次<\/td><\/tr><\/table>","gram":"<p><strong>① 「他们」是谁？<\/strong>2:20 的 γάρ 接着 2:19 的 αὐτοί——应许人自由、自己却作奴仆的假师傅；也包括完全跟从他们、同样转背的人。上下文 2:17–19 一路在讲假师傅。<\/p><p><strong>② 这些人失去救恩了吗？三种读法并陈<\/strong><\/p><ul><li><strong>真信徒可以失落救恩<\/strong>（阿米念传统）：「认识主救主」「脱离世上的污秽」描述的是真实的得救经历，后来背弃，就失去了。<\/li><li><strong>他们从未真正重生<\/strong>（加尔文传统）：2:22 的比喻正是说本性没有改变——狗回头了还是狗，猪洗干净了还是猪；他们有过外面的洗净与知识，没有新的生命。<\/li><li><strong>警告是神保守信徒的工具<\/strong>（许多福音派）：警告是真的，神正是借着这样的警告，保守他的人不从坚固的地步上坠落（3:17）。<\/li><\/ul><blockquote><p><strong>最好的理解：上下文描述的是假师傅与跟从他们转背的人，不是在挣扎中跌倒、仍然想回头的弟兄姐妹。三种读法都同意：警告是真实的，出路是回到主面前。本讲义不用这段经文对任何个人宣判；跌倒的人要同时听见 1:9 与 3:9。<\/strong><\/p><\/blockquote><p><strong>③ 两种「回转」<\/strong>：2:21 ὑποστρέψαι（从圣命转回去）、2:22 ἐπιστρέψας（狗转回所吐的）；路 22:32 主对彼得说 ἐπιστρέψας στήρισον——「你回头以后，要坚固」。同一个分词，两个方向。<\/p><p><strong>④ 两句俗语<\/strong>：第一句出自箴 26:11；第二句（猪洗了又滚）是当时流传的俗语，不在旧约里。<\/p>","exp":"<p><strong>回头有两种：狗回到所吐的，彼得回到主面前。<\/strong><\/p><p>这是全章最沉重的三节。「末后的景况比先前更不好了」——这几乎就是主耶稣的话（太 12:45）：屋子打扫干净了却空着，污鬼带着七个更恶的回来。认识过义路又转背，比从未听过更糟，因为他们不只是迷路，是拿着地图往反方向走，还带别人一起走（2:18）。两句俗语说出原因：狗转过来吃牠所吐的（箴 26:11）；猪洗了澡，又回到泥里滚。外面洗过了，本性没有变。<\/p><p>但要看清楚这段话在讲谁。上下文 2:17–19 是假师傅与跟从他们的人——晓得义路，却拿着「自由」去引诱刚逃出来的人。这段话不是写给一位跌倒了、心里很痛、很想回来的弟兄姐妹。<\/p><p>彼得在这里埋了一个只有他懂的字。狗「转过来」ἐπιστρέψας，正是主在那一夜对他说的字：「你回头（ἐπιστρέψας）以后，要坚固你的弟兄。」（路 22:32）同一个分词，两个方向：一个转回呕吐物，一个转回主面前。写这段话的人自己跌得很重；他不是站在悬崖上俯视别人，是从谷底被主拉上来的人。<\/p><p>落到今天：如果你正在挣扎，害怕自己就是 2:20 说的那种人——你会为此害怕，本身就说明你的心还没有麻木。请听 1:9：「忘了他旧日的罪已经得了洁净」——你的罪是被洁净过的；请听 3:9：主「不愿有一人沉沦，乃愿人人都悔改」——主还在等。这三节不是用来对任何人宣判的，是叫我们今天就回转：不是像狗那样转回旧路，是像彼得那样转回主面前。<\/p><p>〔背景〕三次不认主与回头（路 22:31–34、54–62）。〔犹〕犹 22–23（犹大书讲义尚未制作）。<\/p>"}],"3":[{"a":1,"z":2,"star":1,"grk":"<blockquote lang=\"grc\"><p>Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν, μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,<\/p><\/blockquote>","lit":"<blockquote><p>「亲爱的，这已经是我写给你们的第二封信了；在这两封信里，我借着提醒，激发你们纯净的心思，叫你们记得圣先知预先说过的话，以及主和救主借着你们的使徒所传的命令。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>亲爱的<\/td><td>ἀγαπητός<\/td><td>agapētos<\/td><td>G27<\/td><td>ἀγαπάω（爱）<\/td><td>蒙爱的<\/td><td>第 3 章用了四次（3:1、8、14、17），第 2 章一次也没有——讲完假师傅，回头对自己人说话<\/td><\/tr><tr><td>第二封<\/td><td>δεύτερος<\/td><td>deuteros<\/td><td>G1208<\/td><td>—<\/td><td>第二<\/td><td>最自然指彼得前书（见语法）<\/td><\/tr><tr><td>激发<\/td><td>διεγείρω<\/td><td>diegeirō<\/td><td>G1326<\/td><td>διά（彻底）＋ ἐγείρω（唤起）<\/td><td>摇醒、唤醒<\/td><td>1:13 同字：临终的人还在摇醒他的弟兄<\/td><\/tr><tr><td>提醒<\/td><td>ὑπόμνησις<\/td><td>hypomnēsis<\/td><td>G5280<\/td><td>ὑπό ＋ μιμνῄσκω（记得）<\/td><td>提醒、使人想起<\/td><td>1:13 同字；全卷是一封「怕你忘记」的信<\/td><\/tr><tr><td>诚实的<\/td><td>εἰλικρινής<\/td><td>eilikrinēs<\/td><td>G1506<\/td><td>传统拆作 εἵλη（日光）＋ κρίνω（判断）<\/td><td>纯净、没有掺杂<\/td><td>拿到日光下看也没有杂质的心思（腓 1:10 同字）<\/td><\/tr><tr><td>心<\/td><td>διάνοια<\/td><td>dianoia<\/td><td>G1271<\/td><td>διά ＋ νοῦς（心思）<\/td><td>思想、理解力<\/td><td>不是情绪的心，是思想的心：提醒对着理解说话<\/td><\/tr><tr><td>记念<\/td><td>μιμνῄσκομαι<\/td><td>mimnēskomai<\/td><td>G3415<\/td><td>—<\/td><td>记得、想起<\/td><td>不定词 μνησθῆναι 表目的：提醒是为了记得<\/td><\/tr><tr><td>命令<\/td><td>ἐντολή<\/td><td>entolē<\/td><td>G1785<\/td><td>ἐν ＋ τέλλω（吩咐）<\/td><td>命令、吩咐<\/td><td>源头是「主救主」，传递者是「你们的使徒」<\/td><\/tr><\/table>","gram":"<p><strong>① δευτέραν ἐπιστολήν——「第二封信」指哪一封？<\/strong><\/p><ul><li><strong>彼得前书<\/strong>（多数解经家）：最自然的读法。彼前 1:10–12 讲先知，1:13 起满是命令——「先知的话」与「主的命令」两样都有。<\/li><li><strong>一封已经失传的信<\/strong>：理由是彼得前书的主题是受苦，看起来不像「提醒」主再来的事。<\/li><li><strong>彼得后书第 1–2 章另成一信<\/strong>（少数）：没有任何抄本证据。<\/li><\/ul><p>对反对意见的回应：彼得前书其实大量讲到末后（彼前 1:5、1:13、4:7、4:13、5:4），而「劝勉、证明」也是前书自述的目的（彼前 5:12）。<strong>ἐν αἷς<\/strong>（在其中，复数）把两封绑在一起：和合本「这两封都是提醒你们」译得准确。<\/p><blockquote><p><strong>最好的理解：指彼得前书。两封合读：前书教人在火里站得住，后书教人在雾里看得清——同一个提醒的人，同一个目的。<\/strong><\/p><\/blockquote><p><strong>② τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος——三层所有格<\/strong><\/p><ul><li>「使徒的」：传递者<\/li><li>「你们的」：把福音传给你们的那些使徒<\/li><li>「主和救主的」：命令的源头<\/li><\/ul><p>托名说有人以「你们的使徒」为作者自外于使徒群体的证据；但更自然的读法是：彼得把自己放进「传给你们」的使徒行列里，不另立权威。先知（旧约）与使徒（新约）并列，这使我们想起弗 2:20「被建造在使徒和先知的根基上」。<\/p><blockquote><p><strong>最好的理解：命令只有一个源头——主救主；先知预先说、使徒传出去，都是同一位主在不同时代说话。<\/strong><\/p><\/blockquote>","exp":"<p><strong>临终的使徒，最后一章的第一个动作还是提醒。<\/strong><\/p><p>第 3 章是彼得遗言的最后一段。他没有说「我要告诉你们新的东西」，而是说：「这两封都是提醒你们。」1:12 他说「常常提醒」，1:13 说「趁我还在这帐棚的时候提醒」，到了这里，仍是同一件事。<strong>信仰最大的危险，常常不是不知道，而是忘了。<\/strong>这一章后面要面对的讥诮，起点正是「故意忘记」（3:5）。<\/p><p>「激发」διεγείρω 是把睡着的人摇醒的字。被摇醒的不是情绪，是 διάνοια——思想、理解。「诚实的心」εἰλικρινής 是没有掺杂的心思：还没有被私欲搅混，却可能正在打盹。彼得要摇醒的，是一颗还干净、但快要睡着的头脑。<\/p><p>他要人记得两样：<strong>圣先知预先所说的话<\/strong>，和<strong>主救主的命令，就是使徒所传给你们的<\/strong>。这不是两个平行的权威，而是同一位主在两个时代说话：先知预先说，使徒传出去，源头都是「主救主」。这正接回 1:19–21——先知的话是暗处的灯，因为那是人被圣灵感动说出来的。<\/p><p>今天的人很少公开否认信仰，多半只是让它慢慢褪色。所以读经、聚会、彼此提醒，从来不是重复，而是摇醒。<strong>一个肯被提醒的人，就不容易被讥诮带走；一个常提醒弟兄的人，正在做主交给彼得的那份功课。<\/strong><\/p><p>〔背景〕「你回头以后，要坚固你的弟兄」——提醒是主的托付，不是彼得的个性（路 22:32）。〔彼前〕彼得前书讲义第 1 章（彼前 1:10–12 先知的考察）、第 5 章（彼前 5:12 劝勉与证明）。<\/p>"},{"a":3,"z":4,"star":1,"grk":"<blockquote lang=\"grc\"><p>τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ἐσχάτων τῶν ἡμερῶν ἐν ἐμπαιγμονῇ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.<\/p><\/blockquote>","lit":"<blockquote><p>「首先要知道这件事：在末后的日子，必有讥诮的人带着讥诮而来，照着他们自己的私欲而行，说：『他来临的应许在哪里呢？因为自从列祖睡了以后，万物都这样持续，和创造之初一样。』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>第一要紧的<\/td><td>πρῶτον<\/td><td>prōton<\/td><td>G4412<\/td><td>—<\/td><td>首先、最要紧<\/td><td>与 1:20 同一句式 τοῦτο πρῶτον γινώσκοντες：前一次要知道预言的来源，这一次要知道会有人笑<\/td><\/tr><tr><td>末世<\/td><td>ἔσχατος<\/td><td>eschatos<\/td><td>G2078<\/td><td>—<\/td><td>最后的<\/td><td>ἐπ’ ἐσχάτων τῶν ἡμερῶν：彼得在五旬节说末后的日子已经开始（徒 2:17）<\/td><\/tr><tr><td>讥诮<\/td><td>ἐμπαιγμονή<\/td><td>empaigmonē<\/td><td>—<\/td><td>ἐν ＋ παίζω（游戏、玩弄）<\/td><td>嘲弄、戏弄<\/td><td>新约仅此一次；TR 无此字，故无 Strong’s 编号<\/td><\/tr><tr><td>好讥诮的人<\/td><td>ἐμπαίκτης<\/td><td>empaiktēs<\/td><td>G1703<\/td><td>ἐμπαίζω（戏弄）<\/td><td>嘲笑者<\/td><td>犹 18 同字；与上一字同根叠用，连说话的方式都是讥诮<\/td><\/tr><tr><td>私欲<\/td><td>ἐπιθυμία<\/td><td>epithymia<\/td><td>G1939<\/td><td>ἐπί ＋ θυμός（热情）<\/td><td>强烈的欲望<\/td><td>怀疑的根不在学问，在生活：主若来，我就得交账<\/td><\/tr><tr><td>降临<\/td><td>παρουσία<\/td><td>parousia<\/td><td>G3952<\/td><td>παρά ＋ εἰμί（在场）<\/td><td>来临、在场<\/td><td>1:16 同字：彼得在圣山上亲眼见过的那个「降临」<\/td><\/tr><tr><td>睡<\/td><td>κοιμάω<\/td><td>koimaō<\/td><td>G2837<\/td><td>—<\/td><td>睡、安睡<\/td><td>新约常用于信徒的死（帖前 4:13–15）<\/td><\/tr><tr><td>仍是一样<\/td><td>διαμένω<\/td><td>diamenō<\/td><td>G1265<\/td><td>διά ＋ μένω（停留）<\/td><td>持续不变<\/td><td>讥诮的世界观：从来没有变，所以也不会变<\/td><\/tr><\/table>","gram":"<p><strong>① 「列祖」οἱ πατέρες 是谁？<\/strong><\/p><ul><li><strong>旧约先祖<\/strong>（亚伯拉罕、以撒、雅各等）：新约 οἱ πατέρες 几乎都这样用（约 6:31；徒 3:13；罗 9:5；来 1:1）；后半句「与起初创造的时候」把眼光拉到整个历史。<\/li><li><strong>第一代基督徒<\/strong>（司提反、使徒雅各等已离世的人）：「睡了」多用于信徒的死；讥诮的内容可能是「主应许在这一代回来，可是第一代人都死了」（Bauckham 等学者主张）。<\/li><li><strong>泛指先人<\/strong>：不必特指哪一群人。<\/li><\/ul><blockquote><p><strong>最好的理解：两读都通，较倾向旧约列祖——新约用法一致，又与「起初创造」连成一条长线。但不论哪一读，讥诮的逻辑都一样：从来没有变，所以将来也不会变；3:5–7 就是拆这个逻辑。<\/strong><\/p><\/blockquote><p><strong>② ἐν ἐμπαιγμονῇ ἐμπαῖκται——同根叠用<\/strong><\/p><p>「在讥诮中的讥诮者」，闪族式的加强语法（如路 22:15「我很愿意」原文是「我愿意了又愿意」）。他们不只说了一句讥诮的话，他们整个人就活在讥诮里。<\/p><p><strong>③ 「末世」是一段时期，不是倒数讯号<\/strong><\/p><ul><li>把 3:3 当作「讥诮的人出现＝末日快到了」的讯号表<\/li><li>把「末后的日子」看成从五旬节到主再来的整段时期（徒 2:17；来 1:2）<\/li><\/ul><blockquote><p><strong>最好的理解：后者。讥诮的人不是给人推算的记号，而是教会在每一个世代都会面对的处境；彼得要的是「预先知道」，不是倒数计时。<\/strong><\/p><\/blockquote>","exp":"<p><strong>「主要降临的应许在哪里呢？」——这句话的力量，不在论证，在语气。<\/strong><\/p><p>彼得说「第一要紧的，该知道」，和 1:20 一模一样的开头。前一次要知道的是预言的来源，这一次要知道的是：会有人笑。他不是要信徒惊讶，而是要他们预先知道（3:17），听见笑声时不至于脚软。<\/p><p>讥诮的人有三个特征。第一，他们「随从自己的私欲」——怀疑的根常常不在头脑，在生活：主若真要回来，我的生活就得向他交账，所以最好他不来。第二，他们用一个问题代替一个论证：「在哪里呢？」旧约里这是仇敌对受苦的人说的话：「你的神在哪里呢？」（诗 42:3）第三，他们有一套世界观：「万物与起初创造的时候仍是一样」——διαμένει，一直维持。<strong>过去没有变，所以将来也不会变。<\/strong><\/p><p>彼得接下来（3:5–7）会指出这句话本身就是错的：世界变过，被水淹没过。但在这两节，他先让我们听见那笑声，因为每一代的信徒都听过。等候的人最难受的，往往不是逼迫，而是被当成笑话。<\/p><p>今天这句话换了衣服：「都两千年了，还在等？」<strong>回应讥诮的第一步不是吵赢，是记得。<\/strong>记得 παρουσία 这个字彼得在 1:16 已经用过——他讲的降临不是传说，是他在圣山上亲眼见过的那一位的威荣。被讥诮的应许，背后站着一位被亲眼看见过的主。<\/p><p>〔彼前〕彼得前书讲义第 4 章（彼前 4:7「万物的结局近了」——本章要回答「近」为什么这么久）。〔犹〕犹 18（犹大书讲义尚未制作）。<\/p>"},{"a":5,"z":7,"star":1,"grk":"<blockquote lang=\"grc\"><p>λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ, δι’ ὧν ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο· οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρί, τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.<\/p><\/blockquote>","lit":"<blockquote><p>「因为他们故意让这件事从眼前溜走：诸天自古就有，地也是从水而出、借着水而成立，都凭着神的话；借着这些，当时的世界被水淹没而灭亡了。但现在的天和地，凭着同一个话被积存起来留给火，被看守着，直到不敬虔之人受审判并灭亡的日子。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>忘记<\/td><td>λανθάνω<\/td><td>lanthanō<\/td><td>G2990<\/td><td>—<\/td><td>被忽略、溜走<\/td><td>不是不知道，是让它溜走；3:8 彼得反过来用同一个字<\/td><\/tr><tr><td>故意<\/td><td>θέλω<\/td><td>thelō<\/td><td>G2309<\/td><td>—<\/td><td>愿意、想要<\/td><td>分词 θέλοντας：这遗忘是他们自己要的（见语法）<\/td><\/tr><tr><td>太古<\/td><td>ἔκπαλαι<\/td><td>ekpalai<\/td><td>G1597<\/td><td>ἐκ ＋ πάλαι（古时）<\/td><td>自古以来<\/td><td>2:3「自古以来」同字：审判和创造一样古老<\/td><\/tr><tr><td>成<\/td><td>συνίστημι<\/td><td>synistēmi<\/td><td>G4921<\/td><td>σύν（一起）＋ ἵστημι（站立）<\/td><td>成形、维系<\/td><td>西 1:17「万有也靠他而立」同字<\/td><\/tr><tr><td>命<\/td><td>λόγος<\/td><td>logos<\/td><td>G3056<\/td><td>λέγω（说）<\/td><td>话、道<\/td><td>创造、淹没、存留，凭的都是同一个「话」<\/td><\/tr><tr><td>淹没<\/td><td>κατακλύζω<\/td><td>kataklyzō<\/td><td>G2626<\/td><td>κατά ＋ κλύζω（冲刷）<\/td><td>被水淹没<\/td><td>新约仅此一次；名词 κατακλυσμός 见 2:5「洪水」<\/td><\/tr><tr><td>存留<\/td><td>θησαυρίζω<\/td><td>thēsaurizō<\/td><td>G2343<\/td><td>θησαυρός（宝库）<\/td><td>积存、收藏<\/td><td>完成式被动 τεθησαυρισμένοι：已经放进库里，至今仍在<\/td><\/tr><tr><td>直留到<\/td><td>τηρέω<\/td><td>tēreō<\/td><td>G5083<\/td><td>—<\/td><td>看守、保留<\/td><td>2:4、9、17 同字：神看守审判，也在同一段看守挪亚<\/td><\/tr><\/table>","gram":"<p><strong>① λανθάνει…θέλοντας 怎样读？<\/strong><\/p><ul><li><strong>「他们故意忘记」<\/strong>（和合本与多数英译）：θέλοντας 表意愿——这件事逃过他们，是他们自己要它逃过。<\/li><li><strong>「他们坚持这一点时，却忽略了……」<\/strong>：θέλω 作「主张、坚称」（BDAG 列有此义）。<\/li><\/ul><blockquote><p><strong>最好的理解：和合本的读法较自然。两读殊途同归：讥诮不是信息不足，是选择性的遗忘；所以 3:8 的解药是「不可忘记」。<\/strong><\/p><\/blockquote><p><strong>② ἐξ ὕδατος καὶ δι’ ὕδατος<\/strong><\/p><ul><li>「从水而出」：创 1:9 旱地从聚在一处的水中露出来。<\/li><li>「借水而成」：创 1:6–7 穹苍分开上下的水；或指水是维系地的工具。<\/li><li>有人想由此建构一套科学宇宙论——这已超出经文的本意；彼得引的是创世记的叙事，目的在神学，不在物理。<\/li><\/ul><p><strong>③ δι’ ὧν（借着这些，复数）指什么？<\/strong><\/p><ul><li>指两处的水（从水、借水）<\/li><li>指水与神的话<\/li><li>指天和地<\/li><\/ul><blockquote><p><strong>最好的理解：水与神的话一同。同样的水，在同一个话底下，可以是创造的材料，也可以是审判的工具；世界不是靠自己的稳定存在，是靠神的话。<\/strong><\/p><\/blockquote><p><strong>④ ἀπώλετο（消灭）不等于「不存在」<\/strong><\/p><p>洪水使「当时的世界」灭亡，地却没有消失；3:7 用同一字族 ἀπώλεια 讲火的审判，对象明说是「不敬虔之人」。这个类比本身就提醒我们：审判是对罪的了结，不是神丢弃受造界。<\/p>","exp":"<p><strong>讥诮的人说「万物仍是一样」；彼得说：你忘了洪水。<\/strong><\/p><p>讥诮的论证建立在一个假设上：世界一直照着自己的规律运转，从来没有被打断。彼得举出两次打断：创造与洪水。天地本来没有，是「凭神的命」有的；那地「从水而出、借水而成」，正是创世记第 1 章的画面——水覆盖深渊，神一说话，旱地就露出来（创 1:2、9）。同样的水，在挪亚的日子成了审判：「当时的世界被水淹没就消灭了。」<\/p><p>这段的主角不是水，也不是火，是 λόγος——神的话。创造凭这话，淹没凭这话，「现在的天地还是凭着那命存留」。<strong>世界的稳定不是证明神不会来，正是证明神的话还在托住它。<\/strong>讥诮的人把神的忍耐误认成神的缺席。<\/p><p>「存留」τεθησαυρισμένοι 是放进宝库的字，又加上 τηρούμενοι——看守着。第 2 章彼得用同一个「看守」讲神把不义的人留到审判（2:4、9、17），也在同一段讲神「保护了传义道的挪亚一家八口」（2:5）。<strong>神看守审判，也看守他的人。<\/strong><\/p><p>还要注意：洪水消灭了「当时的世界」，地却没有消失；挪亚走出方舟，踏上的是同一块被洗过的地。所以 3:7 的火，焦点是「不敬虔之人受审判遭沉沦」，不是神对他所造的世界失去兴趣。对今天的人，这段话是双重的安慰：我们活在神话语的托住之中，也活在神的耐心之中——那火还在库里，因为门还开着（3:9）。<\/p><p>〔旧约〕创世记讲义第 1 章、第 6–8 章（创 1:2、6–9；6–8）。〔彼前〕彼得前书讲义第 3 章（彼前 3:20 挪亚的日子）。<\/p>"},{"a":8,"z":8,"star":2,"grk":"<blockquote lang=\"grc\"><p>Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.<\/p><\/blockquote>","lit":"<blockquote><p>「亲爱的，但这一件事不要让它从你们眼前溜走：在主那里，一日如同一千年，一千年如同一日。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>不可忘记<\/td><td>λανθάνω<\/td><td>lanthanō<\/td><td>G2990<\/td><td>—<\/td><td>被忽略、溜走<\/td><td>μὴ λανθανέτω 第三人称命令；与 3:5「故意忘记」一正一反<\/td><\/tr><tr><td>一件事<\/td><td>εἷς<\/td><td>heis<\/td><td>G1520<\/td><td>—<\/td><td>一<\/td><td>Ἓν…τοῦτο 放在句首：千头万绪中，只要记得这一件<\/td><\/tr><tr><td>主看<\/td><td>παρά<\/td><td>para<\/td><td>G3844<\/td><td>—<\/td><td>在……旁边、在……眼中<\/td><td>παρὰ κυρίῳ：观点是主的，不是我们的<\/td><\/tr><tr><td>如<\/td><td>ὡς<\/td><td>hōs<\/td><td>G5613<\/td><td>—<\/td><td>如同、好像<\/td><td>比喻，不是等号<\/td><\/tr><tr><td>千<\/td><td>χίλιοι<\/td><td>chilioi<\/td><td>G5507<\/td><td>—<\/td><td>一千<\/td><td>两个方向都说，取消了换算<\/td><\/tr><tr><td>日<\/td><td>ἡμέρα<\/td><td>hēmera<\/td><td>G2250<\/td><td>—<\/td><td>日<\/td><td>本章「日」的线：末后的日子（3:3）→主的日子（3:10）→永远的那一日（3:18）<\/td><\/tr><\/table>","gram":"<p><strong>① 引用诗 90:4，并且加了一个方向<\/strong><\/p><p>七十士译本诗 89:4：ὅτι χίλια ἔτη ἐν ὀφθαλμοῖς σου ὡς ἡ ἡμέρα ἡ ἐχθές（因为千年在你眼中如昨日）。诗篇只说「千年如一日」；彼得加上「一日如千年」，两个方向并列。<\/p><ul><li><strong>年代换算的钥匙<\/strong>：《巴拿巴书》15:4 等早期作品把创造六日套成六千年的世界历史，后世也有人用它推算主再来或证明创造日的长度——这是本讲义不采的读法。<\/li><li><strong>神超越时间<\/strong>（多数解经家）：时间的长短在神面前不是同一把尺；他不因漫长而遗忘，也不因仓促而失误。<\/li><li><strong>神的效率<\/strong>：一日之内，神能成就人以为要千年的事。<\/li><\/ul><blockquote><p><strong>最好的理解：ὡς 是比喻不是等号，而且两个方向都说——这节经文不是在说一日等于一千年，而是用两个方向互相抵销，取消一切换算。它不是叫人推算日子，是叫人换一个位置看时间：站到「主那里」。<\/strong><\/p><\/blockquote><p><strong>② 「亲爱的」第二次出现<\/strong><\/p><p>ἀγαπητοί 在本章出现四次（3:1、8、14、17），每一次都在一个转折点上：提醒、记得、竭力、防备。讲到最容易引人焦虑的题目时，彼得先叫一声「亲爱的」。<\/p>","exp":"<p><strong>这不是一条换算公式，是一次换位。<\/strong><\/p><p>讥诮的人「故意忘记」（3:5）；彼得说：亲爱的，有一件事你们「不可忘记」——同一个字 λανθάνω，一反一正。讥诮的人忘记神做过的事；信徒要记得神是怎样的一位。<\/p><p>这句话来自摩西的祷告：「在你看来，千年如已过的昨日，又如夜间的一更。」（诗 90:4）摩西说的是人生短暂、神永恒。彼得多加了一个方向：「一日如千年」。<strong>两个方向都说，正是为了取消换算。<\/strong>如果一日可以像千年，千年也可以像一日，就没有人能拿这节经文去定主哪一年来、或创造用了多少年——这节经文本身就拒绝被当成尺。<\/p><p>它要说的是：时间不是神的主人。对我们，一千年长得看不见尽头；对主，一千年不过像一日，他不会因为等了很久就忘记应许。反过来，一日在主手中可以像千年那样厚重，他可以在一日之内成就人以为要千年的事。<strong>神既不被时间拖慢，也不被时间催促。<\/strong><\/p><p>这正是 321 说的改变观点：从人的观点换到神的观点，从暂时的观点换到永恒的观点——不是换算，是换位。当我们问「为什么还不来」，问题的前提是用我们的钟表衡量神的信实。彼得不给我们一支新的钟表，他把我们带到主的身边（παρὰ κυρίῳ），从那里看时间。下一节就告诉我们，从那里看见的是什么：宽容。<\/p><p>〔旧约〕诗 90:4。〔彼前〕彼得前书讲义第 4 章（彼前 4:7「万物的结局近了」）。<\/p>"},{"a":9,"z":9,"star":2,"grk":"<blockquote lang=\"grc\"><p>οὐ βραδύνει κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.<\/p><\/blockquote>","lit":"<blockquote><p>「主对他的应许并不迟延，不是有些人以为的那种迟延；乃是向你们恒久忍耐，不愿任何人灭亡，乃愿所有的人都走进悔改里。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>耽延<\/td><td>βραδύνω<\/td><td>bradynō<\/td><td>G1019<\/td><td>βραδύς（慢）<\/td><td>迟慢、拖延<\/td><td>τῆς ἐπαγγελίας：在应许的事上不慢<\/td><\/tr><tr><td>耽延（名词）<\/td><td>βραδύτης<\/td><td>bradytēs<\/td><td>G1022<\/td><td>βραδύς（慢）<\/td><td>迟缓<\/td><td>新约仅此一次<\/td><\/tr><tr><td>以为<\/td><td>ἡγέομαι<\/td><td>hēgeomai<\/td><td>G2233<\/td><td>ἄγω（引领）<\/td><td>认为、看作<\/td><td>3:15 同字：有人「以为」是耽延，你们要「以为」是得救<\/td><\/tr><tr><td>宽容<\/td><td>μακροθυμέω<\/td><td>makrothymeō<\/td><td>G3114<\/td><td>μακρός（长）＋ θυμός（怒气）<\/td><td>恒久忍耐<\/td><td>★本章解经钥匙：把怒气拉长——主的慢是爱的等；彼前 3:20「神容忍等待」同字族<\/td><\/tr><tr><td>不愿<\/td><td>βούλομαι<\/td><td>boulomai<\/td><td>G1014<\/td><td>—<\/td><td>愿意、存心<\/td><td>神真实的心意，不是外交辞令<\/td><\/tr><tr><td>沉沦<\/td><td>ἀπόλλυμι<\/td><td>apollymi<\/td><td>G622<\/td><td>ἀπό ＋ ὄλλυμι（毁灭）<\/td><td>灭亡<\/td><td>3:6「消灭」、3:7「沉沦」同字族：审判的字，神说他不愿意<\/td><\/tr><tr><td>悔改<\/td><td>μετάνοια<\/td><td>metanoia<\/td><td>G3341<\/td><td>μετά（转变）＋ νοῦς（心思）<\/td><td>心意的转变<\/td><td>改变观念，从这里开始<\/td><\/tr><tr><td>都<\/td><td>χωρέω<\/td><td>chōreō<\/td><td>G5562<\/td><td>χῶρος（空间）<\/td><td>前往、进到、腾出地方<\/td><td>εἰς μετάνοιαν χωρῆσαι：悔改是一个地方，神等人走进去<\/td><\/tr><\/table>","gram":"<p><strong>① 「不愿有一人沉沦」与拣选<\/strong><\/p><ul><li><strong>阿米念／卫斯理传统<\/strong>：神普遍的救恩心意；人可以拒绝，所以不是人人得救。<\/li><li><strong>改革宗一派<\/strong>（如欧文 John Owen）：「向你们」指选民，「任何人」「人人」限于「你们」之中；神忍耐是为了把他的子民召齐。<\/li><li><strong>改革宗另一派<\/strong>：分辨神的「心意」与「定旨」——神真实地不喜悦恶人死亡（结 18:23、32；33:11；提前 2:4），同时有他主权的旨意。<\/li><li><strong>普救论<\/strong>：人人终必得救——与 3:7「不敬虔之人受审判遭沉沦」直接冲突，本节不能这样读。<\/li><\/ul><blockquote><p><strong>最好的理解：βούλομαι 说的是神真实的心意；「向你们」对读者说，「人人」把门开得更大。这节经文的工作不是裁决拣选的系统，而是解释「为什么还没来」：因为神在等人悔改。不要用系统冷却这节经文的温度，也不要用这节经文取消 3:7 的审判。<\/strong><\/p><\/blockquote><p><strong>② 异文：εἰς ὑμᾶς／δι’ ὑμᾶς<\/strong><\/p><p>SBLGNT 作 εἰς ὑμᾶς（向你们）；部分抄本作 δι’ ὑμᾶς（为你们的缘故），晚期抄本有作 ἡμᾶς（我们）者。意思相近：神的忍耐有明确的对象，就是正在读这封信的人。<\/p><p><strong>③ 同一个动词，两种读法<\/strong><\/p><p>ἡγοῦνται（3:9 有人以为）与 ἡγεῖσθε（3:15 你们要以为）前后呼应：同一段等候的时间，可以被读成「耽延」，也可以被读成「得救」。差别不在时间，在看的人。<\/p>","exp":"<p><strong>同一件事——主还没有来——人的观点叫它「耽延」，神的观点叫它「宽容」。<\/strong><\/p><p>「有人以为他是耽延」：这不只是讥诮的人的想法，也是许多等得很累的信徒心里的话。彼得没有责备这份累，他把它翻过来：「其实不是耽延，乃是宽容你们。」<\/p><p>「宽容」μακροθυμεῖ 字面是「把怒气拉长」——不是没有怒气，是把发作的时间往后延。彼得前书用同一个字族讲挪亚的日子：「神容忍等待的时候」（彼前 3:20）。方舟造了很多年，那不是神忘了审判，是神在等人进来。现在彼得说：我们的日子也是这样。<\/p><p>为什么等？「不愿有一人沉沦，乃愿人人都悔改。」「沉沦」ἀπόλλυμι 正是 3:6「消灭」、3:7「沉沦」的字族——<strong>审判的字，神说他不愿意。<\/strong>他的慢不是软弱，是爱的等。<\/p><p>写下这句话的人，自己就是被等回来的。他三次不认主，主没有放弃他，在海边预备了炭火和鱼，三次问他「你爱我吗」。<strong>写「宽容」的人，自己是被宽容等回来的。<\/strong><\/p><p>所以等候的时间不是焦虑的时间，是悔改与传福音的时间。那个还没回头的家人、那个跌倒了还想回来的弟兄、甚至我们自己心里那块还没交出来的地方——主的慢，就是为了这些。<strong>不要把主的宽容当成耽延；也不要把主的宽容当成可以继续拖延的理由<\/strong>（罗 2:4）。<\/p><p>〔背景〕主在海边等候并接回彼得（路 22:61–62；约 21:15–17）——不是彼得多坚强，是主多恒久忍耐。〔彼前〕彼得前书讲义第 3 章（彼前 3:20「神容忍等待」）。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<blockquote lang=\"grc\"><p>Ἥξει δὲ ἡμέρα κυρίου ὡς κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται.<\/p><\/blockquote>","lit":"<blockquote><p>「但主的日子必要来到，像贼一样；在那日，诸天要轰然一声过去，元素（或作：天体）要被烈火焚烧而解散，地和其上所作的工都要被显露出来（和合本所依的抄本作：都要烧尽了）。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>要…来到<\/td><td>ἥκω<\/td><td>hēkō<\/td><td>G2240<\/td><td>—<\/td><td>来到、临到<\/td><td>ἥξει 放在句首：回答「在哪里呢」——必定会来<\/td><\/tr><tr><td>贼<\/td><td>κλέπτης<\/td><td>kleptēs<\/td><td>G2812<\/td><td>κλέπτω（偷）<\/td><td>贼、小偷<\/td><td>主自己的比喻（太 24:43）；帖前 5:2；启 3:3：不预告时间<\/td><\/tr><tr><td>大有响声<\/td><td>ῥοιζηδόν<\/td><td>rhoizēdon<\/td><td>G4500<\/td><td>ῥοῖζος（呼啸声）<\/td><td>轰然、呼啸地<\/td><td>新约仅此一次：箭飞过、火烧起来的声音<\/td><\/tr><tr><td>废去<\/td><td>παρέρχομαι<\/td><td>parerchomai<\/td><td>G3928<\/td><td>παρά ＋ ἔρχομαι（来）<\/td><td>过去、消逝<\/td><td>太 24:35「天地要废去，我的话却不能废去」同字<\/td><\/tr><tr><td>有形质的<\/td><td>στοιχεῖον<\/td><td>stoicheion<\/td><td>G4747<\/td><td>στοῖχος（排列）<\/td><td>基本元素、排列成行的东西<\/td><td>物质元素／天体／属灵势力三说（见语法）<\/td><\/tr><tr><td>烈火<\/td><td>καυσόω<\/td><td>kausoō<\/td><td>G2741<\/td><td>καῦσις（燃烧）<\/td><td>被高热焚烧<\/td><td>新约只见于 3:10、12<\/td><\/tr><tr><td>销化<\/td><td>λύω<\/td><td>lyō<\/td><td>G3089<\/td><td>—<\/td><td>解开、拆散<\/td><td>3:10–12 连用三次：拆散的是现在的秩序<\/td><\/tr><tr><td>烧尽／被显露<\/td><td>εὑρίσκω<\/td><td>heuriskō<\/td><td>G2147<\/td><td>—<\/td><td>找到、发现<\/td><td>SBLGNT 作 εὑρεθήσεται；3:14「安然见主」原文就是「被他找到」<\/td><\/tr><\/table>","gram":"<p><strong>① 本节最后一个动词的异文——全卷最重要的一处<\/strong><\/p><table><tr><th>读法<\/th><th>意思<\/th><th>主要见证<\/th><th>采用的版本<\/th><\/tr><tr><td>εὑρεθήσεται<\/td><td>必被发现／被显露<\/td><td>א B K P 1739 等<\/td><td>SBLGNT、WH<\/td><\/tr><tr><td>οὐχ εὑρεθήσεται<\/td><td>必不被发现（不复存在）<\/td><td>部分撒希地科普特文与叙利亚文译本<\/td><td>NA28／UBS5（ECM）<\/td><\/tr><tr><td>κατακαήσεται<\/td><td>必烧尽<\/td><td>A 048 及拜占庭多数抄本<\/td><td>TR、多数本；和合本「烧尽了」、KJV<\/td><\/tr><tr><td>ἀφανισθήσονται<\/td><td>必消失<\/td><td>C<\/td><td>—<\/td><\/tr><tr><td>εὑρεθήσεται λυόμενα<\/td><td>必被发现已经解散<\/td><td>𝔓72<\/td><td>—<\/td><\/tr><tr><td>（略去这一句）<\/td><td>—<\/td><td>Ψ、部分拉丁文武加大本<\/td><td>—<\/td><\/tr><\/table><ul><li><strong>采 κατακαήσεται（烧尽）<\/strong>：意思最清楚，与 3:7、12 的火一致；和合本与钦定本都照这一读。但见证多属较晚的抄本，而且正因为「清楚」，很可能是抄写者为了把难句说明白而改的。<\/li><li><strong>采 εὑρεθήσεται（被显露）<\/strong>：见证最早、最好（א B），又是「较难的读法」（lectio difficilior）——其他各读都很容易解释成是从它改出来的。意思有三种解：(a) 地和其上的工都要摊开在神的审判面前，无所隐藏；(b) 读作问句「地……还会被找到吗？」；(c) 经过火炼之后被找着、存留下来。<\/li><li><strong>采 οὐχ εὑρεθήσεται（不被发现）<\/strong>：ECM／NA28 的编者认为这是能解释其他读法的原貌，但希腊文抄本几乎没有直接支持，主要靠早期译本。<\/li><\/ul><blockquote><p><strong>最好的理解：本讲义采 SBLGNT 的 εὑρεθήσεται，取 (a)：在神的审判面前被显露。这与林前 3:13「各人的工程必然显露……有火发现」一致，也与四节之后的 εὑρεθῆναι（3:14 被他找到）同一个动词，前后呼应。讲台若用和合本「烧尽了」，要说明原文有异文。两种读法都不是神丢弃受造界：「烧尽」讲审判之火的彻底，「显露」讲审判之火的鉴察；落点都在 3:13 的新天新地。<\/strong><\/p><\/blockquote><p><strong>② στοιχεῖα 是什么？<\/strong><\/p><ul><li><strong>物质元素<\/strong>（土、水、气、火，当时希腊哲学的用法）<\/li><li><strong>天体<\/strong>（日月星辰）：本节的顺序是天→στοιχεῖα→地；赛 34:4「天上的万象都要消没」，七十士译本用 τακήσονται（镕化），正是 3:12 τήκεται 的字<\/li><li><strong>属灵势力<\/strong>（加 4:3、9；西 2:8、20 的「小学」）<\/li><\/ul><blockquote><p><strong>最好的理解：天体最可能，物质元素也通；属灵势力在此较不自然。和合本「有形质的」兼容前两者，译得稳妥。<\/strong><\/p><\/blockquote>","exp":"<p><strong>主的日子一定会来，而且像贼一样来——这两件事一起说，就没有人该去算日子。<\/strong><\/p><p>句子第一个字是 ἥξει——「必要来到」。讥诮的人问「在哪里呢」，彼得把动词放在最前面回答：会来。然后他用主自己的比喻：像贼（太 24:43；帖前 5:2）。贼不预告时间。<strong>确定会来，又不知道何时来——这正是等候的人的两只脚：不怀疑，也不推算。<\/strong><\/p><p>接着是三幅画面：天「大有响声」废去——ῥοιζηδόν，新约只出现这一次，是箭飞过、火烧起来那种呼啸声；「有形质的」被烈火销化；最后是地和其上所作的工。这是先知式的语言，如以赛亚说「天上的万象都要消没」（赛 34:4），重点在震撼与确定，不是一份物理学的程序表。<\/p><p>最后一个动词有异文（见语法）。和合本「烧尽了」所依的读法强调审判的彻底；较早的抄本作 εὑρεθήσεται「被显露」，强调审判的鉴察——<strong>那一日，地上一切所作的，都要摊开在神面前。<\/strong>这使我们想起保罗说：「各人的工程必然显露，因为那日子要将它表明出来，有火发现；这火要试验各人的工程怎样。」（林前 3:13）四节之后，彼得用同一个动词说「安然见主」——原文是「被他找到」（3:14）。<\/p><p>所以这节经文问我们的，不是「地球什么时候烧掉」，而是「那一天我被找到的时候，是什么样子」。<strong>这不是说神要丢弃他所造的世界，也不是说今天怎样对待受造界都无所谓<\/strong>——火是审判与炼净，3:13 的终点是新天新地。被火显露的，正是我们今天怎样生活、怎样待人、怎样管理神所交托的一切。<\/p><p>〔背景〕「像贼」是主自己的比喻（太 24:42–44）。〔彼前〕彼得前书讲义第 1 章（彼前 1:7 信心被火试验）、第 4 章（彼前 4:12 火炼的试验）。<\/p>"},{"a":11,"z":13,"star":2,"grk":"<blockquote lang=\"grc\"><p>Τούτων οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις, προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται. καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.<\/p><\/blockquote>","lit":"<blockquote><p>「这一切既然都要这样解散，你们应当是何等样的人，活在圣洁的种种行为和敬虔的种种表现之中，等候并催促（或译：切切渴慕）神的日子来临；因那日，诸天被火焚烧而解散，元素被烈火熔化。但我们照他的应许，等候新的诸天和新的地，有义住在其中。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>怎样<\/td><td>ποταπός<\/td><td>potapos<\/td><td>G4217<\/td><td>—<\/td><td>何等样的<\/td><td>末世论的问题落在「你们是怎样的人」<\/td><\/tr><tr><td>为人<\/td><td>ἀναστροφή<\/td><td>anastrophē<\/td><td>G391<\/td><td>ἀνά ＋ στρέφω（转）<\/td><td>生活方式、行为<\/td><td>复数：一件一件具体的行为；彼前 1:15「在一切所行的事上」同字<\/td><\/tr><tr><td>敬虔<\/td><td>εὐσέβεια<\/td><td>eusebeia<\/td><td>G2150<\/td><td>εὖ（好）＋ σέβομαι（敬拜）<\/td><td>敬虔<\/td><td>1:3、6、7 同字：神已赐下的，现在活出来<\/td><\/tr><tr><td>仰望／盼望<\/td><td>προσδοκάω<\/td><td>prosdokaō<\/td><td>G4328<\/td><td>πρός ＋ δοκάω（等着看）<\/td><td>期待、等候<\/td><td>3:12、13、14 连用三次：等候是这一段的基调<\/td><\/tr><tr><td>切切仰望<\/td><td>σπεύδω<\/td><td>speudō<\/td><td>G4692<\/td><td>σπουδή（殷勤）同源<\/td><td>赶紧、催促；热切追求<\/td><td>可译「催促、加速」（见语法）；方法是悔改与圣洁，不是计算<\/td><\/tr><tr><td>镕化<\/td><td>τήκω<\/td><td>tēkō<\/td><td>G5080<\/td><td>—<\/td><td>熔化<\/td><td>新约仅此一次；赛 34:4 七十士译本同字<\/td><\/tr><tr><td>新<\/td><td>καινός<\/td><td>kainos<\/td><td>G2537<\/td><td>—<\/td><td>品质上的新<\/td><td>与 νέος（时间上的新）有别：更新，不只是另换一件<\/td><\/tr><tr><td>居<\/td><td>κατοικέω<\/td><td>katoikeō<\/td><td>G2730<\/td><td>κατά ＋ οἰκέω（居住）<\/td><td>定居、长住<\/td><td>对照 πάροικος（寄居的，彼前 2:11）：义不再寄居，而是安家<\/td><\/tr><\/table>","gram":"<p><strong>① σπεύδοντας——「切切仰望」还是「催促、加速」？<\/strong><\/p><ul><li><strong>热切渴慕<\/strong>（和合本「切切仰望」，KJV hasting unto）：σπεύδω 可作「热切追求」。<\/li><li><strong>催促、加速<\/strong>（ESV、NRSV 等，多数现代解经家）：σπεύδω 带直接受词通常是「使某事加快」；彼得自己在圣殿廊下说：「你们当悔改归正，使你们的罪得以涂抹，这样，那安舒的日子就必从主面前来到」（徒 3:19–20）；犹太传统也有「以色列若悔改，弥赛亚就来」的说法。<\/li><\/ul><blockquote><p><strong>最好的理解：原文较支持「催促」，但上下文定了催促的方法：3:9 的悔改与 3:11 的圣洁、敬虔——这是参与神的心意，不是掌握神的时间表。这不是叫人推算日子，也不是说人能用政治、军事或宗教工程「制造」主再来的条件；3:10「像贼」仍然管着 3:12。<\/strong><\/p><\/blockquote><p><strong>② καινοὺς οὐρανοὺς καὶ γῆν καινήν——毁灭后另造，还是炼净更新？<\/strong><\/p><ul><li><strong>毁灭后另造<\/strong>：3:10 若读「烧尽」，加上启 21:1「先前的天地已经过去了」，主张旧世界完全消失。<\/li><li><strong>炼净更新<\/strong>：καινός 是品质上的新；3:6 的洪水类比（世界「消灭」，地仍在）；受造之物「得享神儿女自由的荣耀」（罗 8:21）；主说「到复兴的时候」（太 19:28）。<\/li><\/ul><blockquote><p><strong>最好的理解：更新论更合 καινός 与 3:6 的洪水类比；但两派都同意，新天新地是神的作为，有义居在其中。无论采哪一说，都推不出「地球反正要烧，现在不必照顾」——这不是经文的推论。<\/strong><\/p><\/blockquote><p><strong>③ ἐν οἷς δικαιοσύνη κατοικεῖ<\/strong><\/p><p>「义」在这里像一个人：它要「住下来」。κατοικέω 是长住，对比 παροικέω 寄居。彼得前书称信徒是「客旅，是寄居的」（彼前 2:11）；新天新地里，连义都不再寄居。<\/p>","exp":"<p><strong>知道结局的人，不是坐着等，是活得不一样。<\/strong><\/p><p>彼得讲完天地销化，没有接着划一张时间表，而是问一个问题：「你们为人该当怎样？」ποταπούς——何等样的人。末世论在新约里从来不是好奇心的题目，是生活的题目。「圣洁」「敬虔」在原文都是复数：不是一种抽象的气质，是一件一件具体的行为——怎样说话、怎样花钱、怎样对待家人、怎样对待神所造的世界。彼得前书早就说过「在一切所行的事上也要圣洁」（彼前 1:15），同一个字 ἀναστροφή。<\/p><p>3:12–14 连续三次「仰望、盼望」。等候是这一段的基调。但彼得加了一个字 σπεύδοντας，和合本译「切切仰望」，原文更可能是「催促」。等候不是坐在月台上看表，是参与。<strong>我们催促那日子的方法不是算它，是活它：悔改、圣洁，把福音传给还没悔改的人（3:9）。<\/strong><\/p><p>然后是全章的题目：「但我们照他的应许，盼望新天新地，有义居在其中。」这应许出自以赛亚（赛 65:17；66:22），约翰在异象中看见它成就（启 21:1）。「新」καινός 是品质上的新；保罗说受造之物要「得享神儿女自由的荣耀」（罗 8:21）。<strong>终点不是毁灭，是更新。<\/strong><\/p><p>最美的是最后一个字 κατοικεῖ——住下来不走。在这个世界，义只是寄居的少数，常被挤到角落；在新天新地，义是主人，安家长住。<strong>今天活出圣洁的人，是在一个义还在寄居的世界里，先过着将来那个世界的生活。<\/strong>这就是 321「建立属神的体系」的终局：一个义安家的地方。<\/p><p>〔旧约〕赛 65:17；66:22。〔彼前〕彼得前书讲义第 1 章（彼前 1:15 在一切所行的事上圣洁）、第 2 章（彼前 2:11 客旅，是寄居的）。<\/p>"},{"a":14,"z":14,"star":1,"grk":"<blockquote lang=\"grc\"><p>Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,<\/p><\/blockquote>","lit":"<blockquote><p>「所以，亲爱的，你们既然等候这些事，就当竭力，使自己被他找到的时候，是没有玷污、无可指摘的，在平安之中。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>殷勤<\/td><td>σπουδάζω<\/td><td>spoudazō<\/td><td>G4704<\/td><td>σπουδή（热心）<\/td><td>竭力、赶紧<\/td><td>1:10、15 同字：在已得的恩典里用力<\/td><\/tr><tr><td>没有玷污<\/td><td>ἄσπιλος<\/td><td>aspilos<\/td><td>G784<\/td><td>ἀ（无）＋ σπίλος（污点）<\/td><td>无斑点<\/td><td>对照 2:13 假师傅 σπίλοι「已被玷污」<\/td><\/tr><tr><td>无可指摘<\/td><td>ἀμώμητος<\/td><td>amōmētos<\/td><td>G298<\/td><td>ἀ（无）＋ μῶμος（瑕疵）<\/td><td>无可挑剔<\/td><td>对照 2:13 μῶμοι「有瑕疵」；彼前 1:19 羔羊「无瑕疵、无玷污」<\/td><\/tr><tr><td>见<\/td><td>εὑρίσκω<\/td><td>heuriskō<\/td><td>G2147<\/td><td>—<\/td><td>找到、被发现<\/td><td>εὑρεθῆναι：与 3:10 εὑρεθήσεται 同一个动词<\/td><\/tr><tr><td>安然<\/td><td>εἰρήνη<\/td><td>eirēnē<\/td><td>G1515<\/td><td>—<\/td><td>平安、和好<\/td><td>1:2「愿恩惠、平安」：全卷开头的平安，在见主的那一刻等着<\/td><\/tr><tr><td>盼望<\/td><td>προσδοκάω<\/td><td>prosdokaō<\/td><td>G4328<\/td><td>πρός ＋ δοκάω（等着看）<\/td><td>期待、等候<\/td><td>连续第三次：等候不是一句话，是一种活法<\/td><\/tr><\/table>","gram":"<p><strong>① αὐτῷ 是什么与格？<\/strong><\/p><ul><li><strong>施事与格<\/strong>：「被他找到」（被动不定词 εὑρεθῆναι 的施事者）<\/li><li><strong>处所／关系与格<\/strong>：「在他面前」被发现<\/li><li><strong>利益与格<\/strong>：「为他」<\/li><\/ul><blockquote><p><strong>最好的理解：「被他找到」与「在他面前」都通，意思相近；重点是那一日找我们的是主自己——不是批评我们的人，也不是我们自己的良心。<\/strong><\/p><\/blockquote><p><strong>② ἄσπιλοι καὶ ἀμώμητοι——刻意与 2:13 对写<\/strong><\/p><p>2:13 假师傅是 σπίλοι καὶ μῶμοι（已被玷污，又有瑕疵）；3:14 信徒是 ἄσπιλοι καὶ ἀμώμητοι，加上否定的 ἀ-。而彼前 1:19 称基督为 ἀμνοῦ ἀμώμου καὶ ἀσπίλου（无瑕疵、无玷污的羔羊）——同一对字。洁净的源头是羔羊。<\/p><p><strong>③ ἐν εἰρήνῃ 是哪一种平安？<\/strong><\/p><ul><li>与神和好的状态<\/li><li>内心不惊慌<\/li><li>与人和睦（对照假师傅带来的分裂）<\/li><\/ul><blockquote><p><strong>最好的理解：以与神和好为主（1:2 的平安），带出见主时心里不慌张；和睦是它自然的果子。<\/strong><\/p><\/blockquote>","exp":"<p><strong>等候的终点，不是惊慌地被抓到，而是平安地被找到。<\/strong><\/p><p>「安然见主」原文是「在平安中被他找到」。3:10 说地和其上的工都要「被显露、被找到」，这里用同一个动词说到我们。那一日主要找到的，不只是我们做了什么，而是我们是怎样的人。<\/p><p>「没有玷污，无可指摘」是一对字，故意和 2:13 对着写：假师傅「已被玷污，又有瑕疵」；信徒却是没有玷污、没有瑕疵。<strong>分辨假师傅的最后一步，不是更会挑别人的瑕疵，是自己殷勤地求洁净。<\/strong><\/p><p>但这不是叫人靠自己变得无瑕。彼得前书说，我们被赎「乃是凭着基督的宝血，如同无瑕疵、无玷污的羔羊之血」（彼前 1:19）——同一对字。<strong>真正无玷污的是羔羊；我们被找到时的洁净，是从他来的。<\/strong>「殷勤」σπουδάσατε 是 1:5、1:10 的那个字：不是为了赚得恩典，是在神已赐下的一切里用力（1:3）。<\/p><p>所以「安然」不是自信，是和好。全卷第二节说「愿恩惠、平安……多多地加给你们」（1:2），快到最后一页，同一个平安在见主的那一刻等着。今天若想到主来就只有恐惧，问题不是你太敬虔，可能是还没有把自己完全交在羔羊的血底下。<strong>被他找到的人，是早已被他寻回的人。<\/strong><\/p><p>〔彼前〕彼得前书讲义第 1 章（彼前 1:19 无瑕疵、无玷污的羔羊）。<\/p>"},{"a":15,"z":16,"star":2,"grk":"<blockquote lang=\"grc\"><p>καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν ἔγραψεν ὑμῖν, ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.<\/p><\/blockquote>","lit":"<blockquote><p>「并且要把我们主的恒久忍耐看作得救；正如我们所亲爱的兄弟保罗，照着所赐给他的智慧写信给你们，他在一切的信中也都讲论这些事；其中有些难以明白的，那些没有受教、不坚固的人加以扭曲，就像扭曲其余的经书一样，以致自己灭亡。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>长久忍耐<\/td><td>μακροθυμία<\/td><td>makrothymia<\/td><td>G3115<\/td><td>μακρός（长）＋ θυμός（怒气）<\/td><td>恒久忍耐<\/td><td>3:9 μακροθυμεῖ 的名词：全章钥匙第二次出现<\/td><\/tr><tr><td>以…为<\/td><td>ἡγέομαι<\/td><td>hēgeomai<\/td><td>G2233<\/td><td>ἄγω（引领）<\/td><td>看作、认为<\/td><td>对照 3:9「有人以为他是耽延」：同一段时间，看作得救<\/td><\/tr><tr><td>兄弟<\/td><td>ἀδελφός<\/td><td>adelphos<\/td><td>G80<\/td><td>—<\/td><td>弟兄<\/td><td>ὁ ἀγαπητὸς ἡμῶν ἀδελφός：被纠正过的人称纠正他的人「亲爱的」<\/td><\/tr><tr><td>难明白的<\/td><td>δυσνόητος<\/td><td>dysnoētos<\/td><td>G1425<\/td><td>δυσ-（困难）＋ νοέω（理解）<\/td><td>难懂的<\/td><td>新约仅此一次；难懂，不是不可懂<\/td><\/tr><tr><td>无学问<\/td><td>ἀμαθής<\/td><td>amathēs<\/td><td>G261<\/td><td>ἀ（无）＋ μανθάνω（学习）<\/td><td>未受教的<\/td><td>新约仅此一次；不是没有学历，是不肯受教<\/td><\/tr><tr><td>不坚固<\/td><td>ἀστήρικτος<\/td><td>astēriktos<\/td><td>G793<\/td><td>ἀ ＋ στηρίζω（坚固）<\/td><td>不稳的<\/td><td>2:14 同字：假师傅引诱的正是这种人<\/td><\/tr><tr><td>强解<\/td><td>στρεβλόω<\/td><td>strebloō<\/td><td>G4761<\/td><td>στρέβλη（拉肢的刑架）<\/td><td>扭曲、硬拉<\/td><td>新约仅此一次：把经文绑上刑架，拉到自己要的长度<\/td><\/tr><tr><td>经书<\/td><td>γραφή<\/td><td>graphē<\/td><td>G1124<\/td><td>γράφω（写）<\/td><td>圣经、经书<\/td><td>新约中一贯指圣经；保罗书信与「其余的经书」并列<\/td><\/tr><\/table>","gram":"<p><strong>① 保罗「写了信给你们」指哪一封？<\/strong><\/p><ul><li><strong>罗马书<\/strong>：罗 2:4「他的恩慈是领你悔改」、9:22「多多忍耐宽容」，主题最贴近。<\/li><li><strong>写给小亚细亚的书信<\/strong>（加拉太书、以弗所书、歌罗西书）：受书地区与彼得前书（彼前 1:1）重叠。<\/li><li><strong>无法确定<\/strong>。<\/li><\/ul><blockquote><p><strong>最好的理解：无法确定，也不必确定。「他一切的信上也都是讲论这事」说明重点不在哪一封，而在保罗全部书信一致见证：主的忍耐是为了救恩。<\/strong><\/p><\/blockquote><p><strong>② 「难明白的」是哪些？<\/strong><\/p><ul><li><strong>恩典与自由<\/strong>：被扭曲成放纵（罗 6:1；加 5:13）——正对应 2:19「应许人得以自由」。<\/li><li><strong>末世<\/strong>：有人说主的日子已经到了（帖后 2:2）——正对应 3:3–4。<\/li><\/ul><blockquote><p><strong>最好的理解：两者都在范围内，而且正好是本卷第 2、3 章所对付的两个题目：假自由与讥诮末日。<\/strong><\/p><\/blockquote><p><strong>③ τὰς λοιπὰς γραφάς——「别的经书」<\/strong><\/p><ul><li><strong>圣经<\/strong>（多数解经家）：λοιπάς（其余的）把保罗书信放进 γραφαί 之列；新约中 γραφή 一贯指圣经。<\/li><li><strong>一般著作<\/strong>（少数）：与新约用法不合。<\/li><li>托名说据此推论本卷晚出（保罗书信已成集）；回应：保罗书信在他生前就被传抄互读（西 4:16），彼得只说他所知道的「一切的信」。<\/li><\/ul><blockquote><p><strong>最好的理解：这是新约内部第一次把使徒书信与「经书」并列。「难明白」不是禁止读的理由——出问题的是「强解」的人，不是读的人；保护读经的方法是在群体中、照上下文、谦卑地读。<\/strong><\/p><\/blockquote>","exp":"<p><strong>一个被当面抵挡过的使徒，在遗言里称抵挡他的人为「我们所亲爱的兄弟」。<\/strong><\/p><p>先看 3:15 前半：「以我们主长久忍耐为得救的因由」。动词 ἡγέομαι 和 3:9「有人以为他是耽延」是同一个字。同一段时间，有人看作耽延，彼得要你们看作得救——主多等一天，就多一个人可以回头。这是全章的钥匙第二次出现。<\/p><p>接着他请出一位证人：保罗。多年前在安提阿，保罗「当面抵挡」彼得，因为他「有可责之处」（加 2:11），那件事还写进了加拉太书，各教会都读得到。彼得在遗言里没有替自己辩护，也没有提那一次；他只说，保罗有「所赐给他的智慧」，保罗的信和我讲的是同一件事。<strong>这不是两位使徒的角力，是两个被同一位主宽容的人，站在同一个福音上。<\/strong>无己的人才说得出「亲爱的兄弟」；无己才能合一。<\/p><p>然后是很诚实的一句：「信中有些难明白的。」连使徒都承认保罗不好懂——这对每一个读罗马书读到头痛的人都是安慰。但彼得说，问题不在「难」，而在两种人：不肯受教的，和不坚固的。他们「强解」——στρεβλοῦσιν，原是把人绑上刑架拉扯的字。<strong>把经文绑起来，拉到自己要的长度，就是强解。<\/strong><\/p><p>所以这节经文不是叫会众别读难的经文，更不是说圣经只属于少数专家。它给的保护是：在群体中读、照上下文读、谦卑地读，读不懂时愿意被教——那正是「无学问」的反面。还有一件事：彼得把保罗的信和「别的经书」并列。<strong>我们手上的新约，有一部分是被一位曾经被它纠正的使徒亲口认可的。<\/strong><\/p><p>〔背景〕加 2:11–14——落点在主：使两位使徒同站一处的，是同一位主的长久忍耐。〔彼前〕彼得前书讲义第 5 章（彼前 5:12 保罗的同工西拉为彼得转交书信）。<\/p>"},{"a":17,"z":18,"star":3,"grk":"<blockquote lang=\"grc\"><p>ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ, αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ἀμήν.<\/p><\/blockquote>","lit":"<blockquote><p>「所以你们，亲爱的，既然预先知道，就要自己防备，免得被不法之人的迷惑一同带走，从你们自己稳固的立足点上坠落；你们却要在我们主和救主耶稣基督的恩典和知识上不断长进。愿荣耀归给他，从现在直到永世的那一日。阿们。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音译<\/th><th>Strong’s<\/th><th>字根／构词<\/th><th>基本字义<\/th><th>本节语境<\/th><\/tr><tr><td>预先知道<\/td><td>προγινώσκω<\/td><td>proginōskō<\/td><td>G4267<\/td><td>πρό（预先）＋ γινώσκω（知道）<\/td><td>预先知道<\/td><td>3:3「第一要紧的，该知道」——知道了，就不至于措手不及<\/td><\/tr><tr><td>防备<\/td><td>φυλάσσω<\/td><td>phylassō<\/td><td>G5442<\/td><td>φύλαξ（守卫）<\/td><td>看守、保护<\/td><td>中间语态 φυλάσσεσθε：看守自己；2:5 神「保护」挪亚同字<\/td><\/tr><tr><td>诱惑<\/td><td>συναπάγω<\/td><td>synapagō<\/td><td>G4879<\/td><td>σύν（一同）＋ ἀπάγω（带走）<\/td><td>一同被带走<\/td><td>加 2:13「连巴拿巴也随伙装假」同字<\/td><\/tr><tr><td>坚固的地步<\/td><td>στηριγμός<\/td><td>stērigmos<\/td><td>G4740<\/td><td>στηρίζω（坚固）<\/td><td>稳固的立足点<\/td><td>新约仅此一次；字根就是路 22:32「要坚固你的弟兄」<\/td><\/tr><tr><td>长进<\/td><td>αὐξάνω<\/td><td>auxanō<\/td><td>G837<\/td><td>—<\/td><td>生长、增长<\/td><td>现在式命令：不断地长；彼前 2:2「叫你们因此渐长」同字<\/td><\/tr><tr><td>知识<\/td><td>γνῶσις<\/td><td>gnōsis<\/td><td>G1108<\/td><td>γινώσκω（知道）<\/td><td>知识、认识<\/td><td>全卷以「认识」开头（1:2–3），以「知识」收尾<\/td><\/tr><tr><td>荣耀<\/td><td>δόξα<\/td><td>doxa<\/td><td>G1391<\/td><td>δοκέω（看来）<\/td><td>荣耀<\/td><td>1:17「从父神得尊贵荣耀」：山上看见的荣耀，最后归给他<\/td><\/tr><tr><td>永远<\/td><td>αἰών<\/td><td>aiōn<\/td><td>G165<\/td><td>—<\/td><td>世代、永世<\/td><td>εἰς ἡμέραν αἰῶνος：新约仅此一处的说法——永世的那一日<\/td><\/tr><\/table>","gram":"<p><strong>① τοῦ κυρίου 怎样管「恩典和知识」？<\/strong><\/p><ul><li><strong>两者都是主词所有格<\/strong>：主所赐的恩典、主所赐的知识。<\/li><li><strong>两者都是受词所有格<\/strong>：「关于主的恩典」较不自然。<\/li><li><strong>分别理解<\/strong>：恩典是主赐的（主词），知识是认识主（受词）。<\/li><\/ul><blockquote><p><strong>最好的理解：分别理解。一个所有格同时管两个面向：恩典从主来，知识是认识主。全卷第一句问安是「因你们认识神和我们主耶稣」（1:2），最后一句命令是在认识他上长进——首尾相扣。<\/strong><\/p><\/blockquote><p><strong>② αὐτῷ ἡ δόξα——颂赞归给谁？<\/strong><\/p><ul><li><strong>归给耶稣基督<\/strong>（多数解经家）：文法上最近、也是唯一的先行词。<\/li><li><strong>归给父神<\/strong>：新约颂赞多半归给父。<\/li><\/ul><blockquote><p><strong>最好的理解：归给基督。这是新约少数直接把荣耀归给基督的颂赞之一（又见提后 4:18；启 1:5–6），与 1:1「我们的神和救主耶稣基督」首尾呼应：全卷以基督的神性开头，以敬拜基督结束。<\/strong><\/p><\/blockquote><p><strong>③ εἰς ἡμέραν αἰῶνος<\/strong><\/p><p>字面是「直到永世的那一日」，新约只有这里这样说。本章一路讲「末后的日子」（3:3）、「主的日子」（3:10）、「神的日子」（3:12），最后一个「日」是永不落幕的那一日。<\/p><p><strong>④ 末尾 ἀμήν 的异文<\/strong><\/p><ul><li><strong>有「阿们」<\/strong>：𝔓72 א A C P Ψ 及多数抄本；和合本有「阿们」。<\/li><li><strong>无「阿们」<\/strong>：B 及少数小楷抄本；ECM／NA28 略去。<\/li><\/ul><blockquote><p><strong>最好的理解：有无「阿们」不改变意思；本讲义照 SBLGNT 列出（待工程轮以实档核对）。颂赞本身就是留给会众接上「阿们」的地方。<\/strong><\/p><\/blockquote>","exp":"<p><strong>使徒的最后一句话，不是叮咛，是赞美：愿荣耀归给他。<\/strong><\/p><p>3:17–18 是全卷的收束，次序不可颠倒：先防备，再长进，最后把荣耀归给主。<\/p><p>「你们既然预先知道」——3:3 说「第一要紧的，该知道」，现在知道了，就要「防备」。φυλάσσεσθε 是中间语态：看守自己。第 2 章说神「保护了」挪亚（2:5），用的是同一个字。神保护他的人，也叫他的人看守自己——不是两件事，是同一份看守的两面。<\/p><p>危险被描写得很具体：「被恶人的错谬诱惑」——συναπαχθέντες，一同被带走。这个字在新约另一处重要的出现是加 2:13，在安提阿「连巴拿巴也随伙装假」；那一次，带头「退去，与外邦人隔开」的正是彼得自己（加 2:12）。<strong>他知道一个坚固的人怎样在一顿饭之间被带偏，所以他写：要防备。<\/strong>「坚固的地步」στηριγμός 新约只在这里出现，字根正是主在那一夜对他说的「要坚固你的弟兄」（路 22:32）。<\/p><p>但防备不是全部。不坠落的方法不是站着不动，是「长进」——αὐξάνετε，持续地长。前书说「爱慕那纯净的灵奶……叫你们因此渐长」（彼前 2:2），又说「在这恩上站立得住」（彼前 5:12）；后书最后说在恩上长。<strong>站得住的人，还要长。<\/strong>长在恩典里——从主来的；长在知识里——认识主。<\/p><p>然后是最后一口气：「愿荣耀归给他，从今直到永远。」颂赞直接归给耶稣基督，与 1:1 首尾相扣。本章一直在讲「主的日子」，到这里成了「永世的那一日」。<strong>照教会的传统，一个快要被钉十字架的老人，最后写下的不是自己，是他。<\/strong>读完这卷书，我们记得的不该是彼得多伟大，而是主多恒久忍耐——愿荣耀归给他。<\/p><p>〔背景〕被等回来、被坚固的人，用一生坚固他的弟兄（路 22:32；加 2:11–13；约 21:18–19）。〔彼前〕彼得前书讲义第 2 章（彼前 2:2 渐长）、第 5 章（彼前 5:12 在这恩上站立得住→本章在恩上长进）。<\/p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《直等到天发亮，晨星在你们心里出现》"],["p","那是加利利海边的一个早晨，炭火还在烧着。"],["p","鱼和饼刚刚吃完，主转过头来对彼得说话。"],["q","「我实实在在地告诉你，你年少的时候，自己束上带子，随意往来；但年老了，就要伸出手来，别人要把你束上，带你到不愿意去的地方。」（约21:18）"],["p","约翰就在旁边听得清清楚楚。"],["p","后来他在福音书里加了一句注解："],["q","「耶稣说这话是指着彼得要怎样死，荣耀神。」"],["p","说完这话，主对彼得说：「你跟从我吧！」"],["p","彼得转过身看见约翰跟在后面。"],["p","他问了一个我们也常常会问的问题："],["q","「主啊，这人将来如何？」"],["p","我知道我会怎样死了，那么他呢？"],["p","主的回答很短，短得像一扇门关上："],["q","「我若要他等到我来的时候，与你何干？你跟从我吧！」"],["p","你跟从我吧。同一个早晨主说了两次。"],["p","三十多年过去了，那个海边的渔夫老了。"],["p","头发白了，手也没有从前那样有力。"],["p","罗马城里逼迫的风声一天比一天紧。"],["p","他知道海边那一句话快要应验了。"],["p","有人要把他束上，带他到不愿意去的地方。"],["p","于是他提起笔来写他最后的一封信。"],["q","「因为知道我脱离这帐棚的时候快到了，正如我们主耶稣基督所指示我的。」（1:14）"],["p","「所指示我的」指的就是海边那一天。"],["p","三十年来他一直知道自己会怎样死。"],["p","一个人知道自己快要走了会写什么？"],["p","一定是他心里认为最要紧的那几句话。"],["p","你看他第一行写的是：「西门彼得」。"],["p","西门是他的本名，是主在海边叫他的名字。"],["p","「约翰的儿子西门，你爱我比这些更深吗？」"],["p","主三次这样叫他，一句一句地"],["p","把他从三次不认主的羞愧里接了回来。"],["p","临终提笔他先写下那个被主叫过的名字。"],["p","而且「仆人」在前，「使徒」在后。"],["p","先是属于主的人，然后才是被差的人。"],["p","所以这封信不是一个伟人的回忆录"],["p","是一个被主接回来的人，最后一次说："],["p","你们也跟从他吧，他是值得跟从的。"],["p","今天这一章他留给我们三样东西："],["p","一份已经给了的礼物，一张要加上的清单"],["p","还有一盏在暗处发光、陪我们等天亮的灯。"],["p","第一，一切都已经给了。"],["q","「神的神能已将一切关乎生命和虔敬的事赐给我们，皆因我们认识那用自己荣耀和美德召我们的主。」（1:3）"],["p","请记得这是一封遗言。"],["p","照常理遗言是一连串的叮咛：你要这样，你不要那样。"],["p","可是彼得的第一句话并不是命令。"],["p","他还没有叫你做任何一件事，就先说："],["p","一切都已经赐给你们了。"],["p","「赐给」这个字原文是完成式。"],["p","不是将来才给，也不是看你表现再给"],["p","是已经给了，而且到今天还在你手上。"],["p","给了多少？关乎生命和虔敬的，一切。"],["q","你缺的，真的是更多的供应吗？"],["p","很多基督徒把信仰活成了一种缺乏"],["p","总觉得自己还差一点什么才算够。"],["p","再多一次聚会，再多一次特别的经历"],["p","再多一次被按手祷告，我才够属灵。"],["p","彼得说你并不缺。"],["p","你缺的是更深地认识那一位已经给的主。"],["p","一切是怎样送到我们手上的？"],["p","「皆因我们认识那……召我们的主。」"],["p","神没有寄一个包裹给我们就走了。"],["p","他把自己给了我们，一切都在认识他里面。"],["p","这里还有一个字值得我们停下来看。"],["p","「美德」——召我们的主有他的美德。"],["p","两节以后第五节的「德行」，原文正是同一个字。"],["p","他身上有的，他召我们也长出来。"],["p","我们要长成的，本来就是他的样子。"],["p","然后彼得写下全卷最高的一句话："],["q","「因此，他已将又宝贵又极大的应许赐给我们，叫我们既脱离世上从情欲来的败坏，就得与神的性情有分。」（1:4）"],["p","「与神的性情有分」这一句很容易讲偏"],["p","所以有人干脆跳过一句也不讲。"],["p","我们今天不跳过，也不把它讲过头。"],["p","「有分」这个字彼得其实很熟悉。"],["p","多年前在革尼撒勒湖边打鱼的时候"],["p","雅各、约翰是西门的「伙伴」，原文就是这个字。"],["p","那时候他们有分的是一条船、一网鱼。"],["p","如今主说：你要有分的是我的生命。"],["p","可是在这里我们要诚实地划一条线。"],["p","有分，不等于变成；伙伴，不等于船主。"],["q","创造者与受造者的分别，永远存在。"],["p","人有分于神的圣洁与爱，是在基督里与他联合；"],["p","却不是人变成神，也不与神的本质混同。"],["p","那么「有分」的内容是什么？彼得自己写出来了。"],["p","往前看是脱离世上从情欲来的败坏。"],["p","往后看是德行、知识、节制、忍耐，一直到爱。"],["p","神的性情落在人身上，长出来的是品格。"],["p","而且你看这是「应许」，是「赐给」。"],["p","有分是恩典，不是修炼，更不是争取来的。"],["q","长进不是爬上去见神，是神已经下来，把一切赐给我们。"],["p","第二，所以要在信心里加上。"],["q","「正因这缘故，你们要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知识。」（1:5）"],["p","「正因这缘故」，因为神已经给了一切"],["p","所以你们要分外地殷勤，不是闲着等。"],["p","恩典不叫人闲懒，恩典叫人殷勤。"],["p","这个次序不能颠倒：先有神的完成式"],["p","然后才有我们的命令式。"],["p","「加上」这个字原文有一个画面。"],["p","古希腊的城邦每年办戏剧节"],["p","要有人出钱供应一整个合唱团。"],["p","服装、排练、演出，全部由他供应。"],["p","那是一份荣誉，大家比的是谁供应得更大方。"],["p","彼得用这个字说：在你的信心里"],["p","大方地、慷慨地供应出德行来。"],["p","不是勉强凑数，是甘心乐意地给出去。"],["p","而且原文不是「在信心上面」，是「在信心里面」。"],["p","德行从信心里长出来，知识从德行里长出来。"],["p","这不是一道楼梯，是一棵慢慢长大的树。"],["p","你看这八样：信心、德行、知识、节制"],["p","忍耐、虔敬、爱弟兄的心、爱众人的心。"],["p","起点是信心，是神亲手分给你的。"],["p","知识只在第二级；认识主若停在脑子里"],["p","就长不出节制，也长不出忍耐。"],["p","最后两级都是爱人：先爱弟兄，再爱众人。"],["q","品格的顶点，不是一个人多属灵，是他多能爱。"],["p","所以这不是一张照表操课的步骤表"],["p","也不是做完第一项，才准做第二项。"],["p","这是一棵树，从神所给的信心里结出果子。"],["p","彼得接着说：长和不长，到底差在哪里。"],["q","「人若没有这几样，就是眼瞎，只看见近处的，忘了他旧日的罪已经得了洁净。」（1:9）"],["p","「只看见近处的」，原文是一个眯起眼睛的字。"],["p","英文的「近视」就是从这个字来的。"],["p","不是天生看不见，是自己把眼睛眯起来"],["p","只盯着眼前的那一点，别的都看不见。"],["p","眼前那一点是什么？这个月的帐单"],["p","同事的一个脸色，家人说的一句重话。"],["p","看不见的远处是什么？是那永远的国。"],["p","可是病根在下半句：「忘了」。"],["p","忘了他旧日的罪已经得了洁净。"],["p","他忘记的不是规条，是恩典。"],["p","一个忘了自己被赦免多少的人"],["p","长不出忍耐，也长不出爱。"],["p","这节经文不是拿来指着别人说你瞎了。"],["p","这是给我们每一个人的一次眼科检查。"],["p","治疗的方法也很温柔：不是更用力，是想起来。"],["p","彼得最知道这一点。那一夜在大祭司的院子里"],["p","鸡叫了，主转过身来看了他一眼。"],["p","「彼得便想起主对他所说的话。」"],["p","把他从跌倒里叫回来的，就是一次想起来。"],["q","「所以弟兄们，应当更加殷勤，使你们所蒙的恩召和拣选坚定不移。你们若行这几样，就永不失脚。」（1:10）"],["p","「永不失脚」。写这句话的人"],["p","曾经在加利利的水面上一步一步往下沉。"],["p","也曾经在那个寒冷的院子里跌得很重。"],["p","他知道失脚是什么滋味，也知道是谁拉住他。"],["p","「耶稣赶紧伸手拉住他。」"],["p","所以这一句不是一个强人的保证"],["p","是一个被主拉住过的人作的见证。"],["q","「这样，必叫你们丰丰富富地得以进入我们主救主耶稣基督永远的国。」（1:11）"],["p","「得以进入」原文又是那个供应的字。"],["p","只是这一次是神大方地供应我们。"],["p","你在信心里大方地供应德行；"],["p","神在那一天大方地供应你进国的门。"],["p","不是从门缝里挤进去，是被盛大地迎接进去。"],["p","而那国是我们主救主耶稣基督永远的国。"],["p","第三，灯与晨星。"],["p","彼得接着说他为什么要一再提醒。"],["q","「我以为应当趁我还在这帐棚的时候提醒你们，激发你们。」（1:13）"],["p","帐棚这个字，彼得一辈子都忘不了。"],["p","那一天在山上主在他们面前变了形像"],["p","脸面明亮如日头，衣裳洁白如光。"],["p","彼得看呆了，脱口而出："],["q","「主啊，我们在这里真好！ ,["p","彼得说我不认得他，说了一次又一次。"],["p","三次不认主，他用的就是这一个字。"],["p","写这句话的人，自己不承认过主。"],["q","「主转过身来看彼得……他就出去痛哭。」（路 22:61–62）"],["p","那么他和假师傅的分别在哪里呢？"],["p","不是他从来没有否认过主，"],["p","是主转过身来看了他一眼；是他出去痛哭；"],["p","是他在加利利海边被主接了回来。"],["p","所以这一章那些很严厉的话，"],["p","不是一个完美的人居高临下的定罪，"],["p","是一个曾经站在悬崖边上的人，"],["p","被主一把拉回来以后，看见别人正往下走，"],["p","就在后面大声地喊。"],["p","听懂这一点，就知道怎样读这一章。"],["p","不是拿来指着别人，是先拿来照自己。"],["p","彼得在这一章给了我们五个记号。"],["p","对基督：还承不承认那买他的主？"],["p","对金钱：是不是贪心取利？"],["p","对身体：是不是放纵肉身的情欲？"],["p","对权柄：是不是胆大任性？"],["p","对自由：是不是应许人自由，自己却作奴仆？"],["p","五个记号没有一个是口才，"],["p","也没有一个是宗派的标签，全都是果子。"],["p","主耶稣早就说得很清楚："],["q","「凭着他们的果子，就可以认出他们来。」（太 7:16）"],["p","所以我在讲台上不给你一张名单。"],["p","我不会点名今天任何一位牧者，"],["p","也不会点名任何教会、宗派或网络传道人。"],["p","讲台教的是记号，不是名单。"],["p","因为手里拿著名单的人，最容易忘记照自己。"],["p","我们再看第三节的捏造的言语。"],["p","捏造这个字，是陶匠照着客人想要的形状捏泥。"],["p","取利这个字，是做买卖。"],["p","做买卖的对象是谁呢？是你们。"],["p","在这种讲道里，会众不是羊，会众是货。"],["p","所以我要先问我自己："],["p","我讲道是照真理讲，还是照掌声捏？"],["p","我也要问你：你特别喜欢某一种讲道，"],["p","是因为它是真的，"],["p","还是因为它刚好捏成你想要的形状？"],["p","这就是分辨的起点：分辨，从自己开始。"],["p","天使、洪水、所多玛，很多人读到这里就害怕。"],["p","但请你看清楚这个句子的形状。"],["p","从第四节开始，原文是一个很长的若字句。"],["p","若神没有宽容犯罪的天使，"],["p","若神没有宽容上古那个世代，"],["p","若神倾覆了所多玛和蛾摩拉，那么——"],["p","这一口长长的气，要到第九节才吐出来。"],["p","所以不要停在火里面，"],["p","要一直读到那一只伸出来的手。"],["p","三个审判里面，藏着两次搭救。"],["p","第一次搭救，是挪亚。"],["p","彼得称他为传义道的，原文是传令官，"],["p","就是替王站在广场上宣告命令的人。"],["p","挪亚在一个不敬虔的世代替神喊话，"],["p","圣经没有记载家族以外有任何人回应。"],["p","用今天的标准，他是很失败的传道人。"],["p","但是神亲自看守了他一家八口。"],["p","他的价值不是用听众人数来量的，"],["p","是用神看守了他来量的。"],["p","第二次搭救，是罗得。"],["p","熟悉创世记的人读到这里一定会皱眉。"],["p","他看见平原滋润，就选了所多玛；"],["p","天使催他快走，他还迟延不走。"],["p","彼得怎么会称他为义人，而且一连三次？"],["p","答案就在第八节。"],["q","「因为那义人住在他们中间，看见听见他们不法的事，他的义心就天天伤痛。」（2:8）"],["p","伤痛这个字，原文本来是试金石，"],["p","后来变成了刑具的字，而且是天天如此。"],["p","罗得每天看见，每天心里被刺一下。"],["p","他没有能力改变那一座城，"],["p","也没有勇气自己离开，"],["p","但他的心还没有麻木。"],["p","所以义不是完美，义是一颗还会伤痛的心。"],["p","今天很多人也住在所多玛中间："],["p","在荧幕里，在办公室里，在饭局上。"],["p","危险不在于看见，在于看久了就不再痛了。"],["p","还会痛，就表示还有义心。"],["p","如果已经不痛了，"],["p","我们一起求主把那份痛再还给我们。"],["p","而且罗得蒙搭救，不是因为他够好。"],["p","是天使拉着他的手，把他 ["q","「亲爱的弟兄啊，你们既然预先知道这事，就当防备，恐怕被恶人的错谬诱惑，就从自己坚固的地步上坠落。」（3:17）"],["p","第一步，是防备，是看守自己"],["p","诱惑这个字的意思，是被人一同带走"],["p","彼得太知道那是什么滋味了"],["p","在安提阿，他自己就在一顿饭之间退去了"],["p","所以他说：你们要看守自己，不要大意"],["p","坚固的地步，和主那一夜对他说的话同一个字根"],["q","「你回头以后，要坚固你的弟兄。」（路22:32）"],["p","一个被主坚固过的人，用一生坚固他的弟兄"],["p","一直做到最后一封信的最后一段"],["p","但是防备，还不是全部"],["p","不坠落的方法，不是站在原地不动"],["q","「你们却要在我们主救主耶稣基督的恩典和知识上有长进。」（3:18）"],["p","第二步，是长进，一棵树不长，就会倒"],["p","在恩典上长，就是越来越知道自己是被白白爱的"],["p","在知识上长，就是越来越认识那一位主"],["p","那一位等你、找你、又坚固你的主"],["p","彼得前书的最后说：在这恩上站立得住"],["p","彼得后书的最后说：在恩典上有长进"],["p","站得住的人，还要长"],["p","然后是第三步，也是他一生最后一句话"],["q","「愿荣耀归给他，从今直到永远。阿们！」（3:18）"],["p","照教会的传统，一个快要殉道的老人"],["p","他最后一口气，不是叮咛，而是赞美"],["p","他没有说记得我，他说：愿荣耀归给他"],["p","这就是让耶稣得着一切的荣耀"],["p","这就是从暂时的观点，改变成永恒的观点"],["p","永恒的观点，不是叫我们离开这个世界"],["p","而是叫我们在世界里，活得不一样"],["p","焦点不在新闻，不在自己，也不在别人"],["p","焦点在那一位宽容我们、等我们回家的主身上"],["p","我们今天等候主，不是坐在月台上看表"],["p","也不是算日子、猜年份，被每一条新闻牵着走"],["p","而是在主还在宽容的这一段日子里"],["p","悔改、圣洁、传福音，彼此坚固"],["p","一同警醒，等候主再来"],["p","那一天什么时候到？我不知道，你也不知道"],["p","但是我们知道，要来的那一位是谁"],["p","所以，下一次再有人问你：应许在哪里呢？"],["p","你可以平平静静地回答他"],["p","应许在他的话里，在他还开着的门里"],["p","也在我这一条被他等回来的命里"],["p","让我们一起低头祷告"],["p","主啊，叫我们记得你做过的，不在等候里灰心"],["p","叫我们防备，不从坚固的地步上坠落"],["p","叫我们在你的恩典和知识上，天天有长进"],["p","叫我们一生最后的一句话，也是愿荣耀归给你"],["p","奉主耶稣基督的名祷告，阿们"]]}},"issues":[{"id":"ISS00_1","t":"立场一・作者、正典与犹大书：彼得后书真是使徒彼得写的吗？早期教会为什么对它有争议？","r":"1:1；1:14–18；3:1；3:15–16","ch":[1,2,3],"why":"一、经文问的是什么：这封信开头说「作耶稣基督仆人和使徒的西门彼得」（1:1），又说「我们同他在圣山的时候，亲自听见这声音从天上出来」（1:18）。可是在新约二十七卷里，彼得后书是作者问题争议最大的一卷：今天许多学者认为它是彼得死后由门生托名写成的；早期教会也确实有人对它存疑；而第 2 章又与犹大书 4–18 节大量相似。一位弟兄读到这些，很自然会问：如果连作者都有争议，这封信还可信吗？","pos":[["使徒彼得亲笔或经同工协助写成（本讲义采用）","","理由来自经文本身：1:1 自称「西门彼得」，而且用了新约只见于徒 15:14 的希伯来拼法 Συμεών；1:14「正如我们主耶稣基督所指示我的」对应约 21:18–19 主预告他的死；1:16–18 以第一人称见证登山变像；3:1「第二封信」最自然指彼得前书；3:15 称保罗为「我们所亲爱的兄弟」。许多福音派注释家（例如 Michael Green 等）持此看法，认为文体差异可以用代笔人与题材不同解释。"],["托名说（门生在彼得死后以他的名义写成）","","许多近代学者持此看法（例如 Richard Bauckham 的注释），主要四点：①希腊文风格与彼得前书差很多；②3:4「列祖睡了」、3:16「保罗一切的信」像第二代教会的口吻；③早期教会对它有争议；④「遗言」是当时托名作品的常见文体，读者也明白那是托名。持此说的学者多半并不因此否认这封信的属灵价值，只是认为作者是彼得的门生。"],["对托名说四点的回应","","①彼得前书明说「我略略地写了这信，托我所看为忠心的兄弟西拉转交你们」（彼前 5:12），本书没有提代笔人，两封信经手的人可能不同，而且一封讲受苦、一封讲错谬，用字本来会不同；②「列祖」最自然指旧约的先祖（来 1:1），保罗的信在六十年代已在各教会传阅（西 4:16）；③早期教会的争议属实，本讲义诚实交代（见 ISS00_8），但争议不等于否定；④文体本身不证明托名，真正临终的人也会写遗言。"],["与犹大书的关系：三说并陈","","2:1–3:3 与犹 4–18 约有十九处相似。①犹大书在先，彼得后书采用了它（今天多数学者）；②彼得后书在先，犹大书引用它（理由之一：彼后 2:1、3:3 用未来式「必有」，犹大书说这些人「已经」混进来）；③两封信共用早期教会一份关于假师傅的教导材料。详见 ISS00_6。"]],"con":[],"say":"本讲义的立场：作者是使徒彼得——就是在登山变像那天说「主啊，我们在这里真好」、后来三次不认主又被主接回来的那一位；托名说的理由与回应并陈，早期教会「有争议的书卷」这段历史诚实交代，不回避；与犹大书的关系三说并陈，不裁判。讲台只讲一句：写这封信的人，就是曾经想在山上搭帐棚、如今知道「我脱离这帐棚的时候快到了」（1:14）的那个人。","care":"作者问题是书房里的功课，不是信心的地基。一位刚开始读经的弟兄，若在网上看到「彼得后书是伪作」就慌了，牧者要先告诉他两件事：第一，这个问题古人就问过，教会不是不知道，是想了三百年之后才确认它；第二，不论学者怎么判断作者，这封信所见证的主没有改变——「并不是随从乖巧捏造的虚言，乃是亲眼见过他的威荣」（1:16）。牧者不必在讲台上逐条辩论，也不要把怀疑的人当作不属灵；陪他读完全卷，让他自己看见信里那位恒久忍耐的主。信心是建立在主身上，不是建立在我们能回答每一个学术问题上。"},{"id":"ISS00_2","t":"立场二・与神的性情有分：「与神的性情有分」是什么意思？人会不会成为神？","r":"1:3–7","ch":[1,2,3],"why":"二、经文问的是什么：「因此，他已将又宝贵又极大的应许赐给我们，叫我们既脱离世上从情欲来的败坏，就得与神的性情有分。」（1:4）原文 θείας κοινωνοὶ φύσεως——「有分于神的本性」。这是全卷神学最高、也最容易讲偏的一句：一边有人把它讲成人可以修成神（某些新兴宗教与部分成功神学讲员），另一边有人因为怕讲错，干脆跳过不讲。两种做法都对不起这节经文。","pos":[["成神论（theosis，东正教）","","东正教传统从亚他那修「神成为人，好叫我们得以成神」一路发展，到十四世纪帕拉马（Gregory Palamas）系统化地区分神的「本质」（essence）与「能力」（energies）：人永远不能有分于神的本质，人与神之间的分别永远存在；人是借着恩典有分于神的「能力」，就是神的生命、光与圣洁，越来越像神。准确地说，东正教的成神论并不是说人变成另一位神，而是说受造的人借恩典与神相交、被神的生命充满。本讲义尊重这个传统，不嘲讽。"],["与基督联合（改革宗、路德宗）","","借着圣灵与基督联合，就有分于基督的生命；成圣是被更新成神的形像。加尔文注释本节时指出，这里的「性情」不是指神的本质，乃是指品质——神要使我们的品格与他相似。这个读法把 1:4 放在「在基督里」的框架中：我们有分的不是神性本身，而是在联合里得着的新生命。"],["完全的爱（卫斯理传统）","","有分于神的圣洁与爱；卫斯理强调在今生可以被圣灵充满到一个地步，心里以完全的爱爱神爱人（他所说的「基督徒的完全」不是无过失，而是爱的完全）。这个读法看重 1:5–7 那张以「爱众人的心」作结的清单。"],["道德的相似（许多福音派注释）","","有分于神的道德品格——圣洁、良善、爱——不是本体上的有分。理由是下文立刻说「脱离世上从情欲来的败坏」，并接着列出德行、知识、节制等品格（1:5–7）；彼得关心的是生命的样子，不是形而上的本体。"]],"con":[],"say":"本讲义的立场：采「在基督里与基督联合，有分于神的生命与品格（圣洁、爱）」，四读并陈。明说三条界线：①创造者与受造者的分别永远存在——这节经文不是说人会成为神，也不是说人与神同等或与神的本质混同；②有分是恩典，不是修炼——「他已将……应许赐给我们」（1:4），起点是 1:3「神的神能已将一切……赐给我们」；③有分的内容就写在下文：脱离败坏（1:4），加上德行、知识、节制、忍耐、虔敬、爱弟兄的心、爱众人的心（1:5–7）。321 说「无己不是没有，乃是进入无限」，在本卷只能说成：无己的人进入与无限之神的相交，基督在他里面活（加 2:20）；不是人变成无限。","care":"这节经文对一个自卑、觉得自己一无是处的弟兄，是极大的安慰：神不只赦免他，还要把自己的生命与品格分给他。对一个想靠属灵经历高人一等的人，它却是一面镜子：真正有分于神性情的人，看起来不是更神秘，而是更节制、更忍耐、更会爱人。讲台不可因为怕被误会就跳过 1:4，也不可把它讲成人可以成神的应许。检验很简单：听完这节的人，是更想敬拜神，还是更想抬高自己？前者才是彼得的意思。"},{"id":"ISS00_3","t":"立场三・分辨假教训：怎样分辨假教训？圣经可以自己读吗？","r":"1:20–21；2:1–19；3:16","ch":[1,2,3],"why":"三、经文问的是什么：「将来在你们中间也必有假师傅」（2:1）——危险不是从外面来，是从里面来。会众自然会问：今天谁是假师傅？我怎么知道我的教会、我听的讲道是真的？而 1:20「经上所有的预言没有可随私意解说的」和 3:16「信中有些难明白的」，又常被拿来说「你们自己不要乱读圣经」。这一条要回答两件事：怎样分辨，以及谁可以读经。","pos":[["名单式分辨","","把第 2 章当作一张通缉令，替今天的人对号入座：点名某位牧者、某个宗派、某个网络传道人是假师傅。这种做法在网络上很普遍，出发点常是热心护教，但它把彼得给的记号变成了标签，结果是会众更会怀疑别人，不是更会分辨果子；本讲义不采。"],["记号式分辨（本讲义采用）","","彼得给的是五个记号：对基督——「连买他们的主他们也不承认」（2:1）；对金钱——「因有贪心，要用捏造的言语在你们身上取利」（2:3，参 2:14–15）；对身体——「随肉身、纵污秽的情欲」（2:10，参 2:14、18）；对权柄——「胆大任性」（2:10）；对自由——「应许人得以自由，自己却作败坏的奴仆」（2:19）。五个都是果子，不是口才，也不是宗派标签；这使我们想起主自己的话：「凭着他们的果子，就可以认出他们来。」（太 7:16，参 7:15–20）"],["1:20「私意」指读者的解释","","有些译本与传统把 1:20 读成：个人不可以自己解释预言，要由教会权威解释。这个读法的关怀是防止各说各话，但它容易被推成「平信徒不要自己读经」。"],["1:20「私意」指预言的来源（本讲义采用）","","1:21 用「因为」接上：「因为预言从来没有出于人意的，乃是人被圣灵感动，说出神的话来。」可见 1:20 的焦点是预言从哪里来——不是先知自己的意思，而是圣灵的感动；它讲的是圣经的来源与权威，不是禁止信徒读经。许多福音派注释采此读法。"]],"con":[],"say":"本讲义的立场：①讲台教记号，不给名单——不点名今天任何牧者、教会、宗派、网络传道人为假师傅；②分辨从自己开始，五个记号先照自己；③1:20 的「私意」指预言的来源，不是禁止会众读经；读经的保护是在群体中读、照上下文读、谦卑地读（3:16「强解」的反面），像庇哩亚人「天天考查圣经，要晓得这道是与不是」（徒 17:11）；④遇到教会内真正的错谬或侵害，照着程序、在爱中、公开透明地处理，不在网络上猎巫。对 2:3 最好的回应，是教会财务透明——像保罗说的：「我们留心行光明的事，不但在主面前，就是在人面前也是这样。」（林后 8:21）","care":"第 2 章最难的功课，是怎样讲假师傅而自己不变成法利赛人。写这一章的彼得，自己曾三次不承认主；他和假师傅的分别不是从没跌倒，而是哭了、回头了、被主接回来了。所以牧者讲这一章，先低头照自己：我对金钱、对权柄、对身体、对自由是否结出正确的果子？教会的帐目是否公开、经得起查？也不要用「假师傅」一词压制提出问题的会友——2:10 被定罪的正是师傅，在上位的人更要被检验（彼前 5:3「也不是辖制所托付你们的」）。分辨的目的是自己不坠落（3:17），也把迷路的人找回来，不是证明自己是对的。"},{"id":"ISS00_4","t":"立场四・主的日子、新天新地与受造界：主为什么还没有来？地球最后会怎样？","r":"3:3–13","ch":[1,2,3],"why":"四、经文问的是什么：「主要降临的应许在哪里呢？」（3:4）这是两千年来每一代信徒心里都问过的问题。彼得的回答有四步：「主看一日如千年，千年如一日」（3:8）；「不是耽延，乃是宽容」（3:9）；「主的日子要像贼来到一样」（3:10）；「盼望新天新地，有义居在其中」（3:13）。这一段最常被拿去做两件事：用 3:8 换算末日或创造的日子；用 3:10–12 说地球反正烧掉、不必照顾受造界。本条沿用帖撒罗尼迦前书立场二，只补本卷 3:8–13 这一笔。","pos":[["沿用帖撒罗尼迦前书立场二","","主一定会亲自回来；日子没有人知道，也不必知道（帖前 5:1–2；太 24:36）；这段教导的用途是安慰与预备，不是恐吓。被提时间与千禧年各派并陈，每一派都承认对方是弟兄；不定时间表，不把时事对号入座。"],["3:8 当作换算公式（本讲义不采）","","有人说「一日等于一千年，所以创造六日之后六千年主必再来」，这种换算不是本节的意思；也有人用 3:8 推论创造的一日就是一千年，同样不是本节的意思。诗 90:4 讲的是神超越时间；彼得两个方向都说——「一日如千年，千年如一日」——正是为了取消换算。本讲义不用 3:8 算末日，也不用它算创造日。"],["3:10 的异文：烧尽或显露","","和合本「地和其上的物都要烧尽了」跟随 κατακαήσεται 的读法；SBLGNT 与多数新近校勘本作 εὑρεθήσεται（必被显露、被发现），意思是在神面前一切都要被显明（这使我们想起林前 3:13「各人的工程必然显露」）；NA28 作 οὐχ εὑρεθήσεται（不被发现）。三种读法都有学者支持，但没有一种是在说神要丢弃他所造的世界。"],["3:13 的「新」：更新还是另造","","一派强调旧天地完全消灭，另造一个全新的；另一派指出「新」καινός 多指品质上的新，与罗 8:21「受造之物仍然指望脱离败坏的辖制，得享神儿女自由的荣耀」相合，倾向更新而不是丢弃。本讲义倾向更新的读法，并陈另一读。"]],"con":[],"say":"本讲义的立场：沿用帖撒罗尼迦前书立场二——不算日子，随时预备。本卷补四点：①3:8 不是公式，两个方向都说，正是取消换算；②3:9 的焦点是宽容：主的「慢」是爱的「等」，等候的时间是悔改与传福音的时间；③3:10 和合本「烧尽了」与「必被显露」两读并陈，两读都不是神丢弃受造界；④3:13 的「新」是更新，落点是「有义居在其中」。3:12「切切仰望」是圣洁与传福音的参与，不是推算或加速日期。讲台不以 3:5–7 裁判年轻地球或古老地球，也不把照顾受造界变成政治动员。","care":"「应许在哪里呢？」谁没有在心里问过？一位等了很久的姐妹——等家人信主、等病得医、等主回来——最需要听的不是一张时间表，而是 3:9：主的慢不是不在乎，是不愿有一人沉沦；而写这句话的彼得，自己就是被主宽容等回来的人。另一方面，盼望新天新地的人，今天不会随便糟蹋神所造的世界；「你们为人该当怎样圣洁，怎样敬虔」（3:11）是今天的生活，包括怎样用钱、用资源、对待邻舍。永恒的观点不是叫人离开世界，而是叫人在世界里活得不一样。果效是忍耐，不是恐慌。"},{"id":"ISS00_5","t":"立场五・得救的确据与背道：得救有确据吗？背道的人还能回来吗？","r":"1:9–11；2:20–22；3:9、17","ch":[1,2,3],"why":"五、经文问的是什么：1:10 说「应当更加殷勤，使你们所蒙的恩召和拣选坚定不移。你们若行这几样，就永不失脚」；2:20–22 却说有人「后来又在其中被缠住、制伏，他们末后的景况就比先前更不好了」，还用「狗所吐的，牠转过来又吃」作比喻。一位跌倒的弟兄读到这里，会问：我是不是就是那条狗？拣选要靠我自己坚定吗？本条沿用希伯来书立场二，只补本卷 1:10 与 2:20–22 这一笔。","pos":[["沿用希伯来书立场二","","不替各教会在「救恩会不会失落」上定案，两边都有敬虔爱主的人；但各派都必须同意三个落点：警告是真的，不可讲成无关痛痒；警告的对象是故意、持续地弃绝基督的人，不是软弱跌倒又想回来的人；作者自己的结论是确据与安慰（来 6:9「却深信你们的行为强过这些，而且近乎得救」）。"],["1:10「坚定不移」：确据从哪里来","","「坚定不移」βεβαίαν 是商业与法律用语，指确认、生效。一派读为：殷勤的生活使蒙召在我们自己的经历里得到确认（主观的确据）；另一派读为：殷勤的生活在人面前证明蒙召是真的。两派都同意：拣选的源头是神，不是我们的殷勤；「永不失脚」是应许，不是恐吓。"],["2:20–22 三读","","①真信徒可以失落救恩（阿米念传统），理由是「因认识主救主耶稣基督，得以脱离世上的污秽」看起来是真实的经历；②这些人从未真正重生（加尔文传统），理由是 2:22 的比喻正是说本性没有改变——狗洗干净了还是狗、猪洗净了还是猪；③警告本身是神保守信徒的工具（许多福音派），神借着真实的警告使属他的人不至坠落（3:17）。"],["上下文的读法（本讲义的落点）","","不论采哪一读，2:20 的「他们」在文法上接续 2:17–19 的「这些人」——无水的井、说虚妄矜夸大话、应许人自由自己却作奴仆的假师傅；被他们引诱的，是「那些刚才脱离妄行的人」（2:18）。换句话说，彼得在这里最严厉的话，是对着误导人的人说的，同时也在保护被误导的人。2:21「倒不如不晓得为妙」讲的是明明晓得义路、却故意背弃的人，不是正在挣扎、为自己的跌倒伤痛的人。"]],"con":[],"say":"本讲义的立场：沿用希伯来书立场二。本卷补两点：①1:10 的「坚定不移」是在已有的恩典上活出来的确认，起点仍是 1:3「神的神能已将一切……赐给我们」，「永不失脚」是给殷勤者的应许；②2:20–22 三读并陈，落点是上下文——这段描述的是假师傅与跟随他们的人（2:17–19），不是在挣扎中跌倒、仍然想回头的弟兄姐妹。跌倒的人要同时听见 1:9「旧日的罪已经得了洁净」与 3:9「乃愿人人都悔改」：主还在等。本讲义绝不对任何个人说「你已经没救了」。","care":"一个会因为害怕自己是那条「转过来吃」的狗而流泪、失眠的人，正是心还没有刚硬的人。牧者要记得：写 2:22 的彼得，自己也曾「转过去」——三次不认主；但主早就说过「你回头以后，要坚固你的弟兄」（路 22:32）。回头有两种：狗回到呕吐物，彼得回到主面前。所以讲这段时，不要用它吓唬软弱的人，也不要轻描淡写；要把跌倒的人带回 1:9 与 3:9，陪他祷告、陪他走回群体。检验标准只有一个：一位刚跌倒、很想回头的弟兄听完，是更想回来，还是更绝望？"},{"id":"ISS00_6","t":"彼得后书与犹大书谁抄谁？","r":"2:1–3:3","ch":[1,2,3],"why":"六、为什么这是个问题：把彼得后书 2:1–3:3 和犹大书 4–18 节并排读，会发现约十九处相似——假师傅偷偷混进来、犯罪的天使、所多玛与蛾摩拉、毁谤尊位、天使不敢用毁谤的话、像没有灵性的畜类、巴兰、无水的云（井）、墨黑的幽暗、末世好讥诮的人。两封信显然有文字上的关系。也有不同：犹大书提到天使长米迦勒与摩西的尸首（犹 9），也引了以诺的预言（犹 14–15）；彼得后书没有这两处，却多了挪亚与罗得两个被保守的人。问题是：谁在先？这会不会影响彼得后书的权威？","pos":[["犹大书在先（今天多数学者）","","理由：犹大书较短而紧凑，彼得后书像是扩充与调整；彼得后书没有直接引用以诺一书与摩西尸首的传说，可能是有意略去读者不熟或易生误会的材料；一般认为较长的文本扩充较短的文本，比把较长的删成较短的更自然。持此说的学者，有的仍主张彼得是作者（彼得可以采用犹大的材料），也有的以此支持托名说。"],["彼得后书在先","","理由：彼后 2:1 说「将来在你们中间也必有假师傅」、3:3 说「在末世必有好讥诮的人」，都用未来式；犹大书则说这些人已经偷着进来了（犹 4），并提醒读者「要记念我们主耶稣基督之使徒从前所说的话」（犹 17），像是在回顾使徒先前的预言。较早期的一些注释家持此说。"],["共用一个早期教会的教导材料","","理由：两封信相似的是主题与例证的次序，但用字相同的地方并不算多；可能两位作者都使用了早期教会对付假师傅时口传或成文的一套教导。这个说法解释了为什么两封信既相似又各有取舍，但这份共同材料没有留存下来，只能推论。"]],"con":[],"say":"本讲义的立场：三说并陈，不裁判。不论谁在先，圣经作者使用其他材料并不减损默示——路加也是先把各样事从起头详细考察过，才写成福音书（路 1:1–4）。两封信的分工是：彼得后书讲「长进中的分辨」，犹大书讲「为真道竭力争辩」；〔犹〕互见先标经文出处，将来犹大书讲义制作时再分工。","care":"对多数会众来说，知道两封信很像，反而是一个鼓励：早期教会不是各说各话，而是两位主的仆人面对同样的危险，说出了同样的警告。这就像两位牧者在不同地方看见同样的狼，喊出同样的话。读经小组遇到这个题目，不必为「谁抄谁」争到面红耳赤；可以把两段并排读，看彼得多了什么——他多了挪亚与罗得，也多了 2:9「主知道搭救敬虔的人」。彼得讲审判，是为了叫敬虔的人安心。另外，也要提醒小组：这个问题与信心的根基无关；不论谁在先，两封信都在新约里，两位作者都把读者带回同一位主——「主知道搭救」（彼后 2:9），「那能保守你们不失脚……的我们的救主独一的神」（犹 24–25）。把力气放在听见警告、照自己、彼此坚固，比放在考证先后更能让人长进。"},{"id":"ISS00_7","t":"彼得后书写于何时何地？","r":"1:13–15；3:1","ch":[1,2,3],"why":"七、为什么这是个问题：信里没有直接说写于何地、何时。我们只知道三件事：作者知道自己「脱离这帐棚的时候快到了」（1:14）；这是写给同一群读者的「第二封信」（3:1）；保罗的信已经在各教会流传（3:15–16）。年代的判断，和作者问题绑在一起：主张彼得是作者的，必须把写作放在彼得殉道之前；主张托名的，则多半放在第一世纪末到第二世纪上半。","pos":[["约主后 64–68 年，写于罗马，彼得殉道前（本讲义采用）","","早期教会的传统说，彼得在尼禄皇帝逼迫基督徒期间于罗马殉道，一般推定在主后 64 至 68 年之间。1:14 说主已指示他离世的时候快到了，正对应约 21:18–19；3:1 的「第二封信」若指彼得前书，而彼得前书寄自「巴比伦」（彼前 5:13，多数解经家认为指罗马），那么本书也很可能写于罗马，时间在彼得前书之后不久、彼得殉道之前。"],["托名说的晚期年代（约主后 80 年至二世纪上半）","","持托名说的学者，理由包括：3:4「列祖睡了」被读为第一代基督徒已经过世；3:16「他一切的信」似乎预设保罗书信已经被收集；全卷对「主为什么还没来」的关注，被认为反映第一代之后的处境。具体年代各家不同，大约从主后 80 年到二世纪上半都有人主张。"],["对晚期年代理由的回应","","「列祖」在新约最自然指旧约的先祖（来 1:1；徒 3:13），不一定指第一代信徒；保罗在世时就叫教会彼此传阅他的信（西 4:16），六十年代各教会拥有几封保罗书信并不奇怪；而「主为什么还没来」的问题，在帖撒罗尼迦前后书（主后五十年代初）就已经出现。这些理由都不足以把年代推到彼得死后。"],["3:1「第二封信」指哪一封","","多数解经家认为指彼得前书，因为两封信都以提醒、激发读者为目的；也有学者指出彼得前书的读者在小亚细亚五个地区（彼前 1:1），彼得后书没有写明收信人，所以「第一封信」也可能是一封已经失传的信。本讲义采最自然的读法：指彼得前书，并在互见中把两卷连起来读——前书教人在火里站稳，后书教人在雾里看清。"]],"con":[],"say":"本讲义的立场：约主后 64–68 年，写于罗马，彼得殉道之前不久；托名说的晚期年代并陈。年代无法精确到某一年，讲台上不必强调数字，只需要让会众知道：这是一位老人临终前写的信，写在尼禄逼迫的阴影下，写给他放心不下的羊群。","care":"年代这个题目，真正要带给会众的不是数字，是画面：一个知道自己快要被处死的老人，没有写自己的回忆录，也没有为自己辩护，而是写信「提醒你们，激发你们」（1:13），最后一句是「愿荣耀归给他」（3:18）。这对每一个面对年老、疾病或人生最后一段路的弟兄姐妹，都是一个榜样：帐棚要拆了，但还可以为主的羊多说几句话。牧者可以问会众：如果你知道时候不多，你最想提醒你所爱的人哪三件事？今天就可以说出口，不必等到帐棚要拆的那一天。"},{"id":"ISS00_8","t":"彼得后书怎样成为正典？","r":"1:1；3:15–16","ch":[1,2,3],"why":"八、为什么这是个问题：彼得前书在早期教会一致被接受，彼得后书却不是。它在现存二世纪的教父著作中几乎没有被明确引用；三世纪的俄利根提到它有人存疑；四世纪初的优西比乌把它列为「有争议的书卷」。一位认真的信徒会问：既然古人都有疑问，为什么今天它在我们的圣经里？教会是随便决定的吗？","pos":[["早期的存疑（本讲义诚实交代）","","根据优西比乌《教会史》的记载，俄利根说彼得留下一封公认的书信，「或许还有第二封，但这一封是有疑问的」。优西比乌本人也说，人们传下来的彼得后书不算公认的书卷，但因为对许多人有益，就与其他经书一同受到重视；他在整理各书卷时，把雅各书、犹大书、彼得后书、约翰二书与三书列为「有争议」（antilegomena）、但为多数人所知的书卷。耶柔米也提到，许多人因为文体不同而怀疑它。叙利亚教会较早期的译本起初也没有收入这封信。"],["逐渐被普遍接受","","四世纪时，主后 367 年亚他那修第 39 封节期书信列出新约二十七卷，彼得后书在其中；北非的希波会议（393 年）与迦太基会议（397 年）也承认同样的书目。现存最早包含彼得后书的抄本之一是蒲草纸抄本 P72（约三至四世纪），与彼得前书、犹大书抄在一起。此后东西方教会普遍接受它。"],["怀疑者的读法","","有学者认为，正典化过程本身就说明这封信可疑：如果真是彼得写的，为什么不像彼得前书那样很早就被公认？它被接受，主要是因为内容正统、对教会有益。"],["福音派的读法","","早期的存疑正说明教会不是照单全收，而是谨慎地分辨；一封短信流传较慢、较少被引用，并不奇怪（犹大书、约翰二三书也是如此）。教会不是「制造」正典，而是在长期的使用与分辨中「承认」那些本来就带有使徒权柄的书卷。"]],"con":[],"say":"本讲义的立场：诚实交代彼得后书是早期教会「有争议的书卷」之一——俄利根提到有疑，优西比乌列为有争议；也交代它最后被普遍接受——亚他那修 367 年第 39 封节期书信、迦太基会议 397 年。争议不等于否定，谨慎正是教会分辨的证据。彼得在 3:16 把保罗的信与「别的经书」并列，本身就见证了新约正典在使徒时代已经开始成形。讲台不必细述正典史，但教导课程与小组应该让会众知道这段历史，免得他们日后从怀疑者口中第一次听见。","care":"一位弟兄若在网上第一次读到「彼得后书差点没进圣经」，可能会觉得被骗了：怎么教会从来没告诉我？所以本讲义选择自己先说。诚实不会伤害信心，隐瞒才会。可以这样陪他想：古人那么认真地问、问了那么久，正好说明今天手上的圣经不是随便拼凑的；而且这三百年间，彼得后书一直在被许多教会阅读、得造就。我们接受它，不是因为权威命令我们接受，是因为历代的圣徒在这封信里一再听见主的声音。"},{"id":"ISS00_9","t":"这些争议该不该影响一个人的信心？","r":"1:12–21；3:17–18","ch":[1,2,3],"why":"九、为什么这是个问题：读完前面八条，会众会发现彼得后书几乎每一处都有争议——作者、年代、正典、与犹大书的关系、1:4 的意思、3:10 的异文、2:20–22 的背道。有人因此觉得「连专家都说不清楚，我还能信什么」；也有人反过来，觉得承认有争议就是软弱，干脆一概不听。这一条要回答：这些争议应该放在信心的哪个位置？又该怎样陪伴因此动摇的人？","pos":[["争议动摇根基","","有人认为：只要作者或正典有疑问，整封信的权威就打折扣，甚至整本圣经都不可靠。这个看法把每一个学术问题都当成地基，结果是任何一个新论点都可能让人的信心崩塌。"],["拒绝面对争议","","有人认为：信心不需要知道这些，讲台也不该提，以免绊倒人。出发点是保护会众，但会众迟早会在别处读到；被保护得太好的人，一碰到问题反而更容易动摇。"],["分层面对（本讲义采用）","","把问题分成两层：一层是信心的根基——主耶稣基督是谁、他为我们成就了什么、他必再来；这些不因学术争议而改变，彼得在 1:16 说这「并不是随从乖巧捏造的虚言」。另一层是书房里的功课——作者、年代、异文、文学关系；可以诚实研究、各家并陈，承认有些问题今天没有定论。"],["争议是长进的机会","","彼得后书本身就是一封在争议中写成的信：有人说「主要降临的应许在哪里呢」（3:4），有人强解保罗的信（3:16）。彼得没有叫读者停止思想，而是叫他们记念先知的话与使徒的命令（3:2），在认识主上长进（1:8；3:18）。照这个方向，争议不是信心的敌人，而是逼我们回到经文、回到群体、回到主面前的机会；问得越诚实，根扎得越深。"]],"con":[],"say":"本讲义的立场：争议应该被诚实面对，但不应该动摇信心的根基。彼得后书本身就给了方法：信心建立在亲眼见证的主（1:16–18）与圣灵感动的话（1:19–21）上，「如同灯照在暗处」；面对难明白的地方，不强解，在群体中、照上下文、谦卑地读（3:16）；最后的方向不是更会辩论，而是「在我们主救主耶稣基督的恩典和知识上有长进」（3:18）。本讲义在每一条议题上都先并陈各家、再说自己站在哪里，正是为了示范这种读法：不怕问题，也不让问题取代主。","care":"牧者要分辨眼前的人是哪一种：一种是好奇、愿意多知道的人，可以陪他读各家立场；另一种是正在信心危机里的人，他需要的常常不是更多资料，而是有人陪他祷告、陪他读福音书，重新看见主。两种人都不要被嘲笑。彼得自己知道疑惑的滋味——他在水面上往下沉的时候，主「赶紧伸手拉住他」（太 14:31）。争议不可怕；可怕的是因为争议离开了群体、离开了主。让会众知道：可以带着问题来教会，教会不是只有答案的地方，也是一起长进的地方。小组长若被问倒了，诚实说「我不知道，我们一起查」，比勉强给答案更能坚固人。"},{"id":"ISS01_1","t":"1:1「我们的神和救主耶稣基督」——新约直称耶稣为神吗？","r":"1:1","ch":[1],"why":"一、彼得后书第一节就写：「写信给那因我们的神和救主耶稣基督之义，与我们同得一样宝贵信心的人。」这句话可以读成一位——「我们的神，也是救主，就是耶稣基督」；也可以读成两位——「我们的神（父）和救主耶稣基督（子）」。这不只是文法问题：如果是一位，这节就和约 1:1、20:28、多 2:13 并列，成为新约直接称耶稣为「神」的经文之一。常有慕道友或刚信主的人问：「圣经哪里说耶稣是神？耶稣自己不是说父比他大吗？」这节经文正是答案的一部分。","pos":[["一位（Granville Sharp 规则）","","原文 τοῦ θεοῦ ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ 是一个冠词统管两个单数、非专有名词的位格称号，中间以 καί 连接；照十八世纪英国学者 Granville Sharp 归纳的规则，这样的句型指同一位。多数福音派注释与新近译本（如 NIV、ESV）采此读法，译作「我们的神和救主耶稣基督」并理解为同一位。最有力的旁证在本卷自己：1:11、2:20、3:18 都用同一个句型「我们主救主耶稣基督」，从来没有人把那三处读成两位。"],["两位（父与子）","","「我们的神」指父，「救主耶稣基督」指子。理由：紧接着的 1:2 就把「神」和「我们主耶稣」分开来讲；西乃抄本等少数抄本在 1:1 作「主」（κυρίου）而不是「神」；KJV 译作「God and our Saviour Jesus Christ」，可读成两位。历史上神体一位论（Unitarian）传统也采这个读法，以避开基督神性的结论。部分持守三一信仰的学者也认为这一节的文法不足以单独作决定，宁可谨慎。"],["回应与分辨","","1:2 的句型不同：「神和我们主耶稣」中的「耶稣」是专有名词，不在同一个冠词之下，所以 1:2 分开两位，并不推翻 1:1 合为一位。两节并排，正好显出三一真理的两面：子与父有分别（1:2），子又真是神（1:1）。抄本作「主」的是少数，校勘本多采「神」。再看全卷的走向：彼得以「我们的神和救主耶稣基督」开头（1:1），以「愿荣耀归给他，从今直到永远」结束（3:18）——那一句颂赞是直接归给「我们主救主耶稣基督」的。一封信的头尾都把只属于神的称呼与荣耀归给耶稣，这比任何单一的文法规则都更有分量。"]],"con":[],"say":"本讲义的立场：一位。1:1 直称耶稣为「我们的神和救主」，是新约直称耶稣为神的经文之一（与约 1:1；20:28；多 2:13 同列）。但讲台不在文法上停留太久：Granville Sharp 规则留在书房，带到讲台的是一句话——写这封信的老渔夫，最后一封信的第一句，就称那位在海边叫他名字的耶稣为「我们的神」。1:1 合为一位、1:2 分为两位，正是三一神「有分别，不分割」的见证。","care":"对慕道友，这节经文不是拿来辩倒他的武器，而是邀请他看见：最早跟随耶稣、和他一起吃饭捕鱼三年的人，最后称他为神。对信主多年的人，这节提醒我们，信心的对象不是一套道理，而是一位「神和救主」：他有神的权柄，也有救主的温柔。若有弟兄被别人质问「圣经没说耶稣是神」而动摇，牧者不必要求他立刻背出希腊文规则，可以陪他读约 20:28 多马的那一句「我的主！我的神！」，再读这一节。也要提醒：与否认基督神性的朋友谈话，态度要温柔谦卑，不是要赢，是要他遇见主。"},{"id":"ISS01_2","t":"1:4「与神的性情有分」——人会不会成为神？","r":"1:4","ch":[1],"why":"二、「因此，他已将又宝贵又极大的应许赐给我们，叫我们既脱离世上从情欲来的败坏，就得与神的性情有分。」这是全卷神学最高的一句，完整的四读并陈与三条界线已写在全卷立场组 ISS00_2。本条只处理第 1 章讲台上最常遇到的两个实际问题：会众听到「与神的性情有分」，会不会以为人可以修成神？讲员怕讲偏，会不会干脆跳过不讲？","pos":[["成神论（东正教）","","人借恩典有分于神的「能力」（energies），不是神的「本质」（essence）；人越来越像神，但永远是受造者。东正教的成神论并不是说人变成另一位神。本讲义尊重这个传统，准确陈述，不嘲讽。"],["与基督联合（改革宗、路德宗）","","借圣灵与基督联合，有分于他的生命；加尔文说这里的「性情」是指品质，不是本体。"],["完全的爱（卫斯理传统）与道德的相似（许多福音派注释）","","前者看重今生被圣灵充满到以完全的爱爱神爱人；后者强调有分的是神的圣洁、良善、爱等道德品格，不涉本体。两者都以下文 1:5–7 那张以爱作结的清单为证。"],["须要辨别的偏差","","某些新兴宗教与部分成功神学讲员把这节讲成「人可以修炼成神」「你就是小神」，这不是上述任何一个主流传统的意思，四个读法都不支持；四种读法的共同点是：没有一家主流传统说受造者会成为另一位神。分歧在「有分」的深度与讲法，不在要不要守住创造者与受造者的分别。"],["须要辨别的另一个偏差：跳过不讲","","另一边的错误比较安静：讲员因为怕被误会成神秘主义或新兴宗教，就把 1:4 轻轻带过，只讲 1:5–7 的「要加上」。结果八个台阶失去了根，成了靠意志往上爬的道德课程，会众听到的只剩下「你要更努力」。彼得的次序正好相反：先是「又宝贵又极大的应许」，先是「得与神的性情有分」，然后才是「正因这缘故，你们要分外地殷勤」。"]],"con":[],"say":"本讲义的立场：采「在基督里与基督联合，有分于神的生命与品格」，完整论证见 IS
