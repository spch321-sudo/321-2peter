\n<td>「胆大任性，毁谤在尊位的，还不知惧怕」<\/td>\n<td><strong>2:10<\/strong><\/td>\n<td>αὐθάδης——<strong>以自己为乐、随己意<\/strong>：有己的希腊字<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「巴兰……贪爱不义之工价」<\/td>\n<td><strong>2:15<\/strong><\/td>\n<td>有己抓住的是酬报<\/td>\n<\/tr>\n<tr>\n<td><strong>出路・谦卑，回到本位<\/strong><\/td>\n<td>「主知道搭救敬虔的人」<\/td>\n<td><strong>2:9<\/strong><\/td>\n<td>回到本位：<strong>搭救是主的事<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>无己的落点<\/strong><\/td>\n<td>「我们所亲爱的兄弟保罗」<\/td>\n<td><strong>3:15<\/strong><\/td>\n<td><strong>被纠正过的人称纠正他的人为「亲爱的兄弟」<\/strong>（壹五）——无己才能合一<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「我脱离这帐棚的时候快到了」<\/td>\n<td><strong>1:14<\/strong><\/td>\n<td>无己面对死亡：帐棚是要拆的<\/td>\n<\/tr>\n<tr>\n<td><strong>改变观念・改变观点<\/strong><\/td>\n<td>「主看一日如千年，千年如一日」<\/td>\n<td><strong>3:8<\/strong><\/td>\n<td><strong>从人的观点改变成神的观点；从暂时观点改变成永恒观点<\/strong>——不是换算，是换位<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「不是耽延，乃是宽容」<\/td>\n<td><strong>3:9<\/strong><\/td>\n<td>同一件事（主还没来），人的观点是「耽延」，神的观点是「宽容」<\/td>\n<\/tr>\n<tr>\n<td><strong>用心靠圣灵<\/strong><\/td>\n<td>「晨星在你们心里出现」<\/td>\n<td><strong>1:19<\/strong><\/td>\n<td><strong>光出现在「心里」<\/strong>——不是脑子里多一条知识<\/td>\n<\/tr>\n<tr>\n<td><strong>焦点在耶稣<\/strong><\/td>\n<td>「我们主救主耶稣基督」<\/td>\n<td><strong>1:1、11；2:20；3:2、18<\/strong><\/td>\n<td>全卷五次完整称号；<strong>最后一次就是最后一句<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>人比事重要<\/strong><\/td>\n<td>「爱弟兄的心……爱众人的心」<\/td>\n<td><strong>1:7<\/strong><\/td>\n<td>八个台阶的最后两级都是爱人<\/td>\n<\/tr>\n<tr>\n<td><strong>920 的原型<\/strong><\/td>\n<td>「我却要将这些事常常提醒你们……激发你们」<\/td>\n<td><strong>1:12–13<\/strong><\/td>\n<td>临终的人还在激发他的「2」<\/td>\n<\/tr>\n<tr>\n<td><strong>235 的原型<\/strong><\/td>\n<td>「我们所亲爱的兄弟保罗」<\/td>\n<td><strong>3:15<\/strong><\/td>\n<td>2 属灵同伴：曾经冲突的两个使徒<\/td>\n<\/tr>\n<tr>\n<td><strong>得胜者<\/strong><\/td>\n<td>「这样，必叫你们丰丰富富地得以进入……永远的国」<\/td>\n<td><strong>1:11<\/strong><\/td>\n<td>「丰丰富富」πλουσίως——<strong>不是勉强挤进去，是被盛大迎接<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"彼得的一生与这封信","html":"<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>彼得后书<\/th>\n<th>彼得的经历<\/th>\n<th>共同的字或画面<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>「西门彼得」（1:1，Συμεών）<\/td>\n<td>「约翰的儿子西门」（约 21:15）<\/td>\n<td><strong>新约只有徒 15:14 与此处用希伯来拼法 Συμεών<\/strong>——<strong>最后一封信，他用了主在海边叫他的那个本名<\/strong><\/td>\n<\/tr>\n<tr>\n<td>「趁我还在这帐棚的时候」（1:13）<\/td>\n<td>「我就在这里搭三座棚」（太 17:4）<\/td>\n<td>帐棚（壹二）<\/td>\n<\/tr>\n<tr>\n<td>「我去世以后」（1:15，ἔξοδον）<\/td>\n<td>「谈论他去世的事」（路 9:31）<\/td>\n<td>ἔξοδος（壹二）<\/td>\n<\/tr>\n<tr>\n<td>「正如我们主耶稣基督所指示我的」（1:14）<\/td>\n<td>「你年老的时候……」（约 21:18–19）<\/td>\n<td>主预告他的死<\/td>\n<\/tr>\n<tr>\n<td>「这是我的爱子，我所喜悦的」（1:17）<\/td>\n<td>登山变像（太 17:5；可 9:7；路 9:35）<\/td>\n<td><strong>新约福音书以外唯一的登山变像记载<\/strong><\/td>\n<\/tr>\n<tr>\n<td>「连买他们的主他们也不承认」（2:1）<\/td>\n<td>三次不认主（太 26:70–74）<\/td>\n<td>ἀρνέομαι（壹三）<\/td>\n<\/tr>\n<tr>\n<td>「你们若行这几样，就永不失脚」（1:10）<\/td>\n<td>在水面上往下沉（太 14:30）；院子里跌倒<\/td>\n<td>失脚<\/td>\n<\/tr>\n<tr>\n<td>「狗所吐的，牠转过来又吃」（2:22）<\/td>\n<td>「你回头以后」（路 22:32）<\/td>\n<td><strong>回头有两种：狗回到呕吐物，彼得回到主面前<\/strong><\/td>\n<\/tr>\n<tr>\n<td>「我们所亲爱的兄弟保罗」（3:15）<\/td>\n<td>安提阿被保罗当面抵挡（加 2:11–14）<\/td>\n<td>和好（壹五）<\/td>\n<\/tr>\n<tr>\n<td>「在你们已有的真道上坚固」（1:12）；「坚固的地步」（3:17）<\/td>\n<td>「要坚固你的弟兄」（路 22:32）<\/td>\n<td>στηρίζω（壹六）<\/td>\n<\/tr>\n<tr>\n<td>「主……不愿有一人沉沦，乃愿人人都悔改」（3:9）<\/td>\n<td>主等候了彼得<\/td>\n<td><strong>写「宽容」的人，自己是被宽容等回来的<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>讲台落点<\/strong>：每一处〔背景〕都落在主身上——<strong>不是彼得多伟大，是主多恒久忍耐。<\/strong><\/p>"},{"t":"彼得后书与彼得前书","html":"<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>主题<\/th>\n<th>彼得前书<\/th>\n<th>彼得后书<\/th>\n<th>分工<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>危险<\/td>\n<td>外面的逼迫<\/td>\n<td>里面的错谬<\/td>\n<td>前书教人「受苦」，后书教人「分辨」<\/td>\n<\/tr>\n<tr>\n<td>旧约先知<\/td>\n<td>「众先知……考察……基督的灵」（彼前 1:10–12）<\/td>\n<td>「乃是人被圣灵感动，说出神的话来」（彼后 1:21）<\/td>\n<td>前书讲先知在寻求，后书讲先知的话更确<\/td>\n<\/tr>\n<tr>\n<td>挪亚<\/td>\n<td>「神容忍等待的时候……只有八个人」（彼前 3:20）<\/td>\n<td>「只保护了传义道的挪亚一家八口」（彼后 2:5）<\/td>\n<td>前书讲洗礼的对应，后书讲审判中的保守<\/td>\n<\/tr>\n<tr>\n<td>神的忍耐<\/td>\n<td>「神容忍等待」（彼前 3:20，μακροθυμία）<\/td>\n<td>「乃是宽容你们」（彼后 3:9，μακροθυμεῖ）；「主长久忍耐」（3:15）<\/td>\n<td><strong>同一个字<\/strong>：前书是挪亚的日子，后书是我们的日子<\/td>\n<\/tr>\n<tr>\n<td>结局近了<\/td>\n<td>「万物的结局近了」（彼前 4:7）<\/td>\n<td>「主看一日如千年」（彼后 3:8）<\/td>\n<td><strong>后书回答了前书留下的问题：「近」怎么过了这么久？<\/strong><\/td>\n<\/tr>\n<tr>\n<td>坚固<\/td>\n<td>「必要亲自……坚固你们」（彼前 5:10）<\/td>\n<td>「在……真道上坚固」（彼后 1:12）；「坚固的地步」（3:17）<\/td>\n<td>前书是神坚固，后书是我们站在被坚固的地方<\/td>\n<\/tr>\n<tr>\n<td>恩典<\/td>\n<td>「这恩是神的真恩。你们务要在这恩上站立得住」（彼前 5:12）<\/td>\n<td>「在……恩典和知识上有长进」（彼后 3:18）<\/td>\n<td><strong>前书最后：站在恩上；后书最后：在恩上长<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>用法<\/strong>：〔彼前〕互见带彼得前书讲义章号（已完成，可直接带）。<strong>讲台落点一句<\/strong>：<strong>彼得前书教我们在火里站得住；彼得后书教我们在雾里看得清——站得住的人，还要长。<\/strong><\/p>"},{"t":"被引用的旧约","html":"<table>\n<thead>\n<tr>\n<th>主题<\/th>\n<th>彼得后书<\/th>\n<th>旧约<\/th>\n<th>前卷讲义<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>犯罪的天使<\/td>\n<td>2:4<\/td>\n<td>创 6:1–4（犹太传统的读法）<\/td>\n<td><strong>创世记第 6 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>挪亚与洪水<\/td>\n<td>2:5；3:6<\/td>\n<td>创 6–8<\/td>\n<td><strong>创世记第 6–8 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>所多玛、蛾摩拉与罗得<\/td>\n<td>2:6–8<\/td>\n<td>创 19<\/td>\n<td><strong>创世记第 19 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>巴兰与驴<\/td>\n<td>2:15–16<\/td>\n<td>民 22–24<\/td>\n<td><strong>民数记第 22–24 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>狗转过来吃<\/td>\n<td>2:22<\/td>\n<td>箴 26:11<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>一日如千年<\/td>\n<td>3:8<\/td>\n<td>诗 90:4<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>天地从水而出<\/td>\n<td>3:5<\/td>\n<td>创 1:2、6–9<\/td>\n<td><strong>创世记第 1 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>新天新地<\/td>\n<td>3:13<\/td>\n<td>赛 65:17；66:22<\/td>\n<td>—（这使我们想起启 21:1）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>巴兰的驴（2:16）<\/strong>：「那不能说话的驴以人言拦阻先知的狂妄」——<strong>彼得用最幽默的一笔，讲最严肃的事：神可以用一头驴拦住一个被钱冲昏头的先知。<\/strong><\/p>"},{"t":"与神的性情有分：四种读法与三条界线","html":"<p><strong>原文<\/strong>：ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως。<\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>读法<\/th>\n<th>意思<\/th>\n<th>谁这样读<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>成神论（theosis）<\/strong><\/td>\n<td>人借恩典分享神的「能力」（energies），不是神的「本质」（essence）；越来越像神<\/td>\n<td>东正教（阿他那修：「神成为人，好叫人成为神」——<strong>意思是借恩典有分，不是变成另一位神<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td><strong>与基督联合<\/strong><\/td>\n<td>借圣灵与基督联合，有分于他的生命；成圣是被更新成神的形像<\/td>\n<td>改革宗、路德宗<\/td>\n<\/tr>\n<tr>\n<td><strong>完全的爱<\/strong><\/td>\n<td>有分于神的圣洁与爱，在今生可以有完全的爱<\/td>\n<td>卫斯理传统<\/td>\n<\/tr>\n<tr>\n<td><strong>道德的相似<\/strong><\/td>\n<td>有分于神的道德品格（圣洁、良善），不是本体<\/td>\n<td>许多福音派注释<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>本讲义的立场<\/strong>：采「与基督联合、有分于神的生命与品格」，并陈四读；<strong>明说三条界线<\/strong>：①<strong>创造者与受造者的分别永远存在<\/strong>——人不会成为神，也不会与神的本质混同；②<strong>有分是恩典，不是修炼<\/strong>——「他已将……应许赐给我们」（1:4）；③<strong>有分的内容写在下文<\/strong>：脱离败坏（1:4）、加上德行……爱（1:5–7）。<\/p>"},{"t":"作者与犹大书","html":"<p><strong>本讲义的立场<\/strong>：使徒彼得。理由：1:1 自称；1:14 主的预告（约 21）；1:16–18 亲身见证登山变像；3:1「第二封信」；3:15 称保罗为兄弟。<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>托名说的理由<\/th>\n<th>回应<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>希腊文与彼得前书风格差很多<\/td>\n<td>彼得前书「托西拉」（彼前 5:12），本书没有提代笔人——<strong>两封信经手的人不同<\/strong>；而且两封信主题不同（受苦／错谬），用字本来就不同<\/td>\n<\/tr>\n<tr>\n<td>3:4「列祖睡了」、3:16「保罗的信」像第二代教会<\/td>\n<td>「列祖」最自然指旧约的先祖（来 1:1）；保罗的信在 60 年代已在各教会传阅（西 4:16）<\/td>\n<\/tr>\n<tr>\n<td>早期教会对它有争议<\/td>\n<td>属实——<strong>本讲义诚实交代<\/strong>；但争议不等于否定，4 世纪亚他那修书信与迦太基会议都接受<\/td>\n<\/tr>\n<tr>\n<td>「遗言」是当时托名作品的常见文体<\/td>\n<td>文体本身不证明托名；<strong>真正临终的人也会写遗言<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>与犹大书<\/strong>：2:1–3:3 与犹 4–18 约十九处平行。三种说法：①犹大书在先，彼得用了犹大书（多数学者）；②彼得在先，犹大用了彼得（2:1、3:3 用未来式「必有」，犹大书用过去式「已经」）；③两者共用一个早期教会的教导材料。<strong>本讲义并陈三说，不裁判<\/strong>；〔犹〕互见先标经文出处，将来犹大书制作时分工：<strong>彼得后书讲「长进中的分辨」，犹大书讲「为真道竭力争辩」<\/strong>。<\/p>"},{"t":"主的日子：3:8–13 怎样读","html":"<ol type=\"1\">\n<li><strong>3:8 不是公式<\/strong>：诗 90:4 的意思是神超越时间；<strong>「一日如千年，千年如一日」两个方向都说，正是为了取消换算<\/strong>。<\/li>\n<li><strong>3:9 的焦点是宽容<\/strong>：主的「慢」是爱的「等」。321 落点：<strong>等候的时间是悔改与传福音的时间<\/strong>——不是焦虑的时间。<\/li>\n<li><strong>3:13 新天新地<\/strong>：「新」καινός 是「品质更新」不是「另一个全新的物件」（这使我们想起罗 8:21「受造之物……得享神儿女自由的荣耀」）；<strong>落点是「有义居在其中」<\/strong>。<\/li>\n<li><strong>321 的落点<\/strong>：「从暂时观点改变成永恒观点」——<strong>3:11「你们为人该当怎样圣洁，怎样敬虔」：永恒的观点不是叫人离开世界，是叫人在世界里活得不一样。<\/strong><\/li>\n<\/ol>"},{"t":"分辨假教训：记号而不是名单","html":"<p><strong>立场三・分辨假教训<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>经文问的是什么<\/strong>：谁是假师傅？我怎么知道我的教会、我听的讲道是真的？「没有可随私意解说的」——我自己读经会不会读错？<\/li>\n<li><strong>彼得给的五个记号<\/strong>（2:1–19）：<strong>对基督<\/strong>——不承认买他们的主（2:1）；<strong>对金钱<\/strong>——贪心、捏造言语取利（2:3、14–15）；<strong>对身体<\/strong>——随肉身放纵污秽的情欲（2:10、14、18）；<strong>对权柄<\/strong>——胆大任性、轻慢（2:10）；<strong>对自由<\/strong>——应许人自由，自己却作奴仆（2:19）。<strong>五个记号都是「果子」，不是「口才」或「宗派标签」<\/strong>（这使我们想起太 7:15–20）。<\/li>\n<li><strong>本讲义的立场<\/strong>：①<strong>讲台教记号，不给名单<\/strong>——不点名今天任何牧者、教会、宗派、网络传道人；②<strong>分辨从自己开始<\/strong>：五个记号先照自己；③<strong>1:20 的「私意」最自然的读法是预言的「来源」不是出于人意<\/strong>（1:21 的「因为」说明了这一点），<strong>不是禁止信徒自己读经<\/strong>；读经的保护是<strong>在群体中读、照上下文读、谦卑地读<\/strong>（3:16「强解」的反面）；④遇到教会内真正的错谬或侵害，<strong>照着程序、在爱中、公开透明地处理<\/strong>，不在网络上猎巫。<\/li>\n<li><strong>321 落点<\/strong>：「圣经是我的准则」——<strong>准则是灯（1:19），不是棍子<\/strong>。分辨的目的是自己不坠落（3:17）、把迷路的人找回来（这使我们想起雅 5:19–20），不是证明自己是对的。<\/li>\n<\/ol>\n<p>牧养底线：不在讲台与小组点名「假师傅」；不用「假师傅」一词压制提出问题的会友；教会财务透明是对 2:3 最好的回应。<\/p>"},{"t":"讲台把关：八条红线","html":"<p><strong>红线一：不点名今天任何牧者、教会、宗派、网络传道人为「假师傅」；讲台教记号，不给名单。<\/strong> 检验标准：不同教会背景的弟兄姐妹听完，是更会照自己、更会分辨果子，还是更会怀疑别人、更想转贴「某某是假师傅」？<\/p>\n<p><strong>红线二：不用 2:10「轻慢主治的」「毁谤在尊位的」堵住对教会领袖的正当质疑。<\/strong> 检验标准：有没有讲到第 2 章被定罪的正是「师傅」（在上位的人）？有没有回指彼得前书 5:3「不是辖制」？<\/p>\n<p><strong>红线三：不用 3:8「一日如千年」算末日或算创造日；不用 3:12 推算或「加速」主再来的日期。<\/strong> 检验标准：有没有讲到 3:8 两个方向都说？有没有讲到 3:10「像贼来到」？<\/p>\n<p><strong>红线四：不把 1:4 讲成人可以成为神、与神同等或与神的本质混同；也不因为怕讲偏就跳过 1:4。<\/strong> 检验标准：有没有明说创造者与受造者的分别？有没有讲到有分的内容就是 1:5–7 的品格？<\/p>\n<p><strong>红线五：不用 2:20–22 恐吓软弱、跌倒、正在挣扎的信徒；不对任何个人宣判「你已经没救了」。<\/strong> 检验标准：有没有讲到上下文是假师傅？有没有同时讲 1:9「已经得了洁净」与 3:9「乃愿人人都悔改」？一位刚跌倒、很想回头的弟兄听完，是更想回来，还是更绝望？<\/p>\n<p><strong>红线六：不用 3:10–12 推出「地球反正烧掉，不必照顾受造界」；也不把环境议题变成政治动员。<\/strong> 检验标准：有没有讲到 3:13「新天新地」是更新，以及 3:11「该当怎样圣洁」是今天的生活？<\/p>\n<p><strong>红线七：不嘲笑或贬低保罗、也不贬低彼得；不把 3:15–16 读成两位使徒的角力。<\/strong> 检验标准：有没有讲到 3:15「亲爱的兄弟」？<\/p>\n<p><strong>红线八：不用 1:20「没有可随私意解说的」或 3:16「难明白的」禁止会众自己读经，或主张「只有牧师能解经」。<\/strong> 检验标准：有没有讲到 1:20 的焦点是预言的来源（1:21「因为」）？有没有给出在群体中、照上下文、谦卑读经的方法？<\/p>"}],"meta":{"book":"彼得后书","slug":"321-2pe","vol":25,"title":"321圣经讲义・彼得后书","arcs":["星","井","天"],"spine":["1:3–4","1:5–8","1:16–19","2:1","2:9（枢纽）","2:19","3:9","3:13","3:17–18"],"note":"经文依和合本 1989 新标点；希腊文依 SBLGNT。本版经文与原文于云端键入，待以 cu89t／SBLGNT 实档逐字核对。"}}</script>

  function esc(s) {

  }

    if (IDX) { return IDX; }

  function tSearch() {
    return '<input type="search" id="sq" placeholder="输入字词，例如：晨星、ἐπίγνωσις、挪亚" value="' + esc(R.q) + '"><div id="sres">' + searchHTML(R.q) + '</div>';
  }
  var SRES = [];
  function searchHTML(q) {
    q = String(q || '').replace(/^\s+|\s+$/g, '');
    SRES = [];
    if (!q) { return '<p class="mute">可搜寻：经文、讲义、讲章、教学讲章、想更深、三个化、争议议题。</p>'; }
    var idx = buildIndex(), ql = q.toLowerCase(), total = 0, h = '';
    for (var i = 0; i < idx.length; i++) {
      var t = idx[i].t, p = t.toLowerCase().indexOf(ql);
      if (p < 0) { continue; }
      total++;
      if (SRES.length >= 80) { continue; }
      var a = Math.max(0, p - 24), z = Math.min(t.length, p + q.length + 46);
      var snip = (a > 0 ? '…' : '') + esc(t.slice(a, p)) + '<mark>' + esc(t.substr(p, q.length)) + '</mark>' + esc(t.slice(p + q.length, z)) + (z < t.length ? '…' : '');
      h += '<button class="sres" data-a="sres" data-v="' + SRES.length + '"><b>' + esc(idx[i].k) + '</b>' + snip + '</button>';
      SRES.push(idx[i].g);
    }
    return '<p class="mute">找到 ' + total + ' 笔' + (total > 80 ? '（显示前 80 笔）' : '') + '</p>' + h;
  }
  var sTimer = null;

    el.oninput = fn;
    el.onkeyup = fn;
  }

  /* ---------- 朗读（装置语音） ---------- */
  var TTS_OK = !!(window.speechSynthesis && typeof window.SpeechSynthesisUtterance !== 'undefined');
  var TQ = [], TI = 0, TSTATE = 'idle', TGEN = 0;
  function ttsTexts() {
    var out = [], i, j;
    if (R.tab === 'course' && R.lesson) {
      var L = D.lesson[String(R.lesson)];
      out.push(L.t); out.push(L.open);
      for (i = 0; i < L.secs.length; i++) { out.push(L.secs[i].h); for (j = 0; j < L.secs[i].ps.length; j++) { out.push(L.secs[i].ps[j]); } }
    } else if (R.tab === 'course' && R.sub === 'serm') {
      var b = (D.serm[String(R.ch)] || { blocks: [] }).blocks;
      for (i = 0; i < b.length; i++) { out.push(b[i][1]); }
    }
    var res = [];
    for (i = 0; i < out.length; i++) {
      var t = String(out[i] || '');
      while (t.length > 140) {
        var cut = -1, m, re = /[。！？；]/g;
        while ((m = re.exec(t)) && m.index < 140) { cut = m.index + 1; }
        if (cut < 20) { cut = 140; }
        res.push(t.slice(0, cut)); t = t.slice(cut);
      }
      if (t.replace(/\s/g, '')) { res.push(t); }
    }
    return res;
  }
  function pickVoice() {
    try {
      var vs = speechSynthesis.getVoices() || [], want = LANG === 'sc' ? 'zh-CN' : 'zh-TW', alt = null;
      for (var i = 0; i < vs.length; i++) {
        var l = String(vs[i].lang || '').replace('_', '-');
        if (l === want) { return vs[i]; }
        if (!alt && l.indexOf('zh') === 0) { alt = vs[i]; }
      }
      return alt;
    } catch (e) { return null; }
  }
  function speakNext(gen) {
    if (gen !== TGEN || TSTATE === 'idle') { return; }
    if (TI >= TQ.length) { TSTATE = 'idle'; ttsSync(); return; }
    var u = new SpeechSynthesisUtterance(TQ[TI]);
    u.lang = LANG === 'sc' ? 'zh-CN' : 'zh-TW';
    var v = pickVoice(); if (v) { u.voice = v; }
    u.rate = 1;
    u.onend = function () { if (gen !== TGEN) { return; } TI++; speakNext(gen); };
    u.onerror = function () { if (gen !== TGEN) { return; } TI++; speakNext(gen); };
    try { speechSynthesis.speak(u); } catch (e) { TSTATE = 'idle'; }
    ttsSync();
  }
  function speak() {
    if (!TTS_OK) { return; }
    if (TSTATE === 'paused') { try { speechSynthesis.resume(); } catch (e) { } TSTATE = 'playing'; ttsSync(); return; }
    if (TSTATE === 'playing') { return; }
    ttsClear();
    TQ = ttsTexts(); TI = 0;
    if (!TQ.length) { return; }
    TSTATE = 'playing';
    speakNext(TGEN);
  }
  function ttsPause() {
    if (!TTS_OK || TSTATE !== 'playing') { return; }
    try { speechSynthesis.pause(); } catch (e) { }
    TSTATE = 'paused'; ttsSync();
  }
  function ttsClear() {
    TGEN++;
    TSTATE = 'idle'; TQ = []; TI = 0;
    if (TTS_OK) { try { speechSynthesis.cancel(); } catch (e) { } }
    ttsSync();
  }
  function ttsSync() {
    var st = $('tts-st');
    if (!st) { return; }
    st.innerHTML = TSTATE === 'playing' ? '朗读中… ' + (TI + 1) + ' / ' + TQ.length : (TSTATE === 'paused' ? '已暂停（按朗读继续）' : '用装置语音朗读');
    var p = $('tts-play'); if (p) { p.innerHTML = TSTATE === 'paused' ? '▶ 继续' : '▶ 朗读'; }
  }

  /* ---------- 事件 ---------- */
  function act(a, v, el) {
    var n = parseInt(v, 10);
    switch (a) {
      case 'tab':
        if (v === 'course') { go({ tab: 'course', lesson: 0, sub: R.sub || defaultSub() }); }
        else if (v === 'tools') { go({ tab: 'tools', tool: '', ext: -1 }); }
        else { go({ tab: v }); }
        break;
      case 'ch': go({ tab: 'course', ch: n, lesson: 0, sub: R.sub || defaultSub() }); break;
      case 'cch': go({ ch: n }); break;
      case 'bch': go({ ch: n }); break;
      case 'lch': go({ lesson: n, ch: n }); break;
      case 'sub': go({ sub: v }); break;
      case 'lesson': go({ tab: 'course', lesson: n, ch: n }); break;
      case 'tool': go({ tab: 'tools', tool: v, ext: -1 }); break;
      case 'ext': go({ ext: n, anchor: n >= 0 ? 'extpage' : '' }); break;
      case 'cont':
        if (S.last) { go({ tab: S.last.tab || 'today', ch: S.last.ch || 1, sub: S.last.sub || defaultSub(), lesson: S.last.lesson || 0 }); }
        break;
      case 'jump': go({ anchor: v }); break;
      case 'open':
        R.open[v] = R.open[v] ? 0 : 1;
        var y = window.pageYOffset; render(); window.scrollTo(0, y);
        break;
      case 'sres': var g = SRES[n]; if (g) { if (g.open) { for (var k in g.open) { if (g.open.hasOwnProperty(k)) { R.open[k] = 1; } } } var o = {}; for (k in g) { if (g.hasOwnProperty(k) && k !== 'open') { o[k] = g[k]; } } go(o); } break;
      case 'tp': R.tp = R.tp === n ? -1 : n; y = window.pageYOffset; render(); window.scrollTo(0, y); break;
      case 'reveal': R.show[n] = !R.show[n]; y = window.pageYOffset; render(); window.scrollTo(0, y); break;
      case 'mem': S.mem[n] = !S.mem[n]; save(); y = window.pageYOffset; render(); window.scrollTo(0, y); break;
      case 'pracmain': S.prac[n] = !S.prac[n]; save(); y = window.pageYOffset; render(); window.scrollTo(0, y); break;
      case 'note':
        var box = $('nb-' + v.replace(/:/g, '-'));
        if (box) { box.className = box.className.indexOf(' on') >= 0 ? 'notebox' : 'notebox on'; if (box.className.indexOf(' on') >= 0) { var ta = box.getElementsByTagName('textarea')[0]; if (ta) { ta.focus(); } } }
        break;
      case 'set':
        S.set[v] = !S.set[v]; save(); y = window.pageYOffset; render(); window.scrollTo(0, y);
        break;
      case 'role':
        S.set.role = v; save(); R.sub = '';
        $('modal').className = ''; $('modal').innerHTML = '';
        render();
        break;
      case 'lang': toggleSC(); break;
      case 'export': exportMarks(); break;
      case 'tts-play': speak(); break;
      case 'tts-pause': ttsPause(); break;
      case 'tts-stop': ttsClear(); break;
    }
  }
  document.addEventListener('click', function (e) {
    var t = e.target || e.srcElement;
    while (t && t !== document) {
      if (t.getAttribute && t.getAttribute('data-a') !== null) {
        if (t.tagName === 'A') { e.preventDefault(); }
        act(t.getAttribute('data-a'), t.getAttribute('data-v') || '', t);
        return;
      }
      t = t.parentNode;
    }
  }, false);
  function onInput(e) {
    var t = e.target || e.srcElement;
    if (!t || !t.getAttribute) { return; }
    var nk = t.getAttribute('data-nk');
    if (nk) {
      var st = t.getAttribute('data-s') || 'notes', val = t.value;
      if (val.replace(/\s/g, '')) { S[st][nk] = val; } else { delete S[st][nk]; }
      save();
      return;

    if (t.id === 'fs') {
      S.set.fs = parseInt(t.value, 10) || 17;
      document.documentElement.style.fontSize = S.set.fs + 'px';

    var sk = t.getAttribute('data-step');
    if (sk) {
      if (t.checked) { S.steps[sk] = 1; } else { delete S.steps[sk]; }
      save();
      var y = window.pageYOffset; render(); window.scrollTo(0, y);
      return;
    }
    onInput(e);
  }, false);
  if (TTS_OK) { try { speechSynthesis.cancel(); } catch (e) { } }
  window.addEventListener('pagehide', function () { if (TTS_OK) { try { speechSynthesis.cancel(); } catch (e) { } } }, false);

  window.R321 = { R: R, S: S, D: D, LANG: LANG, ALT_URL: ALT_URL, render: render };

})();
