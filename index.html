觀點」：<strong>年輕的彼得想把榮耀留在帳棚裡；年老的彼得知道，帳棚是要拆的，榮耀是要等的。<\/strong><\/p>\n<p><strong>三、因為他知道「不承認主」是甚麼意思<\/strong><\/p>\n<blockquote>\n<p>「將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認。」（2:1）<\/p>\n<\/blockquote>\n<p>「不承認」原文 <strong>ἀρνούμενοι<\/strong>——<strong>正是彼得在大祭司院子裡三次不認主的那個字<\/strong>（太 26:70、72；路 22:57）。<strong>寫這句話的人，自己不承認過主。<\/strong> 他和假師傅的分別不是「他從來沒有否認過」，而是：<strong>他哭了，他回頭了，他被主接回來了<\/strong>（路 22:61–62；約 21:15–17）。<\/p>\n<p>所以第 2 章那一連串嚴厲的話，不是一個完美的人居高臨下的定罪，<strong>是一個曾經站在懸崖邊、被主拉回來的人，看見別人正往下走時的大聲呼喊。<\/strong> 321 說「謙卑戰勝驕傲」——<strong>彼得後書第 2 章最難的功課，是怎樣講假師傅而自己不變成法利賽人。<\/strong><\/p>\n<p><strong>四、因為這卷書把「長進」排成一張清單<\/strong><\/p>\n<blockquote>\n<p>「正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識；有了知識，又要加上節制；有了節制，又要加上忍耐；有了忍耐，又要加上虔敬；有了虔敬，又要加上愛弟兄的心；有了愛弟兄的心，又要加上愛眾人的心。」（1:5–7）<\/p>\n<\/blockquote>\n<p><strong>從信心開始，到愛結束，中間八個台階。<\/strong> 「加上」原文 <strong>ἐπιχορηγήσατε<\/strong>——古希臘城邦裡，富人出資供應合唱團演出的那個字：<strong>不是勉強湊數，是慷慨地供應<\/strong>。<\/p>\n<p>而這張清單前面有兩節，次序絕對不可顛倒：<\/p>\n<blockquote>\n<p>「神的神能已將一切關乎生命和虔敬的事賜給我們……因此，他已將又寶貴又極大的應許賜給我們，叫我們……得與神的性情有分。」（1:3–4）<\/p>\n<\/blockquote>\n<p><strong>先是「神已將一切賜給」，然後才是「你們要分外地殷勤」。<\/strong> 321 說「先生命，再關係，後事工」；<strong>彼得後書說：先有神給的生命，才有我們加上的台階。<\/strong> 長進不是爬上去見神，是神已經下來給了一切，我們才在其中長大。<\/p>\n<p>（鐵律五在這裡最危險：1:5–7 的八個台階與 321「改變觀念的八大步驟」同為八項，<strong>絕不可講成「彼得也有八大步驟」<\/strong>。兩者是兩回事：彼得的八項是<strong>品格的果子<\/strong>，321 的八步是<strong>觀念改變的過程<\/strong>。講台只能說：兩者都從神的恩典開始，都以繁殖／愛眾人結束——「這使我們想起」，不是「這就是」。見 8.1。）<\/p>\n<p><strong>五、因為他稱保羅為「我們所親愛的兄弟」<\/strong><\/p>\n<blockquote>\n<p>「就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。」（3:15）<\/p>\n<\/blockquote>\n<p>保羅曾在安提阿<strong>當面抵擋彼得<\/strong>，因為他「有可責之處」（加 2:11）——那一次的責備，寫進了加拉太書，讀遍所有教會。<strong>一個被公開糾正過的使徒，在臨終的信裡稱糾正他的人為「我們所親愛的兄弟」，而且承認他的信是「經書」<\/strong>（3:16）。<\/p>\n<p>321 說「無己才能合一」「謙卑帶動謙卑，達到雙贏」——<strong>新約裡沒有比 3:15 更安靜、也更動人的一個例證。<\/strong> 彼得沒有替自己辯護，沒有提那一次的事；他只說：保羅有神所賜的智慧，他的信有些難明白，<strong>但那不是保羅的問題，是「無學問、不堅固的人」強解的問題<\/strong>。<\/p>\n<p><strong>六、因為「堅固」是彼得一生的字<\/strong><\/p>\n<p>主被賣那一夜：「你回頭以後，要堅固你的弟兄。」（路 22:32，στήρισον） 彼得前書最後：「必要親自……堅固你們。」（彼前 5:10，στηρίξει） <strong>彼得後書開頭：「並且在你們已有的真道上堅固。」<\/strong>（1:12，ἐστηριγμένους） <strong>彼得後書結尾：「免得……就從自己堅固的地步上墜落。」<\/strong>（3:17，στηριγμοῦ）<\/p>\n<p><strong>彼得後書被「堅固」這個字框起來。<\/strong> 中間是兩種「不堅固」的人：「勾引那心不堅固的人」（2:14，ἀστηρίκτους）、「無學問、不堅固的人強解」（3:16，ἀστήρικτοι）。<strong>主給彼得的那份功課，他做到了最後一封信的最後一段。<\/strong> 這是 321「920」最長的一條線：一個被主堅固的人，用一生堅固他的弟兄。<\/p>"},{"t":"星・井・天：全卷結構","html":"<table>\n<colgroup>\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<col style=\"width: 20%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>篇<\/th>\n<th>章<\/th>\n<th>字<\/th>\n<th>主題<\/th>\n<th>出處<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>一<\/td>\n<td>1<\/td>\n<td><strong>星<\/strong><\/td>\n<td>長進與確據：同得寶貴的信心、神能賜下一切、與神的性情有分、八個台階、眼瞎與健忘、蒙召揀選堅定、永不失腳、帳棚將拆、親眼見過威榮、聖山上的聲音、更確的預言、燈照暗處、晨星出現、聖靈感動<\/td>\n<td>「晨星在你們心裡出現」（1:19）<\/td>\n<\/tr>\n<tr>\n<td>二<\/td>\n<td>2<\/td>\n<td><strong>井<\/strong><\/td>\n<td>分辨與審判：假先知與假師傅、不承認買他們的主、貪心捏造、天使挪亞所多瑪、義人羅得、主知道搭救、膽大任性、沒有靈性的畜類、巴蘭與驢、無水的井、狂風催逼的霧氣、應許自由卻作奴僕、後來的景況比先前更不好、狗與豬<\/td>\n<td>「這些人是無水的井」（2:17）<\/td>\n<\/tr>\n<tr>\n<td>三<\/td>\n<td>3<\/td>\n<td><strong>天<\/strong><\/td>\n<td>等候與長進：提醒、好譏誚的人、應許在哪裡、水與火、一日如千年、不是耽延乃是寬容、像賊來到、該當怎樣聖潔、切切仰望、新天新地、安然見主、親愛的兄弟保羅、防備墜落、在恩典和知識上有長進、願榮耀歸給他<\/td>\n<td>「盼望新天新地」（3:13）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>三個字是三種光景<\/strong>：<strong>星<\/strong>——裡面的光（真道照進心裡）；<strong>井<\/strong>——外面的乾（假的源頭給不出水）；<strong>天<\/strong>——前面的家（義居在其中的新天新地）。<strong>一個人從心裡有晨星，才認得出哪一口井是乾的，才不會被乾井困住，一路走到新天新地。<\/strong><\/p>"},{"t":"全卷主軸：在恩典和知識上有長進","html":"<p>前幾卷的主軸：雅各書是「一面鏡子」，彼得前書是「一串腳印」；<strong>彼得後書的主軸是一棵正在長的樹——根在神已賜下的一切（1:3），長在提醒與真道裡（1:12），抵擋假教訓的風（第 2 章），等候收成的日子（第 3 章），最後一句是「有長進」（3:18）。<\/strong><\/p>\n<p>|—:|—|—| | 1 | <strong>1:3–4<\/strong> | 「神的神能已將一切……賜給我們」——起點：一切都已經給了 | | 2 | <strong>1:5–8<\/strong> | 「你們要分外地殷勤……加上」——回應：在已有的上面長 | | 3 | <strong>1:16–19<\/strong> | 「親眼見過他的威榮……如同燈照在暗處」——根據：不是捏造，是見證與聖經 | | 4 | <strong>2:1<\/strong> | 「連買他們的主他們也不承認」——危險：從裡面來 | | 5 | <strong>2:9<\/strong> | 「主知道搭救敬虔的人」——<strong>全卷樞紐<\/strong>：審判再重，搭救更確定 | | 6 | <strong>2:19<\/strong> | 「人被誰制伏就是誰的奴僕」——假自由的真相 | | 7 | <strong>3:9<\/strong> | 「不是耽延，乃是寬容……不願有一人沉淪」——等候的意義 | | 8 | <strong>3:13<\/strong> | 「盼望新天新地，有義居在其中」——終點的樣子 | | 9 | <strong>3:17–18<\/strong> | 「免得……墜落。你們卻要……有長進。願榮耀歸給他」——收束 |<\/p>\n<p><strong>樞紐為甚麼是 2:9？<\/strong> 2:4–8 是三個審判的例子（犯罪的天使、挪亞時代、所多瑪），<strong>每一個審判裡都藏著一個被保守的人<\/strong>（挪亞「傳義道的」2:5；羅得「義人」2:7）；2:9 把它講出來：<strong>「主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下。」<\/strong> 第 2 章所有嚴厲的話，都掛在這一節上：<strong>彼得講審判，是為了叫敬虔的人安心，不是為了叫他們害怕。<\/strong> 第 1 章的「永不失腳」（1:10）與第 3 章的「安然見主」（3:14）也都繫在這一節。<\/p>"},{"t":"真的知識與假的自由","html":"<p>雅各書用「從上頭來的與從下面來的」，彼得前書用「能壞的與不能壞的」；<strong>彼得後書用「認識主」與「被制伏」：<\/strong><\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th><\/th>\n<th>認識主（ἐπίγνωσις）的人<\/th>\n<th>假師傅與跟隨的人<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>源頭<\/td>\n<td>「皆因我們認識那……召我們的主」（1:3）<\/td>\n<td>「私自引進陷害人的異端」（2:1）<\/td>\n<\/tr>\n<tr>\n<td>對主<\/td>\n<td>「我們主救主耶穌基督」（1:11；3:18）<\/td>\n<td>「連買他們的主他們也不承認」（2:1）<\/td>\n<\/tr>\n<tr>\n<td>話語<\/td>\n<td>「並不是隨從乖巧捏造的虛言」（1:16）<\/td>\n<td>「用捏造的言語在你們身上取利」（2:3）<\/td>\n<\/tr>\n<tr>\n<td>眼睛<\/td>\n<td>「親眼見過他的威榮」（1:16）<\/td>\n<td>「滿眼是淫色」（2:14）；「就是眼瞎，只看見近處的」（1:9）<\/td>\n<\/tr>\n<tr>\n<td>記憶<\/td>\n<td>「我卻要將這些事常常提醒你們」（1:12）<\/td>\n<td>「他們故意忘記」（3:5）<\/td>\n<\/tr>\n<tr>\n<td>自由<\/td>\n<td>「得與神的性情有分」（1:4）——脫離敗壞<\/td>\n<td>「應許人得以自由，自己卻作敗壞的奴僕」（2:19）<\/td>\n<\/tr>\n<tr>\n<td>道路<\/td>\n<td>「義路」（2:21）<\/td>\n<td>「離棄正路」（2:15）；「隨從巴蘭的路」（2:15）<\/td>\n<\/tr>\n<tr>\n<td>結局<\/td>\n<td>「豐豐富富地得以進入……永遠的國」（1:11）<\/td>\n<td>「自取速速的滅亡」（2:1）<\/td>\n<\/tr>\n<tr>\n<td>腳步<\/td>\n<td>「就永不失腳」（1:10）<\/td>\n<td>「從自己堅固的地步上墜落」（3:17）是要防備的<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>φθορά（敗壞）的一條線<\/strong>：1:4「脫離世上從情慾來的敗壞」→ 2:12「必在他們的敗壞中滅亡」→ 2:19「作敗壞的奴僕」。<strong>假師傅應許的「自由」，正是 1:4 神要救我們脫離的那個東西。<\/strong> 321「舊人有己以自己為中心，自己要作主作王」——<strong>2:10「膽大任性」（αὐθάδεις，自以為是、隨己意）就是「有己」的希臘字；2:19 說出它的結局：自己作主的人，最後被別的東西作主。<\/strong><\/p>"},{"t":"321 原型對照表","html":"<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>321 結構<\/th>\n<th>彼得後書原型<\/th>\n<th>經文<\/th>\n<th>重點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>基礎一・耶穌是我的榜樣<\/strong><\/td>\n<td>「親眼見過他的威榮……『這是我的愛子，我所喜悅的』」<\/td>\n<td><strong>1:16–17<\/strong><\/td>\n<td>榜樣先是被父喜悅的那一位：<strong>我們效法的不是一套規條，是一個被看見的人<\/strong><\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「那用自己榮耀和美德召我們的主」<\/td>\n<td><strong>1:3<\/strong><\/td>\n<td>「美德」ἀρετή 與 1:5「德行」<strong>同一個字<\/strong>——他有的，他召我們加上<\/td>\n<\/tr>\n<tr>\n<td><strong>基礎二・聖經是我的準則<\/strong><\/td>\n<td>「我們並有先知更確的預言，如同燈照在暗處」<\/td>\n<td><strong>1:19<\/strong><\/td>\n<td><strong>全卷的 321 基礎二<\/strong>：天亮以前，燈就是準則<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「經上所有的預言沒有可隨私意解說的」<\/td>\n<td><strong>1:20<\/strong><\/td>\n<td>準則不隨私意（立場三；紅線八：也不是「只有牧師能解」）<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「保羅……的信……強解，就自取沉淪」<\/td>\n<td><strong>3:16<\/strong><\/td>\n<td>新約第一次把使徒書信稱為「經書」<\/td>\n<\/tr>\n<tr>\n<td><strong>基礎三・聖靈是我的引導<\/strong><\/td>\n<td>「乃是人被聖靈感動，說出神的話來」<\/td>\n<td><strong>1:21<\/strong><\/td>\n<td>「感動」φερόμενοι——<strong>像帆船被風推著走<\/strong>（這使我們想起徒 27:15、17 同一個字）<\/td>\n<\/tr>\n<tr>\n<td><strong>核心一・讓耶穌作王<\/strong><\/td>\n<td>「豐豐富富地得以進入我們主救主耶穌基督永遠的國」<\/td>\n<td><strong>1:11<\/strong><\/td>\n<td>國是他的，<strong>而且是「永遠的」<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>核心二・讓耶穌得一切榮耀<\/strong><\/td>\n<td>「願榮耀歸給他，從今直到永遠。阿們！」<\/td>\n<td><strong>3:18<\/strong><\/td>\n<td><strong>全卷最後一句；新約少數直接歸給基督的頌讚之一<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>目的・建立屬神的體系<\/strong><\/td>\n<td>「盼望新天新地，有義居在其中」<\/td>\n<td><strong>3:13<\/strong><\/td>\n<td>屬神體系的終局：<strong>一個「義」安家的地方<\/strong>——「居」κατοικεῖ，住下來不走<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「切切仰望神的日子來到」<\/td>\n<td><strong>3:12<\/strong><\/td>\n<td>「切切仰望」σπεύδοντας 也可譯「催促、加速」——<strong>等候不是坐著，是參與<\/strong>（321「邁進末後的大復興，迎接主耶穌再來」；但絕不算日子，紅線三）<\/td>\n<\/tr>\n<tr>\n<td><strong>問題的根源・有己與驕傲<\/strong><\/td>\n<td>「膽大任性，毀謗在尊位的，還不知懼怕」<\/td>\n<td><strong>2:10<\/strong><\/td>\n<td>αὐθάδης——<strong>以自己為樂、隨己意<\/strong>：有己的希臘字<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「巴蘭……貪愛不義之工價」<\/td>\n<td><strong>2:15<\/strong><\/td>\n<td>有己抓住的是酬報<\/td>\n<\/tr>\n<tr>\n<td><strong>出路・謙卑，回到本位<\/strong><\/td>\n<td>「主知道搭救敬虔的人」<\/td>\n<td><strong>2:9<\/strong><\/td>\n<td>回到本位：<strong>搭救是主的事<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>無己的落點<\/strong><\/td>\n<td>「我們所親愛的兄弟保羅」<\/td>\n<td><strong>3:15<\/strong><\/td>\n<td><strong>被糾正過的人稱糾正他的人為「親愛的兄弟」<\/strong>（壹五）——無己才能合一<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「我脫離這帳棚的時候快到了」<\/td>\n<td><strong>1:14<\/strong><\/td>\n<td>無己面對死亡：帳棚是要拆的<\/td>\n<\/tr>\n<tr>\n<td><strong>改變觀念・改變觀點<\/strong><\/td>\n<td>「主看一日如千年，千年如一日」<\/td>\n<td><strong>3:8<\/strong><\/td>\n<td><strong>從人的觀點改變成神的觀點；從暫時觀點改變成永恆觀點<\/strong>——不是換算，是換位<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>「不是耽延，乃是寬容」<\/td>\n<td><strong>3:9<\/strong><\/td>\n<td>同一件事（主還沒來），人的觀點是「耽延」，神的觀點是「寬容」<\/td>\n<\/tr>\n<tr>\n<td><strong>用心靠聖靈<\/strong><\/td>\n<td>「晨星在你們心裡出現」<\/td>\n<td><strong>1:19<\/strong><\/td>\n<td><strong>光出現在「心裡」<\/strong>——不是腦子裡多一條知識<\/td>\n<\/tr>\n<tr>\n<td><strong>焦點在耶穌<\/strong><\/td>\n<td>「我們主救主耶穌基督」<\/td>\n<td><strong>1:1、11；2:20；3:2、18<\/strong><\/td>\n<td>全卷五次完整稱號；<strong>最後一次就是最後一句<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>人比事重要<\/strong><\/td>\n<td>「愛弟兄的心……愛眾人的心」<\/td>\n<td><strong>1:7<\/strong><\/td>\n<td>八個台階的最後兩級都是愛人<\/td>\n<\/tr>\n<tr>\n<td><strong>920 的原型<\/strong><\/td>\n<td>「我卻要將這些事常常提醒你們……激發你們」<\/td>\n<td><strong>1:12–13<\/strong><\/td>\n<td>臨終的人還在激發他的「2」<\/td>\n<\/tr>\n<tr>\n<td><strong>235 的原型<\/strong><\/td>\n<td>「我們所親愛的兄弟保羅」<\/td>\n<td><strong>3:15<\/strong><\/td>\n<td>2 屬靈同伴：曾經衝突的兩個使徒<\/td>\n<\/tr>\n<tr>\n<td><strong>得勝者<\/strong><\/td>\n<td>「這樣，必叫你們豐豐富富地得以進入……永遠的國」<\/td>\n<td><strong>1:11<\/strong><\/td>\n<td>「豐豐富富」πλουσίως——<strong>不是勉強擠進去，是被盛大迎接<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>"},{"t":"彼得的一生與這封信","html":"<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>彼得後書<\/th>\n<th>彼得的經歷<\/th>\n<th>共同的字或畫面<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>「西門彼得」（1:1，Συμεών）<\/td>\n<td>「約翰的兒子西門」（約 21:15）<\/td>\n<td><strong>新約只有徒 15:14 與此處用希伯來拼法 Συμεών<\/strong>——<strong>最後一封信，他用了主在海邊叫他的那個本名<\/strong><\/td>\n<\/tr>\n<tr>\n<td>「趁我還在這帳棚的時候」（1:13）<\/td>\n<td>「我就在這裡搭三座棚」（太 17:4）<\/td>\n<td>帳棚（壹二）<\/td>\n<\/tr>\n<tr>\n<td>「我去世以後」（1:15，ἔξοδον）<\/td>\n<td>「談論他去世的事」（路 9:31）<\/td>\n<td>ἔξοδος（壹二）<\/td>\n<\/tr>\n<tr>\n<td>「正如我們主耶穌基督所指示我的」（1:14）<\/td>\n<td>「你年老的時候……」（約 21:18–19）<\/td>\n<td>主預告他的死<\/td>\n<\/tr>\n<tr>\n<td>「這是我的愛子，我所喜悅的」（1:17）<\/td>\n<td>登山變像（太 17:5；可 9:7；路 9:35）<\/td>\n<td><strong>新約福音書以外唯一的登山變像記載<\/strong><\/td>\n<\/tr>\n<tr>\n<td>「連買他們的主他們也不承認」（2:1）<\/td>\n<td>三次不認主（太 26:70–74）<\/td>\n<td>ἀρνέομαι（壹三）<\/td>\n<\/tr>\n<tr>\n<td>「你們若行這幾樣，就永不失腳」（1:10）<\/td>\n<td>在水面上往下沉（太 14:30）；院子裡跌倒<\/td>\n<td>失腳<\/td>\n<\/tr>\n<tr>\n<td>「狗所吐的，牠轉過來又吃」（2:22）<\/td>\n<td>「你回頭以後」（路 22:32）<\/td>\n<td><strong>回頭有兩種：狗回到嘔吐物，彼得回到主面前<\/strong><\/td>\n<\/tr>\n<tr>\n<td>「我們所親愛的兄弟保羅」（3:15）<\/td>\n<td>安提阿被保羅當面抵擋（加 2:11–14）<\/td>\n<td>和好（壹五）<\/td>\n<\/tr>\n<tr>\n<td>「在你們已有的真道上堅固」（1:12）；「堅固的地步」（3:17）<\/td>\n<td>「要堅固你的弟兄」（路 22:32）<\/td>\n<td>στηρίζω（壹六）<\/td>\n<\/tr>\n<tr>\n<td>「主……不願有一人沉淪，乃願人人都悔改」（3:9）<\/td>\n<td>主等候了彼得<\/td>\n<td><strong>寫「寬容」的人，自己是被寬容等回來的<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>講台落點<\/strong>：每一處〔背景〕都落在主身上——<strong>不是彼得多偉大，是主多恆久忍耐。<\/strong><\/p>"},{"t":"彼得後書與彼得前書","html":"<table>\n<colgroup>\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<col style=\"width: 25%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>主題<\/th>\n<th>彼得前書<\/th>\n<th>彼得後書<\/th>\n<th>分工<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>危險<\/td>\n<td>外面的逼迫<\/td>\n<td>裡面的錯謬<\/td>\n<td>前書教人「受苦」，後書教人「分辨」<\/td>\n<\/tr>\n<tr>\n<td>舊約先知<\/td>\n<td>「眾先知……考察……基督的靈」（彼前 1:10–12）<\/td>\n<td>「乃是人被聖靈感動，說出神的話來」（彼後 1:21）<\/td>\n<td>前書講先知在尋求，後書講先知的話更確<\/td>\n<\/tr>\n<tr>\n<td>挪亞<\/td>\n<td>「神容忍等待的時候……只有八個人」（彼前 3:20）<\/td>\n<td>「只保護了傳義道的挪亞一家八口」（彼後 2:5）<\/td>\n<td>前書講洗禮的對應，後書講審判中的保守<\/td>\n<\/tr>\n<tr>\n<td>神的忍耐<\/td>\n<td>「神容忍等待」（彼前 3:20，μακροθυμία）<\/td>\n<td>「乃是寬容你們」（彼後 3:9，μακροθυμεῖ）；「主長久忍耐」（3:15）<\/td>\n<td><strong>同一個字<\/strong>：前書是挪亞的日子，後書是我們的日子<\/td>\n<\/tr>\n<tr>\n<td>結局近了<\/td>\n<td>「萬物的結局近了」（彼前 4:7）<\/td>\n<td>「主看一日如千年」（彼後 3:8）<\/td>\n<td><strong>後書回答了前書留下的問題：「近」怎麼過了這麼久？<\/strong><\/td>\n<\/tr>\n<tr>\n<td>堅固<\/td>\n<td>「必要親自……堅固你們」（彼前 5:10）<\/td>\n<td>「在……真道上堅固」（彼後 1:12）；「堅固的地步」（3:17）<\/td>\n<td>前書是神堅固，後書是我們站在被堅固的地方<\/td>\n<\/tr>\n<tr>\n<td>恩典<\/td>\n<td>「這恩是神的真恩。你們務要在這恩上站立得住」（彼前 5:12）<\/td>\n<td>「在……恩典和知識上有長進」（彼後 3:18）<\/td>\n<td><strong>前書最後：站在恩上；後書最後：在恩上長<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>用法<\/strong>：〔彼前〕互見帶彼得前書講義章號（已完成，可直接帶）。<strong>講台落點一句<\/strong>：<strong>彼得前書教我們在火裡站得住；彼得後書教我們在霧裡看得清——站得住的人，還要長。<\/strong><\/p>"},{"t":"被引用的舊約","html":"<table>\n<thead>\n<tr>\n<th>主題<\/th>\n<th>彼得後書<\/th>\n<th>舊約<\/th>\n<th>前卷講義<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>犯罪的天使<\/td>\n<td>2:4<\/td>\n<td>創 6:1–4（猶太傳統的讀法）<\/td>\n<td><strong>創世記第 6 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>挪亞與洪水<\/td>\n<td>2:5；3:6<\/td>\n<td>創 6–8<\/td>\n<td><strong>創世記第 6–8 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>所多瑪、蛾摩拉與羅得<\/td>\n<td>2:6–8<\/td>\n<td>創 19<\/td>\n<td><strong>創世記第 19 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>巴蘭與驢<\/td>\n<td>2:15–16<\/td>\n<td>民 22–24<\/td>\n<td><strong>民數記第 22–24 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>狗轉過來吃<\/td>\n<td>2:22<\/td>\n<td>箴 26:11<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>一日如千年<\/td>\n<td>3:8<\/td>\n<td>詩 90:4<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>天地從水而出<\/td>\n<td>3:5<\/td>\n<td>創 1:2、6–9<\/td>\n<td><strong>創世記第 1 章<\/strong><\/td>\n<\/tr>\n<tr>\n<td>新天新地<\/td>\n<td>3:13<\/td>\n<td>賽 65:17；66:22<\/td>\n<td>—（這使我們想起啟 21:1）<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>巴蘭的驢（2:16）<\/strong>：「那不能說話的驢以人言攔阻先知的狂妄」——<strong>彼得用最幽默的一筆，講最嚴肅的事：神可以用一頭驢攔住一個被錢沖昏頭的先知。<\/strong><\/p>"},{"t":"與神的性情有分：四種讀法與三條界線","html":"<p><strong>原文<\/strong>：ἵνα διὰ τούτων γένησθε θείας κοινωνοὶ φύσεως。<\/p>\n<table>\n<colgroup>\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<col style=\"width: 33%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>讀法<\/th>\n<th>意思<\/th>\n<th>誰這樣讀<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>成神論（theosis）<\/strong><\/td>\n<td>人藉恩典分享神的「能力」（energies），不是神的「本質」（essence）；越來越像神<\/td>\n<td>東正教（阿他那修：「神成為人，好叫人成為神」——<strong>意思是藉恩典有分，不是變成另一位神<\/strong>）<\/td>\n<\/tr>\n<tr>\n<td><strong>與基督聯合<\/strong><\/td>\n<td>藉聖靈與基督聯合，有分於他的生命；成聖是被更新成神的形像<\/td>\n<td>改革宗、路德宗<\/td>\n<\/tr>\n<tr>\n<td><strong>完全的愛<\/strong><\/td>\n<td>有分於神的聖潔與愛，在今生可以有完全的愛<\/td>\n<td>衛斯理傳統<\/td>\n<\/tr>\n<tr>\n<td><strong>道德的相似<\/strong><\/td>\n<td>有分於神的道德品格（聖潔、良善），不是本體<\/td>\n<td>許多福音派註釋<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>本講義的立場<\/strong>：採「與基督聯合、有分於神的生命與品格」，並陳四讀；<strong>明說三條界線<\/strong>：①<strong>創造者與受造者的分別永遠存在<\/strong>——人不會成為神，也不會與神的本質混同；②<strong>有分是恩典，不是修煉<\/strong>——「他已將……應許賜給我們」（1:4）；③<strong>有分的內容寫在下文<\/strong>：脫離敗壞（1:4）、加上德行……愛（1:5–7）。<\/p>"},{"t":"作者與猶大書","html":"<p><strong>本講義的立場<\/strong>：使徒彼得。理由：1:1 自稱；1:14 主的預告（約 21）；1:16–18 親身見證登山變像；3:1「第二封信」；3:15 稱保羅為兄弟。<\/p>\n<table>\n<colgroup>\n<col style=\"width: 50%\" />\n<col style=\"width: 50%\" />\n<\/colgroup>\n<thead>\n<tr>\n<th>託名說的理由<\/th>\n<th>回應<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>希臘文與彼得前書風格差很多<\/td>\n<td>彼得前書「託西拉」（彼前 5:12），本書沒有提代筆人——<strong>兩封信經手的人不同<\/strong>；而且兩封信主題不同（受苦／錯謬），用字本來就不同<\/td>\n<\/tr>\n<tr>\n<td>3:4「列祖睡了」、3:16「保羅的信」像第二代教會<\/td>\n<td>「列祖」最自然指舊約的先祖（來 1:1）；保羅的信在 60 年代已在各教會傳閱（西 4:16）<\/td>\n<\/tr>\n<tr>\n<td>早期教會對它有爭議<\/td>\n<td>屬實——<strong>本講義誠實交代<\/strong>；但爭議不等於否定，4 世紀亞他那修書信與迦太基會議都接受<\/td>\n<\/tr>\n<tr>\n<td>「遺言」是當時託名作品的常見文體<\/td>\n<td>文體本身不證明託名；<strong>真正臨終的人也會寫遺言<\/strong><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>與猶大書<\/strong>：2:1–3:3 與猶 4–18 約十九處平行。三種說法：①猶大書在先，彼得用了猶大書（多數學者）；②彼得在先，猶大用了彼得（2:1、3:3 用未來式「必有」，猶大書用過去式「已經」）；③兩者共用一個早期教會的教導材料。<strong>本講義並陳三說，不裁判<\/strong>；〔猶〕互見先標經文出處，將來猶大書製作時分工：<strong>彼得後書講「長進中的分辨」，猶大書講「為真道竭力爭辯」<\/strong>。<\/p>"},{"t":"主的日子：3:8–13 怎樣讀","html":"<ol type=\"1\">\n<li><strong>3:8 不是公式<\/strong>：詩 90:4 的意思是神超越時間；<strong>「一日如千年，千年如一日」兩個方向都說，正是為了取消換算<\/strong>。<\/li>\n<li><strong>3:9 的焦點是寬容<\/strong>：主的「慢」是愛的「等」。321 落點：<strong>等候的時間是悔改與傳福音的時間<\/strong>——不是焦慮的時間。<\/li>\n<li><strong>3:13 新天新地<\/strong>：「新」καινός 是「品質更新」不是「另一個全新的物件」（這使我們想起羅 8:21「受造之物……得享神兒女自由的榮耀」）；<strong>落點是「有義居在其中」<\/strong>。<\/li>\n<li><strong>321 的落點<\/strong>：「從暫時觀點改變成永恆觀點」——<strong>3:11「你們為人該當怎樣聖潔，怎樣敬虔」：永恆的觀點不是叫人離開世界，是叫人在世界裡活得不一樣。<\/strong><\/li>\n<\/ol>"},{"t":"分辨假教訓：記號而不是名單","html":"<p><strong>立場三・分辨假教訓<\/strong><\/p>\n<ol type=\"1\">\n<li><strong>經文問的是甚麼<\/strong>：誰是假師傅？我怎麼知道我的教會、我聽的講道是真的？「沒有可隨私意解說的」——我自己讀經會不會讀錯？<\/li>\n<li><strong>彼得給的五個記號<\/strong>（2:1–19）：<strong>對基督<\/strong>——不承認買他們的主（2:1）；<strong>對金錢<\/strong>——貪心、捏造言語取利（2:3、14–15）；<strong>對身體<\/strong>——隨肉身放縱污穢的情慾（2:10、14、18）；<strong>對權柄<\/strong>——膽大任性、輕慢（2:10）；<strong>對自由<\/strong>——應許人自由，自己卻作奴僕（2:19）。<strong>五個記號都是「果子」，不是「口才」或「宗派標籤」<\/strong>（這使我們想起太 7:15–20）。<\/li>\n<li><strong>本講義的立場<\/strong>：①<strong>講台教記號，不給名單<\/strong>——不點名今天任何牧者、教會、宗派、網路傳道人；②<strong>分辨從自己開始<\/strong>：五個記號先照自己；③<strong>1:20 的「私意」最自然的讀法是預言的「來源」不是出於人意<\/strong>（1:21 的「因為」說明了這一點），<strong>不是禁止信徒自己讀經<\/strong>；讀經的保護是<strong>在群體中讀、照上下文讀、謙卑地讀<\/strong>（3:16「強解」的反面）；④遇到教會內真正的錯謬或侵害，<strong>照著程序、在愛中、公開透明地處理<\/strong>，不在網路上獵巫。<\/li>\n<li><strong>321 落點<\/strong>：「聖經是我的準則」——<strong>準則是燈（1:19），不是棍子<\/strong>。分辨的目的是自己不墜落（3:17）、把迷路的人找回來（這使我們想起雅 5:19–20），不是證明自己是對的。<\/li>\n<\/ol>\n<p>牧養底線：不在講台與小組點名「假師傅」；不用「假師傅」一詞壓制提出問題的會友；教會財務透明是對 2:3 最好的回應。<\/p>"},{"t":"講台把關：八條紅線","html":"<p><strong>紅線一：不點名今天任何牧者、教會、宗派、網路傳道人為「假師傅」；講台教記號，不給名單。<\/strong> 檢驗標準：不同教會背景的弟兄姊妹聽完，是更會照自己、更會分辨果子，還是更會懷疑別人、更想轉貼「某某是假師傅」？<\/p>\n<p><strong>紅線二：不用 2:10「輕慢主治的」「毀謗在尊位的」堵住對教會領袖的正當質疑。<\/strong> 檢驗標準：有沒有講到第 2 章被定罪的正是「師傅」（在上位的人）？有沒有回指彼得前書 5:3「不是轄制」？<\/p>\n<p><strong>紅線三：不用 3:8「一日如千年」算末日或算創造日；不用 3:12 推算或「加速」主再來的日期。<\/strong> 檢驗標準：有沒有講到 3:8 兩個方向都說？有沒有講到 3:10「像賊來到」？<\/p>\n<p><strong>紅線四：不把 1:4 講成人可以成為神、與神同等或與神的本質混同；也不因為怕講偏就跳過 1:4。<\/strong> 檢驗標準：有沒有明說創造者與受造者的分別？有沒有講到有分的內容就是 1:5–7 的品格？<\/p>\n<p><strong>紅線五：不用 2:20–22 恐嚇軟弱、跌倒、正在掙扎的信徒；不對任何個人宣判「你已經沒救了」。<\/strong> 檢驗標準：有沒有講到上下文是假師傅？有沒有同時講 1:9「已經得了潔淨」與 3:9「乃願人人都悔改」？一位剛跌倒、很想回頭的弟兄聽完，是更想回來，還是更絕望？<\/p>\n<p><strong>紅線六：不用 3:10–12 推出「地球反正燒掉，不必照顧受造界」；也不把環境議題變成政治動員。<\/strong> 檢驗標準：有沒有講到 3:13「新天新地」是更新，以及 3:11「該當怎樣聖潔」是今天的生活？<\/p>\n<p><strong>紅線七：不嘲笑或貶低保羅、也不貶低彼得；不把 3:15–16 讀成兩位使徒的角力。<\/strong> 檢驗標準：有沒有講到 3:15「親愛的兄弟」？<\/p>\n<p><strong>紅線八：不用 1:20「沒有可隨私意解說的」或 3:16「難明白的」禁止會眾自己讀經，或主張「只有牧師能解經」。<\/strong> 檢驗標準：有沒有講到 1:20 的焦點是預言的來源（1:21「因為」）？有沒有給出在群體中、照上下文、謙卑讀經的方法？<\/p>"}],"meta":{"book":"彼得後書","slug":"321-2pe","vol":25,"title":"321聖經講義・彼得後書","arcs":["星","井","天"],"spine":["1:3–4","1:5–8","1:16–19","2:1","2:9（樞紐）","2:19","3:9","3:13","3:17–18"],"note":"經文依和合本 1989 新標點；希臘文依 SBLGNT。本版經文與原文於雲端鍵入，待以 cu89t／SBLGNT 實檔逐字核對。"}}</script>

  /* ---------- 存檔 ---------- */
  function defState() {
    return { v: 1, last: null, steps: {}, notes: {}, lnote: {}, prac: {}, mem: {}, set: { fs: 17, grk: false, dark: false, sc: LANG === 'sc', role: '' }, seen: {} };
  }
  function loadState() {
    var s = defState(), k;
    try {
      var raw = window.localStorage ? localStorage.getItem(KEY) : null;
      if (raw) {
        var o = JSON.parse(raw);
        if (o && typeof o === 'object') {
          for (k in s) { if (s.hasOwnProperty(k) && o[k] !== undefined && o[k] !== null) { s[k] = o[k]; } }
          var ds = defState().set;
          if (!s.set || typeof s.set !== 'object') { s.set = ds; }
          for (k in ds) { if (ds.hasOwnProperty(k) && s.set[k] === undefined) { s.set[k] = ds[k]; } }
          var objs = ['steps', 'notes', 'lnote', 'prac', 'mem', 'seen'];
          for (var i = 0; i < objs.length; i++) { if (!s[objs[i]] || typeof s[objs[i]] !== 'object') { s[objs[i]] = {}; } }
        }
      }
    } catch (e) { s = defState(); }
    s.set.sc = LANG === 'sc';
    return s;
  }
  var S = loadState();
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { /* 私密模式或滿了：不影響閱讀 */ }
  }

  /* ---------- 小工具 ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function br(s) { return esc(s).replace(/\n/g, '<br>'); }
  function paras(s) {
    var a = String(s || '').split(/\n+/), out = [];
    for (var i = 0; i < a.length; i++) { if (a[i].replace(/\s/g, '')) { out.push('<p>' + esc(a[i]) + '</p>'); } }
    return out.join('');
  }
  function ref(s) {
    return String(s || '').replace(/(\d+):(\d+)--\2(?!\d)/g, '$1:$2').replace(/--/g, '–');
  }
  function stars(n) { var s = ''; for (var i = 0; i < (n || 0); i++) { s += '★'; } return s; }
  function strip(h) {
    return String(h || '').replace(/<[^>]+>/g, ' ').replace(/&nbsp;/g, ' ').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"').replace(/&#39;/g, "'").replace(/&amp;/g, '&').replace(/\s+/g, ' ');
  }
  function $(id) { return document.getElementById(id); }
  function arcOf(c) { return (D.meta && D.meta.arcs && D.meta.arcs[c - 1]) || CH[c - 1].arc || ''; }
  function chLabel(c) { return '第' + NUM[c] + '章'; }
  function chips(act, cur, prefix) {
    var h = '<div class="chips">';
    for (var c = 1; c <= CH.length; c++) {
      h += '<button class="chip' + (c === cur ? ' on' : '') + '" data-a="' + act + '" data-v="' + c + '">' + (prefix || '') + chLabel(c) + '・' + esc(arcOf(c)) + '</button>';
    }
    return h + '</div>';
  }
  function noteUI(store, key) {
    var has = !!S[store][key];
    return '<button class="notebtn' + (has ? ' has' : '') + '" data-a="note" data-v="' + key + '" data-s="' + store + '">✎ 領受' + (has ? '（已寫）' : '') + '</button>' +
      '<div class="notebox" id="nb-' + key.replace(/:/g, '-') + '"><textarea data-nk="' + key + '" data-s="' + store + '" placeholder="寫下你在這一段的領受……">' + esc(S[store][key] || '') + '</textarea><div class="mute">自動儲存在這支裝置上</div></div>';
  }
  function parseT321(s) {
    var parts = String(s || '').split('\\');
    var head = parts.shift().replace(/：\s*$/, '').replace(/\s*>\s*$/, '');
    var body = parts.join('\n').replace(/\s+>\s+>\s+/g, '\n').replace(/(^|\n)\s*>\s*/g, '$1');
    var lines = body.split('\n'), out = [];
    for (var i = 0; i < lines.length; i++) { var t = lines[i].replace(/^\s+|\s+$/g, ''); if (t) { out.push(t); } }
    return { head: head, lines: out };
  }

  /* ---------- 路由 ---------- */

        }
      }, 40);

  }

  var IDX = null;
  function buildIndex() {
    if (IDX) { return IDX; }
    IDX = [];
    var c, i, j, cs;
    for (c = 1; c <= CH.length; c++) {
      cs = String(c);
      var vs = D.txt[cs] || [];
      for (i = 0; i < vs.length; i++) { IDX.push({ k: '經文 彼後' + c + ':' + (i + 1), t: vs[i], g: { tab: 'bible', ch: c, anchor: 'v-' + c + '-' + (i + 1) } }); }
      var bl = D.blk[cs] || [];
      for (i = 0; i < bl.length; i++) {
        var b = bl[i];
        IDX.push({ k: '講義 ' + c + ':' + b.a + (b.z !== b.a ? '–' + b.z : ''), t: strip([b.lit, b.key, b.gram, b.exp].join(' ')), g: { tab: 'course', ch: c, sub: 'blk', lesson: 0, anchor: 'b-' + c + '-' + i } });
      }
      var sm = (D.serm[cs] || { blocks: [] }).blocks;
      for (i = 0; i < sm.length; i++) { IDX.push({ k: '講章 ' + chLabel(c), t: sm[i][1], g: { tab: 'course', ch: c, sub: 'serm', lesson: 0, anchor: 's-' + c + '-' + i } }); }
      var L = D.lesson[cs];
      if (L) {
        for (i = 0; i < L.secs.length; i++) {
          IDX.push({ k: '教學講章 第' + NUM[c] + '課・' + L.secs[i].h, t: L.secs[i].h + ' ' + L.secs[i].ps.join(' '), g: { tab: 'course', lesson: c, anchor: 'l-' + c + '-' + i } });
        }
        for (i = 0; i < L.deep.length; i++) {
          IDX.push({ k: '想更深 第' + NUM[c] + '課', t: L.deep[i].q + ' ' + L.deep[i].a, g: { tab: 'course', lesson: c, anchor: 'd-' + c + '-' + i, open: mkOpen('d-' + c + '-' + i) } });
        }
        for (i = 0; i < L.hua.length; i++) {
          var u = L.hua[i], tx = u.h + ' ' + (u.aim || '') + ' ' + (u.note || '');
          if (u.qs) { for (j = 0; j < u.qs.length; j++) { tx += ' ' + u.qs[j].q; } }
          if (u.ps) { tx += ' ' + u.ps.join(' '); }
          IDX.push({ k: '三個化 第' + NUM[c] + '課・' + u.h, t: tx, g: { tab: 'course', lesson: c, anchor: 'h-' + c + '-' + i } });
        }
      }
    }
    for (i = 0; i < D.issues.length; i++) {
      var s = D.issues[i], pt = '';
      for (j = 0; j < s.pos.length; j++) { pt += ' ' + s.pos[j][0] + ' ' + s.pos[j][2]; }
      IDX.push({ k: '爭議 ' + s.id, t: s.t + ' ' + s.why + pt + ' ' + s.say + ' ' + s.care, g: { tab: 'tools', tool: 'issues', open: mkOpen('i-' + s.id), anchor: 'i-' + s.id } });
    }
    return IDX;
  }
  function mkOpen(id) { var o = {}; o[id] = 1; return o; }

  function tSearch() {
    return '<input type="search" id="sq" placeholder="輸入字詞，例如：晨星、ἐπίγνωσις、挪亞" value="' + esc(R.q) + '"><div id="sres">' + searchHTML(R.q) + '</div>';
  }
  var SRES = [];
  function searchHTML(q) {
    q = String(q || '').replace(/^\s+|\s+$/g, '');
    SRES = [];
    if (!q) { return '<p class="mute">可搜尋：經文、講義、講章、教學講章、想更深、三個化、爭議議題。</p>'; }
    var idx = buildIndex(), ql = q.toLowerCase(), total = 0, h = '';
    for (var i = 0; i < idx.length; i++) {
      var t = idx[i].t, p = t.toLowerCase().indexOf(ql);
      if (p < 0) { continue; }
      total++;
      if (SRES.length >= 80) { continue; }
      var a = Math.max(0, p - 24), z = Math.min(t.length, p + q.length + 46);
      var snip = (a > 0 ? '…' : '') + esc(t.slice(a, p)) + '<mark>' + esc(t.substr(p, q.length)) + '</mark>' + esc(t.slice(p + q.length, z)) + (z < t.length ? '…' : '');
      h += '<button class="sres" data-a="sres" data-v="' + SRES.length + '"><b>' + esc(idx[i].k) + '</b>' + snip + '</button>';
      SRES.push(idx[i].g);
    }
    return '<p class="mute">找到 ' + total + ' 筆' + (total > 80 ? '（顯示前 80 筆）' : '') + '</p>' + h;
  }
  var sTimer = null;
  function bindSearch() {
    var el = $('sq');
    if (!el) { return; }
    var fn = function () {
      if (sTimer) { clearTimeout(sTimer); }
      sTimer = setTimeout(function () { R.q = el.value; $('sres').innerHTML = searchHTML(R.q); }, 200);
    };
    el.oninput = fn;
    el.onkeyup = fn;
  }

  function tTracks() {

  /* ---------- 朗讀（裝置語音） ---------- */
  var TTS_OK = !!(window.speechSynthesis && typeof window.SpeechSynthesisUtterance !== 'undefined');

    var out = [], i, j;
    if (R.tab === 'course' && R.lesson) {
      var L = D.lesson[String(R.lesson)];
      out.push(L.t); out.push(L.open);
      for (i = 0; i < L.secs.length; i++) { out.push(L.secs[i].h); for (j = 0; j < L.secs[i].ps.length; j++) { out.push(L.secs[i].ps[j]); } }

      var b = (D.serm[String(R.ch)] || { blocks: [] }).blocks;
      for (i = 0; i < b.length; i++) { out.push(b[i][1]); }
    }
    var res = [];
    for (i = 0; i < out.length; i++) {
      var t = String(out[i] || '');
      while (t.length > 140) {
        var cut = -1, m, re = /[。！？；]/g;
        while ((m = re.exec(t)) && m.index < 140) { cut = m.index + 1; }
        if (cut < 20) { cut = 140; }

        var l = String(vs[i].lang || '').replace('_', '-');
        if (l === want) { return vs[i]; }

      }

    } catch (e) { return null; }
  }

    var v = pickVoice(); if (v) { u.voice = v; }
    u.rate = 1;
    u.onend = function () { if (gen !== TGEN) { return; } TI++; speakNext(gen); };
