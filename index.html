要奉獻某個數目，神保證加倍回報；或拉你投資一個弟兄合辦、保證賺錢的項目。拒絕他，好像不尊重長輩。這時候用 2:3 照一照：有沒有貪心？有沒有捏造的言語？有沒有把人當作取利的對象？你可以溫和地說：謝謝您想到我，這件事我要先和家人、和教會的長執一起禱告。尊重長輩，不等於把錢和判斷交出去。若已經受了損失，不要因為羞愧一個人扛，教會願意陪你，必要時也該尋求專業或法律的協助。"],["d",["我被騙過錢，覺得很丟臉，不敢讓教會知道，也不敢再奉獻，怎麼辦？","被騙不等於笨，更不等於信心不好。彼得說他們「用捏造的言語在你們身上取利」，被下餌的常常是最真誠、最想信任人的人，也常常是在最難的時候。羞愧會讓人把事情藏起來，結果是一個人背著損失，也讓同樣的手法繼續傷害別人。可以走三步：先告訴一位你信得過、口緊的人；再請牧者或長執陪你理清狀況；若有金錢或法律上的損失，盡早尋求專業或法律協助，保留轉帳紀錄和訊息。主說他的審判沒有打盹，你可以把公道交給他，也可以在地上走正當的途徑。至於奉獻，不必急著恢復，等你看清楚帳目、心裡有平安再說，神看重的是心，不是數目。"]],["h","七、活出321——在乾井的時代回到活水"],["p","經文講完了，321 才在末端認出它。"],["p","耶穌是我的榜樣：彼得不認主的那一夜，「主轉過身來看彼得」（路 22:61），那一眼沒有定罪，是把他找回來的眼光。我們分辨錯謬的時候，也要帶著這樣的眼光，不是審判官的眼光；主在 2:9 懂得怎樣搭救，我們學的是怎樣把人拉回來，不是把人推下去。"],["p","聖經是我的準則：準則是燈，不是棍子。1:19 說先知的話「如同燈照在暗處」，我們用五個記號先照自己，再在群體中、照上下文、謙卑地分辨，不憑傳聞，也不憑情緒。"],["p","聖靈是我的引導：乾井用餌引誘不堅固的人，聖靈卻把人引回活水，在真道上被堅固。他會敲警鐘，也會帶來安慰；用心靠聖靈，不用腦靠自己。"],["p","讓耶穌作王：2:19 說人被誰制伏就是誰的奴僕。不讓耶穌作王，就是讓貪心、情慾或自己的意思作王；任性就是有己，自己要作主。讓他作王，才是真自由。"],["p","讓耶穌得著一切的榮耀：搭救是主的事。羅得不能誇，挪亞不能誇，彼得也不能誇，榮耀全歸那位知道搭救的主；我們在分辨的事上也不搶功勞，不需要成為「揭發的人」。"],["p","建立屬神的體系：讀完這一章才看得見，屬神的體系不是靠揭發別人建立的，是靠彼此堅固建立的：帳目透明，講台不賣應許，領袖可以被問、被糾正，剛脫離妄行的人有人陪他走第一年。國度321空中團契散在各國，每一個小組都可以是一口真井的井口：不是我們有水，是我們把人帶到泉源那裡。"],["d",["怎樣分辨自己常聽的講道是活水，還是乾井？","可以拿 2:1--19 的五個記號來問，先問果子，不先問口才。對基督：這篇講道最後把我帶到耶穌面前，還是帶到講員面前？對金錢：它要的是我的心，還是我的錢？對身體：它叫我更聖潔，還是叫我覺得放縱沒關係？對權柄：講的人能不能被問、被糾正？對自由：它叫我更自由地順服主，還是叫我不再需要任何人？再加一題：聽完以後，我是更愛主、更愛人，還是更佩服講員？這些問題不是拿來審判別人，是拿來保護自己，也幫你知道該在哪裡扎根。若發現自己長期喝的是霧，不必一走了之，先找一位信得過的同伴一起禱告、一起讀經，再決定下一步。"]],["h","八、四種心，同一位知道搭救的主"],["p","驕傲型的心，讀這一章最容易興奮，因為終於可以指出別人的錯。請看寫這一章的人，他自己不承認過主。先照你自己；任性的根就是有己，放下那支只屬於神的法槌，回到本位，讓神作神。你最需要的不是更準的眼光，是一顆會為人流淚的心。"],["p","恐懼型的心，讀完會想：我被騙過，以後誰都不敢信了。主對你說：我知道搭救。你不必靠懷疑一切來保護自己；回到活水，在一群可以被問、也願意被問的人中間被堅固，就是最好的保護。分辨不是把門關上，是學會開對的門。"],["p","羞恥型的心，讀到狗和豬就低下頭，覺得說的就是自己。請聽 1:9：你舊日的罪已經得了潔淨；請聽 3:9：主不願有一人沉淪。你會痛，表示你的心還活著；狗轉回所吐的，你可以像彼得一樣，轉回主面前。"],["p","受傷型的心，曾經被講台上的人傷害、控制，甚至被騙了錢，還被一句「你批評我就是輕慢主治的」堵住了口。那些話本來就不是 2:10 的意思。你的傷不是信心不足，主沒有站在傷害你的人那一邊；你不需要先原諒才算屬靈。若你仍在那樣的控制裡，先讓一位信得過的人陪你找到安全，必要時尋求專業或法律的協助。"],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上用 2:1--19 的五個記號照自己一個：對基督、對金錢、對身體、對權柄、對自由。照完寫下一句，最刺你的那一個，用一句話向主悔改。"],["p","第二，這一週不轉傳任何「某某是假師傅」的訊息；收到的時候，停三秒，改成為那個人、也為轉傳的人各禱告一句。"],["p","第三，背下 2:9，寫在手機桌布或冰箱門上；每當你覺得被不義包圍、看見乾井風生水起，就把它說出來：主知道搭救。"],["p","第四，找出你身邊一位剛信主、或剛從傷害裡出來還站不穩的人，這一週約他喝一杯茶，問他最近讀了甚麼，先聽，不急著教。"],["p","第五，若你曾被屬靈的人傷害或被騙過錢，這一週選一位你信得過的同伴或牧者，說出一句話就好；若涉及金錢或法律上的損失，把紀錄整理好，查清楚可以求助的管道。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：主用重價買了我，我不屬於自己，我屬於他。"],["p","我宣告：主知道搭救敬虔的人，審判是他的事，我只管跟著他走。"],["p","我宣告：我不再被任何東西制伏，讓耶穌作王才是我的自由。"],["p","我宣告：我舊日的罪已經得了潔淨，今天我回到主面前，也願意堅固我的弟兄。"],["d",["要我不轉傳那些揭發的訊息，可是如果我親眼看見的是事實，難道也不能說嗎？","可以說，問題是向誰說、怎樣說。不轉傳，指的是不在群組和網路上把未經查證、帶著情緒的指控再推一把；它不是叫你把親眼看見的錯謬或侵害吞下去。若你看見的是事實，請照順序走：先寫下時間、地點和你看見的事，不加形容詞；再按著教會的程序，向該負責的人或監督機制提出；若涉及金錢不當、性方面的侵害或對人的控制，必要時尋求外部專業或法律協助，涉及兒少的事件依法通報。這樣做不是毀謗，是保護羊群。你也要同時保護說出真相的受害者，不把他的細節傳出去。分辨的最後一道檢驗是：我說出來，是為了讓傷害停止，還是為了讓自己被看見？"]],["h","十、結語"],["p","回到秀蓮姊。那一年站在乾井邊，她母親沒有罵那個指錯路的人，也沒有把空桶摔在地上；她牽起女兒的手，說：「我們往溪那邊走。」那一天她們走到很晚，可是有水。五十年後，秀蓮姊需要的，也不是有人告訴她哪一口井是假的，是有人牽著她的手，陪她走到真正有水的地方。上個月，小組裡一位姊妹每個星期陪她讀一段經文，她說：「我好像又渴了。」"],["p","這一課的焦點，不在假師傅有多可怕，不在我們有多會分辨，也不在彼得多了不起。焦點在那一位用重價買了我們、轉過身來看跌倒的彼得、知道怎樣把挪亞和羅得拉出來的主。所以這一章的次序是這樣的：先認出乾井，「這些人是無水的井」（2:17）；再抓住那隻手，「主知道搭救敬虔的人脫離試探」（2:9）；而回頭的路一直開著，因為他「不願有一人沉淪，乃願人人都悔改」（3:9）。請你不要更佩服彼得，請你更愛那一位沒有放開彼得、也沒有放開你的主。"],["p","我們一起低頭禱告。用重價買了我們的主，謝謝你，你知道搭救敬虔的人。求你先光照我們的心，叫我們不在你的真道旁邊夾帶自己的東西。在乾井很多的時代，求你保守我們不被餌引誘，也不因為受過傷就不再喝水。求你安慰那些被講台上的人傷害、被騙了錢、不敢再走進聚會的弟兄姊妹，讓他們遇見可以信任的同伴，也找到公道和幫助。為那些跌倒了、正在害怕的人，求你叫他們聽見你說：回來吧。主啊，審判是你的，搭救也是你的，我們把自己交給你。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","小組不找誰是乾井，是讓每一個人說出一口自己走過的乾井、一件看久了不再痛的事，和這一週要牽起的一隻手；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是乾井、羅得、回頭。這是全卷最容易講成獵巫的一課，席上可能有被屬靈虐待、被講台上的人控制或被騙過錢的人，也可能有離開教會多年、剛剛回來的人，請先讀三段帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：講得出三個觀念：講台教記號不給名單，分辨先照自己；三個審判裡藏著兩個搭救，主知道搭救；2:20--22 是警告，不是對跌倒者的宣判。"],["n","1. ★ 開場秀蓮姊和母親走到乾井邊，你自己有沒有一次，滿懷盼望走過去，到了才發現是空的？簡單說是甚麼事、幾歲的時候。"],["n","2. ★★★ 請用自己的話說：為甚麼彼得只給五個記號，不給一份名單？為甚麼寫這一章的人自己不承認過主，這件事很重要？"],["n","3. ★★ 2:4--9 三個審判裡藏著兩個搭救。羅得那麼軟弱，為甚麼仍被稱為義人？這對你有甚麼安慰？"],["n","4. ★★ 2:10 的「主治的」指的是誰？為甚麼這一節不能拿來堵住對教會領袖的正當質疑？"],["m","帶領提醒：本課不談任何具體人名、教會名、宗派名或平台名；若有人提出，溫和地帶回「記號，不是名單」。有人問 2:20--22 能不能失落救恩，一句指向議題頁，不在組裡辯論。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人照見自己身上的一個記號、一件看久了不痛的事，並說出這一週要回頭的那一步。"],["t","【看】看見自己"],["n","5. ★★★ 五個記號：對基督、對金錢、對身體、對權柄、對自由。誠實地看，哪一個最照到你自己，而不是照到別人？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 2:7--9 兩遍。在哪一個詞上你停了下來：義心、天天傷痛、主知道，還是搭救？今天那一個詞對你說了甚麼？"],["t","【想】想通關卡"],["n","7. ★★★ 你回不到活水那裡，卡在哪裡：看久了已經不痛、被騙過不敢再信、覺得自己就是那條狗，還是放不下審判別人的那支槌子？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 願意的人，請用一句話禱告：「主啊，你知道搭救我脫離……」說出是哪一件事就好，不必說細節。右手邊的人只回一句「主知道」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要回頭的那一步：哪一天、在哪裡、做哪一件具體的事；若你曾被傷害或被騙，也寫下這一週要找誰說第一句話。"],["m","帶領提醒：這一化可能碰到屬靈虐待、被講台上的人控制、被騙錢、離開教會多年的羞恥與長期無望感。不追問細節，不要求任何人原諒誰，不對正在流淚的人說「你要有信心」，也不在組裡評論那個人或那個團體；任何人都可以跳過第八題。若有人說出仍在控制或損失之中，不在組裡處理，會後單獨關心，先確認他是否安全，必要時協助他尋求專業輔導或法律協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一個不轉傳的決定、一節背下來的經文、一位要陪的人、一位要講給他聽的朋友。"],["n","10. ★★ 下一次群組裡出現「某某是假先知」的影片，你要怎樣回應？現在寫下一句你會回覆、或決定不回覆的話。"],["n","11. ★ 這一週每天早上幾點、在哪裡用五個記號照自己？你最想先照的是哪一個？"],["n","12. ★★ 說出一位你要為他禱告、求主叫他回頭的人，可以只說稱呼；這一週哪一天，你要傳一句 3:9 給他，或只是問候他？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位剛信主、或剛從傷害裡出來還站不穩的人。當場說出他的名字，說出這一週哪一天、在哪裡，你要先聽他說，再和他一起讀 2:9。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，有些人看起來像井，走近了才知道沒有水，聖經早就教人認這些記號。第二句，可是有一位主，知道怎樣把軟弱的人從試煉裡拉出來。第三句，走錯路的人隨時可以回頭，他不願有一人沉淪。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會更小心」這類答案；不在組裡評斷任何一位講員、教會或團體。若碰到被騙錢或屬靈虐待，同樣不追問細節、不要求原諒，會後單獨關心，必要時協助尋求專業或法律協助。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要回頭的那一步是甚麼。"],["p","然後彼此代禱，為三種人指名禱告：一位被講台上的人傷害或被騙過錢、不敢再走進聚會的人；一位離開教會多年、心裡想回來的人；一位剛信主、還沒有站穩的人。"],["p","最後由組長慢慢讀一遍：「主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子」（2:9）。大家回應：主知道搭救，我們回到他面前。"]]},"3":{"no":3,"vol":"《321彼得後書講義》第三課·彼得後書第三章","title":"不是耽延，乃是寬容——記得、等候、長進","chars":4891,"min":60,"deep":8,"dchars":1891,"tchars":1479,"blocks":[["h","一、凌晨一點的接機口"],["p","弟兄姊妹平安。凌晨一點，桃園機場第二航廈的接機口。陳志強弟兄來接從墨爾本回來的女兒。看板上那一班飛機先是「延誤」，半小時後跳成「時間未定」。女兒出國讀書三年，這兩年已經不太去教會，電話裡也常說沒空。志強每兩分鐘看一次錶。旁邊一位先生看了看板，把寫著名字的紙牌折起來塞進口袋，轉身走了。角落裡還有一個人，拿出手機撥了一通電話，志強聽見他說：「我在機場等人，忽然想到你。那件事，是我不對。」"],["p","那一句話像一根刺。志強也有一個三年沒說話的人，就是弟弟志明。三年前的家族聚會上，弟弟當著全家人的面，指出他替父親管的帳有錯。帳確實有錯，可是被當眾說出來的那一刻，他也記下了一筆賬，從此不接弟弟的電話。"],["p","這一課是彼得後書第三章，是寫給接機口的人的。很多人以為這一章是一張末日時間表，翻開來就想找日期。可是請聽彼得的原話：「主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們」（3:9）。他沒有給我們抵達時間，他告訴我們延誤的原因。主的慢，不是遲到，是寬容。"],["p","照書信三問，先問：收信的人遇到甚麼？彼得前書說過「萬物的結局近了」（彼前 4:7），可是一年一年過去，第一代信主的人一個一個睡了，主還沒有來；第二章那些假師傅正好拿這件事做文章：主不會來，就不必交賬，愛怎麼活就怎麼活。第二問，彼得推出甚麼原則？主的慢是寬容，等候的人要活得聖潔。第三問落在今天：群組裡轉來轉去的末日影片，等了多年還沒信主的家人，還有每一個等得很累、開始看錶的人。"],["p","這一章有三個動作：記得、等候、長進。這是一位老人最後的叮嚀。主在海邊對他說過，年老的時候「別人要把你束上，帶你到不願意去的地方」（約 21:18）；照教會的傳統，他後來在羅馬殉道。他知道帳棚快要拆了（1:14），所以這一章每一句，都是他最想留下的話。一個快要離開的人，不會浪費篇幅在不要緊的事上；他留給教會的，是怎樣等。"],["d",["我心裡有時也會冒出「主到底在哪裡」，這是不是表示我已經成了譏誚的人？","不是。譏誚的人和疑惑的人不一樣。彼得形容譏誚的人是「隨從自己的私慾」，又「故意忘記」：他們希望主不要來，所以選擇不記得。一個在苦難裡問「主啊，還要等多久」的人，其實是在向主說話，詩篇裡滿是這樣的禱告，那些都是有信心的人的呼求。問題不在有沒有疑問，在疑問把你帶到哪裡：帶你遠離主，還是帶你回到經文和主面前。實際上，這句話冒出來的時候，可以照 3:1--2 去做：把先知和使徒的話再讀一次，把神在你生命中做過的事一件一件寫下來。信心的一半是記得；另一半，是帶著還沒解開的問題，繼續跟隨主。"]],["h","二、記得與等候：故意忘記的人，還在等的主"],["p","彼得第一句話是：「親愛的弟兄啊，我現在寫給你們的是第二封信。這兩封都是提醒你們，激發你們誠實的心」（3:1）。他不是要給新的資訊，是要人記得：「叫你們記念聖先知預先所說的話和主救主的命令」（3:2）。這一章第一個動詞是記得。等候的時候，人最先丟掉的常常不是盼望，是記性。"],["p","然後是譏誚的人：「主要降臨的應許在哪裡呢？因為從列祖睡了以來，萬物與起初創造的時候仍是一樣。」（3:4）這是那位把紙牌塞進口袋的人的邏輯：一直沒有來，就永遠不會來。彼得說：「他們故意忘記」（3:5），原文的意思是願意讓這件事溜走，不是不知道，是不想記得。譏誚很少從頭腦開始，彼得說他們是「隨從自己的私慾」（3:3）。一個人若希望主不要來，最省事的辦法，就是說服自己主不會來；因為主若來，就得交賬。"],["p","他們忘了甚麼？世界從來不是靠自己穩定的。天和地是「憑神的命」有的；挪亞的時候，「當時的世界被水淹沒就消滅了」（3:6）；「但現在的天地還是憑著那命存留」（3:7）。萬物仍是一樣，從來不是事實。神說話，世界就成；神說話，洪水就來；今天世界還在，也是因為神的話托住它。"],["p","接著是這一章最常被拿去用的一節：「親愛的弟兄啊，有一件事你們不可忘記，就是主看一日如千年，千年如一日。」（3:8）請留意，講到最容易引人焦慮的題目，彼得先叫一聲親愛的。他引的是詩篇：「在你看來，千年如已過的昨日」（詩 90:4）。詩篇只說一個方向，彼得把兩個方向都說了。兩個方向都說，就不能換算。這一節不是遞給你一把算日子的尺，是把尺收走；它叫我們換一個位置，「主看」，站到主那裡看時間。"],["p","從主那裡看，時間是甚麼？就是 3:9：「不願有一人沉淪，乃願人人都悔改。」彼得最有資格寫這一句。他曾經三次不認主，主沒有在那一夜放棄他；主在海邊生了炭火等他，問了他三次「你愛我嗎」。三十多年後，這個被主等過的人寫下：其實不是耽延，乃是寬容。他寫的不是理論，是自己的故事。你今天還能坐在這裡，也是因為主等過你。"],["p","可是下一節馬上說：「但主的日子要像賊來到一樣。」（3:10）寬容不是取消，賊來以前不會發通告。這一句同時擋住兩種錯：擋住「主不會來」的譏誚，也擋住「我知道主哪一天來」的聰明。主耶穌說過：「那日子，那時辰，沒有人知道」（太 24:36）。所以等候的時間不是焦慮的時間，是悔改的時間，是和好的時間，是傳福音的時間。角落裡打電話的那個人，做的正是這件事。"],["d",["主既然這樣寬容，那我是不是可以等以後再悔改、再認真？","寬容是給你悔改的時間，不是給你拖延的空間。保羅也這樣問過：「還是你藐視他豐富的恩慈、寬容、忍耐，不曉得他的恩慈是領你悔改呢？」（羅 2:4）同一個 3:9，緊接著就是 3:10：主的日子要像賊來到一樣。你不知道還有多少時間，也不知道自己的心會不會因為一拖再拖而變硬。主等你，不是因為你的事不重要，是因為你太重要。實際上，可以把「以後」換成「今天」：今天就向主承認那件事，今天就打那一通電話。彼得自己就是在主的寬容裡回頭的人；對主的寬容最好的回應，是不再浪費它。"]],["d",["既然主「不願有一人沉淪」，為甚麼還有人沉淪？神的心意落空了嗎？","這是教會歷代認真討論的題目。阿米念與衛斯理傳統認為這是神普遍的救恩心意，人可以拒絕；改革宗有人把「人人」限在「你們」之中，也有人分辨神的心意與定旨，指出神真實地不喜悅惡人死亡（結 33:11）。不論站在哪一邊，有兩件事都不能丟：第一，神的心意是真實的，不是外交辭令；第二，3:7 的審判也是真實的，不能用 3:9 取消。這一節的工作不是裁決揀選的系統，是回答「為甚麼還沒來」：因為神在等人悔改。不要用系統冷卻這節經文的溫度，倒要讓它推你去為一個人禱告。小組裡若有不同看法，可以彼此尊重，同心為未信的人代禱。"]],["h","三、原文亮光：寬容、催促、被找到"],["p","這一章有三個原文字，每一個都會改變你等候的姿勢。"],["p","第一個原文字：μακροθυμεῖ（makrothymei），「寬容」。這個字由「長」和「怒氣」合成，意思是把怒氣拉得很長。彼得前書講挪亞的日子「神容忍等待」（彼前 3:20），是同一個字族；3:15 的「長久忍耐」，又是同一個字。挪亞的日子神等過，彼得的日子神等過，我們的日子神還在等。志強在接機口等女兒，等得心急；主等一個人回家，等得很長。主的慢，是愛的等。"],["p","第二個原文字：σπεύδοντας（speudontas），3:12 和合本譯作「切切仰望」，原文更常見的意思是催促、使它加快。彼得在聖殿的廊下講過：「你們當悔改歸正，使你們的罪得以塗抹，這樣，那安舒的日子就必從主面前來到」（徒 3:19--20）。神讓他的子民參與他的心意。可是上下文已經定下催促的方法：3:9 的悔改，3:11 的聖潔和敬虔。這不是叫人推算日子，也不是叫人加速日期，用某種工程或某個國際局勢替主排時間表；3:10 的「像賊」仍然管著 3:12。我們能做的催促，是活得像盼望他來的人，並且讓更多人聽見福音。"],["p","第三個原文字：εὑρεθήσεται（heurethēsetai），「必被找到、必被顯露」。3:10 最後一句，和合本照當時通行的抄本譯作「燒盡了」；較早的抄本作這個字，也有編者採「不被發現」的讀法。不論哪一讀，都不是神把他所造的丟掉。照「顯露」來讀，那一日地和其上一切的工都要攤開在神面前，像保羅說的「各人的工程必然顯露」（林前 3:13）。更動人的是 3:14 的「安然見主」，原文用的正是同一個動詞：在平安中被他找到。那一日找我們的，不是批評我們的人，也不是我們的良心，是主自己。"],["p","所以這一章不是丟棄，是更新：「但我們照他的應許，盼望新天新地，有義居在其中。」（3:13）「新」是品質上的新，是更新，不是另換一個；「居」是住下來不走。今天的義在這世界常像寄居的客旅，被擠到角落；那一日，義要安家。等候的人不是坐在接機口發呆，是先讓義在今天住進自己的家裡。"],["d",["我的和合本寫「燒盡了」，原文抄本卻有「被顯露」，那我手上的聖經是不是錯了？","不必慌張。和合本照的是當時通行的抄本，那是歷代教會真實讀過的經文；學者根據較早的抄本，認為「必被顯露」較可能是原貌，也有編者採「不被發現」。抄本的差異都攤開在學者面前，沒有被藏起來，也沒有一處動搖基督信仰的核心。就這一節來說，幾種讀法指向同一件事：那一日，地上一切都要攤在神面前，罪要被了結，神所造的不是被丟棄，是要被更新（3:13）。你可以安心讀手上的和合本，同時知道原文多了一層亮光：那一日一切都要被主看見，我們也要「安然見主」，在平安中被他找到。遇到這類問題，可以向帶領者請教，也可以對照幾本中文譯本一起讀。"]],["h","四、長進：親愛的兄弟、防備、願榮耀歸給他"],["p","講完主的日子，彼得問的不是「哪一天」，是「你們是怎樣的人」：「這一切既然都要如此銷化，你們為人該當怎樣聖潔，怎樣敬虔」（3:11）。永恆的觀點不是叫人離開世界，是叫人在世界裡活得不一樣。等的時候怎樣說話、怎樣用錢、怎樣待家人，都是等候。3:14 說要「沒有玷污，無可指摘，安然見主」，彼得前書用同樣的字形容基督，「無瑕疵、無玷污的羔羊」（彼前 1:19）。我們能安然見主，靠的是羔羊的潔淨，不是自己的成績單。"],["p","然後是全章最安靜的一句：「就如我們所親愛的兄弟保羅，照著所賜給他的智慧寫了信給你們。」（3:15）你記得安提阿那一頓飯嗎？從雅各那裡來的人一到，彼得「就退去與外邦人隔開了」（加 2:12），「甚至連巴拿巴也隨夥裝假」（加 2:13）。帶頭退去的是彼得，被帶走的是巴拿巴。保羅說：「因他有可責之處，我就當面抵擋他。」（加 2:11）那一次的責備寫進了加拉太書，在各地的教會裡被讀。多年以後，彼得在臨終的信裡，稱這個人「我們所親愛的兄弟」，還說他有神所賜的智慧。"],["p","這不是兩位使徒的角力，是兩個被同一份恩典改變的人。等候主來的人，可以不再記賬。不再記賬，不是假裝沒受傷，也不是不設界線，而是把公道交給主。志強想起弟弟的時候，最難的不是承認帳有錯，是放下「他讓我丟臉」那一筆。那一筆，他可以交給那位一定會來、也一定公道的主。"],["p","3:16 接著說，保羅的信「有些難明白的，那無學問、不堅固的人強解」。「強解」原文是把人綁上刑架硬拉，把經文拉到自己要的長度。請注意，彼得沒有說難明白，所以你們不要讀。難明白不等於不能明白；出問題的不是讀的人，是不肯受教、站不穩、硬拉經文的人。保護讀經的方法不是不讀，是在群體中讀、照上下文讀、謙卑地讀。這封信本來就是寫給全會眾讀的。"],["p","最後兩節是彼得的遺言：「你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。」（3:17）「堅固」是主在被賣那一夜交給他的字：「你回頭以後，要堅固你的弟兄。」（路 22:32）他用這個字做了一生的功課，一直做到最後一封信的最後一段。防備之後是長進：「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進。」站得住的人，還要長。最後一句不是叮嚀，是讚美：「願榮耀歸給他，從今直到永遠。阿們！」（3:18）"],["d",["彼得說保羅的信有些難明白，那我讀不懂的經文該怎麼辦？是不是乾脆不要讀？","不是。彼得把這封信寫給全會眾，他自己就期待每一個人讀。他警告的是「無學問、不堅固的人強解」，也就是不肯受教、又要把經文扭到自己要的方向的人。讀不懂時有三個保護。第一，在群體中讀：帶到小組，請教長輩和牧者，彼此印證。第二，照上下文讀：先看前後文在講甚麼，不要單抽一句。第三，謙卑地讀：容許自己暫時不懂，先順服已經讀懂的部分。難懂的經文不是禁區，是邀請你慢下來、和弟兄姊妹一起讀。實際上，可以準備一本小冊子，把讀不懂的地方記下來，帶著禱告慢慢求明白，聖靈會在合適的時候開你的眼睛。"]],["d",["我曾經被人當眾糾正，到現在還很受傷，「不再記賬」是不是要我假裝沒事、照樣跟他來往？","不是。不再記賬，不是假裝沒受傷，也不是不設界線，而是把公道交給主。被當眾說出來的痛是真的，你可以向神說，也可以告訴一位信得過的人。分辨兩種情形：若對方說的是事實，像保羅指出彼得退去那樣，可以先承認自己該承認的部分，再把被羞辱的那一筆交給主；若對方是長期羞辱、控制，甚至傷害你，設立界線、保持距離、尋求協助，並不違背這一節。和好需要時間，也需要雙方；你能先做的，是不在心裡反覆翻那本賬，把審判官的位置讓給那位一定公道的主。彼得在 3:15 沒有替自己辯護，也沒有翻舊帳，他看見的是同一位主給保羅的智慧。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用 3:8 算日子：把「一日如千年」當成換算表，拿來定創造的年代，或排出主再來的年份。彼得兩個方向都說，正是要取消換算；主耶穌也說：「父憑著自己的權柄所定的時候、日期，不是你們可以知道的。」（徒 1:7）算對了不叫信心，算錯了卻會絆倒人。"],["p","第二個偏差，是用 3:12 推算日期，或以為人可以加速日期，用某種條件、某個工程、某種國際局勢把主催來，這都不是 3:12 的意思。催促的方法上下文已經定了：悔改、聖潔、敬虔；我們參與的是神的心意，不是掌握神的時間表。"],["p","第三個偏差，是說地球反正燒掉，所以不必照顧受造界，這是錯的。無論 3:10 讀「燒盡」還是「顯露」，3:13 都說新天新地是更新；神把人安置在園子裡，「使他修理，看守」（創 2:15），這個託付沒有收回。照顧受造界是管家的本分，不是政治動員，也不能拿末日當浪費的藉口。"],["p","第四個偏差，是因延遲而冷淡，或因末日而恐慌。前一種像接機口轉身走的人，心想反正還早，慢慢再說；後一種一看新聞就心驚膽戰，囤貨、失眠、不敢計畫將來。3:9 對前者說：寬容是給你悔改的時間，不是拖延的空間。3:14 對後者說：安然見主。果效是忍耐，不是恐慌。"],["p","第五個偏差，是用 3:16 說難懂的經文不要自己讀，甚至說只有牧師才能解經，這是講錯了。「難明白」不是不可明白，出問題的是不肯受教的人強解。保護讀經的方法不是不讀，是在群體中、照上下文、謙卑地讀。"],["d",["教會講照顧受造界，會不會變成社會福音，或者被帶去某一個政治立場？","這是合理的擔心。照顧受造界的根據不在任何政治立場，而在創造：神把人放在園子裡「使他修理，看守」（創 2:15），人是管家，不是主人。3:13 說新天新地是更新，羅馬書也說「受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀」（羅 8:21），所以我們今天怎樣對待神所造的，是信仰的一部分。界線也要清楚：福音的中心是基督為罪人死而復活，照顧受造界是福音的果子，不是福音的替代；講台不替政黨背書，弟兄姊妹在具體政策上可以有不同看法。實際上從小事做起：不浪費一餐飯、不隨手污染、帶著感恩使用，向造物主表達敬畏。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：家族群組裡，有人轉來一段影片，說根據某些經文和天象，主再來的年月日已經揭曉，請大家趕快轉傳。不轉傳，也不在群組裡嘲笑轉傳的人，他多半是出於愛主，或出於害怕。可以私下回他一句：主說那日子沒有人知道，彼得說主的日子像賊來到；我們一起把等的時間用在悔改和愛人上。過去公開宣布過的日期一個一個過去，每一次都有人賣了房子、辭了工作，也有人從此不再信主。分辨不是去揭發誰，是不讓恐慌代替信心，也不讓轉傳代替禱告。"],["p","第二個問題：飯桌上兩代人吵起來。長輩說，這個世界將來都要燒掉，管環境是不屬靈的事；孩子卻因為氣候新聞焦慮得睡不著，不敢計畫將來。3:13 對兩代人都說話。對長輩說：神要更新的是他所造的，照顧它是管家的本分。對孩子說：世界的結局不是在人手裡崩潰，是在神手裡更新，「有義居在其中」。若孩子的焦慮已經長期影響睡眠和生活，除了陪他禱告，也要陪他尋求專業協助。"],["h","七、活出321——等候的時間交給王"],["p","先讓經文講完：神的話創造、審判、也托住這世界；主的慢是寬容；主的日子像賊來到；新天新地有義居在其中；等候的人防備、長進，把榮耀歸給他。然後我們才把 321 接上去。"],["p","耶穌是我的榜樣：3:9 的寬容，就是主在海邊等彼得的那份寬容。我等候還沒信主的家人，學他的忍耐，不催逼，也不放棄。"],["p","聖經是我的準則：3:2 叫我記念先知和使徒的話，3:16 提醒我不要強解。我的末日觀不從群組影片來，也不從新聞標題來，是從聖經來。"],["p","聖靈是我的引導：3:18 的長進不是咬牙苦撐，是聖靈在恩典裡使人長；用心靠聖靈，不要用腦靠自己去算日子。"],["p","讓耶穌作王：日子由他定，我只管忠心；我的時間表、我的賬本、我對待受造界的方式，都交給他作王。"],["p","讓耶穌得著一切的榮耀：彼得最後一句話不是講自己，是「願榮耀歸給他」。一個人等候得對不對，看他最後把榮耀歸給誰就知道了。"],["p","建立屬神的體系：3:15 糾正人的和被糾正的，在同一個身體裡彼此稱為親愛的；無己才能合一，合一才能一同等候。空中團契散在各國，有人醒著時有人睡著，線上的代禱和彼此提醒，就是不同時區的人輪流守在接機口，一起等同一位主。"],["h","八、四種心，在接機口的四種等法"],["p","驕傲型的心，想要掌握時間表：不是算日子，就是譏誚。3:8 說的是「主看」，不是我看。讓神作神，讓人作人；日子交給神，忠心留給自己。"],["p","恐懼型的心，一聽末日就慌，一看新聞就怕。3:9 說主不願有一人沉淪，3:14 說安然見主；站在羔羊的潔淨裡，被他找到是平安，不是驚嚇。"],["p","羞恥型的心，覺得自己太髒，最好主不要來。找你的那一位，就是在海邊生了炭火等過彼得的主；他等你，不是為了羞辱你，是為了接你回家。"],["p","受傷型的心，等得太久了：禱告多年沒有答案，或親人沒等到信主就走了。主不輕看你的眼淚，3:9 告訴你，主的心從來不是冷的。我們不替神斷定任何一位離世之人的去處，把他交在那位公義又慈愛的主手裡。這份傷，會後可以找一位同工單獨談。"],["d",["我的親人沒有信主就過世了，讀到「不願有一人沉淪」，我心裡很痛，該怎麼面對？","先說一句：我很遺憾，你的痛是真的，主不輕看。我們不斷定任何一位離世之人的去處，因為我們不知道他最後的日子裡，神怎樣向他說話，他心裡又怎樣回應；我們只知道那位審判的主是公義的，也是慈愛的。亞伯拉罕說：「審判全地的主豈不行公義嗎？」（創 18:25）你可以把這個名字和這份不知道，一起交在這位主手裡，不需要在自責或猜測裡反覆折磨自己。3:9 也告訴你，神的心從來不是冷的，他和你一樣不願意人沉淪。若這份哀傷已經很久，影響睡眠、工作或生活，請讓牧者或同工陪你，必要時一起尋求專業的哀傷輔導。"]],["h","九、這一週，你可以做的幾件事"],["p","以下五件事，請在散會以前寫下時間、地點和名字。"],["p","第一，每天早上讀一遍 3:9，把一位還沒信主的人的名字放進去，為他禱告一分鐘。"],["p","第二，用等的時間打一通和好的電話，或寫一段訊息，像接機口角落那個人一樣，說一句「那件事是我不對」。"],["p","第三，做一件照顧受造界的小事：不浪費一餐飯、隨手關燈、把垃圾分好，不為口號，只為管家的本分。"],["p","第四，群組裡再收到末日日期的訊息，不轉傳，私下回一句 3:10「像賊來到」。"],["p","第五，每晚睡前寫下一件今天在恩典和知識上長進的事，然後說一句：願榮耀歸給他。"],["p","然後我們一起開口說出四句話。"],["p","我宣告：主不是耽延，乃是寬容，他不願有一人沉淪。"],["p","我宣告：日子由主定，我不算日子，我只管忠心等候。"],["p","我宣告：我照他的應許，盼望新天新地，有義居在其中。"],["p","我宣告：我要在主耶穌基督的恩典和知識上有長進，願榮耀歸給他。"],["h","十、結語"],["p","我們回到凌晨一點的接機口。看板還寫著時間未定的時候，志強拿出手機，給弟弟錄了一段語音：「弟，那年的帳是我錯了。我想你。」第二天早上，弟弟回了一句：「哥，我也是。」凌晨三點，女兒終於推著行李出來。志強沒有說怎麼這麼晚，只是抱住她。上車以後女兒問：「爸，你等很久了吧？」他想起 3:9，說：「不久。」"],["p","可是這一課的焦點，不在志強打了那一通電話，也不在彼得多了不起。焦點在那一位長久忍耐的主：他等過一個三次不認他的人，等過在安提阿退去的人，也等過我們。他的慢不是耽延，是寬容；他一定會來，那一日我們要在平安中被他找到。不要只佩服彼得，要更愛彼得的主。"],["p","我們一起低頭禱告。天父，謝謝你不是耽延，乃是寬容；謝謝你等過彼得，也等過我們。赦免我們有時候故意忘記，有時候想替你算日子，有時候因為等得太久而冷淡，也赦免我們心裡還記著別人的賬。求你讓我們把公道交給你，用等候的時間去和好、去愛人、去傳福音；求你堅固我們，叫我們在主耶穌基督的恩典和知識上有長進。願榮耀歸給你，從今直到永遠。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["p","這一個鐘頭不比誰知道主哪一天來，也不比誰等得最久，是讓每一個人說出一件正在等的事、一筆要交給主的賬，和這一週要用等的時間做的一件事；以下三個化，請組長照著次序帶。"],["m","帶領說明：本課主軸是記得、等候、長進。席上可能有等家人信主多年的人、親人沒有信主就過世的人、被人當眾糾正而受傷的人，也可能有正為末日訊息焦慮的人，請先讀第二化的帶領提醒。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化｜內化成為觀念（約20分鐘）"],["m","目的：讓組員講得出三個觀念：主的慢不是耽延，是寬容；3:8 兩個方向都說，是取消換算，不是算日子的公式；等候的人先防備，再長進，最後把榮耀歸給他。"],["n","1. ★ 你最近一次在機場、醫院或銀行等很久，是甚麼時候？那時你是一直看錶、轉身走掉，還是做了別的事？"],["n","2. ★★★ 「耽延」和「寬容」有甚麼不一樣？請用 3:9 和「寬容」這個字的原意，用一句話說出來。"],["n","3. ★★ 3:8 為甚麼要兩個方向都說「一日如千年，千年如一日」？這兩個方向放在一起，怎樣把算日子的尺收走？"],["n","4. ★★ 讀 3:15，被保羅當面抵擋過的彼得，稱他「我們所親愛的兄弟」。這一句對你看「被人糾正」這件事，有甚麼改變？"],["m","帶領提醒：讀經時從 3:1 一口氣讀到 3:18，不要停在 3:10 的火，一定讀到 3:13 新天新地和 3:18 願榮耀歸給他；有人想討論末日的年份，溫和地帶回 3:8 的兩個方向和 3:10 的像賊。"],["s","第二化｜消化成為生命（約35分鐘·本課主軸）"],["m","目的：讓每一個人說出一件正在等的事，從「其實不是耽延，乃是寬容你們」出發，看見主怎樣等過自己，並說出這一週要交給主的一筆賬。"],["t","【看】看見自己"],["n","5. ★★★ 說出這一陣子你正在等的一件事：家人信主、禱告的答案、一段關係的和好，還是主的再來？你等了多久？最近一次最想放棄是哪一天？"],["t","【聽】聽神說話"],["n","6. ★★ 請慢慢讀 3:9 兩遍，第二遍把「你們」換成你自己的名字。讀完說一句：主怎樣等過你？"],["t","【想】想通關卡"],["n","7. ★★★ 你在等候裡最難的是哪一個：覺得主遲到了、心慢慢冷了、一看新聞就怕，還是心裡還記著一個人的賬？選一個說出來。"],["t","【講】說出口"],["n","8. ★★ 請對組裡的人說：「主不是耽延，乃是寬容；他也這樣等過我。」右手邊的人只回一句「你會在平安中被他找到」，不給建議。"],["t","【行】走一步"],["n","9. ★★★ 寫下這一週你要用等的時間做的一件事：打給誰、和誰和好、為誰禱告？星期幾、在哪裡，第一句話怎麼說？"],["m","帶領提醒：這一化可能碰到親人沒有信主就過世、長期禱告沒有答案、被人當眾糾正或羞辱的傷，以及對末日的恐慌；不追問細節，不要求原諒，不對正在流淚的人說「你要有信心」；不斷定任何亡者的去處；講到和好時，不要求受傷的人放下界線。會後單獨關心，必要時協助尋求專業協助。第七題之後請留三十秒安靜。"],["s","第三化｜轉化成為生活（約25分鐘）"],["m","目的：把這一課搬進行事曆：一通和好的電話、一次對末日訊息的溫和回應、一件照顧受造界的小事、一位要帶的人。"],["n","10. ★★ 群組裡若收到「主再來年月日」的訊息，你會私下怎樣回？把那一句寫下來，唸給組員聽。"],["n","11. ★ 這一週，在家裡或辦公室，你可以做哪一件照顧受造界的小事？說出地點和時間。"],["n","12. ★★ 有沒有一個你一直記他賬的人？這一週哪一天，你要為他禱告，或為他做一件小事？"],["n","13. ★★★ 這是本課的 920 操練：找出你的那一個「2」，一位還沒信主或正在冷淡的人。當場說出他的名字，說出這一週哪一天你要向他分享：主不是耽延，乃是寬容，他不願有一人沉淪。"],["n","14. ★★★ 【必做】繁殖任務：用三句話把這一課講給一位教會外的朋友聽。第一句，很多人說神如果在，為甚麼世界還是這樣。第二句，聖經說神的慢不是遲到，是在等人回頭，因為他不願有一人沉淪。第三句，所以等的時間不是用來害怕，是用來和好、愛人，我也正在學。這一週講給一個人，下次回來說他的反應。"],["m","帶領提醒：要具體到時間、地點、人名，不收「我會多忍耐」這類答案；正在等家人信主、或剛失去家人的組員，先問小組能替他做甚麼，不再加擔子。"],["s","收尾（5分鐘）"],["p","請每一個人用一句話說：這一週我要用等的時間做的是哪一件事，要交給主的是哪一筆賬。可以只說「一件事」，不必說內容。"],["p","然後彼此代禱，為三種人指名禱告：一位等家人信主多年的人；一位心裡還記著一筆賬、很難放下的人；一位被末日訊息嚇得睡不著的人，求主讓他們知道主的慢是寬容。"],["p","最後全組一起讀 3:18：「你們卻要在我們主－救主耶穌基督的恩典和知識上有長進。願榮耀歸給他，從今直到永遠。阿們！」"]]}}}</script>

    /* 五步驟：{k} 是「看」「聽」「想」「講」「行」，{t} 是內容 */
    step: [

      '接下來我們「{k}」。{t}',
      '「{k}」這一步：{t}',
      '先來「{k}」。{t}',
      '我們「{k}」。{t}'

    /* 收尾 */
    wrap: [

      '讓我們把這一段收在一起。'
    ],
    /* 表格：畫面上是表，耳朵裡是一段話 */
    table: [

      '接下來這一段本來是一張表，我把它讀成一段話。',
      '這一段我整理成了表格，用聽的是這樣。',
      '底下是一張對照表，我一列一列說。'

    list: [
      '這裡有幾點。',

    ],

     * ------------------------------------------------------------- */

    /* 開始：{t} 是這一課的名字 */
    start: [
      '我們一起來讀{t}。',
      '{t}。我們開始。',
      '來，我們讀{t}。',
      '我們從{t}開始。',
      '{t}，我們一起聽。'
    ],
    /* 開始，可是不知道叫什麼名字 */
    startBare: [
      '我們開始。',
      '來，我們一起來讀。',
      '我們一起來讀這一段。',
      '好，我們開始讀。'
    ],
    /* 指定從第幾段開始：{n} 段序，{t} 標題 */
    startAt: [
      '我們從第{n}段開始，{t}。',
      '這一次從第{n}段起，{t}。',
      '我們直接來到第{n}段，{t}。',
      '從第{n}段讀起。{t}。',
      '我們從第{n}段往下讀，{t}。'
    ],
    /* 指定從第幾段開始，可是那一段沒有標題 */
    startAtBare: [
      '我們從第{n}段開始。',
      '這一次從第{n}段起。',
      '我們直接來到第{n}段。',
      '從第{n}段讀起。'
    ],
    /* 接著上次停的地方：{n} 段序 */
    resume: [
      '我們接著上次停的地方，從第{n}段繼續。',
      '上一次讀到第{n}段，我們從那裡接下去。',
      '我們回到第{n}段，接著往下讀。',
      '接著剛才停下來的地方，第{n}段。',
      '我們從第{n}段再往下走。'
    ],
    /* 暫停 */
    pause: [
      '我們先停在這裡。',
      '先停一下。',
      '到這裡先歇一口氣。',
      '我們暫時停在這裡。'
    ],
    /* 停止 */
    stop: [
      '今天先讀到這裡。',
      '我們就讀到這裡。',
      '這一段先停在這裡。',
      '好，我們先到這裡。'
    ]
  };

  /* 表格與條列讀出來的零件。
   *
   * 這一組本來寫死在程式裡，英文版於是唸成
   * 「What follows was laid out as a table. 先看「x」，y。」——
   * 一半英文一半中文，而且所有測試都過，因為沒有人驗長相。
   *
   * 凡是會被唸出來或看到的字，一律要能換掉。 */
  var W = {
    rowFirst: ['先看', '我們先看', '第一個'],
    rowMid: ['再看', '接著', '然後', '再來', '接下來'],
    rowLast: ['最後'],
    cols: '這張表有{n}欄：{list}。',
    row2: '{link}「{label}」，{value}。',      // 兩欄表
    rowN: '{link}「{label}」：{parts}。',      // 三欄以上
    pair: '{col}是{value}',
    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，
       塞進去的數字還是中文，而且每一項測試都過，因為沒有人驗長相。 */
    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——
     這兩個模組不互相依賴，要能單獨掛。 */
  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *
   * 各種帶入詞不可以同步：如果每一種都用 i % n，那麼第 0 個分段配第 0 個
   * 題目、第 1 個分段配第 1 個題目，整課的節奏會出現一種說不上來的規律感。
   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;
    return h;
  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {
    if (typeof n !== 'number') return n == null ? '' : String(n);
    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });
  }

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {
    return fill(pick('step', i), { k: key, t: String(body == null ? '' : body) });
  }

  function deeper(q, i) { return pick('deeper', i) + String(q == null ? '' : q); }
  function deeperAnswer(i) { return pick('deeperAnswer', i); }
  function wrap(i) { return pick('wrap', i); }

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），
   * 這四種沒有——所以慣例是：
   *
   *   · 開始／接續：傳 0（種子已經一課一換，整課的第一句自然就不一樣）
   *   · 暫停／停止：傳「這一課按了第幾次」，同一課連按兩次才不會一樣
   *
   * 標題末尾的句號要去掉，不然會唸成「創世記第一章。。我們開始」。
   * ------------------------------------------------------------------- */

    return fill(pick('start', i), { t: t });

    return fill(pick('startAt', i), v);

   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {
        p.push(lines[i]); i++;
      }
      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });

  function inlineHTML(t) {

      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')

      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {

        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {

      }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
         十點全部報數，聽的人會累。 */
      var ww = w();
      var head = j < 2 ? fill(ww.itemFirst, { n: num(j + 1) })
               : (j === b.items.length - 1 ? ww.itemLast
                  : fill(pick('item', i + j), { n: num(j + 1) }));
      out.push(head + t + (/[。！？.!?]$/.test(t) ? '' : ww.end));
    }
    return out.join('');
  }

  /* 整段 Markdown → 適合唸出來的純文字。
     opt.drop：一個 fn(text)->text，唸之前還要拿掉的東西
     （例如括號裡的經文出處：REF321.dropParenRefs）。 */
  function speech(md, opt) {
    opt = opt || {};
    var bs = blocks(md), out = [], i, b, t;
    var base = opt.i || 0;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'table') { out.push(tableSpeech(b, base + i)); continue; }
      if (b.k === 'list') { out.push(listSpeech(b, base + i)); continue; }
      if (b.k === 'h') {
        t = inlineText(b.t);
        /* 「一、神的呼召」這種本身帶序號的標題，序號交給模板去說 */
        var m = t.match(/^([一二三四五六七八九十\d]+)[、．.]\s*(.+)$/);
        out.push(m ? section(m[2], m[1], base + i) : section(t, null, base + i));
        continue;
      }
      if (b.k === 'quote') {
        out.push(pick('quote', base + i) + inlineText(b.t));
        continue;
      }
      t = inlineText(b.t);
      /* 已經有句末標點的不補。冒號、分號、頓號也算——
         「三個立場：」後面接一張表，補成「三個立場：。」很難聽。 */
      if (t) out.push(t + (/[。！？；：、，,.:;!?」』）)]$/.test(t) ? '' : '。'));
    }
    var s = out.join('\n');
    if (opt.drop) { try { s = opt.drop(s); } catch (e) {} }
    return s;
  }

  /* ── 掛上 ─────────────────────────────────────────────────────────── */

  function init(c) {
    C = ext(ext({}, DEF), c || {});
    /* words 給了就跟預設合併——英文版只想換幾個零件時不必整組重寫 */
    C.words = ext(ext({}, W), (c && c.words) || {});
    if (c && c.templates) {
      for (var k in c.templates) {
        if (c.templates.hasOwnProperty(k)) T[k] = c.templates[k];
      }
    }
    return API;
  }

  var API = {
    init: init,
    lead: lead, section: section, numbered: numbered, step: step,
    deeper: deeper, deeperAnswer: deeperAnswer, wrap: wrap,
    start: start, startAt: startAt, resume: resume, pause: pause, stop: halt,
    html: html, speech: speech,
    blocks: blocks, cn: cn, num: num,
    templates: T,
    setSeed: function (n) { cfg().seed = n | 0; },
    version: '1.1.0'
  };
  return API;
})();

var SAGE321 = (function () {

  /* v2.0.0（2026-10）：從《321互動聖經》v2.18 移植回核心——
   *   · sysExtra：回答對象／回答長度接在 App 的人設後面
   *   · followups：最新一則成功的回答底下出現追問鈕，一鍵替使用者送出
   *   · 回答被截斷（stop_reason＝max_tokens／length）就自動接著寫完，最多再接 4 次
   *   · 新回答進來時把較早的長回答收起來，頂列「收合」一次收合全部；
   *     展開／收合只改那一則的 class，不重畫整個對話，才不會打斷朗讀
   *   · 每則回答多了「分享」與「做成美圖」
   *   · reask()：切換回答長度時，用新長度把最後一個問題重新回答（取代、不疊加）
   */
  var DEF = {
    worker: '',
    model: 'claude-sonnet-4-6',
    maxTokens: 1600,
    history: 12,
    timeoutMs: 60000,
    longChars: 240,
    maxCont: 4,
    el: 'xz',
    name: '小智',
    emoji: '✨',
    tagline: '陪讀 · 解經 · 禱告',
    hello: '',
    system: null,
    sysExtra: null,        // fn() -> 接在系統提示後面（回答對象、長度）
    quicks: null,
    followups: null,       // fn() -> [[圖示, 短標, 完整追問句], …]
    controls: null,        // fn() -> html（頂列下方的設定列，由 App 畫）
    store: null,
    chapter: null,
    rich: true,
    speechClean: null,
    linkify: null,
    onSpeak: null,
    onCard: null,          // fn(text, question)
    onShare: null,         // fn(text, question)；沒給就用 navigator.share／剪貼簿
    shareTail: '',
    toast: null,
    onChange: null,
    labels: {
      hello: '陪你讀經的小幫手。',
      caveat: '我不是聖靈，也不能代替你的牧者——有疑問，還是要回到聖經，並找真實的屬靈同伴談。',
      placeholder: '問小智…', send: '送出', clear: '清空', close: '✕',
      thinking: '正在想…',
      more: '展開全文 ▾', less: '收合 ▴',
      speak: '🔊', save: '☆ 收藏', saved: '★ 已收藏', del: '刪除',
      share: '↗ 分享', card: '🖼 美圖', copied: '已複製，可以貼上分享',
      foldAll: '收合', foldedAll: '已收合所有長回答', foldNone: '目前沒有需要收合的回答',
      cont: '小智還在接著寫…', contAsk: '請從中斷的地方直接接著寫完，不要重複前面已經寫過的內容，也不要加開場白。',
      fuT: '追問：',
      didSave: '已加入收藏', didUnsave: '已取消收藏', didDel: '已刪除',
      offline: '目前沒有網路，小智暫時陪不了你。',
      slow: '小智等候得有點久，先暫停一下。',
      down: '小智暫時連不上線，請稍後再試。',
      comfort: '別忘了——最好的同伴是聖靈與神的話，你隨時可以直接向主傾心吐意。',
      empty: '小智一時想不出合適的話，但神的話永不落空。要不要換個方式再問一次？',
      exportTitle: '# 小智收藏', exportFile: 'sage-saved.md'
    }
  };

  var C = null;
  var XZ = { open: false, msgs: [], busy: false };

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function escA(s) {
    return String(s == null ? '' : s).replace(/'/g, '&#39;').replace(/"/g, '&quot;')
      .replace(/\n/g, ' ').slice(0, 300);
  }
  function L(k) { return (C && C.labels && C.labels[k]) || DEF.labels[k] || ''; }
  function toast(m) { if (C && C.toast) C.toast(m); }
  function saved() { return (C.store && C.store.get && C.store.get()) || []; }
  function keep() { if (C.store && C.store.save) C.store.save(); if (C.onChange) C.onChange(); }
  function link(html) {
    if (!C.linkify) return html;
    try { return C.linkify(html); } catch (e) { return html; }
  }
  function nl(text) { return esc(text).split('\n').join('<br>'); }
  function body(text) {
    if (C.rich !== false && typeof NAR321 !== 'undefined' && NAR321.html) {
      try { return NAR321.html(text); } catch (e) {}
    }
    return nl(text);
  }
  function toSpeech(text) {
    var t = String(text == null ? '' : text);
    if (typeof NAR321 !== 'undefined' && NAR321.speech) {
      try { t = NAR321.speech(t); } catch (e) {}
    }
    if (C.speechClean) { try { t = C.speechClean(t); } catch (e) {} }
    return t;
  }
  function plainOf(text) {
    if (typeof NAR321 !== 'undefined' && NAR321.text) {
      try { return NAR321.text(text); } catch (e) {}
    }
    return String(text || '').replace(/^#{1,6}\s+/gm, '').replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/^>\s?/gm, '').replace(/^\s*[-*]\s+/gm, '・').replace(/\|/g, ' ');
  }
  function isLong(m) {
    return !!(m && m.role === 'assistant' && !m.cont && String(m.text || '').length > C.longChars);
  }
  function qOf(i) {
    for (var p = i - 1; p >= 0; p--) if (XZ.msgs[p].role === 'user') return XZ.msgs[p].text;
    return '';
  }

  /* ── 送出與接收 ───────────────────────────────────────────────── */

  function open() { XZ.open = true; draw(); }
  function close() {
    XZ.open = false;
    var el = document.getElementById(C.el);
    if (el) el.className = el.className.replace(/\bon\b/g, '').replace(/\s+/g, ' ');
  }
  function push(role, text, extra) {
    var m = { role: role, text: text };
    if (extra) ext(m, extra);
    XZ.msgs.push(m);
    return m;
  }

  function send(text) {
    var t = text;
    if (t == null) {
      var i = document.getElementById('xzin');
      t = (i && i.value) || '';
      if (i) i.value = '';
    }
    t = String(t).replace(/^\s+|\s+$/g, '');
    if (!t || XZ.busy) return;
    XZ.open = true;
    push('user', t);
    draw(); call();
  }
  function pick(q) { send(q); }

  function ask(quote, note, tmpl) {
    XZ.open = true;
    var q = (tmpl || C.askTemplate || function (s, n) {
      return '我讀到這一句：\n「' + s + '」\n' + (n ? n + '\n' : '') +
             '請幫我更明白這句話，並幫助我活出來。';
    })(String(quote || '').slice(0, 300), note || '');
    if (XZ.busy) { draw(); return; }
    push('user', q);
    draw(); call();
  }

  /* 切換回答長度：把最後一組問答拿掉，用同一個問題重新問一次 */
  function reask() {
    if (XZ.busy) return false;
    var ui = -1, i;
    for (i = XZ.msgs.length - 1; i >= 0; i--) if (XZ.msgs[i].role === 'user') { ui = i; break; }
    if (ui < 0 || ui === XZ.msgs.length - 1) return false;
    var q = XZ.msgs[ui].text;
    XZ.msgs.splice(ui);
    push('user', q);
    draw(); call();
    return true;
  }

  function truncated(text, stop) {
    if (stop === 'max_tokens' || stop === 'length') return 'sure';
    if (stop) return '';
    var x = String(text || '').replace(/\s+$/, '');
    if (x.length < 280) return '';
    if (/[。！？.!?」』）)”"…~|]$/.test(x) || /(阿們|阿门|amen\.?)$/i.test(x)) return '';
    return 'guess';
  }
  function join(acc, piece) {
    piece = String(piece || '').replace(/^\s*(好的|好|OK|Okay|Sure)[，,。.!！]?\s*/i, '');
    var max = Math.min(40, acc.length, piece.length), k;
    for (k = max; k >= 4; k--) {
      if (acc.slice(-k) === piece.slice(0, k)) { piece = piece.slice(k); break; }
    }
    var head = piece.replace(/^\s+/, '');
    if (/^(#{1,6} |>|---)/.test(head)) return acc.replace(/\s+$/, '') + '\n\n' + head;
    if (/^([-*] |\d+[.)] |\|)/.test(head)) return acc.replace(/\s+$/, '') + '\n' + head;
    return acc + piece;
  }

  function post(sys, msgs, cb) {
    var ctrl = null, timer = null, done = false;
    try { if (window.AbortController) ctrl = new AbortController(); } catch (e) {}
    if (ctrl) timer = setTimeout(function () { try { ctrl.abort(); } catch (e) {} }, C.timeoutMs);
    function fin(out, why, stop) {
      if (done) return; done = true;
      if (timer) clearTimeout(timer);
      cb(out, why, stop);
    }
    fetch(C.worker, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      signal: ctrl ? ctrl.signal : undefined,
      body: JSON.stringify({ model: C.model, max_tokens: C.maxTokens, system: sys, messages: msgs })
    }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (data) {
      var t = '';
      if (data && data.content && data.content.length) {
        t = data.content.filter(function (b) { return !b.type || b.type === 'text'; })
          .map(function (b) { return b.text || ''; }).join('\n');
      } else if (data) {
        t = data.reply || data.text || data.message ||
          (data.choices && data.choices[0] && data.choices[0].message ? data.choices[0].message.content : '') || '';
      }
      var stop = (data && (data.stop_reason || data.finish_reason ||
        (data.choices && data.choices[0] && data.choices[0].finish_reason))) || '';
      fin(String(t).replace(/^\s+|\s+$/g, ''), '', stop);
    })['catch'](function (e) {
      fin('', (e && e.name === 'AbortError') ? 'slow' : 'down', '');
    });
  }

  function foldOld() {
    var last = -1, i;
    for (i = 0; i < XZ.msgs.length; i++) if (XZ.msgs[i].role === 'assistant') last = i;
    for (i = 0; i < XZ.msgs.length; i++) {
      var m = XZ.msgs[i];
      if (isLong(m)) m.col = (i !== last);
    }
  }

  function call() {
    XZ.busy = true; draw();
    var off = false;
    try { off = (navigator.onLine === false); } catch (e) {}
    if (off) {
      push('assistant', L('offline') + '\n' + L('comfort'));
      XZ.busy = false; return draw();
    }
    var hist = [], i, src = XZ.msgs.slice(-C.history);
    for (i = 0; i < src.length; i++) {
      if (src[i].cont) continue;
      hist.push({ role: src[i].role, content: src[i].text });
    }
    while (hist.length && hist[0].role !== 'user') hist.shift();
    var sys = (C.system ? C.system() : '');
    if (C.sysExtra) { try { sys += C.sysExtra() || ''; } catch (e) {} }
    var m = null, n = 0;

    function finish(acc, why) {
      if (m) XZ.msgs.splice(XZ.msgs.indexOf(m), 1);
      if (acc) push('assistant', acc, { ok: true });
      else push('assistant', (why === 'slow' ? L('slow') : (why ? L('down') : L('empty'))) + '\n' + L('comfort'));
      XZ.busy = false;
      foldOld();
      draw();
    }
    function step(acc, why, stop) {
      if (!acc) return finish('', why);
      var tr = truncated(acc, stop);
      if (!tr || n >= (tr === 'sure' ? C.maxCont : 1)) return finish(acc, '');
      n++;
      if (!m) m = push('assistant', acc, { cont: true }); else m.text = acc;
      draw();
      post(sys, hist.concat([{ role: 'assistant', content: acc }, { role: 'user', content: L('contAsk') }]),
        function (out, w2, st2) {
          if (!out) return finish(acc, '');
          step(join(acc, out), '', st2);
        });
    }
    post(sys, hist, function (out, why, stop) { step(out, why, stop); });
  }

  /* ── 收藏、刪除、分享 ─────────────────────────────────────────── */

  function savedIdx(i) {
    var a = XZ.msgs[i];
    if (!a) return -1;
    var arr = saved(), j;
    for (j = 0; j < arr.length; j++) if (arr[j].a === a.text) return j;
    return -1;
  }
  function star(i) {
    var a = XZ.msgs[i];
    if (!a) return;
    var arr = saved(), k = savedIdx(i);
    if (k >= 0) {
      arr.splice(k, 1); keep(); draw();
      return toast(L('didUnsave'));
    }
    arr.unshift({
      q: qOf(i), a: a.text,
      ch: (C.chapter ? C.chapter() : 0) || 0,
      at: (new Date()).getTime()
    });
    keep(); draw(); toast(L('didSave'));
  }
  function drop(i) {
    XZ.msgs.splice(i, 1);
    if (i > 0 && XZ.msgs[i - 1] && XZ.msgs[i - 1].role === 'user') XZ.msgs.splice(i - 1, 1);
    draw(); toast(L('didDel'));
  }
  function unstar(i) {
    var arr = saved();
    arr.splice(i, 1); keep();
    toast(L('didDel'));
  }
  function share(i) {
    var m = XZ.msgs[i]; if (!m) return;
    var q = qOf(i);
    if (C.onShare) return C.onShare(m.text, q);
    var t = (q ? q + '\n\n' : '') + plainOf(m.text) + (C.shareTail ? '\n\n' + C.shareTail : '');
    try {
      if (navigator.share) { navigator.share({ text: t })['catch'](function () {}); return; }
    } catch (e) {}
    try {
      navigator.clipboard.writeText(t).then(function () { toast(L('copied')); }, function () {});
    } catch (e) {}
  }
  function card(i) {
    var m = XZ.msgs[i]; if (!m || !C.onCard) return;
    C.onCard(m.text, qOf(i));
  }
  function exportMd(opt) {
    opt = opt || {};
    var arr = saved(), t = (opt.title || L('exportTitle')) + '\n\n', i;
    for (i = 0; i < arr.length; i++) {
      var x = arr[i];
      t += '## ' + new Date(x.at).toLocaleDateString() +
           (x.ch ? '　' + (opt.chapterLabel ? opt.chapterLabel(x.ch) : '第 ' + x.ch + ' 章') : '') + '\n\n';
      if (x.q) t += '**Q:** ' + x.q + '\n\n';
      t += x.a + '\n\n---\n\n';
    }
    try {
      var b = new Blob([t], { type: 'text/markdown' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(b);
      a.download = opt.file || L('exportFile');
      a.click();
    } catch (e) {}
    return t;
  }

  /* ── 面板 ─────────────────────────────────────────────────────── */

  function fuHtml(m, i) {
    if (!C.followups || m.role !== 'assistant' || !m.ok || m.cont || XZ.busy || i !== XZ.msgs.length - 1) return '';
    var l = [];
    try { l = C.followups() || []; } catch (e) { l = []; }
    if (!l.length) return '';
    var h = '<div class="xzfu"><span class="xzfut">' + esc(L('fuT')) + '</span>', k;
    for (k = 0; k < l.length; k++) {
      h += '<button class="xzfuc" onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' +
        esc(l[k][2]) + '">' + esc(l[k][0] + ' ' + l[k][1]) + '</button>';
    }
    return h + '</div>';
  }

  function bubble(m, i) {
    if (m.role !== 'assistant') {
      return '<div class="xzm user">' + nl(m.text) + '</div>';
    }
    if (m.cont) {
      return '<div class="xzm assistant" id="xzm' + i + '"><div class="xzt">' + link(body(m.text)) + '</div>' +
        '<div class="xzcont">' + esc(L('cont')) + '</div></div>';
    }
    var long = isLong(m);
    var col = long && m.col !== false;
    var sav = savedIdx(i) >= 0;
    return '<div class="xzm assistant" id="xzm' + i + '">' +
      '<div class="xzt ' + (col ? 'clip' : '') + '">' + link(body(m.text)) + '</div>' +
      (long ? '<button class="xzmore" onclick="SAGE321.fold(' + i + ')">' +
        esc(col ? L('more') : L('less')) + '</button>' : '') +
      (m.ok ? '<div class="xzact">' +
      (C.onSpeak ? '<button onclick="SAGE321.speak(' + i + ')">' + esc(L('speak')) + '</button>' : '') +
      '<button class="' + (sav ? 'on' : '') + '" onclick="SAGE321.star(' + i + ')">' +
      esc(sav ? L('saved') : L('save')) + '</button>' +
      '<button onclick="SAGE321.share(' + i + ')">' + esc(L('share')) + '</button>' +
      (C.onCard ? '<button onclick="SAGE321.card(' + i + ')">' + esc(L('card')) + '</button>' : '') +
      '<button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button>' +
      '</div>' : '<div class="xzact"><button onclick="SAGE321.drop(' + i + ')">' + esc(L('del')) + '</button></div>') +
      fuHtml(m, i) + '</div>';
  }

  /* 只改這一則——不重畫整個對話，正在朗讀的那一則才不會斷 */
  function fold(i) {
    var m = XZ.msgs[i];
    if (!m || !isLong(m)) return;
    m.col = (m.col === false);
    var el = document.getElementById('xzm' + i);
    if (!el) return draw();
    var t = el.querySelector('.xzt'), b = el.querySelector('.xzmore');
    if (t) t.className = 'xzt' + (m.col ? ' clip' : '');
    if (b) b.textContent = m.col ? L('more') : L('less');
    if (m.col) { try { el.scrollIntoView({ block: 'nearest' }); } catch (e) {} }
  }
  function foldAll() {
    var n = 0, i;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { XZ.msgs[i].col = true; n++; }
    if (!n) return toast(L('foldNone'));
    draw(true);
    toast(L('foldedAll'));
  }
  function speak(i) {
    var m = XZ.msgs[i];
    if (m && C.onSpeak) C.onSpeak(toSpeech(m.text), C.name);
  }

  function draw(keepScroll) {
    var el = document.getElementById(C.el);
    if (!el) {
      el = document.createElement('div');
      el.id = C.el; el.className = 'xz';
      document.body.appendChild(el);
    }
    el.className = ('xz ' + (XZ.open ? 'on' : '')).replace(/\s+$/, '');
    if (!XZ.open) return;
    var oldB = document.getElementById('xzb'), oldTop = oldB ? oldB.scrollTop : 0;
    var inp = document.getElementById('xzin'), typed = inp ? inp.value : '';

    var bd = '', i;
    if (XZ.msgs.length) {
      for (i = 0; i < XZ.msgs.length; i++) bd += bubble(XZ.msgs[i], i);
    } else {
      bd = '<div class="xzhi"><b>' + esc(L('iam') || ('我是' + C.name + '。')) + '</b><br>' +
        esc(C.hello || L('hello')) + '<br>' +
        '<span class="xs muted">' + esc(L('caveat')) + '</span></div>';
    }
    var quicks = '';
    if (!XZ.msgs.length && C.quicks) {
      var qs = [];
      try { qs = C.quicks() || []; } catch (e) { qs = []; }
      if (qs.length) {
        quicks = '<div class="xzq">';
        for (i = 0; i < qs.length; i++) {
          quicks += '<button onclick="SAGE321.pick(this.getAttribute(\'data-q\'))" data-q="' + esc(qs[i]) + '">' +
            esc(qs[i]) + '</button>';
        }
        quicks += '</div>';
      }
    }
    var ctl = '';
    if (C.controls) { try { ctl = C.controls() || ''; } catch (e) { ctl = ''; } }
    var anyLong = false;
    for (i = 0; i < XZ.msgs.length; i++) if (isLong(XZ.msgs[i])) { anyLong = true; break; }

    el.innerHTML =
      '<div class="xzmask" onclick="SAGE321.close()"></div>' +
      '<div class="xzcard">' +
      '<div class="xzh"><b>' + esc(C.emoji + ' ' + C.name) + '</b>' +
      '<span class="xs muted" style="flex:1">' + esc(C.tagline) + '</span>' +
      (anyLong ? '<button class="ico" onclick="SAGE321.foldAll()">' + esc(L('foldAll')) + '</button>' : '') +
      (XZ.msgs.length ? '<button class="ico" onclick="SAGE321.clear()">' + esc(L('clear')) + '</button>' : '') +
      '<button class="ico" onclick="SAGE321.close()">' + esc(L('close')) + '</button></div>' +
      (ctl ? '<div class="xzctl">' + ctl + '</div>' : '') +
      '<div class="xzb" id="xzb">' + bd + quicks +
      (XZ.busy && !(XZ.msgs.length && XZ.msgs[XZ.msgs.length - 1].cont)
        ? '<div class="xzm assistant xzwait">' + esc(C.name + L('thinking')) + '</div>' : '') +
      '</div>' +
      '<div class="xzf">' +
      '<input id="xzin" placeholder="' + esc(L('placeholder')) + '"' +
      ' onkeydown="if(event.key===\'Enter\'&&!event.isComposing)SAGE321.send()">' +
      '<button class="btn pri" onclick="SAGE321.send()">' + esc(L('send')) + '</button>' +
      '</div></div>';
    var ni = document.getElementById('xzin');
    if (ni && typed) ni.value = typed;
    setTimeout(function () {
      var b = document.getElementById('xzb');
      if (!b) return;
      b.scrollTop = keepScroll ? oldTop : b.scrollHeight;
    }, 30);
  }

  function clear() { XZ.msgs = []; draw(); }

  function init(cfg) {
    C = ext(ext({}, DEF), cfg || {});
    C.labels = ext(ext({}, DEF.labels), (cfg && cfg.labels) || {});
    if (!C.worker) throw new Error('SAGE321.init 需要 worker');
    return API;
  }

  var API = {
    init: init,
    open: open, close: close, clear: clear,
    ask: ask, send: send, pick: pick, reask: reask,
    star: star, drop: drop, unstar: unstar, savedIdx: savedIdx,
    share: share, card: card,
    fold: fold, foldAll: foldAll, speak: speak, draw: draw,
    exportMd: exportMd,
    saved: saved,
    msgs: function () { return XZ.msgs; },
    isOpen: function () { return !!XZ.open; },
    speechOf: toSpeech,
    plainOf: plainOf,

輕鬆有梗的口吻，像一位很酷的大哥哥大姊姊在聊天，不說教、不居高臨下。多用他們熟悉的世界來比喻：手機剩1%電量、遊戲過關、追劇、社群按讚與追蹤數、考試、同儕壓力、打球。可以適度用一點流行說法和小玩笑，但絕不拿聖經、神或耶穌開玩笑，也不輕看罪與傷痛；笑完一定要回到經文的真理上。答案精簡，重點先講，段落要短，結尾給一個今天就能試的小挑戰。若他提到被欺負、受傷害或想傷害自己，要溫柔回應，並鼓勵他馬上告訴信任的大人（爸媽、老師、牧者）。", "write": "\n讀者是青少年：口氣輕鬆幽默、像朋友聊天，可以有一點梗，但不說教、不輕浮、不拿神和聖經開玩笑；不要用表情符號。", "style": "風格：題目與解析的口氣幽默風趣、輕鬆有梗（像在跟朋友鬥嘴），選項可以有趣，但正確答案必須明確、不含糊，絕不拿神與聖經開玩笑。", "res": ["哎呀，這章有點滑溜～再讀一次，下一局你就是王者！", "不賴喔！再練幾次就可以去嘲笑你的朋友了（開玩笑的）。", "滿分級的操作！聖經達人就是你！"], "q": ["這段經文跟我的日常（學校、朋友、手機）有什麼關係？", "如果這段經文是神傳給我的一則訊息，它想說什麼？", "朋友都那樣做，我不跟會不會很怪？經文怎麼看？", "用遊戲或電影來比喻這段經文，可以嗎？", "這段經文有什麼讓人意外、很少人知道的地方？", "考試壓力好大，這段經文能給我什麼力量？", "我很難原諒一個人，這段經文能幫我什麼？", "神真的看得到我嗎？我哪裡值得被愛？"], "fu": [["🏫", "學校", "用你剛才講的，幫我想想怎麼用在學校與課業上，給我一個今天就能試的小招。"], ["🤝", "朋友", "用你剛才講的，幫我想想怎麼用在朋友相處上，給我一個今天就能試的小招。"], ["🏠", "家人", "用你剛才講的，幫我想想怎麼用在跟爸媽、家人的相處上，給我一個今天就能試的小招。"], ["📱", "手機網路", "用你剛才講的，幫我想想怎麼用在手機、網路與社群上，給我一個今天就能試的小招。"], ["💭", "壓力", "用你剛才講的，幫我想想怎麼用在壓力和情緒上，給我一個今天就能試的小招。"], ["🌟", "未來", "用你剛才講的，幫我想想怎麼用在未來和夢想上，給我一個今天就能試的小招。"], ["🎯", "今天挑戰", "請給我一個跟剛才有關、今天就能完成的小挑戰，要具體、有點好玩。"]]}, "kid": {"sys": " 回答對象：兒童（約5–11歲）。請用非常淺顯易懂的話，像說故事給小朋友聽。句子要短，一句只講一件事；用具體的小事當比喻（種子、小熊、手牽手、捉迷藏、生日蛋糕）；不用艱深的神學名詞，必須用時馬上用一句話解釋。語氣親切活潑，可以說「你知道嗎？」「一起想一想」，並適度加幾個可愛的表情符號。整個回答控制在五到七句短句。不要用表格；只引用一節簡短的經文。遇到暴力或可怕的經文，用孩子能承受的方式溫柔帶過，不渲染細節。最後用一句小禱告或一個孩子答得出來的簡單問題作結。若孩子說有人傷害他、或他很難過，要親切回應，並告訴他馬上跟信任的大人（爸爸媽媽、老師、牧者）說。", "write": "\n讀者是小朋友：用非常簡單的字詞和短句，像說故事，一句只講一件事，不用艱深名詞；不要用表情符號。", "style": "風格：給5到11歲的小朋友，字詞非常簡單、句子很短，像在說故事；選項要短；解析一句話、親切，最多加一個可愛的表情符號。", "res": ["沒關係！我們再讀一次故事，再玩一次就會了！🌱", "好棒喔！你記得好多！🌟", "哇！太厲害了！神一定很高興！🎉"], "q": ["這段故事在說什麼？請講給我聽。", "神在這個故事裡做了什麼事？", "耶穌愛我嗎？我怎麼知道？", "這個故事裡誰最勇敢？為什麼？", "我可以怎樣學習故事裡的人？", "請教我一句可以背起來的短經文。", "我跟好朋友吵架了，耶穌會怎麼做？", "可以教我做一個小禱告嗎？"], "fu": [["🏠", "在家", "剛剛講的，我在家裡可以怎麼做呢？請用簡單的話告訴我。"], ["🏫", "在學校", "剛剛講的，我在學校可以怎麼做呢？請用簡單的話告訴我。"], ["🤝", "跟朋友", "剛剛講的，我在跟好朋友相處時可以怎麼做呢？請用簡單的話告訴我。"], ["🙏", "小禱告", "請教我一個很短的小禱告，我可以跟耶穌說。"], ["📖", "小故事", "可以再講一個跟這個有關的小故事給我聽嗎？"]]}, "seeker": {"sys": " 回答對象：慕道友（還沒有信主、正在了解基督信仰的朋友）。請完全站在他的立場和角度：他可能沒讀過聖經、不懂教會用語，心裡有疑問，甚至有些保留。①先從他真實的生活處境、感受或疑問切入，再帶到經文，讓他覺得「這跟我有關」。②用最平常的話說；321理念只是你心裡的方向，不要在回答裡出現「無己、作王、得勝、屬靈」這類內部用語，也不用教會與神學術語；一定要提到的詞（如恩典、罪、救恩），馬上用生活的說法解釋。③誠實、尊重、不說教、不施壓、不要求他現在就相信，也不論斷他；有疑問或質疑很正常，先認真承認那個問題的份量，再誠實回答。④清楚說出聖經在這件事上的真理（神是怎樣的神、耶穌為我們做了什麼），用故事、比喻和日常例子，讓他聽得懂、記得住。⑤一定要有實際有用的幫助：給一兩個他這個星期就能自己試試看的小步驟（一個觀察、一個提問、一個簡單的行動）。⑥合適時，可以溫和邀請他繼續探索（例如讀一小段、問一個問題），不要硬把話題轉到決志。⑦不要說「我們基督徒都知道」這類預設他已經信的話。引用經文用和合本，並用白話解釋它的意思。若寫到禱告，只當作「若你願意，可以這樣對神說」的邀請，不強迫。整個回答要簡明、段落要短。", "write": "\n讀者是還沒信主的朋友：用生活化、親切、不說教的話，不用教會術語，不預設他已經信；不要用表情符號。", "style": "風格：給還沒信主、沒讀過聖經的人。題目要把背景交代清楚（人物、事件的名字直接寫出來），不假設他懂聖經或教會用語；用字平實，解析用一句白話說明這件事對一般人有什麼意義。", "res": ["沒關係，剛接觸這些內容本來就不容易，再看一遍會更清楚。", "不錯喔！你已經抓到這一章的重點了。", "太厲害了！你對這一章的內容很清楚。"], "q": ["這段話跟我現在的生活有什麼關係？", "我還不是基督徒，這段話對我有什麼意義？", "神真的存在嗎？有什麼理由可以相信？", "聖經為什麼說每個人都需要耶穌？", "我壓力很大，聖經能給我什麼實際的幫助？", "這段話裡的「罪」是什麼意思？跟我有關嗎？", "基督徒常說的「恩典」，用白話說是什麼？", "如果我想多了解，可以從哪裡開始？"], "fu": [["🤝", "人際", "剛才說的放在人際關係裡（家人、朋友、同事），對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💍", "婚姻家庭", "剛才說的放在婚姻與家庭裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["💼", "工作", "剛才說的放在工作與職場裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["😟", "壓力焦慮", "剛才說的放在壓力與焦慮裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["🌍", "人生意義", "剛才說的放在尋找人生的意義與方向裡，對一個還不是基督徒的人有什麼實際的幫助？請舉一個生活的例子。"], ["❓", "我的疑問", "我心裡還有疑問，請誠實告訴我：信耶穌對一個人的生活到底有什麼實際的幫助？也請告訴我可以怎麼自己去查證。"], ["🌱", "下一步", "如果我想進一步了解，下一步可以做什麼？請給我一兩個不會有壓力的建議。"]]}, "elder": {"sys": " 回答對象：長輩（約65歲以上）。請用尊敬、溫和、慢慢說的口吻，像晚輩敬重地陪長輩讀經；句子清楚、不拐彎，不用網路用語和英文縮寫；比喻取自一生的閱歷（田地、家人、歲月、病痛、孫子、老街坊）。重點先講，分成短段落，不要太長。肯定他們一生走過的路與在主裡的忠心，不說教、不指責、不用「你應該」。可以談健康與軟弱、孤單、放下與交託、把信仰傳給下一代、永恆的盼望與感恩。結尾給一件簡單、容易做到的小事（一句禱告、打電話問候家人、數算一件感謝）。若提到身體不適、孤單或失去親人，要先溫柔安慰，並鼓勵他和家人、教會關懷同工聯絡。", "write": "\n讀者是長輩：用語尊敬、溫和、清楚好懂，不用網路用語；不要用表情符號。", "style": "風格：給長輩，字詞平實、句子清楚，題目不要繞、不要太冷僻，選項簡短；解析用一句溫和的話。", "res": ["沒關係，慢慢來，再讀一遍會更清楚。", "很好！這一章的話您記得不少。", "太好了！神的話已經住在您心裡。"], "q": ["這段經文用最簡單的話，是在說什麼？", "這段經文對年紀大的人有什麼安慰？", "身體漸漸衰弱了，神怎麼看顧我？", "我常常覺得孤單，這段經文能給我什麼？", "我該怎麼把信仰傳給兒孫？", "有些事放不下，這段經文怎麼教我交託？", "我老了，還能為神做什麼？", "請幫我寫一段簡短的禱告，我想念給主聽。"], "fu": [["🩺", "健康", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在身體的軟弱與健康，並給我一個這個星期做得到的具體小步驟。"], ["🤍", "孤單", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在孤單與思念，並給我一個這個星期做得到的具體小步驟。"], ["👨‍👩‍👧‍👦", "兒孫", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在和兒孫、家人的關係，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "交託", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在放下心中的牽掛、交託給主，並給我一個這個星期做得到的具體小步驟。"], ["🌅", "盼望", "請針對你剛才的回答，用簡單清楚、慢慢說的話說明怎麼把它用在永恆的盼望與感恩，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，用簡單的話寫成一段短短的禱告，讓我可以慢慢念給主聽。"]]}, "single_parent": {"sys": " 回答對象：單親爸爸或媽媽（一個人撐起一個家）。請先接住他的辛苦：他常常很累、有愧疚、有孤單，也有經濟、時間與教養的壓力。口吻溫暖、接納、不評斷，不追問過去的原因，不說「你應該再找個伴」，也不把單親說成缺憾。引用神的心意：神是孤兒的父、寡婦的伸冤者（詩篇68:5），祂與我們同在。再給盼望與實際：每一個小步驟都要在忙碌中做得到（五分鐘禱告、跟孩子的一個小儀式、開口向弟兄姊妹求助）。內容簡短、段落要短。結尾給一個這個星期做得到的小步驟。若他提到被暴力對待、疲憊到撐不下去或想傷害自己，要溫柔回應，並鼓勵他立刻聯絡信任的人、教會同工或專業協助。", "write": "\n讀者是單親爸媽：口吻溫暖、接納、不評斷，肯定他的辛苦；不要用表情符號。", "style": "風格：給單親爸媽，題目貼近日常的忙碌、教養與盼望；口氣溫暖，解析一句話帶出安慰。", "res": ["沒關係，您已經很努力了，有空再讀一遍就好。", "不錯！在這麼忙的日子裡還記得這麼多。", "太棒了！神的話正在托住您。"], "q": ["這段經文對一個人撐起一個家的我，有什麼安慰？", "我常常覺得累，也覺得對孩子有虧欠，神怎麼看？", "神怎麼看顧孤兒和寡婦？這跟我有什麼關係？", "經濟壓力很大，這段經文能給我什麼？", "孩子在頂嘴、情緒很大，我該怎麼辦？", "我不知道怎麼跟孩子說爸爸（或媽媽）不在身邊的事。", "我真的很孤單，可以怎麼向教會或弟兄姊妹開口求助？", "請幫我寫一段五分鐘內能禱告完的短禱告。"], "fu": [["😮‍💨", "疲累", "請針對你剛才的回答，說明怎麼把它用在一個人撐家的疲累與內疚，並給我一個這個星期做得到的具體小步驟。"], ["👧", "孩子", "請針對你剛才的回答，說明怎麼把它用在陪伴孩子與教養，並給我一個這個星期做得到的具體小步驟。"], ["💰", "經濟", "請針對你剛才的回答，說明怎麼把它用在經濟與時間的壓力，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "求助", "請針對你剛才的回答，說明怎麼把它用在向弟兄姊妹或教會開口求助，並給我一個這個星期做得到的具體小步驟。"], ["🌤️", "盼望", "請針對你剛才的回答，說明怎麼把它用在在這個階段看見神的同在與盼望，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我在忙碌中五分鐘內就能禱告完的短禱告。"]]}, "single": {"sys": " 回答對象：單身的人（可能未婚、離婚、喪偶，或正在等候；不要預設他想結婚或不想結婚）。請不要把單身說成缺憾、「預備期」或「還沒到的人生」，也不要用催婚的口氣。談在基督裡的身分已經完整、被愛；談孤單時怎麼與神、與朋友、與團契連結；談時間、金錢與恩賜的運用與使命；談等待中的信靠；談感情與婚姻的智慧，以及在情感與身體上的聖潔，態度要尊重、不論斷。口吻真誠、平等、輕鬆。結尾給一個這個星期可以做的小步驟。若他提到孤單到想傷害自己，要溫柔回應並鼓勵他立刻聯絡信任的人或專業協助。", "write": "\n讀者是單身朋友：口吻真誠、平等、輕鬆，不催婚、不把單身說成缺憾；不要用表情符號。", "style": "風格：給單身的朋友，題目貼近孤單、身分、等待、友誼與使命；口氣真誠平等，不催婚。", "res": ["沒關係，慢慢來，再讀一遍就會更清楚。", "不錯喔！你把這一章的重點抓到了。", "太棒了！你很認真，神的話正在你裡面扎根。"], "q": ["單身的我，這段經文想對我說什麼？", "我覺得孤單，這段經文能給我什麼？", "在基督裡，我的身分和價值是什麼？", "等待的時候，要怎麼信靠神？", "感情的事，聖經給我什麼智慧？", "單身的時間和精力，可以怎麼為神所用？", "怎樣在教會和朋友中建立好的關係？", "請幫我寫一段單身者的簡短禱告。"], "fu": [["🫶", "孤單", "請針對你剛才的回答，說明怎麼把它用在孤單時怎麼與神、與朋友連結，並給我一個這個星期做得到的具體小步驟。"], ["💝", "身分", "請針對你剛才的回答，說明怎麼把它用在我在基督裡的身分與價值，並給我一個這個星期做得到的具體小步驟。"], ["⏳", "等待", "請針對你剛才的回答，說明怎麼把它用在等待中的信靠，並給我一個這個星期做得到的具體小步驟。"], ["💞", "感情", "請針對你剛才的回答，說明怎麼把它用在感情與交友的智慧，並給我一個這個星期做得到的具體小步驟。"], ["🎯", "使命", "請針對你剛才的回答，說明怎麼把它用在把時間與恩賜用在神的使命上，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段簡短、真誠的禱告，讓我可以拿來禱告。"]]}, "parent": {"sys": " 回答對象：正在養育孩子的父母（孩子可能從嬰幼兒到成年）。請站在父母的位置：他們常常疲累、擔心孩子、也常常內疚。口吻溫暖、貼近生活、不評斷；承認每個孩子與每個家庭都不同。談陪伴與榜樣、管教與恩典的平衡、親子溝通（怎麼聽、怎麼說）、為孩子禱告、夫妻同心、面對自己的軟弱與失敗；可用日常場景當比喻（吃飯、功課、手機、睡前）。結尾給一個這個星期可以做的具體小步驟（一句話、一個擁抱、一段睡前禱告）。若提到孩子遭受傷害、家庭暴力或孩子有自傷的念頭，要溫柔回應並鼓勵立刻尋求專業協助與信任的人。", "write": "\n讀者是正在養育孩子的父母：口吻溫暖、貼近生活、不評斷；不要用表情符號。", "style": "風格：給養育孩子的父母，題目貼近親子溝通、管教、陪伴與為孩子禱告；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話正在您的家裡扎根。"], "q": ["這段經文對養育孩子的我有什麼提醒？", "孩子不聽話、情緒很大，我該怎麼回應？", "管教和恩典要怎麼拿捏？", "怎麼跟青春期的孩子好好說話？", "我常常對孩子發脾氣，事後很內疚怎麼辦？", "怎麼帶孩子認識神，而不只是去教會？", "夫妻在教養上意見不同，這段經文怎麼說？", "請幫我寫一段為孩子祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明怎麼把它用在跟孩子好好溝通（怎麼聽、怎麼說），並給我一個這個星期做得到的具體小步驟。"], ["⚖️", "管教", "請針對你剛才的回答，說明怎麼把它用在管教與恩典的平衡，並給我一個這個星期做得到的具體小步驟。"], ["😔", "內疚", "請針對你剛才的回答，說明怎麼把它用在對孩子發脾氣或覺得虧欠的內疚，並給我一個這個星期做得到的具體小步驟。"], ["💑", "夫妻", "請針對你剛才的回答，說明怎麼把它用在夫妻在教養上同心，並給我一個這個星期做得到的具體小步驟。"], ["📖", "信仰", "請針對你剛才的回答，說明怎麼把它用在帶孩子認識神、一起親近神，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段我可以為孩子祝福的短禱告。"]]}, "couple": {"sys": " 回答對象：夫妻（正在經營婚姻的丈夫與妻子，可能是新婚、有孩子的中年夫妻，或相伴多年的伴侶）。請站在夫妻同行的位置：口吻溫暖、真誠、不評斷，不偏袒任何一方；承認每段婚姻都有磨合、疲累與受傷的時候。談愛是決定與付出、彼此饒恕、傾聽與表達（怎麼說、怎麼聽）、尊重與同心、金錢與家務的分工、姻親與孩子的教養、一起禱告與一起讀經、在主裡成為一體；可用日常場景當比喻（飯桌、手牽手、吵完架之後、睡前）。結尾給一個這個星期兩個人就能一起做的具體小步驟（一句感謝的話、一段兩人的禱告、一次不看手機的散步）。不要教導妻子順服或丈夫掌權的單方面要求，要強調彼此相愛、彼此順服。若提到家庭暴力、外遇、對方的威脅或有自傷念頭，要溫柔回應，把安全放在第一位，並鼓勵立刻尋求專業協助與信任的人，不要勸人一味忍耐。", "write": "\n讀者是夫妻：口吻溫暖、貼近生活、不評斷、不偏袒任何一方；不要用表情符號。", "style": "風格：給夫妻，題目貼近溝通、饒恕、同心、共同禱告與彼此相愛；口氣溫暖，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，找個晚上兩個人再一起讀一遍。", "不錯！這一章的重點你們抓到了。", "太棒了！神的話正在你們的婚姻裡扎根。"], "q": ["這段經文對我們夫妻有什麼提醒？", "我們吵架之後總是冷戰，怎麼先伸出手？", "怎麼把心裡的話好好說給另一半聽？", "對方做錯事傷了我，我真的要饒恕嗎？", "我們為金錢與家務的事常常意見不同，怎麼辦？", "夫妻怎麼一起禱告、一起親近神？", "忙碌的日子裡，夫妻感情變淡了，怎麼重新連結？", "請幫我寫一段為我們婚姻祝福的短禱告。"], "fu": [["🗣️", "溝通", "請針對你剛才的回答，說明夫妻怎麼把它用在好好說、好好聽，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🤝", "饒恕", "請針對你剛才的回答，說明夫妻怎麼把它用在彼此認錯與饒恕，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["💞", "親密", "請針對你剛才的回答，說明夫妻怎麼把它用在重新連結感情、表達愛與感謝，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["👨‍👩‍👧", "同心", "請針對你剛才的回答，說明夫妻怎麼把它用在金錢、家務與教養上同心，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["📖", "同讀", "請針對你剛才的回答，說明夫妻怎麼一起讀經、一起親近神，並給我們一個這個星期兩個人做得到的具體小步驟。"], ["🙏", "禱告", "請把你剛才說的重點，寫成一段夫妻可以一起禱告的短禱告。"]]}, "pastor": {"sys": " 回答對象：牧者與傳道同工（教會的牧師、傳道人、小組長與事奉的同工）。請站在同工的位置：他們常常肩負許多人的重擔，自己也會疲累、孤單、被誤解或灰心。口吻尊重、平等、真誠，像同工之間彼此扶持，不說教、不居高臨下。可以有適度的深度：點出經文脈絡、原文語境與關鍵字詞的意思，談牧養羊群與生命建造、預備講道與教導、帶領小組與門徒訓練、團隊同心與衝突、面對批評與孤單、屬靈爭戰、自己的靈命與家庭，以及不倦怠的安息與依靠；也可提供講章或查經的切入點、段落與應用建議，但要提醒最後仍須自己在神面前領受。結尾給一個這個星期可以做的具體小步驟（一段安靜親近神的時間、一通關心的電話、一次向同工的坦誠分享）。若提到極度疲憊、憂鬱、想放棄或有自傷念頭，要溫柔回應，並鼓勵立刻尋求信任的同工、屬靈長輩與專業協助。", "write": "\n讀者是牧者與傳道同工：口吻尊重、平等、真誠，像同工彼此扶持；不要用表情符號。", "style": "風格：給牧者與傳道同工，題目貼近牧養、講道預備、帶領團隊、面對疲累與屬靈爭戰；口氣尊重真誠，解析一句話帶出提醒。", "res": ["沒關係，慢慢來，有空再讀一遍就會更清楚。", "不錯！這一章的重點您已經抓到了。", "太棒了！神的話先餵養了牧者，也必流向羊群。"], "q": ["這段經文對事奉中的我有什麼提醒？", "請幫我找這段經文的講道架構與切入點。", "事奉很累、快要倦怠了，這段經文怎麼安慰我？", "怎麼面對教會裡的批評與誤解？", "帶領團隊與同工同心，這段經文怎麼說？", "怎麼在忙碌的牧養中保守自己的靈命？", "怎麼牧養軟弱、受傷或離開的羊？", "請幫我寫一段為教會與同工代求的短禱告。"], "fu": [["📖", "講道", "請針對你剛才的回答，提供一個可用於講道或查經的架構（三個要點與一個應用），並提醒我自己先在神面前領受。"], ["🐑", "牧養", "請針對你剛才的回答，說明怎麼把它用在牧養羊群與關心個別的人，並給我一個這個星期做得到的具體小步驟。"], ["🤝", "團隊", "請針對你剛才的回答，說明怎麼把它用在帶領團隊、同工同心與處理衝突，並給我一個這個星期做得到的具體小步驟。"], ["🕊️", "安息", "請針對你剛才的回答，說明怎麼把它用在自己的疲累與靈命保守，並給我一個這個星期做得到的具體小步驟。"], ["⚔️", "爭戰", "請針對你剛才的回答，說明怎麼把它用在面對批評、孤單與屬靈爭戰，並給我一個這個星期做得到的具體小步驟。"], ["🙏", "代禱", "請把你剛才說的重點，寫成一段我可以為教會與同工代求的短禱告。"]]}}};

  async function aiRaw(sys, ask, ms, maxT) {

    for (let a = 0; a <= waits.length; a++) {

      try {
        const r = await fetch(SVC.xz, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ model: SVC.model, max_tokens: maxT || 1600, system: sys, messages: [{ role: 'user', content: ask }] }),
          signal: ac ? ac.signal : undefined
        });
        if (!r.ok) throw new Error('http ' + r.status);
        const d = await r.json().catch(() => null);
        if (d && d.content && d.content.length) out = d.content.map(b => b.text || '').join('');
        else if (d) out = d.reply || d.text || d.message || '';
        if (!out) why = T('回覆是空的', 'empty reply');
        clearTimeout(tm);

      } catch (e) {
        clearTimeout(tm);
        why = (e && e.name === 'AbortError') ? T('逾時', 'timeout') : ((e && e.message) ? String(e.message) : 'network');
        if (a === waits.length) break;
        await new Promise(rs => setTimeout(rs, waits[a]));
      }
    }
    return { out: String(out || '').trim(), why };
  }

${st}請用繁體中文。只回傳 JSON，不要任何說明、不要 markdown 圍欄：{"r":[{"t":"人物","h":["提示1","提示2","提示3"],"a":"答案","alt":["別名"],"v":"3","e":"亮點"}]}`;

  function plParse(text) {
    let s = String(text || '').replace(/```(?:json)?/gi, '').trim();
    const st = s.indexOf('{'); if (st < 0) return null;
    s = s.slice(st);
    try { return JSON.parse(s.slice(0, s.lastIndexOf('}') + 1)); } catch (e) {}
    const m = s.match(/"(q|r)"\s*:\s*\[/); if (!m) return null;
    let i = m.index + m[0].length; const items = [];
    while (i < s.length) {
      while (i < s.length && s[i] !== '{') i++;
      if (i >= s.length) break;
      let depth = 0, inStr = false, es = false, j = i;
      for (; j < s.length; j++) {
        const c = s[j];
        if (inStr) { if (es) es = false; else if (c === '\\') es = true; else if (c === '"') inStr = false; }
        else if (c === '"') inStr = true;

      try { items.push(JSON.parse(s.slice(i, j + 1))); } catch (e) {}

  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; };
  function vOf(v) {

  function normQuiz(list, src, k) {

      const as = String(x.a).trim();
      const ai = /^[A-Da-d]$/.test(as) ? 'abcd'.indexOf(as.toLowerCase()) : (as === '' ? NaN : +x.a);

function mx_u32(b,p){return b[p]*16777216+b[p+1]*65536+b[p+2]*256+b[p+3];}
function mx_i32(b,p){const v=mx_u32(b,p);return v>=2147483648?v-4294967296:v;}
function mx_u64(b,p){return mx_u32(b,p)*4294967296+mx_u32(b,p+4);}
function mx_typ(b,p){return String.fromCharCode(b[p],b[p+1],b[p+2],b[p+3]);}

function mx_boxes(b,start,end){
  const out=[];let p=start;
  while(p+8<=end){
    let size=mx_u32(b,p),hs=8;
    if(size===1){size=mx_u64(b,p+8);hs=16;}
    else if(size===0)size=end-p;
    if(size<8||p+size>end)break;
    out.push({type:mx_typ(b,p+4),start:p,size:size,hs:hs,body:p+hs,end:p+size});
    p+=size;
  }
  return out;
}
function mx_find(list,t){return list.filter(x=>x.type===t);}
function mx_one(list,t){const r=mx_find(list,t);return r.length?r[0]:null;}
function mx_children(b,mx_box){return mx_boxes(b,mx_box.body,mx_box.end);}

function mx_parseTrun(b,tr,tfhd,baseOffset){
  const flags=mx_u32(b,tr.body)&0xffffff;
  const cnt=mx_u32(b,tr.body+4);
  let p=tr.body+8;
  let dataOff=0;
  if(flags&0x1){dataOff=mx_i32(b,p);p+=4;}
  let firstFlags=null;
  if(flags&0x4){firstFlags=mx_u32(b,p);p+=4;}
  const samples=[];
  let off=baseOffset+dataOff;
  for(let i=0;i<cnt;i++){
    let dur=tfhd.defDur, size=tfhd.defSize, fl=tfhd.defFlags, cto=0;
    if(flags&0x100){dur=mx_u32(b,p);p+=4;}
    if(flags&0x200){size=mx_u32(b,p);p+=4;}
    if(flags&0x400){fl=mx_u32(b,p);p+=4;}
    if(flags&0x800){cto=mx_i32(b,p);p+=4;}
    if(i===0&&firstFlags!==null)fl=firstFlags;
    samples.push({off:off,size:size,dur:dur,cto:cto,sync:!(fl&0x10000)});
    off+=size;
  }
  return {samples:samples,dataOff:dataOff};
}

function mx_parseTfhd(b,mx_box){
  const flags=mx_u32(b,mx_box.body)&0xffffff;
  const trackId=mx_u32(b,mx_box.body+4);
  let p=mx_box.body+8;
  let base=null;
  if(flags&0x1){base=mx_u64(b,p);p+=8;}
  if(flags&0x2){p+=4;}
  let defDur=0,defSize=0,defFlags=0;
  if(flags&0x8){defDur=mx_u32(b,p);p+=4;}
  if(flags&0x10){defSize=mx_u32(b,p);p+=4;}
  if(flags&0x20){defFlags=mx_u32(b,p);p+=4;}
  return {trackId:trackId,base:base,defDur:defDur,defSize:defSize,defFlags:defFlags,
          defaultBaseIsMoof:!!(flags&0x020000),hasBase:!!(flags&0x1)};
}

/* ---- 產生 mx_box ---- */
function mx_box(type,...parts){
  let len=8;parts.forEach(p=>len+=p.length);
  const head=new Uint8Array(8);
  head[0]=(len>>>24)&255;head[1]=(len>>>16)&255;head[2]=(len>>>8)&255;head[3]=len&255;
  for(let i=0;i<4;i++)head[4+i]=type.charCodeAt(i);
  const out=new Uint8Array(len);out.set(head,0);
  let p=8;parts.forEach(x=>{out.set(x,p);p+=x.length;});
  return out;
}
function mx_b32(v){return new Uint8Array([(v>>>24)&255,(v>>>16)&255,(v>>>8)&255,v&255]);}
function mx_b64(v){const hi=Math.floor(v/4294967296),lo=v>>>0;
  return new Uint8Array([(hi>>>24)&255,(hi>>>16)&255,(hi>>>8)&255,hi&255,
                         (lo>>>24)&255,(lo>>>16)&255,(lo>>>8)&255,lo&255]);}
function mx_cat(arr){let n=0;arr.forEach(a=>n+=a.length);const o=new Uint8Array(n);let p=0;
  arr.forEach(a=>{o.set(a,p);p+=a.length;});return o;}

function mx_remux(bytes){
  const b=bytes;
  const top=mx_boxes(b,0,b.length);
  const ftyp=mx_one(top,"ftyp");
  const moov=mx_one(top,"moov");
  if(!moov)throw new Error("no moov");
  const moofs=mx_find(top,"moof");
  if(!moofs.length)return null;              /* 不是分段 MP4，不用處理 */

  const mvBoxes=mx_children(b,moov);
  const mvhd=mx_one(mvBoxes,"mvhd");
  const mvTimescale=mx_u32(b,mvhd.body+(b[mvhd.body]===1?20:12));
  const traks=mx_find(mvBoxes,"trak");

  /* 收集每個 track 的所有 sample */
  const tracks={};
  traks.forEach(tk=>{
    const tkhd=mx_one(mx_children(b,tk),"tkhd");
    const v=b[tkhd.body];
    const id=mx_u32(b,tkhd.body+(v===1?20:12));
    tracks[id]={trak:tk,samples:[]};
  });

  moofs.forEach(mf=>{
    const trafs=mx_find(mx_children(b,mf),"traf");
    trafs.forEach(tf=>{
      const tfc=mx_children(b,tf);
      const tfhdBox=mx_one(tfc,"tfhd");
      if(!tfhdBox)return;
      const tfhd=mx_parseTfhd(b,tfhdBox);
      const t=tracks[tfhd.trackId];
      if(!t)return;
      /* 基準位移：預設是 moof 起點（default-base-is-moof） */
      const base=tfhd.hasBase?tfhd.base:mf.start;
      let running=null;
      mx_find(tfc,"trun").forEach(tr=>{
        const flags=mx_u32(b,tr.body)&0xffffff;
        const hasOff=!!(flags&0x1);
        const r=mx_parseTrun(b,tr,tfhd,hasOff?base:(running===null?base:running));
        r.samples.forEach(s=>t.samples.push(s));
        if(r.samples.length){
          const last=r.samples[r.samples.length-1];
          running=last.off+last.size;
        }
      });
    });
  });

  /* 依序把 sample 資料集中成一個 mdat */
  const order=[];
  Object.keys(tracks).forEach(id=>{
    tracks[id].samples.forEach((s,i)=>order.push({id:+id,i:i,off:s.off,size:s.size}));
  });
  order.sort((a,b2)=>a.off-b2.off);
  let mdatSize=0;order.forEach(o=>mdatSize+=o.size);

  const newOff={};
  let cur=0;
  order.forEach(o=>{
    if(!newOff[o.id])newOff[o.id]=[];
    newOff[o.id][o.i]=cur;cur+=o.size;
  });

  /* ---- 為每個 track 重建 stbl ---- */
  function buildStbl(id,stblOld,mediaTimescale){
    const ss=tracks[id].samples;
    const offs=newOff[id]||[];
    const old=mx_children(b,stblOld);
    const keep=[];
    ["stsd"].forEach(t=>{const x=mx_one(old,t);if(x)keep.push(b.slice(x.start,x.end));});

    /* stts */
    const stts=[];
    let runDur=-1,runCnt=0;
    ss.forEach(s=>{
      if(s.dur===runDur){runCnt++;}
      else{if(runCnt)stts.push([runCnt,runDur]);runDur=s.dur;runCnt=1;}
    });
    if(runCnt)stts.push([runCnt,runDur]);
    const sttsBody=[mx_b32(0),mx_b32(stts.length)];
    stts.forEach(e=>{sttsBody.push(mx_b32(e[0]));sttsBody.push(mx_b32(e[1]));});
    keep.push(mx_box("stts",mx_cat(sttsBody)));

  const PUN = /[\s，。、；：？！「」『』（）《》〈〉“”‘’—…·,.;:?!"'()\[\]\-–]/g;
  function normV(x) {

    const head = q.slice(0, 30), tail = q.slice(-30);
    const order = [];
    const N = GX.NCH();
    if (hint >= 1 && hint <= N) order.push(hint);
    for (let c = 1; c <= N; c++) if (c !== hint) order.push(c);
    for (const c of order) {
      const vs = D.txt[c] || [];

      const i = joined.indexOf(head);
      if (i < 0) continue;
      let j = joined.indexOf(tail, i);
      if (j < 0) j = i + head.length - 1; else j = j + tail.length - 1;
      let a = 0, b = 0;
      for (let k = 0; k < starts.length; k++) { if (starts[k] <= i) a = k; if (starts[k] <= j) b = k; }

<script>/* ===== 321彼得後書講義 ===== */
const D = JSON.parse(document.getElementById('DATA').textContent);
const $ = s => document.querySelector(s);
const esc = s => (s == null ? '' : String(s)).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const CH = D.ch, BLK = D.blk;
/* 每一節 → 所屬的解經段落 */
const VMAP = {};
Object.keys(BLK).forEach(c => BLK[c].forEach((b, i) => {
  b.ch = +c; b.i = i;
  b.ref = c + ':' + (b.a === b.z ? b.a : b.a + '–' + b.z);
  for (let v = b.a; v <= b.z; v++) VMAP[c + ':' + v] = b;
}));
const byCh = {}; Object.keys(BLK).forEach(c => byCh[+c] = BLK[c]);
const cuvOf = ref => { const [c, v] = ref.split(':'); const t = D.txt[c]; return t ? (t[+v - 1] || '') : ''; };
const blkCuv = b => { const t = D.txt[b.ch] || []; let h = '';
  for (let v = b.a; v <= b.z; v++) h += `<p><b>${v}</b>　${esc(t[v - 1] || '')}</p>`; return h; };
const KEY = 'r321.v1';
const DAY = 864e5, GAPS = [0, 1, 3, 7, 16, 35, 75];

let S = load();
function load(){
  try {
    const o = JSON.parse(localStorage.getItem(KEY));
    if (o && o.v === 1){ o.lnote = o.lnote || {}; return o; }   // 舊存檔補上新欄位
  } catch(e){}
  return { v:1, last:1, steps:{}, notes:{}, lnote:{}, prac:{}, mem:{},
           set:{ fs:1, grk:1, dark:0, sc:0, role:'' }, seen:{} };
}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} };

/* ═══ 繁 → 簡：對照表由 scripts/make_scmap.py 從本檔自動推導並驗證過 ═══
   逐字表 m ＝ [繁體字串, 簡體字串]；詞組表 p 用來處理一對多的字（計畫→计划、甚好→甚好）。
   演算法：由左到右掃一次，先試最長的詞組，沒中才套逐字表——詞組是覆蓋，不是先替換。
   這與 Python 端完全相同，兩邊的結果逐字比對過。 */
const SCMAP = (() => { try { return JSON.parse(document.getElementById('SCMAP').textContent); } catch(e){ return null; } })();
const SC_M = new Map(), SC_P = new Map(), SC_HEAD = new Set();
let SC_LENS = [];
if (SCMAP) {
  const [tc, sc] = SCMAP.m;
  for (let i = 0; i < tc.length; i++) SC_M.set(tc[i], sc[i]);
  const L = new Set();
  for (const pr of (SCMAP.p || [])) { SC_P.set(pr[0], pr[1]); L.add(pr[0].length); SC_HEAD.add(pr[0][0]); }
  SC_LENS = [...L].sort((a, b) => b - a);
}
function toSC(s){
  if (!s || !SCMAP) return s;
  let out = '', i = 0;
  const n = s.length;
  while (i < n) {
    const c = s[i];
    if (SC_HEAD.has(c)) {
      let hit = false;
      for (const L of SC_LENS) {
        const r = SC_P.get(s.substr(i, L));
        if (r !== undefined) { out += r; i += L; hit = true; break; }
      }
      if (hit) continue;
    }
    const m = SC_M.get(c);
    out += (m === undefined ? c : m);
    i++;
  }
  return out;
}
const SC_SKIP = { SCRIPT:1, STYLE:1, TEXTAREA:1 };
function scWalk(n){
  if (!n) return;
  if (n.nodeType === 3) { const t = n.nodeValue, v = toSC(t); if (v !== t) n.nodeValue = v; return; }
  if (n.nodeType !== 1 || SC_SKIP[n.tagName]) return;
  for (const a of ['placeholder', 'title', 'alt']) {
    if (n.hasAttribute && n.hasAttribute(a)) { const t = n.getAttribute(a), v = toSC(t); if (v !== t) n.setAttribute(a, v); }
  }
  for (let c = n.firstChild; c; c = c.nextSibling) scWalk(c);
}
function scApply(){ if (S.set.sc) scWalk(document.body); }
/* 之後每一次重繪都會被這個觀察器接住；toSC 是冪等的，重複轉換不會出事 */
try {
  new MutationObserver(ms => {
    if (!S.set.sc) return;
    for (const m of ms) {
      if (m.type === 'characterData') scWalk(m.target);
      else m.addedNodes.forEach(scWalk);
    }
  }).observe(document.body, { childList: true, subtree: true, characterData: true });
} catch(e){}
function toast(t){ const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
const meta = n => CH[n - 1];

/* ===== 進度 ===== */
const STEPS = [
  ['資訊','讀完本章卡片'], ['啟示','讀經文，寫下你看見的一件事'], ['信服','記住本章金句'],
  ['實踐','選一項本週操練'], ['檢討','第七天回填：做了嗎'], ['修正','回到哪一節重讀'],
  ['反覆','複習通過三次'], ['繁殖','講給一位課外的人聽'],
];
const stepsOf = n => S.steps[n] || [];
function toggleStep(n, i){
  const a = stepsOf(n), k = a.indexOf(i);
  if (k >= 0) a.splice(k, 1); else a.push(i);
  S.steps[n] = a; save(); render();
}
const doneCh = () => CH.filter(c => stepsOf(c.n).length === 8).length;
const startedCh = () => CH.filter(c => stepsOf(c.n).length > 0).length;

/* ===== 複習 ===== */
function memAdd(n){ if (S.mem[n]) return false; S.mem[n] = { box:0, due:Date.now(), hit:0 }; save(); return true; }
function memGrade(n, ok){
  const r = S.mem[n]; if (!r) return;
  r.box = ok ? Math.min(GAPS.length - 1, r.box + 1) : 0;
  r.hit = (r.hit || 0) + (ok ? 1 : 0);
  r.due = Date.now() + (ok ? GAPS[r.box] : 0.4) * DAY;
  save();
}
const due = () => Object.keys(S.mem).filter(n => S.mem[n].due <= Date.now()).map(Number);
function blank(t, seed){
  const ch = [...t], idx = [];
  ch.forEach((c, i) => { if (/[\u4e00-\u9fa5]/.test(c)) idx.push(i); });
  let r = seed; const rnd = () => (r = (r * 1103515245 + 12345) % 2147483648) / 2147483648;
  const n = Math.max(1, Math.round(idx.length * 0.3)), pick = new Set();
  let guard = 0;
  while (pick.size < n && guard++ < 999) pick.add(idx[Math.floor(rnd() * idx.length)]);
  return ch.map((c, i) => pick.has(i) ? '<i>○</i>' : esc(c)).join('');
}

/* ===== 朗讀 ===== */
let VOICE = null;
function say(t){
  if (!window.speechSynthesis) return toast('這台裝置不支援朗讀');
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(t).replace(/<[^>]+>/g, ''));
  u.lang = 'zh-TW'; u.rate = 0.94;
  const vs = speechSynthesis.getVoices();
  const v = vs.find(x => /zh[-_]TW|zh[-_]HK|cmn/i.test(x.lang)) || vs.find(x => /^zh/i.test(x.lang));
  if (v) u.voice = v;
  speechSynthesis.speak(u);
}
const plain = el => (el || $('#view')).innerText.slice(0, 3000);

/* ===== 路由 ===== */
let R = { tab:'today', ch:0, sub:'' };
function go(tab, ch, sub){ R = { tab, ch: ch || 0, sub: sub || '' }; if (ch) { S.last = ch; save(); } render(); window.scrollTo(0, 0); }
document.addEventListener('click', e => {
  const b = e.target.closest('nav.tabs button'); if (!b) return;
  go(b.dataset.t);
});
$('#back').onclick = () => { if (R.ch) go(R.tab === 'text' ? 'text' : 'course'); else go('today'); };
/* 頁首的 🔊：在講義那一頁，直接讀講義本文（不念卷名、提詞機與目錄） */
$('#spk').onclick = () => {
  if (SPK.on) return stopSpeak();
  if (R.tab === 'course' && R.ch && R.sub === 'lesson' && (D.lesson || {})[R.ch]) return lesSpeak(R.ch);
  speak(plain(), $('#ttl').textContent);
};
$('#spk').onlongpress = null;
(function(){ let t; const b = $('#spk');
  const st = () => { t = setTimeout(() => { voiceSheet(); t = null; }, 550); };
  const cl = () => { if (t){ clearTimeout(t); t = null; } };
  b.style.webkitTouchCallout = 'none'; b.style.webkitUserSelect = 'none'; b.style.userSelect = 'none';

if ($('#lang')) $('#lang').onclick = toggleSC;

/* ===== 地形圖 ===== */
function terrain(cur){
  const P = D.terrain.points, W = 320, H0 = 96, pad = 14;
  const LAST = 3;
  const x = c => pad + (c - 0.5) / LAST * (W - pad * 2);   // 每章二到三點（第 3 章兩點）：c 是章內位置（章中心＝整數）
  const y = v => 10 + (100 - v) / 100 * (H0 - 26);
  let d = `M ${x(0.5)} ${y(40)}`;
  P.forEach(p => { d += ` L ${x(p[0]).toFixed(1)} ${y(p[1]).toFixed(1)}`; });
  d += ` L ${x(LAST + 0.5)} ${y(P.length ? P[P.length - 1][1] : 30)}`;

  // ── 標籤排版：以方框做二維避讓，放不下就往外推 ──
  const lab = P.filter(p => p[4]);
  const fs = lab.length > 10 ? 6.6 : (lab.length > 6 ? 7.4 : 8.5);
  const boxes = [], out = [];
  const hit = (a, b) => !(a.x1 < b.x0 - 1 || a.x0 > b.x1 + 1 || a.y1 < b.y0 - 1 || a.y0 > b.y1 + 1);
  // 圓點與「目前所在」的圈也是障礙物，標籤不壓在線上
  const obst = [];
  P.forEach(p => { const cx = x(p[0]), cy = y(p[1]), r = (p[4] ? 3.2 : 2.2) + 1.5;
    obst.push({ x0: cx - r, x1: cx + r, y0: cy - r, y1: cy + r }); });
  if (cur) { const cx = x(cur), cy = y(50);
    obst.push({ x0: cx - 7, x1: cx + 7, y0: cy - 7, y1: cy + 7 }); }
  obst.forEach(o => boxes.push(o));
  lab.slice().sort((a, b) => a[0] - b[0]).forEach(p => {
    const txt = String(p[3] || '');
    let w = 0;
    for (const ch of txt) w += /[一-鿿　-〿＀-￯]/.test(ch) ? fs : fs * 0.55;
    const cx = Math.min(W - 1 - w / 2, Math.max(1 + w / 2, x(p[0])));
    const base = y(p[1]);
    const up = [-7, -16, -25, -34, -43], dn = [11, 20, 29, 38, 47];
    const cand = (p[4] === 'bot' ? dn.concat(up) : up.concat(dn));
    let yy = base + cand[0];
    for (const off of cand) {
      const t = base + off;
      const box = { x0: cx - w / 2, x1: cx + w / 2, y0: t - fs, y1: t + 2 };
      if (!boxes.some(b => hit(b, box))) { yy = t; boxes.push(box); break; }
      if (off === cand[cand.length - 1]) { yy = t; boxes.push(box); }
    }
    out.push({ p, cx, yy });
  });
  const labs = out.map(o =>
    `<text class="tlab ${o.p[4] === 'top' ? 'hi' : ''}" style="font-size:${fs}px" x="${o.cx.toFixed(1)}" y="${o.yy.toFixed(1)}" text-anchor="middle">${esc(String(o.p[3] || ''))}</text>`
  ).join('');
  const dots = P.map(p => `<circle class="tdot ${p[4] === 'bot' ? 'low' : ''}" cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${p[4] ? 3.2 : 2.2}"/>`).join('');
  const now = cur ? `<circle class="tnow" cx="${x(cur).toFixed(1)}" cy="${y(50)}" r="6"/>` : '';
  // viewBox 依實際內容撐開，標籤不會被切掉
  const lb = boxes.slice(obst.length);
  const vy0 = Math.min(0, ...lb.map(b => b.y0)) - 3;
  const vy1 = Math.max(H0, ...lb.map(b => b.y1)) + 3;
  return `<div class="terrain"><svg viewBox="0 ${vy0.toFixed(1)} ${W} ${(vy1 - vy0).toFixed(1)}" role="img" aria-label="彼得後書全書地形圖">
    <path class="tpath" d="${d}"/>${dots}${labs}${now}</svg>
    <p class="xs muted center" style="margin:2px 0 6px">星 · 井 · 天</p></div>`;
}

    內容出自《321彼得後書解經與講章》。經文引用《和合本》。</div>`;
  return h;
}
const practiceItems = n => [meta(n).prac.main].concat(meta(n).prac.items);

/* ===== 經文 ===== */
function vText(){

  if (!R.ch){
    let h = `<div class="sect"><p class="eyebrow">彼得後書</p><h2 class="big">從第一章讀到第三章。</h2>
      <p class="sm muted">點任何一節，該節的解經就會打開。</p>

    }

    return h;
  }
  const n = R.ch, m = meta(n);
  setTitle('彼得後書 ' + n, false);
  let h = `<div class="sect"><p class="eyebrow">第 ${n} 章　${esc(m.arc)}</p>

      <span class="vt">${vb}${note}${tag}</span></div>` + notes;
  });
  h += '</div>';
  h += `<div class="hr"></div><button class="btn" onclick="go('course',${n})">看第 ${n} 章講義 ›</button>`;
  return h;
}

/* ===== 節解經（六層）===== */
let OPENL = { 1:1, 2:0, 3:1, 4:0, 5:0, 6:1 };
function openV(ref){
  const v = VMAP[ref]; if (!v) return;
  const rr = v.ch + ':' + (v.a === v.z ? v.a : v.a + '–' + v.z);
  const L = (i, name, body, cls) => {
    const on = OPENL[i] && !(i === 2 && !S.set.grk) && !(i === 4 && !S.set.grk);
    return `<div class="layer"><div class="lh" onclick="tglL(${i},'${ref}')">
      <span class="n">${['','①','②','③','④','⑤','⑥'][i]}</span><span>${name}</span>
      <span class="caret">${on ? '▾' : '▸'}</span></div>
      ${on ? `<div class="lb ${cls || ''}">${body}</div>` : ''}</div>`;
  };
  let h = `<h4>彼得後書 ${esc(rr)}</h4>
    <p class="xs muted" style="margin:0 0 10px">${v.star ? '★ 重點段落　' : ''}第 ${v.ch} 章</p>
    ${L(1, '和合本', blkCuv(v))}
    ${S.set.grk && v.grk ? L(2, '原文', v.grk, 'grk') : ''}
    ${v.lit ? L(3, '直譯', tagParas(v.lit, 'x|' + v.ch + ':' + v.a + '|lit'), 'lit') : ''}
    ${S.set.grk && v.key ? L(4, '關鍵字', v.key) : ''}
    ${v.gram ? L(5, '文法解析', tagParas(v.gram, 'x|' + v.ch + ':' + v.a + '|gram')) : ''}
    ${v.exp ? L(6, '經文解釋', tagParas(v.exp, 'x|' + v.ch + ':' + v.a + '|exp')) : ''}`;
  const iss = (D.issues || []).filter(x => (x.ch || []).includes(v.ch));
  if (iss.length){ h += `<div class="hr"></div>`;
    iss.forEach(x => h += `<button class="btn" style="margin:0 6px 6px 0" onclick="openIssue('${x.id}')">⚖ ${esc(x.t)} ›</button>`); }
  const prev = BLK[v.ch][v.i - 1], next = BLK[v.ch][v.i + 1];
  h += `<div class="hr"></div><div class="row">
    ${prev ? `<button class="btn" onclick="openV('${v.ch}:${prev.a}')">‹ 上一段</button>` : ''}
    ${next ? `<button class="btn" onclick="openV('${v.ch}:${next.a}')">下一段 ›</button>` : ''}
    <button class="btn" onclick="sayV('${ref}')">🔊 朗讀</button>
    <button class="btn" onclick="askXz(blkPlain('${ref}'))">✨ 問小智</button>
    <button class="btn" onclick="go('course',${v.ch})">整章講義</button></div>`;
  sheet(h);
}
function blkPlain(ref){ const v = VMAP[ref]; if (!v) return '';
  const t = D.txt[v.ch] || []; let c = '';
  for (let i = v.a; i <= v.z; i++) c += (t[i - 1] || '') + ' ';
  return c + '\n' + (v.lit || '').replace(/<[^>]+>/g, ' ') + '\n' + (v.exp || '').replace(/<[^>]+>/g, ' '); }
function sayV(ref){ const v = VMAP[ref]; if (!v) return;
  speak(blkPlain(ref), '羅 ' + v.ch + ':' + v.a); }
function sayMV(n){ const m = meta(n); speak(m.mv.t + '。' + m.mv.r, '本章金句'); }
function tglL(i, ref){ OPENL[i] = OPENL[i] ? 0 : 1; openV(ref); }
