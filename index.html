ατοικῶν ἐν αὐτοῖς ἡμέραν ἐξ ἡμέρας ψυχὴν δικαίαν ἀνόμοις ἔργοις ἐβασάνιζεν·<\/p><\/blockquote>","lit":"<blockquote><p>「又把所多瑪和蛾摩拉的城燒成灰，用傾覆定了它們的罪，立為將來不敬虔之人的鑑戒；又救出了義人羅得——他被那些無法無天之人放蕩的生活磨得疲憊不堪；因為那義人住在他們中間，眼所見、耳所聞，日復一日因他們不法的行為，使自己義的靈魂受折磨。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>焚燒成灰<\/td><td>τεφρώσας<\/td><td>tephrōsas<\/td><td>G5077<\/td><td>τέφρα（灰）<\/td><td>化為灰燼<\/td><td>新約僅此一次<\/td><\/tr><tr><td>鑒戒<\/td><td>ὑπόδειγμα<\/td><td>hypodeigma<\/td><td>G5262<\/td><td>ὑπό＋δείκνυμι<\/td><td>樣本、示範<\/td><td>擺在眼前的樣本；完成式 τεθεικώς：至今仍立著<\/td><\/tr><tr><td>憂傷<\/td><td>καταπονούμενον<\/td><td>kataponoumenon<\/td><td>G2669<\/td><td>κατά＋πονέω<\/td><td>被壓得疲憊<\/td><td>現在分詞：長期被磨<\/td><\/tr><tr><td>惡人<\/td><td>ἀθέσμων<\/td><td>athesmōn<\/td><td>G113<\/td><td>ἀ＋θεσμός（規範）<\/td><td>無法無天的<\/td><td>2:7 與 3:17 兩次，都指不守規範的人<\/td><\/tr><tr><td>搭救<\/td><td>ἐρρύσατο<\/td><td>errysato<\/td><td>G4506<\/td><td>—<\/td><td>拉出來、救出<\/td><td>與 2:9 ῥύεσθαι 同字：羅得是 2:9 的實例<\/td><\/tr><tr><td>住<\/td><td>ἐγκατοικῶν<\/td><td>enkatoikōn<\/td><td>G1460<\/td><td>ἐν＋κατά＋οἰκέω<\/td><td>住在裡面<\/td><td>新約僅此一次；與 3:13「有義居在其中」對照<\/td><\/tr><tr><td>傷痛<\/td><td>ἐβασάνιζεν<\/td><td>ebasanizen<\/td><td>G928<\/td><td>βάσανος（試金石）<\/td><td>折磨、受苦<\/td><td>未完成式：天天如此<\/td><\/tr><\/table>","gram":"<p><strong>① 創世記 19 章的羅得，為甚麼被稱為「義人」？<\/strong><\/p><ul><li><strong>相對的義<\/strong>：比起所多瑪人，他接待客人、保護客人（創 19:1–3）。<\/li><li><strong>被算為義、因憐恤得救<\/strong>：他蒙救是因為亞伯拉罕代求、神記念亞伯拉罕（創 18:23–32；19:29），也因為他遲延時天使拉著他的手（創 19:16）。<\/li><li><strong>承接猶太傳統<\/strong>：所羅門智訓 10:6 已稱羅得為「義人」，彼得沿用讀者熟悉的稱呼。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得自己在 2:8 下了定義：他的義心「天天傷痛」。創 19 章的羅得並不光彩——選了所多瑪、提議把女兒交出去、遲延不走、後來醉酒——彼得沒有否認這些。羅得的「義」不是完美，是一顆沒有被所多瑪磨平的心；而他蒙救的主詞是神，那是恩典。<\/strong><\/p><\/blockquote><p><strong>② ἐβασάνιζεν 的語態<\/strong>：主動語態，主詞是「那義人」，受詞是「義的靈魂」，ἀνόμοις ἔργοις 是工具或原因——字面是「他因不法的事折磨自己義的靈魂」。和合本「他的義心就天天傷痛」把意思譯得很準：痛來自他還在乎。<\/p><p><strong>③ 異文<\/strong>：2:6 SBLGNT 作 ἀσεβέσιν（給不敬虔的人），TR 作 ἀσεβεῖν（將來要行不敬虔的）；意思相近。<\/p>","exp":"<p><strong>義不是完美，是一顆還會傷痛的心。<\/strong><\/p><p>第三個例子是所多瑪和蛾摩拉。兩座城被燒成灰（τεφρώσας），立為「後世不敬虔人的鑒戒」——ὑπόδειγμα 是擺在眼前的樣本，像店門口的樣品，提醒所有經過的人。但同一句話裡，神「只搭救了」羅得。<\/p><p>熟悉創世記的人會皺眉：羅得？他看見平原滋潤就選了所多瑪，在城門口坐上位子，危急時提議把女兒交出去，天使催他時「遲延不走」，最後在山洞裡醉倒。彼得怎能稱他為「義人」，而且一連三次？<\/p><p>彼得的答案在 2:8：「他的義心就天天傷痛。」ἐβασάνιζεν 是未完成式，天天如此；βάσανος 原是試金石，後來指刑具。羅得每天看見、聽見，每天心裡被刺一下。他沒有能力改變那座城，也沒有勇氣離開，但他的心還沒有麻木。在一座把罪當日常的城裡，他是唯一還會痛的人。<\/p><p>而且他蒙救不是因為他夠好。創世記說，他遲延時天使拉著他的手領出城外，神記念了亞伯拉罕。2:7「搭救」的主詞是神——這就是恩典。講台不必把羅得美化成榜樣，也不該嘲笑他；他是住錯了地方、卻仍被主拉出來的人。<\/p><p>落到今天：許多人也住在所多瑪中間——在螢幕裡、在辦公室裡、在飯局上。危險不在於看見，而在於看久了不痛。還會痛，就還有義心；若已經不痛了，求主再把那份痛還給我們。<\/p><p>〔舊約〕創世記講義第 19 章（創 18:16–19:29）。〔猶〕猶 7（猶大書講義尚未製作）。<\/p>"},{"a":9,"z":9,"star":3,"grk":"<blockquote lang=\"grc\"><p>οἶδεν κύριος εὐσεβεῖς ἐκ πειρασμοῦ ῥύεσθαι, ἀδίκους δὲ εἰς ἡμέραν κρίσεως κολαζομένους τηρεῖν,<\/p><\/blockquote>","lit":"<blockquote><p>「那麼，主懂得怎樣把敬虔的人從試煉之中拉出來，也懂得怎樣把不義的人看守在刑罰之下，直到審判的日子；」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>知道<\/td><td>οἶδεν<\/td><td>oiden<\/td><td>G1492<\/td><td>—<\/td><td>知道、懂得<\/td><td>加不定詞＝「懂得怎樣」：不只知道，而且會做<\/td><\/tr><tr><td>主<\/td><td>κύριος<\/td><td>kyrios<\/td><td>G2962<\/td><td>—<\/td><td>主<\/td><td>無冠詞的稱號；搭救的主動權在主，不在我們<\/td><\/tr><tr><td>敬虔的人<\/td><td>εὐσεβεῖς<\/td><td>eusebeis<\/td><td>G2152<\/td><td>εὖ＋σέβομαι<\/td><td>敬虔的<\/td><td>1:3、1:6–7、3:11「虔敬」家族<\/td><\/tr><tr><td>試探<\/td><td>πειρασμοῦ<\/td><td>peirasmou<\/td><td>G3986<\/td><td>πειράζω<\/td><td>試驗、試探<\/td><td>不只是誘惑，也是壓力與困境（挪亞的世代、羅得的城）<\/td><\/tr><tr><td>搭救<\/td><td>ῥύεσθαι<\/td><td>rhyesthai<\/td><td>G4506<\/td><td>—<\/td><td>拉出來、救脫<\/td><td>★全章解經鑰匙：2:7 的實例化成原則；太 6:13「救我們脫離兇惡」同字<\/td><\/tr><tr><td>刑罰<\/td><td>κολαζομένους<\/td><td>kolazomenous<\/td><td>G2849<\/td><td>κόλασις<\/td><td>懲罰<\/td><td>現在被動分詞（見語法）<\/td><\/tr><tr><td>留<\/td><td>τηρεῖν<\/td><td>tērein<\/td><td>G5083<\/td><td>—<\/td><td>看守、保留<\/td><td>2:4、2:17 同字：審判也在主的看守之中<\/td><\/tr><\/table>","gram":"<p><strong>① 全章最長的句子，在這裡落地<\/strong><\/p><p>2:4–10a 是一個條件句：前句（protasis）是三個「若」——若神沒有寬容天使（2:4）、沒有寬容上古世代卻保護挪亞（2:5）、傾覆所多瑪卻搭救羅得（2:6–8）；後句（apodosis）就是 2:9。<strong>審判在條件子句裡，搭救在主要子句裡<\/strong>，而且搭救排在前面。<\/p><p><strong>② οἶδεν ＋不定詞<\/strong>：οἶδα 接不定詞，意思是「懂得怎樣、會做」（太 7:11「你們……尚且知道拿好東西給兒女」同一結構）。<\/p><p><strong>③ κολαζομένους 的時間<\/strong><\/p><ul><li><strong>現在已在刑罰中被看守<\/strong>：不義的人現在就在受罰，直到審判之日（多數新近英譯）。<\/li><li><strong>被保留到審判之日受罰<\/strong>：現在分詞帶未來意義（和合本「留在刑罰之下，等候審判的日子」與許多譯本）。<\/li><\/ul><blockquote><p><strong>最好的理解：文法上兩讀都可能；彼得的重點不是死後的時間表，而是兩種看守都在主手裡——他看守敬虔的人得救，也看守不義的人直到審判，沒有一件事從他手中滑掉。<\/strong><\/p><\/blockquote><p><strong>④ ἐκ πειρασμοῦ<\/strong>：「從試煉之中」救出，而不是「保證不進入試煉」。挪亞在洪水中、羅得在城裡，主把他們從裡面拉出來。<\/p><blockquote><p><strong>最好的理解：2:9 是全卷樞紐：彼得講審判，是為了叫敬虔的人安心，不是為了叫他們害怕。<\/strong><\/p><\/blockquote>","exp":"<p><strong>全章最重的三個審判，原來都是為了講出這一句：「主知道搭救敬虔的人。」<\/strong><\/p><p>讀者被假師傅包圍。他們很成功，跟從的人很多（2:2），審判看起來在睡覺（2:3）。彼得於是從 2:4 起寫了一個很長的句子：若神沒有寬容天使，若神沒有寬容上古的世代卻保護了挪亞，若神傾覆所多瑪卻搭救了羅得——那麼，主知道搭救敬虔的人。三個審判裡藏著兩次搭救；這一長句的終點不是火，是一隻伸出來的手。<\/p><p>οἶδεν 加不定詞，是「懂得怎樣」。主不只是知道你的處境，他懂得怎樣把你拉出來。他拉挪亞用一條船，拉羅得用兩位天使拉著手；方法各不相同，但他都懂。ἐκ πειρασμοῦ 是「從試煉裡面」——不是保證你不進洪水、不住在所多瑪旁邊，而是在裡面的時候把你拉出來；正如「神是信實的……在受試探的時候，總要給你們開一條出路」（林前 10:13）。ῥύομαι 正是主禱文「救我們脫離兇惡」的那個字。<\/p><p>老彼得寫「主知道」，不能不想起加利利海邊。三次不認主之後，他對復活的主說：「主啊，你是無所不知的；你知道我愛你。」（約 21:17）一個自己靠不住的人，被一位「知道」的主拉了回來。所以這一節不是彼得多堅強的見證，是主多恆久忍耐的見證。<\/p><p>這就決定了第 2 章怎麼讀：審判的經文不是用來嚇人的，是用來叫敬虔的人安心的。今天若你被困在不義的人很得勢的地方，這一節不是叫你去算計誰會受罰，而是叫你把眼睛從他們身上移回主身上。搭救是主的事，審判也是主的事；我們的本位是敬虔。321 說謙卑是放下權力回到本位——讓神作神：他審判，他搭救，我們只管跟著他走。<\/p><p>〔背景〕彼得的回頭（路 22:31–32；約 21:15–17）。〔彼前〕彼得前書講義第 5 章（5:10 必要親自堅固你們）。<\/p>"},{"a":10,"z":11,"star":2,"grk":"<blockquote lang=\"grc\"><p>μάλιστα δὲ τοὺς ὀπίσω σαρκὸς ἐν ἐπιθυμίᾳ μιασμοῦ πορευομένους καὶ κυριότητος καταφρονοῦντας. Τολμηταὶ αὐθάδεις, δόξας οὐ τρέμουσιν βλασφημοῦντες, ὅπου ἄγγελοι ἰσχύϊ καὶ δυνάμει μείζονες ὄντες οὐ φέρουσιν κατ’ αὐτῶν παρὰ κυρίῳ βλάσφημον κρίσιν.<\/p><\/blockquote>","lit":"<blockquote><p>「尤其是那些跟在肉體後面、在污穢的私慾中行走、又藐視主權的人。他們膽大妄為、自以為是，毀謗那些榮耀者也不戰兢；然而天使雖然在力量和能力上更大，也不在主面前帶著毀謗的判詞控告他們。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>污穢<\/td><td>μιασμοῦ<\/td><td>miasmou<\/td><td>G3394<\/td><td>μιαίνω<\/td><td>玷污<\/td><td>新約僅此一次<\/td><\/tr><tr><td>主治的<\/td><td>κυριότητος<\/td><td>kyriotētos<\/td><td>G2963<\/td><td>κύριος<\/td><td>主權、統治<\/td><td>單數抽象名詞（見語法）<\/td><\/tr><tr><td>輕慢<\/td><td>καταφρονοῦντας<\/td><td>kataphronountas<\/td><td>G2706<\/td><td>κατά＋φρονέω<\/td><td>看不起<\/td><td>往下看：把權柄踩在腳下<\/td><\/tr><tr><td>膽大<\/td><td>τολμηταί<\/td><td>tolmētai<\/td><td>G5113<\/td><td>τολμάω<\/td><td>膽大妄為的人<\/td><td>新約僅此一次<\/td><\/tr><tr><td>任性<\/td><td>αὐθάδεις<\/td><td>authadeis<\/td><td>G829<\/td><td>αὐτός＋ἁνδάνω（取悅）<\/td><td>自我取悅、剛愎<\/td><td>「有己」的希臘字；多 1:7 監督「不任性」同字<\/td><\/tr><tr><td>在尊位的<\/td><td>δόξας<\/td><td>doxas<\/td><td>G1391<\/td><td>—<\/td><td>榮耀、榮耀者<\/td><td>複數：天上的榮耀者（見語法）<\/td><\/tr><tr><td>毀謗的<\/td><td>βλάσφημον<\/td><td>blasphēmon<\/td><td>G989<\/td><td>—<\/td><td>毀謗的<\/td><td>天使不帶「毀謗的判詞」<\/td><\/tr><\/table>","gram":"<p><strong>① κυριότητος——「主治的」是誰的權柄？<\/strong><\/p><ul><li><strong>主（神或基督）的主權<\/strong>：單數抽象名詞，呼應 2:1「連買他們的主他們也不承認」與 2:1 的 δεσπότης。<\/li><li><strong>天上的權勢<\/strong>：弗 1:21、西 1:16 的 κυριότης 是天使的等級之一。<\/li><li><strong>人間的權柄<\/strong>：教會領袖或政府。<\/li><\/ul><blockquote><p><strong>最好的理解：主的主權。單數、抽象，又緊接著 2:1 的「主」；「輕慢主治的」就是把主踩在腳下。這不是一節替人間權威護航的經文。<\/strong><\/p><\/blockquote><p><strong>② δόξας——「在尊位的」是誰？<\/strong><\/p><ul><li><strong>天上的榮耀者（天使，可能是墮落的）<\/strong>：2:11 的「他們」最自然回指 δόξας；猶 8–9 的平行經文中，天使長米迦勒與魔鬼爭辯時，不敢用毀謗的話罪責他。<\/li><li><strong>教會或社會的領袖<\/strong>：以「榮耀」形容有地位的人。<\/li><\/ul><blockquote><p><strong>最好的理解：天上的榮耀者。假師傅隨口毀謗他們不懂的屬靈世界（2:12），連天使都不敢這樣做；天使把審判交給主（παρὰ κυρίῳ）。<\/strong><\/p><\/blockquote><p><strong>③ 誰被定罪？<\/strong>第 2 章被定罪的正是「師傅」——有講台、有跟從者、在上位的人（2:1–3）。所以 2:10 不能拿來堵住對領袖的正當質疑；彼得給長老的命令是「不是轄制」（彼前 5:3）。<\/p><p><strong>④ 異文<\/strong>：2:11 末尾有 παρὰ κυρίῳ（在主面前）、παρὰ κυρίου（從主而來）與省略三種讀法；和合本「在主面前」。<\/p>","exp":"<p><strong>「任性」這個字，就是「有己」的希臘文。<\/strong><\/p><p>2:10 把 2:9「不義的人」具體化成兩件事：隨從肉身的污穢情慾，輕慢主治的。接著彼得給了一幅畫像：τολμηταὶ αὐθάδεις——膽大、任性。τολμητής 是膽大到不知分寸；αὐθάδης 由「自己」和「取悅」組成，是以取悅自己為生活準繩的人。保羅要求監督「不任性」（多 1:7）用的就是這個字：最危險的任性，常常出現在有講台的人身上。<\/p><p>他們毀謗「在尊位的」——最自然的讀法是天上的榮耀者。2:11 立刻對照：天使力量權能更大，也不在主面前用毀謗的話控告他們。猶大書記載米迦勒與魔鬼爭辯時，也只說「主責備你吧」。天使比假師傅強得多，卻把審判留給主；假師傅比天使弱得多，卻隨口宣判他們不懂的屬靈世界。這就是驕傲：離開本位，抓住只屬於神的審判權。<\/p><p>這兩節常被誤用成：「你質疑牧師，就是輕慢主治的。」這不是經文的意思。第一，「主治的」最自然指主的權柄；第二，這一章被定罪的正是「師傅」——有講台、有跟從者的人。彼得給長老的命令是：「也不是轄制所託付你們的，乃是作群羊的榜樣」（彼前 5:3）。照真理、在愛中、按程序提出的質疑，不是毀謗；拒絕一切質疑的領袖，倒要先用 2:10 照照自己。<\/p><p>落到今天：任性先照自己——我在哪裡只取悅自己？我在哪裡急著替神宣判別人？無己戰勝撒但：天使把審判交給主，我們也可以把那句想定人罪的話，交回主手裡。<\/p><p>〔猶〕猶 8–10（猶大書講義尚未製作）。〔彼前〕彼得前書講義第 5 章（5:3 不是轄制）。<\/p>"},{"a":12,"z":14,"star":1,"grk":"<blockquote lang=\"grc\"><p>Οὗτοι δέ, ὡς ἄλογα ζῷα γεγεννημένα φυσικὰ εἰς ἅλωσιν καὶ φθοράν, ἐν οἷς ἀγνοοῦσιν βλασφημοῦντες, ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται, ἀδικούμενοι μισθὸν ἀδικίας· ἡδονὴν ἡγούμενοι τὴν ἐν ἡμέρᾳ τρυφήν, σπίλοι καὶ μῶμοι ἐντρυφῶντες ἐν ταῖς ἀπάταις αὐτῶν συνευωχούμενοι ὑμῖν, ὀφθαλμοὺς ἔχοντες μεστοὺς μοιχαλίδος καὶ ἀκαταπαύστους ἁμαρτίας, δελεάζοντες ψυχὰς ἀστηρίκτους, καρδίαν γεγυμνασμένην πλεονεξίας ἔχοντες, κατάρας τέκνα·<\/p><\/blockquote>","lit":"<blockquote><p>「但這些人像沒有理性的動物，生來只憑本能，為了被捉、被宰；他們毀謗自己所不明白的事，也必在那樣的敗壞中一同敗壞，受虧損作為不義的工價。他們以白晝的奢華為享樂；他們是污點和瑕疵，與你們一同宴飲時，以他們的詭詐（或：愛筵）為樂；眼睛滿了淫婦，止不住犯罪；向不堅固的靈魂下餌；心被操練慣了貪婪；是被咒詛的兒女。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>沒有靈性<\/td><td>ἄλογα<\/td><td>aloga<\/td><td>G249<\/td><td>ἀ＋λόγος<\/td><td>沒有理性的<\/td><td>與 2:16 驢「以人言」說話成強烈對照<\/td><\/tr><tr><td>敗壞<\/td><td>φθορᾷ<\/td><td>phthora<\/td><td>G5356<\/td><td>φθείρω<\/td><td>敗壞、毀滅<\/td><td>1:4、2:19 同一條線<\/td><\/tr><tr><td>詭詐<\/td><td>ἀπάταις<\/td><td>apatais<\/td><td>G539<\/td><td>ἀπατάω<\/td><td>欺騙<\/td><td>異文 ἀγάπαις（愛筵）<\/td><\/tr><tr><td>一同坐席<\/td><td>συνευωχούμενοι<\/td><td>syneuōchoumenoi<\/td><td>G4910<\/td><td>σύν＋εὐωχέω<\/td><td>一起宴飲<\/td><td>他們就坐在教會的桌邊<\/td><\/tr><tr><td>止不住<\/td><td>ἀκαταπαύστους<\/td><td>akatapaustous<\/td><td>G180<\/td><td>ἀ＋καταπαύω<\/td><td>停不下來的<\/td><td>新約僅此一次<\/td><\/tr><tr><td>引誘<\/td><td>δελεάζοντες<\/td><td>deleazontes<\/td><td>G1185<\/td><td>δέλεαρ（餌）<\/td><td>下餌<\/td><td>漁夫的字；雅 1:14 同字<\/td><\/tr><tr><td>心不堅固<\/td><td>ἀστηρίκτους<\/td><td>astēriktous<\/td><td>G793<\/td><td>ἀ＋στηρίζω<\/td><td>沒有扎穩的<\/td><td>主交給彼得「堅固」（路 22:32）的反面<\/td><\/tr><tr><td>習慣了<\/td><td>γεγυμνασμένην<\/td><td>gegymnasmenēn<\/td><td>G1128<\/td><td>γυμνάζω<\/td><td>操練過的<\/td><td>完成式：心被訓練成貪婪<\/td><\/tr><\/table>","gram":"<p><strong>① 異文 ἀπάταις／ἀγάπαις<\/strong><\/p><ul><li><strong>ἀπάταις（詭詐）<\/strong>：SBLGNT 與多數抄本；和合本「以行詭詐為快樂」。<\/li><li><strong>ἀγάπαις（愛筵）<\/strong>：部分古抄本，與猶 12「愛席」平行。<\/li><\/ul><blockquote><p><strong>最好的理解：原文作「詭詐」，但場景確實是愛筵——συνευωχούμενοι ὑμῖν「與你們一同坐席」。兩個字在大楷抄本裡寫法極近（ΑΠΑΤΑΙΣ／ΑΓΑΠΑΙΣ），諷刺正在這裡：他們在愛的筵席上行詭詐。<\/strong><\/p><\/blockquote><p><strong>② ἐν τῇ φθορᾷ αὐτῶν καὶ φθαρήσονται——「他們的敗壞」指誰？<\/strong><\/p><ul><li><strong>回指動物<\/strong>：「像那些動物被毀滅一樣，他們也要被毀滅」（多數新近英譯）。<\/li><li><strong>指他們自己的敗壞<\/strong>：「在自己的敗壞中被毀」；和合本「正在敗壞人的時候，自己必遭遇敗壞」偏向這一讀。<\/li><\/ul><blockquote><p><strong>最好的理解：文法上回指動物最自然，但兩讀落點相同：活在敗壞裡的人，最後被敗壞吞掉。<\/strong><\/p><\/blockquote><p><strong>③ 文字遊戲<\/strong>：ἀδικούμενοι μισθὸν ἀδικίας——同一字根重複，「受不義之害，作為不義的工價」；TR 作 κομιούμενοι（將得到）。<\/p>","exp":"<p><strong>漁夫出身的彼得，一眼就認得出「下餌」。<\/strong><\/p><p>這三節是一連串快速的畫像，一筆接一筆：像沒有理性的畜類；白晝宴樂——放縱連夜裡都不必等；污點和瑕疵；眼裡滿了淫色；停不下來的罪；被咒詛的種類。最令人不安的是一個細節：「正與你們一同坐席」。他們不在教會外面，就坐在教會的愛筵桌邊。<\/p><p>δελεάζω 是下餌的字。彼得與安得烈當年在加利利海撒網，主對他們說：「我要叫你們得人如得魚一樣。」現在老彼得看見另一種「得人」：用餌釣人。餌下給誰？ψυχὰς ἀστηρίκτους——沒有扎穩的人。那一夜主對彼得說：「你回頭以後，要堅固你的弟兄。」（路 22:32）假師傅專找沒有被堅固的人下手。這說明了教會為甚麼必須做「堅固人」的事：門訓、陪伴、在真道上扎根，不是額外的節目，是保護。<\/p><p>γεγυμνασμένην 是完成式的「操練」——體育館（gymnasium）的那個字。貪婪不是一時失手，是天天練出來的心；反過來，敬虔也是練出來的（提前 4:7「在敬虔上操練自己」）。至於 ἄλογα ζῷα：他們自以為有高深的屬靈知識，毀謗所不曉得的事，其實像畜類一樣順著本能活——下一段，一頭真正的畜類反而說出了人話。<\/p><p>落到今天：這段不是叫我們去找「誰是下餌的人」，而是問兩件事。我的心這些年在操練甚麼？我身邊有沒有一位還沒扎穩的人，需要我去陪他、堅固他——那就是 920 裡我的那個「2」。<\/p><p>〔背景〕得人如得魚（太 4:18–20）；要堅固你的弟兄（路 22:32）。〔猶〕猶 10、12（猶大書講義尚未製作）。<\/p>"},{"a":15,"z":16,"star":1,"grk":"<blockquote lang=\"grc\"><p>καταλείποντες εὐθεῖαν ὁδὸν ἐπλανήθησαν, ἐξακολουθήσαντες τῇ ὁδῷ τοῦ Βαλαὰμ τοῦ Βοσόρ, ὃς μισθὸν ἀδικίας ἠγάπησεν, ἔλεγξιν δὲ ἔσχεν ἰδίας παρανομίας· ὑποζύγιον ἄφωνον ἐν ἀνθρώπου φωνῇ φθεγξάμενον ἐκώλυσεν τὴν τοῦ προφήτου παραφρονίαν.<\/p><\/blockquote>","lit":"<blockquote><p>「他們撇下正直的路就走迷了，緊跟著波梭珥（和合本：比珥）之子巴蘭的路——他愛了不義的工價，卻因自己的違法受了揭穿：一頭不會說話的負軛牲口，用人的聲音發聲，攔阻了先知的瘋狂。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>離棄<\/td><td>καταλείποντες<\/td><td>kataleipontes<\/td><td>G2641<\/td><td>κατά＋λείπω<\/td><td>撇下<\/td><td>正路是被撇下的，不是不小心掉的<\/td><\/tr><tr><td>走差<\/td><td>ἐπλανήθησαν<\/td><td>eplanēthēsan<\/td><td>G4105<\/td><td>πλάνη<\/td><td>迷路、被帶偏<\/td><td>3:17「惡人的錯謬」同字根<\/td><\/tr><tr><td>比珥<\/td><td>Βοσόρ<\/td><td>Bosor<\/td><td>G1007<\/td><td>—<\/td><td>波梭珥<\/td><td>SBLGNT 作 Βοσόρ；民 22:5 七十士譯本作 Βεώρ<\/td><\/tr><tr><td>工價<\/td><td>μισθόν<\/td><td>misthon<\/td><td>G3408<\/td><td>—<\/td><td>工錢、酬報<\/td><td>2:13、2:15 重複：不義的工價<\/td><\/tr><tr><td>責備<\/td><td>ἔλεγξιν<\/td><td>elenxin<\/td><td>G1649<\/td><td>ἐλέγχω<\/td><td>揭穿、責備<\/td><td>新約僅此一次<\/td><\/tr><tr><td>驢<\/td><td>ὑποζύγιον<\/td><td>hypozygion<\/td><td>G5268<\/td><td>ὑπό＋ζυγός<\/td><td>負軛的牲口<\/td><td>在軛下的牲口，反而比先知清醒<\/td><\/tr><tr><td>狂妄<\/td><td>παραφρονίαν<\/td><td>paraphronian<\/td><td>G3913<\/td><td>παρά＋φρήν<\/td><td>失去理智<\/td><td>新約僅此一次<\/td><\/tr><\/table>","gram":"<p><strong>① Βοσόρ 與 Βεώρ<\/strong><\/p><ul><li><strong>音變<\/strong>：有人認為反映某種口音（喉音轉讀），同一個名字的另一種拼法。<\/li><li><strong>文字遊戲<\/strong>：有人推測 Βοσόρ 與希伯來文 בָּשָׂר（肉體）諧音——「肉體之子」，呼應 2:10「隨肉身」。這只是推測。<\/li><li><strong>抄本混合<\/strong>：少數抄本作 Βεωρσόρ，可見抄寫者也在兩種拼法間猶豫。<\/li><\/ul><blockquote><p><strong>最好的理解：指的是同一個人——民 22:5「比珥的兒子巴蘭」。和合本照民數記譯作「比珥」是合宜的；不必在拼法上建立任何教義。<\/strong><\/p><\/blockquote><p><strong>② 驢說人話——怎樣讀？<\/strong><\/p><ul><li><strong>歷史中的神蹟<\/strong>：民數記與彼得都當真事記載。<\/li><li><strong>異象或內在經驗<\/strong>：巴蘭在異象中「聽見」驢說話。<\/li><\/ul><blockquote><p><strong>最好的理解：彼得照民數記的記載接受它；而他的重點是諷刺——自以為有屬靈知識的人「好像沒有靈性、生來就是畜類」（2:12），不會說話的畜類卻用人言說出理性的話。<\/strong><\/p><\/blockquote><p><strong>③ 路的意象<\/strong>：ὁδός 在本章出現四次——「真道」（2:2）、「正路」與「巴蘭的路」（2:15）、「義路」（2:21）。第 2 章是一張路線圖。<\/p>","exp":"<p><strong>神可以用一頭驢，攔住一個被錢沖昏頭的先知。<\/strong><\/p><p>彼得從畫像轉到一個舊約人物：巴蘭。摩押王巴勒用重金請他來咒詛以色列。巴蘭口裡說，只照神的話說；心裡卻一直放不下那份酬報。民數記後來記載，以色列人在毘珥的事上得罪耶和華，正是出於巴蘭的計謀；啟示錄也說他「教導巴勒將絆腳石放在以色列人面前」。愛錢，加上引誘人犯淫亂——正好是 2:14 假師傅的兩個記號。彼得說他們「離棄正路」——καταλείπω 是撇下，正路不是不小心掉的，是自己撇下的。<\/p><p>接著是全章最幽默的一筆：「那不能說話的驢以人言攔阻先知的狂妄。」巴蘭騎著驢去赴那份工價，路上三次被耶和華的使者攔住；先知看不見，驢看見了。他打了驢三次，直到驢開口說話。彼得的對照很尖銳：2:12 說假師傅「好像沒有靈性、生來就是畜類」，這裡卻是一頭畜類說出了理性的話。被錢沖昏頭的人，比一頭驢還不清醒。<\/p><p>這一段沒有讓巴蘭有好結局；但它讓我們看見，神在人走向滅亡的路上，一次又一次地攔阻——用使者、用驢、用一扇關上的門。<\/p><p>落到今天：神今天的「驢」，可能是一位你看不起的人說的一句話、一個一再受阻的計畫、一份一直談不成的利益。巴蘭三次打驢，不知道驢救了他的命。當你被攔住時，先別急著打驢，先問：我是不是正往「不義的工價」那裡走？<\/p><p>〔舊約〕民數記講義第 22–24 章（民 22:21–35；31:16）。〔猶〕猶 11（猶大書講義尚未製作）。<\/p>"},{"a":17,"z":17,"star":2,"grk":"<blockquote lang=\"grc\"><p>Οὗτοί εἰσιν πηγαὶ ἄνυδροι καὶ ὁμίχλαι ὑπὸ λαίλαπος ἐλαυνόμεναι, οἷς ὁ ζόφος τοῦ σκότους τετήρηται.<\/p><\/blockquote>","lit":"<blockquote><p>「這些人是沒有水的泉源，是被暴風驅趕的霧氣；為他們存留的，是黑暗中的幽暗。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>井<\/td><td>πηγαί<\/td><td>pēgai<\/td><td>G4077<\/td><td>—<\/td><td>泉源、水泉<\/td><td>不是蓄水的池，是本該自己湧出水的泉<\/td><\/tr><tr><td>無水的<\/td><td>ἄνυδροι<\/td><td>anydroi<\/td><td>G504<\/td><td>ἀ＋ὕδωρ<\/td><td>沒有水的<\/td><td>太 12:43「無水之地」同字<\/td><\/tr><tr><td>霧氣<\/td><td>ὁμίχλαι<\/td><td>homichlai<\/td><td>G3658<\/td><td>—<\/td><td>薄霧<\/td><td>新約僅此一次；看似有雨，一吹就散<\/td><\/tr><tr><td>狂風<\/td><td>λαίλαπος<\/td><td>lailapos<\/td><td>G2978<\/td><td>—<\/td><td>暴風<\/td><td>可 4:37 加利利海上的「暴風」同字<\/td><\/tr><tr><td>催逼<\/td><td>ἐλαυνόμεναι<\/td><td>elaunomenai<\/td><td>G1643<\/td><td>—<\/td><td>被驅趕<\/td><td>被動：自稱自由的人，其實被風趕著走<\/td><\/tr><tr><td>幽暗<\/td><td>ζόφος<\/td><td>zophos<\/td><td>G2217<\/td><td>—<\/td><td>陰沉的幽暗<\/td><td>2:4 拘禁天使的同一個字<\/td><\/tr><tr><td>存留<\/td><td>τετήρηται<\/td><td>tetērētai<\/td><td>G5083<\/td><td>—<\/td><td>保留、看守<\/td><td>完成式：已經存放好了<\/td><\/tr><\/table>","gram":"<p><strong>① 異文<\/strong>：TR 作 νεφέλαι（雲彩），並在句末加 εἰς αἰῶνα（直到永遠）；SBLGNT 作 ὁμίχλαι（霧氣），無 εἰς αἰῶνα。和合本「霧氣」「存留」跟 SBLGNT 一讀。猶 12–13 用的是「沒有雨的雲彩」與「永遠存留」，TR 的讀法可能受猶大書影響。<\/p><p><strong>② πηγή 是「井」還是「泉」？<\/strong><\/p><ul><li><strong>井<\/strong>：和合本的譯法，中文讀者最直接的畫面——一口挖下去卻沒有水的井。<\/li><li><strong>泉<\/strong>：πηγή 通常指自然湧出的泉源（約 4:14「泉源」同字），不是人挖的蓄水處。<\/li><\/ul><blockquote><p><strong>最好的理解：「無水的泉」——本該是源頭的地方沒有水。假師傅最大的問題，是佔據了「源頭」的位置：人來找他們要水，他們給不出水。和合本的「井」保留了乾涸與失望的畫面，講台可沿用。<\/strong><\/p><\/blockquote><p><strong>③ 兩個比喻的動詞<\/strong>：泉是靜的、霧是動的；一個應許了卻沒有，一個看似有卻被吹散。兩個都是「看起來有，其實沒有」。<\/p>","exp":"<p><strong>口渴的人遠遠看見泉源，走到跟前卻是乾的——這比沒有泉更殘酷。<\/strong><\/p><p>這是本章的章題。在巴勒斯坦乾旱的山地，泉源就是命；旅人照著記憶走了一整天，到了泉邊卻只見乾裂的石頭。神曾藉耶利米說：「我的百姓做了兩件惡事：就是離棄我這活水的泉源，為自己鑿出池子，是破裂不能存水的池子。」假師傅就是這樣的泉：他們佔據了源頭的位置，人來找他們要水，他們給不出水。<\/p><p>第二個比喻是霧。夏天的早晨有霧，看起來要下雨了，太陽一出、風一吹，就散了。λαῖλαψ 這個字，彼得很熟悉——那一夜在加利利海上起了暴風，船幾乎滿了水，主起來斥責風，風就止住了。被暴風催逼著跑的霧，沒有一位能叫風平靜的主。這也預告了 2:19：他們應許人自由，自己卻是被風趕著走的。<\/p><p>「有墨黑的幽暗為他們存留」——τετήρηται 是完成式，已經存好了；與 2:4 天使的「幽暗」、2:9 主的「看守」用同一組字。乾井的結局不是由誰去揭發，是主早已看守著。<\/p><p>但記得：「井」是本章的篇名，不是本章的終點。篇名指出問題，2:9 給出盼望。面對乾井，出路不是去找一口更大、更有名的井，而是回到那一位：「人若喝我所賜的水就永遠不渴。我所賜的水要在他裡頭成為泉源，直湧到永生。」（約 4:14）也問自己：我帶給身邊的人的，是水，還是霧？<\/p><p>〔背景〕加利利海上的暴風（可 4:35–41）。〔猶〕猶 12–13（猶大書講義尚未製作）。<\/p>"},{"a":18,"z":19,"star":2,"grk":"<blockquote lang=\"grc\"><p>ὑπέρογκα γὰρ ματαιότητος φθεγγόμενοι δελεάζουσιν ἐν ἐπιθυμίαις σαρκὸς ἀσελγείαις τοὺς ὀλίγως ἀποφεύγοντας τοὺς ἐν πλάνῃ ἀναστρεφομένους, ἐλευθερίαν αὐτοῖς ἐπαγγελλόμενοι, αὐτοὶ δοῦλοι ὑπάρχοντες τῆς φθορᾶς· ᾧ γάρ τις ἥττηται, τούτῳ δεδούλωται.<\/p><\/blockquote>","lit":"<blockquote><p>「因為他們發出虛空而浮腫的大話，用肉體的私慾、用放蕩，向那些剛剛逃離活在錯謬中之人的人下餌；應許他們自由，自己卻是敗壞的奴隸——因為人被甚麼打敗，就作了甚麼的奴隸。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>矜誇的大話<\/td><td>ὑπέρογκα<\/td><td>hyperonka<\/td><td>G5246<\/td><td>ὑπέρ＋ὄγκος（體積）<\/td><td>膨脹過度的<\/td><td>腫起來的話：很大，但是空<\/td><\/tr><tr><td>虛妄<\/td><td>ματαιότητος<\/td><td>mataiotētos<\/td><td>G3153<\/td><td>μάταιος<\/td><td>虛空<\/td><td>羅 8:20「虛空」同字<\/td><\/tr><tr><td>剛才<\/td><td>ὀλίγως<\/td><td>oligōs<\/td><td>G3641<\/td><td>ὀλίγος<\/td><td>才剛、稍稍<\/td><td>新約僅此一次；TR 作 ὄντως（確實）<\/td><\/tr><tr><td>自由<\/td><td>ἐλευθερίαν<\/td><td>eleutherian<\/td><td>G1657<\/td><td>ἐλεύθερος<\/td><td>自由<\/td><td>彼前 2:16 同字<\/td><\/tr><tr><td>應許<\/td><td>ἐπαγγελλόμενοι<\/td><td>epangellomenoi<\/td><td>G1861<\/td><td>ἐπί＋ἀγγέλλω<\/td><td>應許<\/td><td>1:4 神的「應許」同字根：假應許對真應許<\/td><\/tr><tr><td>奴僕<\/td><td>δοῦλοι<\/td><td>douloi<\/td><td>G1401<\/td><td>—<\/td><td>奴隸<\/td><td>1:1 彼得自稱「耶穌基督僕人」同字<\/td><\/tr><tr><td>制伏<\/td><td>ἥττηται<\/td><td>hēttētai<\/td><td>G2274<\/td><td>ἥσσων（較弱的）<\/td><td>被打敗<\/td><td>完成式：仗打輸了，結果延續<\/td><\/tr><tr><td>作奴僕<\/td><td>δεδούλωται<\/td><td>dedoulōtai<\/td><td>G1402<\/td><td>δοῦλος<\/td><td>被奴役<\/td><td>完成式：成了奴隸，至今仍是<\/td><\/tr><\/table>","gram":"<p><strong>① 他們應許的「自由」是甚麼？<\/strong><\/p><ul><li><strong>道德上的放縱<\/strong>：在恩典之下甚麼都可以做——可能扭曲了保羅的自由教導（參 3:16「強解」；彼前 2:16「不可藉著自由遮蓋惡毒」）。<\/li><li><strong>免於審判的自由<\/strong>：主不會再來、沒有審判（3:4），所以不必向誰交賬。<\/li><li><strong>脫離「宗教束縛」<\/strong>：擺脫規條與群體的約束。<\/li><\/ul><blockquote><p><strong>最好的理解：前兩者連在一起——否認審判（3:4）就拆掉了約束，放縱是它的果子。真正的自由在 1:4：「脫離世上從情慾來的敗壞」；假師傅應許的「自由」，正是要把人帶回那個敗壞。<\/strong><\/p><\/blockquote><p><strong>② ᾧ γάρ τις ἥττηται, τούτῳ δεδούλωται<\/strong>：戰爭的語言——古代戰敗者成為戰勝者的奴隸。兩個完成式說出一個持續的狀態。TR 作 τούτῳ καὶ δεδούλωται，意思相同。<\/p><p><strong>③ 受害者<\/strong>：τοὺς ὀλίγως ἀποφεύγοντας——「才剛逃出來」的人，是初信者或剛離開舊生活的人。和合本「剛才脫離妄行的人」跟 ὀλίγως 一讀。<\/p>","exp":"<p><strong>自己作主的人，最後被別的東西作主。<\/strong><\/p><p>2:18 寫出他們的方法：說的話很大、很響——ὑπέρογκα 是「腫起來的」——但裡面是 ματαιότης，空的。對象呢？「那些剛才脫離妄行的人」——初信者、剛離開舊生活、還沒站穩的人。用的餌，是他們剛剛逃出來的那個東西：肉身的情慾。<\/p><p>2:19 寫出最有吸引力的那句話：「你自由了。」彼得只用一句格言就拆穿它：「人被誰制伏就是誰的奴僕。」ἡττάομαι 是打敗仗；古代戰敗的人成為戰勝者的奴隸。他們以為自己戰勝了規條，其實是被情慾打敗。主耶穌早就說過：「所有犯罪的就是罪的奴僕」；「天父的兒子若叫你們自由，你們就真自由了」（約 8:34、36）。<\/p><p>彼得在 1:1 自稱「耶穌基督僕人」，用的正是 δοῦλος。全卷只有兩種奴僕：作基督的僕人，或作敗壞的奴僕；沒有第三種「誰的僕人都不作」。φθορά 這條線也在這裡收緊：1:4 神要救我們「脫離世上從情慾來的敗壞」，2:19 假師傅卻把人帶回同一個敗壞。假的應許與真的應許，用的是同一個字根。<\/p><p>落到今天：2:10 的「任性」，在 2:19 看見了結局——舊人有己，要自己作主作王，結果被別的東西作了主。問自己：哪一件事我說「我可以控制」，其實已經在控制我？自由不是沒有主人，是有一位好主人。讓耶穌作王，才是自由。<\/p><p>〔彼前〕彼得前書講義第 2 章（2:16 作神的僕人）。〔猶〕猶 16（猶大書講義尚未製作）。<\/p>"},{"a":20,"z":22,"star":2,"grk":"<blockquote lang=\"grc\"><p>εἰ γὰρ ἀποφυγόντες τὰ μιάσματα τοῦ κόσμου ἐν ἐπιγνώσει τοῦ κυρίου καὶ σωτῆρος Ἰησοῦ Χριστοῦ, τούτοις δὲ πάλιν ἐμπλακέντες ἡττῶνται, γέγονεν αὐτοῖς τὰ ἔσχατα χείρονα τῶν πρώτων. κρεῖττον γὰρ ἦν αὐτοῖς μὴ ἐπεγνωκέναι τὴν ὁδὸν τῆς δικαιοσύνης ἢ ἐπιγνοῦσιν ὑποστρέψαι ἐκ τῆς παραδοθείσης αὐτοῖς ἁγίας ἐντολῆς. συμβέβηκεν αὐτοῖς τὸ τῆς ἀληθοῦς παροιμίας· Κύων ἐπιστρέψας ἐπὶ τὸ ἴδιον ἐξέραμα, καί· Ὗς λουσαμένη εἰς κυλισμὸν βορβόρου.<\/p><\/blockquote>","lit":"<blockquote><p>「因為他們若藉著認識主和救主耶穌基督，已經逃離了世界的污穢，後來又被這些纏住而被打敗，他們末後的光景就比起初更壞了。因為認識了義的道路，又從傳給他們的聖潔命令轉回去，倒不如從來沒有認識過。那句真實的俗語在他們身上應驗了：「狗轉回到自己所吐的東西那裡」，又：「母豬洗了澡，又到泥漿裡打滾。」」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>污穢<\/td><td>μιάσματα<\/td><td>miasmata<\/td><td>G3393<\/td><td>μιαίνω<\/td><td>污染之物<\/td><td>新約僅此一次<\/td><\/tr><tr><td>認識<\/td><td>ἐπιγνώσει<\/td><td>epignōsei<\/td><td>G1922<\/td><td>ἐπί＋γινώσκω<\/td><td>認識<\/td><td>全卷主題字；在這裡顯出「知道不等於長進」<\/td><\/tr><tr><td>纏住<\/td><td>ἐμπλακέντες<\/td><td>emplakentes<\/td><td>G1707<\/td><td>ἐν＋πλέκω（編織）<\/td><td>被纏進去<\/td><td>像魚被網纏住<\/td><\/tr><tr><td>更不好<\/td><td>χείρονα<\/td><td>cheirona<\/td><td>G5501<\/td><td>—<\/td><td>更壞的<\/td><td>太 12:45「末後的景況比先前更不好了」幾乎同句<\/td><\/tr><tr><td>背棄<\/td><td>ὑποστρέψαι<\/td><td>hypostrepsai<\/td><td>G5290<\/td><td>ὑπό＋στρέφω<\/td><td>轉回去<\/td><td>TR 作 ἐπιστρέψαι<\/td><\/tr><tr><td>轉過來<\/td><td>ἐπιστρέψας<\/td><td>epistrepsas<\/td><td>G1994<\/td><td>ἐπί＋στρέφω<\/td><td>回轉<\/td><td>與路 22:32「你回頭以後」同一個分詞<\/td><\/tr><tr><td>洗淨<\/td><td>λουσαμένη<\/td><td>lousamenē<\/td><td>G3068<\/td><td>—<\/td><td>洗澡<\/td><td>中間語態：外面洗了，本性沒變<\/td><\/tr><tr><td>滾<\/td><td>κυλισμόν<\/td><td>kylismon<\/td><td>G2946<\/td><td>κυλίω<\/td><td>打滾<\/td><td>新約僅此一次<\/td><\/tr><\/table>","gram":"<p><strong>① 「他們」是誰？<\/strong>2:20 的 γάρ 接著 2:19 的 αὐτοί——應許人自由、自己卻作奴僕的假師傅；也包括完全跟從他們、同樣轉背的人。上下文 2:17–19 一路在講假師傅。<\/p><p><strong>② 這些人失去救恩了嗎？三種讀法並陳<\/strong><\/p><ul><li><strong>真信徒可以失落救恩<\/strong>（阿米念傳統）：「認識主救主」「脫離世上的污穢」描述的是真實的得救經歷，後來背棄，就失去了。<\/li><li><strong>他們從未真正重生<\/strong>（加爾文傳統）：2:22 的比喻正是說本性沒有改變——狗回頭了還是狗，豬洗乾淨了還是豬；他們有過外面的洗淨與知識，沒有新的生命。<\/li><li><strong>警告是神保守信徒的工具<\/strong>（許多福音派）：警告是真的，神正是藉著這樣的警告，保守他的人不從堅固的地步上墜落（3:17）。<\/li><\/ul><blockquote><p><strong>最好的理解：上下文描述的是假師傅與跟從他們轉背的人，不是在掙扎中跌倒、仍然想回頭的弟兄姊妹。三種讀法都同意：警告是真實的，出路是回到主面前。本講義不用這段經文對任何個人宣判；跌倒的人要同時聽見 1:9 與 3:9。<\/strong><\/p><\/blockquote><p><strong>③ 兩種「回轉」<\/strong>：2:21 ὑποστρέψαι（從聖命轉回去）、2:22 ἐπιστρέψας（狗轉回所吐的）；路 22:32 主對彼得說 ἐπιστρέψας στήρισον——「你回頭以後，要堅固」。同一個分詞，兩個方向。<\/p><p><strong>④ 兩句俗語<\/strong>：第一句出自箴 26:11；第二句（豬洗了又滾）是當時流傳的俗語，不在舊約裡。<\/p>","exp":"<p><strong>回頭有兩種：狗回到所吐的，彼得回到主面前。<\/strong><\/p><p>這是全章最沉重的三節。「末後的景況比先前更不好了」——這幾乎就是主耶穌的話（太 12:45）：屋子打掃乾淨了卻空著，污鬼帶著七個更惡的回來。認識過義路又轉背，比從未聽過更糟，因為他們不只是迷路，是拿著地圖往反方向走，還帶別人一起走（2:18）。兩句俗語說出原因：狗轉過來吃牠所吐的（箴 26:11）；豬洗了澡，又回到泥裡滾。外面洗過了，本性沒有變。<\/p><p>但要看清楚這段話在講誰。上下文 2:17–19 是假師傅與跟從他們的人——曉得義路，卻拿著「自由」去引誘剛逃出來的人。這段話不是寫給一位跌倒了、心裡很痛、很想回來的弟兄姊妹。<\/p><p>彼得在這裡埋了一個只有他懂的字。狗「轉過來」ἐπιστρέψας，正是主在那一夜對他說的字：「你回頭（ἐπιστρέψας）以後，要堅固你的弟兄。」（路 22:32）同一個分詞，兩個方向：一個轉回嘔吐物，一個轉回主面前。寫這段話的人自己跌得很重；他不是站在懸崖上俯視別人，是從谷底被主拉上來的人。<\/p><p>落到今天：如果你正在掙扎，害怕自己就是 2:20 說的那種人——你會為此害怕，本身就說明你的心還沒有麻木。請聽 1:9：「忘了他舊日的罪已經得了潔淨」——你的罪是被潔淨過的；請聽 3:9：主「不願有一人沉淪，乃願人人都悔改」——主還在等。這三節不是用來對任何人宣判的，是叫我們今天就回轉：不是像狗那樣轉回舊路，是像彼得那樣轉回主面前。<\/p><p>〔背景〕三次不認主與回頭（路 22:31–34、54–62）。〔猶〕猶 22–23（猶大書講義尚未製作）。<\/p>"}],"3":[{"a":1,"z":2,"star":1,"grk":"<blockquote lang=\"grc\"><p>Ταύτην ἤδη, ἀγαπητοί, δευτέραν ὑμῖν γράφω ἐπιστολήν, ἐν αἷς διεγείρω ὑμῶν ἐν ὑπομνήσει τὴν εἰλικρινῆ διάνοιαν, μνησθῆναι τῶν προειρημένων ῥημάτων ὑπὸ τῶν ἁγίων προφητῶν καὶ τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος,<\/p><\/blockquote>","lit":"<blockquote><p>「親愛的，這已經是我寫給你們的第二封信了；在這兩封信裡，我藉著提醒，激發你們純淨的心思，叫你們記得聖先知預先說過的話，以及主和救主藉著你們的使徒所傳的命令。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>親愛的<\/td><td>ἀγαπητός<\/td><td>agapētos<\/td><td>G27<\/td><td>ἀγαπάω（愛）<\/td><td>蒙愛的<\/td><td>第 3 章用了四次（3:1、8、14、17），第 2 章一次也沒有——講完假師傅，回頭對自己人說話<\/td><\/tr><tr><td>第二封<\/td><td>δεύτερος<\/td><td>deuteros<\/td><td>G1208<\/td><td>—<\/td><td>第二<\/td><td>最自然指彼得前書（見語法）<\/td><\/tr><tr><td>激發<\/td><td>διεγείρω<\/td><td>diegeirō<\/td><td>G1326<\/td><td>διά（徹底）＋ ἐγείρω（喚起）<\/td><td>搖醒、喚醒<\/td><td>1:13 同字：臨終的人還在搖醒他的弟兄<\/td><\/tr><tr><td>提醒<\/td><td>ὑπόμνησις<\/td><td>hypomnēsis<\/td><td>G5280<\/td><td>ὑπό ＋ μιμνῄσκω（記得）<\/td><td>提醒、使人想起<\/td><td>1:13 同字；全卷是一封「怕你忘記」的信<\/td><\/tr><tr><td>誠實的<\/td><td>εἰλικρινής<\/td><td>eilikrinēs<\/td><td>G1506<\/td><td>傳統拆作 εἵλη（日光）＋ κρίνω（判斷）<\/td><td>純淨、沒有摻雜<\/td><td>拿到日光下看也沒有雜質的心思（腓 1:10 同字）<\/td><\/tr><tr><td>心<\/td><td>διάνοια<\/td><td>dianoia<\/td><td>G1271<\/td><td>διά ＋ νοῦς（心思）<\/td><td>思想、理解力<\/td><td>不是情緒的心，是思想的心：提醒對著理解說話<\/td><\/tr><tr><td>記念<\/td><td>μιμνῄσκομαι<\/td><td>mimnēskomai<\/td><td>G3415<\/td><td>—<\/td><td>記得、想起<\/td><td>不定詞 μνησθῆναι 表目的：提醒是為了記得<\/td><\/tr><tr><td>命令<\/td><td>ἐντολή<\/td><td>entolē<\/td><td>G1785<\/td><td>ἐν ＋ τέλλω（吩咐）<\/td><td>命令、吩咐<\/td><td>源頭是「主救主」，傳遞者是「你們的使徒」<\/td><\/tr><\/table>","gram":"<p><strong>① δευτέραν ἐπιστολήν——「第二封信」指哪一封？<\/strong><\/p><ul><li><strong>彼得前書<\/strong>（多數解經家）：最自然的讀法。彼前 1:10–12 講先知，1:13 起滿是命令——「先知的話」與「主的命令」兩樣都有。<\/li><li><strong>一封已經失傳的信<\/strong>：理由是彼得前書的主題是受苦，看起來不像「提醒」主再來的事。<\/li><li><strong>彼得後書第 1–2 章另成一信<\/strong>（少數）：沒有任何抄本證據。<\/li><\/ul><p>對反對意見的回應：彼得前書其實大量講到末後（彼前 1:5、1:13、4:7、4:13、5:4），而「勸勉、證明」也是前書自述的目的（彼前 5:12）。<strong>ἐν αἷς<\/strong>（在其中，複數）把兩封綁在一起：和合本「這兩封都是提醒你們」譯得準確。<\/p><blockquote><p><strong>最好的理解：指彼得前書。兩封合讀：前書教人在火裡站得住，後書教人在霧裡看得清——同一個提醒的人，同一個目的。<\/strong><\/p><\/blockquote><p><strong>② τῆς τῶν ἀποστόλων ὑμῶν ἐντολῆς τοῦ κυρίου καὶ σωτῆρος——三層所有格<\/strong><\/p><ul><li>「使徒的」：傳遞者<\/li><li>「你們的」：把福音傳給你們的那些使徒<\/li><li>「主和救主的」：命令的源頭<\/li><\/ul><p>託名說有人以「你們的使徒」為作者自外於使徒群體的證據；但更自然的讀法是：彼得把自己放進「傳給你們」的使徒行列裡，不另立權威。先知（舊約）與使徒（新約）並列，這使我們想起弗 2:20「被建造在使徒和先知的根基上」。<\/p><blockquote><p><strong>最好的理解：命令只有一個源頭——主救主；先知預先說、使徒傳出去，都是同一位主在不同時代說話。<\/strong><\/p><\/blockquote>","exp":"<p><strong>臨終的使徒，最後一章的第一個動作還是提醒。<\/strong><\/p><p>第 3 章是彼得遺言的最後一段。他沒有說「我要告訴你們新的東西」，而是說：「這兩封都是提醒你們。」1:12 他說「常常提醒」，1:13 說「趁我還在這帳棚的時候提醒」，到了這裡，仍是同一件事。<strong>信仰最大的危險，常常不是不知道，而是忘了。<\/strong>這一章後面要面對的譏誚，起點正是「故意忘記」（3:5）。<\/p><p>「激發」διεγείρω 是把睡著的人搖醒的字。被搖醒的不是情緒，是 διάνοια——思想、理解。「誠實的心」εἰλικρινής 是沒有摻雜的心思：還沒有被私慾攪混，卻可能正在打盹。彼得要搖醒的，是一顆還乾淨、但快要睡著的頭腦。<\/p><p>他要人記得兩樣：<strong>聖先知預先所說的話<\/strong>，和<strong>主救主的命令，就是使徒所傳給你們的<\/strong>。這不是兩個平行的權威，而是同一位主在兩個時代說話：先知預先說，使徒傳出去，源頭都是「主救主」。這正接回 1:19–21——先知的話是暗處的燈，因為那是人被聖靈感動說出來的。<\/p><p>今天的人很少公開否認信仰，多半只是讓它慢慢褪色。所以讀經、聚會、彼此提醒，從來不是重複，而是搖醒。<strong>一個肯被提醒的人，就不容易被譏誚帶走；一個常提醒弟兄的人，正在做主交給彼得的那份功課。<\/strong><\/p><p>〔背景〕「你回頭以後，要堅固你的弟兄」——提醒是主的託付，不是彼得的個性（路 22:32）。〔彼前〕彼得前書講義第 1 章（彼前 1:10–12 先知的考察）、第 5 章（彼前 5:12 勸勉與證明）。<\/p>"},{"a":3,"z":4,"star":1,"grk":"<blockquote lang=\"grc\"><p>τοῦτο πρῶτον γινώσκοντες ὅτι ἐλεύσονται ἐπ’ ἐσχάτων τῶν ἡμερῶν ἐν ἐμπαιγμονῇ ἐμπαῖκται κατὰ τὰς ἰδίας ἐπιθυμίας αὐτῶν πορευόμενοι καὶ λέγοντες· Ποῦ ἐστιν ἡ ἐπαγγελία τῆς παρουσίας αὐτοῦ; ἀφ’ ἧς γὰρ οἱ πατέρες ἐκοιμήθησαν, πάντα οὕτως διαμένει ἀπ’ ἀρχῆς κτίσεως.<\/p><\/blockquote>","lit":"<blockquote><p>「首先要知道這件事：在末後的日子，必有譏誚的人帶著譏誚而來，照著他們自己的私慾而行，說：『他來臨的應許在哪裡呢？因為自從列祖睡了以後，萬物都這樣持續，和創造之初一樣。』」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>第一要緊的<\/td><td>πρῶτον<\/td><td>prōton<\/td><td>G4412<\/td><td>—<\/td><td>首先、最要緊<\/td><td>與 1:20 同一句式 τοῦτο πρῶτον γινώσκοντες：前一次要知道預言的來源，這一次要知道會有人笑<\/td><\/tr><tr><td>末世<\/td><td>ἔσχατος<\/td><td>eschatos<\/td><td>G2078<\/td><td>—<\/td><td>最後的<\/td><td>ἐπ’ ἐσχάτων τῶν ἡμερῶν：彼得在五旬節說末後的日子已經開始（徒 2:17）<\/td><\/tr><tr><td>譏誚<\/td><td>ἐμπαιγμονή<\/td><td>empaigmonē<\/td><td>—<\/td><td>ἐν ＋ παίζω（遊戲、玩弄）<\/td><td>嘲弄、戲弄<\/td><td>新約僅此一次；TR 無此字，故無 Strong’s 編號<\/td><\/tr><tr><td>好譏誚的人<\/td><td>ἐμπαίκτης<\/td><td>empaiktēs<\/td><td>G1703<\/td><td>ἐμπαίζω（戲弄）<\/td><td>嘲笑者<\/td><td>猶 18 同字；與上一字同根疊用，連說話的方式都是譏誚<\/td><\/tr><tr><td>私慾<\/td><td>ἐπιθυμία<\/td><td>epithymia<\/td><td>G1939<\/td><td>ἐπί ＋ θυμός（熱情）<\/td><td>強烈的慾望<\/td><td>懷疑的根不在學問，在生活：主若來，我就得交賬<\/td><\/tr><tr><td>降臨<\/td><td>παρουσία<\/td><td>parousia<\/td><td>G3952<\/td><td>παρά ＋ εἰμί（在場）<\/td><td>來臨、在場<\/td><td>1:16 同字：彼得在聖山上親眼見過的那個「降臨」<\/td><\/tr><tr><td>睡<\/td><td>κοιμάω<\/td><td>koimaō<\/td><td>G2837<\/td><td>—<\/td><td>睡、安睡<\/td><td>新約常用於信徒的死（帖前 4:13–15）<\/td><\/tr><tr><td>仍是一樣<\/td><td>διαμένω<\/td><td>diamenō<\/td><td>G1265<\/td><td>διά ＋ μένω（停留）<\/td><td>持續不變<\/td><td>譏誚的世界觀：從來沒有變，所以也不會變<\/td><\/tr><\/table>","gram":"<p><strong>① 「列祖」οἱ πατέρες 是誰？<\/strong><\/p><ul><li><strong>舊約先祖<\/strong>（亞伯拉罕、以撒、雅各等）：新約 οἱ πατέρες 幾乎都這樣用（約 6:31；徒 3:13；羅 9:5；來 1:1）；後半句「與起初創造的時候」把眼光拉到整個歷史。<\/li><li><strong>第一代基督徒<\/strong>（司提反、使徒雅各等已離世的人）：「睡了」多用於信徒的死；譏誚的內容可能是「主應許在這一代回來，可是第一代人都死了」（Bauckham 等學者主張）。<\/li><li><strong>泛指先人<\/strong>：不必特指哪一群人。<\/li><\/ul><blockquote><p><strong>最好的理解：兩讀都通，較傾向舊約列祖——新約用法一致，又與「起初創造」連成一條長線。但不論哪一讀，譏誚的邏輯都一樣：從來沒有變，所以將來也不會變；3:5–7 就是拆這個邏輯。<\/strong><\/p><\/blockquote><p><strong>② ἐν ἐμπαιγμονῇ ἐμπαῖκται——同根疊用<\/strong><\/p><p>「在譏誚中的譏誚者」，閃族式的加強語法（如路 22:15「我很願意」原文是「我願意了又願意」）。他們不只說了一句譏誚的話，他們整個人就活在譏誚裡。<\/p><p><strong>③ 「末世」是一段時期，不是倒數訊號<\/strong><\/p><ul><li>把 3:3 當作「譏誚的人出現＝末日快到了」的訊號表<\/li><li>把「末後的日子」看成從五旬節到主再來的整段時期（徒 2:17；來 1:2）<\/li><\/ul><blockquote><p><strong>最好的理解：後者。譏誚的人不是給人推算的記號，而是教會在每一個世代都會面對的處境；彼得要的是「預先知道」，不是倒數計時。<\/strong><\/p><\/blockquote>","exp":"<p><strong>「主要降臨的應許在哪裡呢？」——這句話的力量，不在論證，在語氣。<\/strong><\/p><p>彼得說「第一要緊的，該知道」，和 1:20 一模一樣的開頭。前一次要知道的是預言的來源，這一次要知道的是：會有人笑。他不是要信徒驚訝，而是要他們預先知道（3:17），聽見笑聲時不至於腳軟。<\/p><p>譏誚的人有三個特徵。第一，他們「隨從自己的私慾」——懷疑的根常常不在頭腦，在生活：主若真要回來，我的生活就得向他交賬，所以最好他不來。第二，他們用一個問題代替一個論證：「在哪裡呢？」舊約裡這是仇敵對受苦的人說的話：「你的神在哪裡呢？」（詩 42:3）第三，他們有一套世界觀：「萬物與起初創造的時候仍是一樣」——διαμένει，一直維持。<strong>過去沒有變，所以將來也不會變。<\/strong><\/p><p>彼得接下來（3:5–7）會指出這句話本身就是錯的：世界變過，被水淹沒過。但在這兩節，他先讓我們聽見那笑聲，因為每一代的信徒都聽過。等候的人最難受的，往往不是逼迫，而是被當成笑話。<\/p><p>今天這句話換了衣服：「都兩千年了，還在等？」<strong>回應譏誚的第一步不是吵贏，是記得。<\/strong>記得 παρουσία 這個字彼得在 1:16 已經用過——他講的降臨不是傳說，是他在聖山上親眼見過的那一位的威榮。被譏誚的應許，背後站著一位被親眼看見過的主。<\/p><p>〔彼前〕彼得前書講義第 4 章（彼前 4:7「萬物的結局近了」——本章要回答「近」為甚麼這麼久）。〔猶〕猶 18（猶大書講義尚未製作）。<\/p>"},{"a":5,"z":7,"star":1,"grk":"<blockquote lang=\"grc\"><p>λανθάνει γὰρ αὐτοὺς τοῦτο θέλοντας ὅτι οὐρανοὶ ἦσαν ἔκπαλαι καὶ γῆ ἐξ ὕδατος καὶ δι’ ὕδατος συνεστῶσα τῷ τοῦ θεοῦ λόγῳ, δι’ ὧν ὁ τότε κόσμος ὕδατι κατακλυσθεὶς ἀπώλετο· οἱ δὲ νῦν οὐρανοὶ καὶ ἡ γῆ τῷ αὐτῷ λόγῳ τεθησαυρισμένοι εἰσὶν πυρί, τηρούμενοι εἰς ἡμέραν κρίσεως καὶ ἀπωλείας τῶν ἀσεβῶν ἀνθρώπων.<\/p><\/blockquote>","lit":"<blockquote><p>「因為他們故意讓這件事從眼前溜走：諸天自古就有，地也是從水而出、藉著水而成立，都憑著神的話；藉著這些，當時的世界被水淹沒而滅亡了。但現在的天和地，憑著同一個話被積存起來留給火，被看守著，直到不敬虔之人受審判並滅亡的日子。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>忘記<\/td><td>λανθάνω<\/td><td>lanthanō<\/td><td>G2990<\/td><td>—<\/td><td>被忽略、溜走<\/td><td>不是不知道，是讓它溜走；3:8 彼得反過來用同一個字<\/td><\/tr><tr><td>故意<\/td><td>θέλω<\/td><td>thelō<\/td><td>G2309<\/td><td>—<\/td><td>願意、想要<\/td><td>分詞 θέλοντας：這遺忘是他們自己要的（見語法）<\/td><\/tr><tr><td>太古<\/td><td>ἔκπαλαι<\/td><td>ekpalai<\/td><td>G1597<\/td><td>ἐκ ＋ πάλαι（古時）<\/td><td>自古以來<\/td><td>2:3「自古以來」同字：審判和創造一樣古老<\/td><\/tr><tr><td>成<\/td><td>συνίστημι<\/td><td>synistēmi<\/td><td>G4921<\/td><td>σύν（一起）＋ ἵστημι（站立）<\/td><td>成形、維繫<\/td><td>西 1:17「萬有也靠他而立」同字<\/td><\/tr><tr><td>命<\/td><td>λόγος<\/td><td>logos<\/td><td>G3056<\/td><td>λέγω（說）<\/td><td>話、道<\/td><td>創造、淹沒、存留，憑的都是同一個「話」<\/td><\/tr><tr><td>淹沒<\/td><td>κατακλύζω<\/td><td>kataklyzō<\/td><td>G2626<\/td><td>κατά ＋ κλύζω（沖刷）<\/td><td>被水淹沒<\/td><td>新約僅此一次；名詞 κατακλυσμός 見 2:5「洪水」<\/td><\/tr><tr><td>存留<\/td><td>θησαυρίζω<\/td><td>thēsaurizō<\/td><td>G2343<\/td><td>θησαυρός（寶庫）<\/td><td>積存、收藏<\/td><td>完成式被動 τεθησαυρισμένοι：已經放進庫裡，至今仍在<\/td><\/tr><tr><td>直留到<\/td><td>τηρέω<\/td><td>tēreō<\/td><td>G5083<\/td><td>—<\/td><td>看守、保留<\/td><td>2:4、9、17 同字：神看守審判，也在同一段看守挪亞<\/td><\/tr><\/table>","gram":"<p><strong>① λανθάνει…θέλοντας 怎樣讀？<\/strong><\/p><ul><li><strong>「他們故意忘記」<\/strong>（和合本與多數英譯）：θέλοντας 表意願——這件事逃過他們，是他們自己要它逃過。<\/li><li><strong>「他們堅持這一點時，卻忽略了……」<\/strong>：θέλω 作「主張、堅稱」（BDAG 列有此義）。<\/li><\/ul><blockquote><p><strong>最好的理解：和合本的讀法較自然。兩讀殊途同歸：譏誚不是資訊不足，是選擇性的遺忘；所以 3:8 的解藥是「不可忘記」。<\/strong><\/p><\/blockquote><p><strong>② ἐξ ὕδατος καὶ δι’ ὕδατος<\/strong><\/p><ul><li>「從水而出」：創 1:9 旱地從聚在一處的水中露出來。<\/li><li>「藉水而成」：創 1:6–7 穹蒼分開上下的水；或指水是維繫地的工具。<\/li><li>有人想由此建構一套科學宇宙論——這已超出經文的本意；彼得引的是創世記的敘事，目的在神學，不在物理。<\/li><\/ul><p><strong>③ δι’ ὧν（藉著這些，複數）指甚麼？<\/strong><\/p><ul><li>指兩處的水（從水、藉水）<\/li><li>指水與神的話<\/li><li>指天和地<\/li><\/ul><blockquote><p><strong>最好的理解：水與神的話一同。同樣的水，在同一個話底下，可以是創造的材料，也可以是審判的工具；世界不是靠自己的穩定存在，是靠神的話。<\/strong><\/p><\/blockquote><p><strong>④ ἀπώλετο（消滅）不等於「不存在」<\/strong><\/p><p>洪水使「當時的世界」滅亡，地卻沒有消失；3:7 用同一字族 ἀπώλεια 講火的審判，對象明說是「不敬虔之人」。這個類比本身就提醒我們：審判是對罪的了結，不是神丟棄受造界。<\/p>","exp":"<p><strong>譏誚的人說「萬物仍是一樣」；彼得說：你忘了洪水。<\/strong><\/p><p>譏誚的論證建立在一個假設上：世界一直照著自己的規律運轉，從來沒有被打斷。彼得舉出兩次打斷：創造與洪水。天地本來沒有，是「憑神的命」有的；那地「從水而出、藉水而成」，正是創世記第 1 章的畫面——水覆蓋深淵，神一說話，旱地就露出來（創 1:2、9）。同樣的水，在挪亞的日子成了審判：「當時的世界被水淹沒就消滅了。」<\/p><p>這段的主角不是水，也不是火，是 λόγος——神的話。創造憑這話，淹沒憑這話，「現在的天地還是憑著那命存留」。<strong>世界的穩定不是證明神不會來，正是證明神的話還在托住它。<\/strong>譏誚的人把神的忍耐誤認成神的缺席。<\/p><p>「存留」τεθησαυρισμένοι 是放進寶庫的字，又加上 τηρούμενοι——看守著。第 2 章彼得用同一個「看守」講神把不義的人留到審判（2:4、9、17），也在同一段講神「保護了傳義道的挪亞一家八口」（2:5）。<strong>神看守審判，也看守他的人。<\/strong><\/p><p>還要注意：洪水消滅了「當時的世界」，地卻沒有消失；挪亞走出方舟，踏上的是同一塊被洗過的地。所以 3:7 的火，焦點是「不敬虔之人受審判遭沉淪」，不是神對他所造的世界失去興趣。對今天的人，這段話是雙重的安慰：我們活在神話語的托住之中，也活在神的耐心之中——那火還在庫裡，因為門還開著（3:9）。<\/p><p>〔舊約〕創世記講義第 1 章、第 6–8 章（創 1:2、6–9；6–8）。〔彼前〕彼得前書講義第 3 章（彼前 3:20 挪亞的日子）。<\/p>"},{"a":8,"z":8,"star":2,"grk":"<blockquote lang=\"grc\"><p>Ἓν δὲ τοῦτο μὴ λανθανέτω ὑμᾶς, ἀγαπητοί, ὅτι μία ἡμέρα παρὰ κυρίῳ ὡς χίλια ἔτη καὶ χίλια ἔτη ὡς ἡμέρα μία.<\/p><\/blockquote>","lit":"<blockquote><p>「親愛的，但這一件事不要讓它從你們眼前溜走：在主那裡，一日如同一千年，一千年如同一日。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>不可忘記<\/td><td>λανθάνω<\/td><td>lanthanō<\/td><td>G2990<\/td><td>—<\/td><td>被忽略、溜走<\/td><td>μὴ λανθανέτω 第三人稱命令；與 3:5「故意忘記」一正一反<\/td><\/tr><tr><td>一件事<\/td><td>εἷς<\/td><td>heis<\/td><td>G1520<\/td><td>—<\/td><td>一<\/td><td>Ἓν…τοῦτο 放在句首：千頭萬緒中，只要記得這一件<\/td><\/tr><tr><td>主看<\/td><td>παρά<\/td><td>para<\/td><td>G3844<\/td><td>—<\/td><td>在……旁邊、在……眼中<\/td><td>παρὰ κυρίῳ：觀點是主的，不是我們的<\/td><\/tr><tr><td>如<\/td><td>ὡς<\/td><td>hōs<\/td><td>G5613<\/td><td>—<\/td><td>如同、好像<\/td><td>比喻，不是等號<\/td><\/tr><tr><td>千<\/td><td>χίλιοι<\/td><td>chilioi<\/td><td>G5507<\/td><td>—<\/td><td>一千<\/td><td>兩個方向都說，取消了換算<\/td><\/tr><tr><td>日<\/td><td>ἡμέρα<\/td><td>hēmera<\/td><td>G2250<\/td><td>—<\/td><td>日<\/td><td>本章「日」的線：末後的日子（3:3）→主的日子（3:10）→永遠的那一日（3:18）<\/td><\/tr><\/table>","gram":"<p><strong>① 引用詩 90:4，並且加了一個方向<\/strong><\/p><p>七十士譯本詩 89:4：ὅτι χίλια ἔτη ἐν ὀφθαλμοῖς σου ὡς ἡ ἡμέρα ἡ ἐχθές（因為千年在你眼中如昨日）。詩篇只說「千年如一日」；彼得加上「一日如千年」，兩個方向並列。<\/p><ul><li><strong>年代換算的鑰匙<\/strong>：《巴拿巴書》15:4 等早期作品把創造六日套成六千年的世界歷史，後世也有人用它推算主再來或證明創造日的長度——這是本講義不採的讀法。<\/li><li><strong>神超越時間<\/strong>（多數解經家）：時間的長短在神面前不是同一把尺；他不因漫長而遺忘，也不因倉促而失誤。<\/li><li><strong>神的效率<\/strong>：一日之內，神能成就人以為要千年的事。<\/li><\/ul><blockquote><p><strong>最好的理解：ὡς 是比喻不是等號，而且兩個方向都說——這節經文不是在說一日等於一千年，而是用兩個方向互相抵銷，取消一切換算。它不是叫人推算日子，是叫人換一個位置看時間：站到「主那裡」。<\/strong><\/p><\/blockquote><p><strong>② 「親愛的」第二次出現<\/strong><\/p><p>ἀγαπητοί 在本章出現四次（3:1、8、14、17），每一次都在一個轉折點上：提醒、記得、竭力、防備。講到最容易引人焦慮的題目時，彼得先叫一聲「親愛的」。<\/p>","exp":"<p><strong>這不是一條換算公式，是一次換位。<\/strong><\/p><p>譏誚的人「故意忘記」（3:5）；彼得說：親愛的，有一件事你們「不可忘記」——同一個字 λανθάνω，一反一正。譏誚的人忘記神做過的事；信徒要記得神是怎樣的一位。<\/p><p>這句話來自摩西的禱告：「在你看來，千年如已過的昨日，又如夜間的一更。」（詩 90:4）摩西說的是人生短暫、神永恆。彼得多加了一個方向：「一日如千年」。<strong>兩個方向都說，正是為了取消換算。<\/strong>如果一日可以像千年，千年也可以像一日，就沒有人能拿這節經文去定主哪一年來、或創造用了多少年——這節經文本身就拒絕被當成尺。<\/p><p>它要說的是：時間不是神的主人。對我們，一千年長得看不見盡頭；對主，一千年不過像一日，他不會因為等了很久就忘記應許。反過來，一日在主手中可以像千年那樣厚重，他可以在一日之內成就人以為要千年的事。<strong>神既不被時間拖慢，也不被時間催促。<\/strong><\/p><p>這正是 321 說的改變觀點：從人的觀點換到神的觀點，從暫時的觀點換到永恆的觀點——不是換算，是換位。當我們問「為甚麼還不來」，問題的前提是用我們的鐘錶衡量神的信實。彼得不給我們一支新的鐘錶，他把我們帶到主的身邊（παρὰ κυρίῳ），從那裡看時間。下一節就告訴我們，從那裡看見的是甚麼：寬容。<\/p><p>〔舊約〕詩 90:4。〔彼前〕彼得前書講義第 4 章（彼前 4:7「萬物的結局近了」）。<\/p>"},{"a":9,"z":9,"star":2,"grk":"<blockquote lang=\"grc\"><p>οὐ βραδύνει κύριος τῆς ἐπαγγελίας, ὥς τινες βραδύτητα ἡγοῦνται, ἀλλὰ μακροθυμεῖ εἰς ὑμᾶς, μὴ βουλόμενός τινας ἀπολέσθαι ἀλλὰ πάντας εἰς μετάνοιαν χωρῆσαι.<\/p><\/blockquote>","lit":"<blockquote><p>「主對他的應許並不遲延，不是有些人以為的那種遲延；乃是向你們恆久忍耐，不願任何人滅亡，乃願所有的人都走進悔改裡。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>耽延<\/td><td>βραδύνω<\/td><td>bradynō<\/td><td>G1019<\/td><td>βραδύς（慢）<\/td><td>遲慢、拖延<\/td><td>τῆς ἐπαγγελίας：在應許的事上不慢<\/td><\/tr><tr><td>耽延（名詞）<\/td><td>βραδύτης<\/td><td>bradytēs<\/td><td>G1022<\/td><td>βραδύς（慢）<\/td><td>遲緩<\/td><td>新約僅此一次<\/td><\/tr><tr><td>以為<\/td><td>ἡγέομαι<\/td><td>hēgeomai<\/td><td>G2233<\/td><td>ἄγω（引領）<\/td><td>認為、看作<\/td><td>3:15 同字：有人「以為」是耽延，你們要「以為」是得救<\/td><\/tr><tr><td>寬容<\/td><td>μακροθυμέω<\/td><td>makrothymeō<\/td><td>G3114<\/td><td>μακρός（長）＋ θυμός（怒氣）<\/td><td>恆久忍耐<\/td><td>★本章解經鑰匙：把怒氣拉長——主的慢是愛的等；彼前 3:20「神容忍等待」同字族<\/td><\/tr><tr><td>不願<\/td><td>βούλομαι<\/td><td>boulomai<\/td><td>G1014<\/td><td>—<\/td><td>願意、存心<\/td><td>神真實的心意，不是外交辭令<\/td><\/tr><tr><td>沉淪<\/td><td>ἀπόλλυμι<\/td><td>apollymi<\/td><td>G622<\/td><td>ἀπό ＋ ὄλλυμι（毀滅）<\/td><td>滅亡<\/td><td>3:6「消滅」、3:7「沉淪」同字族：審判的字，神說他不願意<\/td><\/tr><tr><td>悔改<\/td><td>μετάνοια<\/td><td>metanoia<\/td><td>G3341<\/td><td>μετά（轉變）＋ νοῦς（心思）<\/td><td>心意的轉變<\/td><td>改變觀念，從這裡開始<\/td><\/tr><tr><td>都<\/td><td>χωρέω<\/td><td>chōreō<\/td><td>G5562<\/td><td>χῶρος（空間）<\/td><td>前往、進到、騰出地方<\/td><td>εἰς μετάνοιαν χωρῆσαι：悔改是一個地方，神等人走進去<\/td><\/tr><\/table>","gram":"<p><strong>① 「不願有一人沉淪」與揀選<\/strong><\/p><ul><li><strong>阿米念／衛斯理傳統<\/strong>：神普遍的救恩心意；人可以拒絕，所以不是人人得救。<\/li><li><strong>改革宗一派<\/strong>（如歐文 John Owen）：「向你們」指選民，「任何人」「人人」限於「你們」之中；神忍耐是為了把他的子民召齊。<\/li><li><strong>改革宗另一派<\/strong>：分辨神的「心意」與「定旨」——神真實地不喜悅惡人死亡（結 18:23、32；33:11；提前 2:4），同時有他主權的旨意。<\/li><li><strong>普救論<\/strong>：人人終必得救——與 3:7「不敬虔之人受審判遭沉淪」直接衝突，本節不能這樣讀。<\/li><\/ul><blockquote><p><strong>最好的理解：βούλομαι 說的是神真實的心意；「向你們」對讀者說，「人人」把門開得更大。這節經文的工作不是裁決揀選的系統，而是解釋「為甚麼還沒來」：因為神在等人悔改。不要用系統冷卻這節經文的溫度，也不要用這節經文取消 3:7 的審判。<\/strong><\/p><\/blockquote><p><strong>② 異文：εἰς ὑμᾶς／δι’ ὑμᾶς<\/strong><\/p><p>SBLGNT 作 εἰς ὑμᾶς（向你們）；部分抄本作 δι’ ὑμᾶς（為你們的緣故），晚期抄本有作 ἡμᾶς（我們）者。意思相近：神的忍耐有明確的對象，就是正在讀這封信的人。<\/p><p><strong>③ 同一個動詞，兩種讀法<\/strong><\/p><p>ἡγοῦνται（3:9 有人以為）與 ἡγεῖσθε（3:15 你們要以為）前後呼應：同一段等候的時間，可以被讀成「耽延」，也可以被讀成「得救」。差別不在時間，在看的人。<\/p>","exp":"<p><strong>同一件事——主還沒有來——人的觀點叫它「耽延」，神的觀點叫它「寬容」。<\/strong><\/p><p>「有人以為他是耽延」：這不只是譏誚的人的想法，也是許多等得很累的信徒心裡的話。彼得沒有責備這份累，他把它翻過來：「其實不是耽延，乃是寬容你們。」<\/p><p>「寬容」μακροθυμεῖ 字面是「把怒氣拉長」——不是沒有怒氣，是把發作的時間往後延。彼得前書用同一個字族講挪亞的日子：「神容忍等待的時候」（彼前 3:20）。方舟造了很多年，那不是神忘了審判，是神在等人進來。現在彼得說：我們的日子也是這樣。<\/p><p>為甚麼等？「不願有一人沉淪，乃願人人都悔改。」「沉淪」ἀπόλλυμι 正是 3:6「消滅」、3:7「沉淪」的字族——<strong>審判的字，神說他不願意。<\/strong>他的慢不是軟弱，是愛的等。<\/p><p>寫下這句話的人，自己就是被等回來的。他三次不認主，主沒有放棄他，在海邊預備了炭火和魚，三次問他「你愛我嗎」。<strong>寫「寬容」的人，自己是被寬容等回來的。<\/strong><\/p><p>所以等候的時間不是焦慮的時間，是悔改與傳福音的時間。那個還沒回頭的家人、那個跌倒了還想回來的弟兄、甚至我們自己心裡那塊還沒交出來的地方——主的慢，就是為了這些。<strong>不要把主的寬容當成耽延；也不要把主的寬容當成可以繼續拖延的理由<\/strong>（羅 2:4）。<\/p><p>〔背景〕主在海邊等候並接回彼得（路 22:61–62；約 21:15–17）——不是彼得多堅強，是主多恆久忍耐。〔彼前〕彼得前書講義第 3 章（彼前 3:20「神容忍等待」）。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<blockquote lang=\"grc\"><p>Ἥξει δὲ ἡμέρα κυρίου ὡς κλέπτης, ἐν ᾗ οἱ οὐρανοὶ ῥοιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα λυθήσεται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα εὑρεθήσεται.<\/p><\/blockquote>","lit":"<blockquote><p>「但主的日子必要來到，像賊一樣；在那日，諸天要轟然一聲過去，元素（或作：天體）要被烈火焚燒而解散，地和其上所作的工都要被顯露出來（和合本所依的抄本作：都要燒盡了）。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>要…來到<\/td><td>ἥκω<\/td><td>hēkō<\/td><td>G2240<\/td><td>—<\/td><td>來到、臨到<\/td><td>ἥξει 放在句首：回答「在哪裡呢」——必定會來<\/td><\/tr><tr><td>賊<\/td><td>κλέπτης<\/td><td>kleptēs<\/td><td>G2812<\/td><td>κλέπτω（偷）<\/td><td>賊、小偷<\/td><td>主自己的比喻（太 24:43）；帖前 5:2；啟 3:3：不預告時間<\/td><\/tr><tr><td>大有響聲<\/td><td>ῥοιζηδόν<\/td><td>rhoizēdon<\/td><td>G4500<\/td><td>ῥοῖζος（呼嘯聲）<\/td><td>轟然、呼嘯地<\/td><td>新約僅此一次：箭飛過、火燒起來的聲音<\/td><\/tr><tr><td>廢去<\/td><td>παρέρχομαι<\/td><td>parerchomai<\/td><td>G3928<\/td><td>παρά ＋ ἔρχομαι（來）<\/td><td>過去、消逝<\/td><td>太 24:35「天地要廢去，我的話卻不能廢去」同字<\/td><\/tr><tr><td>有形質的<\/td><td>στοιχεῖον<\/td><td>stoicheion<\/td><td>G4747<\/td><td>στοῖχος（排列）<\/td><td>基本元素、排列成行的東西<\/td><td>物質元素／天體／屬靈勢力三說（見語法）<\/td><\/tr><tr><td>烈火<\/td><td>καυσόω<\/td><td>kausoō<\/td><td>G2741<\/td><td>καῦσις（燃燒）<\/td><td>被高熱焚燒<\/td><td>新約只見於 3:10、12<\/td><\/tr><tr><td>銷化<\/td><td>λύω<\/td><td>lyō<\/td><td>G3089<\/td><td>—<\/td><td>解開、拆散<\/td><td>3:10–12 連用三次：拆散的是現在的秩序<\/td><\/tr><tr><td>燒盡／被顯露<\/td><td>εὑρίσκω<\/td><td>heuriskō<\/td><td>G2147<\/td><td>—<\/td><td>找到、發現<\/td><td>SBLGNT 作 εὑρεθήσεται；3:14「安然見主」原文就是「被他找到」<\/td><\/tr><\/table>","gram":"<p><strong>① 本節最後一個動詞的異文——全卷最重要的一處<\/strong><\/p><table><tr><th>讀法<\/th><th>意思<\/th><th>主要見證<\/th><th>採用的版本<\/th><\/tr><tr><td>εὑρεθήσεται<\/td><td>必被發現／被顯露<\/td><td>א B K P 1739 等<\/td><td>SBLGNT、WH<\/td><\/tr><tr><td>οὐχ εὑρεθήσεται<\/td><td>必不被發現（不復存在）<\/td><td>部分撒希地科普特文與敘利亞文譯本<\/td><td>NA28／UBS5（ECM）<\/td><\/tr><tr><td>κατακαήσεται<\/td><td>必燒盡<\/td><td>A 048 及拜占庭多數抄本<\/td><td>TR、多數本；和合本「燒盡了」、KJV<\/td><\/tr><tr><td>ἀφανισθήσονται<\/td><td>必消失<\/td><td>C<\/td><td>—<\/td><\/tr><tr><td>εὑρεθήσεται λυόμενα<\/td><td>必被發現已經解散<\/td><td>𝔓72<\/td><td>—<\/td><\/tr><tr><td>（略去這一句）<\/td><td>—<\/td><td>Ψ、部分拉丁文武加大本<\/td><td>—<\/td><\/tr><\/table><ul><li><strong>採 κατακαήσεται（燒盡）<\/strong>：意思最清楚，與 3:7、12 的火一致；和合本與欽定本都照這一讀。但見證多屬較晚的抄本，而且正因為「清楚」，很可能是抄寫者為了把難句說明白而改的。<\/li><li><strong>採 εὑρεθήσεται（被顯露）<\/strong>：見證最早、最好（א B），又是「較難的讀法」（lectio difficilior）——其他各讀都很容易解釋成是從它改出來的。意思有三種解：(a) 地和其上的工都要攤開在神的審判面前，無所隱藏；(b) 讀作問句「地……還會被找到嗎？」；(c) 經過火煉之後被找著、存留下來。<\/li><li><strong>採 οὐχ εὑρεθήσεται（不被發現）<\/strong>：ECM／NA28 的編者認為這是能解釋其他讀法的原貌，但希臘文抄本幾乎沒有直接支持，主要靠早期譯本。<\/li><\/ul><blockquote><p><strong>最好的理解：本講義採 SBLGNT 的 εὑρεθήσεται，取 (a)：在神的審判面前被顯露。這與林前 3:13「各人的工程必然顯露……有火發現」一致，也與四節之後的 εὑρεθῆναι（3:14 被他找到）同一個動詞，前後呼應。講台若用和合本「燒盡了」，要說明原文有異文。兩種讀法都不是神丟棄受造界：「燒盡」講審判之火的徹底，「顯露」講審判之火的鑒察；落點都在 3:13 的新天新地。<\/strong><\/p><\/blockquote><p><strong>② στοιχεῖα 是甚麼？<\/strong><\/p><ul><li><strong>物質元素<\/strong>（土、水、氣、火，當時希臘哲學的用法）<\/li><li><strong>天體<\/strong>（日月星辰）：本節的順序是天→στοιχεῖα→地；賽 34:4「天上的萬象都要消沒」，七十士譯本用 τακήσονται（鎔化），正是 3:12 τήκεται 的字<\/li><li><strong>屬靈勢力<\/strong>（加 4:3、9；西 2:8、20 的「小學」）<\/li><\/ul><blockquote><p><strong>最好的理解：天體最可能，物質元素也通；屬靈勢力在此較不自然。和合本「有形質的」兼容前兩者，譯得穩妥。<\/strong><\/p><\/blockquote>","exp":"<p><strong>主的日子一定會來，而且像賊一樣來——這兩件事一起說，就沒有人該去算日子。<\/strong><\/p><p>句子第一個字是 ἥξει——「必要來到」。譏誚的人問「在哪裡呢」，彼得把動詞放在最前面回答：會來。然後他用主自己的比喻：像賊（太 24:43；帖前 5:2）。賊不預告時間。<strong>確定會來，又不知道何時來——這正是等候的人的兩隻腳：不懷疑，也不推算。<\/strong><\/p><p>接著是三幅畫面：天「大有響聲」廢去——ῥοιζηδόν，新約只出現這一次，是箭飛過、火燒起來那種呼嘯聲；「有形質的」被烈火銷化；最後是地和其上所作的工。這是先知式的語言，如以賽亞說「天上的萬象都要消沒」（賽 34:4），重點在震撼與確定，不是一份物理學的程序表。<\/p><p>最後一個動詞有異文（見語法）。和合本「燒盡了」所依的讀法強調審判的徹底；較早的抄本作 εὑρεθήσεται「被顯露」，強調審判的鑒察——<strong>那一日，地上一切所作的，都要攤開在神面前。<\/strong>這使我們想起保羅說：「各人的工程必然顯露，因為那日子要將它表明出來，有火發現；這火要試驗各人的工程怎樣。」（林前 3:13）四節之後，彼得用同一個動詞說「安然見主」——原文是「被他找到」（3:14）。<\/p><p>所以這節經文問我們的，不是「地球甚麼時候燒掉」，而是「那一天我被找到的時候，是甚麼樣子」。<strong>這不是說神要丟棄他所造的世界，也不是說今天怎樣對待受造界都無所謂<\/strong>——火是審判與煉淨，3:13 的終點是新天新地。被火顯露的，正是我們今天怎樣生活、怎樣待人、怎樣管理神所交託的一切。<\/p><p>〔背景〕「像賊」是主自己的比喻（太 24:42–44）。〔彼前〕彼得前書講義第 1 章（彼前 1:7 信心被火試驗）、第 4 章（彼前 4:12 火煉的試驗）。<\/p>"},{"a":11,"z":13,"star":2,"grk":"<blockquote lang=\"grc\"><p>Τούτων οὕτως πάντων λυομένων ποταποὺς δεῖ ὑπάρχειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις, προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ θεοῦ ἡμέρας, δι’ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται. καινοὺς δὲ οὐρανοὺς καὶ γῆν καινὴν κατὰ τὸ ἐπάγγελμα αὐτοῦ προσδοκῶμεν, ἐν οἷς δικαιοσύνη κατοικεῖ.<\/p><\/blockquote>","lit":"<blockquote><p>「這一切既然都要這樣解散，你們應當是何等樣的人，活在聖潔的種種行為和敬虔的種種表現之中，等候並催促（或譯：切切渴慕）神的日子來臨；因那日，諸天被火焚燒而解散，元素被烈火熔化。但我們照他的應許，等候新的諸天和新的地，有義住在其中。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>怎樣<\/td><td>ποταπός<\/td><td>potapos<\/td><td>G4217<\/td><td>—<\/td><td>何等樣的<\/td><td>末世論的問題落在「你們是怎樣的人」<\/td><\/tr><tr><td>為人<\/td><td>ἀναστροφή<\/td><td>anastrophē<\/td><td>G391<\/td><td>ἀνά ＋ στρέφω（轉）<\/td><td>生活方式、行為<\/td><td>複數：一件一件具體的行為；彼前 1:15「在一切所行的事上」同字<\/td><\/tr><tr><td>敬虔<\/td><td>εὐσέβεια<\/td><td>eusebeia<\/td><td>G2150<\/td><td>εὖ（好）＋ σέβομαι（敬拜）<\/td><td>敬虔<\/td><td>1:3、6、7 同字：神已賜下的，現在活出來<\/td><\/tr><tr><td>仰望／盼望<\/td><td>προσδοκάω<\/td><td>prosdokaō<\/td><td>G4328<\/td><td>πρός ＋ δοκάω（等著看）<\/td><td>期待、等候<\/td><td>3:12、13、14 連用三次：等候是這一段的基調<\/td><\/tr><tr><td>切切仰望<\/td><td>σπεύδω<\/td><td>speudō<\/td><td>G4692<\/td><td>σπουδή（殷勤）同源<\/td><td>趕緊、催促；熱切追求<\/td><td>可譯「催促、加速」（見語法）；方法是悔改與聖潔，不是計算<\/td><\/tr><tr><td>鎔化<\/td><td>τήκω<\/td><td>tēkō<\/td><td>G5080<\/td><td>—<\/td><td>熔化<\/td><td>新約僅此一次；賽 34:4 七十士譯本同字<\/td><\/tr><tr><td>新<\/td><td>καινός<\/td><td>kainos<\/td><td>G2537<\/td><td>—<\/td><td>品質上的新<\/td><td>與 νέος（時間上的新）有別：更新，不只是另換一件<\/td><\/tr><tr><td>居<\/td><td>κατοικέω<\/td><td>katoikeō<\/td><td>G2730<\/td><td>κατά ＋ οἰκέω（居住）<\/td><td>定居、長住<\/td><td>對照 πάροικος（寄居的，彼前 2:11）：義不再寄居，而是安家<\/td><\/tr><\/table>","gram":"<p><strong>① σπεύδοντας——「切切仰望」還是「催促、加速」？<\/strong><\/p><ul><li><strong>熱切渴慕<\/strong>（和合本「切切仰望」，KJV hasting unto）：σπεύδω 可作「熱切追求」。<\/li><li><strong>催促、加速<\/strong>（ESV、NRSV 等，多數現代解經家）：σπεύδω 帶直接受詞通常是「使某事加快」；彼得自己在聖殿廊下說：「你們當悔改歸正，使你們的罪得以塗抹，這樣，那安舒的日子就必從主面前來到」（徒 3:19–20）；猶太傳統也有「以色列若悔改，彌賽亞就來」的說法。<\/li><\/ul><blockquote><p><strong>最好的理解：原文較支持「催促」，但上下文定了催促的方法：3:9 的悔改與 3:11 的聖潔、敬虔——這是參與神的心意，不是掌握神的時間表。這不是叫人推算日子，也不是說人能用政治、軍事或宗教工程「製造」主再來的條件；3:10「像賊」仍然管著 3:12。<\/strong><\/p><\/blockquote><p><strong>② καινοὺς οὐρανοὺς καὶ γῆν καινήν——毀滅後另造，還是煉淨更新？<\/strong><\/p><ul><li><strong>毀滅後另造<\/strong>：3:10 若讀「燒盡」，加上啟 21:1「先前的天地已經過去了」，主張舊世界完全消失。<\/li><li><strong>煉淨更新<\/strong>：καινός 是品質上的新；3:6 的洪水類比（世界「消滅」，地仍在）；受造之物「得享神兒女自由的榮耀」（羅 8:21）；主說「到復興的時候」（太 19:28）。<\/li><\/ul><blockquote><p><strong>最好的理解：更新論更合 καινός 與 3:6 的洪水類比；但兩派都同意，新天新地是神的作為，有義居在其中。無論採哪一說，都推不出「地球反正要燒，現在不必照顧」——這不是經文的推論。<\/strong><\/p><\/blockquote><p><strong>③ ἐν οἷς δικαιοσύνη κατοικεῖ<\/strong><\/p><p>「義」在這裡像一個人：它要「住下來」。κατοικέω 是長住，對比 παροικέω 寄居。彼得前書稱信徒是「客旅，是寄居的」（彼前 2:11）；新天新地裡，連義都不再寄居。<\/p>","exp":"<p><strong>知道結局的人，不是坐著等，是活得不一樣。<\/strong><\/p><p>彼得講完天地銷化，沒有接著畫一張時間表，而是問一個問題：「你們為人該當怎樣？」ποταπούς——何等樣的人。末世論在新約裡從來不是好奇心的題目，是生活的題目。「聖潔」「敬虔」在原文都是複數：不是一種抽象的氣質，是一件一件具體的行為——怎樣說話、怎樣花錢、怎樣對待家人、怎樣對待神所造的世界。彼得前書早就說過「在一切所行的事上也要聖潔」（彼前 1:15），同一個字 ἀναστροφή。<\/p><p>3:12–14 連續三次「仰望、盼望」。等候是這一段的基調。但彼得加了一個字 σπεύδοντας，和合本譯「切切仰望」，原文更可能是「催促」。等候不是坐在月台上看錶，是參與。<strong>我們催促那日子的方法不是算它，是活它：悔改、聖潔，把福音傳給還沒悔改的人（3:9）。<\/strong><\/p><p>然後是全章的題目：「但我們照他的應許，盼望新天新地，有義居在其中。」這應許出自以賽亞（賽 65:17；66:22），約翰在異象中看見它成就（啟 21:1）。「新」καινός 是品質上的新；保羅說受造之物要「得享神兒女自由的榮耀」（羅 8:21）。<strong>終點不是毀滅，是更新。<\/strong><\/p><p>最美的是最後一個字 κατοικεῖ——住下來不走。在這個世界，義只是寄居的少數，常被擠到角落；在新天新地，義是主人，安家長住。<strong>今天活出聖潔的人，是在一個義還在寄居的世界裡，先過著將來那個世界的生活。<\/strong>這就是 321「建立屬神的體系」的終局：一個義安家的地方。<\/p><p>〔舊約〕賽 65:17；66:22。〔彼前〕彼得前書講義第 1 章（彼前 1:15 在一切所行的事上聖潔）、第 2 章（彼前 2:11 客旅，是寄居的）。<\/p>"},{"a":14,"z":14,"star":1,"grk":"<blockquote lang=\"grc\"><p>Διό, ἀγαπητοί, ταῦτα προσδοκῶντες σπουδάσατε ἄσπιλοι καὶ ἀμώμητοι αὐτῷ εὑρεθῆναι ἐν εἰρήνῃ,<\/p><\/blockquote>","lit":"<blockquote><p>「所以，親愛的，你們既然等候這些事，就當竭力，使自己被他找到的時候，是沒有玷污、無可指摘的，在平安之中。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>殷勤<\/td><td>σπουδάζω<\/td><td>spoudazō<\/td><td>G4704<\/td><td>σπουδή（熱心）<\/td><td>竭力、趕緊<\/td><td>1:10、15 同字：在已得的恩典裡用力<\/td><\/tr><tr><td>沒有玷污<\/td><td>ἄσπιλος<\/td><td>aspilos<\/td><td>G784<\/td><td>ἀ（無）＋ σπίλος（污點）<\/td><td>無斑點<\/td><td>對照 2:13 假師傅 σπίλοι「已被玷污」<\/td><\/tr><tr><td>無可指摘<\/td><td>ἀμώμητος<\/td><td>amōmētos<\/td><td>G298<\/td><td>ἀ（無）＋ μῶμος（瑕疵）<\/td><td>無可挑剔<\/td><td>對照 2:13 μῶμοι「有瑕疵」；彼前 1:19 羔羊「無瑕疵、無玷污」<\/td><\/tr><tr><td>見<\/td><td>εὑρίσκω<\/td><td>heuriskō<\/td><td>G2147<\/td><td>—<\/td><td>找到、被發現<\/td><td>εὑρεθῆναι：與 3:10 εὑρεθήσεται 同一個動詞<\/td><\/tr><tr><td>安然<\/td><td>εἰρήνη<\/td><td>eirēnē<\/td><td>G1515<\/td><td>—<\/td><td>平安、和好<\/td><td>1:2「願恩惠、平安」：全卷開頭的平安，在見主的那一刻等著<\/td><\/tr><tr><td>盼望<\/td><td>προσδοκάω<\/td><td>prosdokaō<\/td><td>G4328<\/td><td>πρός ＋ δοκάω（等著看）<\/td><td>期待、等候<\/td><td>連續第三次：等候不是一句話，是一種活法<\/td><\/tr><\/table>","gram":"<p><strong>① αὐτῷ 是甚麼與格？<\/strong><\/p><ul><li><strong>施事與格<\/strong>：「被他找到」（被動不定詞 εὑρεθῆναι 的施事者）<\/li><li><strong>處所／關係與格<\/strong>：「在他面前」被發現<\/li><li><strong>利益與格<\/strong>：「為他」<\/li><\/ul><blockquote><p><strong>最好的理解：「被他找到」與「在他面前」都通，意思相近；重點是那一日找我們的是主自己——不是批評我們的人，也不是我們自己的良心。<\/strong><\/p><\/blockquote><p><strong>② ἄσπιλοι καὶ ἀμώμητοι——刻意與 2:13 對寫<\/strong><\/p><p>2:13 假師傅是 σπίλοι καὶ μῶμοι（已被玷污，又有瑕疵）；3:14 信徒是 ἄσπιλοι καὶ ἀμώμητοι，加上否定的 ἀ-。而彼前 1:19 稱基督為 ἀμνοῦ ἀμώμου καὶ ἀσπίλου（無瑕疵、無玷污的羔羊）——同一對字。潔淨的源頭是羔羊。<\/p><p><strong>③ ἐν εἰρήνῃ 是哪一種平安？<\/strong><\/p><ul><li>與神和好的狀態<\/li><li>內心不驚慌<\/li><li>與人和睦（對照假師傅帶來的分裂）<\/li><\/ul><blockquote><p><strong>最好的理解：以與神和好為主（1:2 的平安），帶出見主時心裡不慌張；和睦是它自然的果子。<\/strong><\/p><\/blockquote>","exp":"<p><strong>等候的終點，不是驚慌地被抓到，而是平安地被找到。<\/strong><\/p><p>「安然見主」原文是「在平安中被他找到」。3:10 說地和其上的工都要「被顯露、被找到」，這裡用同一個動詞說到我們。那一日主要找到的，不只是我們做了甚麼，而是我們是怎樣的人。<\/p><p>「沒有玷污，無可指摘」是一對字，故意和 2:13 對著寫：假師傅「已被玷污，又有瑕疵」；信徒卻是沒有玷污、沒有瑕疵。<strong>分辨假師傅的最後一步，不是更會挑別人的瑕疵，是自己殷勤地求潔淨。<\/strong><\/p><p>但這不是叫人靠自己變得無瑕。彼得前書說，我們被贖「乃是憑著基督的寶血，如同無瑕疵、無玷污的羔羊之血」（彼前 1:19）——同一對字。<strong>真正無玷污的是羔羊；我們被找到時的潔淨，是從他來的。<\/strong>「殷勤」σπουδάσατε 是 1:5、1:10 的那個字：不是為了賺得恩典，是在神已賜下的一切裡用力（1:3）。<\/p><p>所以「安然」不是自信，是和好。全卷第二節說「願恩惠、平安……多多地加給你們」（1:2），快到最後一頁，同一個平安在見主的那一刻等著。今天若想到主來就只有恐懼，問題不是你太敬虔，可能是還沒有把自己完全交在羔羊的血底下。<strong>被他找到的人，是早已被他尋回的人。<\/strong><\/p><p>〔彼前〕彼得前書講義第 1 章（彼前 1:19 無瑕疵、無玷污的羔羊）。<\/p>"},{"a":15,"z":16,"star":2,"grk":"<blockquote lang=\"grc\"><p>καὶ τὴν τοῦ κυρίου ἡμῶν μακροθυμίαν σωτηρίαν ἡγεῖσθε, καθὼς καὶ ὁ ἀγαπητὸς ἡμῶν ἀδελφὸς Παῦλος κατὰ τὴν δοθεῖσαν αὐτῷ σοφίαν ἔγραψεν ὑμῖν, ὡς καὶ ἐν πάσαις ἐπιστολαῖς λαλῶν ἐν αὐταῖς περὶ τούτων, ἐν αἷς ἐστιν δυσνόητά τινα, ἃ οἱ ἀμαθεῖς καὶ ἀστήρικτοι στρεβλοῦσιν ὡς καὶ τὰς λοιπὰς γραφὰς πρὸς τὴν ἰδίαν αὐτῶν ἀπώλειαν.<\/p><\/blockquote>","lit":"<blockquote><p>「並且要把我們主的恆久忍耐看作得救；正如我們所親愛的兄弟保羅，照著所賜給他的智慧寫信給你們，他在一切的信中也都講論這些事；其中有些難以明白的，那些沒有受教、不堅固的人加以扭曲，就像扭曲其餘的經書一樣，以致自己滅亡。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>長久忍耐<\/td><td>μακροθυμία<\/td><td>makrothymia<\/td><td>G3115<\/td><td>μακρός（長）＋ θυμός（怒氣）<\/td><td>恆久忍耐<\/td><td>3:9 μακροθυμεῖ 的名詞：全章鑰匙第二次出現<\/td><\/tr><tr><td>以…為<\/td><td>ἡγέομαι<\/td><td>hēgeomai<\/td><td>G2233<\/td><td>ἄγω（引領）<\/td><td>看作、認為<\/td><td>對照 3:9「有人以為他是耽延」：同一段時間，看作得救<\/td><\/tr><tr><td>兄弟<\/td><td>ἀδελφός<\/td><td>adelphos<\/td><td>G80<\/td><td>—<\/td><td>弟兄<\/td><td>ὁ ἀγαπητὸς ἡμῶν ἀδελφός：被糾正過的人稱糾正他的人「親愛的」<\/td><\/tr><tr><td>難明白的<\/td><td>δυσνόητος<\/td><td>dysnoētos<\/td><td>G1425<\/td><td>δυσ-（困難）＋ νοέω（理解）<\/td><td>難懂的<\/td><td>新約僅此一次；難懂，不是不可懂<\/td><\/tr><tr><td>無學問<\/td><td>ἀμαθής<\/td><td>amathēs<\/td><td>G261<\/td><td>ἀ（無）＋ μανθάνω（學習）<\/td><td>未受教的<\/td><td>新約僅此一次；不是沒有學歷，是不肯受教<\/td><\/tr><tr><td>不堅固<\/td><td>ἀστήρικτος<\/td><td>astēriktos<\/td><td>G793<\/td><td>ἀ ＋ στηρίζω（堅固）<\/td><td>不穩的<\/td><td>2:14 同字：假師傅引誘的正是這種人<\/td><\/tr><tr><td>強解<\/td><td>στρεβλόω<\/td><td>strebloō<\/td><td>G4761<\/td><td>στρέβλη（拉肢的刑架）<\/td><td>扭曲、硬拉<\/td><td>新約僅此一次：把經文綁上刑架，拉到自己要的長度<\/td><\/tr><tr><td>經書<\/td><td>γραφή<\/td><td>graphē<\/td><td>G1124<\/td><td>γράφω（寫）<\/td><td>聖經、經書<\/td><td>新約中一貫指聖經；保羅書信與「其餘的經書」並列<\/td><\/tr><\/table>","gram":"<p><strong>① 保羅「寫了信給你們」指哪一封？<\/strong><\/p><ul><li><strong>羅馬書<\/strong>：羅 2:4「他的恩慈是領你悔改」、9:22「多多忍耐寬容」，主題最貼近。<\/li><li><strong>寫給小亞細亞的書信<\/strong>（加拉太書、以弗所書、歌羅西書）：受書地區與彼得前書（彼前 1:1）重疊。<\/li><li><strong>無法確定<\/strong>。<\/li><\/ul><blockquote><p><strong>最好的理解：無法確定，也不必確定。「他一切的信上也都是講論這事」說明重點不在哪一封，而在保羅全部書信一致見證：主的忍耐是為了救恩。<\/strong><\/p><\/blockquote><p><strong>② 「難明白的」是哪些？<\/strong><\/p><ul><li><strong>恩典與自由<\/strong>：被扭曲成放縱（羅 6:1；加 5:13）——正對應 2:19「應許人得以自由」。<\/li><li><strong>末世<\/strong>：有人說主的日子已經到了（帖後 2:2）——正對應 3:3–4。<\/li><\/ul><blockquote><p><strong>最好的理解：兩者都在範圍內，而且正好是本卷第 2、3 章所對付的兩個題目：假自由與譏誚末日。<\/strong><\/p><\/blockquote><p><strong>③ τὰς λοιπὰς γραφάς——「別的經書」<\/strong><\/p><ul><li><strong>聖經<\/strong>（多數解經家）：λοιπάς（其餘的）把保羅書信放進 γραφαί 之列；新約中 γραφή 一貫指聖經。<\/li><li><strong>一般著作<\/strong>（少數）：與新約用法不合。<\/li><li>託名說據此推論本卷晚出（保羅書信已成集）；回應：保羅書信在他生前就被傳抄互讀（西 4:16），彼得只說他所知道的「一切的信」。<\/li><\/ul><blockquote><p><strong>最好的理解：這是新約內部第一次把使徒書信與「經書」並列。「難明白」不是禁止讀的理由——出問題的是「強解」的人，不是讀的人；保護讀經的方法是在群體中、照上下文、謙卑地讀。<\/strong><\/p><\/blockquote>","exp":"<p><strong>一個被當面抵擋過的使徒，在遺言裡稱抵擋他的人為「我們所親愛的兄弟」。<\/strong><\/p><p>先看 3:15 前半：「以我們主長久忍耐為得救的因由」。動詞 ἡγέομαι 和 3:9「有人以為他是耽延」是同一個字。同一段時間，有人看作耽延，彼得要你們看作得救——主多等一天，就多一個人可以回頭。這是全章的鑰匙第二次出現。<\/p><p>接著他請出一位證人：保羅。多年前在安提阿，保羅「當面抵擋」彼得，因為他「有可責之處」（加 2:11），那件事還寫進了加拉太書，各教會都讀得到。彼得在遺言裡沒有替自己辯護，也沒有提那一次；他只說，保羅有「所賜給他的智慧」，保羅的信和我講的是同一件事。<strong>這不是兩位使徒的角力，是兩個被同一位主寬容的人，站在同一個福音上。<\/strong>無己的人才說得出「親愛的兄弟」；無己才能合一。<\/p><p>然後是很誠實的一句：「信中有些難明白的。」連使徒都承認保羅不好懂——這對每一個讀羅馬書讀到頭痛的人都是安慰。但彼得說，問題不在「難」，而在兩種人：不肯受教的，和不堅固的。他們「強解」——στρεβλοῦσιν，原是把人綁上刑架拉扯的字。<strong>把經文綁起來，拉到自己要的長度，就是強解。<\/strong><\/p><p>所以這節經文不是叫會眾別讀難的經文，更不是說聖經只屬於少數專家。它給的保護是：在群體中讀、照上下文讀、謙卑地讀，讀不懂時願意被教——那正是「無學問」的反面。還有一件事：彼得把保羅的信和「別的經書」並列。<strong>我們手上的新約，有一部分是被一位曾經被它糾正的使徒親口認可的。<\/strong><\/p><p>〔背景〕加 2:11–14——落點在主：使兩位使徒同站一處的，是同一位主的長久忍耐。〔彼前〕彼得前書講義第 5 章（彼前 5:12 保羅的同工西拉為彼得轉交書信）。<\/p>"},{"a":17,"z":18,"star":3,"grk":"<blockquote lang=\"grc\"><p>ὑμεῖς οὖν, ἀγαπητοί, προγινώσκοντες φυλάσσεσθε ἵνα μὴ τῇ τῶν ἀθέσμων πλάνῃ συναπαχθέντες ἐκπέσητε τοῦ ἰδίου στηριγμοῦ, αὐξάνετε δὲ ἐν χάριτι καὶ γνώσει τοῦ κυρίου ἡμῶν καὶ σωτῆρος Ἰησοῦ Χριστοῦ. αὐτῷ ἡ δόξα καὶ νῦν καὶ εἰς ἡμέραν αἰῶνος. ἀμήν.<\/p><\/blockquote>","lit":"<blockquote><p>「所以你們，親愛的，既然預先知道，就要自己防備，免得被不法之人的迷惑一同帶走，從你們自己穩固的立足點上墜落；你們卻要在我們主和救主耶穌基督的恩典和知識上不斷長進。願榮耀歸給他，從現在直到永世的那一日。阿們。」<\/p><\/blockquote>","key":"<table><tr><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong’s<\/th><th>字根／構詞<\/th><th>基本字義<\/th><th>本節語境<\/th><\/tr><tr><td>預先知道<\/td><td>προγινώσκω<\/td><td>proginōskō<\/td><td>G4267<\/td><td>πρό（預先）＋ γινώσκω（知道）<\/td><td>預先知道<\/td><td>3:3「第一要緊的，該知道」——知道了，就不至於措手不及<\/td><\/tr><tr><td>防備<\/td><td>φυλάσσω<\/td><td>phylassō<\/td><td>G5442<\/td><td>φύλαξ（守衛）<\/td><td>看守、保護<\/td><td>中間語態 φυλάσσεσθε：看守自己；2:5 神「保護」挪亞同字<\/td><\/tr><tr><td>誘惑<\/td><td>συναπάγω<\/td><td>synapagō<\/td><td>G4879<\/td><td>σύν（一同）＋ ἀπάγω（帶走）<\/td><td>一同被帶走<\/td><td>加 2:13「連巴拿巴也隨夥裝假」同字<\/td><\/tr><tr><td>堅固的地步<\/td><td>στηριγμός<\/td><td>stērigmos<\/td><td>G4740<\/td><td>στηρίζω（堅固）<\/td><td>穩固的立足點<\/td><td>新約僅此一次；字根就是路 22:32「要堅固你的弟兄」<\/td><\/tr><tr><td>長進<\/td><td>αὐξάνω<\/td><td>auxanō<\/td><td>G837<\/td><td>—<\/td><td>生長、增長<\/td><td>現在式命令：不斷地長；彼前 2:2「叫你們因此漸長」同字<\/td><\/tr><tr><td>知識<\/td><td>γνῶσις<\/td><td>gnōsis<\/td><td>G1108<\/td><td>γινώσκω（知道）<\/td><td>知識、認識<\/td><td>全卷以「認識」開頭（1:2–3），以「知識」收尾<\/td><\/tr><tr><td>榮耀<\/td><td>δόξα<\/td><td>doxa<\/td><td>G1391<\/td><td>δοκέω（看來）<\/td><td>榮耀<\/td><td>1:17「從父神得尊貴榮耀」：山上看見的榮耀，最後歸給他<\/td><\/tr><tr><td>永遠<\/td><td>αἰών<\/td><td>aiōn<\/td><td>G165<\/td><td>—<\/td><td>世代、永世<\/td><td>εἰς ἡμέραν αἰῶνος：新約僅此一處的說法——永世的那一日<\/td><\/tr><\/table>","gram":"<p><strong>① τοῦ κυρίου 怎樣管「恩典和知識」？<\/strong><\/p><ul><li><strong>兩者都是主詞所有格<\/strong>：主所賜的恩典、主所賜的知識。<\/li><li><strong>兩者都是受詞所有格<\/strong>：「關於主的恩典」較不自然。<\/li><li><strong>分別理解<\/strong>：恩典是主賜的（主詞），知識是認識主（受詞）。<\/li><\/ul><blockquote><p><strong>最好的理解：分別理解。一個所有格同時管兩個面向：恩典從主來，知識是認識主。全卷第一句問安是「因你們認識神和我們主耶穌」（1:2），最後一句命令是在認識他上長進——首尾相扣。<\/strong><\/p><\/blockquote><p><strong>② αὐτῷ ἡ δόξα——頌讚歸給誰？<\/strong><\/p><ul><li><strong>歸給耶穌基督<\/strong>（多數解經家）：文法上最近、也是唯一的先行詞。<\/li><li><strong>歸給父神<\/strong>：新約頌讚多半歸給父。<\/li><\/ul><blockquote><p><strong>最好的理解：歸給基督。這是新約少數直接把榮耀歸給基督的頌讚之一（又見提後 4:18；啟 1:5–6），與 1:1「我們的神和救主耶穌基督」首尾呼應：全卷以基督的神性開頭，以敬拜基督結束。<\/strong><\/p><\/blockquote><p><strong>③ εἰς ἡμέραν αἰῶνος<\/strong><\/p><p>字面是「直到永世的那一日」，新約只有這裡這樣說。本章一路講「末後的日子」（3:3）、「主的日子」（3:10）、「神的日子」（3:12），最後一個「日」是永不落幕的那一日。<\/p><p><strong>④ 末尾 ἀμήν 的異文<\/strong><\/p><ul><li><strong>有「阿們」<\/strong>：𝔓72 א A C P Ψ 及多數抄本；和合本有「阿們」。<\/li><li><strong>無「阿們」<\/strong>：B 及少數小楷抄本；ECM／NA28 略去。<\/li><\/ul><blockquote><p><strong>最好的理解：有無「阿們」不改變意思；本講義照 SBLGNT 列出（待工程輪以實檔核對）。頌讚本身就是留給會眾接上「阿們」的地方。<\/strong><\/p><\/blockquote>","exp":"<p><strong>使徒的最後一句話，不是叮嚀，是讚美：願榮耀歸給他。<\/strong><\/p><p>3:17–18 是全卷的收束，次序不可顛倒：先防備，再長進，最後把榮耀歸給主。<\/p><p>「你們既然預先知道」——3:3 說「第一要緊的，該知道」，現在知道了，就要「防備」。φυλάσσεσθε 是中間語態：看守自己。第 2 章說神「保護了」挪亞（2:5），用的是同一個字。神保護他的人，也叫他的人看守自己——不是兩件事，是同一份看守的兩面。<\/p><p>危險被描寫得很具體：「被惡人的錯謬誘惑」——συναπαχθέντες，一同被帶走。這個字在新約另一處重要的出現是加 2:13，在安提阿「連巴拿巴也隨夥裝假」；那一次，帶頭「退去，與外邦人隔開」的正是彼得自己（加 2:12）。<strong>他知道一個堅固的人怎樣在一頓飯之間被帶偏，所以他寫：要防備。<\/strong>「堅固的地步」στηριγμός 新約只在這裡出現，字根正是主在那一夜對他說的「要堅固你的弟兄」（路 22:32）。<\/p><p>但防備不是全部。不墜落的方法不是站著不動，是「長進」——αὐξάνετε，持續地長。前書說「愛慕那純淨的靈奶……叫你們因此漸長」（彼前 2:2），又說「在這恩上站立得住」（彼前 5:12）；後書最後說在恩上長。<strong>站得住的人，還要長。<\/strong>長在恩典裡——從主來的；長在知識裡——認識主。<\/p><p>然後是最後一口氣：「願榮耀歸給他，從今直到永遠。」頌讚直接歸給耶穌基督，與 1:1 首尾相扣。本章一直在講「主的日子」，到這裡成了「永世的那一日」。<strong>照教會的傳統，一個快要被釘十字架的老人，最後寫下的不是自己，是他。<\/strong>讀完這卷書，我們記得的不該是彼得多偉大，而是主多恆久忍耐——願榮耀歸給他。<\/p><p>〔背景〕被等回來、被堅固的人，用一生堅固他的弟兄（路 22:32；加 2:11–13；約 21:18–19）。〔彼前〕彼得前書講義第 2 章（彼前 2:2 漸長）、第 5 章（彼前 5:12 在這恩上站立得住→本章在恩上長進）。<\/p>"}]},"serm":{"1":{"min":18,"blocks":[["h","《直等到天發亮，晨星在你們心裡出現》"],["p","那是加利利海邊的一個早晨，炭火還在燒著。"],["p","魚和餅剛剛吃完，主轉過頭來對彼得說話。"],["q","「我實實在在地告訴你，你年少的時候，自己束上帶子，隨意往來；但年老了，就要伸出手來，別人要把你束上，帶你到不願意去的地方。」（約21:18）"],["p","約翰就在旁邊聽得清清楚楚。"],["p","後來他在福音書裡加了一句註解："],["q","「耶穌說這話是指著彼得要怎樣死，榮耀神。」"],["p","說完這話，主對彼得說：「你跟從我吧！」"],["p","彼得轉過身看見約翰跟在後面。"],["p","他問了一個我們也常常會問的問題："],["q","「主啊，這人將來如何？」"],["p","我知道我會怎樣死了，那麼他呢？"],["p","主的回答很短，短得像一扇門關上："],["q","「我若要他等到我來的時候，與你何干？你跟從我吧！」"],["p","你跟從我吧。同一個早晨主說了兩次。"],["p","三十多年過去了，那個海邊的漁夫老了。"],["p","頭髮白了，手也沒有從前那樣有力。"],["p","羅馬城裡逼迫的風聲一天比一天緊。"],["p","他知道海邊那一句話快要應驗了。"],["p","有人要把他束上，帶他到不願意去的地方。"],["p","於是他提起筆來寫他最後的一封信。"],["q","「因為知道我脫離這帳棚的時候快到了，正如我們主耶穌基督所指示我的。」（1:14）"],["p","「所指示我的」指的就是海邊那一天。"],["p","三十年來他一直知道自己會怎樣死。"],["p","一個人知道自己快要走了會寫甚麼？"],["p","一定是他心裡認為最要緊的那幾句話。"],["p","你看他第一行寫的是：「西門彼得」。"],["p","西門是他的本名，是主在海邊叫他的名字。"],["p","「約翰的兒子西門，你愛我比這些更深嗎？」"],["p","主三次這樣叫他，一句一句地"],["p","把他從三次不認主的羞愧裡接了回來。"],["p","臨終提筆他先寫下那個被主叫過的名字。"],["p","而且「僕人」在前，「使徒」在後。"],["p","先是屬於主的人，然後才是被差的人。"],["p","所以這封信不是一個偉人的回憶錄"],["p","是一個被主接回來的人，最後一次說："],["p","你們也跟從他吧，他是值得跟從的。"],["p","今天這一章他留給我們三樣東西："],["p","一份已經給了的禮物，一張要加上的清單"],["p","還有一盞在暗處發光、陪我們等天亮的燈。"],["p","第一，一切都已經給了。"],["q","「神的神能已將一切關乎生命和虔敬的事賜給我們，皆因我們認識那用自己榮耀和美德召我們的主。」（1:3）"],["p","請記得這是一封遺言。"],["p","照常理遺言是一連串的叮嚀：你要這樣，你不要那樣。"],["p","可是彼得的第一句話並不是命令。"],["p","他還沒有叫你做任何一件事，就先說："],["p","一切都已經賜給你們了。"],["p","「賜給」這個字原文是完成式。"],["p","不是將來才給，也不是看你表現再給"],["p","是已經給了，而且到今天還在你手上。"],["p","給了多少？關乎生命和虔敬的，一切。"],["q","你缺的，真的是更多的供應嗎？"],["p","很多基督徒把信仰活成了一種缺乏"],["p","總覺得自己還差一點甚麼才算夠。"],["p","再多一次聚會，再多一次特別的經歷"],["p","再多一次被按手禱告，我才夠屬靈。"],["p","彼得說你並不缺。"],["p","你缺的是更深地認識那一位已經給的主。"],["p","一切是怎樣送到我們手上的？"],["p","「皆因我們認識那……召我們的主。」"],["p","神沒有寄一個包裹給我們就走了。"],["p","他把自己給了我們，一切都在認識他裡面。"],["p","這裡還有一個字值得我們停下來看。"],["p","「美德」——召我們的主有他的美德。"],["p","兩節以後第五節的「德行」，原文正是同一個字。"],["p","他身上有的，他召我們也長出來。"],["p","我們要長成的，本來就是他的樣子。"],["p","然後彼得寫下全卷最高的一句話："],["q","「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。」（1:4）"],["p","「與神的性情有分」這一句很容易講偏"],["p","所以有人乾脆跳過一句也不講。"],["p","我們今天不跳過，也不把它講過頭。"],["p","「有分」這個字彼得其實很熟悉。"],["p","多年前在革尼撒勒湖邊打魚的時候"],["p","雅各、約翰是西門的「夥伴」，原文就是這個字。"],["p","那時候他們有分的是一條船、一網魚。"],["p","如今主說：你要有分的是我的生命。"],["p","可是在這裡我們要誠實地畫一條線。"],["p","有分，不等於變成；夥伴，不等於船主。"],["q","創造者與受造者的分別，永遠存在。"],["p","人有分於神的聖潔與愛，是在基督裡與他聯合；"],["p","卻不是人變成神，也不與神的本質混同。"],["p","那麼「有分」的內容是甚麼？彼得自己寫出來了。"],["p","往前看是脫離世上從情慾來的敗壞。"],["p","往後看是德行、知識、節制、忍耐，一直到愛。"],["p","神的性情落在人身上，長出來的是品格。"],["p","而且你看這是「應許」，是「賜給」。"],["p","有分是恩典，不是修煉，更不是爭取來的。"],["q","長進不是爬上去見神，是神已經下來，把一切賜給我們。"],["p","第二，所以要在信心裡加上。"],["q","「正因這緣故，你們要分外地殷勤；有了信心，又要加上德行；有了德行，又要加上知識。」（1:5）"],["p","「正因這緣故」，因為神已經給了一切"],["p","所以你們要分外地殷勤，不是閒著等。"],["p","恩典不叫人閒懶，恩典叫人殷勤。"],["p","這個次序不能顛倒：先有神的完成式"],["p","然後才有我們的命令式。"],["p","「加上」這個字原文有一個畫面。"],["p","古希臘的城邦每年辦戲劇節"],["p","要有人出錢供應一整個合唱團。"],["p","服裝、排練、演出，全部由他供應。"],["p","那是一份榮譽，大家比的是誰供應得更大方。"],["p","彼得用這個字說：在你的信心裡"],["p","大方地、慷慨地供應出德行來。"],["p","不是勉強湊數，是甘心樂意地給出去。"],["p","而且原文不是「在信心上面」，是「在信心裡面」。"],["p","德行從信心裡長出來，知識從德行裡長出來。"],["p","這不是一道樓梯，是一棵慢慢長大的樹。"],["p","你看這八樣：信心、德行、知識、節制"],["p","忍耐、虔敬、愛弟兄的心、愛眾人的心。"],["p","起點是信心，是神親手分給你的。"],["p","知識只在第二級；認識主若停在腦子裡"],["p","就長不出節制，也長不出忍耐。"],["p","最後兩級都是愛人：先愛弟兄，再愛眾人。"],["q","品格的頂點，不是一個人多屬靈，是他多能愛。"],["p","所以這不是一張照表操課的步驟表"],["p","也不是做完第一項，才准做第二項。"],["p","這是一棵樹，從神所給的信心裡結出果子。"],["p","彼得接著說：長和不長，到底差在哪裡。"],["q","「人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨。」（1:9）"],["p","「只看見近處的」，原文是一個瞇起眼睛的字。"],["p","英文的「近視」就是從這個字來的。"],["p","不是天生看不見，是自己把眼睛瞇起來"],["p","只盯著眼前的那一點，別的都看不見。"],["p","眼前那一點是甚麼？這個月的帳單"],["p","同事的一個臉色，家人說的一句重話。"],["p","看不見的遠處是甚麼？是那永遠的國。"],["p","可是病根在下半句：「忘了」。"],["p","忘了他舊日的罪已經得了潔淨。"],["p","他忘記的不是規條，是恩典。"],["p","一個忘了自己被赦免多少的人"],["p","長不出忍耐，也長不出愛。"],["p","這節經文不是拿來指著別人說你瞎了。"],["p","這是給我們每一個人的一次眼科檢查。"],["p","治療的方法也很溫柔：不是更用力，是想起來。"],["p","彼得最知道這一點。那一夜在大祭司的院子裡"],["p","雞叫了，主轉過身來看了他一眼。"],["p","「彼得便想起主對他所說的話。」"],["p","把他從跌倒裡叫回來的，就是一次想起來。"],["q","「所以弟兄們，應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳。」（1:10）"],["p","「永不失腳」。寫這句話的人"],["p","曾經在加利利的水面上一步一步往下沉。"],["p","也曾經在那個寒冷的院子裡跌得很重。"],["p","他知道失腳是甚麼滋味，也知道是誰拉住他。"],["p","「耶穌趕緊伸手拉住他。」"],["p","所以這一句不是一個強人的保證"],["p","是一個被主拉住過的人作的見證。"],["q","「這樣，必叫你們豐豐富富地得以進入我們主救主耶穌基督永遠的國。」（1:11）"],["p","「得以進入」原文又是那個供應的字。"],["p","只是這一次是神大方地供應我們。"],["p","你在信心裡大方地供應德行；"],["p","神在那一天大方地供應你進國的門。"],["p","不是從門縫裡擠進去，是被盛大地迎接進去。"],["p","而那國是我們主救主耶穌基督永遠的國。"],["p","第三，燈與晨星。"],["p","彼得接著說他為甚麼要一再提醒。"],["q","「我以為應當趁我還在這帳棚的時候提醒你們，激發你們。」（1:13）"],["p","帳棚這個字，彼得一輩子都忘不了。"],["p","那一天在山上主在他們面前變了形像"],["p","臉面明亮如日頭，衣裳潔白如光。"],["p","彼得看呆了，脫口而出："],["q","「主啊，我們在這裡真好！你若願意，我就在這裡搭三座棚，一座為你，一座為摩西，一座為以利亞。」"],["p","他想把榮耀留在山上，關進帳棚裡。"],["p","可是路加記下那天摩西和以利亞"],["p","正在與主談論他「去世」的事。"],["p","「去世」這個字原文就是「出埃及」。"],["p","主在談自己要在耶路撒冷成就的出埃及"],["p","彼得卻在盤算帳棚要怎樣搭。"],["p","三十年後，老彼得寫："],["q","「並且我要盡心竭力，使你們在我去世以後時常記念這些事。」（1:15）"],["p","「我去世以後」，他用了同一個字：出埃及。"],["p","年輕的彼得想把榮耀關進帳棚；"],["p","年老的彼得終於知道："],["q","帳棚是要拆的，榮耀是要等的。"],["p","死亡不是結束，是一次出埃及。"],["p","一個快要離世的人，最後的殷勤用在哪裡？"],["p","不是保住自己的名聲"],["p","是叫別人在他走了以後，還記得主的話。"],["p","然後他的筆回到了那座山。"],["q","「我們從前將我們主耶穌基督的大能和他降臨的事告訴你們，並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮。」（1:16）"],["p","那個時代有很多神明下凡的故事。"],["p","編得很巧，講得很美，大家也知道那是故事。"],["p","彼得說：我們沒有編，我們是在場的人。"],["p","有意思的是那天在山上，彼得說了一大段話。"],["p","福音書說他其實不知道自己在說甚麼。"],["p","三十年後他一句也沒有提自己說過的話。"],["p","他只記得一個從天上來的聲音："],["q","「這是我的愛子，我所喜悅的。」（1:17）"],["p","人老了會忘記自己說過多少話"],["p","卻忘不了神說過的那一句。"],["p","焦點從來不是彼得看見了多少"],["p","而是那一位被父喜悅的愛子。"],["p","可是你會說：我沒有上過那座山。"],["p","我沒有親眼看見，也沒有親耳聽見。"],["p","彼得早就想到你了，他接著寫："],["q","「我們並有先知更確的預言，如同燈照在暗處。你們在這預言上留意，直等到天發亮，晨星在你們心裡出現的時候，才是好的。」（1:19）"],["p","山上的經歷叫先知的話更加確定了。"],["p","但你不必等到有同樣的經歷才相信"],["p","因為那更確的話已經在你手裡。"],["p","它像甚麼？像一盞燈。"],["p","「暗處」這個字不只是暗，是又乾又髒的地方。"],["p","那就是我們今天所住的世界。"],["p","燈不是太陽，它不會把整個世界照亮"],["p","它只照亮你腳前的那一步。"],["p","可是在天亮以前，燈就是你唯一可靠的光。"],["q","天還沒有亮，你手裡拿的是甚麼？"],["p","有人放下手中的燈，去追一陣閃光。"],["p","一個新奇的說法，一次驚人的經歷"],["p","一個說得頭頭是道、叫人心跳的人。"],["p","彼得說：要留意這一盞燈。"],["p","原文是一直看著，不是偶爾看一眼。"],["p","「直等到天發亮，晨星在你們心裡出現。」"],["p","天亮，是主再來的那個早晨；"],["p","晨星，是那一位帶著光來的。"],["p","這使我們想起主自己說：「我是明亮的晨星。」"],["p","那一天燈可以放下了，因為光的本身來了。"],["p","請注意晨星是出現在「心裡」。"],["p","不是腦子裡多了一條知識，是心裡有了一位主。"],["p","最後彼得說這盞燈是從哪裡來的。"],["q","「因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。」（1:21）"],["p","「感動」這個字原文是「被帶著」。"],["p","保羅坐的船遇上狂風，船被風抓住"],["p","只能任風颳去，用的正是同一個字。"],["p","先知像一艘帆船：帆是他的"],["p","聲音、用字、性情，都是他自己的；"],["p","風卻是聖靈的，方向是神的。"],["p","所以第二十節說預言沒有可隨私意解說的。"],["p","那不是叫你不敢自己讀經。"],["p","彼得講的首先是預言從哪裡來。"],["p","他不是要把聖經鎖起來，交給少數人。"],["p","讀經的保護是三件事：在群體中讀"],["p","照上下文讀，存著謙卑的心讀。"],["p","當初帶著先知說話的那一位聖靈"],["p","今天也帶著每一個讀經的人明白。"],["p","我們回到海邊吧。那一天彼得問："],["p","「這人將來如何？」主說：「你跟從我吧！」"],["p","三十年後彼得終於懂了。"],["p","他沒有在信裡拿自己和約翰比"],["p","沒有提自己在山上說過甚麼"],["p","也沒有替自己辯護一句。"],["p","他只是把眼睛定在主的身上。"],["p","這正是321一直說的：先生命，再關係，後事工。"],["p","先有神已經賜下的生命"],["p","才有在信心裡加上的一級一級"],["p","而那終點，是愛弟兄、愛眾人。"],["p","事工是從生命和關係裡長出來的果子。"],["p","321也說：舊人有己，新人無己。"],["p","可是無己不是變成沒有，我們要說得準確："],["q","無己的人，進入的是與無限之神的相交，不是人變成無限。"],["p","「現在活著的，不再是我，乃是基督在我裡面活著。」"],["p","這才是「與神的性情有分」的福音。"],["p","老彼得的帳棚快要拆了，他知道日子不多。"],["p","他沒有抓住自己的名聲，只要我們記得主的話。"],["p","最後一封信的最後一句，他寫的是："],["p","「願榮耀歸給他，從今直到永遠。」"],["q","這就是讓耶穌得著一切的榮耀。"],["p","所以這一週你不必一次補齊八樣。"],["p","在你的信心裡大方地供應一樣就好。"],["p","也許是節制，也許是忍耐"],["p","也許是去愛一位你不太容易愛的人。"],["p","每天早上打開聖經，就像在暗處點起一盞燈。"],["p","不追閃光，只照亮腳前的下一步。"],["p","當你走得很慢、很累，覺得天怎麼還不亮"],["p","請記得：一切都已經給了。"],["p","主在海邊等過彼得，又陪他走了三十年；他也在等你。"],["p","天還沒有亮，但是燈在你手裡。不要放下它。"],["q","直等到天發亮，晨星在你們心裡出現。"],["p","你跟從我吧。"],["p","這是主在海邊對彼得說的話"],["p","也是今天他對你說的話。"]]},"2":{"min":18,"blocks":[["h","《這些人是無水的井，是狂風催逼的霧氣》"],["p","你怎麼知道你聽的講道是真的？"],["p","我不是問誰是假的，是問你憑甚麼分辨。"],["p","包括今天這一篇，包括站在這裡講話的我。"],["p","因為我的口才好嗎？因為我引了很多經文嗎？"],["p","因為我會講幾個希臘文字嗎？"],["p","因為我們的教會人比較多嗎？"],["p","這些都不是答案。"],["p","口才可以練，經文可以斷章取義。"],["p","希臘文可以拿來唬人，人多也不代表方向對。"],["p","那麼我們到底要憑甚麼分辨？"],["p","今天這一章，就是彼得給我們的回答。"],["p","你在乾旱的山地走了一整天，口渴得嘴唇都裂開了。"],["p","你記得前面有一口泉，就照著記憶走過去。"],["p","到了泉邊，只看見乾裂的石頭。"],["p","這比本來就沒有泉更殘酷，"],["p","因為你把整天的盼望都放在那裡。"],["p","彼得說，有一種講道就是這樣。"],["q","「這些人是無水的井，是狂風催逼的霧氣，有墨黑的幽暗為他們存留。」（2:17）"],["p","這是彼得寫給教會的最後一封信。"],["p","臨終的人只講最要緊的話，"],["p","他卻用了整整一章來講這一口乾井。"],["p","我們今天跟著他走三步："],["p","乾井會從裡面冒出來；主知道搭救；"],["p","假自由與真回頭。"],["q","「從前在百姓中有假先知起來，將來在你們中間也必有假師傅，私自引進陷害人的異端，連買他們的主他們也不承認，自取速速的滅亡。」（2:1）"],["p","請你特別注意「在你們中間」這四個字。"],["p","危險不是從外面攻城，是從我們裡面長出來的。"],["p","彼得前書講的是外面來的逼迫，"],["p","彼得後書講的是裡面冒出來的乾井。"],["p","私自引進，原文的意思是夾帶，"],["p","像把一樣東西悄悄塞進行李裡面。"],["p","所以假師傅從來不掛假師傅的招牌。"],["p","他們講許多對的話，"],["p","只在最要緊的地方換掉一樣東西。"],["p","換掉的是甚麼呢？就是那買他們的主。"],["p","這個主字，是奴隸市場上付了價錢的主人。"],["p","基督用自己的血把我們買了回來，"],["p","他們卻說我不屬於任何人。"],["p","他們不一定口裡說沒有耶穌，"],["p","更常是用生活說他不是我的主人。"],["p","不承認這個字，原文是 ἀρνέομαι。"],["p","這個字，彼得比誰都熟悉。"],["p","那一夜在大祭司院子的炭火旁，"],["p","一個使女說你也是跟他一夥的。"],["p","彼得說我不認得他，說了一次又一次。"],["p","三次不認主，他用的就是這一個字。"],["p","寫這句話的人，自己不承認過主。"],["q","「主轉過身來看彼得……他就出去痛哭。」（路 22:61–62）"],["p","那麼他和假師傅的分別在哪裡呢？"],["p","不是他從來沒有否認過主，"],["p","是主轉過身來看了他一眼；是他出去痛哭；"],["p","是他在加利利海邊被主接了回來。"],["p","所以這一章那些很嚴厲的話，"],["p","不是一個完美的人居高臨下的定罪，"],["p","是一個曾經站在懸崖邊上的人，"],["p","被主一把拉回來以後，看見別人正往下走，"],["p","就在後面大聲地喊。"],["p","聽懂這一點，就知道怎樣讀這一章。"],["p","不是拿來指著別人，是先拿來照自己。"],["p","彼得在這一章給了我們五個記號。"],["p","對基督：還承不承認那買他的主？"],["p","對金錢：是不是貪心取利？"],["p","對身體：是不是放縱肉身的情慾？"],["p","對權柄：是不是膽大任性？"],["p","對自由：是不是應許人自由，自己卻作奴僕？"],["p","五個記號沒有一個是口才，"],["p","也沒有一個是宗派的標籤，全都是果子。"],["p","主耶穌早就說得很清楚："],["q","「憑著他們的果子，就可以認出他們來。」（太 7:16）"],["p","所以我在講台上不給你一張名單。"],["p","我不會點名今天任何一位牧者，"],["p","也不會點名任何教會、宗派或網路傳道人。"],["p","講台教的是記號，不是名單。"],["p","因為手裡拿著名單的人，最容易忘記照自己。"],["p","我們再看第三節的捏造的言語。"],["p","捏造這個字，是陶匠照著客人想要的形狀捏泥。"],["p","取利這個字，是做買賣。"],["p","做買賣的對象是誰呢？是你們。"],["p","在這種講道裡，會眾不是羊，會眾是貨。"],["p","所以我要先問我自己："],["p","我講道是照真理講，還是照掌聲捏？"],["p","我也要問你：你特別喜歡某一種講道，"],["p","是因為它是真的，"],["p","還是因為它剛好捏成你想要的形狀？"],["p","這就是分辨的起點：分辨，從自己開始。"],["p","天使、洪水、所多瑪，很多人讀到這裡就害怕。"],["p","但請你看清楚這個句子的形狀。"],["p","從第四節開始，原文是一個很長的若字句。"],["p","若神沒有寬容犯罪的天使，"],["p","若神沒有寬容上古那個世代，"],["p","若神傾覆了所多瑪和蛾摩拉，那麼——"],["p","這一口長長的氣，要到第九節才吐出來。"],["p","所以不要停在火裡面，"],["p","要一直讀到那一隻伸出來的手。"],["p","三個審判裡面，藏著兩次搭救。"],["p","第一次搭救，是挪亞。"],["p","彼得稱他為傳義道的，原文是傳令官，"],["p","就是替王站在廣場上宣告命令的人。"],["p","挪亞在一個不敬虔的世代替神喊話，"],["p","聖經沒有記載家族以外有任何人回應。"],["p","用今天的標準，他是很失敗的傳道人。"],["p","但是神親自看守了他一家八口。"],["p","他的價值不是用聽眾人數來量的，"],["p","是用神看守了他來量的。"],["p","第二次搭救，是羅得。"],["p","熟悉創世記的人讀到這裡一定會皺眉。"],["p","他看見平原滋潤，就選了所多瑪；"],["p","天使催他快走，他還遲延不走。"],["p","彼得怎麼會稱他為義人，而且一連三次？"],["p","答案就在第八節。"],["q","「因為那義人住在他們中間，看見聽見他們不法的事，他的義心就天天傷痛。」（2:8）"],["p","傷痛這個字，原文本來是試金石，"],["p","後來變成了刑具的字，而且是天天如此。"],["p","羅得每天看見，每天心裡被刺一下。"],["p","他沒有能力改變那一座城，"],["p","也沒有勇氣自己離開，"],["p","但他的心還沒有麻木。"],["p","所以義不是完美，義是一顆還會傷痛的心。"],["p","今天很多人也住在所多瑪中間："],["p","在螢幕裡，在辦公室裡，在飯局上。"],["p","危險不在於看見，在於看久了就不再痛了。"],["p","還會痛，就表示還有義心。"],["p","如果已經不痛了，"],["p","我們一起求主把那份痛再還給我們。"],["p","而且羅得蒙搭救，不是因為他夠好。"],["p","是天使拉著他的手，把他領出城外。"],["p","搭救這個動詞的主詞是神，這就是恩典。"],["p","現在，那一口長氣終於吐出來了："],["q","「主知道搭救敬虔的人脫離試探，把不義的人留在刑罰之下，等候審判的日子。」（2:9）"],["p","這一節是彼得後書全卷的樞紐。"],["p","知道這個字，後面加上一個動詞，"],["p","意思就是懂得怎樣去做。"],["p","主不只是知道你現在的處境，"],["p","他懂得怎樣把你從裡面拉出來。"],["p","他拉挪亞用方舟，拉羅得用天使的手。"],["p","方法完全不一樣，但他都懂。"],["p","脫離試探，原文是從試煉裡面救出來。"],["p","不是保證你永遠不進洪水，"],["p","是在你身在其中的時候把你拉出來。"],["p","這個字就是主禱文救我們脫離兇惡的那個字。"],["p","老彼得寫下主知道這三個字的時候，"],["p","不可能不想起加利利海邊的那個早晨。"],["p","三次不認主以後，他對復活的主說："],["q","「主啊，你是無所不知的；你知道我愛你。」（約 21:17）"],["p","一個連自己都靠不住的人，"],["p","被一位甚麼都知道的主拉了回來。"],["p","所以這一節不是彼得多堅強的見證，"],["p","是主多恆久忍耐的見證。"],["p","這也告訴我們第二章為甚麼要講審判。"],["p","講審判，是為了叫敬虔的人安心，"],["p","不是為了叫敬虔的人害怕。"],["p","你是不是被困在不義的人很得勢的地方？"],["p","這一節不是叫你去算誰會受罰，"],["p","是叫你把眼睛從他們身上移回主身上。"],["p","審判是主的事，搭救也是主的事。"],["p","我們的本位，就是敬虔。"],["q","「他們膽大任性，毀謗在尊位的，還不知懼怕。」（2:10）"],["p","任性這兩個字，原文是 αὐθάδεις，"],["p","由自己和取悅兩個字組合起來，"],["p","意思是以取悅自己作為生活的準繩。"],["p","用我們熟悉的話來說，就是有己。"],["p","保羅說作監督的必須不任性，用的正是這個字。"],["p","最危險的任性，常常出現在有講台的人身上。"],["p","這一節常常被人拿來這樣用："],["p","你質疑牧師，就是輕慢主治的。"],["p","這不是這一節經文的意思。"],["p","請你看清楚，這一章被定罪的是誰？"],["p","是師傅，是有講台、有跟隨者的人。"],["p","彼得在前一封信裡給長老的命令是："],["q","「也不是轄制所託付你們的，乃是作群羊的榜樣。」（彼前 5:3）"],["p","照著真理、在愛中、按著次序提出的質疑，"],["p","那不是毀謗。"],["p","一個不肯接受任何質疑的領袖，"],["p","倒要先拿這一節照一照自己，也包括我。"],["p","天使的力量權能比他們大得多，"],["p","也不在主面前用毀謗的話告他們。"],["p","天使比假師傅強得多，卻把審判留給主；"],["p","假師傅比天使弱得多，卻隨口宣判別人。"],["p","這就是驕傲：離開本位，抓住只屬於神的權柄。"],["p","接著，彼得講到巴蘭的故事。"],["p","摩押王用重金請巴蘭來咒詛以色列。"],["p","巴蘭口裡說我只照神的話說，"],["p","心裡卻一直放不下那一份工價。"],["p","他騎著驢出發，耶和華的使者三次攔在路上。"],["p","先知看不見，驢卻看見了。"],["p","先知氣得一連打了驢三次，"],["p","然後，那頭驢開口說話了。"],["q","「那不能說話的驢以人言攔阻先知的狂妄。」（2:16）"],["p","這是全章最幽默的一筆。"],["p","前面才說假師傅像沒有靈性的畜類，"],["p","這裡卻是一頭畜類說出了人話。"],["p","一個被錢沖昏了頭的先知，比驢還不清醒。"],["p","弟兄姊妹，神今天也有他的驢。"],["p","可能是你看不起的人說的一句話，"],["p","可能是一個一再受阻的計畫，"],["p","可能是一扇怎麼推都推不開的門。"],["p","巴蘭打了驢三次，卻不知道驢救了他的命。"],["p","下一次你被攔住的時候，先別急著打驢。"],["p","先問自己：我是不是正往不義的工價那裡走？"],["p","然後就是本章的篇名：無水的井。"],["p","井佔了源頭的位置，人來要水，它卻給不出水。"],["p","夏天早晨的霧，看起來好像要下雨，"],["p","太陽一出來，風一吹，就散得乾乾淨淨。"],["p","狂風這個字，彼得也非常熟悉。"],["p","那一夜加利利海上起了暴風，就是這個字。"],["p","那一夜船上有一位主，起來斥責風浪。"],["p","被狂風催逼的霧，身邊沒有這一位主。"],["p","它們自稱自由，其實是被風趕著跑。"],["q","「他們應許人得以自由，自己卻作敗壞的奴僕，因為人被誰制伏就是誰的奴僕。」（2:19）"],["p","制伏這個字，原文是打敗仗。"],["p","古代打敗仗的人，就成了勝利者的奴隸。"],["p","他們以為自己勝過了規條，"],["p","其實是被自己的情慾打敗了。"],["p","他們以為自己作了主，"],["p","其實是被別的東西作了主。"],["p","這就是有己最後的結局。"],["p","舊人要自己作主作王，"],["p","結果被錢作了主，被情慾作了主，"],["p","被別人的掌聲作了主。"],["p","我要問你一個很實際的問題："],["p","哪一件事你說我可以控制，其實它已經在控制你？"],["p","是手機嗎？是酒嗎？是一段關係嗎？"],["p","還是一種怎樣也停不下來的比較？"],["q","「所以天父的兒子若叫你們自由，你們就真自由了。」（約 8:36）"],["p","自由不是沒有主人，是有一位好主人。"],["p","彼得在第一章第一節自稱耶穌基督的僕人。"],["p","整卷書裡只有兩種僕人："],["p","作基督的僕人，或作敗壞的奴僕，"],["p","沒有第三種誰都不服的人。"],["q","「俗語說得真不錯：狗所吐的，牠轉過來又吃；豬洗淨了又回到泥裡去滾；這話在他們身上正合式。」（2:22）"],["p","很多人讀到這裡，心就涼了半截。"],["p","我也跌倒過，我是不是那一隻狗？"],["p","請你看清楚這段話是在講誰。"],["p","它的上下文是假師傅和跟隨他們的人。"],["p","他們明明曉得義路，"],["p","卻拿著自由去引誘剛逃出來的人。"],["p","這段話不是寫給一位跌倒了，"],["p","心裡很痛、很想回家的弟兄姊妹。"],["p","狗轉過來，原文是 ἐπιστρέψας。"],["p","這個字，彼得一輩子都忘不了，"],["p","因為在那一夜，主曾經對他說："],["q","「你回頭以後，要堅固你的弟兄。」（路 22:32）"],["p","這裡的回頭，就是同一個字。"],["p","同一個字，卻有兩個方向。"],["p","狗轉過來，回到牠所吐的；"],["p","彼得轉過來，回到主的面前。"],["p","寫這段話的人，自己跌得比誰都重。"],["p","他不是站在懸崖上俯視別人，"],["p","他是從谷底被主拉上來的人。"],["p","現在，我們回到開頭的那個問題。"],["p","你怎麼知道你聽的講道是真的？"],["p","不是看它講得多響亮。"],["p","那些矜誇的大話是腫起來的，裡面是空的。"],["p","請你用這幾個問題來分辨："],["p","它叫你更承認那買你的主，"],["p","還是叫你覺得自己不屬於任何人？"],["p","它叫你放下貪心，還是點燃貪心？"],["p","它叫你更甘心地順服，還是更任性地作主？"],["p","真的講道，會把你帶回主的面前；"],["p","假的講道，會把你帶回你自己。"],["p","今天這一篇，也請你照樣檢驗。"],["p","分辨的果效是更穩、更溫柔，不是更多疑。"],["p","如果聽完這一章，你只想上網找誰是假師傅，"],["p","那你就把這一章讀反了。"],["p","彼得要我們先照自己，"],["p","因為乾井最先冒出來的地方，"],["p","可能正是我自己的心。"],["p","有己，就是凡事自己作主。"],["p","自己作主的人，最後總被別的東西作主。"],["p","出路只有一條：謙卑戰勝驕傲。"],["p","放下抓在手裡的權柄，回到本位。"],["p","讓神作神，也讓人作人。"],["p","審判交給主，搭救也交給主，"],["p","我們只管謙卑地跟著他走。"],["p","如果你今天心裡很害怕，"],["p","怕自己就是那一隻回頭的狗，"],["p","你會為這件事害怕，"],["p","本身就說明你的心還沒有麻木。"],["p","請聽彼得在第一章怎麼說："],["q","「人若沒有這幾樣，就是眼瞎，只看見近處的，忘了他舊日的罪已經得了潔淨。」（1:9）"],["p","你的罪是被潔淨過的，千萬不要忘記。"],["p","再聽彼得在第三章怎麼說："],["q","「主所應許的尚未成就，有人以為他是耽延，其實不是耽延，乃是寬容你們，不願有一人沉淪，乃願人人都悔改。」（3:9）"],["p","主還在等。"],["p","他曾經在海邊等過彼 ["q","「親愛的弟兄啊，你們既然預先知道這事，就當防備，恐怕被惡人的錯謬誘惑，就從自己堅固的地步上墜落。」（3:17）"],["p","第一步，是防備，是看守自己"],["p","誘惑這個字的意思，是被人一同帶走"],["p","彼得太知道那是甚麼滋味了"],["p","在安提阿，他自己就在一頓飯之間退去了"],["p","所以他說：你們要看守自己，不要大意"],["p","堅固的地步，和主那一夜對他說的話同一個字根"],["q","「你回頭以後，要堅固你的弟兄。」（路22:32）"],["p","一個被主堅固過的人，用一生堅固他的弟兄"],["p","一直做到最後一封信的最後一段"],["p","但是防備，還不是全部"],["p","不墜落的方法，不是站在原地不動"],["q","「你們卻要在我們主救主耶穌基督的恩典和知識上有長進。」（3:18）"],["p","第二步，是長進，一棵樹不長，就會倒"],["p","在恩典上長，就是越來越知道自己是被白白愛的"],["p","在知識上長，就是越來越認識那一位主"],["p","那一位等你、找你、又堅固你的主"],["p","彼得前書的最後說：在這恩上站立得住"],["p","彼得後書的最後說：在恩典上有長進"],["p","站得住的人，還要長"],["p","然後是第三步，也是他一生最後一句話"],["q","「願榮耀歸給他，從今直到永遠。阿們！」（3:18）"],["p","照教會的傳統，一個快要殉道的老人"],["p","他最後一口氣，不是叮嚀，而是讚美"],["p","他沒有說記得我，他說：願榮耀歸給他"],["p","這就是讓耶穌得著一切的榮耀"],["p","這就是從暫時的觀點，改變成永恆的觀點"],["p","永恆的觀點，不是叫我們離開這個世界"],["p","而是叫我們在世界裡，活得不一樣"],["p","焦點不在新聞，不在自己，也不在別人"],["p","焦點在那一位寬容我們、等我們回家的主身上"],["p","我們今天等候主，不是坐在月台上看錶"],["p","也不是算日子、猜年份，被每一條新聞牽著走"],["p","而是在主還在寬容的這一段日子裡"],["p","悔改、聖潔、傳福音，彼此堅固"],["p","一同警醒，等候主再來"],["p","那一天甚麼時候到？我不知道，你也不知道"],["p","但是我們知道，要來的那一位是誰"],["p","所以，下一次再有人問你：應許在哪裡呢？"],["p","你可以平平靜靜地回答他"],["p","應許在他的話裡，在他還開著的門裡"],["p","也在我這一條被他等回來的命裡"],["p","讓我們一起低頭禱告"],["p","主啊，叫我們記得你做過的，不在等候裡灰心"],["p","叫我們防備，不從堅固的地步上墜落"],["p","叫我們在你的恩典和知識上，天天有長進"],["p","叫我們一生最後的一句話，也是願榮耀歸給你"],["p","奉主耶穌基督的名禱告，阿們"]]}},"issues":[{"id":"ISS00_1","t":"立場一・作者、正典與猶大書：彼得後書真是使徒彼得寫的嗎？早期教會為甚麼對它有爭議？","r":"1:1；1:14–18；3:1；3:15–16","ch":[1,2,3],"why":"一、經文問的是甚麼：這封信開頭說「作耶穌基督僕人和使徒的西門彼得」（1:1），又說「我們同他在聖山的時候，親自聽見這聲音從天上出來」（1:18）。可是在新約二十七卷裡，彼得後書是作者問題爭議最大的一卷：今天許多學者認為它是彼得死後由門生託名寫成的；早期教會也確實有人對它存疑；而第 2 章又與猶大書 4–18 節大量相似。一位弟兄讀到這些，很自然會問：如果連作者都有爭議，這封信還可信嗎？","pos":[["使徒彼得親筆或經同工協助寫成（本講義採用）","","理由來自經文本身：1:1 自稱「西門彼得」，而且用了新約只見於徒 15:14 的希伯來拼法 Συμεών；1:14「正如我們主耶穌基督所指示我的」對應約 21:18–19 主預告他的死；1:16–18 以第一人稱見證登山變像；3:1「第二封信」最自然指彼得前書；3:15 稱保羅為「我們所親愛的兄弟」。許多福音派註釋家（例如 Michael Green 等）持此看法，認為文體差異可以用代筆人與題材不同解釋。"],["託名說（門生在彼得死後以他的名義寫成）","","許多近代學者持此看法（例如 Richard Bauckham 的註釋），主要四點：①希臘文風格與彼得前書差很多；②3:4「列祖睡了」、3:16「保羅一切的信」像第二代教會的口吻；③早期教會對它有爭議；④「遺言」是當時託名作品的常見文體，讀者也明白那是託名。持此說的學者多半並不因此否認這封信的屬靈價值，只是認為作者是彼得的門生。"],["對託名說四點的回應","","①彼得前書明說「我略略地寫了這信，託我所看為忠心的兄弟西拉轉交你們」（彼前 5:12），本書沒有提代筆人，兩封信經手的人可能不同，而且一封講受苦、一封講錯謬，用字本來會不同；②「列祖」最自然指舊約的先祖（來 1:1），保羅的信在六十年代已在各教會傳閱（西 4:16）；③早期教會的爭議屬實，本講義誠實交代（見 ISS00_8），但爭議不等於否定；④文體本身不證明託名，真正臨終的人也會寫遺言。"],["與猶大書的關係：三說並陳","","2:1–3:3 與猶 4–18 約有十九處相似。①猶大書在先，彼得後書採用了它（今天多數學者）；②彼得後書在先，猶大書引用它（理由之一：彼後 2:1、3:3 用未來式「必有」，猶大書說這些人「已經」混進來）；③兩封信共用早期教會一份關於假師傅的教導材料。詳見 ISS00_6。"]],"con":[],"say":"本講義的立場：作者是使徒彼得——就是在登山變像那天說「主啊，我們在這裡真好」、後來三次不認主又被主接回來的那一位；託名說的理由與回應並陳，早期教會「有爭議的書卷」這段歷史誠實交代，不迴避；與猶大書的關係三說並陳，不裁判。講台只講一句：寫這封信的人，就是曾經想在山上搭帳棚、如今知道「我脫離這帳棚的時候快到了」（1:14）的那個人。","care":"作者問題是書房裡的功課，不是信心的地基。一位剛開始讀經的弟兄，若在網上看到「彼得後書是偽作」就慌了，牧者要先告訴他兩件事：第一，這個問題古人就問過，教會不是不知道，是想了三百年之後才確認它；第二，不論學者怎麼判斷作者，這封信所見證的主沒有改變——「並不是隨從乖巧捏造的虛言，乃是親眼見過他的威榮」（1:16）。牧者不必在講台上逐條辯論，也不要把懷疑的人當作不屬靈；陪他讀完全卷，讓他自己看見信裡那位恆久忍耐的主。信心是建立在主身上，不是建立在我們能回答每一個學術問題上。"},{"id":"ISS00_2","t":"立場二・與神的性情有分：「與神的性情有分」是甚麼意思？人會不會成為神？","r":"1:3–7","ch":[1,2,3],"why":"二、經文問的是甚麼：「因此，他已將又寶貴又極大的應許賜給我們，叫我們既脫離世上從情慾來的敗壞，就得與神的性情有分。」（1:4）原文 θείας κοινωνοὶ φύσεως——「有分於神的本性」。這是全卷神學最高、也最容易講偏的一句：一邊有人把它講成人可以修成神（某些新興宗教與部分成功神學講員），另一邊有人因為怕講錯，乾脆跳過不講。兩種做法都對不起這節經文。","pos":[["成神論（theosis，東正教）","","東正教傳統從亞他那修「神成為人，好叫我們得以成神」一路發展，到十四世紀帕拉馬（Gregory Palamas）系統化地區分神的「本質」（essence）與「能力」（energies）：人永遠不能有分於神的本質，人與神之間的分別永遠存在；人是藉著恩典有分於神的「能力」，就是神的生命、光與聖潔，越來越像神。準確地說，東正教的成神論並不是說人變成另一位神，而是說受造的人藉恩典與神相交、被神的生命充滿。本講義尊重這個傳統，不嘲諷。"],["與基督聯合（改革宗、路德宗）","","藉著聖靈與基督聯合，就有分於基督的生命；成聖是被更新成神的形像。加爾文註釋本節時指出，這裡的「性情」不是指神的本質，乃是指品質——神要使我們的品格與他相似。這個讀法把 1:4 放在「在基督裡」的框架中：我們有分的不是神性本身，而是在聯合裡得著的新生命。"],["完全的愛（衛斯理傳統）","","有分於神的聖潔與愛；衛斯理強調在今生可以被聖靈充滿到一個地步，心裡以完全的愛愛神愛人（他所說的「基督徒的完全」不是無過失，而是愛的完全）。這個讀法看重 1:5–7 那張以「愛眾人的心」作結的清單。"],["道德的相似（許多福音派註釋）","","有分於神的道德品格——聖潔、良善、愛——不是本體上的有分。理由是下文立刻說「脫離世上從情慾來的敗壞」，並接著列出德行、知識、節制等品格（1:5–7）；彼得關心的是生命的樣子，不是形而上的本體。"]],"con":[],"say":"本講義的立場：採「在基督裡與基督聯合，有分於神的生命與品格（聖潔、愛）」，四讀並陳。明說三條界線：①創造者與受造者的分別永遠存在——這節經文不是說人會成為神，也不是說人與神同等或與神的本質混同；②有分是恩典，不是修煉——「他已將……應許賜給我們」（1:4），起點是 1:3「神的神能已將一切……賜給我們」；③有分的內容就寫在下文：脫離敗壞（1:4），加上德行、知識、節制、忍耐、虔敬、愛弟兄的心、愛眾人的心（1:5–7）。321 說「無己不是沒有，乃是進入無限」，在本卷只能說成：無己的人進入與無限之神的相交，基督在他裡面活（加 2:20）；不是人變成無限。","care":"這節經文對一個自卑、覺得自己一無是處的弟兄，是極大的安慰：神不只赦免他，還要把自己的生命與品格分給他。對一個想靠屬靈經歷高人一等的人，它卻是一面鏡子：真正有分於神性情的人，看起來不是更神祕，而是更節制、更忍耐、更會愛人。講台不可因為怕被誤會就跳過 1:4，也不可把它講成人可以成神的應許。檢驗很簡單：聽完這節的人，是更想敬拜神，還是更想抬高自己？前者才是彼得的意思。"},{"id":"ISS00_3","t":"立場三・分辨假教訓：怎樣分辨假教訓？聖經可以自己讀嗎？","r":"1:20–21；2:1–19；3:16","ch":[1,2,3],"why":"三、經文問的是甚麼：「將來在你們中間也必有假師傅」（2:1）——危險不是從外面來，是從裡面來。會眾自然會問：今天誰是假師傅？我怎麼知道我的教會、我聽的講道是真的？而 1:20「經上所有的預言沒有可隨私意解說的」和 3:16「信中有些難明白的」，又常被拿來說「你們自己不要亂讀聖經」。這一條要回答兩件事：怎樣分辨，以及誰可以讀經。","pos":[["名單式分辨","","把第 2 章當作一張通緝令，替今天的人對號入座：點名某位牧者、某個宗派、某個網路傳道人是假師傅。這種做法在網路上很普遍，出發點常是熱心護教，但它把彼得給的記號變成了標籤，結果是會眾更會懷疑別人，不是更會分辨果子；本講義不採。"],["記號式分辨（本講義採用）","","彼得給的是五個記號：對基督——「連買他們的主他們也不承認」（2:1）；對金錢——「因有貪心，要用捏造的言語在你們身上取利」（2:3，參 2:14–15）；對身體——「隨肉身、縱污穢的情慾」（2:10，參 2:14、18）；對權柄——「膽大任性」（2:10）；對自由——「應許人得以自由，自己卻作敗壞的奴僕」（2:19）。五個都是果子，不是口才，也不是宗派標籤；這使我們想起主自己的話：「憑著他們的果子，就可以認出他們來。」（太 7:16，參 7:15–20）"],["1:20「私意」指讀者的解釋","","有些譯本與傳統把 1:20 讀成：個人不可以自己解釋預言，要由教會權威解釋。這個讀法的關懷是防止各說各話，但它容易被推成「平信徒不要自己讀經」。"],["1:20「私意」指預言的來源（本講義採用）","","1:21 用「因為」接上：「因為預言從來沒有出於人意的，乃是人被聖靈感動，說出神的話來。」可見 1:20 的焦點是預言從哪裡來——不是先知自己的意思，而是聖靈的感動；它講的是聖經的來源與權威，不是禁止信徒讀經。許多福音派註釋採此讀法。"]],"con":[],"say":"本講義的立場：①講台教記號，不給名單——不點名今天任何牧者、教會、宗派、網路傳道人為假師傅；②分辨從自己開始，五個記號先照自己；③1:20 的「私意」指預言的來源，不是禁止會眾讀經；讀經的保護是在群體中讀、照上下文讀、謙卑地讀（3:16「強解」的反面），像庇哩亞人「天天考查聖經，要曉得這道是與不是」（徒 17:11）；④遇到教會內真正的錯謬或侵害，照著程序、在愛中、公開透明地處理，不在網路上獵巫。對 2:3 最好的回應，是教會財務透明——像保羅說的：「我們留心行光明的事，不但在主面前，就是在人面前也是這樣。」（林後 8:21）","care":"第 2 章最難的功課，是怎樣講假師傅而自己不變成法利賽人。寫這一章的彼得，自己曾三次不承認主；他和假師傅的分別不是從沒跌倒，而是哭了、回頭了、被主接回來了。所以牧者講這一章，先低頭照自己：我對金錢、對權柄、對身體、對自由是否結出正確的果子？教會的帳目是否公開、經得起查？也不要用「假師傅」一詞壓制提出問題的會友——2:10 被定罪的正是師傅，在上位的人更要被檢驗（彼前 5:3「也不是轄制所託付你們的」）。分辨的目的是自己不墜落（3:17），也把迷路的人找回來，不是證明自己是對的。"},{"id":"ISS00_4","t":"立場四・主的日子、新天新地與受造界：主為甚麼還沒有來？地球最後會怎樣？","r":"3:3–13","ch":[1,2,3],"why":"四、經文問的是甚麼：「主要降臨的應許在哪裡呢？」（3:4）這是兩千年來每一代信徒心裡都問過的問題。彼得的回答有四步：「主看一日如千年，千年如一日」（3:8）；「不是耽延，乃是寬容」（3:9）；「主的日子要像賊來到一樣」（3:10）；「盼望新天新地，有義居在其中」（3:13）。這一段最常被拿去做兩件事：用 3:8 換算末日或創造的日子；用 3:10–12 說地球反正燒掉、不必照顧受造界。本條沿用帖撒羅尼迦前書立場二，只補本卷 3:8–13 這一筆。","pos":[["沿用帖撒羅尼迦前書立場二","","主一定會親自回來；日子沒有人知道，也不必知道（帖前 5:1–2；太 24:36）；這段教導的用途是安慰與預備，不是恐嚇。被提時間與千禧年各派並陳，每一派都承認對方是弟兄；不定時間表，不把時事對號入座。"],["3:8 當作換算公式（本講義不採）","","有人說「一日等於一千年，所以創造六日之後六千年主必再來」，這種換算不是本節的意思；也有人用 3:8 推論創造的一日就是一千年，同樣不是本節的意思。詩 90:4 講的是神超越時間；彼得兩個方向都說——「一日如千年，千年如一日」——正是為了取消換算。本講義不用 3:8 算末日，也不用它算創造日。"],["3:10 的異文：燒盡或顯露","","和合本「地和其上的物都要燒盡了」跟隨 κατακαήσεται 的讀法；SBLGNT 與多數新近校勘本作 εὑρεθήσεται（必被顯露、被發現），意思是在神面前一切都要被顯明（這使我們想起林前 3:13「各人的工程必然顯露」）；NA28 作 οὐχ εὑρεθήσεται（不被發現）。三種讀法都有學者支持，但沒有一種是在說神要丟棄他所造的世界。"],["3:13 的「新」：更新還是另造","","一派強調舊天地完全消滅，另造一個全新的；另一派指出「新」καινός 多指品質上的新，與羅 8:21「受造之物仍然指望脫離敗壞的轄制，得享神兒女自由的榮耀」相合，傾向更新而不是丟棄。本講義傾向更新的讀法，並陳另一讀。"]],"con":[],"say":"本講義的立場：沿用帖撒羅尼迦前書立場二——不算日子，隨時預備。本卷補四點：①3:8 不是公式，兩個方向都說，正是取消換算；②3:9 的焦點是寬容：主的「慢」是愛的「等」，等候的時間是悔改與傳福音的時間；③3:10 和合本「燒盡了」與「必被顯露」兩讀並陳，兩讀都不是神丟棄受造界；④3:13 的「新」是更新，落點是「有義居在其中」。3:12「切切仰望」是聖潔與傳福音的參與，不是推算或加速日期。講台不以 3:5–7 裁判年輕地球或古老地球，也不把照顧受造界變成政治動員。","care":"「應許在哪裡呢？」誰沒有在心裡問過？一位等了很久的姊妹——等家人信主、等病得醫、等主回來——最需要聽的不是一張時間表，而是 3:9：主的慢不是不在乎，是不願有一人沉淪；而寫這句話的彼得，自己就是被主寬容等回來的人。另一方面，盼望新天新地的人，今天不會隨便糟蹋神所造的世界；「你們為人該當怎樣聖潔，怎樣敬虔」（3:11）是今天的生活，包括怎樣用錢、用資源、對待鄰舍。永恆的觀點不是叫人離開世界，而是叫人在世界裡活得不一樣。果效是忍耐，不是恐慌。"},{"id":"ISS00_5","t":"立場五・得救的確據與背道：得救有確據嗎？背道的人還能回來嗎？","r":"1:9–11；2:20–22；3:9、17","ch":[1,2,3],"why":"五、經文問的是甚麼：1:10 說「應當更加殷勤，使你們所蒙的恩召和揀選堅定不移。你們若行這幾樣，就永不失腳」；2:20–22 卻說有人「後來又在其中被纏住、制伏，他們末後的景況就比先前更不好了」，還用「狗所吐的，牠轉過來又吃」作比喻。一位跌倒的弟兄讀到這裡，會問：我是不是就是那條狗？揀選要靠我自己堅定嗎？本條沿用希伯來書立場二，只補本卷 1:10 與 2:20–22 這一筆。","pos":[["沿用希伯來書立場二","","不替各教會在「救恩會不會失落」上定案，兩邊都有敬虔愛主的人；但各派都必須同意三個落點：警告是真的，不可講成無關痛癢；警告的對象是故意、持續地棄絕基督的人，不是軟弱跌倒又想回來的人；作者自己的結論是確據與安慰（來 6:9「卻深信你們的行為強過這些，而且近乎得救」）。"],["1:10「堅定不移」：確據從哪裡來","","「堅定不移」βεβαίαν 是商業與法律用語，指確認、生效。一派讀為：殷勤的生活使蒙召在我們自己的經歷裡得到確認（主觀的確據）；另一派讀為：殷勤的生活在人面前證明蒙召是真的。兩派都同意：揀選的源頭是神，不是我們的殷勤；「永不失腳」是應許，不是恐嚇。"],["2:20–22 三讀","","①真信徒可以失落救恩（阿米念傳統），理由是「因認識主救主耶穌基督，得以脫離世上的污穢」看起來是真實的經歷；②這些人從未真正重生（加爾文傳統），理由是 2:22 的比喻正是說本性沒有改變——狗洗乾淨了還是狗、豬洗淨了還是豬；③警告本身是神保守信徒的工具（許多福音派），神藉著真實的警告使屬他的人不至墜落（3:17）。"],["上下文的讀法（本講義的落點）","","不論採哪一讀，2:20 的「他們」在文法上接續 2:17–19 的「這些人」——無水的井、說虛妄矜誇大話、應許人自由自己卻作奴僕的假師傅；被他們引誘的，是「那些剛才脫離
